# Cargo workspace root for the quanta native crates.
#
# Currently only `linux-sandbox-native` (ADR-0175 / ADR-0176) lives here, but
# the workspace exists so future native bindings (e.g. a darwin-Seatbelt
# helper, a Windows AppContainer helper) drop in without restructuring.
#
# Resolver v2 is the default for edition 2021 packages but explicit here so
# cross-platform target dependencies (`cfg(target_os = "linux")`) resolve per
# target rather than unioned.
[workspace]
members = ["linux-sandbox-native"]
resolver = "2"
