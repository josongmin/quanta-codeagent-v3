purpose: |
  Instead of hard-rejecting images over MAX_IMAGE_BYTES (5 MB), downsample them so
  large screenshots stay usable (Codex parity). Decision is split from execution:
  pure planImageRead (ok/downsample/reject) + scaleToMaxDim (aspect-preserving, no
  upscale, ≥1px, finite-guarded); the decode→resize→encode rides a host-injected
  ImageDownsamplePort (WASM/native codec — quanta vendors none). read_image becomes
  makeReadImageTool(port?): over-cap + port ⇒ downsample (longest edge →
  DOWNSAMPLE_MAX_DIM); over-cap + no port ⇒ reject exactly as before (byte-identical
  default-OFF). The over-cap decision moves from stat-time to actual bytes; a port
  "unable" result falls back to the rejection (no throw).
