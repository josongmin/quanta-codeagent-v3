id: grep-rg-flags
title: grep ripgrep flag surface (context / output_mode / -i / multiline / type)
section: 2
subsystem: '`grep` 도구 ripgrep flag surface'
order: 1
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: [absorbed:claude, surface:cli, security-touched]
depends_on: [read-write-edit, fsjailerror, tool-output-schema-factory]
surface_integration:
  cli: full
  web: full
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 1/1 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "grep tool invocation + args + result render via tool.invoked/tool.completed; bridged at context-binding.ts tool arms"
purpose: |
  grep 도구에 ripgrep flag surface 추가 — context lines (-A/-B/-C),
  output_mode (content | files_with_matches=-l | count=-c), case-insensitive (-i),
  multiline (-U --multiline-dotall), file type (--type). 정수 인자는 Number.isInteger +
  [0, CONTEXT_MAX=10000] bound (DoS 차단) + UNQUOTED, 문자열 인자(type)는 sq()로 단일
  토큰화 (argv injection 차단). 신규 필드 부재 시 argv는 today와 byte-identical (default-OFF).
evidence:
  code:
    - src/tool/grep/index.ts
  adrs: []
  tests:
    unit: [tests/unit/grep.test.ts]
    integration: []
    contract: [tests/unit/tool/grep-flags-hellgate.test.ts]
knobs: []
deliberate_hold: null
notes: |
  순수 buildGrepArgv 분리(injection/DoS boundary 전수 테스트). count/files_with_matches는
  rg에서 context flag와 상호배타 → content mode에서만 -A/-B/-C 방출(documented precedence).
  jail(resolveJailed) + 200-line cap 유지.
