purpose: |
  The write that closes the review loop. GitHub exposes thread resolution ONLY
  via GraphQL (resolveReviewThread(input:{threadId})) — no `gh pr` subcommand —
  so this is the FIRST gh tool routing through `gh api graphql`. Three modes by
  input: LIST (no threadId/all → unresolved-threads query, returns id + path +
  filters resolved), RESOLVE-ONE (threadId → mutation), RESOLVE-ALL (all:true →
  list then resolve each, re-listed after a potential rebase). Concurrent-push
  race: when {rebaseOnDivergence:true} and the local branch has diverged from
  origin/<headRef> (a teammate/CI bot pushed first), a BOUNDED (≤1) fetch+rebase
  runs BEFORE resolving — on conflict it `rebase --abort`s and FAILS CLOSED (no
  resolve), and a SECOND divergence after the single rebase ALSO fails closed
  (no unbounded fetch/rebase loop — the prior-audit unbounded-retry trap). With
  {rebaseOnDivergence:false} (default) divergence → ok:false {head_moved} and NO
  git mutation runs (the agent rebases explicitly). SECURITY: normalizeRef guards
  the PR ref; threadId is validated as an opaque node id ([A-Za-z0-9_=-], no
  leading '-') BEFORE argv; EVERY GraphQL value rides a NAMED -F/-f variable
  (owner/repo/pr/threadId) — never interpolated into the query body (the
  query/mutation are module constants), so a malicious threadId cannot break out
  of the variable. isReadOnly:false (the whole tool is mutating even though LIST
  is read-shaped — no "read tool that sometimes writes" hole); the mode's gitWrite
  lever is the structural gate. Closed-port DI: injected GhRunner (scrubEnv fence)
  + GitRunner (fetch/rebase boundary) — both fakeable, no network/repo in tests.
