purpose: |
  Closed-port contract for a separate git ObjectDB rooted at
  `<baseDir>/snapshots/<workspaceHash>/.git` — point-in-time worktree snapshots
  that NEVER touch the user's own `.git`. The pivot is `GIT_DIR` +
  `GIT_WORK_TREE` env override: one `git` invocation re-points at the shadow
  store while still reading the user's working tree. `defaultShadowOdb` is the
  factory; the surface exports the port type, `ShadowOdbError` (with codes
  `uninitialized:` / `merge-in-progress:` / `rewind-failed:`), well-known ref
  constants (`SHADOW_LAST_REF`, `SHADOW_LAST_VERIFIED_REF`,
  `SHADOW_PRE_REWIND_REF_PREFIX`), and `DEFAULT_SHADOW_ODB_MAX_BYTES`. `evictLru`
  sums per-workspace shadow-dir sizes and removes oldest-mtime entries until
  total ≤ `maxBytes` — best-effort by design (per-dir failures swallowed). Hard
  safety invariant: cleanup ONLY ever reads/removes inside `<base>/snapshots/*`;
  the user's `.quanta/auth/` (and anything above the snapshots root) is
  untouched. The port underpins `shadow-tools-trio` (model-facing surface) and
  `slash-snapshot` (operator CLI).
