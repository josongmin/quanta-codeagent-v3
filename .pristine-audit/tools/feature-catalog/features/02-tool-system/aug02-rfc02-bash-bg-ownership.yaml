id: aug02-rfc02-bash-bg-ownership
title: RFC02 — background-shell ownership contract + owner-scoped kill + executor evidence
section: 2
subsystem: Background bash observability (aug-02 RFC02 B0/B2/B4)
order: 553
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: partial
modes: [interactive, headless]
configurable: static
owners: ["@songmin"]
labels: ["rfc:aug02-02", "surface:cli"]
purpose: |
  RFC-02 background-shell ownership substrate: (B0) BashBgRegistry records an
  ownership contract (owner session/tool id) per detached shell; (B2)
  `bash_kill` is owner-SCOPED — the model-facing tool can only kill shells its
  own session owns (no unscoped kill surface exposed to the model); (B4) each
  bash execution carries executor-known evidence (which executor ran it) in the
  tool result. Additive: registry gains the ownership field, kill gains a scope
  check, tool result gains an evidence field — no behavior change for
  foreground/owned shells.
evidence:
  code:
    - src/runtime/bash-bg-registry.ts
    - src/tool/bash/kill.ts
    - src/tool/bash/index.ts
    - src/tool/types/tool-result.ts
  adrs: ["docs/plans/aug-02-absorption/rfc-02-observability.md"]
  tests:
    unit:
      - tests/unit/runtime/bash-bg-registry-ownership-hellgate.test.ts
      - tests/unit/tool/bash-kill-ownership-hellgate.test.ts
      - tests/unit/tool/bash-evidence-executor-known-hellgate.test.ts
