purpose: |
  Read-only content search built on ripgrep. Model-supplied `path` is
  jail-validated via `@/storage.resolveJailed` BEFORE argv assembly (an
  unguarded `path: "/etc"` would otherwise escape the workspace through the
  ripgrep subprocess). Output is capped at MAX_LINES=200 with a tail count of
  overflow matches; description self-documents ADR-0062 "NARROW or restrict
  `path` before switching tool" so the loop self-corrects on cap-hit instead of
  switching to a worse alternative. `isReadOnly: true` + `isConcurrencySafe:
  true` — pure read, safe to parallelize. Optional `glob` arg becomes
  `-g <pattern>`. Exit 1 with empty stdout maps to `ok:true` "(no matches)";
  exit >1 surfaces stderr.
