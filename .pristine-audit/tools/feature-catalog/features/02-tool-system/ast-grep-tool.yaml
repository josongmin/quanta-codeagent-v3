purpose: 'Structural code search using ast-grep patterns — finds code by AST shape, not text, so no false positives from comments/strings (pattern console.log($A) matches all calls regardless of whitespace/args). Wraps the ast-grep CLI binary (probed once per session, success-only cached so install-then-use works without restart). Read-only + concurrency-safe. Hardening: fs-jail validation of the path arg (blocks /etc/passwd escape via the subprocess), 2 MB stdout slice before JSON.parse (OOM guard), 30s timeout, 50-match cap, internal-newline flattening (one output line per match). Default-OFF: gate unset => astGrepTools is [] => tool unregistered => byte-identical.'
