purpose: |
  Single slice that wraps the `gh` binary as 6 typed tools — `gh_pr_view`,
  `gh_issue_view`, `gh_pr_comment`, `gh_pr_create`, `gh_check_status`,
  `gh_pr_list`. Per-mode wiring decides whether to register them (ci-bot
  does; interactive does only if the operator opts in). Design: the slice
  talks ONLY through the `Tool` contract — no globals; the spawn boundary
  is injectable for tests via the `GhRunner` port; `gh` argv is built as a
  string[] (no shell ⇒ no shell-injection); errors return `ok:false` with
  a clean message and never throw past the loop (boundary discipline, not
  a fallback for missing data). Env is scrubbed via `scrubEnv` from
  `@/runtime` so credentials cannot leak into the child.
