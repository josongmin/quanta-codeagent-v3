id: gh-pr-code-tour
title: "gh_pr_code_tour — guided PR-diff walkthrough (ordered tour stops)"
section: 2
subsystem: 도구 — gh PR review surface (§5.4 long-tail, Cursor/Codex review-stops parity)
order: 513
maturity: L3
status: new
ui_surfaces: [cli]
modes: [ci-bot]
monitoring: n-a
configurable: integrated
owners: ["@songmin"]
labels: ["absorbed:cursor", "absorbed:codex", "surface:cli", "default-off"]
depends_on: [gh-pr-blame, gh-pr-typed-ops, gh-arg-injection-guard]
surface_integration:
  cli: partial
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "reachable ONLY in ci-bot mode — buildCiBotWiring (apps/agent/mode-presets/ci-bot.ts:216) flips ghTools opts.codeTour on gateOn(env,'QUANTA_GH_CODE_TOUR'); read-only ⇒ survives the ci-bot read-only filter. The interactive CLI loop builds gh tools WITHOUT codeTour, so it is absent from the default interactive surface (gate default-OFF)."
    web: "no web bridge — this gh slice only registers inside the ci-bot mode preset; no web-daemon consumer flips opts.codeTour."
purpose: |
  The STRUCTURED itinerary OVER a PR's raw diff. gh_pr_review_diff already
  returns the raw unified diff; THIS tool parses that diff into an ORDERED
  guided walkthrough ("tour stops") — one numbered stop per hunk — so the
  agent gets a deterministic itinerary instead of re-parsing a wall of `@@`
  headers (Cursor StreamCodeTour / Codex review-stops parity). Mechanism:
  fetch `gh pr diff <ref>` through the SAME spawn boundary + ref-injection
  guard (normalizeRef rejects leading-`-`) as every other gh tool; parseDiffToTour
  (exported pure fn) walks the unified diff line-by-line into TourStops, each
  carrying the file (new side from `+++ b/<path>`, falling back to the old side
  for a pure deletion where `+++` is /dev/null), the new-side line range read
  VERBATIM from the `@@ -a,b +c,d @@` header (`c..c+d-1` — no tuned heuristic /
  threshold), the enclosing-symbol context after the second `@@`, and per-stop
  added/removed counts; emit a numbered itinerary capped at maxStops
  (default 40, hard max 200 — bounded output so a hundreds-of-hunks PR never
  blows the prompt budget). READ-ONLY (isReadOnly/isConcurrencySafe true,
  hitlTier none). NO-THROW: a malformed ref, a `gh` failure, or an unparseable
  diff all collapse to a graceful ok:false; parseDiffToTour skips unrecognized
  lines (empty/noise input ⇒ []). DEFAULT-OFF: registered only when ghTools is
  built with opts.codeTour — the ci-bot composition root flips it on
  QUANTA_GH_CODE_TOUR; absent/false ⇒ tool absent, byte-identical legacy gh set.
evidence:
  code:
    - src/tool/gh/pr-code-tour.ts
  adrs: [513]
  tests:
    unit:
      - tests/unit/gh-pr-code-tour.test.ts
    integration:
      - tests/integration/longtail-new-tools-e2e.test.ts
    contract: []
knobs:
  - name: QUANTA_GH_CODE_TOUR
    where: "apps/cli/cli-knobs.ts:577 (declared) → ci-bot.ts buildCiBotWiring (ghTools opts.codeTour); manifest.ts:790 GATED env-flag"
    default: false
    purpose: "§5.4 long-tail opt-in: register gh_pr_code_tour (guided PR-diff walkthrough). Default-OFF ⇒ byte-identical legacy gh tool set."
deliberate_hold:
  reason: "Live consumer is the ci-bot mode preset ONLY (buildCiBotWiring), and even there it is gated default-OFF on QUANTA_GH_CODE_TOUR. The interactive CLI loop builds gh tools WITHOUT opts.codeTour, so the tool is absent from the default interactive surface; there is no web bridge."
  promotion_path: "Add the same gateOn(env,'QUANTA_GH_CODE_TOUR') ⇒ {codeTour:true} flip at the interactive gh-tool build site so the guided tour is reachable from the interactive CLI surface, not just the ci-bot mode preset."
notes: |
  Sibling to ADR-0103 gh_pr_blame / ADR-0104 gh PR typed tools in the same gh
  slice (src/tool/gh/). The unified-diff parser parseDiffToTour is an exported
  pure fn — unit-tested without a real PR (multi-hunk, single-line hunk,
  pure-deletion /dev/null fallback, empty+noise input). Tool-wrapper hellgate
  covers argv exactness, maxStops cap, ref rejection (`--web`), gh-failure
  envelope, read-only classification, and DEFAULT-OFF byte-identity (ghTools()
  with no opts omits the tool; ghTools(runner,{codeTour:true}) appends it). The
  integration test drives the REAL ghTools(opts.codeTour) factory + registry
  dispatch (gate ON/OFF + ci-bot read-only-filter survival).
