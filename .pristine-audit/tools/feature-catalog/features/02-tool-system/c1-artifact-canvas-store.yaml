    web: "the four artifact tools render as tool.invoked/completed cards; PLUS the A2 event-driven preview channel — src/host/runtime/artifact-drain.ts is the PRODUCER for the session `artifact.ready` event (per drained registry ref), which src/apps/web-daemon/server/canvas-artifact-bridge.ts pumps into a Canvas `artifact.ready` frame on the same WS, and GET /artifact/:id serves jailed preview bytes via artifactPreviewResolver (all gated on QUANTA_ARTIFACT_STORE)"
purpose: |
  Cursor `agent.v1.Canvas{Register, GetUrl, Destroy}` 흡수 — 생성축(H14 image_gen /
  xlsx_write / docx_write / pptx_write)이 만든 NON-code 바이너리를 transcript와 분리해
  등록·조회·파기 + 안정 미리보기 URL. "만든 파일을 어디 두고 어떻게 참조하나"의 답.

  코어 (`src/artifact/registry.ts`, PURE leaf, @/shared만, 주입 clock+idFactory —
  Date.now/Math.random 없음):
    - `Artifact{id,kind,path,mediaType,label?,createdAt}`, closed `ArtifactKind`
      (image|spreadsheet|document|presentation|other).
    - `createArtifactRegistry({now,idFactory,maxEntries?})` → register/get/list/destroy
      (in-memory, list는 createdAt→id byteCompare 정렬 immutable 스냅샷).
    - UNBOUNDED-GROWTH guard: `maxEntries`(기본 `DEFAULT_ARTIFACT_REGISTRY_MAX`=1000)
      cap, 초과 시 oldest-inserted FIFO 축출. evicted id는 get/list에서 clean
      not-found(throw 없음), destroy는 슬롯 즉시 해제. 비유한/<1 cap은 1로 clamp(또는
      non-finite→default). 생성축 best-effort register가 긴 세션서 무한 누적 못 함.
    - 도구 렌더(`src/tool/artifact`)는 path/label/mediaType 필드를 256자로 clamp
      (`…(len)` 마커) — 적대적 oversized 필드의 transcript 토큰폭발 방지.
    - `previewUrl(a)` = `quanta-artifact://<id>` (안정 opaque 참조 — 파일 이동해도
      유효, fs 절대경로 transcript 누출 방지).

  도구 (`src/tool/artifact/`, duck-typed port로 @/tool fence clean):
  `artifact_register`(생성물 등록→id+url) / `artifact_list` / `artifact_get` /
  `artifact_destroy`. `DefaultToolPorts.artifactRegistry`로 caller-wired,
  `QUANTA_ARTIFACT_STORE` default-OFF(없으면 미등록=byte-identical). 호스트가 세션당
  registry 1개 mint(`agent-arg-builder buildBaseRegistry`).

  AUTO-REGISTER 루프 (jun-06 LANDED): 생성축(image_gen / xlsx_write / docx_write /
  pptx_write)이 성공적 write 직후 `register({kind,path,mediaType})`를 BEST-EFFORT 호출
  → 모델이 명시 `artifact_register` 없이도 `artifact_list`/`artifact_get`로 생성물 조회.
  port가 없으면(default-OFF) register 미호출 + 출력 byte-identical(sacred). register가
  throw해도 primary write는 ok:true(side-channel). 성공 시에만 artifact id를 출력에 추가.
  registry는 `buildDefaultTools`가 생성도구 팩토리에 `ports.artifactRegistry`를 함께
  주입(image_gen+office 둘 다 wired일 때만 등록 발생).
