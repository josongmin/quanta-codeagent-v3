notes: |
  Default-OFF: nothing wires this today. Surfaces opt in by constructing
  createDefaultRecorder() + one transcriber adapter + injecting both into
  runVoiceCmd's ctx. The ADR-0202 leaf one-shot port (src/media/voice/**)
  and this handle-based sibling (src/voice/**) coexist on purpose. Slice
  obeys the new biome slice-isolation rule (test in tests/unit/cli/** is
  on the CLI allowlist). External SDK installs (`@deepgram/sdk`,
  official `openai` SDK for audio) are deferred per verify-workflow
  install-block; direct REST is the path. Swap to SDK is one-line
  adapter-body change documented in each adapter header. `@/voice`
  path alias added to tsconfig.
