purpose: |
  S3 voice slice — 4-vendor convergence absorption (Claude `/voice` Deepgram,
  Aider `/voice` Whisper, Windsurf voice input, Codex realtime WebRTC).
  Adds the handle-based AudioRecorderPort (start → handle, stop(handle) → Buffer,
  availability) that the interactive `/voice` slash needs — sibling to ADR-0202's
  one-shot captureOnce port which is correct for non-interactive callers but
  cannot express "record until user presses Enter". Adds TranscriberPort with
  segments + language + AbortSignal + per-request timeout, plus 3 adapters:
  openai-whisper-transcriber (verbose_json), deepgram-transcriber (nova-3 +
  utterances + words fallback), local-whisper-transcriber (whisper.cpp binary).
  CLI `/voice` slash records, transcribes, and enqueues the transcript as a
  plan-queue voice_transcript follow-up (confirm-always — never auto-submits).
  Recorder backends cascade [sox, arecord, parec]; mac-mic-recorder pins to
  sox only. All adapters return Result<…> — no thrown errors.
