purpose: |
  A reflect tool so a stuck agent steps back and re-plans mid-turn. Input REQUIRES
  both `situation` and `next_steps` (the DIFFERENT plan) — next_steps is the forcing
  function; omitting it ⇒ ok:false before the port. Both length-capped (8000). A
  per-session call quota bounds cost and is consumed ONLY on a successful port return
  (a throwing port does not drain it). Pure interaction (isReadOnly, hitlTier:none).
  Default-OFF: registered ONLY when the composition root injects a ReflectPort
  (absent ⇒ tool absent, byte-identical). LLM-backed port wiring is the follow-up.
