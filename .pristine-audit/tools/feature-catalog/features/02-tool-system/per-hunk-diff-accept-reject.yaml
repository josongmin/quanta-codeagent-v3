    web: "deferred — the web canvas diff emitter does not yet push a hunk-selection UI; the surface-agnostic executor @/runner/hunk-apply is ready to share (ticket step 4 follow-up)"
purpose: 'T05 — per-hunk accept/reject of a model-proposed mutation. quanta previously approved/denied the WHOLE tool call only. The CLI inline-confirm gains a `[h]` verb: renderHunkChoices numbers the diff hunks, parseHunkSelection turns "1,3"/"2-4"/"all"/"none" into accepted ids (never throws; ranges clamped), and @/runner/hunk-apply#applyHunkSelection applies the subset — a surface-agnostic executor shared by all write paths (partial apply is a property of the (before,after) DIFF, not the tool). Apply is STALENESS-guarded (RESTING tree re-read vs baseline `before`; any drift ⇒ zero write, status stale) and ATOMIC + MODE-PRESERVING (writeFileAtomic keeps mode bits). shapePartialDecision maps to deny_and_steer: the whole-call tool is DENIED (cannot over-apply) and the steer reports ground truth (accepted/rejected ids, stale/error) so the model''s file view stays correct. Default-OFF behind QUANTA_HUNK_APPROVAL ⇒ byte-identical legacy whole-call approve/deny.'
evidence:
  code:
    - src/apps/cli/repl/hunk-select.ts
    - src/runner/hunk-apply.ts
  adrs: []
  tests:
    unit:
      - tests/unit/cli/hunk-select.test.ts
      - tests/unit/runner/hunk-apply.test.ts
    integration: []
    contract: []
knobs: [QUANTA_HUNK_APPROVAL]
deliberate_hold:
  reason: 'web canvas per-hunk selection UI (ticket step 4) deferred; the executor (@/runner/hunk-apply applyHunkSelection) is surface-agnostic and ready to share.'
  promotion_path: 'push hunk list + selection to the web canvas diff emitter; reuse applyHunkSelection unchanged.'
notes: 'Pure transforms (render/parse/shape) unit-tested in isolation; only I/O lives in hunk-apply (atomic + mode-preserving + staleness-guarded). Hunk math = @/runner/diff-ops splitHunks/applySelectedHunks (same line-LCS the diff slice owns). e2e: tests/e2e-pty/cli-hunk-approval-e2e.test.ts (3-hunk proposal, accept 1 → fresh-readback only that hunk landed).'
