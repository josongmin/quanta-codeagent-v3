id: aug02-rfc09-review-finding-fields
title: RFC09-2 — consumed review-finding fields (verdict / category / shortSummary)
section: 2
subsystem: Review tool — structured finding fields (aug-02 RFC09-2)
order: 568
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: static
owners: ["@songmin"]
