purpose: |
  RFC-09-2 residual-gap: the git-review-diff tool result now carries + CONSUMES
  structured review-finding fields (verdict, category, shortSummary) instead of
  free-text only, so a downstream consumer can group/route findings. Always-on
  additive fields on the existing review tool output (no gate) — the base
  review-diff feature is unchanged; this entry attributes the new consumed
  fields.
