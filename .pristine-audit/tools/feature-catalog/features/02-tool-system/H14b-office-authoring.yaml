purpose: |
  Opens a NEW tool category alongside H14a image_gen: GENERATING real binary
  Office files. Until now `src/tool/document/` was `*-read.ts` only (csv/yaml/
  ndjson/pdf/xlsx read; the xlsx reader is itself a stub) — there was ZERO
  binary-document authoring. `xlsx_write` builds a valid Excel workbook from
  sheet rows/cells + sheet names; `docx_write` builds a valid Word document from
  paragraphs (headings + body paragraphs of formatted runs).

  HARD CONSTRAINT — NO dependencies (installs blocked, no exceljs/docx/xlsx/
  jszip). The whole stack is pure-TS: `.xlsx`/`.docx`/`.pptx` are ZIP containers
  of OOXML (XML) parts, so we built a STORED (uncompressed, method 0) ZIP writer
  by hand — local file headers + raw bytes + central directory + end-of-central-
  directory, with the standard table-driven CRC-32 (polynomial 0xEDB88320). No
  compression library needed; STORED is dependency-free AND byte-deterministic
  (no zlib-version drift), which the hellgate's byte-level + CRC re-derivation
  assertions rely on. On top sit the minimal-but-VALID OOXML parts per format
  (xlsx: [Content_Types].xml, _rels/.rels, xl/workbook.xml, xl/_rels/
  workbook.xml.rels, xl/worksheets/sheetN.xml, xl/sharedStrings.xml; docx:
  [Content_Types].xml, _rels/.rels, word/document.xml, word/_rels/
  document.xml.rels). Every user string is XML-escaped (the five predefined
  entities + XML-1.0-illegal-control stripping) — no injection.

  Posture mirrors image_gen: mutating (isReadOnly()=false); no-throw (every
  failure → typed ok:false ToolResult); writes through the SAME FS-jail
  chokepoint (resolveJailed) the readers use, to a VERSIONED-sibling path
  (report.xlsx → report-v2.xlsx; never a silent overwrite). Self-contained — no
  port to inject; serializers are pure `buildXlsx(spec)=>Uint8Array` /
  `buildDocx(spec)=>Uint8Array`. Default-OFF: registered only when
  DefaultToolPorts.officeAuthoring is true (composition root passes it when
  QUANTA_OFFICE_AUTHORING is on), so the default tool menu is byte-identical.
