notes: |
  AUTO-REGISTER (jun-06, C1 loop): each authoring tool now has a
  `make{Xlsx,Docx,Pptx}WriteTool({ artifactRegistry })` factory (the const
  `*_write` exports === the no-arg factory, byte-identical). After a successful
  write, it best-effort `register()`s the file with the OOXML package media type
  (spreadsheetml.sheet / wordprocessingml.document / presentationml.presentation)
  and kind (spreadsheet / document / presentation), appending the minted artifact
  id to the output. `buildDefaultTools` injects `ports.artifactRegistry` only when
  it is ALSO wired; absent ⇒ no register + byte-identical output; throw ⇒ write
  unaffected (side-channel). Shared helper: `authoring/artifact-register.ts`.

  DONE (jun-05): the composition root (`agent-arg-builder.ts`
  `buildGatedToolPorts`) now wires `DefaultToolPorts.officeAuthoring=true` from
  `runtimeConfig().officeAuthoring`, so xlsx/docx/pptx_write register on the knob.
  Knob-on registration + knob-off byte-identity + a real .xlsx write through
  dispatch pinned by the composition-root r3 hellgate.
  Default-OFF / opt-in on EVERY surface in the tool-surface SSOT manifest (it
  writes files, so it never auto-seeds — CLI tool-menu reproducibility). The
  scoped PPTX follow-up is now LANDED as a sibling entry (pptx-authoring): the
  STORED-ZIP + OOXML core here (zip-store.ts + ooxml.ts) is the shared substrate
  the PresentationML serializer reuses. Also deferred:
  cell formatting / styles part (number formats, fonts, column widths), native
  charts, and docx tables/images — the current serializers are content-complete
  (the file opens and round-trips cell/paragraph DATA) but visually plain.
