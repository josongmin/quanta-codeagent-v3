  실패 시 temp on disk(replay용). lsp/adapters/file-write-atomic.ts와
  격리 — slice fence(storage → lsp 금지) 위반 회피, 알고리즘만 미러.
  FileSystemPort에 optional writeFileAtomic. edit 도구 입력에 optional
  `expected_hash`(sha256 64-hex) — 주어지면 현재 파일 hash와 비교, 불일치
  ⇒ stale_precondition typed ToolFailure(파일 미변경, no-throw). 미입력 ⇒
  byte-identical(과정만 atomic으로 강화).
