notes: |
  `config_refs.env` lists a representative subset (QUANTA_LOG_LEVEL,
  QUANTA_BG_COMPACTION) of the knobs governed by this control plane — NOT
  the full registry; the unified catalog enumerates the complete set at
  runtime. Web parity is tracked by `knobs-settings-web-ui` (the KnobsPanel
  reads the same catalog via `/api/knobs`). Redaction is enforced once at
  the catalog projection (`displaySafeValue`) so both surfaces inherit it.
