purpose: |
  `/knobs` live-control — the operator surface for the unified knob control
  plane (P3/P4). Four pillars:

    1. UNIFIED CATALOG — `src/config/knob-catalog.ts` projects the knob
       registries into one inspectable catalog (envKey / kind / default /
       describe / home / hotToggleable / value / source), the SSOT both the
       CLI `/knobs` family and the web `/api/knobs` payload read from.
    2. SESSION-AWARE runtimeConfig — `src/shared/runtime-config.ts` resolves
       a knob's effective value per session, layering session overrides over
       env/default so a `/knobs set` lands without mutating process env.
    3. LIVE OVERRIDE — `/knobs set <id>=<val>` writes a session-level
       override (`src/shared/knob-overrides.ts`); re-resolved on next read.
       `reset` / `preset` / `save` round out the family (save persists
       sessionOverrides → `~/.quanta/knobs.json`).
    4. REDACTION — `displaySafeValue` (knob-catalog) masks secret-shaped
       knob values everywhere a value is rendered (CLI box + web payload),
       so an operator view never leaks a token.

  Subcommands: `/knobs show` (default), `list`, `set <id>=<val>`,
  `reset <id>`, `preset <name>`, `save`, `help [id]`. The CLI accessor
  (`src/apps/cli/cli-knobs-accessor.ts`) captures the live registry +
  sessionOverrides bag by closure (no `ctx.knobs` widening).
