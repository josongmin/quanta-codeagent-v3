id: tool-output-schema-factory
title: defineTool — output-schema + toModelOutput + deferred + streaming-input
section: 2
subsystem: 도구 팩토리 (v0.dev 흡수, ADR-0060)
order: 60
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: integrated
telemetry_keys: ["gen_ai.response.time_to_first_token_ms", "quanta.conversation.id"]
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: n-a
owners: ["@songmin"]
labels: [absorbed:v0, surface:cli]
depends_on: [assert-never-exhaustiveness, byte-stable-string-comparator, errors-helper-fix, runtime-config-ssot, secret-redaction-content-plane]
config_refs:
  env: ["QUANTA_CAP_ENFORCE"]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 8/9 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure internal tool-factory plumbing (outputSchema/toModelOutput/deferred/streaming-input callbacks); no user-visible affordance on any surface"
wiring:
  # Genuinely WIRED (contrast the sibling deferred-tool-registry seam-only):
  # producer = the `defineTool` factory that DECLARES the streaming/output-schema
  # capability; consumer = `streamConsume`, which wires `onToolInput:
  # buildToolInputSeam(config.registry)` into the live streaming turn. Both ends
  # resolve to real exported symbols, so wireStatus=wired is honest.
  wireStatus: wired
  activation:
    - kind: config
      key: capEnforce
      value: true
    - kind: env
      key: QUANTA_CAP_ENFORCE
  producer:
    - module: src/tool/factory.ts
      exportedSymbol: defineTool
      role: "builds a Tool with optional outputSchema/toModelOutput/deferred/streaming-input capabilities"
  consumer:
    - module: src/agent/loop/stream-consume.ts
      exportedSymbol: streamConsume
      role: "wires onToolInput: buildToolInputSeam(config.registry) into the live streaming turn"
  contracts:
    cli:
      status: full
      producer:
        module: src/tool/factory.ts
        exportedSymbol: defineTool
        role: "builds the tool with the capability"
      consumer:
        module: src/agent/loop/stream-consume.ts
        exportedSymbol: streamConsume
        role: "invokes the streaming-input seam per tool call"
    web:
      status: na
purpose: |
  v0.dev createProviderToolFactoryWithOutputSchema 흡수 — Tool에 4개 OPTIONAL 능력
  추가: outputSchema(결과 Zod 검증, 불일치 시 ok:false retry-지시), toModelOutput(모델용
  compact 표현 분리로 토큰 절약), supportsDeferredResults(장기 도구 deferred handle +
  registry), onInputStart/Delta/Available(tool input 스트리밍 콜백). 전부 default-OFF —
  미사용 도구는 byte-identical.
evidence:
  code:
    - src/tool/factory.ts
    - src/tool/deferred/index.ts
    - src/tool/types.ts
    - src/tool/registry.ts
    - src/agent/tool-input-streaming.ts
    - src/agent/streaming-dispatch.ts
    - src/agent/loop.ts
    - src/observability/vocabulary.ts
    - src/shared/runtime-config.ts
  adrs: [60]
  tests:
    unit:
      - tests/unit/tool-factory.test.ts
      - tests/unit/tool-factory-l3-wire.test.ts
      - tests/unit/tool-output-schema-hellgate.test.ts
      - tests/unit/streaming-dispatch-hellgate.test.ts
      - tests/unit/streaming-dispatch-refusal-shortcircuit.test.ts
      - tests/unit/streaming-dispatch.test.ts
    integration: [tests/integration/streaming-dispatch-in-progress-e2e.test.ts, tests/integration/streaming-dispatch-rejection-e2e.test.ts]
    contract: []
knobs: []
deliberate_hold: null
notes: |
  L4 완료 (2026-05-23): streaming-input 시seam이 loop.ts:434에서 `onToolInput:
  buildToolInputSeam(config.registry)`로 streamingTurn에 배선됨. registry.run()이
  enforceOutputSchema → toModelOutput 순으로 결과를 후처리(둘 다 default-OFF
  fast-path). hellgate가 malformed JSON delta / multi-field reject / nested
  path / cross-id interleave / re-start / deferred-result interaction / E2E
  까지 커버. ToolEvent union은 progress|result 2-variant 유지(deferred는
  ToolResult.deferred 필드).
