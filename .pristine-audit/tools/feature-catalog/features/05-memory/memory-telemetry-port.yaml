knobs: []
deliberate_hold: null
notes: |
  Anti-leak invariant is the load-bearing property: tests assert via
  `Object.keys()` that every event handed to the port lies within the
  allow-list AND that the forbidden-key set (`content`, `score`,
  `entries`, `text`, `body`, `patterns`, `redacted`) has zero overlap
  with the allow-lists. Sister fence to `memory-distill-redaction-fence`
  on the input plane: input redaction prevents secrets reaching the LLM,
  this port prevents content escaping back through the telemetry channel.
  Production binding lives in @/observability/memory-telemetry — see
  the `memory-telemetry-adapter` catalog entry.
