purpose: |
  `createTokenRotator({tokenStore, clockPort})` — per-connector token rotation
  layer. `rotate(connectorId, refresh)` runs the caller-supplied refresh
  callback under an in-flight mutex keyed by `connectorId`: concurrent rotate
  calls for the SAME id coalesce to ONE callback invocation (mirrors
  `src/auth/chatgpt-oauth/refresh.ts` invariant added 2026-05-23). Different
  ids rotate independently. Replaces (no merge) — caller's refresh callback
  receives the current `TokenRecord | undefined` and returns a complete next
  record. Stable error arm via `TokenRotationError`:
  `refresh-callback-failed` (wraps caller exception with cause) /
  `store-write-failed` (persistence error) / `missing-token`. `forget(id)`
  idempotent delete. `isExpired(record)` — strict `>=` against clock (caller
  bias toward safety: at exact expiry, treat as expired). `expiresAt` absent
  → never expires (opaque refresh-only tokens). `TokenStorePort` injected:
  file-backed adapter Phase 1 (`~/.quanta/connectors/{id}.json` 0600);
  OS Keychain Phase 2 alongside desktop surface.
evidence:
  code:
    - src/connectors/token-rotation.ts
    - src/connectors/types.ts
  adrs: ["docs/decisions/0160-connectors-rest-api.md"]
  tests:
