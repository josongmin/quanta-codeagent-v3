knobs: []
deliberate_hold:
  reason: "File-backed TokenStorePort adapter NOT shipped in this slice — Phase 2 wires production adapter alongside desktop surface and OS Keychain."
  promotion_path: "When desktop surface lands or first concrete connector needs persistent storage, write file-backed adapter with same atomic write-then-fsync pattern as src/auth/chatgpt-oauth/token-store.ts."
notes: |
  Phase 1 (2026-05-25). 흡수 출처: Cursor
  `RefreshGithubAccessTokenInBackgroundComposer` token rotation pattern,
  generalized across arbitrary connectors. Hellgate 11 cases + unit 8 cases.
  HELL-11 verifies failed rotate releases mutex (next call retries fresh) —
  catches a common race-condition bug where exception holds the lock.
