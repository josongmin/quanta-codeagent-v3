notes: |
  Banner-contract observability — the matcher pins the LITERAL output text
  each producing tool emits. The hellgate covers every banner verbatim so a
  tool author who renames `[bash background]` (e.g. to `[bash bg]`) sees a
  CI fail HERE, not a silent regression in a far-away UI weeks later.

  MCP task state is parsed from the exact tool output and echoed task id. This
  prevents a terminal poll from silently settling a nonexistent ledger row or
  overwriting an unrelated shell/subagent record with the same id.
