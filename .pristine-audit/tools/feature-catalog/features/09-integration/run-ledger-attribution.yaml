id: run-ledger-attribution
title: ADR-0401 Run-ledger attribution via hook bus (bash/subagent/mcp observer)
section: 9
subsystem: Long-running work observability (ADR-0395 wave-2)
order: 397
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless, batch, daemon, ide]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "default-off"]
depends_on: [run-ledger, hookbus]
surface_integration:
  cli: full
  web: full
  method: audited
  verified: "2026-07-19"
  evidence:
    cli: "The observability composition wire subscribes createRunLedgerHookSubscriber to the live post_tool_use bus; MCP task polling now produces real waiting/running/terminal ledger records."
