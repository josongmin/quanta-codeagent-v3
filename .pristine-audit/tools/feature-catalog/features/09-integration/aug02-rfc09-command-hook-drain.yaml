id: aug02-rfc09-command-hook-drain
title: RFC09-1 — external command-hook append-context loop DRAIN bridge
section: 9
subsystem: Integration — command-hook append-context (aug-02 RFC09-1)
order: 567
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: partial
modes: [interactive, headless]
configurable: static
owners: ["@songmin"]
labels: ["rfc:aug02-09", "surface:cli"]
purpose: |
  RFC-09-1 residual-gap A-GAP-2: an external command hook can APPEND context,
  and the loop DRAINS that appended context so it actually reaches the model on
  the next turn (previously the hook could produce append-context that was never
  consumed). Additive: the drain bridge only carries context when a hook
  produced some; with no hooks the loop is byte-identical.
