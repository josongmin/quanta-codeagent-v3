id: lsp-warm-backend-prewarm
title: Code-intelligence warm backend — session-start LSP prewarm + first-call join + engine-swap pool
section: 9
subsystem: LSP — engine-agnostic warm-workspace pool + background prewarm + bench evict
order: 17
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: partial
modes: [interactive, batch]
configurable: integrated
config_refs:
  env: ["QUANTA_LSP_PREWARM", "QUANTA_LSP_TOOLS", "QUANTA_BENCH_LSP"]
owners: ["@songmin"]
labels: ["surface:core", "absorbed:codex", "default-on", "startup-latency", "lsp"]
depends_on: [assemble-tooling-core]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-17"
  evidence:
    cli: "session bootstrap fire-and-forgets the background warm (maybeStartLspPrewarm in agent/loop/session-bootstrap.ts, reachable from the CLI loop); the nav tools it warms are the QUANTA_LSP_TOOLS=full surface."
    web: "Pure latency/lifecycle primitive over the language-server subprocess — no user-visible render on any surface."
purpose: 'RFC jun-17 — pyright 첫 LSP 호출의 2~6초 cold stall을 세 가지로 해소: (1) 세션 시작 background prewarm(Python workspace면 fire-and-forget로 workspace 선행 부팅 — session start는 절대 지연 안 함), (2) first-call join(첫 실호출이 warm 완료면 즉시, 진행 중이면 동일 cwd-key 공유 세션의 startPromise에 join — 새 promise 발명 안 함), (3) 호출 시 pre-open progress로 침묵 stall 제거. 핵심 구조 변경: lsp-bridge의 pyright-하드코딩 warm/pool 층을 제네릭 `SharedWorkspacePool` + 좁은 `WarmBackend`(id/supports/createClient/ensureFileReady 4점)로 분리 — lifecycle(cwd-key 맵/refcount/idle-TTL/join/fatal teardown/evict)은 엔진 무관, 엔진특화는 readiness 판정 한 점뿐이라 basedpyright/rust-analyzer 등으로 교체 가능. open()은 best-effort warm 세션을 반환(verified-ready면 즉시 correct; readiness budget 소진 시에도 핸들은 반환 — runtime nav는 soft-degrade). 따라서 open() non-null ≠ ready: STRICT admission ready 증명은 ensureFileReady의 boolean을 직접 surface하는 `proveReady`/`proveStrictLspReady`(jun-23 LSP-01)가 권위. bench는 세션종료 시 HARD-evict(per-instance sandbox cwd당 pyright child 누수 봉인; tombstone으로 fire-and-forget prewarm의 late-creation 레이스까지 reap). DEFAULT-ON when nav enabled, off-switch=`QUANTA_LSP_PREWARM=0`(bench A/B cold arm). 실측(real pyright): cold 1.8s → warm-hit 1~4ms.'
