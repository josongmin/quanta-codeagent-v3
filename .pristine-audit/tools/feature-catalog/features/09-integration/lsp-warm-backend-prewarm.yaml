knobs:
  - name: QUANTA_LSP_PREWARM
    default: 'on'
    purpose: 'Session-start background LSP workspace prewarm. DEFAULT-ON when nav tools are enabled (QUANTA_LSP_TOOLS=full / QUANTA_BENCH_LSP); read at the composition root via `resolveLspPrewarmSlot` (interactive, `!gateDisabled`) and the bench driver (`!gateDisabled`). Off-switch `=0` is the cold arm for the bench cold-vs-warm A/B. With nav OFF the slot is omitted (byte-identical legacy).'
  - name: evictLspPoolOnEnd
    default: 'off (on for bench)'
    purpose: 'AgentConfig flag: HARD-evict pooled LSP workspaces at session end. Set by the bench driver whenever LSP nav is on (per-instance sandbox cwd must not leak a language-server child for the idle-TTL window). Interactive leaves the workspace on the pool 30-min idle-TTL for cross-turn reuse.'
notes: |
  ADR-0015 (LSP nav 흡수) 하위. 적대어딧 4R(concurrency/gate-security/refactor-equiv/fix-verify)에서 leak-race(fire-and-forget prewarm vs evict)·aborted-prewarm-boot·warmFile-dead-client 3실버그 적발→수정(hardEvicted tombstone + 조기 abort 가드 + destroyed 가드). real-pyright 헬게이트(evict-mid-boot/fatal-child-kill+recovery/18-concurrent-opens/refcount-churn/abort-mid-warm/broken-anchor) leak 0 검증. v1 비목표: diagnostics pooled 전환, TS/rust/go warm 확장, 실시간 elapsed warm-status 스트리밍.

  jun-23 LSP stability proof (docs/plans/jun-23-lsp-stability-proof): warm backend는 optimization이지 admission proof가 아니라는 갭을 닫음. LSP-00 typed receipt SSOT(src/shared/lsp-grounding-receipt.ts: launch/ready/runtime 7-outcome taxonomy, expected_cancel을 real failure와 영구 분리)·LSP-01 strict ready proof(proveStrictLspReady가 launchable→verified-ready로 admission 상향, ready_timeout/fatal_transport에 fail-closed)·LSP-02 typed status를 report.json·box ls가 동일 enum으로 소비(log-tail 해석 제거). monitoring을 none→partial로 정직화(typed receipt surfaced, but no live alerting/metrics yet).

  PROMOTION GATE (다음 단계 = stability closure 주장 조건): LSP-03 live measurement가 필수. 즉 (1) 반복런(n>1) LspGroundingSummary로 ready duration 분포·ready_timeout/expected_cancel/fatal_transport 카운트를 기록(docs/plans/jun-23-lsp-stability-proof/measurement-protocol.md 표), (2) 그 receipt 증거 없이는 PYRIGHT_READY_TIMEOUT_MS/anchor 정책 변경 금지(이번 턴 budget 무변경), (3) monitoring을 partial→integrated로 올리려면 typed receipt 기반 알림/집계가 라이브여야 함. 이 게이트 충족 전엔 "launch+ready+typed-report는 LANDED, 그러나 measurement-validated closure는 미완"이 정확한 상태.
