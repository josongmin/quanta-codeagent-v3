notes: |
  Same assembler used by `FallbackLLM` partial-tombstone path — when a provider
  fails mid-stream the consumer discards the dead partial via `stream_reset`
  tombstone before the fallback's events feed back into `assembleFromEvents`.
  Single backward scan for phase tagging — no probabilistic classifier.
