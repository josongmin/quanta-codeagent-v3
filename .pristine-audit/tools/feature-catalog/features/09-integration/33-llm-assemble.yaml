purpose: |
  Single SSOT for folding a `StreamEvent` iterator into one `AssembledTurn`
  ({message, stopReason}). Three explicit fold rules: (1) `text_delta`
  extends the trailing TextBlock OR opens a new one — text never merges into
  thinking/tool_use; (2) ADR-0076 Gap-2 — consecutive `thinking_delta`
  events fold into ONE ThinkingBlock; first non-thinking block forces a
  fresh thinking block on the next thinking_delta, so provider-ordered
  multi-block thinking is preserved; `redacted` flag is sticky — opaque
  ciphertext never merges with plaintext; (3) `signature_delta` attaches to
  the last ThinkingBlock in assembly order. Post-pass (ADR-0077) tags each
  TextBlock with `phase: "commentary" | "final_answer"` deterministically:
  text is commentary IFF a later tool_use exists in `content[]`, else
  final_answer. Consumers that ignore phase observe byte-identical behaviour.
