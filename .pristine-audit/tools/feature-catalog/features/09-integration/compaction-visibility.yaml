purpose: |
  Compaction은 그동안 silent internal optimization이었음 — 사용자는 왜 잊었는지,
  어디서 재개해야 하는지 알 수 없어 신뢰가 깨졌음. ADR-0409은 compaction을
  USER-VISIBLE RESUME CONTRACT로 승격:

  (1) `RecoveryReason` closed enum (7 arms: token_budget_exceeded / ptl_reactive /
      drift_breaker / manual / context_change / fork_branch / microcompact) +
      `RecoveryProvenance` (tokensBefore/After, turnsDropped/Kept, summaryRef,
      resumeStep, compactedAt) 타이핑.

  (2) `MicroCompactPort` — full reset 대신 oldest N% drop. system 메시지 +
      마지막 K turn 보존. NO-THROW pure function. dropRatio outside [0,1] clamp.
      malformed input ⇒ 입력 unchanged + provenance turnsDropped:0.

  (3) `post_compact` hook event variant + `compactIfNeeded`의 optional
      `postCompactEmit` / `objectiveSetNextActions` / `threadId` /
      `recoveryReason` 필드. 미주입 시 byte-identical legacy path.
      compactIfNeeded settle 후 1회 emit, 그리고 (threadId 있을 때)
      `objective.setNextActions(threadId, ["agent compacted: reason X —
      resume after compaction — kept last N turn(s), summarized M"])`로
      surface가 읽을 수 있게 함. emit/objective callback throw ⇒ 삼키고
      compaction은 성공 (NO-THROW seam).

  Slice fence: recovery-reason은 leaf (zero deps); microcompact은
  recovery-reason TYPES만 import (no @/llm, no @/agent/loop/dispatch/compaction);
  compaction.ts는 recovery-reason TYPES만 추가 import (no @/agent/objective —
  full ObjectivePort 대신 callback closure로 coupling 최소화).
  Default-OFF: command hooks가 명시적으로 enabled·risk-acknowledged되고
  PostCompact binding이 있을 때만 CLI composition이 HookBus를 주입한다.
  `buildPostCompactEmit`은 이 bus로 provenance를 전달하며, binding command는
  표준 command-hook permission/timeout 정책 아래에서 실행된다. binding이 없으면
  no-op이라 observer를 꾸며내지 않는다.
