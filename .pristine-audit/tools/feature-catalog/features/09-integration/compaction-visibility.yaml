notes: |
  2026-05-28 ship. 43 신규 hellgate (109 expects) + 57 기존 compaction tests
  byte-identical (214 expects, 0 regression). tsc 0 / biome 0 errors on
  슬라이스. Diff: hooks.ts +13/-0; compaction.ts +49/-1 (interface 5 fields +
  emit helper + 1-line callsite). 다음 wave: loop.ts에서
  config.objective.setNextActions로 closure 구성 + HookBus.emit("post_compact")
  subscriber wire-up. microcompact는 future tool/env knob으로 invoke.

  ⚠️ 용어 구분(jun-06): 본 yaml의 `src/agent/microcompact/`(ADR-0409)는 whole-MESSAGE-drop
  (oldest N% 메시지 통째 제거, orphan guard 無, disk persist 無, UNWIRED). 이와 별개로
  jun-6-microcompaction RFC가 추가한 tier-1 tool-result eviction은 in-place tool_result CONTENT
  clearing(block 보존 → orphan-safe, spill persist, wm.replace 배선 LIVE) — 별도 슬라이스
  `src/agent/tool-result-evict/` + fc `microcompact-tool-result-evict.yaml`. 두 메커니즘은
  알고리즘·safety profile·cost가 다르므로 카탈로그에서 conflate 금지.

  2026-07-16 DOF-40 (compaction attribution race, fail-closed): post_compact emit는
  ASYNC(`postCompactEmit`)라 handler가 turn 경계 뒤에 resolve하면 provenance에 turn
  id가 없어 ambient "current turn"을 읽어 WRONG turn에 mis-attribute / drop됐음. Fix:
  `RecoveryProvenance`에 `attributedTurnId?` / `attributedThreadId?` 추가(leaf type,
  omitted-when-absent exactOptional), `compactIfNeeded`가 emit 직전 SYNCHRONOUS로
  stamp → late async handler는 payload의 stamp로 결정론적 attribution(ambient state
  안 읽음). Fail-closed: emit throw 시 stamped provenance를 `onAttributionFailure`
  sink로 surface(silent drop 금지), sink도 no-throw로 contained. Objective action
  string은 `[turn <id>]` tag append(resume contract 불변). OFF byte-identical:
  callback/turn 미주입 ⇒ provenance 미생성. 신규 hellgate 10 tests(26 expects),
  red-on-injection(stamp revert ⇒ ordering+sync-stamp+fail-closed 5 RED) 확인.
  compaction.ts +60/-1, recovery-reason/types.ts +13.

  2026-07-18 DOF-40 WIRE (seam→wired): 이전 wave의 잔여였던 loop 와이어링을 닫음.
  `compactIfNeeded`는 Wave-A부터 `attributedTurnId`/`onAttributionFailure`를
  받았으나 PRODUCTION 와이어(`compaction-wire.ts` buildCompactIfNeededOptions)가
  둘 다 안 넘겨 DEAD WIRE였음 — 프로덕션에서 turn이 UNSTAMPED이고 dropped async
  attribution은 `logger.warn`만 쳐서 surface에 안 보였음. Fix: buildCompactIfNeededOptions가
  `postCompactEmit` 활성(=실 consumer 존재) gate 아래에서 (a) REAL current turn
  (`turnId` = maybeCompact 콜사이트의 `config.run?.turn ?? turn` 파생)을
  `attributedTurnId`로 stamp, (b) `onAttributionFailure`를
  `emitRecovery(config,"compact","attribution-failed: …")` — proactive-failed/
  bg-install-stale와 같은 operator-observable recovery stream 이벤트 채널로 라우팅.
  OFF byte-identical: hooks 미주입 ⇒ postCompactEmit undefined ⇒ 두 필드 다 미-spread
  ⇒ legacy silent path. 신규 wire hellgate 7 tests(compaction-wire-attribution-wired-
  hellgate): (a) config.run.turn로 attributed(loop turn arg와 다른 값으로 stub 아님을
  증명), (a') 다른 run.turn이면 stamp 바뀜(하드코딩 아님), (b) bus emit reject ⇒
  attribution-failed recovery 이벤트 발화(REAL sink), OFF/absence-identity 3.
  red-on-injection: 와이어 블록 strip ⇒ (a)(a')(b)(c) 4 RED, restore ⇒ 7 pass.
  🔑 발견: HookBus는 subscriber throw를 내부에서 catch하므로 throwing subscriber로는
  onAttributionFailure에 도달 못함 — 실제 도달 경로는 `postCompactEmit` 클로저
  자체(=`hooks.emit`)가 reject할 때뿐(테스트가 이 realistic 경로로 검증, 조작된
  sink 아님). compaction-wire.ts +19(import 1 + 옵션 spread 블록), 소스/테스트
  tsc 0 / biome 0(선존 rebuildBgInstallAgainstLive complexity 경고는 무관·비차단).
  잔여: web daemon post_compact 바인딩(surface_integration.web=missing).

  2026-07-19 consumer proof: `QUANTA_COMMAND_HOOKS` + ACK + a trusted
  `PostCompact` binding creates the real HookBus consumer. The command-hooks
  rail drives an actual `post_compact` event through `installCommandHooks` and
  proves the binding receives only the typed provenance JSON. This is not
  default-ON: it runs an operator-configured command and therefore remains
  measure-first.
