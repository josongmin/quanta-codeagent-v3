surface_integration:
  cli: full
  web: partial
  method: audited
  verified: "2026-07-15"
  evidence:
    cli: "A mailbox `send` addressed to the session owner emits a `peer_message` AgentEvent that the stdout adapter renders as a DIM `✉ sent by <from> — from another task [kind]` label above the collapsed body (src/stream/adapters/stdout.ts renderPeerMessage); also a CLI timeline-panel row. Reachable from src/apps/cli/index.ts via the assembler mint-seam wire."
    web: "The event folds onto an append-only item-stream `peerMessage` member (atomic started+completed), carried verbatim by BOTH wire planes so the web ItemStreamSection renders it generically; a dedicated label+bubble component (Codex parity) is a deferred follow-up."
purpose: |
  Makes inter-agent mailbox mail + side-agent daemon findings VISIBLE to the USER
  as an attributed transcript notice — Codex "Sent by Codex from another task"
  parity, terminal dialect. The `surfaceNotifyMailbox` decorator wraps the RAW
  mailbox store INSIDE the team-scoped decorator; on a `send` addressed to the
  session owner (`to === recipientId` or a broadcast) it emits a `peer_message`
  display event at ENQUEUE time — so the user sees the mail the moment it is
  queued while the MODEL still receives it at its next turn-top drain (no forced
  turn; exactly Codex `send_message` "delivered promptly, does not trigger a new
  turn" semantics). The owner's OWN sends are excluded (the store never delivers
  a message to its own sender). The untrusted-peer body is redacted + per-line
  control/ANSI sanitized at the emit boundary; `provenance` distinguishes ordinary
  peer mail from a side-agent finding (the tool surface cannot forge it). The host
  wire installs the decorator under `QUANTA_PEER_MSG_SURFACE` at the assembler
  mint seam — BEFORE the side-agent registry captures the mailbox (so daemon
  findings surface) and BEFORE the team wrap (so a cross-team DENIED send never
  reaches the display seam). Default-OFF byte-identical when the knob is unset.

  Ships with the prerequisite W1 audit fixes it depends on: the side-agent finding
  recipient SSOT (`rootMailboxRecipient`, F1 dead-letter), the mailbox DoS-cap
  factory SSOT (`createDefaultSubagentMailbox`, F2), and the honest cross-team
  deny (`denied` marker, F3). Full event-type cascade: `peer_message` is handled
  by the stdout switch, the item-stream projector, the jsonl recorder (RECORD),
  and the CLI timeline inventory; the web agent-state projection filters it (rides
  the item-stream leg).
