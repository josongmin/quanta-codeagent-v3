id: observability-live-wire
title: ADR-0415 Observability live-wire (HookBus auto-subscribe + RuntimeFacade port exposure)
section: 9
subsystem: Long-running work observability (Wave-3 deliberate-hold closeout)
order: 415
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless, batch, daemon, ide]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "default-off"]
depends_on:
  - observability-wire
  - run-ledger-attribution
  - observability-ui-pane
surface_integration:
  cli: missing
  web: full
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "src evidence not reachable from the interactive CLI entry (src/apps/cli/index.ts) — wired only into other apps (eval/bench/probe/headless) or unwired"
    web: "Live ports (RunLedger/Objective/Approval) feed the web-only ObservabilityPane; web-daemon/index.ts buildObservabilityPorts + ObservableRuntimeFacade wired (apps/web-daemon/index.ts:143)."
purpose: |
  Closes the three Wave-3 deliberate-holds so observability goes live.

  Part 1 (landed separately) promoted `runLedger` + `approvalStateMachine`
  to first-class `AgentConfig` slots (alongside `objective` + `shadowVerify`).

  Part 2 — `resolveObservabilitySlots(env)` mints the canonical `HookBus`
  ONLY when `QUANTA_OBSERVABILITY=on`, subscribes `run-ledger-attribution`
  to `post_tool_use` via a duck-typed `ObservabilityHookBus`
  (`toObservabilityHookBus` adapts `bus.on`; no-op detach since `HookBus.on`
  has no `off()`), and injects the four ports into `AgentConfig` as a
  presence-only fragment. Gate OFF ⇒ `{}` (byte-identical).

  Part 3 — `ObservableRuntimeFacade extends RuntimeFacade` exposes the four
  ports via `attachObservabilityPorts` (getters proxied with
  `Object.defineProperties`, preserving `createSession`/`close`).
  `buildProductionRuntimeFactory` mints a per-session wire + bus and threads
  the ports onto the session config; the daemon entry feeds the live ports
  into `createObservabilityEmitter`. `RuntimeFacade` in `@/sdk/runtime` is
  left untouched (slice fence).

  Default-OFF (RFC §1.2): `QUANTA_OBSERVABILITY` unset ⇒ zero behavior change.
  apps/agent (180) + web-daemon (55) suites byte-identical, 0 regression.
evidence:
  code:
    - src/apps/agent/index.ts
    - src/apps/web-daemon/runtime-factory.ts
    - src/apps/web-daemon/index.ts
  adrs:
    - docs/decisions/0415-observability-live-wire.md
    - 394
    - 395
    - 401
    - 406
    - 408
  tests:
    unit:
      - tests/unit/observability-live-wire-hellgate.test.ts
      - tests/unit/observability-wire-failclosed-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_OBSERVABILITY
    default: 'off'
    purpose: 'live observability wire ON (HookBus subscribe + RuntimeFacade ports + emitter)'
config_refs:
  env: [QUANTA_OBSERVABILITY]
deliberate_hold:
  reason: |
    No daemon-level `ws` broadcast sink exists without touching the
    off-limits `server.ts`, so the observability-emitter runs port-only —
    it reads the live ports but does not yet push deltas over the served
    WebSocket. The live ports are the load-bearing deliverable.
  promotion_path: |
    L4 = add a daemon-level ws broadcast sink in server.ts so the emitter's
    snapshot/delta frames reach the connected UI pane live.
notes: |
  Closeout of the Wave-3 observability deliberate-holds (ADR-0406/0408).
  run-ledger-attribution (ADR-0401) finally subscribes to a live HookBus;
  the four ports are reachable from both AgentConfig and RuntimeFacade.
  21 hellgate cases / 70 expects (HookBus subscribe/unsubscribe via fake
  bus, gated AgentConfig slot population, RuntimeFacade getters, emitter
  receives live ports, idempotent re-wire, byte-identical default-OFF).
  DOF-40 (2026-07-17, partial-wire fail-closed): `wireObservability`
  previously degraded a throwing port factory / hookBus.subscribe() to an
  `undefined` slot with NO signal — an absent slot was AMBIGUOUS between
  "host opted out" and "the factory threw" (SILENTLY offline). The wire now
  RECORDS every failed slot in a frozen `handle.degraded:
  ObservabilityWirePortError[]` report (empty when clean/gate-OFF) AND routes
  each failure to an optional `onPortError` observer — so WHICH port went
  offline is VISIBLE. Opt-out (no hookBus / no repoRoot) is NOT a failure ⇒
  never reported. Sibling isolation preserved (one throwing slot leaves the
  other three populated). Gate-OFF returns the shared frozen NOOP handle
  (degraded=[]) BEFORE any reporter/factory runs ⇒ byte-identical. A throwing
  observer never breaks wiring. `OBSERVABILITY_WIRE_SLOTS` is the closed slot
  enumeration (drift guard). 9 hellgate cases
  (observability-wire-failclosed-hellgate.test.ts).
