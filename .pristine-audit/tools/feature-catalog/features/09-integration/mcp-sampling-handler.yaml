id: mcp-sampling-handler
title: ADR-0470 B1 MCP Sampling Handler (@/llm-backed, HITL-gated)
section: 9
subsystem: MCP inbound sampling/createMessage
order: 470
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: integrated
owners: ["@songmin"]
labels: [absorbed:claude, absorbed:codex, surface:core, security]
depends_on: [mcp-tasks-capability, mcp-elicitation-schemas]
config_refs:
  env: [QUANTA_MCP_SAMPLING, QUANTA_MCP_CAPS]
  runtime: [mcpSampling]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 9/9 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "the user-facing piece is the HITL consent prompt routed through the CLI elicitation prompter; web-daemon non-TTY falls to headless decline and there is no web-frontend consent component"
purpose: |
  B1 follow-up — wire a REAL `@/llm`-backed inbound MCP `sampling/createMessage`
  handler at the composition root (the host layer is the only slice allowed to
  reach both `@/mcp` and `@/llm`; `@/mcp` may NOT import `@/llm`, the reason the
  `SamplingHandlerPort` DI seam exists). The handler: (a) maps the MCP
  `CreateMessageRequest` (messages/system) onto an `@/llm` completion, drains the
  stream, assembles assistant text via the shared `assembleFromEvents`; (b) maps
  the result back to `CreateMessageResult` (role/content/model/stopReason); (c)
  is TOTAL (no-throw) — every failure → `{ok:false, reason:"error"}`.
  HITL consent gate REUSES the existing MCP elicitation prompter
  (`promptBoolean`): a server asking us to spend inference is sensitive, so on
  deny ⇒ `user-denied`; the headless default prompter DECLINES, so an unattended
  run is denied by default. Advertise-iff-handler: `buildSamplingWiring` decides
  the `fullNegotiator({sampling})` advertisement AND the injected handler from
  ONE gate (knob ON + LLM + consent prompter all present), so the two can never
  drift. `QUANTA_MCP_SAMPLING=1` opt-in; default-OFF byte-identical (no
  advertisement, headless rejecter declines `no-handler`).
evidence:
  code:
    - src/host/runtime/mcp-sampling-handler.ts
    - src/host/runtime/agent-arg-builder.ts
    - src/host/runtime/index.ts
    - src/mcp/sampling/port.ts
    - src/mcp/sampling/inbound-router.ts
    - src/mcp/sampling/headless-rejecter.ts
    - src/mcp/capabilities/full-negotiator.ts
    - src/mcp/client.ts
    - src/shared/runtime-config.ts
  adrs: [470]
  tests:
    unit:
      - tests/unit/mcp-sampling-handler-hellgate.test.ts
      - tests/unit/mcp-sampling-handler-e2e-hellgate.test.ts
      - tests/unit/mcp-sampling-honest-advertise-hellgate.test.ts
knobs:
  - name: QUANTA_MCP_SAMPLING
    default: 'undefined'
    purpose: 'Strict =="1" opt-in. ON (+ LLM + consent prompter) ⇒ advertise sampling AND wire the @/llm handler; OFF ⇒ no advertisement, headless rejecter declines (byte-identical).'
  - name: QUANTA_MCP_CAPS
    default: 'undefined'
    purpose: 'Must be "full" for any capability (incl. sampling) to be advertised at all.'
notes: 'Advertisement + handler move together (buildSamplingWiring). Headless = denied by default. @/mcp gains NO @/llm import — handler lives in @/host/runtime.'
