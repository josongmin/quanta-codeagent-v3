knobs:
  - name: QUANTA_MCP_RESOURCES
    where: src/shared/runtime-config.ts
    default: "off (strict === \"1\")"
    purpose: |
      ON + ≥1 connected MCP server advertising resources/prompts ⇒ the four
      mcp_* resource/prompt tools register (mcp origin). Unset/any-other-value ⇒
      tools absent + registry byte-identical.
notes: |
  L3: duck-typed port mirror + 4 tool factory + PURE render(cap/blob-guard/
  non-text-placeholder) + DefaultToolPorts wiring + knob + manifest row 완비,
  default-OFF byte-identical. hellgate: happy(list/read/read-dir/list-templates/
  get/forward-args/empty) + typed-failure×4×6도구 + malformed-args + abort×6 +
  DoS(cap/blob/non-text) + **THE invariant(deriveProvenance=mcp + hostile-text
  defang 봉인)** + default-OFF 등록. B4 added mcp_read_resource_dir (directory-
  shaped uri children from resources/list, subdir mimeType inode/directory) +
  mcp_list_resource_templates (resources/templates/list enumerator).
  **HOST-WIRE DONE (jun-06)**: 어댑터를 별도 `@/mcp/resources/client-port.ts`로
  만들 필요 없었음 — McpClient의 4 메서드 result shape이 `ResourcesHandle` 타입의
  string-identical 미러라 concrete McpClient가 `McpResourcesClient`를 구조적으로
  만족(per-method 어댑터 불필요, drift=`aggregateResourcesHandle` 사이트 TYPE error).
    (1) `src/agent/mcp-bridge.ts` — N3 aggregate:
        - `McpResourcesClient`/`ResourcesCapableClient` 구조 인터페이스(McpClient 충족).
        - `aggregateResourcesHandle(clients)`: list*=concat(unsupported/error 클라 skip),
          read/get=route(순서대로 시도, ok:true hit 우선, 아니면 first real failure,
          전부 unsupported면 typed unsupported). NO-THROW end-to-end.
        - `resourcesHandleFor(clients)`: resources OR prompts 광고한 클라만 모아 aggregate,
          0개면 undefined. SUPERVISED 클라(McpReconnectSupervisor)도 INCLUDE(jun-06 RFC,
          한계 CLOSED): supervisor가 6 `resources/*`+`prompts/*` 메서드를 노출하고 매 콜
          CURRENT live client를 re-resolve해 `ResourcesCapableClient`를 구조적으로 만족.
          reconnect gap 동안엔 typed `transport` failure(no-throw)라 그 한 콜에서만 빠짐.
        - `loadSingle`이 concrete client를, `loadSupervised`가 supervisor를 `resources`로
          surface, `loadMcpTools`가 `{tools, clients, resources?}` 반환.
    (2) `src/apps/cli/internal.ts` `loadFeatures` — knob+handle 게이팅으로
        `mcpResourcesTools(handle)`을 mcpTools에 append(origin=mcp ⇒ H2 envelope 자동).
        zero servers/지원 안 함 ⇒ handle undefined ⇒ tools absent + byte-identical.
  r3 핀 갱신: `agent-arg-builder.ts` BASELINE root는 MCP 서버를 로드 안 하므로 live
  client가 없어 QUANTA_MCP_RESOURCES=1이어도 도구 미등록 — 이 핀 유지(여기 배선하면
  builtin origin 오태깅 = 회귀, test-visible). 실제 활성화는 loadFeatures 경로,
  `mcp-resources-host-wire-e2e-hellgate.test.ts`가 e2e로 핀(live single + multi-client
  concat/route + knob-off byte-identical + zero-clients + origin=mcp).
  SUPERVISED resources 표면화 DONE(jun-06 RFC): supervisor가 6 resources/prompts
  메서드를 노출(매 콜 live client re-resolve, reconnect gap=typed transport no-throw)
  → `loadSupervised`가 supervisor를 aggregate에 admit. 핀:
  `mcp-resources-supervised-hellgate.test.ts`(31 케이스: healthy proxy/reconnect-gap
  fail-fast/queue/degraded/restart-swap/capability-drift/method-set-absent/mixed
  aggregate/default-OFF). Phase-2 deferred(잔여): prompt-template materialization +
  resources/subscribe notification-stream.
