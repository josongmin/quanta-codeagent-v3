id: mcp-resource-tools
title: MCP resource/prompt tools (N3 — list/read/read-dir resources + list-templates + list/get prompts)
section: 9
subsystem: MCP / resources (§7, H19 resources/* + prompts/* client methods 위에 얹은 도구층)
order: 169
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, ide]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "absorbed:codex", "absorbed:cursor"]
depends_on: [mcp-connector-discovery]
config_refs:
  env: [QUANTA_MCP_RESOURCES]
surface_integration:
  cli: full
  web: full
  method: audited
  verified: "2026-07-03"
  evidence:
    cli: "runs in the interactive CLI — evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "agent calls to the 6 mcp resource/prompt tools render as tool cards via bridged tool_call/tool_result events"
purpose: |
  H19(LANDED)이 준 `McpClient`의 typed no-throw `listResources`/`readResource`/
  `listResourceTemplates`/`listPrompts`/`getPrompt` (resources/* + prompts/*
  method 패밀리) 위에 얹는 **agent-callable 도구층**. H19 메서드는 INTERNAL —
  에이전트 루프가 못 부름. N3가 SIX caller-wired default-OFF 도구를 노출:
  `mcp_list_resources` / `mcp_list_resource_templates` / `mcp_read_resource` /
  `mcp_read_resource_dir` (B4) / `mcp_list_prompts` / `mcp_get_prompt` — 모델이
  연결된 MCP 서버의 resources(+ URI templates) + prompt template을 열거·읽기.
  READ tools split: list_resources/list_resource_templates/read_resource_dir +
  the list/get-prompt pair stay read-only; `mcp_read_resource` (B4) is MUTATING
  (a binary BLOB is base64-decoded + written to a jailed workspace path via the
  shared @/storage#resolveJailed chokepoint, '../' refused, 8MB-capped).

  레퍼런스: Cursor `listMcpResources`/`readMcpResource` exec-args(per-server scoping +
  NotFound/Error/Rejected 닫힌 union) + Codex `rmcp-client` 5-method 패밀리
  (resources/{list,read,subscribe} + prompts/{list,get}). N3는 list/read + list/get
  표면화; subscribe는 notification-stream이라 도구 아님(Phase-2 deferred).

  슬라이스 (`src/tool/mcp_resources/`, `@/tool` leaf, NO `@/mcp` 임포트):
    - `port.ts` — duck-typed `ResourcesHandle` (=@/mcp/resources/port `McpResult<T>`
      + `Mcp*` shape의 string-identical mirror; 호스트가 live McpClient를 이 shape으로
      어댑트, drift=어댑터 사이트 TYPE error).
    - 6 tool factory `(port: ResourcesHandle) => Tool` — read tools(list*/
      read_resource_dir/list/get-prompt) read-only, `mcp_read_resource` mutating
      (jailed blob write); 각 execute가 zod 재파싱 → signal.aborted 체크 → handle
      1회 호출 → 단일 `{type:"result"}`. typed failure(`unsupported`/`malformed`/
      `transport`/`too-large`)는 throw 없이 `ok:false`.
    - `render.ts` — PURE 렌더 + failure 매핑. **untrusted-content 안전**: BLOB은 절대
      inline 안 함(placeholder만), text는 MAX_OUTPUT(50k, list_tasks와 동일값)로 cap,
      non-text prompt content는 typed placeholder(파싱 시도 안 함).
    - `index.ts` — `mcpResourcesTools(port): Tool[]` (stable order:
      list_resources → list_resource_templates → read_resource →
      read_resource_dir → list_prompts → get_prompt).

  배선/보안 (jun-06 HOST-WIRE 완료): `QUANTA_MCP_RESOURCES` default-OFF
  (없으면 미등록=byte-identical, N2 `mcpConnectors` 미러). 도구 출력은 `mcp`-origin ⇒
  `deriveProvenance(name,"mcp")==="mcp"` ⇒ H2/ADR-0471 `<untrusted-source>` envelope가
  dispatch seam에서 출력을 wrap+defang. 별도 보안 배선 불필요 — `mcp`-origin array로
  등록되는 것 자체가 invariant(hellgate가 origin=mcp + defang 둘 다 핀).
  **선택된 배선 경로**: `DefaultToolPorts.mcpResources`(=builtin origin)가 아니라
  `loadFeatures` → `mcpTools`(=mcp origin) 배열로 등록. builtin origin으로 가면
  H2 envelope를 잃으므로(보안 회귀) mcpTools 경로가 정답. `@/agent/mcp-bridge`가
  live McpClient들 위에 ONE aggregate `ResourcesHandle`(`aggregateResourcesHandle`/
  `resourcesHandleFor`)을 mint해 `loadMcpTools` 반환에 `{resources?}`로 실어 보내고,
  `loadFeatures`가 knob+handle 게이팅으로 `mcpResourcesTools(handle)`을 mcpTools에 append.
