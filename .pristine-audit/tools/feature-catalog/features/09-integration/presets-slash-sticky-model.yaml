purpose: |
  §9.6 — Claude Code's `opusplan` parity, realized as `/presets`: a NAMED,
  curated bundle that binds a logical role/phase to a concrete model, applied
  STICKILY for the run (Opus for plan-writer/reviewer, Sonnet for the fast
  executor/explorer/default). The operator picks the preset BY NAME and the
  choice persists until cleared.

  This is the FIRST consumer of the producer-only `model-preset` slice
  (`model-preset-sticky-resolver`, §8): the command does NOT reimplement presets
  — it renders `listModelPresets()` and mutates a SINGLE live
  `StickyPresetResolver`, the SAME instance the session's per-role model
  resolution consults each turn.

  Surface:
    - `/presets`            → list every built-in preset (name · describe · its
                              role→model bindings + default), marking the active
                              one with `*`.
    - `/presets <name>`     → apply the preset via `StickyPresetResolver.select`,
                              so role→model resolution becomes STICKY to the
                              preset's bindings for the rest of the run.
    - `/presets clear`      → drop the sticky selection (role resolution reverts
                              to the caller's per-turn fallback, verbatim).

  ACTIVATION (the real lever, not just a picker): surface-compose.ts mints ONE
  `createStickyPresetResolver()` and shares it two ways —
    (a) into the `/presets` slash slot (`ctx.presets`, threaded through
        dispatch.ts) so `select`/`clear` mutate it, AND
    (b) wrapped by `buildPresetRoleModelResolver` (ctx-adapters) as a
        `RoleModelResolver` into `AgentConfig.roleModelResolver`, consumed by
        `resolveChildLlm` (subagent-runner-overrides.ts) so a delegated role
        actually runs on the preset's bound model.
  Single instance ⇒ no split-brain: a `/presets opusplan` immediately changes
  which model the loop resolves for a role.

  NO SILENT FALLBACK: an unknown preset name returns the resolver's TYPED
  `{ok:false}` (PresetError) — surfaced with the valid-name enumeration + exit 1
  — and the sticky selection is left UNCHANGED (a bad name never clears a good
  pick). The typed error CODE is honored verbatim so a future rejection reason is
  never mislabeled "unknown preset".
