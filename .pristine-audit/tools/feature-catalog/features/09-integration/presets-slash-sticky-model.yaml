notes: |
  Default-OFF byte-identity: with NO preset selected, the role→model resolver
  adapter's `resolve(role, default)` returns the caller's `default` VERBATIM, so
  the loop is byte-identical to the no-resolver path until a preset is picked.
  The `/presets` slash is always present in the REPL (mirrors `/goal`); the
  default-OFF posture is enforced by the resolver's contract (unselected ⇒
  fallback-verbatim), not by presence-gating the command.

  Precedence layering (matches the model-preset slice's documented design "the
  preset supplies the per-role default, which an explicit role override can still
  beat"): the adapter carries its OWN explicit-override map ABOVE the preset, so
  a future `/role-model` (ADR-0256) SET still wins. The CLI wires no role-override
  SET surface yet, so today the effective precedence is preset-then-caller-default.

  Absent slot: the command prints "not wired in this surface" + exit 0
  (byte-identical to the rest of the presence-gated commands) — reached only when
  a surface omits `ctx.presets` (e.g. a headless/one-shot surface that mints no
  preset resolver).

  Registration + discoverability drift-guards: `/presets` appears in the layered
  BUILTINS mirror (tests/unit/slash-commands.test.ts, session-layer tail after
  /goal), the dynamic help render (help-render iterates live BUILTINS), and the
  name completer (slashCompleter "/pres" → "/presets"). The preset name/`clear`
  completer is presence-gated on `ctx.presets` and inert past one arg.
