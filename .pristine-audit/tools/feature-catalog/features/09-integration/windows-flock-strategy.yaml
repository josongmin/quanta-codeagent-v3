notes: |
  L2: doc-only negative decision — code change: zero. There is no test of
  the Windows `wx`→CreateFileW(CREATE_NEW) portability claim (no Windows
  CI here), and the existing POSIX flock test of `file-lock.ts`
  (caller-owned-registry-builder-hellgate) does NOT exercise the Windows
  path, so it cannot honestly back this entry. Demoted from L3 (overclaim
  — L3 requires tests>=1 and none cover this claim) to L2; code reference
  + ADR-0365 remain. Inline reference added to `file-lock.ts` module
  header pointing to ADR-0365 so the next time someone asks "should we
  switch to LockFileEx?" the answer is one link away.
