purpose: |
  Investigation + memorialization: Node `fs.open(path, "wx")` maps to
  `CreateFileW(CREATE_NEW)` on Windows, which is atomic at the kernel
  level on every supported volume (NTFS / ReFS / modern SMB2/3). The
  ADR-0356 exclusive-create primitive is therefore Windows-correct as
  written; no `LockFileEx` native binding is required. Legacy SMB1 /
  pre-Server-2008 file shares are explicitly out of support — they
  fall into the same negative scope ADR-0355 already declared for
  cross-machine NFS leases. Forward path: if a future deployment
  requires range-lock semantics on legacy volumes, a sibling ADR can
  introduce an OPTIONAL `lockStrategy?` seam without disturbing the
  default exclusive-create path.
