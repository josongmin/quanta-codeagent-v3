id: objective-first-class
title: Objective as a first-class per-thread object (ADR-0394, MODEL ONLY wave)
section: 9
subsystem: Objective substrate (ADR-0394)
order: 94
maturity: L2
status: new
ui_surfaces: [none]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: none
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: []
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 3/3 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure internal typed store/port primitive, no UI affordance on any surface"
purpose: |
  First-class per-thread Objective — closes quanta's biggest structural gap:
  there was no typed object tying a thread's work together (goal / what "done"
  means / what is blocking / what to do next / budget). Compaction, resume,
  subagent-result attribution, and approval all re-derive intent from message
  scrollback instead of reading a typed object. This wave ships the SUBSTRATE
  ONLY — the typed model (Objective / SuccessCriterion / Blocker /
  ObjectiveBudget / ObjectiveStatus / ObjectiveSnapshot), the closed
  `ObjectivePort`, and a zero-dep in-memory `createObjectiveStore`. NOT wired
  into the agent loop / dispatch / prompt / features / any tool (in-flight
  work on those shared files). Pure new slice `src/agent/objective/`, no
  cross-slice imports (only `node:crypto` for randomUUID).

  Status is DERIVED, never stored as truth: (1) blockers non-empty ⇒ "blocked"
  (highest priority); (2) else all criteria met (>=1) ⇒ "completed"
  (auto-derived; zero-criteria never auto-completes); (3) else the last
  explicit updateStatus value (default "active"). `updateStatus("blocked")` is
  a no-op — blocked is derived only from the blocker list. NO-THROW: every
  method degrades to null (mutators / get) or empty (list / snapshot) on
  unknown threadId or malformed/hostile input. Frozen snapshots prevent
  store corruption via returned references. Injected `now` clock seam (default
  Date.now) for deterministic tests; createdAt sticky, updatedAt advances on
  mutation. recordUsage accumulates non-negative finite integer deltas and
  clamps negative/NaN to a no-op. toSnapshot/fromSnapshot round-trips
  deep-equal + JSON byte-stable; fromSnapshot REPLACES (does not merge) and
  tolerates a hostile snapshot. Default-OFF: importing the barrel allocates
  nothing until a host calls createObjectiveStore — the agent stays
  byte-identical until a later wave wires it.
evidence:
  code:
    - src/agent/objective/types.ts
    - src/agent/objective/store.ts
    - src/agent/objective/index.ts
  adrs: [394]
  tests:
    unit:
      - tests/unit/objective-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: now
    where: src/agent/objective/store.ts
    default: 'Date.now'
    purpose: injected clock seam for deterministic createdAt/updatedAt/since stamps
deliberate_hold:
  reason: |
    MODEL ONLY wave. The slice is a closed port + in-memory store with full
    hellgate coverage, but it is NOT yet referenced by any code path: not the
    agent loop, dispatch, prompt, features, nor any tool. Wiring is held back
    because there is in-flight work on those shared agent files and the
    attribution semantics (which lifecycle events set goal / criteria /
    blockers / usage) belong to a dedicated wave.
  promotion_path: |
    A later wave wires `createObjectiveStore` into the composition root so
    compaction preserves { goal, successCriteria, nextActions, blockers }
    verbatim across a summarize, resume re-hydrates via fromSnapshot, and
    subagent results attribute to the parent's objective. Promote to L3 once
    at least one real lifecycle producer/consumer is wired and a surface reads
    the objective.
notes: |
  Slice fence verified: no imports from @/agent core (loop/dispatch/prompt/
  features/types), @/apps, or sibling slices. IDs via crypto.randomUUID().
  33 hellgate cases / 101 expects pin the status-derivation rule, NO-THROW,
  frozen snapshots, usage accumulation, snapshot round-trip, and multi-thread
  isolation. Sibling-shaped to the Stage1Store (ADR-0216) agent-side
  no-throw store pattern but synchronous + null-degrade (no Promise / no
  { ok, value } result envelope) since the objective is in-process state.
