purpose: |
  Two ADRs documenting deliberate NON-implementation with re-open triggers
  and impl sketches. ADR-0343 (per-turn image retry rebuild): fact-find
  showed no user / system / upstream-parity scenario for mid-session
  toggle of `cfg.imageSanitizationRetry`. Future trigger conditions
  (user slash command, adaptive policy, per-turn config re-resolution) +
  concrete `originalLlm` storage sketch + 5 hellgate cases are on file.
  ADR-0344 (provider wm-live reads): fact-find showed only ONE in-stream
  retry decorator (image retry) mutates wm — closed by ADR-0337's
  decorator-local snapshot. Follow-up queue (`model_streaming` pause
  reason) is an explicit architectural policy AGAINST mid-stream wm
  mutation. Three re-open triggers recorded. Code mutation: 0 (ADRs are
  load-bearing as documentation).
