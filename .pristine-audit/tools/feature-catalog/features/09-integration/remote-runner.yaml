    web: "no web/daemon surface — remote plane is CLI-only."
purpose: 'Closed RemoteRunner port (spawn/status/cancel/logs) with an env-driven registry selecting one of four backends — docker, lima, apple-vz, or the deterministic in-memory headless stub. Exposed as the `quanta remote` CLI subcommand (ADR-0290). Default-OFF + import-safe: selectRemoteRunner returns null when QUANTA_REMOTE_RUNNER is unset/"none"/unknown or the adapter host seam is missing — the CLI exits 64 (remote-not-configured) WITHOUT spawning, so importing @/remote never instantiates an adapter. The port guarantees Result-typed spawn/status/cancel (no thrown surface error), idempotent cancel, cached terminal status, and back-pressure-friendly logs as an AsyncIterable that releases on exhaustion/break.'
