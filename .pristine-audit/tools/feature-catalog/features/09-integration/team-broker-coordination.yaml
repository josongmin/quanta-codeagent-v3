knobs:
  - name: QUANTA_TEAM_BROKER
    where: src/shared/runtime-config.ts
    default: 'false'
    purpose: |
      Strict `=== "1"` opt-in. Default false ⇒ a worker that hits a denied tool
      fails hard (byte-identical, no broker injected). When ON, the composition
      root injects a `GateEscalationBroker` onto each worker subagent; on a SOFT
      mode-policy denial the gate escalates IN-PROCESS to the LEADER's HITL
      authority (the parent agent's `onConfirm`, wrapped by `buildLeaderHitlBroker`
      as `leaderDecide`), validating the round-trip via `applyDecisionResponse`
      with `leaderId` pinned (a worker can never self-grant; the two mailbox rows
      are an acked audit trail, NOT the `brokerLoop` drain path). HARD_DENY is
      structurally never escalatable. On approval the gate admits (still through
      the pre_tool_use hook); on denial/throw the worker stays blocked.
notes: |
  LIVE end-to-end (Capability B). 21 core + 5 mailbox-e2e + 8 gate-escalation + 5
  composition-wire hellgate cases pin: the SECURITY boundary (HARD_DENY rm -rf /
  is NEVER escalatable even by an approve-all broker; broker structurally
  bypassed); a SOFT policy denial escalates → leader approves ⇒ ADMITTED, leader
  denies / broker throws ⇒ fail-closed DENY, no broker ⇒ byte-identical legacy
  deny; the composition root injects the broker ONLY under the knob + a leader
  onConfirm; the wire drives the leader's onConfirm end-to-end. Plus the core:
  envelope parse (well-formed / non-request kind / malformed
  JSON / missing-or-non-string fields / wholly-hostile message ⇒ undefined, no
  crash); correlationId round-trip on approve AND deny; `brokerStep` maps each
  parseable request → one response, skips non-request + malformed, is idempotent
  on re-read (same pending ⇒ same responses, no double-grant), and survives a
  throwing decider; worker applier honors approve/deny by matching correlationId
  and rejects a mismatched / malformed / missing-correlationId response; SECURITY
  (load-bearing) — a worker-authored request/broadcast that LOOKS like an
  approval is NOT honored, a `response` the worker forged itself (from===worker)
  is NOT honored when leaderId is pinned, only a leader-authored response widens
  permission; e2e over the REAL mailbox — blocked worker escalates → leader
  approves → worker proceeds, deny path stays blocked, empty inbox sends nothing,
  forged self-response not honored, idempotent re-broker grants nothing more.
  Absorption: Claude Code --agent-teams (leader-broker arm). What this is NOT: no
  task DAG (wave A) / no team-idle barrier (wave C) / no live denied-tool →
  escalation host binding yet (deliberate hold). Slice fence:
  src/subagent/coordination imports only @/shared + siblings (mailbox + permission
  decider are injected duck-typed ports — no @/mcp, no @/agent).
