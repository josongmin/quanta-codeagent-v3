purpose: |
  Capability B of multi-agent coordination (plan docs/plans/
  multiagent-coordination.md §2.B) — a leader-mediated permission escalation
  broker so a subagent that hits a denied tool can ESCALATE to the spawning
  agent (the leader) instead of failing hard. Claude Code `--agent-teams`
  parity (leader-broker arm; the task-dependency DAG + team-idle barrier are
  sibling waves A/C). Rides the EXISTING transport (subagent mailbox) and the
  host's EXISTING permission decide path — minimal new infrastructure.

  FLOW: a blocked worker sends a mailbox `request` whose `body` is an escalation
  envelope `{tool, scope, reason}` (JSON), addressed to the leader, carrying a
  `correlationId`. The leader's `brokerLoop` reads its pending requests, runs
  each through the injected `EscalationDeciderPort` (the host wraps `@/permission`
  decide / HITL), and sends a `response` back with the SAME `correlationId`. The
  worker matches by correlationId and applies the decision it did NOT author.

  PURE CORES (`src/subagent/coordination/broker.ts`, no I/O, NO-THROW):
  `parseEscalationRequest(msg)` typed-parses a `request` envelope (rejects a
  non-request kind / malformed JSON / missing string fields — undefined, never
  thrown); `buildDecisionResponse(req, decision)` round-trips the SAME
  `correlationId`; `brokerStep(pending, decide)` is the pure loop body (maps each
  parseable request → one decision response; skips malformed; survives a throwing
  decider). `EscalationDeciderPort` is the injected, DUCK-TYPED decision seam (the
  leader owns it; the worker never sees it) so the `src/subagent/**` biome fence
  holds without a hard `@/permission` import. `brokerLoop` is the thin effectful
  leader-side driver over the injected (duck-typed) `BrokerMailbox`.

  SECURITY (load-bearing, plan §5): the broker is a GRANT path. The worker-side
  `applyDecisionResponse(msg, expectedCorrelationId, {leaderId})` honors a
  decision ONLY when the message is a `response`, its `correlationId` matches the
  worker's OUTSTANDING request, AND (when `leaderId` is pinned) it was authored
  by the LEADER. A worker can NEVER self-grant: a self-authored `request`/
  `broadcast`, or even a `response` the worker forged itself, is rejected. Grants
  flow from the higher-authority source only (mirrors the H2/B2 provenance
  posture).

  WIRING (LIVE): knob-gated `QUANTA_TEAM_BROKER` — OFF (unset) ⇒ a denied worker
  tool stays a hard failure (byte-identical; no broker, no envelope on the wire).
  ON ⇒ the composition root (`src/agent/subagent-runner.ts#maybeWireCoordinationBroker`)
  injects a `GateEscalationBroker` onto each worker subagent's
  `admissibility.coordinationBroker`, built by
  `src/agent/coordination-broker-wire.ts#buildLeaderHitlBroker` over the LEADER's
  `onConfirm` authority + the shared mailbox + a deterministic correlation-id
  source. When a worker's tool hits the mode-policy SOFT-deny arm
  (`src/agent/admissibility-gate.ts#runModePolicy`), the gate — after re-verifying
  `hardDenyReason(action) === null` — calls `broker.escalate({tool,scope,reason})`.
  That runs the REAL round-trip: emit a `request` (audit), `leaderDecide` (wraps
  the leader's HITL/onConfirm), `buildDecisionResponse` (from=leaderId), then
  `applyDecisionResponse(..., {leaderId})`. On approval the gate ADMITS (routing
  through the pre_tool_use hook); on denial/throw the worker stays blocked
  (fail-closed). SECURITY: HARD_DENY is STRUCTURALLY never escalatable (it returns
  at `earlyHardDeny` / inside the HITL branch before mode-policy, and the gate
  re-checks); the grant authority is the injected leader `onConfirm` (a worker
  cannot self-grant; `applyDecisionResponse` pins `leaderId`).
