id: mcp-tool-annotations-content
title: MCP ToolAnnotations ingestion + non-text content blocks (§19.1 / §19.3)
section: 9
subsystem: MCP ingestion boundary (annotations trust-gate + image/document media)
order: 130
maturity: L3
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "absorbed:codex", "absorbed:claude", "absorbed:cursor", "default-off", "security-critical"]
depends_on: []
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 5/6 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure internal ingestion/trust-gate + media codec, no distinct UI affordance — only enriches/classifies an existing tool result"
purpose: |
  Closes two MCP-ingestion gaps where quanta dropped protocol richness the
  server sent.

  §19.1 — MCP `ToolAnnotations` (readOnly/destructive/idempotent/openWorldHint)
  were never parsed, so EVERY bridged MCP tool was hardcoded
  `isReadOnly:()=>false, isConcurrencySafe:()=>false` — a `readOnlyHint:true`
  server tool wrongly defaulted to the always-confirm HITL tier and could not
  join a read-only parallel batch. Now `sanitizeAnnotations` lifts ONLY real
  JSON booleans (a poisoned `"true"`/`1`/`{}`/`null` is DROPPED, never coerced)
  into `McpToolDef.annotations`, and the bridge maps them to predicates under a
  TRUST GATE: `honored = QUANTA_MCP_TOOL_ANNOTATIONS knob ON && the server's
  `McpServerConfig.trusted===true`. `isReadOnly = honored && readOnlyHint===true`;
  `isConcurrencySafe = isReadOnly && idempotentHint!==false`. Annotations may
  ONLY ELEVATE a trusted server's tool — never downgrade safety. An UNTRUSTED
  server, knob-off, poisoned-non-boolean, or absent-annotation path is
  `false/false`, byte-identical to the pre-§19.1 bridge (a hostile server's
  self-declared `readOnlyHint:true` can NOT escape HITL or run in parallel).

  §19.3 — non-text result content blocks (`image`, embedded `resource`) were
  discarded by `joinTextBlocks` (text-only). The `ContentBlock` shape is
  extended and `extractMedia` lifts them into `McpCallResult.media?` (OPTIONAL —
  absent when text-only ⇒ byte-identical). The bridge maps image blocks to the
  native `ToolResult.images` sink applying the SAME inbound safety the native
  vision tools enforce (5 MB `READ_IMAGE_MAX_BYTES` cap + magic-byte
  `sniffMediaType` classification — a spoofed `mimeType` cannot smuggle a
  non-image/oversized blob; over-cap/unrecognized/bad-base64 is SKIPPED with an
  honest marker, never crashes), and embedded resource blocks to
  `ToolResult.documents`.
evidence:
  code:
    - src/mcp/types.ts
    - src/mcp/client.ts
    - src/mcp/isolated-client.ts
    - src/mcp/index.ts
    - src/agent/mcp-bridge.ts
    - src/runner/knobs/knobs/mcp-tool-annotations.ts
  adrs: []
  tests:
    unit:
      - tests/unit/mcp/tool-annotations-parse-hellgate.test.ts
      - tests/unit/agent/mcp-bridge-annotations-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: env QUANTA_MCP_TOOL_ANNOTATIONS
    type: 'boolean'
    default: 'off (unset)'
    notes: 'Master switch (knob id `mcp-tool-annotations` → AgentConfig.mcpToolAnnotations). When ON, a `trusted:true` server''s ToolAnnotations are honored for isReadOnly/isConcurrencySafe. Off/absent ⇒ every MCP tool stays false/false (byte-identical).'
  - name: McpServerConfig.trusted
    type: 'boolean?'
    default: 'false (untrusted)'
    notes: 'Per-server host-declared trust. The SECOND gate: annotations are honored ONLY for a trusted server AND the knob ON. Untrusted ⇒ annotations never relax a predicate.'
deliberate_hold:
  reason: |
    §19.2 (`structuredContent` + result `_meta`) is NOT implemented in this
    slice — still OPEN. Audio content blocks are recognized in the extended
    ContentBlock shape but NOT plumbed (no `ToolResult` audio sink yet).
  promotion_path: |
    Wire MCP `structuredContent`/`_meta` into the existing native
    `ToolResult.structured` + `outputSchema` seam; add a `ToolResult` audio sink
    then map MCP `audio` blocks in `extractMedia`/`mediaToResultFields`.
notes: 'SECURITY-CRITICAL trust boundary: the hellgate IS the point. red-on-injection cases prove an untrusted (or knob-off, or poisoned-hint) server cannot make its tool read-only/parallel/HITL-exempt. Image media reuses the native vision 5 MB cap + magic-byte SSOT so a lying mimeType is overridden by the sniffed type.'
