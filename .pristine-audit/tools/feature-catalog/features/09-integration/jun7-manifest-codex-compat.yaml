    where: src/shared/runtime-config.ts (manifestCompat, gateOnStrict === "1") → src/skill parsePluginManifest / parseSkillMarkdown / discover.toSkill
    default: "false (unset)"
    purpose: strict opt-in to codex-shape INGEST. Default-OFF ⇒ strict schemas reject codex artifacts exactly as today (byte-identical). ON ⇒ the normalizer renames/coerces SHAPE only (never widens a grant) and the relaxed-outer/strict-inner schemas accept the real codex plugin/skill files.
