purpose: |
  quanta claims "Faithful absorption of the Codex plugin layout" but its strict
  Zod schemas EMPIRICALLY REJECT the real Codex 0.135 artifacts in
  `.extracted_source`: (1) `plugin.json` `"skills": "./skills/"` is a STRING (schema
  wants `string[]`); (2) top-level `"repository"` is rejected by `.strict()`;
  (3) `SKILL.md` uses kebab `allowed-tools:` (YAML BLOCK-LIST) + `user-invocable:`
  while quanta wants camel `allowedTools`/`userInvocable`, AND `discover.ts` reads
  only the camel key so a kebab tool-allowlist is SILENTLY DROPPED at scoping time
  (a safety field vanishing without error).

  Two-layer, strict-opt-in, default-OFF byte-identical INGEST compat:
  - Layer 1 — pure normalizer (`manifest-compat.ts`): string `skills` → array;
    kebab→camel rename of ONLY the two enumerated keys (frozen `SKILL_KEBAB_RENAME`
    = allowed-tools/user-invocable; NOT a generic auto-caser); on a kebab/camel
    collision the NATIVE camel wins (a broad kebab cannot widen a narrow native).
  - Layer 2 — relaxed OUTER schema (`PluginManifestCompatSchema` /
    `SkillFrontmatterCompatSchema`): `.strict()` → `.strip()` (unknown top-level
    keys DROPPED, never interpreted) + additive optional `repository`
    (string-URL | {url,type?}) + `userInvocable` default false (conservative) +
    foreign-ingest defaults for the quanta-only category/stability/allowedTools
    (skill/experimental/[] — [] grants NO tools). The SECURITY-load-bearing INNER
    blocks stay `.strict()` UNCHANGED (MCPServerSpec, PluginInterface capabilities
    enum, allowedTools element shape, Capability enum), so loosening the outer
    schema CANNOT widen any grant. The strict `splitAndCollect` parser learns the
    codex `allowed-tools:` block-list via a compat-only lookahead; `discover.ts`
    renames the kebab key before `declaredAllowedTools`, fixing the silent drop.

  Posture: the Knobs phase shipped `QUANTA_MANIFEST_COMPAT` as `gateOnStrict`
  (`=== "1"`, default-OFF) — OVERRIDING the ticket §4.c "no knob / always-on"
  recommendation, because loosening manifest validation is a (safe-by-construction)
  loosening. Absent the knob every path is byte-for-byte the pre-ticket behavior:
  codex artifacts still REJECT; quanta-native files parse identically. Operators
  opt in with `QUANTA_MANIFEST_COMPAT=1`.
