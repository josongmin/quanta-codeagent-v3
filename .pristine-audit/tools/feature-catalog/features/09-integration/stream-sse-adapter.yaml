purpose: |
  Serializes every `AgentEvent` as a spec-correct Server-Sent Events frame:
  one `id:` line (per-frame monotonic counter), one `event:` line (the
  discriminant), one-or-more `data:` lines, terminated by a blank line.
  Transport-agnostic: `SseSink` is just `{ write(chunk) }` — a real HTTP
  handler passes a response writer, tests pass an in-memory buffer.

  Multiline handling: `JSON.stringify` never emits raw newlines (escaped as
  `\\n`), so a single `data:` line is always correct in practice — but the
  serializer DEFENSIVELY splits the payload on `\n` into one `data:` line
  each (per the SSE spec, a literal LF would otherwise be parsed as a
  frame-internal record boundary). Robust if a future serializer ever
  produces embedded newlines.

  Security-by-default: every event is routed through `@/shared`
  `redactValue` BEFORE serialization so secret values
  (`tool_call.input` / `tool_result.preview` + `stderrTail` /
  `assistant_text.delta` / `error.message` / …) never reach the wire.
  `redactValue` preserves shape — only string/keyed values are masked.

  Lifecycle: `close()` flips a `closed` flag (idempotent). Subsequent
  `emit()` / `comment()` are SILENT NO-OPS — chosen over throwing so a
  late event from the agent can never crash an already-finished response.
  Injectable `now` callback for deterministic ids/timestamps in tests.
