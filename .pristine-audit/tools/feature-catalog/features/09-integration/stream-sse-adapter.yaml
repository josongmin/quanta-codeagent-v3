notes: |
  Pairs with `tee` (fan-out) and `JsonlRecorder` (file sink). SSE is the
  Web surface's wire format — the loop emits events into a TeeStream that
  contains an SseStream pointed at the HTTP response writer; the client
  reconstructs the event stream from the `event:`/`data:`/`id:` frames.
  Keep-alive comment line (`: <text>`) supported and similarly no-op once
  closed.
