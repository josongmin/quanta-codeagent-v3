id: mcp-tasks-capability
title: ADR-0196 MCP Tasks Capability (rmcp 0.15 standard)
section: 9
subsystem: MCP client capability negotiation
order: 196
maturity: L2
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: [absorbed:cursor, absorbed:claude, absorbed:codex, surface:core]
depends_on: [mcp-client-jsonrpc]
surface_integration:
  cli: full
  web: full
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 10/14 evidence file(s) reachable from src/apps/cli/index.ts import graph"
