purpose: |
  Cursor + Claude + Codex 3-vendor 강신호 — rmcp 0.15 표준 MCP Tasks
  capability 흡수. 4 method: tasks/list (cursor pagination) / tasks/getInfo
  (task_id → status) / tasks/getResult (task_id → result|error) / tasks/cancel
  (task_id → ok|not-cancellable). TaskState 5-arm (pending/in_progress/
  completed/failed/cancelled). Capability negotiator port — `defaultNegotiator`
  emits {} (byte-identical) vs `fullNegotiator` emits {tools/sampling/elicitation/
  tasks}. JSON canonical key 정렬. ENV `QUANTA_MCP_CAPS=full` opt-in.
  자체 client.ts 확장 — @modelcontextprotocol/sdk install 차단 (lib swap 1줄 후속).
