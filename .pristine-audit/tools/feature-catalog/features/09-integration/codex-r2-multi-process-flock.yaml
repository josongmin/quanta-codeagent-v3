purpose: |
  Closes ADR-0348 single-writer assumption. Per-session lockfile
  (`<storageDir>/<sessionId>/.lock`) acquired via Node `wx` flag
  (O_CREAT|O_EXCL|O_WRONLY|0o600) so concurrent quanta instances
  serialize disk writes per sessionId. Stale-lock detection at
  30s mtime threshold reclaims locks abandoned by crashed processes.
  Disk-store gates every meta/events/cache mirror write on the lock
  promise; acquire failure (timeout/fs error) degrades to memory-only.
  Process-local refcount holder map keeps the lock re-entrant for
  same-PID callers so ADR-0348's existing "two registry instances
  same PID" tests pass unchanged.
