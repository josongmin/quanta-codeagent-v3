purpose: |
  Dynamic connector catalog backed by `GET {baseUrl}/connectors`. Replaces the
  hand-curated static stdio MCP list with a server-driven registry. 24h
  positive cache (RFC 8414 §4 SHOULD anchor). On 5xx/network failure: serves
  stale cache and returns `cached-degraded` from `refresh()` (honesty contract
  — caller branches on outcome). On TTL-valid hit: returns `cached-fresh`
  (no network call). In-flight refresh coalescing: concurrent `refresh()` calls
  share one HTTP request (mirrors `src/auth/chatgpt-oauth/refresh.ts` invariant).
  Shape validation rejects malformed entries (`id`/`host`/`auth` arm) at parse
  time. `createInMemoryConnectorRegistry(seed)` test impl shares the surface.
  Closed-port discipline: `FetchPort` / `ClockPort` / `CachePort` all injected.
  Slice has ZERO `globalThis.fetch` or `node:fs` import-time coupling. `src/mcp/`
  (stdio MCP) UNCHANGED — connectors slice is additive.
evidence:
  code:
    - src/connectors/types.ts
    - src/connectors/rest-registry.ts
    - src/connectors/in-memory-registry.ts
    - src/connectors/index.ts
  adrs: ["docs/decisions/0160-connectors-rest-api.md", 130]
