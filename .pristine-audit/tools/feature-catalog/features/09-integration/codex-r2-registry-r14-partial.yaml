purpose: |
  R14 partial closeout — 3 of 6 follow-ups landed; 3 deferred to R15 due
  to API instability (R14 W-A + W-B agents both lost ~48 tool uses to
  ConnectionRefused before commit). ADR-0378 surfaces post-sweep SQLite
  WAL size via `SweepResult.walSize` + emits `codex_r2.sqlite.wal_bytes`
  gauge — closes the observability gap that ADR-0375 threshold tuning
  needs (operators measure actual workload before guessing). ADR-0379
  adds `/session-registry cleanup` for manual on-demand sweep — delegates
  to ADR-0369 `startAutoSweep().sweepNow()` + stop() in finally to
  prevent timer leak. ADR-0383 ships `getOrCreateRegistry(opts)` unified
  mint API — additive non-breaking, opts-driven routing between ADR-0347
  global singleton and ADR-0372 caller-owned-with-telemetry; case F
  (emitter-alone) explicitly routes to global to avoid the anti-pattern
  ADR-0368 rejected.
