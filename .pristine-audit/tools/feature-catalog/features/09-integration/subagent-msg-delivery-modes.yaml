knobs:
  - name: QUANTA_SUBAGENT_FOLLOWUP
    where: src/agent/optional-ports.ts
    default: 'false'
    purpose: |
      REUSED (not new) — the existing targeted-control gate. ON ⇒ `followup_task`
      registered + the control endpoint (wake/interrupt) wired. queue + interrupt
      modes ride this gate; behavior for those two is byte-identical to the pre-RFC
      followup baseline. CLI default-ON; bench/web opt-in.
  - name: QUANTA_SUBAGENT_STEER
    where: src/agent/optional-ports.ts
    default: 'false'
    purpose: |
      The ONLY genuinely-new gate — the child-steer plane (shared steer retention +
      finalization port over the session mailbox) + the loop post-stream safe-point
      drain. Default OFF ⇒ `mode:"steer"` is REJECTED as `mode_disabled` (never a
      silent queue), no child conversation-action surface / steer plane allocated,
      and the `runTurn` safe-point branch is byte-identical (guarded on
      `config.childSteerDrain !== undefined`). ON ⇒ targeted steer admits + applies
      at the safe point. The real-loop integration rail covers enabled and default-off behavior.
notes: |
  Owner-local hellgates GREEN (verified 2026-07-18, integrated WS1–WS5):
  contract 8 · control-endpoint 14 · controller 23 · steer-safepoint 15 ·
  introspect 33 (+ turn-interrupt/turn-wake-gate baseline preserved) — 165 pass
  across the campaign suite; src typecheck clean (forced recompile). Non-vacuity
  pinned by red-on-injection on each workstream (WS2 interrupt outcome, WS3
  reject-before-mutation, WS4 safe-point re-stream, WS5 boolean-gone unknown-key).

  Adversarial hellaudit R1 (cross-workstream seam hunt) found + FIXED 2 real bugs
  the per-workstream green rails missed (fake endpoints hid the real seam):
  HIGH-1 — followup_task(mode:"steer") THREW on its happy path (the tool omits
  expectedTurnId → controller submitted "" → the steer authority's assertRequestShape
  throws); fixed by resolving the omitted id to the child's live turn
  (endpoint.currentTurnId) + defense-in-depth in submitSteer, pinned by a
  real-endpoint regression (red-on-injection confirmed). MED-2 — a followup-on/
  steer-off child leaked a conversation-action port (RFC §9 byte-identity break);
  fixed by gating that allocation on the steer plane, with a paired-control test.
  Post-fix: 246 pass, src typecheck + file-scoped biome clean.

  STRUCTURAL REPAIR (verified 2026-07-20): finalization uses a claim/commit
  retention protocol; throwing mailbox adapters terminate as correlated
  `failed(mailbox_error)` receipts and throwing receipt sinks cannot poison the
  loop. `followup_task` separates pending admission from final application and
  preserves `deliveryId`. `TurnWakeRegistry` now stores one discriminated
  registration cell per task, eliminating endpoint/label/waker split-brain.

  OBSERVABILITY: the existing jul-15 peer-message stream substrate is landed.
  Delivery lifecycle uses a distinct typed `subagent_delivery` event so content
  mail and control receipts are not conflated. Admission and finalization share
  `deliveryId`; recorder, item projection, stdout, and CLI timeline consumers are
  wired in the same change. Explicit browser rendering remains unverified.

  SCOPE / DEFERRED (honest):
  - WS7 real-loop integration covers 5 scenarios and promotes this to L3. It is a
    deterministic in-process real child-loop rail, not an external CLI/browser smoke.

  Absorption map: Codex `followUpQueueMode: queue|steer|interrupt` → the `mode` axis;
  `turn/interrupt` + `multi_agents_v2/interrupt_agent.rs` → the endpoint `interrupt()`
  over the per-turn gate (report-and-continue, NOT `forceStop`); `turn/steer` +
  steerable-turn guards → the safe-point drain honoring `steer()`'s review/compact/
  standalone rejections; "direct input not allowed for v2 sub-agents" → the closed
  typed endpoint (no mutable-state leak). What this is NOT: no second mailbox, no
  second policy/fallback table (the steer→delivery bridge `steerRejectionToDelivery`
  reuses the `SteerRejectionReason` SSOT), no terminal-kill reuse for interrupt.
