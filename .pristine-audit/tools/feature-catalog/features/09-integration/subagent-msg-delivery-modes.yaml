    cli: "followup_task is a gated LLM tool (QUANTA_SUBAGENT_FOLLOWUP, CLI default-ON); queue/steer/interrupt traverse the real delivery controller, control endpoint, child loop, and correlated receipt path in tests/integration/subagent-delivery-modes-real-loop-e2e.test.ts. Steer admission returns pending status + deliveryId without claiming an effective mode; admission and every terminal receipt are correlated through the typed subagent_delivery stream event, with terminal receipts also on the operator-notice bus."
