purpose: |
  Codex's `followUpQueueMode` (`queue | steer | interrupt`, corpus-verified in
  `.extracted_source/codex-ide` — `turn/steer` + `turn/interrupt` RPC +
  `multi_agents_v2/interrupt_agent.rs`) absorbed onto quanta's EXISTING targeted-
  delivery substrate. RFC docs/plans/jul-18-subagent-message-delivery-modes-rfc.md.
  quanta ALREADY had a passive peer mailbox, targeted `followup_task` wake, a
  per-turn interrupt gate, and a `steer()`/`ActiveTurnState` authority — those are
  REUSED, not rebuilt. This slice adds ONE canonical typed command contract across
  them and the genuinely-missing capability: targeted child STEER.

  TWO ORTHOGONAL AXES (`src/shared/delivery-mode.ts`): `mode` (queue|steer|
  interrupt = WHEN the child's model receives the message) and `activation`
  (passive|ensure-turn = whether an idle child is scheduled). `subagent_send_message`
  stays queue+passive; `followup_task` is ensure-turn and accepts all three modes.

  CANONICAL CONTRACT (`src/agent/subagent-delivery/`): one decide/apply controller
  (`SubagentDeliveryPort`) validates target/lineage/self BEFORE any mutation (every
  reject is pre-mutation), resolves task-id → mailbox label + control endpoint, and
  applies EXACTLY ONE of mailbox-enqueue / per-turn interrupt / steer-submit. The
  outcome taxonomy is closed and honest: `applied` / `accepted (steer_pending)` /
  `degraded (typed reason)` / `rejected (typed reason)` — no boolean `ok`, and every
  runtime downgrade (e.g. steer on a non-steerable turn) is a typed `degraded`
  carrying requested vs effective mode, never a silent success.

  SANCTIONED CONTROL ENDPOINT (`src/agent/subagent-control-endpoint.ts` +
  `TurnWakeRegistry` superset): each running child registers ONE typed endpoint
  (wake / interrupt / steer) under its task id; the endpoint exposes closed commands
  only — no mutable `ActiveTurnState` / `ConversationActionSurface` / `AbortController`
  handle escapes to callers (Codex "direct app-server input is not allowed for v2
  sub-agents" posture). `interrupt()` reuses the per-turn abort (NOT terminal
  `forceStop`, which stays a distinct kill) so the child reports-and-continues.

  TARGETED STEER (`src/agent/loop/{turn-iteration,same-turn-engine}.ts`): admitted
  steer is consumed at a POST-STREAM SAFE POINT — before `runTurn` honors a final
  `end_turn`, a pending steer is injected and the SAME turn re-streams one more
  model call (no abort, no mailbox duplicate). A `SubagentSteerFinalizationPort`
  guarantees every accepted steer terminates in EXACTLY ONE correlated receipt
  (applied / degraded-fallback / cancelled / failed); an interrupt racing an accepted steer
  supersedes it (`superseded_by_interrupt`) with the steer preserved via one mailbox
  fallback. Remote-steer admission is bounded (`action_queue_full` /
  `same_turn_budget_exhausted`).

  TRUST: all modes route the body through the ONE peer formatter
  (`src/agent/subagent-mailbox/peer-inbox.ts` `formatPeerBody` — redact → escape →
  `[teammate <from> — untrusted]`); steer never injects a raw trusted user string.
