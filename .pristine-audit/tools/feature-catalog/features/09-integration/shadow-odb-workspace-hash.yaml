purpose: |
  Deterministic SHA-256 hash of a normalized absolute workspace path,
  truncated to the first 16 hex characters (64 bits). The result is the
  on-disk directory name for that workspace's shadow ODB, e.g.
  `~/.quanta/snapshots/3a7f9c1b2e8d4a6b/`. 64 bits gives ~1-in-2^32
  collision odds across ~4.3 billion workspaces — vastly over-budget for
  a single user's machine — while keeping the directory name short
  enough to read at a glance. Determinism invariant: same absolute path
  ⇒ same hash; different paths ⇒ different hashes (HELL-2 / HELL-3
  enforce this). Trailing slashes are normalized first so `/foo` and
  `/foo/` collide deterministically. Uses node `crypto.createHash`
  rather than `crypto.subtle.digest` so the function stays sync — the
  caller is already async, but a sync hash makes the determinism
  invariant trivial to assert in tests.
