notes: |
  Callers must hand in an already-resolved absolute path — we do NOT
  realpath here because the symlink-rejection invariant (HELL-8) needs
  to fire *before* the hash. Pairs with `shadow-odb-foundation` (the
  rewindable working-tree snapshot store) and `shadow-odb-lru-cleanup`
  (the on-disk size cap that evicts the oldest workspace dirs).
