id: mcp-auto-restart
title: ADR-0435 MCP crash-detection + auto-restart (exponential backoff)
section: 9
subsystem: MCP (ADR-0007 / ADR-0435)
order: 435
maturity: L4
status: stable
ui_surfaces: [api]
monitoring: integrated
modes: [n-a]
configurable: integrated
config_refs:
  env: [QUANTA_MCP_AUTORESTART]
owners: ["@songmin"]
labels: ["surface:cli"]
depends_on: [quantamcpconfig]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 12/12 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "internal crash-detection/auto-restart resilience primitive; the restart is invisible and emits no bridged event, no UI affordance"
purpose: |
  Detects an MCP server crash (transport/process exit) and auto-restarts it —
  re-spawn → re-`initialize` → re-`tools/list` — swapping the live client behind
  a stable `mcp__<server>__<tool>` indirection so bridged tools keep working
  across restarts. Absorbs Cursor `mcpProcessMain.js`: 2-phase capped-exponential
  + full-jitter backoff (fast-retry → periodic-retry), a stability threshold that
  resets attempt counters after a clean run (flapping guard), a restart-storm cap
  that gives up into a permanent DEGRADED state, and a `restartEpoch` stale-guard
  (Cursor connectionGeneration) so a late async start after stop() is discarded.

  Closed-port: `now`/`setTimer`/`random`/`factory` are all injected — the
  supervisor core has NO real timers and NO global RNG/clock. Every timing
  constant lives in a typed `BackoffPolicy` (`DEFAULT_BACKOFF_POLICY`) with a
  documented Cursor-traced rationale; there are no magic thresholds.

  Default-OFF / byte-identical: absent `QUANTA_MCP_AUTORESTART`, `loadMcpTools`
  runs the original single-client path and the client `onExit` fan-out is a
  zero-subscriber no-op — MCP behavior is unchanged. Pending-call policy is
  fail-fast by default (same `"…is not running"` error today's callers see),
  with an opt-in at-most-once `queue` mode.

  Supervised-tasks follow-up (CLOSED): the ADR-0431 `tasks/*` surface is now
  bridged on the supervised path too. The supervisor exposes
  `serverSupportsTasks()` (reads the CURRENT live client) + `requestRaw()` (the
  outbound mirror of `callTool`, re-resolving the live client per call), and
  `supervisedTasksToolsFor(sup)` builds the `mcp_task_*` tools over the supervisor
  via the shared `tasksPortOver(rpc)` codec — so a tasks call always lands on the
  client live at call time and survives an auto-restart with NO stale capture.
  Gated identically to the default path (present only when the current server
  advertises `capabilities.tasks`); a client lacking the optional tasks surface
  (e.g. the isolated client) ⇒ no tasks tools (byte-identical default-OFF).
