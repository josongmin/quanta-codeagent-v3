knobs:
  - name: QUANTA_MCP_AUTORESTART
    default: 'unset (OFF)'
    purpose: |
      Set to 1/true/yes to wrap every configured MCP server in a reconnect
      supervisor. Unset ⇒ byte-identical single-client path (no auto-restart).
deliberate_hold: null
notes: |
  Non-goals (RFC §3, deliberate): Cursor's Electron UtilityProcess process
  isolation is NOT reimplemented (quanta reuses its own spawn / @/plugin-isolation
  isolation); remote dynamic config (Statsig) is rejected for static per-server
  config; active health-probe polling and dynamic tool re-registration are
  follow-ups. The first-load tool set is fixed at session start — a restart that
  drops a tool fails that call (server -32601) rather than mutating the registry.
