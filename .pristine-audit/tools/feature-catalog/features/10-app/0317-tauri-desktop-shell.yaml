id: tauri-desktop-shell
title: Tauri macOS desktop shell — bun-daemon + screen-OCR sidecars + opt-in global hotkey (ADR-0317)
section: 10
subsystem: 데스크톱 surface (multi-surface 확장)
order: 317
maturity: L2
status: new
ui_surfaces: [tauri]
monitoring: planned
modes: [interactive]
configurable: integrated
owners: ["@songmin"]
labels: ["adr-0317", "surface:desktop", "tier:scaffold", "darwin"]
depends_on:
  - thin-surface-headless-core
surface_integration:
  cli: na
  web: partial
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "no src evidence (pure docs/tooling/tests) — no interactive-CLI code"
    web: "IS the desktop surface that hosts the web-frontend SPA and injects window.__QUANTA_CONFIG__ for the React app, but L2 scaffold never cargo-build-verified, zero tests, signing/notarization deferred (ADR-0317 negative invariants) — present but unverified, not shipping-wired"
purpose: |
  macOS-only Tauri 2.x desktop wrapper (`apps/tauri-shell/`) that hosts the
  web-frontend SPA, spawns the bun `quanta-web-daemon` and Swift
  `screen-ocr` sidecars from a default-DENY capability ACL, and registers a
  Cmd+Shift+Q global shortcut that is OFF by default (frontend must call
  `enable_hotkey` to opt in). Daemon supervisor picks a free local port +
  mints a 256-bit hex auth token at boot and injects them into the webview
  as `window.__QUANTA_CONFIG__ = { wsUrl, httpUrl, authToken }` so the
  React app talks to the per-app daemon instance. Nine `#[tauri::command]`
  surface points (`list_windows` / `capture_window` / `start_daemon` /
  `stop_daemon` / `daemon_status` / `daemon_info` / `enable_hotkey` /
  `disable_hotkey` / `hotkey_status`) all return
  `Result<T, AppError>` where `AppError` serialises as `{ code, message }`.
  Crate is intentionally NOT in the root Cargo workspace (Tauri's transitive
  dep tree would slow `cargo check` for sibling sandbox helpers).
  `#![deny(unsafe_code)]` enforced; the "SIGTERM → 2s → SIGKILL" graceful
  shutdown ladder is truncated at SIGTERM (libc::kill would need unsafe) —
  restart-counter surfaces wedged children to the operator. Production
  signing / notarization, auto-update, and Linux/Windows targets are
  deliberately deferred (see ADR-0317 §Negative invariants).
evidence:
  code:
    - apps/tauri-shell/Cargo.toml
    - apps/tauri-shell/tauri.conf.json
    - apps/tauri-shell/capabilities/default.json
    - apps/tauri-shell/entitlements.plist
    - apps/tauri-shell/src/main.rs
    - apps/tauri-shell/src/lib.rs
    - apps/tauri-shell/src/daemon.rs
    - apps/tauri-shell/src/ocr.rs
    - apps/tauri-shell/src/hotkey.rs
    - apps/tauri-shell/src/commands.rs
    - apps/tauri-shell/src/error.rs
  adrs:
    - docs/decisions/0317-tauri-desktop-shell.md
  tests:
    unit: []
    integration: []
    contract: []
knobs:
  - name: QUANTA_BUN_PATH
    default: "(which bun)"
    purpose: |
      Override the `bun` binary path used by the optional system-bun smoke
      probe. The bundled standalone `quanta-web-daemon` sidecar does NOT
      depend on a system `bun` — this knob is only relevant for future
      diagnostics. Kept in `daemon.rs::resolve_bun()` as a non-dead-code
      reference so the env-driver path lands when the probe is wired.
deliberate_hold:
  reason: |
    L2 scaffold: source + manifests + ACL + ADR landed without `cargo
    build` (network-blocked agent cannot fetch crates). Operator-side
    smoke + tauri-driver e2e are explicitly deferred to a follow-up.
    Production signing/notarization, auto-update plugin, Linux/Windows
    bundles, libc::kill SIGKILL escalation, and the window-picker UI are
    out of v1 scope (each requires its own ADR).
  promotion_path: |
    L3 promotion: (1) operator runs `cargo tauri build` per README and
    confirms the bundle launches + daemon auto-starts + hotkey captures;
    (2) follow-up ADR adds `tauri-driver` headless e2e in CI (this is the
    test>=1 evidence L3 requires);
    (3) Developer ID + notarization pipeline lands so app-sandbox can be
    re-enabled.
notes: |
  L2: Rust/Tauri scaffold — source + manifests + ACL + ADR landed but the
  crate was never `cargo build`-verified (network-blocked) and has zero
  unit/integration/e2e tests. Demoted from L3 (overclaim — L3 requires
  tests>=1, and even the build is unverified); promotion to L3 is gated on
  the tauri-driver e2e in deliberate_hold.promotion_path.

  Slice MUST NOT mutate anything outside `apps/tauri-shell/`. The two
  sidecars are dropped into `binaries/` by upstream workers B (bun
  `--compile` of `src/apps/web-daemon/`) and E (Swift release build of
  `native/screen-ocr/`); README documents the 5-step build recipe. Icons
  in `icons/` are 1×1 placeholder PNGs — replace before shipping.
