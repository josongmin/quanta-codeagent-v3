  `usecases.ts` 편집 후 doc-sync 재실행이 표준 워크플로우. `escapeCell`이
  `|` escape + `\n` → space로 cell-safe 변환. `empiricalShare`는 column header
  옆에 percentage로 렌더. 의도적으로 작고 dep-free.
