id: composition-root-mega-wire-2026-05-25
title: Composition-root mega-wire — 11 subsystems, default-OFF (ADR-0236)
section: 10
subsystem: CLI
order: 10
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, ci-bot, ide, daemon]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:cli", "wire:composition-root"]
depends_on:
  - subagent-mode-typed
  - focus-chain
  - fork-session-port
  - slash-web-paste-edit
  - sticky-model-per-mode
  - tool-profile-preset
  - identity-mode-variant
  - playbook-trigger-cli-bind
  - automation-engine
config_refs:
  cli_flags:
    - "--tool-profile"
    - "--sticky-model"
    - "--identity-mode"
    - "--focus-chain-every"
    - "--no-auto-background"
  slash_commands:
    - "/profile"
    - "/identity"
    - "/focus-chain"
  agent_config_slots:
    - delegation
    - focusChain
    - forkSession
    - textInbox
    - planEdit
    - composerEdit
    - stickyModelStore
    - toolProfile
    - identityModeVariant
    - playbookTrigger
    - automationEngine
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 3/5 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "CLI flags + slash-command wiring; SlashPalette stubs do not execute (B2) and the flags have no web config surface"
purpose: |
  Wire 11 SOTA++ slices (ADR-0203/0211/0212/0213/0215/0218/0219/0224/0225/0226 +
  ADR-0203 inline-trigger watcher) into the agent composition root. Each lands
  as an OPTIONAL slot on AgentConfig (caller-side composition); only `focusChain`
  has agent-loop semantics (per-turn `tickTurn()` + `getInjection()` appended as
  user-message before the LLM call). The other 10 slots are slash- or
  surface-consumed. CLI flags + slash commands + 21-case hellgate.
evidence:
  code:
    - src/agent/types.ts                 # 11 optional AgentConfig slots
    - src/agent/loop.ts                  # focus-chain per-turn wire only
    - src/apps/agent/index.ts            # resolve* helpers + buildBaseFromArgs
    - src/apps/agent/cli-args.ts         # 5 new flags + validation
    - src/apps/cli/slash-commands.ts     # /profile, /identity, /focus-chain
  tests:
    unit: [tests/unit/tool-profile-preset-hellgate.test.ts]
    integration:
      - tests/integration/composition-root-wire-hellgate.test.ts
    contract: []
  adrs:
    - docs/decisions/0236-composition-root-mega-wire.md
defaults:
  delegation: absent (default-OFF)
  focusChain: absent (default-OFF, when present runs tickTurn per turn)
  forkSession: absent (default-OFF)
  textInbox: absent (default-OFF)
  planEdit: absent (default-OFF)
  composerEdit: absent (default-OFF)
  stickyModelStore: absent (default-OFF; --sticky-model wires fs-backed)
  toolProfile: absent (default-OFF; --tool-profile wires preset resolver)
  identityModeVariant: absent (default-OFF; --identity-mode wires registry)
  playbookTrigger: absent (default-OFF; never auto-bound)
  automationEngine: absent (default-OFF; never auto-ticked)
notes: |
  This row describes the bare unified-agent composition root only. The main
  REPL/CLI product path closes several of these slots downstream via
  `repl-slash-ctx-mega-wire`, `surface-composition-wire-r1`, the shared
  execution-plane builder, and session-memory-auto composition. Read this as
  base-wire truth, not as the full shipped interactive-surface inventory.
