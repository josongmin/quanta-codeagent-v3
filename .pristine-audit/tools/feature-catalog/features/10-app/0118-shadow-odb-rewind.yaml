purpose: |
  Closes the deliberate "not-implemented" trap from ADR-0108 by implementing
  rewindToLast (destructive workspace restore to last snapshot) plus a safety
  net: before rewind, the current workspace state is captured under a
  pre-rewind ref so the user can recover from accidental rewind. Adds
  RewindOptions / SnapshotMetadata types, listSnapshots inspector, and typed
  error codes (merge-in-progress, rewind-failed). Refuses to rewind across an
  in-progress merge.
