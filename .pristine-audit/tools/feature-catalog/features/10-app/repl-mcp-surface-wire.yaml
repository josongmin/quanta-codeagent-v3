id: repl-mcp-surface-wire
title: REPL `/mcp` surface translator (live CLI state → structural snapshot)
section: 10
subsystem: CLI REPL surface — /mcp slash data wire
order: 14
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: static
owners: ["@songmin"]
labels: ["surface:cli", "tier:repl"]
depends_on: [cli-repl-solid-split]
config_refs:
  env: ["QUANTA_MCP_CONFIG"]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 2/2 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "Feeds the CLI /mcp slash command only; SlashPalette server-routed commands are prefill stubs (B2) and there is no web handler nor MCP-surface render in apps/web-frontend, so it never reaches the browser."
purpose: |
  Sub-feature of `cli-repl-solid-split` umbrella — separately catalogued because
  this module is the ONLY translator between live CLI MCP wiring
  (`McpServerConfig[]` + bridged `Tool[]` + live `McpClient[]`) and the
  structural `McpSurfaceInfo` snapshot consumed by the `/mcp` slash command.

  Distinct semantics from the umbrella's other wire modules:
    - Slice-discipline: does NOT touch live `McpClient` (its proc/config are
      private by RFC) — pid/uptime stay `undefined` and the renderer skips them.
    - Lifecycle vocabulary: configured-but-not-bridged servers ⇒
      `status: "failed"` with a stable hint (loadMcpTools logs-and-skips).
    - Tool→server mapping via sanitized `mcp__<server>__<tool>` prefix
      (mcp-bridge's `mcpToolName` sanitizer — non-`[A-Za-z0-9_]` ⇒ `_`).
    - Returns `undefined` when no MCP configured AND no config path set so the
      REPL omits the surface entirely and `/mcp` prints "not wired in this
      surface" (same fallback as other surface-wired commands).

  7 internal helpers (sanitizeServerKey / stripPrefix / extractRequired /
  toolToInfo / buildServerInfo / buildMcpSurfaceInfo public API) — testable in
  isolation with plain object fixtures, no live spawn / live config required.
evidence:
  code:
    - src/apps/cli/repl/mcp-surface-wire.ts
    - src/apps/cli/internal.ts
  adrs: []
  tests:
    unit:
      - tests/unit/mcp-surface-wire.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  Carved out of the `cli-repl-solid-split` umbrella because it has its own
  dedicated unit test (`tests/unit/mcp-surface-wire.test.ts`, 90 LOC, 9
  references) and implements a named translator pattern distinct from the
  pure wire/composition modules in the umbrella. Other ~70-LOC wire helpers
  (idle-wire / status-pills-wire / turn-indicator-wire / turn-summary-wire /
  lifecycle-wire) remain in the umbrella — they are byte-identical extractions
  with no independent test surface.
