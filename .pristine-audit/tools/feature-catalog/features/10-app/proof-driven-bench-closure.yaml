purpose: |
  jun-17 proof-driven bench closure: assemble evidence → owner admission →
  verification plan → gate decision into a typed `ClosureBundle` SSOT, evaluate
  typed `SuccessPredicate`s on primary-rail observations, emit closure
  diagnostics (primaryRailPresent, requiredVerificationCovered,
  primary_false_green / primary_false_red), and render closure-aware prompts.
  Default-OFF knobs gate each lever; unset ⇒ byte-identical baseline.
