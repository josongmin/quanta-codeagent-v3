purpose: |
  Tier-1 of the 6-tier eval stack (umbrella id: `eval-five-tier`). Generates
  synthetic single-turn scenarios from declared `scenarios/` fixtures via
  `generator.ts` (deterministic schema-validated, distinct shape from
  trajectory replay), runs them through the real agent via `runner.ts`,
  and scores the output with `judge.ts` (LLM-rubric judge — distinct from
  Tier-4 pairwise compare which judges two CLIs at once). Token / cost
  capture is additive (eval-schema-additive) but the synthetic flow is
  the original consumer of those fields. Distinct user-facing capability:
  "does the agent solve a single declared scenario correctly?" answered
  by a numerical score per leaf node, persisted via `SyntheticPayload`.
