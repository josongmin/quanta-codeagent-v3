notes: |
  Sub-feature of `eval-five-tier` umbrella — separately catalogued because
  the synthetic tier is the only one with a scenario generator + LLM judge
  pair, its own scenarios/ fixture directory, and its own SyntheticPayload
  envelope variant. `eval-schema-additive` covers the keyed-metrics shape
  shared across tiers; this entry covers the runner+judge pipeline that
  populates it.
