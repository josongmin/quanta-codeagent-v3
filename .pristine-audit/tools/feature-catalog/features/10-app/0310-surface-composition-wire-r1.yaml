knobs:
  - name: QUANTA_CHECKPOINT_CONV
    default: "<unset>"
    values: ["on"]
    purpose: "Enables the ADR-0292 turn-end auto-record wire."
  - name: QUANTA_PLAYBOOK_TRIGGER
    default: "<unset>"
    values: ["on"]
    purpose: "Enables the ADR-0293 inline-trigger watcher."
  - name: QUANTA_TOOL_PROFILE
    default: "<unset>"
    values: ["write", "ask", "minimal", "code-only"]
    purpose: "Selects the active tool-profile (ADR-0213) for /profile."
  - name: QUANTA_IDENTITY_MODE
    default: "<unset>"
    values: ["default", "plan", "review", "audit", "architect", "editor"]
    purpose: "Selects the active identity mode (ADR-0211) for /identity."
  - name: QUANTA_FOCUS_CHAIN_EVERY
    default: "<unset>"
    values: ["positive integer"]
    purpose: "Builds the focus-chain tracker (ADR-0219) for /focus-chain."
deliberate_hold: null
notes: |
  Default-OFF byte-identical (RFC §1.2). When all 4 knobs are absent the
  projection key-set is byte-identical to pre-wire baseline. 20 hellgate
  cases / 92 expects / 0 fail.

  The slash dispatch closure is now built in surface-compose.ts (not in
  slash-surface.ts) because it needs to spread the ADR-0292
  (convCheckpoint) and ADR-0294 (sessionIo) augmentations into the
  SlashContext — the slash-surface.ts projection is owned by ADR-0291
  and intentionally kept narrow to that track's slots.

  Per-tool checkpoint slot stays omitted today (no upstream
  GranularRegistry source); held for a follow-up slice.
