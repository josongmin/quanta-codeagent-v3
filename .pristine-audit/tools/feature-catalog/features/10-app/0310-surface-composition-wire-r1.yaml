purpose: |
  Closes the REPL composition root for the 4 sibling tracks landed in
  the prior round (ADR-0291/0292/0293/0294). Each track shipped its
  contract + slash + adapter factory but never reached the surface
  composition path; this slice wires them through `composeSurfaceWires`
  so the slash commands actually work end-to-end when the operator
  opts in.

  Four wire families:

    1. ADR-0291 — 8 ctx adapters (planEdit / composerEdit / forkSession /
       perToolCheckpoint / profile / identity / focusChain / textInbox).
       Adapter factories called from surface-compose.ts; env knobs
       (QUANTA_TOOL_PROFILE / QUANTA_IDENTITY_MODE / QUANTA_FOCUS_CHAIN_EVERY)
       gate the upstream-port presence.

    2. ADR-0292 — turn-end auto-record + `/rewind-conv` history swap.
       `QUANTA_CHECKPOINT_CONV=on` constructs `startConvCheckpointWire`
       over a session-shared `ConversationCheckpointStore` (reused by
       the `/fork-checkpoint` adapter — single store per session).
       `session-loop.ts` calls `recordTurn(messages)` in both one-shot
       and interactive turn-end paths.

    3. ADR-0293 — `maybeStartPlaybookTriggerWire` lifecycle. The loop
       constructs a `PlaybookPlanQueueSink` around `ExternalPromptQueue`,
       attaches the handle to the `PlaybookTriggerSurfaceSeam`, and
       detaches in `finally` (idempotent — stops the watcher on abnormal
       shutdown).

    4. ADR-0294 — `SessionIoState` adapter for `/session`. Default
       adapter delegates to `loadSessionById`/`saveSessionById`
       (id-addressable V2 store) + `crypto.randomUUID()` for
       `mintNewId()`. Read failures surface as `null`; write failures
       rethrow so the slash exits 1 + ctx.err.

  Plus `prompt-pipeline.ts` now optionally drains a `TextInbox` on
  every accepted local prompt (ADR-0291 follow-through — `/web` +
  `/paste` enqueue, the next turn picks them up).
