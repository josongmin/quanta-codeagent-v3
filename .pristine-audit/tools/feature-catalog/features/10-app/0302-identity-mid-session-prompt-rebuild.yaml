id: identity-mid-session-prompt-rebuild
title: ADR-0302 — /identity mid-session system-prompt rebuild (closes ADR-0291 last-mile)
section: 10
subsystem: Runner-owned session prompt state + REPL surface composition
order: 72
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: integrated
