notes: |
  15 hellgate cases / 45 expects / 0 fail. tsc 0, biome 0.

  The canonical owner-wire hellgate mutation-proves that bootstrap calls the
  runner factory and writes `systemSource.set(rebuilder.rebuild())`; the real
  two-turn e2e proves the next LLM input changes after `/identity set audit`.

  No new closed enums or error codes; the typed fallback prefix
  ("(prompt rebuild failed: ") is a stable test target, not a public
  enum.
