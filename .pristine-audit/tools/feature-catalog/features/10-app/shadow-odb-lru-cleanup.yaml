purpose: |
  Bounded-disk policy for the shadow git ODB (ADR-0108). Sums the on-disk
  size of each per-workspace shadow directory under
  `<base>/snapshots/<workspaceHash>/` and, while the total exceeds
  `maxBytes`, removes the oldest one (by directory `mtimeMs`) until the
  cumulative size is at or below cap. Pairs with the workspace-hash
  derivation that gives each workspace a stable 16-hex (64-bit) directory
  name under `~/.quanta/snapshots/`.

  Safety invariants:
    - Reads / removes are SCOPE-FENCED to `<base>/snapshots/*`. Anything
      above that root (e.g. `~/.quanta/auth/`) is untouched.
    - Missing `snapshots/` directory ⇒ no-op (not an error).
    - Per-directory eviction failures are swallowed so a single permission
      glitch doesn't strand later cleanup work — best-effort by design.
    - Symlinks under our own snapshots are skipped during size calc.
  Determinism: same absolute workspace path ⇒ same 16-hex hash ⇒ same
  shadow dir; the dirSize/inventory walk uses `withFileTypes` so the size
  rollup is stable across calls.
