notes: |
  Distinct from the user-facing shadow tools (`shadow-tools-trio`,
  `slash-snapshot`, `snapshot-slash-cmd`): this is the housekeeping seam
  the host invokes to keep the disk budget bounded. 16-hex prefix gives
  ~1-in-2^32 collision over ~4.3B workspaces (birthday bound) — vastly
  over-budget for a single user's machine.
