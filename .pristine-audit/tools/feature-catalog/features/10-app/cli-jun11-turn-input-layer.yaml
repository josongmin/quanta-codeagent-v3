id: cli-jun11-turn-input-layer
title: jun-11 turn + input layer — line editing, LLM replay cassette, PTY e2e harness
section: 10
subsystem: CLI REPL — raw-mode editing + deterministic turn replay
order: 75
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: integrated
config_refs:
  env: [QUANTA_LLM_REPLAY]
owners: ["@songmin"]
labels: ["surface:cli", "jun-11", "default-off"]
depends_on: [llm-factory, stream-stdout-painter-hook, repl-interactive-surface, cli-jun11-repl-input-ux]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-11"
  evidence:
    cli: "line-edit-ops wired in raw-line-reader; QUANTA_LLM_REPLAY short-circuits createLLM to a JSONL cassette player; PTY harness drives real Ctrl+key paths without network"
    web: "terminal raw-mode + PTY turn replay; no browser equivalent"
purpose: |
  jun-11 P1/P3 hardening beyond confirm/paste (see `cli-jun11-repl-input-ux`):
  (1) #12 word/line editing — `line-edit-ops.ts` implements Alt+Backspace /
  Ctrl+W / Ctrl+U kill semantics on the raw-mode buffer (PTY-proven in
  `cli-input-layer-e2e`).
  (2) `QUANTA_LLM_REPLAY` — `createLLM` returns a cassette PLAYER when the env
  points at a JSONL file (request hash pinned to `"replay"` for single-turn
  fixtures). Unlocks turn-layer PTY e2e without API keys.
  (3) PTY harness — `tests/e2e-pty/pty-harness.ts` + `cli-input-layer-e2e` /
  `cli-turn-layer-e2e` assert rendered frames over a real pseudo-terminal
  (word edit, shift+tab cycle, @-mention dropdown, thinking DIM + answer text).
  Default-OFF: replay env absent ⇒ factory byte-identical; line-edit is always
  available but only observable when raw mode is active.
evidence:
  code:
    - src/apps/cli/line-edit-ops.ts
    - src/apps/cli/raw-line-reader.ts
    - src/apps/cli/welcome-banner.ts
    - src/llm/factory.ts
  adrs: []
  tests:
    unit:
      - tests/unit/cli/line-edit-ops.test.ts
      - tests/unit/llm/llm-replay-hook.test.ts
    integration:
      - tests/e2e-pty/cli-input-layer-e2e.test.ts
      - tests/e2e-pty/cli-turn-layer-e2e.test.ts
    contract: []
knobs:
  - name: QUANTA_LLM_REPLAY
    default: "false"
    purpose: "Path to JSONL replay cassette; when set, createLLM yields a deterministic player (no network)."
