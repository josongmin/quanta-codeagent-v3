purpose: |
  Caller seam that lets verify-pass events advance the Shadow ODB
  markVerified ref. Keeps mechanism (markVerified port from ADR-0122) and
  policy (when to call) separate so verify-guard can wire when its in-flight
  edits land. Helper-only module — no automatic wiring; hosts opt in by
  invoking the bridge after their verify step succeeds.
