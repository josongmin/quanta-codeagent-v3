knobs: []
deliberate_hold:
  reason: |
    The hex-palette resolver (getColorPalette) is an export-only data SSOT with
    NO live production consumer at the RENDER call-site. The /color slash wires
    the two daltonized theme STRINGS into VALID_THEMES (user can select + persist
    them) AND those names already resolve to a colorblind palette via
    getColorPalette — that enum↔palette binding is LIVE and pinned green by the
    theme-daltonized-drift drift guard. What is unwired is the DOWNSTREAM seam: no
    host renderer reads getColorPalette to map a selected theme onto the actual
    hex role colors. Confirmed by grep (only the unit test + the drift guard
    import getColorPalette; the sole production reference is a doc-note at
    runtime-config.ts:1328 stating the palette SSOT "exists and is unit-tested but
    NO production code reads it" at the render call-site). The hold is for that
    missing render-root consumer, not for any RED/pending drift test.
  promotion_path: |
    Wire getColorPalette into the host status/box renderer so a selected
    *-daltonized theme resolves to the colorblind-safe role hues at the render
    call-site; once a production consumer reads the palette, flip
    surface_integration.cli to "full" + drop this deliberate_hold.
notes: |
  Lives in src/apps/cli (the surface that owns /color), inside the existing CLI
  slice — no new tsconfig path / slice fence needed. COLOR_PALETTE_IDS is the
  frozen drift-guard list the unit test asserts against. Distinct entry from
  color-policy-resolver (which owns the ANSI on/off cache); this owns the hue
  data. ADR policy for this lane = none, so adrs is empty.
