purpose: |
  Colorblind-safe color palettes — a PURE DATA SSOT (ticket-15, §11.7 part B).
  Claude Code's settings `theme` enum includes `light-daltonized` /
  `dark-daltonized` (the REAL CC enum names, confirmed at
  `claude-code-settings.schema.json:2691`); Quanta adds the same two names to
  `VALID_THEMES` (the `/color` surface) and surfaces the underlying palette
  through `getColorPalette` so a host renderer CAN pick colorblind-safe hues.
  The numbers are NOT invented: the base 8-colour set is the **Okabe-Ito**
  "Color Universal Design" palette (Okabe & Ito 2008; Wong, Nature Methods 8,
  441, 2011) — the field-standard categorical set engineered to stay separable
  under the three common dichromacies. Per-condition variants re-use that same
  anchor set, re-ordered/pruned to the hues that survive best: deuteranopia /
  protanopia lean on the blue↔orange↔yellow axis; tritanopia on the
  red↔green↔purple axis; achromatopsia uses luminance-distinct greys only.
  `getColorPalette(theme)` is a pure total function — an exact palette id returns
  that palette; a generic light/dark/auto/claude or any unknown/empty value
  returns the `default` (full Okabe-Ito) palette. It uses `Object.hasOwn` (NOT
  the `in` operator) so prototype keys (`constructor`/`__proto__`/`toString`)
  cannot index `Object.prototype` members — guaranteeing "always a usable
  palette, never throws". PURE: no I/O, no imports, no env reads.
