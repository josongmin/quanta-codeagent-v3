    cli: "PARTIAL — the /color slash (registry-surface.ts:177) accepts the two daltonized theme STRINGS (VALID_THEMES carries light-daltonized/dark-daltonized) and persists them to prefs, but getColorPalette (the hex-palette resolver in this file) has NO production consumer: only the unit + drift-guard tests import it (runtime-config.ts:1328 doc confirms the host renderer does not yet resolve the palette at the render call-site)"
