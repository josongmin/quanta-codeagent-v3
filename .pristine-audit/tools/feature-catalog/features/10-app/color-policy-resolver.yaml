notes: |
  Distinct entry from the surface-agnostic UI helpers slice. ui-helpers.ts is
  the renamed former `src/apps/cli/auth-ui.ts` (commit fdf1c7c, refactor:
  rename auth-ui.ts → ui-helpers.ts). The class isolates color-cache state per
  surface; other helpers (renderBox, kvLine, statusPill, humanRel, expiryColor,
  stripAnsi/visibleWidth) remain module-level pure functions that consume the
  default resolver via `wrap()`.
