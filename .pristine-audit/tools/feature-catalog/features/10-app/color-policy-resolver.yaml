purpose: |
  Encapsulates the ANSI color-policy cache so multiple surfaces (CLI, REPL,
  Tauri renderer, parallel test harness) can keep isolated state instead of
  sharing one module-level cell. Resolution order on first use:
    1. Explicit override via `set(mode)` (test seam).
    2. `NO_COLOR` env present (https://no-color.org) → off.
    3. `FORCE_COLOR=1` → on.
    4. `process.stdout.isTTY` truthy → on, else off.
  The decision is cached so color state doesn't oscillate within one render.
  Module-level `setColorPolicy(mode)` + `wrap()` continue to operate against
  `defaultResolver` (byte-identical to pre-refactor); new callers that need
  isolation construct their own resolver.
