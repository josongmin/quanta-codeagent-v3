purpose: |
  Closes 8 default-OFF `ReplSlashCtx` slots so the corresponding slash
  commands render their real bodies instead of "not wired in this surface":

    - /edit-plan       → ctx.planEdit     (PlanStore wrapper)
    - /edit-message    → ctx.composerEdit (mutable composer text)
    - /fork-checkpoint → ctx.forkSession  (ADR-0226 defaultForker)
    - /rewind-tool     → ctx.perToolCheckpoint (registry + 3-way restore)
    - /profile         → ctx.profile      (ADR-0213 ToolProfileResolver)
    - /identity        → ctx.identity     (ADR-0211 mode-variant registry)
    - /focus-chain     → ctx.focusChain   (ADR-0219 FocusChainPort)
    - /web (inbox leg) → ctx.textInbox    (ADR-0224 TextInbox)

  Each adapter lives under `src/apps/cli/repl/ctx-adapters/` and is a
  thin closure over the upstream port. Default-OFF is enforced via
  spread-conditional projection — when the host omits a port, the ctx
  slot is omitted (byte-identical legacy projection).

  Adapter factories are pure (no IO, no clock reads at construction).
  Mutation lives only in two cells:
    - tool-profile  (active name)
    - identity-mode (active mode)
  Both are surface-state mutations; composition-root re-build is held
  for a follow-up slice.

  Per-tool-checkpoint adapter ships a typed stub for `restoreFiles/
  Task/Both` when the host only wires the granular registry; the stub
  returns `RestoreOutcome { ok:false, errorCode:"shadow-odb-not-
  configured" }` so the hellgate seals the contract shape today.
