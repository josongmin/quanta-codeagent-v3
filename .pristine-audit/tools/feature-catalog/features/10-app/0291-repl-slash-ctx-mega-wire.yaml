notes: |
  Default-OFF: every new field on `BuildReplSlashCtxArgs` is optional;
  the projection short-circuits when the upstream port is absent.
  20 hellgate cases / 77 expects / 0 fail.

  Slice fence preserved — `surface-compose.ts` is NOT modified by this
  ADR. Composition-root wiring is held for a follow-up slice so the
  REPL surface is byte-identical until the host opts in to the new
  args.

  No new closed enums or error codes are introduced; the stub restore
  port re-uses RestoreErrorCode.shadow-odb-not-configured (port.ts).
