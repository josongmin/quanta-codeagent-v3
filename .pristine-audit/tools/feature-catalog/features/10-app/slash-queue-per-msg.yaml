purpose: |
  Codex Desktop composer parity: each queued follow-up gets 4 per-msg
  mutators (retry / edit / delete / sendNow) over a `/queue` slash.
  ADR-0128 absorbed the structural queue + ADR-0037 the pause-reason
  vocabulary; this slice closes the operator-management gap. `sendNow`
  is the distinctive one — it bypasses the paused state and injects
  into the NEXT turn WITHOUT aborting the active one (steering bypass
  invariant, pinned by HELL-S3). DOF-40: the REPL composition root
  (surface-compose.ts) DOES wire a concrete SendNowSink over the loop-
  owned ExternalPromptQueue; the residual first-turn timing window (sink
  present, downstream target late-bound) is now FAIL-CLOSED — sendNow
  returns the TRANSIENT `send-not-ready` and KEEPS the entry rather than
  silently dropping it.
