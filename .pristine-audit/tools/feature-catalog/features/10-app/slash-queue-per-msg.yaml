deliberate_hold:
  reason: |
    DOF-40 UPDATE: the REPL composition root NOW wires a concrete
    SendNowSink over the loop-owned ExternalPromptQueue
    (surface-compose.ts `planQueueStore = defaultPlanQueueStore({sendNowSink})`,
    `ctx.planQueue` wired in the dispatch builder). The one residual is
    the first-turn LATE-BIND timing window: the sink closure exists at
    store construction but its downstream target
    (`setPlanQueueSendNow` → ExternalPromptQueue.push) is installed by the
    loop after this bundle is built. That window is now FAIL-CLOSED —
    sendNow returns the TRANSIENT `send-not-ready` and KEEPS the entry
    (never a silent drop; operator retries once the loop is up). The hold
    remains only because web parity (B2/B3 SlashPalette + SessionCommand
    queue verb) is still absent.
  promotion_path: |
    1. [DONE] REPL composition root constructs a SendNowSink over the
       loop-owned ExternalPromptQueue.
    2. [DONE] Pass the sink via `defaultPlanQueueStore({sendNowSink})` at
       session start.
    3. [DONE] Wire `ctx.planQueue` in the SlashContext dispatch builder so
       `/queue` is functional in the live REPL.
    4. [DONE — DOF-40] Make the first-turn late-bind window fail-closed
       (`send-not-ready`, entry kept). Owner: DOF-40 leaf.
    5. [RESIDUAL] Web-surface parity: add the `/queue` verb to SlashPalette
       + a SessionCommand queue verb and supply `ctx.planQueue` web-side.
notes: |
  Trailing-slot append to BUILTINS — no collision with `/rewind-tool`,
  `/fork`, or the W2-5 web/paste/edit cluster. The 4 mutator surface
  is opt-in: callers that never touch it observe byte-identical queue
  state vs ADR-0128's pre-mutator behaviour. `retry` is
  remove-and-re-enqueue (fresh id + enqueuedAtMs); `edit` validates
  trim-empty / >64KiB and runs collapse-with-sibling merge; `delete`
  cleans up empty thread keys; `sendNow` PROBES the sink before any
  queue mutation (DOF-40) so a TRANSIENT `send-not-ready` can KEEP the
  entry (fail-closed timing window), while a terminal outcome
  (delivered / sink-throw / no-sink / non-retryable reject → typed
  send-not-possible) removes it. No external libraries added — pure
  node:crypto + plane-clean type-only @/shared import.
