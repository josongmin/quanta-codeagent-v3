notes: '모드 추가는 의도된 drift signal — 6 exhaustive seam(union+ALL_AGENT_MODES / MODE_PRESETS+BUDGET_PRESETS Record / renderPackByMode switch / VALID_MODES / mode-presets 러너 / 72-cell 테스트) 전부 갱신 안 하면 tsc 또는 테스트 실패. 두 "ONLY mode" invariant는 집합 멤버십으로 확장(reviewer-backed={ide,interactive}, branch-only={ci-bot,daemon}). 러너는 sibling mode-preset import 금지(assemble 경유). In-repo L4 stop-point: 외부 host 어댑터(VS Code/Tauri ext + cron 스케줄러)는 별도 surface 트랙.'
