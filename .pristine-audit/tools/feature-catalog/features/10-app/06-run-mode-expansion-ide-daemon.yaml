id: run-mode-expansion-ide-daemon
title: Run-mode expansion — ide + daemon (C1, ADR-0092)
section: 10
subsystem: Unified Agent Runtime — 모드 매트릭스 (RFC may-22)
order: 6
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [ide, daemon]
configurable: n-a
owners: ["@songmin"]
labels: ["surface:cli"]
depends_on: [prompt-rules-mode-dispatch, branch-only-guard, effort-5-tier, repo-rules-tree, agent-cli-args-parser]
