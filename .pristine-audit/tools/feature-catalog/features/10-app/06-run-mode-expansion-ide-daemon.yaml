  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 3/6 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "run modes are external-host (VS Code/cron) and CLI selections; the browser surface does not expose a mode picker and these modes do not render in-browser"
purpose: |
  RFC may-22 4-mode(interactive/headless/batch/ci-bot) × 12-lever ModePolicy
  매트릭스에 2개 surface 셀 추가. ide = 에디터 임베디드(VS Code/Tauri):
  structured 이벤트 출력 + full-trajectory 관측 + reviewer-modal — interactive와
  함께 유이한 reviewer-backed 모드. daemon = 장기 스케줄 서비스(야간 PR 리뷰/웹훅):
  persistent 메모리(cron-to-cron) + per-instance worktree + allowlist 네트워크 +
  branch-only git — ci-bot와 함께 유이한 branch-only 모드. 두 모드 모두 12-lever
  컬럼 + BUDGET_PRESETS 컬럼 완비. branch_search(ADR-0084) default-on (ide N=3
  tsc+lint/60s, daemon N=3 tsc+lint+lsp_diag/90s). 기존 4모드는 byte-identical.
  AgentMode SSOT를 run-mode/types.ts로 통일 — prompt-rules의 중복 4-mode 열거 삭제.
  In-repo L4 promotion 2026-05-23 — full `runMode(ide)` / `runMode(daemon)` e2e
  smoke (InMemoryStream + scripted LLM): 12-lever vector binding, BUDGET_PRESETS
  post-clamp, branch_search default, sessionId 캐리, idempotent re-start, abort
  signal → exit 130, caller override semantics. 외부 호스트 어댑터(VS Code 익스
  텐션 / cron 스케줄러)는 mode-presets/{ide,daemon}.ts docstring에 명시된 contract
  대로 stream/onConfirm/messages/ideContextProvider를 주입 — 그 부분이 진정한 L5.
