purpose: |
  Read-only MCP runtime explorer. Four subcommands: `/mcp` (list servers + tool
  count + status), `/mcp tools` (every bridged tool across all servers),
  `/mcp tools <name>` (tools belonging to one server), `/mcp config` (current
  config file path + raw contents). The CLI is the only place that sees the
  raw `McpServerConfig[]`, bridged `Tool[]`, and live `McpClient[]`
  simultaneously — `repl/mcp-surface-wire.ts` is the translator that builds the
  STRUCTURAL `McpSurfaceInfo` snapshot the slash command consumes, so the
  command stays testable in isolation (no live spawn / config required) and
  future surfaces (Tauri/Web) can supply the same shape without dragging an
  MCP transport into their slice. Strictly read-only: NEVER starts/stops a
  server, NEVER edits the config file, NEVER calls a tool. Tool→server mapping
  uses the bridged tool's `mcp__<server>__<tool>` prefix sanitized exactly
  like `mcp-bridge.ts` `mcpToolName` so the join is byte-identical to the
  runtime form.
evidence:
  code:
    - src/apps/cli/mcp-cmd.ts
    - src/apps/cli/repl/mcp-surface-wire.ts
    - src/apps/cli/slash-commands.ts
  adrs: []
  tests:
