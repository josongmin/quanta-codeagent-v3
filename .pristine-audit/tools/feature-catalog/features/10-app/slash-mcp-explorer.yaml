deliberate_hold: null
notes: |
  Slice: `src/apps/cli` allowed `@/ui/ui-helpers` for rendering; does NOT
  import `@/mcp` directly — consumes the wire-built `McpSurfaceInfo` via
  `SlashContext.mcp`. Configured-but-not-bridged servers ⇒ `status: "failed"`
  (lifecycle vocabulary). pid/uptime stay undefined (live `McpClient` proc is
  private by RFC slice discipline). Returns `undefined` when no MCP is
  configured AND no config path set ⇒ REPL omits the surface entirely; `/mcp`
  prints "not wired in this surface" (default-OFF parity).
  `QUANTA_MCP_VERBOSE=1` ⇒ include cwd / env-key list per server and the full
  tool input-schema `required` keys when listing tools.
