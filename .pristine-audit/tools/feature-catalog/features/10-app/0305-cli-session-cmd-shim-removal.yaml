purpose: |
  Removes `src/apps/cli/session-commands.ts` (the Phase-3 shim wrapping
  `runSessionCommand` from `@/runner/session-ops` with `cliImportHandler`
  + `resolveCliListEnv()`). The shim's 164 LOC of indirection is replaced
  by direct call sites that inject the migration handler + list-env
  resolver inline. Call sites: `repl.ts`, the unit + integration test
  suites.
