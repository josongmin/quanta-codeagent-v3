purpose: |
  Pure-policy bench-repair loop SSOT: `runRepairRounds` orchestrates N rounds of
  (apply → `validate` → `buildRepairContext` → re-prompt) inside ONE sandbox so
  rounds share state (continue-the-conversation semantics), with all collaborators
  injected (no env / I/O reads in the policy). Backs the bench `eval` driver's
  Type-B/E repair budget. Implementation lives under `src/apps/bench/eval/
  repair/` (`index.ts` = runRepairRounds, `context.ts` = buildRepairContext,
  `validator.ts` = validate). Each round is byte-deterministic given identical
  collaborators — the policy itself is pure.
