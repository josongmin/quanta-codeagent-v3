notes: |
  Risk register — REVERSIBLE: every deletion is git-recoverable from
  acb8d187; the deleted modules were verified zero-importer with grep before
  removal. IRREVERSIBLE: none. KEEP decision for mcp-surface-wire.ts is
  reversible by deleting the file + the seam comment.

  Pre-existing tsc errors (101 across foundry/skybridge/coverage/catalog test
  scaffolding) are unrelated and unchanged by this slice — `bunx tsc -p .
  --noEmit | grep apps/cli/repl` reports zero issues both before and after.

  Pre-existing CLI tests baseline (`tests/unit/apps/cli/` + mcp-surface-wire):
  165 pass / 0 fail / 381 expects. Post-prune (with the new hellgate added):
  same 165 + 12 new = 177 pass / 0 fail.
