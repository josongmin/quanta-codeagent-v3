    - src/agent/tool-result-evict/types.ts
    - src/agent/tool-result-evict/evict.ts
    - src/agent/tool-result-evict/spill-adapter.ts
    - src/agent/tool-result-evict/index.ts
    - src/shared/runtime-config.ts
