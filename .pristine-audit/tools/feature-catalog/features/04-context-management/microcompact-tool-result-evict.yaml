id: microcompact-tool-result-evict
title: Microcompaction — tier-1 tool-result eviction (in-place content clearing)
section: 4
subsystem: Context reclaim — 압축 전 cheaper tier (stale tool-dump body null-out)
order: 399
maturity: L3
status: new
ui_surfaces: [n-a]
monitoring: integrated
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env:
    - QUANTA_MICROCOMPACT
    - QUANTA_MICROCOMPACT_KEEP_RECENT
    - QUANTA_MICROCOMPACT_FLOOR_TOKENS
    - QUANTA_MICROCOMPACT_INTERVAL_MS
owners: ["@songmin"]
labels: [surface:core]
depends_on: [persisted-output, quantacompacttokens, delta-token-accounting]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 7/7 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure context-reclaim primitive; its recovery:compact event is dropped at context-binding default arm (outside 7-tag bridge whitelist) and output is byte-identical, no UI affordance"
purpose: |
  압축 3-tier 중 누락된 tier-1 추가(RFC jun-6-microcompaction). 기존: tier-0 capture-time
  per-result cap(`output-spill.ts`)·tier-2 full LLM summarization(`compactIfNeeded`). 갭=
  summarization threshold 아래인데 20턴 전 large-but-under-cap tool dump(50KB grep·30KB read·
  dir listing)로 bloat된 트랜스크립트를 reclaim할 길이 없음.

  본 tier-1=PURE pre-pass `microcompactToolResults`: 메시지 forward-scan으로 tool_result를
  순서 수집 → LAST N(`keepRecent`, default 3=live working set)만 보존 → 더 오래된 tool_result의
  BODY를 in-place로 `[Old tool result content cleared]` placeholder(+spill ref)로 rewrite.
  ZERO LLM cost·ZERO reasoning loss(assistant text/decision는 verbatim, stale tool dump만 shrink).
  Trigger: idempotent skip-if-already-cleared + `tokensSaved > floor` gate.

  ORPHAN-SAFETY WIN(§3.3): block을 제거하지 않고 CONTENT만 clear하므로 모든 tool_use↔tool_result
  pairing이 구조적으로 보존됨 → boundary walk·orphan set 불필요(findBoundary보다 strictly 단순,
  unwired createMicroCompactor보다 strictly 안전). 이건 whole-MESSAGE-drop인 ADR-0409
  `src/agent/microcompact/`(compaction-visibility.yaml)와 별개의 메커니즘.

  COUNTER-RESEED(§3.4 핵심 correctness): 방금 landed된 delta-token counter는
  append/replace/clear/tokenReseed에서만 re-anchor. wire는 evicted array를 반드시
  `wm.replace([...r.messages])`로 install → counter reseed → `tokenTotal() === estimateTokens(
  snapshot())` byte-identical 유지. in-place `wm.messages[i].content=…`는 counter를 bypass해
  DRIFT(over-report) → 금지. §6.2 hellgate가 correct path(no drift)·adversarial in-place(drifts)
  둘 다 봉인.
