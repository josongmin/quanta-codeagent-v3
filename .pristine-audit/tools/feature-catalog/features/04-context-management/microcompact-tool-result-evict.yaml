    # bg-controller reconcile + compactIfNeeded, knob-gated + min-interval
    # cadence, installs via wm.replace (counter reseed), emits
    # recovery:{reason:"compact",detail:"microcompact"}.
    - src/agent/loop/compaction-wire.ts
    # spill reuse: the evicted original is persisted to the SAME
    # .quanta/tool-output surface + pruneSpillDir bound as the capture-time cap.
    - src/tool/output-spill.ts
  adrs: [492]
  tests:
    unit:
      # §6.1 — keep-last-N / clear-to-placeholder(preserve id+is_error, drop
      # contentBlocks) / floor-gate(under ⇒ SAME ref, no spill IO) / idempotent
      # (no re-spill) / ORPHAN-SAFE(tool_use↔result ids identical) / spill
      # round-trip byte-for-byte / NO-THROW spill failure ⇒ bare placeholder /
      # image-heavy counted via image estimate / default-adapter injected writer.
      - tests/unit/microcompaction-evict-hellgate.test.ts
      # §6.2 — counter consistency: replace ⇒ tokenTotal()===estimateTokens
      # (snapshot()) no drift; adversarial in-place edit DRIFTS; tokenReseed heals.
      - tests/unit/microcompaction-x-token-delta-hellgate.test.ts
      # DOF-40 fail-closed (pure core): out-of-bounds tuning REFUSES (typed
      # MicrocompactTuningError) instead of silently mis-evicting — keepRecent<=0
      # / non-integer / negative floor / NaN floor all throw BEFORE any evict;
      # VALID tuning unchanged (bounded evict, working set retained).
      - tests/unit/microcompaction-tuning-failclosed-hellgate.test.ts
      # DOF-40 fail-closed (WIRE, real maybeCompact): ON-proof (valid ⇒ real
      # eviction observed in the live wm, last keepRecent kept) + paired FAIL-
      # CLOSED (invalid keepRecent=0 injected via runtimeConfig spy ⇒ VISIBLE
