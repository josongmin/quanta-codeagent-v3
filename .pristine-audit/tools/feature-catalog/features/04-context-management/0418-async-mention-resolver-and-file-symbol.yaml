knobs:
  - name: QUANTA_MENTION_FILE
    default: 'on'
    purpose: 'Enable @file mention resolution (off ⇒ file mentions skipped).'
  - name: QUANTA_MENTION_SYMBOL
    default: 'on'
    purpose: 'Enable @symbol mention resolution (off ⇒ symbol mentions skipped).'
  - name: QUANTA_MENTION_SKILL
    default: 'on'
    purpose: 'Enable @skill mention resolution (ADR-0422). NO-OP at the assemble/CLI layer — no read-only skill registry is threaded by buildMentionSymbolDeps, so @skill resolves null until a caller supplies `skills` to buildDefaultMentionResolver.'
  - name: QUANTA_MENTION_FILE_MAX_BYTES
    default: '262144'
    purpose: 'File read cap (bytes) before head/tail truncation. Unset ⇒ lib default 262144 (256 KiB) from file-resolver DEFAULT_FILE_RESOLVER_MAX_BYTES.'
  - name: QUANTA_MENTION_FILE_TAIL_RATIO
    default: '0.5'
    purpose: 'Fraction of the cap reserved for the file tail (0..1; lib default 0 = head-only).'
  - name: QUANTA_MENTION_SYMBOL_RESOLVER
    default: 'auto'
    purpose: '@symbol lookup strategy: lsp | semantic | auto (auto = LSP first, semantic fallback).'
  - name: QUANTA_MENTION_SYMBOL_TIMEOUT_MS
    default: '5000'
    purpose: 'Per-strategy @symbol lookup timeout in ms (hung strategy ⇒ null / fallback).'
notes: |
  Cursor/IDE @-mention parity. Supersedes the 3-kind sync mention slice and
  the dropped @file: explicit-prefix syntax. An uppercase-leading dotted
  token like @README.md classifies as a SYMBOL (README.md) by the cascade —
  documented behaviour, not a bug. Frozen at 5 kinds.

  ADR-0422 closed the ADR-0418 deliberate_hold: the env→builder→composite→
  mentionInjector wire is live on the CLI + every host-runtime surface (and
  the unified-agent assemble surface). ADR-0423 then closed ADR-0422's anchor
  hold: production @symbol is now WIRED (not unconditionally null by
  construction) — the deterministic anchor synthesizer supplies the LSP anchor
  (no surface needs to thread one) and buildMentionSymbolDeps threads the real
  semantic backend, so both the LSP and semantic strategies are wired at
  assemble + host-runtime.
  Honest residual: a wired strategy still answers null until its backing data
  exists — LSP hits require an installed language server (pyright /
  typescript-language-server), graceful-null without one; the semantic strategy
  only hits once the search index has entries (QUANTA_INDEX). So in a fresh
  checkout (no LS, empty index) @symbol still resolves null. @skill is wired
  only by callers that thread a `skills` registry — at the assemble/CLI layer
  none does, so @skill resolves null there.
