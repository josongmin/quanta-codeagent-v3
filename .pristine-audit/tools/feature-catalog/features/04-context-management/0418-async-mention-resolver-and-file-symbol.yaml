purpose: |
  Supersedes ADR-0325 (3-kind sync) + ADR-0330 (sync runner). Extends the
  mention enum to 5 kinds (skill | plugin | app | file | symbol) and flips
  the resolver port + injector to ASYNC so the new kinds can do I/O.

  Parser uses a DETERMINISTIC priority cascade on each `@<rest>` payload
  (first match wins): slash → file; uppercase-start → symbol (with optional
  one-level `.member`); lowercase-start + dot → file; lowercase-kebab →
  skill. `@@app` and `plugin://name` keep their own alternatives. Examples:
  `@./Foo`→file, `@Foo.bar`→symbol, `@a.b`→file, `@code-review`→skill.

  `buildInjectionFragments` is async + parallel (`Promise.all`, per-mention
  NO-THROW so one failure drops only that mention, input-order-stable
  output, HARD kind dispatch). `@file` resolver = async fs read inside a
  realpath + is-path-inside jail (binary sniff, 256 KiB default cap,
  `tailRatio` head/tail split). `@symbol` resolver = injected LSP + semantic
  lookup ports, `lsp|semantic|auto` priority (auto = LSP first, semantic
  fallback), per-strategy timeout, NO-THROW on throw/reject/timeout.

  ADR-0422 WIRE-UP (closes the deliberate_hold): two SymbolLookup adapters
  (createLspSymbolLookup over lsp-bridge's nav provider /
  createSemanticSymbolLookup over the search-index backend, both
  graceful-null) + a DRY buildDefaultMentionResolver that reads the
  QUANTA_MENTION_* env (default-ON, =off per kind) and composes file/symbol/
  skill. apps/agent/assemble.ts + the CLI/host-runtime (mention-wire.ts →
  buildAgentConfigFromBase via idempotent installCodexR2Wires) both build via
  the shared builder, so @file + @symbol work on every surface.

  ADR-0423 PRODUCTION @symbol (closes ADR-0422's anchor hold): a
  DETERMINISTIC LSP anchor synthesizer (`synthesizeLspAnchors`) walks cwd
  breadth-first (entries sorted per directory) and takes the
  lexicographically-first source file of each supported language — keyed by
  server binary from the single lsp-bridge SERVERS table — as that
  language's anchor. `createUnionLspSymbolLookup` then fans
  `workspaceSymbol(name)` across every synthesized anchor and merges hits
  (multi-language repo probes both servers). No scores, no thresholds. The
  host-composition `buildMentionSymbolDeps` pairs this with the REAL
  `@/runner` semantic backend (`selectIndexEmbedder` + `buildSemanticBackend`)
  and feeds both ports to `buildDefaultMentionResolver` at BOTH call sites
  (assemble.ts + mention-wire.ts), built LAZILY on first findSymbol so config
  assembly stays synchronous. So production @Symbol is now WIRED (LSP anchored
  → semantic fallback under `auto`) — graceful-null without an installed language
  server / a populated index, not unconditionally null by construction.

  Default-ON with GRACEFUL OMIT: an absent dep (no supported file ⇒ no anchor /
  no populated index / no skill registry / language server not installed)
  leaves that strategy answering null, never a regression. In a fresh checkout
  with no language server installed and an empty index, @symbol therefore still
  resolves null — the wire is present, the backing data is not. @skill resolves
  null at the assemble/CLI layer because no surface threads a `skills` registry.
  Zero-mention input + every knob =off are byte-identical to the legacy 3-kind path.
  `AgentConfig.mentionInjector` is `Promise`-shaped; `AgentConfig.mentionInjection`
  carries the DI bag.
