id: embed-cache
title: EmbedCache — idempotent content-hash + model-tag embedding cache
section: 4
subsystem: Retrieval — Axis F (ADR-0263, sibling of ADR-0159 Axis D embedding port)
order: 263
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
config_refs:
  env: [QUANTA_EMBED_CACHE]
owners: ["@songmin"]
labels: ["surface:core", "adr:0263", "default-off"]
depends_on: [retrieval-commit-embedder, retrieval-multi-vendor-embedding]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 8/8 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure content-hash embedding cache codec, ui_surfaces n-a, no UI affordance"
purpose: |
  Idempotent embed cache keyed by `hash(text) + ":" + modelTag` so a
  provider/model swap automatically invalidates every stale entry
  (`cache.invalidate(oldTag)`) and the same (text, model) pair never
  re-pays the network/$ cost.

  Closed `EmbedCache` port with 5 methods (`get / put / invalidate /
  size / clear`) and three adapters:
    - in-memory LRU (`Map`-backed, default cap 10000, configurable)
    - sqlite durable (`~/.quanta/embed-cache.db`, 0600, TTL 30 days,
      Float64-packed BLOB for byte-exact vector round-trip)
    - none (default-OFF, byte-identical "no cache" — every get returns
      null, every put is a no-op)

  Env-driven wire swap (`QUANTA_EMBED_CACHE=in-memory|sqlite|none`); the
  default is `none` so until a caller explicitly opts in the embed
  pipeline is byte-identical to the pre-ADR behaviour.

  modelTag canonical format `{provider}-{modelPart}-v{version}-d{dim}`
  is enforced by `isCanonicalModelTag` — adapters do NOT validate on
  every call (correctness depends on tag CONSISTENCY across put/get,
  not on tag canonicality), but operators get a user-callable check.
evidence:
