knobs:
  - name: QUANTA_EMBED_CACHE
    default: 'none'
    purpose: 'adapter swap (in-memory|sqlite|none)'
  - name: InMemoryEmbedCacheOptions.capacity
    default: '10000'
    purpose: 'LRU cap'
  - name: SqliteEmbedCacheOptions.path
    default: '~/'
    purpose: 'db path.quanta/embed-cache.db'
  - name: SqliteEmbedCacheOptions.ttlMs
    default: '30 days'
    purpose: 'entry TTL'
  - name: SqliteEmbedCacheOptions.now
    default: 'undefined'
    purpose: 'injectable clock for tests'
deliberate_hold:
  reason: 'The runner pipeline now consumes the registry for semantic presets, but QUANTA_EMBED_CACHE remains none by default because cache persistence and provider-cost efficacy are operator choices.'
  promotion_path: 'Measure repeat-query cache-hit and invalidation behavior with a real embedder before any default flip.'
notes: |
  Sync fast-hash (FNV-1a-mix) is used internally for hot-path latency;
  a collision guard compares the original `text + modelTag` before
  returning a hit so a sync-hash collision costs at most a re-embed,
  never a wrong vector. The exported `hashText` (Web Crypto SHA-256) is
  available for callers that need the cryptographic guarantee.
