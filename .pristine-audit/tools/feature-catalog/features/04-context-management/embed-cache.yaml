    - src/retrieval/cache/port.ts
    - src/retrieval/cache/types.ts
    - src/retrieval/cache/hash.ts
    - src/retrieval/cache/in-memory-lru.ts
    - src/retrieval/cache/sqlite-cache.ts
    - src/retrieval/cache/none-cache.ts
