  code:
    - src/retrieval/semantic/types.ts
    - src/retrieval/semantic/embed-port.ts
    - src/retrieval/semantic/headless-embedder.ts
    - src/retrieval/semantic/index.ts
  adrs: [254, 93]
  tests:
