    integration: []
    contract: []
knobs: []
deliberate_hold:
  reason: |
    - 실 embedding adapter (OpenAI / Voyage / Cohere) — 이 슬라이스는
      deterministic headless stub 만; 실 provider는 sibling
      `semantic-index-real-embedder`(ADR-0392) 담당
    - persistence / hybrid blend / HNSW·IVF ANN index — 전부 pipeline 쪽
      (@/retrieval/pipeline + @/retrieval/engines) 책임으로 이동, 이 슬라이스는
      embedder primitive만 유지
    - tool wiring (semantic_search 같은 새 도구 surface) — primitive만 먼저 안전
      착륙, wiring은 후속
  promotion_path: |
    Reduced to the live embedder primitive. The only consumer is
    `src/runner/assemble/pipeline.ts` (`createHeadlessEmbedder`), which feeds
    the pipeline's vector-in `SemanticIndex` (`@/retrieval/pipeline`). The dead
    text-in `SemanticIndex` port + in-memory cosine adapter that once lived here
    were removed as a proven duplicate (zero consumers) of that live port.
    Promotion of live semantic retrieval is owned by
    `semantic-index-real-embedder` (ADR-0392, search-index-backend.ts); this
    entry stays at L2 as the deterministic-embedder seam.
notes: |
  Import 방향: src/retrieval/semantic/ → @/shared (Result/ok/err) 만. 다른
  슬라이스 역참조 없음. 이 슬라이스는 embedder primitive만 남았다 — text-in
  `SemanticIndex` port(port.ts) + in-memory cosine adapter(in-memory-index.ts)는
  @/retrieval/pipeline의 live vector-in `SemanticIndex`와 증명된 중복이라
  제거됐다(zero consumer; proven-duplicate cleanup).

  Headless embedder는 hash-based — 의미상 유사한 텍스트가 가까운 벡터가 된다는
  보장이 **없다** (deterministic stub). 출력은 L2-normalised라 cosine이 dim과
  무관하게 [-1, 1]에 머문다; hellgate가 normalisation 회귀를 봉합한다.
