purpose: |
  Cline / Cursor `CLIENT_SIDE_TOOL_V2_SEMANTIC_SEARCH_FULL` 패턴 흡수의 slice
  primitive. quanta는 `grep`/`glob`/`lsp_nav` 같은 lexical retrieval과
  ADR-0159 hybrid-query 펀넬은 이미 갖췄고, embedding-based 본체는 별도
  파이프라인(@/retrieval/pipeline)의 vector-in `SemanticIndex`로 산다.

  이 슬라이스는 그 파이프라인이 소비하는 결정론적 headless `Embedder`만
  남긴다. 초기 라운드에 있던 text-in `SemanticIndex` port + in-memory cosine
  adapter는 @/retrieval/pipeline의 live vector-in `SemanticIndex`와 **증명된
  중복**(zero consumer)이라 제거됐다 (proven-duplicate cleanup, ADR-0254 정정).
  실 embedding model (OpenAI / Voyage / Cohere) integration은 sibling feature
  `semantic-index-real-embedder`(ADR-0392)가 담당한다.

  핵심 모양(잔존):
    - `Embedder { embed(text): Promise<Result<EmbeddingVector, EmbedError>>;
      dim(): number }` — HTTP/I/O 경계를 격리한 주입 심
    - `EmbedError = empty-text | embed-failed` (closed discriminated union)
    - headless-embedder: Bernstein hash → Mulberry32 PRNG → L2-normalized
      fixed-dim vector (same text ⇒ byte-identical vector)
    - semantic preset에서 runner가 `src/runner/assemble/pipeline.ts`의
      `createHeadlessEmbedder`를 소비한다; index/provider 선택은 별도 sibling이 소유한다
