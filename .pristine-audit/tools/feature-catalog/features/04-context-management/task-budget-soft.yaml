purpose: |
  SOFT, model-facing token budget — the quanta mirror of Claude's
  `task_budget: { type: "tokens", total: N }`. When the operator sets a budget
  (via the `task-budget` knob / `QUANTA_TASK_BUDGET`), the loop accumulates the
  session's observed input+output token usage and forwards `{ tokens, spent }`
  into `buildTurnContext`, which renders ONE advisory guidance line into the
  trailing `<system-reminder>` so the model can self-moderate: prioritize, then
  "wrap up" as remaining nears zero.

  ORTHOGONAL to the hard `BudgetMeter` enforcement breaker (ADR-0138): this
  NEVER returns a stop signal, NEVER throws, NEVER mutates enforcement state.
  Phrasing escalates (low → near 90% → over) but the line is explicitly labelled
  "guidance, not a hard limit". `spent` is poison-proofed (NaN / negative /
  Infinity coerced to 0) and `remaining` clamps to `[0, tokens]`.

  Default-OFF: budget absent (or `tokens <= 0`) ⇒ `renderTaskBudgetBlock`
  returns `undefined` and the dynamic context is BYTE-IDENTICAL to the pre-slice
  path. The renderer is pure (no clock / process / I/O) — replay-deterministic.
