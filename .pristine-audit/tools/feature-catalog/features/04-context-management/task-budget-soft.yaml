notes: |
  The `task-budget` knob (surfaces: cli / agent-batch / agent-interactive) is
  PURE — its `apply` sets `config.taskBudget`. The loop wire lives in
  `prepareTurnContext` (src/agent/loop.ts): it builds `{ tokens, spent }` from
  `config.taskBudget` + the per-session `taskSpend` box (incremented in
  `emitUsage` off the SAME usage events the meter/recorder observe) and
  forwards it via the existing `TurnContextInput.taskBudget` slot.

  `configurable: partial` (not integrated) is structurally honest: the env knob
  + loop forward are wired, but the CLI entry does not yet auto-fold the
  resolved knob map into its live AgentConfig — that final `applyKnobs` call
  site is the remaining promotion step shared with the other cli-surface knobs.
