    contract: []
knobs: []
deliberate_hold:
  reason: |
    Not yet extended to the real-agent surfaces (apps/cli, apps/agent). The OTLP
    span export there is already generic (installOtelSpanExportFromEnv), so a user
    could watch their own interactive/headless agent session with the same viewer —
    only the run-id auto-issue + a `quanta trace`-equivalent launcher are bench-local
    today. (기능: 에이전트 세션 라이브 트레이스 / 왜: 본인이 쓴 도구·LLM 호출 실동작 가시화,
    observability 북극성 / ROI: 코어 export는 이미 일반, auto-issue seam만 옮기면 됨 — 中)
  promotion_path: |
    Lift resolveBenchRunId + bootBenchOtelExport out of apps/bench/otel.ts into the
    shared observability composition root (installOtelSpanExportFromEnv) so every
    entry auto-issues, and add a generic `quanta trace` launcher mirroring
    `quanta-bench trace`. The viewer + sink + vocab are already surface-agnostic.
notes: |
  Default-OFF byte-identical: no QUANTA_OTEL_ENDPOINT ⇒ no run id issued, env
  untouched, no sink, no spans (identical to a plain run). Negative invariants:
  (a) run id rides the resource, NOT a per-span attr duplicated N times;
  (b) auto-issue ONLY when export is on (no confusing no-op id when nothing streams);
  (c) explicit QUANTA_OTEL_RUN_ID is never overwritten;
  (d) the `quanta.run.id` literal lives ONLY in vocabulary.ts (orphan-literal ratchet);
  (e) auto-id is slugified to [A-Za-z0-9._-] + URL-encoded so it is shell/URL safe.
