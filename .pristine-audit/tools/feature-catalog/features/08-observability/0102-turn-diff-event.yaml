purpose: |
  AgentEvent union variant `turn_diff_updated` plus the emitter module that
  computes per-turn cumulative unified diff. captureTurnStart records workspace
  state at turn-open; computeTurnDiff produces a unified diff against the
  captured baseline at turn-close; buildTurnDiffEvent shapes the AgentEvent
  payload so consumers (jsonl-recorder / stdout) can render or persist the
  turn's filesystem footprint without parsing assistant text.
