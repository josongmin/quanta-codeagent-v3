id: aug02-rfc02-worktree-activity-producer
title: RFC02-5 / RFC06-2 — operation-correlation activity + worktree activity producer
section: 8
subsystem: Activity spine — operation-correlation + worktree producer (aug-02 RFC02-5, RFC06-2)
order: 556
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless]
configurable: static
owners: ["@songmin"]
labels: ["rfc:aug02-02", "rfc:aug02-06", "surface:cli"]
purpose: |
  RFC02-5 operation-correlation contract + RFC06-2 worktree producer: the
  activity spine gains an operation-correlation id so multi-step operations
  (e.g. a worktree switch) group under one correlated activity, and a live
  worktree-activity PRODUCER emits begin/end activity records around a
  current-thread worktree transition (with crash reconcile). Additive activity
  rows on the existing spine — no producer emits unless the operation runs.
