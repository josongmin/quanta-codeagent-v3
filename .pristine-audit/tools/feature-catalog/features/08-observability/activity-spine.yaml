notes: |
  No new env knob: `/activity` is presence-gated on `ctx.activityStore` /
  `ctx.agents` (the `/agents` pattern) — absent ⇒ "not wired in this surface".
  Live workflow recording rides the existing QUANTA_WORKFLOW gate (run_workflow).
  P0-b follow-ups (not yet built): reactor/remote/scheduled producers feeding the
  same spine, a Web "Mission Control" surface, and a shared agent-action consent
  gate (see docs/plans/jun-15-기능흡수/01-uiux-내부통합-설계.md). The Activity
  Spine slice pre-existed (committed in 166b53c8); this entry catalogues it after
  the jun-15 hardening (leaf-counting aggregate, id url-escaping, derived
  container status) + the P0-b live wiring + e2e tree-green closeout.
