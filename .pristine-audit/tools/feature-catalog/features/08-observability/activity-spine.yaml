purpose: |
  The ONE model every agent-activity surface projects from. Workflow phases,
  in-process subagents, side-agent daemons (and reactor/remote/scheduled runs as
  their producers land) all map their native shape into one canonical
  `AgentActivityEvent`; a PURE, NO-THROW reducer (`spine.ts`) folds them into an
  immutable `ActivitySnapshot` tree; the surfaces are PURE projectors of that one
  snapshot — so the fleet view (L0), the run view (L1) and the agent view (L2)
  are the SAME tree at different zoom depths, never three drifting UIs (pinned by
  the spine drift ratchet). Honesty invariants the spine ENFORCES: container
  status is DERIVED, never asserted (a closed phase with a failed step reads
  `failed`; an open run with a stuck child reads `stuck`) so a surface can never
  show a status that contradicts its descendants; counters are monotonic
  non-negative; structural sharing keeps earlier snapshots frozen. `render.ts` is
  the `/activity` view — a glyph tree (✓⏳🛑💤◌✗⊘■) with the why-stuck reason
  rendered inline on the blocked LEAF (the north-star "왜 멈췄나" payload), header
  aggregate, and a "+N more" overflow (no silent truncation). `store.ts` is the
  live runtime side: `createActivityStore` (a stateful accumulator the host feeds)
  + `createWorkflowSink` (a streaming WorkflowEvent→spine adapter whose snapshot
  is byte-identical to the batch producer — pinned by the store drift ratchet).
  Producer mirrors are structural (no value import of @/workflow / @/subagent /
  @/side-agent); a compile-time mirror-drift ratchet fails `tsc` if an upstream
  status/event union outgrows its mirror. WRITE↔READ share ONE session store: the
  tier-1 `run_workflow` tool streams its live run in (threaded via
  AgentConfig.subagent.activityStore) while `/activity` renders it — proven
  end-to-end (tree-green) against the REAL composition functions.
