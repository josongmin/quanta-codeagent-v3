notes: |
  슬라이스는 leaf-only — `@/agent`, `@/tool`, `@/permission`, `@/memory`,
  `@/scheduler`, `@/observability`, `@/runtime`, `@/storage`, `@/llm`,
  `@/stream`, `@/shared` import 0 (HELL-PW-08 봉인). plan 본체 mutate
  금지 — caller 가 자신만의 re-render 경계에서 getUpdates → 통합 →
  clearUpdates 패턴으로 drain. 후속:
    (1) plan renderer 와 합성 (deliberate hold)
    (2) ADR-0203 dispatcher 에서 자동 inject (host opt-in)
    (3) 영속화 (memory + session-store 협업, 별도 슬라이스)
