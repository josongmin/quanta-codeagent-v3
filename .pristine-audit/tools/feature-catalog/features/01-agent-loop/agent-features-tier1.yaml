purpose: |
  `src/agent/features.ts` (SessionFeatures 합성 composer) 를 30 개
  per-subsystem builder + composer 로 분해. 각 builder 는 ONE optional config
  block → ONE concrete 런타임 object (or `undefined` 으로 byte-identical
  default-OFF 보존).

  30 builders (`src/agent/tier1/`):
    - `advisor`           — buildAdvisorBlock
    - `appshot`           — buildAppshotBlock
    - `auto-classifier`   — buildClassifierBlock
    - `branch-search`     — buildBranchSearchBlock
    - `browser`           — buildBrowserBlock
    - `budget`            — buildBudgetBlock
    - `check-secrets`     — buildCheckSecretsBlock
    - `compose-authoring` — buildComposeAuthoringBlock
    - `delegate`          — buildDelegateBlock
    - `enter-plan`        — buildEnterPlanBlock
    - `fork-session`      — buildForkSessionBlock
    - `objective`         — buildObjectiveBlock
    - `plan-exit`         — buildPlanExitBlock
    - `plan-mutation`     — buildPlanMutationBlock
    - `pr-ship`           — buildPrShipBlock
    - `prompt-cache`      — buildPromptCacheBlock
    - `shadow`            — buildShadowBlock
    - `shadow-verify`     — buildShadowVerifyBlock
    - `side-agent`        — buildSideAgentBlock
    - `skill`             — buildSkillBlock (+ SkillBlock type)
    - `subagent`          — buildSubagentBlock (+ SubagentBlock type)
    - `subagent-batch`    — buildSubagentBatchBlock
    - `subagent-bg`       — buildSubagentBgBlock
    - `subagent-introspect` — buildSubagentIntrospectBlock
    - `subagent-mailbox`  — buildSubagentMailboxBlock
    - `team`              — buildTeamBlock
    - `user-input`        — buildUserInputBlock
    - `web-search`        — buildWebSearchBlock
    - `working-state`     — buildWorkingStateBlock (+ WorkingStateBlock type)
    - `worktree`          — buildWorktreeBlock

  `features.ts` composer: builder 호출 시퀀스 + 결과를 `SessionFeatures` shape
  으로 fold. composer 는 builder 추가에 대해 closed — 새 tier-1 추가는 `tier1/`
  신규 모듈 + `index.ts` re-export + features.ts 한 줄 composer fold push.
  `tier1-completeness-ratchet.test.ts` 가 이 3-step 을 CI 에서 강제.

  Edge direction 엄격: `features.ts` 가 `tier1/*` 를 IMPORT;
  `tier1/*` 는 절대 `features.ts` 를 import 금지. import-cycle guard
  (`tests/unit/agent-import-cycle.test.ts`) 가 단순한 이유 — `tier1/*` 는
  하위 디렉토리에 있어 top-level SCC 분석에서 invisible, 그리고 one-way edge
  이므로 새 cycle 0.
