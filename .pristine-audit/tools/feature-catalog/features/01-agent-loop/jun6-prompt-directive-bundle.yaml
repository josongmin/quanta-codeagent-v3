purpose: |
  Seven cheap, high-value behavioral PROMPT DIRECTIVES, each an independent
  DEFAULT-OFF gated section. Each mirrors the C3 brief-mode mechanism: the
  directive text is spliced into the per-turn DYNAMIC `<system-reminder>` slot by
  `buildDynamicContext` (`src/agent/prompt.ts`) ONLY when its knob is ON — never
  into the static cached prefix. So flipping any knob never invalidates the
  provider cache prefix, and ALL knobs unset ⇒ the bundle contributes ZERO bytes
  ⇒ the per-turn reminder is byte-for-bit identical to the pre-bundle output.

  The seven directives:
    1. AUTONOMOUS (QUANTA_DIRECTIVE_AUTONOMOUS) — unattended/headless posture:
       bias to safe forward progress, do not block on questions, checkpoint, do
       not fabricate completion.
    2. READ_COMPLETE (QUANTA_DIRECTIVE_READ_COMPLETE) — read the relevant span of
       a large file COMPLETELY before concluding; truncate-and-guess is a defect.
    3. PROGRESS (QUANTA_DIRECTIVE_PROGRESS) — concise, information-dense status;
       narration only; never suppresses error/verification/evidence reporting.
    4. MEMORY_VERIFY (QUANTA_DIRECTIVE_MEMORY_VERIFY) — a recalled memory is a
       hint; verify a named file/symbol/flag still exists in the CURRENT code
       before acting on or citing it.
    5. THINK_FREQ (QUANTA_DIRECTIVE_THINK_FREQ) — match reasoning depth to task
       complexity; deliberate on hard steps, move fast on mechanical ones.
    6. ANTI_PLATITUDE (QUANTA_DIRECTIVE_ANTI_PLATITUDE) — substance only; no empty
       affirmations / filler praise; disagree plainly when evidence warrants.
    7. PARALLEL_TOOLS (QUANTA_DIRECTIVE_PARALLEL_TOOLS) — batch INDEPENDENT tool
       calls in a single turn; sequential only on a real data dependency.
    8. ADVISOR_RAIL (QUANTA_ADVISOR_RAIL, RFC jun-6 §5.2) — when the `advisor`
       tool is available, consult it BEFORE committing to an approach and BEFORE
       declaring done; mentions forwardHistory:true (cc-cli advisor timing rail).

  BYTE-IDENTITY (headline invariant): the pure selector `selectActiveDirectives`
  returns "" when no knob is on, so nothing is pushed onto the dynamic parts and
  the assembled reminder equals the frozen golden. Determinism: active directives
  concatenate in a fixed source-declared order (`DIRECTIVE_ORDER`) — no
  Math.random, no Set-iteration ambiguity. The texts are constants; the selector
  is pure (no clock/random/env/IO); the loop layer (`prompt.ts`) is the single
  env reader, projecting `runtimeConfig()` onto the narrow `DirectiveConfig` slice
  (test/caller-overridable via `TurnContextInput.directiveConfig`).
