notes: |
  Mechanism mirrors C3 brief-mode (`src/agent/brief.ts` + `BRIEF_NOTICE`): the
  per-turn DYNAMIC slot, never the static cached prefix, so default-OFF is
  byte-identical and an ON toggle never invalidates the provider cache prefix.
  Splice point: `appendActiveDirectives` (extracted helper, called from
  `buildDynamicContext`) pushes after the brief notice and before repo-rules —
  the helper keeps `buildDynamicContext` cognitive complexity unchanged.

  WIRING NOTE (loop-decomposition avoidance): the production `buildTurnContext`
  call sites live in `src/agent/loop/*` (context-assembler / compaction-wire),
  which is the active loop-decomposition zone and OFF-LIMITS this session. Rather
  than thread a new field through those hot sites, the directive knobs are
  resolved at the PROMPT layer: `appendActiveDirectives` reads
  `runtimeConfig()` (via `resolveDirectiveConfig`) directly inside `prompt.ts`,
  the one place already responsible for assembling the dynamic block. Tests drive
  selection via the optional `TurnContextInput.directiveConfig` override (no env
  mutation needed) and also exercise the env production path. Zero edits to
  loop.ts / loop/* / coordination / nickname-table / appgen / appshot.

  Adjacencies (NOT duplicated — these are distinct, gated, opt-in directives):
  the STATIC body already carries a generic "Parallelism budget" line and a
  weak-signal "stale memory" caution and a review-mode "cut generic praise"
  clause, but none is a dedicated default-OFF per-turn directive for these seven
  behaviors. Confirmed absent as gated prompt directives by grep before building.
