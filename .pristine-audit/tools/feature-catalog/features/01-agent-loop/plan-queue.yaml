notes: 'LIVE (jun-06 catalog truth-up — prior "No consumer wired" hold is STALE). `defaultPlanQueueStore({sendNowSink})` is built in `repl/surface-compose.ts:870`; `/queue` is a registered SlashCommand (`queue-cmd.ts` + `slash/registry-surface.ts`); also consumed by `edit-plan-cmd` / `voice-cmd` / playbook auto-dispatch (via `adaptPlanQueueStoreToSink`). Remaining follow-up is ONLY the mid-turn keystroke-capture UX (typed-while-running editor calling `enqueue` on Enter), NOT the queue itself. `pausedReason` slot supported on the FollowUp envelope (Codex parity).'
