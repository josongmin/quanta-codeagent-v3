id: persona-slot
title: Persona slot — Codex {{ personality }} Handlebars absorption
section: 1
subsystem: 시스템 프롬프트 — 페르소나 enum (Codex absorption, ADR-0068 persona)
order: 70
maturity: L5
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env: [QUANTA_PERSONA]
owners: ["@songmin"]
labels: [absorbed:codex, surface:core, tier:core]
depends_on: [repl-code-smell-cleanup, runner-assemble-builders, cli-export-2026-05-21-l2-l3, repl-interactive-surface, slashctx-6-ports-wire-completion]
surface_integration:
  cli: full
  web: partial
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 4/4 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "persona is a @/runner/knobs registered knob so it appears read-only in the web KnobsPanel via buildWebKnobCatalog/GET /api/knobs, but is not among the 6 CONFIG_ALLOWED_KEYS writable keys"
purpose: |
  Codex Desktop base_instructions의 `{{ personality }}` Handlebars 슬롯 흡수. 3-arm 닫힌
  enum PersonaKind = default | friendly | pragmatic. `default`는 빈 본문(byte-identical
  pre-ADR 프롬프트, 모든 snapshot/prefix-cache hit 보존). 비-default 본문은 톤 가이드 + 마지막
  guardrail 라인(honesty/evidence/trust ladder에 톤 재바인딩 — friendly가 hedging으로,
  pragmatic이 curt-and-wrong으로 미끄러지는 것 방지). resolvePersona는 QUANTA_PERSONA env
  를 closed equality-check (silent fallback 금지 — 미지값은 PersonaInvalidError throw).
  buildSystemPrompt(_cwd?, { persona }) seam으로 1회 resolve 후 베이스 프롬프트에 베이크
  (mid-session 전환은 v1 범위 밖 — prefix-cache re-prefill 회피).
evidence:
  code:
    - src/agent/persona.ts
    - src/agent/prompt.ts
    - src/apps/cli/internal.ts
    - src/apps/cli/repl.ts
    - src/runner/knobs/knobs/persona.ts
  adrs: ["docs/decisions/0068-persona-slot.md"]
  tests:
    unit:
      - tests/unit/agent/persona.test.ts
      - tests/unit/prompt-system.test.ts
    integration:
      - tests/smoke/index.ts
    contract: []
knobs:
  - name: QUANTA_PERSONA
    default: 'undefined'
    purpose: '(no description)'
deliberate_hold: null
notes: |
  Codex personality_default/friendly/pragmatic 3-element catalog를 1:1 흡수.
  friendly = collaborative partner ("we"/"let's"); pragmatic = terse engineering
  register. default-OFF / byte-identical (RFC §1.2). L4→L5 (2026-05-23): smoke
  battery 13 시나리오의 buildSystemPrompt가 매 턴 persona slot 경로를 splice —
  default 페르소나 baked는 모든 fixture가 transitive로 byte-stable 검증.
