surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-07-19"
  evidence:
    cli: "OpenAIResponsesAdapter now maps the provider response.in_progress SSE frame onto StreamEvent; the existing loop/CLI projection consumes that event."
    web: "user value (thinking indicator) rides the in_progress AgentEvent which is in the B1-dropped set and hits the default arm at context-binding default arm (outside 7-tag bridge whitelist); never reaches the browser"
purpose: Ingest OpenAI Responses API v2 `response.in_progress` on the actual OpenAI Responses adapter path so UI can show a non-cumulative 'thinking' indicator without silently losing the provider heartbeat. `parseResponsesEvents` maps safe optional `message`, bounded `progress`, and provider `created_at` (normalized to StreamEvent milliseconds) into `response_in_progress`; the existing streaming dispatcher, agent loop, StdoutStream, and JsonlRecorder project it onward. Default behavior is byte-identical when the provider emits no heartbeat.
