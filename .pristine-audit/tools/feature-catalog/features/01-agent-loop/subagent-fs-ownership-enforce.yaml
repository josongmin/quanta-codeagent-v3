    web: "internal child-dispatch FS guard; denies a write outside the owned set, no user-visible affordance of its own"
purpose: '§20.4 — the hard fence behind subagent ownedSurfaces/forbiddenSurfaces. RCA: those surfaces were injected into the child seed as ADVISORY prompt text ONLY — an LLM that ignores them writes anywhere. This is a path-matcher consulted at the tool-dispatch FS-write seam so a write outside the owned set (or inside forbidden) is DENIED. Semantics = SUBTREE containment (FS-natural, glob-free): an entry is a file (exact) or a directory (owns its whole subtree); forbidden ALWAYS wins over owned. Matching runs on SYMLINK-RESOLVED, ..-normalized CANONICAL absolute paths (reusing the jail canonicalizePath) so neither .. nor a symlink can smuggle a write out. Pure core (isPathAllowed / consultOwnershipPolicy) operates on canonical paths + pre-extracted write-effects (reusing extractWriteEffects incl. bash sed -i / redirect) so it is fully hellgate-testable. DEFAULT-OFF: enforced !== true => everything allowed (advisory legacy, byte-identical).'
evidence:
  code:
    - src/agent/ownership-policy.ts
    - src/agent/subagent-runner.ts
    - src/agent/dispatch.ts
  adrs: []
  tests:
    unit:
      - tests/unit/subagent-ownership-enforce-hellgate.test.ts
      - tests/unit/ownership-dispatch-e2e-hellgate.test.ts
    integration: []
    contract: []
knobs: [QUANTA_FS_OWNERSHIP_ENFORCE]
deliberate_hold: null
notes: 'Reuse-only: canonicalization = @/storage canonicalizePath (symlink-resolving), write-target extraction = the existing extractWriteEffects (circumvention detector). forbidden-over-owned + symlink-resolved boundary are the two security cruxes. subagent-role-identity (§20.1-20.3) declared this §20.4 enforcement out of scope; this entry closes that deferral.'
