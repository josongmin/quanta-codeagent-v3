purpose: |
  Closes the silent drift between MUTATING_TOOL_TABLE and the caller-wire tool
  registry. Twelve previously-missing entries (gh_pr_comment/create/auto_merge,
  memory_write/update, branch_search, task_stop, request_plan_exit, agent,
  Skill, ToolSearch, web_search, read_image_url) now carry permanent classifications
  so plan-mode dispatch never trips UnknownToolError regardless of which
  AgentConfig slots a host wires. Adds four new MutatingToolKind variants
  (memory_mutating / subagent_spawn / subagent_control / plan_control) to keep
  the typed deny payload specific. Also fixes agent.isReadOnly() — previously
  hardcoded to true (a lie — spawning a child agent has unbounded side effects
  via its own tools), now correctly returns false so inferToolTier routes to
  always-confirm instead of silently bypassing to none.
