notes: |
  S2 slice. Read-only entries (gh_pr_view/list/blame/review_diff, gh_issue_view,
  gh_check_status, memory_search, task_output) added in the same change so the
  cross-check covers BOTH directions of drift. callerWireToolNames in the
  existing mode-mutating-table cross-check extended (not gutted) with the new
  names — same allowlist convention as shadow_* / subagent_fork / budget_status.
