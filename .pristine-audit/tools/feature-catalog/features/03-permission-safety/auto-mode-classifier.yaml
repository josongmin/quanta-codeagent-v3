notes: |
  Permission stack의 *마지막 fallback* 레이어 — 명시적 rule, prefix-DSL, 기억된
  pattern 다 miss하면 auto-mode가 LLM에 묻고, 그 결과는 다시 stack에 cache될 수
  있음 (rememberPatterns cascade). HITL 4-tier(ADR-0047) "AUTO" tier 의 백엔드.
  ADVERSARIAL COVERAGE (jun-15 audit truth-up): the security-critical
  fail-closed paths of the `AutoModeClassifier` state machine (classifier.ts)
  are pinned by permission-classifier.test.ts — absent port ⇒ hard fallback ask
  (NEVER allow), denial-limit (3 consecutive / 20 total) ⇒ fallback,
  consecutive-counter reset on a genuine allow, sticky AFK circuit-break ⇒
  fallback. The PORT impl (auto-classifier.ts) fail-safes on unparseable /
  stream-error and never throws. The prompt-injection → AFK-loosening
  escalation surface (operator-rule overlay) is fenced + sealed by the
  circumvention feature's hellgates: a repo-controllable `project`-layer
  `allow`/`hard_deny` is DROPPED (red-on-injection proven there).
