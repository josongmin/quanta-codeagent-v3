knobs:
  - name: QUANTA_UNTRUSTED_ENVELOPE
    where: src/shared/runtime-config.ts (runtimeConfig().untrustedEnvelope)
    default: 'unset at runtime-config (OFF); CLI surface seeds "1" (ON) when unset'
    purpose: '정확히 "1"이어야 활성화; 그 외 값(unset/"0"/"on"/"true"/임의)은 OFF 유지. OFF ⇒ wrapToolResult가 모든 source에 identity + RULE 미주입 ⇒ byte-identical. CLI(src/apps/cli/index.ts)는 unset일 때만 "1" 시드(QUANTA_UNTRUSTED_ENVELOPE=0이 여전히 이김); runtime-config 레이어는 default-OFF라 non-CLI surface는 byte-identical.'
notes: |
  핵심은 (a) provenance≠sensitivity 직교성(web_fetch는 public이지만 untrusted),
  (b) defang으로 trust-boundary 위조 차단(canonical escapeBoundary에 위임 —
  genuine token 뒤 backslash <\/... 삽입, BENIGN INVARIANT로 정상 코드/로그
  본문은 byte-identical), (c) internal trusted는 절대 미포장, (d) provenance는
  ALWAYS call-site 진실(registry origin + 도구명)에서 deriveProvenance로 도출 —
  도구명 string-guessing 아님(악성 MCP가 이름을 web_fetch로 바꿔도 origin이 이김).
  닫힌 enum + 닫힌 TRUSTED_SOURCES set으로 미래 trusted source 추가도 1줄. RULE
  wording은 hellgate가 pin(tag명/DATA-not-instructions/flag-before-continue).
