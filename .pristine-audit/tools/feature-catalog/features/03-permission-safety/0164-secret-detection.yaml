purpose: |
  Hexagonal `src/security/secret-detection/` slice — closed `SecretScanner`
  port + 3 adapters (pattern regex against 10 known token shapes — AWS /
  GitHub PAT / Slack / PEM / etc.; Shannon-entropy detector for novel
  vendor keys git-secrets misses; secretlint adapter), composite-scanner
  dedups across detectors. Out-of-band complement to ADR-0078 inline
  redaction: scans agent-EDITED file contents (`apply_patch` / `write` /
  `lsp` workspace edit diffs) before commit so a model-invented `AKIA…`
  placeholder can't reach git. Modern agents (Cursor / Codex / Claude
  Desktop) ship no typed default-OFF scanner the loop can opt into.
