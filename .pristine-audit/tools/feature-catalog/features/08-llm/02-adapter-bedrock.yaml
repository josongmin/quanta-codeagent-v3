purpose: |
  `BedrockProviderAdapter` routes Anthropic Messages API calls through AWS Bedrock's
  SigV4-signed endpoint via the optional `@anthropic-ai/bedrock-sdk` (lazy import —
  install footprint stays clean for non-enterprise users). Credentials are AWS-IAM
  shaped (env / IMDS / IRSA / SSO via SDK default chain); the four explicit
  `awsAccessKeyId / awsSecretAccessKey / awsSessionToken / awsRegion` fields on
  `ProviderAuth` are OPTIONAL — omit all four to let the SDK chain resolve. The
  adapter shares the SSE decoder `mapRawEvent` with `@/llm/adapters/anthropic.ts`
  (single source of truth for the Messages SSE grammar — Bedrock just substitutes
  the transport). DI seam: `clientFactory` lets tests inject a synthetic client
  without an AWS install. Failure taxonomy: missing SDK → `provider-missing-dependency`;
  bad creds at construction → `provider-misconfigured`; wire error → `LLMError`.
