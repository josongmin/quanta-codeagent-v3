deliberate_hold:
  scope: real-network-integration
  reason: |
    Phase 1 ships the lazy-load SDK wiring + DI seam; the actual integration test
    against a live Bedrock endpoint is deferred to V2 (requires AWS account + IAM
    setup in CI — out-of-scope for W12 closure). The hellgate proves the typed
    contract (auth-failed surfaces correctly, missing SDK surfaces as typed error,
    stream timeout wrapper composes correctly).
notes: |
  L4: Phase 2 wire impl + DI seam + hellgate. Wired into the closed-union
  registry (`FACTORIES.bedrock`); router resolves both `CLAUDE_CODE_USE_BEDROCK`
  and `ANTHROPIC_BEDROCK_BASE_URL` env conventions. Plane-clean: only `@/llm`
  imports — no `@/agent`, no `@/permission`.
