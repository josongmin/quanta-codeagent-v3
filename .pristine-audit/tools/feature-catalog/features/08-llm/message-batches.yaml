purpose: |
  Thin, dependency-light client CORE for the Anthropic Message Batches API
  (`POST /v1/messages/batches`) — async Messages-API processing at 50% of
  standard price (up to 100K requests / 256MB per batch). Hand-rolls the HTTP
  (installs are blocked in this tree; the wire contract is stable spec while the
  SDK churns) rather than reaching for `client.messages.batches`.

  `createMessageBatchesClient(opts)` exposes four methods: create / retrieve /
  results / cancel, with an INJECTED `fetch` (test seam), a configurable baseUrl
  (`https://api.anthropic.com`, trailing slash stripped), `anthropic-version`
  header (`2023-06-01`), and merge-able extra headers (e.g. an anthropic-beta).

  Defensive contract (identical posture to the otel-exporter slice):
    - NO-THROW: every method returns `BatchResult<T>` = `{ok:true,value}` or
      `{ok:false,error}` where `error.status` carries the HTTP status when the
      request reached the server, or is `undefined` on a transport throw. No
      method ever throws — a 2xx body that fails to parse to T also degrades to
      a typed `{ok:false}`.
    - `results()` parses the JSONL stream and SKIPS blank/malformed lines (one
      bad record must not drop the whole batch).
    - TOLERANT shapes: `processing_status` / `result.type` are open string
      unions; unknown fields pass through untouched on the parsed object (the
      server may add states).
    - Default-OFF: importing the module fires no request; a composition root
      must drive create→poll→results itself (no polling loop, no agent-tool, no
      host wiring in this V1 slice).
