deliberate_hold:
  reason: |
    Built + hellgate-tested but NOT yet composed at a call site. The client core
    is re-exported from the src/llm/index.ts barrel, yet no live consumer drives
    create→poll→results — there is no polling loop, no agent-tool, no host
    wiring. Default-OFF: importing the module changes no behaviour.
  promotion_path: |
    L3: a composition root (host or an agent-tool) drives the create→poll→results
    lifecycle — a polling loop over retrieve() until processing_status=="ended",
    then results() — and surfaces batch status; optionally a `/batch` slash or a
    batch_submit LLM-tool gated behind a QUANTA_* knob.
notes: |
  Wire shapes mirror the documented Batches contract (claude-api skill
  `batches.md`); only fields a caller acts on are modeled, the rest pass through.
