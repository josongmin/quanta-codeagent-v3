purpose: |
  `FoundryProviderAdapter` is a REAL streaming adapter (ADR-0172 superseded the
  ADR-0163 typed-stub once Anthropic published `@anthropic-ai/foundry-sdk@0.2.3`,
  2025-11-18). `stream()` lazy-imports the SDK and does a real `messages.create`
  against Azure AI Foundry; when the SDK is not installed it throws a typed
  `provider-missing-dependency`, and on bad config `provider-misconfigured` (NOT
  the old `provider-unsupported`). Wired into `FACTORIES.foundry`; the multicloud
  router resolves `CLAUDE_CODE_USE_FOUNDRY` / `ANTHROPIC_FOUNDRY_BASE_URL`. Auth
  fields (`azureEndpoint`, `azureApiKey`) typed in `ProviderAuth`.
evidence:
