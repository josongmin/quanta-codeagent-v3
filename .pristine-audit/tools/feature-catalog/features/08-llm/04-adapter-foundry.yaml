knobs: []
notes: |
  L4/stable (jun-06 catalog truth-up): graduated stub→REAL via ADR-0172 +
  `@anthropic-ai/foundry-sdk@0.2.3`. `stream()` lazy-imports the SDK and calls
  `messages.create`; SDK-absent ⇒ typed `provider-missing-dependency` (loud,
  install-to-enable), not a silent stub. Reachable via `QUANTA_LLM_TRANSPORT` /
  `CLAUDE_CODE_USE_FOUNDRY` through the multicloud router.
