knobs:
  - name: QUANTA_API_KEY_HELPER
    default: 'undefined'
    purpose: 'Shell command that mints an API key on stdout (TTL-cached). Reused from H7 — absent ⇒ mintApiKey() no-op ⇒ legacy env path.'
  - name: QUANTA_API_KEY_HELPER_TTL_MS
    where: DEFAULT_HELPER_TTL_MS
    default: 300000
    purpose: 'TTL (ms) for the minted-key cache. Reused from H7. Default 5min (mirrors Claude).'
  - name: QUANTA_API_KEY_HELPER_LEGACY_VENDOR
    default: '0'
    purpose: 'Gate the legacy-vendor consumption of the mint. Only the literal 1 makes the composition root pass the H7 CredentialSource into resolveVendorApiKey for anthropic/openai. Unset ⇒ source NOT passed ⇒ byte-identical env-key path. Orthogonal to the cloud-refresh path (always available when its knobs are set).'
  - name: QUANTA_LLM_CREDENTIAL_TRUSTED
    default: '0'
    purpose: 'FAIL-CLOSED trust attestation reused from H7 — only the literal 1 authorizes the mint shell to run; unset/anything else ⇒ typed untrusted decline, NEVER a run.'
notes: |
  L4 — slice + hellgate + LIVE composition-root threading complete (jun-6). The
  full chain is reachable by config: CLI `cliBuildLlm` (async, `src/apps/cli/repl.ts`)
  → `buildLLMWithByok` (`src/apps/cli/internal.ts`, gated on
  `apiKeyHelperLegacyVendor` + legacy transport) → `buildLLMWithByokCore`
  (`src/runner/assemble/llm.ts`) → `resolveVendorApiKey` → sync `createLLM`.
  `resolveVendorApiKey` (src/llm/factory.ts) is the proven async pre-resolution
  helper; `MINTABLE_PROVIDERS = {anthropic, openai}` pins the guard.

  The load-bearing host edit: `BuildLlmFactory` (`src/host/bootstrap/types.ts`)
  now returns `LLMPort | Promise<LLMPort>` and `bootstrapSession`
  (`src/host/bootstrap/bootstrap-session.ts`) `await`s `deps.buildLlm(...)`, so the
  async mint-then-build resolves before `result.llm` is consumed (a leaked Promise
  would have no `.stream`). Without this the async `cliBuildLlm` was a TYPE ERROR
  against the prior sync factory and the Promise would have been assigned where an
  `LLMPort` was expected. Locked by bootstrap hellgate cases 10b (async build is
  awaited → resolved adapter, not a Promise) + 10c (rejecting async build → typed
  `llm_build_failed`).

  DEFAULT-OFF BYTE-IDENTITY preserved: knob unset OR cloud transport ⇒
  `buildLLMWithByok` delegates verbatim to the sync `buildLLM` (immediate resolve);
  knob on but no `apiKeyHelper` ⇒ `buildCredentialSource` returns undefined ⇒
  `resolveVendorApiKey(source=undefined)` returns the same opts ⇒ env-key path.

  TESTS (14): byok-apikey-resolve (10) — mint feeds opts.apiKey for
  anthropic/openai; explicit opts.apiKey wins (0 shell); knob-off (source
  undefined) ⇒ ===-identical opts; helper-unset ⇒ undefined ⇒ unchanged;
  non-mintable (chatgpt-oauth/bedrock-cast) skipped (0 shell); empty mint ⇒
  helper-failed (env not clobbered); untrusted ⇒ untrusted (fail-closed); no-leak
  (secret never in a thrown message). byok-apikey-e2e (4) — minted key is what
  AnthropicAdapter is built with (env ignored); 2nd resolve within TTL re-uses
  the cached mint (shell ran ONCE); knob-off ⇒ env key; knob-off + empty env ⇒
  MissingApiKeyError.
