purpose: |
  Extends the H7 `CredentialSource.mintApiKey()` (already hardened — TTL cache,
  single-flight, empty-stdout guard, trust gate, no-leak) to feed the LEGACY
  `anthropic` / `openai` vendor key path that `createLLM` resolves from
  `ANTHROPIC_API_KEY` / `OPENAI_API_KEY`. Before this, only the SIBLING
  `refreshCloudCreds(...)` capability had a live consumer (Bedrock/Vertex); the
  `mintApiKey()` path was dead for the legacy `Authorization` / `x-api-key`
  header. This is Claude Code's `apiKeyHelper` + `CLAUDE_CODE_API_KEY_HELPER_TTL_MS`
  applied to the vendor key: a short-lived, broker-minted key is injected in place
  of the static env var.

  The single load-bearing constraint is that `createLLM` is SYNCHRONOUS while
  `mintApiKey()` is async. Resolved by a composition-root pre-resolution step,
  `resolveVendorApiKey(provider, opts, source)` (`src/llm/factory.ts`): the root
  `await`s the mint and passes the minted key in as `opts.apiKey` (which already
  wins over env), THEN calls the unchanged sync `createLLM`. The factory, the
  adapters, and `MissingApiKeyError` are byte-identical otherwise.

  GUARD: only `anthropic`/`openai` are mintable (`MINTABLE_PROVIDERS`).
  `chatgpt-oauth` (on-disk token) and the cloud transports (`bedrock`/`vertex`,
  which use `refreshCloudCreds`) are returned unchanged with ZERO shell calls.

  PRECEDENCE (deterministic): explicit `opts.apiKey` wins over the mint (mint not
  even consulted) > `apiKeyHelper` mint (above env — a configured helper is the
  operator's stated rotation intent) > `env[API_KEY_ENV[provider]]` > else
  `MissingApiKeyError`. The H7 empty-stdout guard makes "mint above env" SAFE — a
  broken helper THROWS `helper-failed` rather than shadowing a working env key
  with `""`.

  DEFAULT-OFF: `source === undefined` (no H7 knob, or the legacy-vendor gate off)
  ⇒ the SAME `opts` reference is returned and `createLLM` resolves from env
  exactly as today (byte-identical). A configured-but-broken / untrusted helper
  FAILS LOUDLY (typed `CredentialHelperError`) — matching the H7 fail-before-wire
  posture, never a silent fall-through to a stale env key.
