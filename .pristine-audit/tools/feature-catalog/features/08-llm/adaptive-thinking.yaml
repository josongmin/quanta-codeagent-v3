knobs:
  - name: 'QUANTA_ADAPTIVE_THINKING'
    where: 'runtime-config.ts → applyEffortClassifierFloor (skill-gate.ts)'
    purpose: 'strict =1 opt-in; ON ⇒ {type:adaptive} for 4.6+ families, else manual budget; OFF ⇒ byte-identical manual budget'
deliberate_hold: null
notes: |
  Family gate는 1h-cache allowlist와 의도적으로 다름: `claude-haiku-4-5`는 1h-cache set에는 있지만
  adaptive set에는 없음 (haiku는 adaptive 미지원). SDK-cast 결정: `@anthropic-ai/sdk@0.40.1`은
  `ThinkingConfigAdaptive` 타입이 없어 codec 단일 spread site에서 `as Anthropic.ThinkingConfigParam`
  cast — wire bytes는 정확, 컴파일 타입만 satisfy (SDK bump이 깔끔하나 adapter의 hand-rolled RawEvent
  narrow blast-radius 때문에 보류; RFC §8 open-question). `display:"summarized"` + `output_config.effort`
  배선은 follow-up (RFC §8.3/§8.4). 18 hellgate 케이스 (family-gate 4 + producer-decision 9 + codec
  wire 3 + provider-isolation 2). maturity L3: producer+codec+knob wired & tested이나 default-OFF +
  composition-root live-flip은 미배선 (L4 overclaim 회피).
