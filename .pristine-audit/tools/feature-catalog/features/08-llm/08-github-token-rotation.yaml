notes: |
  L4: 18-test hellgate covers threshold logic (rotate iff remaining <
  threshold), HTTP 4xx vs 5xx vs throw, malformed response, lock contention
  (would-wait → skipped-locked, redis-error → skipped-lock-error), finally
  release on throw, clock skew during refresh (post-call clock wins), empty
  arg defenses (programmer-bug rejection), custom endpointBase, concurrent
  rotate race (lock prevents double wire call). Pure function — no instance
  state; every call re-checks expiry and re-acquires lock.
