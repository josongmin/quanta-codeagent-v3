purpose: |
  `rotateGitHubToken({current, clientId, clientSecret, httpPort, clockPort,
  lockPort, holderId, rotateAfterMs?, lockTtlMs?, endpointBase?})` rotates a
  GitHub OAuth pair WELL BEFORE its 8-hour expiry so long-running sessions
  never hit 401s during `gh api` calls. Generalizes Cursor's
  `RefreshGithubAccessTokenInBackgroundComposer`. Lock-protected — keyed by
  `gh-token-rotation:{userId}` so two CLI instances belonging to the same
  user do not double-rotate. Release in `finally` so HTTP throws never strand
  the lock. Result discriminator (closed union): `rotated` (with new pair) /
  `not-needed` (token still has > rotateAfterMs life) / `skipped-locked`
  (someone else holds it) / `skipped-lock-error` (Redis/file lock failed) /
  `refresh-rejected` (4xx — re-auth required) / `refresh-transient` (5xx or
  network — retry permitted) / `refresh-malformed` (response missing
  access_token/expires_in). Default constants documented to vendor source:
  `DEFAULT_ROTATE_AFTER_MS=6h` (GitHub App TTL is 8h, rotate at 6h leaves 2h
  headroom), `DEFAULT_LOCK_TTL_MS=30s` (10x the p99 round-trip). New refresh
  token preferred when present in response; absent → keep current
  (per GitHub docs).
evidence:
