id: aug02-rfc01-a1-boot-rehydrate
title: RFC01 A1 — SDK cold-start SavedSession snapshot rehydrate
section: 7
subsystem: Resume / SDK cold-start rehydrate (aug-02 RFC01 A1)
order: 552
maturity: L3
status: new
ui_surfaces: [api, cli]
monitoring: n-a
modes: [headless, interactive]
configurable: static
owners: ["@songmin"]
labels: ["rfc:aug02-01", "surface:sdk"]
purpose: |
  RFC-01 A1 boot-rehydrate: on SDK runtime cold start, a persisted SavedSession
  snapshot is injected into the rehydrate path so a fresh runtime resumes the
  prior transcript HISTORY (messages) instead of starting empty. (hellaudit R2-B:
  only the transcript is rehydrated into runtime state — the durable rollback
  ledger is preserved on disk but not re-hydrated into the live runtime.)
  Additive on the SDK runtime session factory; when no snapshot is present the
  cold-start path is byte-identical to a brand-new session. Pairs with the
  crash-resume hellgate that proves a killed session rehydrates on next boot.
evidence:
  code:
    - src/sdk/runtime/session/rehydrate.ts
    - src/sdk/runtime/session.ts
    - src/sdk/runtime/runtime.ts
  adrs: ["docs/plans/aug-02-absorption/rfc-01-persistence-resume.md"]
  tests:
    integration:
      - tests/integration/crash-resume-hellgate.test.ts
