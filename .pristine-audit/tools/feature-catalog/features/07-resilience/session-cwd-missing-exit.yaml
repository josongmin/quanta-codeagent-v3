notes: |
  `existsSync` is a deliberate (synchronous) probe — this runs once at
  resume boundary BEFORE any agent loop is started, so the sync FS hit is
  one-shot and the failure-fast property is more important than the
  microsecond. The slog observability emits a `session.cwd.switched`
  structured event on the success path (from→to) so a triage can correlate
  the chdir with any subsequent tool calls.

  History: prior implementation called `logger.error(...)` + `process.exit(1)`
  inline. The inline exit killed the bun test runner mid-suite when the
  contract test exercised the missing-cwd path, masking unrelated failures.
  The throw-then-top-level-catch refactor preserved exit code + log line
  while restoring test-runner survivability and making the failure
  introspectable (`e instanceof SessionStartupError && e.kind === "session_cwd_missing"`).
