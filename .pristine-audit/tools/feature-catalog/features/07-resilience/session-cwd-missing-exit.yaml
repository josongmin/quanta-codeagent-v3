purpose: |
  HIGH-4 fail-loud guard for the resume path. When `--resume <id>` lands on
  a session whose recorded cwd no longer exists on disk (worktree removed
  since save / external rm -rf), `switchToSessionCwd` throws a typed
  `SessionStartupError` (kind: `session_cwd_missing`, exitCode: 1) with the
  diagnostic message "Session cwd missing: <path>. The worktree may have
  been removed." BEFORE the SessionDeps capture chains a stale cwd. The
  top-level `main().catch` in `apps/cli/index.ts` recognizes both
  `SessionStartupError` and `SessionBootstrapError`, logs `e.message`, and
  exits `e.exitCode` — so the user-visible behavior is still a clean exit-1
  with a single diagnostic line, but the error flows through a typed throw
  instead of an inline `process.exit(1)`. This unblocks contract tests
  (which can assert structured failure without killing the test runner) and
  keeps lifetime concerns (when the process actually dies) at the
  composition root rather than buried in a leaf helper. Without this guard
  the next `process.cwd()` read silently anchors the session to the LAUNCH
  directory — every subsequent tool call routes there, scrambling the
  user's actual project state. Same-cwd short-circuit (target === current)
  is a no-op and returns current verbatim (most common path: resume in the
  same cwd). Live chdir on the changed path uses `process.chdir(target)` +
  reads back `process.cwd()` to capture the canonical (symlink-resolved)
  form. Distinct from generic argv-error exit (EX_USAGE=64): this is a
  STATE-of-disk failure, not a usage failure, so it uses the generic-error
  code (1).
