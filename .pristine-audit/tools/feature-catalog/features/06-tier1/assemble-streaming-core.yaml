purpose: |
  Surface-agnostic streaming/observability wiring (RFC-0002 §5.4/§8).
  Default OFF: no `observeDir` ⇒ plain `StdoutStream` + no `RunContext`
  (byte-identical to today). When `observeDir` is set:
  (1) Mint a `runId` (caller-supplied OR `crypto.randomUUID()` when absent)
      so cross-process surfaces can correlate events with the same id they
      already minted off-thread.
  (2) Construct `RunContext = { runId }` and tag a `JsonlRecorder` writing
      to `join(observeDir, runId, "session.jsonl")` with `{ ctx: run }`.
  (3) Fan-out: return `TeeStream([stdoutStream, recorder])` so events hit
      both human surface AND the JSONL on-disk record.
  (4) Emits `observe.on { dir, runId }` structured log.
  Optional `painter` (e.g. inline markdown highlighter) is injected into the
  `StdoutStream` only when present — when absent, deltas write verbatim
  (byte-identical to the pre-painter path). CLI injects; recorders / Web
  surfaces leave it undefined.
