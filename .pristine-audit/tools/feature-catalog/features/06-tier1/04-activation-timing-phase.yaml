  + per-turn suggestion/label injection (`src/agent/features.ts` /
  `buildSkillFeatures`). What is HELD: time-sliced activation phases beyond
  that one-shot cache. Distinct from ADR-0077 output-phase tagging
  (commentary/final_answer on the LLM stream).
