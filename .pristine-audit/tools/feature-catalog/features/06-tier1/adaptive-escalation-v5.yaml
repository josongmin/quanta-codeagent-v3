purpose: |
  v5 thin-first ADAPTIVE escalation controller for SWE-bench, the structural
  bridge between the cheap thin-strict default and the bounded proof-clean
  posture. A closed-schema LLM router (fail-closed parser) chooses the next bench
  PHASE from a deterministic evidence read-model; bounded transition rules cap
  reroutes / expensive escalations; the posture-injection seam folds detachable
  capability MODULES (PHASE_MODULES) onto the thin base at RUNTIME instead of
  baking a fat preset. Pieces: decision-schema (closed AdaptiveAction + EvidenceGap
  + fail-closed parse), transitions (bounded state machine), router-prompt +
  router-evidence (LlmEvidencePacket → RouterEvidence CQRS read-model, single
  origin), evidence-facts (deterministic gap classifier), llm-router +
  phase-executor port factories, adaptive-run (the assembled keystone), and the
  posture seam (knob-module / capability-profiles + the preset-spec SSOT
  `kernel/preset-spec.ts` where `resolvePresetSpec` GENERATES the resolved knob
  map from a PresetSpec — one origin, the literal-vs-composite double-book and its
  byte-identical golden oracle removed; parity pinned by preset-spec-parity). Default-OFF /
  byte-identical: selecting the preset is INERT (≡ thin-strict) until
  QUANTA_BENCH_V5_ADAPTIVE is explicitly on. The live driver call-site + real
  LLM/phase adapters are Wave-3 deferred (gate on a measured oracle, never n=1),
  so the controller is a hermetically-tested skeleton not yet promoted.
