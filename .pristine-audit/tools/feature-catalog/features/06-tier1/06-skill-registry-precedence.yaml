id: skill-registry-precedence
title: Skill registry — 7-source discovery + precedence resolver (ADR-0134 §1)
section: 6
subsystem: 스킬 — registry + lookup
order: 13
maturity: L4
status: new
ui_surfaces: [none]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: static
owners: ["@songmin"]
labels: ["surface:core", "tier:1"]
depends_on: [skill-7-scope-tiering, quantaskillsdir, skill-admin-enforcement, skill-audit-log, skill-discover]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 4/4 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure internal registry/precedence resolver, no UI on any surface"
purpose: |
  `buildSkillRegistry({ repoRoot, homeDir, orgConfigDir, systemSkillsDir })` — 7-source 병렬
  discovery 후 고정 precedence (admin > repo > team > user > personal > system > builtIn) 적용.
  같은 name 충돌 시 winner + overriddenScopes[] 기록 → `lookup(name): {skill, winnerScope,
  overriddenScopes}` + `bySope(scope): Skill[]`. Legacy ~/.claude/skills/ fallback은
  ~/.quanta/skills/ 비었을 때만 발화 (default ON, `legacyClaudeSkillsFallback: false` 로
  disable). source dir 없으면 silent skip (no crash).
evidence:
  code:
    - src/skill/registry.ts
    - src/skill/types.ts
    - src/skill/discover.ts
    - src/skill/index.ts
  adrs: [134]
  tests:
    unit:
      - tests/unit/skill-registry-precedence.test.ts
      - tests/unit/skill-scope-types.test.ts
    integration:
      - tests/integration/skill-scope-e2e.test.ts
    contract: []
knobs:
  - name: legacyClaudeSkillsFallback
    default: true
    purpose: '~/.quanta/skills/ 비었을 때 ~/.claude/skills/ 로 fallback'
  - name: extraSkills
    default: '[]'
    purpose: 'in-code builtIn 스킬 직접 주입 (host-supplied)'
deliberate_hold:
  reason: 'registry는 작동 (snapshot pure)하지만 buildSkillsConfigCore가 단일 `dir`만 받아 7-source registry를 호출하지 않음. CLI surface는 user dir + bundled system만 사용.'
  promotion_path: 'buildSkillBlock에서 buildSkillRegistry({repoRoot, homeDir, orgConfigDir, systemSkillsDir}) 호출 → SkillRegistry 객체를 inject 해 lookup precedence 활성화.'
notes: 'No cache layer at registry — 24h TTL은 host adapter가 wrap. registry는 snapshot (deterministic given inputs).'
