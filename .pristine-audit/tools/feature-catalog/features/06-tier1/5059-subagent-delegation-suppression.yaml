knobs: ["QUANTA_SUBAGENT_DELEGATE_SUPPRESS"]
deliberate_hold: null
notes: |
  SSOT lives in @/shared (neutral leaf); knob resolved via the pure
  delegationSuppressEnabled(env) (same gateOn vocab as
  runtimeConfig().subagentDelegateSuppress; registered in knobs-a.ts + the
  default-off completeness guard). Consumers read env directly to avoid a
  PRE-EXISTING features.ts module-init import cycle (@/tool spawn-batch already
  exhibits it at HEAD — subagent-batch-hellgate fails at the branch point,
  independent of this feature). COMPLETE: two general spawn tool descriptions AND
  the system-prompt tool-routing fan-out line gated under one knob. The prompt
  line uses a `hasDelegationSuppress` facet (two mutually-exclusive variants of
  the same atomId); bodyRenderCtx reads the session-constant knob so the
  static-per-session prefix stays byte-stable (ADR-0003). Default-OFF
  byte-identical; ON swaps the unconditional fan-out guidance for an
  authorization-conditioned one — proven against the real buildSystemPrompt (not
  just synthetic render). No A/B confound.
