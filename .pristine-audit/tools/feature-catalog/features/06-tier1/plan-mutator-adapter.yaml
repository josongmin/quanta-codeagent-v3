purpose: |
  The producer-side `PlanStore` returns `PlanResult<PlanDelta>` (rich
  shape: full Plan snapshot + typed delta). The duck-typed consumer-side
  `PlanMutator` (in `@/tool/types`) returns `PlanMutationResult` (compact
  shape: version + delta kind + touched ids). This adapter is the ONLY
  place the two shapes meet — keeps the slice fence intact (`@/tool` never
  imports `@/agent/plan`; the duck-type seam is what dispatch consumes),
  and centralizes the by-value translation so a drift between producer
  and consumer fails at exactly one site. Every mapping is a closed
  switch with `never` default arm — no heuristics.
