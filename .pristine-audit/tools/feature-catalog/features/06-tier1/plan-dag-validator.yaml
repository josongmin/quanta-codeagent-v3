surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 3/4 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure internal validator (validateDag/findCycle/topologicalSort); no I/O, no UI affordance"
purpose: |
  Three pure exports operating on a `Readonly<Record<string, TodoItem>>`
  graph. `validateDag` is the full-plan validator that returns the first
  failure in PRIORITY ORDER: self_dependency → dependency_unknown →
  dependency_cycle (typed as `PlanMutationError` via `PlanResult`).
  `findCycle` runs DFS with tri-state coloring and returns the cycle path
  (traversal order, not necessarily canonical) or null; optional `startId`
  narrows the search to a reachable subtree. `topologicalSort` is Kahn-
  style with deterministic tie-break by lexicographic id, returning ordered
  ids or `{ cycle: [...] }` on a cyclic graph. Complexity is O(V+E) for
  all three. A 100-node perf hellgate pins the 50ms ceiling so a quadratic
  regression fails CI. Distinct from all three of Cursor/Codex/Claude:
  none of them ship a DAG validator on plan dependencies.
evidence:
