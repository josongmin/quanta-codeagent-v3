reachable: yes
surface_findings:
  - The assembler owns one observer per enabled session; the agent loop records cache buckets into it and the tier-1 builder exposes the same object through the tool.
  - The tool is a live read-only session surface and dispatches without a permission confirmation in normal or plan mode.
  - A dedicated browser cache panel is absent, so no web-specific delivery claim is made.
