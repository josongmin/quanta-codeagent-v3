reachable: yes
surface_findings:
  - Interactive CLI default is painter-on, not default-off: absence of disabling environment values and a TTY creates the conservative painter.
  - Non-TTY and all disabling gates omit the painter, leaving the redacted stdout path byte-identical; non-CLI surfaces do not inject one.
  - StdoutStream redacts before optional painter processing and flushes buffered text before non-assistant events.
