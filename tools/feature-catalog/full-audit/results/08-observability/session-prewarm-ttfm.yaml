    revision: 9a12f7a855640a8be1e4654472766bbc445696ea
    result: pass
    evidence: 35 prewarm-focused cases pass within the 89-case combined rail, covering OFF identity, synthetic warm outcomes, TTFM metrics, and composition-root projection.
  - kind: runtime
    command: bun -e 'import { runSessionPrewarm } from "./src/agent/startup-prewarm.ts"; const llm = { stream: async function* () {}, prewarm: () => new Promise(() => {}) }; const state = await Promise.race([runSessionPrewarm({ llm, recorder: undefined, now: Date.now }).then(() => "settled"), new Promise((resolve) => setTimeout(() => resolve("timed-out"), 100))]); console.log(state)'
    revision: 9a12f7a855640a8be1e4654472766bbc445696ea
    result: fail
