    command: git grep -n -E 'resolvePrewarmSlot|maybeRunSessionPrewarm|markFirstDispatch|prewarm' 9a12f7a855640a8be1e4654472766bbc445696ea -- src/host src/agent src/llm
    revision: 9a12f7a855640a8be1e4654472766bbc445696ea
