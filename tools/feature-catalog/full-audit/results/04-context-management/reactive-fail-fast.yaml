entrypoints:
  - src/agent/loop/session-bootstrap.ts:breaker construction
  - src/agent/loop/compaction-wire.ts:maybeCompact
activation:
  - Active whenever the loop has a compaction path; QUANTA_COMPACT_BREAKER=off explicitly disables the breaker and optional cap values override defaults.
effective_defaults:
  cli: on
  web: on
  bench: on
  headless: on
  daemon: on
producer:
  - src/agent/compaction.ts:reactiveCompact
  - src/agent/loop/compaction-wire.ts:record proactive and reactive outcomes
consumer:
  - src/agent/loop/compaction-wire.ts:breaker check before retry
  - src/agent/stop-category.ts:compaction stop classification
reachable: yes
surface_findings:
  - The session bootstrap creates a breaker unless explicitly disabled; both reactive and proactive compaction paths feed the same instance.
  - No-progress compactions accumulate deterministic strikes, while productive compactions and productive turns reset them; a tripped breaker returns a reason instead of retrying indefinitely.
