version: 1
feature_id: mcp-tasks-live
snapshot_head: 01f02dbbac807a9bad0420cd509fa3e75a930037
status: closed
owner_seam: src/agent/mcp-bridge.ts:tasksToolsFor
entrypoints:
  - src/host/mcp-composition.ts:loadMcpToolsOrEmpty
  - src/apps/cli/internal.ts:loadFeatures
  - src/apps/web-daemon/runtime-factory.ts:loadDaemonMcp
activation:
  - A configured MCP client starts and advertises capabilities.tasks in its initialize response.
  - The bridge registers three model-facing mcp_tasks tools only for that negotiated capability; no environment gate is involved.
effective_defaults:
  cli: off
  web: off
  bench: off
  headless: off
  daemon: off
producer:
  - src/mcp/tasks/client-port.ts:clientTasksPort
  - src/mcp/tasks/client-port.ts:tasksPortOver
consumer:
  - src/agent/mcp-bridge.ts:tasksToolsFor
  - src/agent/mcp-bridge.ts:loadMcpTools
  - src/tool/mcp-tasks.ts:mcpTasksTools
reachable: yes
surface_findings:
  - loadMcpTools starts the concrete client, obtains ordinary tools, and appends the three mcp_tasks tools only after serverSupportsTasks succeeds.
  - Each tool dispatches tasks/list, tasks/getInfo or tasks/getResult, and tasks/cancel through requestRaw; hostile successful payloads normalize to typed conservative outcomes while transport errors propagate as McpError.
  - Both CLI and web-daemon use the shared MCP composition, and generic tool-call rendering carries registered tool activity to the web session surface.
