owner_seam: src/agent/side-agent-runner.ts:wireSideAgentDaemons
entrypoints:
  - src/apps/cli/index.ts:runCli
  - src/host/runtime/agent-config-assembler.ts:maybeWireSideAgent
activation:
  - QUANTA_SIDE_AGENT enables the in-process resident daemon registry.
  - QUANTA_TEAM_IDLE enables the injected idle barrier for that registry.
  - QUANTA_SIDE_AGENT_PROCESS remains unset; the forked process registry does not compose this in-process barrier.
effective_defaults:
  cli: off
  web: off
  bench: off
  headless: off
  daemon: off
producer:
  - src/subagent/coordination/idle-barrier.ts:createIdleBarrier
  - src/side-agent/registry.ts:createSideAgentDaemonRegistry
consumer:
  - src/agent/side-agent-runner.ts:wireSideAgentDaemons
  - src/host/runtime/agent-config-assembler.ts:maybeWireSideAgent
reachable: yes
surface_findings:
  - The live in-process side-agent host builds a real idle barrier under QUANTA_TEAM_IDLE and the registry drives beacons through spawn, pass, reactivation, completion, and stop lifecycle events.
  - With no barrier the registry reports teamIdle false and idleSince undefined, preserving legacy polling semantics.
  - The OS-process side-agent backer is an explicit composition limitation: it bypasses wireSideAgentDaemons and therefore does not expose this barrier; its findings remain pull-only.
