surface_findings:
  - loadFeatures creates the interactive factory only when CLI input is usable, and loadMcpTools injects its per-server prompter into McpClient; inbound routing then returns accept, cancel, or decline responses rather than dropping a request.
  - Headless clients retain the typed headless-denied decline, seven schemas validate with one retry, invalid empty enum and non-finite inputs are rejected, and abort maps to cancellation.
