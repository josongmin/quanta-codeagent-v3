reachable: yes
surface_findings:
  - The production assembler mints a real registry only under QUANTA_SIDE_AGENT, and the Tier-1 feature builder exposes the same registry through four side_agent tools.
  - The in-process backer adapts a bounded, read-biased subagent pass and broadcasts capped findings to the root mailbox; session cleanup calls stopAll without propagating errors.
  - The optional process backer has supervised fork and pullable findings, but does not push findings through the session mailbox; this is a documented behavior distinction, not an unreachable seam.
