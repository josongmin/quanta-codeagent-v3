surface_findings:
  - The REPL passes enqueueWithHeartbeat into assembleAutomation and starts the slot's ticker, so interactive fires reach the real agent queue.
  - Shared session bootstrap now arms an automation slot for every surface, but the generic composition root's handler only records a drop metric and warns.
  - Therefore the advertised headless mode does not have a production dispatch consumer unless its preset overrides the stub handler.
