surface_findings:
  - The daemon projects facade ports only when observability is enabled; subscription attaches a per-connection emitter and close stops it before socket eviction.
  - The real served-WebSocket rail proves snapshot-first delivery, delta propagation, per-connection isolation, and no frames in the no-port default path.
  - Send failures are swallowed so a dead socket does not block healthy peer emitters.
