surface_findings:
  - The CLI MCP composition creates a file-backed token store and passes it through buildMcpOAuthWiring when the OAuth gate and an oauth:true HTTP server are present.
  - The provider discovers endpoints, calls registerOAuthClient only when no static client id exists and registration_endpoint is advertised, then memoizes the resolved client id per server.
