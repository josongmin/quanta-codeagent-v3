surface_findings:
  - The concrete ToolContext optional seam is supplied by agent dispatch and consumed only after recoverable V4A failures.
  - Security-boundary errors and aborted signals bypass fallback; a thrown or unsuccessful port result restores the original error.
  - The runtime rail proves the full path from an env-enabled runtime through real apply_patch to a rescued file mutation and pairs it with OFF byte identity.
