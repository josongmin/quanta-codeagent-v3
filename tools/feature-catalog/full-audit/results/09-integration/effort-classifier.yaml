version: 1
feature_id: effort-classifier
snapshot_head: 01f02dbbac807a9bad0420cd509fa3e75a930037
status: closed
owner_seam: src/agent/effort-classifier/store.ts:createEffortClassifier
entrypoints:
  - src/agent/optional-ports.ts:wireOptionalAgentPorts
  - src/agent/loop/session-lifecycle.ts:prepareTurn
  - src/agent/loop/stream-consume.ts:consumeStream
activation:
  - QUANTA_EFFORT_AUTO=on injects a session-scoped classifier when no caller supplied one.
  - Prompt observations and failed tool dispatches accumulate a recommendation that is applied as the per-turn thinking floor.
effective_defaults:
  cli: off
  web: off
  bench: off
  headless: off
  daemon: off
producer:
  - src/agent/effort-classifier/store.ts:createEffortClassifier
  - src/agent/effort-classifier/keyword-detector.ts:detectKeywordSignals
consumer:
  - src/agent/loop/context-assembler.ts:observeEffortClassifierPrompt
  - src/agent/dispatch.ts:observeEffortClassifierToolFailure
  - src/agent/loop/skill-gate.ts:applyEffortClassifierFloor
reachable: yes
surface_findings:
  - The optional-port wire mints the classifier under QUANTA_EFFORT_AUTO and the loop observes prompts, tool failures, compaction, and recovery resets.
  - stream-consume reads the recommendation through applyEffortClassifierFloor before invoking the LLM, so it changes effective per-turn thinking rather than remaining an inert advisory port.
  - The catalog's advisory-only and future-consumer statements are stale; the feature is product-active under its existing gate.
