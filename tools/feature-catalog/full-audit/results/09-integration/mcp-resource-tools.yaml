entrypoints:
  - src/apps/cli/internal.ts:loadFeatures and buildMcpResourceTools
  - src/agent/mcp-bridge.ts:resourcesHandleFor and aggregateResourcesHandle
activation:
  - Set QUANTA_MCP_RESOURCES=1 and connect at least one MCP server advertising resources or prompts; the CLI registers the six resource and prompt tools through the mcp-origin array.
effective_defaults:
  cli: off
  web: off
  bench: off
  headless: off
  daemon: off
producer:
  - connected MCP resources and prompts aggregate handle
consumer:
  - six mcp resource/prompt tools and the CLI resource capture holder
reachable: yes
surface_findings:
  - loadFeatures builds the aggregate from live or supervised clients, applies the strict gate, and appends tools through mcpTools so outputs receive MCP untrusted-source provenance and defanging.
  - Read and prompt operations are typed no-throw; blob output is jailed and capped rather than inlined, while unavailable capabilities and reconnect gaps return typed failures.
