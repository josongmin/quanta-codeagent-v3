surface_findings:
  - The root reads disk bindings only on the strict opt-in path, then passes them to buildBaseFromArgs and installs handlers on the session HookBus.
  - Missing or blank acknowledgement fails at startup before handlers can arm; an empty binding set remains disarmed.
  - Hook payload is passed as bounded JSON stdin, not interpolated into the command string; timeout and non-zero results deny.
