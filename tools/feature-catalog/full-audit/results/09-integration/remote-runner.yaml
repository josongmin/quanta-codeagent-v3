entrypoints:
  - src/apps/cli/index.ts:main
  - src/apps/cli/remote-cmd.ts:runRemoteCmd
activation:
  - quanta remote dispatches selectRemoteRunner(process.env,{}) for the explicit remote subcommand.
  - QUANTA_REMOTE_RUNNER=headless and QUANTA_REMOTE_DEFAULT_IMAGE select the deterministic adapter; docker, lima, and apple-vz require their host seams.
effective_defaults:
  cli: off
  web: na
  bench: off
  headless: off
  daemon: off
producer:
  - src/remote/runner/registry.ts:selectRemoteRunner
  - src/remote/runner/headless-stub.ts:createHeadlessRunner
consumer:
  - src/apps/cli/index.ts:main
  - src/apps/cli/remote-cmd.ts:runRemoteCmd
reachable: yes
surface_findings:
  - The CLI performs a dedicated early remote route, injects the selected runner into runRemoteCmd, and exposes run/status/logs/cancel handlers.
  - Live smoke succeeded with QUANTA_REMOTE_RUNNER=headless and QUANTA_REMOTE_DEFAULT_IMAGE=alpine, emitting a headless handle; gate-off exited 64 with remote-not-configured.
  - The registry returns null for unset, none, unknown, or unavailable host adapters, preventing accidental subprocess execution on the default path.
