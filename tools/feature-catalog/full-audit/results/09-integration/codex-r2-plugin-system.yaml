activation:
  - A workspace contains .quanta/plugins entries for automatic plugin activation.
  - QUANTA_MENTION_APP_PLUGIN enables plugin:// and @@app resolver dependencies.
  - The advertised workspace app override would require a production caller of createWorkspaceAppCatalog, which is absent.
