reachable: no
surface_findings:
  - Automatic discovery, manifest parsing, MCP launch, skill union, and plugin/app mention ports are composed through the interactive assembler.
  - The real mention host injects defaultAppCatalog, not createWorkspaceAppCatalog.
  - createWorkspaceAppCatalog and loadWorkspaceAppCatalog have only their owner-local tests; a .quanta/apps.json override never reaches the shipped mention resolver.
