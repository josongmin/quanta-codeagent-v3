surface_findings:
  - The CLI commands are registered by default, contrary to the catalog prose calling the rewind path default-OFF.
  - Rewind and fork resolve their target solely through Message.id, but no production persistence caller invokes assignMessageIds for ordinary transcripts.
  - File restore is safely refused unless both the destructive gate and port are present, and even then intentionally degrades because no persisted per-message checkpoint exists.
