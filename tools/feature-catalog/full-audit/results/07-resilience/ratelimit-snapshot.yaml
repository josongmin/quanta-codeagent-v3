activation:
  - QUANTA_RATELIMIT_PROACTIVE enables the snapshot store, response-header hook, and pre-request backoff.
  - QUANTA_RATELIMIT_NOTICE alone wires capture and a notice event but leaves proactive sleep disabled.
effective_defaults:
  cli: off
  web: off
  bench: off
  headless: off
  daemon: off
producer:
  - src/llm/responses-stream.ts and src/llm/adapters/anthropic.ts call the optional response-header hook.
consumer:
  - session-bootstrap constructs the store only when proactive or notice is enabled.
  - stream-consume parses headers, emits the restricted notice, and applies the provider-reset delay before the next request only when proactive is enabled.
reachable: yes
surface_findings:
  - The interactive CLI is the catalog's verified surface; the web host drops this transient event.
  - Empty provider buckets delay by the supplied reset only, with a 60-second ceiling; malformed or unknown headers degrade to no proactive action.
