version: 1
feature_id: cap-enforcer-nextaction
snapshot_head: 01f02dbbac807a9bad0420cd509fa3e75a930037
status: closed
owner_seam: src/agent/cap-enforcer.ts:CapEnforcer and buildCapEnforcer
entrypoints:
  - src/apps/cli/internal.ts:runtime configuration parsing
  - src/agent/loop/session-bootstrap.ts:attachCapEnforcer
activation:
  - QUANTA_CAP_ENFORCE=1 makes runtimeConfig().capEnforce true.
  - AgentConfig.capEnforce true also allocates the session-scoped CapEnforcer.
effective_defaults:
  cli: off
  web: na
  bench: off
  headless: off
  daemon: off
producer:
  - src/agent/cap-enforcer.ts:record tracks the returned NextAction by tool and target path.
consumer:
  - src/agent/dispatch.ts invokes capEnforcer.check before dispatch.
  - src/agent/dispatch/execute.ts invokes capEnforcer.record after a tool result.
  - src/agent/loop/session-bootstrap.ts installs the enabled session instance.
reachable: yes
surface_findings:
  - The unset env path returns undefined and dispatch performs no check or allocation.
  - Both env and explicit AgentConfig activation route into the production dispatch and execute seams.
