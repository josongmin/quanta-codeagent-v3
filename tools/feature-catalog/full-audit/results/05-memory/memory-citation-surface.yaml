  - src/agent/loop/context-assembler.ts:resolveMemoryContext
  - src/agent/loop/session-lifecycle.ts:buildFinalAgentOutcome
activation:
  - A configured memory store makes every assembled turn call resolveMemoryContext.
  - recallContext emits only records placed in the reminder tail; the loop accumulates them and emits AgentOutcome.memoryCitations only when at least one record was placed.
effective_defaults:
  cli: on
  web: off
  bench: off
  headless: unknown
  daemon: off
producer:
  - src/agent/memory.ts:recallContext onPlaced callback
  - src/agent/loop/context-assembler.ts:resolveMemoryContext citation accumulator
consumer:
  - src/agent/loop/session-lifecycle.ts:buildFinalAgentOutcome
reachable: yes
surface_findings:
  - The normal CLI factory supplies an in-memory memory store by default, while QUANTA_MEMORY=off removes the entire recall and citation path.
  - The citation is emitted only after a recalled record is actually placed in the reminder tail; empty stores and no-store legacy sessions omit the optional outcome field.
  - The web daemon deliberately exposes memory readout only and does not put store or memory configuration on its live agent base, so it does not recall or create citations.
