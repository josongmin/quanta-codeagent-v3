reachable: yes
surface_findings:
  - The normal session-finalization path persists memory through distill, embed, duplicate arbitration, and eviction when a store is configured.
  - The separate Stage-1 consolidator route is also invoked after successful runAgent completion when configured, and can defer its long LLM rollout until host resource drain.
  - "Both distill paths are defensive: provider/parse failures retain session success and fall back or report a non-fatal outcome."
