activation:
  - On session finalization with a configured persistent store, persistFinalMessages invokes persistSession with the assembled LLM and memory settings.
  - An available LLM with memory.distill not false runs distillSession; any LLM, parse, or persistence failure degrades to final-text heuristic or no persisted record without failing the agent session.
