entrypoints:
  - src/runner/session-memory-auto.ts:buildSessionMemoryAutoWires
  - src/runner/session-memory-auto.ts:prepareSessionStartMemory
activation:
  - Default-on CLI memory-auto creates FileMemoryWriter, supplies it to the session-start Phase 2 auto-trigger, and the trigger calls runPhase2 only after its pending-count or age threshold is reached.
  - QUANTA_MEMORY_AUTO=off returns no wire bundle, so neither the writer nor its SQLite backing store is allocated.
effective_defaults:
  cli: on
  web: na
  bench: unknown
  headless: off
  daemon: unknown
producer:
  - src/memory/consolidate/writer.ts:MemoryWriter.writeAtomic
consumer:
  - src/memory/consolidate/phase2.ts:runPhase2
  - src/runner/session-memory-auto.ts:runSessionStartPhase2AutoTrigger
reachable: yes
surface_findings:
  - The actual session-memory builder constructs a real filesystem writer and passes it through the auto-trigger configuration.
  - The writer fails loud on setup, cap, rename, and git-commit failures; Phase 2 withholds the watermark advancement when the write fails.
