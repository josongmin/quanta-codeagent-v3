surface_findings:
  - The interactive REPL constructs and projects buildDefaultSessionIo, so the /session import and export command is live rather than merely a caller-owned optional primitive on that surface.
  - The slash still has a no-I/O not-wired fallback when a different host omits sessionIo; path jailing, 50 MB pre-read cap, and typed no-throw slash errors apply to the live path.
  - Current implementation supports both v1 and v2 envelopes; v2 optionally carries canonical SHA-256 integrity data and validates tampering fail-closed.
