    command: rg -n "BRANCH_NAME_RE|gitBranchSwitchInputSchema|switch.*--|gitBranchSwitchTool" src/tool/git/types.ts src/tool/git/branch-switch.ts src/tool/git/index.ts
    revision: 9a12f7a855640a8be1e4654472766bbc445696ea
    result: pass
    evidence: The owner schema and tool are live, and branch argv is built only after schema validation.
  - kind: source
    command: rg -n "gitToolsEnabled\\(|QUANTA_GIT_TOOLS|gitToolList|buildDaemonToolRegistry" src/apps/cli/internal.ts src/apps/web-daemon/runtime-factory.ts
    revision: 9a12f7a855640a8be1e4654472766bbc445696ea
    result: pass
    evidence: Registration is CLI-gated and absent from the web-daemon registry.
  - kind: test
    command: bun test tests/unit/tool/git-branch-switch.test.ts
    revision: 9a12f7a855640a8be1e4654472766bbc445696ea
    result: pass
    evidence: 15 focused owner rails passed.
