version: 1
feature_id: shell-output-delta-streaming
snapshot_head: 01f02dbbac807a9bad0420cd509fa3e75a930037
status: closed
owner_seam: src/runtime/shell.ts:runShell
entrypoints:
  - src/apps/cli/repl.ts:cliComposeShellEvent
  - src/agent/dispatch/tool-context.ts:buildToolContext
activation:
  - The interactive CLI supplies an observer when stdout is a TTY or metrics are enabled.
  - Dispatch forwards AgentConfig.onShellEvent to ToolContext and bash forwards it to runShell.
effective_defaults:
  cli: off
  web: off
  bench: off
  headless: off
  daemon: off
producer:
  - src/runtime/shell.ts:runShell
  - src/tool/bash/index.ts:bashTool
consumer:
  - src/apps/cli/repl.ts:cliComposeShellEvent
  - src/agent/dispatch/tool-context.ts:buildToolContext
  - src/apps/cli/shell-stream-painter.ts:buildShellStreamPainter
  - src/observability/shell-exec-otel.ts:buildShellOtelObserver
reachable: yes
surface_findings:
  - runShell emits a closed start/stdout/stderr/exit-or-aborted stream only when an observer exists while returning the same buffered ShellResult.
  - The CLI composes painter and OTel observers; dispatch preserves identity to bash and no observer produces no events.
  - The catalog correctly marks web missing; serve-stdio explicitly composes no observer, so live delta output is an interactive CLI and injected-host capability rather than universal shell output.
off_identity_proof:
