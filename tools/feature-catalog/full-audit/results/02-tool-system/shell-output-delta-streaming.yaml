  command: bun test tests/unit/tool/shell-exec-events-byte-identical.test.ts tests/unit/dispatch-shell-observer-forward.test.ts
  revision: 9a12f7a855640a8be1e4654472766bbc445696ea
  result: pass
  evidence: Observer absence emits no events and preserves the final ShellResult; absent AgentConfig.onShellEvent leaves ToolContext unset.
on_efficacy_proof:
