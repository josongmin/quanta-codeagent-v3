reachable: conditional
surface_findings:
  - "git_commit uses argv-only add/commit, distinguishes regular always-confirm from reversible WIP pre-approval, and never bypasses hooks."
  - "git_branch_switch validates branch names, handles commit-wip/stash/discard explicitly, and escalates destructive discard to always-confirm."
  - "The catalog's cli:full and web:partial claims are stale: the CLI list is empty unless QUANTA_GIT_TOOLS is enabled, and buildDaemonToolRegistry never calls gitTools."
off_identity_proof:
  kind: source
  command: rg -n 'gitToolsEnabled|gitToolList|gitTools\(' src/apps/cli/internal.ts src/apps/cli/internal/argv.ts src/apps/web-daemon/runtime-factory.ts
  revision: 9a12f7a855640a8be1e4654472766bbc445696ea
  result: pass
  evidence: The false CLI gate yields an empty gitToolList and the daemon registry expands only buildDefaultTools plus explicit extras.
