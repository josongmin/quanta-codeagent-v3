status: closed
owner_seam: src/tool/git/{commit,branch-switch}.ts through src/tool/git/index.ts:gitTools
entrypoints: [src/apps/cli/internal.ts:loadFeatures, src/runner/assemble/tooling.ts:buildToolingCore]
