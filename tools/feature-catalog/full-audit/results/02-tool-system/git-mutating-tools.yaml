  kind: test
  command: bun test tests/unit/tool/git-commit.test.ts tests/unit/tool/git-branch-switch.test.ts tests/unit/tool/git-branch-switch-dirty-action.test.ts tests/unit/git-directive-stage-push-pr-hooks-hellgate.test.ts
