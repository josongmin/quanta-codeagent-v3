status: closed
owner_seam: src/tool/output-spill.ts:capToolOutput
entrypoints:
  - src/tool/registry.ts:ToolRegistry.run
activation:
  - Execute any registered tool whose output exceeds the effective cap; set QUANTA_TOOL_OUTPUT_MAX to a positive value to override the 200000-character default.
effective_defaults:
  cli: on
  web: on
  bench: on
  headless: on
  daemon: on
producer:
  - src/shared/runtime-config.ts:toolOutputMaxChars
  - src/tool/output-spill.ts:capToolOutput
consumer:
  - src/tool/registry.ts:ToolRegistry.run
reachable: yes
surface_findings:
  - The universal registry applies a 200000-character cap when no valid environment override exists; under-cap results are returned byte-identically.
  - Over-cap output is asynchronously written under the session cwd, replaced with a bounded head/tail marker, and spill retention is best-effort bounded.
  - Invalid, zero, negative, and non-finite cap settings resolve back to the default rather than disabling the safety cap.
