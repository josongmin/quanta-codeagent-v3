surface_findings:
  - The CLI composition creates PromptHistory unless QUANTA_HISTORY is the literal 0, then passes it to the production raw-line reader.
  - The same composition enables heredoc multiline unless QUANTA_MULTILINE is the literal 0; there is no web/headless input-surface consumer.
  - Catalog claim says every behavior is default-OFF, but the live resolver explicitly treats omitted history and multiline knobs as ON.
