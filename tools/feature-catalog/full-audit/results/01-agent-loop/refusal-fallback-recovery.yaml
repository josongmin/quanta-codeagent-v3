reachable: yes
surface_findings:
  - The host runtime base binding applies wireOptionalAgentPorts; its source explicitly identifies the CLI REPL as using buildAgentConfigFromBase.
  - With the gate absent, no refusalFallback config exists and a refusal remains terminal; an enabled text-only refusal neutralizes the old assistant message, emits a recovery nudge, and re-prompts once.
  - Tool-carrying refusal, exhausted one-shot capacity, or task-budget exhaustion stay terminal; the logic protects against loss/re-execution of already-started read-only results.
