  command: bun test tests/unit/agent/identity-hellgate.test.ts
  revision: 9a12f7a855640a8be1e4654472766bbc445696ea
  result: pass
  evidence: Absent and empty identity inputs both produce a byte-identical legacy prompt.
on_efficacy_proof:
