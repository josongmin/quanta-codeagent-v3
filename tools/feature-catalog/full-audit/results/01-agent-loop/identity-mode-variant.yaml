status: closed
owner_seam: src/agent/prompt.ts:buildSystemPrompt
entrypoints:
  - src/apps/cli/repl.ts:pickIdentity
  - src/host/bootstrap/bootstrap-session.ts:buildPromptState
activation:
  - QUANTA_IDENTITY enables the CLI initial identity lines; the interactive /identity state can refresh the system prompt for a selected mode during a session.
effective_defaults:
  cli: off
  web: na
  bench: na
  headless: na
  daemon: na
producer:
  - src/agent/identity/default-identities.ts
  - src/apps/cli/internal.ts:pickIdentity
consumer:
  - src/host/bootstrap/bootstrap-session.ts:buildPromptState
  - src/agent/prompt.ts:buildSystemPrompt
reachable: yes
surface_findings:
  - CLI bootstrap obtains pickIdentity, builds the system source with it, and holds a refresh callback for identity-mode changes.
  - Absent identity or an empty array leaves the base prompt byte-identical; enabled modes splice validated lines before persona.
  - A real two-turn CLI run proves /identity changes only the following turn's system prefix and has a red-on-injection guard.
off_identity_proof:
