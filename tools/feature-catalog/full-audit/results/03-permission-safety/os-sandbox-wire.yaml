consumer:
  - src/apps/cli/index.ts:main
  - src/runtime/shell.ts:runShell
reachable: yes
surface_findings:
  - CLI main awaits installCliSandbox before the agent surface starts, and runShell reads the installed slot immediately before spawning bash.
  - Unset, default, off, and empty QUANTA_SANDBOX leave the slot absent and preserve the legacy argv path.
  - Restrictive read-only and workspace-write profiles refuse an unavailable or degraded wrapper before spawn; unsupported profiles intentionally remain an explicit passthrough/degrade posture.
