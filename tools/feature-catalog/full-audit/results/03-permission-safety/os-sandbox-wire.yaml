entrypoints:
  - src/apps/cli/index.ts:main
  - src/apps/cli/sandbox-wire.ts:installCliSandbox
activation:
  - A CLI boot resolves an active QUANTA_SANDBOX profile and installs a ShellSandboxSlot.
  - Each runShell invocation passes its argv through the installed slot before Bun.spawn.
effective_defaults:
  cli: off
  web: na
  bench: off
  headless: off
  daemon: off
