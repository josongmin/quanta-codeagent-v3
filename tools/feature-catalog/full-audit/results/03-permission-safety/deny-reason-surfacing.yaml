  cli: off
  web: off
  bench: off
  headless: off
  daemon: off
producer:
  - src/agent/admissibility-gate supplies StructuredDenyReason at permission deny sites
  - src/permission/deny-reason.ts:structuredDenyReason and hardDenySafeReason
consumer:
  - src/agent/dispatch-helpers.ts:deny attaches ToolFailure.permission_denied.denyReason
  - src/tool/types.ts:DenyReasonValue model-facing failure envelope
reachable: yes
surface_findings:
  - The real public dispatchTool path reaches both the early plan-mode and guard seams as well as admissibility-gate deny sites.
  - ON attaches typed layer/pillar metadata and a categorical prefix; OFF keeps the legacy envelope without the denyReason key or prefix.
  - HARD_DENY uses a constant safe reason and the prefix is derived only from categorical fields, preventing command, regex, and secret echo.
