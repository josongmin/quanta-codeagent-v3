notes: |
  The truth table is asserted VALUE BY VALUE, including `garbage` (must not enable a
  guard), `ON` (case-insensitive) and `"  1  "` (trimmed), so a future reader swap that
  quietly widens the vocabulary fails here.

  The round-trip is asserted through the REAL `readMcpConfig`, not just the path
  resolver: the resolver agreeing with the writer is necessary but not sufficient when
  the reader short-circuits on `!path`.

  The red-on-injection control is the OLD behavior preserved — with no project root the
  same file is still invisible — which is what shows the fix is the threading and not
  an unrelated change.
