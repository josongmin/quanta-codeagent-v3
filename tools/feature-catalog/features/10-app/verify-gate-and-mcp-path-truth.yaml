purpose: |
  TWO config-truth defects.

  1. A GATE THAT READ PRESENCE, NOT VALUE. `buildVerifyGuardConfig` read
     `process.env.QUANTA_VERIFY_GUARD !== undefined`. Measured: every value except
     `undefined` enabled the guard — `0`, `off`, `false`, `no` and `""` all turned it
     ON, the exact opposite of what an operator typing `0` means.

     The repo already has ONE vocabulary for this (`gateOn`: `1|on|true|yes` truthy,
     `0|off|false|no` falsy, an empty export deliberately NOT an opt-in, unrecognized
     values NOT an opt-in) and a standing ratchet against this precise drift for the
     dangerous-command gate. This gate had never been migrated.

  2. THE MCP WRITER AND READER DISAGREED ABOUT WHICH FILE IS THE CONFIG. The connector
     installer writes `QUANTA_MCP_CONFIG ?? <cwd>/.mcp.json`. The reader resolved only
     the three env forms and returned `undefined` otherwise, whereupon `readMcpConfig`
     does `if (!path) return []`. In the DEFAULT configuration an install wrote
     `<cwd>/.mcp.json` and the next launch read nothing — the connector silently did
     not exist. "Install" has to round-trip or it is a lie.

  `verifyGuardEnabled(env)` reads through `gateOn` and is exported so the truth table
  is testable without touching the process env; default-OFF is preserved.
  `resolveMcpConfigPath(env, projectRoot?)` falls back to `<projectRoot>/.mcp.json`
  AFTER the three explicit env resolutions (precedence unchanged), and the CLI + web
  daemon thread `process.cwd()`.

  The parameter is OPTIONAL on purpose: omitted, resolution is env-only exactly as
  before, so every existing call site is byte-identical.
