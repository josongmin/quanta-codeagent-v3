knobs: []
deliberate_hold: null
notes: |
  Targets RFC §1.1 (single trajectory baseline ≈ 50% → Best-of-N upper
  bound ≈ 70%). Pure: no `process.env` reads, no I/O, no `process.exit`;
  the caller (`bench/index.ts`) decides whether/how many attempts to run.
  Slice: `src/apps/bench` only — does not import `@/agent` directly
  beyond the runner function it is handed.
