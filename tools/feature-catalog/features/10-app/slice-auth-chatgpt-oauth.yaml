id: slice-auth-chatgpt-oauth
title: '`@/auth/chatgpt-oauth` 슬라이스 — PKCE + JWT + token-store + refresh + callback port'
section: 10
subsystem: Surface-agnostic Layer-2 (RFC may-22)
order: 23
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: integrated
config_refs:
  env: [QUANTA_OAUTH_CLIENT_ID]
owners: ["@songmin"]
labels: ["surface:cli", "absorbed:codex"]
depends_on: [chatgpt-oauth-provider, refresh-coordinator, oauth-callback-provider, token-store-atomic, chatgpt-responses-adapter]
purpose: |
  `src/auth/chatgpt-oauth/` 8 파일 — ChatGPT OAuth provider seam (ADR-0094 Phase 1).
  ChatGPT 구독 자격으로 모델 호출하는 토대. 컴포넌트: `pkce.ts` (S256 challenge/verifier
  생성) + `jwt.ts` (ES256/RS256 verify + claims) + `browser-flow.ts` (loopback callback
  flow, 사용자는 `/login` 한 줄) + `callback-port.ts` + `cli-callback.ts` +
  `browser-flow-error.ts` (`OAuthCallbackProvider` port 로 Web/Tauri 가 callback delivery
  를 inject) + `token-store.ts` (chmod 600 + atomic rename + 0o077 perm 검증) +
  `refresh.ts` (`RefreshCoordinator` 객체화 + inflight Map 격리로 동시 refresh 단일화) +
  `config.ts` (`QUANTA_OAUTH_CLIENT_ID` knob, DEFAULT_CLIENT_ID 박힘 — Codex 공개 app id
  차용) + `paths.ts` + `index.ts`.
