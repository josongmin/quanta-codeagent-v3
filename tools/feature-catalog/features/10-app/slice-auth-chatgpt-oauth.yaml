notes: |
  `QUANTA_PROVIDER=chatgpt-oauth` 로 활성화. `OAuthCallbackProvider` port 분리로 CLI 는
  loopback http 리스너, Tauri/Web 은 자체 callback 라우터를 inject 가능 — 슬라이스 본체는
  표면-무관. 영감: ADR-0094 Phase 1 Codex `/login` 흡수 + Phase 2 모델 호출 와이어링은
  follow-up. atomic rename + 0o077 perm check 로 token-store 누설 차단; chmod 600.
  `RefreshCoordinator` 의 inflight Map 격리로 동시 다발 호출에서 단일 refresh 만 발생
  (token storm 방지). 93/0 tests, main 정착.
