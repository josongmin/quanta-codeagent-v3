id: cli-lifecycle-pills
title: CLI lifecycle pills — subagent/follow-up/MCP 3-pill (conditional)
section: 10
subsystem: CLI chrome — lifecycle indicator pills
order: 22
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: integrated
config_refs:
  env: []
owners: ["@songmin"]
labels: ["surface:cli", "absorbed:codex"]
depends_on: [queued-follow-ups, cli-status-pills]
purpose: |
  Top-line status-pills(`cli-status-pills`)과 직교한 3개 lifecycle pill:
  (1) `subagent` (활성 sub-agent 개수 + worker nickname),
  (2) `follow-up` (큐잉된 follow-up 메시지 개수 — Codex queued-follow-ups
  패턴 흡수),
  (3) `mcp` (연결된 MCP 서버 + 도구 카운트).
  Conditional render — 조건이 없으면 그 pill은 hide(empty pill 출력 안 함).
  Viewport-safe truncation — 라인이 터미널 폭을 초과하면 우측 우선 truncate
  (`…` suffix), pill 단위 atomic으로 자름.
  ENV는 생성 시점에 읽혀 테스트가 결정성으로 드라이브. Default-ON when TTY.
evidence:
  code:
    - src/apps/cli/lifecycle-pills.ts
  adrs: []
  tests:
    unit:
      - tests/unit/cli/lifecycle-pills.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_LIFECYCLE_PILLS
    default: 'undefined'
    purpose: '(no description)'
  - name: QUANTA_PILL_TASKS
    default: 'undefined'
    purpose: '(no description)'
  - name: QUANTA_PILL_FOLLOWUP
    default: 'undefined'
    purpose: '(no description)'
  - name: QUANTA_PILL_MCP
    default: 'undefined'
    purpose: '(no description)'
deliberate_hold: null
notes: |
  `status-pills`와 별도 모듈인 이유 — status-pills는 SESSION 레벨 상수성
  (mode/workspace/sandbox/skills/rules; 턴 중 거의 불변), lifecycle-pills는
  TURN/EVENT 레벨 변동성 (subagent spawn/close, follow-up queue, MCP
  connect/disconnect). 갱신 주기와 emit 채널이 다르므로 분리.
