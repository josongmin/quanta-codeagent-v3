id: eval-compare-pairwise-judge
title: eval Tier 4 — pairwise judge with bias-swap double pass
section: 10
subsystem: eval 앱 — Tier 4 A/B 판정
order: 91
maturity: L4
status: stable
owners: ["@songmin"]
labels: ["surface:bench"]
purpose: |
  Tier 4 compare의 채점기 — 두 transcript + scenario rubric → ONE winner
  (또는 tie). BIAS MITIGATION (standard): judge를 두 번 호출 (forward + swapped)
  → swap 후 "A"가 "B"가 되어야 같은 winner가 inverse로 reported. 두 verdict가
  inverse-consistent해야 winner counted; 아니면 tie. Position bias 표준 완화.
  내부 `RawVerdict`가 `{kind:"winner"}` vs `{kind:"parse_failed", reason}`를
  명시적으로 구분 — silent conflation 금지 (overloaded provider → garbage →
  "tie" → 경합으로 보이는 false signal 차단). 단일 JSON object output으로
  parser는 small + defensive. LLM이 garbage 반환하면 `parseFailed:true +
  winnerIndex:-1`로 inconclusive 기록 (tie와 별도). `winnerIndex`는 original
  participants 리스트의 index (-1 = tie). `note`는 forward pass의 short
  rationale로 운영자가 PR 댓글에서 즉시 가독.
