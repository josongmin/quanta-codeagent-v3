id: snapshot-slash-cmd
title: /snapshot — shadow-store snapshot/restore/diff slash command (ADR-0122)
section: 10
subsystem: CLI slash command (shadow_* tools UX, Hermes Agent /rollback parity)
order: 56
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: static
owners: ["@songmin"]
labels: ["surface:cli", "absorbed:claude-code"]
config_refs:
  env: ["QUANTA_COST_PANEL", "QUANTA_PREFS_HOME"]
purpose: |
  ShadowOdb 포트 + 3개 `shadow_*` 도구를 CLI에 surface하여 사용자가 모델을
  거치지 않고 워크스페이스 스냅샷을 browse/preview/restore 할 수 있게 하는
  슬래시 커맨드. 서브커맨드: `/snapshot` (newest-first 리스트, sha+ISO ts) /
  `/snapshot <N>` (rewind to #N, --yes 확정 게이트) / `/snapshot <N> <file>`
  (특정 파일만 restore via `shadow_restore_partial`) / `/snapshot diff <N>`
  (read-only unified diff) / `/snapshot --target=verified <N>`
  (`rewindToVerified` 사용, `markVerified` 앵커 필요). 모델-페이싱 HITL
  게이트는 도구 레이어에 있고, 슬래시 surface는 agent loop 밖에서 도는
  관계로 자체 `--yes` 확인 프롬프트를 둠 (`/rewind --yes` posture 미러).
  Default-OFF: `ctx.shadowOdb` 부재 시 "shadow store not configured" + exit 0
  (byte-identical to NOT registering).
