notes: |
  Naming subtlety: 기존 `/rewind`는 세션 transcript 되감기 (Claude Code v1.7196
  pattern, `rewind-cmd.ts`). 같은 이름 재등록 시 `BUILTINS_BY_NAME` 맵
  last-write-wins로 silently shadow → 기존 테스트 전부 깨짐. 그래서
  shadow-store UX는 `/snapshot`으로 등록. "rewind" 키워드 활성화 시 LLM
  경로의 system skill (`src/skill/system-skills/rewind/`)은 여전히 트리거.
  슬라이스 컨트랙트: `src/apps/cli/**`에서 `@/storage/shadow-odb`(포트 +
  타입)를 직접 import하고 `@/tool/shadow`는 import 안 함 — 슬래시 surface를
  도구 레지스트리 envelope에서 디커플링. 사용자 in-flight WIP — 테스트는
  아직 미작성, slash-commands.ts 등록만 landed.
