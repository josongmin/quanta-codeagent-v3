id: assemble-config
title: assembleConfig — per-turn AgentConfig composer (surface-agnostic)
section: 10
subsystem: Runner assembly layer (ADR-0024 split)
order: 12
maturity: L5
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:cli"]
depends_on: [runner-assemble-builders, prompt-source-payload-widening, effort-5-tier, fallback-kinds-policy, llm-factory]
config_refs:
  env: []
purpose: |
  Pure type-safe composer that turns already-built collaborators
  (`SessionDeps`: llm / registry / stream / permission / store / embedder /
  …) + message history into the immutable `AgentConfig` shape `runAgent`
  consumes. NO env / argv reads — every input is explicit. Naming is
  deliberate: surface-agnostic builder family (`buildLLMCore` etc.) each
  INSTANTIATE one collaborator; `assembleConfig` *composes* them. Every
  conditional default-OFF spread is preserved byte-for-byte from the prior
  inline block on the CLI entry. Used by `run-once`, `run-interactive`, and
  `side-chat` orchestrators. Each surface (CLI / Web / Tauri) maps its own
  input source (ENV / HTTP body / IPC payload) → `SessionDeps` first, then
  calls this.
