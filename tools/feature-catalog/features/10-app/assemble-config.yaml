    contract: []
knobs: []
deliberate_hold: null
notes: |
  `apps/cli/config-assemble.ts` is kept as a thin re-export shim so existing
  importers (`index.ts`, tests) are unaffected. The "assemble" vs "build"
  separation is documented inline in `config.ts` JSDoc — important reading
  for new surfaces to understand which factory family to extend.
