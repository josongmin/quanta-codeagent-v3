      - tests/unit/apps/cli/slashctx-ports-wire-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - QUANTA_COST_PANEL
  - QUANTA_BRANCH_SEARCH_PROGRESS
  - QUANTA_PLAN_STORE
deliberate_hold: null
notes: |
  Deliberately NOT wired in this slice: `workingState`. The
  `WorkingStateSession` handle is constructed INSIDE `buildSessionFeatures`
  and is NOT exposed back to the surface (no sink seam on `AgentOutcome` or
  `AgentConfig`). Wiring it would require adding a new `workingStateSink`
  slot on `AgentConfig` — held for a follow-up slice. `/state` keeps printing
  "/state: not wired" (byte-identical).


  Default-OFF posture: every port is OMITTED from `ReplSlashCtx` when its
  gate is OFF, and the spread `...(field !== undefined ? { field } : {})`
  preserves the byte-identical "not wired" output for shell-entry / one-shot
  surfaces that don't build the adapters. The new `SessionDeps.planStore`
  slot on `src/runner/assemble/config.ts` is also conditional —
  `AgentConfig.planStore` stays absent when the surface omits it (byte-
  identical to the pre-slice composition).

  Throws from a port closure surface as either a clean error (cost/plan
  defend with try/catch ⇒ exit 1 + clear message) or propagate to the REPL
  surface wrapper (branchSearch) where the per-turn error-render keeps the
  REPL alive. No silent no-ops.

  Test pinning (30+ cases via tests/unit/apps/cli/slashctx-ports-wire-hellgate.test.ts):
  per port we verify PRESENT renders the real body, ABSENT keeps the
  "not wired" sentinel, and a cross-port table sweeps the default-OFF axis
  for all 6 commands.
