id: slashctx-6-ports-wire-completion
title: SlashContext 6-port wire-up (S3 deferred-wire closeout)
section: 10
subsystem: REPL surface composition
order: 70
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: integrated
config_refs:
  env: [QUANTA_COST_PANEL, QUANTA_BRANCH_SEARCH_PROGRESS, QUANTA_PLAN_STORE]
owners: ["@songmin"]
labels: ["surface:cli", "tier:2"]
depends_on: [model-swap-retry, repl-interactive-surface, built-in-slash-commands, plan-mode, repl-code-smell-cleanup]
purpose: |
  Closes the Tier-2 SlashContext deferred-wire gap by threading 5 of the 6 R10
  surface ports from the REPL composer (`runRepl`) onto the live
  `slashCtx`, so the corresponding slash commands render their real bodies
  instead of the placeholder "not wired in this surface" line.

  Ports wired by this slice (each independently optional / default-OFF):
    - `cost`           — `() => CostPanel.renderDetailed()`; the panel is
                         constructed once at REPL setup gated by
                         `isCostPanelEnabled(env, isTTY)` and folded with
                         the per-turn token delta from `metrics.snapshot()`.
                         `QUANTA_COST_PANEL=0` or non-TTY ⇒ no panel ⇒
                         `/cost` stays on "not wired" (byte-identical).
    - `planSnapshot`   — `() => planStore.current()`; the in-memory
                         `PlanStore` is OPT-IN behind `QUANTA_PLAN_STORE=1`
                         (default OFF — the store is also threaded onto
                         `SessionDeps.planStore` ⇒ `AgentConfig.planStore`
                         so the agent's plan tools mutate the SAME store
                         the surface reads from).
    - `history`        — `HistorySessionState { messages: () => history }`
                         binds the live REPL-scoped `Message[]` reference;
                         ALWAYS wired in the REPL.
    - `branchSearch`   — `() => tracker.snapshot()`; the tracker is gated
                         by `isBranchProgressEnabled(env, isTTY)`. Empty
                         state until a search ingests events; `/branches`
                         prints "(no branch search recorded yet)" until
                         then. `QUANTA_BRANCH_SEARCH_PROGRESS=0` ⇒ omitted.
    - `side`           — built fresh on each invocation as a FACTORY
                         (`() => SideChatSessionState`) so the `messages`
                         value reflects the LIVE transcript (the
                         surface-scoped `history` binding is reassigned
                         per turn). Always wired in the REPL.

  Deliberately NOT wired in this slice:
    - `workingState`   — the `WorkingStateSession` is constructed INSIDE
                         `buildSessionFeatures` when
                         `AgentConfig.workingState.enabled === true` and
                         is NOT exposed back to the surface (no sink seam
                         on `AgentOutcome` or `AgentConfig`). Wiring it
                         would require adding a new `workingStateSink`
                         field on `AgentConfig` — held for a follow-up
                         slice. `/state` keeps printing
                         "/state: not wired" (byte-identical).
evidence:
  code:
    - src/apps/cli/repl.ts
    - src/apps/cli/slash-commands.ts
    - src/apps/cli/cost-panel.ts
    - src/apps/cli/plan-panel.ts
    - src/apps/cli/working-state-panel.ts
    - src/apps/cli/history-cmd.ts
    - src/apps/cli/branch-search-progress.ts
    - src/apps/cli/side-cmd.ts
    - src/runner/assemble/config.ts
  adrs: []
  tests:
