id: cli-runtime-feature-config-unification
title: CLI runtime feature-config unification (CLI-04)
section: 10
subsystem: REPL surface composition
order: 73
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: integrated
config_refs:
  env:
    - QUANTA_HISTORY
    - QUANTA_MULTILINE
    - QUANTA_REWIND
    - QUANTA_MEMORY_SLASH
owners: ["@songmin"]
labels: ["surface:cli", "tier:2", "adr-0297", "refactor"]
depends_on:
