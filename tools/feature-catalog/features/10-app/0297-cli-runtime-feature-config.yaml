surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "CliFeatureConfig resolved at CLI session start (src/apps/cli/repl.ts) feeding REPL factories; reachable from CLI entry."
    web: "Surface-level CLI env-config record consumed only by CLI REPL factories; web frontend builds its own config and never imports this CLI slice."
purpose: |
  Consolidates the scatter of inline `process.env` / `isTTY` reads across
  the CLI REPL surface (lifecycle pills, cost panel, branch progress,
  plan store, work-metrics sink, turn summary, turn indicator, debug
  tracer, image queue, rewind-git, `buildPromptUx` history/multiline) into
  a single typed `CliFeatureConfig` record resolved once at session start.
  Downstream factories consume the typed slice instead of reaching into
  globals, so future surfaces (Web/Tauri/headless) can construct the same
  config from their own env view without porting per-factory env reads.
evidence:
  code:
