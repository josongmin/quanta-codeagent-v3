notes: |
  Not configurable: honoring the repo's own AGENTS.md on an interactive surface is
  the documented L6 layer of the policy stack, not an opt-in. The trust decision
  stays in `MODE_REPO_RULES_POLICY`.

  Hell-audit finding worth keeping: the FIRST cut of the hellgate passed while two
  of the four links were dead. It hand-assembled the AgentConfig from
  `boot.repoRules` and handed `buildReplSlashCtx` the snapshot directly, so
  deleting the bootstrap->base threading and the composer's `repoRules:
  setup.repoRules` line both left every test GREEN. Rewritten to drive the
  SHIPPING `buildBaseFromBootstrap` and `buildSurfaceSlashContext`; all four
  links (bootstrap resolve / base threading / compose threading / rules-cmd
  consumption) now fail independently under injection.

  RESIDUAL (display-only): `repoRulesToSources` still stats the file for its
  byte-size column, so the SIZE shown by `/rules` is read from disk even when the
  content authority is the snapshot. The rule identity and body come from the
  snapshot; only the size digit can lag.
