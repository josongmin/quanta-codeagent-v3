notes: |
  The live gate is opt-in blocking: PR label `grounding-gate` or manual
  dispatch for canary, cron for nightly. v1 fixture history is text-only by
  design; native multimodal/tool-result grounding is deferred to a future
  schema bump. Workflow defaults to direct OpenAI + `gpt-4.1`, not
  `chatgpt-oauth`, because live preflight proved the OAuth route can fail with
  token invalidation independently of grounding quality. Manual
  `workflow_dispatch` can supply `baseline_run_id` to emit `compare` artifacts
  and enforce the strict regression gate against a prior run. Without a manual
  baseline, the workflow resolves the latest prior finished comparable run
  automatically. New grounding runs persist `harnessFingerprint`,
  `caseSetFingerprint`, and `routeFingerprint` in the run summary so
  baseline/compare/regress can reject semantic drift structurally. Current
  canary blocking thresholds are `wrong_thread_rate == 0`,
  `clarify_recall == 1.0`, `summary_equivalence_rate == 1.0`,
  `thread_selection_accuracy >= 0.97`, `referent_accuracy >= 0.95`, and
  `exact_tuple_match_rate >= 0.90`; `intent_accuracy` and `scope_accuracy`
  remain diagnostic, not ship-blocking, until a later gate revision.
  `harnessFingerprint` includes loader/gate contract versions in addition to
  parser/scorer/report/compare versions. The live workflow now persists
  `*-run.json`, `*-gate.json`, and `*-regress.json` artifacts so postmortem
  analysis reads structured authority instead of stdout reconstruction.
  `summary_equivalence` pair scoring is cross-bucket by design: the summary
  role lives in the `summary_equivalence` bucket, but its raw/source pair may
  remain in the original failure bucket such as `tool_noise` or
  `stale_context_trap`.
