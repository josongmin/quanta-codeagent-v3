notes: |
  The live gate is opt-in blocking: PR label `grounding-gate` or manual
  dispatch for canary, cron for nightly. v1 fixture history is text-only by
  design; native multimodal/tool-result grounding is deferred to a future
  schema bump. Workflow defaults to direct OpenAI + `gpt-4.1`, not
  `chatgpt-oauth`, because live preflight proved the OAuth route can fail with
  token invalidation independently of grounding quality. Manual
  `workflow_dispatch` can supply `baseline_run_id` to emit `compare` artifacts
  and enforce the strict regression gate against a prior run.
