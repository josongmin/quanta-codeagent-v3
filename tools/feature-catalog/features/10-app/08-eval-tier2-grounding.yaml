purpose: |
  Tier-2 of the 6-tier eval stack (umbrella id: `eval-five-tier`). Measures
  fail-closed conversational grounding, not prose quality: a controlled probe
  runs over the real prompt assembly path (`buildTurnContext(...)` + direct
  `LLMPort.stream(...)`, `tools: []`) and asks for exactly one JSON decision
  for an underspecified utterance. Fixtures are human-authored JSON cases
  under `src/apps/eval/grounding/cases/{canary,nightly}` and pin
  `activeThreadId`, `referentId`, `intent`, `scope`, and `shouldClarify`.
  Scoring is exact-match / fail-closed: `wrong_thread`, `must_clarify` miss,
  and `stale_context_trap` miss are hard fails; active-thread-preserving drift
  may degrade only to `partial`. Results persist as `GroundingPayload`, and the
  dedicated workflow `grounding-live-gate.yml` runs labeled-PR/manual canary
  gates plus nightly regression with JSONL+markdown artifacts. Route-health is
  first-class: `grounding preflight` exercises provider/auth/parser seams
  before the full suite, payloads carry `errorKind` + route metadata
  (`provider/model/surfaceId/transportId/authMode`), `report` consumes the
  persisted run summary for provenance, `baseline` resolves the latest prior
  comparable run automatically, `compare` emits run-to-run bucket/case drift,
  `regress` enforces a strict fail-closed baseline gate, run summaries carry
  harness/corpus/route fingerprints to reject apples-to-oranges comparisons,
  canary gate enforces both top-line thresholds and critical-bucket invariants
  (`must_clarify` recall, `stale_context_trap` attachment rate,
  `summary_equivalence` pair rate, `wrong_thread_adversarial` wrong-thread
  rate), and critical-bucket regressions are surfaced independently of
  top-line metrics. The loader is fail-closed authority too: pair groups must
  preserve one raw + one summary case with matching scenario contracts, and
  canary authority buckets must retain critical examples at runtime load time.
  `gate` emits a dedicated structured verdict artifact instead of reusing the
  broader report payload, `regress` emits its own structured verdict artifact
  instead of reusing compare output, workflow orchestration consumes run and
  baseline JSON authority instead of scraping stdout with `sed`, and
  `runGrounding` supports bounded concurrency for live corpora. The CLI accepts
  `--store-dir DIR` so isolated test fixtures, replayed artifacts, and ad-hoc
  analysis do not have to share the repo-default `evals/runs`. Report/gate/
  compare/regress load only the targeted run JSONL instead of rescanning the
  entire eval history for every lookup.
