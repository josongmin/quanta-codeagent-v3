purpose: |
  Tier-2 of the 6-tier eval stack (umbrella id: `eval-five-tier`). Measures
  fail-closed conversational grounding, not prose quality: a controlled probe
  runs over the real prompt assembly path (`buildTurnContext(...)` + direct
  `LLMPort.stream(...)`, `tools: []`) and asks for exactly one JSON decision
  for an underspecified utterance. Fixtures are human-authored JSON cases
  under `src/apps/eval/grounding/cases/{canary,nightly}` and pin
  `activeThreadId`, `referentId`, `intent`, `scope`, and `shouldClarify`.
  Scoring is exact-match / fail-closed: `wrong_thread`, `must_clarify` miss,
  and `stale_context_trap` miss are hard fails; active-thread-preserving drift
  may degrade only to `partial`. Results persist as `GroundingPayload`, and the
  dedicated workflow `grounding-live-gate.yml` runs labeled-PR/manual canary
  gates plus nightly regression with JSONL+markdown artifacts. Route-health is
  first-class: `grounding preflight` exercises provider/auth/parser seams
  before the full suite, payloads carry `errorKind` + route metadata
  (`provider/model/surfaceId/transportId/authMode`), `report` consumes the
  persisted run summary for provenance, `compare` emits run-to-run bucket/case
  drift, `regress` enforces a strict fail-closed baseline gate, and
  `runGrounding` supports bounded concurrency for live corpora.
