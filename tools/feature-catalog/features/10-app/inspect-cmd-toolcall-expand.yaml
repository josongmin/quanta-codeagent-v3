purpose: |
  Phase 1 debug-tracer는 *live stream*만 stderr로 흘리고 ring buffer 같은
  것이 없어서 `/debug` 켜기 전에 fire한 event는 retroactive 못 봄 (Codex /
  Cursor와 같은 posture). 그런데 사용자가 진짜 자주 묻는 질문은 "방금 그
  도구 호출 hits에서 정확히 뭐가 어떻게 됐어?" — 이건 post-hoc query.
  session JSONL envelope (ADR-0034)에 이미 `event_msg{kind:"decision"}` +
  `event_msg{kind:"tool_invoke"|"tool_result"}` + `event_msg{kind:"custom"}`
  로 다 persist되고 있으므로 그 위에 projection layer + multi-section panel
  renderer만 얹으면 됨.

  `/inspect <toolCallId>` ship: (1) JSONL projection layer (`src/session/inspect-source.ts`)
  는 pure data shaper — 디코드된 `SessionEnvelopeRecord` 스트림을 받아
  하나의 toolCallId에 속하는 모든 envelope를 `InspectGroup`으로 grouping
  (같은 id가 fork branch에서 다시 나타나면 두 group). 매칭은 3-way:
  `decision.tool_call_id` (first-class field) / `custom.data.id|toolCallId`
  (best-effort introspection) / co-turn 짝짓기. (2) `/inspect` renderer
  (`src/apps/cli/inspect-cmd.ts`)는 group 위에 input / decision rows /
  result / recovery 4-section panel을 redaction 통과시켜 paint.

  Determinism: 레코드는 디스크 원래 순서 유지 (envelope `ts`는 emitter당
  monotonic이지만 re-sort 안 함 — `iterateSessionFile`이 file order로 yield
  하는 게 이미 deterministic ordering). Forked occurrence는 arrival order로
  분리 group return.

  Pure projection: projection layer는 **IO 없음 + sanitisation 없음** —
  redaction은 inspect renderer가 shared `redactValue`로 위에 얹음 (다른
  surface가 projection 재사용 가능).

  Default-OFF: SlashContext에 inspect ctx 미공급 surface (one-shot / shell)
  는 "/inspect: not wired in this surface" + exit 0 (parity with `/history`,
  `/why`).
