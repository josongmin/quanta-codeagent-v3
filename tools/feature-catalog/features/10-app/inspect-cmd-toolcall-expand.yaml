notes: |
  `via` 라벨 closed enum: `decision_tool_call_id` (decision envelope의
  first-class field 매치) / `custom_data_id` (custom event의 open `data`
  record에서 id/toolCallId field 발견) / `co_turn` (같은 turn 내 tool_invoke
  + tool_result 짝짓기). 이 추론 chain은 디버깅하기 좋게 render에서 노출.

  Envelope schema 절대 안 바꿈 (ADR-0034 Track A가 lock — `SESSION_ENVELOPE_VERSION`).
  match 추론은 best-effort introspection이라 upstream emitter shape의 drift
  를 schema 변경 없이 흡수.

  Slice fence: projection (`@/session/inspect-source`)는 IO/sanitisation
  zero. renderer (`@/apps/cli/inspect-cmd`)가 envelope iterator + redaction
  port + 화면 paint 담당. `@/agent` reach 없음. Compose layer (REPL surface)
  가 SlashContext.inspect를 wire.

  Phase 1 negative invariant ("No `/inspect <toolCallId>` slash command")를
  의도적으로 Track I로 따로 분리해서 후속 ship — Phase 1 slice는
  contract+consumer만, 사후 query는 별도 surface.
