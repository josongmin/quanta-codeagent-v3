subsystem: Coverage source + reporter + tool
order: 83
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless, batch, ci-bot]
configurable: integrated
config_refs:
  env: []
owners: ["@songmin"]
labels: ["adr-0165", "tier:1", "observability", "coverage"]
depends_on:
  - metrics-typed-port-slice
surface_integration:
  cli: full
  web: partial
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 5/5 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "coverage_check is an agent-invocable tool so its invocation renders as a tool.invoked/tool.completed card via the bridged tool_call/tool_result events; the per-file MetricSink panel itself does not render"
purpose: |
  4-part hexagonal slice in `src/observability/coverage/`. Closed
  `CoverageSource` port + V8 JSON adapter (byte-range → per-line, inner
  range overrides outer) + `defaultCoverageReporter()` exposing
  `evaluate(report, opts)` (closed 2-arm verdict) and `emitMetrics(report,
  sink)` (per-file gauges with `{file}` label + 3 label-less totals) +
  `coverage_check` tool (agent-invocable, path safety via
  `resolveJailedDoc`, symlink-reject, typed `failure.mode:"rejected"`).
  Weighted totals — a 1000-line file at 50% does NOT weight the same as a
  10-line file at 100%. `bun test --coverage` and nyc/istanbul both miss
  `MetricSink` integration; no modern agent surfaces typed per-file
  coverage.
evidence:
