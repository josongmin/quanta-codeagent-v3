purpose: |
  Vim-style fixed bottom status bar implemented via ANSI DECSTBM
  (`CSI <top>;<bottom>r`). The terminal's scroll region is constrained to
  rows `[1..N-1]` so the last row is reserved exclusively for the status
  line — it is never scrolled out by stdout / streamed LLM output.
  Repaint protocol: SAVE_CURSOR → cursor-jump to bottom row → ERASE_LINE →
  paint text → RESTORE_CURSOR. Transient overlays (e.g. "Press Esc again to
  cancel") replace the default text and auto-revert after `transientMs`; the
  bar tracks the most recent default so a revert lands on the live state
  (not a stale snapshot). Teardown resets the scroll region and clears the
  reserved row so any subsequent shell prompt (after quanta exits) starts
  clean — crucial because a leaked DECSTBM truncates the user's next shell.
