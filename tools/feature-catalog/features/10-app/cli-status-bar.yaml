    No dedicated unit test yet — the module is currently exercised only
    indirectly via REPL smoke. ANSI sequences + DECSTBM lifecycle would
    benefit from a string-sink unit test that asserts the exact escape
    bytes around paint / overlay-revert / teardown.
  promotion_path: |
    Add `tests/unit/cli/status-bar.test.ts` driving a fake writer through
    create → paint → transient → revert → teardown and asserting exact ANSI
    bytes.
notes: |
  Distinct from `status-line` (surface-agnostic single-line *formatter*)
  and from `status-pills` (session-level chrome row at the TOP of the
  screen). status-bar is the only module that actually mutates the
  terminal scroll region — and therefore the only one with a real
  teardown obligation. Slice: `src/apps/cli` only (terminal-specific).

