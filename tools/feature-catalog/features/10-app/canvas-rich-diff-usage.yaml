id: canvas-rich-diff-usage
title: "Canvas rich DiffView (split + collapsible) + UsageBar legend (web)"
section: 10
subsystem: 앱 — Web/Tauri Canvas rich layer (cursor Canvas SDK 흡수, ADR-0448)
order: 6
maturity: L3
status: stable
ui_surfaces: [web]
modes: [interactive]
monitoring: n-a
configurable: partial
owners: ["@songmin"]
labels: ["surface:web"]
depends_on: []
purpose: |
  The rich web-canvas layer ADR-0440 (RFC-06) deferred: a side-by-side/split
  DiffView with collapsible hunks (06 was inline-only) + Swatch + CollapsibleSection
  primitives + a UsageBreakdownPanel (Swatch legend + per-category drilldown
  consuming ContextUsageBreakdown's color/chars). Additive: DiffView gains
  mode?:"inline"|"split" defaulting to inline (existing 06 tests byte-identical);
  UsageBar default render untouched (legend is a new component). Mirrors the Cursor
  agent-sdk canvas .d.ts shapes + the canonical category palette.
evidence:
  code:
    - apps/web-frontend/src/components/canvas/Swatch.tsx
    - apps/web-frontend/src/components/canvas/CollapsibleSection.tsx
    - apps/web-frontend/src/components/canvas/SplitDiffView.tsx
    - apps/web-frontend/src/components/canvas/UsageBreakdownPanel.tsx
    - apps/web-frontend/src/components/canvas/diff-hunks.ts
    - apps/web-frontend/src/components/canvas/category-hues.ts
  adrs: [448]
  tests:
    unit:
      - apps/web-frontend/src/components/canvas/SplitDiffView.test.tsx
      - apps/web-frontend/src/components/canvas/CollapsibleSection.test.tsx
      - apps/web-frontend/src/components/canvas/Swatch.test.tsx
      - apps/web-frontend/src/components/canvas/UsageBreakdownPanel.test.tsx
    integration: []
    contract: []
knobs:
  - name: QUANTA_WEB_CANVAS
    default: "06-owned gate"
    purpose: "06 owns the data-port; 10 adds the rich render layer over it"
deliberate_hold:
  reason: |
    UsageBreakdownPanel is mounted+wired but fed null until 06 adds client-side
    canvas dispatch (client.onCanvas); max=0 (no model→window table) → percent
    degrades to '?'. Both are honest degrades, not orphans.
  promotion_path: "06 wires client.onCanvas (one null swap) to light the panel; add a window source for the percent."
notes: "complementary to ADR-0440 (06) — does not duplicate its base primitives; §0 boundary table in the ADR."
