deliberate_hold: null
notes: |
  Security invariant: HARD_DENY rules described by `name` + `description`
  ONLY — the raw `RegExp` pattern is NEVER returned or rendered. A jailbreak
  crafter cannot use this surface to enumerate the exact catch patterns and
  craft a bypass. Enforced both at the library level (`inspectPermission`) and
  at the renderer (no regex source in any code path). Slice: `inspect.ts`
  imports only sibling files + `@/shared` (HITLTier SSOT) — NO `@/tool`
  import (caller supplies `isReadOnly`/`hitlTier`/`shellCommand` metadata; an
  unknown tool surfaces as `unmapped`). Render: every block through
  `@/ui/ui-helpers` so `setColorPolicy("off")` ⇒ plain ASCII byte-identical to
  non-TTY render. 5-axis ordering: `PERMISSION_AXES` mirrors `evaluateStack`
  precedence — read-only-bypass → hard-deny → hitl-tier → mode-policy →
  global-default.
