purpose: |
  Codex 5-axis post-denial precedence stack inspector. Sub-commands:
  `/permission` (short summary — mode + tier counts + 5-axis legend),
  `/permission explain <tool>` (full 5-axis pipeline for one tool),
  `/permission list` (table of all built-in tools — name + tier + read-only),
  `/permission tier <tier>` (tools in a specific HITL tier). Two-file design:
  `src/permission/inspect.ts` is the STATELESS library — composes existing
  decision primitives (HARD_DENY rules from `policy-rules`, `evaluate` mode
  policy from `policy`, `evaluateStack` 5-axis precedence semantics, HITL
  4-tier taxonomy from `@/shared`) and answers "what is the policy SHAPE for
  this tool across all modes?" (different question from `inspector.ts` which
  needs a `PermissionStore` and answers per-thread/per-host). The slash
  facade `src/apps/cli/permission-explain.ts` adds the rendering layer +
  enumerates `defaultTools()` to read `isReadOnly()`/`hitlTier()` declarations.
