id: pm-definition-of-done
title: tools/pm — executable Definition of Done (catalog + TDD + e2e-hellgate gate)
section: 10
subsystem: 메타 도구 — "기능 완료" 3-축 체커 (catalog 등록 + unit test + hellgate e2e)
order: 53
maturity: L5
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: ["surface:tooling"]
depends_on: [feature-catalog-tool]
purpose: |
  tools/pm is the EXECUTABLE Definition of Done — the process home that makes one
  rule impossible to forget: a feature is "done" only when ALL THREE ship
  together (1) catalog entry with real evidence (≥1 code path AND ≥1 ADR),
  (2) ≥1 unit test under evidence.tests.unit, (3) ≥1 hellgate-grade e2e test
  (a path under evidence.tests.integration OR any test whose filename signals
  hellgate / e2e). definition-of-done.ts is the PURE judge (no IO — it judges an
  already-loaded Feature via checkFeatureDoD; L1/L2 seams are held only to the
  catalog axis, L3+ to the full three-axis bar, --strict holds every feature).
  check.ts is the IO + reporting CLI (loadFeaturesStrict over the on-disk
  catalog, named-id / --all / --all --strict modes, exit codes: 0 PASS, 1 any
  FAIL or unknown id, 2 no-args usage). baseline.json is the ratchet allowlist
  of currently-grandfathered DoD failures so pm-dod-ratchet.test.ts fails only on
  NEW un-grandfathered holes. This entry exists because the README's OWN rule —
  "an unregistered feature is an invisible feature, no exceptions" — applies to
  the enforcer itself; the sibling meta-tools (feature-catalog-tool,
  fc-baseline-ratchet, fc-check-changed-gate) are all registered the same way
  (surface:tooling, adrs:[], grandfathered in tools/pm/baseline.json).
evidence:
  code:
    - tools/pm/definition-of-done.ts
    - tools/pm/check.ts
    - tools/pm/baseline.json
    - tools/pm/README.md
  adrs: []
  tests:
    unit:
      - tests/unit/pm-definition-of-done.test.ts
      - tests/unit/pm-check-cli-hellgate.test.ts
      - tests/unit/pm-dod-ratchet.test.ts
    integration: []
    contract: []
knobs:
  - name: --strict
    default: 'off (L3+ only held to full bar)'
    purpose: 'Without --strict only L3+ (claimed-wired) features must clear all three axes; L1/L2 seams need only the catalog axis (honestly-held scaffolding). --strict holds EVERY feature to the full three-axis bar (heldToFullBar). Not an env var — a CLI flag, order-invariant.'
  - name: --all
    default: 'off (named ids)'
    purpose: 'Sweep every catalog feature (CI-style; non-zero exit on any FAIL). Without it, only the named feature ids are checked and missing ids emit a MISSING line on stderr.'
deliberate_hold: null
notes: |
  Self-registration: the tool that enforces "register every feature" was itself
  unregistered — a genuine catalog gap, fixed here by following the EXACT sibling
  meta-tool precedent. Like feature-catalog-tool / fc-baseline-ratchet /
  fc-check-changed-gate this is surface:tooling with adrs:[] (process tooling has
  no design ADR), so it FAILS the DoD catalog axis (requires adrs.length>0) and is
  grandfathered in tools/pm/baseline.json to keep the pm-dod-ratchet test from
  counting it as a NEW hole — identical to how its siblings are grandfathered at
  baseline.json:126-129. The CLI exit-code contract is pinned by
  pm-check-cli-hellgate.test.ts (spawns the real check.ts subprocess: no-args⇒2,
  passing id⇒0, failing/unknown id⇒1, --strict flips an L2 seam to FAIL); the pure
  judge by pm-definition-of-done.test.ts; the ratchet by pm-dod-ratchet.test.ts.
  The ratchet test was already RED on the committed tree for 5 unrelated in-flight
  holes (image-gen / office-authoring / reasoning-carryover / mcp-resources-prompts-roots
  / h13-external-config-migration) — registering pm WITH the baseline grandfather
  line adds NO new hole.
