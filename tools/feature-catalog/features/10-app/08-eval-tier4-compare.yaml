notes: |
  Sub-feature of `eval-five-tier` umbrella — separately catalogued because
  the compare tier is the only one with cross-CLI process spawning, the
  only one with an adapter contract (`buildArgv` + `available` + timeout),
  and the only one that produces pairwise verdicts (not per-scenario
  scores). The 4 adapter files are interchangeable parts of the same
  port (kept under this entry, not further decomposed) but the tier as
  a whole has distinct semantics from the other 4 tiers.
