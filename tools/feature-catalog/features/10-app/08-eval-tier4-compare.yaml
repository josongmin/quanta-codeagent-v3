purpose: |
  Tier-5 of the 6-tier eval stack (umbrella id: `eval-five-tier`). The only
  tier that runs TWO agents on the same prompt and asks an LLM judge to
  pick a winner (`pairwise-judge.ts`). 4 CLI adapters share the
  `cli-base.ts` argv-pinning + SIGTERM→SIGKILL grace + stderr-tail
  truncation pattern: `quanta.ts` (self), `cursor.ts`
  (`-p <prompt> --output-format text --force`), `claude-code.ts`,
  `aider.ts` (`--message <prompt> --yes-always --no-auto-commits --no-git
  --no-stream --no-pretty --no-show-model-warnings`). Each adapter's
  `available()` returns `{ok:false}` when its CLI is missing, and
  `runCompare` graceful-skips with bookkeeping (no test failure on
  missing binary). Parse-failed pairwise verdicts surface as
  `parseFailed:true` + `winnerIndex:-1` to avoid poisoning tie counts.
