notes: |
  10 architecture invariants (런타임 + biome 이중 강제): (1) apps/** import 금지, (2)
  @/rules/@/patch/@/migration 직접 import 금지, (3) process.env / process.argv read 금지,
  (4) 모든 sub-slice barrel(index.ts) 존재, (5) raw process.stdin/stdout/stderr 금지
  (WriteSink/InputStream port 주입), (6) console.* 금지 (@/shared#logger 또는 주입된
  log port 사용), (7) Bun.env/Bun.argv/Deno.env/Deno.args/import.meta.env 금지, (8)
  node:readline/readline/promises/tty/repl 금지 (CLI-only), (9) `import { env, argv,
  stdin } from "node:process"` 명명 import 금지 (literal-rename bypass 차단), (10)
  tsconfig `@/runner` alias 등록 + biome `src/runner/**` override. 영감: Claude/Codex/
  Tauri 진출의 surface-agnostic 토대.
