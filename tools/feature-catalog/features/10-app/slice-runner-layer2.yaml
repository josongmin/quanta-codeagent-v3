id: slice-runner-layer2
title: '`@/runner` 슬라이스 — surface-agnostic Layer-2 오케스트레이션'
section: 10
subsystem: Surface-agnostic Layer-2 (RFC may-22)
order: 20
maturity: L4
status: new
purpose: |
  `src/runner/` 슬라이스 — CLI/Web/Tauri/Codex/Claude 어느 표면에서도 동일하게 호출 가능한
  Layer-2 오케스트레이션 모듈. 3 sub-slice 배럴: `assemble/` (8 builder: llm/store/memory/
  subagent/skill/compaction/verify/tooling/streaming/config) + `orchestrate/` (run-once /
  run-interactive / resume-fsm / persist-turn / prompt-source / side-chat) + `session-ops/`
  (list-tui + 도메인 ops). ENV/argv/stdio/console 의존을 표면 진입(apps/cli, apps/web,
  apps/tauri)으로 밀어내고 본 슬라이스는 typed config + 주입된 port (WriteSink, PromptSource,
  StdioReader, logger) 로만 동작. byte-identical default-OFF — 어느 표면도 본 슬라이스를
  강제로 와이어링하지 않으며 기존 흐름은 그대로.
