id: thin-surface-headless-core
title: Thin-surface invariant + headless-core ratchet
section: 10
subsystem: Surface governance / architecture rules
order: 75
maturity: L3
status: new
ui_surfaces: [cli, api]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: static
config_refs:
  env: []
owners: ["@songmin"]
labels: ["surface:core", "tier:2", "adr-0303", "governance", "ratchet"]
depends_on: []
purpose: |
  Codifies the "thin surface, headless core" architecture invariant: the
  CLI surface owns prompt UX + slash dispatch only; turn execution lives
  in `@/runner/orchestrate` (host-neutral `runOnce` / `runInteractive`);
  collaborator assembly lives in `@/runner/assemble`; loop semantics in
  `@/agent`. A surface-coupling ratchet test
  (`tests/unit/surface-coupling-ratchet.test.ts`) prevents regressions
  by counting cross-surface imports (`src/apps/agent/**` → `../cli/*`,
  `src/apps/cli/internal.ts` → `../agent/*`, etc.) and failing when the
  count rises. The number is a hard ceiling — lowering is allowed; raising
  is not.
evidence:
