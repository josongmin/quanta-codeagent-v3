knobs: []
deliberate_hold: null
notes: |
  Sibling to the ADR-0024 slice-isolation policy + ADR-0019 4-surface
  posture. The ratchet test is the enforcement mechanism, not just
  documentation — every PR must keep cross-surface imports ≤ the pinned
  baseline.
