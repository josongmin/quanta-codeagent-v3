      - tests/unit/apps/cli/slash-registry-split-hellgate.test.ts
      - tests/unit/slash-commands.test.ts
      - tests/unit/cli/help-render.test.ts
      - tests/unit/cli/repl-extract-shape.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  `/help` reflects the LIVE assembled BUILTINS via a closure
  (`buildSurfaceSlashCommands(() => BUILTINS)`) so the surface layer
  enumerates entries from session + app layers too. The closure runs
  only when a user types `/help`, long after module init — no
  circular-import hazard.

  15 hellgate cases / 64 expects / 0 fail. Pre-existing tsc baseline
  (42 errors) unchanged; biome 0 errors on `src/apps/cli/slash` +
  `src/apps/cli/slash-commands.ts`.
