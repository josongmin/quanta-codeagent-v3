    - src/apps/cli/slash-commands.ts
    - src/apps/cli/slash/registry-surface.ts
    - src/apps/cli/slash/registry-session.ts
    - src/apps/cli/slash/registry-app.ts
    - src/apps/cli/slash/render-helpers.ts
  adrs:
