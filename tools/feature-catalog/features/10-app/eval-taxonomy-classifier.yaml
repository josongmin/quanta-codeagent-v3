maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: partial
modes: [headless, batch]
configurable: static
owners: ["@songmin"]
labels: ["surface:bench"]
purpose: |
  Pure classification primitive `(LLMPort, query) → ClassifyResult`. System
  prompt가 모든 leaf id + label + 대표 example을 enumerate하고, 모델은 단일
  JSON 객체 `{ id, confidence, alt? }`로 응답. `extractJsonObject`가 balanced
  brace로 첫 객체를 추출하므로 non-JSON-disciplined provider도 동작.
  ERROR SURFACE CONTRACT (critical): `error:undefined + id:null` =모델이
  "none-of-above" 선택, `error:defined` = INFRA failure (stream 에러, no JSON).
  caller가 둘을 절대 conflate 금지 — 후자를 unclassified로 묻으면 overloaded
  provider가 silently 분류 distribution을 왜곡함. `alt`는 unknown id 자동
  필터, primary와 같은 id 제거, maxAlt(default 2) 캡. Tier 3 trajectory
  labelling + ad-hoc CLI `eval classify <text>` 양쪽이 consume. Confidence는
  [0,1] 범위 밖이면 0으로 강등.
