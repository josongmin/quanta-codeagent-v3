id: slice-ipc-bridge
title: '`@/ipc` 슬라이스 — CLI ↔ Web ↔ Tauri EventBridge + portable session'
section: 10
subsystem: Surface-agnostic Layer-2 (RFC may-22)
order: 21
maturity: L4
status: new
purpose: |
  `src/ipc/` — Claude A11 deep-dive 흡수 (importCliSession + logCliEvent pattern). 두
  컨트랙트: (1) `EventBridge` — typed `BridgePayload` 위 publish/subscribe + loopback 로컬
  배달 + transport-agnostic wire encoding. (2) `BridgeTransport` — 저수준 byte shuttle,
  4 구현 동봉: `in-memory` (테스트 fixture) / `stdio` (line-delimited JSON, CLI↔daemon) /
  `uds` (Unix domain socket, framing은 stdio 재사용) / `websocket` (interface + adapter,
  서버 본체는 follow-up). PortableSessionV1 export/import (snake_case wire) 로 표면 간
  세션 round-trip — import 시 신선한 id 발행으로 충돌 회피. byte-identical default-OFF:
  어느 표면도 강제 와이어링 X, 옵트인 flag는 follow-up.
