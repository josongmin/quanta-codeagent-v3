notes: |
  10 invariants — `@/runner` 패턴 미러 + 한 가지 calibrated 차이: stdio transports 가
  **목적상** process.stdin/stdout 을 frame 하므로 슬라이스 자체는 결코 process.stdio.*
  를 직접 읽지 않고 `StdioReader` / `StdioWriter` port 를 받는다. 위반 시 file:line +
  offending specifier 로 1-step 진단 가능. tsconfig `@/ipc` alias 등록 + biome
  `src/ipc/**` override.
