id: architecture-invariants
title: 슬라이스 architecture invariants — biome (정적) + test (런타임) 이중 강제
section: 10
subsystem: Surface-agnostic Layer-2 (RFC may-22)
order: 25
maturity: L4
status: new
ui_surfaces: [n-a]
