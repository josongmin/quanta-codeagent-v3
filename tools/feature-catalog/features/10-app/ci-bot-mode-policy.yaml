notes: |
  Two-file split: `ci-bot-policy.ts` owns the structural policy bits
  (toolSurface / promptPack / gitWrite + readers the dispatch seam
  consults); `ci-bot.ts` owns the actual mode runner (composes the
  policy + spawns the agent). The split keeps the policy unit-testable
  in isolation from runtime spawn.
