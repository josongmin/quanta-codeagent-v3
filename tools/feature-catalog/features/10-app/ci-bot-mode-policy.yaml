notes: |
  aug-30 audit G5-02: the former two-file split (`ci-bot-policy.ts` +
  `ci-bot.ts`) was a dead parallel implementation — the policy file's
  `buildCiBotWiring`/`CI_ENV_ALLOWLIST` had zero runtime callers while
  the dispatched runner kept its own diverged copies. `ci-bot-policy.ts`
  is deleted; `ci-bot.ts` is the single wiring, and the CI env allowlist
  it scrubs with is the SSOT `CI_ENV_ALLOWLIST` in `@/shared/env-scrub`
  (shared with `tool/gh/runner.ts`'s default runner).
