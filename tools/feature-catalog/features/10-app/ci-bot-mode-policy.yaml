depends_on: [isregex-true, promise-race, wire-finalization, agent-cli-args-parser, agent-config-assembler]
purpose: |
  Bridges the data-only `MODE_PRESETS["ci-bot"]` into a runnable
  `AgentConfig`. RFC may-22 Phase 5. Concrete policy for the ci-bot
  surface (GitHub Actions / GitLab CI / similar batch-PR contexts):
    - toolSurface  ⇒ ci-safe tool set = `defaultTools` (read/edit/grep/
                     bash/test_runner) + `gitTools` + `ghTools`.
                     NO MCP, NO hooks, NO write-to-host-fs outside
                     workspace.
    - promptPack   ⇒ pr-agent rules (already wired via prompt.ts opt).
    - gitWrite     ⇒ branch-only — exposed for the dispatch seam to
                     consult so the agent CANNOT mutate the user's main
                     branch or push to a protected ref.
  Membership in the branch-only set is enforced by exhaustive seam
  check (alongside `daemon`); flipping any other mode into branch-only
  requires updating the dedicated invariant test.
