notes: |
  Carved out of the `cli-repl-solid-split` umbrella because it (a) implements a
  named adapter pattern (`PromptSource` port from `@/runner`), (b) is the
  surface for two substantial hellgate batteries (528-LOC unit + 382-LOC
  integration) explicitly exercising `tryRunReplSlash` routing, and (c) hosts
  4 distinct exports — not a single-purpose plumbing helper. Other adapter
  modules in the umbrella (skills-callback / resume-fsm) stay in-umbrella —
  they are <70 LOC with no independent hellgate test surface.
