purpose: |
  Sub-feature of `cli-repl-solid-split` umbrella — separately catalogued because
  this module implements the `runner.PromptSource` port for the CLI surface and
  is the in-REPL slash-command short-circuit point that gives `quanta` its
  Codex `forceReloadSkills` parity for `/skills` / `/reload-skills`.

  Four named exports (each extracted to keep `runReplLoopRaw`'s `next` closure
  under biome's cognitive-complexity budget):
    - `tryRunReplSlash(input, slashCtx)` — returns true iff the input was
      routed in-REPL (caller skips agent turn). `isSlashCommand` rejects paths
      like `/path/to/x` so legacy file-resume tokens still fall through.
      Empty `slashCtx` ⇒ commands needing session state print "not wired"
      and exit 0 (default-OFF).
    - `readReplLine(signal, uxOpts)` — raw line reader bridge with
      promptHistory + multiline support; returns null on AbortError.
    - `classifyReplLine(signal, slashCtx, ...)` — combines read + slash route
      classification for the loop's `next` closure.
    - `buildCliPromptSource(...)` — constructs the byte-identical
      `runReplLoopRaw` post-line behaviour as a reusable `PromptSource`.

  Without this seam the slash routing would either live in `runReplLoop` (cog-
  complexity overflow) or in the loop's anonymous closures (untestable).
