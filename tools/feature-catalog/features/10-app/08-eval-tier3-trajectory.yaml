id: eval-tier3-trajectory
title: eval Tier-4 — trajectory replay / classify / freeze (real-session corpus)
section: 10
subsystem: eval 앱 Tier-4 — 실세션 trajectory (RFC-0003)
order: 84
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [headless, batch]
configurable: static
owners: ["@songmin"]
labels: ["surface:bench"]
depends_on: [eval-five-tier]
purpose: |
  Tier-4 of the 6-tier eval stack (umbrella id: `eval-five-tier`). Operates on
  REAL session transcripts (not synthetic, not public bench) — `source.ts`
  ingests recorded JSONL sessions, `classifier.ts` maps them onto the
  taxonomy(12 major / ~120 leaf), `replay.ts` re-runs the same prompts
  against the current agent build and computes a verdict, `freeze.ts`
  pins a winning trajectory so future regressions surface against the
  frozen reference. `diff.ts` / `meta.ts` produce per-replay sidecar
  artefacts. Distinct from Tier-1 because the prompts come from real
  user sessions (not hand-authored scenarios), and distinct from Tier-5
  because the comparison is "today's agent vs frozen reference" not
  "agent A vs agent B".
