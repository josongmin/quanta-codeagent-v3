notes: |
  Sub-feature of `eval-five-tier` umbrella — separately catalogued because
  the trajectory tier is the only one that consumes a real-session corpus,
  has its own freeze-and-pin invariant (a frozen trajectory blocks
  regression future), and its own classifier (real sessions need taxonomy
  mapping after the fact, scenarios declare it up front).
