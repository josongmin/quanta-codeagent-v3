deliberate_hold: null
notes: |
  The Python SWE-bench seam (real grader) lives in `python-swebench.ts`
  and is selected from `runner.ts` when `QUANTA_SWEBENCH_PYTHON=1` and
  the harness is importable. Default-off; the local `testCmd` path is
  unchanged when the flag is unset.
