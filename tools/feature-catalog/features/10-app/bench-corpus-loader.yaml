id: bench-corpus-loader
title: Bench corpus loader — real SWE-bench vs synthetic layout detection
section: 10
subsystem: 벤치 — corpus 어댑터
order: 131
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [headless, batch]
configurable: integrated
config_refs:
  env: [QUANTA_SWEBENCH_CORPUS_ROOT, QUANTA_SWEBENCH_PYTHON]
owners: ["@songmin"]
labels: ["surface:bench"]
purpose: |
  Adapter that turns a `QUANTA_SWEBENCH_CORPUS_ROOT` directory into an
  `Instance[]` for the bench runner. Detects TWO layouts and degrades
  gracefully on a third (offline / empty / invalid).

    1. REAL `quanta-benchmark-corpus` (`tasks/repo/swebench/<id>.yaml` +
       `external/swebench/verified/repos/repo_manifest.yaml`). Reads each
       task's `objective.statement` as the problem, the visible_checks
       `cmd` lines as the test command, and the `swebench_meta` block
       (instance_id, repo, base_commit, environment_setup_commit) so the
       optional Python harness can grade officially.
    2. Synthetic manifest — `manifest.jsonl` (one Instance-shaped object
       per line) OR one sub-dir per instance with `instance.json` + a
       `repo/` subtree. Used by tests and hand-authored corpora.
    3. Missing / empty / unreadable root → `[]` (never throws) so the CLI
       degrades gracefully when no corpus is wired.

  Detection rule: a `tasks/repo/swebench` directory under `root` ⇒ real
  corpus path. Cache repo paths are kept read-only (the runner copies to
  a sandbox before `git checkout <base_commit>` per instance).
evidence:
  code:
    - src/apps/bench/corpus/loader.ts
    - src/apps/bench/corpus/dataset.ts
    - src/apps/bench/corpus/index.ts
    - src/apps/bench/types.ts
  adrs: []
  tests:
