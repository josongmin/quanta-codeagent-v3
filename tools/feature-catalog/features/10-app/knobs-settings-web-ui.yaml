id: knobs-settings-web-ui
title: Web Settings UI (KnobsPanel) — daemon-backed knob inspect + live /config write
section: 10
subsystem: Web frontend surface — settings panel
order: 81
maturity: L2
status: new
ui_surfaces: [web]
monitoring: n-a
modes: [interactive]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:web"]
depends_on:
  - web-frontend-surface
  - web-daemon-surface
config_refs:
  env:
    - QUANTA_FAST
    - QUANTA_SERVICE_TIER
    - QUANTA_MODEL
    - QUANTA_REASONING_EFFORT
purpose: |
  Settings panel for the web surface — the browser-side parity of the CLI
  `/knobs` operator surface. `KnobsPanel.tsx` renders the daemon's knob
  catalog (groups + filter + per-knob source/value) and, for the narrow
  set of hot-writable knobs, posts an in-place override.

  Data layer (`slash-knobs.ts`, pure / no React imports so it is
  unit-testable without a DOM):
    - `GET /api/knobs` — fetches the daemon knob catalog (`KnobEntry[]`:
      envKey / kind / default / describe / home / hotToggleable / value /
      source). String values arrive REDACTED server-side (`displaySafeValue`)
      so a secret never crosses the wire to the browser.
    - `POST /config` — writes one knob. The daemon enforces a CLOSED
      allowlist (`CONFIG_ALLOWED_KEYS`); the UI mirrors it as
      `CONFIG_WRITABLE_KEYS` (`QUANTA_FAST`, `QUANTA_SERVICE_TIER`,
      `QUANTA_MODEL`, `QUANTA_REASONING_EFFORT`) to render non-writable
      knobs read-only instead of POSTing a request the daemon rejects (400).

  Server wiring (`src/apps/web-daemon/`): `knob-catalog-wire.ts` projects
  the unified knob catalog into the `/api/knobs` payload (redacted);
  `server.ts` serves `GET /api/knobs` + `POST /config` behind the daemon's
  bearer-token auth.

  Default-OFF byte-identical: absent the daemon + the frontend, the CLI
  surface is unchanged. The panel is opened from the SlashPalette `knobs`
  entry (aliases `settings` / `config`).
evidence:
  code:
    - apps/web-frontend/src/components/KnobsPanel.tsx
    - apps/web-frontend/src/components/slash-knobs.ts
    - src/apps/web-daemon/server.ts
