    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  The `/config` write surface is deliberately narrow — only the 4
  hot-writable knobs above are accepted; everything else renders read-only.
  Secret redaction is enforced SERVER-side (`displaySafeValue`) and pinned
  by `tests/unit/web-daemon/api-knobs-no-leak-hellgate.test.ts` (the panel
  never sees a raw secret to leak). UI parity with the CLI `/knobs` surface
  is intentional; the CLI side is tracked by `cli-slash-knobs-live-control`.
