purpose: |
  Executable Phase-0 of docs/plans/jun-11-surface-protocol-unification.md.
  Closes the "built-not-wired / orphan UI / parity lag" class by pinning FOUR
  orthogonal inventory axes + ONE central bridge + TWO copy-not-import drift
  contracts — without falsely promoting raw `AgentEvent` to the wire SSOT
  (canonical boundary stays `SessionProtocol` / `session.v1`).

  Inventory axes (counts pinned — intentional RED on drift):
    (1) ENGINE — `AGENT_EVENT_TYPES` (36) in `src/stream/types.ts` (`agentevent`).
    (2) BOUNDARY — `SESSION_EVENT_TYPES` (15) in `@/protocol/session`
        (`session-protocol-codec`).
    (3) DERIVED side channel — `AGENT_STATE_TYPES` (9) strict AgentEvent subset
        (`web-agent-state-channel`).
    (4) WEB TRANSCRIPT consumer — `TRANSCRIPT_MUTATING_*` ∪ `TRANSCRIPT_NOOP_*`
        = all SessionEvent types in `apps/web-frontend/src/ws/session-hooks.ts`
        (`web-frontend-transcript-consumer-inventory-hellgate`).

  Central bridge (jun-11 extraction from context-binding):
    `session-host-turn-event-bridge.ts` owns `toSessionHostTurnEvent` +
    `AGENT_EVENT_TO_SESSION_HOST_TURN_EVENT_BRIDGED_TYPES` (exactly 7 tags).
    Maps into `SessionHostTurnEvent` (`kernel/session/ports.ts`). Empty
    `assistant_text` deltas drop before the host. `context-binding.ts` is the
    sole production consumer — import-only wiring.

  CLI surface render coverage (declarative inventory — no silent default branch):
    - attach: rendered ∪ ignored = all SessionEvent types.
    - timeline: formatted ∪ fallback = all AgentEvent types.
    - turn-summary: consumed = strict AgentEvent subset (6 today).

  Web copy-not-import drift contracts (frontend lives outside bun tsconfig paths):
    - `web-frontend-protocol-drift-contract-hellgate` — SessionEvent/Command
      types + protocol version + CONFIG_ALLOWED_KEYS mirror.
    - `web-frontend-agent-state-drift-contract-hellgate` — agent-state kind list
      + version mirror (blind spot for in-band session drift guard).

  Meta-ratchet: `feature-catalog-surface-integration.test.ts` SI-20 pins the
  bridged tag set so unaudited bridge widening forces FC re-audit.

  NOT in scope (plan §5): raw 36-event web fanout, CapabilityManifest-as-render-
  manifest, generic mutation queue on WS lease.
