purpose: |
  `/inspect`는 단일 tool-call에 대한 사후 zoom이고 `/debug`는 *live stream*
  이라 retroactive하게는 못 봄 (ring buffer 없음). 사용자가 자주 묻는 또
  다른 질문 — "어제 그 세션, 전체적으로 어떻게 흘러갔어? Turn N부터 뭐가
  일어났어?" — 에 답하는 게 `/replay`. 세션 JSONL envelope이 이미 모든
  trajectory를 deterministic order로 persist하고 있으므로 그걸 시간순으로
  pretty-paint하는 surface만 추가.

  `/replay <session-id> [--at N] [--from tc_x] [--pace ms]` ship: (1)
  세션 envelope iterator를 file-order로 traverse, (2) `--at N` flag로 turn
  N부터 시작 (skip first N-1 turns), (3) `--from tc_x` flag로 specific
  tool-call id 도달부터 시작, (4) `--pace <ms>` (default 0 = instant)로 row
  emit pacing 옵션, (5) live `/debug` consumer가 보는 것과 같은 single-line
  pretty format으로 stderr write — debug-tracer category filter도 동일하게
  apply 가능.

  Determinism: file-order traverse + 동일한 pretty stringifier 사용 →
  같은 세션 + 같은 flag 조합 = 같은 출력 (replay determinism). pacing은
  rendering side concern (data side는 deterministic 유지).

  Live `/debug`와 surface parity: 같은 `renderTimelineRow` / debug-tracer
  category mapper 재사용 → 사용자가 live trace 보던 mental model 그대로
  사후에도 적용. session-id resolution은 session-id store / state 디렉토리
  스캔.

  Default-OFF: SlashContext에 replay ctx 미공급 surface (one-shot / shell)
  는 "/replay: not wired in this surface" + exit 0.
