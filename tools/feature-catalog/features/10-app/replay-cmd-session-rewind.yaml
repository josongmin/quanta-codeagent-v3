notes: |
  Phase 1 negative invariant ("No `/replay` time-travel")을 의도적으로 Track
  R로 따로 분리 ship — Phase 1 slice는 *contract + live consumer*만 책임.
  Sibling이 ADR-0166 (subagent seed-replay)은 *agent를 재실행*하는 것 (LLM
  fresh call)이고 이 `/replay`는 *fact만 시간순 paint* (LLM call 0, byte-
  identical replay).

  Slice fence: `@/session` envelope reader + `@/stream` types + 공통 redactor
  만 import. `@/agent` reach 없음. argument parser는 cog-complexity 낮게
  유지 (slash-commands.ts에서 dispatch만).

  `--pace` 옵션 trade-off: 0 = instant (CI-friendly), >0 ms = 사람이 visually
  쫓을 수 있는 cadence. pacing은 sleep-loop이 아니라 setTimeout chain (test
  seam에서 fake clock injectable).
