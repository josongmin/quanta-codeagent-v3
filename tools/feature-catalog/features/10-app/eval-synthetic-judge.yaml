id: eval-synthetic-judge
title: eval Tier 1 — LLM-as-judge (per-rubric pass/fail + weighted score)
section: 10
subsystem: eval 앱 — Tier 1 채점기
order: 86
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [headless, batch]
configurable: static
owners: ["@songmin"]
labels: ["surface:bench"]
purpose: |
  Scenario rubric + 캡쳐된 transcript를 받아 judge LLM에 per-item pass/fail을
  요청, weighted score(default weight=1) 계산. ERROR SURFACE CONTRACT
  (critical): `error:undefined` = judge ran (모든 rubric pass:false도 legitimate
  judgement), `error:defined` = INFRA failure (stream 에러, no parseable JSON,
  malformed shape). Caller가 후자를 별도 `verdict:"error"`로 격리해야 — fail
  버킷에 묻으면 correct run이 falsely tank됨. JSON-block tolerant parser
  (markdown fence 무시), partial verdict (`parsed.length < rubric.length`)는
  malformed로 강등해 unscored item을 default-fail로 spreading 금지. `judgePrompt`
  override로 stricter/laxer calibration 가능. `weightedScore`가 missing
  verdict id를 0으로 처리해 model이 누락해도 score가 graceful degrade.
