notes: |
  Default system prompt는 strict-but-fair — 향후 weight calibration A/B는
  judgePrompt override seam로 제공. judge.error의 caller-side handling은
  `synthetic/index.ts/verdictFor`가 강제. 단일 JSON object shape로 parser를
  defensive하게 keep — 향후 multi-rubric multi-judge ensemble은 미흡수.
