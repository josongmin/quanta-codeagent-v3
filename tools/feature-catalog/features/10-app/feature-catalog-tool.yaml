purpose: |
  Feature catalog의 단일 진실 원천 (SSOT) 도구. 모든 feature는
  `tools/feature-catalog/features/<section>/*.yaml` 한 파일로 표현되고,
  `bun fc build`가 zod 스키마 검증 + 교차참조 + prose + baseline 메트릭을
  합쳐 `docs/10.feature-catalog.md`를 결정적으로 재생성한다 (MD는 빌드
  artefact, 직접 편집 금지). `validate`는 id-유니크 / evidence 파일 존재 /
  ADR 번호 매핑을 검사하고, `audit`는 4-lens sweep (orphan ADR / orphan src /
  empty stub / cross-link drift), `lint --update-baseline`은 ratchet으로
  empty-stub 증가를 막는다. `check-changed <base-ref>`는 PR-time gate로 새
  src 파일이 catalog에 등록되지 않으면 fail. CI fence(`bun fc diff`)는 MD
  drift를 감지한다. `bun fc:audit`는 고정 HEAD의 전수-audit snapshot,
  priority queue, per-feature result overlay, PASS/CONDITIONAL/SEAM_ONLY 등
  효능 판정을 별도 SSOT로 관리한다.
