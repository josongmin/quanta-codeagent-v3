id: session-index-store
title: Session `index.jsonl` directory — atomic upsert + in-process mutex
section: 10
subsystem: Session 영속 — directory of sessions
order: 11
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: static
owners: ['@songmin']
labels: [surface:cli]
depends_on: [quanta-session-subcommands]
config_refs:
  env: [QUANTA_SESSIONS_DIR]
surface_integration:
  cli: na
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "pure index.jsonl persistence primitive (atomic upsert + in-process mutex); no direct user-facing CLI affordance"
    web: "pure internal session-directory store primitive, no UI affordance on any surface"
purpose: |
  `index.jsonl` 는 세션의 lightweight 디렉토리 — 라인당 1 JSON SessionMeta(세션 id /
  생성 시각 / 라벨 등). 매 upsert 마다 전체 파일 재기록(per-writer tmp + atomic rename).
  파일이 작아(수백 세션도 수 KB) append-then-dedupe 복잡성 회피. In-process 동시성:
  `upsertMeta` / `removeFromIndex` 가 internal promise-chain mutex 로 직렬화 →
  one-process 안에서 R-M-W 윈도우 atomic. Multi-process는 atomic rename 만 보장
  (last-writer-wins). 세션 store 자체(`<id>.jsonl` / `<id>.json`)와는 직교 — index 는
  *어떤 세션이 있는지* 만 알고, 세션 내용은 store 가 담당.
evidence:
  code:
    - src/session/index-store.ts
    - src/session/paths.ts
    - src/session/types.ts
    - src/shared/runtime-config.ts
  adrs: []
  tests:
    unit: ["tests/unit/git-observability-wiring-hellgate.test.ts"]
    integration: ["tests/integration/git-observability-composite.test.ts"]
    unit: [tests/unit/git-observability-wiring-hellgate.test.ts, tests/unit/next-action-cap-enforce.test.ts]
    integration: [tests/integration/git-observability-composite.test.ts]
    contract: []
knobs: []
deliberate_hold: null
notes: |
  Atomic rename 패턴 — POSIX rename(2) 는 same-filesystem atomic. 파일 작아 매 upsert
  전체 재기록 비용 무시 가능 (append + dedupe + compact 의 복잡성보다 단순 일관성
  우선). `session ls`/`session show` (10-app/quanta-session-subcommands) 의 backbone.
