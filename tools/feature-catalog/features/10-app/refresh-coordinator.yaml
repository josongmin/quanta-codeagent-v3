modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: ["surface:cli", "absorbed:codex"]
purpose: |
  Coordinates concurrent refresh_token exchanges so multiple callers sharing the
  same (issuer, clientId, refresh_token) tuple await one in-flight Promise
  instead of racing two requests at the issuer (Codex doesn't guard this — we
  do). Extracted from a module-level Map into a named class so per-adapter
  isolation (e.g. Phase-2 streaming adapter, parallel test harness) is possible
  without bleeding state through the module-level singleton.

  Inflight slot is freed in `.finally()` on both resolve and reject paths so the
  Map stays memory-clean. Process-wide default (`defaultCoordinator`) preserves
  byte-identical behavior for the historical `refreshToken(input)` callers.
  Test seams: `__reset()` + `__sizeForTest()` on the instance, and
  `__resetInflightForTest()` for the module-level default.
