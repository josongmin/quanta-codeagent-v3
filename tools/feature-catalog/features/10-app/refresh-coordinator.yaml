notes: |
  Refactor extracted from the pre-existing module-level in-flight Map; the
  module-level `refreshToken` + `__resetInflightForTest` exports remain
  byte-identical. New callers needing isolated dedup (e.g. ADR-0094 Phase 2
  streaming adapter) instantiate `new RefreshCoordinator()` directly.
