notes: |
  Hellgate coverage. model-switch-wire.hellgate (unit): the FACTORY leg (the base
  carries BOTH slots when the switch is composed — `modelSwitch` is an OPTIONAL
  builder arg, so forgetting it type-checks and silently leaves the loop inert) +
  paired control / frame→peek→enqueue→drain→store→PORT resolve / LIVE allowlist
  (an id rejected before the probe is accepted after it, same port instance) /
  fail-closed off-catalog / no-throw on an unwritable store AND on a synchronously
  throwing applier / the READ half through the REAL `resolveReadout` route with the
  honest missing-source control. model-switch-ws-daemon-e2e (integration): the same
  chain over a REAL WebSocket into a REAL `startWebDaemon` — plus the two controls
  (off-catalog rejected; NO control ports wired ⇒ the frame never reaches the port).
  RED-on-injection measured for all three web legs (drop `applyModel` ⇒ 4 red; drop
  the base `modelCandidates` ⇒ the factory case red; drop the readout source ⇒ the
  readout case red).

  HONEST GAP: no test drives a full LLM-driven WEB turn that then runs the picked
  model — the daemon sessions in these tests are the hermetic stub, so the drain is
  invoked explicitly (one hop short of the loop's own `pollControlRequests` tick,
  which the CLI side measures live).

  aug-28 — WRITE ORDER. `applyModel` is fire-and-forget by contract, so two
  `set_model` frames in one drain start two overlapping store writes. Unordered,
  their durable effects and their promise resolutions can land in OPPOSITE orders
  (a slow `rename(2)` is enough), leaving the FILE naming one model and the session
  cell the other: this session runs B, the next boots A, and nothing reports a
  conflict. `sessionScopedStickyModelStore` now serializes the write-through, so
  the last frame enqueued is last on disk AND last in the cell. Natural fs timing
  did not reproduce it (0/25); the guard forces the interleaving, because a green
  race is not evidence.

  aug-28 — the browser's CONFIRMATION now waits for the switch. `/model <id>` sent
  the frame and immediately re-read the `/model` readout under a line saying
  "reading back the effective model" — but the switch is applied out of band (the
  frame is drained on the loop's next control tick, then the store write is
  fire-and-forget), so that first read reported the OLD model nearly every time:
  the UI told the operator their switch had failed while it was landing a moment
  later. It now polls the readout (20 × 150ms, bounded by ATTEMPTS so a test can
  inject a no-op delay) and, if the id still is not effective, says exactly that —
  which is a real outcome, since an off-catalog id IS rejected server-side. The
  match is anchored on the readout's `model  <id>` LINE, not "the body contains the
  slug": every switchable id is listed as a candidate, so a substring check would
  report success for a switch that never happened (pinned as its own case).

  aug-28 UPDATE to the second half of that gap. It said "the web UI also has no
  model PICKER widget yet: a client must call the readout + send the frame itself".
  The browser now has a real front door — `slash-llm-config.ts` `/model` lists via
  the daemon's `/model` readout and switches by sending the `set_model` control
  frame, then re-reads the readout as an honest confirmation (the channel acks
  nothing, and an off-catalog id is rejected server-side). Before that it was a
  server-routed prefill stub that never executed, so `/model <id>` in the browser
  printed no error and changed nothing. What is still absent is a graphical PICKER
  (a click-to-choose list); the slash command is the whole UI. The daemon/browser
  readout vocabularies are now guarded against drift by
  `tests/unit/apps/web-daemon/readout-slug-parity-hellgate.test.ts` — that hole was
  real: this campaign added the `/model` readout server-side and left the browser's
  hand-copied list untouched, making a working readout unreachable from the only UI
  that consumes it.
