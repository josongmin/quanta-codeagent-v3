    web: "WIRED: runtime-factory.ts mints createWebModelSwitch (ungated — inert until a pick exists), passes it into mintInboundPorts (⇒ the control port's applyModel + live allowlist), into buildAgentConfigBase (⇒ base.stickyModelStore + base.modelCandidates) and into buildReadoutSources (⇒ GET /readout/model). MEASURED aug-27 against a live anthropic account: GET /readout/model on a REAL booted daemon returned the account's 10-model catalog with the current one marked; a real-socket controlRequest set_model then persisted the pick and the loop's own readStickyModelForMode + resolveSkillTurnOverride resolved it to that model's PORT."
purpose: |
  Make `set_model` on the web surface actually change the model.

  The control-request channel (ADR-0496) shipped with `set_permission_mode`
  load-bearing and `set_model` an explicit OBSERVABILITY-ONLY echo — the port's
  own doc said "no live model-swap cell on the daemon today". A browser/IDE
  client could send the frame, watch it acknowledged, and keep talking to the old
  model: the "promised, but the runtime does not keep it" shape.

  `web-model-switch.ts` supplies the two halves the LOOP actually consumes, the
  same pair the CLI's `/model` uses:
    - `stickyModelStore` — the per-mode pick `skill-gate#readStickyModelForMode`
      reads at the top of EVERY turn. Deliberately the SAME on-disk file the CLI
      writes (`~/.quanta/sticky-model.json`): one user, one model preference, and
      ADR-0462 documents two store instances over one file as supported usage. So
      a `/model` pick made in the CLI applies to the web session too.
    - `modelCandidates` — the LIVE id→PORT array `resolveSkillTurnOverride`
      resolves the picked id against. Without it the store write lands and the
      swap finds no port, silently running the boot model.

  WRITE half: the port gained `applyModel` (the real leg, fired alongside the
  existing echo the client renders) and a `modelAllowlist` that may be a GETTER —
  the candidate set grows when the lazy provider-catalog probe runs, and the
  control context is read per drain, so a just-discovered model is accepted
  without re-minting the port. Off-catalog ids stay fail-closed at the planner.
  The applier is sync + NO-THROW (a thrown applier abandons the whole drain): the
  write is fire-and-forget with its own error logging, so an unwritable store
  degrades to "not persisted", never to a dead turn.

  READ half: `GET /readout/model` (the out-of-band readout route, which works
  mid-turn because it takes no session lease) lists the effective model + every
  candidate + how to switch. Its accessor AWAITS the catalog probe, so opening the
  panel is what pays the one provider round-trip — daemon boot stays network-free.

  aug-28 — REPORTING the switch, not just applying it. `host.describe().modelSlug`
  now publishes the EFFECTIVE model (`@/agent/effective-model`), and the kernel
  refreshes that echo at the TURN TERMINAL. Both halves were needed: the echo is the
  single source for the `/state` readout's `model` row, the CLI attach pill, the SDK's
  `session.model`, and `turn.completed.modelSlug`. A7 (aug-30) removed the
  daemon's cumulative `/cost` token fold: `/cost` and the header's cumulative
  `turn.completed.costView` now project the session usage-accounting authority.
  Each admitted call carries its own usage/model/pricing evidence, so changing
  the selected model or completion label cannot reprice earlier spend. The
  completion model echo remains display metadata, not cost-aggregation authority.

  The candidate set is the provider's LIVE catalog (`LLMPort.listModels`), never a
  hand-maintained slug list: `MODEL_CONTEXT_WINDOWS` has no `gpt-5.6-terra` entry
  while that IS the live default, which is exactly the drift a static list ships.
