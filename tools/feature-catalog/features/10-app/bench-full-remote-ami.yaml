purpose: |
  Full-remote SWE-bench runs on EC2 with prebaked AMI (docker+uv+django images),
  closure diagnostics sidecar fetch, QUANTA_BENCH_* env forward, durable
  artifacts under benchHome() (not /tmp), and reusable box-session/pool wiring
  so repeated chunks amortize the bootstrap tax instead of re-provisioning every
  wave.

  Family-declared `remoteBootstrap` is resolved at every launch root by
  `withResolvedFamilyBootstrap` (`full-remote`, `pool`, `box up`) from the typed
  `BenchRunConfig` — not from a fresh env read. A family that declares a pin
  (ProMax) and arrives without payload is refused on both fresh
  `setupBoxForFamily` and warm attach. `boxGrade` skips the swebench shim only,
  never family setup. Bootstrap order: common install → optional shim → always
  family setup → profile readiness. Warm probe is the same profile-derived
  string (`bun`+`src`; `~/swebench-python` only when the family grades through
  the swebench harness). Actual EC2 RunInstances proof is a local-only gap
  (fake SSH contract tests only).
