purpose: |
  SEP9 gave verification a shared vocabulary. SEP12 makes the parts that decide a
  verdict bounded, exact, and separable.

  Four defects it closes were live at its base HEAD: every `gate.ts` command
  exited 1 before dispatching a gate, behind a count floor left stale by a
  legitimate 3-gates-into-1 consolidation; every shard worker was handed a
  symlink to the developer's whole `~/Library`; the required aggregator knew how
  many producers answered but not which ones, so one success row was a PASS over
  a seven-producer merge gate; and every process observation was an unbounded
  synchronous `ps`, so the watchdog could hang on the command it watches.

  Tier names now buy different things. `prepush` deliberately still tracks the
  PR population — the affected/changed selector is unwired, and narrowing to the
  canary alone would take `bun run prepush` from 3,941 files to 8 — and an
  interlock makes the premature flip RED.
