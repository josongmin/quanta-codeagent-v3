deliberate_hold:
  reason: |
    Four things are built, tested, and deliberately NOT switched on, each for a
    stated reason rather than for lack of time. An audit caught this list
    describing the state at the time it was written rather than the state at
    HEAD: the DAG had since been wired, and the cache hold named the wrong one
    of its two registries. Both are corrected below.

    `prepush` still selects the PR population: its canary is declared but the
    affected/changed selector (`verification-selection.ts`) is a dry run nothing
    consumes, and `gate.ts` exports the tier to the shard runner — so flipping it
    alone would cut `bun run prepush` from 3,941 files to 8.

    `chunkClaimsOverlap` is exported but the scheduler still uses the class
    matrix: turning it on needs a 1/2/4-worker verdict-equality canary from a
    real shard campaign.

    Cache identity narrowing resolves `whole-tree` for every chunk today. The
    resource registry is NOT the reason — it holds 562 rows, 548 certified.
    The declared-input opt-in set is empty, so `certifyDeclaredInputs` refuses
    every file: measured `input-not-opted-in` for a file that is otherwise
    fully certified. The remaining step is data, not code.

    `gate-dag.ts` IS the production scheduler — `stepGatePlan` is a bridge onto
    it and there is no second implementation — but it runs at `concurrency: 1`.
    The named prerequisite landed with it: `gate.ts` starts its child through
    `runBoundedChild`, so a scheduler that can start two gates at once can now
    stop either one. What is held is the WIDTH, and it is held on the gates
    declaring what they hold: several write the same checkout, and this
    repository carries a measured scar about contention producing a differently
    TIMED wrong answer rather than a slower right one. An interlock test makes
    a raise RED — measured: as-is passes, `concurrency: 2` fails — and a
    third arm proves the 1 is load-bearing rather than decorative, by running
    the same two-gate graph at both widths and comparing the enter/exit order.
  promotion_path: |
    Wire the selection layer into a gate, then flip PREPUSH_NARROWED_TO_CANARY —
    the interlock test releases by itself. Run the worker-equality canary, then
    enable claim overlap; its interlock test names the canary and is deleted in
    the same commit. Populate declared input scopes, then the cache narrows per
    chunk with no further code change. Declare `resources[]` on the gates that write the
    checkout, then raise the DAG's width; the interlock test names what it is
    waiting for and is deleted in the same commit.
