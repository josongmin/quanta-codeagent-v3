deliberate_hold:
  reason: |
    Four things are built, tested, and deliberately NOT switched on, each for a
    stated reason rather than for lack of time.

    `prepush` still selects the PR population: its canary is declared but the
    affected/changed selector (`verification-selection.ts`) is a dry run nothing
    consumes, and `gate.ts` exports the tier to the shard runner — so flipping it
    alone would cut `bun run prepush` from 3,941 files to 8.

    `chunkClaimsOverlap` is exported but the scheduler still uses the class
    matrix: turning it on needs a 1/2/4-worker verdict-equality canary from a
    real shard campaign.

    Cache identity narrowing resolves `whole-tree` for every chunk today,
    because both certification registries required for `certified` are empty of
    the declared-input half.

    `gate-dag.ts` is a ready-set scheduler with no production call site:
    `gate.ts` still runs `stepGatePlan`, which awaits every gate in manifest
    order. Wiring it needs the bounded child lifecycle primitive to replace
    `Bun.spawnSync(["sh", "-c", gate.run])` first — shell-command mode,
    process-group kill and signal forwarding — because a scheduler that can
    start two gates at once and cannot reliably stop either is worse than the
    serial loop it replaces.
  promotion_path: |
    Wire the selection layer into a gate, then flip PREPUSH_NARROWED_TO_CANARY —
    the interlock test releases by itself. Run the worker-equality canary, then
    enable claim overlap; its interlock test names the canary and is deleted in
    the same commit. Populate declared input scopes, then the cache narrows per
    chunk with no further code change. Land the bounded child primitive, declare
    `resources[]` on the gates that write the checkout, then swap `stepGatePlan`
    for `runGateDag`.
