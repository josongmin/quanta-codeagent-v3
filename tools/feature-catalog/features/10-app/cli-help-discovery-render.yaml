purpose: |
  기존 `cli-slash-help` 의 dynamic BUILTINS 인벤토리 위에 3개 P0
  discovery 갭 봉합:
  (a) **/image virtual entry** — `prompt-source.ts` 에서 BUILTINS 진입
  전에 intercept 되는 가상 명령. `runReplLoop` short-circuit `/exit`+
  `/quit` 와 같은 패턴으로 `VIRTUAL_COMMANDS` tail 에 fixed entry
  추가 (REPL-scoped queue context 때문에 SlashCommand 등록 불가).
  (b) **Category grouping** — `SlashCommand.category` 리터럴 union 으로
  section header 자동 분할. 고정 순서 (help / session / history / config /
  auth / skills / loop / alias / other), 섹션 내부 alphabetical. category
  결손 ⇒ "other" 버킷.
  (c) **Env-var SSOT auto-derivation** — `ENV_TABLE` 가 `runtime-config.ts#
  RuntimeConfig` 의 모든 필드를 1:1 mirror (~31 row). 새 env 추가 시
  ENV_TABLE 한 줄 append 로 `/help` 에 자동 노출. SSOT 미경유 surface-
  level `QUANTA_*` (~120 개) 는 의도적으로 docs 로 분리.
