deliberate_hold:
  reason: |
    short-circuit 가상 명령 (`/exit` / `/quit` / `/image`) 은 SlashCommand
    인터페이스에 등록되지 않아 BUILTINS 와의 single-source-of-truth 가
    아님. `VIRTUAL_COMMANDS` 수동 list 가 drift 위험.
  promotion_path: |
    short-circuit 명령도 SlashCommand 로 등록 + `executeImmediately: true`
    메타 분기 ⇒ VIRTUAL_COMMANDS 제거.
notes: |
  `renderHelp` pure function 으로 unit-test 가능. setColorPolicy("off")
  로 ASCII byte-identical render — OFF/ON 페어 단위 테스트. 11 hellgate
  cases (≥ 5 SSOT-routed knob coverage floor 포함).
