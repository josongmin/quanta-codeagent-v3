notes: |
  Distinct from `worktree-fork.ts` (`worktree-fork-primitive.yaml`)
  which is the session-fork tool — that wraps a NAMED long-lived
  worktree branch for resumable subagent isolation. This primitive
  is the SHORT-LIVED scratch-worktree HOF used inside individual
  tool calls (agent_tool, subagent runner). Both share the
  `<repoRoot>/.claude/worktrees/` namespace. Backoff: `50ms * attempt`
  (linear, 5-attempt cap) — small on purpose since the contention
  window is brief.
