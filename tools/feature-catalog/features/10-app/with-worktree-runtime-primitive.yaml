id: with-worktree-runtime-primitive
title: withWorktree — throwaway git worktree HOF + transient-lock retry
section: 10
subsystem: 런타임 — git worktree 격리 primitive
order: 136
maturity: L4
status: stable
owners: ["@songmin"]
labels: ["surface:cli"]
depends_on: [worktree-fork-primitive]
purpose: |
  Runtime HOF that runs `fn` inside a throwaway git worktree at
  `<repoRoot>/.claude/worktrees/agent-<id>` on branch `worktree-<id>` and
  cleans up by policy:

    - body resolves, no diff + no untracked → worktree + branch REMOVED
      (clean run, nothing worth keeping); `info.removed = true`
    - body resolves, changes detected → worktree LEFT IN PLACE so a
      caller can inspect / merge; `info.removed = false`
    - body throws → worktree force-removed (best-effort) and the
      original error is re-thrown

  Mirrors v2's `Jf_` / `qJH("agent_tool")` flow: create with
  `git worktree add`, keep-on-dirty, remove-on-clean.

  Hardening — `runWorktreeAddWithRetry` retries on TRANSIENT git LOCK
  contention ONLY (concurrent `worktree add` / index writes briefly
  holding the repo lock). Detection regex matches stderr/stdout
  emitted by git for the race (`index.lock`, `worktrees/<name>/locked`,
  "already locked", "Unable to create '...lock'", "cannot lock ref").
  Non-lock failures (bad ref, branch exists for a different worktree,
  disk full, …) fail immediately and are NOT retried.

  Idempotency on retry: a prior aborted attempt can leave a half-created
  worktree dir + a stale registration. Before each retry we prune git's
  stale-worktree records (`worktree prune`) and best-effort remove the
  leftover dir so the next `worktree add` starts from a clean slate
  rather than erroring on "already exists".
