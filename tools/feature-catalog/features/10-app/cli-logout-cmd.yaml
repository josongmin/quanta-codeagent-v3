    - src/apps/cli/logout-cmd.ts
  adrs: [94]
  tests:
    unit:
      - tests/unit/auth/login-status-cmd.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  Boxed UI uses the shared `auth-ui.ts` helpers (kvLine, renderBox, …);
  the `/login --chatgpt` companion lives in a sibling file. Exit code
  0 on success and on "already logged out"; 1 only on unexpected
  delete errors (e.g. read-only filesystem). Takes no arguments — extra
  args print a usage error and exit 1.
