id: cli-logout-cmd
title: /logout — destroy on-disk ChatGPT-OAuth token bundle
section: 10
subsystem: 앱 — auth slash command (ADR-0094 Phase 2)
order: 134
maturity: L4
status: stable
purpose: |
  Slash command that destroys the ChatGPT-OAuth token bundle written by
  `/login --chatgpt`. Idempotent: when there is no token to begin with the
  rendered box still shows cleanly with a "not signed in" line and exits 0.

  Does NOT call any remote `/revoke` endpoint — Codex itself doesn't
  (`codex-rs/login/src/auth/revoke.rs` is auth-mode-specific and not
  wired for the ChatGPT subscription path). We simply unlink the bundle
  so subsequent calls 401 cleanly. Read-then-delete: prior token record
  is read first (best-effort, swallows perms / shape errors) so the
  rendered confirmation can include `was plan` / `was account` lines.

  Test seam: `buildLogoutCmd({ env, nowMs })` mirrors the other auth-cmd
  builders so the command can be driven against a tmp prefs home in
  isolation.
evidence:
