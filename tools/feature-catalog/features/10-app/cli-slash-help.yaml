purpose: |
  `/help` 통합 메뉴 렌더러 — pure `renderHelp(BUILTINS)` 함수로 unit-testable.
  inventory 구성:
  (a) **dynamic** — `BUILTINS` 배열을 live 순회해 모든 slash command 자동
  나열 (수동 동기화 없음; 새 명령 추가 시 자동 노출),
  (b) **static** — keybinds 표 (`Ctrl-C`/`Ctrl-D`/`Esc`/`Tab` 등 REPL
  shortcut),
  (c) **static** — 주요 ENV knob 카탈로그 (`QUANTA_*` 네임스페이스).
  detail 모드: `/help <name>` ⇒ 단일 명령의 description/usage/example을
  `renderHelpDetail` 로 출력. 인자 0~1 강제 (`/help foo bar` ⇒ error).
  unknown command ⇒ error + suggestion 없음 (의도적 — typo는 명확히 fail).
evidence:
