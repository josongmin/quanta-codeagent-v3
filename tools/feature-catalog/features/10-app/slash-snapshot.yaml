knobs: []
deliberate_hold: null
notes: |
  Slice: `src/apps/cli` consuming `@/tool/shadow` indirectly via the tool
  dispatch — the surface itself does not import `ShadowOdb` directly so the
  HITL + audit invariants are byte-identical to a model-driven `shadow_*`
  tool call. Distinct from `/rewind`: that command rewinds CONVERSATION
  history (message-id), while `/snapshot` rewinds WORKSPACE state (file
  tree). Both can be combined for full session restore.
