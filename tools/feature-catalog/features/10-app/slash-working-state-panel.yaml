purpose: |
  Surface-only renderer for catalog 대5 L4 `WorkingState` — the per-session L3
  scratchpad (owner shortlist, hypothesis, blockers, next steps, deferred
  validation) the model mutates via `update_working_state`. The MODEL sees this
  block verbatim through `renderWorkingStateBlock` in its per-turn reminder, but
  the USER had no window into it until R10. Three render forms share one snapshot
  source: `renderWorkingStatePanel` (full bordered `/state` body),
  `formatWorkingStateTransient` (one-line status-bar overlay
  "state: 2 blockers, 3 next steps"), `formatWorkingStateSummaryRow` (turn-
  summary row splice). Aliased as `workingStateCmd` for callers that want the
  spelled-out command name (REPL keeps `/state` as the canonical surface).
