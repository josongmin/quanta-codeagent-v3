notes: |
  Slice: `src/apps/cli` imports `@/agent` for the `WorkingState` type ONLY
  (read-only — never mutates the snapshot). No I/O, no env reads, no clock —
  pure functions; callers decide WHEN to render. List caps prevent runaway
  models that filled the state with 200 next-steps from blowing the terminal.
  Default-OFF parity: empty / undefined snapshot ⇒ "(empty)" message or empty
  string, so the surface can no-op without a branch. Byte-identical OFF: the
  panel adds no escapes — `@/ui/ui-helpers` `ColorPolicyResolver` strips ANSI
  globally when colour=off.
