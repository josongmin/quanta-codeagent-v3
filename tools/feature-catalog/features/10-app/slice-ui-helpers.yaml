id: slice-ui-helpers
title: '`@/ui` 슬라이스 — surface-agnostic ANSI/box helpers (former auth-ui)'
section: 10
subsystem: Surface-agnostic Layer-2 (RFC may-22)
order: 22
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: ["surface:cli"]
depends_on: [color-policy-resolver]
purpose: |
  `src/ui/ui-helpers.ts` (구 `auth-ui.ts` 에서 이관 + 슬라이스화) — 순수 string/ANSI/
  box-drawing primitives. 어떤 표면 (CLI / REPL / 임베디드 browser / Tauri renderer) 도
  composition 가능. 본 슬라이스는 I/O 미수행 — 호출자가 렌더된 문자열을 자기 sink 에 쓴다.
  Public API: `ColorPolicyResolver` (NO_COLOR / FORCE_COLOR / TTY 인지 + cache + 표면별
  격리 인스턴스 지원) + ANSI color helpers (bold/dim/red/green/yellow/blue/magenta/cyan/
  gray) + `renderBox` (multi-line + title/footer + ANSI-aware width math) + `humanRel`
  (grammatical relative time + agoOnly flag) + `kvLine` (dim-padded key-value 정렬) +
  `statusPill` (`● label` 컬러 dot). 외부 dep 0 — quanta install 잠금 (memory
  `verify-workflow`) 준수.
evidence:
