      - tests/unit/auth/auth-ui.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  Slice 의존: `@/shared` only — RFC 3.1 slice isolation 준수. 영감: CLI + Web + Tauri
  공유 가능한 표면-무관 UI primitives. `ColorPolicyResolver` 객체화로 multi-surface 병렬
  실행 시 색상 상태 leak 차단 (Tauri renderer 가 CLI state 를 오염시키지 못함). ANSI-aware
  `visibleWidth` 로 boxes 가 mixed-colour 컨텐츠에서도 정렬. `humanRel(agoOnly:true)` 는
  past-only 필드 (last_refresh, last_seen) 에서 미래 timestamp 가 부조리하게 "in 3h" 로
  렌더되는 것을 "just now" 로 collapse.
