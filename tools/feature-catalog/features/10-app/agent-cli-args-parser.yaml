id: agent-cli-args-parser
title: agent — pure argv parser (mode-discriminated, env-free)
section: 10
subsystem: Unified Agent Runtime — Phase 4 entry
order: 50
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: n-a
owners: ["@songmin"]
labels: ["surface:cli"]
purpose: |
  `parseAgentArgs(readonly string[])` — pure argv → typed `AgentArgs`
  discriminated by `mode` (`interactive | headless | batch | ci-bot |
  ide | daemon`). RFC may-22-unified-agent-runtime / Phase 4. Hard
  invariants:
    - NO I/O, NO `process.env` reads, NO silent defaults
    - Defaults flow from `BUDGET_PRESETS` via `assembleAgentConfig`,
      never from this file
    - PROPOSITIONAL rules — a flag is either KNOWN or unknown; a value
      either starts with `--` (treated as missing) or doesn't. NO
      heuristics, NO threshold-based "if too many args" checks
    - Errors throw `AgentArgsError` so the caller (`./index.ts`) can
      map to a usage exit code (`64 EX_USAGE`)
  Lever ownership: `mode + dials + exhaustion` route into `AssembleRequest`;
  mode-specific positional fields (`prompt` / `corpus` / `instance` /
  `pr`) are consumed by the corresponding `./mode-presets/<mode>.ts`
  worker. Closed `ProviderToken` union (`"openai" | "anthropic"`) keeps
  the surface narrow.
