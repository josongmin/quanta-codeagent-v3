knobs: []
deliberate_hold: null
notes: |
  No-heuristic discipline (memory `no-heuristics-only-validated`): every
  decision in this parser is a structural propositional check. Errors
  are TYPED (`AgentArgsError`) — never a bare `throw new Error`. The
  exit-code routing happens in `index.ts`, which keeps cli-args free of
  process / exit concerns.
