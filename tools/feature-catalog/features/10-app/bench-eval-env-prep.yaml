purpose: |
  Per-instance env prep — the structural fix for Type-F (verify-loop
  stuck on env). When the instance carries `setupCmd`, run it INSIDE
  the sandbox copy BEFORE the agent. If setup exits non-zero, fail-fast
  with a DISTINCT `env_prep_failed` verdict and DO NOT run the agent —
  handing a half-prepared env to the model is the worst case (it burns
  budget thrashing on import errors / missing deps).
  The setup command is the task author's responsibility to keep
  HOST-CLEAN (e.g. a per-instance venv created INSIDE `sandbox`, NOT
  against host Python / global env). The runner enforces this only
  structurally — by scrubbing the env (`scrubEnv` from `@/runtime`)
  before spawning the setup process so leaked tokens / API keys cannot
  reach `pip install` / similar.
