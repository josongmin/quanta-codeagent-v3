notes: |
  Distinct verdict (`env_prep_failed`) so the bench report can clearly
  attribute failures to harness/env issues vs model issues — critical
  for triaging large runs. Without this verdict, env failures would be
  miscounted as agent failures (Type-F). The fail-fast invariant means
  ZERO model tokens are spent when env setup itself is broken.
