id: eval-synthetic-generator
title: eval Tier 1 — LLM-driven synthetic scenario generator (strict validation)
section: 10
subsystem: eval 앱 — Tier 1 fixture authoring
order: 85
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [headless, batch]
configurable: static
owners: ["@songmin"]
labels: ["surface:bench"]
depends_on: [eval-synthetic-judge, eval-synthetic-scenario-schema, eval-tier1-synthetic, fallback-kinds-policy, llm-factory]
purpose: |
  `bun run eval generate --usecase ID [--count N]` — 주어진 `UseCaseId`로
  N개의 fully-formed `Scenario` JSON을 LLM으로 생성해 `scenarios/<usecase>/`에
  저장. Hard constraints: schema 정확 일치 (parseScenario 통과), `usecase`
  필드가 요청 id와 일치 (잘못된 leaf 선택은 의도적으로 reject — 실수 surface),
  rubric ≥3 items, files ≤4 + 각 ≤4KB(default DEFAULT_MAX_FILE)로 git-friendly
  유지. 한 개라도 위반하면 절대 half-broken 파일 안 씀 — `accepted`/`rejected`
  카운트 + per-rejection short reason 반환. 시스템 prompt가 sibling leaves
  (같은 major) 3개를 reference로 보여줘서 모델이 distinguishing task를 생성
  하도록 유도. 중복 id는 second-occurrence부터 reject (deterministic ordering).
  `extractJsonArray`가 balanced-bracket으로 markdown fence 등 noise 제거.
evidence:
