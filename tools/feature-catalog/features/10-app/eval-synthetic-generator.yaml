notes: |
  Reject-on-invalid 정책이 핵심 — 잘못된 usecase field를 silent coerce하면
  taxonomy drift signal을 잃음. Output path는 `outRoot` override 가능 (테스트가
  tmp dir 주입). file content는 `Buffer.byteLength(utf8)`로 측정해 multi-byte
  Korean 등에서도 정확. 향후 batch-mode/dedup-by-similarity은 미흡수.
