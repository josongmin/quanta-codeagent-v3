purpose: |
  Plane-clean mini-generator that walks `docs/decisions/*.md` (ADR
  headers + status / date / related / 참조 paths) and `src/**/index.ts`
  (slice barrel doc-comments) — two signals of intent quanta has already
  stabilized — and emits `docs/ARCHITECTURE.generated.md`. Closes the
  Audit-D `ARCHITECTURE.md` 5-week drift gap that came from 90 ADRs
  landing while hand-edited docs froze. Rejects heavyweight AST
  (`typedoc` / `dependency-cruiser`) in favor of regex over signals the
  team already produces. Korean + English header variants both
  supported. Caller-invoked handshake (`bun tools/arch-gen/main.ts`) —
  no daemon, no FS watcher.
