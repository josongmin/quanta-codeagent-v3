id: bench-failure-classifier
title: bench — decisive 2-axis failure classifier (termination × signals[])
section: 10
subsystem: Bench harness — post-run diagnosis
order: 42
maturity: L2
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [headless, batch]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:bench"]
depends_on: [probe-failure-triage]
surface_integration:
  cli: missing
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "src evidence not reachable from the interactive CLI entry (src/apps/cli/index.ts) — wired only into other apps (eval/bench/probe/headless) or unwired"
    web: "2-axis failure classifier surfaces in the operator console + bench-report.json (CLI), not reachable from web-daemon; no browser affordance"
purpose: |
  Classifies an `InstanceResult` for the operator console + `bench-report
  .json`. Two-axis schema (covering + non-exclusive):
    - `termination` : EXACTLY ONE — HOW the run ended
                      (success / fail / timeout / oom / sandbox_error /
                       env_prep_failed / agent_error / budget_exhausted / …)
    - `signals[]`   : ZERO-OR-MORE — WHAT went wrong along the way
                      (repeated tool failures of the same class, verify
                       livelock, missing test command, suspicious empty
                       patch, etc.)
  Sources of truth: `InstanceResult` (turns, patch, passed, error,
  patchPath) — pure derivation from already-recorded fields. Surfaced
  next to each `[FAIL]` line so the operator scanning a 100-instance
  run can spot environment / harness / model failures without opening
  trajectories.
evidence:
  code:
    - src/apps/bench/corpus/failure-classifier.ts
  adrs: []
  tests:
    unit:
      - tests/unit/bench-failure-classifier.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  Distinct from `probe-failure-triage`: this consumes a TERMINATED
  `InstanceResult` (bench-side, post-run), while triage consumes a LIVE
  `TrajectoryEvent[]` (probe-side, hypothesis-only). Two-axis schema is
  deliberately *covering+non-exclusive*: every result MUST have exactly
  one `termination`, but `signals[]` may be empty (clean success) or
  multiple (timeout AND repeated tool failure AND empty patch).
