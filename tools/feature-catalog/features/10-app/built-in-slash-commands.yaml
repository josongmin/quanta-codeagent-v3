purpose: '/context, /usage, /color, /navigate, /wait — surface-agnostic SlashCommand 레지스트리. isSlashCommand는 /<letter>... 만 매치 ([/path/to/file]는 false). cli/index.ts의 main()이 session subcommand 다음, --help 이전에 short-circuit. LLM 호출 0회. /color & /navigate 는 ~/.quanta/preferences.json 영속화 (QUANTA_PREFS_HOME 테스트 시ams). /wait 캡 = 3600s.'
