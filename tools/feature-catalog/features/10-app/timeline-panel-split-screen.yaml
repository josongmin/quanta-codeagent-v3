notes: |
  panel 0-row disabled fallback path: env unset / `0` / 음수 / NaN / non-TTY
  → 0 return. ring buffer 크기 = N rows. AgentEvent variant render는 모두
  short string + forward-compat (미지 kind는 generic stringify).

  Slice fence: `timeline-panel.ts`는 stream `AgentEvent` types + write sink
  port만 import. agent / permission / tool slice 없음. `repl.ts`는 boot
  composition layer가 `QUANTA_TIMELINE` parse + panel build + proxy port
  fanout 담당.

  Allow paths: tee가 upstream stream을 proxy port로 wrap (timeline panel
  + upstream stream 양쪽으로 fanout). Panel write 오류는 SWALLOWED (timeline
  은 절대 agent loop 못 죽임 — debug-tracer와 같은 NO-THROW posture).
