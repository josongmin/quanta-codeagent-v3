id: timeline-panel-split-screen
title: split-screen live AgentEvent timeline panel (`QUANTA_TIMELINE=N`) (ADR-0239 Track T)
section: 10
subsystem: REPL surface — DECSTBM split-screen 위 ring-buffer timeline (status bar 위)
order: 2390
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: partial
owners: ["@songmin"]
labels: ["surface:cli", "tier:observability"]
depends_on: [debug-tracer-decision-event, cli-status-bar]
config_refs:
  env: ["QUANTA_TIMELINE"]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-11"
  evidence:
    cli: "TIMELINE_FORMATTED + TIMELINE_FALLBACK inventories partition AGENT_EVENT_TYPES exactly (agent-event-surface-inventory-hellgate)"
    web: "Terminal-only ANSI DECSTBM split-screen panel; AgentEvent variants it renders are mostly outside the 7-tag session-host-turn-event bridge, so they never reach the browser."
purpose: |
  ADR-0239 debug-tracer가 stderr에 단일-line per-event를 dump하는 방식은
  scrollback에 묻혀버려서 high-rate session에서 한눈에 trajectory를 보기
  어려움. Cursor / Claude Desktop의 chat-inline collapsible panel과 달리
  CLI의 풀-screen 점유는 곤란 — DECSTBM (DEC Set Top and Bottom Margins)
  ANSI escape를 활용해서 split-screen으로 위쪽 N 줄을 live timeline panel,
  아래는 status bar + scrollback 영역으로 분할.

  Layout: 화면 행이 `rows`일 때 `rows-N..rows-1` 행이 timeline panel (ring-
  buffered N 행), 그 아래가 status bar (기존 layout), 그 위가 일반 scrollback.
  `QUANTA_TIMELINE` env가 unset / `0` / non-finite / non-TTY이면 panel은
  **0 행** (disabled) → pre-timeline build와 visually indistinguishable.

  `createTimelinePanel({ height, write?, stream? })`로 panel + AgentEvent
  → 1-line stringifier (`renderTimelineRow`) 한꺼번에 build. 각 행은 짧고
  forward-compatible — 미지의 AgentEvent variant도 throw 없이 generic
  fallback (timeline은 forward-compat plane). Write sink 오류는 SWALLOWED
  (UX surface는 절대 agent loop 못 무너뜨림).

  Default-OFF byte-identical: `QUANTA_TIMELINE` 미설정 / 0 / non-TTY 경로에서
  proxy port 없이 upstream stream literal return — tee fan-out / JSONL bytes
  / status-bar render 전부 pre-ADR baseline과 동일. boot 시 한 번 environment
  parse → panel height 결정 → 결과에 따라 proxy 만들지 그냥 stream return
  할지 분기.

  Research grounding: Cursor + Claude Desktop이 chat-inline panel을 쓰지만
  CLI surface에서는 split-screen이 viewport-economical. tmux / vim split의
  컨벤션 흡수.
