purpose: |
  Tier 1 합성 시나리오 schema (`scenarios/<usecase-id>/<scenario-id>.json`).
  Schema version 1, additive — 새 optional 필드 추가는 backward-compat,
  breaking change는 SCENARIO_SCHEMA_VERSION bump 필요. `Scenario` shape:
  `{ schema, id, usecase, title, prompt, files?, setupCmd?, rubric[≥1],
  forbidden?, maxTurns? }`. `parseScenario`는 strict — `forbidden`에 non-string
  들어가면 safety net이 무력화되므로 throw, `maxTurns`는 positive integer
  강제 (NaN/0/negative이면 runAgent crash). `RubricItem.weight`는 (0,1] 범위
  벗어나면 default 1로 강등. `loadScenarioFile`이 read + parse를 합친 single
  entry point. JSON 선택 (YAML 아님) — parser dep 없음 + hand-editable +
  diff-clean. Tier 1 runner와 Tier 4 compare 양쪽이 이 schema로 시나리오를
  로드.
