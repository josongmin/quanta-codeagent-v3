notes: |
  Scenario id는 filename stem과 일치해야 — generator/runner가 그렇게 가정.
  `files` 목록은 sandbox 안에만 쓸 수 있게 path-escape 검사는 `runner.ts`에서
  수행 (`isInsideSandbox` 가드). rubric 최소 1, generator는 더 강한 ≥3
  constraint를 자체 enforces (`generator.ts/validateExtra`).
