notes: |
  Companion to `thin-surface-headless-core` (the ratchet/governance mechanism)
  and `headless-second-consumer` (the portability proof). This entry tracks the
  CODE relocations the ratchet protects — moving reusable loop/launcher semantics
  below `src/apps/**`. Verified at landing: smoke 15/15 byte-identical, tsc 0,
  biome 0, 3-lens hostile self-audit found 0 correctness defects. The
  `session-turn-driver` behavioral unit test drives a fake `RuntimeSession`
  pinning append signature + approval loop + both verbatim error strings; the
  thin-surface hellgate pins the surface-agnostic (terminal-free) shape; the
  surface-coupling ratchet derives its surface set from `readdirSync` so a NEW
  surface or a re-introduced sideways edge trips it. The existing
  `agent-config-assembler` / `agent-cli-args-parser` Phase-4 entries still point
  at the `apps/agent/{cli-args,index}` re-export shims (unchanged, accurate).
