    web: "Pure internal surface-governance refactor, no UI affordance on any surface; surface-agnostic runtime plumbing (runSessionTurn/ExternalPromptQueue), not a browser-renderable feature."
purpose: |
  Later §3.1 thin-surface increment (jun-04, commit 00f0bfb6) on top of the
  ADR-0303 ratchet: relocate reusable runtime + launcher semantics BELOW
  `src/apps/**` so the surfaces stay thin and no surface reaches sideways into
  a sibling surface. Three relocations:
    1. turn-driver HOIST — the `append → turn.run → resolve-approval → loop`
       turn-completion primitive moves OUT of the CLI surface
       (`apps/cli/repl/session-loop.ts`) into the surface-agnostic
       `@/runner/orchestrate/session-turn-driver` (`runSessionTurn`, aliased
       `driveSessionTurn`). CLI calls it via a thin adapter (image-drain +
       per-turn permissionModeState sync stay surface-owned via the `beforeTurn`
       hook); headless adopts the SAME driver, ending the divergence where it
       re-implemented the turn WITHOUT the approval loop. `SessionTurnResult.outcome`
       is additive so headless stays byte-identical.
    2. cli→agent launcher RELOCATION — kill the `apps/cli/index.ts → ../agent`
       cross-surface import. `parseAgentArgs` (+ cli-args) moves to
       `@/host/runtime/agent-args`; the env-reading `buildBaseFromArgs` +
       `toAssembleRequest` + ~30 helpers move to `@/host/runtime/agent-arg-builder`;
       the env-PURE `ModePolicy + BudgetMeter + BudgetCaps` wiring lives in
       `@/host/runtime/agent-config-assembler` (relocated from the
       `apps/web-daemon` cross-surface runtime edge). `apps/agent/{cli-args,index}`
       keep re-export shims; `apps/cli/index.ts` reaches DOWN to `@/host/runtime`.
       The relocated `process.exit(2)` (missing API key) becomes a typed
       `ProviderKeyMissingError(exitCode=2)` — host composition no longer owns
       the terminal/exit; both surface entries map it.
    3. external-prompt-queue HOIST — the generic abort-aware out-of-band prompt
       FIFO moves into `@/runner/orchestrate/external-prompt-queue`
       (`ExternalPromptQueue<T>`); the CLI keeps only a one-line alias bound to
       `CliPromptInput`.
