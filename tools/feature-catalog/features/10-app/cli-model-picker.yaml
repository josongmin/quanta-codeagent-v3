knobs:
  - name: '/model --clear'
    where: 'registry-surface.ts modelCmd (CLEAR_FLAG) ⇒ StickyModelStore.unset'
    purpose: 'drop the saved pick for the current provider+mode and go back to the boot model (idempotent; surgical — sibling modes and providers survive)'
  - name: '/model'
    where: 'registry-surface.ts modelCmd (no-arg = list current + candidates)'
    purpose: 'render the current sticky model + every candidate with inline context/output/recommended/capability metadata'
  - name: '/model <id>'
    where: 'registry-surface.ts modelCmd (one-arg = switch + effort clamp)'
    purpose: 'switch the current-mode model (sticky path) and clamp the session reasoning-effort into the new model''s supported set (Codex validateEffort)'
deliberate_hold: null
notes: |
  Four hellgate suites cover the three slices. model-picker.hellgate:
  formatModelLine token-compaction (1M/400k/16k) / field OMIT on absent metadata
  (bare id) / current-marker column / pickModel exact-then-CI-then-throw /
  UnknownModelError carries known list / clampEffortForModel un-tabled =
  conservative no-clamp / supported = no-op / unsupported = clamp to default +
  notice / REASONING_EFFORT_TO_LEVEL exhaustive over ALL_REASONING_EFFORTS (drift
  guard). model-cmd-e2e.hellgate: no-arg listing / one-arg set confirmation /
  effort clamp applied + echoed only when effort wire + model meta present /
  not-wired path exit 0 / unknown model exit 1 / wrong arity exit 1 / write-error
  surfaced (no throw) / tab-complete prefix filter inert past arg0 / modelCmd
  registered in SURFACE_SLASH_COMMANDS. model-adapter.hellgate: current() host-
  getter-wins → the store's sync `peek` → boot fallback (aug-28: was a private
  per-mode shadow map, deleted once the port gained `peek`) / the read is keyed per
  provider+mode (no cross-mode leak) / candidates() dedupe + metadata enrich + recommended on boot model /
  set() invalid-mode + empty-id reject (no write) / store-write-error surfaced.
  model-compose-wire.hellgate: buildModelAdapterWire binds the slot from the same
  sticky store. model-switch-wire.hellgate (aug-27): drives the REAL
  `composeSurfaceWires` + `wires.dispatchSlash("/model")` and reads the consume
  side through the real loop helpers — slot present (not "not wired") / a
  catalog-probed model is pickable / the pick reaches `readStickyModelForMode` AND
  resolves to that model's PORT / picker list ≡ `modelCandidates` / rejected probe
  degrades / unbuildable slug never offered / both compose keys still in
  PASS_THROUGH_COMPOSE_KEYS + the patch survives the snapshot rebuild.
  RED-on-injection measured for all three wires (revert store ⇒ 6 red, revert
  probe ⇒ 3 red, revert modelCandidates ⇒ 2 red).
  model-persistence.hellgate (aug-27): a pick SURVIVES the session coherently —
  the write lands on disk; session 2 can RUN it on turn 1 (a PORT exists without
  any `/model` call, via the eager `extraIds` seed); the picker marks it current
  (a sync `peek` of a store seeded from the boot snapshot); the BANNER announces
  it; the mode axis matches the loop under `--plan`; an explicit `--model` /
  `QUANTA_MODEL` pin BEATS the stored pick; a pick made under another PROVIDER is
  invisible here; and the loop keys off the store SLOT's provider rather than
  `config.llm.provider` (one authority for the write key and the read key);
  paired controls for no-file and a CORRUPT file; plus a hermeticity guard that the
  store path follows the injected env.
  RED-on-injection: drop the eager seed ⇒ 2 red, drop the sync read ⇒ 2 red, drop
  the slot-provider preference ⇒ 1 red.
  port-identity-capability-guard (aug-27): every production port DECORATOR (13
  spread-shaped ones via the helper, plus the `RetryingLLM` / `FallbackLLM` classes
  that hand-roll the same fields) forwards the WHOLE
  non-stream surface, `listModels` callable through the wrapper (bound receiver),
  with a paired control that a port WITHOUT the capability never gains a fake one.
  This guard exists because the defect it pins actually happened mid-campaign (the
  CLI spinner-stall wrapper ate `listModels`, so `/model` could only list the boot
  model) — and on its first run it caught TWO MORE live holes: `RetryingLLM` (on
  every CLI stack) and `FallbackLLM` were dropping `contextWindowKey`, i.e. a
  granted 1M-token window resolved as 200k for compaction. Mode-implicit /model is DISTINCT from /sticky-model's explicit
  2-arg form; both reuse one StickyModelStore so the loop's consume side observes
  either (ADR-0462). The web surface has its own door now — see `web-model-switch`.
