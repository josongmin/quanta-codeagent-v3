  method: audited
  verified: "2026-08-27"
  evidence:
    cli: "live in interactive CLI — modelCmd imported+registered in registry-surface.ts (reached via index.ts → slash-commands.ts → registry-surface), and the ctx slot is now filled from the SURFACE-owned store (core-state.ts → mutable-wires buildModelAdapterWire) rather than the headless-only runtimeContext slot. aug-27 measured on a real pty against a live chatgpt-oauth account: `/model` lists all 7 catalog models (was 1 + \"not wired in this surface\"), and after `/model gpt-5.4` the per-turn resolve reports base=gpt-5.6-terra sticky=gpt-5.4 TURN-RAN-ON=gpt-5.4"
    web: "aug-27: the web surface now has the SAME two halves through its own door — `set_model` (control request) writes the SAME sticky store and `GET /readout/model` lists the SAME candidate catalog (see the `web-model-switch` entry). This CLI slash command itself is still CLI-only (the SlashPalette server-routed prefill stub does not execute), and the web has no picker WIDGET yet — a client calls the readout + sends the frame."
purpose: |
  The `/model` mode-implicit interactive picker + the model↔effort coherence fix.
  Distinct from `/sticky-model` (ADR-0462), which takes an explicit
  `<mode> <modelId>` and renders no candidate list: `/model` is mode-implicit
  (targets the CURRENT posture), lists every selectable candidate inline, and —
  the SOTA++ CORE — reconciles the session reasoning-effort with the newly-picked
  model (Codex `validateEffort` mirror). Three slices:

  `model-picker.ts` (PURE core, leaf — type-only imports): `formatModelLine(meta,
  current)` renders ONE candidate row mirroring the Claude Code CLI picker
  (`400k ctx · 128k out · (recommended) · most capable`) and OMITS any field whose
  metadata is absent — never a placeholder, so a metadata-less model renders as a
  bare id (plan §14 graceful degrade). `pickModel(requested, candidates)` resolves
  exact → case-insensitive → `UnknownModelError` (no silent fallback, `/effort`
  parity; input trimmed first). `clampEffortForModel(modelId, currentEffort,
  support)` is the correctness fix: `support===undefined` (un-tabled model) ⇒
  CONSERVATIVE all-supported (NEVER clamp — no spurious downgrade); current effort
  in `support.supportedEfforts` ⇒ no-op; else clamp to `support.defaultEffort` +
  a one-line notice naming the dropped/new tier. The slug→`EffortLevel` map is a
  compile-checked EXHAUSTIVE `Record<ReasoningEffort, EffortLevel>` (no `as` cast),
  so dropping a tier from one union but not the other is a BUILD error here.

  `model-cmd.ts` (the `SlashCommand`): mirrors `/effort` exactly. no-arg ⇒ current
  model (marked `*`) + every candidate + a `use:` hint; one-arg ⇒ resolve → set
  via the sticky path → `applyEffortClamp` (reconcile ONLY when both the effort
  wire and the model's effort metadata are present — conservative). arity/unknown
  exit 1; `ctx.model===undefined` ⇒ "not wired in this surface" + exit 0 (parity
  with surface-only commands). tab-complete = candidate-id prefix filter. Isolated
  in its own `*-cmd.ts` so its `model-picker` import is allowed under the ADR-0306
  fence (registry imports it as an opaque `SlashCommand`).

  `model-adapter.ts` (ctx-adapter): projects the surface's model facts onto the
  `SlashContext.model` slot. `current()` = host getter (wins) → per-mode SYNC
  SHADOW (this adapter's own `set()` updates it, so an in-surface set is reflected
  IMMEDIATELY — the sticky store is async, a sync getter could only return a
  Promise) → boot model. `candidates()` = a LIVE getter over the surface's
  candidate ids (aug-27: boot + `QUANTA_RETRY_MODELS` + every id the provider
  catalog probe added), deduped, enriched from the provider-metadata SSOT
  (window/output/recommended/hint; `deriveHint` fires ONLY for an id with an EXACT
  metadata entry — a family-fallback id gets NO hint, since the family badge
  ("most capable") is actively wrong on a live `-mini`/`-spark` slug). `set(id)` persists
  via the SAME `StickyModelStore` the loop's CONSUME side reads (ADR-0462), keyed
  to the CURRENT mode (mode-implicit), returning a typed outcome
  (`ok`|`invalid-mode`|`write-error`) — never throws. So `/model` and
  `/sticky-model` agree on one store. Registered in `registry-surface.ts` and wired
  via `surface-compose.ts` `buildModelAdapterWire`, both reachable from
  `index.ts` — the command is live in the interactive CLI.

  aug-27 WIRING FIX — the command was registered but UNREACHABLE on the primary
  surface, in three stacked half-wires: (1) `mutable-wires` read the sticky store
  off `runtimeContext.stickyModelStore()`, a slot only the HEADLESS composition
  root fills (`resolveStickyModelStore`), so the interactive CLI's `ctx.model` was
  omitted and `/model` printed "not wired in this surface"; (2) candidates came
  from `QUANTA_RETRY_MODELS` alone (unset by default) so the picker offered only
  the boot model and `pickModel` rejected everything else; (3) the CLI never set
  `AgentConfig.modelCandidates`, the list `skill-gate#resolveSkillTurnOverride`
  resolves a picked id to a PORT out of — so even a stored pick was a silent
  no-op. Now: `core-state.ts` mints BOTH halves and `runtime-compose.ts` threads
  the SAME instances down as `stickyModelStore` + `modelCandidates` (both new
  PASS_THROUGH compose keys).

  aug-28 CORRECTION — this entry described the store as "an in-memory
  `StickyModelStore`, session-scoped on purpose, since the adapter's `current()` is
  sync while the store port is async". Both halves of that are now wrong. The store
  is `fsBackedStickyModelStore` wrapped in `sessionScopedStickyModelStore`, so a
  pick PERSISTS for the next session while this session still reads its own cell
  (a pick made elsewhere lands at the next boot, never mid-turn). And the sync/async
  argument no longer holds: `StickyModelStore.peek` is the port's REQUIRED sync
  read, so `current()` reads the store itself instead of a private shadow copy.

  aug-28 — `/model --clear` (and `/sticky-model <mode> --clear`). There was no way
  to UNSET a pick: the port had `get`/`set`/`load`/`peek` and `set` rejected an
  empty id, so once an operator ran `/model gpt-4o` that preference was permanent
  for that provider+mode across every future session, escapable only by hand-editing
  the JSON or by an explicit `QUANTA_MODEL` pin (which overrides one invocation).
  `StickyModelStore.unset` is REQUIRED (a new impl cannot forget it), idempotent
  (an absent key is a success and the fs impl writes nothing, so a first-run clear
  does not conjure the file), no-throw, backs corrupt bytes to `.corrupt.bak` before
  truncating to `{}`, and never unlinks. The session-scoped decorator clears its
  in-memory cell ONLY when the durable removal succeeded.

  aug-28 — ONE key for BOTH front doors. `/sticky-model` writes the same store, and
  it was left writing the bare mode after the provider joined the key: measured end
  to end, the command printed `default → boot-model`, the file held
  `{"default":"boot-model"}`, and `readStickyModelForMode` returned `undefined` — a
  success line over an inert write. It is provider-keyed now, and reads accept the
  legacy bare key as a FALLBACK (`stickyModelReadKeys`) so every
  `sticky-model.json` written before the change is still honored; a scoped entry
  wins over a bare one for the same mode.

  aug-28 — the OTHER surfaces that had a store but no candidates. The headless /
  one-shot root (`buildBaseFromArgs`) resolved `stickyModelStore` unconditionally
  and never set `modelCandidates`, so a skill-declared `model:` override (and, under
  `--sticky-model`, a CLI pick) was read every turn and silently discarded for want
  of a port. `resolveModelSwitchSlots` now holds both halves together. And the
  OpenAI adapters gained `listModels` — including `openai-responses`, which is what
  a default `OPENAI_API_KEY` session actually boots (`resolveOpenAISurface` returns
  `"responses"` for the default base URL), so implementing only the
  chat-completions one would have left the common BYOK session with a picker that
  could list nothing but the boot model.

  `@/llm/model-catalog` (shared wire — it lives in `@/llm`, not a surface, because
  the web daemon's `set_model` needs the SAME candidate set and the slice fence
  forbids it importing `@/apps/cli`): ONE live `ModelCandidate[]` shared by
  reference with `AgentConfig.modelCandidates`. Seeded synchronously (boot port +
  retry candidates); `refresh()` — awaited by `/model` before it lists or resolves
  — probes `LLMPort.listModels` ONCE per session and pushes each newly-discovered
  slug that a port can be built for. Fail-open: no probe surface, a rejected probe
  (expired auth/offline), or an unbuildable id ⇒ the seeded set stands. A slug with
  no buildable port is DROPPED rather than offered-then-silently-ignored.

  `LLMPort.listModels` + `src/llm/port-identity.ts`: the probe is the provider's
  own catalog (chatgpt-oauth reuses its 5-minute `/codex/models` memo — the same
  truth Codex uses), so the candidate set never drifts like a hardcoded slug list
  would (`MODEL_CONTEXT_WINDOWS` has no `gpt-5.6-terra` entry while that IS the
  live default). `forwardPortIdentity` exists because EVERY port decorator
  re-spelled the identity copy inline and therefore ate the new capability: the
  CLI's spinner-stall wrapper dropped `listModels`, so the interactive surface saw
  a probe-less port. Every SPREAD-shaped decorator (13 of them) now forwards the
  whole non-stream surface through that one helper. The two CLASS-shaped ports,
  `RetryingLLM` and `FallbackLLM`, still declare and assign each identity field by
  HAND — a helper spread cannot fill a class's readonly fields — which is exactly
  why the capability CENSUS guard
  (`tests/unit/llm/port-identity-capability-guard.test.ts`) enumerates them
  explicitly instead of trusting the helper: they are the two places a new
  capability can still be silently eaten. Three ports were caught dropping
  `contextWindowKey` (resolving a granted 1M window as 200k): those two classes,
  plus the responses-continuation wrapper.
