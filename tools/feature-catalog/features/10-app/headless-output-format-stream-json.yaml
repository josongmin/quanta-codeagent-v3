id: headless-output-format-stream-json
title: Headless --output-format (text|json|stream-json)
section: 10
subsystem: 앱 / headless 머신 컨트랙트
order: 26
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [headless]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:cli", "tier:1", "absorbed:claude"]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "--output-format text|json|stream-json parsed in headless CLI args, StreamJsonSink wired into headless preset"
    web: "machine STDOUT contract for headless/SDK/CI consumers; ui_surfaces n-a, no browser affordance at all"
purpose: 'headless 런의 STDOUT 컨트랙트를 SDK/CI가 파싱 가능한 머신 포맷으로 선택(P26). --output-format text|json|stream-json (기본 text) + 선택 --include-partial. stream-json은 각 SessionEvent를 1줄 NDJSON으로(이미 완성된 encodeSessionEvent 코덱 재사용 → {version:session.v1,kind:event,payload}), json은 끝에 단일 최상위 JSON 배열로 flush. partial/delta(turn.output.delta)는 --include-partial일 때만. 사람용 로그는 stderr(logger)로 라우팅돼 stream-json stdout을 오염시키지 않음. 기본/text는 stdout byte-identical(default-OFF).'
evidence:
  code:
    - src/apps/agent/mode-presets/stream-json-sink.ts
    - src/apps/agent/mode-presets/headless.ts
    - src/host/runtime/agent-config-assembler.ts
  adrs: []
  tests:
    unit:
      - tests/unit/apps/agent/mode-presets/stream-json-sink.test.ts
    integration:
      - tests/integration/headless-stream-json-e2e.test.ts
    contract: []
knobs:
  - name: --output-format
    where: cli-arg
    default: text
    purpose: 'headless stdout 컨트랙트 선택(text|json|stream-json). 기본 text는 레거시 사람용 출력(byte-identical); json/stream-json은 StreamJsonSink를 cfg.stream으로 주입하고 최종 사람용 답변 stdout 프린트를 스킵.'
  - name: --include-partial
    where: cli-arg
    default: "false"
    purpose: 'json/stream-json 모드에서 streaming-delta(assistant_text→turn.output.delta)도 방출. text/absent에는 무효(parser가 거부).'
notes: 'L4: 코어 슬라이스(StreamJsonSink)는 LIVE 배선 완료 — headless 프리셋이 output을 읽어 sink를 mint. CLI arg 파싱 경로(agent-args.ts 파서 + agent-arg-builder.ts AssembleRequestPartial + index.ts applyModeSpecificRequestFields)도 LIVE. 버전 마커는 코덱의 SESSION_PROTOCOL_VERSION(session.v1)을 그대로 사용 — bespoke 인코딩 없음.'
