id: probe-failure-triage
title: probe — NON-authoritative failure triage (ordered rule-table hypothesis)
section: 10
subsystem: Probe (trajectory inspector) — failure-class hypothesis
order: 31
maturity: L4
status: stable
purpose: |
  Reads a `TrajectoryEvent[]` and returns a HYPOTHESIS describing the
  likely failure class:
    {
      likely_failure_class: string,
      confidence:            number,   // hedged — capped well below 1.0
      hint:                  string,   // one-line, hedged language
      evidence:              string[]  // raw excerpts for human review
    }
  Implementation = ORDERED rule-table of tiny pure predicates over the
  event list. Rules are tried first-match-wins; each rule encodes a
  signal pattern (e.g. budget-exhaustion, repeated tool failure of the
  same class, verify-loop livelock, sandbox-prep crash, missing test
  command). No field implies certainty: NO "verdict" / "definitive" /
  "certain" vocabulary is emitted. Pure function — same input ⇒ same
  output, deterministic, no I/O.
evidence:
  code:
    - src/apps/probe/triage.ts
  adrs: [10]
  tests:
    unit:
      - tests/unit/probe-triage.test.ts
    integration:
      - tests/integration/probe.test.ts
    contract: []
knobs: []
deliberate_hold: null
notes: |
  Probe philosophy (RFC §1.2): hypothesis only. The triage output is a
  HINT to the operator, NEVER a programmatic gate. Distinct from the
  bench `failure-classifier` which classifies an `InstanceResult` post
  termination (covering+non-exclusive 2-axis schema); triage is purely
  trajectory-event-driven and does not require a terminated run.
