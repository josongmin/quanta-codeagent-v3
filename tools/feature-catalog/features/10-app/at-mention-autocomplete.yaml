id: at-mention-autocomplete
title: "@-mention autocomplete dropdown (CLI input)"
section: 10
subsystem: 앱 — CLI 입력 UX (codex/claude @-mention 흡수, ADR-0439)
order: 0
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: partial
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: []
purpose: |
  Typing `@` at a valid left-boundary opens a kind-grouped candidate dropdown
  (file / symbol / skill / plugin / app); ↑↓ select, Tab/Enter accept (splice the
  mention token), Esc dismiss. Activates quanta's EXISTING mention-injection
  backend (parser/resolver, already loop-wired via mentionInjector) by adding the
  missing input-surface UX + a NEW AtCandidateProvider listing port (the existing
  resolver is target→body one-directional and cannot enumerate). Default-OFF
  behind QUANTA_AT_AUTOCOMPLETE=1 — absent ⇒ `@` is an ordinary char and every
  keypress path is byte-identical. Deterministic prefix→substring 2-tier ranking
  (no new fuzzy heuristic). Async resolve is race-guarded by an epoch latch; a
  thrown/synchronous sub-lister failure is isolated (NO-THROW), never wiping
  file candidates.
evidence:
  code:
    - src/apps/cli/at-autocomplete/port.ts
    - src/apps/cli/at-autocomplete/env.ts
    - src/apps/cli/at-autocomplete/provider.ts
    - src/apps/cli/at-autocomplete/file-list.ts
    - src/apps/cli/at-autocomplete/symbol-list.ts
    - src/apps/cli/at-autocomplete/fuzzy.ts
    - src/apps/cli/at-autocomplete/state-machine.ts
    - src/apps/cli/raw-line-reader.ts
    - src/apps/cli/repl/surface-compose.ts
  adrs: [439]
  tests:
    unit:
      - src/apps/cli/at-autocomplete/__tests__/provider.hellgate.test.ts
      - src/apps/cli/__tests__/raw-line-reader-at-mention.hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_AT_AUTOCOMPLETE
    default: "undefined (off)"
    purpose: "'1' ⇒ @-dropdown; absent ⇒ @ ordinary char, byte-identical"
deliberate_hold:
  reason: |
    skill/plugin/app candidate kinds are graceful-empty (those registries expose
    lookup, not list); file (live) + symbol (live when an LSP server is installed)
    are wired. @path:line line-suffix parsing is deferred (ADR-0418 parser lock).
  promotion_path: |
    Add list() to skill/plugin/app registries to light those kinds; thread the
    @path:line suffix once the parser lock lifts.
notes: "Backend (mention-injection) was already loop-wired; this slice is the input-surface activation, not a new backend."
