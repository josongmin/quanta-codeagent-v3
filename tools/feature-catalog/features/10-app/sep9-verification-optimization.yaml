notes: |
  Sibling modules own policy/selection/metrics; shared runners consume them.
  See docs/plans/sep-9-test-verification-optimization/tickets/README.md.
  KF-01 token-ship hellgate is owner-local green: the G-F5 readiness probe is
  answered so shipAccessToken is actually observed. Not a cache-off full receipt.
