  verified: "2026-09-10"
  evidence:
    cli: "verify:* campaigns, verify-scope JSON selection, gate finalize, shard admission"
    web: "dev tooling; no browser affordance"
purpose: |
  Local and CI verification share one policy/selection/receipt vocabulary so a
  narrower green cannot be reused as a wider PASS. Default cache identity stays
  whole-tree; declared-v1 is opt-in after certification. Remote required and
  authoritative full remain out of this feature's closeout.
evidence:
  code:
    - tools/dev/test-policy.ts
    - tools/dev/verification-selection.ts
    - tools/dev/verification-result.ts
    - tools/dev/verification-admission.ts
    - tools/dev/verification-input-scope.ts
    - tools/dev/verification-metrics.ts
    - tools/dev/verification-matrix.ts
    - tools/dev/verification-matrix-cli.ts
    - tools/dev/verification-required-results.ts
    - tools/dev/verification-tier.ts
    - tools/dev/verification-nightly-manifest.ts
    - tools/dev/verification-campaign.ts
    - tools/dev/verification-campaign-receipt.ts
    - tools/dev/test-shard-membership.ts
    - tools/dev/source-snapshot.ts
    - tools/dev/gate-manifest.ts
    - tools/dev/gate.ts
    # Startup-cost extractions from this campaign's own commits
    # (d934695a0, 12416ab25, 85a99bb6f — each also edits this campaign's
    # tickets). The features are unchanged; a module was split so an entrypoint
    # stops dragging its composition graph into every import. They were orphaned
    # from the catalog only because `bun run precommit` could not run: the gate
    # that reports them exited before dispatching, behind a stale ownership
    # floor, and SEP12 restored it.
    - src/apps/bench/run-main-dataset.ts
    - src/runner/batch/instance-selection.ts
    - src/apps/eval/cli-context.ts
    - src/apps/cli/session-main.ts
    - src/apps/cli/session-command-entry.ts
    - src/apps/cli/top-level-usage.ts
    # The flag table `top-level-usage` renders FROM; the usage block used to be
    # hand-written prose and advertised three flags no parser consumes.
    - src/apps/cli/top-level-flags.ts
  adrs: [3]
  tests:
    unit:
      - tests/unit/dev/verification-selection.test.ts
      - tests/unit/dev/test-policy-enrollment.test.ts
      - tests/unit/dev/verification-input-scope.test.ts
      - tests/unit/dev/verification-matrix.test.ts
      - tests/unit/dev/ci-required-results.test.ts
      - tests/unit/test-shard-membership.test.ts
      - tests/unit/dev/verification-tier-runner.test.ts
      - tests/unit/dev/verification-first-failure.test.ts
      - tests/unit/dev/verification-campaign.test.ts
      - tests/unit/dev/gate-receipt.test.ts
      - tests/unit/dev/fixture-module-closure.test.ts
      # Hellgate-grade: both drive the REAL composition path rather than a
      # pure helper. `test-ci-admission-script-hellgate` reads the shipped
      # runner and admission script and asserts the lifecycle they actually
      # wire (drain before release, one lease acquisition, bounded children);
      # `scan-reach-cli-hellgate` builds a repository, runs the real CLI over a
      # FAILING child, and proves a full harvest is not a pass. Both existed and
      # neither was listed, which is why the DoD ratchet read this feature as
      # having no e2e at all.
      - tests/unit/test-ci-admission-script-hellgate.test.ts
      - tests/unit/_arch/scan-reach-cli-hellgate.test.ts
    integration: []
    contract: []
