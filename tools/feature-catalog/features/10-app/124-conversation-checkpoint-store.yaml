id: conversation-checkpoint-store
title: Conversation checkpoint store — primitive for conversation rollback
section: 10
subsystem: Conversation rollback primitive (ADR-0124)
order: 124
maturity: L3
status: new
purpose: |
  Pure in-memory primitive that pairs conversation-turn snapshots with file
  snapshots so the missing half of file-only rewind (ADR-0118) can be
  reconstructed. Supports recording a checkpoint per turn, listing checkpoints,
  and restoring conversation state to a given turn. No I/O — host wires
  persistence and decides when to checkpoint.
