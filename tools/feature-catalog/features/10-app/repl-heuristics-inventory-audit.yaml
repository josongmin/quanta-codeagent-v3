id: repl-heuristics-inventory-audit
title: REPL CLI heuristics inventory — DOC/ENV/ARBITRARY audit
section: 10
subsystem: CLI architecture audit
order: 200
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [headless]
configurable: static
owners: ["@songmin"]
labels: [surface:cli, audit, governance]
purpose: |
  Audit of every NUMERIC LITERAL ≥ 3 digits across src/apps/cli/*.ts in
  service of the user MEMORY rule "no-heuristics-only-validated"
  (임의 휴리스틱/임계값 제안 금지). Each literal is classified as:

    - DOC-BACKED  — referenced by an ADR / SOTA absorption note / module
                    docblock that explains the choice.
    - ENV-BACKED  — exposed as a QUANTA_* env default; overridable at
                    run time; the literal is the documented fallback.
    - ARBITRARY   — neither an ADR reference nor an env knob; the
                    literal lives only as a magic number in code.

  Output goal: zero ARBITRARY literals over time. ARBITRARY hits are
  the targets for follow-up promotion (either to ENV defaults with an
  ADR, or to a `const NAMED_THRESHOLD = X` with a comment line citing
  source).

  Companion to ADR-0173 (runRepl SOLID split + wire-up) and to the
  docs/architecture/repl-surface-map.md navigation aid landed in the
  same slice.
