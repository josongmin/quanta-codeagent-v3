deliberate_hold:
  reason: |
    The "arbitrary" bucket is small (9 hits, 7 of which are flash-overlay
    durations in repl.ts that the prior cleanup commit
    (4096be83 "code-smell cleanup — STATUS_FLASH config + string drift +
    silent-catch telemetry") was already converging into a STATUS_FLASH
    config). The promotion is staged on the runRepl-split PR (ADR-0173):
    extracting the per-turn helpers also extracts the transient durations
    onto named consts. Auditing as L4 captures the inventory; promotion
    to L3 happens when the split PR lands and the arbitrary count drops
    to ≤ 1 (the ESC_WINDOW_MS const, already named).
  promotion_path: |
    1. Land ADR-0173 split. The turn-cancel-install.ts and turn-runner.ts
       modules will own ESC_WINDOW_MS, STATUS_FLASH durations, and the
       error-preview cap as named module-scoped consts.
    2. Re-run `rg "\b[0-9]{3,}\b" src/apps/cli/*.ts` after the split.
       Expected residual: 0-1 ARBITRARY (ESC_WINDOW_MS only).
    3. Update this yaml's classification_summary.arbitrary count.
    4. Promote to L3 once arbitrary == 0 OR all remaining are named
       consts with a citation comment.
notes: |
  Search command for re-audit:

      rg -n --no-heading '[^a-zA-Z0-9_/."`-]([0-9]{3,})\b' \
        src/apps/cli/*.ts | grep -v ':\\s*\\*\\|^[^:]*://' \
        | grep -v 'ADR-0\\|RFC-0\\|HIGH-\\|2026-\\|v1\\.'

  False positives intentionally filtered: ADR/RFC reference numbers,
  date stamps, version markers, comment-only mentions. Index-access
  literals (`arr[0]`, etc.) excluded by leading-char class.

  This audit complements the much larger SOLID/biome ratchet effort
  recorded in the may-22-solid-refactor-5fix MEMORY note; both share
  the "make the budget evidence-driven" discipline.

  Companion to docs/architecture/repl-surface-map.md (67-file CLI
  navigation aid) and ADR-0173 (runRepl split + wire-up contract).
