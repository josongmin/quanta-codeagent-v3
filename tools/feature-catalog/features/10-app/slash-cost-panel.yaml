notes: |
  Pure DI — `now` injectable so tests drive duration clock without `Date.now()`.
  Slice fence: imports `@/observability` + `@/ui/ui-helpers` only (no `@/agent`,
  `@/llm`, `@/stream`). SlashContext.cost is `() => string | undefined` — absent
  ⇒ `/cost` no-op exit 0. Byte-identical default: disabling the panel (env=0 or
  non-TTY) returns the same bytes the surface produced before the R10 wire-up.
