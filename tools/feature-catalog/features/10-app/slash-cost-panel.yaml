knobs:
  - name: QUANTA_COST_PANEL
    default: 'on for TTY'
    purpose: 'CLI panel visibility; 0|false|off|no disables the panel independently of accounting'
  - name: QUANTA_USAGE_ACCOUNTING_V2
    default: 'on'
    purpose: 'Session accounting authority; off is explicit on CLI/Web surfaces'
deliberate_hold: null
notes: |
  Pure DI — `now` injectable so tests drive duration clock without `Date.now()`.
  The CLI panel imports `@/observability` + `@/ui/ui-helpers` only (no `@/agent`,
  `@/llm`, `@/stream`). Panel visibility is distinct from authority activation.
  The live Web E2E replaces only the LLM with an in-memory scripted port: it
  drives real root/child loops, WS frames, HTTP readouts and SavedSession files.
  The production-composition unit test rejects/counts real user-home reads and
  external fetch attempts, with paired refusal probes.
