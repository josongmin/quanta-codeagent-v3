id: slash-cost-panel
title: /cost — cumulative session cost panel
section: 10
subsystem: REPL panels (R10)
order: 20
maturity: L4
status: new
ui_surfaces: [cli, web]
monitoring: n-a
modes: [interactive, daemon]
configurable: integrated
config_refs:
  env: [QUANTA_COST_PANEL, QUANTA_USAGE_ACCOUNTING_V2]
owners: ["@songmin"]
labels: ["surface:cli", "absorbed:claude-code"]
depends_on: [slashctx-6-ports-wire-completion, built-in-slash-commands, chatgpt-oauth-provider, idle-monitor-snooze, slash-permission-inspect]
surface_integration:
  cli: full
  web: full
  method: audited
  verified: "2026-08-31"
  evidence:
    cli: "interactive /cost projects the session authority; resume and successful live attach restore/rebind the target book, while a fresh fork starts a new book"
    web: "GET /readout/cost, snapshot.state.costView and turn.completed.costView project the same authority; live TCP WebSocket plus durable save/attach/restart evidence reaches the actual reducer and React header"
purpose: |
  Sticky cumulative session-spend dashboard surfaced via `/cost`. A3 (aug-30)
  rebuilt it as a pure PROJECTION of the session usage-accounting authority
  (`UsageAccountingPort`): the panel's only per-turn input is `noteTurn()`;
  every token/dollar it renders comes from `costSurfaceView(snapshot)`. The
  legacy counter-delta fold + `cost-panel-usage-tee` are DELETED. Honesty
  rules: unknown-only sessions read "cost incomplete · N unpriced" (never an
  exact $0), fallback estimates render "( … estimated)", a corrupt resume
  shows "prior totals lost", and `QUANTA_USAGE_ACCOUNTING_V2=off` renders an
  explicit "accounting off" box. Subagent spend appears as a "By agent:"
  split — the authority covers root+children, which the old counter feed
  never saw.

  CLI resume and live CLI/Web attach replace the current book with the target
  SavedSession book and rebind new calls to the live runtime identity; they
  never add source and target totals. Transcript replacement succeeds before
  the book and persistence target change. A target without accounting state,
  including a fresh fork, resets to an empty healthy book. Failed/mid-turn
  attach leaves the current book and persistence target intact.

  Corrupt durable state restores an empty partial book without throwing.
  `continuityLost` remains true through later calls, serialization and another
  daemon lifetime. The Web header keeps "partial history" visible before the
  first recovered call. Unknown-only/empty-partial books never display exact
  $0; mixed priced/unpriced spend is a priced subtotal. Explicit accounting-off
  replaces an earlier on snapshot; absent snapshots retain old-daemon
  compatibility. Initial/reconnect/attach snapshots replace frontend state.
  Model labels are display-only sanitized to 64 UTF-16 units without controls;
  raw model keys remain unchanged in durable records.

  Durable V2 stores authority-minted call ids as exact monotonic intervals and
  arbitrary external ids in a sparse exact set. The one-million-call rail proves
  compact exact dedup for contiguous minted calls; it does not claim bounded
  storage for arbitrary external ids or unbounded distinct dimensions.
