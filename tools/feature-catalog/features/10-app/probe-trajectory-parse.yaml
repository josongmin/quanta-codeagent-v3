notes: |
  Forward-compat is a HARD invariant — adding a new TrajectoryEvent kind
  in `@/shared` MUST not break older probes, and adding a new event field
  here MUST not break older trajectories. Both directions are covered by
  probe-parse.test.ts golden corpora.
