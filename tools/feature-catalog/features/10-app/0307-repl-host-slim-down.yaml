id: repl-host-slim-down
title: REPL host slim-down — lift 10 surface-adapter factories (CLI-06)
section: 10
subsystem: REPL surface composition
order: 78
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: integrated
config_refs:
  env: []
owners: ["@songmin"]
labels: ["surface:cli", "tier:2", "adr-0307", "refactor"]
depends_on:
  - cli-bootstrap-host-extraction
  - cli-runtime-feature-config-unification
purpose: |
  Lifts 10 inline `build*` helpers (~200 LOC) out of `src/apps/cli/repl.ts`
  into sibling factory modules under `src/apps/cli/repl/factories/`
  (branch-progress, cost-panel, debug-tracer, lifecycle, etc.). Each is
  a single-purpose composer mapping a typed `CliFeatureConfig` slice to
  either a concrete adapter or `undefined` (byte-identical default-OFF).
  `repl.ts` shrinks to entry routing + prompt UX + slash-ctx compose +
  turn-sink compose + the final `runSessionLoop` call.
evidence:
  code:
    - src/apps/cli/repl.ts
    - src/apps/cli/repl/factories/index.ts
    - src/apps/cli/repl/factories/branch-progress.ts
    - src/apps/cli/repl/factories/cost-panel.ts
    - src/apps/cli/repl/factories/debug-tracer.ts
    - src/apps/cli/repl/factories/lifecycle.ts
  adrs:
