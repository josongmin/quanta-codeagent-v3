  tests:
    unit: []
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  Follow-up of CLI-01 (ADR-0299) — that ADR moved bootstrap out of repl.ts;
  this ADR moves the adapter factories. After both, repl.ts is intended
  to be entry routing + a thin compose layer.
