id: keybindings-config
title: "User-customizable keybinding config layer"
section: 10
subsystem: 앱 — CLI 키바인딩 설정 (codex TuiKeymap 흡수, ADR-0447)
order: 5
maturity: L3
status: stable
ui_surfaces: [cli]
modes: [interactive]
monitoring: n-a
configurable: partial
owners: ["@songmin"]
labels: ["surface:core", "security-touched"]
depends_on: []
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "Loads ~/.quanta/keybindings.json and remaps keys in CLI raw-line-reader; reachable from CLI import graph."
    web: "CLI raw-line-reader keypress remap; no browser keybinding layer and no protocol verb."
purpose: |
  Loads ~/.quanta/keybindings.json (same dir as knobs.json), merges over a default
  key→action map (closed 14-action enum), and remaps keys in the raw-line-reader
  keypress handler. Reuses the knobs fail-safe (malformed/version-bad ⇒ defaults +
  warning, never crash) + the __proto__/prototype/constructor pollution guard.
  Default-OFF behind QUANTA_KEYBINDINGS=1. meta folds onto alt; the remap is an
  identity map for defaults so byte-identical when absent.
evidence:
  code:
    - src/apps/cli/keybindings/types.ts
    - src/apps/cli/keybindings/defaults.ts
    - src/apps/cli/keybindings/normalize.ts
    - src/apps/cli/keybindings/load.ts
    - src/apps/cli/raw-line-reader.ts
  adrs: [447]
  tests:
    unit:
      - src/apps/cli/__tests__/keybindings.hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_KEYBINDINGS
    default: "undefined (off)"
    purpose: "'1' ⇒ load ~/.quanta/keybindings.json; absent ⇒ default keys byte-identical"
deliberate_hold:
  reason: "remap is a layer over onKey (not a re-architecture); meta+key OS-specific (Cmd) is a non-goal (meta→alt)."
  promotion_path: "config-driven key→action only; modal/per-surface keymaps deferred."
notes: "prototype-pollution blocked via PROTO_KEYS skip + Object.entries→Map; duplicate-spec warning names the normalized collision."
