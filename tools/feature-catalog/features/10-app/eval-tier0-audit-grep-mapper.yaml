    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  Umbrella [eval-five-tier]가 entry point만 lists; 이 항목이 grep-mapper 룰
  엔진 + scope-out semantics + scopedOut/tbd/partial/ok 4-level 결정 트리 +
  rg/grep 도구 fallback contract을 명시적으로 잠금. PROBE_TIMEOUT_MS=3s로
  macOS Gatekeeper hang 방지. 룰은 ~20 entries로 small-by-design.
