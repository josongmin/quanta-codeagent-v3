id: mode-cycle-pill
title: "shift+tab permission/agent mode-cycle + input pill"
section: 10
subsystem: 앱 — CLI 모드 전환 UX (claude-cli shift+tab 흡수, ADR-0443)
order: 1
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: partial
owners: ["@songmin"]
labels: ["surface:core", "security-touched"]
depends_on: []
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-11"
  evidence:
    cli: "shift+tab cycle + /mode slash (#13) wired via mode-cycle.ts + registry-surface.ts; pill renders in input meta + status bar"
    web: "CLI-only shift+tab UX; mode_changed rides a B1-dropped event (session-host-turn-event-bridge.ts default arm (outside 7-tag AGENT_EVENT_TO_SESSION_HOST_TURN_EVENT_BRIDGED_TYPES)) and there is no web pill."
purpose: |
  shift+tab (a.k.a. backtab / CSI Z) cycles a single user-facing 4-rung posture
  (default → acceptEdits → plan → bypass), collapsing the two orthogonal axes
  (PermissionMode + AgentMode) onto one slot — NO invented mode. A bold colored
  pill renders both in the input meta row and the bottom status bar (onPosture
  sink → pills.update). Default-OFF behind QUANTA_MODE_CYCLE=1. The chosen
  posture's permissionMode seeds the next createSession (turn/session-boundary —
  mid-turn mutation is not supported; documented).
evidence:
  code:
    - src/apps/cli/mode-cycle.ts
    - src/apps/cli/raw-line-reader.ts
    - src/apps/cli/repl/surface-compose.ts
    - src/apps/cli/repl/prompt-pipeline.ts
    - src/apps/cli/repl/session-loop.ts
    - src/apps/cli/slash/registry-surface.ts
  adrs: [443]
  tests:
    unit:
      - src/apps/cli/__tests__/mode-cycle.hellgate.test.ts
      - tests/unit/cli/mode-slash-hellgate.test.ts
    integration:
      - tests/integration/cli/mode-slash-gate-e2e.test.ts
    contract: []
knobs:
  - name: QUANTA_MODE_CYCLE
    default: "undefined (off)"
    purpose: "'1' ⇒ shift+tab cycle + pill; absent ⇒ byte-identical"
deliberate_hold:
  reason: |
    plan rung's read-only fence (AgentMode) is NOT applied to createSession yet —
    RuntimeSessionConfig has no agentMode slot, so plan is a VISUAL cue; bypass/
    acceptEdits DO apply (they ride the existing permissionMode slot).
  promotion_path: "thread agentMode → RuntimeSessionConfig → AgentConfig.mode to light the plan fence."
notes: "shift+tab guard sits before the search/Tab branches so plain Tab + @-autocomplete Tab-accept never collide."
