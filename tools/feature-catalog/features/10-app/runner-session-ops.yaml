purpose: |
  `quanta session <subcommand>` 의 dispatcher 를 surface-agnostic 슬라이스로
  격리. 8 개 서브커맨드 (`list` / `show` / `delete` / `rename` / `archive` /
  `unarchive` / `fork` / `import`) 를 단일 진입점 `runSessionCommand(argv, deps)`
  으로 분기. argv 가 `session` 으로 시작하지 않으면 본 모듈은 ZERO 실행 — REPL
  / agent 경로로 fall-through (byte-identical default-OFF posture).

  Pure-ish 설계: 모든 stdout/stderr 가 주입된 `out`/`err` writer 로 라우팅,
  interactive confirm 도 `confirm: (prompt) => Promise<boolean>` 로 주입 →
  binary spawn / readline attach 없이 unit test 가능. 함수가 numeric exit
  code (`0` 성공 / `1` 에러) 를 반환 — caller (`apps/cli/index.ts`) 가
  `process.exit(...)` 로 매핑.

  Surface-agnostic seam (`SessionCommandDeps`):
    - `out` / `err`           — io writer port (surface 가 stdout/HTTP/IPC 선택)
    - `confirm`               — interactive yes/no port (test mockable)
    - `homeDir`               — external-agent install scan root (test injectable)
    - `importHandler`         — `@/migration` 진입점을 surface 가 와이어링
                                (`@/runner` 슬라이스가 `@/migration` 을 직접
                                 import 금지 — biome 규칙). 미세트 ⇒ `import`
                                서브커맨드 fail-fast (silent skip 방지)
    - `listEnv`               — `SessionListEnv` (defaultFormat / defaultMaxN);
                                surface 가 TTY 감지 결과 등을 typed 으로 주입

  `list-tui.ts` 가 rich (TUI 컬러/박스) vs plain (파이프/리다이렉트/테스트)
  렌더링 분기 + 정렬·필터 파이프라인 (`applyListPipeline` / `buildSessionListEntries`
  / `renderSessionList`) 담당.
