notes: |
  Slice boundary: `@/runner/session-ops` 는 `@/session` + `@/runtime` +
  `@/llm` 만 의존. `@/migration` 의존성은 의도적으로 surface 가 주입
  (`importHandler`) — 슬라이스 격리 + 미주입 시 명시적 fail-fast 가 둘 다
  만족 (silent migration skip 방지). list-tui 의 default 값 (rich+10) 은
  `listEnv` 미세트 시 surface-호환 legacy 거동 보존.
