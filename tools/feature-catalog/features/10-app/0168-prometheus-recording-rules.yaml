deliberate_hold: null
notes: |
  L2: documentation/config artifact (a single PromQL recording-rules.yaml)
  — no TS source and no unit/integration test harness; the rules are
  validated by Prometheus at load time, not by our test suite. Demoted
  from L3 (overclaim — L3 requires tests>=1, which a config doc cannot
  carry). SLO catalog lives in one place per rule so metric renames need
  updating only at the recording level, not every alert/panel.
