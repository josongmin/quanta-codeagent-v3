purpose: |
  `docs/observability/recording-rules.yaml` with two groups:
  `quanta.slo.error_rate` (6 SLIs × 4 windows = 24 rules producing
  `slo:<sli>:error_rate_<window>`; tool-call preserves `by(tool)`
  dimension, others scalar-aggregate) and `quanta.slo.burn_rate` (6 SLIs
  × 2 windows = 12 rules — `error_rate / (1 - SLO)` with per-SLI hardcoded
  divisor: LLM/LSP/Tool 0.01, Sandbox 0.005, Subagent 0.001, Shadow
  0.0001). Closes the ADR-0166 follow-up — eliminates the 24+ places
  inline PromQL was duplicated across alerts and dashboard panels.
