knobs:
  - name: QUANTA_INIT_SLASH
    where: src/apps/cli/slash/registry-surface.ts
    default: false
    purpose: Gate (default-OFF) that registers the /init slash; absent ⇒ command not in the registry (byte-identical).
deliberate_hold: null
notes: |
  Command detection is conservative: package.json scripts → `<pm> run <key>`
  (pm from lockfile, fallback npm) for any of build/test/typecheck/lint that
  EXIST; else Makefile targets; else Justfile recipes; else all undefined — a
  rules file with a wrong command is worse than none. The `--force` refusal is a
  SOTA++ helpful seam: existing file size + section count + exact re-run commands
  + the skill pointer (which preserves human prose). The `RepoMapShell` is
  injected so the scan is unit-testable with canned `rg` stdout; the fs writer is
  injected so the write-failure NO-THROW path is exercisable without a real EACCES.
