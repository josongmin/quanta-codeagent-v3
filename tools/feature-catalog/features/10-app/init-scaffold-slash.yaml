    web: "one-shot CLI slash; no browser affordance"
purpose: |
  A surface-only, GATED (`QUANTA_INIT_SLASH`, default-OFF) one-shot `/init` that
  bootstraps the project-rules file the agent loads at the top of every session
  (`repo-rules` reads `AGENTS.md` / `CLAUDE.md` / `.codex/CODEX-RULES.md`). The
  RICH path is the `/init` SKILL (`src/skill/system-skills/init/SKILL.md`); a
  registered `/init` slash SHADOWS it via dispatch precedence, so this slash is a
  fast, deterministic, MECHANICAL scaffold that also points at the skill for the
  full LLM-authored treatment. Slash-surface constraints: `SlashContext` has NO
  interactive confirm, so the destructive-overwrite seam is filled by `--force`
  (refuse + exit 1 when the target exists and `--force` is absent) PLUS
  `--dry-run` (print the scaffold, write NOTHING, exit 0) as the real
  "preview-before-commit" answer to the missing Y/N. AGENTS.md is PREFERRED as
  the write target when it already exists (multi-vendor SSOT, matching
  `loadRepoRules` same-dir priority); else conventional `CLAUDE.md`. Auto-
  generated sections are bracketed by `quanta:auto` sentinel markers so a FUTURE
  surgical `--force` can regenerate ONLY the marked blocks and leave human prose
  intact. PURITY: `scaffoldClaudeMd(cwd, opts)` is a PURE deterministic golden
  (no clock, no fs); fs/shell effects live only in `detectCommands` (reads
  package.json/Makefile/Justfile — never invents a missing command), `scanRepoMap`
  (one injected-shell `rg --files`, capped depth 3 / 200 files / 4000 chars), and
  the write body. NO-THROW on the public surface: every fs/shell failure degrades
  to a typed exit code + a friendly line, never an exception out of `run`.
evidence:
  code:
    - src/apps/cli/init-scaffold.ts
  adrs: []
  tests:
