notes: |
  ToolContext.turnId is the per-turn dedup key — added as a soft-typed field so
  callers without turn ids still get behavior (no checkpoint dedup, single
  checkpoint per call). Policy mirrors external reference patterns: opt-in,
  pre-destructive, one-per-turn ceiling.
