notes: |
  Cli surface layer over `@/session` store ops (forkSession / rewindToMessage /
  archiveSession / loadSessionById 등). 데이터 계약은 session/types.ts SSOT,
  본 모듈은 dispatcher + 에러 표시. `--state` / `--resume` 옵션 (10-app/01-quantastatepath)
  과 직교 — quantastatepath는 *현재 세션 선택*, session 서브커맨드는 *세션 풀 관리*.
