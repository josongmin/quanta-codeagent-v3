id: quanta-session-subcommands
title: `quanta session` subcommand suite — 10 lifecycle operations
section: 10
subsystem: Session lifecycle CLI
order: 10
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: static
owners: ["@songmin"]
labels: ["surface:cli", "absorbed:codex", "absorbed:claude-code"]
depends_on: [quantastatepath]
config_refs:
  env: ["QUANTA_SESSIONS_DIR", "QUANTA_SESSION_LIST_FORMAT", "QUANTA_SESSION_LIST_MAX"]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 7/7 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "CLI subcommand suite; protocol.ts SessionCommand has no resume/fork/rewind/archive verb (B3) so no browser path exists"
purpose: |
  `quanta session …` subcommand dispatcher — 세션 라이프사이클의 모든 mutating /
  read-only 연산을 한 surface에 모음. 10 subcommand: ls / show / rename / archive /
  unarchive / fork / rewind / delete / path / import. Fork는 `createPersistentWorktree`
  로 git worktree 분리 (caller-managed lifecycle). Rewind는 message-id 기준 transcript
  truncation (ADR 52 message-id rewind와 연동). Archive/unarchive는 active ↔ archived
  파일 이동(atomic rename). Import는 외부 에이전트(Claude Code / Codex) 트랜스크립트
  4-stage 흡수 (09-external-agent-import feature와 동일 엔진). Path는 세션 id → 디스크
  경로 노출 (디버깅/외부 도구 연동). 모든 mutating op은 SessionIdError로 not-found /
  collision / archived-target을 typed로 거부.
evidence:
  code:
    - src/runner/session-ops/index.ts
    - src/apps/cli/session-import-handler.ts
    - src/apps/cli/session-list-env.ts
    - src/session/store.ts
    - src/session/paths.ts
    - src/apps/cli/help-render.ts
    - src/shared/runtime-config.ts
  adrs: []
  tests:
    unit:
      - tests/unit/cli-session-commands.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  Cli surface layer over `@/session` store ops (forkSession / rewindToMessage /
  archiveSession / loadSessionById 등). 데이터 계약은 session/types.ts SSOT,
  본 모듈은 dispatcher + 에러 표시. `--state` / `--resume` 옵션 (10-app/01-quantastatepath)
  과 직교 — quantastatepath는 *현재 세션 선택*, session 서브커맨드는 *세션 풀 관리*.
