purpose: |
  EVAL-ONLY DIAGNOSTIC, NOT a production solving capability. It needs the
  dataset gold patch as ground truth, so live tasks have no gold and this is
  unavailable off-bench.

  It calibrates the noisy patched-resolved oracle by running the same probe on
  the gold-patched tree. If the probe says "not resolved" on the known-correct
  fix, the oracle is a confirmed false-negative for that instance and the
  resolved gate fails open, meaning it never rejects a candidate on that
  signal.

  Two jobs:
  1. Measure the oracle's per-instance false-negative rate, which is the jun-20
     root-cause readout for the "right place, fix unrecognized by oracle" miss
     family.
  2. De-noise bench candidate selection so a broken oracle cannot discard a
     correct candidate before official grading.

  Asymmetric limitation: fail-open removes a false-red, but it does not add a
  true-green. Selection then degrades to weak minimality plus ownerCoverage, so
  the correct candidate may still lose to a wrong sibling. It does not cheat
  grading: the final verdict is still the independent official harness; fail-open
  only changes which candidate is submitted.
