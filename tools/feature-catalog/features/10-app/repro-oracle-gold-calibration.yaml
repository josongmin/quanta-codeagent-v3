purpose: >-
  ⚠️ EVAL-ONLY DIAGNOSTIC, NOT a production solving capability (needs the dataset
  GOLD patch as ground truth; live tasks have no gold ⇒ UNAVAILABLE/inert off-bench).
  Calibrates the noisy patched-resolved oracle by running the SAME probe on the
  gold-patched tree: if the probe says "not resolved" on the known-correct fix, the
  oracle is a CONFIRMED false-negative for that instance and the resolved gate FAILS
  OPEN (never rejects a candidate on it). Two jobs: (1) MEASURE the oracle's
  per-instance false-negative rate (the jun-20 root-cause readout — 75–79% of misses
  are "right place, fix unrecognized by oracle"); (2) de-noise the bench score so a
  broken oracle can't discard a correct candidate before official grading.
  ⚠️ ASYMMETRIC LIMITATION: fail-open removes a false-RED, it does NOT add a
  true-GREEN — selection then degrades to weak minimality+ownerCoverage, so the
  correct candidate may still lose to a wrong sibling. Does NOT cheat grading: the
  final verdict is the independent official harness; fail-open only changes WHICH
  candidate is submitted, never makes a wrong patch pass.
