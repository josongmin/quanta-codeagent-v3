    - crates/darwin-vz-helper/src/lib.rs
    - crates/darwin-vz-helper/src/vm_config.rs
    - crates/darwin-vz-helper/src/boot_loader.rs
    - src/mcp/skybridge/applevz-native.ts
    - src/mcp/skybridge/registry.ts
  adrs:
    - docs/decisions/0190-darwin-vz-native-scaffold.md
    - docs/decisions/0194-darwin-vz-native-scaffold.md
  tests:
    unit:
      - tests/unit/mcp-skybridge-applevz-native-hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold:
  reason: |
    Phase 3.4 (real VM bring-up + vsock IPC + AVF entitlements + DMG
    image management) is intentionally deferred — current slice is
    typed-surface scaffold + fake-binding hellgate only.
  promotion_path: |
    Phase 3.4 ADR landing real VZVirtualMachine bring-up + production
    image flow + signing/notarization story.
notes: |
  Resolver v2 + `cfg(target_os = "macos")` target deps. Future
  `darwin-seatbelt-helper`, `win-appcontainer-helper` siblings expected.
