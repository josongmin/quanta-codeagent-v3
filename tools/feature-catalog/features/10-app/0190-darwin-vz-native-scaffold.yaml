purpose: |
  napi-rs Cargo workspace member (`crates/darwin-vz-helper/`) — typed
  surface + 20-case fake-binding hellgate + TS adapter
  (`src/mcp/skybridge/applevz-native.ts`) wired into
  `src/mcp/skybridge/registry.ts`. Mirrors ADR-0175 (linux-sandbox-native)
  scaffold side-by-side. Phase 3.4 (real `VZVirtualMachine` bring-up +
  DMG image management + vsock IPC + AVF entitlements) deferred to a
  follow-up. `objc2-virtualization` v0.2.x community Rust binding under
  `cfg(macos)`. Industry parallel: Claude Desktop's proprietary
  yukonSilver Skybridge uses AVF; Codex `codex-rs` has no native AVF
  binding (Lima wrapper only) — quanta leads on native Darwin VZ.
evidence:
  code:
    - crates/Cargo.toml
    - crates/darwin-vz-helper/Cargo.toml
    - crates/darwin-vz-helper/src/lib.rs
    - crates/darwin-vz-helper/src/vm_config.rs
    - crates/darwin-vz-helper/src/boot_loader.rs
    - src/mcp/skybridge/applevz-native.ts
    - src/mcp/skybridge/registry.ts
  adrs:
    - docs/decisions/0190-darwin-vz-native-scaffold.md
    - docs/decisions/0194-darwin-vz-native-scaffold.md
  tests:
    unit:
      - tests/unit/mcp-skybridge-applevz-native-hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold:
  reason: |
    Phase 3.4 (real VZVirtualMachine bring-up + vsock IPC + AVF entitlements + DMG
    image management) is intentionally deferred — the current slice is a typed
    surface + fake-binding hellgate only, as the title ("scaffold") says.

    Verified 2026-08-22: the deferral reaches further than the Rust crate. The WHOLE
    `src/mcp/skybridge/**` slice — including `registry.ts`, which the purpose text
    cites as the wiring site — is unreachable from every `src/apps/<surface>/index.ts`;
    the only importers of `@/mcp/skybridge` are test files. So "wired into
    registry.ts" is true slice-internally and false end-to-end: the registry itself
    has no production host.
  promotion_path: |
    L3 = TWO things, not one: (a) Phase 3.4 lands the real VZ bring-up, and (b) a
    production host mounts the skybridge sandbox registry (`resolveMcpSandbox`) from
    an app composition root so `src/mcp/skybridge/*` becomes reachable from an app
    entrypoint. (b) alone lifts the reachability verdict; both are needed for the
    feature to be real.
    `bun fc reachability --strict --symbols` is the objective judge: this id must
    drop off the offender list on its own, with NO baseline edit.
notes: |
  Resolver v2 + `cfg(target_os = "macos")` target deps. Future
  `darwin-seatbelt-helper`, `win-appcontainer-helper` siblings expected.

  Maturity was L3 until 2026-08-22. A "scaffold + fake binding" slice whose host
  registry is itself unhosted cannot claim L3 ("wired, with tests"); corrected to
  L2. Nothing in the crate or the TS adapter changed.
