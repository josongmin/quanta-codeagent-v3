deliberate_hold: null
notes: |
  `paths.ts` 의 4 async overloads + `store.ts` 의 provider param 으로 호출 경로 확장.
  Default behaviour byte-identical — per-tenant injection 은 opt-in. layering: `root-port.ts`
  는 `@/shared` + Node built-ins 만 import → `@/session` 슬라이스 biome override (allows
  `@/llm`, `@/storage`, `@/shared`) 준수. Web 멀티테넌트 ready — Phase 2 wiring 시
  authenticated request → tenant-scoped `staticSessionRootProvider(...)` 주입.
