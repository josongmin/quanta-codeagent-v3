notes: |
  Distinct from side-agent-process (which owns the subagent EXECUTION); this is
  the surface-only VIEW. `formatAge` clamps negative / NaN spans to "0s" (never
  throws, never emits a negative age). `shortId` drops the `task_` prefix and
  caps at 12 chars so the table stays narrow while log lines remain greppable.
  Reachable but render is conditional on `ctx.agents` being threaded — when the
  surface omits it, `/agents` prints "not wired in this surface" rather than
  crashing.
