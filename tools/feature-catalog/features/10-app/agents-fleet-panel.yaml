    web: "pure terminal table/tree renderer (renderBox + ANSI via @/ui); no browser affordance — the fleet view is a CLI-only panel"
purpose: |
  PURE renderer for the `/agents` slash — a live snapshot of the in-process
  subagent `TaskRegistry` (threaded as `ctx.agents`, from
  `setup.lifecycleTaskRegistry`) rendered as `table` | `json` | `tree`. PURE: no
  clock, no I/O, no TTY detection — the caller injects `now` (so the AGE column
  is deterministic and golden-testable) and colour is decided entirely by the
  `@/ui/ui-helpers` layer (byte-identity no-ops when the resolved policy is
  "off"). The row type `AgentFleetRow` is a LOCAL structural mirror of
  `@/subagent`'s `TaskRecord` + the surfaced slice of `SubagentResult`, kept
  local on purpose so the renderer stays behind the slice fence that forbids
  `@/agent`/`@/llm`/`@/runner`/`@/host` value imports (the wire stays type-only).
  Ordering is a pure comparator over a copied array (running rows first, settled
  by `endedAt` desc — never mutates the caller's input). Without `--all`, settled
  rows collapse to `DEFAULT_SETTLED_SHOWN` (8) with a "… N more settled" note;
  running rows are NEVER collapsed. HONEST: `--all` only changes presentation —
  it cannot resurrect LRU-evicted records (already gone from the registry Map
  before they reach this renderer). `json` is always machine-clean (no ANSI
  regardless of colour policy — it carries no `@/ui` wrappers). Empty fleet ⇒ a
  bordered "(no agents)" panel that points at the Agent tool.
