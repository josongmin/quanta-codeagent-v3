    web: "ALL follower verbs LIVE over the real web transport. A 2nd-client sends a `followerVerb` WS frame → server.ts peekFollowerVerb → routed: FIRE verbs (steer-turn/interrupt-turn/set-queue-mode) → FollowerCoControlDispatcher.dispatch → the conversation-action surface wired into the daemon session's AgentConfig (runtime-factory, gate QUANTA_THIN_CLIENT_DISPATCH; surface hoisted to @/agent for the slice fence). command-approval-decision → the LIVE approval-relay TIMEOUT coordinator (createFollowerApprovalCoordinator, wired in startWebDaemon): open on approval.requested, relay→session.approval.respond→resolveApproval's LIVE HARD_DENY re-check, a sweep timer fires a fail-safe DENY on deadline (opt-in QUANTA_FOLLOWER_APPROVAL_TIMEOUT_MS; 0=pass-through), a late relay is dropped (no stale-decision), close on approval.resolved + per-tick prune keep the tracker bounded. set-queue-mode is dispatched but inert on web (the daemon loop has no mid-turn raw-line routing reading the inbound ref; CLI consumes it). steer no-active-turn drops cleanly (no crash). Proven end-to-end against REAL collaborators (resolver + session)."
purpose: |
  A FOLLOWER (auxiliary client — a second window / web / ide) co-controls ONE live
  thread via timeout-bounded verbs. planFollowerVerb maps each verb onto an EXISTING
  lease-safe effect: steer-turn → §steer weave INJECT into the lease holder's running
  turn (never a second writer); interrupt-turn → the lease-bypassing cancel;
  command-approval-decision → approval.respond, RE-CHECKED against HARD_DENY at the
  relay boundary (fail-closed — a relayed approve can never launder a dangerous
  command); set-queue-mode → the inbound-mode SSOT (queue/weave/interrupt). Every
  verb is request/response/TIMEOUT: FollowerVerbTracker applies a response only in
  time — a late one is STALE and never applied (the defined fallback owns the
  decision). Default-OFF behind the existing QUANTA_THIN_CLIENT_DISPATCH gate (no new
  knob). UC5: invertInboundModeOnce is the per-message invert (Codex Cmd-Ctrl+Shift+Enter).
