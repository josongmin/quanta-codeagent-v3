purpose: |
  A FOLLOWER (auxiliary client — a second window / web / ide) co-controls ONE live
  thread via timeout-bounded verbs. planFollowerVerb maps each verb onto an EXISTING
  lease-safe effect: steer-turn → §steer weave INJECT into the lease holder's running
  turn (never a second writer); interrupt-turn → the lease-bypassing cancel;
  command-approval-decision → approval.respond, RE-CHECKED against HARD_DENY at the
  relay boundary (fail-closed — a relayed approve can never launder a dangerous
  command); set-queue-mode → the inbound-mode SSOT (queue/weave/interrupt). Every
  verb is request/response/TIMEOUT: FollowerVerbTracker applies a response only in
  time — a late one is STALE and never applied (the defined fallback owns the
  decision). Default-OFF behind the existing QUANTA_THIN_CLIENT_DISPATCH gate (no new
  knob). UC5: invertInboundModeOnce is the per-message invert (Codex Cmd-Ctrl+Shift+Enter).
