notes: 'feature id `eval-five-tier`는 기존 depends_on stability 때문에 유지하지만 surface truth는 이제 6-tier다. Tier 0-5 모두 운영(L4). grounding tier가 prompt assembly + fail-closed scorer + live gate workflow에 더해 route preflight, typed errorKind, bounded concurrency를 추가했고, 4개 compare adapter는 기존 buildArgv pinning + timeout 회복 contract를 유지한다. storage 스키마 additive 필드(metrics/tokens/costUsd)는 별도 [eval-schema-additive].'
