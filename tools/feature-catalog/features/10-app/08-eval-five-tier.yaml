id: eval-five-tier
title: eval 앱 — 5-tier 검증 스택 (audit/synthetic/public/trajectory/compare)
section: 10
subsystem: eval 앱 (RFC-0003) — 로컬 품질 검증 스택
order: 8
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [headless, batch]
configurable: static
owners: ["@songmin"]
labels: ["surface:bench", "absorbed:claude-code", "absorbed:cursor"]
depends_on: [eval-schema-additive, 2026-05-21]
config_refs:
  env: ["QUANTA_CLASSIFIER_MODEL", "QUANTA_JUDGE_MODEL", "QUANTA_MODEL"]
purpose: |
  `bun run eval` — taxonomy(12 major/~120 leaf) 기반 5-tier 로컬 검증 스택.
  Tier 0 audit(정적 grep 커버리지 매트릭스) / Tier 1 synthetic(LLM-judge 시나리오 run) /
  Tier 2 public(SWE-bench Verified bench-report 래핑) / Tier 3 trajectory(실세션 분류·
  replay·freeze) / Tier 4 compare(A/B pairwise judge). append-only JSONL 저장
  (EvalRecord 엔벨로프 + tier별 payload), report가 tier-agnostic 집계·markdown 렌더.
  Tier 4 compare adapters (quanta/claude-code/cursor/aider) 4종 모두 운영 — cursor는
  `-p <prompt> --output-format text --force`, aider는 `--message <prompt> --yes-always
  --no-auto-commits --no-git --no-stream --no-pretty --no-show-model-warnings`. CLI
  미설치 시 `available()` 가 `{ok:false}` 반환 → `runCompare` 가 graceful skip 으로
  bookkeeping 만 기록. SIGTERM→SIGKILL grace + stderr tail truncation 으로 timeout/
  hang 안전. Pairwise judge 의 parse 실패는 `parseFailed:true` + `winnerIndex:-1`
  로 partial/tie 카운트 오염 방지.
evidence:
