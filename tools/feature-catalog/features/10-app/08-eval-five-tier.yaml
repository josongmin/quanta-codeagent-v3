notes: 'Tier 0-3 + Tier 4 compare 모두 운영(L4). 4개 adapter 모두 buildArgv pinning + timeout 회복 contract test 로 잠금. storage 스키마 additive 필드(metrics/tokens/costUsd)는 별도 [eval-schema-additive]. RFC-0003 Phase B(2026-05-21) 랜딩, L4 promotion 2026-05-23.'
