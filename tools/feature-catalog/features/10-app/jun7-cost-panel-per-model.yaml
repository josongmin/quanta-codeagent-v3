  code:
    - src/apps/cli/cost-panel.ts
  adrs: []
  tests:
    unit:
      - tests/unit/cli/cost-panel.test.ts
      - tests/unit/cli/cost-panel-hardening-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_COST_PANEL
    where: src/apps/cli/cost-panel.ts
    default: "1"
    purpose: TTY-default-ON cost panel gate (0/false/off/no disables)
deliberate_hold: null
notes: 'jun-7 Wave R (R5), updated A3 aug-30. Gap doc §23.5. Per-model rows are read-only projections of usage-accounting aggregates, not additive panel closure state. The detailed breakdown is shown only when more than one model is present; single-model sessions omit the block.'
