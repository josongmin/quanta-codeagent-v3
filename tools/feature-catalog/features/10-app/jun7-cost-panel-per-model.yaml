id: jun7-cost-panel-per-model
title: Cost panel per-model breakdown (§23.5)
section: 10
subsystem: CLI 슬래시 — 비용/사용량
order: 321
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: static
owners: ["@songmin"]
labels: ["surface:cli", "absorbed:claude"]
depends_on: [slash-cost-panel]
config_refs:
  env: ["QUANTA_COST_PANEL"]
purpose: |
  Extends the cumulative cost panel with per-model attribution. Each turn's
  tokens + cost are bucketed by the model active at that turn (a closure-held
  `Map`, NOT on `CostPanelState`, so `snapshot()` stays byte-identical). A new
  `byModel()` accessor returns the deterministically-sorted breakdown, and the
  `/cost` detailed box appends a "By model:" section ONLY for heterogeneous
  (>1 model) sessions — a single-model session renders byte-identical to the
  pre-feature box. Fixes the prior last-writer-wins collapse where a
  heterogeneous-model session reported every turn under the most-recent model.
  The cost math is numerically equivalent to the pre-feature aggregate
  (verified in the 3x adversarial pass: the old provided-cost early-return is
  preserved as the ternary's first branch).
evidence:
  code:
    - src/apps/cli/cost-panel.ts
  adrs: []
  tests:
    unit:
      - tests/unit/cli/cost-panel.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_COST_PANEL
    where: src/apps/cli/cost-panel.ts
    default: "1"
    purpose: TTY-default-ON cost panel gate (0/false/off/no disables)
deliberate_hold: null
notes: 'jun-7 Wave R (R5). Gap doc §23.5. Per-model buckets are additive closure state; aggregate totalCostUsd + snapshot() unchanged; breakdown gated on perModel.size > 1 for the single-model byte-identical invariant.'
