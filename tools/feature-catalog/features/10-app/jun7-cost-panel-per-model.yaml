purpose: |
  Per-model attribution on the cumulative cost panel. A3 (aug-30): the
  closure-held Map accumulation is GONE — `byModel()` and the "By model:"
  rows project the usage authority's per-model aggregates (each CALL priced
  at the model it actually ran on, cache-write included), rendered through
  the same sanitize boundary as every provider string. Rows sort
  spend-descending with a byte-stable name tiebreak; single-model sessions
  render no block (byte-identical).
