purpose: |
  Validates the host-layer SSOT by adding a SECOND surface
  (`src/apps/headless/`) that drives the SAME `bootstrapSession` +
  `@/runner#runOnce` cores end-to-end with zero CLI imports. The
  headless surface is the proof-of-portability: until a second consumer
  exists, the slice-isolation fence is theoretical. With it, every CLI-01
  invariant (host-layer slice fence, no CLI-back-imports) becomes
  literal — a regression that quietly couples to CLI would fail the
  headless adversarial hellgate.
