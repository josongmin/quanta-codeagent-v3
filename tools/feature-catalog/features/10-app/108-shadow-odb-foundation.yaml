id: shadow-odb-foundation
title: Shadow git ODB — non-invasive snapshot infrastructure
section: 10
subsystem: Storage / persistence (ADR-0108)
order: 108
maturity: L4
status: stable
purpose: |
  Closed-port ShadowOdb plus default implementation that snapshots workspace
  state into a separate git object database without touching the user's .git/
  index, reflog, or worktree. Provides snapshot / registerHead primitives for
  branch-search anchoring (ADR-0116), rewind safety nets (ADR-0118), and
  per-turn auto-checkpoint policy (ADR-0121). Content-addressed hashing module
  + cleanup helper keep disk usage bounded.
