notes: |
  Read by the patch sanitizer when building the pathspec arg list for
  `git diff --cached -- :(exclude,top)<path> ...` invocations; read by
  the failure-classifier to derive its post-hoc `dirty_cache_leak`
  signal regex. Two consumers, one SSOT.
