purpose: |
  Default-OFF `maybeRecordTrajectory` wraps the bench LLM port when
  `QUANTA_BENCH_RECORD_TRAJECTORY` is set, writing a replayable JSONL cassette
  for fork-from-point debugging of failed remote runs. The `=debug` tier adds a
  sidecar DEBUG sink (`trajectory-debug-sink.ts`): subsystems across the run (tool
  executor, edit tool, phase-gate, grader) contribute keyed debug slices that ride
  alongside each recorded turn as `RecordedInteraction.metadata.debug`.
