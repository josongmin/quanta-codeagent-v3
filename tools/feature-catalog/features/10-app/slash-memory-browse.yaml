id: slash-memory-browse
title: /memory — browse / recall / search / delete durable memory
section: 10
subsystem: REPL panels (R10)
order: 25
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: integrated
config_refs:
  env: [QUANTA_MEMORY_LIST_MAX, QUANTA_MEMORY_SLASH]
owners: ["@songmin"]
labels: ["surface:cli", "absorbed:claude-code"]
depends_on: [slashctx-6-ports-wire-completion, built-in-slash-commands, chatgpt-oauth-provider, slash-permission-inspect, slash-working-state-panel]
purpose: |
  Browse / recall / delete the durable memory store from the REPL. Subcommand-
  style surface: `/memory` (recent 10 by recency), `/memory list [--tier=…]`
  (capped at `QUANTA_MEMORY_LIST_MAX` default 20; `--tier=episodic|semantic`
  filters), `/memory search <query>` (semantic + lexical recall via
  `PersistentStorePort.recall` — when an `EmbedderPort` is wired the query is
  embedded and cosine similarity drives the ranking, paraphrase-robust; absent
  embedder ⇒ lexical/tag/freshness only), `/memory show <id>` (full entry incl.
  tags, score proxy = importance, size in bytes), `/memory delete <id> [--yes]`
  (hard-delete; without `--yes` prints confirmation line — REPL surfaces can
  pre-confirm), `/memory stats` (counts per tier + total bytes). Claude Code
  `~/.claude/memory.json` browse pattern inspired but typed + slash-routable.
evidence:
  code:
    - src/apps/cli/memory-cmd.ts
    - src/apps/cli/slash-commands.ts
  adrs: []
  tests:
    unit:
      - tests/unit/memory-cmd.test.ts
      - tests/unit/slash-commands.test.ts
    integration: []
    contract: []
knobs:
  - QUANTA_MEMORY_SLASH
  - QUANTA_MEMORY_LIST_MAX
deliberate_hold: null
notes: |
  Default-ON registration: `QUANTA_MEMORY_SLASH` defaults to `"1"` (command
  registered). Setting `"0"` removes `/memory` from BUILTINS at load time —
  same effect as never registering it (no silent runtime fallthrough). Without
  an injected `MemorySlashState` on `SlashContext.memory`, the command prints
  "memory store not wired in this surface" and exits 0 (byte-identical to NOT
  registering). Slice: `src/apps/cli/**` — biome explicitly carves out
  `@/memory` for CLI surface commands. Body NEVER imports `@/llm` —
  embeddings are produced by an injected `EmbedderPort` so the slice fence
  holds. Audit invariant: raw similarity scores HIDDEN from prompt injection
  (this command renders them to humans only).
