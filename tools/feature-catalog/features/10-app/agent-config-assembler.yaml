knobs: []
deliberate_hold: null
notes: |
  Mode-preset-extra payloads (`HeadlessExtras`, `BatchExtras`, …) are
  each OPTIONAL on `AssembleRequest` so legacy callers (the assemble
  unit test, anything wanting ONLY `modePolicy + budgetMeter` wiring)
  continue to work byte-identically. Mode-preset runners validate the
  relevant field is present on entry and throw with a clear message.
  Anti-regression: see `tests/unit/apps/agent/anti-regression-invariants
  .test.ts` for the 6 exhaustive-seam invariants any new lever must
  satisfy (union + ALL_AGENT_MODES + MODE_PRESETS Record + renderPackByMode
  switch + VALID_MODES + per-mode preset runners).
