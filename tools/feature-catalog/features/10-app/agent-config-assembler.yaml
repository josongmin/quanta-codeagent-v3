purpose: |
  SINGLE wiring point for `ModePolicy + BudgetMeter + BudgetCaps`.
  RFC may-22-unified-agent-runtime / Phase 4. Apps that want a unified
  surface (`apps/agent/index.ts`) call `assembleAgentConfig`; legacy
  entry points (`apps/cli/index.ts`, `apps/bench/index.ts`) can adopt
  incrementally — the assembler is opt-in, not mandatory.
  Lever propagation: the 12-lever discriminated union from `ModePolicy`
  translates HERE to concrete `AgentConfig` fields. New levers added to
  `ModePolicy` MUST be wired here AND in `apps/agent/mode-presets/<mode>
  .ts` — the per-mode preset owns lever→implementation mapping; this
  file owns the unified type-narrow + BudgetMeter construction +
  exhaustion policy plumbing.
  Default-OFF / byte-identical: callers may pass `modePolicy: undefined`
  to skip the whole RFC may-22 layer — the returned config is
  byte-identical to a pre-RFC manually-assembled `AgentConfig` (no
  budgetMeter, no modePolicy). This is the no-regression escape hatch.
evidence:
  code:
    - src/apps/agent/assemble.ts
    - src/apps/agent/run.ts
  adrs: []
  tests:
