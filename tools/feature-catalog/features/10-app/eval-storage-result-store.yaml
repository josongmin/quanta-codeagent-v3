notes: |
  Schema shape는 별도 [eval-schema-additive] + [eval-five-tier]가 cover —
  이 항목은 I/O atomicity contract + makeRunId collision-safety + drop-vs-yield
  policy를 잠금. dataset이 수백 MB 넘어가면 readFile → `Bun.file().stream()`
  교체 seam 존재. `run_summary` line이 EOF marker — readers는 의도적으로 skip.
