purpose: |
  Ticket-18 (V1): move a running interactive turn to the background with
  Ctrl+B, then observe/cancel it via `/background [list|reattach <id>|
  cancel <id>]`. Gated `QUANTA_BG_TURN` (default-OFF, byte-identical when
  off). The HIGHEST-RISK surgery of the batch — it touches three fragile
  invariants at once:
    - turn atomicity: `detach()` takes the SAME live body promise; the body
      keeps streaming after detach (the portal NEVER re-enters `@/agent`
      — it is a pure passive observer).
    - signal cleanup: the turn's own AbortController is handed over; a
      NO-THROW `.then/.catch` swallows the outcome into a terminal state
      (done/failed/cancelled) so a backgrounded rejection never escapes as
      an unhandled rejection; AbortError maps to `cancelled`, distinct from
      a genuine `failed`. `cancel()` is NO-THROW on unknown id + idempotent
      on an already-aborted controller.
    - weave conflict: the Ctrl+B sink is wired ONLY when a portal exists AND
      inbound mode ≠ weave AND no interrupted turn is active (backgrounding
      mid-weave would orphan the live blend) — otherwise the keypress is a
      silent no-op.
  Output is captured in a bounded HEAD+TAIL window (50 MiB cap, UTF-8-byte
  accurate so a split multibyte char decodes to U+FFFD, not a lone
  surrogate) with a `… +N KB elided …` middle marker — head is never
  dropped. `/background` is observe-only in V1: `reattach` is print-only
  (buffer + result/error); the SDK session remains the SSOT for the merged
  transcript. Absent slot ⇒ `/background` prints "not wired" + exit 0.
