notes: |
  Wiring chain audited: background-cmd.ts → slash/registry-surface.ts
  (BUILTINS append, no `/rewind-tool`/`/fork`/`/queue` collision) →
  slash-commands.ts (CLI import graph). background-turn-portal.ts →
  surface-compose.ts (gate build + ctx.background thread) +
  session-loop.ts (Ctrl+B detach via shouldWireBackground WEAVE guard +
  backgroundTurnLabel). The portal imports nothing from `@/agent` (passive
  observer) and only `node:crypto` (randomBytes task-id mint, no weak RNG).
  V1 explicitly defers: persistence across restart (V2) and live re-entry
  reattach that re-awaits the body (V3); `reattach` is print-only and the
  SDK session owns the merged transcript. The Ctrl+B turn-runner wire +
  `shouldWireBackground` predicate live in session-loop.ts (a sibling
  lane's file) — this entry owns the portal store + the `/background`
  render only.
