id: quanta-home-meta-root
title: QUANTA_HOME — cross-cutting app-home root override
section: 10
subsystem: 앱 홈 디렉터리 (cross-cutting path SSOT)
order: 9
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env: [QUANTA_HOME, QUANTA_PREFS_HOME, QUANTA_BENCH_HOME]
owners: ["@songmin"]
labels: ["surface:cli"]
depends_on: [post-denial-precedence, per-host-agent-mode, runtime-config-ssot, per-thread-permissions]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 3/4 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure cross-cutting path env override, no UI affordance on any surface"
purpose: |
  Single env override that relocates every Quanta-owned persistent path —
  permission-state, bench corpus/artifacts, prefs fallback parent, the memory
  plane (store + consolidator layout), and other feature-site path
  derivations. NOT owned by any one subsystem: permission-store,
  bench/corpus/paths, memory/consolidate/paths, and runtime-config SSOT all
  consume it.

  The word "every" was FALSE until sep-13. `memory/consolidate/paths.ts`
  resolved `os.homedir() + .quanta/memory`, so a relocated home moved sessions
  and knobs while the memory store stayed in the developer's real home — and
  the repo's own `hermeticQuantaHomeEnv` was therefore not hermetic for memory.
  The plane now resolves under the home like the rest; `<home>/memory/…`
  replaces `<os-home>/.quanta/memory/…`, which is the same path when nothing
  is set. Pinned by `memory-follows-quanta-home-hellgate`, including a wiring
  proof through `buildMemoryForSession`.

  Absent ⇒
  feature sites compute `~/.quanta` (per ADR-0046 convention). Routed
  exclusively through `runtimeConfig().quantaHome` — no direct
  `process.env.QUANTA_HOME` reads outside the SSOT. Distinct from
  `QUANTA_PREFS_HOME` (prefs-only override) and `QUANTA_BENCH_HOME` (bench-
  only override); when only `QUANTA_HOME` is set those subsystems derive
  their roots underneath it.
evidence:
  code:
    - src/shared/runtime-config.ts
    - src/memory/consolidate/paths.ts
    - src/permission/permission-store.ts
    - src/apps/bench/corpus/paths.ts
    - src/apps/cli/help-render.ts
  adrs: []
  tests:
    unit: [tests/unit/cli/help-render-discovery-hellgate.test.ts]
    integration: []
    contract: []
knobs:
  - name: QUANTA_HOME
    default: 'undefined'
    purpose: '(no description)'
deliberate_hold: null
notes: |
  Cross-cutting meta-knob: included for catalog discoverability because no
  single feature owns it. The runtime-config SSOT (`runtime-config-ssot`)
  enforces validate-once + frozen-snapshot semantics; consuming features
  (per-host-agent-mode / post-denial-precedence / per-thread-permissions /
  bench corpus) reference it in their own `knobs:` list to declare the
  dependency.
