config_refs:
  env: ["QUANTA_BENCH_CACHE_PATHSPECS_EXTRA", "QUANTA_BENCH_HOME", "QUANTA_BENCH_TIMEOUT_MS", "QUANTA_CAP_ENFORCE", "QUANTA_COMPACT_TOKENS", "QUANTA_DEDUP_ENV_PREFIXES_EXTRA", "QUANTA_FS_JAIL", "QUANTA_GIT_SHA", "QUANTA_HITL_OVERRIDES", "QUANTA_HOME", "QUANTA_LAST_TOKENS", "QUANTA_LLM_STREAM_FIRST_CHUNK_MS", "QUANTA_LLM_STREAM_IDLE_MS", "QUANTA_LOG_LEVEL", "QUANTA_MAX_TURNS", "QUANTA_MODEL", "QUANTA_PERMISSION_STATE", "QUANTA_PLAN", "QUANTA_PREFS_HOME", "QUANTA_PRICING_VERSION", "QUANTA_PROVIDER", "QUANTA_RUN_ID", "QUANTA_SESSIONS_DIR", "QUANTA_SESSION_LIST_FORMAT", "QUANTA_SESSION_LIST_MAX", "QUANTA_SWEBENCH_CACHE_LEVEL", "QUANTA_SWEBENCH_CLEAN", "QUANTA_SWEBENCH_FORCE_REBUILD", "QUANTA_SWEBENCH_MAX_WORKERS", "QUANTA_SWEBENCH_NAMESPACE", "QUANTA_SWEBENCH_PREPARE_FORCE", "QUANTA_SWEBENCH_PYTHON_BIN", "QUANTA_TOOL_OUTPUT_MAX", "QUANTA_TOOL_OUTPUT_SPILL_KEEP"]
purpose: |
  Single env override that relocates every Quanta-owned persistent path —
  permission-state, bench corpus/artifacts, prefs fallback parent, and other
  feature-site path derivations. NOT owned by any one subsystem: permission-
  store, bench/corpus/paths, and runtime-config SSOT all consume it. Absent ⇒
  feature sites compute `~/.quanta` (per ADR-0046 convention). Routed
  exclusively through `runtimeConfig().quantaHome` — no direct
  `process.env.QUANTA_HOME` reads outside the SSOT. Distinct from
  `QUANTA_PREFS_HOME` (prefs-only override) and `QUANTA_BENCH_HOME` (bench-
  only override); when only `QUANTA_HOME` is set those subsystems derive
  their roots underneath it.
evidence:
  code:
    - src/shared/runtime-config.ts
    - src/permission/permission-store.ts
    - src/apps/bench/corpus/paths.ts
    - src/apps/cli/help-render.ts
  adrs: []
  tests:
    unit: []
    integration: []
    contract: []
knobs: [QUANTA_HOME]
deliberate_hold: null
notes: |
  Cross-cutting meta-knob: included for catalog discoverability because no
  single feature owns it. The runtime-config SSOT (`runtime-config-ssot`)
  enforces validate-once + frozen-snapshot semantics; consuming features
  (per-host-agent-mode / post-denial-precedence / per-thread-permissions /
  bench corpus) reference it in their own `knobs:` list to declare the
  dependency.
