    integration: []
    contract: []
knobs:
  - name: QUANTA_PROMPT_CACHE_STATUS
    default: "CLI unset -> 1 (on); other surfaces follow host config"
    purpose: "Expose the read-only prompt_cache_status tool when its observer port exists; explicit falsy value rolls back"
deliberate_hold: null
notes: |
  Hit rate denominator-zero → 0 (NaN guard). Negative-savings guard
  prevents misconfigured pricing from showing fictitious gains. Claude
  Code's `/cost` exposes raw tokens only — this slice adds operational
  hit-rate / savings.
