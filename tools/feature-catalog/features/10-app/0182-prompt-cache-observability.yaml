notes: |
  Hit rate denominator-zero → 0 (NaN guard). Negative-savings guard
  prevents misconfigured pricing from showing fictitious gains. Claude
  Code's `/cost` exposes raw tokens only — this slice adds operational
  hit-rate / savings.
