id: surface-wire-r2
title: ADR-0304 — Surface-Wire R2 (identity onChange + granular registry + per-tool auto-record)
section: 10
subsystem: REPL surface composition
order: 73
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: integrated
config_refs:
  env:
    - QUANTA_PER_TOOL_RECORD
owners: ["@songmin"]
labels: ["surface:cli", "tier:2", "adr-0304", "default-off"]
depends_on:
  - identity-mid-session-prompt-rebuild
  - repl-slash-ctx-mega-wire
purpose: |
  Closes the 3 deferred last-mile gaps from ADR-0300 + ADR-0302 in a
  single bundled slice (they all converge on surface-compose.ts and are
  file-disjoint parallel impossible):

    Wire 1 — Identity onChange → SystemPromptRebuilder → SystemSource
      The identity adapter's optional onChange(mode) callback now wires
      to a per-session SystemPromptRebuilder; on every successful swap
      the rebuilder recomputes the prompt against the LIVE mode and
      mirrors the result onto sessionDeps.system. The next turn's
      assembleConfig(messages, d) reads d.system literally, so /identity
      set <mode> is visible on the very next LLM call.

    Wire 2 — defaultGranularRegistry() per session
      ALWAYS instantiated (pure in-memory, ~zero cost). Threaded to
      BOTH the perToolSnapshotAdapter (caller-side surface wire) AND
      SessionDeps.granularRegistry (mirrored onto AgentConfig.
      granularRegistry by assembleConfig). The adapter's restoreXxx
      arms now return typed not-found Err for unseen toolCallIds (not
      the legacy shadow-odb-not-configured arm).

    Wire 3 — Per-tool auto-record cadence (caller-side, no loop touch)
      New per-tool-snapshot-recorder.ts wraps every tool in the surface
      registry pre-execute when QUANTA_PER_TOOL_RECORD=on. Captures
      filesBefore (via injected readFile) + taskMessagesBefore (surface
      transcript closure) into the granular registry under a stable
      toolCallId. NO-throw at every step — registry / reader / extractor
      failures log a warn and the tool execute proceeds unchanged.

  All 3 wires default-OFF byte-identical (RFC §1.2): absent env knobs /
  absent identity adapter ⇒ behavior identical to ADR-0300/0302 ship
  state. The agent loop / dispatch / individual tool factories are
  UNTOUCHED.
evidence:
  code:
    - src/apps/cli/repl/surface-compose.ts
    - src/apps/cli/repl/per-tool-snapshot-recorder.ts
    - src/apps/cli/repl/slash-surface.ts
    - src/runner/assemble/config.ts
  adrs:
    - docs/decisions/0304-surface-wire-r2.md
  tests:
    unit:
      - tests/unit/cli/surface-wire-r2-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_PER_TOOL_RECORD
    kind: env
    type: enum
    values: ["on", ""]
    default: ""
    purpose: Enable per-tool auto-record cadence — wraps the surface registry to capture pre-execute snapshots into the granular registry. Default-OFF byte-identical.
deliberate_hold: null
notes: |
  22 hellgate cases / 56 expects / 0 fail. tsc 0 new errors (pre-existing
  unchanged: coverage_check.ts). biome 0 errors / 0 warnings in my slice
  (config.ts buildCapabilityAndObservabilitySpreads split into 2A/2B
  helpers to stay under the cognitive-complexity cap of 15).

  Slice fence preserved — src/agent/loop*.ts, src/agent/dispatch.ts,
  src/agent/types.ts, src/tool/index.ts UNTOUCHED. The granularRegistry
  slot on AgentConfig.granularRegistry was already there (ADR-0300);
  this slice only added the matching slot on SessionDeps + the
  assembleConfig presence-spread that mirrors it.

  Negative invariants (5) documented in the ADR:
    - never record from dispatch / loop (caller-side only),
    - never make sessionDeps.system a () => string (string + mutation),
    - never fire onChange on rejected modes,
    - never tool-name-detect (shape-based extractor only),
    - never break ToolRegistry's `new ToolRegistry(Tool[])` contract.
