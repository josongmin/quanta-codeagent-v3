notes: |
  Slice: `src/apps/bench/eval` — the driver imports `@/runtime` (for
  `scrubEnv`), `@/agent` (for `runAgent`), `@/shared` (event makers),
  `@/observability` (cost stamping). No `@/tool` deep imports — the agent
  carries its tool registry. Sandbox lifecycle = pure path discipline:
  every fs operation lives inside the sandbox root produced by
  `mkdtemp(benchWorkRoot() + 'bench-<id>-')`.
