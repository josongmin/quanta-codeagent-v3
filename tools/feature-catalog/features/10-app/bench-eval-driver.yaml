purpose: |
  Top-level orchestration for a SINGLE SWE-bench-style instance. The ONLY
  place that ties the eval sub-slice together:
    1. Prepare an isolated sandbox `cp -R` copy of the instance repo
       (corpus is NEVER mutated — that invariant lives in `eval/sandbox.ts`)
    2. Run the real agent (`runAgent` + `defaultTools`) against the
       problem statement under per-instance budget caps
    3. Run the instance's `testCmd` (or the official Python harness via
       `python-swebench.ts` when wired) to decide pass/fail
    4. Capture a unified diff of the sandbox via `gitStageAndDiffCached`
       as the produced patch
    5. Unconditional `rm -rf` of the sandbox on the `finally` path
  Returns `InstanceResult` (turns, patch, passed, error, patchPath) which
  the bench report + failure-classifier consume. Every other eval module
  (`env-prep`, `exec`, `sandbox`, `snapshot`, `verdict`) is a
  single-responsibility helper consumed only here.
