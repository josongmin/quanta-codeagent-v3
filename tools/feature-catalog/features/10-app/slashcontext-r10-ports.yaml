purpose: |
  R10 extends the `SlashContext` interface in `src/apps/cli/slash-commands.ts`
  with FIVE optional surface ports — one per R10 panel that needs live session
  data: `cost: () => string | undefined` (R10 F cost-panel render seam),
  `planSnapshot: () => Plan | null` (R10 G plan-store accessor — read-only),
  `workingState: () => WorkingState | undefined` (R10 H scratchpad snapshot —
  read-only), `history: HistorySessionState` (R10 I recent-turns + tool
  breadcrumb), `branchSearch: () => BranchProgressState` (R10 L N-best
  candidate tracker snapshot). All FIVE share one invariant: ABSENT ⇒ the
  slash command prints "not wired in this surface" and exits 0 — byte-
  identical to NOT registering the command. Per-surface wiring is opt-in: the
  REPL surface (`src/apps/cli/repl/*`) injects the live snapshots; one-shot /
  CLI-entry / pipe surfaces leave the fields undefined and inherit the no-op
  fallback. The 5 ports follow the SAME default-OFF parity contract the
  pre-R10 ports (`retry`, `side`, `idle`, `skills`, `memory`, `mcp`) already
  use — appending entries to BUILTINS is the only growth axis; dispatch
  switch stays closed.
