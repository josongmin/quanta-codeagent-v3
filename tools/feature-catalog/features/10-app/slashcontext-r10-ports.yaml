notes: |
  Slice: `src/apps/cli/slash-commands.ts` uses `import("…")` type-only
  references for the three agent-adjacent types (`Plan`, `WorkingState`,
  `BranchProgressState`) so the run-time graph stays untouched — the surface
  fence holds. `exactOptionalPropertyTypes: true` means `{ cost: undefined }`
  and `{}` are distinct types: every R10 port is explicitly `| undefined` so
  test callers can pass either shape. SlashContext growth axis: APPEND
  entries to the registry, NEVER edit the dispatch switch (12-invariant
  surface-model). The 5 ports represent the FULL R10 visibility surface;
  future panels add new ports here without revisiting existing commands.
