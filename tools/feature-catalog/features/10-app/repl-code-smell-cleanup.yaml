notes: |
  The larger `runRepl` God-class split (~1570 lines) is owned by a parallel
  slice under `src/apps/cli/repl/`. This cleanup intentionally stays inside
  `repl.ts` so the two tracks do not collide. The 3 silent catches now thread
  `slog` through `installPills` + `buildTurnIndicatorAndStream` so the larger
  split can keep the same wiring contract.
