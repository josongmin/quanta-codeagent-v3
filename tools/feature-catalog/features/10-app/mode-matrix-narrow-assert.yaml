deliberate_hold: null
notes: |
  Propositional only — string `kind` equality, no thresholds. The first
  diverging cell throws with a clear error citing mode + lever + want + got.
  Type-level drift guards (`_LeverFieldsCoverPolicy`,
  `_PolicyCoversLeverFields`) in `types.ts` make LEVER_FIELDS / ModePolicy
  desync a build error.
