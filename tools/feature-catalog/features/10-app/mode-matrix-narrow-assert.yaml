id: mode-matrix-narrow-assert
title: narrowMode + assertModeMatrix — 48-cell defense-in-depth
section: 10
subsystem: Unified Agent Runtime — 모드 매트릭스 (RFC may-22 §6.2)
order: 8
maturity: L4
status: stable
owners: ["@songmin"]
labels: ["surface:cli"]
purpose: |
  Compile-time + runtime defense against cast-corrupted ModePolicy values.
  `narrowMode<M>(mode, policy)` is a TS assertion function — after the call
  `policy` is typed as `ModePolicy & { mode: M }` so subsequent code can
  rely on the matrix column for that mode (e.g. batch + reviewer-backed is a
  compile error). `assertModeMatrix(policy)` walks every one of 12 lever
  `kind`s and compares against `MODE_PRESETS[mode]` — all 48 cells (6 modes
  × 12 levers, expanding to 72 with ide/daemon C1) are enforced and the
  check can never drift from the preset matrix (single source of truth).
  Audit R1 fix: prior version hand-checked only 13 / 48 cells, defeating
  the stated "defense against unsafe casts" purpose; replaced with a
  data-driven loop over `LEVER_FIELDS`.
