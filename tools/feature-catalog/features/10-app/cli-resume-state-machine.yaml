    contract: []
knobs: []
deliberate_hold: null
notes: |
  ADR-0024 (CLI slice 분해) — `internal.ts` 비대화 fix. 본 모듈은 *어떻게 resume token
  을 해석할지*; 실제 세션 로드(loadSession / loadSessionById)는 @/session 모듈
  (session-index-store / quanta-session-subcommands feature). `--state` path는
  quantastatepath feature 와 직교.
