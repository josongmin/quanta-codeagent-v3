id: cli-resume-state-machine
title: CLI `--resume` state machine — path-mode vs id-mode (ADR-0024 split)
section: 10
subsystem: Session resume (ADR-0024)
order: 12
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:cli"]
depends_on: [quanta-session-subcommands, session-index-store, quantastatepath]
surface_integration:
  cli: full
