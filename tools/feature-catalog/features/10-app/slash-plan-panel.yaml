ui_surfaces: [cli]
configurable: integrated
config_refs:
  env: ["QUANTA_COST_PANEL", "QUANTA_MEMORY_SLASH", "QUANTA_PREFS_HOME", "QUANTA_REWIND"]
purpose: |
  Codex + Claude plan-mode TUI panel — renders the live `Plan` (via
  `PlanStore.current` snapshot) as a compact boxed panel: ordered todo list with
  status glyphs, current-step pointer, and progress header `Plan (N of M done)`.
  100% READ-ONLY — this surface NEVER invokes a `PlanStore` mutator; the slash
  command (`/plan`) consumes a `() => Plan | null` callback (`SlashContext.planSnapshot`)
  and never reaches into the agent slice's mutators. Ordering contract is total
  + deterministic: iterate `Plan.phases[]` in declared `order`, then
  `phase.todoIds[]` in declared order; unreferenced todos appended by `createdAt`
  ASC (stable secondary by `id`). Long plans (>20 todos) truncate to first 5
  completed + current + next 10 pending/blocked with a `… N more` dim line —
  header always reflects the FULL count.
