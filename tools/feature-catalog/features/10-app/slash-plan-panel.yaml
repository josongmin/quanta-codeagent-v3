knobs: []
deliberate_hold: null
notes: |
  Slice: `src/apps/cli` allowed to import `@/agent/plan` types ONLY (type-only
  read of `Plan` shape — no mutators, no `PlanStore` runtime). Color policy
  honored — `setColorPolicy("off")` ⇒ plain ASCII byte-identical to non-TTY
  render. Default-OFF parity: when `SlashContext.planSnapshot` is absent the
  command prints `PLAN_PANEL_NOT_WIRED` and exits 0 (matches `/skills`, `/snooze`
  default-OFF posture).
