id: cli-retry-with-cmd
title: /retry-with — session-time model-swap slash command (ADR-0065 wire-up)
section: 10
subsystem: 앱 — model-swap retry CLI surface
order: 135
maturity: L4
status: stable
owners: ["@songmin"]
labels: ["surface:cli"]
purpose: |
  CLI surface that wires `resolveRetryModel` + `streamWithModel`
  (`src/llm/model-swap.ts`, ADR-0065) into a session-time slash command:

    /retry-with               → escalate to the NEXT candidate after the
                                current model in the configured ordered list.
    /retry-with <model-id>    → request that specific candidate;
                                `NoAlternateModelError` if unknown or
                                identical to the current model.

  On a successful resolve we DROP the most-recent assistant message from
  the transcript (keyed by `Message.id`) and re-stream the prior turn
  against the chosen candidate via `streamWithModel`. The leading
  `stream_reset` tombstone propagates so any consumer that had
  accumulated the prior partial MUST discard it and assemble fresh from
  the new stream (semantics documented on `StreamEvent.stream_reset`).

  Default-OFF posture: without an injected `RetryWithSessionState` on
  the `SlashContext`, the command prints "no model candidates
  configured" and is a no-op — byte-identical to NOT registering the
  command at all. NEVER silently succeeds when unconfigured.
