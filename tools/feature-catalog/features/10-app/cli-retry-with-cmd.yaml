notes: |
  Companion to `65-model-swap-retry.yaml` which catalogs the pure
  policy (resolveRetryModel / streamWithModel). This entry is the
  CLI wiring — re-streaming + transcript surgery + stream_reset
  tombstone propagation — that the policy alone does not perform.
  ADR-0059's "slash dispatch MUST NOT invoke the LLM" invariant
  applies to the surface-only Tier-2 set; `/retry-with` is a
  session-time command (needs the live transcript) and is excluded
  from that invariant by design.
