notes: |
  projection level은 의도적으로 abstract — 너무 strict하면 provider 비결정성에
  brittle, 너무 loose하면 real regression 누락. 현재 mix는 fixture corpus에서
  녹는지 보면서 calibrated. 한 이벤트의 key가 동일해도 input value 변경은
  ignored — value-level diff는 향후 별도 lens가 필요하면 분리해서 흡수.
