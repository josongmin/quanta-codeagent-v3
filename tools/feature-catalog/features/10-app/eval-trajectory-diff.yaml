purpose: |
  두 `TrajectoryEvent` 스트림을 PROJECTION 기반으로 비교 (raw equality 아님).
  설계 결정 (each = contract):
  (1) PROJECTION over EQUALITY: timestamp/monotonic ns/span id/assistant token
      stream/llm usage 등 producer가 deterministic하게 pin 못 하는 필드를 strip
      → `(kind, key)` tuple로 투영.
  (2) SEQUENCE-AWARE: 투영 시퀀스에 LCS 적용 → 한 이벤트 insert/delete가
      cascade misalignment 없이 small diff로 보고.
  (3) NO LLM: deterministic + unit-testable. Subjective quality는
      `compare/pairwise-judge`에 둠.
  비교 대상 kinds (COMPARED_KINDS): turn_start, tool_call, tool_result, error,
  recovery, session_end. 그 외 (assistant_text 델타, llm_request, llm_usage,
  sandbox/verify)는 too noisy로 elide. `tool_call` key는 name + input keys-only
  fingerprint (values는 의도적으로 ignore — path/query 텍스트 noise). `DiffSummary`
  의 `matched/divergedEvents/originalLength/replayLength`를 `replay.ts/verdictFromDiff`가
  pass/partial/fail ladder로 변환 (10% divergence 임계).
