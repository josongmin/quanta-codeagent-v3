    - src/host/bootstrap/bootstrap-session.ts
    - src/host/bootstrap/types.ts
    - src/host/bootstrap/index.ts
    - src/apps/cli/repl.ts
    - src/apps/cli/repl/session-setup.ts
    - src/apps/cli/repl/session-deps-compose.ts
