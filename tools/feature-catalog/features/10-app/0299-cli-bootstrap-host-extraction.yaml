knobs: []
deliberate_hold: null
notes: |
  27 adversarial hellgate cases lock the host extraction boundary. The
  ADR memo records the slice-isolation invariant via biome
  `noRestrictedImports`: `src/host/bootstrap/**` cannot reach into
  `@/apps/cli`, `@/apps/headless`, or other surfaces.
