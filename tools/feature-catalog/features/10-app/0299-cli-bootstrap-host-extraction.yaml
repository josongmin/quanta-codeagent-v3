id: cli-bootstrap-host-extraction
title: CLI bootstrap host extraction (CLI-01)
section: 10
subsystem: REPL surface composition / host layer
order: 74
maturity: L3
status: new
ui_surfaces: [cli, api]
monitoring: n-a
modes: [interactive, headless]
configurable: integrated
config_refs:
  env: []
owners: ["@songmin"]
labels: ["surface:host", "tier:2", "adr-0299", "refactor"]
depends_on: []
purpose: |
  Moves the per-session bootstrap (`bootstrapSession` from
  `src/apps/cli/repl/session-bootstrap.ts`, 332 LOC) out of the CLI
  surface and into `src/host/bootstrap/` — a surface-agnostic host layer
  composed of `bootstrap-session.ts` + `types.ts` + barrel. CLI now
  injects 14 factory closures and consumes the bootstrap result, but
  no longer owns LLM construction, streaming setup, retry composition,
  or reviewer-subagent wiring. This makes the host layer a true SSOT
  the headless surface (ADR-0308) and future Web/Tauri can reuse
  without porting CLI internals.
evidence:
