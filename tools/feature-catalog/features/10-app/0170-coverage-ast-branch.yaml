purpose: |
  AST-walked sibling to ADR-0165's V8 keyword-regex heuristic. Uses the
  typescript compiler API (`ts.createSourceFile` + `ts.forEachChild`)
  WITHOUT a runtime type-check pass — `typescript` is already on disk via
  the project's tsconfig install so marginal cost is zero. Counts
  branches at AST nodes (`IfStatement` then/else, each `Case/Default`,
  `ConditionalExpression` ±2, `&&`/`||`/`??` short-circuit, loops, `catch`).
  Halts recursion at string/template/regex literals so `|` in regex
  doesn't false-positive. Same `CoverageSource` port — caller picks V8
  (speed) vs AST (precision-sensitive audit gates).
