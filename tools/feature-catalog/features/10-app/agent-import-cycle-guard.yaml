knobs: []
deliberate_hold:
  reason: |
    Test-only governance ratchet — there is no runtime feature surface, no
    monitoring emit, no UI wire, and no separate src/ module. The guard IS
    the test: it parses src/agent/*.ts at test-time, runs Tarjan SCC + a
    module-top-level usage scan, and fails the suite on drift in either
    direction. Promoting axes (monitoring/wiring/structure) would require
    inventing surfaces that do not exist — by design this slice owns ZERO
    production code and is enforced exclusively by CI test execution. The
    hellgate sibling (agent-import-cycle-hellgate.test.ts, 21 cases)
    exercises the "false" branch of the primitives — SCC detection on
    synthetic cycles + scanner detection on synthetic deadlock-shaped
    sources — so the guard is proven to CATCH a regression, not just
    pass on today's tree.
  promotion_path: "never — this is a permanent test-only invariant"
notes: |
  L2 = test-only governance, kept as deliberate-hold to surface the honest
  axis profile rather than inflating with decorative scores. Edge
  classification: `import type {…}` / `export type {…}` 는 type-only 로
  erased, cycle detection 제외. `import { type Foo }` mixed 는 보수적으로
  value-edge. 하위 디렉토리 import (`./tier1/...`, `./branch-search/...`) 는
  external node 로 분리해 top-level files 간 cycle 에 영향 없음. 현재
  whitelist 는 `{conversation-action.ts, steering.ts}` 1개 (과거 `{features,
  loop, subagent-runner, branch-search-runner}` 4-element SCC 는 `features.ts`
  → `./tier1/*` 분리 refactor 로 해체됨). architecture-invariants 의 4
  boundary test 와 함께 정적 enforcement 의 마지막 한 축.
