id: agent-import-cycle-guard
title: agent SCC guard — Tarjan + module-top-level usage 차단 (deadlock 봉합)
section: 10
subsystem: 아키텍처 정책 (architecture invariants — 정적 deadlock guard)
order: 26
maturity: L2
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: ["surface:cli"]
surface_integration:
  cli: na
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "keep: test-only governance ratchet, zero production code, no CLI affordance"
    web: "pure test-time Tarjan SCC guard, no runtime feature surface or UI on any surface"
purpose: |
  `src/agent/*.ts` 의 value-level import cycle 은 의도적으로 허용 (cross-edge 값이
  function-body 안에서만 평가됨). 그러나 누군가가 cycle-edge 의 imported symbol 을
  module-top-level (동기, 함수 밖) 에서 호출하면 ESM circular init 의 TDZ deadlock
  으로 변환된다. 본 가드는 Tarjan SCC 알고리즘으로 `src/agent/*.ts` 의 value-import
  그래프에서 모든 size≥2 SCC 를 추출하고 (a) 알려진 whitelist 와 정확히 일치하지
  않으면 fail (양방향 drift: 새 cycle / refactor 후 stale whitelist 동시 차단),
  (b) whitelisted SCC 의 ring edge 중 어떤 imported value 라도 module-top-level
  에서 사용되면 fail. 결과적으로 cycle 자체는 허용하되 deadlock 조건을 정적으로
  봉합 — 런타임에 발견하면 silent hang 이고, 본 가드는 file:line + offending symbol
  로 즉시 진단한다.
evidence:
  code: []
  adrs: []
