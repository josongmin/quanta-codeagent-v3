notes: |
  L2: guard implementation lives inline in tests/unit/agent-import-cycle.test.ts
  (no separate production module) — downgraded from L4 → L3 → L2 because
  evidence.code has no src/ path and only 1 evidence file exists. Edge classification: `import type {…}` / `export type {…}` 는
  type-only 로 erased, cycle detection 제외. `import { type Foo }` mixed 는 보수적으로
  value-edge. 하위 디렉토리 import (`./tier1/...`, `./branch-search/...`) 는 external
  node 로 분리해 top-level files 간 cycle 에 영향 없음. 현재 whitelist 는
  `{conversation-action.ts, steering.ts}` 1개 (과거 `{features, loop, subagent-runner,
  branch-search-runner}` 4-element SCC 는 `features.ts` → `./tier1/*` 분리 refactor 로
  해체됨). architecture-invariants 의 4 boundary test 와 함께 정적 enforcement 의
  마지막 한 축.
