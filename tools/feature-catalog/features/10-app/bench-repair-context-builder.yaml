purpose: |
  Pure seed-message builder for the b2 repair-round orchestrator (RFC §16,
  ADR-0014). Given the running cumulative diff and the latest validator
  failure tail, produces the seed user message for the NEXT repair round.

  Output structure (in order):
    1. `Repair round <round>.`
    2. Original problem statement (verbatim, trimmed only if hugely over budget)
    3. `Your patch so far (cumulative):` + truncated cumulative diff
    4. `Validation failed. Tail of failing output:` + tail-truncated failTail
    5. Forceful next-step instruction — "do NOT revert; fix source; re-verify"
       (specifically forbids `git checkout`, `git reset`, `git clean`, `git stash`).

  Truncation order to fit `maxBytes` (default 12000):
    failTail first (keep TAIL), then cumulativeDiff (drop MIDDLE hunks,
    keep `diff --git` headers + first/last hunks), then trim the problem
    statement only if still over budget. Each truncation leaves a visible
    `… <N bytes truncated>` marker so the model can reason about what
    it isn't seeing.

  Slice no-leak structural guarantee: the orchestrator + this builder
  + the validator import ONLY from `./types`. They never import the
  agent slice; bench runner stays the sole composer.
