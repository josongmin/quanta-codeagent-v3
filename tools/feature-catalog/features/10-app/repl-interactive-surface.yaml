id: repl-interactive-surface
title: Interactive REPL (continuous conversation + in-REPL slash routing)
section: 10
subsystem: CLI REPL surface
order: 13
maturity: L4
status: new
purpose: |
  `quanta` (인자 없는) 호출 시 진입하는 readline 기반 인터랙티브 REPL — 연속 대화,
  per-turn agent run, /skills / /reload-skills / /retry-with / /login / /status 등
  슬래시 명령 in-REPL 라우팅 (Codex parity). 매 턴: 사용자 입력 → 이미지 첨부 파싱
  (argvImages) → 메시지 빌드 → `runAgent(config)` → AgentOutcome → 다음 readline 프롬프트.
  세션 영속(--state / --resume) + cost dashboard (`buildCostDashboard` / `renderDashboardText`)
  + work metrics 요약 (`summarizeWorkMetrics`) + structured logger + shell OTel observer
  모두 와이어 됨. 슬래시 명령 라우팅은 BUILTINS 레지스트리 재사용 (10-app/built-in-slash-
  commands) — REPL 입력 첫 토큰이 `/<letter>` 패턴이면 short-circuit, 아니면 agent로
  흘러감. headless / interactive / batch / ci-bot mode preset (ADR-0092 run-mode 매트릭스)
  중 interactive mode 가 본 REPL 을 default surface 로 사용.
