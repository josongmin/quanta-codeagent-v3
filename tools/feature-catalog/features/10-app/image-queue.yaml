id: image-queue
title: ImageQueue — single-shot per-turn multi-modal image attachment
section: 10
subsystem: CLI multi-modal entry point (REPL surface)
order: 14
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive]
configurable: integrated
config_refs:
  env: [QUANTA_IMAGE_MAX_QUEUE, QUANTA_IMAGE_QUEUE]
owners: ["@songmin"]
labels: ["surface:cli"]
depends_on: [prompt-source-payload-widening]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "CLI REPL /image add FIFO drained by PromptSource.next; reachable from CLI import graph."
    web: "CLI REPL-owned queue; the web image input (paste+hotkey, session-hooks) is a separate web mechanism and does not use this REPL queue."
purpose: |
  REPL surface가 소유하는 in-memory FIFO. 사용자가 `/image add <path>` 슬래시로
  `ImageBlock` (base64 + mediaType, `loadImageBlock`이 검증한)을 큐에 enqueue,
  다음 user turn의 `PromptSource.next()` 가 `drain()` 으로 atomic snapshot+clear
  → 이 turn에만 이미지 attach (다음 turn carry-over 없음). Default-OFF 호환:
  미사용 queue는 no-op (text-only path와 byte-identical). Capacity cap은
  `QUANTA_IMAGE_MAX_QUEUE` (default 5); cap 초과 add는 silent drop이 아니라
  `{ kind: "over_cap", cap }` 디스크리미넌트 반환으로 슬래시 핸들러가 명확한
  메시지 출력. 환경변수 `QUANTA_IMAGE_QUEUE=0` 으로 전체 disable 가능.
evidence:
  code:
    - src/apps/cli/image-queue.ts
    - src/apps/cli/image-cmd.ts
    - src/apps/cli/repl.ts
  adrs: []
  tests:
    unit:
      - tests/unit/cli/image-cmd.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_IMAGE_QUEUE
    default: 'undefined'
    purpose: '(no description)'
  - name: QUANTA_IMAGE_MAX_QUEUE
    default: 'undefined'
    purpose: '(no description)'
deliberate_hold: null
notes: |
  R6 multi-modal track. SRP: queue는 already-validated `ImageBlock` FIFO만 담당;
  path resolution + base64 + 20MB cap은 `image-loader.ts`. `PromptSource` 짝
  feature (04-context-management/prompt-source-payload-widening) — queue가 drain
  한 ImageBlock 배열이 `PromptPayload.images`로 envelope된다. Web/Tauri surface는
  multi-tab 시 per-session 인스턴스 할당 권장.
