notes: |
  Codex Desktop pill-bar 흡수(round-2 R3 finding); quanta는 5-pill로 Rules를
  추가(글로벌+repo+turn rule 가시성). enabledOverride 파라미터로 호스트가
  ENV 우회 가능 (Tauri/Web에서 master ON 강제). 의도적으로 hide threshold
  미사용 — 한 줄에 못 들어가도 truncation은 별도 viewport-safe 로직 책임
  (lifecycle-pills와 동일 정책).
