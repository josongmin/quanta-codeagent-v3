purpose: |
  CLI chrome top-line "pill" composer — 초기 4-pill (Mode / Workspace /
  Sandbox / Skills) → 5-pill (with Rules) 확장. 각 pill은 개별 OFF 가능
  (`QUANTA_PILL_<NAME>=0`) + master OFF (`QUANTA_PILLS=0`); non-TTY 자동 OFF.
  status-bar transient(진행 메시지)와 통합되어 스크롤 region을 보존 —
  pills는 화면 top에 anchor, 본문은 그 아래에서 흐른다. ENV는 생성 시점에
  읽혀 테스트가 결정성으로 드라이브 가능.
  Mode pill은 `QUANTA_EFFORT`(5-tier minimal/low/medium/high/max, ADR-0057)
  를 함께 표시; Sandbox pill은 `QUANTA_SANDBOX`(read-only/workspace-write/
  danger-full-access)를 표시. Rules pill은 로드된 글로벌+repo+turn rule 카운트.
