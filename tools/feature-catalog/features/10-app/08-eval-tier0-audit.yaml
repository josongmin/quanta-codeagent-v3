deliberate_hold: null
notes: |
  Sub-feature of `eval-five-tier` umbrella — separately catalogued because the
  audit tier is the only one that runs without any model / fixture, has its
  own rule DSL (grep patterns + path mapper), and its own coverage-matrix
  data shape (per-leaf boolean) distinct from synthetic scoring or pairwise
  judge verdicts.
