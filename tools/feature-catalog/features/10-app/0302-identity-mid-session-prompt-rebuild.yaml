purpose: |
  ADR-0291 wired ctx.identity = {get,set,list}. Today set("plan")
  mutates the active mode cell, but the LLM keeps seeing the OLD
  system prompt that was captured ONCE at session bootstrap. The cached
  prefix never refreshes, so /identity plan after turn 1 leaves a
  default-flavoured prompt for the rest of the session.

  ADR-0302 closes this last-mile gap with two tiny seams + one optional
  adapter callback:

    - createSystemPromptRebuilder({ mode, cwd, baseBuilder })
        returns SystemPromptRebuilderPort.rebuild() that recomputes the
        prompt against the LIVE mode closure. No-throw — failing
        baseBuilder returns a typed fallback string with newlines
        stripped from the reason.
    - createSystemSource(initial) returns SystemSource {get, set} —
        idempotent on equal values (=== short-circuit).
    - buildIdentityModeAdapter gains optional onChange?(mode) that
        fires after a successful swap. Never fires on rejected modes.
        Adapter swallows callback throws so /identity never regresses
        to a 1-exit just because the rebuilder hiccupped.

  Default-OFF byte-identical: absent onChange + absent rebuilder ⇒
  behavior identical to ADR-0291 (state-only swap, stale prompt).

  WIRE LANDED (2026-07): the live surface composition wires the mid-session
  rebuild via the inline `buildPromptFromIdentityMode` path, NOT the
  `createSystemPromptRebuilder` port. `surface-compose.ts:802` binds
  `onIdentityModeChange → setup.refreshSystemPrompt`; that seam
  (`bootstrap-session.ts:226`) calls `systemSource.set(buildPromptFromIdentityMode())`,
  which fresh-reads the live `identityModeState.get()` (bootstrap-session.ts:201)
  so /identity mid-session refreshes the cached prefix. The
  `createSystemPromptRebuilder` port here is an unwired forward-seam (unit-tested
  only, no production caller — see the FORWARD-SEAM marker in
  system-prompt-rebuilder.ts).
