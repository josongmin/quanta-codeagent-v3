notes: |
  15 hellgate cases / 45 expects / 0 fail. tsc 0, biome 0.

  Live wire landed via the inline path (see purpose): surface-compose.ts:802
  binds onIdentityModeChange → refreshSystemPrompt (bootstrap-session.ts:226),
  which mutates the shared `systemSource` cell that the per-turn assembler reads
  on the next turn — no loop/runner contract shape change. The
  createSystemPromptRebuilder / SystemSource port pair in this slice is the
  unwired forward-seam substrate (unit-tested only).

  No new closed enums or error codes; the typed fallback prefix
  ("(prompt rebuild failed: ") is a stable test target, not a public
  enum.
