notes: |
  15 hellgate cases / 45 expects / 0 fail. tsc 0, biome 0.

  Slice fence preserved — session-loop.ts, surface-compose.ts,
  prompt-pipeline.ts, session-bootstrap.ts UNTOUCHED. Loop / runner
  contract (SessionDeps.system: string) UNTOUCHED. The follow-up wire
  will mirror the rebuilder output into sessionDeps.system (mutable
  field) so assembleConfig(messages, d) reads the fresh string on the
  next turn — no shape change.

  No new closed enums or error codes; the typed fallback prefix
  ("(prompt rebuild failed: ") is a stable test target, not a public
  enum.
