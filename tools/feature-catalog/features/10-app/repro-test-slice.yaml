purpose: |
  Agentless paper §3.3.1 absorption: drive the LLM K times to synthesise
  self-contained Python repro scripts that print one of three sentinels
  (`Issue reproduced` / `Issue resolved` / `Other issues`), execute each
  candidate against the ORIGINAL repo (pre-patch) via a `ReproExecPort`,
  classify the stdout, then select the winning candidate by MAJORITY VOTE
  over the normalised source of those that reproduced. Bench driver wires
  it behind a default-OFF env gate (`QUANTA_BENCH_REPRO_TEST=K`) so when
  the flag is unset measurement is byte-identical.

  Paper deviations recorded honestly: K default 5 (paper 40), temperature
  uses the provider's default (LLMPort has no temperature knob — K
  independent calls give K independent samples for sampling providers; a
  deterministic test double yields unanimous majority). Markdown fences
  stripped (` ```python `, ` ``` `). Normalisation collapses arbitrary
  `def test_<x>()` names, runs of whitespace, comments and docstrings so
  superficial paraphrase doesn't fork the group key. Tie-break: first
  appearance wins (deterministic given input order).
evidence:
