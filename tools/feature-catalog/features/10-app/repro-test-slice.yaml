deliberate_hold: null
notes: |
  Slice posture: generator has NO I/O beyond LLMPort; executor takes
  ReproExecPort + ReproWriteFilePort so Python execution stays injectable
  (production wires `python3 <script>` against the original repo cwd).
  Selector is pure. AbortSignal honoured between samples — a triggered
  abort returns whatever was collected so far; select.ts is happy to
  operate on fewer samples.
