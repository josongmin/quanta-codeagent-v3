id: doctor-selfcheck
title: /doctor startup self-diagnostic — pure check-registry over injected probes
section: 10
subsystem: CLI diagnostics — consolidated health sweep (RFC jun-6-doctor-selfcheck)
order: 90
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: static
owners: ["@songmin"]
labels: ["surface:cli", "diagnostic", "read-only", "closed-port-di"]
config_refs:
  env: [QUANTA_DOCTOR]
  cli: ["--json"]
purpose: |
  `/doctor` is a read-only startup self-check that aggregates the scattered
  `/status` (auth), `/mcp` (servers), `runtimeConfig()` (config), terminal,
  and session-store health checks into one pass/warn/fail report with a
  per-failure remedy. It is the missing "왜 안 되지" first-thing-to-run
  command (Claude Code `/doctor` analogue). The check-registry is a PURE
  leaf: each check is `(probes: DoctorProbes) => Promise<CheckResult>` with
  every subsystem accessor INJECTED as a duck-typed probe (closed-port DI —
  no Date.now / process.env / network in the leaf). `runDoctor` runs all
  checks ISOLATED via a per-check `.catch(failResult)` so one throwing probe
  can never abort the sweep; the renderer reuses the `/status` rounded-box
  vocabulary; `run()` returns a non-zero exit iff any check failed (warn is
  exit 0, CI-friendly); `--json` emits the redacted `CheckResult[]`. The
  surface adapter (`default-probes.ts`) wires the real accessors and is the
  only place that touches `@/auth` / `@/llm` / `@/shared` / `@/session`.
evidence:
  code:
    - src/apps/cli/doctor/types.ts
    - src/apps/cli/doctor/registry.ts
    - src/apps/cli/doctor/render.ts
    - src/apps/cli/doctor/cmd.ts
    - src/apps/cli/doctor/default-probes.ts
    - src/apps/cli/doctor/index.ts
  adrs: []
  tests:
    unit:
      - tests/unit/doctor-selfcheck-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_DOCTOR
    where: env
    default: "1"
    purpose: |
      Optional module-load gate for parity with /rewind/-/memory (default
      registered — read-only diagnostic). Setting "0" removes /doctor from
      the registry. Registration is a one-line entry in the shared app slash
      registry (registry-app.ts); see the implementation report.
deliberate_hold:
  reason: |
    L3 (wired seam, registration is a one-line shared-registry edit reported
    rather than applied per the slice ownership rules). The pure leaf +
    surface probes + renderer + command are complete and hellgate-covered;
    promotion to L4 lands when the `/doctor` entry is added to
    registry-app.ts's APP_SLASH_COMMANDS.
  promotion_path: |
    Add `doctorCmd` (from `@/apps/cli/doctor`) to APP_SLASH_COMMANDS in
    src/apps/cli/slash/registry-app.ts, mirroring `permissionCmd` / `mcpCmd`.
    Optionally env-gate with an `isDoctorEnabled()` guard like
    `isRewindEnabled()` if QUANTA_DOCTOR parity is desired.
notes: |
  Pairs with /status (auth) and /mcp (servers) — /doctor aggregates their
  probes rather than duplicating them. Read-only: every probe is a reader;
  the hellgate asserts the registry never mutates and never leaks secrets
  (auth probe reports presence/expiry only, never the key/token value).
