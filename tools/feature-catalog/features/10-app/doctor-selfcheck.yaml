# No env knob. `QUANTA_DOCTOR` was listed here with the purpose "Setting \"0\"
# removes /doctor from the registry", and nothing reads it: the name appears
# only in docs/plans/jun-6-doctor-selfcheck.md, which calls it optional and
# "if desired". It was a proposal recorded as a shipped knob. The intent stays
# in deliberate_hold below, where an unbuilt thing belongs.
knobs: []
deliberate_hold:
  reason: |
    L3 (wired seam, registration is a one-line shared-registry edit reported
    rather than applied per the slice ownership rules). The pure leaf +
    surface probes + renderer + command are complete and hellgate-covered;
    promotion to L4 lands when the `/doctor` entry is added to
    registry-app.ts's APP_SLASH_COMMANDS.
  promotion_path: |
    Add `doctorCmd` (from `@/apps/cli/doctor`) to APP_SLASH_COMMANDS in
    src/apps/cli/slash/registry-app.ts, mirroring `permissionCmd` / `mcpCmd`.
    Optionally env-gate with an `isDoctorEnabled()` guard like
    `isRewindEnabled()` if QUANTA_DOCTOR parity is desired.
notes: |
  Pairs with /status (auth) and /mcp (servers) — /doctor aggregates their
  probes rather than duplicating them. Read-only: every probe is a reader;
  the hellgate asserts the registry never mutates and never leaks secrets
  (auth probe reports presence/expiry only, never the key/token value).
