notes: |
  NO numerical literals — the comparison is purely `requested > cap` against
  caller-supplied values. The isValidDial guard mirrors the meter's
  `Number.isFinite` pattern so a poisoned input is dropped (treated as
  absent) rather than propagated. Fresh-object output; inputs never mutated.

