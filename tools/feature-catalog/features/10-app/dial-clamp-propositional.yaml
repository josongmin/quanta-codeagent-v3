id: dial-clamp-propositional
title: clampDials — propositional dial clamping with operator log
section: 10
subsystem: Unified Agent Runtime — 모드 매트릭스 dial 보정 (RFC may-22 §8.3)
order: 7
maturity: L2
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: static
owners: ['@songmin']
labels: [surface:cli]
depends_on: [budget-events-union, budget-meter, assert-never-exhaustiveness, budget-dials-types, byte-stable-string-comparator]
purpose: |
  Pure function `clampDials(dials, caps, onClamp?)` — for each of 16 dial
  fields, returns `min(requested, cap)` when both present; emits a
  `[budget-cap]` warn log via `@/shared#logger` for every clamp event
  (silent clamping is forbidden by the run-mode contract). Defensive
  normalization: NaN / ±Infinity / negative values are treated as absent
  rather than clamped to, so a config-poisoned cap can never silently
  disable a gate (BudgetMeter#tick `>` comparison would otherwise become
  NaN). Optional `onClamp(BudgetClampEvent)` callback for trajectory
  emission (independent of the log line). The DIAL_FIELDS tuple is a
  `satisfies readonly (keyof BudgetDials)[]` — adding a new dial without
  updating the tuple is a TS error.
