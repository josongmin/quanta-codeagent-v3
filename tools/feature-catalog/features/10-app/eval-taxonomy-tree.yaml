purpose: |
  `docs/analysis/may-21-coding-agent-query-usecase.md` §1과 1:1 미러링된
  in-code 분류 트리. ID 스킴은 `<major>.<mid>.<leaf>` kebab-case로 stable
  across releases — downstream store (Tier 1 fixtures, Tier 3 trajectory
  labels) 모두 이 id로 keying하므로 rename은 breaking change. `EvidenceKey`
  필드로 학술 근거(hao2026/hao2024/liu2026/wang2026/zhong2025/none) 기록.
  `index.ts`가 derived view 제공: `allLeaves()`, `leafById()`, `parseId()`,
  `leafCount()`, `majorShare()`, `formatLeafLine()` — frozen-for-process
  memoised cache. `UseCaseId` 타입은 opaque로 취급 (storage·classifier·
  generator·audit이 모두 이걸 키로 씀). `empiricalShare`는 Hao 2026 ChatGPT
  n=343 cat 1-7에 한해서만 측정값 보유, 나머지는 omit.
