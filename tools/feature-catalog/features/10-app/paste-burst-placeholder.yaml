id: paste-burst-placeholder
title: Paste-burst placeholder — large paste coalesced to `[Pasted Content N chars]` (Codex parity)
section: 10
subsystem: CLI input reader
order: 40
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:cli"]
depends_on: []
purpose: |
  Codex-style large-paste coalescing in the raw-line reader. A SINGLE keypress
  whose `str` carries ≥ `minChars` chars (a bracketed paste arrives as ONE
  multi-char keypress) is ECHOED as `[Pasted Content N chars]` while the FULL
  pasted text is still spliced into the buffer and SUBMITTED verbatim. Detection
  is chunk-SIZE only (no clock / timing). `projectPasteDisplay` collapses recorded
  segments for the echo (prompt row + final exit echo); `buf` stays the source of
  truth. closed-port DI: the reader takes `pasteBurst:{minChars}` via
  `ReadLineOptions` — never reads env (the host threads it from the knob through
  `buildPromptUx` → `PromptPipelineUxOpts`). Default-OFF (knob unset ⇒ option
  absent) ⇒ every keypress path is byte-identical to the inline-echo build.
evidence:
  code:
    - src/apps/cli/raw-line-reader.ts
    - src/apps/cli/repl/prompt-pipeline.ts
    - src/apps/cli/repl/surface-compose.ts
    - src/shared/runtime-config.ts
  adrs: []
  tests:
    unit:
      - src/apps/cli/__tests__/raw-line-reader-paste-burst.hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_PASTE_BURST
    default: 'unset (off)'
    purpose: 'positive-integer min-char threshold; absent/invalid ⇒ paste echoes inline (byte-identical)'
notes: 'Display-only collapse — submission always carries the full text. An edited-away segment is skipped (raw chars show, never a crash).'
