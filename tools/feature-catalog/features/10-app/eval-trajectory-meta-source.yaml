id: eval-trajectory-meta-source
title: eval Tier 3 — meta sidecar + JSONL session loader (no-heuristic policy)
section: 10
subsystem: eval 앱 — Tier 3 fixture I/O
order: 87
maturity: L4
status: stable
owners: ["@songmin"]
labels: ["surface:bench"]
purpose: |
  Tier 3 trajectory 실측 데이터 I/O 레이어. `EvalMeta` 사이드카
  (`<jsonl>.meta.json`)가 "어떤 prompt가 이 trajectory를 만들었나"의 권위
  source — JSONL body에서 prompt를 inferring하는 heuristic은 의도적으로 거부
  (assistant_text 델타에서 user prompt 복원은 unreliable). `JsonlRecorder`는
  shared producer라 trajectory 포맷에 prompt 필드 추가 못 함 (RFC-0002 §5.2).
  `loadSession`이 read-only로 events + turns + meta를 `SessionView`로 묶음.
  `MetaReadResult` discriminated union으로 `missing` vs `malformed` 구분 —
  운영자가 "아직 안 적었나" vs "잘못 적었나" 식별 가능. `producersOf` helper로
  recorder identity별 grouping. Malformed JSONL line은 LOG + COUNT (silent skip
  금지) — fixture 부패는 numeric signal로 surface. `freezeFixture`가 real
  session을 `fixtures/<usecase>/<id>.jsonl`로 promote하면서 meta sidecar 동행 —
  meta도 inline prompt도 없으면 null 반환 (strict refusal).
