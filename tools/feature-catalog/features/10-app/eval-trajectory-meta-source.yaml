notes: |
  Umbrella [eval-five-tier]는 replay만 cover — 이 항목이 fixture 라이프사이클
  (read + load + freeze + classify) + no-heuristic 정책을 명시적으로 잠금.
  Filesystem race (readdir → stat에서 vanish)는 per-file 보호. classifier는
  meta가 null이면 `usecase:"unclassified"` + confidence 0으로 기록해 backfill
  가능하게 — replay와 동일 contract.
