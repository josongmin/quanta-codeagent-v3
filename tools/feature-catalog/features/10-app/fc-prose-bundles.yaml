title: fc prose bundles — intro + non-absorption 정책 MD 가 catalog 빌드 시 blend
section: 10
subsystem: feature-catalog 메타 도구 (rendered MD 의 non-YAML 섹션 SSOT)
order: 53
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
