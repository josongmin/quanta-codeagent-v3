purpose: |
  Rendered `docs/10.feature-catalog.md` 의 두 가지 비-YAML 섹션 — (a)
  intro/머리말 (성숙도 5단계 척도, RFC/ADR refs, slice-isolation 원칙),
  (b) trailer 정책 노트 (Codex 의도적 미흡수 — heartbeat/plugin
  bundle/cassette validator 등, ADR-0015~0023 근거; 운영/실험 인프라
  미흡수 — Statsig kill-switch / Datadog cohort 등, ADR-0011 근거) — 를
  `tools/feature-catalog/prose/<prefix>-<slug>.md` 파일로 SSOT 보관.
  `render.ts#loadProse` 가 `00-*.md` 를 intro 로, `50-*.md`/`99-*.md` 를
  trailer 로 자동 collect 해서 rendered MD 의 정해진 위치에 inline. MD
  자체는 build artefact (직접 편집 금지) — 산문 변경은 prose/ 의 source
  를 고치고 `bun fc build` 가 결정적으로 재생성한다. 이 분리 덕에 catalog
  rendering 코드는 데이터 transform 만, 정책 텍스트 권위는 markdown 파일에.
