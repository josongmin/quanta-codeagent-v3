deliberate_hold: null
notes: |
  Prefix convention: `00-*` ⇒ intro (catalog 헤더 직후), `50-*`/`99-*`
  ⇒ trailer (catalog 본문 뒤). `loadProse` 는 prefix-sorted 로 결정적
  순서. "의도적으로 흡수하지 않은 것" 의 카탈로그 — 흡수 ROI 추적 시
  반복 질문 ("X 왜 안 들어옴?") 의 single answer point.
