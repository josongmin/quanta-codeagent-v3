id: linux-sandbox-native-impl
title: Linux sandbox native impl — Phase 3.1 Rust bodies + cargo build verify
section: 10
subsystem: Linux microVM native helper (Phase 3.1)
order: 95
maturity: L3
status: stable
ui_surfaces: [api]
monitoring: planned
modes: [daemon]
configurable: integrated
config_refs:
  env: []
owners: ["@songmin"]
labels: ["adr-0193", "tier:2", "sandbox", "linux"]
depends_on:
  - os-sandbox-port-router
purpose: |
  Fills the Rust function bodies stubbed by ADR-0175's Phase 3 scaffold.
  `crates/linux-sandbox-native/src/policy.rs` builds
  `landlock::Ruleset` with `CompatLevel::BestEffort` (kernel 5.13~6.15
  ABI auto-fallback) + per-profile FS access matrix (read-only /
  workspace-write / workspace-write-net). cargo workspace + napi-rs
  binding + TS adapter (`src/runtime/os-sandbox/landlock-native.ts`).
  Phase 3.2 (strict seccomp filter + GitHub Actions 4-triple matrix CI
  + npm publish per-platform) deferred to follow-up ADR. Industry
  parallel: Codex `codex-linux-sandbox` crate — same pattern (in-process
  native landlock + seccomp + fork-exec via `pre_exec`).
evidence:
  code:
    - crates/Cargo.toml
    - crates/linux-sandbox-native/Cargo.toml
    - crates/linux-sandbox-native/src/lib.rs
    - crates/linux-sandbox-native/src/policy.rs
    - crates/linux-sandbox-native/src/seccomp.rs
    - src/runtime/os-sandbox/landlock-native.ts
  adrs:
    - docs/decisions/0193-linux-sandbox-native-impl.md
  tests:
    unit: []
    integration: []
    contract: []
knobs: []
deliberate_hold:
  reason: |
    Phase 3.2 (strict seccomp filter, 4-triple CI matrix, per-platform
    npm publish) is intentionally deferred to its own ADR. Current
    slice ships lax-mode seccomp + cargo build verify only.
  promotion_path: |
    Phase 3.2 ADR closing seccomp strict filter + CI matrix + publish.
notes: |
  Resolver v2 + `cfg(target_os = "linux")` deps gated. Phase 3.1
  hellgate is the parent ADR-0175's 20-case fake-binding suite; real
  binding hellgate lands in Phase 3.2.
