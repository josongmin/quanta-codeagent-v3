id: prompt-suggestion
title: Prompt-suggestion + quality reject-gate (ADR-0467)
section: 10
subsystem: 앱 — next-prompt suggestion with rich quality reject-gate
order: 467
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: partial
owners: ["@songmin"]
labels: ["surface:cli", "default-off", "port-inversion"]
depends_on: []
purpose: |
  Suggests what the user might naturally type next. The crown jewel is the
  PURE reject gate (`rejectGate`, `src/agent/prompt-suggestion/reject-gate.ts`)
  — a closed `RejectReason` enum where each member is one named predicate,
  evaluated in declaration order, first-match-wins. Absorbed verbatim from
  Claude CLI 2.1.150's `GZ8` chain (regexes + word lists transcribed 1:1):

    empty / done / meta_text / meta_wrapped / error_message / prefixed_label /
    too_few_words (with a short-command whitelist + slash escape) /
    too_many_words / too_long / multiple_sentences / has_formatting /
    evaluative / claude_voice.

  Around the gate: an output sanitizer (`sanitize.ts`, strips `<suggestion>`
  tags / a short `Label:` prefix / surrounding quotes), a pure
  suppression-context guard (`suppression.ts`, blocks in plan mode / when
  rate-limited / during an MCP elicitation / while a permission is pending),
  and a no-throw `Result`-shaped orchestrator (`orchestrator.ts`) that ties
  them together: gate-OFF → suppression → pre-abort → ONE model call →
  sanitize → reject gate → show | suppress.

  The model call is the injected `SuggestFn` (port inversion) — the slice
  NEVER imports `@/llm` / `@/tool` / `@/permission` / `@/mcp`. The dedicated
  tools-denied "SUGGESTION MODE" prompt is exported from a single source of
  truth (`SUGGESTION_MODE_SYSTEM_PROMPT`).

  Default-OFF: gated on `QUANTA_ENABLE_PROMPT_SUGGESTION === "1"` (mirrors
  Claude's `CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION`). Unset ⇒ the orchestrator
  returns `{kind:"suppress", reason:"gate_off"}` WITHOUT calling the model —
  zero LLM calls, nothing rendered, byte-identical to today. Nothing in
  `@/apps` imports the barrel yet; surface + composition-root wiring are
  integration steps.
evidence:
  code:
    - src/agent/prompt-suggestion/types.ts
    - src/agent/prompt-suggestion/reject-gate.ts
    - src/agent/prompt-suggestion/sanitize.ts
    - src/agent/prompt-suggestion/suppression.ts
    - src/agent/prompt-suggestion/orchestrator.ts
    - src/agent/prompt-suggestion/index.ts
    - src/apps/cli/repl/prompt-suggestion-wire.ts
  adrs: [467]
  tests:
    unit:
      - tests/unit/prompt-suggestion-hellgate.test.ts
      - tests/unit/prompt-suggestion-wire-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_ENABLE_PROMPT_SUGGESTION
    default: 'unset (OFF)'
    purpose: |
      `1` opts a deployment into the feature (still requires a surface to wire
      the `SuggestFn` adapter + call `runPromptSuggestion`). Any other value /
      unset keeps it fully OFF — no model call, no render.
deliberate_hold:
  reason: |
    No CLI surface and no composition-root adapter are wired in this slice (those
    files are out of its scope fence). The slice is a dead, default-OFF seam
    until the human applies the integration TODOs in ADR-0467.
notes: |
  Reject gate is PURE & TOTAL and reusable anywhere a model-produced "next
  prompt" needs vetting. Thresholds (minWords 2 / maxWords 12 / maxChars 100)
  are the competitor's exact numbers, pinned in `SUGGESTION_LIMITS` with
  provenance — not invented heuristics.
