purpose: |
  Layer 1 of the content-plane secret-redaction invariant. Maps a file path
  OR a shell-command shape to a closed-enum `SensitivityClass`
  (`public` / `internal` / `secret`). NEITHER layer is heuristic — paths
  match against an EXPLICIT list of dotfiles / config locations; commands
  match on executable basename plus a structural unwrap (shell `-c` clusters,
  utility prefixes, command substitution on the raw line, interpreter eval
  source). Not a POSIX parser and not a raw first-token lookup (`/bin/bash`
  classifies as `bash`). Command-shape helpers live in
  `command-shape.ts` (wrappers, pipelines, env prefixes, interpreter `-e`/`-c`,
  `php -r`, `deno eval`). Nested `bash -c` / interpreter eval / env dumps fail
  closed as `secret`. Unknown `-c` unwraps only if the payload classifies secret.
  `classifyCommandShape` is the bash/pty/container-exec `classifySource` seam;
  a `secret` class short-circuits `redactSecrets({ origin: "tool_result" })`
  so Layer-2 format regex never sees the dump. `"secret"` is the strongest signal:
  the redaction layer replaces the entire tool output with a single
  `[REDACTED:source_class_secret]` placeholder BEFORE running format-regex
  matching. This is structural — these paths and commands can ONLY produce
  secrets — so the raw bytes never touch the model context, the JSONL
  envelope, or the memory distill input. Path normalization expands `~`
  against the supplied home and uses a single-pass canonical form (callers
  pass absolute paths).
