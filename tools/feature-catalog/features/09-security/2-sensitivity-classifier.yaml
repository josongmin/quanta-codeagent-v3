purpose: |
  Layer 1 of the content-plane secret-redaction invariant. Maps a file path
  OR a shell-command shape to a closed-enum `SensitivityClass`
  (`public` / `internal` / `secret`). NEITHER layer is heuristic — paths
  match against an EXPLICIT list of dotfiles / config locations; commands
  match on the FIRST TOKEN + a structural arg shape (no fuzzy keyword
  search of the whole command line). `"secret"` is the strongest signal:
  the redaction layer replaces the entire tool output with a single
  `[REDACTED:source_class_secret]` placeholder BEFORE running format-regex
  matching. This is structural — these paths and commands can ONLY produce
  secrets — so the raw bytes never touch the model context, the JSONL
  envelope, or the memory distill input. Path normalization expands `~`
  against the supplied home and uses a single-pass canonical form (callers
  pass absolute paths).
