id: redaction-config-gate
title: redaction opt-out gate — startup-fail when disabled without ack (ADR-0078)
section: 9
subsystem: 보안 — redaction 설정 게이트 (ADR-0078)
order: 3
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: integrated
telemetry_keys: [quanta.conversation.id]
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "security-touched"]
depends_on: [secret-redaction-content-plane]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "opt-out gate with CLI affordance: normalizeRedactionConfig startup-throw when disabled-without-ack plus per-turn system-reminder banner"
    web: "config-validation policy gate; the banner is a content-plane system-reminder, not a bridged event or web card, so no browser UI affordance"
purpose: |
  Default-ON gate that enforces the secret-redaction invariant. Disabling at
  the host level requires an explicit `acknowledgedRisk` string — a non-empty
  value the caller authored, surfaced in transcripts and audit so "redaction
  is off" is never invisible. `normalizeRedactionConfig` returns a frozen
  normalized config OR throws `RedactionConfigError` at startup if the
  caller asked for `disabled: true` without acknowledging risk. The loop
  calls this ONCE at startup so a misconfigured host fails fast — never
  mid-turn. Per-turn behaviour when disabled: a `<system-reminder>` banner
  is injected so the operator sees the live opt-out state on every loop
  step. The frozen `NormalizedRedactionConfig` carries the `enabled` flag,
  the `acknowledgedRisk` string (when present), and the structural
  `whitelist: ReadonlyArray<RegExp>` (used by callers to override
  specific fixture tokens). The `secret-redaction-content-plane` entry
  describes the actual masking pass; this entry describes the opt-out gate
  alone.
evidence:
  code:
    - src/security/redaction-config.ts
    - src/security/index.ts
    - src/agent/types.ts
    - src/agent/loop.ts
  adrs: [78]
  tests:
    unit:
      - tests/unit/security/redaction-config.test.ts
      - tests/unit/secret-detection-hellgate.test.ts
    integration:
      - tests/integration/redaction-three-application-points.test.ts
    contract: []
knobs:
  - name: AgentConfig.redaction.disabled
    default: 'undefined'
    purpose: 'explicit opt-out, requires acknowledgedRisk'
  - name: AgentConfig.redaction.acknowledgedRisk
    default: 'undefined'
    purpose: 'non-empty string when disabled'
  - name: AgentConfig.redaction.whitelist
    default: 'undefined'
    purpose: 'structural RegExp overrides (e.g. fixture tokens)'
deliberate_hold: null
notes: 'Startup-throw avoids the "redaction silently off because misconfigured" failure mode that a runtime soft-warn would risk.'
