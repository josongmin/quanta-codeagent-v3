    contract: []
knobs:
  - AgentConfig.redaction.disabled — explicit opt-out, requires acknowledgedRisk
  - AgentConfig.redaction.acknowledgedRisk — non-empty string when disabled
  - AgentConfig.redaction.whitelist — structural RegExp overrides (e.g. fixture tokens)
deliberate_hold: null
notes: 'Startup-throw avoids the "redaction silently off because misconfigured" failure mode that a runtime soft-warn would risk.'
