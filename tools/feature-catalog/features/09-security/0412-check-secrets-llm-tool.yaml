id: check-secrets-llm-tool
title: check_secrets LLM-facing tool over async secret-detection (ADR-0412)
section: 9
subsystem: 보안 — async secret-detection 신모듈을 LLM tool로 노출
order: 412
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "security-touched"]
depends_on: [secret-redaction-content-plane, sensitivity-classifier]
config_refs:
