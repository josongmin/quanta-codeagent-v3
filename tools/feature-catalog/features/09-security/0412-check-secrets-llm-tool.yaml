    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  gate vs tool 결정: secret-detection이 sync masking 슬롯에 안 맞으니
  applyRedaction mutate 대신 LLM-callable surface로. PII redaction(ADR-0399)는
  sync + masking이라 applyRedaction에 wired(정반대 path). 두 path 독립.
