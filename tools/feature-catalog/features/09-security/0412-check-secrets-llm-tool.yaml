  evidence:
    cli: "runs in the interactive CLI — 4/4 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "user value is an LLM tool call which renders as tool.invoked/tool.completed via the bridged tool_call/tool_result events"
purpose: |
  ADR-0078 secret-redaction은 sync + masking 슬롯이라 dispatch.applyRedaction에
  wired됐지만, 신모듈 `src/security/secret-detection/`은 async + detection-only
  (splice 안 함)라 그 슬롯에 drop-in 불가. 이 항목은 그 갭을 LLM-callable
  도구로 닫는다 — 모델이 "이 텍스트/파일에 secret 있나?"를 능동적으로 호출.
  Zod XOR input ({text} | {file_path}), compositeSecretScanner().scan async,
  no-throw boundary(scanner throw ⇒ typed `{ok:false, mode:"error"}`).
  Default-OFF: `QUANTA_SECRET_CHECK_TOOL=on`(strict canonical) 일 때만 등록.
  config 없으면 extraTools 미포함 ⇒ byte-identical 루프.
evidence:
  code:
    - src/tool/check_secrets.ts
    - src/agent/tier1/check-secrets.ts
    - src/agent/tier1/index.ts
    - src/agent/features.ts
  adrs: [412]
  tests:
