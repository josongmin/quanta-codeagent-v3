id: secret-redaction-content-plane
title: Secret redaction as content-plane invariant (ADR-0078)
section: 9
subsystem: 보안 — 컨텐츠 평면 SoT (LLM/디스크/메모리 distill)
order: 1
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: integrated
telemetry_keys: ["gen_ai.response.time_to_first_token_ms", "quanta.conversation.id", "quanta.tool.call.status"]
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "security-touched"]
depends_on: [agent-types-split, plan-mode, sensitivity-classifier, response-in-progress, fallback-kinds-policy]
config_refs:
  env: ["QUANTA_BENCH_LOCALIZE_PHASE", "QUANTA_CAP_ENFORCE"]
purpose: '단일 SoT (src/security/redaction.ts) 가 3개 컨텐츠-평면 경계 + 1개 audit surface 에서 동작: tool_result(모델 향) / envelope_jsonl(영속화) / memory_distill(롱텀 메모리 입력) + AgentOutcome.redactions[]. 2-layer 구조 — Layer 1 SensitivityClass(path/cmd 명시적 리스트) → "secret" short-circuit, Layer 2 closed RedactionKind enum(14종 + source_class_secret) 결정적 regex. 확률/threshold 없음. 모든 redaction span 은 RedactionHit 로 surface(silent redaction 금지). Default-ON; disable = acknowledgedRisk 비어있으면 startup-fail + 매 turn <system-reminder> 배너.'
evidence:
  code:
    - src/security/redaction.ts
    - src/security/sensitivity-classifier.ts
    - src/security/redaction-config.ts
    - src/security/index.ts
    - src/agent/dispatch.ts
    - src/agent/loop.ts
    - src/agent/memory-distill.ts
    - src/agent/memory.ts
    - src/agent/prompt.ts
    - src/agent/types.ts
    - src/agent/dispatch-types.ts
    - src/agent/streaming-dispatch.ts
    - src/observability/vocabulary.ts
    - src/apps/bench/eval/driver.ts
    - src/shared/runtime-config.ts
  adrs: [78]
  tests:
    unit:
      - tests/unit/security/redaction-patterns.test.ts
      - tests/unit/security/redaction-false-positive.test.ts
      - tests/unit/security/sensitivity-classifier.test.ts
      - tests/unit/security/redaction-config.test.ts
      - tests/unit/dispatch.test.ts
      - tests/unit/memory-distill.test.ts
      - tests/unit/memory-hellgate.test.ts
      - tests/unit/streaming-dispatch-hellgate.test.ts
      - tests/unit/streaming-dispatch-refusal-shortcircuit.test.ts
      - tests/unit/streaming-dispatch.test.ts
      - tests/unit/integrations/github/redact-parity-hellgate-r3.test.ts
    integration:
      - tests/integration/redaction-three-application-points.test.ts
      - tests/integration/streaming-dispatch-in-progress-e2e.test.ts
      - tests/integration/streaming-dispatch-rejection-e2e.test.ts
    contract: []
knobs:
  - name: AgentConfig.redaction?.disabled
    default: 'undefined'
    purpose: '명시적 opt-out; acknowledgedRisk 없으면 startup throw'
  - name: AgentConfig.redaction?.acknowledgedRisk
    default: 'undefined'
    purpose: 'non-empty 필수 when disabled'
  - name: AgentConfig.redaction?.whitelist
    default: 'undefined'
    purpose: '구조적 override (fixture 토큰 등)'
deliberate_hold:
  reason: 'AgentOutcome.messages 는 redact 하지 않음 (host UI/state-resume 가 live transcript 기대; redaction 은 컨텐츠-평면 경계 — model/disk/distill — 에서만 동작). 또한 confidence score / threshold 도입 금지 (Layer 2 는 fixed-format regex).'
  promotion_path: 'Layer 2 매처가 RE2 / unified scanner 로 전환되거나 새로운 RedactionKind 가 추가될 때 ADR 후속.'
notes: 'PEM/OpenSSH block 매처가 첫 번째라서 block 내 임베드된 다른 시크릿은 더블-카운트 되지 않음. anthropic_api_key 매처는 negative-lookahead 로 openai_api_key 와 disjoint. openai_api_key 는 2 매처 — `sk-proj-…` (2024+ project-scoped key, mixed `_`/`-` body) 가 classic `sk-X{32+}` 보다 먼저 (order matters: proj 가 generic 앞에 와서 first-hyphen slicing 회피) — 둘 다 같은 kind 로 emit. False-positive 가드: variable name (aws_cool_test), regex literal (/AKIA[0-9A-Z]{16}/), short dotenv (API_KEY=foo), Basic Auth (Bearer 아님), git@github.com (URL userinfo 아님) 모두 unchanged.'
