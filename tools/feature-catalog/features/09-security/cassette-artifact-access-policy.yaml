id: cassette-artifact-access-policy
title: "Replay cassettes are owner-only; remote resume is KMS/prefix/retention-attested; sharing uses a separate redacted export"
section: 9
subsystem: Security — replay artifact access policy
order: 410
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: n-a
owners: ["@songmin"]
labels: [security, surface:core, tier:core]
depends_on: []
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-08-25"
  evidence:
    cli: "every recording run writes through `jsonlReplayStore`; remote runs PUT through the s3 backend"
    web: "replay recording is a bench/CLI concern; the web surface does not record cassettes"
purpose: |
  A replay cassette records the FULL LLM request: the system prompt, every message, the
  contents of every file the agent read, and every tool output. If the agent read a
  `.env`, an `~/.aws/credentials` or a private key — the very files the stale-read guard
  and the shell-effect authority exist to reason about — those bytes are in the cassette
  VERBATIM.

  Written with the process defaults, the file landed at `0644` in a `0755` directory.
  WORLD-READABLE. On a shared box or a CI runner, any local user could read every secret
  the agent ever touched. The remote half had the same shape: `aws s3 cp - s3://…` with
  no `--sse`, so encryption at rest was whatever the bucket happened to default to.

  The local fix is ACCESS POLICY on the artifact as it is: newly created managed
  directories use `0700` and the cassette/export files use `0600`.
  Remote resume has a stricter activation contract: a customer-managed KMS key ARN,
  IAM principal ARN, and maximum retention are required. Before the first remote I/O,
  a live AWS preflight binds the active caller to that principal, verifies bucket
  SSE-KMS/key pinning, all four public-access blocks, an unconditional or plain-prefix
  lifecycle expiry within the maximum, required S3/KMS access inside the exact resume
  prefix, and denial at a representative sibling prefix. The application wrapper also
  rejects every put/get/list path outside the attested prefix before backend I/O. Every PUT sends
  `--sse aws:kms --sse-kms-key-id <arn>`. The resulting attestation is embedded in
  the resume receipt and must match the current preflight before replay is eligible.
  Materialization additionally requires the receipt key/campaign/instance to match
  the requested run and an exact contiguous `0..latestSeq-1` segment set, then writes
  or re-modes the local replay cassette to `0600`.

  The file `mode` argument applies only when a file is CREATED, so file mode is re-asserted
  with `chmod` after each write — a permissions fix that only covered fresh files would
  leave every recording made before this landed world-readable forever. Arbitrary existing
  parent directories are never chmodded; a configured path may be a repository root or `/tmp`.

  The canonical cassette is DELIBERATELY NOT REDACTED. Scrubbing those bytes would destroy replay
  reproducibility — the entire point of a cassette — and would move the content hash,
  silently retiring every cassette already on disk. `eval trajectory redact` creates a
  separate owner-only, explicitly non-replayable sharing artifact using the existing
  `shared.redactValue` authority. A provenance receipt binds byte-exact source and
  export SHA-256 digests without modifying the source.
