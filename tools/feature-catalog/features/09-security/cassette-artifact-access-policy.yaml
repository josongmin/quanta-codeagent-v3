notes: |
  The hellgate asserts the OPPOSITE of a scrub: the secret is still in the file, the
  content is still one verbatim JSONL line, and `defaultHashRequest` still returns the
  same 16-hex value. Every existing cassette continues to replay.

  The rewrite path (`truncate` / curation) is asserted not to widen the mode, because it
  goes through `writeFile` rather than `appendFile`.

  Newly created managed directories are `0700`. Existing arbitrary parents are preserved
  to avoid chmodding a repository root or `/tmp`; the secret-bearing file and provenance
  receipt and downloaded replay materialization remain `0600`.

  Generic S3 users retain the AES256 floor. The resume store is the stricter consumer:
  it pins SSE-KMS and gates put/get/list behind one cached live attestation. Missing or
  failed security configuration makes `resumeActive=false` or the I/O fail closed.
  Receipt identity mismatch, a missing/interior segment, or a stale tail also forces
  a fresh run rather than a cross-instance or partial replay.
  A secondary upload/security failure permanently degrades the run; if the first
  degraded-receipt PUT fails, later appends retry it until the fail-closed marker lands.
  Resumed `record-and-passthrough` misses reuse the same local+S3 tee, initialize
  from the existing durable segment count, and advance the receipt monotonically.
  The production `run-main -> applyBenchTrajectoryMode(record)` composition also
  selects that tee on the initial resume-enabled attempt; the legacy recorder
  helper is not relied on as an unreachable durability side path.
  Curation `save` degrades the key because S3 cannot safely delete a stale tail.

  IAM `SimulatePrincipalPolicy` is a capability probe, not a universal least-privilege
  proof: effective authorization can also depend on resource policies, permissions
  boundaries, SCPs, and live request context. The v2 receipt therefore records
  `iamScopeProbePassed` and `applicationPrefixEnforced` instead of claiming global
  principal least privilege. The AWS preflight does not mint the application claim;
  only the `resumeStore` composition that installs `attestedBackend` adds it.
  Deployment policy remains an infrastructure control.

  Windows has no POSIX mode; `chmod` is a no-op there, so this is a POSIX-only guarantee
  — which matches where the store is actually used (bench boxes, CI runners, developer
  machines).
