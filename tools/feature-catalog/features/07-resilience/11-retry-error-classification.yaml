notes: |
  Backoff: exponential with full jitter, delay ∈ [0, min(15s, base·2ⁿ)],
  baseDelayMs=500, maxRetries=4. AbortSignal은 wait 중 + 시도 간 둘 다 honor.
  Mid-stream 실패는 RETHROW(이미 yield된 delta를 중복 발화하면 transcript
  오염) — pre-stream 단계만 retry.
