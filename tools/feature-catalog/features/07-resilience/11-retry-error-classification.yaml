id: retry-error-classification
title: RetryingLLM string-marker + LLMErrorKind taxonomy (RETRYABLE / FATAL / PTL)
section: 7
subsystem: 에러 분류 (Retry policy)
order: 11
maturity: L5
status: stable
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive"]
purpose: |
  `classifyLLMError`는 두 입력 — (1) 메시지 substring 매칭(RETRYABLE_MARKERS:
  429/5xx/timeout/ECONNRESET/overloaded/rate-limit/temporarily/try-again,
  FATAL_MARKERS: 4xx/auth/unauthorized/permission/malformed/not-found,
  PTL_MARKERS: prompt too long / context length / maximum context / too many
  tokens) + (2) `LLMError.kind` (overloaded/rate_limit/server_error/network이
  RETRYABLE_KINDS, not_implemented이 NEVER_RETRY) — 를 합쳐 retry/skip/PTL
  분기를 결정. FATAL_MARKERS은 RETRYABLE_MARKERS을 압도(예: "429 unauthorized"
  → fatal). PTL_MARKERS hit은 단순 retry 대신 reactive compaction으로 라우팅
  (같은 오버사이즈 prompt를 재시도해도 동일 실패). stream-timeout이 throw하는
  "timeout" wording이 RETRYABLE_MARKERS을 hit하도록 의도된 string contract.
