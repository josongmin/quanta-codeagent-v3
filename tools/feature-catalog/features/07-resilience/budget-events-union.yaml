notes: |
  Maps cleanly to `stop-category-matrix` (ADR-0073) — `budget_exhausted` event
  is the seam between propositional exhaustion detection and the typed
  StopReason returned to the loop. Trajectory consumers may filter via
  `isBudgetEvent` before persisting.
