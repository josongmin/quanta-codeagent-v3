id: budget-events-union
title: BudgetEvent closed union — tick / exhausted / clamp
section: 7
subsystem: 예산 / exhaustion 게이트 (RFC may-22 §6)
order: 52
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive"]
depends_on: [stop-category-matrix]
purpose: |
  Discriminated-union event shapes for trajectory recording. BudgetTickEvent
  (kind + delta + cumulative observed after tick) emitted at every meter
  `tick()`. BudgetExhaustedEvent (kind + budget + observed + full usage
  snapshot) fired when `checkExhausted()` first returns exhausted=true.
  BudgetClampEvent (dial + requested + cap) fired by `clampDials` when a
  requested dial exceeds the mode cap. `isBudgetEvent` type guard for
  consumer filtering. `makeClampEvent` pure factory. Pure data, no I/O —
  the meter does NOT emit these itself; consumers (loop, tests) construct
  them from `snapshot()` / `checkExhausted()` at well-known sites.
