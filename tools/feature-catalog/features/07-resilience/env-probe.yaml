id: env-probe
title: startup environment probe + graceful-degradation warnings
section: 7
subsystem: startup resilience / toolchain probe
order: 22
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: none
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive", "default-off", "cursor-absorption"]
depends_on: [assert-never-exhaustiveness]
purpose: |
  Faithful absorption of Cursor's CloudAgentStartupWarning /
  CloudAgentStartupWarningType + CloudSetupBlocker. At session start the agent
  probes its toolchain over a CLOSED declared check list (node / bun / python3 /
  git, plus a manifest-derived test runner) and produces a structured
  `StartupWarning[]` ({ kind, target, severity: info|warn, degradationHint }) so
  the agent ADAPTS — e.g. "python3 missing → skip pytest" — instead of blindly
  invoking a missing tool and failing mid-turn.

  Pure + deterministic: the runner takes an injected `ProbeExecPort`
  (`(argv) → Result<{found, version?}, ProbeExecError>`) so the detection
  shell-out is composition-wired and tests inject a fake. NO-THROW: a check
  whose exec resolves `Err` (or whose adapter REJECTS) is SKIPPED — the probe
  never throws and NEVER blocks startup; worst case returns `[]`. The only
  project fact read is the PRESENCE of a declared manifest (package.json
  `scripts.test` / pyproject.toml) — read, never guessed. NO version-threshold
  magic; `version` is advisory only.
evidence:
  code:
    - src/runtime/env-probe/types.ts
    - src/runtime/env-probe/checks.ts
    - src/runtime/env-probe/probe.ts
    - src/runtime/env-probe/index.ts
  adrs:
    - docs/decisions/0466-env-probe.md
  tests:
    unit:
      - tests/unit/env-probe-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_ENABLE_ENV_PROBE
    where: composition root (sets runEnvProbe enabled flag)
    default: "unset (OFF)"
    purpose: |
      "1" enables the probe at the composition root (sets `runEnvProbe(exec,
      { enabled: true })`). Unset / any other value ⇒ `runEnvProbe` returns `[]`
      WITHOUT touching the exec port — byte-identical to no probe.
deliberate_hold:
  reason: |
    Composition wiring deferred — the real shell-out adapter (`--version` via
    @/runtime spawn), the gate read, the manifest read (@/storage), and folding
    the resulting warnings into agent context + persisting `startup_warnings[]`
    on session state are integration steps outside this slice's file fence.
  promotion_path: |
    Wire the ProbeExecPort adapter + gate read + manifest read at
    src/apps/agent/**, fold StartupWarning[] into agent context → promote to L3.
notes: |
  Severity: warn for node/bun/git (core to most tool paths) + expected-missing
  test runner; info for python3 (python-only flows). No `error` level — the
  probe is advisory and never blocks startup. Ordering is deterministic:
  CORE_CHECKS (node, bun, python3, git) then manifest-derived test-runner
  checks.
