id: bash-timeout-cap
title: bash 도구 — timeout_ms (default 120s) + output cap + stderr-tail
section: 7
subsystem: Bash 도구 resilience
order: 16
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: partial
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive", "security-touched"]
depends_on: [sandbox-policy, assert-never-exhaustiveness, byte-stable-string-comparator, cross-slice-mirror, deferred-tool-registry]
purpose: |
  `bash` 도구는 단일 shell 실행 별로 (1) `timeout_ms` (default 120000) wall-
  clock budget — 초과 시 escalatingKill로 SIGTERM→SIGKILL 후 `timedOut`
  evidence emit, (2) MAX_OUTPUT(=30000) combined output 캡 — visible truncation
  marker, (3) STDERR_CAP(=4000) stderr-tail 캡 — dispatch 상위에서 한 번 더
  trim해 defense-in-depth, (4) HITL tier 분류(HARD_DENY는 권한 layer로 상위
  enforce; ALWAYS_CONFIRM 패턴은 curl/wget/gh api/git push|send-pack|fetch
  등 network egress + mutating git ops; 기본은 pre-approval-ok). schema에서
  `command: z.string()` + `timeout_ms?: z.number()` 만 받음 — 외부 input은
  zod로 boundary-검증.
