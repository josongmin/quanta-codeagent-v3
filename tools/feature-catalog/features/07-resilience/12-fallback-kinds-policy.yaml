id: fallback-kinds-policy
title: FALLBACK_KINDS — structured provider-swap trigger set
section: 7
subsystem: 모델 Fallback (Tier 0)
order: 12
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: partial
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive"]
depends_on: [streamreset, agent-loop-branch-hardening, response-in-progress, llm-assemble, llm-factory]
purpose: |
  Provider 교체를 trigger하는 LLMErrorKind 집합을 정책으로 박음 —
  `overloaded`(529), `server_error`(non-529 5xx), `network`(ECONNRESET/EPIPE/
  DNS), `not_implemented`(stub 어댑터, ADR-0094 Phase-1 chatgpt-oauth). 메시지
  regex가 아닌 STRUCTURED 분기 — 어댑터 boundary가 `LLMError.fromSdkError`로
  kind를 set하면 본 set는 정책. 명시적 제외: `auth`/`bad_request`/`not_found`/
  `stream_corrupt`/`aborted`/`rate_limit`(같은-턴 retry)/`unknown` — 다른
  provider도 동일 실패할 항목들. LLMError만이 trigger가 될 수 있음; unknown
  Error는 즉시 rethrow.
