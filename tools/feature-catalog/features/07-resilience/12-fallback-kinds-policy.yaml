knobs: []
deliberate_hold: null
notes: |
  RetryingLLM과 직교: rate_limit은 fallback NO (다른 provider도 막혀있을 가능성)
  + retry YES (같은 provider 백오프 후). overloaded는 fallback YES + retry NO.
  `isFallbackTrigger`는 외부 override 가능 (테스트 / 정책 튜닝용 옵션).
