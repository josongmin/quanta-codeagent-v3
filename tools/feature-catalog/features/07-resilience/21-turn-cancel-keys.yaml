id: turn-cancel-keys
title: REPL turn-cancel — Ctrl+C hard / Esc-Esc soft 2-tier
section: 7
subsystem: 사용자 cancellation gesture
order: 21
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive"]
depends_on: [repl-code-smell-cleanup, repl-interactive-surface, slashctx-6-ports-wire-completion, multimodal-image-input, shell-output-delta-streaming]
purpose: |
  CLI REPL의 cancellation 2-tier gesture wiring: (1) **Ctrl+C** → outer
  AbortController.abort() (hard exit, surface-scoped) + transient "interrupted"
  status, (2) **Esc 두 번 (2초 윈도우 안)** → turnAbort.abort() (soft cancel,
  per-turn controller) + "turn cancelled" status — 첫 Esc는 hint, 두 번째가
  실제 abort. raw mode REQUIRED — LLM이 streaming 중에도 keypress가 발화하기
  위함; 비-TTY stdin에선 no-op return. `installTurnCancel`은 disposable —
  caller가 try/finally로 호출해 terminal raw mode 복원 MUST. cognitive-complexity
  예산을 위해 `runRepl`에서 분리. 2-tier signal hierarchy(turn vs surface)는
  AgentLoop의 dual signal contract와 정확히 일치.
