notes: |
  ESC_WINDOW_MS=2000은 double-tap timing. 첫 Esc 후 다른 키가 들어오면 카운터
  리셋 — 우발적 Esc는 abort로 빠지지 않음. Hard(Ctrl+C)와 Soft(Esc-Esc)의
  분기로 "현재 턴만 취소"와 "REPL 자체 종료"가 명확히 구분 — 다른 surface는
  outer abort signal만 honor하면 같은 의미론을 받음. 현재 owner는
  `turn-cancel-install.ts` + `turn-runner.ts`이며, 옛 interactive helper는 없다.
