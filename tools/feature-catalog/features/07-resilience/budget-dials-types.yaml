notes: |
  All fields OPTIONAL by design — uncapped is the default semantics so the
  meter never embeds a price table or magic threshold. BudgetCaps reuses the
  shape (`type BudgetCaps = BudgetDials`) so structural assertions document
  the relationship. Operator-visible dial values live ONLY in
  `run-mode/presets#BUDGET_PRESETS` (no other "magic numbers" file).

