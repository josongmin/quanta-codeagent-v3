purpose: |
  16-field BudgetDials shape (maxTurns / maxWallClockMs / maxModelCalls /
  maxToolCalls / maxShellCommands / maxTestRuns / maxInputTokens / maxOutput
  Tokens / maxReasoningTokens / maxTotalTokens / maxCostUsd / maxFilesChanged
  / maxPatchBytes / maxRetries / maxConsecutiveFailures / compactionToken
  Threshold) — all optional, "absent = uncapped". BudgetCaps is the same
  shape per-mode upper bound (clampDials is the propositional intersection,
  not a heuristic). 4-verb closed BudgetExhaustionPolicy = ask-user | stop |
  stop-with-summary | emit-partial | fail-run. 12-kind closed TickKind union
  exhaustively types the meter's internal counter map. BudgetUsage snapshot
  for trajectory recording. Pure types only — no I/O, no clock, no defaults.
