knobs: ["multi-voter"]
deliberate_hold: null
notes: |
  Knob `multi-voter` (env QUANTA_MULTI_VOTER, format `<voters>` or
  `<voters>:<quorum>`) wires `voterQuorum` into `AgentConfig.branchSearch`;
  `branch-search-runner` builds the per-task voter Verifier from the session
  base LLMPort and `branch_search`'s tool composes it ALONGSIDE the tsc/test/
  lint pipeline. Requires branch-search active (knob `requires: branch-search`).

  Quorum is a quorum RULE, not a tuned threshold — no scaling, no learned cut.
  Absent env ⇒ no voter signal ⇒ branch-search scoring byte-identical.
