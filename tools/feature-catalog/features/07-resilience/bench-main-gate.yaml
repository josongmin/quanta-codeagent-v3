id: bench-main-gate
title: import.meta.main CLI-entry guard (test-import safety)
section: 7
subsystem: 진입점 격리 / 테스트 안전
order: 90
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [headless, batch]
configurable: static
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive"]
depends_on: [feature-catalog-tool, agent-cli-args-parser, assert-never-exhaustiveness, byte-stable-string-comparator, errors-helper-fix]
config_refs:
  env: ["QUANTA_BENCH_LSP", "QUANTA_BENCH_SKILLS", "QUANTA_BENCH_SUBAGENT", "QUANTA_BENCH_TIMEOUT_MS", "QUANTA_MODEL", "QUANTA_OBSERVE_DIR", "QUANTA_REPAIR_ROUNDS", "QUANTA_RUN_ID", "QUANTA_SWEBENCH_CACHE_LEVEL", "QUANTA_SWEBENCH_CLEAN", "QUANTA_SWEBENCH_CORPUS_ROOT", "QUANTA_SWEBENCH_DATASET", "QUANTA_SWEBENCH_DATASET_NAME", "QUANTA_SWEBENCH_FORCE_REBUILD", "QUANTA_SWEBENCH_MAX_WORKERS", "QUANTA_SWEBENCH_NAMESPACE", "QUANTA_SWEBENCH_PYTHON", "QUANTA_SWEBENCH_PYTHON_BIN", "QUANTA_SWEBENCH_REPO_BASE_URL"]
surface_integration:
  cli: na
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "pure import.meta.main entrypoint-isolation guard, test-safety primitive, no user affordance"
    web: "pure internal CLI-entry guard, no UI affordance"
purpose: |
  CLI entry 모듈은 `if (import.meta.main) { ... }` 가드 뒤에서만 production
  main을 실행한다. Bun은 `import.meta.main`을 *프로세스 진입 파일*에서만 true로
  세팅하므로, `import "./index"`로 모듈을 끌어다 쓰는 유닛테스트는 가짜로 main을
  발화시키지 않는다. agent/probe/bench CLI 3개 + feature-catalog CLI + swebench-matrix
  도구 모두 동일 패턴 — `bun test`가 entrypoint를 hijack해 의도치 않은 사이드이펙트
  (process.exit, network, fs)를 일으키는 회귀를 구조적으로 차단한다. 가드 내부에서만
  `process.exit(1)` + stderr fatal 출력을 호출한다.
evidence:
  code:
    - src/apps/agent/index.ts
    - src/apps/bench/index.ts
    - src/apps/probe/index.ts
    - tools/feature-catalog/cli.ts
    - tools/swebench-matrix.ts
    - src/shared/runtime-config.ts
    - src/apps/cli/help-render.ts
  adrs: []
  tests:
    unit: [tests/unit/probe.test.ts]
    integration: [tests/integration/probe.test.ts]
    contract: []
knobs: []
deliberate_hold: null
notes: |
  관용 (Bun 고유 — Node에선 `require.main === module`). `bun run` 상황에서도
  entrypoint 파일에만 true. 유닛테스트는 `bun test`가 자체 runner를 entrypoint로
  올리므로 모듈 import만으론 main이 절대 발화하지 않음. 명시적 ADR은 없으나
  test-isolation 불변식의 구조적 게이트다.
