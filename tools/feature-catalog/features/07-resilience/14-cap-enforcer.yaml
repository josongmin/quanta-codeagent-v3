id: cap-enforcer-nextaction
title: CapEnforcer — ADR-0062 3rd-channel NextAction enforcement
section: 7
subsystem: Tool-cap 강제 (3rd channel)
order: 14
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: partial
modes: [n-a]
configurable: integrated
config_refs:
  env: [QUANTA_CAP_ENFORCE]
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive"]
depends_on: [dispatch-dedup]
purpose: |
  Tool 호출이 emit하는 `NextAction`(=suggestion to grow `max_depth` /
  `max_files` / narrow `path`)을 모델이 무시하고 같은 (tool, target) 으로 다시
  호출하면 reminder를 강제 발화. `(toolName, targetPath)` 키 LRU 상태 + check/
  record O(1). NextAction.kind closed 3-arm union — 새 variant는 컴파일러 enforced
  `never` switch를 통해 발견됨. DEFAULT-OFF: `QUANTA_CAP_ENFORCE` env 또는
  AgentConfig.capEnforce가 true일 때만 instantiate, 미설정 시 dispatch는
  byte-identical. Session-scoped — 한 runAgent 인스턴스에서 턴 간 공유.
evidence:
  code:
    - src/agent/cap-enforcer.ts
  adrs: []
  tests:
    unit:
      - tests/unit/next-action-cap-enforce.test.ts
    integration: []
    contract: []
knobs:
  - QUANTA_CAP_ENFORCE
deliberate_hold: null
notes: |
  Compaction breaker(같은-prompt thrash)와 dispatch-dedup(같은-call thrash)에
  이은 3번째 anti-thrash 축. 다른 둘과 달리 STRUCTURED HINT 무시 감지 —
  hint가 emit되었다는 사실 자체가 카운터를 무는 트리거. ADR-0062 v0.dev 흡수.
