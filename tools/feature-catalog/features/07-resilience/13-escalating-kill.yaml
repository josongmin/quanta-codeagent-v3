notes: |
  KILL_GRACE_MS=2000은 UPPER_SNAKE_CASE 박힘 (runtime scanner가 bare magic
  timeout 금지). well-behaved 자식은 SIGTERM에 1초 이내 종료하므로 SIGKILL이
  실제 보내지는 일은 드묾 — 동작 변경 없음.
