id: escalating-kill
title: escalatingKill — SIGTERM → SIGKILL 2s-grace
section: 7
subsystem: 자식 프로세스 lifecycle (runtime)
order: 13
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive", "security-touched"]
depends_on: [bash-timeout-cap, sandbox-policy, disclaimer-shell-wrapper, errors-helper-fix, guarded-spawn]
purpose: |
  `proc.kill()`은 SIGTERM 1발만 보냄 — `trap '' TERM; sleep 30`처럼 TERM을
  무시/트랩하는 자식은 abort/timeout 후에도 살아남아 cancellation을 좌초시킴.
  본 헬퍼는 polite SIGTERM 직후 KILL_GRACE_MS(2000ms) 안에 미exit 시 SIGKILL
  (signal 9, untraapable) 으로 escalate. 모든 spawn 사이트(runShell /
  LocalSandbox / DockerSandbox)가 동일한 escalation을 받도록 중앙화. Timer는
  one-shot + self-clearing: 자식이 `exited`로 reap되는 즉시 `disarm`,
  finally에서 한 번 더 disarm — KILL grace timer가 자식 lifecycle 밖으로
  새지 않음. `graceTimer.unref()`로 event-loop을 grace timer가 살리지 않음.
  Re-entrant `kill()`은 SIGTERM은 재발사하되 timer는 stack되지 않음 (idempotent).
