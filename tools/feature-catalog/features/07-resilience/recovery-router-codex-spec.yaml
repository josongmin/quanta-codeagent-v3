notes: "SINGLE AUTHORITY COMPLETE (DOF-30 + SEP6-01). The 18-kind × 6-action `codexSpecRoute` table is the sole retry/fallback kind-policy source across the outer turn-recovery owner, `RetryingLLM`, and `FallbackLLM`; the decorators' former hardcoded kind sets are deleted. `isFallbackKind` is a clean projection of `fallback_provider`, and `not_implemented` remains the intentional same-provider no-retry carve-out while staying fallback-eligible. Every typed `hitl_handoff` action (`auth`, `cyber_policy`, `sandbox_error`, `sandbox_blocked`) is now decisive `no_retry`, so retry-looking free-form message text cannot repeat a request that requires user intervention. `tests/unit/retry-decorator-policy-hellgate.test.ts` covers all current HITL kinds through the real decorator with an exact one-call assertion and retains negative controls for non-HITL retry/fallback behavior. The broader DOF-30 authority work must not be reopened. `unknown`, reactive-compaction kinds, and the separate opt-in ADR-0203 errorRouting vocabulary remain outside SEP6-01 unless independently reproduced."
