id: recovery-router-codex-spec
title: RecoveryRouter port + CodexSpecRouter — 16-kind × 6-action routing table
section: 7
subsystem: LLM 에러 분류 — boundary-once
order: 12
maturity: L3
status: new
ui_surfaces: [cli]
