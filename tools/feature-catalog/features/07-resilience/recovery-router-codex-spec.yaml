deliberate_hold:
  reason: |
    Wiring into RetryingLLM/FallbackLLM is intentionally deferred. The existing
    decorators are byte-identical for the 11-kind subset. Adopting the 6-action
    envelope requires a co-designed compaction-driven retry path (the
    `reactive_compaction` arm has no current consumer in the decorator chain).
  promotion_path: |
    Follow-up to ADR-0214: wire CodexSpecRouter into agent/retry.ts +
    llm/fallback.ts; route `reactive_compaction` through the loop's
    proactive-compaction hook; route `hitl_handoff` via permission-stack
    elevation (ADR-0045/HITL-tier).
notes: |
  Coexists with ADR-0203's parallel design at `src/agent/error-routing/`
  (separate `TypedErrorKind` discriminated union with payloads, 5 actions).
  Neither slice imports the other. ADR-0214 stays in `src/llm/retry/`
  because `LLMErrorKind` is an LLM concept; ADR-0203 lives at the
  agent-loop superset level (captures non-LLM failures like sandbox/steer).
