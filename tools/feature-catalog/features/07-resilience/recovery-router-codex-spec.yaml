notes: "WIRED (DOF-30a): the live turn-recovery owner `decideOnStreamError` (src/agent/recovery.ts → `decideTypedStreamError` → `createDefaultRecoveryRouter().route(kind)`) is the production consumer; consumed by src/agent/loop.ts on every stream error. Fallback-provider classification is intentionally left to FallbackLLM before outer recovery runs — RetryingLLM/FallbackLLM decorators keep their own hardcoded kind sets, so the router is the authority at the OUTER owner only (not yet the decorator layer). Behaviour flip to note: `not_implemented` now same-turn RETRIES at the outer owner (legacy FATAL_KINDS treated it terminal) — measure-first, see tests/unit/recovery-router-consumer-wire.test.ts CHARACTERIZATION block."
