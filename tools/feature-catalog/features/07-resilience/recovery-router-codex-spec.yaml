configurable: integrated
owners: ["@songmin"]
labels: ["absorbed:codex", "surface:core", "default-off", "resilience-primitive"]
depends_on: [llm-error-taxonomy, retry-error-classification, fallback-kinds-policy]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "router seam present in CLI LLM retry path (opt-in, not yet wired)"
