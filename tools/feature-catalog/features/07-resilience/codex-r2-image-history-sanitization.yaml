id: codex-r2-image-history-sanitization
title: Image-history sanitization pipeline (ADR-0323 / 0328 / 0333 / 0337)
section: 7
subsystem: invalid_image → sanitize-and-retry, Codex `replace_last_turn_images` parity
order: 100
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: n-a
owners: ["@songmin"]
labels: ["surface:core", "absorbed:codex", "production-wired"]
depends_on: []
surface_integration:
  cli: na
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "internal invalid_image sanitize-and-retry LLM decorator, transparent recovery, no user affordance"
    web: "pure internal image-history sanitize-and-retry pipeline, no rendered affordance (image input is a separate feature)"
purpose: |
  4-ADR pipeline closing Codex `turn.rs:363-381` (invalid image →
  in-place wm mutation → retry). ADR-0323 ships `HistorySanitizationPort`
  + working-memory adapter using `wm.replace()` for mutation parity (3
  reasons closed enum). ADR-0328 ships `withImageSanitizationRetry`
  wrapping LLMPort decorator + adds `invalid_image` as 17th
  `LLMErrorKind` arm + `classifyBadRequest` markers. ADR-0333 wires the
  decorator into `createRunAgentContext` (`maybeWrapImageSanitizationRetry`
  helper, strict `enabled !== true` gate, unconditional cfg clone). ADR-
  0337 extends the port with `snapshotMessages()` sibling-method so the
  decorator re-snapshots wm BEFORE retry (closes ADR-0328/0333 stale
  `input.messages` limitation, happy path stays byte-identical).
evidence:
  code:
    - src/memory/history-sanitization/types.ts
    - src/memory/history-sanitization/port.ts
    - src/memory/history-sanitization/working-memory-adapter.ts
    - src/llm/image-sanitization-retry/types.ts
    - src/llm/image-sanitization-retry/wrapping.ts
    - src/shared/errors.ts
    - src/agent/loop.ts
  adrs:
    - docs/decisions/0323-image-history-sanitization.md
    - docs/decisions/0328-image-sanitization-retry-wire.md
    - docs/decisions/0333-image-retry-production-hookup.md
    - docs/decisions/0337-image-retry-wm-live-snapshot.md
  tests:
    unit:
      - src/memory/history-sanitization/__tests__/working-memory-adapter.hellgate.test.ts
      - src/llm/image-sanitization-retry/__tests__/wrapping.hellgate.test.ts
      - tests/unit/loop-image-retry-hookup-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: AgentConfig.imageSanitizationRetry
    type: '{enabled?, maxAttempts?, placeholder?}'
    default: 'undefined (opt-in)'
    notes: 'enabled !== true treats undefined/false/missing as off (user 1f959885 hardened the W-D draft).'
deliberate_hold: null
notes: 'Production hookup landed via user commit 1f959885 in parallel with W-D draft. ADR-0333 body documents the W-D draft vs landed diff (enabled !== true + unconditional clone). ADR-0344 negative decision (general provider wm-live) records why the decorator is the only consumer needing wm-live.'
