  v0.dev SubmitRetryBotMessage{messageId, retryModelId} 흡수 — 특정 turn을 의도적으로
  다른 모델로 재실행(불만족 응답 재시도, opus→max 자동 에스컬레이션). resolveRetryModel
  (요청 모델 우선, 없으면 ordered candidate의 다음 항목, wrapping 금지·없으면
  NoAlternateModelError), streamWithModel(leading stream_reset 후 선택 port로 재스트림).
  기존 RetryingLLM(동일 모델 transient)·FallbackLLM(provider 사망)과 명확히 구분.
