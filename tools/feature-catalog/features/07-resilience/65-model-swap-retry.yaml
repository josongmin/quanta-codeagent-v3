deliberate_hold:
  reason: |
    pickNextModel·resolveRetryModel·streamWithModel은 완성+테스트. loop/CLI의
    /retry-with <model> 명령 배선은 follow-up(// TODO(absorb #7)).
  promotion_path: 'CLI가 Message.id 키로 직전 assistant 메시지를 식별하고 resolveRetryModel→streamWithModel로 교체 재생성하면 L3.'
notes: 'stream_reset tombstone 재사용 — 누적 partial 폐기 의미론을 그대로 차용(llm/types.ts).'
