notes: |
  `contextInheritance` 기본 "system" — main history 미반영(Claude A9 fresh-thread
  의도). Default read-only allowlist는 side-conversation의 allowlist와 거의
  같지만 `request_user_input` 제외(side-chat은 비대화) + `file_tree_summary`/
  `parse_test_failure` 추가(분석 lookup용).
