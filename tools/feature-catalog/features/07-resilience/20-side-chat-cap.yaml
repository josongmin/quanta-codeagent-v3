id: side-chat-cap
title: Side-chat isolation 5-invariant — Claude Code A9 absorption
section: 7
subsystem: 격리 ephemeral agent loop
order: 20
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: partial
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive", "absorbed:claude-code"]
configurable: partial
config_refs:
  env: ["QUANTA_SIDE_"]
purpose: |
  사용자의 lookup 질문("어디서 X 정의됨?", "test 커맨드?")을 메인 대화의 history/
  working-state/cost에 섞지 않고 격리된 mini agent loop으로 처리. 5-invariant 락-인:
  (I1) caller의 `messages` 배열 NEVER 변형 — 자체 message list 구성, (I2) main
  session의 `store`/`sessionId` 비전파 — 합성 ephemeral id `side:<id>:<nonce>`,
  store:undefined로 memory가 working-state에 write 안 함, (I3) tool registry는
  read-only allowlist로 새 인스턴스 — mutating tools가 *물리적으로 부재*, 권한
  거부가 아님, (I4) `SIDE_CHAT_MAX_TURNS_CAP=5` HARD CAP — caller가 더 높이
  설정해도 capped, (I5) cost(input/output tokens)는 결과에 분리 반환 — 메인
  session의 metrics/store에는 사라지지 않음. side-conversation(ADR-0046,
  one-shot single-stream)과 subagent(ADR-0041, lifecycle-managed worktree)와
  명확히 직교.
evidence:
