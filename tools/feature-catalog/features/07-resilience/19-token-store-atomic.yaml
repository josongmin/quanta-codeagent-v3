notes: |
  RefreshCoordinator(thundering-herd guard)가 본 store를 wrap — concurrent
  refresh 시 1회만 실제 네트워크 fetch, 나머지는 같은 promise share. atomic
  rename으로 fetch-update 중간 crash 시 이전 토큰이 손상되지 않음.
