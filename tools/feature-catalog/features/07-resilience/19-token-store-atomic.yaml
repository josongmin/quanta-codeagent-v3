labels: ["surface:core", "resilience-primitive", "absorbed:codex"]
purpose: |
  OAuth refresh-token / access-token on-disk 저장: (1) tmp + rename atomic
  write로 torn JSON 방지, (2) Linux/macOS에서 `mode & 0o077 !== 0`이면
  TokenStoreError throw — world/group readable 토큰 파일은 load 대신 force
  relogin (tampering vs leak 회피), (3) `ENOENT`만 null 반환, 다른 read 실패는
  throw, (4) 부재 필드는 null/undefined 직렬화 대신 키 자체 omit (Codex
  auth-data shape 호환), (5) `expires_at`은 ISO-8601 string으로 시간대 모호성
  제거.
