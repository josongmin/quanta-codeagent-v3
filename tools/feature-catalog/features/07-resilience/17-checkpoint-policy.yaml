id: shadow-checkpoint-policy
title: ShadowOdb auto-checkpoint policy (ADR-0121)
section: 7
subsystem: Shadow ODB 복원 anchor 정책
order: 17
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive", "absorbed:codex", "absorbed:cursor"]
depends_on: [effect-channel, agent-loop-branch-hardening, agent-types-split, cap-enforcer, cfg-fourrule-true]
purpose: |
  Cline / Hermes / Codex / Cursor의 auto-checkpoint 패턴을 closed enum 4-arm
  으로 표면화 — `off`(byte-identical 기본) / `per_tool`(모든 tool-use 전,
  Cline식) / `turn_dedup`(턴당 최대 1회 destructive 직전, Hermes식) /
  `verify_success`(verify pass boundary, Codex/Cursor식). `EffectChannel`
  wrap이 anchor를 INSERT BEFORE 위임. (workspace, turnId)당 최대 1회로 dedup
  (Hermes 1-per-dir-per-turn 미러). 4-arm string union을 expand하려면 ADR
  amendment + 모든 exhaustive switch가 compile error를 강제하므로 audit-time
  결정. No-throw 보장(fail-OPEN): anchor I/O 실패는 swallowed observability
  concern, 도구 호출은 ALWAYS 실행. `DestructivenessOracle`은 DI port — 기본은
  `Tool.isReadOnly()` 신뢰, 테스트는 더 엄격한 classifier 핀가능.
