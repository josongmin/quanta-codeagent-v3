notes: |
  `shadowCheckpoint` config 부재 + `shadowOdb` 부재 + mode === "off"의 3중
  short-circuit으로 zero-cost when off. 정책 mode 자체는 closed; 신규 모드
  추가는 ADR 갱신 + 전 consumer 컴파일러가 fail-out.
