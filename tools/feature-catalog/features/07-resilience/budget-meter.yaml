id: budget-meter
title: BudgetMeter — pure cumulative per-run quantitative tracking
section: 7
subsystem: 예산 / exhaustion 게이트
order: 50
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: static
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive"]
depends_on: [stop-category-matrix]
purpose: |
  Per-run cumulative 정량 추적(토큰/턴/USD/wall-clock 등)의 pure deterministic state
  machine. NO I/O, NO clock side-effect — wall-clock 샘플링은 caller-supplied `now()`
  로 위임해 테스트 결정성 보장. 모든 gate 는 propositional: `dial !== undefined &&
  observed >= dial` 형태로 단일 분기, side-effect 없이 boolean 만 반환. ModePolicy
  의 BUDGET_PRESETS(turn/tokens/usd/wallTime) 컬럼과 연동 — 각 mode 가 자기 BudgetMeter
  인스턴스를 들고 매 턴 후 observe, exhaustion 시 typed StopReason 반환. RetryingLLM/
  FallbackLLM 과 별도 axis: 본 모듈은 *고갈* 결정, retry/fallback은 *transient* 결정.
evidence:
  code:
    - src/agent/budget/meter.ts
    - src/agent/budget/events.ts
    - src/agent/budget/types.ts
  adrs: []
  tests:
