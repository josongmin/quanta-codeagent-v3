knobs: []
deliberate_hold: null
notes: |
  Pure state machine — `now()` 주입, 모든 dial은 optional (undefined = no cap, byte-
  identical). ModePolicy(ADR-0092)의 BUDGET_PRESETS Record로 mode별 다른 dial 세트.
  RFC may-22 mode-policy 컬럼의 *수치* 축이 본 모듈로 흐름. Stop event는
  stop-category-matrix(ADR-0073)의 budget_exhausted 분기에 매핑.
