notes: |
  Pure function — no IO, no side effects — tests pin the table directly. The
  `runAgentLifecycle` variant (no controller) installs a no-op SIGINT marker
  so tests can verify install/uninstall symmetry; the controller variant is
  the production wiring used by every mode-preset. The cfg.signal is read-
  only AbortSignal by design — surfaces that want SIGINT-driven cancellation
  use the `With(controller)` entry, where the wrapper owns the controller
  and the SIGINT-to-abort plumbing lives in EXACTLY one place.
