id: outcome-exit-code-table
title: exitCodeForOutcome — AgentOutcome → POSIX exit code mapping + SIGINT lifecycle wrapper
section: 7
subsystem: 종료 코드 — outcome → POSIX (apps/agent/run.ts)
order: 22
maturity: L4
status: stable
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive"]
purpose: |
  `exitCodeForOutcome(outcome)` is the PURE function that pins the canonical
  AgentOutcome→POSIX exit-code table (the ONLY policy `apps/agent/run.ts` owns):
  `completed=0` (EX_OK), `budget_exhausted=2` (distinct from generic failure
  so a budget cap is shell-distinguishable), `aborted=130` (POSIX 128+SIGINT=2),
  `max_turns=1` / `error=1` (generic failure — caller can inspect outcome),
  `refusal=3` (ADR-0076 Gap-1 — model declined; distinct from loop-errored=1
  and task-done=0 so CI/wrapper scripts can branch). `runAgentLifecycle` +
  `runAgentLifecycleWith(controller)` are the production wiring: install a
  SIGINT handler that calls `controller.abort()`, run the loop, map via the
  table, and ALWAYS uninstall in `finally` (no leak across mode-preset
  boundaries). Distinct from `agent-cli-args-parser` (which owns the SEPARATE
  EX_USAGE=64 path on bad argv) and `batch-aggregate-exit-code` (corpus
  aggregator).
