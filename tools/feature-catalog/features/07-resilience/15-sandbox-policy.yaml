purpose: |
  Single-command 실행에 옵션 필드 5개로 confinement를 선언: `cwdJail`(작업
  디렉토리 jail — 구현체는 escape를 reject MUST), `allowNetwork`(network
  egress 거부, DockerSandbox만 실제 enforce), `envAllowlist`(통과 env 변수
  이름 정확 집합, 그 외(parent 전체 env / API 키 포함)는 drop), `maxOutputBytes`
  (combined stdout/stderr 캡), `timeoutMs`(wall-clock budget — 초과 시 자식
  kill + `timedOut` flag), `disclaimShell`(`bash --noprofile --norc` /
  `zsh -f`로 hijacked dotfile이 child env/디스크립터를 읽지 못함). LocalSandbox
  와 DockerSandbox는 같은 정책 surface로 호출, *enforcement 정도*만 다름
  (LocalSandbox는 cwdJail/timeout/output cap만; DockerSandbox는 network/env
  까지). SandboxUnavailableError로 backend-not-usable 노출 — caller가
  weaker backend로 fallback할지 결정.
