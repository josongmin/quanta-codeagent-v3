notes: |
  Hermetic test path (when `req.seams?.runAgent` is set) bypasses this catch
  entirely and routes through `exitCodeForOutcome(outcome)` directly. Live
  REPL path uses this catch because `runRepl` does NOT return a structured
  AgentOutcome — it either resolves (clean exit → 0) or throws an abort
  (interrupted → 130). The two paths agree on the {0, 130} boundary.
