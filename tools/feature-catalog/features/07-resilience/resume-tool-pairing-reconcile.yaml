notes: |
  Always-on (no knob): a dangling pair is unconditionally a provider 400, so
  the repair has no OFF arm — but it is byte-identical (same array reference)
  for the common already-valid case. Production-wired at two sites: the
  session-store write-path (`rewindToMessage` / `forkSession`) and the
  resume-fsm read-path. Sibling of codex-r2-image-history-sanitization (same
  "repair the transcript before re-sending to the provider" family); that one
  handles invalid IMAGES, this one handles dangling TOOL pairs. No dedicated
  ADR — it is a B4 follow-up extension of ADR-0323's history-sanitization
  surface (the file header tags it "ADR-0323 (extension)").
