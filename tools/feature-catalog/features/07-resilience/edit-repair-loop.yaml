knobs:
  - name: QUANTA_EDIT_REPAIR_LOOP
    default: 'unset (OFF)'
    purpose: 'exactly "1" opts a deployment in; any other value (incl "0"/"on"/"true") keeps it OFF. Unset ⇒ the dispatch seam skips both the lint repair loop and the command repair loop and never constructs the ports (no extra LLM/check calls). The pure lint-delta computer is usable independently to enrich edit output.'
  - name: AgentConfig.editRepair
    default: 'unset (defaults)'
    purpose: 'H1 named config surface (NOT an env knob — host-injected). {maxIters?: int≥1 (default 2 via resolveRepairMaxIters; invalid falls back), customInstructions?: appended to every repair prompt, command?+exec?: when BOTH set the dispatch seam runs LoopOnCommand — runs the test/build/lint command after a path-bearing edit and re-drives the fast model until exit 0 or maxIters, INDEPENDENT of the diagnostics provider}. Absent ⇒ byte-identical defaults.'
notes: |
  WIRED (H1, jun-04): the ADR-0472 integration TODOs landed. (1) lint-delta is
  appended to edit/write toModelOutput via the dispatch openLintBracket
  (src/agent/dispatch.ts), gated on QUANTA_EDIT_REPAIR_LOOP + config.diagnosticsProvider;
  (2) the post-edit loop call sites live in dispatch — the LINT loop inside the
  bracket (checkKind:"lints") AND a separate provider-independent runEditCommandRepair
  (checkKind:"command", LoopOnCommand/LoopOnTests parity); (3) maxIters +
  customInstructions are sourced from the named AgentConfig.editRepair field
  (resolveRepairMaxIters validates int≥1), and the command check is wired via
  commandRepairCheck(exec, command) from edit-repair-wire.ts. The composition root
  still injects the real fast LLM (config.llm), LSP diagnostics (config.diagnosticsProvider)
  and the command exec (config.editRepair.exec) — those are DEPLOYMENT wiring, not
  code holds. Remaining scope: apply_patch coverage (extractEditPath is edit/write
  only — multi-file patch deferred per ADR-0472).

  Port inversion is the design crux: @/agent could legally import @/llm, but the
  repair slice is a leaf, so the fast model + the check are injected as
  RepairReactorPort / RepairCheck (mirrors @/permission ClassifierPort), keeping
  the slice @/shared-only and unit-testable with spy doubles. The lint-delta uses
  a count-aware multiset diff keyed on (file,line,code,message) — NOT a magic
  threshold — so pre-existing debt is never blamed and duplicates are matched
  1-for-1. maxIters is the only bound and it is REQUIRED.
