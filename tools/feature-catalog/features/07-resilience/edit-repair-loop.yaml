id: edit-repair-loop
title: Edit-repair-loop — lint-delta + bounded fast-model repair to green
section: 7
subsystem: 회복탄력성 — 편집 후 도입된 진단(lint-delta) 부착 + 빠른 모델 반복 수리(Cursor/Codex 흡수)
order: 472
maturity: L3
status: refined
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch]
configurable: integrated
owners: ["@songmin"]
labels: ["absorbed:cursor", "absorbed:codex", "surface:cli", "tier:resilience", "default-off"]
depends_on: [agent, shared]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in CLI agent loop (dispatch.ts edit-repair seam, gated QUANTA_EDIT_REPAIR_LOOP)"
    web: "pure internal edit-quality loop (lint-delta multiset diff + bounded fast-model repair); the repair is invisible-by-design and emits no dedicated web-rendered event, no distinct UI affordance"
purpose: |
  After a model edit (edit/write/apply_patch), compute the diagnostics the edit
  INTRODUCED (post − pre, never the file's pre-existing lint debt) and attach
  them to the edit tool's toModelOutput; then, when gated ON, re-drive a fast
  edit model until the check is green (lints/named tests/command exit 0), bounded
  by a REQUIRED maxIters, feeding each failure back with per-loop custom
  instructions. Faithful to the repair loop Cursor/Codex run before handing a
  still-broken file back to the main turn. The slice (src/agent/edit-repair-loop,
  imports @/shared ONLY) owns: (1) the pure lint-delta computer computeLintDelta
  (preDiags, postDiags) → introducedDiags as a count-aware MULTISET difference,
  identity = (file,line,code,message) tuple via diagnosticKey EXCLUDING
  column/severity so a benign column shift never counts as new + renderLintDelta
  for toModelOutput; (2) the strict gate editRepairLoopEnabled (env
  QUANTA_EDIT_REPAIR_LOOP === "1", reads INJECTED env never process.env);
  (3) runRepairLoop(cfg, deps, signal) over two PORT-INVERTED collaborators
  (mirrors @/permission ClassifierPort + away-summary SummarizeFn) — RepairCheck
  (current RepairFailure | null-when-green) and RepairReactorPort (the fast edit
  model: failure + customInstructions → one applied/declined attempt). maxIters
  is a REQUIRED config field (integer ≥ 1, no magic). Every exit is a structured
  RepairLoopReport over a closed RepairStopReason union (green / exhausted /
  model-declined / check-error / aborted / invalid-config). check ∈ closed
  CheckKind {lints|tests|command}. The composition root adapts the real LSP
  diagnostics + the fast-apply-fallback side-conversation + parse-test-failure
  signal sources onto the ports — the slice imports NONE of them directly (slice
  fence; inverted as port TYPES). NO-THROW: a check throw ⇒ check-error, a
  reactor throw ⇒ model-declined; abort honoured before every port call.
  DEFAULT-OFF: flag unset ⇒ gate false ⇒ the integration site skips the loop and
  never constructs the ports ⇒ byte-identical to today.
evidence:
  code:
    - src/agent/edit-repair-loop/types.ts
    - src/agent/edit-repair-loop/lint-delta.ts
    - src/agent/edit-repair-loop/runner.ts
    - src/agent/edit-repair-loop/index.ts
    - src/agent/edit-repair-wire.ts
    - src/agent/dispatch.ts
    - src/agent/types.ts
  # 472 = base edit-repair-loop; 495 = line-shift-tolerant lint delta
  # (computeLintDeltaTolerant, extends 472 — CC 2.1.167 diagnostics line-tolerance).
  adrs: [472, 495]
  tests:
    unit:
      - tests/unit/edit-repair-loop-hellgate.test.ts
      - tests/unit/edit-repair-wire-hellgate.test.ts
      - tests/unit/edit-repair-command-loop-hellgate.test.ts
