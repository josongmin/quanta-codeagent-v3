id: session-cwd-missing-exit
title: switchToSessionCwd — fail-loud exit(1) on missing worktree on resume
section: 7
subsystem: 세션 재개 가드 — cwd 부재 진단
order: 27
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: partial
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive"]
depends_on: [repl-code-smell-cleanup, repl-interactive-surface, slashctx-6-ports-wire-completion, multimodal-image-input, runner-persist-turn]
purpose: |
  HIGH-4 fail-loud guard for the resume path. When `--resume <id>` lands on
  a session whose recorded cwd no longer exists on disk (worktree removed
  since save / external rm -rf), `switchToSessionCwd` logs a clear
  diagnostic ("Session cwd missing: <path>. The worktree may have been
  removed.") and exits 1 BEFORE the SessionDeps capture chains a stale cwd.
  Without this guard the next `process.cwd()` read silently anchors the
  session to the LAUNCH directory — every subsequent tool call routes there,
  scrambling the user's actual project state. Same-cwd short-circuit (target
  === current) is a no-op and returns current verbatim (most common path:
  resume in the same cwd). Live chdir on the changed path uses
  `process.chdir(target)` + reads back `process.cwd()` to capture the
  canonical (symlink-resolved) form. Distinct from generic argv-error exit
  (EX_USAGE=64): this is a STATE-of-disk failure, not a usage failure, so it
  uses the generic-error code (1).
