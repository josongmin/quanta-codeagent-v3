id: llm-error-taxonomy
title: LLMError 16-kind taxonomy + fromSdkError boundary classifier + classify(e) router-boundary classifier
section: 7
subsystem: LLM 에러 분류 — boundary-once
order: 11
maturity: L4
status: refined
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive"]
depends_on: [llm-not-implemented-kind, errors-helper-fix]
purpose: |
  Classify external/SDK errors EXACTLY ONCE at the adapter boundary into a
  closed `LLMErrorKind` union (16 arms after ADR-0214 Codex absorption):
  `overloaded` (529) / `rate_limit` (429) / `server_error` (5xx) / `network`
  (transport) / `auth` (401/403) / `bad_request` (400/422) / `not_found`
  (404) / `not_implemented` (deliberate stub) / `stream_corrupt` / `aborted`
  / `unknown` / `context_window_exceeded` / `cyber_policy` /
  `too_many_failed_attempts` / `thread_rollback_failed` / `sandbox_error`.

  Two boundary stages:
  - `LLMError.fromSdkError` — ADAPTER BOUNDARY: provider-aware wrap+tag.
    Touches SDK-specific shape (extracts `status` from direct +
    `.response.status`, provider code from `.error.type` / `.code` / `.type`,
    network from Node `code` against an explicit `NETWORK_CODES` set, abort
    via name=`AbortError`/`TimeoutError`). Emits one of the 11 original
    kinds today.
  - `classify(e: unknown) → LLMErrorKind` (`src/shared/error-classifier.ts`)
    — ROUTER BOUNDARY: consumes any thrown value (already-wrapped LLMError,
    raw Error, string, null, …). Honors pre-wrapped definitive `.kind`;
    otherwise runs a documented heuristic ladder (abort → context_window →
    sandbox → cyber_policy → too_many_failed_attempts → thread_rollback →
    status-based). Pure, no-throw, deterministic.

  Downstream policy (`src/agent/retry.ts`, `src/llm/fallback.ts`,
  `src/llm/retry/`) MUST branch off `kind`/`statusCode` only — NEVER off
  `message`. The prior "string-substring match on `e.message`" pattern is
  explicitly killed by this contract. `LLMProvider` is a narrow closed
  union (`anthropic` / `openai` / `chatgpt-oauth`).

  Cohabits with: `errors-helper-fix` (errMessage recursion guard) +
  `llm-not-implemented-kind` (one specific kind's retry/fallback wiring) +
  `recovery-router-codex-spec` (16-kind × 6-action routing table).
  This entry registers the umbrella taxonomy + dual-stage classifier seams.
