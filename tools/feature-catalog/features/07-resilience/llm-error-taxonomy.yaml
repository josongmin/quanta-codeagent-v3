notes: |
  Convention split: THROW (via QuantaError hierarchy) for exceptional /
  unrecoverable faults; RETURN `Result<T, E>` for EXPECTED domain failures
  (tool execution + input validation). Adapters classify once; retry +
  fallback branch on the result. Adding a new kind is a contract change —
  extend `LLMErrorKind`, the `classify()` heuristic ladder, the router
  switch (`src/llm/retry/codex-spec-router.ts`), AND the FATAL/FALLBACK
  policy sets atomically.

  ADR-0234 follow-up landed: adapter `fromSdkError` now emits the 2
  provider-emitable Codex-spec arms (`context_window_exceeded` from 400/422
  with `code === "context_length_exceeded"` or context-length markers in
  the body; `cyber_policy` from 400/422 with `permission_error` provider
  code or policy markers in the body). Precedence: cyber_policy outranks
  context_window — a refusal that ALSO mentions "context length" must
  route to HITL, not reactive compaction. The other 3 arms
  (`too_many_failed_attempts` / `thread_rollback_failed` / `sandbox_error`)
  remain layer-owned: retry layer counts its own budget, conversation-
  checkpoint owns the rollback API failure, sandbox tool layer owns its
  host-side failures. They are emitted only by `classify(e)` heuristic
  (router stage) or directly by their owning layers.

  Adapter-boundary message matching is the documented exception to the
  downstream ban on `e.message.includes(...)`: the ban targets DOWNSTREAM
  re-parsing of an already-wrapped LLMError, not the boundary that wraps
  it. Three guards keep this safe — (1) only on 400/422 status, (2)
  hellgate-pinned narrow markers, (3) safe-on-circular `lowerMessage`.
