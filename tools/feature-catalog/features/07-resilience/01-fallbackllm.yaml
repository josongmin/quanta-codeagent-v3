id: fallbackllm
title: FallbackLLM
section: 7
subsystem: 모델 Fallback (Tier 0)
order: 1
maturity: L4
status: stable
purpose: |
  `FallbackLLM` (`src/llm/fallback.ts`) — LLMPort 데코레이터. 우선순위
  순서의 provider 리스트를 받아, 현재 provider가 fallback-trigger 에러
  (overload/server_error/network/not_implemented; `FALLBACK_KINDS`
  policy로 정의)로 실패하면 다음 provider로 swap. swap 시점이 *첫
  바이트가 yield되기 전*이면 호출자에 투명(같은 turn 안에서 발견되지
  않음); 첫 chunk가 이미 흘러나간 *post-yield* 시점에 trigger가 떨어지면
  swap 대신 partial output에 tombstone을 남기고 stream을 종료한다
  (trajectory 결정성 보존, mid-stream replay 금지).
