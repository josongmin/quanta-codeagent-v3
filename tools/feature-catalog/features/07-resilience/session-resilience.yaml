knobs:
  - name: QUANTA_CRASH_RESUME
    where: src/session/crash-resume.ts (CRASH_RESUME_GATE) / src/config/knob-inventory.ts
    default: false
    purpose: §13.2 persisted interrupted-turn marker — arm crash-detect + resume offer (opt-in, default-OFF byte-identical degrade). store-health has NO knob (it is an explicit-call diagnostic, not a gated behavior).
deliberate_hold:
  reason: |
    crash-resume (§13.2) is LIVE-wired as of ADR-0528 (the L3→L4 promotion):
    `@/runner/orchestrate/crash-resume-wire` `withCrashResumeMarker` brackets the
    single live turn chokepoint `runSessionTurn` (session-turn-driver.ts:24
    imports it) and repl.ts startup calls bootstrapCrashResumeOffers +
    selectCrashResumeReinject — see the audited cli evidence string. The RESIDUAL
    deferral is narrow: store-health (§13.1, `checkSessionStoreHealth`) is still
    export-only (a /doctor-style or empty-list trigger is the follow-up), and the
    crash-resume OFFER→web card consumes the same event (web surface follow-up).
  promotion_path: |
    store-health: a /doctor-style command (or the "list came back empty AND the
    dir is non-empty" trigger) calls checkSessionStoreHealth() and renders
    report.guidance to stderr. web: render the crash-resume offer as a web card.
notes: |
  Distinct from the sibling resume-family entries: `session-cwd-missing-exit`
  guards the cwd at the resume boundary, `resume-tool-pairing-reconcile` repairs
  dangling tool pairs in a re-loaded transcript, `conversation-checkpoint`
  snapshots conversation state. This entry covers the orthogonal DURABILITY +
  STORE-HEALTH plane: surviving a HARD crash (not a clean resume) and detecting
  when the whole store — not one file — is unreadable.

  Maturity L4: crash-resume (§13.2) is real, tested (unit + a §13.2 CROWN JEWEL
  hellgate + the ADR-0528 wire hellgate), and LIVE-wired through runSessionTurn +
  repl.ts startup. store-health (§13.1) is the remaining export-only diagnostic
  (its /doctor trigger is the named residual in deliberate_hold).
