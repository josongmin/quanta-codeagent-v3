id: session-resilience
title: Session resilience — persisted crash-resume marker (§13.2) + aggregate store-health diagnostic (§13.1)
section: 7
subsystem: 세션 영속 복원력 — 하드-크래시 턴 재개 + store-level 손상 진단
order: 102
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive"]
depends_on: [session-cwd-missing-exit, conversation-checkpoint]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "ADR-0528 LIVE wiring (crash-resume), end-to-end. L1: `@/runner/orchestrate/crash-resume-wire` `withCrashResumeMarker` brackets the SINGLE live turn chokepoint `runSessionTurn` (src/runner/orchestrate/session-turn-driver.ts) — both CLI (session-loop.ts) + headless pass `sessionId`, so a real turn marks-in-progress/clears-on-resolve (markers survive only a hard process death). L2: repl.ts startup (gate-first, TTY-only) calls `bootstrapCrashResumeOffers` + `selectCrashResumeReinject(offers, setup.sessionId)` → the CURRENT session's OWN crash auto-re-injects its `resumeMessage` as turn-1 via the loop's new `seedPrompts`→`externalPromptQueue` seam (wins the prompt-source race) + clears; OTHER sessions surface-only (`--resume`). A stranger's task is NEVER injected (selectCrashResumeReinject fence, tested). A 3R adversarial audit caught the draft's dead-path (`runOnce`) wiring and forced the correction. L3 (gate QUANTA_CRASH_RESUME_PARTIAL ⊃ base): `attachCrashResumePartial` subscribes the session stream, accumulates `turn.output.delta`, and flushes the partial to the marker on each `tool.invoked` (event-driven, no polling/magic-interval) so a crash recovers in-flight progress, not just task intent. ADR-0529 shell dialect-security + powershell-snapshot are STRUCTURALLY closed as non-goals (gate is shell-agnostic; non-posix = no-snapshot degrade). store-health (§13.1) remains export-only / via `/doctor` follow-up."
    web: "no web verb; session resilience is a host/CLI restart-boundary concern with no browser affordance (offer→web card consumes the same event, ADR-0528 surface follow-up)."
purpose: |
  Two leaf durability/diagnostic modules in the `@/session` slice that sit on
  top of the existing snapshot store (no new on-disk file, no sqlite).

  1. crash-resume (`src/session/crash-resume.ts`, §13.2) — the in-memory
     `InterruptedTurnBuffer` (`src/agent/interrupted-turn.ts`, jun-08) restores
     an interrupted turn WITHIN a single process; a hard crash (SIGKILL / OOM /
     power loss) mid-turn loses that buffer entirely. This module adds the
     missing DURABILITY layer: it persists the interrupted-turn marker onto the
     session SNAPSHOT (`SessionMeta.interruptedTurn`), detects sessions that
     died mid-turn on the next restart, and rebuilds the exact resume message.
       - `markSessionInterrupted` / `clearSessionInterrupted` — best-effort
         persist / drop. NEVER throws (a marker is durability, not a correctness
         invariant — failing to write it must not break the live turn);
         last-interrupt-wins idempotent overwrite.
       - `detectInterruptedSessions` — restart-time scan of a caller-supplied
         candidate list, returns most-recently-touched first. The per-id
         SNAPSHOT is SSOT (the index is a derived cache that may lag the new
         field), so each candidate is re-confirmed; a single unreadable session
         is skipped, not propagated.
       - `buildCrashResumeOffer` / `buildCrashResumeMessage` — PURE (no I/O,
         no clock): a detection → an operator-facing offer (summary + the
         `role:"user"` resume message re-injected so the agent picks the
         interrupted work back up across the crash boundary).
     GATE default-OFF: `QUANTA_CRASH_RESUME` absent ⇒ every op is a NO-OP (no
     marker written, detection returns `[]`) so the session file is
     byte-identical to the pre-ticket shape. `env` is INJECTED (the `@/session`
     slice is env-pure — the slice-boundary guard forbids a `process.env`
     literal here); absent env ⇒ OFF (fail-safe).

  2. store-health (`src/session/store-health.ts`, §13.1) — store-level
     AGGREGATE corruption detection + operator recovery guidance. The per-file
     read path already degrades a single corrupt file to `undefined` + a warn;
     what was MISSING is the aggregate signal — when the WHOLE store is
     unreadable (disk fault, botched migration, key loss, sync conflict) the
     user just sees an empty list, indistinguishable from "no sessions yet".
     `checkSessionStoreHealth` scans `<root>/*.json` + `<root>/archived/*.json`,
     classifies each `ok | corrupt | unreadable`, and returns a verdict with
     EXPLICIT ratios (no magic threshold): `empty` (zero files), `healthy`
     (zero bad), `corrupt` (EVERY file failed — the operator-action case),
     `degraded` (some failed, some load). `buildRecoveryGuidance` is PURE and
     names the root, the corruption ratio, and concrete per-file next steps
     (file-per-session, so recovery is per-file, not all-or-nothing). It is a
     DIAGNOSTIC, not a behavior change: it never runs on the hot path (a
     `/doctor`-style or empty-list trigger invokes it), so there is no
     default-OFF byte-identity concern and no gate. NEVER throws — every fs
     error (including an invalid on-disk filename that makes the path-builder
     throw SessionIdError) is captured into the report as `corrupt`.

     Codex parity: Codex's `state db` layer surfaces aggregate persistence
     failures with explicit recovery messaging rather than degrading to an
     empty result; quanta is file-per-session (no sqlite), so the aggregate
     signal is "what fraction of the files refused to load".
