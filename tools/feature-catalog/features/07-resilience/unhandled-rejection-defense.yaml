notes: |
  Single handler at module top-level: `process.on("unhandledRejection",
  reason => logger.error(...))`. No `process.exit`, no rethrow. Mirrors the
  CLI's `main().catch(...)` which DOES call `process.exit(1)` — the
  catch-branch handles synchronous fatals at the entry boundary; the
  unhandledRejection branch handles off-axis async escapes. The two are
  complementary, not redundant.
