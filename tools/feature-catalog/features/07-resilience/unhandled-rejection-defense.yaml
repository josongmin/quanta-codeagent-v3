purpose: |
  R-Phase4 P3-1 defense-in-depth handler for promise rejections that escape
  the agent loop's `try/catch` boundaries (background MCP cleanup, off-loop
  timers, fire-and-forget logger flushes). Wired ONCE at the CLI entry
  (`src/apps/cli/index.ts`), logs to stderr via the shared logger so the
  operator sees a single diagnostic line. CRITICAL contract: deliberately
  does NOT call `process.exit` — the loop owns process lifetime, and exiting
  from this handler would lose any trajectory the loop is still finalising
  (mid-turn cleanup, JSONL recorder flush, MCP shutdown). If a rejection
  reaches this handler it indicates a contract bug somewhere; the log line
  names it so the leak source can be tracked, but the process keeps running
  so the agent can still finish gracefully. Distinct from `streaming-dispatch-
  rejection-e2e` (which sealed the streaming-dispatch slice's specific
  rejection escape) — this is the LAST-RESORT net behind ALL of them.
