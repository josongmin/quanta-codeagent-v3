id: abort-signal-compose
title: AbortSignal.any compose + chainedSignal — framework-level dual-signal hierarchy
section: 7
subsystem: 취소 신호 합성 (turn vs surface vs subagent)
order: 23
maturity: L4
status: stable
purpose: |
  Framework-level cancellation-composition primitive: `AbortSignal.any([outer,
  turn])` fuses two independent controllers (surface-level outer abort
  driven by Ctrl+C, per-turn `turnAbort` driven by Esc-Esc) into a single
  derived signal that aborts when EITHER input aborts. The legacy alternative
  (manually wiring `addEventListener("abort", …, { once: true })` between two
  controllers) is the prior shape — `AbortSignal.any` replaces it across the
  agent runtime so all five callers share identical semantics: REPL turn
  loop, oneshot driver, interactive driver, and `chainedSignal(parent, extra)`
  in subagent-runner (parent + per-task TaskRegistry signal). `chainedSignal`
  is the no-allocation fast-path — returns `parent` directly when `extra` is
  absent so the no-subagent-cancellation path stays allocation-free.
  Distinct from `turn-cancel-keys` (which owns the REPL keypress wiring
  ITSELF) and from `git-runner-cancellation-signal` (which is per-tool
  forwarding into the git child process).
