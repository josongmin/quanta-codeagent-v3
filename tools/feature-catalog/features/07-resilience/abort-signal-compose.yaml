notes: |
  Already-aborted inputs to `AbortSignal.any` produce an already-aborted
  result — the contract relies on this so a Ctrl+C arriving BEFORE a turn
  starts still cancels the next turn. The fast-path branch in `chainedSignal`
  is load-bearing: the legacy non-subagent runs MUST share the parent's
  signal directly (no fresh signal allocation per turn) to keep the no-extra
  path byte-identical to the pre-subagent shape.
