id: recovery-state-budgets
title: RECOVERY_CAPS — bounded per-turn same-turn recovery budgets
section: 7
subsystem: 동일-턴 복원 한도 (Recovery)
order: 10
maturity: L5
status: stable
purpose: |
  Per-turn recovery 4-카운터 캡을 Object.freeze 상수로 SSOT 화. 같은 턴 안의
  pre-stream backoff, output-cap continue, malformed-output retry, consecutive-
  empty-assistant retry가 무한 spin하지 못하도록 각 사유별 ceiling을 강제.
  streamRetries=3 / outputContinues=3 / malformedRetries=1 / consecutiveEmpties=2.
  소진 시 graceful degrade(finish / accept-partial)로 떨어지고 결코 loop를
  hang시키지 않음. RECOVERY_CAPS 동결 + freshRecovery() 팩토리 + RecoveryReason
  closed-union로 trajectory 분류기와 ABI 고정. RetryingLLM(pre-stream backoff)
  와는 다른 축: 본 모듈은 *턴 단위* 시도 횟수 SSOT, RetryingLLM은 *연결* 단계
  transient 재시도.
