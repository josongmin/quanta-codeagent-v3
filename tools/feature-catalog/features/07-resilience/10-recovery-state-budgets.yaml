notes: |
  RecoveryReason 7-arm closed (backoff/compact/nudge/empty/malformed/unverified/
  closeout) — trajectory 분류 / 텔레메트리는 이 유니온에 락-인. 캡 값을 바꾸려면
  소스 상수만 수정하면 되고, 모든 테스트와 trajectory consumer가 같이 갱신됨.
