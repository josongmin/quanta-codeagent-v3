id: verify-checkpoint-bridge
title: Verify-checkpoint bridge — markVerified seam (ADR-0123)
section: 7
subsystem: Shadow ODB verify-success anchor (ADR-0123)
order: 30
maturity: L3
status: refined
purpose: |
  Callable seam that turns a caller's "verify just passed" signal into a
  `markVerified` call on the shadow ODB, advancing
  `SHADOW_LAST_VERIFIED_REF` for the workspace. Opt-in side of Cursor's
  `markVerifiedV2` pattern: callers (apps/agent/run.ts, future loop hook)
  invoke `onVerifySuccess(...)` when they decide the turn is "known good".
  Plane-clean — NEVER imports `@/agent/verify-guard`. Hard invariant:
  NO-THROW — every failure inside `markVerified` (uninitialized, spawn-
  failed, git-failed) is swallowed silently; the verify gate is
  unaffected. Default-OFF: when `odb === undefined`, every call is a
  no-op, so the caller can wire the bridge unconditionally.
