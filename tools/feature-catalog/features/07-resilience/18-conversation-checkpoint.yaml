id: conversation-checkpoint
title: ConversationCheckpoint — message-level resume + restore
section: 7
subsystem: Crash / cancel 복원
order: 18
maturity: L4
status: stable
owners: ["@songmin"]
labels: ["surface:core", "resilience-primitive", "absorbed:claude-code"]
depends_on: [shadow-checkpoint-policy, verify-checkpoint-bridge]
purpose: |
  Per-message conversation checkpoint — 같은 session 내에서 특정 message id로
  rewind + restart. AgentLoop이 destructive tool dispatch 전후로 checkpoint를
  emit하면, surface가 `rewindToMessage(id)`로 transcript을 truncate하고 같은
  세션에서 이어 실행. hellgate suite는 (a) snapshot한 위치 이전에 emit된
  effect가 leak하지 않음 (b) rewind 후 같은 toolUseId로 재dispatch해도 dedup이
  올바르게 트립 (c) verify-checkpoint-bridge가 verify-success boundary에서
  checkpoint를 anchor로 promote 같은 적대 케이스를 봉인.
