    # (a) header capture — OPTIONAL `onResponseHeaders` success-path hook on
    #     StreamInput, consumed by the REAL adapters: Anthropic via
    #     `.withResponse()` (absent ⇒ plain await, byte-identical), OpenAI
    #     Responses via the raw fetch `Response.headers` after success validation.
    - src/llm/types.ts
    - src/llm/adapters/anthropic.ts
    - src/llm/responses-stream.ts
    # (b) pre-request delay — per-run store + injected clock/sleep minted in
