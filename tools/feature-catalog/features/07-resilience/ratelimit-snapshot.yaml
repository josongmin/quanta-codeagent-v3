    #     `proactiveDelayMs(store.current())` BEFORE the stream (empty-bucket only)
    #     and emits the `ratelimit_snapshot` notice; the same turn wires the
    #     capture hook to feed `parseRateLimitSnapshot` → store.
    - src/agent/loop.ts
    - src/agent/turn-context.ts
    - src/agent/types.ts
    # (c) the no-leak notice as a transient, NON-accounting AgentEvent.
    - src/stream/types.ts
