id: connector-availability-probe
title: Connector availability probe — DNS + HEAD + LRU (ADR-0160 W7 Phase D)
section: 9
subsystem: Connectors / availability (ADR-0160)
order: 63
maturity: L2
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
config_refs:
  env: []
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: [connector-token-rotation, connectors-rest-registry, oauth-dynamic-discovery, oauth-dynamic-registration]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 3/3 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure internal DNS/HEAD availability probe port with LRU cache; no UI affordance on any surface"
purpose: |
  `createAvailabilityProber({fetchPort, dnsPort, clockPort, lruSize?,
  lruTtlMs?, headTimeoutMs?})` — per-host availability probe with LRU cache.
  Probe sequence: DNS resolve (typed `DnsPort`) → empty array → "dns-fail";
  then HTTP HEAD to `https://{host}/` via injected `FetchPort` with a 3s
  timeout (RFC 9112 conservative default). Server reachable iff response
  status 100..499 (handles HEAD 405 method-not-allowed servers as reachable);
  5xx → "http-fail"; AbortController signal → "timeout". LRU 5min TTL
  (Cursor observed window). Recency-touch on hit (insertion-order Map
  trick). Concurrent probes per same host coalesce to one network call
  (in-flight dedupe). Closed verdict arm: ok / dns-fail / http-fail /
  timeout — caller branches exhaustively. Config validation: <=0 knobs
  throw at construction (no silent default-to-1).
evidence:
  code:
    - src/connectors/availability.ts
    - src/connectors/availability-prober.ts
    - src/connectors/types.ts
  adrs: ["docs/decisions/0160-connectors-rest-api.md"]
  tests:
    unit:
      - tests/unit/connector-availability-hellgate.test.ts
      - tests/unit/connectors-availability-lru.test.ts
    integration: []
    contract: []
knobs:
  - name: lruTtlMs
    where: createAvailabilityProber config
    default: 300000
    purpose: "Cursor observed window — 5 min per-host verdict cache"
  - name: lruSize
    where: createAvailabilityProber config
    default: 128
    purpose: "LRU cap"
  - name: headTimeoutMs
    where: createAvailabilityProber config
    default: 3000
    purpose: "RFC 9112 conservative HEAD timeout"
deliberate_hold: null
notes: |
  Phase 1 (2026-05-25). 흡수 출처: Cursor per-host availability LRU 5min
  (memory R4). Hellgate 12 cases + unit 8 cases. Negative invariant: silent
  empty-DNS array MUST NOT be treated as DNS success (HELL-4 verifies HEAD
  is NOT called when DNS returns []). Why not GET? HEAD avoids body download
  for liveness; servers that reject HEAD with 405 are still classified
  reachable per HELL-2.
