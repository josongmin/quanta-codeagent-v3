id: run-ledger
title: ADR-0395 unified long-running-work state model (Run Ledger)
section: 9
subsystem: Run Ledger / unified long-running work (ADR-0395)
order: 395
maturity: L3
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:cli"]
depends_on: []
purpose: |
  ONE state model + closed `RunLedgerPort` + in-memory store so a single
  surface can render Running / Waiting / Completed across ALL long-running
  work, replacing the three disjoint shapes quanta uses today: shell-detached
  (`{shellId, status:"running"}` resumed via `bash_await`/`bash_kill`),
  subagent background (`TaskStatus` resumed via `task_output`/`task_stop`), and
  MCP tasks (poller).

  State model: `RunKind = shell|subagent|mcp_task|exec`,
  `RunStatus = running|waiting|completed|failed|stopped`,
  `WaitingOn = user|tool|network|child_agent`, plus `RunArtifact`
  (`log|stdout|summary|file` + ref) and a fully-readonly `RunEntry`
  (caller-supplied `id` correlates to shellId/task_id/mcp id; `owner`, `title`,
  `startedAt`, `lastEventAt`, optional `waitingOn`/`resumeAction`/`error`).

  Closed port: `start`/`touch`/`settle`/`get`/`list`/`running`/`waiting`/
  `toSnapshot`/`fromSnapshot`. EVERY method is NO-THROW (unknown id ⇒ null).
  `now` clock seam injected. Invariants: `start` ⇒ status=running &
  lastEventAt=startedAt; `touch` bumps lastEventAt + applies status/waitingOn/
  artifact (no-op on settled); `settle` idempotent; bounded retention —
  SETTLED entries LRU-evicted by oldest lastEventAt past `maxRetained`
  (default 256), ACTIVE (running/waiting) entries NEVER evicted (mirrors
  TaskRegistry policy). Returns frozen so a reader cannot corrupt state.

  THIS WAVE IS MODEL-ONLY. Self-contained pure slice — imports nothing from
  `@/agent` core, `@/apps`, `@/subagent`, `@/tool`, `@/mcp`. Wave 2 adapts
  bash/subagent/mcp to report INTO this ledger; nothing here calls into them.
evidence:
  code:
    - src/agent/run-ledger/types.ts
    - src/agent/run-ledger/store.ts
    - src/agent/run-ledger/index.ts
  adrs: [395]
  tests:
    unit:
      - tests/unit/run-ledger-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: maxRetained
    where: createRunLedger({ maxRetained })
    default: 256
    purpose: Upper bound on retained SETTLED entries before oldest-lastEventAt LRU eviction. Active runs never count toward the cap and are never evicted.
  - name: now
    where: createRunLedger({ now })
    purpose: Injected clock seam stamping startedAt/lastEventAt. Defaults to Date.now; tests supply a monotone counter for determinism.
deliberate_hold:
  reason: |
    MODEL-ONLY wave. The state model + port + store exist and are hellgate-
    proven, but no slice reports into the ledger yet — by design, so this wave
    is byte-identical / default-OFF and cannot regress existing behaviour.
  promotion_path: |
    Wave 2 adapts the three long-running-work sources to report into the
    ledger: bash-detached (`bash_await`/`bash_kill` → start/touch/settle on the
    shellId), subagent background (TaskRegistry transitions → ledger), and the
    MCP task poller (mcp task id → ledger). Once wired and surfaced in a UI,
    promote to L4 with monitoring + ui_surfaces.
notes: |
  Retention policy intentionally mirrors `src/subagent/registry.ts`
  (`TaskRegistry`): active set never evicted, settled set bounded by oldest-
  timestamp LRU. Caller-supplied ids are the seam that lets the ledger stay
  fence-clean — it never imports the source slices to learn their id schemes.
