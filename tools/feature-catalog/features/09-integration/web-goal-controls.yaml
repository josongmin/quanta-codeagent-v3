surface_integration:
  web: full
  method: audited
  verified: "2026-09-01"
  evidence:
    web: "The browser consumes one generated canonical Goal contract for HTTP reads and default-ON typed goal.state pushes. It exposes show/create/work/pause/stop/resume/edit/clear/abandon/budget/unblock/criterion add+done/check add/verify; persistent state includes freshness, absolute wake scheduling, and the latest authority settlement summary. Real TCP-WebSocket E2Es prove initial snapshot, mutation push, reconnect replay, lifecycle mutation, policy refusal, rich identity, stale-write rejection, and verifier receipt commit against the live authority."
purpose: |
  Provides the browser's complete `/goal` control surface without introducing a
  second objective store or parsing rendered text as state. Structured readout
  data preserves objective, blocker, criterion and check identities; mutations
  use viewed-revision CAS and exact command correlation; checked criteria can be
  completed only through the shared host verifier. Every goal read first reconciles
  current source through that verifier and returns a closed freshness state; the
  host masks unresolved checked completion instead of asking the browser to infer it.

  The default-ON Goal bar is independent of the default-OFF observability pane.
  Its cache is a changed-only projection with reconnect replay, not another
  completion or settlement store; absolute wake time avoids daemon countdown ticks.
