notes: |
  CLOSED 2026-06-02 (tool.diff agent-seam wire-finish): BOTH canvas channels
  now light up under QUANTA_WEB_CANVAS=1. The prior deliberate-hold (no live
  agent-seam binding for tool.diff) is RESOLVED via the promotion path's
  facade-exposed tool-diff source. The file-mutating tools (write/edit) hand
  their pre/post file text — the bytes they ALREADY have, NO recompute, NO
  extra read on the gate-OFF path — to the duck-typed ToolDiffSink on
  ToolContext (src/tool/types.ts). The dispatch seam surfaces it + the
  dispatched ToolUseBlock.id ONLY when AgentConfig.onToolDiff is set; the
  web-daemon composition root binds it ONLY under the SAME QUANTA_WEB_CANVAS
  gate (runtime-factory mints createCanvasToolDiffSource → facade.canvasToolDiff
  → index.ts#buildCanvasPorts.toolDiffSource → per-connection feedToolDiff). The
  line-diff math + binary probe + caps still run exactly ONCE inside
  feedToolDiff. Slice fence: @/tool never imports @/apps/web-daemon (the sink is
  a duck-typed mirror); canvas-tool-diff-source.ts imports neither @/agent nor
  @/apps/cli. Default-OFF: gate unset ⇒ onToolDiff never wired ⇒ tools capture
  nothing, no extra read, byte-identical. 7 new hellgate cases
  (tool-diff-capture-hellgate.test.ts).
  Negative invariants: (a) agent-authored .canvas.tsx code-execution sandbox
  NOT introduced (future RFC); (b) diff math NEVER duplicated in the web
  bundle (frontend receives DiffLineData[] only); (c) chat path
  (MessageBubble/ChatPanel) import-unchanged; (d) no hardcoded hex in
  components (all colors via tokens.ts); (e) WebDaemonConfig (shared types.ts)
  untouched — server widens config locally via WebDaemonServerConfig.
  19 daemon hellgate cases (codec round-trip + reject, diffOpsToLines lossless,
  binary/truncated/gutter, verbatim usage, gate-OFF byte-identical,
  snapshot-on-connect, per-push delta, detach-freeze, two-conn independence,
  NO-THROW hostile send) + 7 frontend test files.
  DOF-40 (2026-07-17, fail-closed hardening): the canvas SHARED fan-out
  (`*-source.ts` capture → subscriber Set) previously swallowed a throwing
  subscriber (a dead/throwing WS `send` on a LIVE connection) with a bare
  `catch {}` — ISOLATED from siblings but SILENTLY starved (zero operator
  signal). New `canvas-fanout.ts#fanOutIsolated` keeps sibling isolation AND
  makes the failure OBSERVABLE: each source gains an optional
  `onSubscriberError` seam + a `failureCount()` health counter; the
  per-connection `canvas-emitter.ts` gains a matching `onSendError` +
  `sendFailureCount()` so a throwing `ws.send` is surfaceable (not just
  swallowed) before the turn continues. Default-OFF byte-identical: no
  observer injected (current composition-root call sites pass none) ⇒ legacy
  swallow, siblings still fed, `capture`/`emit` never throw. A hostile
  observer never breaks the fan-out/turn (defense-in-depth swallow). 17
  hellgate cases (canvas-fanout-failclosed-hellgate.test.ts): isolation,
  index+message surfacing, snapshot-under-mutation, hostile-observer,
  per-event backpressure (100 events × 3 subs, 1 always-dead → siblings get
  all 100, 100 failures counted), OFF byte-identical, emitter send-throw.
  Composition-root observer wiring is a FOLLOW-UP (server.ts is off-limits) —
  the load-bearing deliverable is the surfaceable seam + counter; today the
  seam is unconsumed so production is byte-identical.
