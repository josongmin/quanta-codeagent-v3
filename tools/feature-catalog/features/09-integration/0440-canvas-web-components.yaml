    integration: []
    contract: []
knobs:
  - name: QUANTA_WEB_CANVAS
    default: 'off'
    purpose: 'eagerly mint the facade + wire onPromptAssembled → canvas usage source + attach the per-connection canvas WS sink (DiffView/UsageBar render-side data)'
deliberate_hold:
  reason: |
    The context.usage channel is wired LIVE end-to-end (facade source →
    onPromptAssembled → WS → useContextUsage → UsageBar). The tool.diff
    channel's protocol + emitter (feedToolDiff) + useToolDiffs hook + DiffPanel
    are fully wired and tested, but the live agent-seam binding that surfaces a
    tool's before/after file text does not yet exist, so no tool.diff frame is
    emitted in production yet.
  promotion_path: |
    Add a daemon-reachable seam that delivers a mutating tool's before/after
    file text (e.g. a post-tool hook carrying pre/post content, or a
    facade-exposed tool-diff source mirroring canvasUsage). Wire it to
    CanvasEmitterHandle.feedToolDiff in runtime-factory.ts under the SAME
    QUANTA_WEB_CANVAS gate; the protocol + frontend consumer need no change.
notes: |
  Negative invariants: (a) agent-authored .canvas.tsx code-execution sandbox
  NOT introduced (future RFC); (b) diff math NEVER duplicated in the web
  bundle (frontend receives DiffLineData[] only); (c) chat path
  (MessageBubble/ChatPanel) import-unchanged; (d) no hardcoded hex in
  components (all colors via tokens.ts); (e) WebDaemonConfig (shared types.ts)
  untouched — server widens config locally via WebDaemonServerConfig.
  19 daemon hellgate cases (codec round-trip + reject, diffOpsToLines lossless,
  binary/truncated/gutter, verbatim usage, gate-OFF byte-identical,
  snapshot-on-connect, per-push delta, detach-freeze, two-conn independence,
  NO-THROW hostile send) + 7 frontend test files.
