notes: |
  LIVE (jun-06 catalog truth-up — the prior "PORTS ONLY / apply-patch.ts NOT
  modified" hold reason is STALE). The promotion path is DONE (ADR-0421
  wire-finish): `wireOptionalAgentPorts` builds the fallback under
  `QUANTA_FAST_APPLY=on` (`optional-ports.ts`), `dispatch.ts` threads it into
  `ToolContext`, and `src/tool/apply-patch.ts:315` actually calls
  `fallback.attempt(...)` on a typed apply failure (reads `ctx.fastApplyFallback`
  at :371). Default-OFF still byte-identical (absent slot ⇒ pre-ADR path).
  ADR-0417 absorption gap A2. The patch-block extraction is a concrete
  substring scan (`indexOf` Begin/End) — no fuzzy parsing, no heuristic
  repair (per [[no-heuristics-only-validated]]). One attempt only; no retry
  loop in the port (a retry policy is a caller-side decision).
