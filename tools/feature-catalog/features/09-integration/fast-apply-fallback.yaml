id: fast-apply-fallback
title: Apply-patch fast-apply fallback (focused re-emit on failure)
section: 9
subsystem: Apply-patch recovery (ADR-0417 gap A2)
order: 4171
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "default-off", "ports-only"]
depends_on: []
purpose: |
  When `apply_patch` rejects a V4A patch (anchor drift / generic apply error /
  parse error), `createFastApplyFallback` makes ONE focused side-conversation
  attempt to re-emit the patch. It builds a prompt that names V4A explicitly,
  states the prior failure (errorKind + errorMessage), folds in an optional
  source-file snapshot for re-anchoring, and asks for ONLY the corrected
  patch. The reply is scanned for a complete `*** Begin Patch` … `*** End
  Patch` block.

    - complete block found ⇒ `{ ok:true, newPatch, modelUsed }`
    - prose / no block / truncated (Begin but no End) ⇒
      `{ ok:false, newPatch:null, rationale }` (never a half patch)

  The fast executor model is chosen via the injected resolver
  `roleResolver.resolve("executor", defaultModel)` (Roo-style per-role
  selection); on a role miss the resolver returns `defaultModel`.

  Slice fence: types + `@/shared` only. The two collaborators are DUCK-TYPED
  (`RoleResolverLike` / `SideConversationLike`) so there is NO import edge to
  `@/llm` (role-model-override) or `@/tool/apply-patch`. NO-THROW at the port
  boundary: a resolver throw, a dispatch throw, a non-ok dispatch, or an
  already-aborted signal all collapse to `{ ok:false, newPatch:null,
  rationale }` with a non-empty rationale.
evidence:
  code:
    - src/agent/fast-apply-fallback/types.ts
    - src/agent/fast-apply-fallback/runner.ts
    - src/agent/fast-apply-fallback/index.ts
  adrs: [417]
  tests:
    unit:
      - tests/unit/fast-apply-fallback-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: defaultModel
    default: 'caller-supplied'
    purpose: 'model used when the role resolver has no executor override'
config_refs:
  env: []
deliberate_hold:
  reason: |
    PORTS ONLY this wave. The `AgentConfig.fastApplyFallback` slot is present
    but inert — no consumer triggers it. `src/tool/apply-patch.ts` is
    deliberately NOT modified (keeps blast-radius small + avoids collision
    with sibling worktrees + user in-flight). Default-OFF: absent slot ⇒
    byte-identical to the pre-ADR path (RFC §1.2).
  promotion_path: |
    A follow-up ADR (1) builds the composition-root adapter mapping the real
    `RoleModelResolver` + `dispatchSideConversation` onto `RoleResolverLike` /
    `SideConversationLike`, and (2) wires `apply-patch.ts` to call
    `attempt({ failure, sourceFile, sourceContent })` on a typed apply failure
    BEFORE surfacing the error to the loop, re-attempting `apply_patch` with
    `newPatch` when `ok:true`.
notes: |
  ADR-0417 absorption gap A2. The patch-block extraction is a concrete
  substring scan (`indexOf` Begin/End) — no fuzzy parsing, no heuristic
  repair (per [[no-heuristics-only-validated]]). One attempt only; no retry
  loop in the port (a retry policy is a caller-side decision).
