purpose: |
  Agent 슬라이스가 LSP 어댑터(TypescriptAdapter / PyrightAdapter)와 만나는 단일
  bridge — 파일 확장자 → adapter 라우팅 + lsp-nav 도구(definition/references/hover/
  symbols) 어셈블리 + diagnostics 채널 와이어업. LspPort 계약은 lsp 슬라이스 SSOT,
  본 모듈은 *언제 어느 adapter를 깨우고 도구로 노출* 할지의 agent-측 와이어업.
  `may-20-codex-lsp.md` 흡수(ADR-0015) 의 agent-측 절반 — adapter 자체는 lsp 슬라이스,
  bridge가 agent로 끌어옴. tool-routing-matrix(ADR-0022)에서 lsp_* 도구가 본 bridge
  를 경유.
