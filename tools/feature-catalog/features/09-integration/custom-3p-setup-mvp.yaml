    integration: []
    contract: []
knobs:
  - name: jsonl path
    where: createJsonlCustom3pRegistry config.path
    default: "~/.quanta/connectors/custom-3p.jsonl"
    purpose: per-user provider registry persistence (caller-injectable for tests)
  - name: file mode
    where: jsonl-store.ts internals
    default: 0o600
    purpose: secret-bearing rows — owner-only read/write
  - name: dir mode
    where: jsonl-store.ts internals
    default: 0o700
    purpose: parent ~/.quanta/connectors — owner-only traverse
deliberate_hold:
  reason: |
    OAuth authorization-code browser-redirect full flow (Phase 2 — hooks
    into existing src/auth/chatgpt-oauth/ once surface ships).
    19 additional Claude Desktop methods reachable via composition of
    ADR-0151 / 0160 / 0163 — explicitly NOT re-implemented.
    Concurrent multi-process write coordination (single-flight contract
    this MVP).
    Telemetry opt-in metadata (observability slice owns the emit surface
    — separate ADR).
  promotion_path: |
    Documented in ADR; wire when ROI concrete.
notes: |
  R0 absorption (2026-05-25). Source: Claude Desktop 1.7196.3 catalog
  (memory `claude-desktop-1-7196-catalog`) + R2 absorption gap memo
  (`claude-desktop-tier0-absorption-r2`). Wire-up into AgentConfig +
  CLI `/connector add` + Web settings panel is downstream. fc number
  matches ADR (245). 15-case hellgate + secondary 2-arm exhaustive on
  ProviderKind. Default-OFF byte-identical confirmed via barrel
  inspection. Slice fence verified — touches `src/connectors/custom-3p/`
  + tests + ADR + catalog only. Constraint-respected: src/agent/,
  src/memory/, src/scheduler/, src/observability/, src/tool/,
  src/runtime/, src/realtime/, src/radar/, src/mcp/, src/media/
  unchanged.
