id: custom-3p-setup-mvp
title: Custom 3P Setup MVP — 5 core method + lifecycle (ADR-0245)
section: 9
subsystem: Custom 3P Setup (ADR-0245) — closed-port user-declared provider registry
order: 245
maturity: L2
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core"]
depends_on:
  - connectors-rest-registry
  - oauth-dynamic-discovery
  - oauth-dynamic-registration
  - connector-token-rotation
config_refs:
  env: []
surface_integration:
  cli: missing
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "src evidence not reachable from the interactive CLI entry (src/apps/cli/index.ts) — wired only into other apps (eval/bench/probe/headless) or unwired"
    web: "User-facing mechanism (provider register/health) is unwired; no /connector slash or web settings panel; not reachable from web-daemon; does not reach the browser."
purpose: |
  Claude Desktop `Custom3pSetup` 24-method IPC namespace 의 MVP 5 core
  method 흡수: register / update / remove / health / list + 4-state
  lifecycle (draft → configured → healthy → failing). 19 method 는
  ADR-0151 (OAuth discovery + dynamic registration) / ADR-0160 (REST
  catalog + 24h cache) / ADR-0163 (token rotation + multi-cloud) 의
  composition 으로 이미 흡수됨 — deliberate hold. 슬라이스 구조: closed
  `Custom3pRegistry` 포트 + canonical `InMemoryCustom3pRegistry` +
  `JsonlCustom3pRegistry` (~/.quanta/connectors/custom-3p.jsonl, file
  0600 / dir 0700) + headless stub (throw `unsupported` from mutators) +
  pure `healthProbe(spec, deps)` (fetchPort/dnsPort/clockPort 주입).
  `register()` 는 항상 draft 에 착지; `update()` advances draft →
  configured; `health()` advances → healthy | failing (verdict 기반).
  `ProviderKind = "mcp" | "llm"` 닫힌 union — exhaustive switch 강제.
  `HealthResult.verdict = ok | dns-fail | http-fail | auth-fail |
  timeout` 닫힌 arm. `src/connectors/index.ts` 는 custom-3p 를 재-export
  하지 **않음** — 호출자 가 `@/connectors/custom-3p` 직접 import 해야
  default-OFF byte-identical 계약 유지. src/mcp/ UNCHANGED.
evidence:
  code:
    - src/connectors/custom-3p/types.ts
    - src/connectors/custom-3p/port.ts
    - src/connectors/custom-3p/in-memory-registry.ts
    - src/connectors/custom-3p/jsonl-store.ts
    - src/connectors/custom-3p/headless-stub.ts
    - src/connectors/custom-3p/health-probe.ts
    - src/connectors/custom-3p/index.ts
  adrs:
