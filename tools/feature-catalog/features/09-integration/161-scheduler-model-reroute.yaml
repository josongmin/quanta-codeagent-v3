purpose: |
  `chooseModel({preference, fallbacks, availability})` probes
  `[preference, ...fallbacks]` in order against the injected
  `ModelAvailabilityPort` and returns the first available model OR
  `"all-unavailable"` (with `chosen: preference` so the caller preserves
  intent in the error path).

  Three closed reason arms:
    - `"preference-available"` — preference probed OK.
    - `"fallback"` (+ `fallbackIndex`) — preference unavail, Nth fallback OK.
    - `"all-unavailable"` — chain exhausted; runtime transitions automation
       to `error`.

  Probe deduplication: a model appearing in both preference and fallbacks
  is probed exactly once. A throwing `isAvailable` is treated as
  unavailable — no exception leak. Empty preference is the "no choice"
  sentinel returning `all-unavailable` without probing.

  This mirrors Codex `localConversation.modelRerouted.*` warning channel
  ([[extracted-source-novel-findings-2026-05-24]] line 415): when a
  preferred model is unavailable, fallback chain probed in order + a
  warning recorded naming which fallback was used.
