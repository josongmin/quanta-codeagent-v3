notes: |
  Per-slice deny-lists are CONSERVATIVE: each test denies only those
  upward + peer slices that would actually create cycles or violate
  layering. Existing legitimate cross-slice imports (e.g.
  `@/storage/shadow-odb` → `@/tool/git` GitRunner port; `@/session/*` →
  `@/llm` Message types; `@/session/git-fingerprint` → `@/tool/git/types`)
  are preserved by not denying the parent prefix at all (e.g. storage
  test's deny-list omits `@/tool` since one file uses the `@/tool/git`
  port — biome's exact-match `paths` rule blocks bare `@/tool` already).

  Named per-file allowlists (S4 baseline):
   * @/agent  — `admissibility-gate.ts`, `hitl-tier-registry.ts` (stderr
     last-resort warns; logger would itself depend on stderr).
   * @/tool   — `runner.ts`, `from-env.ts` (env-as-spawn-input pattern).
   * @/permission — `json-state-file.ts` (stderr last-resort during init).
   * @/memory — `consolidate/store.ts` (malformed-row stderr warn).
   * @/subagent — `handlers-6.ts` (exec_command env merge).
   * @/skill — `discover.ts` (console.warn for unreadable SKILL.md;
     leaf-slice cannot import structured logger).
   * @/observability — `logger.ts` (THE structured-logger primitive;
     default sink writes stderr), `console-sink.ts` (deliberate stderr
     sink exposed as opt-in).
   * @/mcp — `client.ts` (process.env.PATH for MCP server spawn).
   * @/storage — `default.ts` (process.env.HOME shadow-ODB default path).
