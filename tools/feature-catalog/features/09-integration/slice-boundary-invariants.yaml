id: slice-boundary-invariants
title: 10-architecture-invariant slice-boundary runtime guards (16 slices)
section: 9
subsystem: Architecture enforcement (S4 hardening)
order: 20
maturity: L4
status: new
purpose: |
  Each library slice now has a `<slice>-slice-boundary.test.ts` runtime
  guard enforcing 10 invariants (surface isolation, per-slice deny-list,
  process.env/argv ban, raw stdio ban, console.* ban, alt-runtime env ban,
  surface-coupled node module ban, node:process named-import ban, slice
  barrel presence, file-count sanity). Previously only `@/runner` and
  `@/ipc` had runtime guards — the other 14 slices were enforced by biome
  lint only, which catches imports but NOT `process.env` / `process.std*` /
  `console.*` / alt-runtime env regressions. Each test carries an explicit
  NAMED allowlist (no silent regex carve-outs); new exceptions must add a
  filename + justifying comment.

  Companion biome.json deltas:
   * Added `noRestrictedImports` overrides for the 7 previously-unguarded
     slices: `@/auth`, `@/rules`, `@/security`, `@/patch`, `@/git`, `@/ui`,
     `@/shared` (the leaf — denies every `@/*` peer).
   * Promoted `noConsole` from `warn` → `error` globally; per-file
     `noConsole: warn` override for the 6 known-OK paths (apps/eval,
     tests/smoke/swebench/select, tests/integration/plan-mode-stress-100k,
     tests/contract/_guard, tests/unit/round4-hardening,
     tests/unit/skill-discover-size-cap).
