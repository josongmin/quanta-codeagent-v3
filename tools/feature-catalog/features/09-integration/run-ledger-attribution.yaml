id: run-ledger-attribution
title: ADR-0401 Run-ledger attribution via hook bus (bash/subagent/mcp observer)
section: 9
subsystem: Long-running work observability (ADR-0395 wave-2)
order: 397
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless, batch, daemon, ide]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "default-off"]
depends_on: [run-ledger, hookbus]
purpose: |
  Wave-2 wiring for the wave-1 Run Ledger (ADR-0395). `@/agent/run-ledger` is
  a pure store; this slice plugs INTO the in-process `HookBus`
  (`src/agent/hooks.ts`) `post_tool_use` event and translates observed tool
  outputs (bash background/await/kill banner, agent background launch
  banner, task_output/task_stop, get_mcp_task / cancel_mcp_task) into
  `start` / `touch` / `settle` ledger actions.

  Closed contracts:
    - `LedgerAction` — three arms (start / touch / settle) mirroring
      `RunLedgerPort`.
    - `LedgerMatcher.match(event)` — pure (no-throw, no side effects)
      `(name,input,output,ok) → LedgerAction | null`.
    - `createRunLedgerHookSubscriber({ledger,matcher?,owner?})` — returns a
      `(event) ⇒ void` closure the composition root subscribes to the
      `post_tool_use` event.

  Slice fence: imports ONLY `@/agent/run-ledger` (type imports) + `@/shared`.
  NEVER imports `@/tool/bash`, `@/subagent`, `@/mcp`, or `@/agent` core
  (loop/dispatch/hooks/features). The matcher consumes the four
  load-bearing fields of a hook event as an opaque shape — peer slices are
  untouched.

  The default matcher anchors on the literal output banner each tool emits
  today (`[bash background] shellId=...`, `Subagent launched in
  background. task_id: ...`, `cancelled: <id>`, etc.). The matcher OWNS the
  banner contract — a tool author who changes a banner is caught by this
  slice's hellgate.

  Default-OFF: importing the barrel touches no process state. Composition
  wiring (subscribe the handler to a `HookBus`) is a follow-up slice.
