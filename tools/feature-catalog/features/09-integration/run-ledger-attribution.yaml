deliberate_hold:
  reason: |
    Composition-root subscription (`hookBus.on("post_tool_use", subscriber)`)
    is intentionally NOT shipped in this slice. The wave-2 contract is:
    matcher + subscriber + ADR + tests, default-OFF. Wiring is a follow-up
    one-line addition in `src/apps/agent/index.ts` (or per-surface root).
  promotion_path: |
    Follow-up slice adds the wiring + an env toggle
    (e.g. `QUANTA_RUN_LEDGER` on|off) + a surface that reads
    `ledger.running()` / `ledger.waiting()` for status rendering.
notes: |
  Banner-contract observability — the matcher pins the LITERAL output text
  each producing tool emits. The hellgate covers every banner verbatim so a
  tool author who renames `[bash background]` (e.g. to `[bash bg]`) sees a
  CI fail HERE, not a silent regression in a far-away UI weeks later.

  ROI: enables wave-1 ledger's UX promise (single surface for Running /
  Waiting / Completed across shell / subagent / mcp_task) without coupling
  any of the three producing slices to the ledger. ~600 LOC + 43 hellgate
  cases; zero changes to bash/subagent/mcp.
