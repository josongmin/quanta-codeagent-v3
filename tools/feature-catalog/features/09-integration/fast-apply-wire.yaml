deliberate_hold:
  reason: |
    The TOOL-SIDE wire is complete + default-OFF. The remaining piece is the
    AGENT-SIDE composition-root: the adapter mapping the real
    `RoleModelResolver` + `dispatchSideConversation` onto `RoleResolverLike` /
    `SideConversationLike`, plus the dispatch seam threading
    `AgentConfig.fastApplyFallback` onto `ToolContext.fastApplyFallback`. Until
    that lands the slot is inert and the tool path is byte-identical. `loop.ts`
    / `prompt-pipeline.ts` are deliberately untouched (ADR-0417 §A1
    effort-classifier prompt-hook is a separate deferred piece; user in-flight
    on ADR-0418 there).
  promotion_path: |
    Follow-up ADR: (1) build the composition-root fallback adapter, (2) thread
    `AgentConfig.fastApplyFallback` onto `ToolContext.fastApplyFallback` in the
    dispatch seam, (3) close ADR-0417 §A1 effort-classifier prompt-hook wire.
notes: |
  ADR-0421, closes ADR-0417 gap A2 apply-wire. Error classification is
  `instanceof` on the closed `@/patch` error classes; the retry count is a
  hard 1 — no fuzzy repair (per [[no-heuristics-only-validated]]). Hellgate
  was RED (12/18) before the wire, GREEN (18/18) after; the 6 port-absent
  cases passed at RED, proving the default-OFF path was already byte-identical.
