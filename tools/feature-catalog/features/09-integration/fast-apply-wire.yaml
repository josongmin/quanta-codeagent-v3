id: fast-apply-wire
title: Apply-patch fast-apply fallback WIRE (retry on V4A failure)
section: 9
subsystem: Apply-patch recovery (ADR-0421, closes ADR-0417 gap A2 apply-wire)
order: 4211
maturity: L2
status: new
ui_surfaces: [cli]
