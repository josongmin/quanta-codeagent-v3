purpose: |
  Wires the ADR-0417 `FastApplyFallbackPort` (previously a pure port with no
  consumer) into the `apply_patch` tool. When a V4A patch FAILS to apply, the
  tool optionally calls the fallback (executor-model re-emits the patch) and
  retries the V4A applier ONCE.

  Seam: a new OPTIONAL `ToolContext.fastApplyFallback` (duck-typed
  `FastApplyFallbackSeam`, structural mirror of `FastApplyFallbackPort` so the
  `@/tool` slice never imports `@/agent`). The dispatch seam (composition root
  in `@/agent`, a SEPARATE follow-up) wires the concrete port from
  `AgentConfig.fastApplyFallback`.

  Flow when the port is present and `parseAndApply` throws:

    - `classifyFastApplyError(err)` maps the V4A error class to the closed
      `errorKind` (`anchor_not_found` | `apply_error` | `parse_error`), or
      `null` for non-recoverable errors. `FsJailViolationError` + any
      non-patch error ⇒ `null` (a re-emit cannot escape a SECURITY boundary,
      so no fallback is spent — the error surfaces immediately).
    - an already-aborted `ctx.signal` short-circuits (no I/O, no dispatch).
    - `failingTargetPath(err)` pulls `.path` off anchor/apply errors so the
      wire reads the failing file's current bytes (re-anchoring snapshot) via
      the already-constructed `PatchFileSystemPort`. Parse errors have no
      bound target ⇒ no snapshot.
    - `fallback.attempt({ failure, sourceFile?, sourceContent? }, signal)` is
      guarded by a try/catch — a port that breaks its no-throw contract MUST
      NOT mask the real failure.
    - `ok:true` + non-null `newPatch` ⇒ re-run `parseAndApply` ONCE. A retry
      that ALSO fails surfaces the ORIGINAL error (never the retry's).
      `ok:false` / aborted / thrown / no-patch ⇒ original error.

  On a rescued apply the terminal `result.output` appends
  ` (recovered via fast-apply fallback, model <modelUsed>)` so the trajectory
  records the recovery.

  Default-OFF (RFC §1.2): port absent on `ToolContext` ⇒ the V4A failure
  throws immediately, NO fallback attempt — byte-identical to the pre-ADR
  path. NO infinite loop: at most ONE attempt + ONE retry. NO-THROW seam.
  The patch slice's OTel emission (ADR-0028, wired in `applier.ts`) is
  untouched.
