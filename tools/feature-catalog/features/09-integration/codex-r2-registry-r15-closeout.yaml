knobs:
  - name: SqliteRegistryConfig.walCheckpointUpgradeMode
    type: '"RESTART" | "TRUNCATE" | undefined'
    default: 'undefined (= "RESTART" when walSizeThresholdBytes triggers)'
    notes: 'ADR-0385. Whitelisted via ALLOWED_UPGRADE_MODES; unknown modes silently coerce to noop (defense in depth).'
  - name: BULK_EVICT_MAX_MATCHES
    type: 'number (constant)'
    default: '100'
    notes: 'ADR-0386. Operator-typo safety cap; matches > 100 ⇒ exit 1 + "Too many matches (N)".'
  - name: '/session-registry cleanup --dry-run'
    type: 'cli flag'
    default: 'absent (sweep commits per ADR-0379)'
    notes: 'ADR-0387. When present anywhere in sub-args after cleanup, switches to preview-only mode.'
  - name: SessionResourceRegistry.listSessionIds()
    type: 'method (closed port extension)'
    default: 'always present'
    notes: 'ADR-0386. NO-THROW, fresh-array snapshot, in-process Map keys only.'
deliberate_hold: null
