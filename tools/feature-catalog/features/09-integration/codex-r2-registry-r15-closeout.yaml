purpose: |
  R15 closes out the R14 deferred follow-ups + adds two process-level
  ADRs from sprint retrospective. 6 ADRs land, 3 via worktree-isolated
  agents (all 3 successful — 9 consecutive worktree wins counting
  R12+R13+R14 ff stage) + 2 main-direct (markdown ADRs) + 1 from W-C
  (catalog row). All slice content default-OFF / NO-THROW / additive.

  - **ADR-0384** evict hygiene message — single-id `evict` now appends
    a `Sessions: <N>` post-evict count + `(irreversible)` warning to
    surface impact + no-undo semantics. The original `evicted <id>`
    line is preserved byte-identical for downstream parsers.
  - **ADR-0385** SQLite WAL TRUNCATE checkpoint mode — opt-in
    `walCheckpointUpgradeMode?: "RESTART" | "TRUNCATE"` knob on
    `SqliteRegistryConfig` extends ADR-0375 (which only supported
    RESTART). `SweepResult.walTruncated` joins `walRestarted` as a
    mutually-exclusive sibling field. `runWalUpgrade` helper extracted
    to keep `sweepSqliteRegistry` cognitive complexity ≤ 15.
  - **ADR-0386** bulk-pattern evict + `listSessionIds` port extension —
    new closed-port read-only method on all 3 backends (in-memory /
    disk / sqlite) + glob-based `/session-registry evict --pattern
    <glob>` with `*`/`?` alphabet (every other regex metachar
    escaped), 100-match safety cap, in-process Map keys only (NOT a
    filesystem walk or `SELECT session_id FROM sessions`).
  - **ADR-0387** cleanup --dry-run — `countDiskRegistryCleanupCandidates`
    + `countSqliteRegistryCleanupCandidates` non-mutating preview
    functions; `/session-registry cleanup --dry-run` slash flag.
    SQLite count inverts the sliding-window DELETE (`WHERE cum >
    maxTotalBytes` becomes `SELECT COUNT(*)`).
  - **ADR-0388** registry-mint deprecation roadmap (markdown) — names
    gating criteria for migrating callsites to ADR-0383's unified
    `getOrCreateRegistry`. Picks ADR-0372 (specialized) as the
    soft-deprecation candidate over ADR-0347 (load-bearing). No code
    change in this sprint — measure first.
  - **ADR-0389** worktree-agent API-instability retry harness
    (markdown) — process ADR codifying the R9/R14 incidents. < 30
    tool uses → main-direct; mixed sprint splits by size;
    pre-draft salvage prompt; no-retry-dead-worktree; 75% loss-rate
    pause trigger. No automated retry harness — human-in-the-loop
    salvage is more reliable.
