purpose: 'Per-language adapter on LspClient base for `gopls` over stdio (jun-10 multilang-debug). Launch argv default ["gopls"] (default serve subcommand speaks LSP on stdin/stdout; no --stdio) + constant languageIdFor: () => "go". gopls is workspace-oriented (root at the Go module dir). All nav RPCs + handshake + framing inherited from LspClient. Wired into the OCP SERVERS registry in lsp-bridge.ts (.go) so lsp_nav serves Go with zero per-tool change. Real-verified: gopls static (hover/type at a failure site) fuses into a real buildEvidence packet, giving Go static parity with Python/Rust.'
