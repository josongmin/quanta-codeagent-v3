purpose: |
  Wire-level decoders for streaming envelopes emerging from OpenAI Responses
  API v2 (HTTP `text/event-stream` + `wss://chatgpt.com/backend-api/codex/
  responses`). Parses bytes off the wire into a uniform discriminated
  `DecodedProviderEvent` shape (12 documented `kind` variants from Codex
  round-4 inventory + `unknown` forward-compat variant). Pure and total —
  every entry point (`parseSseFrame` / `decodeSseEvent` / `decodeWsEvent`)
  returns `null` on malformed input; none throws. SSE-spec §9.2 compliance:
  multi `data:` lines concatenated with `\n`, CRLF and LF accepted, BOM
  stripped on first frame, empty data field collapses to "". Forward-compat
  gap closure: unknown `kind` values surface as `decoded.kind === "unknown"`
  + rate-limited debug log so unknown events never throw or block the stream
  (Codex itself silently drops `response.in_progress` — quanta wires it
  through so the dispatcher can surface a "thinking..." indicator).
