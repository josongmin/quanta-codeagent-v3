notes: |
  KNOWN_EVENT_KINDS frozen set of 12; `unknown` variant preserves rawKind for
  metric counters. `logUnknownEventRateLimited` ships the rate-limiter so a
  runaway event flood cannot spam the log. Companion of `response-in-progress`
  catalog entry (which captures the in-flight thinking indicator), this entry
  is the underlying wire decoder.
