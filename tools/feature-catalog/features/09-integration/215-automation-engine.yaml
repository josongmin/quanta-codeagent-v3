purpose: |
  `AutomationEnginePort` — a 5-verb closed seam (schedule / list / cancel /
  next / markRun) wrapping the Codex `automations` + `automation_runs` +
  `inbox_items` 3-table schema. Two adapters live under the slice:

    - `inMemoryAutomationEngine()` — zero-dep reference (tests / opt-out
      hosts); exposes `runs` + `inbox` inspection arrays.
    - `sqliteAutomationEngine(db)` — wraps an open `bun:sqlite` Database;
      `ensureAutomationEngineSchema` runs idempotent migration; `markRun`
      writes all 3 tables in a single SQLite transaction (rollback on
      failure, so an inbox row never lands without a matching automation
      update).

  `tickScheduler({ engine, now, handler, inbox? })` is the pure testable
  atomic: pick soonest-due via `engine.next(now)`, fire the handler,
  `markRun(...)` with the next-fire from `computeNextFire`. NO-THROW —
  handler exceptions surface as `kind:"errored"` outcomes; engine port
  errors surface as `kind:"engine-error"`.

  Default-OFF: importing `@/scheduler/automation-engine` opens zero
  connections / creates zero tables. The host supplies an adapter and
  drives `tickScheduler` on its own cadence. The existing JSONL
  `AutomationStorePort` (Phase A) and this engine port COEXIST — they're
  different surfaces. A follow-up can let `SchedulerRuntime` accept
  either.

  exactOptionalPropertyTypes: `lastRunAt`, `lastError`, `errorMessage`
  keys are OMITTED when absent. The closed `EngineResult<T>` discriminated
  union (`ok:true|false` + 4 closed error codes) means callers branch
  rather than catch.
