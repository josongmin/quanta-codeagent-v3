notes: |
  HOURLY / MINUTELY / SECONDLY / YEARLY can be added incrementally by
  growing the `Frequency` union — parser is the only place that needs an
  arm. The evaluator (`next-fire.ts`) switches on the same union so a new
  arm forces a compile error there.
