id: scheduler-rrule
title: ADR-0161 RRULE parser (RFC 5545 strict subset)
section: 9
subsystem: Scheduler / scheduled agent (ADR-0161)
order: 161
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: partial
modes: [n-a]
configurable: integrated
config_refs: {}
owners: ["@songmin"]
labels: ["surface:cli", "surface:ipc"]
purpose: |
  `parseRRule(s)` / `serializeRRule(rule)` implement a strict RFC 5545
  §3.3.10 BASIC RECUR rule subset (`FREQ=DAILY|WEEKLY|MONTHLY` + optional
  `INTERVAL` / `COUNT` / `UNTIL` / `BYDAY` / `BYMONTHDAY`). HOURLY /
  MINUTELY / SECONDLY / YEARLY and the BYSETPOS / BYWEEKNO / BYYEARDAY
  superset are intentionally out of scope — Codex's `automation-schedule`
  uses only DAILY / WEEKLY / MONTHLY in production.

  Every rejection maps to one of the closed `RRuleParseErrorCode` arms
  (`malformed` / `unsupported-freq` / `count-and-until` / `invalid-byday`)
  so callers branch deterministically without prose parsing. The serializer
  is idempotent — `serializeRRule(parseRRule(s)) === canonical(s)` (key
  re-ordering, weekday upper-casing, no extra whitespace).
