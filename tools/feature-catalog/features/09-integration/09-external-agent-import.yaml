notes: |
  cursor/aider translators are STUBS (return []) until their on-disk transcript
  formats are absorbed — claude_code is the first real translator. dedup.wasAlreadyImported
  is a conservative stub returning false because the ImportLogEntry shape does not yet
  carry the (sourceId, contentSha256) tuple; contentSha256 itself is real. Follow-ups:
  (1) real cursor/aider translators, (2) extend ImportLogEntry with sourceId+contentSha256
  so wasAlreadyImported can dedup, (3) persist translated Message[] into v3 sessions
  (stage 3 currently proves+counts translation but does not write v3 sessions).
