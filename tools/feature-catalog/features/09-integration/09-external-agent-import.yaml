id: external-agent-import
title: External-agent 4-stage import lifecycle
section: 9
subsystem: External agent import (ADR-0038)
order: 10
maturity: L3
status: new
purpose: 4-stage import lifecycle (detect_finished / provider_stage_finished / session_completion_finished / import_finished) for Claude Code / Cursor / Aider installations under the user home directory. Strict marker-based detection (no maybe-X heuristics). Halt-on-error semantics — failure of any stage emits import_finished{ok:false} and stops. Persisted log at ~/.quanta/external_agent_session_imports.json with sidecar lock — concurrent writers raise ImportLogBusyError. New @/migration slice with Biome import restrictions (depends on @/shared only).
