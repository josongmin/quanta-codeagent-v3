purpose: |
  The single public seam for external consumers to ride the session.v1 wire:
  `connect({transport: transports.ws(...) | transports.stdio(...)})` returns a
  SessionHandle — SessionVerbSurface<CommandReceipt> (8 verbs via the hoisted
  @/protocol/session/builders SSOT) + subscribe/snapshot(cache+freshness)/
  lastSeq/onConnectionState/onCommandRejected/awaitTurnEnd. Parity with
  RuntimeSession (=SessionVerbSurface<SessionDispatchResult>) is a COMPILE
  fact via permanent type pins (positive value-flow + negative
  @ts-expect-error), and a conformance oracle (real RuntimeSession via
  toSessionHandle vs wire handle) asserts byte-equal event streams under a
  sealed 3-class normalization contract with a negative paired-control.
  awaitTurnEnd uses succession correlation (explicit re-issue report +
  marker-ON adoption arm) — every correlation loss is a TYPED rejection,
  never a hang (adversarial audit killed 3 execution-confirmed hangs:
  resumeFromSeq descoped to ticket 05, parked-approval turn.cancel →
  approval_voided, begin() orphaning → superseded). onApproval reuses the
  ApprovalDecisionResult SSOT (no 4th decision type), throw→deny fail-safe.
  stdio transport owns child lifecycle (SIGTERM→SIGKILL escalation, stderr
  tail, zombie reap, NO env auto-injection). External consumption proven
  from OUTSIDE the repo (file: dep + tsc --noEmit exit 0) — honest caveat:
  shim-conditional until jul-4 P8 ships .d.ts (USAGE §9). In-process door
  stays createAnalysisAgent (session factory deliberately NOT exported —
  public-surface pin asserts toSessionHandle/loopback absence).
