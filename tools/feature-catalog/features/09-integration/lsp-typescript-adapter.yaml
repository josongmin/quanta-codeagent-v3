id: lsp-typescript-adapter
title: TypescriptAdapter — typescript-language-server stdio adapter + JS/TS/JSX/TSX languageId map
section: 9
subsystem: LSP — TypeScript / JavaScript adapter
order: 15
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:ipc"]
depends_on: [lsp-pyright-adapter, lsp-client-base]
purpose: |
  Per-language adapter on top of `LspClient` base for
  `typescript-language-server` over stdio. Two contributions only — the rest
  is inherited: (1) launch argv default
  `["typescript-language-server", "--stdio"]` (overridable via adapter
  options); (2) `languageIdFor(filePath)` which distinguishes `.tsx` →
  `typescriptreact`, `.jsx` → `javascriptreact`, `.js`/`.mjs`/`.cjs` →
  `javascript`, default → `typescript`. The JSX/TSX distinction matters:
  typescript-language-server parses `.tsx` as plain TS without it and
  silently produces wrong diagnostics.
