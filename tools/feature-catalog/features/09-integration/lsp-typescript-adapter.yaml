notes: |
  Companion of `lsp-pyright-adapter` (the symmetric Python case) and
  `lsp-client-base` (the shared LSP machinery). Adding a new language only
  needs a new adapter file with these two contributions — no LspPort method
  needs to be re-implemented per language.
