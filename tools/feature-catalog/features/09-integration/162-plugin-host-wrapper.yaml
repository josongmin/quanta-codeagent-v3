    integration: []
    contract: []
knobs:
  - name: DEFAULT_CALL_TIMEOUT_MS
    where: src/plugin-isolation/plugin-host.ts
    default: 30_000
    purpose: per-request JSON-RPC timeout (overridable per-call)
deliberate_hold: null
notes: |
  Why not reuse `src/mcp/client.ts` JSON-RPC code? McpClient owns the MCP
  protocol grammar (initialize/tools/call). PluginHost is protocol-agnostic
  — any plugin can speak any method names. The two clients share the wire
  format (JSON-RPC 2.0) but not the grammar.
