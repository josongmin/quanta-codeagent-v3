id: plugin-host-wrapper
title: PluginHost — typed JSON-RPC 2.0 wrapper for isolated plugins (ADR-0162)
section: 9
subsystem: Plugin isolation (ADR-0162) — protocol-agnostic host layer
order: 162
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:ipc"]
depends_on: [plugin-isolated-spawner, plugin-dxt-loader, plugin-lifecycle-manager, assert-never-exhaustiveness, byte-stable-string-comparator]
config_refs:
  env: []
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
