    web: "pure internal protocol wrapper, no browser affordance"
purpose: |
  Protocol-agnostic JSON-RPC 2.0 wrapper over `IsolatedProcess` (closed port).
  `call(method, params, {timeoutMs, signal})` → typed Promise, per-call
  timeout (default 30s), AbortSignal cancel without timer leak, duplicate-id
  drop (warn), corrupted-envelope drop (NO-THROW), unknown-method
  notification warn-drop, exception isolation (sibling handlers still fire),
  fail-all-pending on child exit. `notify` fire-and-forget. `onNotification`
  returns idempotent unsubscribe.
  Same wrapper works for Bun spawn today and future Electron
  `UtilityProcess` adapter (OCP — depends only on IsolatedProcess port).
  Typed `PluginHostError.kind` 5-arm: call-timeout / call-aborted /
  process-exited / remote-error / duplicate-id (caller branches without
  string match).
evidence:
  code:
    - src/plugin-isolation/plugin-host.ts
    - src/plugin-isolation/index.ts
  adrs:
