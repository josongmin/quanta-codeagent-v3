notes: |
  Invariants: **invocation 당 LLM call 1번** (caching layer 없음 — 원하면
  caller가 memoise). Rendered header가 항상 토큰 소모 알림. **wire 전에
  secret/PII sanitisation** — 모든 payload (직전 snippet / tool input /
  decision metadata)가 shared trajectory redactor (`redactValue`)를 통과:
  Bearer token / `sk-…` key / Authorization / apiKey / email / canonical
  PII key는 절대 host 안 떠남. **Context cap**: 직전 메시지 3개만 LLM에
  도달, 각 ~600자 truncate. 풀 session 절대 ship 안 함. **JSON parse 실패
  no-throw** — fallback path가 graceful degrade. **Live conversation과
  격리** — meta-query LLM call은 private one-shot `Message[]` (single user
  prompt + private system prompt). active session JSONL이나 prompt history
  를 절대 mutate 안 함 (Phase 2의 recorded fact vs 모델의 meta reasoning이
  뚜렷이 분리).

  Default-OFF: BUILTIN registry에서 `ctx.why === undefined` "not wired"
  branch. REPL surface는 LLMPort + sessionId + model이 resolve되는 순간
  자동 wire.

  Slice-clean: `why-cmd.ts`는 `@/llm` (LLMPort + assembleFromEvents +
  StreamEvent), `@/session` (envelope types), `@/session/inspect-source`
  (findByToolCallId — `/inspect`와 공유), `@/shared` (redactValue) 만 import.
  `@/agent` reach-through 없음.

  21-case hellgate: argument 해결 (`last` / explicit / unknown / empty /
  no-session) / LLM response parse (clean JSON / invalid fallback / markdown
  fence / LLM throw / low confidence / long reasoning list) / output shape
  (ANSI off / long goal truncate / tokens accounting) / prompt cap (직전
  3개만 / secret-shape redacted on wire) / helper white-box (`stripFences`,
  `parseReasoning`, unknown-confidence coercion).
