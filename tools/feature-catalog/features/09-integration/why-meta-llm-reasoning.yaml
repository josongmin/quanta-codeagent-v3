purpose: |
  ADR-0239가 `/debug` runtime tracer (single-line per-event)를 깔고 ADR-0267이
  decision-emit을 widen해서 모든 게이트가 session JSONL에 decision envelope을
  쓰게 만들었음. `/inspect <toolCallId>` follow-up surface가 그 envelope들을
  re-read해서 multi-section panel (tool name / input / gate decisions /
  output)로 **무엇이** 일어났는지 render. 그래도 더 중요한 질문에는 답이
  안 됨 — **왜** agent가 그 호출을 했는가?

  사용자가 알 수 없는 것들: 이전 메시지가 specific 뭔가를 물어본 결과인지,
  `Read`를 `Bash grep` 대신 고른 이유, 라인 N에서 멈춘 이유, alternative를
  고려했는지. 기록된 fact만으로는 답 안 됨 — 모델의 reasoning은 disk에
  저장 안 됨 (extended-thinking block은 turn 한정 lifecycle). 추가 LLM call
  한 번이 필요.

  `/why <toolCallId | last>` ship: (1) target 해결 (explicit `toolCallId` 또는
  `last` = newest-first scan으로 most-recent decision / custom tool-call id),
  (2) sanitised meta-query 빌드 (turn id, 직전 user/assistant 3개 snippet —
  각 600자 cap, redacted tool name + input, decision row, 최근 tool result
  summary — status + 200자 preview), (3) active `LLMPort`로 **단 1번 LLM
  call** + fixed system prompt가 JSON shape 요구
  (`{goal, reasoning[], alternatives_considered[], confidence}`), (4) panel
  render (header model+elapsed+tokens, `goal`, numbered `reasoning`, bulleted
  `considered`, `confidence`. markdown-fence-wrapped JSON은 unwrap), (5)
  fail-soft (JSON parse 실패 시 "(LLM returned unstructured prose)" fallback
  panel; LLM throw 시 exit 1 + reason).

  REPL surface를 통해 `BuildReplSlashCtxArgs.{llm, sessionId, model}` →
  `WhySlashState` → `SlashContext.why`로 wire. LLMPort 없는 one-shot / shell
  surface는 slot 생략 → slash가 "not wired in this surface" + exit 0 print
  (다른 surface-only command와 parity).
