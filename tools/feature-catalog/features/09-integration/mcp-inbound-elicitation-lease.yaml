id: mcp-inbound-elicitation-lease
title: MCP inbound elicitation wiring + single-flight lease
section: 9
subsystem: MCP — inbound elicitation 처리 + 동시성 lease (Codex auth_elicitation / Cursor leaseElicitationRequest 수렴)
order: 8
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "security-touched"]
depends_on: [mcp-client, mcp-elicitation-prompter]
purpose: |
  The 2026-06-01 gap audit found MCP elicitation was DEAD: the ElicitationPrompter
  port/schemas existed (ADR-0197) and full-negotiator advertised elicitation:{} to the
  server, but McpClient.dispatch() did `if (!isResponse(msg)) return` — silently dropping
  every inbound server request, a protocol violation (we claim support then drop). This
  wires it: dispatch() now routes an inbound JSON-RPC REQUEST to handleInboundRequest;
  the MCP `elicitation/create` method (+ internal elicitation/<portMethod> shapes) maps
  onto the injected ElicitationPrompter and the typed result is sent back as the JSON-RPC
  response (accept/decline/cancel per MCP). No prompter injected ⇒ defaults to
  headlessRejecter (a proper decline reply, not a drop). Non-elicitation inbound requests
  get -32601 instead of a drop. GOAL 2: ElicitationLeasePool — a Promise-coalescing
  single-flight keyed by (serverId, leaseKey): concurrent same-key elicitations invoke the
  prompter ONCE and all callers await the same outcome; key freed on settle. Deliberately
  NOT built on OAuthRefreshLockPort (a lock's would-wait arm has no channel to return the
  winner's prompt result; elicitation is single-process so the lock's cross-process TTL is
  the wrong shape) — rationale documented in lease.ts.
evidence:
  code:
    - src/mcp/client.ts
    - src/mcp/elicitation/inbound-router.ts
    - src/mcp/elicitation/lease.ts
  adrs: []
  tests:
    unit:
      - tests/unit/mcp-elicitation-inbound-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: McpClient elicitationPrompter
    default: 'headlessRejecter'
    purpose: 'inbound elicitation handler; default = proper decline reply (was: silent drop)'
  - name: ElicitationLeasePool key (serverId, leaseKey)
    default: 'direct pass-through (no pool)'
    purpose: 'single-flight: same key ⇒ prompt once, all callers share the outcome'
deliberate_hold:
  reason: |
    ElicitationLeasePool is implemented + tested but NOT yet constructed in the
    composition root — McpClient accepts an elicitationPrompter and a caller can pass
    pool.forContext({serverId}) as that prompter, but no production code builds the pool
    yet (same default-OFF posture as the rest of the slice). The elicitation/create
    requestedSchema mapping covers the single-primitive case; multi-field forms decline
    rather than guess (the internal elicitation/<method> path handles the full typed surface).
  promotion_path: |
    Construct the lease pool in the MCP composition root + confirm the exact rmcp/MCP
    requestedSchema shape for multi-field elicitation forms.
notes: |
  Strictly more correct than before even at default: a previously-dropped inbound request
  now gets a well-defined {action:"decline"} reply. Notifications (method, no id) stay ignored.
