id: objective-tools
title: Objective LLM tools — objective_set / objective_update / objective_get (ADR-0402)
section: 9
subsystem: Objective substrate (ADR-0394)
order: 95
maturity: L3
status: new
ui_surfaces: [cli, ide]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: [objective-first-class]
config_refs:
  env: [QUANTA_OBJECTIVE_TOOLS]
surface_integration:
  cli: full
  web: full
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 5/5 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "agent calls render as tool cards (bridged tool_call/tool_result) AND the resulting objective renders in the web-only ObjectiveCard via observability-emitter (objective.get)"
purpose: |
  Three LLM-facing tools wired to the ADR-0394 `ObjectivePort` so the agent
  itself can declare its objective, surface blockers, and list next actions —
  closing the consumer side of the substrate ADR-0394 shipped. Wave-1 (ADR-0394)
  was MODEL ONLY; this wave (ADR-0402) is the FIRST consumer wire: a new
  `src/tool/objective/` slice exposes `objective_set` (propose a goal +
  optional success_criteria + optional budget — REPLACE is refused: a live
  objective belongs to the user, and the tool says so), `objective_update`, and
  `objective_get` (read-only).

  CORRECTED 2026-09-01: `objective_update` shipped as a 6-arm union (status /
  addBlocker / clearBlocker / nextActions / markCriterion / recordUsage) and is
  now TWO arms — `addBlocker` and `nextActions`. Status, criterion completion and
  usage became host-owned, so the model can no longer write them at all; the
  removed arms are schema rejections, not no-ops.

  All 3 tools declare `hitlTier: "pre-approval-ok"` (information-class — no FS,
  shell, or network side effect). NO-THROW: schema validation via `safeParse`
  catches malformed input (missing thread_id / unknown op.kind / bad enum) at
  the boundary; port calls are wrapped in try/catch so a hostile throwing port
  surfaces as `{ ok: false, output: "<tool> error: <message>" }` instead of
  bubbling past the loop. `objective_get` for an unknown thread returns the
  typed string `"no objective set for thread <id>"`.

  Wire: a new Tier-1 builder `buildObjectiveBlock(config)` returns `[]` when
  `config.objective` is absent and the 3 tools when it is wired, mirroring the
  `buildDelegateBlock` / `buildSubagentBgBlock` posture. `buildSessionFeatures`
  pushes the result into `extraTools` between the delegate block and the
  budget block. `AgentConfig.objective?: ObjectivePort` is a helper-only port
  slot (no nested options object — the port IS the slot); the FeaturesConfig
  Pick union includes `"objective"`. Default-OFF byte-identical (RFC §1.2):
  absent ⇒ no tools registered, the ToolRegistry is structurally identical to
  the pre-ADR registry.

  Slice fence: `src/tool/objective/` imports `@/objective` (the closed
  ADR-0394 substrate) for types only (`ObjectivePort` / `Objective` /
  `ObjectiveStatus` / `WaitingOn`), `../types` (Tool / ToolContext / ToolEvent
  / ToolResult), and `zod`. NEVER `@/agent` core (loop / dispatch / prompt /
  features / types). The tool slice does not mutate the substrate slice; it
  consumes the port verbatim.

  Status derivation rule is NOT overridden, and since the 2-arm narrowing the
  model cannot express a status intent at all: `objective_update
  { kind:"status" }` is a SCHEMA REJECTION (it used to be an accepted no-op).
  "blocked" still derives from `blockers.length > 0`, and a model blocker now
  needs a host-resolvable tool/child-agent dependency plus three distinct
  attempts — approval / user-input / external targets are typed unresolved.
evidence:
  code:
    - src/tool/objective/index.ts
    - src/agent/tier1/objective.ts
    - src/agent/tier1/index.ts
    - src/agent/features.ts
    - src/agent/types.ts
  adrs: [402]
  tests:
    unit:
      - tests/unit/objective-tools-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: objective
    where: src/agent/types.ts
    default: 'undefined'
    purpose: |
      Per-session port slot. Absent ⇒ 3 tools NOT registered. Present ⇒ 3 tools
      registered and bound to the same port instance. CORRECTED 2026-09-01: this
      is no longer default-OFF — the goal preset seeds `QUANTA_OBJECTIVE_TOOLS=1`
      when unset (opt out with `QUANTA_GOAL=0`), so the tools are ON out of the
      box. And the composition root must NOT construct a surface-local store:
      `resolveGatedObjectiveAuthority` builds the ONE revisioned authority.
deliberate_hold:
  reason: |
    Since ADR-0402 the "ZERO downstream consumers" premise has been overtaken —
    consumers of the typed object HAVE landed: RFC-03 C2 durable resume
    re-hydrates via `restoreFrom` / `decodeObjectiveSnapshot`
    (build-objective.ts); ADR-0409 compaction preserves next_actions across a
    summarize (compaction.ts `objectiveSetNextActions`); and RFC-03 C3 adds the
    HITL-proposal consumer of the SAME authority
    (aug22-rfc03-objective-propose-goal-hitl). What remains OPEN: subagent
    results do not attribute to the parent's objective, and the per-turn reminder
    does not yet surface the current objective — separate ADRs.
  promotion_path: |
    The original promotion trigger (compaction-preserve) has landed. Promote to
    L4 when the remaining consumers (subagent attribution + per-turn reminder) are
    wired and the objective is on operational monitoring.
notes: |
  38 hellgate cases / 136 expects pin (re-measured 2026-09-01; the 30/62 below
  was the landing figure): tier1 barrel re-export; AgentConfig
  slot + FeaturesConfig Pick; default-OFF (slot absent ⇒ no tools); wired
  (slot present ⇒ all 3 tools); same-port binding (set/get round-trip);
  schema rejection of unknown ops + bad enums + missing thread_id; each of
  the 2 surviving op variants round-trip (the other four are rejections now);
  NO-THROW on throwing fake port; HITL tier
  surface. Sibling-shaped to delegate-tool-hellgate (ADR-0393).
