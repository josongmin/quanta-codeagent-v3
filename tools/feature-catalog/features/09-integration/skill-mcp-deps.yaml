id: skill-mcp-deps
title: skill-mcp-deps — skill-declared MCP servers auto-attached on activation (ADR-0476)
section: 9
subsystem: 통합 — skill→MCP 의존성 링크 (skill이 필요한 MCP 서버를 선언하면 활성 시 자동 attach)
order: 476
maturity: L3
status: refined
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: partial
owners: ["@songmin"]
labels: ["surface:core", "tier:integration", "default-off", "absorbed:agent-config", "wired"]
depends_on: [skill]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "wired into the CLI agent loop (per-turn reconcile, QUANTA_SKILL_MCP_DEPS gate) auto-attaching MCP servers, changing the CLI tool surface"
    web: "backend MCP-attach plumbing on skill activation; no browser affordance of its own (attached tools render as tool calls but the dependency-link mechanism has no UI)"
purpose: |
  A skill declares the MCP servers it needs; when the skill is active and the
  gate is ON, the harness auto-attaches the deduped set. Today
  @/skill/skill-frontmatter parses only userInvocable/allowedTools — there is NO
  skill→MCP link. The leaf slice (src/skill/skill-mcp-deps, imports @/shared
  ONLY) owns: (1) parseSkillMcpDeps(rawDependencies) — validate a frontmatter
  `dependencies.tools[]` block (type:mcp, value, transport ∈
  {stdio|streamable_http|sse}, command|url, optional args) into a closed
  SkillMcpDep[] + typed McpDepError[]; a malformed dep is a typed err and is
  SKIPPED, the rest still parse, the skill keeps working (NO-THROW; hostile
  getter caught). (2) resolveMcpDeps(activeSkills, env) — fold the ACTIVE skills'
  deps into a deduped McpServerSpec[] to attach; dedupe by named depIdentity
  (stdio ⇒ serviceName; HTTP ⇒ transport+serviceName+url) so a server is NEVER
  attached twice; first declaration wins. (3) AttachMcpPort — the inverted seam
  the composition root calls on skill activation (port inversion, mirrors
  @/permission ClassifierPort; the slice does NOT import
  @/agent/plugin-mcp-launcher — the launcher attach is injected). DESIGN CHOICE:
  the declaration is read from SKILL.md FRONTMATTER (intrinsic to the skill,
  single self-describing file), but the validator is source-agnostic so a vendor
  sidecar can be mapped onto the same parser. DEFAULT-OFF: skillMcpDepsEnabled
  reads injected env QUANTA_SKILL_MCP_DEPS === "1" (never process.env); unset ⇒
  resolveMcpDeps returns [] BEFORE inspecting any skill ⇒ no resolution, no
  attach, byte-identical to today. NO arbitrary heuristics: transport is a
  closed enum; dedupe key is a named documented identity.
evidence:
  code:
    - src/skill/skill-mcp-deps/types.ts
    - src/skill/skill-mcp-deps/parser.ts
    - src/skill/skill-mcp-deps/resolve.ts
    - src/skill/skill-mcp-deps/session.ts
    - src/skill/skill-mcp-deps/index.ts
    # WIRED (jun-04): full composition chain, default-OFF
    - src/skill/discover.ts            # lift dependencies block at discovery → Skill.rawDependencies
    - src/agent/tier1/skill.ts         # gated propagation onto the active-skill inventory
    - src/agent/loop-activation-hook.ts # reconcileSkillMcpDepsForTurn (descriptor → ActiveSkillDeps)
    - src/agent/loop.ts                # per-turn reconcile + session-end shutdownAll
    - src/agent/skill-mcp-attach-adapter.ts # dual-transport (stdio launcher / HTTP-SSE) AttachMcpPort
    - src/agent/skill-mcp-wire.ts      # composition wire: real launcher + HTTP connect port
    - src/host/runtime/agent-config-assembler.ts # maybeWireSkillMcp (QUANTA_SKILL_MCP_DEPS gate)
  adrs: [476]
  tests:
    unit:
      - tests/unit/skill-mcp-deps-hellgate.test.ts
      - tests/unit/skill-mcp-attach-adapter-hellgate.test.ts
      - tests/unit/skill-mcp-substrate-hellgate.test.ts
    integration:
      - tests/unit/skill-mcp-e2e-hellgate.test.ts
    contract: []
knobs:
  - name: QUANTA_SKILL_MCP_DEPS
    default: 'unset (OFF)'
    purpose: 'exactly "1" opts a deployment in; any other value (incl "0"/"true"/"on") keeps it OFF. Unset ⇒ resolveMcpDeps returns [] before inspecting any skill (no resolution, no attach). Reads INJECTED env, never process.env.'
notes: |
  WIRED (jun-04) — the previously-held integration is DONE end-to-end (default-OFF):
  (1) DISCOVERY: src/skill/discover.ts lifts the raw `dependencies` block from
  the FULL SKILL.md (frontmatter, not the post-frontmatter body) onto
  Skill.rawDependencies. (2) CHANNEL: src/agent/tier1/skill.ts propagates it onto
  the per-turn active-skill inventory ONLY when QUANTA_SKILL_MCP_DEPS=1 (the
  prompt renderer reads only name/description ⇒ byte-identical when off); it
  survives the plugin-union projection (augmentActiveSkillsWithPlugin). (3)
  RECONCILE: loop.ts calls reconcileSkillMcpDepsForTurn(config, activeSkills)
  every turn (extracted helper keeps prepareTurnContext under the complexity cap),
  mapping each descriptor → ActiveSkillDeps; pure no-op when no session is wired.
  (4) TEARDOWN: cleanupFinishedSession calls config.skillMcpSession.shutdownAll()
  at session end. (5) COMPOSITION: assembler maybeWireSkillMcp mints ONE session
  bound to the REAL stdio launcher (createIsolatedMcpLauncherPort) + HTTP-SSE
  connect port (src/agent/skill-mcp-wire.ts), gated on QUANTA_SKILL_MCP_DEPS=1,
  caller-override-safe. Proven by an e2e hellgate driving the production reconcile
  path: attach → cross-skill dedupe → detach → shutdownAll, plus gate-OFF no-op.

  Port inversion is the crux: @/skill could not legally import the launcher from
  a leaf, so the attach is injected as AttachMcpPort. depIdentity is named +
  documented (NOT an ad-hoc key): a service exposed over both sse and
  streamable_http is two distinct attachments (different wire protocol = different
  connection), proven by the hellgate. The deps block rides WITH its skill on the
  active-skill channel (locality, no name-keyed side index) — an optional field
  that is absent unless the gate is on AND the skill declared a block.
