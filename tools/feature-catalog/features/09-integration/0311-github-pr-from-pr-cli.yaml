id: github-pr-from-pr-cli
title: from-pr CLI sub-command (Tier 0 PR webhook bot entry)
section: 9
subsystem: GitHub integration (ADR-0311)
order: 315
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [daemon, ci-bot]
configurable: integrated
config_refs:
  env: [QUANTA_GH_ACTIONS_TRIGGER, QUANTA_GH_TRIGGER_PHRASES, QUANTA_GH_TRUST_SCOPE]
owners: ["@songmin"]
labels: ["surface:cli", "integration:github", "default-off"]
depends_on:
  - github-actions-trigger-adapter
  - pr-output-sink-redaction
  - mention-filter-trust-scope
  - secret-redaction-content-plane
  - reactor-trigger-source
surface_integration:
  cli: missing
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "keep derived: from-pr CLI sub-command not yet registered in the CLI dispatcher"
    web: "CLI sub-command; SlashPalette web routes are prefill stubs (B2) and there is no web handler"
purpose: |
  User-facing CLI entry for the Tier 0 PR webhook bot path. Runs ONE cycle
  end-to-end:

    1. envPort.get(QUANTA_GH_ACTIONS_TRIGGER) !== "1" ⇒ default-OFF, exit 0
       (byte-identical to absent integration).
    2. createActionsEventSource → poll once → readonly ProactiveTrigger[].
    3. 0 triggers ⇒ exit 0 (no-op). ≥1 ⇒ parse PR# out of evidence.value URL
       via the canonical https://github.com/{owner}/{repo}/pull/{n} regex.
    4. loadPrContext(prNumber) — 4-shot gh CLI fan-out.
    5. composeSummary({ context, ... }) → redactPort.redact(body) — defence-
       in-depth pass against the secret-redaction-content-plane (ADR-0078)
       even though the sink will redact again.
    6. dryRun=true ⇒ emit `dry-run-body` event (no post). dryRun=false ⇒
       createPrOutputSink.postComment with computeIdempotencyKey(deliveryId,
       "comment") — repeat invocations EDIT the prior comment by marker.

  All IO is port-shaped: envPort / fsPort / ghCliPort / clockPort /
  redactPort. The CLI file itself contains zero direct `process.env` /
  `fs` / `Bun.spawn` access — production adapters live in the sibling
  `from-pr-cmd-adapters.ts` module and the agent loop / runner is never
  touched (slice-fence).

  Default-OFF posture is triple-layered (env gate + dryRun default-true at
  the CLI parser + port construction can be elided to drop the sink
  entirely). Composition matches the ADR-0311 reactor seam so future
  Tier 1 host (ADR-0312) can swap the eventSource port without touching
  the CLI surface.
evidence:
  code:
    - src/apps/cli/from-pr-cmd.ts
    - src/apps/cli/from-pr-cmd-adapters.ts
    - src/apps/cli/from-pr-cmd-runner.ts
  adrs: [311, 313]
  tests:
    unit:
      - tests/unit/apps/cli/from-pr-cmd.test.ts
      - tests/unit/apps/cli/from-pr-cmd-runner.test.ts
      - tests/unit/integrations/github/cli-real-adapters-hellgate-r3.test.ts
      - tests/unit/integrations/github/redact-parity-hellgate-r3.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_GH_ACTIONS_TRIGGER
    default: 'undefined'
    purpose: 'Default-OFF gate; "1" arms the from-pr cycle, anything else short-circuits exit 0.'
  - name: QUANTA_GH_TRIGGER_PHRASES
    default: '@quanta,/quanta'
    purpose: 'Comma-separated trigger phrases passed to the mention filter; honors the same matcher as ADR-0314.'
  - name: QUANTA_GH_TRUST_SCOPE
    default: 'collaborator'
    purpose: 'Default trust scope for the mention filter — collaborator/member/owner gate.'
deliberate_hold:
  reason: |
    CLI sub-command registry wiring (binding `from-pr` into the top-level
    quanta CLI dispatcher) is held until the Tier 0 path has accumulated
    real PR-bot deliveries to size the daemon-mode budget knobs (rate
    limit, max idempotency-store size). The slice ships fully tested and
    composed; only the registry edge is deferred.
  promotion_path: |
    Promote to L3 by registering `from-pr` in `src/apps/cli/cli.ts` (or
    the equivalent registry) and adding an end-to-end integration test
    that drives the full env → event → context → redact → post path
    against a recorded GitHub Actions payload.
notes: |
  The CLI deliberately requires explicit `redactPort` injection (no
  default no-op) — calling without it boots a hard throw at construction
  in pr-output-sink (ADR-0313). This mirrors the fail-closed posture of
  the ADR-0078 content plane.
