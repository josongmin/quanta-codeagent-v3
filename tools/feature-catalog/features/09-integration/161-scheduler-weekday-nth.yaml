notes: |
  RFC 5545 §3.3.10 documents `BYDAY` ordinal as MUST NOT be zero — we
  enforce + test. The Codex `Weekday` class observed in
  `.extracted_source/codex/.vite/build/automation-schedule-BpeIuMts.js`
  (per [[extracted-source-novel-findings-2026-05-24]] line 741) uses the
  same `+nMO` syntax; this slice is the verified-pattern absorption.
