knobs: []
deliberate_hold: null
notes: |
  Empty allowlist ⇒ deny everything (no implicit allow). Single audit
  decision: the apex-exclusion of `*.suffix` was applied to prevent the
  allowlist broadening beyond intent — operator must opt-in for the apex.
  Pairs with `ci-bot-mode-policy` (mode preset) and `branch-only-guard`
  (write-side companion).
