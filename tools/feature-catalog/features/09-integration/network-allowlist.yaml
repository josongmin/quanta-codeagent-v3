id: network-allowlist
title: Outbound-host network allowlist + CI-bot default audit set
section: 9
subsystem: Runtime — outbound network policy
order: 52
maturity: L4
status: stable
purpose: |
  Propositional outbound-host check used by the ci-bot mode policy lever
  (`network: { kind: "allowlist"; hosts }`). Pure URL/host string check —
  NO counts, NO thresholds, NO threshold-rate-limits. Caller decides what
  to DO with a denial (deny tool call, log, mark instance degraded). This
  module only answers "is this host allowed?"

  Matching:
    - Exact host match (case-insensitive, lowercased).
    - `*.suffix` wildcard for strict subdomains only (R2 audit fix:
      `*.example.com` matches `a.example.com` but NOT bare apex
      `example.com` — to allow the apex too, list it explicitly).
    - Bare host (no scheme) is accepted; URLs are parsed via `new URL`.
    - Unparseable input ⇒ `null` host ⇒ deny.
  Default allowlist `CI_BOT_DEFAULT_ALLOWLIST` is small + audited:
  api.github.com / github.com / raw.githubusercontent.com /
  objects.githubusercontent.com / codeload.github.com / registry.npmjs.org
  / registry.yarnpkg.com / pypi.org / files.pythonhosted.org /
  *.githubusercontent.com. Operator extends or replaces via the mode
  policy lever. `denialReason` renders a human-readable diagnostic
  string (includes the host + allowlist size).
evidence:
