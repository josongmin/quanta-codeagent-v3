notes: |
  Adds slice E to the parent's atomicity hellgate (E1 same-FS / E2
  EXDEV→copy+unlink / E3 EACCES propagate). FakeLspClient now tracks
  `copies` + `setCopyThrow` for fake-injection assertion.
