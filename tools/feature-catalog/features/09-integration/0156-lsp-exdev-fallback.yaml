    web: "Pure internal FS-rename fallback primitive; no user-visible affordance on any surface."
purpose: |
  Closes the ADR-0152 follow-up: Phase 2's `fs.rename(tmp, target)` fails
  with `EXDEV` when tmp and target sit on different mounts (Linux tmpfs
  `/tmp`, container overlay vs workspace bind-mount, certain macOS
  `/private/var/folders/...T/` setups). Catch detects `e.code === "EXDEV"`
  (never message-string match — i18n-safe), then `copyFile(tmp, target)`
  + `unlinkTmp(tmp)` continues the loop atomically per file. New `copyFile`
  protected seam delegates to `fs.copyFile` by default; tests inject fakes.
