id: automation-engine-wire
title: ADR-0279 Automation engine composition-root wire
section: 9
subsystem: Scheduler / E2 productization (ADR-0279)
order: 279
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "default-off"]
depends_on: [automation-engine, scheduler-runtime]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "derived full kept; assembleAutomation runs in the CLI/agent composition root"
    web: "pure internal composition-root wire (env to AutomationEngineSlot); no user-visible browser affordance, fires ride B1-dropped scheduler events"
purpose: |
  `assembleAutomation(env, deps)` — the single composition-root helper
  that wires `AutomationEnginePort` + `tickScheduler` + a handler closure
  over an `AgentLoopPort` into the `AgentConfig.automationEngine` slot.

  When `QUANTA_AUTOMATION === "on"`, returns a fully-wired
  `AutomationEngineSlot` (engine, handler, tickIntervalMs, onTick); when
  off, returns `null` ⇒ the composition root's spread-conditional OMITS
  the slot and the legacy path is byte-identical.

  The handler closure translates `tickScheduler` fires into agent
  invocations via `agentLoop.enqueueUserMessage(automation.prompt)`.
  Errors surface as `kind:"errored"` outcomes (NOT thrown — `tickScheduler`
  is no-throw by contract); the optional `onTick` observer writes an
  errored line to stderr for surface telemetry.

  ADR-0240 already owns the `setInterval` arm/disarm via
  `startAutomationEngineTicker`; this slice is purely composition-root
  CONSTRUCTION (env → slot). The two ADRs stack: 0240 (timer) on top of
  0215 (engine seam), with 0279 closing the env-to-slot wire.
evidence:
  code:
    - src/scheduler/runtime-wire.ts
    - src/apps/agent/index.ts
  adrs: ["docs/decisions/0279-automation-engine-wire.md", 215, 240]
  tests:
    unit:
      - tests/unit/cli/automation-wire-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_AUTOMATION
    default: 'off'
    purpose: 'engine 활성 (on|off)'
  - name: QUANTA_AUTOMATION_INTERVAL_MS
    default: '60000'
    purpose: 'tick interval'
config_refs:
  env: [QUANTA_AUTOMATION, QUANTA_AUTOMATION_INTERVAL_MS]
deliberate_hold:
  reason: |
    Notification channels (desktop / email / slack) 후속 슬라이스로 분리.
    이 슬라이스는 stderr line + 메모리 inbox로만 surface; OS-level push,
    SMTP, IM webhook은 별도 ADR로 절차화.
  promotion_path: |
    별도 ADR로 NotificationSinkPort 추가 → assembleAutomation에서 sinks를
    조립 → onTick 분기를 sink.emit으로 위임. 채널별 자격증명 / rate limit /
    재시도는 sink 구현체 책임.
notes: |
  E2 productization track. ADR-0215 (engine) + ADR-0240 (ticker)는 이미
  shipped — operator-facing knob (QUANTA_AUTOMATION)을 마지막 1마일로
  추가. assembleAutomation 헬퍼는 단일 파일 (`src/scheduler/runtime-wire.ts`)
  에 격리 — feature 끄려면 helper 호출 1줄만 지우면 됨.
