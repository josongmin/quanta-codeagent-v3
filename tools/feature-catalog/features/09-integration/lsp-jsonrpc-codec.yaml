notes: |
  Distinct from `mcp/jsonrpc.ts` (newline-delimited, single line per
  message). Both share the JSON-RPC 2.0 semantics; only the framing differs.
  Per RFC §3.1 slice isolation `@/lsp` ships its own copy rather than
  importing `@/shared/jsonrpc` until a follow-up ADR consolidates the wire
  shapes. `LineReader` (MCP) and `MessageReader` (LSP) intentionally do not
  share an interface.
