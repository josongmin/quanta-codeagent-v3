id: lsp-jsonrpc-codec
title: LSP JSON-RPC 2.0 codec — Content-Length framed (MessageReader / encodeMessage)
section: 9
subsystem: LSP — stdio Content-Length framing
order: 13
maturity: L4
status: stable
purpose: |
  Wire-level codec behind `lsp-bridge` and `lspport`. LSP framing is NOT MCP's
  newline-delimited shape: every message is a JSON body preceded by an HTTP-
  style `Content-Length: N\r\n\r\n` header. The single hardest correctness
  risk in an LSP client is the stream framing — a server may flush several
  messages in one chunk OR split a single message (even its header) across
  many chunks. `MessageReader` owns a byte buffer and only emits a message
  once the full `Content-Length` body bytes have arrived, so partial reads
  AND coalesced messages are both handled. Closed `JsonRpcMessage`
  discriminated union — response (by `id`) vs notification/request (by
  `method`). `encodeMessage` writes a `Content-Length` header in bytes (not
  chars) so multi-byte UTF-8 payloads frame correctly. Companion of
  `mcp-client-jsonrpc` (newline-delimited variant) and `jsonrpc-envelope`
  (the standalone JSON-RPC 2.0 envelope SoT).
