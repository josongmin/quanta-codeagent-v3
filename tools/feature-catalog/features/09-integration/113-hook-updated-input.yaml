    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  Cursor-parity hook surface. The rewrite happens after permission check so
  argument normalization cannot be used to escape policy. The closed return
  shape keeps host hooks type-checked end-to-end.
