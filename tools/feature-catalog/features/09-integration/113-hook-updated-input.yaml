id: hook-updated-input
title: pre_tool_use hook updatedInput rewrite channel
section: 9
subsystem: Hook bus (ADR-0113)
order: 113
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: partial
modes: [n-a]
configurable: partial
owners: ["@songmin"]
labels: ["surface:ipc"]
depends_on: [assert-never-exhaustiveness, awf-tool-matcher, byte-stable-string-comparator, errors-helper-fix, llm-cost-emit-sink]
purpose: |
  Third return shape on pre_tool_use hooks (beyond allow / deny): an
  updatedInput payload that REWRITES the tool's arguments before dispatch.
  Enables policy-driven argument normalization (destructive-flag rewrite),
  workspace-relative path canonicalization, and secret redaction at the tool
  boundary. Composes with the deny channel — handlers can rewrite OR deny but
  the two channels remain orthogonal in the type union.
