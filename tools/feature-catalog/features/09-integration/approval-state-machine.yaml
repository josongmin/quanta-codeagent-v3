knobs:
  - name: now
    where: createApprovalStateMachine({ now })
    default: 'Date.now'
    purpose: injected clock seam for deterministic createdAt/settledAt stamps
  - name: objective
    where: createApprovalStateMachine({ objective })
    purpose: optional ObjectivePort — when supplied, request() attributes the pause via addBlocker(waitingOn:"user") and settle/expire/cancel clear the blocker. Attribution failures (hostile port throws) do not propagate.
  - name: ledger
    where: createApprovalStateMachine({ ledger })
    purpose: optional RunLedgerPort — when supplied, request() starts a kind="exec" entry transitioned to waiting/user and settle/expire/cancel terminate it as completed (approve/modify) or stopped (deny/expire/cancel). Attribution failures do not propagate.
  - name: onUnattributed
    where: createApprovalStateMachine({ onUnattributed })
    purpose: DOF-40 fail-closed audit-gap sink — invoked with an ApprovalAttributionGap when a terminal mutator (settle/expire/cancel) is called for an id with NO pending record (producer never called request(id)), so a missing audit trail is surfaced instead of the swallowed null. Absent ⇒ byte-identical legacy (zero calls). Observer throws are swallowed (NO-THROW).
deliberate_hold:
  reason: |
    PORT + STORE wave. The closed port + in-memory store are hellgate-proven,
    but no code path calls them yet: the admissibility-gate, request_user_input
    tool, HITL tier registry, and CLI/web surfaces are UNTOUCHED — by design,
    so this wave is byte-identical / default-OFF and cannot regress existing
    HITL behaviour. Attribution semantics (which gate event maps to which
    approval kind) belong to a dedicated wiring wave.
  promotion_path: |
    A later wave wires `createApprovalStateMachine` into the agent composition
    root and has the admissibility-gate / `request_user_input` produce
    approval requests instead of inline HITL prompts. A surface
    (CLI status bar / web/Tauri panel) then reads `pending()` to render the
    pause with `reason`, `resumeStep`, and the back-refs to Objective.blockers
    + RunLedger.waiting() it implies. Promote to L3 once a real producer is
    wired and a surface consumes the state.

    DOF-40 fail-closed gap sink PROMOTION OWNER: the `onUnattributed` observer
    is a leaf seam here. Routing it to real telemetry / RunLedger belongs to a
    composition root NOT owned by this slice — the observability wire
    (`src/agent/observability-wire/wire.ts`, where `createApprovalStateMachine`
    is constructed) and/or the web-daemon runtime factory. That root must pass
    `onUnattributed` (e.g. emit a `logger.warn` + a `run-ledger` gap entry) so
    the deferred always-confirm path's un-attributed settle
    (`src/host/runtime/internal/context-binding/approval-protocol.ts:413`)
    surfaces in production. Until then the sink is absent in prod ⇒ the gap is
    detectable only in-test (this slice cannot reach across the fence).
notes: |
  Slice fence verified: imports = `node:crypto` (randomUUID) + types-only from
  `@/agent/objective` + `@/agent/run-ledger`. NO `@/agent` core, NO `@/apps`,
  NO `@/tool`. The store is sibling-shaped to ObjectiveStore (ADR-0394) and
  RunLedger (ADR-0395) — frozen returns, NO-THROW, injected clock — so the
  three slices compose with a uniform discipline. 44 hellgate cases / 110
  expects pin every status transition per kind, attribution WITH/WITHOUT
  optional ports, hostile-port survival, snapshot round-trip + replace-not-
  merge, multi-thread isolation, frozen returns, and NO-THROW on every
  hostile input axis.
