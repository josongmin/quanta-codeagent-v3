purpose: |
  Closed port + in-memory store for HITL approval / clarification / escalation
  requests. quanta already has the *mechanism* for stopping the agent and
  asking the operator (HITL tier registry, `request_user_input`,
  `always-confirm` / `hand-off-required`), but it has no first-class STATE
  MODEL for that stop: WHY now, exactly WHICH step resumes after approval, and
  the pause is invisible to the per-thread Objective (ADR-0394) + unified Run
  Ledger (ADR-0395).

  This wave ships the SUBSTRATE: the typed model (`ApprovalRequest` /
  `ApprovalKind` / `ApprovalDecision` / `ApprovalStatus` / `ApprovalSnapshot`),
  the closed `ApprovalStateMachinePort`, and a zero-dep in-memory store
  (`createApprovalStateMachine`). NOT yet wired into `admissibility-gate.ts`
  or `request_user_input` (existing HITL code is UNCHANGED). Pure new slice
  `src/agent/approval-state-machine/` — only `node:crypto` for randomUUID
  + types-only imports from `@/agent/objective` + `@/agent/run-ledger`.

  Status transitions pinned: request ⇒ pending; settle(approve|modify) ⇒
  approved (idempotent on already-settled, settledAt not re-bumped on no-op);
  settle(deny) ⇒ denied; expire from pending ⇒ expired (no-op on settled);
  cancel from pending ⇒ cancelled (no-op on settled); any mutator on unknown
  id ⇒ null (no exception). DOF-40 FAIL-CLOSED audit-gap: a terminal mutator
  (settle/expire/cancel) on an UNKNOWN id still returns null, but ALSO emits an
  `ApprovalAttributionGap` ({approvalId, op, decision?, at}) to the injected
  `onUnattributed` observer when supplied — so a deferred approval whose
  producer never called `request(id)` (the web/SDK always-confirm path mints an
  approvalId + throws RuntimeApprovalRequiredError WITHOUT going through
  gate.open, then the host relays settle(approvalId)) surfaces the missing
  audit trail instead of silently dropping it. Observer absent ⇒ byte-identical
  legacy null return (zero calls, clock untouched). A throwing observer is
  swallowed (NO-THROW). Attribution invariants: when optional `objective`
  / `ledger` ports are supplied, `request()` calls
  `objective.addBlocker({reason, waitingOn:"user"})` (captures newest blocker
  id) + `ledger.start({id:<approvalId>, kind:"exec", owner:threadId,
  title:reason, resumeAction:resumeStep})` then
  `ledger.touch(id,{status:"waiting", waitingOn:"user"})`. `settle/expire/
  cancel` clear the matched blocker AND `ledger.settle(id, "completed"|
  "stopped")` mapped from decision (approve/modify⇒completed;
  deny/expire/cancel⇒stopped). When the ports are absent, attribution is a
  no-op — approval state still tracks. HOSTILE-PORT INVARIANT: a throwing
  `addBlocker` / `start` / `touch` / `clearBlocker` / `settle` does NOT
  propagate — attribution is best-effort, approval state is authoritative.

  NO-THROW on every method (unknown id / malformed input / hostile clock /
  hostile attribution port). Frozen returns (record + list array). Snapshot
  replaces-not-merges; malformed entries silently dropped. Default-OFF:
  importing the barrel allocates nothing — agent stays byte-identical until a
  follow-up wave wires the gate into request/settle.
