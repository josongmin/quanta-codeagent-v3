id: mcp-tasks-live
title: MCP tasks live binding (outbound tasks/* dispatch)
section: 9
subsystem: mcp client (ADR-0431)
order: 431
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["absorbed:rmcp-0.15", "surface:integration", "tier:adapter", "default-off"]
depends_on: [01-quantamcpconfig]
purpose: |
  Live `McpTasksPort` over a started `McpClient`. `clientTasksPort(client)`
  dispatches the four rmcp 0.15 `tasks/*` JSON-RPC requests through
  `client.requestRaw(method, params)` — the outbound mirror of the inbound
  elicitation router:
    list      → `tasks/list`      `{ cursor? }`  → `{ tasks, nextCursor? }`
    getInfo   → `tasks/getInfo`   `{ taskId }`    → `{ taskId, status, … }` | null
    getResult → `tasks/getResult` `{ taskId }`    → `{ status, output|error }`
    cancel    → `tasks/cancel`    `{ taskId }`    → `{}` | `{ ok:false, reason }`
  The composition root (`loadMcpTools` → `tasksToolsFor`) registers the three
  model-facing `mcp_tasks` tools (list / get / cancel) ONLY when the connected
  server advertised the `tasks/*` capability in its `initialize` response. No
  advertisement ⇒ no tools (byte-identical to before the binding existed).
  Transport errors (process exit / RPC timeout) propagate as `McpError`;
  MALFORMED-but-successful responses map to typed conservative outcomes
  (cursor-stale / null / not-ready / not-found) so a hostile server cannot
  crash the model loop.
