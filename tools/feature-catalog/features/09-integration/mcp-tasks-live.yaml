notes: |
  ACTIVATION IS MCP-CAPABILITY-NEGOTIATED, NOT AN ENV KNOB. There is no
  `QUANTA_*` flag and `config_refs` is intentionally empty — the tools become
  available iff a connected MCP server advertises `capabilities.tasks` in its
  `initialize` handshake (read by `McpClient.serverSupportsTasks()`), and the
  composition root gates registration on that. `configurable: integrated` is
  structurally honest in the wiring sense (the binding is fully wired into
  `loadMcpTools` and reaches the model surface with no further config), but the
  ON/OFF decision is owned by the server's advertised capability, not by user
  configuration. A server without the capability adds zero tools.

  Tool count is THREE (`list_mcp_tasks` / `get_mcp_task` / `cancel_mcp_task`),
  not four — the four `tasks/*` JSON-RPC METHODS collapse onto three
  model-facing tools (getInfo + getResult are both served by `get_mcp_task`).

  `knobs: []` because there is no env/config surface to enumerate.
