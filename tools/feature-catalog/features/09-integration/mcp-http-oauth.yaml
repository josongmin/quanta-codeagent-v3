knobs:
  - name: QUANTA_MCP_OAUTH
    default: 'undefined'
    purpose: 'Strict =="1" opt-in. ON (+ a connectors-backed provider wired + a server config oauth:true) ⇒ the McpClient resolves a bearer (RFC 8414 discovery → DCR → PKCE browser flow → token, RFC 6749 §6 refresh) and attaches Authorization: Bearer to that server. OFF ⇒ no provider, headless rejecter, byte-identical (no discovery/flow/header).'
notes: 'LIVE-WIRED jun-06: resolveMcpOAuthProvider (src/apps/cli/internal.ts) assembles the provider and mcp-bridge threads it into clientOpts.oauthProvider on both load paths — the provider is no longer a dead seam. PORT seam preserved: @/mcp gains NO @/connectors/@/auth import — the connectors-backed McpOAuthProviderPort lives in @/host/runtime and is injected; the browser-flow + file token store are assembled at the CLI surface (the only layer reaching @/auth + @/connectors). Per-server oauth:true is the second gate; the issuer is the server url origin; zero-config DCR (RFC 7591) when no static client id. Tokens stored via connectors TokenStorePort (0600 file by default), never logged. OS keyring binding LANDED (jun-06) as an OPTIONAL composeTokenStore(keyring, file) decorator behind QUANTA_MCP_OAUTH_KEYRING — see feature mcp-oauth-keyring (Keychain/libsecret, file-fallback + migration, NO-THROW, secret never on argv). Deferred: bind /mcp login ctx.mcp.login to the wired provider (manual re-auth still reports "OAuth not enabled"); plugin-format (mcpServers{}) oauth passthrough (legacy {servers:[]} format already carries it); per-server static client-id config field (DCR covers the zero-config case meanwhile); Windows Credential Manager keyring adapter.'
