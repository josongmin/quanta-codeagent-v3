id: mcp-http-oauth
title: H18 MCP HTTP-Server OAuth (RFC 8414 discovery + PKCE + refresh, port-injected)
section: 9
subsystem: MCP HTTP transport authentication
order: 478
maturity: L3
status: refined
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: integrated
owners: ["@songmin"]
labels: [absorbed:cursor, absorbed:codex, surface:core, security]
depends_on: [mcp-sampling-handler, connectors-oauth-discovery]
config_refs:
  env: [QUANTA_MCP_OAUTH]
  runtime: [mcpOAuth]
purpose: |
  Wire the EXISTING `@/connectors` OAuth-discovery suite (RFC 8414
  `.well-known/oauth-authorization-server` + OIDC fallback, RFC 7591 dynamic
  client registration, RFC 6749 §6 refresh, token rotation) plus the
  `@/auth/chatgpt-oauth` loopback + PKCE browser flow into the MCP client, so an
  HTTP MCP server that requires OAuth can be authenticated. Before H18 `src/mcp/`
  imported NONE of those modules — an HTTP MCP server needing OAuth simply could
  not auth.

  Structurally this is a PORT seam (the cleanest option, mirroring how
  `samplingHandler`/`elicitationPrompter` are injected): `@/mcp` MUST NOT import
  `@/connectors`/`@/auth` (slice isolation, RFC §3.1 — `@/mcp` depends on
  `@/shared` only), so the slice ships only `McpOAuthProviderPort`
  (`src/mcp/oauth/`) + a safe default (`headlessOAuthRejecter`, obtains no
  token). The connectors-backed implementation
  (`createConnectorsMcpOAuthProvider`) lives in the host layer
  (`src/host/runtime/mcp-oauth-provider.ts`) — the only layer allowed to reach
  both `@/mcp` and `@/connectors` — and runs discovery → (DCR if no static
  client id) → PKCE browser flow → authorization-code exchange → token store →
  reuse/refresh/re-auth. The `McpClient` consults the port ONLY when a server
  config opts in (`oauth: true`) AND a provider is wired; it resolves the bearer
  BEFORE constructing the HTTP carrier (which reads static headers at
  construction) and attaches `Authorization: Bearer <token>` to every request.
  Tokens persist via the connectors `TokenStorePort` (a file store with 0600 is
  acceptable; a keyring can bind the same port later) and are NEVER logged.

  Opt-in is double-gated (advertise-iff-able): `buildMcpOAuthWiring(enabled,
  deps)` returns a provider ONLY when `QUANTA_MCP_OAUTH=1` AND deps are present;
  the per-server `oauth: true` flag is the second gate. Default-OFF is
  byte-identical: no provider wired ⇒ the client falls back to the headless
  rejecter, the transport is built eagerly exactly as before, and no discovery /
  flow / header occurs. A failed/declined login degrades to an unauthenticated
  request (the server answers 401, surfaced like any other error) — `tokenFor`
  is TOTAL (resolves `undefined`, never throws into the MCP load).

  LIVE-WIRED (jun-06): the provider is now reachable end-to-end. The CLI
  composition root `resolveMcpOAuthProvider` (src/apps/cli/internal.ts) builds the
  connectors-backed `McpOAuthProviderPort` (file token store + injected fetch /
  clock / generic loopback+PKCE browser flow over `@/auth/chatgpt-oauth` /
  per-server issuer = the server `url` origin; zero-config DCR when no static
  client id) and threads it into EVERY `McpClient` through
  `applyMcpClientWiring`'s `oauthProvider` opt — on BOTH the single-client and the
  supervised (auto-restart) path. So a configured `oauth:true` HTTP server now
  resolves a bearer at load. Sealed by
  tests/unit/mcp-oauth-keyring-reachability-hellgate.test.ts (knob-on ⇒ bearer on
  the wire; knob-off ⇒ no provider, byte-identical).

  Remaining gap (honest): the interactive `/mcp login <server>` command
  (src/apps/cli/mcp-cmd.ts `ctx.mcp.login`) is NOT yet bound to this provider, so
  the on-demand re-auth command still reports "OAuth not enabled" — the provider
  is wired into the AUTO load path (resolves a token at server start), not the
  manual `/mcp login` REPL seam. Binding `ctx.mcp.login` to the wired provider's
  `tokenFor`/`invalidate` is the next step.
