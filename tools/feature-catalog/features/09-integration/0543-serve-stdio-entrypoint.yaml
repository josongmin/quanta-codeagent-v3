purpose: |
  The IDE/sidecar side of ticket 01's public SDK door: `quanta serve --stdio`
  makes quanta a session.v1 server an external client (`connect()` +
  transports.stdio) drives over the child's stdin/stdout — the Codex app-server
  pattern. GATE `QUANTA_SERVE_STDIO=1` (gateOnStrict, a stray on/true refused;
  OFF ⇒ exit 64, stdout EMPTY, guidance on stderr — NOT in CLI_FEATURE_GATES so
  never auto-seeded to "1"). Wiring: createSessionStdioTransport(stdin /
  protocol-stdout) → openHeadlessRuntimeSession's input.transport (which
  attaches the transport to a real headless RuntimeSession); --cwd/--model/
  --permission-mode flags. stdin EOF and SIGTERM both drive session.close()
  (JsonlSessionEventLog lock release) → exit 0 (graceful, not a signal death);
  no child/PTY residue. stdout is the PURE protocol channel — every log/banner
  goes to stderr, and a child tool's (bash) stdout must not inherit it.

  GAP-3 (transport stamp honesty): base.ts capabilities.transport was hardcoded
  "inproc" for every session (a lie for websocket web-daemon). A presence-only
  composition seam (base.sessionTransport ?? "inproc", the W1-B
  serverAutoContinues pattern) lets serve stamp "stdio" and web-daemon
  "websocket" — completing the conformance 3-way "different-is-correct"
  assertion. Heartbeat responder hoisted web-daemon → @/ipc/session (shared by
  every session.v1 server).

  STATUS: COMPLETE (10/10 e2e green — approval WIRE-delegation landed 5b4110f18 via the 3rd 'wire-defer' headless mode: gate OFF exit64/empty-stdout,
  core connect→append→turn.run→awaitTurnEnd + transport==="stdio", stdin-EOF /
  SIGTERM exit0, stdout-purity + polluter control). Approval coverage includes
  approve, deny with typed settlement/no tool effect, and two sequential exact-id
  approvals with both real tool effects.
  Approval precedence is fail-closed: this surface's explicit wire delivery
  wins over an inherited QUANTA_INLINE_APPROVAL_RESOLVER=1, so a parent process
  cannot silently replace connect({onApproval}) with inline auto-approval.
