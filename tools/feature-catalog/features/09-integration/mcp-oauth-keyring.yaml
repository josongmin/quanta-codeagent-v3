      - tests/unit/mcp-oauth-keyring-adapter-hellgate.test.ts
knobs:
  - name: QUANTA_MCP_OAUTH_KEYRING
    default: 'undefined'
    purpose: 'Strict =="1" opt-in. ON (+ QUANTA_MCP_OAUTH=1 + the OS keyring available()) ⇒ the composition root injects composeTokenStore(realKeyring, fileStore) for the H18 MCP OAuth TokenStorePort: tokens persist in the OS Keychain/libsecret, an existing 0600 file token is migrated in on first read, delete spans both stores. OFF / no keyring ⇒ the 0600 file store is injected unchanged (byte-identical).'
notes: 'Closed-port: the OS CLI runs through an injected KeyringExec (Bun.spawn argv-array, no shell) — secrets travel ONLY via stdin, never argv (no ps-visible token). Read/probe/delete are NO-THROW so a keyring outage degrades to re-login via the H18 TOTAL tokenFor; set() THROWS on a non-zero exit (write did not persist) so compose engages the 0600 file fallback instead of silently dropping the token. Windows Credential Manager is a follow-up (null keyring keeps it correct meanwhile). Phase 3 (RFC §7): generalize the same KeyringPort to back chatgpt-oauth + trust-scope stores (self-documented follow-ups).'
