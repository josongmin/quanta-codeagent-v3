    - src/host/runtime/keyring/port.ts
    - src/host/runtime/keyring/macos.ts
    - src/host/runtime/keyring/libsecret.ts
    - src/host/runtime/keyring/null.ts
    - src/host/runtime/keyring/compose.ts
    - src/host/runtime/keyring/serialize.ts
    - src/host/runtime/keyring/select.ts
    - src/host/runtime/keyring/index.ts
    - src/host/runtime/index.ts
    - src/host/runtime/mcp-oauth-provider.ts
    - src/shared/runtime-config.ts
  adrs: [160]
  tests:
