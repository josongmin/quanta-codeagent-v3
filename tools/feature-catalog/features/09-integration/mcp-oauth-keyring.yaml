id: mcp-oauth-keyring
title: MCP OAuth token storage in the OS keyring (Keychain / libsecret), file-fallback + migration
section: 9
subsystem: MCP HTTP transport authentication
order: 479
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: integrated
owners: ["@songmin"]
labels: [security, secret-at-rest]
depends_on: [mcp-http-oauth]
config_refs:
  env: [QUANTA_MCP_OAUTH_KEYRING]
  runtime: [mcpOAuthKeyring]
purpose: |
  Harden H18 (`mcp-http-oauth`) credential STORAGE: an OPTIONAL `KeyringPort`
  (closed-port, injected exec — NOT a hard-coded `child_process`) so MCP OAuth
  tokens live in the OS secret store — macOS Keychain (`security`) / Linux
  libsecret (`secret-tool`, Secret Service) — instead of a 0600 plaintext file
  readable by anyone with the user's UID. `composeTokenStore(keyring, file)` is a
  drop-in `TokenStorePort` DECORATOR: read prefers the keyring, write goes to the
  keyring, with the existing 0600 file store as the FALLBACK when no keyring is
  available (headless Linux without a session keyring, etc.). A one-directional,
  idempotent migration moves a file-only token into the keyring on first read and
  deletes the file copy; delete spans BOTH stores so a logout leaves no residue.

  Failure contract: reads/probes/deletes are NO-THROW — a locked/denied keychain
  or a missing session bus is swallowed and treated as "secret absent", so the
  H18 provider's TOTAL `tokenFor` re-runs the OAuth flow rather than crashing the
  MCP load (worst case "log in again", never a crash). WRITE is the deliberate
  exception: a `set` whose OS CLI exits non-zero (write did NOT persist) THROWS a
  SECRET-FREE error so `composeTokenStore.write` falls back to the 0600 file store
  — without this the token would be SILENTLY DROPPED (the caller would believe it
  persisted; a later read returns nothing ⇒ surprise re-auth + a lost in-memory
  record). The secret NEVER appears on argv: macOS
  uses `security add-generic-password -w` with NO value (reads the password from
  the input stream) and libsecret `secret-tool store` reads STDIN by design, so
  the token is never visible to `ps` / `/proc/<pid>/cmdline`; it is never logged.

  Default-OFF, byte-identical: gated by `QUANTA_MCP_OAUTH_KEYRING=1` AND
  `QUANTA_MCP_OAUTH=1` AND the OS keyring `available()`. Unset ⇒ the composition
  root injects the file store exactly as today; no keyring constructed, no
  migration, no behavior change. This is a storage backend, not an agent-callable
  surface — no tool / manifest change.
