id: screen-ocr-native-sidecar
title: Screen OCR native sidecar — Swift CLI (ScreenCaptureKit + Vision) for Tauri shell
section: 9
subsystem: Native sidecar (ADR-0318)
order: 30
maturity: L2
status: new
ui_surfaces: [tauri]
monitoring: n-a
modes: [interactive]
configurable: integrated
config_refs:
  env: [SCREEN_OCR_DEBUG]
owners: ["@songmin"]
labels: ["surface:tauri", "platform:macos"]
depends_on: []
purpose: |
  Tiny Swift CLI binary at native/screen-ocr/ that the Tauri shell (Worker D)
  spawns as a sidecar to feed quanta two host-desktop signals: (1) the list of
  on-screen windows the user can target, (2) a single captured frame of a
  chosen window plus its OCR text. Three subcommands — `list-windows`,
  `capture --window-id N [--include-image]`, `check-permission` — all emit
  single-line snake_case JSON on stdout followed by exactly one `\n`. Errors
  produce a typed envelope `{"error":{"code":"PERMISSION_DENIED|WINDOW_NOT_FOUND
  |CAPTURE_FAILED|OCR_FAILED|INVALID_ARGS|UNKNOWN","message":"..."}}` plus a
  closed exit-code table (0=ok, 1=unknown, 2=invalid-args, 3=permission,
  4=window-not-found, 5=capture/OCR). Stack: Swift 5.9, Swift Package Manager,
  apple/swift-argument-parser 1.3.0+, platform pin `.macOS(.v13)`, frameworks
  ScreenCaptureKit + Vision + Foundation + AppKit + CoreGraphics/Media/Video
  + ImageIO + UniformTypeIdentifiers. NO UIKit import (mac-only by construction).
  OCR config locked verbatim: VNRecognizeTextRequestRevision3 + accurate +
  usesLanguageCorrection + languages ["ko-KR","en-US"]; bboxes normalized 0..1
  and y-FLIPPED at the boundary from Vision's bottom-left-origin convention to
  the top-left-origin convention the rest of quanta uses; lines sorted
  top-to-bottom-left-to-right with a 0.01 y-tolerance band. Capture: SCContentFilter
  on the single target SCWindow, SCStreamConfiguration BGRA + matched
  width/height + captureResolution=.best (macOS 14+), single SCStreamOutput
  handler that resolves the first valid CMSampleBuffer → CGImage and
  immediately stops the stream, 5s wall-clock timeout. `--include-image` flag
  embeds the captured frame as base64 PNG in `image_png_b64`; when absent the
  field is JSON `null` (NOT omitted — distinguishes "no image requested" from
  "field missing"). Permission model: `check-permission` calls only
  `CGPreflightScreenCaptureAccess()`; it MUST NOT trigger the system prompt
  (which fires automatically the first time the host process reads
  `SCShareableContent.current`). Build: `cd native/screen-ocr && swift build -c
  release` → binary at `.build/release/screen-ocr`. Worker D copies the release
  binary to `apps/tauri-shell/binaries/screen-ocr`. L2 — sidecar is complete
  and unit-tested for its JSON wire shapes but not yet wired into the Tauri
  shell (Worker D track) and not yet exercised end-to-end against a live
  TCC-granted host.
