knobs:
  - name: SCREEN_OCR_DEBUG
    default: 'unset'
    purpose: 'When set to "1", the sidecar emits debug logs to STDERR (stdout stays JSON-only).'
deliberate_hold:
  reason: |
    Live ScreenCaptureKit + Vision integration is intentionally not unit-tested:
    it requires a TCC Screen Recording grant and a real display server. The
    end-to-end smoke lives on Worker D's Tauri shell track; this slice only
    guarantees the wire-shape contract.
  promotion_path: Worker D Tauri shell wires the binary as a sidecar + records a manual end-to-end smoke against a granted host → promote to L3.
notes: |
  Worker E of the 2026-05-26 multi-surface 4-worker sprint. First non-Rust
  native binary in the repo — placed at native/screen-ocr/ rather than crates/
  because Swift Package Manager isn't compatible with Cargo's workspace. Built
  to be a drop-in replaceable sidecar: if a future ADR swaps to a different
  capture/OCR stack, only this binary needs to change as long as the JSON wire
  contract holds. Negative invariants (locked in ADR-0318): mac-only (no UIKit
  ever); single-frame only (no streaming v1); stateless one-shot (every
  invocation re-resolves SCShareableContent); stdout JSON-only (debug to
  stderr behind SCREEN_OCR_DEBUG=1); check-permission MUST NOT prompt; no env
  knobs besides SCREEN_OCR_DEBUG; no Tesseract or non-Apple OCR engine ever.
