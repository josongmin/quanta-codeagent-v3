purpose: |
  Portable session schema v1 (snake_case wire) for round-tripping a saved
  session across surfaces. `exportSession(sessionId)` writes
  `{schema, version, meta, reason, messages}` — meta is intentionally tiny
  (id, title, cwd, timestamps, archived, git_{sha,branch,origin_url})
  so the wire schema stays stable while `@/session` evolves (NOT slice-
  internal storage details: file paths, index cache state, retention
  markers). `importSession(blob, opts)` validates strictly — a malformed
  blob is REJECTED with a typed `ImportError` over a closed
  `ImportErrorKind` union (not_an_object / schema_mismatch /
  version_unsupported / meta_invalid / messages_invalid); no coercion.
  Default: mint a FRESH `crypto.randomUUID()` id + fresh `createdAt` so
  the import is a visible new session, not a collision with an in-flight
  one. `titlePrefix` opt-in (e.g. `"[imported] "`).
  `PORTABLE_SESSION_VERSION = 1` — a future v2 bump MUST add migration
  code in `session-import.ts`.
evidence:
  code:
    - src/ipc/session-export.ts
    - src/ipc/session-import.ts
  adrs: []
  tests:
