knobs: []
deliberate_hold: null
notes: |
  Mirrors Claude Code A11's `importCliSession` direction (Web imports the CLI's
  session). Read-only on storage from the exporter side. `ImportErrorKind` is a
  string-discriminant for cross-process serialization (kind value stable across
  TS/JS process boundary).
