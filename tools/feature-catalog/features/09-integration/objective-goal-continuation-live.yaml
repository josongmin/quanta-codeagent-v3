surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-08-25"
  evidence:
    cli: "runs in the interactive CLI — surface-compose mints ONE objective authority and binds it to the `/goal` slash slot plus a shared live-turn holder. `startGoalWakeController` arms one goal-only quiet-window timer from a goal mutation, restored active objective, handled local command, or settled turn; at fire it rereads the same authority revision and all host quiescence guards before enqueue. Raw key activity cancels a pending wake before Enter, queued metadata is revision-checked again at dequeue, and the live-turn holder clears on both success and throw. Live proven by tests/e2e-pty/cli-goal-pursuit-e2e.test.ts: real CLI boot + PTY + replayed external queue reaches an actual agent turn, default-OFF and UI-idle-independent controls, partial-draft exclusion, plus a foreground-settlement rail. QUANTA_GOAL_ENFORCE OFF allocates neither holder nor wake timer."
    web: "CLI-only. The web/Tauri surface has no `/goal` slash slot and does not install the CLI wake controller; the objective itself reaches the web ObjectiveCard via the objective substrate, but pursuing-loop scheduling is not present on that surface."
purpose: |
  Promotes the previously-DEAD idle goal-continuation machine
  (`src/objective/continuation.ts`: `runIdleContinuation` /
  `ContinuationSemaphore` / `evaluateContinuation` — Codex `core/src/goals.rs`
  parity) from a hellgated-but-unreferenced primitive into a LIVE end-to-end
  CLI feature. Before jul-13 the machine round-tripped its tests but had ZERO
  production callers and the `QUANTA_GOAL_ENFORCE` → `goalContinuationEnforce`
  knob had ZERO readers (documented as future work in the
  objective-budget-enforce notes). This wave binds the seam:

  1. STORE MINT + SHARE — `surface-compose` builds exactly ONE objective store
     and threads the SAME instance to (a) the `/goal` slash slot (`ctx.goal`,
     persistent sessions only — ephemeral threads have no goal to pursue) and
     (b) the session loop, so the command the user types and the loop that
     pursues it read/write one SSOT.

  2. QUIET-WINDOW WAKE — `session-loop` calls `startGoalWakeController` over
     that authority next to the reactor bridge. A goal mutation, restored
     active goal, handled local command, or real turn settlement starts ONE
     goal-only quiet-window timer; local key activity cancels it before Enter.
     At fire the controller requires the exact captured
     objective revision and fresh host quiescence, then delegates to
     `runIdleContinuation`, which repeats the queue/turn/plan guards at the
     enqueue boundary. The queued continuation carries revision metadata and
     is checked again at dequeue before an agent body starts. It carries the goal text + a
     verify-before-complete instruction. Gated by QUANTA_GOAL_ENFORCE: OFF
     creates no wake controller or live-turn holder ⇒ byte-identical to a
     session that never opted in.

  3. COMMAND + CHIP — `/goal <objective>` records the active goal (or shows it
     with no args); the status-bar goal chip renders only while a goal is
     active (QUANTA_PILL_GOAL default-ON, so no idle clutter). The objective store
     is minted for the CLI surface; `QUANTA_GOAL_ENFORCE=1` controls only whether
     the quiet-window controller pursues the recorded goal.

  4. BOUNDED PROGRESS + COMPLETION EVIDENCE — each accepted turn captures the
     exact session thread/revision and appends one text-free, size-bounded
     receipt after settlement. Delayed receipts are rejected unless their
     after-revision still equals the live authority revision; replacement and
     restore normalize the bounded window. The next continuation receives only
     verifier-backed criterion IDs, remaining IDs, and last-attempt metadata.
     With `QUANTA_GOAL_JUDGE=shadow|reject`, an explicit model completion is
     deterministically admitted when the current objective is already
     blocker-free and derived complete from checked, passing verifier receipts;
     manual/mixed criteria go through the bounded judge. `off` is intentionally
     legacy-compatible and makes no judge request.

  Sibling to objective-budget-enforce: that entry gates the BUDGET half
  (`budget_limited` status suppresses continuation when a cap is exhausted);
  this entry wires the CONTINUATION half (the revision-fenced wake that re-issues the
  goal). Together they are the two live readers the objective substrate was
  built for. Slice fence: additive wiring in `src/apps/cli/repl/**`
  (surface-compose / session-loop / dispatch) +
  `src/apps/cli/{goal-continuation-hook,slash/goal-cmd,status-pills}.ts` and the
  existing ObjectiveAuthority persistence adapter; no second goal store exists.
