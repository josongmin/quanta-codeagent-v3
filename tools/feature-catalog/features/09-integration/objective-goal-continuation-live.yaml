knobs:
  - name: QUANTA_GOAL
    where: src/shared/runtime-config-knobs/knobs-b.ts (the preset in src/objective/goal-preset.ts seeds the three internal gates from it)
    default: 'true (ON)'
    purpose: Default-ON public preset for full goal-control behavior; QUANTA_GOAL=0 disables it and explicit internal overrides win.
  - name: QUANTA_OBJECTIVE_TOOLS
    where: src/host/runtime/objective-store-wire.ts (read site; seeded by src/objective/goal-preset.ts)
    default: 'inherits QUANTA_GOAL (ON)'
    purpose: Advanced internal gate for objective authority and tool exposure; an explicit value overrides the public preset.
  - name: QUANTA_GOAL_ENFORCE
    where: src/shared/runtime-config.ts
    default: 'inherits QUANTA_GOAL (ON)'
    purpose: Advanced internal gate for autonomous continuation; an explicit value overrides the public preset.
  - name: QUANTA_OBJECTIVE_BUDGET_ENFORCE
    where: src/shared/runtime-config.ts
    default: 'inherits QUANTA_GOAL (ON)'
    purpose: Advanced internal gate for objective budget enforcement; an explicit value overrides the public preset.
  - name: QUANTA_GOAL_QUIET_MS
    where: src/shared/runtime-config.ts
    default: '15000'
    purpose: Advanced quiet-window setting, clamped to a 15-second production minimum.
  - name: QUANTA_GOAL_MAX_BACKOFF_MS
    where: src/shared/runtime-config.ts
    default: '900000'
    purpose: Advanced ceiling for no-progress exponential backoff.
  - name: QUANTA_GOAL_MAX_AUTONOMOUS_TURNS
    where: src/shared/runtime-config.ts
    default: '20'
    purpose: Advanced hard cap when the objective has no lower explicit max-turns budget.
  - name: QUANTA_GOAL_JUDGE
    where: src/shared/runtime-config.ts
    default: 'off'
    purpose: Advanced shadow-only completion judge (enum; "shadow" observes, anything else is off). It can never mutate objective state — the authority owns completion.
deliberate_hold:
  reason: |
    Autonomous pursuit is deliberately limited to interactive CLI and web
    daemon. Headless is a one-shot/single-trajectory surface and batch is an
    externally-owned corpus/verdict surface; adding the wake controller would
    change their termination and budget semantics.
  promotion_path: |
    Promote headless only after defining a persistent goal-runner front door
    with host-owned dispatch/admission, persistence/resume,
    approval/cancellation, output-protocol versioning, and bounded
    crash/restart E2E. Batch remains excluded unless its benchmark owner
    explicitly adopts Goal semantics.
notes: |
  Evidence is intentionally limited to interactive CLI and web-daemon/IDE
  modes. Headless and batch are excluded because no front-door goal-pursuit E2E
  exists for those surfaces and the deliberate-hold contract is recorded in
  docs/plans/aug-25-goal-v2/tickets/current/R8-headless-batch-deliberate-hold.md.
  Monitoring is partial: typed skip reasons,
  deterministic receipts, and a turn-scoped settlement decision counter exist;
  wake/enqueue/completion/verifier lifecycle counters and live efficacy
  measurement remain operational follow-ups. Web always-on state is also
  partial: the complete `/goal` readout is on demand, while wake status and the
  latest settlement checkpoint are not projected outside the default-OFF
  observability pane. Default-ON is bounded
  by the user-created-goal precondition, explicit opt-out, quiescence fences,
  revision/attach-generation checks, verifier evidence, backoff, and hard caps.
  The optional completion judge remains shadow-only and cannot mutate objective state.
