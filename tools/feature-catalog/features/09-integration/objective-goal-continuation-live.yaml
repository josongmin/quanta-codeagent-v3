id: objective-goal-continuation-live
title: Goal control and bounded autonomous continuation (CLI + web daemon)
section: 9
subsystem: Objective substrate (ADR-0394)
order: 97
maturity: L3
status: new
ui_surfaces: [cli, web]
monitoring: partial
modes: [interactive, ide]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "codex-parity"]
depends_on: [objective-first-class, objective-tools, objective-budget-enforce, objective-verifier-runtime]
