knobs:
  - name: QUANTA_GOAL_ENFORCE
    where: src/shared/runtime-config.ts
    default: 'unset (OFF)'
    purpose: |
      `gateOn` opt-in → `goalContinuationEnforce`. OFF ⇒ the production wake
      controller is not constructed and no timer is armed ⇒ a session that never opted in
      is byte-identical (the objective is recorded but never auto-pursued). ON ⇒
      a fresh quiet window after a goal mutation or settled turn can enqueue one
      revision-fenced continuation until the goal is completed / paused /
      budget-limited.
  - name: QUANTA_GOAL_QUIET_MS
    where: src/shared/runtime-config-knobs/knobs-b.ts
    default: '15000'
    purpose: |
      Quiet period for goal pursuit only. It is deliberately independent of
      QUANTA_IDLE_MS and QUANTA_IDLE_SUPPRESS, which remain user-presence/UI
      controls; disabling UI idle suppression must not disable an active goal.
  - name: QUANTA_GOAL_JUDGE
    where: src/agent/tier1/objective-judge-observer.ts
    default: 'off'
    purpose: |
      Completion-review policy (GOAL-02). `off` allocates no judge. `shadow`
      builds a bounded, sanitized judge OBSERVER whose verdict is telemetry
      only — it never admits or denies completion. Completion itself is a
      deterministic projection of trusted evidence (user/system attestation
      for manual criteria, bound passing verifier receipts for checked ones)
      owned by the objective policy table. The former `reject` value is retired
      and parses to `off`. Production observer invocation waits for the
      GOAL-04 session task lifecycle.
  - name: QUANTA_PILL_GOAL
    where: src/apps/cli/status-pills.ts
    default: 'unset (ON)'
    purpose: |
      `/goal` status chip. Default ON — it renders only while a goal is ACTIVE
      (state.goal set), so there is no idle clutter; opt-out via
      QUANTA_PILL_GOAL=0. Declared in src/apps/cli/cli-knobs.ts (status-ui).
deliberate_hold: null
notes: |
  aug-25 replaces the polling host trigger with an event-driven, revision-fenced
  quiet-window controller. The wake controller is not a second objective store:
  it reads the authority `/goal` mutates, cancels on raw local keys as well as
  submitted lines, shares the true runtime live-turn holder, and rechecks
  authority plus host quiescence before enqueue. Revision metadata survives the
  external queue and is checked again at dequeue. The live-turn holder clears in
  the agent entry `finally`, including uncaught loop errors. Its attempt
  reservation prevents duplicate enqueue; failed enqueue releases the claim for
  an explicit later retry. Turn progress receipts are bounded to 16 packets and
  32 short refs per list, survive the existing session objective snapshot, and
  are rejected on a stale live revision rather than being attached to a newer
  objective state; duplicate attempt keys are idempotently rejected rather than
  consuming the bounded evidence window.
  Host quiescence is fail-closed at both controller fire and core launch:
  throwing idle probes read as not-idle, while throwing plan/turn/queue/mailbox/
  ephemeral probes read as blocking rather than silently launching a wake.

  Completion review is agent-owned: no LLM dependency enters `@/objective` or
  `@/tool`. The optional judge receives a 32KB, delimited objective/receipt
  projection — never criterion prose, transcript, or tool-output text — and is
  constrained to 16KB of `{block|abstain}` JSON. A block is admitted only when
  every cited criterion is currently unmet and every supplied evidence ref is
  present in the projection. Timeout aborts the provider stream; cache keys use
  SHA-256, expired entries refresh, and the failure circuit retries after cooldown.
  All passing checked verifier receipts take the
      deterministic path and bypass the judge. In shadow mode the verdict is
      observation only; reject blocks only a real `block`, while malformed,
      timed-out, or circuit-open calls fail open.
      When the existing developer decision emitter is wired, each actual judge
      result emits `kind:"objective"` with only policy mode, model, SHA-256
      evidence digest, and closed-taxonomy reason codes; no criterion text,
      transcript, source digest, or evidence references enter telemetry.
      Every admission result carries the exact objective revision it judged;
      `objective_update(status=completed)` binds that revision into the
      authority's existing mutation CAS, so a concurrent objective change during
      deterministic or model judgment is rejected as stale before completion.

  jul-13 (Codex multi_agent / goal-pursuit parity). This is the "Promotion for
  the continuation half" that objective-budget-enforce's notes flagged as
  future work — `runIdleContinuation` / `ContinuationSemaphore` now have their
  first production caller (`src/apps/cli/goal-continuation-hook.ts`) and
  `goalContinuationEnforce` has its first reader.

  Hellgate coverage: goal-pursuit-chain-hellgate retains set → active → legacy
  ticker → resume primitive coverage; goal-wake-controller adds default-OFF,
  generation, revision, quiescence, dedup, and retry fences; goal-wake-hook
  proves the host binding; goal-pursuit-prompt-hellgate pins the continuation
  turn carries the goal text + verify-before-complete instruction;
  status-pills-goal-chip-hellgate pins the chip render/hide; the PTY e2e
  (cli-goal-pursuit-e2e) boots the REAL CLI and drives `/goal` so the surface
  mint+share+edge wake+external queue+actual agent turn is proven live (not a
  stub); its controls prove default-OFF, UI-idle independence, partial-draft
  exclusion, and re-arm only after foreground body settlement.

  `/goal` registration: listed in BUILTINS via SESSION_SLASH_COMMANDS
  (category "session"), describe present. It is deliberately NOT in the
  env-gated not-wired drift-guard (surfaced-features-slash.hellgate) — its
  wiring predicate is sessionId presence, not an env flag, so its not-wired
  branch exits 0 (documented) rather than the exit-2 + `hint: set <GATE>=1`
  contract that env-gated commands follow.

  Efficacy is measure-first: QUANTA_GOAL_ENFORCE ships OFF; the pursuing loop
  is a behavior lever whose value (does idle continuation improve long-horizon
  task completion) is unmeasured. A budget-limited goal does NOT auto-resume
  (the budget half, objective-budget-enforce, gates it), so the two objective
  substrate halves compose.
