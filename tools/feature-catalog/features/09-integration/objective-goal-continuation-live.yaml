surface_integration:
  cli: full
  web: partial
  method: audited
  verified: "2026-08-31"
  evidence:
    cli: "Real PTY boots the source or installed CLI, proves default-ON command discovery, explicit QUANTA_GOAL=0 opt-out, goal create/show, autonomous queue execution, draft/background/foreground quiescence fences, and goal-only quiet-window behavior; a real process kill plus resume-by-id proves the objective — and a clear — survive a restart; a settled attributed turn ANNOUNCES itself, so progress is visible without typing /goal; and the operator can attest a manual criterion (`criterion done`) or free a stuck attempt (`abandon`)."
    web: "Web-daemon composition submits authority-validated autonomous and user-requested goal turns, and the browser `/goal` controls are now complete under the separate `web-goal-controls` feature: generated structured identity-bearing readout, viewed-revision CAS, correlated receipts, unblock/criterion/check, and the shared verifier all have real-daemon evidence. This broader continuation feature remains PARTIAL on web because wake status and settlement checkpoints are not projected into the browser's always-on state surface, and the ObservabilityPane ObjectiveCard remains behind the default-OFF QUANTA_OBSERVABILITY gate. `pause` also fences the next autonomous resume; it does not cancel a turn already running."
purpose: |
  The complete goal preset is enabled by default in CLI and web-daemon roots:
  objective tools, budget enforcement, and bounded autonomous continuation.
  `QUANTA_GOAL=0` is the public opt-out, and explicit internal settings are
  never overwritten. No autonomous turn starts until a user creates a goal.

  Codex-parity behavior:
  - `/goal` creates, shows, edits, pauses, resumes, clears, and verifies one
    typed objective owned by the current session/thread.
  - An active goal can schedule another turn after a quiet window on both the
    interactive CLI and web-daemon runtime.
  - Attach/session switch replaces the objective atomically with transcript
    ownership and cancels the prior generation before re-arming.

  Quanta safety extensions:
  - Objective mutations and completion use revision CAS. Queued continuations
    carry objective identity/revision and are revalidated at dequeue.
  - Checked completion requires a verifier receipt bound to a before/after
    source digest; model text cannot forge it.
  - The wake policy enforces exponential no-progress backoff, infrastructure
    cooldown, explicit budgets, and a product hard cap.
  - Host quiescence blocks plan mode, approval, draft, attach, queued input,
    foreground work, and detached/background work.
  - Model/continuation blockers become state only after three distinct turn
    attempts report the same typed dependency; user/system blockers remain
    immediate.
