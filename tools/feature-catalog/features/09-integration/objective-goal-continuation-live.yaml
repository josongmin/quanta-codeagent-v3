  evidence:
    cli: "Real PTY boots the source or installed CLI, proves default-ON command discovery, explicit QUANTA_GOAL=0 opt-out, goal create/show, autonomous queue execution, draft/background/foreground quiescence fences, and goal-only quiet-window behavior."
    web: "Web-daemon composition submits a one-use, authority-validated goal-continuation capability through RuntimeSession.turn.submitGoalContinuation; an integration test proves concurrent user input stays outside the autonomous turn. A real WebSocket client also asks for ONE user-requested goal turn with a `goalWork` frame (peeked before the session bridge, host-minted user-requested-goal-work provenance): a real-daemon e2e proves it charges the user turn budget and mints a receipt without touching the autonomous hard cap, and that every refusal is answered on the same socket."
purpose: |
  The complete goal preset is enabled by default in CLI and web-daemon roots:
  objective tools, budget enforcement, and bounded autonomous continuation.
  `QUANTA_GOAL=0` is the public opt-out, and explicit internal settings are
  never overwritten. No autonomous turn starts until a user creates a goal.

  Codex-parity behavior:
  - `/goal` creates, shows, edits, pauses, resumes, clears, and verifies one
    typed objective owned by the current session/thread.
  - An active goal can schedule another turn after a quiet window on both the
    interactive CLI and web-daemon runtime.
  - Attach/session switch replaces the objective atomically with transcript
    ownership and cancels the prior generation before re-arming.

  Quanta safety extensions:
  - Objective mutations and completion use revision CAS. Queued continuations
    carry objective identity/revision and are revalidated at dequeue.
  - Checked completion requires a verifier receipt bound to a before/after
    source digest; model text cannot forge it.
  - The wake policy enforces exponential no-progress backoff, infrastructure
    cooldown, explicit budgets, and a product hard cap.
  - Host quiescence blocks plan mode, approval, draft, attach, queued input,
    foreground work, and detached/background work.
  - Model/continuation blockers become state only after three distinct turn
    attempts report the same typed dependency; user/system blockers remain
    immediate.
