surface_integration:
  cli: full
  web: full
  method: audited
  verified: "2026-08-26"
  evidence:
    cli: "Real PTY boots the source or installed CLI, proves default-OFF command absence, goal create/show, autonomous queue execution, draft/background/foreground quiescence fences, and goal-only quiet-window behavior."
    web: "Web-daemon composition submits a one-use, authority-validated goal-continuation capability through RuntimeSession.turn.submitGoalContinuation; an integration test proves concurrent user input stays outside the autonomous turn."
purpose: |
  Public `QUANTA_GOAL=1` enables the complete goal preset: objective tools,
  budget enforcement, and bounded autonomous continuation. The preset remains
  default OFF and does not override explicit internal settings.

  Codex-parity behavior:
  - `/goal` creates, shows, edits, pauses, resumes, clears, and verifies one
    typed objective owned by the current session/thread.
  - An active goal can schedule another turn after a quiet window on both the
    interactive CLI and web-daemon runtime.
  - Attach/session switch replaces the objective atomically with transcript
    ownership and cancels the prior generation before re-arming.

  Quanta safety extensions:
  - Objective mutations and completion use revision CAS. Queued continuations
    carry objective identity/revision and are revalidated at dequeue.
  - Checked completion requires a verifier receipt bound to a before/after
    source digest; model text cannot forge it.
  - The wake policy enforces exponential no-progress backoff, infrastructure
    cooldown, explicit budgets, and a product hard cap.
  - Host quiescence blocks plan mode, approval, draft, attach, queued input,
    foreground work, and detached/background work.
  - Model/continuation blockers become state only after three distinct turn
    attempts report the same typed dependency; user/system blockers remain
    immediate.
