knobs:
  - name: QUANTA_GOAL
    where: src/objective/goal-preset.ts
    default: 'true (ON)'
    purpose: Default-ON public preset for full goal-control behavior; QUANTA_GOAL=0 disables it and explicit internal overrides win.
  - name: QUANTA_OBJECTIVE_TOOLS
    where: src/objective/goal-preset.ts
    default: 'inherits QUANTA_GOAL (ON)'
    purpose: Advanced internal gate for objective authority and tool exposure; an explicit value overrides the public preset.
  - name: QUANTA_GOAL_ENFORCE
    where: src/shared/runtime-config.ts
    default: 'inherits QUANTA_GOAL (ON)'
    purpose: Advanced internal gate for autonomous continuation; an explicit value overrides the public preset.
  - name: QUANTA_OBJECTIVE_BUDGET_ENFORCE
    where: src/shared/runtime-config.ts
    default: 'inherits QUANTA_GOAL (ON)'
    purpose: Advanced internal gate for objective budget enforcement; an explicit value overrides the public preset.
  - name: QUANTA_GOAL_QUIET_MS
    where: src/shared/runtime-config.ts
    default: '15000'
    purpose: Advanced quiet-window setting, clamped to a 15-second production minimum.
  - name: QUANTA_GOAL_MAX_BACKOFF_MS
    where: src/shared/runtime-config.ts
    default: '900000'
    purpose: Advanced ceiling for no-progress exponential backoff.
  - name: QUANTA_GOAL_MAX_AUTONOMOUS_TURNS
    where: src/shared/runtime-config.ts
    default: '20'
    purpose: Advanced hard cap when the objective has no lower explicit max-turns budget.
deliberate_hold: null
notes: |
  Evidence is intentionally limited to interactive CLI and web-daemon/IDE
  modes. Headless and batch are excluded because no front-door goal-pursuit E2E
  exists for those surfaces. Monitoring is partial: typed skip reasons and
  deterministic receipts exist, but production decision counters and live
  efficacy measurement remain an operational follow-up. Default-ON is bounded
  by the user-created-goal precondition, explicit opt-out, quiescence fences,
  revision/attach-generation checks, verifier evidence, backoff, and hard caps.
  The optional completion judge remains shadow-only and cannot mutate objective state.
