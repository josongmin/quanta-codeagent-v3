knobs:
  - name: QUANTA_GOAL
    where: src/objective/goal-preset.ts
    default: 'unset (OFF)'
    purpose: Public opt-in preset for the full goal-control behavior; explicit internal overrides win.
  - name: QUANTA_OBJECTIVE_TOOLS
    where: src/objective/goal-preset.ts
    default: 'unset (OFF)'
    purpose: Advanced internal gate for objective authority and tool exposure.
  - name: QUANTA_GOAL_ENFORCE
    where: src/shared/runtime-config.ts
    default: 'unset (OFF)'
    purpose: Advanced internal gate for autonomous continuation.
  - name: QUANTA_OBJECTIVE_BUDGET_ENFORCE
    where: src/shared/runtime-config.ts
    default: 'unset (OFF)'
    purpose: Advanced internal gate for objective budget enforcement.
  - name: QUANTA_GOAL_QUIET_MS
    where: src/shared/runtime-config.ts
    default: '15000'
    purpose: Advanced quiet-window setting, clamped to a 15-second production minimum.
  - name: QUANTA_GOAL_MAX_BACKOFF_MS
    where: src/shared/runtime-config.ts
    default: '900000'
    purpose: Advanced ceiling for no-progress exponential backoff.
  - name: QUANTA_GOAL_MAX_AUTONOMOUS_TURNS
    where: src/shared/runtime-config.ts
    default: '20'
    purpose: Advanced hard cap when the objective has no lower explicit max-turns budget.
deliberate_hold:
  reason: |
    Default-on promotion is held. Safety behavior is covered by deterministic
    unit, integration, and PTY rails, but there is no live efficacy baseline or
    production smoke receipt for long-horizon task completion.
  promotion_path: |
    Run a separate live smoke campaign, establish outcome/latency/cost
    baselines, and require zero overlap, duplicate, stale execution, forged
    checked completion, and unavailable-to-completed transitions before
    considering a default change.
notes: |
  Evidence is intentionally limited to interactive CLI and web-daemon/IDE
  modes. Headless and batch are excluded because no front-door goal-pursuit E2E
  exists for those surfaces. Monitoring is partial: typed skip reasons and
  deterministic receipts exist, but production decision counters and live
  efficacy measurement are not yet promotion-grade. The optional completion
  judge remains shadow-only and cannot mutate objective state.
