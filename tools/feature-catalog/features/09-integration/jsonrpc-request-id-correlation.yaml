notes: |
  Brand-only at the type level (`Id<"JsonRpcRequestId">`), so the runtime
  cost is zero and the type system blocks raw-number passes at compile
  time. Pairs with `jsonrpc-codec` (the encoder accepts a `JsonRpcId`).
