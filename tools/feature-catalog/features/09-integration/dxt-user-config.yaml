    integration: []
    contract: []
knobs:
  - name: user_config (manifest block)
    default: 'absent (OFF)'
    purpose: 'A DXT manifest that declares NO user_config / platform_overrides parses byte-identically to today and interpolateLaunchSpec returns the spec unchanged. The feature activates only when an author opts in by adding the add-only block; host wiring (schema compose + interpolate-at-spawn + safeStorage SecretStorePort) is LANDED in dxt-loader.ts (DxtUserConfigExtension spread :91, resolveFields :232, interpolateLaunchSpec :234, skip-launch :243).'
deliberate_hold: null
notes: |
  LANDED: the integration is wired into src/plugin-isolation/dxt-loader.ts —
  it spreads ...DxtUserConfigExtension onto the manifest schema (:91), injects the
  SecretStorePort (:53), calls resolveFields(block, userValues, secrets) (:232)
  and interpolateLaunchSpec(...) (:234) between validate and spawn, and handles
  the kind:"skip-launch" outcome (:243).
  Port inversion is the security crux: sensitive values must never land in the
  spawn spec, but the slice cannot import the host keychain, so SecretStorePort
  is injected (mirrors @/permission ClassifierPort) keeping the module @/shared-
  only and unit-testable with a spy double. All bounds are named/justified
  constants (MAX_USER_CONFIG_FIELDS / _KEY_LEN / _VALUE_LEN / _MULTIPLE /
  MAX_TOKENS_PER_STRING) — no magic numbers. The slice reads NO ambient state;
  platform + system dirs are injected, proven by the hellgate.
