id: objective-verifier-runtime
title: Current-source objective verifier runtime
section: 9
subsystem: Objective substrate (ADR-0394)
order: 96
maturity: L3
status: new
ui_surfaces: [cli, web]
monitoring: partial
modes: [interactive, ide]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "verification"]
depends_on: [objective-first-class, objective-tools]
config_refs:
  env: [QUANTA_GOAL, QUANTA_OBJECTIVE_TOOLS]
surface_integration:
  cli: full
  web: full
  method: audited
  verified: "2026-08-31"
  evidence:
    cli: "The CLI goal facade attaches the verifier and exposes `/goal verify`; the objective tool uses the same port."
    web: "The shared runtime objective authority attaches the same verifier port used by web-daemon sessions and objective tools."
purpose: |
  Executes every checked success criterion as token-preserving argv in the
  workspace cwd with a bounded timeout and a scrubbed environment. Every check
  runs under a verifier-owned `workspace-write`, network-deny OS sandbox; an
  unavailable or degraded backend fails before command spawn, and the verifier
  explicitly skips the installed CLI sandbox slot to prevent double wrapping.
  It captures a deterministic Git-worktree source digest before and after the batch, hashes
  stdout/stderr instead of retaining output text, and atomically applies the
  result only when objective identity, revision, check identity, and source
  digest are still current.

  A missing Git validation contract, source mutation during verification,
  timeout, non-zero exit, duplicate attempt, or revision race cannot produce a
  checked-completion receipt. Freshness reconciliation before attributed-attempt
  settlement invalidates a prior receipt whose source digest no longer matches.
  CLI and web operator reads also run the canonical reconciliation before their
  post-reconcile authority read. Their closed freshness state prevents unresolved
  or stale checked completion from being presented as current proof.
