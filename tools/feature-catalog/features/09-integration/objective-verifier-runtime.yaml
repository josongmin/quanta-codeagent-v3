deliberate_hold: null
notes: |
  The verifier is deterministic authority, not an LLM judge. It records only
  exit/timing metadata, hashes, and a versioned execution posture; command output
  text is not persisted in the objective. Legacy receipts without posture restore
  as explicit v0 unknown and cannot satisfy checked completion. The strict posture
  claims workspace-write fencing, network deny, sandbox application, and runner
  version; it does not claim CPU or memory isolation. Monitoring remains partial
  because production decision counters are not yet a promotion-grade telemetry
  pipeline.
