notes: |
  Reviewer ⇒ ApprovalDecision mapping reduces multi-verb to 2-arm
  (`isAllowed(dec.outcome) ? approve : deny`); `modify` is reserved for a
  future modify-capable reviewer. The downstream gate still consumes the full
  ReviewDecision via closure — only the attribution record loses verb
  distinction. Acceptable: attribution answers "was the agent allowed", not
  "by what rule". request_user_input wiring is a separate follow-up (different
  return shape — UserInputOutcome 2-arm vs reviewer multi-verb).
