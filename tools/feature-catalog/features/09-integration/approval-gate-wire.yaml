purpose: |
  Closed-port adapter (`createApprovalGate({ approvalSM?, now? })`) that wraps
  `ApprovalStateMachinePort.request` + `settle` around a host-supplied HITL
  resolver. Admissibility-gate imports + wraps `reviewAction` at `reviewAndDecide`
  so every reviewer escalation creates its ApprovalRequest before awaiting the
  reviewer, keeping the unresolved prompt visible in per-thread
  Objective.blockers + Run Ledger.waiting(), then settles the same record on a
  terminal decision or resolver error.

  Default-OFF: `opts.approvalStateMachine === undefined` ⇒ byte-identical legacy
  resolver passthrough, zero SM calls, `approvalId === ""`. A host opting into
  attribution sets `config.admissibility.approvalStateMachine` to a
  `createApprovalStateMachine({ objective, ledger })` instance.

  NO-THROW at the SM boundary: hostile/misbehaving SM cannot perturb the gate's
  contract (request() throws ⇒ resolver still runs with empty approvalId;
  settle() throws ⇒ resolution still returned). Resolver throws DO propagate
  but the gate first best-effort settles "deny" so the record closes out.

  Slice fence (closed): imports = `@/agent/approval-state-machine` (TYPES ONLY).
  NO `@/agent/admissibility-gate`, NO `@/agent/loop`, NO `@/agent/dispatch`,
  NO `@/agent/types`. The admissibility-gate IMPORTS this slice — one-way.

  Wire diff at the gate is 30 lines, additive, no logic mutation: opts slot
  declaration + 1 line replaced with `gate.open(req, async () => { dec =
  await reviewAction(...); return isAllowed(dec.outcome) ? "approve" : "deny" })`.
  The closure captures the full multi-verb ReviewDecision for downstream paths.
