notes: |
  L3: the slice + 6 tools + tmux backend are wired (DefaultToolPorts.ptySession)
  + manifest + knob; 15 hellgate cases over a Fake backend + a fake TmuxExec
  (resumable-read cursor, resize bounds, write cap, allow-prefix jail, send-keys
  literal, capture-pane diff). Deferred: the host composition-root that mints a
  real tmux/Bun `PtySessionPort` from `runtimeConfig().ptyAttach`; the Bun-native
  `bun-pty-adapter` (Phase-1b); a live `which tmux`-gated e2e.
