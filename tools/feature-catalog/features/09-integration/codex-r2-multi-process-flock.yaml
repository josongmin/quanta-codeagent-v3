id: codex-r2-multi-process-flock
title: Multi-process lockfile for jsonl disk-adapter (ADR-0356)
section: 9
subsystem: per-session O_EXCL lockfile for disk-persistent session registry
order: 103
maturity: L3
status: stable
ui_surfaces: [n-a]
monitoring: none
modes: [n-a]
configurable: n-a
owners: ["@songmin"]
labels: ["surface:core", "absorbed:codex", "default-off"]
depends_on:
  - codex-r2-disk-persistence-and-env-swap
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 4/4 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure internal lockfile primitive (monitoring none, ui_surfaces n-a); no user-visible affordance anywhere"
purpose: |
  Closes ADR-0348 single-writer assumption. Per-session lockfile
  (`<storageDir>/<sessionId>/.lock`) acquired via Node `wx` flag
  (O_CREAT|O_EXCL|O_WRONLY|0o600) so concurrent quanta instances
  serialize disk writes per sessionId. Stale-lock detection at
  30s mtime threshold reclaims locks abandoned by crashed processes.
  Disk-store gates every meta/events/cache mirror write on the lock
  promise; acquire failure (timeout/fs error) degrades to memory-only.
  Process-local refcount holder map keeps the lock re-entrant for
  same-PID callers so ADR-0348's existing "two registry instances
  same PID" tests pass unchanged.
evidence:
  code:
    - src/agent/session-resource-registry/disk-adapter/file-lock.ts
    - src/agent/session-resource-registry/disk-adapter/disk-store.ts
    - src/agent/session-resource-registry/disk-adapter/types.ts
    - src/agent/session-resource-registry/index.ts
  adrs:
