purpose: |
  6-ADR R13 closeout — every gap from R12's follow-up list landed TDD-strict
  (each hellgate case authored RED-first, GREEN-confirmed, REFACTOR-pinned).
  ADR-0372 closes the ADR-0368 architectural mismatch via a caller-owned-
  registry builder; assemble.ts ternary becomes 3-case (cfg.metrics present
  ⇒ mint per-call registry with disk-adapter metricsEmitter pre-wired).
  ADR-0373 wires sweep telemetry into ADR-0369 auto-sweep — disk evicted /
  truncated + sqlite evicted / checkpointed + sweep_latency_ms (histogram-
  with-gauge-fallback). ADR-0375 adds opt-in WAL RESTART checkpoint
  (`walSizeThresholdBytes` knob, no default — workload-dependent per Codex
  14GB data). ADR-0374 + 0376 expand `/session-registry` slash with `evict
  <id>` (idempotent operator action) + `help` (sub-command + backend-detect
  discovery). ADR-0377 normalizes path display to forward-slash across
  in-memory/disk/sqlite + adds `RegistryStats.path?` read-only field.
