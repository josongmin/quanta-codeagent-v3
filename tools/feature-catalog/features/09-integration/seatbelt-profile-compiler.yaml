notes: |
  Design notes (deliberate, beyond literal spec): `pseudo-tty` + `/dev/ptmx`
  always allowed (any pty-buffered tool would otherwise break), `process-fork`
  allowed in every non-off profile (bash itself forks; denying it makes
  the sandbox useless — `process-exec` of new binaries is what is denied
  in `read-only` / `workspace-write`). Pairs with `landlock-degraded-passthrough`
  (Linux backend) and `defaultOsSandbox` (the platform-aware router).
