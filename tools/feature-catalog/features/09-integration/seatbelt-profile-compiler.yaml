id: seatbelt-profile-compiler
title: Seatbelt (SBPL) profile compiler — macOS sandbox-exec text
section: 9
subsystem: runtime/os-sandbox — macOS profile compilation
order: 41
maturity: L4
status: new
owners: ["@songmin"]
labels: ["surface:core", "absorbed:codex"]
depends_on: [landlock-degraded-passthrough]
purpose: |
  Pure compiler from a `SandboxPolicy` to a Seatbelt (SBPL) profile text
  suitable for `sandbox-exec -p '<text>'`. No I/O. Mirrors the Codex
  baseline (memory: `codex-seatbelt-sandbox-profile`) adapted to our
  5-arm closed profile enum. `compileSeatbeltProfile(policy, workspace)`
  returns `null` for profiles that should NOT be compiled (the caller
  passes the spawn through verbatim instead): `"off"` and
  `"danger-full-access"`. For every other profile the emitted text starts
  `(version 1)(deny default)`, then layers framework-read subpaths,
  per-profile FS read/write rules over the workspace and extras, and a
  network deny/allow. The workspace path's `"` is escaped defensively so
  an attacker-controlled workspace argument cannot break out of the SBPL
  string literal.
