notes: |
  jsonrpc.ts (encodeMessage + LineReader)는 이미 transport-agnostic이라
  미수정. 25 hellgate(byte-identical stdio + http SSE/JSON + 202 notif +
  malformed payload skip + envelope fail-closed) 봉인.
