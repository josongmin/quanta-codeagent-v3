id: mcp-transport-port-and-http-sse
title: MCP transport port + stdio 분리 + Streamable-HTTP/SSE 카리어 (ADR-0391)
section: 9
subsystem: MCP — transport 추상화 + 원격 서버 지원
order: 391
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "absorbed:mcp-spec"]
depends_on: [mcp-client, mcp-bridge]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 7/7 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure internal transport abstraction (stdio/http-sse carrier behind McpTransport interface); no UI affordance on any surface"
purpose: |
  client.ts core(request/dispatch/pending/timeout)는 불변. stdio start/send/pump/
  stop을 transport port 뒤로 분리 — `McpTransport`
  interface(start/send/onMessage/onExit/close). Impl:
  stdio, http-sse (Streamable-HTTP + SSE/JSON + Mcp-Session-Id + DELETE-on-close),
  IsolatedMcpTransport (plugin-isolation spawn; readyMode `dxt-ready-line` 또는
  `process-ready`). `.mcp.json`의 `url`이면 HTTP, `MCP_USE_ISOLATED_SPAWN`이면
  command 서버에 isolated process-ready, 둘 다 없으면 stdio (default
  byte-identical). `IsolatedMcpClient`는 별도 protocol core가 아니라
  `McpClient`+isolated(`dxt-ready-line`) facade. plugin manifest MCPServerSpecSchema에도
  url/headers optional (command non-empty OR url).
