purpose: |
  Four `BridgeTransport` implementations behind one closed shape so the
  EventBridge stays transport-agnostic. (1) `in-memory` — test fixture
  with `createInMemoryHub` for many-peer loopback (fully working).
  (2) `stdio` — line-delimited JSON over Node Readable/Writable, used by
  CLI ↔ daemon (fully working; the slice takes streams as INJECTED PORTS,
  never reads `process.stdin/stdout` directly). (3) `uds` — Unix Domain
  Socket; on-disk path convention `<home>/.quanta/ipc.sock`, framing reused
  from stdio so daemon can multiplex stdio (subprocess) + uds (local IPC)
  peers behind one envelope reader; `udsSocketPath()` is the canonical
  resolver (skeleton — connect/listen/accept dance in follow-up PR).
  (4) `websocket` — `WebSocketLike` adapter + `createWebSocketServerTransport`
  helper; interface complete, real server lib choice pending follow-up.
