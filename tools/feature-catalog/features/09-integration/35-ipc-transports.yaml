knobs: []
deliberate_hold:
  reason: uds + websocket are skeleton-only (path resolver + adapter shape) pending follow-up wiring PR; in-memory + stdio are production.
  promotion_path: 'uds: implement node:net listen/connect/accept + reuse stdio framing → integration test. websocket: pick ws lib (uWebSockets vs ws) → real server impl → integration test → L5.'
notes: |
  Wire framing is the SAME line-delimited JSON across stdio + uds so multiplex
  is trivial. `wrapDuplexAsUdsTransport` and `wrapWebSocketLikeAsTransport`
  let surface code adapt arbitrary duplex / WS-like objects without coupling
  `@/ipc` to a specific server lib.

  L4→L2: no test imports evidence.code paths