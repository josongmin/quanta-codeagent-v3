notes: |
  L3: duck-typed port mirror + 4 tool factory + PURE render(cap/blob-guard/
  non-text-placeholder) + DefaultToolPorts wiring + knob + manifest row 완비,
  default-OFF byte-identical. hellgate 39: happy(list/read/get/forward-args/
  empty) + typed-failure×4×4도구 + malformed-args + abort×4 + DoS(cap/blob/
  non-text) + **THE invariant(deriveProvenance=mcp + hostile-text defang 봉인)** +
  default-OFF 등록.
  **잔여(host, @/mcp + @/agent owned, N3 슬라이스 밖)**:
    (1) `src/mcp/resources/client-port.ts` — `clientResourcesPort`/`resourcesPortOver`
        (H19가 raw McpClient 메서드까지만 랜딩, tasks와 달리 port-over-client 어댑터 미존재).
        순수 pass-through, `tasks/client-port.ts` 미러.
    (2) `src/agent/mcp-bridge.ts` — `resourcesToolsFor(client)`: serverSupportsResources()/
        serverSupportsPrompts() 게이팅으로 subset 배선 + loadSingle/loadSupervised push,
        그래야 input.mcpTools로 들어가 origin=mcp 자동 태깅.
        (N3는 `DefaultToolPorts.mcpResources` 경로로 대체 배선 제공 — 호스트가 ResourcesHandle을
        mint해 채우면 즉시 라이브. bridge 경로는 같은 도구를 MCP 협상 결과에 게이팅하는 sugar.)
  Phase-2 deferred: prompt-template materialization(get_prompt 결과를 context로 직접
  주입) + resources/subscribe notification-stream 표면화.
