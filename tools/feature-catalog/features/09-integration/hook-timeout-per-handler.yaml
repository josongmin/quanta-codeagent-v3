id: hook-timeout-per-handler
title: Hook per-handler timeout (S5 hardening)
section: 9
subsystem: Hook bus hardening (S5)
order: 200
maturity: L4
status: stable
purpose: |
  Per-handler timeout race for the HookBus emit chain. A stuck handler used to
  block the agent loop forever (P0); S5 adds an opt-in race against
  setTimeout(reject) so the bus continues to the next handler and the loop
  stays responsive. Timeout is enforced ONLY when set — absent override means
  the legacy unbounded path runs byte-identically. Three layers of precedence:
  per-handler HookOnOptions.timeoutMs > constructor HookBusOptions.
  defaultTimeoutMs > env knob QUANTA_HOOK_TIMEOUT_MS > unbounded. On expiry
  the bus logs `hook.handler.timeout` with {event, elapsed, timeoutMs} (NO
  payload — anti-leak), bumps the emit's timeoutCount, and treats the slot
  as a no-op return.
evidence:
  code:
    - src/agent/hooks.ts
    - src/shared/runtime-config.ts
  adrs: []
  tests:
    unit:
      - tests/unit/hooks-timeout-cap-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - QUANTA_HOOK_TIMEOUT_MS
  - DEFAULT_HOOK_TIMEOUT_MS
deliberate_hold: null
notes: |
  No AbortSignal propagation today — a handler stuck in a sync busy loop
  still runs to completion (the timeout only short-circuits the AWAIT, not
  the work). For cooperative async handlers the contract is sufficient: the
  bus marks the slot timed-out and continues; the handler's eventual
  resolution is silently dropped by Promise.race. Default-OFF preserves
  legacy unbounded behavior for callers without an override.
