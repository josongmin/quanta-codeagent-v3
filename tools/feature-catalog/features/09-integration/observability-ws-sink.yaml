notes: |
  L4 promotion of ADR-0415 (which was L3 + a deliberate_hold whose stated
  promotion_path was exactly this: a daemon-level ws sink in server.ts). The
  emitter snapshot/delta frames now reach the connected UI pane live.
  14 hellgate cases / 37 expects against a fake ServerWebSocket recording
  `.send()` (gate-OFF byte-identical, snapshot-first-on-connect,
  delta-on-port-change, no-frame-when-unchanged, requestSnapshot re-emit,
  stop()-freeze + idempotent, two-connection independent snapshots,
  disconnect-one-keeps-sibling, throwing-send swallowed NO-THROW,
  hostile-socket mint never throws, frame decode round-trip).
