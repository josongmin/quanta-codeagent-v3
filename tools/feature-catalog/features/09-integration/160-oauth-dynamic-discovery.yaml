notes: |
  Phase 1 (2026-05-25). 흡수 출처: Cursor RFC 8414 well-known discovery + OIDC
  fallback (memory R4). What this is NOT: authorize/redirect/token-exchange flow
  (separate follow-up — `src/auth/chatgpt-oauth/` pattern generalized later).
  Hellgate seals 11 adversarial cases. Compatible with RFC 8414 §3.1 (issuer
  normalization), RFC 8414 §3.3 (404 → OIDC fallback).
