purpose: |
  `discoverOAuthEndpoints(issuer, fetchPort)` — RFC 8414 §3 well-known
  authorization-server discovery + OIDC openid-configuration fallback on 404.
  Returns typed `OAuthEndpoints` with `authorizeEndpoint` / `tokenEndpoint` /
  optional `registrationEndpoint`. Stable error arm via `OAuthDiscoveryError`:
  `well-known-404` / `well-known-malformed` / `missing-required-field` /
  `network-failed` — callers branch on `code` without string parse. Trailing
  slash in issuer URL normalized at entry (no double slash). Non-404 non-OK
  short-circuits (no fallback) — 5xx should not trigger OIDC probe. Pure DI:
  only `FetchPort` injected, no `globalThis.fetch` import.
evidence:
  code:
    - src/connectors/oauth-discovery.ts
    - src/connectors/types.ts
  adrs: ["docs/decisions/0160-connectors-rest-api.md"]
