knobs:
  - name: QUANTA_MIGRATE_CONFIG
    where: src/shared/runtime-config.ts (migrateConfig)
    default: false
    purpose: |
      Strict `=== "1"` opt-in. Default false ⇒ no detect, no prompt, no ledger
      (byte-identical startup). On ⇒ the REPL startup seam detects + converts
      competitor config under ~ + cwd, throttles a re-offer, and emits a
      one-line stderr notice.
deliberate_hold: null
notes: |
  Distinct from the parent `@/migration` slice (ADR-0038/0430), which imports
  SESSION TRANSCRIPTS. This sub-slice imports CONFIG. Scope partitioning: home
  and project throttle INDEPENDENTLY (a project's disposition must not suppress
  a different project). `.cursorrules` (single-file legacy form) is detected
  but the SOTA path is the `.cursor/rules/*.mdc` directory form (the one Cursor
  itself migrated to) — `loadGlobRules` parses the directory. Import wiring of
  the converted outputs into live quanta config is done by `persist.ts`
  (`persistConvertedItems`): it WRITES each `ConvertedItem` to the on-disk
  location quanta's own readers consume — settings.json#permissions/#hooks,
  .mcp.json#mcpServers (env/secrets scrubbed), .quanta/agents/<name>.md,
  AGENTS.md, .quanta/rules/<name>.md — rather than importing @/permission /
  @/mcp / @/subagent (the slice stays isolated). Discipline: default-OFF
  (enabled:false ⇒ byte-identical no-op), idempotent/no-clobber (JSON merged,
  markdown written as a `.imported.md` sibling when native exists), ledger-
  throttled per sourceKey, and NO-THROW (a single item's failure is a typed
  MigrationWarning). The host resolves the knob + paths and calls in.
