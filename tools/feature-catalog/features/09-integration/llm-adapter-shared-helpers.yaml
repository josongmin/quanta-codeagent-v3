id: llm-adapter-shared-helpers
title: LLM adapter shared helpers — stream-timeout / tool-input throw / usage spread
section: 9
subsystem: llm/adapters/shared — Anthropic + OpenAI common frame
order: 39
maturity: L4
status: new
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: [llm-stream-timeout, llm-error-taxonomy]
purpose: |
  The Anthropic and OpenAI adapters previously duplicated ~90% of three
  frames; this module factors them as plain functions (composition over
  inheritance — there is no shared SDK base to subclass).
  (1) `resolveAdapterStreamTimeouts(config)` — resolves per-adapter
  stream-hang deadlines ONCE at construction with caller-supplied →
  env-knob → baked-default precedence; the function reads `runtimeConfig()`
  exactly once, no per-call re-read. (2) `parseToolInputOrThrow(json, id,
  provider, causePolicy)` — parses the accumulated tool-call argument
  buffer or raises the structured `stream_corrupt` LLMError both adapters
  used verbatim; empty/whitespace JSON becomes `{}` (a tool with no
  arguments). The `causePolicy` argument (`with-cause` vs `no-cause`)
  selects whether the parse error threads as `cause` — OpenAI sets it,
  Anthropic omits it — preserving each adapter's prior throw byte-identically.
  (3) `buildUsageEvent` — the conditional `cacheReadTokens` spread.
  Provider-specific wire mapping (`mapRawEvent` vs `processChunk`) is the
  legitimately different part and stays in each adapter.
