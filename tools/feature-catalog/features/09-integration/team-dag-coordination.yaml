id: team-dag-coordination
title: Multi-agent coordination A — task dependency DAG (Claude --agent-teams parity)
section: 9
subsystem: Subagent coordination (multi-agent DAG)
order: 97
maturity: L2
status: new
ui_surfaces: [cli, ide]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: partial
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: [subagent-mailbox]
config_refs:
  env: [QUANTA_TEAM_DAG]
purpose: |
  Capability A of multi-agent coordination (plan docs/plans/
  multiagent-coordination.md §2.A) — a task dependency DAG so subagent fan-out
  respects ordering edges instead of firing flat + unordered. Claude Code
  `--agent-teams` parity (task dependency DAG arm; the leader-broker + team-idle
  barrier are sibling waves B/C). quanta already had the TRANSPORT (mailbox) and
  the parallel fan-out (`spawn_batch`); this adds the coordination protocol on
  top.

  PURE CORE (`src/subagent/coordination/dag.ts`, no I/O, NO-THROW):
  `TaskNode {id, dependsOn[], state}` reusing the closed `TaskState` union
  (pending|in_progress|completed|failed|cancelled — MIRRORED locally because the
  `src/subagent/**` biome fence forbids `@/mcp`). `detectCycle` rejects a cyclic
  graph (3-colour iterative DFS), an edge to an unknown id, and duplicate ids —
  all typed, never thrown — so a bad graph is NEVER dispatched. `readyTasks`
  returns the `pending` nodes whose EVERY `dependsOn` is `completed`, in
  deterministic `byteCompare` order (never `localeCompare`, never input order).
  `blockedTasks` surfaces `pending` nodes with a (transitive) `failed`/
  `cancelled` dependency — the DEAD-BRANCH surface so the leader sees it instead
  of an indefinite hang (liveness invariant §5). `onComplete(nodes,id)` marks a
  node completed and returns EXACTLY the newly-unblocked set.

  EFFECTFUL GATE (`src/subagent/coordination/dag-gate.ts`): `createDagGate`
  validates the graph (rejects cyclic/dangling before any dispatch) then drives
  the pure core over the existing parallel pool. `wrapRunnerWithDagGate` wraps
  the forked child runner so each child BLOCKS until its node is ready and
  RELEASES dependents (via `onComplete`) as children finish — net effect:
  dispatch order respects `dependsOn` while reusing the sealed
  `@/tool/subagent-batch` worker semaphore (no slice edit). A failed child marks
  its node failed ⇒ dependents resolve `blocked` and return a typed
  `DAG_BLOCKED_TEXT` result rather than hanging.

  WIRING: `src/agent/tier1/subagent-batch.ts#composeDagBatchRunner` is the
  composition seam — knob-gated AND node-set-gated: `QUANTA_TEAM_DAG` OFF (unset)
  OR an empty node set ⇒ the RAW runner is returned unchanged (byte-identical
  flat fan-out = today). The builder threads the runner through it; the live
  per-batch dependency-edge source is a deliberately-separate wave (the sealed
  `spawn_batch` schema carries no `dependsOn` field yet), so today's builder
  passes an empty node set ⇒ OFF posture preserved. The composition is proven
  end-to-end against the REAL `runBatch` by the e2e hellgate.
evidence:
  code:
    - src/subagent/coordination/dag.ts
    - src/subagent/coordination/dag-gate.ts
    - src/subagent/coordination/index.ts
    - src/agent/tier1/subagent-batch.ts
    - src/shared/runtime-config.ts
  adrs: []
  tests:
    unit:
      - tests/unit/coordination/team-dag-hellgate.test.ts
      - tests/unit/coordination/team-dag-batch-e2e-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_TEAM_DAG
    where: src/shared/runtime-config.ts
    default: 'false'
    purpose: |
      Strict `=== "1"` opt-in. Default false ⇒ `spawn_batch` fan-out is the
      existing flat parallel pool (no dependency ordering) — byte-identical. When
      ON *and* a batch carries dependency edges, the tier1 builder wraps the
      child runner with the DAG gate so children dispatch in dependency order
      (cyclic/dangling graph rejected before dispatch; failed/cancelled dep
      surfaces a typed dead branch, never a hang).
deliberate_hold:
  reason: |
    The pure DAG core + effectful gate + the `composeDagBatchRunner` composition
    seam are complete and proven end-to-end against the real `runBatch`. What is
    NOT yet live: a per-`spawn_batch`-call dependency-edge SOURCE. The sealed
    `@/tool/subagent-batch` input schema carries no `dependsOn` field and is not
    owned this wave, so the builder passes an empty node set (⇒ raw runner, OFF
    posture). Until the slice schema gains a `dependsOn` shape, the knob ON is a
    no-op at the live tool surface even though the composition is fully wired and
    tested.
  promotion_path: |
    Promote to L3 when the `spawn_batch` schema gains an optional per-item
    `depends_on` (id → string[]) field: the builder then derives the `TaskNode[]`
    from the loaded items and calls `composeDagBatchRunner` with that node set +
    an `idOf` keyed off the rendered item id, engaging the gate transparently
    when `QUANTA_TEAM_DAG` is on. Sibling waves B (leader-broker,
    `QUANTA_TEAM_BROKER`) and C (team-idle barrier, `QUANTA_TEAM_IDLE`) land
    alongside.
notes: |
  29 core hellgate cases + 5 e2e hellgate cases (34 total / 65 expects) pin:
  cycle (self / 2-node / 3-node) rejected; unknown-dep + duplicate-id rejected;
  linear chain release order; diamond fan-in (D waits for BOTH B and C); failed
  AND cancelled dep ⇒ dependent blocked not ready (no hang), transitive dead
  branch; empty + single-node; onComplete newly-ready EXACT set + idempotent
  re-complete + unknown-id no-op; deterministic byteCompare order for ready /
  blocked / newlyReady; e2e over the REAL runBatch — linear order, diamond order,
  failed-dep dead-branch settles (no hang), cyclic rejected at gate construction,
  and knob-OFF flat fan-out (byte-identical). Absorption: Claude Code
  --agent-teams (task dependency DAG arm). What this is NOT: no leader-broker
  (wave B) / no team-idle barrier (wave C) / no live spawn_batch dependsOn schema
  field yet (deliberate hold). Slice fence: src/subagent/coordination imports
  only @/shared + siblings (no @/mcp, no @/agent).
