knobs:
  - name: QUANTA_TEAM_DAG
    where: src/shared/runtime-config.ts
    default: 'false'
    purpose: |
      Strict `=== "1"` opt-in. Default false ⇒ `spawn_batch` fan-out is the
      existing flat parallel pool (no dependency ordering) — byte-identical, the
      `dependencies` field is ignored. When ON *and* a batch carries a
      `dependencies` map, the tier1 composition root injects the `dagGateFactory`
      so `run-batch.ts` dispatches each item in dependency order (cyclic /
      dangling / duplicate / unknown-key graph rejected before any dispatch;
      failed/cancelled dep surfaces a typed dead branch, never a hang).
notes: |
  LIVE end-to-end (Capability A). 31 core hellgate cases + 5 gate-level e2e + 8
  spawn_batch LIVE e2e (REAL createDagGate driving REAL runBatch) pin: cycle
  (self / 2-node / 3-node) rejected; unknown-dep-value + unknown-dep-KEY +
  duplicate-id rejected; linear chain release order; diamond fan-in (D waits for
  BOTH B and C); failed AND cancelled dep ⇒ dependent blocked not ready (no
  hang), TRANSITIVE dead branch (incl. on a graph carrying a cycle — monotone
  fixpoint, memo-poison regression); onComplete newly-ready EXACT set + idempotent
  re-complete + unknown-id no-op + NO-resurrect of a failed/cancelled node;
  deterministic byteCompare order for ready / blocked / newlyReady; live e2e over
  the REAL runBatch — deps-first order, diamond order, failed-dep dead-branch
  settles (no hang, deadlock-free: awaitReady is OUTSIDE the worker semaphore),
  cyclic/dangling/unknown-key rejected at gate construction (zero dispatch), and
  knob-OFF / no-dependencies flat fan-out (byte-identical). Absorption: Claude
  Code --agent-teams (task dependency DAG arm). What this is NOT: no leader-broker
  (wave B, `QUANTA_TEAM_BROKER` — pure core sealed, host trigger NOT wired) / no
  team-idle barrier (wave C, `QUANTA_TEAM_IDLE` — pure core sealed, host beacon
  NOT wired). Slice fence: src/subagent/coordination imports only @/shared +
  siblings (no @/mcp, no @/agent); @/tool/subagent-batch never imports @/subagent
  (the gate is injected via the duck-typed BatchDagGateFactory).
