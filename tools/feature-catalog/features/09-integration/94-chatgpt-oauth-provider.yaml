notes: |
  Phase 1 absorption (2026-05-23). 흡수 출처: Codex Desktop OAuth 플로우 in-house 분석
  + OSS `openai/codex` Rust `codex-rs/login` (SCOPES verbatim, 1455→1457 포트 verbatim,
  client_id verbatim → wire-compatible). quanta가 *추가*한 invariant: refresh in-flight
  mutex (Codex에 없음), 401/403 typed `auth` LLMError로 retry/fallback 차단 (다른
  provider로 자동 폴백 금지 — 사용자 의도하지 않은 빌링 라인 사용 차단). JWT decode는
  외부 lib 0 (payload base64url + JSON.parse). What this is NOT: ChatGPT 세션 쿠키
  리버싱 X / 3rd-party proxy X / 자동 API-key 발급 X / 헤드리스 자동로그인 X / Codex
  remote-control enrollment 플로우 X. 93/0 tests pass / main 정착. Phase 2 follow-up:
  OS Keychain 마이그, headless 감지, 모델 캐탈로그 분기, 레이트 리밋 매핑.
