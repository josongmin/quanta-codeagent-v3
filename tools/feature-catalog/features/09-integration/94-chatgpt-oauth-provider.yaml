purpose: |
  ChatGPT Plus/Pro/Team 구독 계정으로 모델 호출 — BYOK(OPENAI_API_KEY) 없이 OAuth 토큰을
  사용해 `https://chatgpt.com/backend-api/codex/responses`로 호출. BYOK provider와 형제로
  공존 (토큰/엔드포인트/모델캐탈로그/빌링 분리). PKCE S256 + 32B random verifier,
  authorize endpoint=auth.openai.com, 로컬 콜백 포트 1455→1457 fallback, /auth/callback,
  10분 타임아웃. Token exchange + refresh in-flight 가드(Codex에 없는 추가 invariant).
  토큰 저장 `~/.quanta/auth/chatgpt.json` 0600 (Phase 1; OS Keychain은 Phase 2).
  Plan tier gate — JWT `chatgpt_plan_type=free` 즉시 거부 (/me 호출 없음). 헤더 5종 박힘:
  `Authorization: Bearer`, `ChatGPT-Account-Id`, `OAI-Product-Sku=CODEX`, `originator`.
  DEFAULT_CLIENT_ID=Codex 공개 OAuth app id verbatim → 사용자는 `/login` 한 줄.
  LlmFactory 등록 + default-OFF (사용자 명시 선택 또는 토큰 존재 시만 활성).
  CLI 슬래시 명령 `/login` + `/status`로 사용. 401/403은 typed `auth` LLMError —
  retry/fallback 거부 (다른 provider로 자동 폴백 금지: 사용자 의도하지 않은 빌링 라인 차단).
