id: codex-r2-sqlite-session-registry
title: SQLite-backed session registry (Codex logs_2.sqlite parity) (ADR-0361)
section: 9
subsystem: optional sqlite-backed session resource persistence
order: 103
maturity: L3
status: stable
ui_surfaces: [n-a]
monitoring: partial
modes: [n-a]
configurable: n-a
owners: ["@songmin"]
labels: ["surface:core", "absorbed:codex", "default-off"]
depends_on:
  - codex-r2-composition-install-and-registry
  - codex-r2-disk-persistence-and-env-swap
purpose: |
  Sibling SQLite backend for the ADR-0345
  `SessionResourceRegistry` port. Layered architecture: in-process
  `Map<sessionId, Entry>` owns live `SessionResources` refs
  (preserves same-id same-ref invariant byte-identical with the
  in-memory + JSONL siblings); `bun:sqlite` WAL database owns the
  durable mirror (every store.append → events row; cache MISS →
  cache_entries row). Rehydrate-on-mint replays prior rows
  synchronously on the first `getOrCreate(id)` for an id with rows.

  Codex `logs_2.sqlite` retention parity: PRAGMA journal_mode=WAL +
  synchronous=NORMAL + foreign_keys=ON, cumulative-bytes sliding
  window (`SUM(total_estimated_bytes) OVER (ORDER BY last_touched
  DESC)`) + TTL fallback + `PRAGMA wal_checkpoint(PASSIVE)` in the
  `sweepSqliteRegistry` GC pass. Defaults: 14 d TTL / 14 GB total
  bytes (Codex production calibration).

  R10 retry: ADR-0357 worktree introduced a self-shaped port that
  did not match main's closed `SessionResourceRegistry` port —
  cherry-pick aborted. This ADR (0361) implements the SQLite
  backend behind the SAME port the in-memory + JSONL siblings
  already satisfy, so the same-id same-ref invariant + 5-method
  closed surface stay byte-identical.

  Default-OFF. Global singleton (ADR-0347 / ADR-0351) does NOT
  auto-mount this backend; opt-in via direct factory call until a
  follow-up ADR adds an env-var swap on the ADR-0351 pattern.
