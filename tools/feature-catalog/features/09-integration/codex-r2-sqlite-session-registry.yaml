knobs:
  - name: SqliteRegistryConfig.databasePath
    type: 'string'
    default: '(required)'
    notes: 'Absolute path; ":memory:" supported for tests. Parent directory must exist.'
  - name: SqliteRegistryConfig.ttlMs
    type: 'number?'
    default: '14 days (DEFAULT_TTL_MS)'
    notes: 'Sessions whose last_touched is older than now() - ttlMs are evicted by sweepSqliteRegistry.'
  - name: SqliteRegistryConfig.maxTotalBytes
    type: 'number?'
    default: '14 GB (DEFAULT_MAX_TOTAL_BYTES — Codex production calibration)'
    notes: 'Cumulative-bytes sliding window cap across all sessions; oldest evicted first.'
  - name: SqliteRegistryConfig.now
    type: '() => number'
    default: 'Date.now'
    notes: 'Clock seam for deterministic TTL tests.'
deliberate_hold:
  reason: |
    Env-var swap on the ADR-0351 pattern
    (`QUANTA_SESSION_REGISTRY_SQLITE_PATH` or similar) deferred to a
    follow-up ADR so this slice does not change production
    composition-root behavior in the same commit. Schema v2+ migrations
    are out of scope (born at v1). Cross-machine sharing is an explicit
    negative invariant (ADR-0355).
  promotion_path: |
    Follow-up ADR adds the env-var swap into
    `src/agent/session-resource-registry/global.ts` next to the existing
    `QUANTA_SESSION_REGISTRY_DISK_DIR` branch — composition roots that
    set the new env var would auto-route to the SQLite backend through
    the singleton.
notes: |
  R10 ADR-0357 worktree aborted on port-shape mismatch (self-shaped
  recordEvent/loadEvents). This R-retry implements the SQLite backend
  behind the verbatim ADR-0345 `SessionResourceRegistry` port; the
  in-memory + JSONL hellgate suites (72 cases combined) remain
  byte-identical green alongside the new 40 cases.
