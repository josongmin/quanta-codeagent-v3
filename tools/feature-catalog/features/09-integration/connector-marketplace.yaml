purpose: |
  Connector MARKETPLACE V1 over two PURE leaf modules (import only `@/shared` +
  zod), both NO-THROW + DEFAULT-OFF. Successor to the flat
  `mcp-connector-catalog` (discovery list with no install STATE).

  Lifecycle core (`src/connectors/connector-marketplace.ts`, §1.6):
    - `DirectoryAppSchema` — STRICT (`.strict()`) descriptor
      `{id,name,description,installUrl,version}`. `installUrl` is `.refine`d
      http(s)-ONLY: `z.string().url()` alone accepts `javascript:`/`data:`/`file:`,
      and the host OPENS/FETCHES this URL → a non-http scheme is a
      code-execution / local-file-exfil vector. Refine fails-closed
      (red-on-injection guard).
    - `createConnectorMarketplace({store, clock})` — PURE lifecycle state machine
      over an injected `InstalledAppStorePort` + `ClockPort`. install →
      enable/disable → uninstall; `installedAt` set once, `lastUpdatedAt` bumped
      from the injected clock (NOT `Date.now()`, so tests are deterministic).
      Typed errors only: `invalid-app` | `already-installed` | `not-installed`.
      `list()` deterministic (byteCompare by id).
    - `createInMemoryInstalledAppStore()` — bundled default store; the host may
      back the async port with the connector JSONL store for persistence.
    - `isConnectorMarketplaceEnabled` — the `QUANTA_CONNECTOR_MARKETPLACE` gate.
      The CORE does NOT read the gate; the HOST gates whether it constructs the
      marketplace. Default-OFF ⇒ never built ⇒ store never touched (byte-identical).

  Enterprise source policy (`src/connectors/marketplace-policy.ts`, §2.5; SOTA ref
  = Claude Code managed-settings `strictKnownMarketplaces` + blocked sources):
    - `MarketplacePolicy{strictKnownSources?, blockedSources?}` — both optional
      EXACT-match source lists; empty policy ⇒ NO constraints.
    - `checkMarketplaceSource(source, policy)` — PURE decision (no I/O, no env),
      source TRIMMED before exact compare. BLOCKLIST checked FIRST (fail-closed):
      a source in BOTH lists is blocked (`blocklisted` beats `not-allowlisted`).
      Strict allowlist (when non-empty) blocks anything not exactly listed.
    - `enforceMarketplacePolicy(source, policy, env)` — gated entry behind
      `QUANTA_MARKETPLACE_POLICY`. Default-OFF ⇒ `allow` everything (byte-identical).
      The HOST owns wiring the `block` verdict to deny BEFORE clone/download.
evidence:
  code:
    - src/connectors/connector-marketplace.ts
    - src/connectors/marketplace-policy.ts
  adrs: ["docs/decisions/0519-connector-marketplace-v1-and-policy.md", 160]
  tests:
    unit:
      - tests/unit/connector-marketplace-v1.test.ts
      - tests/unit/marketplace-policy.test.ts
    integration:
      - tests/integration/connector-marketplace-lifecycle-e2e-hellgate.test.ts
    contract: []
knobs:
  - name: QUANTA_CONNECTOR_MARKETPLACE
    where: connectors/connector-marketplace.ts (isConnectorMarketplaceEnabled)
    default: false
    purpose: "§1.6 — DEFAULT-OFF gate; unset ⇒ host does not construct the marketplace (byte-identical). Read via gateOn, env injectable for tests."
  - name: QUANTA_MARKETPLACE_POLICY
    where: connectors/marketplace-policy.ts (enforceMarketplacePolicy)
    default: false
    purpose: "§2.5 — DEFAULT-OFF gate; unset ⇒ enforceMarketplacePolicy allows EVERY source (byte-identical, no enterprise gating)."
deliberate_hold:
  reason: |
    Export-only seam. Both modules are re-exported via the
    `src/connectors/index.ts` barrel but have NO live consumer — nothing in src/
    (non-test, non-barrel) constructs `createConnectorMarketplace`, calls
    `enforceMarketplacePolicy`, or reads either gate. V1 owns the SCHEMA +
    lifecycle STATE MACHINE + PURE policy DECISION only. The two security guards
    (http(s)-only `installUrl` refine; blocklist-precedence fail-closed policy)
    are locked by red-on-injection tests today, but the live surface is not wired.
  promotion_path: |
    Follow-up ADR + surface to: (1) the host mints a persistent
    `InstalledAppStorePort` (JSONL-backed) and constructs the marketplace under
    `QUANTA_CONNECTOR_MARKETPLACE`; (2) the marketplace-add flow calls
    `enforceMarketplacePolicy` and denies a `block` verdict BEFORE clone/download;
    (3) the marketplace browse UI + REMOTE registry fetch of DirectoryApps + app
    AUTO-UPDATE + the `installUrl` fetch/OAuth handshake (all explicitly DEFERRED
    out of V1). At that point cli/web flip from `na` to their audited status.
notes: |
  jun-08 longtail small-win. Absorption sources: Codex Desktop
  `imported-connector-apps` (DirectoryApp + installUrl lifecycle) and Claude Code
  managed-settings `strictKnownMarketplaces`/blocked-sources (enterprise
  allow/block, checked BEFORE download). The integration hellgate drives the full
  lifecycle over a REAL file-backed store (install → reload-from-disk → disable →
  enable → uninstall) proving the injected-store seam survives a restart, plus a
  RED-ON-INJECTION arm (a `javascript:` installUrl is rejected, store stays empty).
  Knob entries: src/config/knob-inventory.ts:1325 (QUANTA_MARKETPLACE_POLICY) /
  :1334 (QUANTA_CONNECTOR_MARKETPLACE), both group=integration, default=false.
