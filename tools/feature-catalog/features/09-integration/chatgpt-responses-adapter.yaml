purpose: |
  Concrete `LLMPort` that calls `${apiBase}/responses` with the disk-stored
  OAuth bearer instead of an API key. Default `apiBase` is
  `https://chatgpt.com/backend-api/codex` — the Responses-API endpoint the
  OSS Codex CLI uses for ChatGPT subscription traffic. The wire protocol
  is SSE; the adapter parses the canonical `response.*` event names and
  maps them to `StreamEvent`. Token-freshness enforcement runs at the top
  of every `stream()` call — read the token, refresh proactively when
  `expires_at` lies within the imminent window, persist the new bundle,
  and only then POST with `Authorization: Bearer …` plus the
  `ChatGPT-Account-Id` / `OAI-Product-Sku` / `originator` headers the
  backend requires. A 401 mid-stream surfaces as a typed `auth` LLMError;
  the retry/fallback layer refuses to retry or fall back on `auth` — the
  user is told to relogin instead.
evidence:
  code:
    - src/llm/adapters/chatgpt-oauth.ts
    - src/auth/chatgpt-oauth/refresh.ts
    - src/auth/chatgpt-oauth/token-store.ts
  adrs: [94]
  tests:
