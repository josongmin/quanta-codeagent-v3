knobs: []
deliberate_hold: null
notes: |
  Pairs with `chatgpt-oauth-provider` (BYOK-less end-to-end orchestration),
  `refresh-coordinator` (in-flight guard so concurrent streams collapse to
  one issuer hit), and `token-store-atomic` (on-disk credential durability).
  Codex-only model slugs (e.g. `gpt-5-codex`) are rejected by the backend
  for ChatGPT-account requests; `createLLM` defaults the provider to
  `gpt-5` instead.
