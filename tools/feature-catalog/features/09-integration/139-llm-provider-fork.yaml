owners: ["@songmin"]
labels: ["surface:core"]
depends_on: [llm-adapter-bedrock, llm-adapter-foundry, llm-adapter-mantle, llm-adapter-vertex, llm-stream-timeout]
purpose: |
  Hexagonal port that separates Anthropic vendor (wire grammar) from
  transport (api.anthropic.com vs AWS Bedrock vs GCP Vertex vs Azure
  Foundry). 4-arm ProviderId union + 3-code ProviderError
  (provider-unsupported / provider-misconfigured /
  provider-missing-dependency) + 5-tier resolveProvider(explicit?, env?)
  precedence. Default-OFF — legacy
  adapter path untouched (byte-identical when ProviderId resolves to
  "default"). Bedrock/Vertex are Phase 1 (missing-dep typed-throw on
  client lib import); Foundry is Phase 2 stub. First OSS implementation
  to make Anthropic transport-selection typed; Claude Code keeps it
  closed via env-only, Codex/Cursor/v0.dev don't separate transport.
