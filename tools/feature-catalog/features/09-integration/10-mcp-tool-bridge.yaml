id: mcp-tool-bridge
title: MCP 클라이언트 + tool 브리지 (임의 MCP 도구 passthrough)
section: 9
subsystem: MCP (ADR-0007) — stdio 클라이언트 + tool→Tool 어댑터
order: 10
maturity: L4
status: stable
ui_surfaces: [api]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env: [QUANTA_MCP_CONFIG]
owners: ["@songmin"]
labels: ["surface:ipc"]
depends_on: [quantamcpconfig]
purpose: |
  QUANTA_MCP_CONFIG 노브를 넘어선 실제 capability — McpClient(stdio JSON-RPC 2.0:
  initialize/tools-list/tools-call/shutdown + per-request 타임아웃)와 mcp-bridge가
  임의 MCP 서버의 도구를 agent tool registry에 mcp__<server>__<tool> 이름으로 브리지.
  loadMcpTools가 서버 기동·도구 나열·전부 어댑트(실패 서버는 skip). JSON Schema →
  passthrough zod. @/agent만 @/mcp 도달(슬라이스 격리).
evidence:
  code:
    - src/mcp/client.ts
    - src/agent/mcp-bridge.ts
    - src/apps/cli/internal.ts
  adrs: [7]
  tests:
    unit: []
    integration: [tests/integration/mcp-client.test.ts, tests/integration/mcp-bridge.test.ts, tests/integration/mcp-e2e.test.ts]
    contract: []
knobs:
  - name: QUANTA_MCP_CONFIG
    default: 'undefined'
    purpose: '(no description)'
deliberate_hold: null
notes: 'quantamcpconfig(ADR-0007)는 config 노브만 기술 — 이 항목은 클라이언트+브리지 구현 capability. 새 MCP 서버 추가 확장점.'
