knobs:
  - name: QUANTA_MCP_PROTOCOL_MAX
    where: src/shared/runtime-config.ts (mcpProtocolMax) → src/mcp resolveOfferedVersion
    default: ""
    purpose: pin the MAX offered protocol version (e.g. back to 2025-06-18 for a peer that mis-handles the bump). Absent ⇒ offer the SSOT newest. Unsupported value ⇒ conservative fallback to newest (never an unspeakable version on the wire).
deliberate_hold: null
notes: |
  jun-7-misc 01. ADR landed at docs/decisions/0501-mcp-protocol-version-negotiation.md
  by the reconcile pass (0497 guardian, 0498 central-config, 0499 manifest-codex,
  0500 model-based-fast-apply were allocated by concurrent lanes; the duplicated
  0498 fast-apply was renumbered to 0500, so the next free slot for MCP was 0501).
  The `QUANTA_MCP_PROTOCOL_MAX` runtime-config field was added by the Knobs phase
  (consumed via runtimeConfig().mcpProtocolMax). Open-question decisions
  (conservative): adopt version-negotiation ALONE (no new capability auto-enable);
  global knob v1 (no speculative per-server override); fail-closed on an
  unsupported server-chosen version; the initialize POST header carries the
  OFFERED version (negotiation hasn't run), subsequent requests the PINNED one.
