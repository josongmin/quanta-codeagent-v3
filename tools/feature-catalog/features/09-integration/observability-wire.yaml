knobs:
  - name: QUANTA_OBSERVABILITY
    default: 'off'
    purpose: 'observability ports wire ON (composition-root gate, strict "on")'
config_refs:
  env: [QUANTA_OBSERVABILITY]
deliberate_hold:
  reason: |
    `ObservabilityHookBus` adapter is not wired into the composition root
    yet — AgentConfig has no first-class HookBus slot at the surface entry,
    so attribution is silently skipped when the gate is on. The four ports
    still wire (Objective + ShadowVerify on AgentConfig slots; RunLedger +
    ApprovalSM live on the wire handle for future consumers).
  promotion_path: |
    Follow-up slice threads the surface's `HookBus` into `wireObservability`
    via a tiny adapter (~10 LOC):
        wireObservability({
          enabled: env.QUANTA_OBSERVABILITY === "on",
          repoRoot: process.cwd(),
          hookBus: {
            subscribe: (event, handler) => {
              bus.on(event, handler as never)
              return () => undefined
            },
          },
        })
    Once landed, `post_tool_use` events drive ledger start/touch/settle.
notes: |
  Closeout wire for the wave-1/2 observability ADR cluster — the four sealed
  ports finally have a single composition-root home. Surface diff is < 25
  lines (one import block + one helper + one invocation + two spreads). The
  wire helper is a leaf module: zero peer-slice imports beyond the five
  observability slices it stitches together. 21 hellgate cases / 75 expects
  pin the contract (default-OFF noop, full-wire happy path, partial inputs,
  detach idempotency + NO-THROW, factory failure isolation, double-wire
  isolation, malformed hook event tolerance).
