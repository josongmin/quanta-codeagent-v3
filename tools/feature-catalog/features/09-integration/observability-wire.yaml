id: observability-wire
title: ADR-0406 Composition-root observability wire (Objective + RunLedger + ApprovalSM + ShadowVerify)
section: 9
subsystem: Long-running work observability (ADR-0394/0395/0396/0400/0401/0403 closeout)
order: 404
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless, batch, daemon, ide]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "default-off"]
depends_on:
  - objective-first-class
  - run-ledger
  - run-ledger-attribution
  - approval-state-machine
  - shadow-verify
  - shadow-verify-adapters
surface_integration:
  cli: full
  web: full
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 3/4 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "drives the web-ONLY ObservabilityPane (ObjectiveCard/RunColumn/ApprovalsList); the web-daemon runtime-factory.ts:152 wires the hookBus and the observability-emitter projects objective/runLedger/approvalSM into observability.snapshot frames the pane renders"
purpose: |
  Wave-1 + Wave-2 shipped four pure typed observability ports — `Objective`
  (ADR-0394), `RunLedger` (ADR-0395), `ApprovalStateMachine` (ADR-0403), and
  `ShadowVerify` (ADR-0396/0400) — plus the `run-ledger-attribution` hook
  subscriber (ADR-0401). All five are SEALED slices with zero composition-
  time consumers; `AgentConfig.objective` / `AgentConfig.shadowVerify` were
  populated by NOBODY at runtime, so every downstream consumer no-oped.

  This slice closes the seam with a single helper:
  `wireObservability(opts) → ObservabilityWireHandle`. The helper:
    1. Instantiates the four ports ONCE per host (each factory is failure-
       isolated — a throw on one degrades that slot to undefined and leaves
       the other three populated).
    2. Cross-wires `approvalStateMachine` over `objective + runLedger` so
       HITL pauses attribute into both sibling stores.
    3. Subscribes `createRunLedgerHookSubscriber({ledger})` to the host's
       `post_tool_use` hook bus via a DUCK-TYPED `ObservabilityHookBus`
       surface (the slice never imports `@/agent/hooks` — slice fence).
    4. Returns an idempotent NO-THROW `detach()` that unsubscribes the
       hook handler. Safe to call any number of times, NO-THROWs even if
       the host's unsubscribe callback throws.

  Default-OFF (RFC §1.2): `opts.enabled !== true` ⇒ noop handle. ZERO port
  instances allocated. ZERO hook subscriptions. Composition root reads
  `process.env.QUANTA_OBSERVABILITY === "on"` to flip the gate.

  Slice fence: imports only `@/agent/objective`, `@/agent/run-ledger`,
  `@/agent/run-ledger-attribution`, `@/agent/approval-state-machine`,
  `@/agent/shadow-verify`, `@/agent/shadow-verify-adapters`. NEVER touches
  `@/agent/loop`, `@/agent/dispatch`, `@/agent/prompt`, or `@/agent/hooks`.
evidence:
  code:
    - src/agent/observability-wire/types.ts
    - src/agent/observability-wire/wire.ts
    - src/agent/observability-wire/index.ts
    - src/apps/agent/index.ts
  adrs:
