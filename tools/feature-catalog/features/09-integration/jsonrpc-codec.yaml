depends_on: [jsonrpc-request-id-correlation, jsonrpc-envelope]
configurable: static
purpose: |
  encode / decode helpers for JSON-RPC 2.0 frames (request / notification /
  success-response / error-response / Codex-style explicit timeout). Decoders
  NEVER throw on malformed input — bad JSON, missing fields, wrong types all
  surface as `err(JsonRpcCodecError)` so the caller decides whether to
  disconnect, reply with -32600, log, or retry. Encoders throw only on
  programmer errors (empty `method`) and strict-re-parse the constructed
  frame before serialising so encoder drift fails loudly in tests.
  `JsonRpcCodecErrorKind` is a closed discriminator (`parse_json` /
  `schema_envelope` / `schema_request` / `schema_response` /
  `schema_notification` / `schema_timeout` / `version_mismatch`) so callers
  can branch precisely without string-matching the message. JSON-RPC 2.0
  does NOT require canonical key ordering, so we use plain `JSON.stringify`
  — session-JSONL canonicalisation is a separate concern.
