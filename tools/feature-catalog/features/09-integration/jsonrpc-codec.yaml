notes: |
  Pairs with `jsonrpc-envelope` (zod schemas the codec re-uses for the
  strict re-parse) and `jsonrpc-request-id-correlation` (id generator for
  the `id` field). The Codex-style timeout encoding (code `-32000` +
  `data.kind === "timeout"`) is the agreement that lets a server send a
  precise timeout signal without colliding with the JSON-RPC error-code
  space reserved for the spec.
