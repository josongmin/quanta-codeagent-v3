depends_on: [jsonrpc-envelope, jsonrpc-codec, jsonrpc-request-id-correlation, assert-never-exhaustiveness, byte-stable-string-comparator]
purpose: |
  Codex-pattern channel-triple generator. Every async method has THREE
  related channel names derived from a single base — `channelTriple("agent.run")`
  yields `{request: "agent.run-request", response: "agent.run-response",
  timeout: "agent.run-timeout"}`. Building the triple from one base name
  makes drift between the three channels structurally impossible.
  `parseChannelKind` / `parseChannelBase` round-trip a channel name back to
  its kind + base so dispatch tables can be keyed on the canonical pair.
  Base-name validation rejects empty strings, illegal chars (only
  `[A-Za-z0-9_./]+` is allowed), and inputs that already end with one of the
  three reserved suffixes — preventing `foo-request` from becoming
  `foo-request-request`.
