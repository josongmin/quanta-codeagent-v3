id: peer-teammate-messaging
title: Peer teammate messaging — auto-delivered inbox + team-scoped bus + redaction
section: 9
subsystem: Subagent coordination (peer ↔ peer messaging)
order: 99
maturity: L3
status: refined
ui_surfaces: [cli, ide]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: partial
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: [subagent-mailbox, team-broker-coordination, team-idle-barrier-coordination]
config_refs:
  env: [QUANTA_TEAM_PEER_MSG]
purpose: |
  The THREE genuine deltas over quanta's EXISTING peer-messaging substrate
  (RFC docs/plans/jun-6-peer-teammate-messaging.md). quanta ALREADY has the hard
  parts and they are REUSED UNCHANGED: a peer-addressable bounded mailbox
  (`src/agent/subagent-mailbox/{types,store}.ts` — `MailboxPort.send({from,to})`
  is sibling↔sibling, with audit-H caps: maxRetained 1024 + retentionMs LRU +
  per-sender quota), the `subagent_send_message`/`subagent_read_messages` tools,
  the wake-idle gate (`SubagentTurnGate`/`TurnWakeRegistry`/`followup_task`→wake),
  and the broker's no-self-grant invariant (`broker.ts` — only a leader-authored
  `response` matching an outstanding correlationId widens permission). This slice
  adds ONLY the three deltas Claude Code CLI 2.1.150 "Agent Teammate
  Communication" has over that substrate.

  DELTA #1 — AUTO-DELIVERY (no manual poll). The loop's turn-top
  `syncQueuedTurnInputs` drained ONLY the user FollowUpQueue. A new
  `pollPeerInbox` drain (`src/agent/loop/control-poll.ts`, sibling of
  `pollFollowUpQueue`) is appended at that EXACT seam: it reads THIS agent's
  undelivered peer mail (mark-delivered — shares the SAME per-recipient delivery
  cursor as the manual poll, so a message is delivered exactly ONCE across
  push+pull and never re-injects across turns), bounded by a per-turn limit (the
  rest stays pending and drains FIFO over subsequent turns), and appends it as
  ONE `role:"user"` message. A wake'd idle teammate now AUTO-receives its mail.

  DELTA #2 — TEAM BOUNDARY + LIFECYCLE. A `TeamRegistryPort`
  (`src/subagent/team/registry.ts` — membership set, `sameTeam`, create/delete/
  add/remove; an agent belongs to exactly ONE team) + a `TeamScopedMailbox`
  DECORATOR (`src/agent/subagent-mailbox/team-scoped.ts`) over the EXISTING store
  (NOT a new store — the audit-H caps stay GLOBAL so total memory is bounded
  regardless of team count). A cross-team `send` is DENIED before enqueue (never
  reaches the victim's delivery cursor — a cross-team peer can't even place a
  forged `response` into a victim's correlationId stream); a broadcast `"*"` is
  scoped to the sender's OWN team roster. `team_create`/`team_delete` tools
  (`src/tool/team/index.ts`, gated + mutating) mint/reap a membership scope;
  teardown reaps the bus (the host disposes member runners via the existing
  subagent disposer). A throwing gate fails CLOSED (denies, never widens).

  DELTA #3 — BODY REDACTION (untrusted-as-DATA). The mailbox read path did
  `escapeBodyForLine` (anti line-injection) but no secret/PII redaction. The
  auto-delivered body is routed through `@/security/redaction` (injected
  `redact?` seam, default identity ⇒ byte-identical when unwired) BEFORE
  `escapeBodyForLine` — the two compose (scrub secrets, then guarantee one line
  so a redacted body still can't forge a sibling line). The injection carries an
  explicit `[teammate <from> — untrusted]` provenance header.

  SECURITY (load-bearing): the peer bus is a COMMS channel, NEVER a grant
  channel. Auto-delivered peer mail enters context as INFORMATION (a
  `role:"user"` message) — the drain has no permission port and NEVER invokes the
  permission decider; the recipient's own tool calls still go through its
  admissibility gate / the leader broker. The broker's leader-authored-response-
  only widen (no-self-grant, `broker.ts`) is UNTOUCHED. Cross-team deny is at
  `send` (before enqueue).
