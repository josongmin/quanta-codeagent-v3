    integration: []
    contract: []
knobs:
  - name: QUANTA_TEAM_PEER_MSG
    where: src/shared/runtime-config.ts
    default: 'false'
    purpose: |
      Strict `=== "1"` opt-in, building ON the EXISTING QUANTA_TEAM_* peer
      mailbox + wake-idle. Default false ⇒ (a) the loop wires no `peerInbox`
      drain (`pollPeerInbox` returns null ⇒ the turn loop is byte-identical —
      peer mail surfaces ONLY via a manual `subagent_read_messages` poll); (b) no
      `TeamScopedMailbox` decorator (the raw global mailbox — no cross-team
      partition); (c) no team registry, `team_create`/`team_delete` NOT
      registered. ON ⇒ all three deltas wire: auto-delivery at the turn-top seam,
      cross-team deny + broadcast-scoped-to-team via the decorator, and body
      redaction on the auto-delivered (untrusted) peer content. The audit-H caps
      stay GLOBAL (one bounded store under a membership scope).
notes: |
  ✅ host-wired LIVE (jun-06) — 컴포지션 루트 배선 완료 → L3 LIVE-composed.
  `src/host/runtime/peer-team-wire.ts` `maybeWirePeerTeamMessaging` (assembler 에서
  knob-ON 시 호출)가: (1) per-session `createTeamRegistry()` → `cfg.teamRegistry`
  (tier1 `buildTeamBlock` 이 team_create/team_delete 등록 + runner 가 자식 등록),
  (2) `cfg.subagentMailbox` 를 `teamScopedMailbox` 로 decorate(cross-team deny +
  broadcast team-scope, audit-H cap 은 global 유지 — replace 아닌 decorate),
  (3) `cfg.peerInbox = createPeerInboxDrain(scoped, {redact: redactSecrets})`
  (loop turn-top `pollPeerInbox` 가 auto-deliver). subagent-runner 가 자식 config 에
  peerInbox+teamRegistry 전파 + 부모 팀에 자식(`root/0`) 등록. knob-OFF ⇒ no peerInbox,
  raw mailbox, no registry, team_* 미등록(byte-identical). e2e:
  tests/unit/peer-messaging-host-wire-hellgate.test.ts (REAL composition root + REAL
  createSubagentRunner: 자식이 peerInbox/teamRegistry 상속+팀가입 → sibling 메시지가
  자식 턴에 manual read 없이 auto-deliver / cross-team deny / knob-OFF byte-identical /
  redaction). broker.ts UNTOUCHED(no-self-grant invariant 보존).

  The three genuine deltas over quanta's already-built peer substrate (RFC
  re-audit: quanta ALREADY has peer mailbox + bounded inbox + wake-idle + the
  no-self-grant invariant — those are REUSED, not rebuilt). 21 hellgate cases
  pin: DELTA #1 auto-delivery (A→B auto-injects into B's turn without a manual
  read; delivered exactly once across push+pull — a later manual read is empty,
  no re-inject; per-turn cap bounds injection, rest drains FIFO; root identity
  fallback); default-OFF byte-identity (no port ⇒ null, empty inbox ⇒ null,
  throwing drain ⇒ null never bubbles); DELTA #2 team boundary (cross-team send
  denied before enqueue — pendingFor(victim)===0, store never got it; same-team
  delivered; broadcast reaches only own team, un-teamed broadcasts to no one;
  throwing gate fails closed; team_create auto-adds caller + team_delete reaps;
  post-teardown the boundary re-applies; an agent belongs to exactly one team);
  DELTA #3 redaction (a planted AWS key in a peer body is scrubbed to
  [REDACTED:...] before injection; redaction composes with escapeBodyForLine — a
  forged newline'd second line collapses to one line; default identity passes
  through); SECURITY (auto-delivered mail is a user message tagged untrusted, no
  permission API touched by the drain; the inbox stays bounded under a 5000-msg
  flood — the decorator did NOT replace the store, the global maxRetained holds).
  Absorption: Claude Code CLI 2.1.150 "Agent Teammate Communication"
  (SendMessageTool maps onto the EXISTING subagent_send_message; TeamCreate/
  TeamDelete = team_create/team_delete; auto-delivered inbox = DELTA #1;
  message-wakes-idle-teammate = the EXISTING wake-idle gate). What this is NOT: no
  new mailbox / wake registry / send tool (reused); no dedicated Teammate
  plan-mode execution type (the mechanism composes existing parts under the knob;
  the label is deferred UX). Slice fence: `src/subagent/team/registry.ts` is a
  pure leaf (imports nothing); the decorator + drain take duck-typed ports
  (membership gate, redactor) so the mailbox slice never imports @/subagent or
  @/security; the loop takes `peerInbox` via assembly (no @/agent/subagent-mailbox
  import from the loop).
