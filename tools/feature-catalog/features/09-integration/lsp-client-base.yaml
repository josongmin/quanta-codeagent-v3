notes: |
  Companion of `lspport` (the LspPort contract SoT) and `lsp-bridge` (the
  agent-side wire-up that picks an adapter by extension). Concrete adapters
  (`lsp-typescript-adapter`, `lsp-pyright-adapter`) extend this base; new
  languages need only supply their argv + `languageIdFor` and inherit the
  full nav surface.
