id: lsp-client-base
title: LspClient base — stdio handshake + 8 nav RPCs + LspRequestError typed
section: 9
subsystem: LSP — base client implementation of LspPort
order: 14
maturity: L4
status: stable
purpose: |
  Concrete implementation of `LspPort` (ADR-0015 / ADR-0024) — the bulk of
  the LSP slice machinery lives here so adapters (TypescriptAdapter,
  PyrightAdapter) only contribute their launcher argv and an
  extension→languageId mapping. Owns: subprocess lifecycle (`start`/`stop`
  idempotent and safe even if `start` never ran), LSP handshake
  (`initialize` + `initialized` notification, `serverInfo` captured),
  lazy `textDocument/didOpen` per file with version tracking, every nav RPC
  (definition / references / hover / typeDefinition / implementation /
  documentSymbol / workspaceSymbol / prepareRename), and diagnostics
  publish-notification subscription. Capability-unsupported / null payloads
  surface as `null` (distinct from `[]` = "feature ran, no hits") so callers
  can distinguish "not supported here" from "no hits" without leaking wire
  shapes. `LspRequestError` preserves the wire `code` (e.g. -32601 method
  not found) so call sites branch typed instead of string-matching.
  Numeric LSP `SymbolKind` is mapped through an explicit table; off-spec
  values become `"unknown"` (never leak raw numbers to consumers).
