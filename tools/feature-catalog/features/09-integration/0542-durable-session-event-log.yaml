purpose: |
  The capability Codex/Claude lack (jul-16 audit): session event history that
  survives process death, and reconnect replay served from it. Two layers:
  (1) JsonlSessionEventLog (KernelEventLogPort impl) — one JSONL file per
  session reusing the session.v1 codec envelope verbatim, pid-lock sidecar
  single-writer, torn-tail skip+truncate self-heal vs mid-file corruption
  fail-loud (both directions test-constrained), tip()/readFrom(afterSeq)
  reader surface, and seq CONTINUITY: on restart the kernel seq resumes from
  the log tip (red-on-injection tripwire resident) — the ADR-0540 W2 item-0
  external requirement this plan filed. (2) Bridge durable replay — the three
  planSessionReplay fallback paths (behind-window / ahead-of-tip / gap) load
  log segments and serve INCREMENTAL replay instead of a snapshot reset
  (pigeonhole-density seam merge, hostile-feed neutralized, readFrom-throw
  reported+fallback), and the raw client surfaces the outcome as
  onConnectionState resume: "replayed" | "snapshot_fallback" (silent
  degradation forbidden). Crown e2e: kill runtime → new runtime, same
  sessionId → reconnect replays the gap from the LOG with eventId identity.

  GATE (DOF flip-campaign EXCLUSION — see label): QUANTA_SESSION_EVENT_LOG_DIR
  unset ⇒ InMemory event log, byte-identical (instanceof + fs-canary +
  env-bypass attack + seq-control quadruple seal). v1 limits documented in
  the docblocks: no fsync (process-crash safe, power-loss deferred), no
  revision continuity (W4-a coordinate), no old-log migration (fail-loud).
  Remaining ticket-05 scope: door-level connect() resume (needs a caught-up
  signal design — see 05 ticket note).
