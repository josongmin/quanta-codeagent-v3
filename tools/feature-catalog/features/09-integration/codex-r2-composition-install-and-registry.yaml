purpose: |
  Two cross-cutting wires for the Codex-r2 absorption sprint. ADR-0332
  `installCodexR2Wires(cfg, deps)` populates the 6 AgentConfig wire slots
  (systemPromptCache/Key, contextEventsForTurn, mentionInjector,
  compactionEventEmit, imageSanitizationRetry) from a composition-root
  dep bag — NO-THROW, idempotent, caller-override-precedence. ADR-0334
  wires the helper from 4 composition roots: apps/agent/assemble.ts
  (primary, rich deps), apps/agent/run.ts + mode-presets/interactive.ts
  (belt-and-suspenders), apps/bench/eval/driver.ts (empty-deps —
  bench replay determinism). ADR-0345 adds session-keyed resource
  registry: `getOrCreate(sessionId)` returns shared `{store, cache}` ref
  so same-id re-assemble reuses prior turn events + cache hits (LRU +
  optional TTL — process-local, no persistence).
