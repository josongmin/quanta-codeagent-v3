notes: |
  L3: pure 카탈로그 코어 + transform + 2 도구 + DefaultToolPorts wiring + knob +
  manifest 완비, default-OFF byte-identical. **잔여(host)**: composition root가
  discovery port를 catalog source(bundled/remote) + toMcpServerConfig + 실제
  .mcp.json writer로 mint해 `DefaultToolPorts.mcpConnectors` 채우기 → 도구 라이브.
