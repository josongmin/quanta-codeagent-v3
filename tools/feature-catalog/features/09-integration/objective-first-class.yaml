title: Objective as a first-class per-thread object (ADR-0394, MODEL ONLY wave)
section: 9
subsystem: Objective substrate (ADR-0394)
order: 94
maturity: L2
status: new
ui_surfaces: [none]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: none
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: []
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 3/3 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "na — this record is the SUBSTRATE. The browser affordance is real but belongs to web-goal-controls / objective-goal-continuation-live, which own the /goal command and the default-ON GoalStateBar"
purpose: |
  First-class per-thread Objective — closes quanta's biggest structural gap:
  there was no typed object tying a thread's work together (goal / what "done"
  means / what is blocking / what to do next / budget). Compaction, resume,
  subagent-result attribution, and approval all re-derive intent from message
  scrollback instead of reading a typed object. This wave ships the SUBSTRATE
  ONLY — the typed model (Objective / SuccessCriterion / Blocker /
  ObjectiveBudget / ObjectiveStatus / ObjectiveSnapshot), the closed
  `ObjectivePort`, and the in-memory store. CORRECTED 2026-09-01: the
  "NOT wired into the agent loop / dispatch / prompt / features / any tool"
  clause was true for this wave and is now false — the agent loop reads it
  (`emit-helpers.ts` applyMeasuredUsageLimit), tier-1 wires it
  (`agent/tier1/objective.ts`), three LLM tools consume it, and a default-ON
  browser surface reads and mutates it. The slice fence also permits `@/shared`
  (pinned as legitimate by tests/unit/objective-slice-boundary.test.ts), not
  only `node:crypto`. This record stays scoped to the substrate.

  Status is DERIVED, never stored as truth: (1) blockers non-empty ⇒ "blocked"
  (highest priority); (2) else all criteria met (>=1) ⇒ "completed"
  (auto-derived; zero-criteria never auto-completes); (3) else the last
  explicit updateStatus value (default "active"). `updateStatus("blocked")` is
  a no-op — blocked is derived only from the blocker list. NO-THROW: every
  method degrades to null (mutators / get) or empty (list / snapshot) on
  unknown threadId or malformed/hostile input. Frozen snapshots prevent
  store corruption via returned references. Injected `now` clock seam (default
  Date.now) for deterministic tests; createdAt sticky, updatedAt advances on
  mutation. recordUsage accumulates non-negative finite integer deltas and
  clamps negative/NaN to a no-op. toSnapshot/fromSnapshot round-trips
  deep-equal + JSON byte-stable; fromSnapshot REPLACES (does not merge) and
  tolerates a hostile snapshot. The barrel still allocates nothing until a host
  constructs the authority, but "default-OFF … until a later wave wires it" no
  longer describes the tree: the goal preset seeds `QUANTA_OBJECTIVE_TOOLS=1`
  when unset, so the substrate is live out of the box (opt out `QUANTA_GOAL=0`).
