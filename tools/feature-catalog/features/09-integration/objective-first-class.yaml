deliberate_hold:
  reason: |
    RESOLVED 2026-09-01 — this hold's subject is gone. It said the slice "is NOT
    yet referenced by any code path"; it is now referenced by the agent loop,
    tier-1 features, three LLM tools, the kernel, and a default-ON browser
    surface. Kept as a record rather than deleted because the promotion condition
    below was met many waves before anyone re-read this line.
  promotion_path: |
    A later wave wires `createObjectiveStore` into the composition root so
    compaction preserves { goal, successCriteria, nextActions, blockers }
    verbatim across a summarize, resume re-hydrates via fromSnapshot, and
    subagent results attribute to the parent's objective. Promote to L3 once
    at least one real lifecycle producer/consumer is wired and a surface reads
    the objective. MET: 21 live lifecycle producers (pinned by
    tests/unit/objective/lifecycle-producer-wiring-ratchet.test.ts) and two
    surfaces that read it (CLI /goal, browser GoalStateBar).
notes: |
  Slice fence verified: no imports from @/agent core (loop/dispatch/prompt/
  features/types), @/apps, or sibling slices. IDs via crypto.randomUUID().
  44 hellgate cases / 168 expects pin (re-measured 2026-09-01; 33/101 was the
  landing figure) the status-derivation rule, NO-THROW,
  frozen snapshots, usage accumulation, snapshot round-trip, and multi-thread
  isolation. Sibling-shaped to the Stage1Store (ADR-0216) agent-side
  no-throw store pattern but synchronous + null-degrade (no Promise / no
  { ok, value } result envelope) since the objective is in-process state.
