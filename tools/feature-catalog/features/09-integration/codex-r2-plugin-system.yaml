purpose: |
  5-ADR plugin substrate. ADR-0336 ships 3 slices: plugin-discovery
  (`.codex-plugin/plugin.json` parser + fs scan + in-memory registry),
  app-catalog (`DEFAULT_APP_CATALOG` 3 entries verbatim from surface-
  model.md: cli / browser / desktop), plugin-app-resolver (composite
  resolver). ADR-0338 ships plugin-mcp-launcher: closed
  `McpLauncherPort + McpServerHandle + PluginMcpRegistry`,
  `createIsolatedMcpLauncherPort` production adapter wrapping
  `@/mcp/isolated-client`, `composeServerId` canonicalization, NO-THROW
  per-server isolation. ADR-0339 ships plugin-skill-extension:
  `resolvePluginSkillsForActivation` + `unionActiveSkills`
  (caller-override-precedence). ADR-0341 unifies the plugin manifest
  shape — Codex Desktop bundle (.vite/build/main-*.js:13428) verified
  as `Record<string, MCPServerSpec>` ground truth, so the array shape
  was an absorption miss. ADR-0342 adds `.quanta/apps.json` workspace
  override loader + workspace-wins merge.
