id: shadow-verify-adapters
title: ADR-0400 Shadow Verify — real adapters (worktree/V4A/LSP) + shadow_verify LLM tool (Wave 2)
section: 9
subsystem: Pre-apply verification (real adapters + LLM tool)
order: 400
maturity: L3
status: new
ui_surfaces: [none]
monitoring: n-a
modes: [interactive, headless]
configurable: integrated
owners: ["@songmin"]
labels: [surface:core]
depends_on: [shadow-verify]
purpose: |
  Wave 2 of ADR-0396. Real adapters for the closed `ShadowVerifyPort`:
  ShadowScratchPort = createPersistentWorktree (fresh git worktree forked off
  HEAD per call, removed on dispose); ShadowApplyPort = @/patch V4A applier
  with a scratch-rooted PatchFileSystemPort (NO-THROW — every grammar /
  anchor / apply error projects onto {ok:false, error}); ShadowCheckPort =
  pyright + typescript-language-server diagnostics for lint/typecheck (graceful
  skip when binary missing) + `bun test [target]` shell for test (error-severity
  diag on non-zero / timeout / spawn error). Plus the `shadow_verify` LLM tool
  (pre-approval-ok HITL tier, isReadOnly:true, isConcurrencySafe:false). Output
  is deterministic: `applied:` then `ok:` then one line per diagnostic
  (file:line[:col] [severity] message (source)). Default-OFF — AgentConfig.shadowVerify
  absent ⇒ tier-1 builder returns [], registry byte-identical, byte-identical
  for every legacy caller (RFC §1.2). Slice fence: @/tool/shadow-verify mirrors
  the wave-1 port types INLINE (duck-typed; @/tool MUST NOT `import type` from
  @/agent) following the @/tool/delegate pattern (ADR-0393).
evidence:
  code:
    - src/agent/shadow-verify-adapters/scratch-worktree.ts
    - src/agent/shadow-verify-adapters/apply-v4a.ts
    - src/agent/shadow-verify-adapters/check-lsp-test.ts
    - src/agent/shadow-verify-adapters/index.ts
    - src/tool/shadow-verify/index.ts
    - src/agent/tier1/shadow-verify.ts
  adrs: [400]
  tests:
    unit:
      - tests/unit/shadow-verify-adapters-hellgate.test.ts
      - tests/unit/shadow-verify-tool-hellgate.test.ts
knobs:
  - name: AgentConfig.shadowVerify
    purpose: |
      Closed ShadowVerifyPort wired by the composition root (typically via
      createShadowVerifyAdapters(cwd) + createShadowVerify(deps)). Absent ⇒
      `shadow_verify` tool not registered.
    default: absent
deliberate_hold:
  reason: |
    Composition-root wire of createShadowVerifyAdapters(cwd) +
    createShadowVerify(deps) is a separate landing — this slice ships the
    adapters + tool + tier-1 builder + slot only. Surfaces (CLI repl,
    web daemon) will opt in by wiring AgentConfig.shadowVerify at bootstrap.
  promotion_path: |
    Wire the port in the agent assembly seam (apps/agent/index.ts) gated on
    a CLI/env knob; verify in smoke fixtures; promote to L4 once an end-to-end
    surface invocation has landed.
notes: |
  TDD RED→GREEN→REFACTOR. 27 hellgate cases total (15 adapters / 12 tool).
  V4A applier's scratch-rooted PatchFileSystemPort rejects absolute path
  escapes (host workspace untouched). LSP / test failure is converted to an
  error-severity diag at the port boundary — the wave-1 runner's outer
  try/catch is defence-in-depth, not the primary line.
