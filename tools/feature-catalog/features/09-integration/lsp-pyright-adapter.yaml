purpose: |
  Per-language adapter on top of `LspClient` base for `pyright-langserver`
  over stdio. Minimal contribution surface — only the launch argv default
  `["pyright-langserver", "--stdio"]` (overridable via adapter options) and
  a constant `languageIdFor: () => "python"`. Every file the adapter sees
  is Python; no extension switch is needed. All nav RPCs (definition /
  references / hover / typeDefinition / implementation / documentSymbol /
  workspaceSymbol / prepareRename), the stdio handshake, and the
  Content-Length framing are inherited from `LspClient`.
