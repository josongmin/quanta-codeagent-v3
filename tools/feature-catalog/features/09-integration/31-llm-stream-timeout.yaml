id: llm-stream-timeout
title: LLM stream first-chunk + inter-chunk idle timeout decorator
section: 9
subsystem: LLM resilience — silence-hang guard
order: 31
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: [llm-factory]
purpose: |
  AsyncIterable decorator wrapping a raw provider stream and racing each
  `next()` against two independent deadlines — `firstChunkMs` (default 60s,
  reasoning models like o1 can legitimately take 30s+ before any token) and
  `idleMs` (default 120s between subsequent yields). On timeout, throws
  `LLMError { kind: "stream_corrupt" }` so the agent loop's existing
  `classifyLLMError` retry path engages (silence was never an error before
  this decorator — the `MAX_TURN_STREAM_RETRIES = 3` budget only fired on
  THROWN errors). Owns an internal AbortController so timeout aborts cancel
  the upstream SDK fetch (no orphan socket); composes the caller's signal so
  either side trips identical teardown. Pure decorator: a stream that yields
  within budget passes through verbatim — only the silence-hang failure mode
  is converted from "wait forever" into "structured retryable error".
