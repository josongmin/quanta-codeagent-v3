notes: |
  Forensic motivation: observed bench failure "Hung-Stream Abort" (gpt-4o-mini
  django) — 115s of silence, zero stream chunks, manual abort. Reuses
  `stream_corrupt` kind (deliberately NOT a new kind) so all downstream policy
  stays invariant-compatible. Adapter-level knobs `streamFirstChunkMs` /
  `streamIdleMs` flow through `createLLM` (see `llm-factory`).
