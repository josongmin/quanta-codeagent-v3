notes: |
  The "boot-time throw on missing redactPort" pattern is the same fail-
  closed shape used by ADR-0313's sibling sinks elsewhere in the
  catalog — a default no-op redactor would silently degrade safety on
  composition mistakes, so the constructor refuses to build.
