purpose: |
  Three additional HookEvent variants S5 surfaces (pre_compact +
  subagent_stop already shipped via ADR-0133; user_prompt_submit is the
  new addition).

  (1) user_prompt_submit — emitted by loop.ts ONCE per run, immediately
  after session_start, when the seeded buffer ends in a user message.
  Honored response channels: `deny` ⇒ short-circuit into aborted (the
  surface observes AgentOutcome.reason === "aborted" + a hook-origin stop
  category); `updatedPrompt: string` ⇒ rewrites the trailing user
  message's first text block in place (the LLM sees only the rewritten
  text). Each handler sees the latest rewritten prompt so rewrites
  compose in registration order; LAST rewrite wins.

  (2) pre_compact — emitted by compactIfNeeded BEFORE the summarizer LLM
  is invoked. Handlers may return `{abortReason}` to skip THIS compaction
  (the breaker observes the no-op). Use cases: snapshot before lossy
  compaction, audit log, defer to off-hours.

  (3) subagent_stop — emitted by subagent-runner.ts AFTER a forked child
  returns (success/fail/cancel). Fire-and-forget for status reporting; an
  abort here is meaningless (the child already finished). promptHook on
  this event is queued for the parent's NEXT turn.

  Anti-leak: each event payload contains ONLY the documented fields
  (user_prompt_submit ⇒ prompt+attachmentsCount+threadId; pre_compact ⇒
  messagesToCompact+isFirstCompaction; subagent_stop ⇒ subagentId+result
  {ok,finalText,turns}). No tool args, no cookies, no memory content
  leaks through the typed envelope.
