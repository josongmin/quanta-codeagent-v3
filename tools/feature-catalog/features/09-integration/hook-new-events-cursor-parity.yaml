notes: |
  user_prompt_submit emission lives in loop.ts (emitUserPromptSubmitHook
  helper) — NOT in the REPL surface — so every surface (CLI / Web /
  Tauri / one-shot) benefits without per-surface wiring. No emission when
  there is no trailing user message (resume-without-new-prompt) or when
  no bus is wired (byte-identical legacy path).
