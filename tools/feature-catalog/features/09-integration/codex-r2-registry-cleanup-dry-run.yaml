id: codex-r2-registry-cleanup-dry-run
title: Session registry cleanup --dry-run (preview without commit) ADR-0387
section: 9
subsystem: codex-r2 — cleanup preview flag extending ADR-0379
order: 107
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: integrated
modes: [n-a]
configurable: n-a
owners: ["@songmin"]
labels: ["surface:core", "absorbed:codex", "production-wired", "tdd-strict"]
depends_on:
  - codex-r2-registry-r14-partial
purpose: |
  ADR-0387 extends ADR-0379 `/session-registry cleanup` with a `--dry-run`
  flag so operators can preview retention sweep candidate counts (TTL
  axis + sliding-window byte-cap axis) WITHOUT committing the eviction.
  Adds two NEW leaf functions — `countDiskRegistryCleanupCandidates` +
  `countSqliteRegistryCleanupCandidates` — that mirror the sweep
  algorithm with SELECT/scan-only semantics (no `DELETE`, no `unlink`,
  no `writeFile`). Sweep functions are NOT mutated so ADR-0379 byte
  identical contract holds. SQLite count inverts the outermost DELETE
  in the cumulative-bytes sliding window (`WHERE cum > maxTotalBytes`
  becomes `SELECT COUNT(*)`); pre-filtered by TTL cutoff so size axis
  matches what sweep would do AFTER TTL deletion. Both functions are
  NO-THROW (open-fail / missing dir ⇒ zero values) + idempotent (zero
  writes ⇒ DB rows + fs bytes byte-identical before/after the call).
  Slash flag dispatch parses argv: `--dry-run` anywhere triggers the
  preview handler; unknown flags ignored. No-flag path preserves
  ADR-0379 exactly (case [25] explicitly pins this).
evidence:
