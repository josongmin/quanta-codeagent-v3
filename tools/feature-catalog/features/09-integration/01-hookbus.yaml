knobs:
  - name: PROMPT_HOOK_MAX_CHARS
    where: src/agent/hooks.ts
    default: 10_000
    purpose: per-side promptHook accumulator cap (FIFO trim + warn log)
  - name: TOOL_FAILURE_RETRY_MAX
    where: src/agent/hooks.ts
    default: 3
    purpose: max per-call_id retry count after post_tool_use_failure promptHook injection
deliberate_hold: null
notes: |
  Cursor의 hooks 흡수에서 quanta가 *추가*한 invariant: permission gate **후**
  updated_input 적용 — Cursor에서는 hook이 input을 rewrite 한 다음 permission이
  돌지만, 그러면 hook이 권한을 우회하는 경로가 생긴다. 우리는 *gate 통과 인자*에
  rewrite를 적용해 권한이 항상 *원본*을 본다. cursor-absorption-r1-r4-hardening
  라운드에서 post-hook input gap 봉인 + 500-pair differential fuzz로 의미동등성
  증명.

  ADR-0133 — 9 이벤트 / 4 response 채널 (deny / updatedInput / promptHook /
  abort / toolOverride[V2]). subagent_start/_stop은 PARENT bus에서만 fire
  (child는 hooks 상속 안 함). subagent_start abort = fork 취소 (synthetic
  non-ok result). subagent_stop promptHook은 parent 다음 turn folded.
  pre_compact abort = compaction 스킵 (breaker은 no-progress로 관찰). V2
  deferred: AskQuestion/McpAuth/GenerateImage/WebFetch lifecycle, declarative
  plugin manifest, BroadcastChannel 노출.
