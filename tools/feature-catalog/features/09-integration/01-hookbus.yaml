id: hookbus
title: HookBus + Cursor `updated_input` 흡수 (pre_tool_use 인자 rewrite)
section: 9
subsystem: Hooks (RFC §13 + Cursor absorption)
order: 1
maturity: L4
status: refined
purpose: |
  In-process HookBus — 5 이벤트(session_start / session_end / pre_tool_use /
  post_tool_use / user_prompt_submit) + matcher(글로브 + tool name + path) + compose
  순서. pre_tool_use는 deny / allow / **updated_input**(Cursor 흡수) 셋 결정 —
  hook이 도구 인자를 *재작성* 가능. 적용 순서: matcher → compose → permission gate
  **후** updated_input 반영 (permission 우회 차단). Hook 결과는 admissibility-gate
  (ADR-0026 SSOT) 다음 단계에 합류하므로 hook이 단독으로 권한 결정을 뒤집을 수 없음.
  2026-05-23 Cursor absorption 라운드 (memory `glob-rules-and-hook-updated-input`)
  에서 updated_input 평면 추가 + permission-후 적용 invariant + 25 신규 테스트.
