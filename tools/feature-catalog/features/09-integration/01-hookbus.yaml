id: hookbus
title: HookBus + Cursor `updated_input` 흡수 (pre_tool_use 인자 rewrite) + ADR-0133 bidirectional RPC
section: 9
subsystem: Hooks (RFC §13 + Cursor absorption + ADR-0133)
order: 1
maturity: L4
status: refined
owners: ["@songmin"]
labels: ["surface:ipc"]
purpose: |
  In-process HookBus — 9 이벤트(session_start / session_end / turn_start /
  pre_tool_use / post_tool_use / **post_tool_use_failure** / **pre_compact** /
  **subagent_start** / **subagent_stop**) + matcher(글로브 + tool name + path) +
  compose 순서. pre_tool_use는 deny / allow / **updated_input**(Cursor 흡수) 셋
  결정. 모든 이벤트는 ADR-0133 bidirectional response 채널 `promptHook`
  (10K char per-side cap) + `abort` (first-wins short-circuit) 지원 — hook이
  단순 mutator 아니라 first-class agent flow controller. 적용 순서: matcher →
  compose → permission gate **후** updated_input 반영 (permission 우회 차단).
  Hook 결과는 admissibility-gate (ADR-0026 SSOT) 다음 단계에 합류하므로 hook이
  단독으로 권한 결정을 뒤집을 수 없음. 2026-05-23 Cursor absorption 라운드
  (memory `glob-rules-and-hook-updated-input`)에서 updated_input 평면 추가 +
  permission-후 적용 invariant. 2026-05-24 ADR-0133 (memory
  `extracted-source-novel-findings-2026-05-24`)에서 6→9 이벤트 확장 +
  bidirectional Request/Response (promptHook / abort) + 52 신규 테스트.
