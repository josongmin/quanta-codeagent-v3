knobs: []
deliberate_hold: null
notes: |
  HARD_DENY policy-rule scope is the bash tool's command-string surface;
  argv-only `GitProcessPort.run(["git", ...])` is the intended bypass for
  first-class git tools (same seam `git_commit` / `git_branch_switch` use).
  The diff-size estimator uses an UPPER-bound (`bytes_per_line = 200`) so a
  borderline case fails the guard rather than silently exceeding the cap.
