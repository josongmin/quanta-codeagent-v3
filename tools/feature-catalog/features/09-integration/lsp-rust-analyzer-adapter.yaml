purpose: |
  Per-language adapter on top of `LspClient` base for `rust-analyzer` over
  stdio (jun-10 multilang-debug Epic-1). Minimal contribution surface — only
  the launch argv default `["rust-analyzer"]` (NO `--stdio` flag, unlike
  pyright/tsserver: rust-analyzer speaks LSP on stdio by default) and a
  constant `languageIdFor: () => "rust"`. All nav RPCs (definition /
  references / hover / typeDefinition / implementation / documentSymbol /
  workspaceSymbol / call-hierarchy / prepareRename), the stdio handshake, and
  the Content-Length framing are inherited from `LspClient`. Wired into the
  OCP `SERVERS` registry in `lsp-bridge.ts` (`.rs` extension) so `lsp_nav`
  serves Rust with zero per-tool change. Real-verified against rust-analyzer
  1.95.0 (definition + hover resolve through a live cargo project).
