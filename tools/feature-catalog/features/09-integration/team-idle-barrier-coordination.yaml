depends_on: [team-dag-coordination, team-broker-coordination]
purpose: |
  Claude --agent-teams의 team-idle 배리어 흡수. 리더가 "전원 끝났나"를 폴링하는 대신
  fan-in 배리어로 await. 각 멤버가 turn-end에 idle beacon emit, 리더는 teamIdle(전원
  beacon) 감지 시 다음 phase/handoff/종료.

  PURE 코어 (`src/subagent/coordination/idle-barrier.ts`, @/shared만, no Date.now):
    - `IdleBeacon { agentId, idleSince }`.
    - `teamIdle(beacons, members)` — 모든 member id가 beacon 보유 시 true. empty
      members ⇒ false(문서화 선택: 팀 없음 ⇒ 배리어 release 없음). stray beacon(members
      밖)은 무시 — 배리어 안 뒤집음.
    - `idleSince(beacons, members)` — 전원 idle일 때만 member 중 MAX idleSince
      (= 마지막 멤버가 idle된 순간 = release ts), 아니면 undefined.
    - `upsertBeacon`(agent당 1개 latest 교체) / `clearBeacon`(재활성=drop), 둘 다 pure.

  포트 (`createIdleBarrier({now})`): 주입 클럭 위 in-memory `beacon`/`reactivate`/
  `teamIdle`/`idleSince`. `QUANTA_TEAM_IDLE` default-OFF (beacon 0 ⇒ 배리어 없음,
  byte-identical 폴링).
