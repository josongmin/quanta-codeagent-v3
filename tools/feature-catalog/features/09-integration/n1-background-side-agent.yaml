id: background-side-agent
title: Background side-agent daemon — resident monitor/cleanup (N1)
section: 9
subsystem: Side-agent (§7, Claude tengu_bg_agent 흡수)
order: 167
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [daemon, headless, interactive]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "absorbed:claude"]
depends_on: [0145-background-subagent, subagent-mailbox-transport]
purpose: |
  Claude `tengu_bg_agent_action`(24 occ, 최고신호) 흡수 — 메인루프 안 막고 모니터링/
  정리/주기점검 돌리는 PERSISTENT 백그라운드 데몬 에이전트. one-shot subagent-bg(ADR-0130)
  /scheduler(메인루프 구동, ADR-0161)와 별개 축: 데몬은 resident, interval/event로 스스로
  깨고, 깰 때마다 ONE bounded pass 돌리고, 결과를 mailbox로 PUSH(블로킹 X).

  코어 (`src/side-agent/`, PURE leaf, 모든 effect 주입 포트 — runner/mailbox/sink/
  events/timers/clock, Date.now/setInterval/RNG 없음): `SideAgentDaemonRegistry`
  spawn/findings/list/stop/stopAll, `SideAgentSpec{task,trigger(interval|event),
  maxWakes,maxTurnsPerWake,idleReapMs?}`, runaway guard(maxConcurrent default 2).

  도구 (`src/tool/side-agent/`, duck-typed `SideAgentDaemonPort`=@/tool fence clean):
  `side_agent_spawn`/`_list`/`_stop`/`_findings`. tier1 `buildSideAgentBlock`이
  `AgentConfig.sideAgentDaemons` 있을 때 노출, `QUANTA_SIDE_AGENT` default-OFF(없으면
  미등록=byte-identical).
evidence:
  code:
    - src/side-agent/registry.ts
    - src/side-agent/types.ts
    - src/tool/side-agent/index.ts
    - src/agent/tier1/side-agent.ts
    - src/agent/side-agent-runner.ts
  tests:
    unit:
      - tests/unit/side-agent-hellgate.test.ts
      - tests/unit/side-agent-tools-hellgate.test.ts
      - tests/unit/side-agent-runner-hellgate.test.ts
    integration:
      - tests/unit/side-agent-block-e2e-hellgate.test.ts
    contract: []
knobs:
  - name: QUANTA_SIDE_AGENT
    default: 'undefined'
    purpose: 'Strict opt-in (=="1") that mints the live daemon registry (maybeWireSideAgent) so the side_agent_* tools register; absent ⇒ slot unset ⇒ tools unregistered ⇒ byte-identical.'
  - name: QUANTA_TEAM_IDLE
    default: 'undefined'
    purpose: 'Optional — when set, wireSideAgentDaemons composes an idle-barrier (Capability C) so a leader can await teamIdle() over the resident daemons instead of polling; absent ⇒ legacy registry (byte-identical).'
notes: |
  L3: pure 데몬 registry 코어 + 4 도구 + tier1 블록 + AgentConfig slot + knob +
  **Phase-2 host runner adaptation 완료** (`src/agent/side-agent-runner.ts`):
  `subagentRunnerToSidePass`(read-biased SIDE_AGENT_READONLY_TOOLS toolFilter +
  bounded maxTurns, finalText→finding; summary=line-1 cap 200 / detail cap 8KB —
  chatty child의 unbounded payload가 findings ring-buffer/mailbox를 부풀리지 못하게
  C2와 동일 DoS 규율), `mailboxToSideAgentMailbox`(finding→broadcast),
  `wireSideAgentDaemons`(injected setInterval/clearInterval/now로 registry mint).
  `QUANTA_SIDE_AGENT` default-OFF byte-identical. privilege: side-agent의 toolFilter는
  ALLOWLIST(축소만)이고 모든 write는 부모 permission gate 재진입 — self-grant 불가.
