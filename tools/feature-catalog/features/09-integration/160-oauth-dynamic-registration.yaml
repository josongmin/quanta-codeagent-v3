notes: |
  Phase 1 (2026-05-25). 흡수 출처: Cursor RFC 7591 dynamic client registration
  (memory R4). What this is NOT: full OAuth flow (authorize/redirect/exchange
  — separate follow-up). Hellgate seals 10 adversarial cases including
  Array-body rejection (typeof [] === 'object' edge case that bypasses naive
  shape checks). Used by future code paths that need to register a fresh
  client with a discovered registration_endpoint (Phase C composes Discovery
  → Registration → Token Exchange).
