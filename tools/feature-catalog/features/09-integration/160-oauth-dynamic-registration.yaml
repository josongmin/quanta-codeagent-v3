purpose: |
  `registerOAuthClient(endpoint, metadata, fetchPort)` — RFC 7591 dynamic
  client registration. POSTs `client_metadata` (redirect_uris + optional
  client_name / token_endpoint_auth_method / grant_types / response_types /
  scope) as `application/json`, parses typed `OAuthClientRegistration`
  response (`clientId` required; `clientSecret`, `registrationAccessToken`,
  `registrationClientUri` optional). Stable error arm via
  `OAuthRegistrationError`: `registration-rejected` (4xx) /
  `registration-malformed` (non-object/non-JSON, including arrays) /
  `missing-client-id` (empty or absent) / `network-failed`. Hellgate verifies
  request body shape end-to-end (content-type header + redirect_uris +
  optional fields wired correctly).
