    where: src/shared/runtime-config-knobs.ts
    default: false
    purpose: '§4.3 opt-in (gateOn) that flips runtimeConfig().sideAgentProcess; absent ⇒ side-agent registry runs IN-PROCESS (byte-identical). On ⇒ assembleAgentConfig mints a forked-child OS-process registry (agent-config-assembler.ts:535-536). V1 core only — NOT a launchctl/systemd manager.'
deliberate_hold:
  reason: |
    LIVE-wired as of jun-15 (the L2→L4 promotion): assembleAgentConfig reads
    runtimeConfig().sideAgentProcess (agent-config-assembler.ts:535) and mints
    cfg.sideAgentDaemons = createProcessSideAgentDaemonRegistry({...}) — a
    forked-child OS-process registry (process-registry.ts) running the real
    LLM-backed bounded charter pass (worker-charter-runner.ts) per child. The
    RESIDUAL deferrals are transport/packaging depth only: dedicated unix-socket
    transport (V1 uses the default Node IPC structured-message pipe), launchctl/
    systemd unit generation, and a multi-daemon OS manager.
  promotion_path: |
    Land a dedicated unix-socket transport + launchctl/systemd unit generation +
    multi-daemon OS manager to retire the residual transport/packaging deferrals.
notes: |
  L4: pure supervisor core + real OS fork adapter + IPC union + exponential-backoff
  respawn + the multi-daemon process-registry, LIVE-wired through assembleAgentConfig
  (QUANTA_SIDE_AGENT_PROCESS ⇒ cfg.sideAgentDaemons = createProcessSideAgentDaemonRegistry)
  and proven over a REAL fork (integration e2e) + the LLM charter pass + IPC kill-mid-result.
  V1 transport = default Node IPC pipe (structured-message channel satisfies the
  audit's "socket IPC"); dedicated unix-socket transport + launchctl/systemd unit
  generation + multi-daemon OS manager are explicit depth follow-ups. NO-THROW handle:
  send/kill on a dead child are swallowed (onExit is the authoritative liveness signal).
