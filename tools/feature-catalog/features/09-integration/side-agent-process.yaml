id: side-agent-os-process-daemon
title: Side-agent OS-PROCESS daemon V1 — forked child + supervised backoff respawn (§4.3)
section: 9
subsystem: Side-agent (§4.3, Codex side-agent fleet 흡수)
order: 168
maturity: L2
status: new
ui_surfaces: [none]
monitoring: n-a
modes: [daemon]
configurable: planned
owners: ["@songmin"]
labels: ["surface:core", "absorbed:codex"]
depends_on: [background-side-agent]
surface_integration:
  cli: na
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "export-/test-only seam — no live CLI consumer constructs the supervisor. The QUANTA_SIDE_AGENT_PROCESS gate flips runtimeConfig().sideAgentProcess (src/shared/runtime-config.ts:1536 gateOn) but maybeWireSideAgent (agent-config-assembler.ts:510) does NOT yet read it — it mints only the in-process registry. Live consumers of nodeProcessForkPort/createSupervisedProcessDaemon are the two tests."
    web: "no web affordance — internal OS-process daemon; not produced on any web event."
purpose: |
  §4.3 OS-PROCESS side-agent daemon V1 — Codex side-agent fleet 흡수. ADR-0483의
  IN-PROCESS resident registry(메인스레드 per-wake runner)와 같은 축의 OS-process
  COUNTERPART: side-agent를 별도 OS child로 fork하고 socket/pipe IPC + supervised
  crash-respawn(exponential backoff)로 감독한다. ADR-0483이 명시적으로 Phase-1
  NON-GOAL("spawned as a separate OS process")으로 미룬 HIGH OS-integration 항목의
  V1 CORE.

  코어 (`src/side-agent/process.ts`, PURE LEAF — concrete import/IO/clock/timer/RNG
  ZERO, 모든 effect 주입 포트, `@/side-agent`는 아무것도 안 닿음):
  `SideAgentIpcMessage`(closed union: charter/shutdown parent→child, ready/finding
  child→parent — auditable wire), `ProcessForkSpec`/`ChildProcessHandle`(send/
  onMessage/onExit/kill, NO-THROW: dead child send/kill=no-op, onExit가 권위 liveness),
  `ProcessForkPort`(단일 OS seam), `DelayScheduler`(주입 backoff timer),
  `backoffForAttempt`(pure exponential `base*2^(n-1)` cap clamp + exponent≤30
  overflow guard), `createSupervisedProcessDaemon`(supervisor: fork→ready→charter
  hand→running; UNEXPECTED exit⇒backoff respawn bounded by maxRestarts⇒
  crashed-permanently runaway guard; clean stop()=no respawn; stop() mid-backoff
  cancels pending respawn).

  REAL OS 어댑터 (`src/host/runtime/side-agent-fork-port.ts`, composition root —
  순수 supervisor를 `node:child_process.fork`에 커플하는 SINGLE place):
  `nodeProcessForkPort: ProcessForkPort`. serialization:"advanced"=typed IPC
  structured-clone fidelity, stdio ipc 채널, wrapChild가 racing exit의
  ERR_IPC_CHANNEL_CLOSED/EPIPE swallow + inbound trust-boundary filter(well-formed
  `{kind}` only).

  Default-OFF: `QUANTA_SIDE_AGENT_PROCESS`(runtimeConfig().sideAgentProcess) 없으면
  supervisor 미구성 ⇒ side-agent registry는 in-process 그대로 (byte-identical).
  V1 EXCLUDES: launchctl/systemd unit, multi-daemon OS manager, dedicated unix-socket
  transport (depth follow-up).
evidence:
  code:
    - src/side-agent/process.ts
    - src/host/runtime/side-agent-fork-port.ts
  adrs: [522]
  tests:
    unit:
      - tests/unit/side-agent-process-supervisor-hellgate.test.ts
    integration:
      - tests/integration/side-agent-process-os-fork-e2e.test.ts
    contract: []
knobs:
  - name: QUANTA_SIDE_AGENT_PROCESS
    where: src/shared/runtime-config-knobs.ts
    default: false
    purpose: '§4.3 opt-in (gateOn) that flips runtimeConfig().sideAgentProcess; absent ⇒ side-agent registry runs IN-PROCESS (byte-identical). V1 core only — NOT a launchctl/systemd manager. NOTE: the live composition-root branch that reads this gate (fork-backed registry) is not yet wired (see deliberate_hold).'
deliberate_hold:
  reason: |
    Export-/test-only seam. The V1 core (`src/side-agent/process.ts`) + the real
    OS adapter (`src/host/runtime/side-agent-fork-port.ts`) are LIVE-tested — the
    integration test forks a genuine child via `nodeProcessForkPort` — but NO live
    CLI/web consumer constructs `createSupervisedProcessDaemon`. The
    `QUANTA_SIDE_AGENT_PROCESS` gate already flips `runtimeConfig().sideAgentProcess`
    (src/shared/runtime-config.ts:1536 gateOn), yet `maybeWireSideAgent` (agent-config-assembler.ts:510,
    owned by the side-agent host-wiring lane) still mints ONLY the in-process
    registry and does not read `sideAgentProcess`. Turning the gate on today has no
    runtime effect beyond the config boolean. Honest cli/web = na, configurable =
    planned (knob defined, no consumer branch).
  promotion_path: |
    Extend `maybeWireSideAgent` (src/host/runtime/agent-config-assembler.ts) with a
    `runtimeConfig().sideAgentProcess` branch that mints the side-agent registry
    backed by `createSupervisedProcessDaemon` + `nodeProcessForkPort` (a forked-child
    per daemon) instead of the in-process per-wake runner. On landing: flip
    surface_integration.cli → full with the import-graph evidence string,
    configurable → integrated, and drop this hold.
notes: |
  L2: pure supervisor core + real OS fork adapter + IPC union + exponential-backoff
  respawn, fully mockable (fake fork + manual scheduler) and proven over a REAL fork
  (integration e2e). NOT live-wired — see deliberate_hold (the composition-root bind
  in maybeWireSideAgent is the named promotion path, owned by a separate lane).
  V1 transport = default Node IPC pipe (structured-message channel satisfies the
  audit's "socket IPC"); dedicated unix-socket transport + launchctl/systemd unit
  generation + multi-daemon OS manager are explicit depth follow-ups. NO-THROW handle:
  send/kill on a dead child are swallowed (onExit is the authoritative liveness signal).
