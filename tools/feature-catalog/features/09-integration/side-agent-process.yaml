purpose: |
  §4.3 OS-PROCESS side-agent daemon V1 — Codex side-agent fleet 흡수. ADR-0483의
  IN-PROCESS resident registry(메인스레드 per-wake runner)와 같은 축의 OS-process
  COUNTERPART: side-agent를 별도 OS child로 fork하고 socket/pipe IPC + supervised
  crash-respawn(exponential backoff)로 감독한다. ADR-0483이 명시적으로 Phase-1
  NON-GOAL("spawned as a separate OS process")으로 미룬 HIGH OS-integration 항목의
  V1 CORE.

  Cadence는 in-process와 같은 `createDaemonEngine`이 소유한다. process registry는
  charter IPC `runPass` adapter다. `wakesDone`은 finding 수가 아니라 완료 터미널당
  1회. LLM null/empty → child `no_finding`(feed에 synthetic finding 없음).
  import/provider/throw → `failed`. child-death → `cancelled`(wakesDone 불변).

  코어 (`src/side-agent/process.ts`, PURE LEAF — concrete import/IO/clock/timer/RNG
  ZERO, 모든 effect 주입 포트):
  `SIDE_AGENT_IPC_VERSION = 1`. `SideAgentIpcMessage` closed union: parent→child
  charter/shutdown; child→parent ready + finding(0..N) + 터미널
  `no_finding`|`failed`|`cancelled`|`completed`. parent-owned wake는 `version`과
  `wakeId`가 둘 다 맞아야 waiter가 받는다(누락 drop). supervisor-direct V1
  charter-on-ready는 여전히 one-shot일 수 있다.
  `ProcessForkSpec`/`ChildProcessHandle`(send/onMessage/onExit/kill, NO-THROW:
  dead child send/kill=no-op, onExit가 권위 liveness), `ProcessForkPort`,
  `DelayScheduler`, `backoffForAttempt`, `createSupervisedProcessDaemon`
  (fork→ready→charter; UNEXPECTED exit⇒backoff respawn bounded by maxRestarts).

  REAL OS 어댑터 (`src/host/runtime/side-agent-fork-port.ts`, composition root —
  순수 supervisor를 `node:child_process.fork`에 커플하는 SINGLE place):
  `nodeProcessForkPort: ProcessForkPort`. serialization:"advanced"=typed IPC
  structured-clone fidelity, stdio ipc 채널, wrapChild가 racing exit의
  ERR_IPC_CHANNEL_CLOSED/EPIPE swallow + inbound trust-boundary filter(well-formed
  `{kind}` only).

  Default-OFF: `QUANTA_SIDE_AGENT_PROCESS`(runtimeConfig().sideAgentProcess) 없으면
  supervisor 미구성 ⇒ side-agent registry는 in-process 그대로 (byte-identical).
  V1 EXCLUDES: launchctl/systemd unit, multi-daemon OS manager, dedicated unix-socket
  transport (depth follow-up).
