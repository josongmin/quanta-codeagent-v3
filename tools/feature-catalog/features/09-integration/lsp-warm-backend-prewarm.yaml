    - src/tool/lsp_nav/index.ts
  adrs: [15]
  tests:
    unit:
      - tests/unit/lsp-warm-pool-hellgate.test.ts
      - tests/unit/lsp-prewarm-orchestration-hellgate.test.ts
      - tests/unit/lsp-prewarm-wire-hellgate.test.ts
