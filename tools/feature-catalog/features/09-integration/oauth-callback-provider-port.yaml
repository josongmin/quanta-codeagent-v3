id: oauth-callback-provider-port
title: OAuthCallbackProvider port — pluggable OAuth callback receiver (CLI/Tauri/Web)
section: 9
subsystem: ChatGPT-OAuth (ADR-0094) — surface callback seam
order: 12
maturity: L4
status: stable
purpose: |
  Surface-supplied callback receiver for the OAuth authorize redirect
  (`?code=…&state=…`). Decouples `runBrowserFlow` from *how* the redirect is
  received: CLI binds a loopback HTTP listener
  (`http://localhost:<port>/auth/callback`); Tauri registers a deep-link
  handler for `quanta://oauth/callback`; Web mounts an SPA route in the same
  origin. Each surface implements the port and injects via
  `callbackProvider`. When omitted, the loopback-HTTP CLI default
  (`createCliOAuthCallback`) kicks in so the terminal flow stays
  byte-identical. `start({expectedState, signal})` returns
  `{redirectUri, received}` — provider MUST reject on `state` mismatch
  (CSRF guard), abort signal, oauth error param, malformed callback, or
  timeout; `received` resolves one-shot with the redeemable code.
