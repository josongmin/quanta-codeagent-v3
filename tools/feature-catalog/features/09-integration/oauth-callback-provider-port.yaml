knobs: []
deliberate_hold: null
notes: |
  Sibling to the ChatGPT-OAuth provider (`chatgpt-oauth-provider`) — that
  feature carries the PKCE / token-store / endpoint logic; this port is the
  surface-agnostic seam for the callback receive step. Implementations own
  their own teardown when `received` settles (close HTTP server, drop
  deep-link listener, unsubscribe from EventBus).
