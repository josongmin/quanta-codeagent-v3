notes: |
  L4: 데이터모델 + fire 라우팅 + 직렬화 + 생성 불변식 다 wired, default cron이라
  기존 automation byte-identical. 실제 "target thread를 그 posture로 resume" 실행은
  host가 AgentLoopPort.enqueueUserMessage(targetThreadId/inheritedPolicy)에 바인딩.
