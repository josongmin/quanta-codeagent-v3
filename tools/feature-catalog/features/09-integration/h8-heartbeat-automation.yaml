notes: |
  L5 (ADR-0480 host bind LANDED): 데이터모델 + fire 라우팅 + 직렬화 + 생성 불변식 +
  HOST enqueue 바인딩까지 전부 wired. 이전 L4 잔여였던 "host enqueue 바인딩"(매 host
  AgentLoopPort impl이 opts를 drop)이 닫힘 — `src/apps/cli/repl/heartbeat-binder.ts`의
  closed-port `HeartbeatThreadBinder` + `heartbeatEnqueueHandler`가 cron-vs-heartbeat
  분기를 한다: targetThreadId 없으면 byte-identical 직접 push(cron), 있으면 binder.resume이
  same-thread 면 inherited posture를 per-turn permission cell(per-thread-permissions)에
  CLAMP 후 재적용하고 prompt를 그 thread 큐에 push. cross-thread/missing ⇒ loud
  typed `thread-not-found`(오라우팅 금지). SECURITY: posture clamp = 절대 escalate 금지
  — forged/unknown approvalPolicy ⇒ most-restrictive(default) fail-closed, snapshot은
  current cell과의 most-restrictive meet으로 clamp(둘 중 더 안전한 쪽). NO-THROW(push
  fault ⇒ enqueue-failed). default cron이라 기존 automation byte-identical.
  잔여: cross-thread(web-daemon/background host)용 foreign-thread loading binder는 같은
  port의 future impl(P2, 스코프 밖).
