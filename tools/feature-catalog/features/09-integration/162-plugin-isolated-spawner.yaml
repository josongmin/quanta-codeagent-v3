id: plugin-isolated-spawner
title: Plugin isolated process spawner — IsolatedProcessSpawnerPort + Bun adapter (ADR-0162)
section: 9
subsystem: Plugin isolation (ADR-0162) — closed port + first-line ready sentinel
order: 162
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:ipc"]
depends_on: [plugin-dxt-loader, plugin-host-wrapper, plugin-lifecycle-manager, assert-never-exhaustiveness, byte-stable-string-comparator]
config_refs:
  env: []
surface_integration:
  cli: na
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "pure internal IsolatedProcessSpawnerPort + Bun adapter (closed port, ready sentinel); surface:ipc, no UI affordance"
    web: "pure internal process-spawn port, no UI affordance on any surface"
purpose: |
  Closed `IsolatedProcessSpawnerPort` (W11 Claude DXT
  `UtilityProcess.fork({serviceName, allowLoadingUnsignedLibraries})` 흡수)
  + `Bun.spawn` adapter. 5s spawn timeout (첫 stdout 라인 = ready sentinel),
  5s SIGTERM→SIGKILL escalation (runtime/guarded-spawn 의 2s KILL_GRACE_MS
  과 별개 — plugin 은 init/shutdown 비용이 크다), 10MB single-line cap
  (DoS 방지), NUL-byte 라인 drop, ASCII serviceName regex
  `[A-Za-z0-9][A-Za-z0-9._-]{0,63}`, QUANTA_SERVICE_NAME / QUANTA_ALLOW_UNSIGNED
  env wiring, early-buffer flush on first subscriber (post-ready race 방지).
  NO-THROW handle: send/onMessage/kill 모두 process exit 후 idempotent.
  Future: Electron `UtilityProcess` adapter 만 추가하면 desktop surface 진출
  완료 (OCP).
evidence:
  code:
    - src/plugin-isolation/types.ts
    - src/plugin-isolation/bun-spawner.ts
    - src/plugin-isolation/index.ts
  adrs:
    - docs/decisions/0162-plugin-process-isolation.md
  tests:
    unit:
      - tests/unit/plugin-isolation-spawner-hellgate.test.ts
      - tests/unit/plugin-isolation-spawner.test.ts
    integration: []
    contract: []
knobs:
  - name: DEFAULT_SPAWN_TIMEOUT_MS
    where: src/plugin-isolation/types.ts
    default: 5_000
    purpose: first-line ready sentinel deadline (DXT 표준)
  - name: DEFAULT_GRACEFUL_KILL_MS
    where: src/plugin-isolation/types.ts
    default: 5_000
    purpose: SIGTERM→SIGKILL escalation (runtime/guarded-spawn 의 2s 와 별개)
  - name: MAX_MESSAGE_BYTES
    where: src/plugin-isolation/types.ts
    default: 10_485_760
    purpose: single-line payload cap (DoS 방지)
deliberate_hold: null
notes: |
  Foundation invariant: src/runtime/guarded-spawn.ts (KILL_GRACE_MS=2000) 는
  건드리지 않는다 — shell tool / sandbox 의 byte-identical 계약. Plugin
  isolation 은 위에 쌓는 layer.
