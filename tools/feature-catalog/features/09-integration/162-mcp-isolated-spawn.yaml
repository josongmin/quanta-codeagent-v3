id: mcp-isolated-spawn
title: Isolated MCP transport — opt-in process-ready spawn (ADR-0162)
section: 9
subsystem: MCP (ADR-0007) + Plugin isolation (ADR-0162) — alternative spawn path
order: 162
maturity: L4
status: stable
ui_surfaces: [api]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:ipc"]
config_refs:
  env: [MCP_USE_ISOLATED_SPAWN]
depends_on: [mcp-tool-bridge, plugin-isolated-spawner]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-09-08"
  evidence:
    cli: "runs in the interactive CLI — 4/4 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure internal IPC spawn primitive, no browser affordance"
purpose: |
  When MCP_USE_ISOLATED_SPAWN=1 (also true/yes), McpClient's defaultTransportFor
  selects IsolatedMcpTransport in process-ready mode for command servers.
  HTTP/url selection is unchanged. Flag unset → StdioMcpTransport (byte-identical).
  IsolatedMcpClient is a delegating facade (dxt-ready-line) for existing
  hellgates. Production plugin launchers construct McpClient + IsolatedMcpTransport
  (dxt-ready-line) directly. The env flag selects IsolatedMcpTransport process-ready
  via McpClient's defaultTransportFor.
  Adds vs stdio: typed spawn timeout, SIGTERM→SIGKILL grace, ASCII serviceName
  via QUANTA_SERVICE_NAME. Send failures (dead/oversize) surface as Error on
  McpTransport.send; DXT IsolatedProcess.send stays NO-THROW.
evidence:
  code:
    - src/mcp/client/transport-factory.ts
    - src/mcp/client/isolated-flag.ts
    - src/mcp/transports/isolated.ts
    - src/mcp/isolated-client.ts
    - src/plugin-isolation/bun-spawner.ts
  adrs:
    - docs/decisions/0162-plugin-process-isolation.md
  tests:
    unit:
      - tests/unit/sep8-remediation/r11/c-f1-factory-seam.test.ts
      - tests/unit/plugin-isolation-mcp-integration-hellgate.test.ts
    integration:
      - tests/integration/sep8-remediation/r11/c-f1-process-ready-stdio.test.ts
    contract: []
knobs:
  - name: MCP_USE_ISOLATED_SPAWN
    where: src/mcp/client/isolated-flag.ts (isolatedMcpEnabledFromEnv)
    default: ""
    purpose: opt-in factory switch (accepts '1' | 'true' | 'yes')
deliberate_hold: null
notes: |
  Backward compat: `McpClient` remains the `@/mcp` default. IsolatedMcpClient
  is NOT re-exported from the barrel; IsolatedMcpTransport and
  isolatedMcpEnabledFromEnv ARE. Plugin launchers construct McpClient +
  IsolatedMcpTransport (dxt-ready-line). The env flag is owned by
  transport-factory / isolated-flag, not by host composition.
