configurable: n-a
purpose: |
  Surface-agnostic event bridge connecting multiple surfaces (CLI / Web /
  Tauri / future remote-control daemons) to a single logical agent session.
  Each surface publishes events and subscribes to peer events; the transport
  is INJECTED (no `process.env` / `argv` reads inside `@/ipc`). On-the-wire
  `WireEnvelope { protocol: "quanta.ipc.v1", source, sessionId, payload,
  timestamp }` — every `BridgeEvent` is encoded to the envelope before send;
  the transport just shuttles bytes. `BridgePayload` is a CLOSED discriminated
  union — a new payload kind MUST extend this file (and transport encoders) —
  there is no `unknown` escape. Default-OFF / byte-identical: if no surface
  constructs an EventBridge the CLI behaviour is unchanged. Slice boundary —
  `@/ipc` may import `@/agent`, `@/llm`, `@/session`, `@/stream`, `@/shared`;
  MUST NOT import `apps/**`, `@/rules`, `@/patch`, `@/migration`.
