notes: |
  The typed-error class `OsSandboxError` is exported for opt-in callers
  who wrap the spawner config they pass in — the public port itself
  never throws. `Spawner` is the injected primitive (Bun.spawn in
  production, fakes in tests); `OsSandboxConfig.platform` lets tests
  drive each branch (`"darwin" | "linux" | "win32"`) without runtime
  conditional. `SandboxBackend` is a closed enum
  (`"seatbelt" | "landlock+seccomp" | "passthrough"`) so consumers can
  exhaustive-switch on `availability().backend`.
