purpose: |
  Closed-port DI surface `OsSandbox { spawn, availability }` and its
  production default `defaultOsSandbox(cfg)`. Picks the right backend
  for the current OS: macOS → Seatbelt (`sandbox-exec`), Linux →
  Landlock (phase-1 typed-degrade), Windows → passthrough. The two
  profiles `"off"` and `"danger-full-access"` short-circuit verbatim
  (no degradeReason — they explicitly asked for no sandbox); every
  other profile that fails to wire surfaces `sandboxApplied: false`
  with a typed `degradeReason` (e.g. `"sandbox-exec-missing"`,
  `"landlock-not-implemented"`, `"unsupported-platform"`). NO-THROW
  contract — spawn failures land as `exitCode: 127` with descriptive
  stderr, never as a thrown exception, so callers can program against
  the result shape. The `availability()` probe is the seam UIs use to
  warn the user before enforcing a profile (e.g. surface a banner if
  `sandbox-exec` is missing). Pairs with `seatbelt-profile-compiler`
  and `landlock-degraded-passthrough` as the third leg — they compile
  policy text; this port decides *which* compiler runs and what to do
  when it can't.
