purpose: |
  Persistence for the external-agent import log, mirroring Codex's
  `external_agent_session_imports.json`. Default path is
  `<homeDir>/.quanta/external_agent_session_imports.json`; the
  caller-supplied `homeDir` lets tests redirect to a tmpdir. Writes use a
  sidecar lock file (`<importLogPath>.lock`) so concurrent imports
  cannot race; collision raises `ImportLogBusyError` carrying the lock
  path rather than silently merging or last-writer-winning. Missing log
  file on read yields an empty `version: 1` log so first-run is
  representable without a separate init step. Writes go through the same
  atomic-rename discipline as the session store: write to a tmp, then
  rename into place, so a crash mid-write never leaves a torn JSON.
