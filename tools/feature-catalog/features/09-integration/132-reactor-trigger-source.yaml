notes: |
  Build/test watchers (`build_completion` / `diff_ready` / `test_pass`) are
  declared in the `TriggerReason` union but not implemented in this batch —
  the union shape ratchets the audit-suffix contract while leaving room for
  V2 sources. PR-comment watermark store is in-memory by default; production
  cron driver should bind a file-backed impl for at-most-once semantics
  across restarts.
