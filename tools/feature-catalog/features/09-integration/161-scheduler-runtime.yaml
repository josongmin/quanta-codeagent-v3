notes: |
  Default-OFF: importing `@/scheduler` does NOT instantiate or start a
  runtime. `apps/agent` bootstrap is responsible for constructing the
  runtime with real adapters and calling `start()`. Per ADR roadmap,
  this slice is the closed-port primitive; bootstrap wire is sibling PR.
