id: scheduler-runtime
title: ADR-0161 SchedulerRuntime (tickOnce + reactor seam reuse)
section: 9
subsystem: Scheduler / scheduled agent (ADR-0161)
order: 161
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: partial
modes: [n-a]
configurable: integrated
config_refs:
  env: [QUANTA_SCHEDULER]
owners: ["@songmin"]
labels: ["surface:cli", "surface:ipc"]
purpose: |
  `createSchedulerRuntime({store, availability, clock, env, agentLoop,
  workspace, sink?, tickIntervalMs?})` composes all the scheduler ports
  into one closed seam. Two surfaces:
    - `tickOnce()` — the testable atomic. Loads all automations, for each
      active+due: chooses model → enqueues prompt → persists fired result →
      emits sink event. NO-THROW: a single automation's failure is captured
      into its `status: "error"` + sink event, the other automations still
      process.
    - `start()` / `stop()` — periodic ticking. Default-OFF — `start()` is a
      NO-OP unless `env[QUANTA_SCHEDULER] === "1"`. Idempotent. Default
      cadence `DEFAULT_TICK_INTERVAL_MS = 60_000` (Codex ONE_MINUTE refetch
      parity). `setInterval` / `clearInterval` are DI-able so unit tests
      avoid wall-clock.

  Reactor seam reuse: the runtime calls `agentLoop.enqueueUserMessage(prompt)`
  — the SAME port the reactor's `manual_resume` trigger uses (ADR-0132).
  No new `TriggerReason` enum, no new event arm. The composition root binds
  reactor + scheduler to the same downstream queue, and the agent loop
  cannot tell whether the prompt came from a CI completion, a PR comment,
  a `/babysit` command, or a scheduled automation — they are all
  user-message-shaped.

  At-least-once on save-fail: if `store.save` throws after the agent loop
  already received the prompt, the runtime emits a `scheduler.skipped /
  store-save-failed` event and the next tick will re-fire (the persisted
  anchor is the previous `lastFiredAt`). Documented limitation; future
  exactly-once would require two-phase commit.
evidence:
