id: shadow-verify
title: ADR-0396 Shadow Verify — apply-before-show in a scratch overlay (Wave 1 port + runner)
section: 9
subsystem: Pre-apply verification (shadow overlay)
order: 396
maturity: L2
status: new
ui_surfaces: [none]
monitoring: n-a
