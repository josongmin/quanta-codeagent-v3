    contract: []
knobs:
  - name: QUANTA_OTEL_ENDPOINT
    default: 'undefined'
    purpose: 'infra: operator OTLP collector URL — presence makes the span sink live (getSpanSink() !== null), which is what "trace context expected" gates on. Absent ⇒ off ⇒ byte-identical / zero-alloc.'
  - name: QUANTA_RUN_ID
    default: 'undefined'
    purpose: 'infra: one run-id authority (≡ QUANTA_OTEL_RUN_ID) rides the OTLP resource as quanta.run.id and threads onto the per-attempt root.'
deliberate_hold: null
notes: |
  Runtime modes off | context | export — only `off` is byte-identical / zero-alloc
  (`context` allocates ids + async context, NOT "zero cost"). GenAI semconv snapshot
  is PINNED (Development, not Stable) per ADR-0539 §6 — the plan's commit SHA is the
  normative contract. Negative invariants: (a) the cassette stays UNREDACTED and its
  match key is request-hash, so the metadata TraceRef/degraded marker can NEVER
  invalidate a cross-box replay hit (replay-hash invariant proven in
  recording-trace-ref.test.ts); (b) @/stream + @/llm/replay never import
  @/observability — the active ref + traceContextExpected arrive via DI; (c) the
  `t<turn>` synthetic id is the CORRECT OFF-mode identity (OFF consumers join on it;
  deleting breaks the byte-identical OFF contract) — C7 RECLASSIFIED as won't-delete-
  by-design, NOT deferred; no separate "SpanSink compat adapter" exists (audit found
  none). In unified mode a real ref supersedes it and rule-5 flags its use. LATENT rule-5 trigger
  (audited clean): the "expected" gate is raw sink-liveness, correct today because
  every recorded bench emit descends from withBenchInstanceRoot / runAgent's
  withActiveSpanScope; a future bench-/run-LEVEL emit OUTSIDE that scope while the
  endpoint is set would strict-throw (harden by gating on a scope-entered flag).
