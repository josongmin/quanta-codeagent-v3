id: otel-genai-unified-tracing
title: OTel-GenAI unified tracing — one {traceId,spanId} across OTLP ≡ OBSERVE ≡ cassette + rule-5 enforcement
section: 8
subsystem: 옵저버빌리티 — 크로스-레이어 trace 상관관계(TraceRef) + gen_ai semconv + missing-context 강제
order: 628
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: integrated
telemetry_keys:
  - gen_ai.operation.name
  - gen_ai.provider.name
  - gen_ai.response.finish_reasons
  - gen_ai.request.model
  - gen_ai.response.model
  - quanta.instance.id
  - quanta.instance.attempt
  - quanta.run.id
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env:
    - QUANTA_OTEL_ENDPOINT
    - QUANTA_OTEL_RUN_ID
    - QUANTA_RUN_ID
owners: ["@songmin"]
labels: ["surface:core", "observability-primitive", "absorbed:none"]
depends_on: [otel-span-tree, otel-attribute-vocab, bench-live-trace-run-link, jsonl-span-correlation]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-07-13"
  evidence:
    cli: "runs in the interactive CLI + bench — withActiveSpanScope wraps every recorded unit from src/apps/cli/index.ts + apps/bench run graph; the exporter's issued TraceRef is the active-context id, so a CLI/agent session's OTLP spans join the trajectory on {traceId,spanId}"
    web: "cross-layer correlation primitive (AsyncLocalStorage TraceRef + exporter id-unification); no browser-side span render or user-visible affordance on the web daemon"
purpose: |
  Unifies the FOUR previously-disjoint trace layers (OTLP spans / OBSERVE stream /
  replay cassette / debug-sink) onto ONE correlation identity so they are joinable
  and no consequential action is traced nowhere (ADR-0539). Before: OTEL spans were
  un-joinable to the trajectory (distinct id schemes); the run verdict was buried.
  After: OTLP ≡ OBSERVE ≡ cassette share one {traceId, spanId} per instance-ATTEMPT.
  Components:
  (1) IDENTITY SSOT — `active-context.ts` (AsyncLocalStorage<TraceRef>,
  `getActiveTraceRef`/`runWithActiveTraceRef`) is the async-local correlation
  authority; `hex-id.ts` is the ONE consolidated W3C hex-id mint (default CSPRNG,
  test-seam gen override) that replaced four duplicate helpers.
  (2) EXPORTER id-unification (C7) — `otel-span-export.ts` `SpanSink.onStart`
  RETURNS a TraceRef and `withActiveSpanScope` installs `span.ref` verbatim, so the
  exporter's issued id IS the active-context id. Parentage derives purely from the
  enclosing async-local ref; the exporter's LIFO stack is the direct-path fallback
  only, and scoped spans are EVICTED from it (`onScoped`) the instant they become
  scoped so concurrent scoped sessions never adopt each other's frame. chat span is
  kind=CLIENT.
  (3) gen_ai SEMCONV — the loop span sites (`session-resources.ts`
  `withActiveSpanScope`) carry gen_ai operation.name (invoke_agent/chat/execute_tool),
  provider.name, and a finish_reasons ARRAY (OTLP arrayValue).
  (4) ONE TRACE PER ATTEMPT — `run-main-helpers.ts` `withBenchInstanceRoot` exports a
  per-attempt `quanta.bench.instance` root span stamping quanta.instance.{id,attempt};
  best-of-N/retry attempts get distinct trace ids sharing {runId, instanceId}.
  (5) RULE-5 ENFORCEMENT — a missing active context WHILE a trace context is EXPECTED
  (a live span sink) is a correlation DEFECT: the OBSERVE recorder
  (`jsonl-recorder.ts` checkMissingTraceContext) emits ONE `observability_degraded`
  record (reason:"missing_trace_context") per instance and fails the strict rail; the
  cassette recorder (`recording-llm.ts`) warns once + stamps a replay-neutral
  metadata marker. The defect-vs-legitimate distinction is threaded via a
  `traceContextExpected` DI callback (`() => getSpanSink() !== null`) so @/stream and
  @/llm/replay never import @/observability. The deterministic `t<turn>` fallback
  VALUE is retained (existing consumers depend on it) — enforcement only ADDS the
  degraded signal. `TrajectoryEvent.traceId?` carries the id across the OBSERVE layer.
