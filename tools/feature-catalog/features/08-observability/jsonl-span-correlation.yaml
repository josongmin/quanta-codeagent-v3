owners: ["@songmin"]
labels: ["surface:core", "observability-primitive", "absorbed:codex"]
depends_on: [otel-span-tree]
configurable: static
purpose: |
  Deterministic span-id derivation inside the JsonlRecorder so the
  recorded trajectory is golden-testable with no randomness. The scheme:
  (1) `turn_start` opens a new turn span `t<turn>` (or `t#<seq>` fallback
  when the AgentEvent carries no turn number); every later event in that
  turn inherits `parentSpanId = turnSpanId`. (2) `tool_call` /
  `tool_progress` / `tool_result` sharing one tool-use `id` all get
  `spanId = "tool:" + id` with `parentSpanId = turnSpanId`. (3)
  `llm_request` AND the matched `usage` event for that turn BOTH get
  `spanId = "llm:" + turnSpanId` so the `llm_request ↔ llm_usage` span
  pair (RFC-0002 §5.2 / §9 / §11) is exact and replayable
  (`request.spanId === usage.spanId`). (4) `turn_start` itself is the
  span root: `spanId = turnSpanId`, no parent. Strict / non-strict modes
  decide whether a write failure rethrows or is swallowed (degraded
  surface); `maxLines` enforces a hard line cap with a final `line_cap`
  degraded marker.
