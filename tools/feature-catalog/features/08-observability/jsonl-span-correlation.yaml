notes: |
  Determinism is a hard requirement — the recorder is the source of
  truth for replay-compared payloads, so a `Math.random()` span-id would
  silently break the byte-identical replay invariant. Pairs with
  `jsonl-recorder` (the surface) and `otel-span-tree` (the conceptual
  10-step Codex span hierarchy this scheme mirrors).
