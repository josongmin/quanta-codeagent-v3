id: jsonl-span-correlation
title: JsonlRecorder span correlation — deterministic turn / tool / llm span ids
section: 8
subsystem: stream/adapters/jsonl-recorder — span-id derivation
order: 98
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: integrated
modes: [n-a]
