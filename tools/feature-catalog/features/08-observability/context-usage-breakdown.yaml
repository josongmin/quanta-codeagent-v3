id: context-usage-breakdown
title: Segmented context-window usage breakdown + wired /context
section: 8
subsystem: 텔레메트리 — 카테고리별 토큰 분해 + 세그먼트 바 (Cursor Canvas UsageBar 흡수)
order: 55
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: integrated
telemetry_keys: [gen_ai.usage]
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "observability-primitive"]
depends_on: [context-usage-metrics, sectioned-system-prompt]
purpose: |
  Extends context-usage-metrics (single total + one-color bar) with the per-category
  breakdown Cursor's Canvas UsageBar shows. (1) DATA: usage-breakdown.ts computes a
  ContextUsageBreakdown {segments:{id,tokens,color?}[], total, max} at prompt-assembly
  time by mapping each PromptSection to a category via SECTION_CONTEXT_CATEGORY (the SSOT:
  base→System, project_md→Rules, session_ctx+user_append→Conversation) and counting each
  category's text with the loop's OWN estimateTokens (compaction.ts — Math.ceil(chars/4)),
  injected as a closed TokenEstimator port. No second heuristic introduced (project rule).
  All present categories are MEASURED (each is one Message through estimateTokens; total =
  sum of segments, no apportionment). (2) RENDER: formatSegmentedUsage(breakdown) draws
  proportional colored segments + "% Full" / "k / k" labels, additive to status-line.ts;
  the single-bar formatContextUsage is UNCHANGED + remains the default status line.
  (3) /context slash command (was a Phase-1 placeholder) now renders the breakdown from
  the latest assembled prompt via a new ctx.contextUsage seam on SlashContext.
evidence:
  code:
    - src/agent/context/usage-breakdown.ts
    - src/agent/prompt-sections.ts
    - src/agent/loop.ts
    - src/agent/types.ts
    - src/apps/cli/status-line.ts
    - src/apps/cli/slash-contract.ts
    - src/apps/cli/repl/context-usage-snapshot.ts
    - src/apps/cli/repl/slash-surface.ts
    - src/apps/cli/repl/surface-compose.ts
  adrs: []
  tests:
    unit:
      - tests/unit/agent/context-usage-breakdown-hellgate.test.ts
      - tests/unit/cli/segmented-usage-hellgate.test.ts
      - tests/unit/agent/prompt-assembled-capture-hellgate.test.ts
      - tests/unit/agent/context-snapshot-converter-hellgate.test.ts
      - tests/unit/cli/context-usage-snapshot-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: TokenEstimator (injected)
    default: 'estimateTokens (compaction.ts, chars/4)'
    purpose: 'reuse the loop''s sole estimator — no new heuristic'
  - name: AgentConfig.onPromptAssembled
    default: 'undefined'
    purpose: 'WIRED: absent ⇒ loop byte-identical (early-return, no capture); REPL opts in via this hook'
  - name: SlashContext.contextUsage
    default: 'undefined'
    purpose: 'REPL holder populates the snapshot each turn; absent ⇒ /context graceful fallback'
deliberate_hold:
  reason: |
    2026-06-02: the runtime→REPL wire is built — loop.ts fires onPromptAssembled (default-OFF
    early-return when absent), a REPL holder (context-usage-snapshot.ts) retains the snapshot,
    and buildReplSlashCtx populates contextUsage. ONE plumbing step remains: the REPL surface
    does not own AgentConfig (built deep in bootstrapSession → host.createSessionHost →
    runner/assemble/config.ts, a closed shape), so composeSurfaceWires EXPOSES
    promptAssembledSink ready to attach to config.onPromptAssembled but the final attach is
    out of the slice's edit boundary. Until that one-line attach lands, holder.view() is
    undefined ⇒ /context shows the graceful fallback. Also: `max` is passed as 0 (no
    model→context-window table exists anywhere), so segments render token counts without a
    percent denominator (honest degrade, never NaN). Tools/Skills/MCP/Subagents categories
    stay OMITTED (not threaded as PromptSections).
  promotion_path: |
    One-line attach of promptAssembledSink → config.onPromptAssembled in the bootstrap/runtime
    config layer; add a model→context-window-size source for the percent denominator; feed
    ExtraContextSource to light up the omitted categories.
notes: |
  Single-bar status line is regression-anchored as byte-identical. The chars/4 underlying
  number is itself an estimate but it's the codebase's canonical one, reused not invented.
