id: git-directive-emit-protocol
title: "Git `::git-*` 5-directive emit protocol — phase-guarded behavioral layer + turn-collector wire"
section: 8
subsystem: Out-of-band UI sync channel after successful mutating git operations
order: 221
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:cli", "observability-primitive", "default-off"]
depends_on: []
purpose: |
  Codex-style `::git-*` 5-directive emit protocol with a HARD phase guard:
  directives (create-branch / stage / commit / push / create-pr) may be
  emitted ONLY in the `final-answer` phase, after a confirmed-successful
  mutating git operation. `commentary` and `intermediate` phase emits are
  rejected with a typed `wrong-phase` error before any sink write. Sibling
  to ADR-0220 (`src/agent/git-directives/` — wire/serdes layer) — this
  slice adds the BEHAVIORAL protocol layer (phase invariant + no-throw
  Result surface). Default-OFF: `noopEmitter` is sink-free; `defaultEmitter`
  is opt-in.

  ADR-0232 / in-code ADR-0234 (turn-collector wire) closes the wire gap:
  the mutating git tools (`git_commit`, `git_branch_switch`) execute in the
  LLM's intermediate phase, where the phase guard rejects emits. A per-turn
  `GitDirectiveCollector` (sibling file in the same slice) is the couple-
  breaker: tools `record(directive)` during intermediate-phase execution;
  the loop calls `flush()` at the turn boundary, draining each entry
  through the wired emitter with `phase: "final-answer"` — the natural
  moment that satisfies the ADR-0221 phase invariant. Wired via
  `AgentConfig.gitDirectiveEmit` (default-OFF, RFC §1.2). 18 new hellgate
  cases pin the collector contract (FIFO / phase invariant / re-entrant
  safety / eager-emit knob / 2-turn independence / etc.).
