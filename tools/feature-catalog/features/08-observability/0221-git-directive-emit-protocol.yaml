    integration: []
    contract: []
knobs:
  - name: gitDirectiveEmit.enabled
    type: boolean
    default: false
    purpose: "Opt-in master switch — when true, the loop builds a per-turn collector and calls flush() at turn end."
  - name: gitDirectiveEmit.sink
    type: '"stdout" | "stderr" | (line: string) => void'
    default: '"stdout"'
    purpose: "Where the emitter writes the wire line. The function form lets tests + Tauri hosts intercept without process I/O."
  - name: gitDirectiveEmit.includeIntermediate
    type: boolean
    default: false
    purpose: "When true, the collector emits at record time AS WELL AS at flush time (live-progress surfaces). Default false — strict final-answer-only discipline."
  - name: gitDirectiveEmit.emitter
    type: DirectiveEmitterPort
    default: "<built from sink>"
    purpose: "Test-injection / custom-port override (mirrors dedupGate / gitObservability.session pattern)."
  - name: gitDirectiveEmit.collector
    type: GitDirectiveCollector
    default: "<built from emitter>"
    purpose: "Test-injection override — when set, the loop uses this collector verbatim instead of constructing one."
notes: |
  Distinct from ADR-0220 (`src/agent/git-directives/`) in directive shape
  AND in concern: 0220 models the UI-tail consumer (`stage.paths`, `push.{remote,branch}`);
  this slice models the call-site intent (`stage.files`, `push.{ref,force}`).
  Both wire formats serialize with canonical alpha-sorted JSON so a host
  that wants either shape gets deterministic bytes. Slice isolation:
  `src/git/directive-emit/` imports only `@/shared` (`Result`, `ok`, `err`);
  does NOT touch `@/tool`, `@/llm`, `@/mcp`, `@/permission`, `@/agent`. The
  caller-side wire lives in `src/tool/git/` (shared
  `publishGitDirective` helper at `_directive-publish.ts`) and the loop
  (`buildGitDirectiveEmit` in `loop-helpers.ts`). 37 hellgate cases (18 ADR-
  0221 + 18 ADR-0232 + 1 OFF parity) pin the contract end-to-end.

  ADR-number-collision note: in code references the wire is named
  ADR-0234 because 0232/0233 were taken in `src/agent/types.ts` by parallel
  in-flight tracks (shell-snapshot wire, composition-root mega-wire). The
  ADR DOC sits at 0232 (the closest free doc slot at write time). See the
  ADR file header for the full reconciliation.
