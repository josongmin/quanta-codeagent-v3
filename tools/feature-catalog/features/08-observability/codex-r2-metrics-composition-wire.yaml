id: codex-r2-metrics-composition-wire
title: Composition-root metrics wire + activation telemetry (ADR-0358 / 0360)
section: 8
subsystem: production wire-up for ADR-0352 decorators + per-turn activation latency
order: 102
maturity: L3
status: stable
ui_surfaces: [n-a]
monitoring: integrated
modes: [n-a]
configurable: n-a
owners: ["@songmin"]
labels: ["surface:core", "absorbed:codex", "production-wired"]
depends_on:
  - codex-r2-observability-decorators
  - codex-r2-composition-install-and-registry
