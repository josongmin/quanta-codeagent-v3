purpose: |
  Single source of truth for the append-only JSONL trajectory (RFC-0002 §5.2).
  Declares `TRAJECTORY_SCHEMA = "quanta.trajectory.v1"`, the 17-element
  `TrajectoryKind` closed union (session_start / session_end / turn_start /
  llm_request / llm_usage / assistant_text / tool_call / tool_progress /
  tool_result / recovery / patch_generated / patch_applied / patch_rejected /
  sandbox / verify / error / observability_degraded), the `TrajectoryEvent`
  envelope (schema/v/seq/ts/monotonicNs/ctx/spanId/parentSpanId/producer/
  pricingVersion/redaction/kind/data), the `Producer` provenance shape, and
  the `Redaction` { policy, applied } stamp. Lives in `@/shared` so `@/stream`
  may import it without crossing slice boundaries (RFC §6: `@/stream →
  @/observability` is forbidden).

  Invariants:
    - `seq` is process-monotonic so ordering survives wall-clock skew;
      `ts` is display-only.
    - The `REDACTION_POLICY` id (`"secrets.v1"`) is a stable symbolic label
      — widening the secret-scrub regex sets does NOT churn it (consumers
      do not dispatch on its value, only assert "non-empty").
    - Adding a kind requires extending BOTH the type union AND the runtime
      `TRAJECTORY_KINDS` set so guards can branch exhaustively.
