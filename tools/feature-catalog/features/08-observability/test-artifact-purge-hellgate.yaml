id: test-artifact-purge-hellgate
title: Test Artifact Purge Hellgate
section: 8
subsystem: 테스트 위생/CI 게이트
order: 200
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
config_refs:
  env: []
owners: ['@songmin']
labels: [surface:core, test-hygiene, hellgate]
depends_on: []
purpose: |
  Prevent stale `.test.js` TypeScript-emit artifacts from polluting `tests/`.
  Symptom: a legacy build step or worktree pollution leaves `.test.js` next to
  `.test.ts` sources; `bun test tests/unit tests/integration` picks up both
  files (bun has no built-in `testPathIgnorePatterns`) and every assertion
  runs twice — silently doubling wall-clock and masking ordering bugs.
  Reproduced 2026-05-25 with 520 orphan `.test.js` / 505 sibling pairs.

  Two-layer enforcement:
  1. **Pretest purge** — every `package.json` test script is prefixed with
     `bun run test:clean-js` (`find tests -name '*.test.js' -delete`) so a
     fresh `.js` emit never reaches the runner.
  2. **Meta-hellgate** — `tests/meta/no-test-js-artifacts-hellgate.test.ts`
     walks the tree and asserts zero `.test.js` survive, failing CI if the
     pretest hook is bypassed or disabled.

  `bunfig.toml` carries a comment pointing at the hellgate for future readers.
evidence:
  code:
    - bunfig.toml
    - package.json
  adrs: []
  tests:
    unit: [tests/meta/no-test-js-artifacts-hellgate.test.ts]
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  bun does not (as of 1.1.x) expose a Jest-style `testPathIgnorePatterns` knob,
  so source-of-truth enforcement is the meta-hellgate + the script-level purge.
  If bun adds a native ignore pattern later, fold it into `[test]` in
  `bunfig.toml` and keep the hellgate as defense-in-depth.
