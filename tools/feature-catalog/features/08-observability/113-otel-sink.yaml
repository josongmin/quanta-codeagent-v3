purpose: |
  Closed-port `MetricSink` adapter wrapping `@opentelemetry/api` MeterProvider.
  Maps our 3-arm MetricKind (counter/histogram/gauge) to OTel instruments
  (Counter/Histogram/UpDownCounter) with lazy per-(name, kind) caching. Gauge
  emulation = UpDownCounter + per-(name, labelsKey) prev-value delta
  (ObservableGauge rejected — would couple sink→registry). Structural typing
  for OtelMeterProvider keeps the slice plane-clean (no runtime `@opentelemetry/api`
  dep until caller wires).
