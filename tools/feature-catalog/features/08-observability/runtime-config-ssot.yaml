    integration: []
    contract: []
knobs:
  - QUANTA_LOG_LEVEL
  - QUANTA_SESSIONS_DIR
  - QUANTA_FS_JAIL
deliberate_hold: null
notes: |
  Parsers reject non-integer / non-positive / sign / hex / extra-whitespace
  for numeric envs — the parse helper warns once with the offending raw
  value. Frozen snapshot is the invariant that lets every consumer treat
  the config as a true constant for the lifetime of the process.
