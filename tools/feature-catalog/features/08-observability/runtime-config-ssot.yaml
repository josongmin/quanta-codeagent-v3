id: runtime-config-ssot
title: Frozen runtime-config SSOT — the only place that touches process.env
section: 8
subsystem: 환경 변수 — single owner + validate-once snapshot
order: 85
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
config_refs:
