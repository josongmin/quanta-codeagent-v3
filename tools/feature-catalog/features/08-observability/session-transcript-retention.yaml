id: session-transcript-retention
title: Session transcript retention sweep
section: 8
subsystem: 이벤트/Trajectory (RFC-0002)
order: 3
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: integrated
config_refs:
  env: [QUANTA_SESSION_TRANSCRIPT_MAX_BYTES]
  cli: ["/session-registry cleanup --transcripts"]
owners: ['@songmin']
labels: [surface:session, observability-primitive]
depends_on: [jsonlrecorder, runtime-config-ssot]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "Real CLI affordance via /session-registry cleanup --transcripts (src/apps/cli/session-registry-cmd.ts)."
    web: "CLI-only slash command; no web-daemon handler and no SessionCommand verb (B2/B3). SlashPalette server-routed entries are prefill stubs that do not execute."
purpose: |
  Wires the existing `applyRetention` cumulative-bytes sliding window
  (`src/stream/adapters/jsonl-retention.ts`) over the per-session `<id>.jsonl`
  transcript envelopes that grow unbounded under `sessionsRoot()` (written by
  `@/session` `store.ts` `appendEnvelope`). The host/CLI-layer seam
  `sweepSessionTranscripts` (`src/apps/cli/session-transcript-retention.ts`)
  lists the envelopes and applies the window to each — fence-clean: `@/session`
  may not import `@/stream` and vice-versa, so the composition root (CLI) is the
  only place that may reach BOTH slices. Policy is knob-driven via
  `QUANTA_SESSION_TRANSCRIPT_MAX_BYTES` (no magic constant). Default ABSENT ⇒
  retention OFF / unbounded (today's behavior); even when ON it NEVER deletes a
  whole session — it keeps the NEWEST rows and trims only the OLDEST once a
  single transcript alone crosses the cap, so recent/active sessions are
  inherently preserved. Wired into `/session-registry cleanup --transcripts`
  (+ `--dry-run` preview) which reports scanned/trimmed envelope counts, rows
  dropped, and bytes freed. NO-THROW: a malformed or busy (`.tmp`-locked)
  envelope is captured in `errors[]` and the sweep continues over siblings.
evidence:
  code:
    - src/apps/cli/session-transcript-retention.ts
    - src/apps/cli/session-registry-cmd.ts
    - src/stream/adapters/jsonl-retention.ts
    - src/session/store.ts
  adrs: [34, 35, 379]
  tests:
    unit:
      - tests/unit/session-transcript-retention-hellgate.test.ts
      - tests/unit/session-transcript-retention-e2e-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_SESSION_TRANSCRIPT_MAX_BYTES
    where: src/shared/runtime-config.ts
    default: 'undefined'
    purpose: |
      Per-session transcript cumulative utf-8 byte cap. Unset ⇒ retention OFF
      (unbounded). When set, the oldest rows of an over-cap `<id>.jsonl` are
      trimmed; the newest rows are always kept.
deliberate_hold: null
notes: |
  Default-OFF for safety — the sweep is a no-op until an operator opts in, and
  the mechanism trims rows within a transcript rather than deleting sessions.
  Opt-in at the CLI (`--transcripts`) so the existing resource-registry
  `cleanup` (a DIFFERENT rail — session handles, not the .jsonl transcript) is
  byte-identical unless the operator asks for the transcript sweep.
