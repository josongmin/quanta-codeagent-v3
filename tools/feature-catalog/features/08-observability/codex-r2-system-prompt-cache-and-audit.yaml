surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "System-prompt cache + drift detector wired in buildTurnContext on CLI path."
    web: "Pure internal cache + cache-control audit/drift primitive, no UI affordance on any surface."
purpose: |
  Two complementary pieces. ADR-0322 (passive audit Case C verdict):
  `analyzePrefixStability(batches)` over `CachePrefixSnapshot[]` records
  sha256 + cache_control marker per position; detects drift across turns.
  Verified the existing Anthropic prefix is byte-stable by construction
  (`buildSystemPrompt` is sync + side-effect-free + per-turn dynamic data
  rides the trailing `<system-reminder>` user message, NOT the cached
  `SystemBlock[]`). ADR-0326 (active cache + strict drift): closed port
  `SystemPromptCachePort{getOrBuild, peek, invalidate, clearAll, stats}` +
  `createInMemorySystemPromptCache(cfg?)` + `makeStrictDriftCache(inner)`
  wrap that fires `DriftDetectedError` on hit-with-different-factory-hash.
  buildTurnContext wires both when `systemPromptCache` + `cacheKey` slots
  are filled (bypassed when caller supplies `system` directly).
evidence:
  code:
    - src/llm/cache-control-audit/types.ts
    - src/llm/cache-control-audit/analyzer.ts
    - src/llm/cache-control-audit/hash.ts
    - src/llm/system-prompt-cache/types.ts
    - src/llm/system-prompt-cache/port.ts
    - src/llm/system-prompt-cache/in-memory-cache.ts
    - src/llm/system-prompt-cache/drift-detector.ts
  adrs:
