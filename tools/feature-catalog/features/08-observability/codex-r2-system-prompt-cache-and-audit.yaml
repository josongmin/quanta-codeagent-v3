    integration: []
    contract: []
knobs:
  - name: AgentConfig.systemPromptCache + systemPromptCacheKey
    type: 'SystemPromptCachePort + branded SystemPromptCacheKey'
    default: 'undefined (per-turn rebuild)'
    notes: 'Both required — either-or absent ⇒ cache disengaged.'
deliberate_hold: null
notes: 'Drift detector is the active-counterpart to ADR-0322 passive audit. Bench replay harness is the natural wrap site (replay determinism doubles as drift assertion).'
