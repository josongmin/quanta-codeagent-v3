id: codex-r2-system-prompt-cache-and-audit
title: System-prompt cache + drift detector + cache-control audit (ADR-0322 / 0326)
section: 8
subsystem: per-session system-prompt memoization + Anthropic cache-prefix stability audit
order: 100
maturity: L3
status: stable
ui_surfaces: [n-a]
monitoring: partial
modes: [n-a]
configurable: n-a
owners: ["@songmin"]
labels: ["surface:core", "absorbed:codex", "default-off"]
