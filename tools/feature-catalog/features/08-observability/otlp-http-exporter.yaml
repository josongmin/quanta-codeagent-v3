surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-16"
  evidence:
    cli: "LIVE (jun-16): src/apps/cli/index.ts main() calls wireOtelSpanExport() → installOtelSpanExportFromEnv(process.env) at boot. When QUANTA_OTEL_ENDPOINT is set it registers an exporter-backed SpanSink (createExporterSpanSink, src/observability/otel-span-export.ts) so the loop's startSpan/endSpan ship to the OTLP collector; Default-OFF no-op otherwise. Closes the prior built-not-wired gap — setSpanSink had ZERO prod callers, so the knob was inert."
    web: "pure internal OTLP/JSON exporter library posting spans/metrics to an external collector; no UI affordance on any surface"
purpose: |
  in-tree OTel scaffold (`metrics/otel-sink.ts`, `tracing/otel-tracer.ts`,
  `tracing/w3c-propagator.ts`)는 in-process surface (counter / histogram /
  span / W3C propagation)는 다 깔았지만 **모든 sample이 in-memory에 머묾**
  — real collector로 가는 wiring 없었음. `otlp-helper.ts` / prometheus
  factory들은 upstream OTel SDK (`@opentelemetry/sdk-metrics` + exporter
  packages)가 call site에 설치돼 있다고 가정하지만 이 tree에는 안 깔려
  있음. env-memo로 install이 막혔으므로 "realtime export 토글"이 (a)
  default-OFF byte-identical, (b) **zero new npm install**, (c) 표준 OTLP
  wire format이어야 함.

  Hand-rolled **OTLP/JSON over HTTP** exporter를 `src/observability/otel-exporter.ts`
  closed-port primitive로 ship. Exporter는: (1) `ExportSpan` + `ExportMetric`
  typed record buffer, (2) `POST ${endpoint}/v1/traces` + `POST ${endpoint}/v1/metrics`
  로 `Content-Type: application/json` flush, (3) batch-size reach OR time
  interval trigger flush, (4) `teardown()`이 interval clear + pending drain,
  (5) `attachOtelExporterFromEnv` composition helper가 `QUANTA_OTEL_ENDPOINT`
  읽고 unset이면 undefined return (byte-identical Default-OFF).

  Wire serializer는 OTLP/proto JSON 최소 shape 구현: `resourceSpans` /
  `resourceMetrics` envelope, `scopeSpans[]` / `scopeMetrics[]`,
  `traceId` / `spanId` / `parentSpanId` (16/8-byte hex),
  `startTimeUnixNano` / `endTimeUnixNano` (spec 따라 nanos as string),
  `attributes`는 OTLP tagged-union KeyValue list.

  두 bridge fn으로 기존 MetricsRegistry / Tracer가 restructure 없이 plug:
  `exporterMetricSink(exporter)` → MetricSink (모든 observation을 exporter
  metric buffer로 forward), `buildExportingTracer(exporter, opts)` → Tracer
  (W3C ID 할당 + `end()`에서 finished span을 exporter span buffer로). 메모리
  tree 없음 — collector가 parentSpanId로 parent/child 복원.

  Default endpoint 절대 없음 — exporter는 `endpoint` 명시 강제. env helper도
  unset/blank이면 undefined return (default localhost endpoint는 observation
  silent leak).
