notes: |
  No-throw posture: 모든 public method가 network / serialization error를
  swallow하고 optional `warn` sink로 log. failure 시 buffer NOT drained →
  next flush가 retry.

  Plane-clean imports: `./tracing/port` (Span types) + `./tracing/noop-tracer`
  (fallback) + `./metrics/port` (`MetricSink` type)만. Zero `@/agent` /
  `@/tool` / `@/llm` reach.

  Caller-injected `fetch` + `setInterval` + `now` — test seam (hellgate가
  fake fetch + manual-tick scheduler + injected clock으로 구동).

  17 hellgate cases: 1-span flush / batch-size flush / interval flush /
  teardown / failure-retain-buffer / large-N batching / metric POST /
  service.name presence / empty-buffer no-op / clock injection / W3C ID
  shape / parent-spanId omission+presence / attribute type round-trip /
  1KB attribute pass-through / env-unset returns undefined / env-set wires
  triple / sink adapter forwarding.

  Non-goals: OTLP/protobuf serialization (collector는 universally JSON at
  `/v1/{traces,metrics}` accept), `@opentelemetry/*` runtime auto-install,
  OTel Context API 재구현 (in-process tracer가 이미 함), composition root
  auto-attach (opt-in wire는 follow-up — slice는 leaf-only 유지).
