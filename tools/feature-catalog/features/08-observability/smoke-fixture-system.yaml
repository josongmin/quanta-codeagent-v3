knobs: []
deliberate_hold: null
notes: |
  Depth-tier별 격리: single(1턴) → medium(2-3턴) → tikitaka(4-6턴
  conversation-context recall). trajectory.jsonl 부재 시 SKIPPED (pending
  recording) — 미녹화 시나리오가 CI를 망가뜨리지 않는 invariant.
  `localize/`는 다국어 prompt 처리. recordings 기반 결정성이라 매 PR이
  loop / tool / harness 회귀를 잡는다 (모델 능력 drift는 잡지 않음).
