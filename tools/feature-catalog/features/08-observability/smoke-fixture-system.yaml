id: smoke-fixture-system
title: smoke fixture system — single/medium/tikitaka 15-scenario battery + LLM replay
section: 8
subsystem: 회귀 스모크 (recorded tier-0 + opt-in tier-1 live + LLM-judge)
order: 55
maturity: L5
status: stable
ui_surfaces: [n-a]
monitoring: partial
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "observability-primitive"]
config_refs:
  env: ["QUANTA_LLM_PROVIDER", "QUANTA_MODEL", "QUANTA_SMOKE_LIVE", "QUANTA_SMOKE_MODEL"]
purpose: |
  실제 agent loop + 실제 도구를 돌리되 LLM은 녹화된 trajectory를 replay
  (tier-0, deterministic, $0)하거나 옵트인 live(tier-1) 호출하는 end-to-end
  fixture battery. 15 시나리오 (single 4 / medium 4 / tikitaka 7)로 흔한
  coding-agent 모양을 커버. `fixtures/<depth>/<NN-name>/`에 seed/ +
  prompts.jsonl + trajectory.jsonl + expect.json(+ config.json + tags.json).
  expect.json은 SOTA blend(Inspect AI / promptfoo / Braintrust)
  declarative assertion (stopReason / turns.count / tool calls / fs diff /
  judge LLM rubric). `bun run smoke`는 CI 디폴트 tier-0 replay,
  `bun run smoke:record <id>`로 live 녹화 + expect diff 제안,
  `bun run smoke:live`/`smoke:report`로 라이브 실행과 커버리지 리포트.
  battery는 `tests/unit/smoke-battery.test.ts`로 `bun test`에도 편입.
