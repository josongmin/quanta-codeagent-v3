id: metrics-registry
title: In-process Metrics registry — counters + gauges + timers (nearest-rank p50/p95)
section: 8
subsystem: 텔레메트리 — process-local counter/timer SSOT
order: 83
maturity: L4
status: stable
owners: ["@songmin"]
labels: ["surface:core", "observability-primitive"]
purpose: |
  Dependency-free in-process metrics registry that backs every downstream
  observability surface — the AgentRecorder, the shell-exec OTel observer,
  the cost dashboard, and work-metrics all read its snapshot. Three primitive
  shapes: Counter (monotonic inc), Gauge (set), Timer (sample list →
  `TimerStats` summary). Timer summarization uses a nearest-rank percentile
  on the sorted ascending sample (rank = ceil(p/100 * n), 1-indexed, clamped
  to [1, n]); empty sample yields zeros across the stats. No external dep,
  no exporter — the registry is the in-memory model; emitters (JSONL,
  dashboard, OTel sink) are separate concerns that READ the snapshot.
