id: observability-wired-gauge
title: observability.wired.total{slice} gauge — machine-readable wiring health
section: 8
subsystem: metrics export (ADR-0172)
order: 118
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: partial
owners: ["@songmin"]
labels: ["surface:observability", "tier:helper"]
depends_on: [instrument-wrap, instrument-extra-and-helper, instrument-shadow-tool-routing, background-subagent, budget-ledger]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "emitWiredGauge flag on withFullObservability runs at composition in CLI."
    web: "Pure internal meta-metric (PromQL/Grafana wiring-health gauge), no quanta UI affordance on any surface."
purpose: |
  Opt-in `emitWiredGauge` flag on `withFullObservability` emits one
  `observability.wired.total{slice}` gauge per `ObservabilityBag` key (7 total)
  with value 1 (wired) or 0 (unwired). Machine-readable counterpart to
  ADR-0169's operator-facing skipped-warning log — log is for humans at
  startup, gauge feeds PromQL alerts and Grafana dashboards. Gauge ALWAYS
  reflects truth; `skippedExpected` only silences the warning, never excludes
  a slice from the gauge (deployment intent is expressed via dashboard alert
  selector, not by lying to the metric). No SOTA agent (Claude Desktop /
  Cursor / Codex) exposes per-slice wiring health as a typed introspection
  surface — quanta first. Default-OFF; byte-identical when flag absent.
evidence:
  code:
    - src/observability/metrics/observability-helper.ts
    - src/observability/metrics/index.ts
    - src/observability/metrics/port.ts
  adrs: ["docs/decisions/0175-observability-wired-gauge.md"]
  tests:
    unit:
      - tests/unit/observability-metrics-wired-gauge-hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  Meta-metric — name is fixed `observability.wired.total` regardless of
  `opts.prefixes` (prefixes scope per-subsystem metrics; this gauge is about
  the helper itself). Emit happens ONCE at construction; no periodic refresh
  (composition root is immutable in today's runtime — refresh hook deferred
  to a Phase 2 follow-up if hot-reload slices ever land). Per-key try/catch
  so a broken custom registry can't block remaining slice gauges.
