id: spinner-tokens-per-sec
title: "Live tokens/sec rate in the streaming spinner"
section: 8
subsystem: 관측성 — CLI 스트리밍 스피너 throughput (claude/codex tok/s 흡수, ADR-0450)
order: 0
maturity: L3
status: stable
ui_surfaces: [cli]
modes: [interactive]
monitoring: integrated
telemetry_keys: [gen_ai.usage]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "observability-primitive"]
depends_on: []
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 1/1 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "slope/spinner is CLI-terminal-only; web TokenCounter shows cumulative tokens+cost, not the live rate, and the rate ride is not bridged"
purpose: |
  The streaming spinner appends a live output `tok/s` rate so the user sees flow
  vs stall (was cumulative counts only). Rate = slope over a trailing ring of the
  last RATE_WINDOW_SAMPLES=8 (outputTokens, ts) readings sampled on token-delta
  boundaries via the indicator's injected clock — a MEASUREMENT (exact slope over
  recorded points), not an EWMA/threshold heuristic. Frame-tick (80ms) drives
  repaint only; the rate value comes from token arrivals (decoupled). Additive:
  the segment appears only with ≥2 samples → thinking/single-chunk renders are
  byte-identical; div-by-zero/NaN guarded (undefined, not 0/NaN).
evidence:
  code:
    - src/apps/cli/turn-indicator.ts
  adrs: [450]
  tests:
    unit:
      - tests/unit/cli/turn-indicator.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold:
  reason: "input tok/s (one-shot, no rate) + configurable window/EWMA deferred."
  promotion_path: "n-a — windowed slope is the chosen measurement."
notes: "trailing-window proven: a burst→stall renders the drop, not a session average."
