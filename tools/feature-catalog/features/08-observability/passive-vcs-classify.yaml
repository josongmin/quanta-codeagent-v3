id: passive-vcs-classify
title: "Passive git/gh stdout → structured VCS events (H6) — turn-diff observability for raw git/gh"
section: 8
subsystem: Out-of-band VCS observability from raw bash-run git/gh commands
order: 600
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:cli", "observability-primitive", "default-off", "git-axis"]
depends_on: ["git-directive-emit-protocol"]
config_refs:
  env: ["QUANTA_PASSIVE_VCS"]
  runtime: ["passiveVcs"]
purpose: |
  H6 (jun-3-misc §3). Closes the raw-stdout blind spot of
  `src/git/directive-emit/parser.ts`, which only reads quanta's OWN emitted
  `::git-*` directive lines. When the agent (or user) runs a raw
  `git rebase/merge/cherry-pick/commit --amend/push` or a `gh pr` command
  through the `bash` tool, the command produces NO structured observability
  today. This slice adds a PURE classifier (no I/O, no-throw) over
  `{command, stdout, exitCode}` that derives the same structured shape an
  explicit directive would carry:
  `{commit:{sha,kind}, push:{localRef,remoteRef}, branch:{action:merged|rebased|amended}, pr:{number,url}}`.

  Patterns mirror Claude Code's `g27` classifier vocabulary (cited per-pattern
  in `classifier.ts`): `Fast-forward` / `Merge made by` → merged;
  `Successfully rebased` → rebased; `--amend` (command-shape) → amended;
  `git cherry-pick` + landed `[branch sha]` → cherry-pick; a push ref-update
  line (`<old>..<new>  <local> -> <remote>` / `* [new branch] ...`) → push;
  `Pull request #N` / `…/pull/N` (gh) → pr. The sha is derived from
  `[branch sha]` / `[main (root-commit) sha]` / `[detached HEAD sha]` /
  `HEAD is now at sha`.

  Wiring: the `bash` tool calls `maybeEmitPassiveVcs(command, body, exitCode,
  ctx)` in its foreground post-exec path (a SEPARATE additive hook, next to the
  ADR-0474 stale-read reminder). The hook is gated by `QUANTA_PASSIVE_VCS` and
  forwards classified events to a duck-typed `vcsEventSink` the host wires; the
  host adapts that sink onto the EXISTING turn-diff `AgentEvent` bus (no second
  bus invented). Pure observability — the tool's `output` is byte-identical
  regardless of the hook outcome.
evidence:
  code:
    - src/git/passive-classify/index.ts
    - src/git/passive-classify/types.ts
    - src/git/passive-classify/classifier.ts
    - src/git/passive-classify/sink.ts
    - src/git/passive-classify/bash-hook.ts
    - src/tool/bash/index.ts
    - src/shared/runtime-config.ts
  adrs: []
  tests:
    unit:
      - tests/unit/passive-vcs-classify-hellgate.test.ts
      - tests/unit/passive-vcs-classify-e2e-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: passiveVcs
    where: src/shared/runtime-config.ts (QUANTA_PASSIVE_VCS)
    default: false
    purpose: "Strict `=== \"1\"` opt-in. OFF ⇒ the bash post-exec hook returns immediately (no classification, no sink touch, byte-identical). ON + wired sink ⇒ classify + emit."
  - name: vcsEventSink
    where: ToolContext (duck-typed seam read by the bash hook)
    default: "noopVcsEventSink (absent)"
    purpose: "Host-wired sink the classified VcsEvent is forwarded to; the host adapts it onto the turn-diff AgentEvent bus. Absent ⇒ byte-identical even with the knob on."
notes: |
  Slice isolation: `src/git/passive-classify/` imports only `@/shared`
  (runtime knob). It does NOT import `@/tool` / `@/agent` / `@/llm`; the bash
  hook reads its sink off `ToolContext` via a duck-typed `PassiveVcsHookCtx`
  view, mirroring the existing `ToolDiffSink` / `vcsEventSink`-style structural
  seams so `@/git` never gains a `@/tool` back-edge. NO-THROW end to end: the
  classifier is total over its input domain and the sink call is guarded.

  Deferred wiring: the dispatch/loop composition root has NOT yet been amended
  to (a) declare `vcsEventSink` on the canonical `ToolContext` and (b) adapt
  the sink onto the `turn_diff_updated` / a sibling `AgentEvent` variant. Those
  files are owned by other tracks this wave (`src/agent/dispatch.ts`,
  `src/tool/types.ts`). The classifier + bash hook + knob are landed and proven
  end-to-end against a duck-typed sink (e2e hellgate); the host-side adapter is
  a 1-call follow-up.

  Distinct from `git-directive-emit-protocol` (ADR-0221): that slice serializes
  quanta's OWN tool mutations into `::git-*` wire lines; THIS slice INFERS the
  structured event from raw third-party git/gh stdout the agent never emitted.
  Complementary blind-spot closure, same structured target shape.
