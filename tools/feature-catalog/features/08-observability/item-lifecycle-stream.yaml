purpose: |
  Project the event stream into per-item lifecycle events so host UIs can render
  "this text block / tool call / thinking block is in-progress / done". Three
  additive AgentEvent variants (item_started{itemId,itemKind,index} /
  item_updated{itemId,delta} / item_completed{itemId}). A pure ItemLifecycleTracker
  tracks open text + tool ids, closes them at turn boundaries, ignores
  orphan/duplicate signals (fuzz-proven: every started has exactly one completed).
  Wired as the final wireOptionalAgentPorts decorator behind QUANTA_ITEM_LIFECYCLE:
  off ⇒ stream returned unwrapped (byte-identical); on ⇒ each emit also emits the
  derived events on the sink (no re-entrancy). The two exhaustive stream consumers
  (jsonl-recorder, stdout) skip the new variants.
