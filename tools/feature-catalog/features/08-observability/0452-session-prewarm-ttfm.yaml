id: session-prewarm-ttfm
title: Session-startup LLM prewarm + Time-To-First-Message (TTFM)
section: 8
subsystem: 텔레메트리 — startup-latency seam + once-fire TTFM gauge
order: 452
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: integrated
telemetry_keys:
  - "quanta.startup.time_to_first_message_ms"
  - "quanta.startup.prewarm_duration_ms"
  - "quanta.startup.prewarm_outcome"
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env: ["QUANTA_PREWARM"]
owners: ["@songmin"]
labels: ["surface:core", "observability-primitive", "absorbed:codex", "default-off", "startup-latency"]
depends_on: [agentrecorder, otel-attribute-vocab]
purpose: 'Codex `session_startup_prewarm` 흡수 — LLM-connection half + TTFM. capability half(tools/skills/classifier)는 이미 `buildSessionFeatures` eager라 DONE; genuine gap 2개: (a) LLM 연결 warm 부재(첫 turn이 DNS+TLS handshake를 critical path에서 지불), (b) session-start→first-turn-dispatch TTFM 메트릭 부재(ADR-0077 per-request TTFT와 별개). HONEST boundary: `LLMPort`는 `stream()` 단일 메서드라 SDK client의 pooled-connection을 fake 요청 없이 pre-open할 public hook 없음 → fake/wasteful 요청 대신 OPTIONAL `LlmPrewarmPort { prewarm(signal?) }` capability(duck-typed `hasPrewarm` guard)를 ship. adapter가 구현하면 진짜 pre-open, 미구현이면 `prewarmLlm`이 "skipped" no-op(현재 stock SDK adapter는 미구현 → connection-warm은 documented seam, TTFM 메트릭은 fully wired+active). `runSessionPrewarm`(src/agent/startup-prewarm.ts)이 session start에 1회 실행: injected clock으로 startedAt 스탬프 → best-effort warm(prewarm_outcome counter + prewarm_duration_ms gauge) → once-fire `TtfmMarker` 반환. loop `streamConsume`가 `emitLlmRequest` 직전(LLM-request boundary)에 `session.ttfm?.markFirstDispatch()` 호출 → 첫 도달이 `quanta.startup.time_to_first_message_ms = now()-startedAt` gauge 기록, 이후 turn은 no-op(per-session 단일 값, Codex age_at_first_turn_ms parity). default-OFF: `config.prewarm` 부재/`enabled!==true` ⇒ `maybeRunSessionPrewarm` undefined ⇒ clock read 0/warm call 0/ttfm slot 부재/메트릭 부재, byte-identical. best-effort: warm reject ⇒ "failed" 기록+swallow, turn 절대 block 안 함. injected clock(`prewarm.now ?? Date.now`)이라 fake clock으로 TTFM 결정론 테스트 가능 — loop 본체에 real timer 없음.'
