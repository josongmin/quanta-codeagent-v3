      - tests/unit/agent-startup-prewarm-hellgate.test.ts
      - tests/unit/agent-prewarm-loop-wire-hellgate.test.ts
      - tests/unit/agent-metrics.test.ts
      - tests/unit/apps/agent/prewarm-wire-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_PREWARM
    default: 'off'
    purpose: 'jun-02 round-2 wire LANDED — `buildBaseFromArgs` reads it via `resolvePrewarmSlot(env)` (`parseEnvFlag(…, false)`) and sets `config.prewarm = { enabled: true, now: () => Date.now() }`; 부재 ⇒ slot omitted ⇒ prewarm 호출 0 + TTFM 메트릭 0 (byte-identical). 이전엔 어떤 composition root도 안 읽어 dead seam이었음.'
  - name: prewarm.now
    default: 'Date.now'
    purpose: 'injected wall-clock(epoch ms) for TTFM determinism; 미주입 시 Date.now'
  - name: prewarm.warmSignal
    default: 'undefined'
    purpose: '느린 connection-warm을 abort해 첫 turn을 절대 지연 안 시킴; loop lifetime signal과 독립'
deliberate_hold:
  reason: 'connection pre-open은 현재 documented seam — stock OpenAI/Anthropic SDK-wrapping adapter는 fake 요청 없이 pooled connection을 pre-open할 clean hook이 없어 `LlmPrewarmPort.prewarm`을 미구현(prewarmLlm은 "skipped" no-op). TTFM 메트릭은 fully active.'
  promotion_path: 'adapter(또는 custom transport)가 진짜 HTTP/2 handshake / connection-pool warm / provider ping을 `prewarm()`으로 구현하면 loop 변경 없이 auto-detect(hasPrewarm) — seam → real pre-open 승격.'
notes: 'ADR-number: 0450 최고치, 0451은 동시 진행 sibling 세션 몫 → 다음 free 번호 0452. ADR-0077 per-request TTFT(`gen_ai.response.time_to_first_token_ms`)와 직교 — TTFT는 POST→첫 chunk, TTFM은 session-start→first dispatch. gauge 사용(per-session 단일 point-in-time 값) — Codex age_at_first_turn_ms / startup_prewarm.duration_ms parity.'
