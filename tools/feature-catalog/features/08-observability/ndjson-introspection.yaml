id: ndjson-introspection
title: NDJSON live-event introspection sink (Cursor cursor-ndjson-ingest)
section: 8
subsystem: live event introspection / tracing (ADR-0468)
order: 468
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: partial
owners: ['@songmin']
labels: ['absorbed:cursor', 'surface:observability', 'tier:port', 'default-off']
depends_on: []
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "keep derived: pure encode/buffer/sink core reachable from CLI; composition-root wire is the introspection affordance"
    web: "NDJSON firehose to an external monitor; no browser render and not in toSessionHostTurnEvent (context-binding.ts) bridge"
purpose: |
  Pure half of Cursor's `cursor-ndjson-ingest`: stream the live agent event
  firehose (tool start/stop, LLM deltas, permission decisions, subagent forks)
  as newline-delimited JSON to an external monitor for real-time
  introspection/tracing. `@/observability` may import ONLY `@/shared`, so the
  HTTP server / `.cursor/debug.log` ADAPTER cannot live here — it is wired at
  the composition root satisfying `NdjsonSinkPort`/`NdjsonFlush`.
  Provides: a deterministic `NdjsonEncoder` (lexicographic key order at every
  level → byte-stable lines; every control char incl. `\n`/`\r` escaped so a
  value can never split a record; no-throw on BigInt/function/symbol/circular/
  non-finite), a bounded ring-buffer backpressure policy (drop-oldest |
  reject-newest; capacity is a REQUIRED validated field, not a magic default),
  and three sinks: `NullNdjsonSink` (DEFAULT-OFF no-op, byte-identical),
  `CapturingNdjsonSink` (tests), `BufferedNdjsonSink` (production core with an
  injected best-effort `flush`).
evidence:
  code:
    - src/observability/ndjson/types.ts
    - src/observability/ndjson/encoder.ts
    - src/observability/ndjson/ring-buffer.ts
    - src/observability/ndjson/sinks.ts
    - src/observability/ndjson/index.ts
    - src/apps/cli/repl/ndjson-wire.ts
  adrs: [468]
  tests:
    unit:
      - tests/unit/observability-ndjson-introspection-hellgate.test.ts
      - tests/unit/cli/ndjson-wire-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_NDJSON_INGEST_PORT
    default: 'undefined'
    purpose: |
      Port number (Cursor-style, observed range ~7242-7942) the composition-root
      HTTP adapter binds to. Unset → NullNdjsonSink wired → byte-identical to no
      introspection. A configured file path is the alternative gate.
deliberate_hold:
  reason: |
    Composition-root HTTP server / file-tail adapter + producer wiring in
    src/agent/loop.ts are DEFERRED to integration (slice fence forbids editing
    shared files). The pure encode/buffer/sink core is complete and tested in
    isolation.
  promotion_path: |
    Wire an NdjsonSinkPort adapter at the composition root binding
    QUANTA_NDJSON_INGEST_PORT (or a path) + supply NdjsonFlush to
    createBufferedNdjsonSink; emit() from the agent loop event boundaries. See
    ADR-0468 integration TODO for exact shapes.
notes: |
  Default-OFF (no @/apps wire imports this barrel yet). The "block" backpressure
  option is realized as reject-newest synchronous back-signalling — a pure
  buffer cannot suspend. capacity has no default by design (no-arbitrary-
  thresholds): the operator states the bound at the wire site so the
  memory/loss trade-off is auditable.
