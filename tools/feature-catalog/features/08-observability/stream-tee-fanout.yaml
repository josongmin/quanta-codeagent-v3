id: stream-tee-fanout
title: TeeStream — fan-out StreamPort with degraded-record tracking
section: 8
subsystem: Stream adapters — fan-out
order: 50
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: integrated
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "observability-primitive"]
purpose: |
  Pure fan-out `StreamPort`. Forwards every `AgentEvent` to every wrapped
  port in order. In NON-STRICT mode (default — product / session) one
  faulty port can never starve the others: its error is swallowed and
  remembered (per-port `DegradedRecord` keyed by `index:reason`) so the
  caller can emit an `observability_degraded` trajectory event. In STRICT
  mode (eval) the first failure rethrows so the caller can mark the
  instance verdict `degraded`. No IO, deterministic.

  The `degraded()` snapshot returns one record per port+reason with hit
  count, so a recorder/probe can render "TeeStream: port-2 EPIPE x37".
  TeeStream itself NEVER writes trajectory — it only fans out + tracks;
  the recorder is responsible for translating degraded records into the
  trajectory `observability_degraded` event.

  Pairs with: `tee` is the multi-surface seam — a host wires
  `[StdoutStream, JsonlRecorder, SseStream]` behind a single TeeStream
  and the agent loop emits events into one port. Slice-isolated: lives
  in `@/stream/adapters` so the agent loop never references the wrapped
  ports directly.
