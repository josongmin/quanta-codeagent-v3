id: contract-tier-gate
title: contract-tier gate — REQUIRE_CONTRACT skip-vs-fail switch (Docker / LSP probes)
section: 8
subsystem: 4-tier 테스트 (unit · integration · contract · smoke) — RFC §10.3 / ADR-0003
order: 80
maturity: L2
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ['@songmin']
labels: [surface:core, observability-primitive]
surface_integration:
  cli: na
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "contract-tier test skip-vs-fail guard; pure test infra, no CLI affordance"
    web: "pure test-tier gate infra, no UI affordance on any surface"
purpose: |
  Contract-tier 테스트는 실제 외부 프로세스(Docker daemon, typescript-/pyright-
  language-server)와 통신하므로 환경 가용성이 다르다. `tests/contract/_guard.ts`
  의 `requireContract(name, available)` 는 단일 결정점: 로컬에서 의존성이
  없으면 silent skip(`test.skipIf` 와 함께), 그러나 CI 가 `REQUIRE_CONTRACT=1`
  로 설정한 경우엔 모듈 로드 시점에 throw → 전체 파일을 erroring 한다. 이는
  "broken integration ≡ 'tool not installed'" 식별 불가 hole 을 닫는다 —
  CI 는 의존성을 의도적으로 provisioning 하므로 absent = provisioning 또는
  integration 파손이고 그건 시끄럽게 fail 해야 한다는 invariant. Docker
  sandbox 와 LSP(TS/Python) 양쪽 contract 파일이 동일 게이트를 통과한다.
evidence:
  code:
    - tests/contract/_guard.ts
    - tests/contract/sandbox-docker.test.ts
    - tests/contract/lsp-typescript.test.ts
    - tests/contract/lsp-pyright.test.ts
  adrs: [3]
  tests:
    unit: []
    integration: []
    contract: [tests/contract/sandbox-docker.test.ts, tests/contract/lsp-typescript.test.ts, tests/contract/lsp-pyright.test.ts]
knobs:
  - name: REQUIRE_CONTRACT
    default: 'undefined'
    purpose: '(no description)'
deliberate_hold: null
notes: |
  Probe pattern: 각 contract 파일은 모듈 로드 시 한 번만 `--version`
  /`docker info`-equivalent 로 가용성 prob 한 뒤 `test.skipIf` 로 dispatch.
  결과적으로 (a) 의존성 미설치 워크스테이션도 0-fail, (b) CI 는 강제 fail,
  (c) bun:test 가 skipped 카운트를 표시 → 침묵 없음. _guard 는 가용성
  signal 만 반환하며 spawn/I/O 는 호출자가 소유한다 (slice-isolation).

  L4→L2: no test imports evidence.code paths