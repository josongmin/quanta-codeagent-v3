notes: 'Closed-port `GitRunner` injection: fake runner drives every adversarial case in unit tests; real `defaultGitRunner` plugs in for production. No back-reference into the loop — the loop calls `startTurn(turnIndex)` at turn start and `endTurn(...)` at turn close.'
