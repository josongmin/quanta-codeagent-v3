id: git-observability-wiring
title: Git-observability wiring — session fingerprint + turn-diff emit (ADR-0110)
section: 8
subsystem: 세션 git context observability (ADR-0110)
order: 30
maturity: L4
status: stable
purpose: |
  Two opt-in seams that attach git context to a session without touching
  `src/agent/loop.ts`. (1) `wireSessionGitFingerprint` — best-effort
  wrapper around `captureGitFingerprint` that returns a NEW
  `SessionMeta` with `gitSha` / `gitBranch` / `gitOriginUrl` attached
  when available. Never mutates the input; when cwd is not a repo all
  three fields are undefined (other fields carried unchanged). (2)
  `wireTurnDiff` — stateful per-session adapter orchestrating
  `captureTurnStart` → `computeTurnDiff` → `buildTurnDiffEvent` into a
  tiny turn-scoped state machine (no-anchor → anchor=sha → event|null).
  Both seams are no-throw — a failing git probe collapses to "field
  absent" rather than derailing session boot or turn close.
