id: structured-logger
title: Structured JSON-per-line logger — machine-consumable observability
section: 8
subsystem: 로깅 — JSON-shaped sink (shared logger와 분리)
order: 84
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: integrated
telemetry_keys: []
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env: [QUANTA_LOG_LEVEL]
owners: ['@songmin']
labels: [surface:core, observability-primitive]
depends_on: [runtime-config-ssot]
purpose: |
  JSON-per-line logger for machine-consumable observability — distinct from
  `@/shared`'s human-shaped `logger`. Emits one `JSON.stringify(LogRecord)`
  per call so downstream tooling (the agent loop, adapters, a future
  collector) can parse fields without regex. Threshold + sink + clock are
  injectable for tests; default sink writes stderr only (stdout is reserved
  for the agent stream — same rule as `@/shared`). Threshold gate routes
  through the shared `levelEnabled` predicate so the human-logger's level
  ordering is the single source-of-truth. Resolves the effective level via
  explicit option ›› `runtimeConfig().logLevel` ›› default so a garbage
  `QUANTA_LOG_LEVEL` falls back to `info` with a one-time stderr warn
  rather than silently dropping every line.
evidence:
  code:
    - src/observability/logger.ts
    - src/observability/types.ts
    - src/shared/runtime-config.ts
  adrs: []
  tests:
    unit: ["tests/unit/cost-dashboard.test.ts"]
    unit: [tests/unit/cost-dashboard.test.ts, tests/unit/next-action-cap-enforce.test.ts]
    integration: []
    contract: []
knobs:
  - name: QUANTA_LOG_LEVEL
    default: 'undefined'
    purpose: '(no description)'
deliberate_hold: null
notes: |
  Two-logger architecture is deliberate: the shared one emits a tiny
  `[level] msg` for humans, this one emits structured JSON for machines.
  Wrapping rather than re-deriving the level keeps the env-validation
  ratchet (`runtime-config-ssot`) intact.
