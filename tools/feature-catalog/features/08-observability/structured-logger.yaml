deliberate_hold: null
notes: |
  Two-logger architecture is deliberate: the shared one emits a tiny
  `[level] msg` for humans, this one emits structured JSON for machines.
  Wrapping rather than re-deriving the level keeps the env-validation
  ratchet (`runtime-config-ssot`) intact.
