id: memory-telemetry-adapter
title: MemoryTelemetry → MetricsRegistry adapter (phase1 / phase2 / recall OTel emission)
section: 8
subsystem: metrics export (ADR-0144 + memory slice binding)
order: 115
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: integrated
telemetry_keys: ["quanta.memory.phase", "quanta.memory.recall.hits", "quanta.memory.recall.scanned", "quanta.memory.recall.latency_ms"]
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:observability", "tier:adapter", "absorbed:opentelemetry"]
depends_on: [memory-telemetry-port, otel-sink]
purpose: |
  Production binding of `MemoryTelemetryPort` (from @/memory) onto the
  typed `MetricsRegistry` port (from @/observability/metrics). Lives in
  the observability slice — dependency points adapter→port, never the
  reverse, so the memory slice's `@/memory ↛ @/observability` fence
  stays intact (see `memory-telemetry-port` entry + the
  `memory-fence-stays-clean-hellgate` static scan).

  Emitted OTel keys (all under `quanta.memory.*`):

    Phase 1: phase1.outcome (counter, labeled), phase1.e2e_ms
             (histogram), phase1.turns (counter), phase1.tokens_in/out
             (counter, optional)
    Phase 2: phase2.outcome (counter, labeled), phase2.e2e_ms
             (histogram), phase2.stage1_count (counter),
             phase2.tokens_in/out (counter, optional)
    Recall:  recall.hits (counter), recall.scanned (counter),
             recall.latency_ms (histogram)

  The full key list is frozen at `MEMORY_TELEMETRY_KEYS` and asserted
  exhaustive by the hellgate (no silent drift between adapter and OTel
  vocabulary).
