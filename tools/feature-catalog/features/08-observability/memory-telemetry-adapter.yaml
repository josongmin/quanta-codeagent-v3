    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  Default-OFF at the slice level — no call site in src/ wires this
  adapter today; the composition root (apps/agent bootstrap, future
  consolidator-hook wiring) opts in by passing the port through to
  `runPhase1` / `runPhase2` / `rankEntries`. The adapter is no-throw at
  the surface (it trusts the MetricsRegistry no-throw contract, mirroring
  the otel-sink design). Pairs with `otel-sink` for downstream OTel
  collector export — the adapter writes into MetricsRegistry, the otel
  sink reads MetricsRegistry, neither knows about the other.
