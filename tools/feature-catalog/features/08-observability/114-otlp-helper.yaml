owners: ["@songmin"]
labels: ["absorbed:opentelemetry", "surface:observability", "tier:adapter"]
purpose: |
  Factory helpers that lazily dynamic-import `@opentelemetry/sdk-metrics` +
  `@opentelemetry/exporter-metrics-otlp-http` + `@opentelemetry/exporter-prometheus`,
  construct a MeterProvider with PeriodicExportingMetricReader, hand off to
  `otelMetricsSink` (ADR-0154). Missing deps surface as typed
  `OtelDepsMissingError` with `bun add ...` install hint. Returns
  `{sink, shutdown}` for graceful cleanup.
