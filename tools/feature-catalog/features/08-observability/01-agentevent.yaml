purpose: |
  `AgentEvent` discriminated union — the ENGINE-INTERNAL event stream the agent
  loop emits per turn (36 variants today: turn_start / assistant_text /
  assistant_thinking / tool_call / tool_progress / tool_result / usage / error /
  done / plan_* / mode_changed / …). Carries the RunContext correlation tuple
  (runId / instanceId / attempt / turn / toolUseId) so downstream sinks (JSONL
  recorder, SSE adapter, work-metrics) can slice the run-graph (RFC-0002 §5.1).

  jun-11 SSOT exports: `AGENT_EVENT_TYPES` + `isAgentEventType` from
  `src/stream/types.ts` (re-exported `@/stream`). NOT the wire protocol —
  `SessionProtocol` (`session-protocol-codec`) owns the product boundary;
  `toSessionHostTurnEvent` bridges a strict 7-tag subset for web reachability.
