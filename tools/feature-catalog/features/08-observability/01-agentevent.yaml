owners: ['@songmin']
labels: [surface:core, observability-primitive]
depends_on: [work-metrics]
purpose: |
  `AgentEvent` discriminated union — the surface-facing event stream the agent loop
  emits per turn (turn_start / assistant_text / tool_call / tool_progress /
  tool_result / usage / error / done). Carries the RunContext correlation tuple
  (runId / instanceId / attempt / turn / toolUseId) so downstream sinks (JSONL
  recorder, SSE adapter, work-metrics) can slice the run-graph (RFC-0002 §5.1).
  Definition lives in `src/stream/types.ts`; consumed by every transport adapter
  (SSE/JSONL/tee) and by the trajectory translator.
