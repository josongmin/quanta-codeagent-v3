    type: string?
    default: '"codex_r2"'
    notes: 'Prefix prepended to every metric name. Override per-deploy to namespace into a multi-tenant metrics store.'
deliberate_hold: null
notes: 'Production wire-up (auto-wrap inside assemble.ts) deferred to a future ADR. Drift-detector observability (ADR-0326 DriftDetectedError counter) is a candidate sibling decorator — separate ADR. Histogram support requires extending MetricEmitterPort — separate ADR.'
