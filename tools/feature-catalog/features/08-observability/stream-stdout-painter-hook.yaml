notes: |
  Cognitive-complexity housekeeping: `drainPainterTail` and
  `writeAssistantText` are private helpers hoisted out of `emit` so
  `emit`'s switch stays a single statement per case — keeps the file
  under the biome budget. The painter hook stays a closed-port
  contract (interface, not concrete class) so non-CLI surfaces wire
  `undefined` and skip the funnel entirely.
