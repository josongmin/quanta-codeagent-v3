ui_surfaces: [cli]
configurable: static
purpose: |
  Human-readable `StreamPort` adapter that renders `AgentEvent` to
  stdout: assistant text inline, tool calls / progress / results /
  lifecycle as dim ANSI-colored status lines. Exposes a closed-port
  `AssistantTextPainter { write(delta), flush() }` so the CLI surface
  can inject an inline markdown highlighter without StdoutStream
  needing to know about it. Two invariants the painter must respect:
  (1) `write(delta)` may BUFFER and return `""` when it needs more
  bytes to disambiguate a markdown token — StdoutStream writes only
  the non-empty return; (2) on any non-`assistant_text` event boundary
  the adapter calls `painter.flush()` FIRST so a pending partial
  header / fence is emitted before the boundary marker — otherwise an
  in-flight `**bold**` at end-of-turn would silently drop. When no
  painter is wired (recorders, Web surface) every delta is written
  verbatim — byte-identical to the pre-painter path (RFC §1.2
  default-OFF). All assistant text + tool stderr / preview is funneled
  through `redactStr` before stdout so a leaked secret in model output
  cannot hit the terminal.
