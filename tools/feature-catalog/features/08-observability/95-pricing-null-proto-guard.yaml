deliberate_hold: null
notes: |
  pricing-hellgate G3에서 5개 prototype-key 모델명 (`toString` / `constructor` /
  `__proto__` / `hasOwnProperty` / `valueOf`)에 대해 `null` (not NaN) 반환을 봉인.
  cache-read provider-aware 분기(anthropic disjoint vs openai carve-out)와는
  별개 axis — 본 가드는 unknown-model totalization. costUsd null이 흘러야 work-
  metrics summarize가 cost 라인을 깨지 않는다.
