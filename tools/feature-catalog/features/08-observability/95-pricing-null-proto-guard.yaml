id: pricing-null-proto-guard
title: costUsd — null-prototype TABLE로 prototype-pollution NaN 차단
section: 8
subsystem: 비용 회계 / 정량 가드
order: 95
maturity: L5
status: stable
purpose: |
  `costUsd(model, ...)`의 model 인자는 untrusted 외부 문자열. 가격 TABLE이 평범한
  object literal이면 `TABLE["constructor"]` / `["toString"]` / `["__proto__"]` /
  `["hasOwnProperty"]` / `["valueOf"]`가 inherited `Object.prototype` 멤버로
  resolve되어 `=== undefined` unknown-model guard를 통과해버린다. 그 뒤
  `price.inPerM`이 undefined가 되어 `NaN` 비용이 silently 흘러간다 — RFC may-22
  hellgate에서 잡힌 실버그. 구조적 수정: `TABLE = Object.assign(Object.create(null), {...})`로
  prototype chain을 끊고, 추가 belt-and-suspenders로 `Object.hasOwn(TABLE, model)`
  가드를 유지. 결과: prototype-key 모델명은 진짜로 `undefined`로 resolve되어 unknown-model
  contract(`null` 반환)가 totalize된다.
