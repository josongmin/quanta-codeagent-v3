id: turn-timing-anchors
title: Turn-timing wall-clock anchors — request/firstToken/streamEnd (ADR-0077)
section: 8
subsystem: 텔레메트리 — per-turn 시계 캡처 + TTFT 가드
order: 81
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: integrated
telemetry_keys: [gen_ai.usage]
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "observability-primitive"]
purpose: |
  Records the three wall-clock anchors that pin down a single LLM-stream
  turn: `requestSentAt` (adapter stamps immediately before the POST),
  `firstTokenAt` (idempotent — only the first chunk records), `streamEndAt`
  (drain or abort). Surfaces two derived quantities: `firstTokenLatencyMs`
  (`firstTokenAt - requestSentAt`, `null` when no first token was seen) and
  `totalDurationMs`. Pure / no IO; the clock is injected so tests pin time
  deterministically. SOTA Cursor mirror: `ttftMs` / `totalTtftMs` scalar
  projections are explicitly guarded against non-finite (NaN / Infinity) and
  negative (clock-skew) values — a guard failure surfaces as `null` so the
  OTel emit can omit the attribute rather than poison the dashboard with a
  junk number.
