notes: |
  Plane-clean: this slice imports ONLY `@/shared` (for `QuantaError`).
  No `@/agent`, `@/llm`, `@/permission`, `@/tool` — those are future
  consumers, never collaborators of this primitive. Distinct from the
  pre-existing `metrics-registry.yaml` (which catalogs the older
  `src/observability/metrics.ts` loop-recorder facade); the two coexist
  during the migration window.
