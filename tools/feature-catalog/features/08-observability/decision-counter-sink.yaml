id: decision-counter-sink
title: `decision` AgentEvent → MetricsRegistry counter sink (`quanta.gate.{kind}.{outcome}.total`) (ADR-0270)
section: 8
subsystem: observability — gate-decision 카운터 집계 (in-process + OTLP 양쪽)
order: 270
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless, daemon, ide, ci-bot]
configurable: partial
owners: ["@songmin"]
labels: ["surface:observability", "tier:adapter"]
depends_on: [debug-tracer-decision-event, decision-emit-phase2-admissibility, decision-emit-phase3-cap-jail-budget, metrics-typed-port-slice]
config_refs:
  env: ["QUANTA_DECISION_METRICS"]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 2/2 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "rides the decision AgentEvent which is dropped at context-binding.ts default arm; counter goes to MetricsRegistry/OTLP, never to the browser"
purpose: |
  Phase 2 + Phase 3 wiring 후에도 `MetricsRegistry`는 게이트 결정을 보지
  못했음 — trajectory recorder + CLI tracer는 consume했지만 canonical
  counter `quanta.gate.{kind}.{outcome}.total` (operator가 기대하는 in-process
  snapshot + OTLP-exported view 양쪽)이 materialize 안 됨. 이 sink가 닫는다.

  Thin `StreamPort` adapter `createDecisionCounterSink({ metrics, prefix? })`
  — `decision` event 들으면 `(kind, outcome)` 쌍에 대응하는 MetricsRegistry
  counter bump. 이름은 기존 `<prefix>.<axis>.<outcome>.total` 컨벤션 따름
  (`prefix` default `quanta.gate`). CLI tee chain에서 turn-summary collector
  와 동일 position에 wire, `QUANTA_DECISION_METRICS=1` env gate 통과 시에만
  attach해서 default-OFF byte-identical 유지.

  **Cardinality invariant (NEGATIVE)**: counter labels은 `kind` + `outcome`
  *뿐*. `decision` event의 다음 필드들은 deliberately EXCLUDE: `toolCallId`
  (per-call ULID, time-series explosion), `ruleId` (user-authored, 상한
  없음), `hookName` (user-authored, ruleId와 같은 risk), `reason` (free-form,
  closed taxonomy 없음), `metadata` (caller-supplied). Steady state matrix는
  6 kind × 3 outcome = 정확히 **18 time-series**. Codex / Cursor / Claude
  Code가 모두 label-set explosion (tool_id / req_id) 으로 빡쎄게 배운
  교훈을 흡수 — typed-only label set up front.

  In-process queries: `MetricsRegistry.snapshot()`이 이제 18-series gate
  matrix 노출 → future `/metrics` slash command가 "오늘: 42 deny / 7 ask"를
  추가 emit code 없이 surface. OTLP export (ADR-0268): OTel-backed registry
  + `QUANTA_DECISION_METRICS=1` 조합이면 Grafana / Tempo dashboard가 거의
  공짜.
evidence:
  code:
    - src/observability/metrics/decision-counter-sink.ts
    - src/apps/cli/repl.ts
  adrs: [270]
  tests:
    unit:
      - tests/unit/observability/decision-counter-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_DECISION_METRICS
    default: 'undefined'
    purpose: '(no description)'
deliberate_hold: null
notes: |
  Default-OFF posture: env knob 미설정 / `0|false|off|no` 시 helper가
  literal upstream stream return (byte-identical, MetricsRegistry 할당
  안 함). Plane-clean: sink는 `@/stream` (types) + `./port` (registry)만
  import — agent / permission / tool slice coupling 없음.

  16-case hellgate: 3×3 (kind × outcome) sample / repeat-emit accumulation
  / non-decision event noise rejection / throwing registry에 대한 no-throw
  policy / custom prefix / cardinality invariant (extra label 추가 안 됨)
  / every-kind support / empty / whitespace prefix fallback.

  Negative invariants: 새 MetricsRegistry port 추가 안 함 (ADR-0144 재사용),
  `decision` AgentEvent shape (ADR-0267 / 0269) NOT mutated, 고-cardinality
  필드 (toolCallId / ruleId / hookName / reason / metadata) counter label로
  NEVER 사용.
