knobs: []
deliberate_hold: null
notes: |
  Composes with the CLI `buildShellStreamPainter()` via
  `composeShellObservers(...)` — non-interactive modes (bench / ci-bot) wire
  only the OTel one. No new collection — feeds the same `Metrics` snapshot
  consumed by `cost-cache-dashboard` and `work-metrics`.
