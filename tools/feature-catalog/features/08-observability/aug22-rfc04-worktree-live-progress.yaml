id: aug22-rfc04-worktree-live-progress
title: Live worktree-transition progress — staged CLI renders (RFC-04)
section: 8
subsystem: Worktree transition progress — staged ActivityStore renders (aug-22 RFC-04)
order: 620
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: integrated
owners: ["@songmin"]
labels: ["rfc:aug22-04", "surface:cli", "default-off"]
config_refs:
  env: [QUANTA_WORKTREE_PROGRESS]
purpose: |
  RFC-04 D4 live CLI progress for the `worktree` command. When ON, the command
  subscribes to the session `ActivityStore` ATOMICALLY (the store's
  `{snapshot,nextSeq}` contract) BEFORE invoking `transitionThreadToWorktree`, so
  no staged event is lost between subscribe and operation start; it renders each
  materialized change the instant it arrives (synchronous flush) so the FIRST
  progress render precedes command completion; it unsubscribes in `finally`. The
  transition stages `workspace → checkout → done` children.

  Gate discipline: `progress` is the resolved `QUANTA_WORKTREE_PROGRESS` decision
  threaded ONCE from the repl composition root via readCliKnob. When false (or no
  store is wired) the function neither turns on the transaction's `staged`
  children NOR subscribes — transition + output are byte-identical to the pre-D4
  coarse path (one final settled receipt render). NOTE: the D1 staged milestones
  work; the D2 real-time checkout-% chain has no `git worktree add --progress`
  source and is not part of this staged-only feature.
evidence:
  code:
    - src/runner/session-ops/worktree/live-progress.ts
    - src/runner/session-ops/current-thread-worktree.ts
    - src/runner/session-ops/index.ts
    - src/apps/cli/repl.ts
  adrs: ["docs/plans/aug-22-흡수계획/rfc-04-worktree-progress.md"]
  tests:
    unit:
      - tests/unit/session-ops/worktree-live-progress-timing-hellgate.test.ts
      - tests/unit/cli/knob-catalog.test.ts
    integration:
      - tests/integration/cli-worktree-live-progress.test.ts
    contract: []
knobs:
  - name: QUANTA_WORKTREE_PROGRESS
    where: src/config/knob-inventory/runner.ts
    default: false
    purpose: |
      Live worktree-command progress gate (RFC-04). ON ⇒ the `worktree` command
      stages child-step renders as they land; resolved ONCE at the repl
      composition root. Unset ⇒ single final render, byte-identical.
notes: |
  Staged-progress ONLY — the D2 real-time checkout percentage is not supported
  (git emits no progress for `worktree add`); the R5 follow-up tracks the honest
  cleanup of that dead % chain.
