id: notify-presence-suppression
title: Presence-aware desktop-notification suppression (B5)
section: 8
subsystem: observability — CLI desktop notifications (presence-aware push, jul-03 absorption)
order: 210
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:cli", "observability-primitive", "default-off"]
depends_on: []
config_refs:
  env: [QUANTA_NOTIFY_PRESENCE]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-07-03"
  evidence:
    cli: "the CLI notify factory (src/apps/cli/repl/factories/notify-and-warning.ts) attaches an isUserPresent probe (`() => !idleMonitor.isIdle()`, wired from the composition root at src/apps/cli/repl.ts:335) to the OSC notification port ONLY when QUANTA_NOTIFY_PRESENCE is opted in; the port (src/apps/cli/notify/osc-adapter.ts) then suppresses the desktop push while the probe reports the user present"
    web: "desktop OSC notifications are a terminal-surface concern; no web analogue"
purpose: |
  Presence-aware suppression of the CLI desktop notification (the competitor
  "don't ping me while I'm actively watching the terminal" push semantics). When
  `QUANTA_NOTIFY_PRESENCE` is opted in (1/on/true/yes), the notify factory
  attaches an `isUserPresent` probe — the SSOT idle monitor's inverse
  (`() => !idleMonitor.isIdle()`) resolved at the composition root — onto the OSC
  notification port. The port then suppresses the desktop push whenever the probe
  reports the user is present, and fires normally when they are away/idle.

  DEFAULT-OFF, NO SILENT INVERSION: absent / falsy ⇒ the probe is NOT attached
  and the port is built WITHOUT `isUserPresent`, so the legacy always-notify
  behavior is preserved byte-for-byte. Only an explicit opt-in turns on
  suppression. If the probe is absent the port treats the user as away (never
  suppresses), so a mis-wire fails OPEN (you still get notified).
evidence:
  code:
    - src/apps/cli/repl/factories/notify-and-warning.ts
    - src/apps/cli/notify/osc-adapter.ts
    - src/apps/cli/repl.ts
  adrs: []
  tests:
    unit:
      - src/apps/cli/repl/factories/__tests__/notify-presence-wire.hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_NOTIFY_PRESENCE
    where: src/apps/cli/repl/factories/notify-and-warning.ts
    default: 'off'
    purpose: |
      ON (1/on/true/yes) ⇒ attach the presence probe to the notify port so a
      PRESENT user suppresses the desktop push. Unset/falsy ⇒ probe not attached
      ⇒ legacy always-notify (byte-identical).
deliberate_hold: null
notes: |
  B5 (jul-03) — a small UX absorption on top of the OSC desktop-notification
  port. The load-bearing discipline is the default-OFF / no-silent-inversion
  contract (pinned by notify-presence-wire.hellgate.test.ts): a present user
  suppresses only under the explicit gate, an absent gate is byte-identical
  always-notify, and an absent probe fails open (never silently swallows).
