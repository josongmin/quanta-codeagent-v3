notes: |
  파일은 코드가 아니라 "rule catalog 의 적대 진실 (adversarial truth)" 로
  취급. mustBlock 만으로는 false-positive 회귀 (e.g. 정상 `git -C` 차단)
  를 못 잡으므로 mustAllow lookalike 가 필수 — 본 코퍼스는 두 축 모두를
  필수 schema (`RuleFixture { mustBlock, mustAllow }`) 로 둬서 한쪽만 채운
  fixture 가 schema 에서 거부되도록 한다.
