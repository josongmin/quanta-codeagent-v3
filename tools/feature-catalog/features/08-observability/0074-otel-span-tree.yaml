      - tests/integration/spans-genai-active-context.test.ts
    contract: []
knobs:
  - name: setSpanSink
    default: 'undefined'
    purpose: '(sink|null) host(CLI/Tauri/Web)가 SpanSink 구현체를 wire; 미등록이 기본 (no-op)'
deliberate_hold: null
notes: 'ADR-0539 (jul-13) unification: the 4-stage span tree now carries gen_ai semconv attrs (operation.name invoke_agent/chat/execute_tool, provider.name, finish_reasons array) via `withActiveSpanScope` (session-resources.ts) and the exporter (`otel-span-export.ts`) issues the active TraceRef so OTLP ≡ OBSERVE ≡ cassette share one {traceId,spanId}; the chat span is kind=CLIENT. One trace per instance-attempt (quanta.instance.id/attempt stamped on the per-attempt root). full 10-11 deep tree (mcp/sub-submission/per-event)는 미채택 — core 4 stage만, 같은 seam 위에서 확장. first-class "blocked" tool status 채널 부재 — gate-deny는 현재 status="error"로 surface. ADR-0032 vocabulary 위에 얹음.'
