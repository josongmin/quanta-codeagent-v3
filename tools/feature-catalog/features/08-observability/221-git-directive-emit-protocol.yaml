deliberate_hold: |
  Caller-side wiring (one `emit(...)` line per success path inside
  `src/tool/git/commit.ts`, `src/tool/git/branch-switch.ts`, and the future
  `gh-pr-create.ts`) is deferred to a follow-up slice. Landing the
  phase-guarded port first keeps this slice purely additive and lets the
  wire stay trivial when ADR-0025 mutating-git tools graduate from `bash`.
notes: |
  Distinct from ADR-0220 (`src/agent/git-directives/`) in directive shape
  AND in concern: 0220 models the UI-tail consumer (`stage.paths`, `push.{remote,branch}`);
  this slice models the call-site intent (`stage.files`, `push.{ref,force}`).
  Both wire formats serialize with canonical alpha-sorted JSON so a host
  that wants either shape gets deterministic bytes. Slice isolation:
  imports only `@/shared` (`Result`, `ok`, `err`); does NOT touch `@/tool`,
  `@/llm`, `@/mcp`, `@/permission`, `@/agent`. 18 hellgate cases pin the
  contract (default-OFF / phase guard / 5-kind round-trip / canonical JSON /
  FIFO / frozen-on-parse / newline-safe framing).
