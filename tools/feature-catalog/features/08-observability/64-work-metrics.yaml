id: work-metrics
title: workMetrics — turn별 비용·작업 투명성
section: 8
subsystem: 작업 투명성 (v0.dev 흡수, ADR-0065)
order: 64
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: integrated
telemetry_keys: ["quanta.memory.phase", "quanta.thread.id", "quanta.thread.kind", "quanta.conversation.id", "quanta.conversation.session_id"]
modes: [n-a]
configurable: integrated
config_refs:
  env: [QUANTA_METRICS]
owners: ["@songmin"]
labels: ["surface:core", "observability-primitive"]
purpose: |
  v0.dev workMetrics 흡수 — turn별 diffMap(파일당 +추가/-삭제 줄), agentActions,
  linesRead, 토큰 in/out + estimatedCostUsd를 순수 집계. parseNumstat(git diff
  --numstat, binary '-' → 0), summarizeWorkMetrics(compact 1-block, 예:
  "3 files (+42 -7) · 5 actions · 312 lines read · 1.2k in / 0.8k out · ~$0.03"),
  accumulateWorkMetrics(turn→session 순수 fold). pricing.ts로 cost 환산.
  L4(ADR-0064): loop은 이미 turn별 collector+emit을 AgentConfig.workMetricsSink
  게이트로 배선했으나 DEFAULT sink가 없어 메트릭이 수집 후 드롭됐다. CLI repl이
  QUANTA_METRICS 노브(cost 대시보드와 동일 게이트) 하에 기본 stderr 요약 sink를
  배선 — turn당 `work: <summarizeWorkMetrics(m)>` 한 줄을 cost 대시보드와 같은
  stderr surface로 출력. SessionDeps→assembleConfig로 thread.
evidence:
  code:
    - src/observability/work-metrics.ts
    - src/observability/vocabulary.ts
    - src/observability/attrs.ts
    - src/agent/work-metrics-collector.ts
    - src/agent/session-resources.ts
    - src/apps/cli/repl.ts
    - src/apps/cli/config-assemble.ts
    - src/apps/cli/internal.ts
  adrs: [65]
  tests:
    unit: [tests/unit/work-metrics.test.ts, tests/unit/work-metrics-collector.test.ts, tests/unit/observability/attrs.test.ts, tests/unit/observability/vocabulary.test.ts]
    integration: [tests/integration/loop-work-metrics-sink.test.ts]
    contract: []
knobs: [QUANTA_METRICS]
deliberate_hold: null
notes: 'OTel attr은 flat이라 workMetricsAttrs는 per-file diff를 scalar 합계로 집계 후 emit. L4: 기본 sink가 CLI에 배선되어 사용자가 turn별 작업 요약을 본다(QUANTA_METRICS=1). 잔여 scope: diffMap은 아직 자동 채워지지 않음 — collector.recordDiff(numstat)를 통해서만 누적되며 loop가 turn별 `git diff --numstat`을 spawn하는 배선은 후속(// TODO(absorb #6 cont.) in session-resources.ts). 토큰/액션/lines는 실효.'
