knobs: []
deliberate_hold: null
notes: |
  Security invariant: prompt/completion TEXT 절대 read/emit 안 함 (sink 는
  WorkMetrics 만 소비; scalar counts + per-file numstat). Non-finite cost
  (NaN/Infinity) + negative delta 는 boundary 에서 drop — OTel monotonic
  sum 스펙 준수. providerOf() 미리 sniff (gpt/o1/o3 ⇒ openai; else
  anthropic) — legacy caller 가 provider 누락해도 dashboard 가 항상
  provider 라벨 봄. 300 expects / 1 hellgate case.
