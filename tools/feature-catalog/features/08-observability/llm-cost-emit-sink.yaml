id: llm-cost-emit-sink
title: LLM tokens + cost_usd OTel emit at turn-record sink
section: 8
subsystem: 텔레메트리 — gen_ai.usage.* + quanta.work.cost_usd 활성화
order: 91
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: integrated
telemetry_keys: [gen_ai.usage, quanta.work.cost_usd]
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "observability-primitive"]
config_refs:
  env: []
purpose: |
  `llm/*` adapter 가 계산한 `estimatedCostUsd` + `input_tokens` /
  `output_tokens` / `cache_read_input_tokens` / `cache_creation_input_tokens`
  가 `WorkMetrics` 에 surface 되지만 OTel registry 에는 도달하지 못하던
  gap 을 downstream sink 에서 wire-up. **adapter 코드 unchanged** — user
  WIP 에 있는 llm 슬라이스를 건드리지 않고 observability 측에서만 봉합.
  `emitLlmCostToOtel(metrics, m, labels, extra)` — pure stateless emit;
  `buildLlmCostMetricsSink(metrics, labels, wrap?)` — `AgentConfig.
  workMetricsSink` 에 직접 plug-in 가능. Cost 는 `quanta.work.cost_usd`
  timer 에 record (count/min/max/mean/p50/p95 histogram) + rolled-up
  counter 동시 증가. Unknown-model (`estimatedCostUsd === undefined`)
  ⇒ placeholder zero 안 쓰고 cost emit 통째로 skip. `${k}.${provider}.
  ${model}` disaggregated counter 자동 생성 (sanitized: gpt-4.1 ⇒
  gpt_4_1) — 모델별 분해 + rolled-up 동시 유지.
