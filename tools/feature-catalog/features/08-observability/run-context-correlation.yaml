notes: |
  The shape is intentionally a flat readonly-ish struct (no methods, no
  builders) so it can be JSON-stringified into the trajectory envelope without
  conversion. `01-agentevent.yaml` references RunContext as the agent-event ↔
  trajectory correlation bridge; this entry registers the primitive itself.
