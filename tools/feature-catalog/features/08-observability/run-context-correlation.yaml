id: run-context-correlation
title: RunContext — run/instance/attempt/turn/toolUseId correlation primitive
section: 8
subsystem: 텔레메트리 — span correlation
order: 10
maturity: L4
status: stable
purpose: |
  Correlation context threaded through an agent run (RFC-0002 §5.1). Carries
  `runId` (required) + optional `instanceId` / `attempt` / `turn` / `toolUseId`
  so every `TrajectoryEvent` can be sliced run → instance → attempt → turn →
  tool_use. Propagated via `AgentConfig.run?`; all fields except `runId` are
  optional so the agent behaves byte-identically when the surface doesn't wire
  it (project-standard optional-context pattern, RFC §1.2 default-OFF).

  This is the canonical "where am I in the run-graph" primitive. The agent
  loop stamps `turn` per turn; the dispatch seam stamps `toolUseId` per tool
  call. Bench drivers stamp `runId` + `instanceId` + `attempt` (best-of-N).
