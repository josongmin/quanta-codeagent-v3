title: lsp-nav test fixtures — ctx/run/findTool primitives for 9-tool per-suite split
section: 8
subsystem: 테스트 인프라 (lsp_nav per-tool 슬라이스 공유 fixture)
order: 77
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: partial
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: ["surface:core", "observability-primitive"]
configurable: static
purpose: |
  `tests/unit/lsp-nav-fixtures.ts` 는 lsp_nav 9 개 per-tool 테스트 슬라이스
  (definition · type-definition · references · implementation · hover ·
  document-symbol · workspace-symbol · rename-preview · tools) 가 공유하는
  순수 헬퍼 묶음이다. Refactor C 결과 — 한 파일에 500 + 줄짜리 multi-concern
  `lsp-nav-tools.test.ts` 였던 것을 도구별 슬라이스로 쪼개면서 공통
  arrange/assert primitives 만 본 파일로 추출했다 (describe / test 없음).
  제공 primitives:
   - `ctx()` — 기본 `ToolContext` 빌더 (cwd=/repo, fresh AbortController);
     도구 실행 ceremony 제거.
   - `run<I>(tool, input)` — `tool.execute(input, ctx())` `AsyncIterable<ToolEvent>`
     를 walk 하면서 progress 메시지를 수집 + 마지막 result 를 반환; result
     없이 종료되면 즉시 throw. progress + result 두 축 모두 단언 가능하게
     쥐어 줌.
   - `findTool<I>(name, provider)` — `lspNavTools(provider)` 에서 이름으로
     도구를 끌어오고 미등록이면 throw — 테스트마다 등록 룩업을 반복하지 않게.
   - URL helpers (`pathToFileURL` 기반) + `LspNavProvider` / `LspNavSession`
     타입 import 통합.
  18 개 lsp-nav per-tool 파일 (.ts + .js 미러 포함) 이 본 fixture 를 import —
  9 도구 × 2 (ts/js) 미러 + 부수 suites. 슬라이스 분리 + 공유 헬퍼는
  unit-test 가 한 도구의 invariant 만 단언하도록 응집도를 강제한다.
