notes: |
  Refactor C ("split 500 + 줄 multi-concern test files into focused suites")
  의 산출물. fixtures 파일에 describe/test 가 없는 게 핵심 — pure helper 만
  두면 fixture 변경이 어떤 suite 의 어떤 invariant 인지를 바꾸지 않는다
  (fixture 가 새 케이스를 강요하지 않음). `run()` 은 progress + result 두
  축을 반환해서 호출자가 어느 쪽을 단언할지 결정 — primitive 가 의견을
  거의 안 가져야 9 개 도구의 다른 surface 를 일관되게 다룰 수 있다.
