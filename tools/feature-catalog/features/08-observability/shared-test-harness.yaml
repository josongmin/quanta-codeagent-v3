notes: |
  Re-export 패턴은 의도적: 슬라이스(unit·integration)는 다른 디렉토리에
  살지만 더블의 정의는 한 파일에서만 산다. README 의 "Import the harness
  from `./_harness`, never redefine `ScriptedLLM` / `FakeLLM` /
  `RecordingStream` / `cfg` locally" 규칙이 이 invariant 의 사회적 강제,
  파일 1 개 SSOT 가 기술적 강제. `withTimeout` 사용량(86) 이 harness 의
  spread (~63% of consumers) 를 보여준다.

  L5→L2: no test imports evidence.code paths