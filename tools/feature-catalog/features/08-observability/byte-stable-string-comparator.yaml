id: byte-stable-string-comparator
title: `byteCompare` — locale-independent string ordering
section: 8
subsystem: shared — deterministic ordering primitive
order: 96
maturity: L5
status: stable
ui_surfaces: [cli]
monitoring: partial
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: ["surface:core", "observability-primitive"]
purpose: |
  Byte-stable string comparator for deterministic ordering. Unlike
  `String.prototype.localeCompare`, the result does NOT depend on the
  host locale or ICU collation, so any list sorted with `byteCompare` is
  byte-identical across machines and locales. This is REQUIRED for
  anything whose ordering reaches the model-facing prompt, the persisted
  transcript, or a replay-compared payload — locale-dependent ordering
  silently breaks the byte-identical replay + prompt-cache invariant.
