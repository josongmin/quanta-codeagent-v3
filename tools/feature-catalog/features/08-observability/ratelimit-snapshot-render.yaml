id: ratelimit-snapshot-render
title: Transient rate-limit quota notice (CLI status-bar render)
section: 8
subsystem: 텔레메트리 — 계정 rate-limit 스냅샷의 user-facing 표시 (P27, jun-7-gap-other-agent §23.1)
order: 231
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: integrated
telemetry_keys: []
modes: [interactive]
configurable: partial
owners: ["@songmin"]
labels: ["surface:cli", "observability-primitive", "default-off"]
depends_on: [context-usage-metrics]
config_refs:
  env: ["QUANTA_RATELIMIT_NOTICE", "QUANTA_RATELIMIT_PROACTIVE"]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 4/5 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "ratelimit_snapshot dropped at context-binding.ts default arm; render is CLI status-bar only (B1)"
purpose: |
  jun-6 account-ratelimit-snapshot 슬라이스(src/llm/ratelimit-snapshot/: parse.ts·notice.ts·
  policy.ts·store.ts)는 provider의 LIVE quota meter(anthropic-ratelimit-* / x-ratelimit-*)를
  파싱해 `ratelimit_snapshot` StreamEvent를 발화하지만, stdout 라인-모니터는 이 이벤트를
  빈 case로 무시했다("a richer surface renders it" — 그 surface가 없었음). P27이 그 surface를
  채운다.

  (1) src/apps/cli/ratelimit-notice.ts (신규) — closed StreamPort. `ratelimit_snapshot` 이벤트를
  RateLimitSnapshot로 재구성 후, surface 결정을 슬라이스가 이미 계산한 REACHED 신호에 위임:
  empty-window predicate(`remaining <= 0`) — policy.ts::proactiveDelayMs가 backoff를 도출하는
  바로 그 신호(provider가 window를 OUT으로 보고). 새 percent/threshold 도입 0. empty면
  status-bar.transient로 "⚠ 한도 reached · resets 3h"(가장 타이트한 empty-window reset) 페인트.
  malformed/partial(NaN/negative/missing)은 슬라이스 parser가 이미 undefined-field로 graceful-skip
  → predicate가 empty 미보고 → 무페인트. 모든 render는 try/catch로 감싸 throwing statusBar가
  tee'd recorder leg를 오염시키지 못함(tee isolation).

  (2) src/apps/cli/repl/cli-feature-config.ts — `ratelimitNotice.enabled` 필드 추가, gate는
  `isRatelimitNoticeEnabled(env)`(QUANTA_RATELIMIT_NOTICE, DEFAULT-OFF: unset=OFF, operator 명시
  opt-in). (3) src/apps/cli/repl/factories/turn-indicator.ts — knob ON일 때만 notice port를 기존
  TeeStream에 합류(indicator gate와 독립). 둘 다 OFF면 turnStream === stream verbatim(no tee) →
  stdout 빈 case byte-identical. (4) src/runner/knobs/knobs/ratelimit-notice.ts — SSOT 레지스트리용
  knob record(cli surface, hint category); apply는 PURE no-op(CLI surface-render flag, AgentConfig
  불변).
evidence:
  code:
    - src/apps/cli/ratelimit-notice.ts
    - src/apps/cli/repl/cli-feature-config.ts
    - src/apps/cli/repl/factories/turn-indicator.ts
    - src/runner/knobs/knobs/ratelimit-notice.ts
    - src/llm/ratelimit-snapshot/policy.ts
  adrs: []
  tests:
    unit:
      - tests/unit/cli/ratelimit-notice-hellgate.test.ts
      - tests/unit/cli/ratelimit-notice-wire-hellgate.test.ts
      - tests/unit/cli/ratelimit-notice-knob.test.ts
      - tests/unit/stream/ratelimit-snapshot-stdout-ignore-hellgate.test.ts
    integration: []
    contract: []
knobs: [ratelimit-notice]
deliberate_hold: null
notes: 'Negative invariants: (a) 새 percent/threshold 도입 0 — surface 결정은 오직 슬라이스가 계산한 empty-window(`remaining <= 0`) 신호(policy.ts) 재사용, "approaching at 80%" 류 quanta-invented 임계 없음. (b) recorder/budget 미오염 — `ratelimit_snapshot`은 output_progress와 동급 transient·non-accounting 신호로 jsonl-recorder도 skip. (c) stdout 라인-모니터는 영구 빈 case(라인 폭주 방지) — 표시는 in-place status-bar transient만. (d) header VALUE string(org-id 유출 위험) 절대 미전달 — notice는 numbers + type tag only. (e) DEFAULT-OFF: spinner와 달리 unset도 OFF(operator opt-in). (f) STANDALONE(F3 분리 완료): `session-bootstrap`이 snapshot store+header capture를 `QUANTA_RATELIMIT_NOTICE OR QUANTA_RATELIMIT_PROACTIVE`일 때 생성(공유 SSOT predicate `ratelimitNoticeWanted`), `stream-consume`이 reached-window `ratelimit_snapshot`을 양쪽 모드서 emit하되 pre-request `sleep`은 PROACTIVE에서만. ⇒ `QUANTA_RATELIMIT_NOTICE`만으로 capture+render 완결(companion 노브 불필요·요청 지연 없음). 테스트 `delta-ratelimit-reachability-hellgate`에 NOTICE-only emit+no-sleep 케이스 lock.'
