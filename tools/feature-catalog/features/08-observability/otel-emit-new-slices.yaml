purpose: |
  4 새 슬라이스 (error-routing / shell-snapshot / git-directives / stream-timeout)
  의 OTel metric 발화 unify. 슬라이스 fence 보존: 각 슬라이스에 narrow
  `metric-port.ts` + `no-op-metric.ts` 정의 → observability adapter
  (`wire-new-slices.ts`)는 type-only import으로 slice fence 통과. 6 canonical
  metric key 추가:
    - quanta.error.{kind,action} (counter)
    - quanta.stream.{idle_ms,timeout_action} (histogram + counter)
    - quanta.shell.snapshot_{duration_ms,bytes} (histogram x2)
    - quanta.git.directive (counter)
  thread-tools + stage1-store는 의식적 scope 외 (dashboard 영역).
