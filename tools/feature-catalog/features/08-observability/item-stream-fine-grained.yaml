knobs: [QUANTA_ITEM_STREAM]
deliberate_hold: null
notes: 'Two wiring seams from one CORE: session plane = createTurnStreamPort (src/host/runtime/internal/context-binding.ts); web plane = wireItemStreamTap (src/agent/optional-ports.ts, alongside wireItemLifecycleStream). Gate SSOT = itemStreamEnabled (src/shared/item-stream.ts). DISTINCT from item-lifecycle-stream / QUANTA_ITEM_LIFECYCLE (coarse in-proc AgentEvents) — this is the fine-grained WIRE plane. Removing this feature ⇒ also drop QUANTA_ITEM_STREAM from src/config/knob-inventory.ts.'
