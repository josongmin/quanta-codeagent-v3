surface_integration:
  cli: full
  web: full
  method: audited
  verified: "2026-06-14"
  evidence:
    cli: "session.v1 plane — createTurnStreamPort runs a fresh ItemStreamProjector per turn, emitting additive item.* events on the session protocol consumed by the CLI attach renderer"
    web: "web agent-state plane — wireItemStreamTap (final decorator) feeds a separate projector instance emitting agent-state item.* messages; drift ratchet proves both planes emit byte-identical cores"
purpose: 'T01 — project a turn INTERIOR as discrete fine-grained items (Codex app-server parity): item.started → 0..N typed deltas → item.completed, closed taxonomy (reasoning/commandExecution/fileChange/tool) + curated tool-name→item-type classifier (unrecognised ⇒ neutral `tool`, never mislabelled). A SINGLE stateful ItemStreamProjector turns the in-proc AgentEvent stream into ItemStreamCores; the two wire transports (session.v1 item.* via createTurnStreamPort, web agent-state item.* via wireItemStreamTap) each own an INSTANCE fed the same event order, so both emit byte-identical cores (drift ratchet). Default-OFF behind QUANTA_ITEM_STREAM: unset ⇒ no projector at either seam ⇒ byte-identical legacy turn-granular wire. abort/pause leave open items OPEN (never fabricate a completed).'
