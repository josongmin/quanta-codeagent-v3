id: patch-v4a-otel-emit
title: V4A apply_patch OTel emit — patch.op + fuzzy_match_tier per hunk
section: 8
subsystem: 텔레메트리 — quanta.patch.* 어휘 활성화
order: 93
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: integrated
telemetry_keys: [quanta.patch, quanta.patch.op]
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "observability-primitive", "absorbed:codex"]
depends_on: [apply-patch-v4a, patch-filesystem-port, assert-never-exhaustiveness, built-in-slash-commands, byte-stable-string-comparator]
config_refs:
  env: ["QUANTA_FS_JAIL"]
purpose: |
  `quanta.patch.op` (`add | update | delete | move`) + `quanta.patch.
  fuzzy_match_tier` (`exact | whitespace | fuzzy`) + `fuzzy_matched`
  3개 키를 ADR-0028 vocabulary 에서 activate. applier.ts 의 op-루프 안에
  PatchObserver seam 추가 — production 은 wrapper (`wrapObserver`) 가
  optional user-observer + canonical `emitOtel` 양쪽으로 fan-out, 둘
  중 어느 한 쪽이 throw 해도 다른 쪽 emit 은 계속 진행 + apply 의미는
  완전 독립. `move` op (rename + edit atomic) 은 update 와 별도
  카운트되어 dashboard 가 rename 을 구분 가능. PatchObservation discriminated
  union (`{op}` vs `{op, fuzzyMatchTier}`) 으로 tier 가 landed update/move
  hunk 에서만 emit.
evidence:
  code:
    - src/patch/applier.ts
    - src/patch/types.ts
    - src/patch/parser.ts
    - src/tool/apply-patch.ts
    - src/apps/cli/help-render.ts
    - src/shared/runtime-config.ts
  adrs: [28, 32]
  tests:
    unit:
      - tests/unit/patch-v4a-otel-emit-hellgate.test.ts
      - tests/unit/tool/apply-patch.test.ts
    integration: [tests/integration/apply-patch-tool.test.ts]
    contract: []
knobs:
  - 'applyPatch(patch, fs, observer?) — optional in-process PatchObserver (default omitted)'
deliberate_hold: null
notes: |
  Security invariant: patch text / file content / hunk lines / anchor strings
  / file paths 절대 emit 안 함 — categorical op 스칼라 + tier 스칼라만
  통과. `recordAttrs` 가 span sink 미등록 시 zero-allocation no-op
  이므로 production hot-path 비용 0. 442 expects / 17 hellgate cases.
  `.js` import suffix 제거 (src/patch/{index,parser,applier}.ts) — stale
  `.js` 미러가 `.ts` 보다 우선 잡히면서 PatchParseError 클래스 정체성
  쪼개지던 인시던트 동시 fix.
