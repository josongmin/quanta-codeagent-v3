id: instrument-shadow-tool-routing
title: ShadowOdb/Tool instrument wraps + AlertManager routing + Grafana provisioning
section: 8
subsystem: metrics export (ADR-0144/0158/0159)
order: 116
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: partial
owners: ["@songmin"]
labels: ["surface:observability", "tier:wrap"]
depends_on: [metrics-typed-port-slice, otel-sink, isregex-true, promise-race, shadow-odb-port]
purpose: |
  Closes 24-metric recipe coverage gap from ADR-0159: ShadowOdb 5-method wrap
  (`shadow.checkpoint.*` / `shadow.rewind.*{target}` / `shadow.diff.*{kind}` /
  `shadow.restore_partial.*` / `shadow.markVerified.*`) + Tool generic wrap
  (`tool.call.*{tool, ok}` + `tool.call.duration_ms{tool}`) + `instrumentTools`
  bulk helper. Operational closeout: AlertManager 3-tier routing config (PagerDuty
  critical / Slack warning / silent-log info, with inhibit rules to silence noise)
  + Grafana provisioning manifests (dashboards folder + Prometheus datasource).
