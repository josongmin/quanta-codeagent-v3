notes: |
  Pure forwarding wraps; slice never imports `@/observability` (plane-clean).
  init/listSnapshots/cleanup intentionally non-instrumented (read-mostly +
  low ROI). Inhibit rules suppress session-soft when session-hard fires,
  LlmTtftP95High when LlmFailureRateHigh fires (root-cause-first).
