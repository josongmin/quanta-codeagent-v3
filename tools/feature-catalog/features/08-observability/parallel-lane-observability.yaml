id: parallel-lane-observability
title: Parallel candidate-lane observability — progress bus + ambient context + recording labels
section: 8
subsystem: 벤치 병렬 lane 관측 — N개 candidate lane의 진행/녹음을 lane별로 분리
order: 55
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: none
modes: [batch]
configurable: integrated
owners: ["@songmin"]
labels: [surface:bench, observability-primitive]
depends_on: [bench-eval-driver, bench-trajectory-record]
config_refs:
  env: [QUANTA_BENCH_LANE_PROGRESS]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-07-09"
  evidence:
    cli: "The bench TTY renders a live bottom-anchored lane panel (lane-progress-renderer) subscribed to the progress bus; non-TTY hosts get a no-op bus so fork-site calls stay byte-identical."
    web: "no browser affordance — the progress bus is a surface-agnostic seam a future web view could subscribe to."
purpose: |
  The bench runs N candidates (repair-breadth, verify-select, location fanout)
  CONCURRENTLY. This slice makes those parallel lanes OBSERVABLE without coupling
  the fork sites to any renderer:
    - `lane-context.ts` — ambient AsyncLocalStorage lane id, so subsystems deep in
      the agent run (tool executor, per-turn recorder debug drain) know WHICH lane
      they are under without threading a parameter.
    - `lane-progress.ts` — a D-lite progress event bus emitted at the fork sites;
      emit is a NO-OP when nothing is subscribed (default-OFF byte-identical for
      non-interactive / library hosts).
    - `lane-progress-renderer.ts` — the CLI subscriber: a TTY live-redrawing panel
      (one line per active lane) or a plain log fallback, coordinated with other
      stderr through the TerminalIo seam.
    - `with-recording-lane.ts` — a SOLID `LLMPort` decorator that stamps a per-lane
      RECORDING LANE label, so concurrent candidate turns do not interleave
      indistinguishably on ONE shared recording port (feeds bench-trajectory-record).
evidence:
  code:
    - src/shared/lane-context.ts
    - src/runner/batch/eval/lane-progress.ts
    - src/apps/bench/lane-progress-renderer.ts
    - src/llm/with-recording-lane.ts
  adrs: []
  tests:
    unit:
      - tests/unit/lane-progress-hellgate.test.ts
    integration: []
    contract: []
knobs: [QUANTA_BENCH_LANE_PROGRESS]
deliberate_hold: null
notes: |
  Bench-scoped observability primitive. L3 = wired-with-tests: the renderer is wired
  into the bench TTY entry (bench-entry-tty-wiring) and the progress bus is emitted at
  the repair-breadth / verify-select fork sites, with a lane-progress hellgate. The
  renderer is ON by default in a bench TTY (QUANTA_BENCH_LANE_PROGRESS=0/off disables
  it, falling back to plain log lines); for non-interactive / library hosts the
  emit-is-no-op-when-unsubscribed contract keeps the fork sites byte-identical.
  Recording-lane labels feed the sibling bench-trajectory-record cassette so parallel
  candidate turns stay attributable.
