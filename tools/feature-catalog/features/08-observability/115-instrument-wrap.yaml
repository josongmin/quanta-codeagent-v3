id: instrument-wrap
title: Metrics instrument wrap helpers + Grafana + alerts + E2E coverage
section: 8
subsystem: metrics export (ADR-0144/0158)
order: 115
maturity: L2
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: partial
owners: ["@songmin"]
