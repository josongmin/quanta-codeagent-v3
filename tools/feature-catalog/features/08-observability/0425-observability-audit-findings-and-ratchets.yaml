notes: |
  Reusable discipline: 3 rounds layered + adversarial PROVE WRONG (refute) +
  bank clean units under API instability(ADR-0389 salvage) + confirm vs
  change(intent-vs-defect documented via `UNBOUNDED:` markers) + ratchet the
  class not the instance. See [[may-29-audit-3r-fix-pass]] (memory).
