purpose: |
  Waves 1-5 observability stack(ADR-0394~0421) end-to-end live 도달 후
  3-round adversarial 감사. R1: correctness/lifecycle/coverage/hygiene 4 lens
  parallel. R2: refutation + malicious input + concurrency 3 lens parallel.
  R3: synthesis + recipe.

  6 structural fix:
  - F1 (HIGH): ADR-0409 post_compact wire dead seam — `buildPostCompactEmit`
    helper + 4-callback wire(proactive) + reactive emit inline(NO-THROW,
    reason:"ptl_reactive"). [3e15001d]
  - F2 (MED): mailbox `renderMessage` line-injection — `escapeBodyForLine`
    `\r\n|\r|\n` → 리터럴 `\n`. [1510d80d]
  - F3-asm (MED): approval `requests` Map unbounded growth — `maxRetained`
    1024 + LRU evict on settle-later. [156d768b]
  - F3-obj (MED): objective `successCriteria` / `blockers` unbounded —
    `MAX_CRITERIA_PER_OBJECTIVE=256` + `MAX_BLOCKERS_PER_OBJECTIVE=64`.
    [a7eb0d8c]
  - F5 (P1): effort keyword false positive(`myUltrathinkVariable` 트리거) —
    `\b…\b` word-boundary anchor + negative/positive hellgate. [85406bdb]
  - F6 (MED): attribution banner literal-anchor drift — 4 cross-module
    banner-pin tests(bash bg/await/kill + subagent launch). [27c85264]

  3 structural ratchet(`tests/unit/observability-audit-ratchet.test.ts`,
  ~10ms each, every CI):
  - G1 (F1-class): `loop.ts` MUST contain 4 post_compact wire markers
    (`buildPostCompactEmit(`, `type: "post_compact"`, `recoveryReason:`,
    `objectiveSetNextActions`). 하나라도 빠지면 F1 재발.
  - G2 (F3-class): every `src/agent/<slice>/store.ts` MUST be bounded
    (`maxRetained` / `MAX_*` / `evictIfOverCap`) OR carry explicit
    `// UNBOUNDED: <reason>` comment. 새 unbounded store 즉시 CI fail.
  - G3 (F6-class): every literal anchor in `run-ledger-attribution/matchers.
    ts`(`startsWith` / `.test`) MUST appear verbatim in `src/tool/**` 또는
    `src/subagent/**`. 새 banner 자동 발견 — ratchet 수정 불필요.
