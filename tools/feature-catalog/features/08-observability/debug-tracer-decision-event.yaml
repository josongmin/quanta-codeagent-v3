notes: |
  EXACT-OPTIONAL discipline on `DecisionEvent` 필드 (absent fields는 omitted,
  `undefined`-set 절대 금지). Metadata는 caller-sanitised (secret/PII scrub은
  ADR-0078 redactValue가 content plane에서 처리 — tracer는 100자 truncate만).
  No full input/output in tracer line — summary (length, kind, top-level key)
  only; 풀 payload는 envelope JSONL (ADR-0034)이 보유. Persistent ring buffer
  없음 (purely streamed) — `/debug` invoke 전 fire한 event는 retroactive 못
  봄 (Codex/Cursor와 같은 posture). Cross-session 집계는 OTel collector path
  (ADR-0032 + ADR-0268) 또는 JSONL 직접 projection (`/inspect` / `/replay`)
  로만.

  Categories closed union: `tools` / `decisions` / `llm` / `memory` / `plan`
  / `stream` / `other`. `QUANTA_DEBUG=all` 단축 + comma-separated subset.
  parseDebugEnv는 non-TTY에서 빈 filter return (boot-time gate).
