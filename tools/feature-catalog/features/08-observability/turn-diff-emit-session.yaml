notes: |
  Closed-port — the GitRunner injects via WireTurnDiffOpts so a fake
  runner drives adversarial cases. No back-reference into the loop; the
  loop calls startTurn/endTurn and pushes the returned event onto its
  stream. Future loop integration can grow a typed
  `gitObservability?: GitObservability` field on its run config and
  forward the same calls (no breaking change to this surface required).

