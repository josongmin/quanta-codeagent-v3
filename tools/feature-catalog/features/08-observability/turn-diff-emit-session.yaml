purpose: |
  Stateful per-session adapter orchestrating the
  `captureTurnStart / computeTurnDiff / buildTurnDiffEvent` trio from
  `@/agent/turn-diff` into a turn-scoped state machine. `startTurn(i)`
  snapshots the HEAD SHA for turn i (idempotent — a second call for the
  same turnIndex keeps the original anchor, so the loop can re-enter after
  a side-conversation without re-probing git or losing the anchor).
  `endTurn(i)` computes the diff between the recorded anchor and the
  current state and returns an `AgentEvent` of type `turn_diff_updated`
  (or null when no anchor was recorded / git failed). Per-turn state
  isolation — different turns never share state. Hard invariant: all git
  failures collapse to null; the wiring NEVER throws.
