purpose: |
  Pure (no network) versioned static price table — and since MR-01/A4
  (aug-30) the ONE formula: `normalizeUsage` resolves each provider's
  cache-token convention into disjoint buckets, `priceUsage` prices them,
  and `costUsd` survives only as a compatibility wrapper. The budget ledger
  DELEGATES to the same formula (finite-positive sanitize first, operator
  overrides projected through). Every derived cost stamps `PRICING_VERSION`;
  unknown model returns `null` from `costUsd` / `pricingKnown:false` from
  `priceUsage` (NOT an error, NEVER a silent $0-as-measured). A call-site
  census ratchet pins WHO may price (runtime: emit-helpers + the cost
  preflight; offline report tier enumerated by name).
  Crucially encodes the provider-aware semantics: Anthropic's `input_tokens`
  EXCLUDES cache reads (disjoint bucket — total billed input = input +
  cacheRead), while OpenAI's `prompt_tokens` ALREADY INCLUDES `cached_tokens`
  (subset — adding cacheRead again double-counts). The `providerOf(model)`
  helper derives the billing provider from the model name (`gpt`/`o1`/`o3` ⇒
  openai, default ⇒ anthropic) so the fix needs no cross-slice change. Per-
  model `cacheReadPerM` is set explicitly so the provider-documented
  discount (OpenAI ≈ 0.5×, Anthropic ≈ 0.1×) stays auditable.
