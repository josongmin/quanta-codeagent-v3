    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  ADR-0131 §1 의 frontmatter 권장 형식:
  ```
  ---
  metadata:
    outcome: success
    outcome_evidence: src/foo.ts:42
  ---
  ```
  Lint(W1/W2)는 권장 위반을 WARNING으로만 통지 — 강제 X (opt-in 채택률 우선).
