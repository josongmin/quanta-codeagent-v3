id: memory-fence-cleanup
title: @/memory → @/llm slice fence cleanup — dead REMOVE-ME stub deleted
section: 5
subsystem: 장기 메모리 — slice boundary hygiene (Slice S9 Part A)
order: 75
maturity: L4
status: stable
purpose: |
  Slice S9 Part A — delete the orphan `REMOVE-ME (verify biome fence)`
  stub at `src/memory/consolidate/phase2-llm.ts:30-40`:
  `import { assembleFromEvents as _verify } from "@/llm"` plus its
  `const _useVerify = _verify` dead alias. The stub had zero consumers
  (verified via grep) yet violated the documented `@/memory` → `@/llm`
  slice fence (RFC §3.1; biome `noRestrictedImports` for src/memory/**).
  Phase2-llm uses the structurally-typed `Phase2Summarizer` callback
  (declared in `consolidate/types.ts`) so the entire `@/memory` slice
  can be exercised without importing `@/llm` — the stub was solely a
  debugging artifact that survived a prior fence-verification round.
  Re-introducing it is now blocked structurally: the hellgate test
  scans every `src/memory/**.ts` file for `from "@/llm"` and fails on
  any match; the biome fence is the second line of defense.
evidence:
  code:
    - src/memory/consolidate/phase2-llm.ts
    - src/memory/consolidate/phase2-llm.js
    - src/memory/consolidate/types.ts
    - biome.json
  adrs: [68]
  tests:
    unit:
      - tests/unit/memory-fence-no-llm-import-hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold:
  reason: |
    The fence is structural (biome lint + static-scan test). There is no
    runtime knob — a future stub MUST be rejected by both layers.
  promotion_path: |
    Any wiring that genuinely needs `assembleFromEvents` belongs in the
    composition root (`apps/cli/internal.ts` or `apps/agent/index.ts`):
    the surface constructs a `Phase2Summarizer` callback there and
    injects it via `new LlmPhase2Port(callback)`. See the verbatim
    example in `src/memory/consolidate/types.ts#Phase2Summarizer` JSDoc.
notes: |
  Pairs with the broader slice-boundary work (RFC §3.1). The fence test
  also catches the bare-alias typo `@llm` — useful when a future
  refactor changes the import alias convention.
