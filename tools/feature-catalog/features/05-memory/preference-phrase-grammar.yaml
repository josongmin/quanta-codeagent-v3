purpose: |
  Codex memory의 feedback-type 메모리 body 컨벤션 흡수 — 자유형 paraphrase
  대신 4-field 구조화 grammar:

    **When the user said** "코드 레벨로만"     ← literal quote (Korean/English 보존)
    **They meant**: …                          ← author's interpretation
    **Evidence**: src/foo.ts:42 (3 corrections same week)
    **Confidence**: high | medium | low

  파서(parsePreferenceSignal)는 PURE — I/O / clock / LLM 없음. PreferenceSignal
  { quote?, evidence?, confidence? } 반환. 패턴 누락 시 빈 객체 ({}). 결코 throw X.

  핵심 의사결정:
    - Quote는 **literal slice** — 정규식은 lowercased view 매칭, slice는 ORIGINAL
      → Korean / typographic / case 변형 byte-for-byte 보존
    - Confidence는 **count-based** (1→low, 2→medium, 3+→high) — subjective
      scoring 금지 [[no-heuristics-only-validated]]
    - Explicit `Confidence: <level>` 마커 ⇒ count derivative 무시 (author
      intent 우선)
    - Evidence는 line-bound 캡처 — multi-paragraph 끌어들이지 않음

  Lint (`lintMemoryFrontmatter`):
    - W1: outcome 있는데 evidence 없음
    - W2: evidence가 file:line / URL / SHA 형식 아님
    - W3: body에 `\d+% (done|complete|finished)` percentage-grace 패턴
  전부 WARNING — 결코 ERROR/THROW X. errors: [] 영구 비어있음.

  Out of scope: cross-session phrase corpus indexing, ML clustering
  ([[no-heuristics-only-validated]]와 충돌, ADR-0131 §Out-of-scope).
