purpose: |
  RETIRED 2026-08-25 (ADR-0553). This entry is kept as the tombstone so the
  catalog history stays honest; it no longer describes shipped behavior.

  What it was: the ADR-0159 "composition-root wire" — `buildRetrievalStackCore`
  (deleted SEP5-09; live factories are `createEmbedderFromEnv` /
  `createRerankerFromEnv`),
  `rankWithRetrievalStack` (memory↔retrieval bridge), `runLocalizeHybrid`
  (localize bridge, already deleted jul-3 D2), an `AgentConfig.retrievalStack`
  slot, and the host-root `QUANTA_RETRIEVAL_HYBRID="1"` env gate.

  Why it was deleted instead of wired: the slot was WRITTEN at the host root
  and READ by nobody; the bridge had zero non-test callers; and even when
  called it could not change a recall result — memory's `rankEntries` clips
  to `query.limit` BEFORE the bridge's rerank stage, and the stock stack's
  default reranker is `identity` (measured relevant-in-top-5: 1 → 1).
