depends_on: [memory-distill-redaction-fence]
configurable: static
purpose: |
  Structural port that lets the @/memory slice emit phase1 (per-thread
  distill), phase2 (global consolidator), and recall (rank) telemetry
  WITHOUT importing @/observability — preserving the slice-isolation
  invariant documented in `src/memory/consolidate/constants.ts:53-64`
  (and enforced by `memory-fence-stays-clean-hellgate`). The port surface
  carries ONLY counts, latencies, and outcome enums; entry text, ranking
  scores, query content, and any redaction internals are STRUCTURALLY
  excluded — the event interfaces enumerate fields, runtime allow-list
  sets (`PHASE1_EVENT_ALLOWED_KEYS` / `PHASE2_EVENT_ALLOWED_KEYS` /
  `RECALL_EVENT_ALLOWED_KEYS`) freeze that surface, and
  `FORBIDDEN_TELEMETRY_KEYS` is asserted disjoint at unit-test time.
  Default-OFF: a Phase1/Phase2/recall call with no `telemetry?` argument
  emits nothing and behaves byte-identically to the legacy path.
