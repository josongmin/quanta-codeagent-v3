id: stage1-store-agent-port
title: ADR-0216 Stage1StorePortV2 (agent-side, no-throw, 4-verb persist seam)
section: 5
subsystem: Stage1 outputs persist — agent-side composition default
order: 216
maturity: L3
status: stable
ui_surfaces: [n-a]
monitoring: integrated
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: [phase1-stage1-store, consolidator-session-hook]
purpose: |
  Agent-side seam for persisting Phase 1 `stage1_outputs` rows. Closes the
  R1 false-positive where the SQL INSERT was wired in source (`runPhase1`
  → `store.upsert`) but a host opting into `memoryConsolidator.enabled`
  without supplying a `store?` would silently skip with
  `reason:"store_missing"`.

  `Stage1StorePortV2` — 4-verb closed seam:
    - `write(input)`               — upsert by threadId (Phase 1 entry).
    - `read(threadId)`             — fetch by threadId.
    - `incrementUsageCount(tid)`   — atomic +1 (picker bumps after using).
    - `selectForPhase2(threadIds)` — mark flag + bump usage atomic per row.

  Two adapters:
    - `inMemoryStage1Store()` — zero-dep reference; serves as the default
      so the wire is never silently inert.
    - `sqliteStage1Store(db)` — wraps `@/memory#Stage1Store` (the
      canonical SQLite class that owns `ensureConsolidateSchema`); the
      wrapper converts throws → `Stage1Result<T>` discriminated union so
      the agent layer's NO-THROW invariant propagates through.

  Sibling of ADR-0207 (`src/memory/stage1-store/`, parallel-agent slice)
  — different shape (async vs sync, `Stage1Result` vs throw, single-row
  vs LRU-prune). Two ports targeting different consumers; possible
  consolidation in a later iteration.
