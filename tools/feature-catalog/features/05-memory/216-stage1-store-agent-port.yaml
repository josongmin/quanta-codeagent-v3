notes: |
  Upsert semantics mirror the canonical `Stage1Store.upsert` — re-writing
  a thread REPLACES the prior row (including CLEARING a previously-set
  outcome enum). exactOptionalPropertyTypes: `outcome` / `outcomeEvidence`
  KEYS are OMITTED when absent (no `field: undefined` leak; test [10]
  enforces). Constructor MAY throw on schema migration failure
  (host bootstrap loud-fails on disk corruption) — public surface methods
  never throw.
