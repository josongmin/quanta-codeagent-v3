purpose: |
  ADR-0207/0216 Stage1 SELECT/reuse helper. It can consume a supplied Stage1
  store record and mark the record selected for Phase 2, while a missing store
  performs no I/O. It remains intentionally unconsumed by the production Phase
  2 composition path. Vendor-rule glob loading was split out of this entry: it
  has an independent live, QUANTA_VENDOR_RULES-gated consumer.
