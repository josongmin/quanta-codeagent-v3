purpose: |
  Wave 3 wire — (a) ADR-0207/0216 stage1 store 의 SELECT 측면을 Phase 2
  consumer 가 실제로 소비 (이전엔 INSERT 만 wire, SELECT 는 dormant);
  (b) ADR-0205 vendor-rules-detector 가 발견한 vendor 룰의 glob 필터를
  실제 rules-tree 로딩 경로에 splice. 두 wire 모두 default-OFF (host 가
  명시적으로 stage1 store / vendor detector port 를 주입할 때만 동작).
  부재 시 byte-identical pre-wire.
