notes: |
  Intentionally distinct from `WorkingState.snapshot` (agent/working-state.ts)
  which DOES deep-copy because its payload is host-mutated. tokenEstimate is
  the same chars/4 heuristic used elsewhere in the loop for compaction
  triggers — not a real tokenizer.
