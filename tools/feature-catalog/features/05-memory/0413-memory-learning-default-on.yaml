purpose: |
  Flip memory learning from default-OFF to default-ON via one canonical
  surface-agnostic factory buildMemoryForSession(env, override?) that resolves
  all three slots (store / config / auto-trigger) in one place. Default-ON is
  backed by a VOLATILE InMemoryStore — zero disk side effects; the on-disk
  SqliteStore stays an explicit QUANTA_MEMORY=sqlite opt-in. Single-knob escape
  hatch (QUANTA_MEMORY=off, or override.storeDisabled for bench/replay) collapses
  the bundle to {} — byte-identical to the legacy three-site default-OFF. The
  bench driver's capabilityManifest.memory=false stays as a second guard. Pure
  w.r.t. env (surface owns the read), keeping the runner→apps slice direction.
evidence:
  code:
    - src/runner/assemble/memory-factory.ts   # buildMemoryForSession + types
    - src/runner/assemble/index.ts            # barrel export
    - src/apps/cli/internal.ts                # buildStore delegation + env doc
    - src/memory/auto-trigger/wire.ts         # auto-trigger slot
    - src/apps/agent/index.ts                 # unified-agent composition
  adrs: [413]
