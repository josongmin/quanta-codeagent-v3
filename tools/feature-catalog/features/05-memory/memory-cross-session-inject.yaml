purpose: |
  RETIRED 2026-08-25 (ADR-0556). This entry is kept as the tombstone so the
  catalog history stays honest; it no longer describes shipped behavior.

  What it was: ADR-0282's session-start read path — `DefaultCrossSessionInjector.
  selectForInject({maxBytes})` over a JSONL mirror (`JsonlFileStage1Store`,
  ADR-0207) of the Phase-1 sqlite rows, filtered to `selectedForPhase2 &&
  usageCount ≥ 1`, rendered as a `## Cross-session memory (auto)` block into
  the cached `session_ctx` prompt section. The mirror row's `selectedForPhase2`
  was set at session end by a lexical-overlap gate (ADR-0281, tuned by
  `QUANTA_MEMORY_THRESHOLD` / `QUANTA_MEMORY_MIN_USAGE`).

  Why it was deleted instead of tuned: the gate scored Jaccard(candidate, UNION
  of all siblings' tokens) — a ceiling that shrinks as the corpus grows
  (measured 0.03–0.15 against the 0.7 threshold); `touch()`, the only
  `usageCount` raiser, had zero production callers; the real store held 15 rows
  with 0 eligible. Every default-ON session paid a second store write and
  injected an EMPTY block. Phase 2's `memory_summary.md` (System C,
  `memory-summary-aggregate-coalesce`) already carries every fact those raw
  summaries held, into the SAME `session_ctx` section, LLM-deduplicated.
  Reviving B would have put ~4.5× C's bytes of stale raw summaries into the
  cached prefix for zero new facts. Re-deriving a threshold from n=15 is an
  arbitrary heuristic (rejected).
