notes: |
  Retired, not held: there is no promotion path for this entry. A future
  relevance-scored session-start inject is a NEW catalog entry and must (per
  ADR-0556) read a source that is NOT already summarized into
  `memory_summary.md`, use a threshold measured on real data (not a guessed
  constant), and prove a non-empty, non-duplicate block on a fixture before it
  touches the cached prefix. The H16 auto-dream (`auto-dream`) survives; it now
  reads the sqlite `Stage1StorePort` directly.
