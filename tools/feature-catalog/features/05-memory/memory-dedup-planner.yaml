notes: |
  Threshold defaults live in `dedup.ts` as module-level constants — tuned to
  catch paraphrase without false merges. Sibling planner to
  `memory-eviction-planner` (post-save sweep). Both are pure / no IO so the
  whole consolidation pipeline is unit-testable without an adapter.
