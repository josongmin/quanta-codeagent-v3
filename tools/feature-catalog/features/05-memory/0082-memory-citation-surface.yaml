id: memory-citation-surface
title: memory_citation provenance surface (ADR-0082)
section: 5
subsystem: L2 long-term memory recall provenance
order: 82
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "absorbed:codex", "held-promotion"]
purpose: |
  Surface "which record was placed in this run's prompt window, where, with what
  score". Provenance signal (placement = citation), NOT a heuristic scan of the
  assistant's response. Closed where-enum
  {system_prompt|reminder_tail|tool_result_injection}; today every v3 citation
  is `reminder_tail` (memory always rides the trailing <system-reminder> user
  message — the cached system prefix carries no per-turn data, ADR-0003).
  AgentOutcome.memoryCitations is OMITTED when no store is wired OR no recall
  hits land across the run → byte-identical for legacy callers.
evidence:
  code:
    - src/agent/types.ts        # MemoryCitation + AgentOutcome.memoryCitations
    - src/agent/memory.ts       # RecallDeps.onPlaced + PlacedRecord emit
    - src/agent/loop.ts         # run-scoped accumulator + sink + finish() surface
    - src/memory/ranking.ts     # scoreEntry export (weighted-sum for citation)
    - src/memory/index.ts       # @/memory re-export of scoreEntry
    - src/agent/index.ts        # @/agent re-export of MemoryCitation/PlacedRecord
  adrs: [82]
  tests:
    unit:
      - tests/unit/agent/memory-citation-accumulator.test.ts
      - tests/unit/memory-hellgate.test.ts
      - tests/unit/ranking.test.ts
    integration:
      - tests/integration/memory-citation-end-to-end.test.ts
    contract: []
knobs:
  - "AgentConfig.store (default undefined) — when absent the accumulator is not allocated; outcome.memoryCitations omitted (byte-identical)."
  - "AgentConfig.memory.recallLimit (default 5) — budget that decides placement; the limit IS the filter that produces citations."
deliberate_hold:
  reason: |
    Three placement seams reserved but unused today:
     - system_prompt placement (today unused — memory only rides reminder_tail per ADR-0003 cache-prefix discipline).
     - tool_result_injection placement (reserved for future side-conv / Codex-style tool wrapper).
     - no heuristic response-text scan: 'cited iff placed-in-prompt' is the ONLY contract.
  promotion_path: |
    Wire system_prompt or tool_result_injection placement on a real consumer path
    (with corresponding accumulator emit point) to expand the where-enum coverage.
notes: |
  PlacedRecord.score equals the weighted-sum scoreEntry computes (`vector +
  text + tag + freshness + importance + access + tier`); identical to the
  ranking key. Reinforcement (accessCount bump) means same-record cross-turn
  scores may drift — that's the intended best-effort signal, not a bug.
