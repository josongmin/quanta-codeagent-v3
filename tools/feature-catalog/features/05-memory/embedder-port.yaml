id: embedder-port
title: EmbedderPort — pluggable embedding provider seam (OpenAI / Null / Caching)
section: 5
subsystem: 장기 메모리 — embedding provider seam
order: 51
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: [sqlite-persistent-store, memory-dedup-planner]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "derived: EmbedderPort + OpenAI/Null/Caching impls reachable from CLI entry"
    web: "pure internal embedding-provider port (src/memory/ports.ts, src/agent/memory-embedder.ts) — pluggable seam for recall vectors, no UI affordance on any surface"
purpose: |
  The memory slice owns the structural EmbedderPort interface (so it stays
  free of any LLM-provider import per slice-isolation), while concrete
  implementations live in @/agent (the only cross-slice importer). Three
  shipped providers: OpenAIEmbedder (batched real provider, wraps transport
  failures in LLMError so callers can degrade to lexical-only recall),
  NullEmbedder (offline no-op → empty vectors → recall falls back to
  lexical+tag+freshness signals), and CachingEmbedder (in-proc memoisation
  wrapper). Dimension drift is tolerated downstream — stored vectors of
  unexpected size are treated as "no embedding" by the ranking layer, not
  thrown. Batching preserves input order so the caller can pair texts back
  to their ids.
evidence:
  code:
    - src/agent/memory-embedder.ts
    - src/memory/types.ts
    - src/memory/ports.ts
  adrs: []
  tests:
    unit:
      - tests/unit/memory-embedder.test.ts
    integration: []
    contract: []
knobs:
  - name: OpenAIEmbedderOptions.model
    default: 'provider''s small variant'
    purpose: 'embedding model id'
  - name: OpenAIEmbedderOptions.batchSize
    default: '96'
    purpose: 'request batching'
  - name: OpenAIEmbedderOptions.baseURL
    default: 'undefined'
    purpose: 'provider endpoint override'
deliberate_hold: null
notes: |
  Slice-isolation invariant: the memory slice cannot import @/llm or any
  provider SDK. Structural typing on EmbeddingsClient lets unit tests inject
  a fake client without touching the network or the real SDK constructor.
  Pairs with `sqlite-persistent-store` (vector BLOB column) and
  `memory-dedup-planner` (semantic dup channel).
