notes: |
  PersistentStorePort 두 구현(InMemoryStore + SqliteStore)이 같은 계약을 byte-identical
  히 충족 — 테스트는 in-memory(결정성), runtime은 sqlite(영속성). bun:sqlite는 Bun
  내장이므로 외부 의존 0. WAL 동시성 모드, prepared statement 캐싱. Codex `logs_2.sqlite`
  retention 패턴(memory `codex-logs-retention-pattern`)은 다른 트랙 — 본 모듈은 메모리
  entry의 진짜 영속 저장.
