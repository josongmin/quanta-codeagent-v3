purpose: |
  Long-term 메모리 entries의 disk-backed PersistentStorePort 구현. `bun:sqlite` 사용
  (외부 dep 0, Bun 내장). `rankEntries`(ranking.ts)와 함께 의미 검색 + 시간 기반 fade.
  in-memory adapter는 테스트/dev용, sqlite adapter는 production 영속성. 동일
  PersistentStorePort 계약 — adapter swap이 byte-identical (테스트는 in-memory로
  결정성 유지, runtime은 sqlite). 동시 R/W는 SQLite WAL로 처리 — bun:sqlite의 prepared
  statement 캐싱으로 hot path 효율. Update는 identity/store clock을 제외한 explicit
  `MemoryPatch`만 허용하며 두 adapter가 같은 runtime validator를 사용한다. Omitted
  field는 보존되고 `embedding: undefined`만 명시적 BLOB clear로 해석된다.
