    integration: []
    contract: []
knobs:
  - ChunkBucketOptions.bucket — identity / small-600 / medium-2400 / large-4000
  - ChunkBucketOptions.overlapRatio — sliding-window overlap, default 0.10
  - ChunkBucketOptions.tokenizer — injected TokenizerPort
deliberate_hold: null
notes: |
  Per-query LEARNED chunk size is intentionally out of scope (negative
  invariant in ADR-0159 — needs training loop + offline data). Loop guard
  caps at 1M iterations to defang a degenerate tokenizer that always
  returns 0 — honest tokenizers + typical doc sizes (≤ ~10 MB) never
  approach the cap.
