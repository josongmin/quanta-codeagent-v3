surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 6/6 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure internal semantic-index backend (real embedder + pluggable vector store, src/runner/assemble/search-index-backend.ts) — env-knob-configured indexing infra, no user-visible affordance on any surface"
purpose: |
  startIndexer가 더 이상 placeholder hashEmbed(64-d FNV)만 쓰지 않는다 —
  ADR-0261 embedder 레지스트리(createEmbedderFromEnv: openai/voyage/cohere/
  ollama/headless)에 wired. env 미설정 / embedder null ⇒ hashEmbed default,
  real provider failure는 typed error로 semantic backend를 중단하며 hash나
  headless vector로 fallback하지 않아 sqlite/Lance/Qdrant 공간을 오염시키지 않는다.
  또 semantic backend가 ADR-0261 store registry를 실제로 소비한다:
  `QUANTA_VECTOR_STORE ∈ {in-memory, sqlite, lance, qdrant}` 또는 legacy
  `QUANTA_INDEX_PERSIST=on` ⇒ 해당 store로 codebase index를 올린다.
  explicit store misconfig/negotiation failure는 legacy in-memory로 숨기지
  않고 semantic backend를 hard-disable한다. Lance/Qdrant path는
  logical collection과 전체 embedding-space identity로 physical namespace를
  파생하고, manifest owner를 provider + redacted canonical-endpoint fingerprint + physical namespace로
  분리한다. caller injection은 table/collection/endpoint authority를 덮어쓸 수
  없다. durable local manifest/owner sidecar가 없으면 첫 remote write 전에
  거부하며, 각 remote upsert 전에 pending intent를 먼저 기록하고 성공 후
  committed로 승격해 write-accept 뒤 process crash도 재시도/삭제 가능하게 한다.
  stale-chunk reconcile + delete-ack-gated retry retention + embed/query latency
  metrics를 포함한다. search wire는 full-corpus pass가
  아니라 scan mutation batch만 reconcile한다. default-OFF: store/embedder
  knob 미설정 ⇒ in-memory + hashEmbed ⇒ byte-identical.
