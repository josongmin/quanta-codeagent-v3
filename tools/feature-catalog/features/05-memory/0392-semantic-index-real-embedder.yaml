deliberate_hold: null
notes: |
  lexical search는 default — semantic은 보조. real embedder 미설정 시
  hashEmbed default namespace를 사용해 lexical 동작은 byte-identical이다.
  provider를 명시적으로 고른 후 실패하면 다른 embedder로 fallback하지 않는다. store를 명시적으로 고른 후
  misconfig되면 fallback indexing 대신 disabled/no-op로 fail-closed한다.
  Lance contract proof는 두 층이다: integration rail은 stateful in-proc
  REST fixture로 live wire/restart-safe manifest branch를 deterministically
  고정하고, contract rail은 real `python+lancedb` backing을 compatible
  HTTP shim 뒤에 둔다. 따라서 현재 closure는 “real Lance backing semantics”
  기준이지, 공식 daemon binary parity claim은 아니다. Unit owner rails는
  hostile identity override, endpoint/provider rotation, sidecar secret 비노출,
  remote-accept 이후 local commit 전 crash를 각각 고정한다.
