id: semantic-index-real-embedder
title: semantic index 실 embedder + pluggable vector-store backend (ADR-0392, ADR-0424)
section: 5
subsystem: 메모리 — semantic search backend
order: 392
maturity: L3
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: [search-pipeline-from-env]
config_refs:
  env:
    - "QUANTA_EMBED_PROVIDER"
    - "QUANTA_VECTOR_STORE"
    - "QUANTA_INDEX_PERSIST"
    - "QUANTA_INDEX_DB_PATH"
    - "QUANTA_LANCE_BASE_URL"
    - "QUANTA_LANCE_TABLE"
    - "QUANTA_QDRANT_COLLECTION"
purpose: |
  startIndexer가 더 이상 placeholder hashEmbed(64-d FNV)만 쓰지 않는다 —
  ADR-0261 embedder 레지스트리(createEmbedderFromEnv: openai/voyage/cohere/
  ollama/headless)에 wired. env 미설정 / embedder null ⇒ hashEmbed default,
  real provider failure는 SAME-DIM deterministic headless fallback으로
  degrade되어 fixed-dim sqlite/Lance/Qdrant store와 충돌하지 않는다.
  또 semantic backend가 ADR-0261 store registry를 실제로 소비한다:
  `QUANTA_VECTOR_STORE ∈ {in-memory, sqlite, lance, qdrant}` 또는 legacy
  `QUANTA_INDEX_PERSIST=on` ⇒ 해당 store로 codebase index를 올린다.
  explicit store misconfig/negotiation failure는 legacy in-memory로 숨기지
  않고 semantic backend를 hard-disable한다. Lance/Qdrant path는
  manifest-backed stale-chunk reconcile + delete-ack-gated retry retention +
  embed/query latency metrics를 포함한다. search wire는 full-corpus pass가
  아니라 scan mutation batch만 reconcile한다. default-OFF: store/embedder
  knob 미설정 ⇒ in-memory + hashEmbed ⇒ byte-identical.
evidence:
  code:
    - src/runner/assemble/search-index-backend.ts
    - src/runner/assemble/search-pipeline.ts
    - src/retrieval/engines/embedder/registry.ts
    - src/retrieval/engines/store/registry.ts
    - src/retrieval/engines/store/sqlite-vss-store.ts
    - src/retrieval/engines/store/lance-store.ts
  adrs: [392, 424, 261]
  tests:
    unit:
      - tests/unit/runner/search-index-backend.test.ts
      - tests/unit/runner/search-pipeline.test.ts
    integration:
      - tests/integration/search-pipeline-lance-wire.test.ts
    contract: []
knobs:
  - name: QUANTA_VECTOR_STORE
    type: enum
    values: [in-memory, sqlite, lance, qdrant]
    default: '<unset>'
    purpose: 'select the live semantic index backend; unset preserves the legacy in-memory default unless QUANTA_INDEX_PERSIST=on'
  - name: QUANTA_LANCE_BASE_URL
    type: string
    default: '<unset>'
    purpose: 'LanceDB REST base URL when the semantic backend opts into QUANTA_VECTOR_STORE=lance'
  - name: QUANTA_LANCE_TABLE
    type: string
    default: '<unset>'
    purpose: 'LanceDB table name when the semantic backend opts into QUANTA_VECTOR_STORE=lance'
deliberate_hold: null
notes: |
  lexical search는 default — semantic은 보조. real embedder 미설정 시
  hashEmbed로 graceful fallback이라 사용자가 embedder 모르고 쓰는 경우에도
  lexical 동작 byte-identical. provider를 명시적으로 고른 후 실패하면
  fallback도 같은 차원(dim)을 유지한다. store를 명시적으로 고른 후
  misconfig되면 fallback indexing 대신 disabled/no-op로 fail-closed한다.
