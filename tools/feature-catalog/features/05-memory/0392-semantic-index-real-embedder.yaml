id: semantic-index-real-embedder
title: semantic index 실 embedder + pluggable vector-store backend (ADR-0392, ADR-0424)
section: 5
subsystem: 메모리 — semantic search backend
order: 392
maturity: L3
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: [search-pipeline-from-env]
config_refs:
  env:
    - "QUANTA_EMBED_PROVIDER"
    - "QUANTA_VECTOR_STORE"
    - "QUANTA_INDEX_PERSIST"
    - "QUANTA_INDEX_DB_PATH"
