knobs:
  - "sampleRate: number in [0,1] (default 0.1, Codex parity; NaN/out-of-range → default fallback). Override는 caller가 통계적으로 정당화한 경우에만."
deliberate_hold: null
notes: |
  현재 gate는 외부 caller가 명시적으로 호출해야 동작 (default-OFF philosophy,
  RFC §1.2 <20k override). phase2 trigger 자동 wiring(host cron / per-N-stage1)
  은 ADR-0068의 별도 follow-up — phase2-promotion-gate.ts는 그 trigger의
  "어느 entries로 LLM 호출할지" decision을 담당.
