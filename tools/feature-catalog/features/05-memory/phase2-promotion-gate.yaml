id: phase2-promotion-gate
title: Stage1 → Phase2 promotion gate (10% sample rate, fail-excluded, score-ranked)
section: 5
subsystem: 장기 메모리 — promotion pipeline (Codex 흡수, ADR-0131)
order: 14
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: partial
telemetry_keys: ["quanta.memory.phase2.tokens_used"]
modes: [n-a]
configurable: integrated
owners: ["@songmin", "team-memory"]
labels: ["surface:core", "absorbed:codex"]
configurable: static
purpose: |
  Codex production stat 10% promotion rate를 selectForPhase2Promotion(entries,
  {sampleRate?}) 로 흡수. PURE function — clock/RNG/I/O 없음, deterministic.

  필터 → 스코어 → 정렬 → 캡 순서:

    1. HARD GATE: outcome === 'fail' 무조건 제외 (proof contradicted → reusable
       knowledge로 격상 금지)
    2. SCORE = (outcomeEvidence non-empty ? +2 : 0)
             + (preferenceSignals.length > 0 ? +1 : 0)
       범위 0..3. 다른 contributor 없음 — strictly validated signal
       [[no-heuristics-only-validated]].
    3. TIEBREAK: score DESC, sourceUpdatedAt DESC (younger first)
    4. CAP: floor(sampleRate * entries.length). 기본 0.1 (Codex 10% 일치).
       e.g. 100 entries → 10 selected, 9 entries → 0 selected.

  rate 검증: NaN/<0/>1 → DEFAULT_SAMPLE_RATE(0.1) 폴백. 조용히 clamp 안함 —
  caller의 config typo를 가린다면 회귀 검출 실패.

  Phase 2 consolidator(phase2-llm)는 이 gate를 통과한 entries만 입력으로
  받음. promotion이 0인 round는 Phase 2를 short-circuit해도 안전
  (caller 책임).

  Backward compat:
    - 기존 phase2.ts / phase2-llm.ts 변경 없음 — gate는 신규 PURE 함수
    - Stage1Output의 outcome/preferenceSignals optional 필드만 의존
    - 레거시 entries (outcome undefined) → 'fail' 아님 → eligible

  Out of scope (V2 deferred):
    - Auto stage1→phase2 promotion pipeline (Codex의 `jobs` 테이블) —
      sample size 충분 시 V2 ADR
    - Cross-thread phrase corpus 기반 promotion booster
