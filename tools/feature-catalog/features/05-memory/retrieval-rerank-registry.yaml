    integration: []
    contract: []
knobs:
  - Bm25SecondaryOptions.alpha — first-stage / second-stage blend in [0,1], clamped
  - TierAwareOptions.penalty — override the default user/test/vendored penalty table
  - RRF_K — exposed constant; only override with a published reason
deliberate_hold: null
notes: |
  Cross-encoder (e.g. monoT5) and late-interaction (ColBERT) rerankers are
  intentionally out of scope (negative invariant in ADR-0159) — they need a
  hosted model + GPU. bm25-secondary is the deterministic cheap stand-in.
  Adding either is a one-file new strategy + one registry entry — zero
  edits to existing files (OCP).
