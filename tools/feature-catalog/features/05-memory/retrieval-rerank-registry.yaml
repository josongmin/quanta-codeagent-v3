id: retrieval-rerank-registry
title: Reranker port + registry — 4 built-in strategies (identity / bm25-secondary / tier-aware / score-fusion-rrf)
section: 5
subsystem: retrieval SOTA stack — Axis A (ADR-0159)
order: 91
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "adr:0159"]
depends_on: [assert-never-exhaustiveness, byte-stable-string-comparator, errors-helper-fix, runtime-config-ssot]
purpose: |
  Closed-by-default registry for second-stage rerankers over any candidate
  list (BM25 hits / embedding hits / external sources). The RerankPort port
  is a single async function — every concrete strategy is a separate SRP
  file:
    - identity: pass-through, default when operator has no preference
    - bm25-secondary: Lucene-default BM25 (k1=1.5 b=0.75) re-score blended
      α=0.5 with first-stage score
    - tier-aware: FrameTier penalty (user > test > vendored) over EXTERNAL
      candidates the localize foundation cannot see — injected
      TierClassifierPort, additive penalty (NOT a hard hide)
    - score-fusion-rrf: Reciprocal Rank Fusion, k=60 published constant
      from Cormack et al. 2009 (NOT invented)
  Registry throws RetrievalError on unknown kind — never silently falls
  back. RerankerKind discriminated union gives compile-time OCP signal
  when a new strategy is added.
evidence:
  code:
    - src/retrieval/types.ts
    - src/retrieval/rerank-registry.ts
    - src/retrieval/rerank/identity.ts
    - src/retrieval/rerank/bm25-secondary.ts
    - src/retrieval/rerank/tier-aware.ts
    - src/retrieval/rerank/score-fusion-rrf.ts
  adrs: ["docs/decisions/0159-retrieval-sota-stack.md"]
  tests:
