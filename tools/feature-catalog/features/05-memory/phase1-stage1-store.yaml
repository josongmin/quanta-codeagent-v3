purpose: |
  SQLite-backed `Stage1StorePort` implementation owning the
  `stage1_outputs` + `consolidate_watermark` tables that record per-thread
  Phase 1 distill outputs and the Phase 2 selection watermark. Additive
  schema: does NOT touch the legacy `memories` recall table, so existing
  recall + eviction are byte-identical to pre-Wave-A. Patterns mirrored
  from the recall sqlite adapter (prepared statements built once in the
  constructor and reused; row mappers as pure functions; sqlite errors
  propagate rather than swallow). Watermark conflicts (concurrent Phase 2
  runs racing on the same store) surface as `WatermarkConflictError` so
  the orchestrator can decide whether to retry or abort. Connection mode
  is journal_mode=WAL when the same DB is shared with the recall store;
  standalone test instances inherit `:memory:` in-process locking.
