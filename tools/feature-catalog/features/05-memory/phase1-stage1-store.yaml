notes: |
  Phase 1 upserts from disjoint `thread_id`s are independent rows and never
  conflict. WatermarkConflictError is the only race surface — by design,
  not a bug. Pairs with `consolidator-session-hook` (Phase 1 wire) and
  `memory-md-atomic-writer` (Phase 2 disk side).
