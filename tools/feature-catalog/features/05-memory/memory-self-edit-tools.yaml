notes: 'Voice-matches RFC §6.3 hybrid-recall (`memorysearch-write-update`) — that registers the recall/persist ORCHESTRATION; this registers the SELF-EDIT TOOL surface + provider plumbing. ADR-0068 cross-session consolidator (`codex-2-phase-consolidator`) is a DIFFERENT mechanism (per-thread distill + global synthesizer); this `memory-consolidate.ts` is the per-call near-duplicate arbiter consulted at memory_write time.'
