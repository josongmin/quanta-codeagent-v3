purpose: |
  Periodic full-store sweep that bounds each memory tier (semantic / episodic),
  prunes ancient superseded rows, and decays long-archived low-value memories.
  Pure planner: returns only ids to delete + ids to decay (importance multiplier)
  — the caller performs the actual writes so semantics stay adapter-agnostic.
  In-memory and SQLite stores share this exact module so eviction never diverges
  between dev and production. Caps + decay multiplier + stale window are
  module-level constants (no hidden tuning per call site) so a single test fixes
  behavior across both adapters.
