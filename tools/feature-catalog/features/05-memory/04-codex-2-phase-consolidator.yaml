notes: |
  L4 wire-up (2026-05-23):
  - `AgentConfig.memoryConsolidator?: { enabled, forceSummarization, port,
    store, threadId }` (default-OFF — absent ⇒ no hook fires; RFC §1.2).
  - `runAgent` finally calls `runMemoryConsolidatorHook(...)` ONLY when
    spanStatus === "ok" (failed sessions skip; forceSummarization does
    NOT override this — force is intent-to-distill on a successful run).
  - Hook is NO-THROW: every internal failure (port throw, store throw,
    missing port/store, missing threadId) is converted to a structured
    outcome (`distilled` | `skipped` | `error`) surfaced via injected
    logger. The `error` outcome is mirrored as an `error` AgentEvent so
    operators see consolidator failures; the session is already
    finishing so we never derail the return.
  - SOTA (Cursor `force_summarization`): when set, the consolidator's
    `memoryMode: "enabled"` arm fires even without `enabled: true`. The
    MIN_TURN_THRESHOLD floor still applies (no signal in tiny chats).
  - Phase 2 (cross-session synthesizer + writer) is intentionally NOT
    triggered from the session-end hook — per audit, Phase 2 is
    threshold / explicit-trigger driven, not cron. The host runs it on
    its own schedule. **REMAINING SCOPE**: a Phase-2 host trigger
    (CLI command / cron / per-N-Phase1s) is a separate follow-up.

  Original notes:
  v1 self-audit에서 7 SOTA++ 결함(파일 역할 오매핑/주입 섹션 오류/사이즈 cap 부재/
  수동 편집 보존 누락/부분 원자성/default-on opt-in flip 민감 누출 위험/LLM provider
  미정)을 잡아 v2로 재설계. ADR-0008 hybrid recall(per-turn 페어와이즈)와 직교 —
  recall은 즉시 검색용, consolidator는 사용자-가시 종합용.
