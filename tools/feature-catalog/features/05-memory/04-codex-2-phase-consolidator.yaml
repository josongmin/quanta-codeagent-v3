deliberate_hold:
  reason: |
    Phase 1 orchestrator + Phase 2 LLM port + writer(파일 3-file 원자 쓰기) + store(SQLite
    어댑터) + schema(idempotent migration) + git ops + 워터마크/회복 에러는 완성+테스트.
    세션-종료 자동 트리거 와이어업과 PII redaction 정책은 follow-up — 수동 호출 / 테스트로만
    실행 가능.
  promotion_path: |
    loop의 세션 종료 hook에서 runPhase1을 자동 호출하고 일정 임계에서 Phase 2를 cron/배치
    실행으로 wire하면 L4.
notes: 'v1 self-audit에서 7 SOTA++ 결함(파일 역할 오매핑/주입 섹션 오류/사이즈 cap 부재/수동 편집 보존 누락/부분 원자성/default-on opt-in flip 민감 누출 위험/LLM provider 미정)을 잡아 v2로 재설계. ADR-0008 hybrid recall(per-turn 페어와이즈)와 직교 — recall은 즉시 검색용, consolidator는 사용자-가시 종합용.'
