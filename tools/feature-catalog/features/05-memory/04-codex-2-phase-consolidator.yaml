id: codex-2-phase-consolidator
title: Codex 2-phase memory consolidator — per-thread distill + cross-session synthesizer
section: 5
subsystem: 장기 메모리 — LLM 합성 distill (Codex 흡수, ADR-0068)
order: 4
maturity: L3
status: new
purpose: |
  Codex memory model의 2-phase distill+consolidator 흡수 — 기존 SOTA++ hybrid recall
  (ADR-0008, embedding+lexical+tag+freshness+tier+reinforcement)이 메우지 못한 두 구조적
  갭을 닫음. (1) **사용자-검수가능 distilled 지식 부재** — embedding store는 opaque sqlite blob,
  세션 간 학습 내용을 한 파일로 열어볼 수 없었음. (2) **세션 간 LLM consolidator 부재** —
  per-turn 신호는 embed되지만 LLM이 합성된 뷰(선호 / 반복 패턴 / 결정된 아키텍처 규칙)로
  해석한 적 없음. Phase 1 = per-thread distill orchestrator(runPhase1) — 세션 종료 시 thread
  신호를 LLM으로 1차 distill해 Stage1Store에 적재. Phase 2 = cross-session consolidator
  (phase2-llm) — 전역 워터마크 기반으로 stage1 출력을 LLM으로 통합해 사용자-가시 markdown
  3-file(role/preferences/architecture)에 git-tracked write. WatermarkConflictError /
  RolloutTaintedError로 동시 실행 / 중단 회복을 통제. constants.ts에 caps / thresholds /
  OTel 키 SSOT.
