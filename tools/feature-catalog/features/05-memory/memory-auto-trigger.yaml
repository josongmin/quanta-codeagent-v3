id: memory-auto-trigger
title: Memory auto promotion through the live session-end consolidator
section: 5
subsystem: Long-term memory
order: 281
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "default-on", "absorbed:codex"]
depends_on: [codex-2-phase-consolidator, phase1-stage1-store, consolidator-session-hook]
config_refs:
  env: [QUANTA_MEMORY_AUTO]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-07-16"
  evidence:
    cli: "The live session-end consolidator owns phase-1 distillation, redaction, and sqlite persistence (one write per session end since ADR-0556)."
    web: "Server-side pipeline with no browser control surface."
purpose: |
  The session-end consolidator is the only memory-promotion authority. It
  resolves the `QUANTA_MEMORY_AUTO` gate once, fails closed on missing
  redaction, and writes exactly ONE durable row per session end (the sqlite
  `Stage1Store` upsert) that Phase 2 consolidates into `memory_summary.md`.
  The removed DefaultMemoryAutoTrigger no longer creates a competing lifecycle.
  ADR-0556 removed the lexical promotion gate + JSONL mirror that used to run
  after the upsert (and the `QUANTA_MEMORY_THRESHOLD` / `QUANTA_MEMORY_MIN_USAGE`
  knobs that tuned it): they fed a session-start injector that selected nothing
  in practice.
evidence:
  code:
    - src/memory/auto-trigger/index.ts
    - src/memory/auto-trigger/types.ts
    - src/memory/auto-trigger/wire.ts
    - src/agent/memory-consolidator-hook.ts
    - src/runner/session-memory-auto.ts
  adrs: [281, 68, 207]
  tests:
    unit: [tests/unit/memory-consolidator-hook-hellgate.test.ts]
    integration: [tests/integration/memory-auto-trigger-session-end-e2e.test.ts]
    contract: []
knobs: [QUANTA_MEMORY_AUTO]
deliberate_hold: null
notes: "Explicit QUANTA_MEMORY_AUTO=off preserves the no-allocation path."
