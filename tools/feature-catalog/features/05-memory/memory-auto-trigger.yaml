    cli: "The live session-end consolidator owns phase-1 distillation, redaction, usage initialization, promotion, and persistence."
    web: "Server-side pipeline with no browser control surface."
purpose: |
  The session-end consolidator is the only memory-promotion authority. It
  resolves the environment policy once, fails closed on missing redaction,
  initializes new stage-1 usage at one, then evaluates promotion before
  injecting the result. The removed DefaultMemoryAutoTrigger no longer creates
  a competing lifecycle.
