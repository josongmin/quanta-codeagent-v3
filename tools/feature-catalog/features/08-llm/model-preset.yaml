purpose: |
  A model preset is a NAMED, curated bundle mapping logical roles/phases to
  concrete models, applied STICKILY for a run — Claude Code's `opusplan` is the
  canonical example (Opus for plan-writer/reviewer, Sonnet for executor/explorer
  /default). The operator picks a preset BY NAME and the choice persists until
  cleared.

  Deliberately DISTINCT from the two pre-existing model-selection axes, and
  composable with both: `role-model-override` (ADR-0256) stores AD-HOC per-role
  picks the user set individually; sticky-model (ADR-0212) makes the user's ONE
  chosen model persist across turns; a preset binds DIFFERENT models to
  different roles within the run. A composition root can layer them — the preset
  supplies the per-role default, which an explicit role override can still beat.

  V1 surface (this slice): a pure preset registry + a sticky resolver, reusing
  the `Role`/`ModelId` axis from role-model-override (no second enum).
    - `BUILTIN_MODEL_PRESETS` — FROZEN catalog (`opusplan` built in) so a
      consumer cannot mutate the shared catalog by reference.
    - `resolveModelPreset(name, extra)` / `listModelPresets(extra)` — caller
      `extra` entries SHADOW a built-in of the same name (caller-supplied wins);
      an unknown name ⇒ `undefined` (NO-THROW; names arrive type-erased).
    - `resolveModelForRole(preset, role)` — falls back to `defaultModel` for any
      unmapped (or empty/type-erased) role.
    - `createStickyPresetResolver(extra)` — remembers ONE selected preset;
      `select()` returns a typed `{ok:false}` (PresetError) on an unknown name
      and leaves a good selection UNCHANGED; `resolve(role, fallback)` returns
      the caller's fallback VERBATIM when no preset is selected (Default-OFF
      byte-identity). Pure in-memory; persistence is a separate concern.
