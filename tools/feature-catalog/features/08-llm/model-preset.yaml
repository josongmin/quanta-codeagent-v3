deliberate_hold:
  reason: |
    Built + hellgate-tested but NOT yet composed at a call site. The registry +
    resolver are re-exported from the src/llm/index.ts barrel, yet NO host loop
    or CLI command resolves a preset — there is no /presets slash, no --preset
    flag, no persistence. Importing changes no behaviour (Default-OFF).
  promotion_path: |
    L3: a composition root selects a preset by name (a `/presets` slash or a
    `--preset opusplan` flag) and the per-turn model resolver consults
    StickyPresetResolver.resolve(role, fallback) ahead of the verbatim fallback,
    layered under any explicit role-model-override; optional persistence of the
    selected preset across sessions.
notes: |
  Model ids are the current canonical slugs (claude-api skill model table).
  PresetError subclasses QuantaError so future rejection codes attach without a
  breaking shape.
