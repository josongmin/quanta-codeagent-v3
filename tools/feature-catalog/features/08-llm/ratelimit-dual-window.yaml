purpose: |
  Parses the Codex per-account DUAL-WINDOW quota meter Codex emits on EVERY
  response — `x-codex-primary-used-percent` / `-window-minutes` / `-reset-at`
  and the matching `-secondary-` triple — into a `DualWindowSnapshot {primary,
  secondary, observedAt}` where each window is a `RateLimitWindow {usedPercent,
  windowMinutes, resetMs}`.

  DISTINCT from the existing `parse.ts` single-window family (Anthropic/OpenAI
  `remaining`/`reset` shape): Codex reports USED-PERCENT against a FIXED window,
  not a remaining count — a different model and a different proactive policy, so
  the two live side-by-side. Where `parse.ts` is request-scoped (last-write-wins
  on one logical route), this layer ACCUMULATES per ACCOUNT — a 2nd request on
  the same account refines the same bucket; different accounts keep separate
  buckets (`createAccountRateLimitStore`, keyed by an opaque account id the
  composition root supplies).

  Defensive contract (identical posture to `parse.ts`):
    - NO invented number: a field is populated ONLY when the provider sent a
      well-formed value — garbage ⇒ field ABSENT (never coerced to 0/NaN), via
      conditional spread (exactOptionalPropertyTypes-safe).
    - `usedPercent` clamped to the documented [0,100] band; out-of-range ⇒
      absent (a junk meter never drives a fabricated quota figure).
    - NO-THROW: a hostile header getter degrades to "no snapshot".
    - NO Date.now: `now` is injected; reset-at REUSES the B3-parity-locked
      `parseRateLimitResetMs` band parser from `parse.ts`.
    - Default-OFF: a response with NONE of these headers ⇒ `undefined`; the
      store treats an `undefined` observation as a NO-OP (no clobber of the last
      good bucket), byte-identical to the no-snapshot path.
