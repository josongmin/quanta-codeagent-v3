deliberate_hold:
  reason: |
    Built + hellgate-tested but NOT yet composed at a call site. The parser +
    store are re-exported from the src/llm/ratelimit-snapshot/index.ts barrel,
    yet NO response-header pipeline calls parseDualWindowSnapshot and NO meter
    consumer reads the store. Nothing is parsed/stored unless a composition root
    opts in (Default-OFF).
  promotion_path: |
    L3: the LLM response path (behind a QUANTA_* gate) calls
    parseDualWindowSnapshot over the response headers, records it into a per-run
    AccountRateLimitStore keyed by the credential/account fingerprint, and a
    proactive policy / UsageBar render reads the dual-window used-percent meter.
notes: |
