purpose: |
  Roo Code orchestrator의 "역할별 모델 선택" 패턴 흡수. plan-writer는 deep-reasoning model
  (o1/claude-opus), executor는 fast minimal-diff (claude-haiku/gpt-5-mini), reviewer/explorer 동.
  ADR-0212 sticky-model은 workflow phase (plan/audit/review) 축이고, role-override는 그 안의
  dispatched sub-task 축 — orthogonal. 신규 슬라이스 src/llm/role-model-override/: types(Role
  closed union: plan-writer | executor | reviewer | explorer | default + ModelId alias +
  OverrideError QuantaError subclass) / port(RoleModelResolver — resolve/setOverride/
  clearOverride/listOverrides 4 method + SetOverrideResult typed shape) / default-resolver
  (Map-backed override + fallback to defaultModel — sync, in-memory, last-write-wins) / index.
  Precedence: explicit role override > defaultModel arg (caller composes sticky-model을 통해
  defaultModel로 패스). resolve는 throw 안 함 — unknown role도 default fallback. setOverride
  empty modelId → typed error (no silent poison). listOverrides Object.freeze 반환.
evidence:
