notes: |
  hellgate 15 케이스: resolve no override → default / setOverride+resolve → override / listOverrides
  정확 / 5-role exhaustive / empty modelId → OverrideError / unknown role → default (no throw) /
  override 덮어쓰기 / default-OFF byte-identical / 5-role 독립 / listOverrides frozen / concurrent
  setOverride 안전 (last-write-wins) / resolve 순수 / 1000 resolve perf / ADR-0212 sticky 호환
  (sticky가 defaultModel로 흘러옴) / clearOverride 후 default 복귀. Persistence는 의도적 out of
  scope — per-process in-memory만, fs-backed는 future ADR.
