purpose: |
  `OAuthRefreshLockPort` is the single port behind 3 concrete implementations:
  `InMemoryLock` (per-process Map, re-entrant), `FileBasedLock` (cross-process
  same-machine via `~/.quanta/locks/{key}.lock` + JSON payload with PID +
  holderId + expiresAt), `RedisLockStub` (Phase-1 stub returning `redis-error`
  on every call; Phase 2 wires `SETNX … EX ttl NX` + Lua EVAL release script).
  `FallbackLock` chains ports: `(redis → file → memory)` — try each in order,
  fall through on `redis-error`, return on `acquired`/`would-wait`/
  `would-acquire`. The `LockResult` discriminator names mirror Cursor's
  `MCP_O_AUTH_REFRESH_LOCK_*` telemetry verbatim (`acquired` / `would-wait` /
  `would-acquire` / `redis-error`) so cross-tool observability stays
  comparable. Negative invariant: no setTimeout reapers — stale locks are
  detected lazily at the next `tryAcquire` via TTL comparison against the
  injected `ClockPort`. Re-entrant: same holder re-acquire RENEWS the TTL.
  Holder mismatch on release is a no-op (no stale holder can clear someone
  else's lock). `createChatgptRefreshLock` is the production composition owner:
  both LLM and bench refresh paths resolve the same lock directory from Quanta
  home, preventing adapter-local lock roots from silently splitting authority.
