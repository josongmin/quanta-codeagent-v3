knobs: []
deliberate_hold:
  scope: real-redis-implementation
  reason: |
    Phase 1 ships the stub so callers can wire the fallback chain in advance;
    Phase 2 wires `ioredis` SETNX + Lua release once the auth layer needs
    cross-machine coordination. Avoiding `ioredis` in Phase 1 keeps the
    install footprint clean for the (vast majority) single-instance users.
notes: |
  L4: 30-test hellgate covers per-impl semantics + fallback chain + concurrent
  storm (5 holders, exactly 1 acquires) + clock skew (backwards) + corrupt
  JSON treated as stale + wrong-holder release no-op + ttlMs<=0 throws.
  Closed-port `ClockPort` injection eliminates `Date.now()` from every impl
  so tests are byte-deterministic.
