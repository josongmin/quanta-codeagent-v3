purpose: |
  Opt into Anthropic's 1M-token context window via the context-1m-2025-08-07 beta
  header. A 1M request is expressed by a `[1m]` model-id suffix OR
  `QUANTA_CONTEXT_1M`; eligibility is DERIVED (not hardcoded) by checking
  `${model}-1m ∈ MODEL_CONTEXT_WINDOWS`. The factory strips `[1m]` from the API
  model id, de-dups the beta header against caller betas, and attaches it ONLY
  when active+eligible. Default-OFF byte-identical (no suffix/knob ⇒ no header,
  model id unchanged). Compaction-window-metadata bump is a documented follow-up.
