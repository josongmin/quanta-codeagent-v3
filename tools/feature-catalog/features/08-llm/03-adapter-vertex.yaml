purpose: |
  `VertexProviderAdapter` routes Anthropic Messages API calls through GCP Vertex AI's
  region-scoped endpoint (`projects/{gcpProjectId}/locations/{gcpLocation}/...`) via
  the optional `@anthropic-ai/vertex-sdk` (lazy import — same discipline as Bedrock).
  Requires BOTH `gcpProjectId` AND `gcpLocation` to synthesize the URL — either
  missing throws `provider-misconfigured` at construction (typed-fail at factory
  wiring, not at first wire call). GCP auth precedence: ADC (workload identity /
  `GOOGLE_APPLICATION_CREDENTIALS`) by default; explicit `gcpAccessToken` in
  `ProviderAuth` wins. DI seam: `clientFactory` for tests. Shares `mapRawEvent`
  with the canonical Anthropic adapter so the SSE grammar stays in lock-step.
evidence:
  code:
    - src/llm/providers/vertex-adapter.ts
    - src/llm/providers/provider-port.ts
    - src/llm/providers/registry.ts
  adrs:
