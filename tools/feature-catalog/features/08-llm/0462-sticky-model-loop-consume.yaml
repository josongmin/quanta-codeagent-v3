  evidence:
    cli: "runs in the interactive CLI — 1/1 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure internal loop model-resolution wire (skill over sticky over default precedence in loop.ts), no UI affordance; set-surface deferred"
purpose: |
  ADR-0212 shipped the sticky `{mode → modelId}` store + precedence resolver but
  left it a DEAD SEAM — nothing in the agent loop read it, so per-mode model
  stickiness never took effect (the 0212 fc explicitly deferred "CLI wire … 는
  후속 라운드"). This slice is that wire: the loop's `streamConsume` now resolves
  the active mode via `resolveAgentMode(config)`, reads `readStickyModelForMode`
  from the injected `stickyModelStore`, and threads the resolved sticky modelId
  into `resolveSkillTurnOverride(config, skillGate?.activeOverride(),
  stickyModelId)`. Precedence is enforced at the single resolve site:
  **skill override > sticky > default** — a per-turn skill model still wins, and
  absent both, the global default runs exactly as before. The port reuses the
  existing `config.modelCandidates?.find(c => c.id === id)?.port` lookup, so no
  new model-construction path is introduced. Default-OFF: a config with NO
  `stickyModelStore` produces a byte-identical turn — the helper returns
  `undefined` and `resolveSkillTurnOverride` runs its pre-ADR skill-only path.
evidence:
  code:
    - src/agent/loop.ts
  adrs: ["docs/decisions/0462-sticky-model-per-mode-loop-consume.md"]
  tests:
    unit: []
    integration:
      - tests/integration/loop-sticky-model.test.ts
    contract: []
knobs: []
deliberate_hold:
  reason: "Slash command + --sticky-model CLI surface for SETTING the per-mode model not in this slice — this wires the CONSUME side only; the store is set programmatically/by tests until the set-surface lands."
  promotion_path: "Add a `/sticky-model <mode> <modelId>` slash command + `--sticky-model` flag writing fsBackedStickyModelStore at the CLI composition root."
notes: |
  Integration hellgate 6 cases: sticky modelId resolves its candidate port /
  skill override beats sticky (precedence) / sticky beats default / no store ⇒
  byte-identical (undefined helper, skill-only path) / unset mode ⇒ default /
  unknown sticky modelId (no matching candidate) ⇒ falls through to default
  (no crash). One helper + one new parameter + one import in loop.ts; no other
  file touched. Cache-miss on mode switch is intended (different model = different
  prefix cache) — opt-in by the user setting a per-mode model.
