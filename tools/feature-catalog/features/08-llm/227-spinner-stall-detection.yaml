id: spinner-stall-detection
title: Spinner stall detection — soft-signal port for mid-stream silence (Claude `tengu_spinner_stalled_ui` absorption, ADR-0227)
section: 8
subsystem: LLM stream observability — soft stall signal (B6 absorbed)
order: 227
maturity: L3
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
config_refs:
  knobs:
    - spinnerStall.thresholdMs (default 30000)
owners: ["@songmin"]
labels: [absorbed:claude-code, surface:core, tier:core, adr-0227]
depends_on: [stream-idle-timeout]
purpose: |
  Claude Code CLI의 `tengu_spinner_stalled_ui` + `tengu_spinner_stall_cleared` 텔레메트리
  쌍 흡수. ADR-0200 stream-idle-timeout이 60s/120s 후 hard abort만 제공하던 갭을 메운다 —
  abort 전 N초 silence에 surface가 "still working… [r]etry / [a]bort" 패널을 띄울 수 있도록
  soft signal 단계 추가. 신규 슬라이스 `src/llm/spinner-stall/`: port (SpinnerStallDetectorPort
  — start/tickEvent/stop/checkAll, 모든 메서드 wall-clock ms를 인자로 받음 — no global Date.now)
  + default-detector (Map<correlationId, {lastEventMs, thresholdMs}> 기반, 멱등 start/stop,
  unknown id tickEvent는 silent no-op, 엄격 `>` 경계로 한 frame 보수적 — UI oscillation 방지)
  + event-emitter (edge-triggered reactor: poll(now)마다 detector.checkAll diff → 새 stall은
  spinner-stalled emit, 사라진 stall은 spinner-stall-cleared emit; 매 poll spam 방지, Claude
  parity. forceClear(id)는 stop 직후 latency 0으로 cleared 통지). Sink port (SpinnerStallSink)
  는 surface DI seam — CLI 패널 paint / OTel attr / 구조화 log 어느 쪽으로도 wire 가능. Wire
  는 src/llm/stream-timeout.ts에 optional `onChunk?: () => void` 1줄 hook (notifyChunkArrival
  helper로 추출 — biome complexity unchanged; best-effort, exception swallowed, 미주입 ⇒
  byte-identical). default-OFF 3중 레이어 (detector 미구축 / start 미호출 / emitter 미구축).
  Multi-correlation 격리 (per-id Map entry — parallel sub-agent stream N개 안전 추적).
evidence:
  code:
    - src/llm/spinner-stall/port.ts
    - src/llm/spinner-stall/default-detector.ts
    - src/llm/spinner-stall/event-emitter.ts
    - src/llm/spinner-stall/index.ts
    - src/llm/stream-timeout.ts
    # ADR-0234 wire: per-call onChunk threaded into every chunk-yielding adapter
    - src/llm/types.ts
    - src/llm/adapters/anthropic.ts
    - src/llm/adapters/openai.ts
    - src/llm/adapters/chatgpt-oauth.ts
    - src/llm/providers/bedrock-adapter.ts
    - src/llm/providers/vertex-adapter.ts
    - src/llm/providers/foundry-adapter.ts
  adrs:
    - docs/decisions/0227-spinner-stall-detection.md
    - docs/decisions/0234-llm-providers-onchunk-and-16-kind-wire.md
  tests:
    unit:
      - tests/unit/spinner-stall-detector-hellgate.test.ts
      - tests/unit/llm-providers-onchunk-wire-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: spinnerStall.thresholdMs
    default: 30000
    purpose: |
      Per-correlation stall threshold in ms. Passed as `stallThresholdMs` to
      `detector.start()`. Default 30_000 matches Claude Code's
      `tengu_spinner_stalled_ui` fire-time. Re-`start` mid-stream
      overwrites the threshold (knob change takes effect on next poll).
deliberate_hold:
  reason: |
    CLI surface "still working… [r]etry / [a]bort" panel — Tier 2 후속 (sink impl).
    Metrics counter (spinner_stall_count / spinner_stall_recovered_count) — Tier 2 (ADR-0144 MetricSink).
    ADR-0234 RELEASE: provider adapter wire 완성. 5 chunk-yielding 어댑터
    (anthropic / openai / bedrock / vertex / foundry) 전부 withStreamTimeout
    opts에 onChunk 통과. chatgpt-oauth는 SSE 파서 내부 notifyChunkArrival 헬퍼.
    mantle은 throw-stub이라 와이어 대상 아님 (negative-invariant).
  promotion_path: |
    Tier 2 sink impl (CLI panel + MetricSink counters) + Tauri/web surface
    parity once those surfaces ship.
notes: |
  ADR-0200 (hard abort)과 직교. 동일 stream에 양쪽 wire 가능 — 30s에 soft panel + 120s에
  hard abort. Sink seam은 surface-agnostic — CLI/Web-Tauri/CLI-embedded browser 어느
  multi-surface도 동일 detector 위에 자체 sink 구현.
