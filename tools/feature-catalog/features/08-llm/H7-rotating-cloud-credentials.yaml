id: rotating-cloud-credentials
title: Rotating cloud credentials (apiKeyHelper mint + aws/gcp pre-call refresh)
section: 8
subsystem: LLM provider seam — credential rotation
order: 9
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "multi-cloud", "auth", "credential-rotation", "trust-gated", "h7"]
depends_on: [llm-adapter-bedrock, llm-adapter-vertex]
config_refs:
  env:
    - QUANTA_API_KEY_HELPER
    - QUANTA_API_KEY_HELPER_TTL_MS
    - QUANTA_AWS_AUTH_REFRESH
    - QUANTA_GCP_AUTH_REFRESH
  runtime:
    - apiKeyHelper
    - apiKeyHelperTtlMs
    - awsAuthRefresh
    - gcpAuthRefresh
purpose: |
  Executable `CredentialSource` port (`src/llm/credential-helper.ts`) with two
  trust-gated capabilities, both driven by a user-configured SHELL COMMAND:
  (a) MINT an API key via `apiKeyHelper` (TTL-cached, mirroring Claude Code's
  `apiKeyHelper` + `CLAUDE_CODE_API_KEY_HELPER_TTL_MS`); (b) REFRESH short-lived
  cloud creds via `awsAuthRefresh` / `gcpAuthRefresh` (e.g. `aws sso login`,
  `gcloud auth application-default login`) run BEFORE each Bedrock / Vertex call,
  TTL-throttled so a hot loop does not re-shell every call. The Bedrock adapter
  awaits `refreshCloudCreds("aws")` and the Vertex adapter awaits
  `refreshCloudCreds("gcp")` BEFORE building/using the SDK client; absent a
  configured source the adapters are BYTE-IDENTICAL to the pre-H7 SDK default
  credential chain / ADC path. Closed-port discipline (RFC §3.1): `@/llm` imports
  only `@/shared`, so the shell-exec fn, the trust predicate, and the clock are
  ALL dependency-injected — the composition root wires the real `runShell`
  (`@/runtime`) + trust-scope check (`@/permission`). SECURITY: a shell-command
  helper is arbitrary code execution, so it is gated behind the injected
  `isTrusted` predicate (BLOCKED + typed `untrusted` error when the workspace is
  not trusted); failures are a closed `CredentialHelperError` taxonomy
  (`helper-failed` / `untrusted`) — never a crash; and the minted key / refreshed
  creds NEVER appear in any error message or telemetry (a failing helper's
  stdout/stderr is DROPPED — only the exit code is surfaced).
evidence:
  code:
    - src/llm/credential-helper.ts
    - src/llm/providers/bedrock-adapter.ts
    - src/llm/providers/vertex-adapter.ts
    - src/shared/runtime-config.ts
  adrs: []
  tests:
    unit:
      - tests/unit/rotating-credentials-hellgate.test.ts
      - tests/unit/rotating-credentials-e2e-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_API_KEY_HELPER
    default: 'undefined'
    purpose: 'Shell command that mints an API key on stdout (TTL-cached). Absent ⇒ mintApiKey() no-op.'
  - name: QUANTA_API_KEY_HELPER_TTL_MS
    where: DEFAULT_HELPER_TTL_MS
    default: 300000
    purpose: 'TTL (ms) for the minted-key cache AND the pre-call refresh throttle. Default 5min (mirrors Claude).'
  - name: QUANTA_AWS_AUTH_REFRESH
    default: 'undefined'
    purpose: 'Shell command run before each Bedrock call to refresh AWS SSO/STS creds. Absent ⇒ no refresh.'
  - name: QUANTA_GCP_AUTH_REFRESH
    default: 'undefined'
    purpose: 'Shell command run before each Vertex call to refresh GCP ADC creds. Absent ⇒ no refresh.'
deliberate_hold:
  scope: composition-root-wiring
  reason: |
    This slice ships the executable port + the adapter pre-call seam + the knobs
    + the TDD hellgate/e2e. The composition root that reads the four knobs,
    constructs the trust-gated `CredentialSource` (wiring real `runShell` +
    trust-scope check), and threads it into the Bedrock/Vertex adapter options is
    the next wiring step — kept default-OFF here so the live provider paths stay
    byte-identical until that wire lands. `mintApiKey()` is exposed for the
    BYOK-via-helper path but is not yet consumed by the factory key resolver.
notes: |
  L4: 14-test hellgate+e2e (mint, TTL cache hit/miss, aws/gcp refresh + throttle
  across adapter calls, failing-helper typed-error no-crash, untrusted BLOCKED,
  no-config byte-identical, no-leak of the secret). Default-UNSET: all four knobs
  absent ⇒ no helper, no pre-call refresh, byte-identical Bedrock/Vertex paths.
  Closed-port DI keeps `@/llm` slice-clean (no `@/runtime` / `@/permission`
  import). DEFAULT_HELPER_TTL_MS=300000 mirrors Claude's apiKeyHelper TTL.
