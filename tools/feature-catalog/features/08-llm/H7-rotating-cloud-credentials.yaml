id: rotating-cloud-credentials
title: Rotating cloud credentials (apiKeyHelper mint + aws/gcp pre-call refresh)
section: 8
subsystem: LLM provider seam — credential rotation
order: 9
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "multi-cloud", "auth", "credential-rotation", "trust-gated", "h7"]
depends_on: [llm-adapter-bedrock, llm-adapter-vertex]
config_refs:
  env:
    - QUANTA_API_KEY_HELPER
    - QUANTA_API_KEY_HELPER_TTL_MS
    - QUANTA_AWS_AUTH_REFRESH
    - QUANTA_GCP_AUTH_REFRESH
  runtime:
    - apiKeyHelper
    - apiKeyHelperTtlMs
    - awsAuthRefresh
    - gcpAuthRefresh
purpose: |
  Executable `CredentialSource` port (`src/llm/credential-helper.ts`) with two
  trust-gated capabilities, both driven by a user-configured SHELL COMMAND:
  (a) MINT an API key via `apiKeyHelper` (TTL-cached, mirroring Claude Code's
  `apiKeyHelper` + `CLAUDE_CODE_API_KEY_HELPER_TTL_MS`); (b) REFRESH short-lived
  cloud creds via `awsAuthRefresh` / `gcpAuthRefresh` (e.g. `aws sso login`,
  `gcloud auth application-default login`) run BEFORE each Bedrock / Vertex call,
  TTL-throttled so a hot loop does not re-shell every call. The Bedrock adapter
  awaits `refreshCloudCreds("aws")` and the Vertex adapter awaits
  `refreshCloudCreds("gcp")` BEFORE building/using the SDK client; absent a
  configured source the adapters are BYTE-IDENTICAL to the pre-H7 SDK default
  credential chain / ADC path. Closed-port discipline (RFC §3.1): `@/llm` imports
  only `@/shared`, so the shell-exec fn, the trust predicate, and the clock are
  ALL dependency-injected — the composition root wires the real `runShell`
  (`@/runtime`) + trust-scope check (`@/permission`). SECURITY: a shell-command
  helper is arbitrary code execution, so it is gated behind the injected
  `isTrusted` predicate (BLOCKED + typed `untrusted` error when the workspace is
  not trusted); failures are a closed `CredentialHelperError` taxonomy
  (`helper-failed` / `untrusted`) — never a crash; and the minted key / refreshed
  creds NEVER appear in any error message or telemetry (a failing helper's
  stdout/stderr is DROPPED — only the exit code is surfaced).
evidence:
  code:
    - src/llm/credential-helper.ts
    - src/llm/providers/bedrock-adapter.ts
    - src/llm/providers/vertex-adapter.ts
    - src/llm/factory.ts
    - src/llm/index.ts
    - src/runner/assemble/llm.ts
    - src/shared/runtime-config.ts
  adrs: []
  tests:
    unit:
      - tests/unit/rotating-credentials-hellgate.test.ts
      - tests/unit/rotating-credentials-e2e-hellgate.test.ts
      - tests/unit/h7-multicloud-rotation-wire-hellgate.test.ts
      - tests/unit/h7-credential-source-builder-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_API_KEY_HELPER
    default: 'undefined'
    purpose: 'Shell command that mints an API key on stdout (TTL-cached). Absent ⇒ mintApiKey() no-op.'
  - name: QUANTA_API_KEY_HELPER_TTL_MS
    where: DEFAULT_HELPER_TTL_MS
    default: 300000
    purpose: 'TTL (ms) for the minted-key cache AND the pre-call refresh throttle. Default 5min (mirrors Claude).'
  - name: QUANTA_AWS_AUTH_REFRESH
    default: 'undefined'
    purpose: 'Shell command run before each Bedrock call to refresh AWS SSO/STS creds. Absent ⇒ no refresh.'
  - name: QUANTA_GCP_AUTH_REFRESH
    default: 'undefined'
    purpose: 'Shell command run before each Vertex call to refresh GCP ADC creds. Absent ⇒ no refresh.'
notes: |
  L4 — COMPOSITION-ROOT KNOB-READ NOW DONE. The previously-held
  `composition-root-knob-read` step is wired in `src/runner/assemble/llm.ts`:
  `buildCredentialSource(input)` reads the four H7 knobs (mirrored off
  `runtimeConfig()` by the surface), and — when ANY is set — builds the
  trust-gated `CredentialSource` via `createCredentialSource`, injecting the
  REAL `runShell(command, {inheritEnv:true})` (mapped `ShellResult`→
  `ShellExecResult`), a FAIL-CLOSED `isTrusted` predicate, and the clock. NONE
  set ⇒ returns `undefined`. `buildMulticloudLLMCore(input)` then passes the
  source (or nothing) into `createMulticloudLLM`. Closed-port discipline is
  preserved: `@/llm` still imports only `@/shared` (the shell + trust are DI'd
  at the `@/runner` seam, which IS allowed to reach `@/runtime`).

  TESTS: 14-test adapter-level hellgate+e2e PLUS the 11-test factory-wire
  hellgate (`h7-multicloud-rotation-wire`) PLUS a 10-test knob-read hellgate
  (`h7-credential-source-builder`) proving: knob-on+trusted ⇒ a source is built
  and refresh runs BEFORE create; knob-on+UNTRUSTED ⇒ FAIL-CLOSED (typed
  `untrusted` decline, shell never invoked, provider create never reached, no
  crash); NO-LEAK (the helper secret never enters the decline/helper-failed
  message nor any stream event); knob-off ⇒ no source built ⇒ the multicloud
  adapter shells ZERO times (byte-identical default-OFF); TTL-due re-run is a
  real rotation, not stale reuse. The four legacy providers build via the
  untouched `createLLM` path. DEFAULT_HELPER_TTL_MS=300000 mirrors Claude's TTL.

  STILL OPEN (separate feature, NOT the H7 knob-read): selecting a multicloud
  transport is not yet routed by the END-USER provider ladder. `buildLLMCore`
  (the main composition root) resolves only the four legacy `Provider`s; there
  is no `QUANTA_PROVIDER=bedrock`-style selection knob that dispatches to
  `buildMulticloudLLMCore`. The H7 credential source is FULLY LIVE on the
  multicloud path (proven by the builder hellgate) — what remains is wiring an
  end-user transport-selection knob into the main provider ladder so a surface
  reaches that path by config rather than by an explicit `buildMulticloudLLMCore`
  call. `mintApiKey()` is likewise exposed for a BYOK-via-helper path but is not
  yet consumed by the legacy `createLLM` key resolver.
