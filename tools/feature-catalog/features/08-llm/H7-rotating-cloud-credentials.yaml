purpose: |
  Executable `CredentialSource` port (`src/llm/credential-helper.ts`) with two
  trust-gated capabilities, both driven by a user-configured SHELL COMMAND:
  (a) MINT an API key via `apiKeyHelper` (TTL-cached, mirroring Claude Code's
  `apiKeyHelper` + `CLAUDE_CODE_API_KEY_HELPER_TTL_MS`); (b) REFRESH short-lived
  cloud creds via `awsAuthRefresh` / `gcpAuthRefresh` (e.g. `aws sso login`,
  `gcloud auth application-default login`) run BEFORE each Bedrock / Vertex call,
  TTL-throttled so a hot loop does not re-shell every call. The Bedrock adapter
  awaits `refreshCloudCreds("aws")` and the Vertex adapter awaits
  `refreshCloudCreds("gcp")` BEFORE building/using the SDK client; absent a
  configured source the adapters are BYTE-IDENTICAL to the pre-H7 SDK default
  credential chain / ADC path. Closed-port discipline (RFC §3.1): `@/llm` imports
  only `@/shared`, so the shell-exec fn, the trust predicate, and the clock are
  ALL dependency-injected — the composition root wires the real `runShell`
  (`@/runtime`) + trust-scope check (`@/permission`). SECURITY: a shell-command
  helper is arbitrary code execution, so it is gated behind the injected
  `isTrusted` predicate (BLOCKED + typed `untrusted` error when the workspace is
  not trusted); failures are a closed `CredentialHelperError` taxonomy
  (`helper-failed` / `untrusted`) — never a crash; and the minted key / refreshed
  creds NEVER appear in any error message or telemetry (a failing helper's
  stdout/stderr is DROPPED — only the exit code is surfaced).
evidence:
  code:
    - src/llm/credential-helper.ts
    - src/llm/providers/bedrock-adapter.ts
    - src/llm/providers/vertex-adapter.ts
    - src/llm/factory.ts
    - src/llm/index.ts
    - src/runner/assemble/llm.ts
    - src/apps/cli/internal.ts
    - src/shared/runtime-config.ts
  adrs: []
  tests:
    unit:
      - tests/unit/rotating-credentials-hellgate.test.ts
      - tests/unit/rotating-credentials-e2e-hellgate.test.ts
      - tests/unit/h7-multicloud-rotation-wire-hellgate.test.ts
      - tests/unit/h7-credential-source-builder-hellgate.test.ts
      - tests/unit/h7-main-llm-transport-routing-hellgate.test.ts
      - tests/unit/byok-apikey-resolve-hellgate.test.ts
      - tests/unit/byok-apikey-e2e-hellgate.test.ts
