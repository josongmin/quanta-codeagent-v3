    integration: []
    contract: []
knobs:
  - name: QUANTA_API_KEY_HELPER
    default: 'undefined'
    purpose: 'Shell command that mints an API key on stdout (TTL-cached). Absent ⇒ mintApiKey() no-op.'
  - name: QUANTA_API_KEY_HELPER_TTL_MS
    where: DEFAULT_HELPER_TTL_MS
    default: 300000
    purpose: 'TTL (ms) for the minted-key cache AND the pre-call refresh throttle. Default 5min (mirrors Claude).'
  - name: QUANTA_AWS_AUTH_REFRESH
    default: 'undefined'
    purpose: 'Shell command run before each Bedrock call to refresh AWS SSO/STS creds. Absent ⇒ no refresh.'
  - name: QUANTA_GCP_AUTH_REFRESH
    default: 'undefined'
    purpose: 'Shell command run before each Vertex call to refresh GCP ADC creds. Absent ⇒ no refresh.'
  - name: QUANTA_LLM_TRANSPORT
    default: 'undefined'
    purpose: 'END-USER cloud-transport selector for the MAIN agent LLM — default|bedrock|vertex|foundry|mantle. Set (or set a cloud env signal) to route buildLLM through createMulticloudLLM (the rotating-credential path). Unset + no cloud signal ⇒ legacy vendor path (byte-identical).'
  - name: QUANTA_LLM_CREDENTIAL_TRUSTED
    default: '0'
    purpose: 'FAIL-CLOSED trust attestation for the credential-helper shell (arbitrary command execution). Only the literal 1 authorizes the shell; unset/anything else ⇒ typed untrusted decline, NEVER a run. Orthogonal to the four command knobs.'
notes: |
  L4 — COMPOSITION-ROOT KNOB-READ NOW DONE. The previously-held
  `composition-root-knob-read` step is wired in `src/runner/assemble/llm.ts`:
  `buildCredentialSource(input)` reads the four H7 knobs (mirrored off
  `runtimeConfig()` by the surface), and — when ANY is set — builds the
  trust-gated `CredentialSource` via `createCredentialSource`, injecting the
  REAL `runShell(command, {inheritEnv:true})` (mapped `ShellResult`→
  `ShellExecResult`), a FAIL-CLOSED `isTrusted` predicate, and the clock. NONE
  set ⇒ returns `undefined`. `buildMulticloudLLMCore(input)` then passes the
  source (or nothing) into `createMulticloudLLM`. Closed-port discipline is
  preserved: `@/llm` still imports only `@/shared` (the shell + trust are DI'd
  at the `@/runner` seam, which IS allowed to reach `@/runtime`).

  TESTS: 14-test adapter-level hellgate+e2e PLUS the 11-test factory-wire
  hellgate (`h7-multicloud-rotation-wire`) PLUS a 10-test knob-read hellgate
  (`h7-credential-source-builder`) proving: knob-on+trusted ⇒ a source is built
  and refresh runs BEFORE create; knob-on+UNTRUSTED ⇒ FAIL-CLOSED (typed
  `untrusted` decline, shell never invoked, provider create never reached, no
  crash); NO-LEAK (the helper secret never enters the decline/helper-failed
  message nor any stream event); knob-off ⇒ no source built ⇒ the multicloud
  adapter shells ZERO times (byte-identical default-OFF); TTL-due re-run is a
  real rotation, not stale reuse. The four legacy providers build via the
  untouched `createLLM` path. DEFAULT_HELPER_TTL_MS=300000 mirrors Claude's TTL.

  END-USER REACHABILITY NOW DONE (was the last open gap): the main agent LLM
  now ROUTES to the multicloud + rotation path by config.
  `selectLlmTransport(input)` (src/runner/assemble/llm.ts) reuses the registry's
  `resolveProvider` precedence ladder — explicit `QUANTA_LLM_TRANSPORT` wins,
  else the `ANTHROPIC_{BEDROCK,VERTEX,FOUNDRY}_BASE_URL` / `_RESOURCE` / `_USE_*`
  env signals decide — and `buildMainLLMCore(input)` dispatches: a `default`
  resolution ⇒ the byte-identical legacy `buildLLMCore` vendor path; a cloud
  resolution ⇒ `buildMulticloudLLMCore` with the H7 credential input. The CLI
  seam `buildLLM` (src/apps/cli/internal.ts) wires this with the H7 command
  knobs mirrored off `runtimeConfig()` and a FAIL-CLOSED `isTrusted` predicate
  bound to `QUANTA_LLM_CREDENTIAL_TRUSTED` (unset ⇒ typed `untrusted` decline,
  shell never runs). Proven end-to-end by `h7-main-llm-transport-routing`
  (14-test hellgate): default-OFF byte-identity (legacy never consults the
  credential), selection precedence, routed refresh ≺ create, fail-closed
  untrusted decline, knob-off zero-shell, no-leak.

  BYOK MINT INTO LEGACY `createLLM` NOW DONE (was the last small open gap):
  `mintApiKey()` is now consumed by the legacy vendor key path for
  `anthropic`/`openai`. `resolveVendorApiKey(provider, opts, source)`
  (src/llm/factory.ts) is the SINGLE async pre-resolution step run at the
  composition root BEFORE the synchronous `createLLM` — it injects the minted key
  as `opts.apiKey` (which already wins over env inside `createLLM`), so the key
  reaches `new Anthropic({apiKey})` / the OpenAI adapter. The factory stays
  synchronous; the `await` lives at the `@/runner` seam
  (`buildLLMWithByokCore`, src/runner/assemble/llm.ts) and the CLI seam
  (`buildLLMWithByok`, src/apps/cli/internal.ts → consumed by repl.ts). Closed-
  port preserved: `@/llm` imports only `@/shared`; the shell/trust/clock are DI'd
  at the assemble seam (`buildCredentialSource`).

  PRECEDENCE (first wins): explicit `opts.apiKey` (mint NOT consulted, 0 shell) ≻
  `apiKeyHelper` mint (when source present, provider mintable, trusted, non-empty)
  ≻ `env[ANTHROPIC_API_KEY|OPENAI_API_KEY]` (inside `createLLM`). Mint ≺ first
  request (resolved at build, TTL-cached + single-flight via the shared H7
  source). Only `anthropic`/`openai` are mintable (MINTABLE_PROVIDERS Set);
  `chatgpt-oauth` (on-disk token) and bedrock/vertex (refreshCloudCreds, the
  OTHER H7 capability) are skipped with ZERO shell calls.

  GATE + DEFAULT-OFF BYTE-IDENTITY: strict opt-in
  `QUANTA_API_KEY_HELPER_LEGACY_VENDOR=1` (runtime `apiKeyHelperLegacyVendor`).
  OFF (or non-legacy transport selected, or no H7 knob set) ⇒ `source` is
  `undefined` ⇒ `resolveVendorApiKey` returns the SAME `opts` reference (no
  `apiKey` added, no shell) ⇒ `createLLM` resolves from env EXACTLY as before;
  `buildLLMWithByok` delegates verbatim to the sync `buildLLM`. The four legacy
  providers build byte-identically; `MissingApiKeyError` is preserved when a key
  is truly absent. FAIL-CLOSED: a configured-but-broken / untrusted helper THROWS
  a typed `CredentialHelperError` (`helper-failed`/`untrusted`) rather than
  silently shadowing a working env key with `""` (empty-stdout guard) or hanging.
  NO-LEAK re-asserted on this path: the minted secret flows only into
  `opts.apiKey`; it never enters a thrown error message, log, or stream event.

  TESTS: `byok-apikey-resolve-hellgate` (11-test contract — mint feeds opts.apiKey
  for anthropic+openai, explicit-key wins/0-shell, knob-off ===-identical opts,
  helper-unset no-op, non-mintable skip, empty-mint throws helper-failed without
  clobbering env, untrusted fail-closed, NO-LEAK secret never in error) +
  `byok-apikey-e2e-hellgate` (mint → resolveVendorApiKey → createLLM →
  AnthropicAdapter builds with the minted key while env is ignored, TTL re-mint
  reuses cache / shell runs ONCE, knob-off env resolution byte-identical,
  knob-off+empty-env ⇒ MissingApiKeyError) + `ai-title-byok-reachability`.
