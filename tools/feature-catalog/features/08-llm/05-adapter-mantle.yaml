id: llm-adapter-mantle
title: Anthropic Mantle LLM adapter (Phase 1 stub — internal enterprise endpoint)
section: 8
subsystem: LLM provider seam — cloud transport
order: 5
maturity: L2
status: hold
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "multi-cloud", "anthropic-internal", "adr-0163", "phase-1-stub"]
depends_on: [llm-multicloud-provider-router]
config_refs:
  env:
    - CLAUDE_CODE_USE_MANTLE
purpose: |
  `MantleProviderAdapter` is a REAL stream skeleton (ADR-0172 superseded the
  ADR-0163 typed-stub): same 4-part shipped-adapter structure as Bedrock/Vertex/
  Foundry — client DI, real `messages.create`, `mapRawEvent` decode. The ONLY
  thing missing is the lazy-import target `@anthropic-ai/mantle-sdk`, which is
  NOT yet published on npm; until it ships, selecting `mantle` throws a typed
  `provider-missing-dependency` (handled by the fallback chain) — strictly better
  than the old `provider-unsupported`. So the feature is HELD not because the code
  is a stub but because its external SDK dependency does not yet exist. Why a separate
  adapter rather than reusing `FoundryProviderAdapter`? Telemetry: dashboards
  must distinguish Mantle traffic from Foundry traffic (different billing units,
  different residency boundaries). Two Phase-1 stubs ship cheaply; Phase 2
  graduations are independent.
evidence:
  code:
    - src/llm/providers/mantle-adapter.ts
    - src/llm/providers/provider-port.ts
    - src/llm/providers/registry.ts
  adrs:
    - docs/decisions/0163-multicloud-oauth-lock.md
  tests:
    unit:
      - tests/unit/llm-adapter-mantle-hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold:
  scope: blocked-on-unpublished-sdk
  reason: |
    Code is a REAL stream skeleton (ADR-0172), NOT a stub. The hold is purely
    external: `@anthropic-ai/mantle-sdk` is not yet on npm, so the lazy import
    throws `provider-missing-dependency`. Unblocks the instant the SDK publishes
    (zero code change — install-to-enable, like Foundry before its SDK shipped).
notes: |
  L2: 12-test hellgate covers construction, mismatched providerId, throw-on-stream,
  registry routing, provider-error telemetry payload. ProviderId union grew from
  4 to 5 entries; the closed-union + exhaustiveness pattern caught the registry
  + barrel + lazy-unsupported message drift at compile time.
