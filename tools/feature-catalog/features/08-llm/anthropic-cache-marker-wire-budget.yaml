notes: |
  Not configurable: 4 is Anthropic's hard API limit, not a policy choice, so there is no
  knob to expose. `MAX_ANTHROPIC_CACHE_MARKERS` is exported from the codec as the single
  named authority.

  KNOWN RESIDUAL (outside this lane's write set, recorded for the integration lane):
  `src/agent/prompt.ts` still discards the `validateSectionsCacheBudget` verdict. The wire
  cap now makes that check non-load-bearing for correctness, but as written it is a
  silent no-op whose comment claims it "surfaces in dev".
