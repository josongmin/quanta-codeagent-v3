id: llm-multicloud-provider-router
title: Multi-cloud provider router (CLAUDE_CODE_USE_* env mirror + precedence ladder)
section: 8
subsystem: LLM provider seam — multi-cloud routing
order: 1
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "multi-cloud", "adr-0163"]
depends_on: [llm-factory]
config_refs:
  env:
    - CLAUDE_CODE_USE_BEDROCK
    - CLAUDE_CODE_USE_VERTEX
    - CLAUDE_CODE_USE_FOUNDRY
    - CLAUDE_CODE_USE_MANTLE
    - ANTHROPIC_BEDROCK_BASE_URL
    - ANTHROPIC_VERTEX_BASE_URL
    - ANTHROPIC_FOUNDRY_BASE_URL
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
purpose: |
  `resolveProviderWithRouter(input)` is the 7-layer precedence ladder that picks the
  active `LlmProvider` from explicit caller arg + `CLAUDE_CODE_USE_*` (claude-cli
  convention) + `ANTHROPIC_*_BASE_URL` (ADR-0139 convention) + chatgpt-oauth disk
  probe + ANTHROPIC_API_KEY + OPENAI_API_KEY + default. Conflict policy: simultaneous
  `CLAUDE_CODE_USE_*` keys throw `ProviderConflictError` (no silent pick — cloud
  transports are mutually exclusive, $-bill surprise). Strict truthy parser accepts
  {1,true,yes} case-insensitive; "2"/"0"/"" are FALSE. Pure function — no I/O except
  the port-injected hasChatgptOAuthToken probe. The new `LlmProvider` union names
  every transport AND every vendor in one place (anthropic / openai / chatgpt-oauth /
  bedrock / vertex / foundry / mantle); `ProviderCredentials` discriminator
  classifies WHERE the credential lives (env / file / metadata-service / vault) so
  downstream code (OAuth refresh lock, OIDC federation, GH rotation) routes
  correctly without re-deriving from provider name.
