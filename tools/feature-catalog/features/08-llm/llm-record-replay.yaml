purpose: 'LLM session record/replay wrapper: RecordingLLM tees a live LLM stream to a JSONL store (jsonl-store.ts) capturing the exact request/response/tool-call sequence; ReplayLLM reads that JSONL back deterministically (no network) so an eval / side-agent run reproduces a recorded session byte-for-byte. Default-OFF + import-safe: the parent @/llm barrel never re-exports this slice, so the recorder/replayer is never silently in the stream path — a surface opts in by importing @/llm/replay explicitly. Consumed by the side-agent forked-child charter runner (hermetic replay) and the eval grounding scaffold.'
