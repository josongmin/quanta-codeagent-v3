purpose: |
  Closes the ADR-0214 → ADR-0234 taxonomy gap: three Codex-spec
  `LLMErrorKind` arms (`too_many_failed_attempts` → fatal;
  `thread_rollback_failed` → reactive_compaction; `sandbox_error` →
  hitl_handoff) were reachable only via the heuristic `classify(e:
  unknown)` router because no layer was emitting them as typed signals.
  Each arm now has a pure, default-OFF helper owned by the layer that
  KNOWS the failure: retry layer (`src/llm/retry/too-many-failed-attempts.ts`),
  per-tool-checkpoint (`src/agent/per-tool-checkpoint/rollback-llm-error-bridge.ts`),
  os-sandbox (`src/runtime/os-sandbox/llm-error-bridge.ts`). Each helper
  is additive — when `enabled !== true`, the inner port is returned
  verbatim (same reference) preserving byte-identical behavior. Original
  failure carried as `cause` on the typed `LLMError`.
