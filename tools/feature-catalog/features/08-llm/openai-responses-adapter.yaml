knobs:
  - name: serviceTier
    where: src/llm/adapters/openai-responses.ts (config.serviceTier, env-derived at root)
    default: 'undefined'
    purpose: |
      OpenAI `service_tier` request field. Conditionally spread — undefined ⇒ key
      absent from the wire (byte-identical). The adapter never reads process.env;
      the value is resolved at the composition root.
  - name: reasoningEffort
    where: src/llm/adapters/openai-responses.ts (config.reasoningEffort, env-derived at root)
    default: 'undefined'
    purpose: |
      Reasoning effort hint passed through to the responses request. Conditionally
      spread (undefined ⇒ omitted). Composition-root resolved.
deliberate_hold: null
notes: |
  Adapter is a thin LLMPort over the shared responses-stream layer — the wire
  body builder (`prepareResponsesContinuationRequest`) and SSE driver
  (`streamResponsesSurface`) live in `src/llm/responses-stream.ts` and are owned
  by the reasoning-carryover / responses-wire slices. This row owns the adapter
  class + the continuation/resume store. The H15 `reasoningCarryover` flag is
  honored here: when on, the adapter allocates ONE per-session
  `ResponsesReasoningCarryoverStore` and threads it through; when off, no store is
  allocated and no `include`/reasoning items are emitted (byte-identical).
