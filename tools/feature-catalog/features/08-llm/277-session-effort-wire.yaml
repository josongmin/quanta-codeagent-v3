id: session-effort-wire
title: Session effort wire — `/effort` slash + `EffortStore` precedence fold-in (Codex `/model`-style)
section: 8
subsystem: 모델 라우팅 — 세션 thinking 예산 (Codex `/model` UX 흡수, ADR-0277)
order: 277
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: integrated
config_refs:
  cli: ['/effort']
  env: ['QUANTA_EFFORT']
owners: ["@songmin"]
labels: [absorbed:codex, surface:cli, tier:core]
depends_on: []
purpose: |
  Codex `/model` 패턴 흡수: 모델 옆 reasoning effort tier를 런타임에 swap. v3는 5-tier
  (`default | low | medium | high | max`) + token 예산 매핑이 leaf로 이미 존재(`src/agent/effort.ts`)
  했으나 EffortStore가 src에서 호출되지 않아 `QUANTA_EFFORT=high`로 띄워도 pill만 painted 되고
  실제 `LLMInput.thinking`에는 절대 안 박힘. ADR-0277은 **세션 rung을 precedence 중간에 끼움**
  (skill > **session** > default). `AgentConfig.sessionEffort?: () => EffortLevel | undefined`
  슬롯을 추가하고 `resolveSkillTurnOverride`가 매 턴 한 번 읽어 thinking 예산을 계산. 3-state
  intermediate (`number | undefined | null`)로 skill 침묵 vs explicit-off vs 적용을 명확히 구분.
  CLI 와이어: `createEffortStore(parseEffort(env.QUANTA_EFFORT) ?? "default")`를 bootstrap에서 1회
  instantiate → SessionDeps thread → 슬래시는 `effortStore.set + pills.update` 한 콜백 (단일 seam이
  persist + render 동시 갱신, drift 봉쇄). `/effort` 슬래시: no-arg = 🧠 헤더 + 5-tier 리스트
  (current는 `*`) + use-hint, named arg = set + 예산 태그 confirmation, case-insensitive,
  unknown level은 known 리스트 동봉 exit 1. 부재 ctx ⇒ "not wired in this surface" + exit 0.
  Default-OFF byte-identical: sessionEffort 미지정 또는 `"default"`/`undefined` 반환 시 no
  `thinking` field.
