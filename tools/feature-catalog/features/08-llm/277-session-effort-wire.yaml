    where: 'session-bootstrap.ts — initial EffortStore value'
    purpose: 'boot-time session tier (default|low|medium|high|max)'
  - name: '/effort <level>'
    where: 'slash-commands.ts'
    purpose: 'runtime session-tier swap (mutates store + pill atomically)'
deliberate_hold: null
notes: |
  Precedence 계약: skill에 `effort:` 있으면 (named tier 또는 numeric) skill 승리, `"default"` 또는
  numeric ≤0은 explicit-off (session으로 fall-through 안 함), skill 침묵(no `effort:`)은 session
  fall-through. Skill frontmatter parser는 `effort: default`를 silently drop — test (f)는 numeric
  `0`으로 동일 branch 검증. 15 hellgate 케이스 (precedence 7 + slash UX 8). Cache 무효화 힌트는
  현 슬라이스 밖 — 후속 ADR (ADR-0273 ModelTag invalidator 패턴 확장 후보). 모델 swap UX는
  `/retry-with`(ADR-0065)에 이미 있어 분리 — `/effort`는 effort-only로 단일 책임 유지.
