purpose: |
  `src/protocol/session/` — the canonical, surface-agnostic wire protocol that
  the IPC session transport and the web-daemon WS surface speak (one JSON
  envelope per frame). Three message families, each a versioned envelope
  (`{ version, kind, payload }`) pinned to `SESSION_PROTOCOL_VERSION =
  "session.v1"`:
    - COMMANDS (client → runtime, `commands.ts`): input.append / turn.run /
      turn.cancel / session.identity.set / session.tool-profile.set /
      session.transcript.replace / approval.respond — closed `SESSION_COMMAND_TYPES`
      set with an `isSessionCommandType` guard.
    - EVENTS (runtime → client, `events.ts`): session.created / .state.updated /
      .closed, turn.started / .output.delta / .completed / .failed,
      turn.llm.request / .continuation, tool.invoked / .completed,
      approval.requested / .resolved, artifact.ready — closed
      `SESSION_EVENT_TYPES` set with `isSessionEventType`.
    - SNAPSHOT (`snapshot.ts`): `SessionSnapshotLite` (SessionStateView +
      PendingApprovalView + ArtifactRef) for state hydration.
  `codec.ts` is the load-bearing piece: `encodeSession{Command,Event,Snapshot}`
  serialize to a JSON envelope; `decodeSession{Command,Event,Snapshot}` validate
  the envelope (version match, kind match, payload-is-object, per-field type
  assertions: required string / finite number / optional string / object /
  nullable object / array) and throw a TYPED `SessionProtocolValidationError`
  (errors.ts) with a discriminating issue code (invalid_json / envelope_not_object
  / bad_version / expected_<kind>_envelope / <kind>_payload_not_object / field
  failures) on any malformed input — never an opaque crash. `capabilities.ts`
  carries a `CapabilityManifest` + `normalizeCapabilityManifest` for the
  surface's negotiated feature set; `version.ts` pins the single protocol version
  with an `isSessionProtocolVersion` guard.
