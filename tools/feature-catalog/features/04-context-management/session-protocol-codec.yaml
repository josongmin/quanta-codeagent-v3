notes: |
  Distinct from `session-envelope-encoder` (section 4), which owns the on-DISK
  per-line JSONL rail (`src/session/`). This row owns the LIVE wire protocol for
  the multi-surface transport (`src/protocol/session/`) — consumed by
  `slice-ipc-bridge` / `web-daemon-surface` / `web-frontend-surface` (the
  frontend carries a narrow LOCAL COPY in `apps/web-frontend/src/types/
  protocol.ts` to stay decoupled from the bun tsconfig paths). Decode never
  throws an untyped error: every malformed-input path surfaces a
  `SessionProtocolValidationError` with a discriminating issue code, so the
  transport decides drop / log / reject per frame.
