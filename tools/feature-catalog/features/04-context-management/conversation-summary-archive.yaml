purpose: |
  Cursor compactor 의 `summaries[]` 모방. 각 compaction 직후 `appendSummary` 로
  `ConversationSummaryEntry{fromTurnId, toTurnId, summary, ts, tokens}` 한 entry 를
  archive 에 push — UI 가 "context history" 를 렌더하거나 debug inspector 가
  "어떤 turn 이 어떤 summary 로 접혔는지" 를 알 수 있다. Pure module(clock/IO 0):
  caller 가 `ts` 를 주입(deterministic test). Append-only 였던 초안의 unbounded-heap
  결함을 `MAX_ARCHIVED_SUMMARIES=64` FIFO-oldest 캡으로 봉합 — 유일 consumer 가
  `archive.summaries.at(-1)?.toTurnId` 만 읽고 evicted entry 는 이미
  `context_compacted` AgentEvent 로 subscribers 에게 publish 됐기 때문에
  correctness-preserving.
