notes: |
  `keepTurns=0` 같은 극단 인풋도 boundary 가 안전 — 빈 suffix 는 self-consistent 이므로
  walk 가 no-op. 본 함수는 stateless / no-IO 라 단위테스트만으로 모든 분기 커버.
