order: 32
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: static
owners: ["@songmin"]
labels: [absorbed:hermes, absorbed:cline, surface:cli]
depends_on: [conversation-checkpoint-store]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "/rewind-conv slash plus per-turn auto recordTurn wire in CLI REPL, replaces live transcript"
    web: "CLI-only slash plus transcript-replace; SlashPalette routed commands are prefill stubs (B2) and no SessionCommand verb (B3)"
purpose: |
  ADR-0124 `ConversationCheckpointStore` 의 first consumer — surface-side wire +
  `/rewind-conv` slash. ADR-0124 catalog row(`conversation-checkpoint-store`)의
  `deliberate_hold.promotion_path`("Wire a consumer (e.g. /rewind, message-rewind
  UI, or post-tool-failure auto-checkpoint hook)") 의 첫 절반을 충족. Hermes
  Agent `/rollback`, Cline "Restore Files & Task" 는 conversation rollback 을
  file rollback (already at ADR-0118/0122 `/snapshot`) 와 함께 제공 — v3 는
  파일 face 만 있었던 절반을 본 슬라이스로 메운다. Wire 는 caller-driven (host
  REPL 이 turn-end hook 에서 `recordTurn(messages)`); loop 는 unmutated. Slash 는
  `ctx.convCheckpoint.replaceMessages(restored)` 로 surface 의 live transcript
  를 swap. Default-OFF: ctx slot 없으면 "not wired" + exit 0. No-throw 보장.
evidence:
  code:
    - src/apps/cli/repl/conv-checkpoint-wire.ts
    - src/apps/cli/rewind-conv-cmd.ts
    - src/apps/cli/slash-commands.ts
  adrs: [292]
  tests:
    unit:
      - tests/unit/conv-checkpoint-auto-record-hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  Sibling of ADR-0124 (`conversation-checkpoint-store`). Loop is NOT touched —
  the wire is a surface-side observer, not an injected hook. `recordTurn` is
  no-throw (outer try/catch swallows programmer-bug throws from the store).
  `/rewind-conv` follows the canonical "not wired" pattern (parity with
  `/snapshot` / `/snooze` / `/skills` / `/side` / `/profile` / `/identity` /
  `/focus-chain` / `/effort` / `/inspect` / `/replay` / `/why`). Tag format
  default: `turn-${turn}-${now}`; override via `opts.tagFormat`. LRU is the
  store's concern (the wire surfaces whatever `store.list()` returns).
