purpose: |
  Provider-swap seam for both retrieval axes (embedder + vector store) with
  closed-port contracts and env-driven selection. `QUANTA_EMBED_PROVIDER ∈
  {openai, voyage, cohere, ollama, headless}` and `QUANTA_VECTOR_STORE ∈
  {in-memory, sqlite, lance, qdrant}` swap engines without source edits at
  call sites. Sibling-extension of ADR-0254 (single in-memory cosine store
  + single OpenAI-style embedder): the new ports carry typed-capabilities,
  typed-errors (7-arm EmbedError + 5-arm StoreError closed unions),
  capability negotiation (negotiateCapabilities — dim/metric compat checked
  before any vector is stored), and a default-OFF byte-identical landing
  (registries return null until env present). Managed-vendor adapters use
  fetch directly per the no-install constraint (ADR-0160). API keys come
  from env (OPENAI_API_KEY / VOYAGE_API_KEY / COHERE_API_KEY); missing key
  is the typed missing-api-key arm.
