knobs:
  - name: QUANTA_EMBED_PROVIDER
    type: enum
    values: [openai, voyage, cohere, ollama, headless]
    default: '<unset>'
    purpose: 'select Embedder factory via env; unset → registry returns null (caller-owned construction)'
  - name: QUANTA_VECTOR_STORE
    type: enum
    values: [in-memory, sqlite, lance, qdrant]
    default: '<unset>'
    purpose: 'select VectorStore factory via env; unset → registry returns null (caller-owned construction)'
deliberate_hold:
  reason: 'Default-OFF — `loop`/`semantic`/`hybrid-query` does NOT consume the new registry. Existing ADR-0254 wiring is byte-identical. Plane-clean (no @/agent, @/memory, @/observability edits).'
  promotion_path: 'Wire a consumer (semantic.ts or hybrid-query.ts) to opt-in via createEmbedderFromEnv()/createStoreFromEnv(); add integration test; add metrics on embed-latency + query-latency.'
notes: |
  - exactOptionalPropertyTypes-safe: optional fields are absent or defined,
    never `undefined`. Uses `omitUndef` from `@/shared` where shape varies.
  - No external lib install: every managed-vendor adapter posts JSON via
    `fetch`. SQLite uses `bun:sqlite` (already a peer dep via
    src/memory/consolidate/store.ts).
  - Headless stub: deterministic djb2 → Mulberry32. Same input → byte-identical
    output. Default dim 1536 (configurable per factory call).
  - sibling to ADR-0254 (NOT a replacement). Old `EmbeddingPort` + 8 vendor
    factories remain in place and in use; the new `Embedder` is the richer
    contract for new call sites.
