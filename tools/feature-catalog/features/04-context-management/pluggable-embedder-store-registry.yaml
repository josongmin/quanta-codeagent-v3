deliberate_hold: null
notes: |
  - exactOptionalPropertyTypes-safe: optional fields are absent or defined,
    never `undefined`. Uses `omitUndef` from `@/shared` where shape varies.
  - No external lib install: every managed-vendor adapter posts JSON via
    `fetch`. SQLite uses `bun:sqlite` (already a peer dep via
    src/memory/consolidate/store.ts).
  - Headless stub: deterministic djb2 → Mulberry32. Same input → byte-identical
    output. Default dim 1536 (configurable per factory call).
  - ADR-0424 closes the prior hold: the search-index consumer now projects
    `QUANTA_VECTOR_STORE` into the live semantic backend, with same-dim
    capability negotiation, typed refusal on provider failure, explicit-store
    fail-closed semantics, embedding-space-specific remote namespaces, durable
    manifest ownership, mutation-batch reconcile, and embed/query latency metrics.
  - Contract evidence splits by proof tier: the integration rail uses a
    stateful in-proc REST fixture, while `tests/contract/lance-real-wire.test.ts`
    uses real `python+lancedb` storage semantics behind a compatible HTTP shim.
    That rail proves live Lance backing + restart-safe manifest cleanup, not an
    official vendor-owned daemon binary.
  - sibling to ADR-0254 (NOT a replacement). Old `EmbeddingPort` + 8 vendor
    factories remain in place and in use; the new `Embedder` is the richer
    contract for new call sites.
