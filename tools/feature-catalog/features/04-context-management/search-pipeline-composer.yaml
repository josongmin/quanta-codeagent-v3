purpose: |
  Pure functional DAG composer for retrieval pipelines. Reduces a
  `Stage[]` discriminated union (lexical / semantic / rerank / rrf /
  budget-gate) to a `SearchPipeline { search(query) → Result<SearchHit[],
  PipelineError> }`. Generalizes the legacy `runHybridQuery` 3-stage
  funnel without touching the sibling slice files — every join is INLINE
  duck-typed, so the composer never imports
  `src/retrieval/{lexical,semantic,reranker,cache,batching}.ts` nor
  `@/agent/budget-ledger`. Ships five pre-built presets so callers never
  need to know the `Stage` shape for the common cases. RRF uses the
  Cormack 2009 published k=60 constant (formula numerically locked by
  hellgate HELL-PI-04). Default-OFF — nothing in @/agent / @/runner /
  @/apps instantiates a pipeline at construction (HELL-PI-14 enforces
  this via source-text grep).
