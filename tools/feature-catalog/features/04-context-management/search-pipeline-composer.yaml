id: search-pipeline-composer
title: SearchPipeline composer + 5 pre-built presets (ADR-0265)
section: 4
subsystem: Retrieval — pure DAG composer over lexical / semantic / rerank / RRF / budget-gate
order: 50
maturity: L4
status: stable
