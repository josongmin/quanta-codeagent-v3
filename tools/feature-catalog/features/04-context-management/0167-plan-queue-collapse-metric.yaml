owners: ["@songmin"]
labels: ["adr-0167", "tier:1", "plan-queue", "observability"]
depends_on:
  - plan-queue
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "EnqueueResult plus plan_queue.enqueue.collapsed.total counter wired into instrumentPlanQueue (observability/metrics)"
    web: "pure internal observability counter, not an AgentEvent and no browser render"
purpose: |
  Closes the ADR-0161 follow-up gap: PlanQueueStore previously returned
  just a string id from `enqueue` — when ADR-0128's dedup rule collapsed
  a same-(threadId, textHash) request into an existing live entry, the
  `instrumentPlanQueue` wrap had no signal to count. New `EnqueueResult`
  (`{ id, collapsed }` — both required, no exactOptional ambiguity) +
  `plan_queue.enqueue.collapsed.total` counter expose collapse-rate as a
  first-class signal. Same expand-return-shape pattern as ADR-0162's
  budget cost histogram.
evidence:
  code:
    - src/agent/plan-queue.ts
    - src/observability/metrics/instrument-plan-queue.ts
  adrs:
