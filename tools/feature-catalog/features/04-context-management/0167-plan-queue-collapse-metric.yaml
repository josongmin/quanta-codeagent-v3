      - tests/unit/plan-queue-hellgate.test.ts
      - tests/unit/observability-metrics-instrument-extra-hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  All bare-string-id callers updated to `result.id`. Collapse-rate is the
  load-bearing signal for "is mid-turn surface spamming keystrokes?".
