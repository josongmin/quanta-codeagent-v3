id: mid-turn-interruption
title: Mid-turn user interruption — capture facade over PlanQueueStore + 3-arm mode + InterruptionPolicy port
section: 4
subsystem: Mid-turn capture facade
order: 88
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
