purpose: |
  Capture facade that maps the CLI "user submitted while streaming"
  signal onto ADR-0128's PlanQueueStore. 3-arm closed `InterruptionMode`
  (`queue` / `cancel-and-replace` / `cancel-and-amend`) — caller picks
  based on UI surface (typed-ahead = queue; `Cmd-K` = replace; "wait I
  forgot..." = amend). `InterruptionPolicy` port + 3 stock impls
  (`defaultInterruptionPolicy` defensive-queue on unknown mode;
  `alwaysQueuePolicy` / `alwaysCancelPolicy` testing stocks).
  `defaultMidTurnCapture` no-throw — policy crashes collapse to
  `{action:"queue", reason:"policy-error"}` so typing never silently
  drops. Closes the SOTA gap where the store existed but no capture
  surface knew when/how to call it.
