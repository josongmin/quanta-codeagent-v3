knobs: []
deliberate_hold:
  reason: 'Composition-root wiring (ctx.forkSession 슬롯) 는 후속 PR — 현재는 port + CLI + hellgate 만 land. REPL surface 가 `defaultForker({ base, shadowOdb, workspaceRoot })` 로 instantiate 하면 즉시 활성.'
  promotion_path: 'REPL surface 에서 (1) `ConversationCheckpointStore` + `defaultSessionForker` 인스턴스, (2) `defaultShadowOdb` 인스턴스, (3) `defaultForker({...})` 조립, (4) `slashCtx.forkSession = { port, activeSessionId }` 슬롯 채움. 그 4-line wire 만 추가하면 L4.'
notes: |
  - 8-arm closed ForkError union (ADR-0201 4 + ADR-0226 4 신규):
    `checkpoint-not-found` / `store-full` / `lineage-cycle` / `duplicate-id`
    / `fork-not-configured` / `aborted` / `invalid-branch-name` /
    `shadow-odb-failed`. 추가 arm 은 `ALL_FORK_ERROR_CODES` 튜플 갱신
    필수 (모든 consumer 의 exhaustive switch compile fail).
  - `ParentLinkStore` LRU cap = 500 (conversation-checkpoint 50 의 10×;
    branch label 은 messages array 보다 작다).
  - Shadow ODB tag 는 BEST EFFORT — registerHead throw 시 session+link
    은 보존 (새 session 사용 가능), `shadow-odb-failed` 만 surface.
    이 invariant 는 FP-10 hellgate 가 봉인.
  - Branch-id alphabet 은 정확히 64자 (A-Z + a-z + 0-9 + `-` + `_`) —
    256 % 64 === 0 이라 byte modulo bias 0. URL-safe (`=` / `+` / `/`
    절대 누출 X).
  - `/fork-checkpoint` ≠ `/fork`: 후자는 session 의 message-id 로 fork
    (rewind-cmd.ts, ADR session-level), 전자는 ConversationCheckpointStore
    의 ref 로 fork (richer port). 다른 ID space → 별도 명령.
