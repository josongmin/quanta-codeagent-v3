purpose: |
  ADR-0201 의 base `SessionForker` 를 둘러싸는 RICHER `ForkSessionPort` —
  Claude `/fork` + Cursor session-fork 가 노출하는 4-axis UX 흡수:
  (1) 사람이 grep 할 수 있는 `branchName` (URL-safe 64-char alphabet,
  collision-resistant ~126-bit branch id);
  (2) `AbortSignal` cancellation — abort 시 zero observable state mutation;
  (3) Shadow ODB fork-tag (BEST EFFORT — 실패해도 session+link 보존,
  `shadow-odb-failed` typed error 만 surface);
  (4) `listBranches` / `resolveParent` API + per-link metadata
  (parent session id / branch point / forked-at / branch name).
  CLI surface: `/fork-checkpoint` slash command (ADR-0226) — 기존 `/fork`
  (session-message-id fork, ADR's `rewind-cmd.ts`)와 NAME 차별화로 충돌
  회피. Default-OFF: composition-root 에서 `ctx.forkSession` 미와이어시
  슬래시 명령은 "not wired" exit 0 (byte-identical). nanoid 대신 in-house
  `branch-id.ts` (~50 LOC, node:crypto.randomBytes) — install 차단 우회.
