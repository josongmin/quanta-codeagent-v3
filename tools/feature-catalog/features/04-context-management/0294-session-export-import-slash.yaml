notes: |
  - Plane-clean: `@/session/import-export`, `@/session/import-export-fs`,
    `@/session/types`, `node:fs/promises`, `node:path`, `node:os`,
    `is-path-inside` (기존 dep). `@/storage` / `@/permission` / `@/agent`
    절대 import X — host adapter 가 store 추상화.
  - REPL surface now wires `sessionIo` from the default V2 session store,
    so `/session export|import` is active on the main interactive path
    rather than slash-only plus pending host follow-up.
  - Id rewrite on import: 임포트 시 `meta.id` 를 새로 minted id 로 덮어씀.
    안 그러면 store index 와 file 의 meta.id 가 drift. 같은 envelope 을
    두 번 import 하면 두 개의 별도 session 생성 — by design.
  - Sidecar EMIT 은 미와이어 (ctx.sessionIo 에 per-subsystem serialize
    hook 없음 — 후속 와이어). Sidecar PRESERVE on import 는 동작 — summary
    line `imported into session <id> (N messages, sidecar=<keys>)` 에 노출.
  - 50 MB cap 은 stat() size 로 read 전에 게이팅. 4 GB JSON 이 OOM 못 함.
  - 22 hellgate cases / 87 expects / tsc 0 / biome 0 errors / 0 warnings
    on slice (slice-isolation 예외는 biome.json 의 기존 CLI-test 패턴 따름).
