purpose: |
  ADR-0294 — `/session export <id>` + `/session import <path>` 슬래시 명령으로
  ADR-0157 (`src/session/import-export.ts` + `import-export-fs.ts`) 의 순수
  serialization primitive 를 CLI 표면에 노출. 사용자 워크플로우:
  (1) `/session export <id> [--out=<path>]` — host 의 session store 에서 id 로
  읽어 v1 envelope 으로 감싸 디스크에 JSON 저장 (default 파일명:
  `<cwd>/quanta-session-<id>-<ts>.json`);
  (2) `/session import <path> [--id=<id>]` — envelope 파싱 (typed
  `SessionImportError`), host store 에 fresh-minted (또는 사용자 지정) id 로
  영속화.
  Default-OFF (RFC §1.2): `ctx.sessionIo` 미와이어 ⇒ "not wired in this
  surface" + exit 0 (byte-identical to NOT registering). Path safety —
  `--out` / `<path>` 는 cwd 또는 `$HOME` 하위만 허용 (is-path-inside 기존
  dep 재사용). Import 50 MB cap (corpus P90 10MB / P99 52MB 사이). No-throw:
  모든 FS 오류 + SessionImportError 는 ctx.err 에 typed 메시지 + exit 1, never
  re-thrown.
