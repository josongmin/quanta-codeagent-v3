deliberate_hold: null
notes: |
  Memory slice 도 같은 chars/4 휴리스틱을 쓰지만 `@/memory` 를 산술용으로 import
  하면 결합도가 늘어 본 모듈은 로컬 사본 유지(RFC §3.1).
