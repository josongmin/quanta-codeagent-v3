id: token-estimator-chars-quarter
title: estimateTokens — chars/4 heuristic with image fixed-budget
section: 4
subsystem: Token estimator — 압축 threshold 게이트 입력
order: 22
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: integrated
config_refs:
  env: [QUANTA_COMPACT_TOKENS]
owners: ["@songmin"]
labels: [surface:core]
purpose: |
  Threshold 게이트(`compactIfNeeded` / reactive drop-ratio guard) 입력으로 사용되는
  `estimateTokens(messages)` 휴리스틱. `blockChars` 는 ContentBlock 변종별로 분기 —
  `text`/`thinking`은 본문 길이, `tool_use`는 name + JSON-stringify(input),
  `tool_result`는 content 길이, `image`는 고정 `IMAGE_CHAR_ESTIMATE = 6000` (≈ 1.5k
  tokens, base64 길이는 context-token footprint 의 신뢰 proxy 가 아님 — ADR-0083).
  ContentBlock 닫힌 union 은 `_exhaustive: never` 로 build-time pin — 새 변종은 tsc 가
  잡고, 런타임 forward-compat payload 는 stringify length 로 graceful fallback(NaN-poison
  방지). `resolveThreshold` 는 caller 명시 > `runtimeConfig().compactTokens`(env)
  > `DEFAULT_THRESHOLD=120_000` 의 한 곳-읽기-정책(S5).
evidence:
