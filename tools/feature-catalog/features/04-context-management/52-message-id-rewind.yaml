id: message-id-rewind
title: Message-id rewind — transcript truncate-to-message UX
section: 4
subsystem: 세션 영속 — message 단위 rewind (Claude Desktop 1.7196.3 parity, ADR-0052)
order: 52
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: [absorbed:claude-code, surface:core]
ui_surfaces: [cli]
configurable: integrated
config_refs:
  env: ["QUANTA_SESSION_LIST_FORMAT", "QUANTA_SESSION_LIST_MAX"]
purpose: |
  Claude Desktop 1.7196.3의 transcript 단위 rewind UX 흡수 — Message.id?: string opt-in 필드를
  src/llm/types.ts에 추가(byte-identical default-OFF: 기존 세션 파일은 id 없이 load/save,
  messageSchema는 absent 허용). assignMessageIds(messages, idFor?) 헬퍼는 새 array 반환(input
  불변), 기존 id는 byte-identical 보존, 없는 것만 crypto.randomUUID() 또는 결정성 idFor로 mint.
  rewindToMessage(sessionId, msgId): { removed }는 transcript에서 msgId를 찾아 그 message
  **자체는 보존**하고 이후만 truncate("checkpoint TO, not past" 시맨틱 — Claude Desktop과
  동일). missing session / empty transcript / unknown msgId / msgId가 last인 경우 모두
  removed:0 no-op(예외 미발생). forkSession은 무변경 — rewind+fork 결합은 CLI/UX layer 책임.
  CLI: `quanta session rewind <id> <msg-id>` subcommand. JSONL envelope(ADR-0034)은
  append-only 불변 유지 — snapshot JSON만 truncate, replay 도구는 post-rewind snapshot과
  envelope 교집합으로 reconcile.
