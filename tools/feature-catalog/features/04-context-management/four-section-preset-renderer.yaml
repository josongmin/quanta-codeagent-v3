id: four-section-preset-renderer
title: fourSectionPreset + buildSectionedSystemBlocks — pure renderer (collapse-empty)
section: 4
subsystem: 4-section system prompt 렌더러 (Claude Desktop systemPromptSectionCache 패턴)
order: 11
maturity: L4
status: stable
purpose: |
  Pure 렌더링 모듈. `fourSectionPreset(input)` 은 `base + project_md + session_ctx +
  user_append` 4-튜플에서 whitespace-only 입력을 자동 collapse — 결과는 항상 1..4
  PromptSection, 빈 블록 없음. `buildSectionedSystemBlocks(sections)` 는 그 리스트를
  `SystemBlock[]` 으로 1:1 매핑(filter 0). `defaultPromptSections(base)` 는 legacy
  1-section preset(byte-identical legacy). `MAX_CACHE_BREAKPOINTS=4` 상수는 Anthropic
  cache_control cap. `01-agent-loop/51-sectioned-system-prompt` 와 분리: 그 yaml은
  `buildTurnContext` 활성 path 의 wiring 을, 본 yaml은 sections 자체의 pure 렌더링
  contract 를 다룬다.
evidence:
