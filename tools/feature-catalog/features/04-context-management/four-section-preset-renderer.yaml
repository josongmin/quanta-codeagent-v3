    - src/agent/prompt-sections.ts
  adrs: [51, 68]
  tests:
    unit:
      - tests/unit/agent/prompt-sections.test.ts
      - tests/unit/prompt-sections-hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  PromptSection.cache 가 `false` 인 entry 는 breakpoint 를 소비하지 않음
  (`validateSectionsCacheBudget` 의 count 로 honor). 4-section 위반은 by-construction
  불가능하지만 future preset 확장 대비 dev-mode guard 로 유지.
