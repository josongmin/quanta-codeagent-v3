id: side-chat-session-isolation
title: SideChatManager — auxiliary conversation lifecycle with parent isolation (ADR-0244)
section: 4
subsystem: Auxiliary conversation / side-chat (Claude LocalSessions parity)
order: 63
maturity: L1
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: static
owners: ["@songmin"]
labels: [absorbed:claude, surface:core]
depends_on: [conversation-checkpoint-store]
surface_integration:
  cli: missing
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "src evidence not reachable from the interactive CLI entry (src/apps/cli/index.ts) — wired only into other apps (eval/bench/probe/headless) or unwired"
    web: "Pure internal lifecycle primitive, no surfaced slash or UI affordance on any surface."
purpose: |
  Claude Desktop `LocalSessions.{startSideChat, sendSideChatMessage,
  stopSideChat}` 흡수 — 부모 세션 컨텍스트를 보호하면서 임시 보조 대화를
  실행하는 addressable lifecycle 프리미티브. ADR-0201 fork-session 은
  *스냅샷 분기* 가, ADR-0049 side-conversation-seam 은 *익명 prompt
  rewrite* 가 담당 — 이 슬라이스는 그 사이의 빈 칸인 "id 있고 list/
  send/stop 가능하지만 parent.messages[] 는 절대 mutate 하지 않는 보조
  conversation" 을 채운다. CORE invariant: 어떤 SideChat 작업도 부모
  세션의 `messages[]` 를 변경하지 않음 (HELL-SC-04/09 deep-equal 봉인).
  Default-OFF: composition-root 가 직접 `defaultSideChatManager()` 를
  instantiate 하지 않는 한 zero observable mutation, zero new state,
  zero new tool registration (HELL-SC-12). 6-arm closed `SideChatError`
  union + 2-arm closed `SideChatState` (assertNever 봉인). cross-parent
  isolation (HELL-SC-07), nested depth=2 MVP (HELL-SC-08), 1000-동시
  격리 (HELL-SC-11), AbortSignal honour (HELL-SC-13), parent 종료 시
  자동 stop (HELL-SC-15).
