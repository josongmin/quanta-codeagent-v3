  code:
    - src/agent/side-chat/types.ts
    - src/agent/side-chat/port.ts
    - src/agent/side-chat/default-manager.ts
    - src/agent/side-chat/index.ts
  adrs: [244, 201]
  tests:
    unit:
      - tests/unit/agent/side-chat-hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold:
  reason: 'MATURITY = L1 (scaffold / NON-LLM stub). `src/agent/side-chat` has ZERO production importers and its `makeReply` synthesizes a placeholder `[side-chat ack] received <n> chars` with NO `@/llm` — it is structurally incapable of an LLM turn. The CANONICAL, LLM-backed side-chat is `src/runner/orchestrate/side-chat.ts` (L4, wired via `runner/orchestrate/index.ts`); THAT is the SSOT for the concept. This slice is the isolation-primitive scaffold only (port + default stub + 15 hellgate), kept for the parent-messages[]-immutability contract, NOT an operational side-chat. It makes no L3 claim (the ALBB-15 reachability floor, ≥L3, would flag it). composition-root 미와이어 상태에서는 byte-identical default-OFF (HELL-SC-12).'
  promotion_path: 'REPL surface 가 (1) `defaultSideChatManager()` instantiate, (2) `slashCtx.sideChat = { manager, activeParentSessionId }` 슬롯 채움, (3) `/sidechat start|send|stop|list` 명령 라우팅. send 의 placeholder reply 는 `LLMPort.complete({ messages: chat.messages })` 호출로 교체 — port shape 변경 없음.'
notes: |
  - 6-arm closed SideChatError union: `unknown-id` / `not-active` /
    `aborted` / `invalid-prompt` / `invalid-parent` / `capacity-exceeded`.
    추가 arm 은 `ALL_SIDE_CHAT_ERROR_CODES` 튜플 갱신 + 모든 consumer
    의 exhaustive switch compile-fail 강제.
  - 2-arm closed SideChatState (`active` / `stopped`) — assertNever
    봉인. HELL-SC-14 가 exhaustive switch 정확성을 컴파일+런타임 양쪽
    에서 검증.
  - capacity cap = 1000 active entries per manager. eviction policy:
    stopped 먼저 제거 → 그래도 부족하면 `Err("capacity-exceeded")`
    (active 는 절대 침묵으로 evict 하지 않음 — 사용자의 in-progress
    대화를 잃지 않기 위해).
  - Cross-parent isolation: SideChatId → parent lookup table 은 매
    operation 마다 parent ownership 검증. list(parentB) 는 parent A
    의 chat 을 *컴파일 시점에 보장* 하는 것이 아니라 런타임 lookup
    필터 — HELL-SC-07 가 잘못된 reachability 를 봉인.
  - Nested depth=2 MVP: 한 SideChat 컨텍스트에서 또 다른 start() 호출
    이 정상 동작 (HELL-SC-08). 더 깊은 nesting 은 명시적으로 supported
    하지 않으며, depth 카운팅은 caller 책임 (이 슬라이스는 parent
    ownership 만 추적, depth 차원은 비기록).
  - parent 종료 시 cleanup 은 `closeAllForParent(parentId)` 명시 호출.
    Automatic ref-counting / WeakRef 는 도입 X — 명시적 lifecycle 이
    부모 세션 owner code path 의 단일 책임.
