notes: |
  2026-05-23 Cursor 흡수 (memory `glob-rules-and-hook-updated-input`). 본 모듈 + 짝
  feature `hook-updated-input`이 같은 라운드. Cursor parity는 두 종류만 (alwaysApply +
  globs); minimatch 호환 glob (Skill activation과 동일 `matchesAnyGlob`). frontmatter
  파서는 Skill과 공유. hellgate test: DoS within caps + abs path + rule count cap +
  throwing matcher poison + YAML fold (cursor-absorption-r1-r4-hardening 라운드).
