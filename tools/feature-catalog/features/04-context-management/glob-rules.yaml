id: glob-rules
title: Glob-matched + always-applied auto-injected rules (Cursor .mdc parity)
section: 4
subsystem: File-scoped rule auto-injection (Cursor `.cursor/rules/*.mdc` absorption)
order: 50
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: integrated
telemetry_keys: ["gen_ai.response.time_to_first_token_ms", "quanta.conversation.id"]
modes: [n-a]
configurable: n-a
owners: ["@songmin"]
labels: [absorbed:cursor, surface:core]
depends_on: [hook-updated-input]
purpose: |
  Cursor의 4 rule kind 중 2개 (alwaysApply + glob-matched)를 흡수 — 모델이 요청 없이
  프롬프트에 자동 주입되는 file-scoped 룰. `.cursor/rules/*.mdc` 와 `.quanta/rules/*.mdc`
  를 frontmatter (`alwaysApply` + `globs`) + body로 파싱, 매 턴 `changedPaths` 와 매칭해
  per-turn select → prompt block 주입. `repo-rules.ts`(AGENTS.md/CLAUDE.md 전체 매 턴)와는
  분리: 이 모듈은 多 small 룰 中 *이 턴의 파일들에 해당하는 것만* 골라 토큰 예산 절약.
  예: "React component conventions" 룰은 `*.tsx` 만지는 턴에만 burn. agent-requestable(lazy
  body)은 Skill progressive-disclosure로, manual(@-mention)은 user surface로 — 본 모듈
  scope 밖. config.globRules가 wire되지 않으면 byte-identical (RFC §1.2 default-OFF).
