id: session-git-fingerprint
title: Session git fingerprint capture (sha + branch + origin URL)
section: 4
subsystem: Session 메타데이터 — 재현성 fingerprint (ADR-0106)
order: 50
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: partial
modes: [n-a]
configurable: n-a
owners: ["@songmin"]
labels: [absorbed:codex, surface:core]
depends_on: [session-jsonl-envelope]
configurable: static
purpose: |
  Captures the three-field git fingerprint (HEAD sha / branch / origin URL)
  onto `SessionMeta` so replay / trajectory / reproducibility surfaces know
  exactly which commit a session ran against. Codex §18.9 absorption
  (`threads.git_sha + git_branch + git_origin_url`). Best-effort: each field
  is fetched in its own try/catch so a spawn failure on one query does not
  cancel the others — a partial fingerprint (sha but no origin) is valid
  output for a local-only repo. Detached-HEAD is observable as
  "sha present, branch absent" (no special-case enum). Closed-port design:
  takes an injected `GitRunner` so the capture works under fake runners in
  tests and real `Bun.spawn` in production.
