id: prompt-source-payload-widening
title: PromptSource / PromptPayload type widening (string | {text, images?})
section: 4
subsystem: Surface-agnostic prompt provider port (Layer-2 runner)
order: 60
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: n-a
owners: ["@songmin"]
labels: [surface:core]
purpose: |
  Layer-2 `@/runner`가 surface (CLI raw-mode / Web WebSocket / Tauri IPC)에
  의존하지 않도록 노출한 `PromptSource` 포트 + `PromptPayload` back-compat union.
  `PromptPayload = string | { text, images? }` — pre-multi-modal surface는 plain
  string 그대로 반환(byte-identical), 이미지가 있는 turn에만 `{ text, images }`
  객체로 opt-in. `runInteractive`가 `normalizePromptPayload`로 `{ text, images: [] }`
  로 정규화한 뒤 `runOnce`에 전달 → 기존 text-only surface는 컴파일/런타임 무변경.
  Drain semantics: 이미지는 `next()` 한 번 호출당 정확히 한 번만 그 turn에
  attach (다음 turn에 carry-over 없음, ImageQueue가 enforce).
evidence:
