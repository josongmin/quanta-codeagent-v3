knobs: []
deliberate_hold: null
notes: |
  R6 type-widening track. Layer-2 surface-agnostic invariant 유지: runner는
  raw-mode/WebSocket/IPC를 직접 모른다. CLI adapter는
  `src/apps/cli/repl/prompt-pipeline.ts`의 `localPayload()`가
  `ImageQueue.drain()`을 accepted prompt마다 정확히 한 번 호출해
  multi-modal envelope을 만든다. Legacy `run-interactive.ts` /
  `prompt-source.ts` seam은 runtime-SDK cutover에서 제거됐다.
