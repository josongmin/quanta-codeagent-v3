id: prompt-source-payload-widening
title: PromptSource / PromptPayload type widening (string | {text, images?})
section: 4
subsystem: Surface-agnostic prompt provider port (Layer-2 runner)
order: 60
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: static
owners: ["@songmin"]
labels: [surface:core]
depends_on: [assemble-config, runner-run-interactive, repl-code-smell-cleanup, runner-multimodal-image, abort-signal-compose]
purpose: |
  Layer-2 `@/runner`가 surface (CLI raw-mode / Web WebSocket / Tauri IPC)에
  의존하지 않도록 노출한 `PromptSource` 포트 + `PromptPayload` back-compat union.
  `PromptPayload = string | { text, images? }` — pre-multi-modal surface는 plain
  string 그대로 반환(byte-identical), 이미지가 있는 turn에만 `{ text, images }`
  객체로 opt-in. 현재 live path는 CLI `prompt-pipeline`이 local prompt를
  `string | { text, images }`로 만들고, `runOnce`가
  `normalizePromptPayload`로 `{ text, images: [] }` 형태로 정규화한 뒤
  `runAgent`에 전달한다. 기존 text-only surface는 컴파일/런타임 무변경.
  Drain semantics: 이미지는 accepted prompt 한 번당 정확히 한 번만 그 turn에
  attach (다음 turn에 carry-over 없음, ImageQueue가 enforce).
evidence:
  code:
    - src/runner/orchestrate/prompt-payload.ts
    - src/runner/orchestrate/run-once.ts
    - src/apps/cli/repl/prompt-pipeline.ts
    - src/apps/cli/repl.ts
  adrs: []
  tests:
