knobs: []
deliberate_hold: null
notes: |
  R6 type-widening track. Layer-2 surface-agnostic invariant 유지: runner는
  raw-mode/WebSocket/IPC 모름. CLI adapter는 `src/apps/cli/repl/prompt-source.ts`
  에서 `buildCliPromptSource` 가 `ImageQueue.drain()`을 매 `next()`마다 호출해
  multi-modal envelope을 만든다. Web/Tauri는 동일 포트로 다른 어댑터 가능.
