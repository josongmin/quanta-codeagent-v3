id: model-tag-auto-hook
title: ModelTag invalidator auto-hook — EmbedCache + VectorStore registrar (ADR-0273)
section: 4
subsystem: retrieval — embedder swap → cache + store auto-invalidate seam
order: 273
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: integrated
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "adr:0273", "default-off", "leaf-slice"]
depends_on:
  - model-tag-versioning
  - embed-cache
surface_integration:
  cli: na
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "Pure retrieval invalidator-registrar primitive, default-OFF, never called by any composition root."
    web: "Pure internal registrar seam, no UI affordance on any surface."
purpose: |
  Wrap the ADR-0266 ModelTag invalidator's callback registry with a
  single registrar that stages a cache + a store and attaches them as
  `InvalidationCallback`s in one call. Composition roots get a one-line
  seam instead of N hand-rolled shims around `cache.invalidate(tag)` +
  `store.delete(ids)`. Default-OFF — if `installAll(invalidator)` is
  never called the invalidator registry stays empty (byte-identical to
  the pre-ADR baseline). Cache + store are duck-typed (CacheLike /
  StoreLike); the slice does NOT import @/retrieval/cache or
  @/retrieval/engines/store directly, so it stays a leaf installable
  from any composition root.
evidence:
  code:
    - src/retrieval/auto-hook/types.ts
    - src/retrieval/auto-hook/port.ts
    - src/retrieval/auto-hook/default-registrar.ts
    - src/retrieval/auto-hook/index.ts
  adrs:
    - docs/decisions/0273-model-tag-auto-hook.md
    - docs/decisions/0266-model-tag-versioning.md
  tests:
    unit:
      - tests/unit/retrieval/auto-hook-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: AutoHookRegistrarOptions.onWarn
    default: 'console.warn'
    purpose: 'overrideable'
  - name: AutoHookRegistrarOptions.onUnregisterError
    default: 'console.warn'
    purpose: 'overrideable'
  - name: registerCacheHook
    default: 'undefined'
    purpose: 'opt-in staging; null = no-op + warn'
  - name: installAll
    default: 'undefined'
    purpose: '(invalidator) idempotent disposal thunk; second call is no-op'
deliberate_hold:
  reason: |
    The slice attaches duck-typed `CacheLike` / `StoreLike` to the
    invalidator registry. Concrete bulk-purge wiring for stores that
    need delete-by-filter (i.e. delete every doc tagged with the old
    modelTag) is left to the store implementation — the store registers
    its own `InvalidationCallback` directly via
    `registerInvalidationCallback(...)`. This is consistent with ADR-0266's
    "consumer owns the wiring" posture and avoids leaking store layout
    into the registrar.
  promotion_path: |
    Documented in ADR; wire when ROI concrete.
notes: |
  Hellgate 12 cases (HELL-AH-01..HELL-AH-12) cover registration → fire
  flow for cache, store, and both; callback isolation when one hook
  throws; UnregisterAll cleanup + idempotency; re-install after teardown;
  byte-identical default-OFF; null-target tolerance + warn; concurrent
  invalidateAll safety; 1000-lifecycle perf sanity; AutoHookError 3-arm
  closed exhaustive switch. `exactOptionalPropertyTypes` is intentionally
  omitted on `AutoHookRegistrarOptions` for ergonomic literal `{}`
  call-sites.
