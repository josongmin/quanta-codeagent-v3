purpose: |
  Closed-port typed event store that sits PARALLEL to the working memory
  message buffer. ADR-0320 ships the 5-variant foundation
  (context_update / skill_activation / repo_rules_change / mode_change /
  reasoning_echo) + in-memory adapter; ADR-0324 added the 6th variant
  compaction_event; ADR-0335 extended to 8 variants (plugin_activation,
  app_activation) verified against Codex Desktop bundle ground truth.
  `since(at)` semantics is INCLUSIVE on the lower bound. wm is never
  mutated by this slice — additive side-channel.
