    contract: []
knobs: []
deliberate_hold: null
notes: |
  DIP inversion — the runner slice doesn't know how surfaces want to log
  the minted id; it just exposes a typed callback the surface owns. One-shot
  fire (`onSessionMinted?.(newId)` inside the new-session branch).
