id: reactive-compaction
title: reactiveCompact — PTL-recovery aggressive squeeze + continuation summary
section: 4
subsystem: 압축 — reactive (proactive 보다 더 강한 squeeze)
order: 20
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: partial
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: [surface:core]
purpose: |
  Proactive `compactIfNeeded` 가 `DEFAULT_KEEP_TURNS=6` 으로 부드럽게 줄이는 반면,
  `reactiveCompact` 는 loop 이 이미 "prompt is too long" API 에러를 맞은 뒤 호출되는
  harder squeeze. `REACTIVE_KEEP_TURNS=2` 만 verbatim 유지하고 CONTINUATION_SYSTEM
  프롬프트로 요약 — "history recall" 이 아니라 "fresh context 에서 task resume" 을
  목표로 한다. `findBoundary` 재사용으로 tool_use / tool_result pair 는 절대 쪼개지
  않음. Fail-fast 가드 2개: (1) boundary <= 0 ⇒ "no summarizable prefix"; (2)
  inputTokens >= `REACTIVE_MIN_INPUT_TOKENS(4_000)` 인데 drop ratio <
  `REACTIVE_MIN_DROP_RATIO(15%)` ⇒ "limiting payload in retained suffix" — 의미없는
  retry 로 PTL 을 다시 맞지 않게 한다.
