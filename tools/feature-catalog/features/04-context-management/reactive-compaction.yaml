notes: |
  CC `rapid_refill_breaker` intent 거울 — drop-ratio 가드가 그 역할. CONTINUATION_SYSTEM
  은 (1) task/goal, (2) verified vs assumed 표시한 진행상황, (3) 핵심 파일·상태,
  (4) 다음 정확한 명령/edit 를 `<summary></summary>` 로 감싸도록 강제 — 막연한
  방향이 아니라 즉시 실행 가능한 continuation 만 emit.
