purpose: |
  ADR-0159 retrieval slice 의 first-stage 누락 봉합 — Phase 7 pluggable
  lexical engine. 닫힌 `LexicalSearch` port (`index` / `query` / `clear` /
  `size`) + 2 production adapter (in-memory BM25 + ripgrep shell-out) +
  deterministic headless stub. BM25 는 Lucene defaults (k1=1.5, b=0.75)
  configurable + UTF-8 word-boundary tokenizer (`\p{L}\p{N}+`) — 기존
  `rerank/bm25-secondary` 의 ASCII-only tokenizer 는 다른 axis 라 unchanged.
  Ripgrep adapter 는 `rg --json` shell-out + `grep -F -r -c` fallback +
  `degradeReason: "rg-missing"` 한 번만 surface. 모든 query 는 `--fixed-strings`
  로 literal match (regex 메타 escape 불필요). 5-arm closed `LexicalError`
  (`no-search-binary` / `spawn-failed` / `parse-failed` / `invalid-query`
  / `aborted`) — exhaustive switch 강제. Default-OFF: 어떤 hybrid-query
  consumer 도 pre-wire 안 됨, byte-identical land. Stub 은 BM25 scoring
  을 미러링해 prod adapter 와 byte-identical (스코어 drift 0).
