deliberate_hold:
  reason: 'Composition-root wiring (`hybrid-query.bm25Source` 슬롯) 는 후속 PR. 현재는 port + 2 adapter + stub + 15-case hellgate 만 land. 호출 사이트는 `createBm25LexicalSearch()` 혹은 `createRipgrepLexicalSearch({ root, spawner })` 인스턴스를 `bm25Source` 콜백에서 호출하면 즉시 활성.'
  promotion_path: 'composition root 에서 (1) lexical engine 인스턴스 1 회 생성, (2) 기존 `bm25Source: async () => (await engine.query(q, k)).value` 와이어, (3) `degradeReason` 을 observability sink 로 forward. 3-line wire 만으로 L4.'
notes: |
  - 5-arm closed `LexicalError` union: 추가 arm 은 `ALL_LEXICAL_ERROR_KINDS`
    tuple 갱신 필수 (모든 consumer exhaustive switch compile fail).
  - Tokenizer 는 `\p{L}\p{N}+` (Unicode property class) — CJK / Korean /
    Cyrillic / Arabic 포함. 기존 `bm25-secondary` reranker 의 `[A-Za-z0-9]+`
    은 다른 axis 라 변경 없음 (의도적 분리).
  - Ripgrep `--fixed-strings` (`-F`) 로 literal match — regex 메타
    (`. * + ? [ ]` 등) escape 불필요. Phrase / regex / boolean DSL 은
    future ADR.
  - degrade order: `rg` → `grep` → `Err("no-search-binary")`. degrade 는
    FIRST `index` result 의 `degradeReason` 으로 한 번만 surface (이후
    query 마다 재-probe 안 함).
  - Stub 은 BM25 scoring 을 prod adapter 와 byte-identical 미러링.
    HELL-LX-01 (round-trip) + HELL-LX-13 (10k-doc sanity) 가 두
    adapter 모두에서 실행되어 lock-step 봉인.
  - AbortSignal: pre-aborted → 즉시 `aborted` (spawn 회피). in-flight
    abort 는 proc.kill() + 동일 결과.
