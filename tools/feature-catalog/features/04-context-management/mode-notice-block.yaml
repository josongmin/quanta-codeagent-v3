purpose: |
  PLAN/REVIEW/AUDIT 모드 별 verbatim 본문을 `PLAN_NOTICE` / `REVIEW_NOTICE` /
  `AUDIT_NOTICE` 상수로 고정하고, `modeNotice(mode)` 가 mode → notice text 매핑
  (default 는 undefined → block 미렌더). `resolveAgentMode(input.mode, input.planMode)`
  ADR-0018 SSOT 를 prompt + dispatch admissibility gate 가 공유 — per-turn 텍스트
  reminder 와 mutating-block dispatch decision 이 절대 disagree 하지 않음. Notice 의
  공통 invariant: "Do NOT modify anything" + 모드별 outcome 형식(plan ⇒ step-by-step
  plan, review ⇒ findings-first severity ordering, audit ⇒ 4-truth-surface mismatch
  report).
