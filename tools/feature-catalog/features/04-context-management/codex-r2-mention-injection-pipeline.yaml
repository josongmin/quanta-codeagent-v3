purpose: |
  4-layer mention pipeline parsing `@skill` / `plugin://name` / `@@app`
  out of user input and producing persistent typed events + injection
  messages. ADR-0325 ships parser + resolver port + event-emitter +
  inject-message builder (parser: ASCII kebab `[a-z][a-z0-9-]*`, email FP
  rejected via `\w`-negative left-boundary, dedup by (kind, target)).
  ADR-0330 adds the skill-only resolver impl `createSkillOnlyResolver`
  rooted in `SkillRegistryReadOnly` (progressive-disclosure first-line of
  description). ADR-0340 closes the dangling primitives:
  `createPluginActivationHandler` per-session closure does MCP spawn +
  skill resolve + typed-event emit; `activatePluginsFromMentions`
  aggregates across multiple plugin mentions. AgentConfig.activatePlugins
  function slot is closure-pattern (NO-THROW, idempotent per pluginId).
