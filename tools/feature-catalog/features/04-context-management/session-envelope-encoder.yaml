purpose: |
  Encode/decode pair for the per-line records that make up the session JSONL
  rail. `encodeSessionLine` emits one JSON object terminated by exactly one
  `\n`, with object keys sorted alphabetically at every nesting level so two
  semantically-equal records produce byte-identical wire forms (ADR-0023
  byte-identical replay invariant). No trailing whitespace, no pretty-print,
  no BOM. `decodeSessionLine` NEVER throws — bad JSON, schema failures, blank
  lines, BOM, CRLF all surface as a typed `EnvelopeDecodeError` (kind:
  parse_json | schema | empty_line). `iterateSessionFile` yields one Result
  per logical line so the caller decides stop / log / skip on a bad line —
  the encoder/decoder never silently swallows.
