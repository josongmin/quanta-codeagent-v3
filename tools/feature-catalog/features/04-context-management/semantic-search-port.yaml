deliberate_hold:
  reason: |
    - 실 embedding adapter (OpenAI / Voyage / Cohere via ADR-0159 EmbeddingPort
      composition) — 이번 라운드는 deterministic headless stub 만
    - persistence (~/.quanta/semantic/{sessionId}.bin 같은 on-disk format) —
      현재는 restart 시 index 소실; 사용량이 정당화되면 sibling ADR로 분리 착륙
    - hybrid (lexical + semantic blend) — ADR-0159 runHybridQuery에 이 슬라이스가
      embeddingSource로 wired 된 다음 라운드
    - HNSW / IVF approximate-NN index — O(N) 선형 스캔이 MVP scale에서는 충분;
      코퍼스 크기가 정당화되면 별도 ADR
    - tool wiring (semantic_search 같은 새 도구 surface) — primitive만 먼저 안전
      착륙, wiring은 후속
notes: |
  Sibling 시 import 방향: src/retrieval/semantic/ → @/shared (Result/ok/err) 만.
  다른 슬라이스 / 다른 retrieval 파일 역참조 없음. 기존 src/retrieval/{embedders,
  commit-embedder, hybrid-query, index}.ts 는 이 라운드에서 unchanged. 슬라이스
  primitive 안전 착륙 후 hybrid-query.embeddingSource 와이어가 다음 단계.

  Cosine 정확도는 hellgate에서 수학적으로 검증 (단순 순서가 아니라 ~1e-9 tolerance
  로 수치 동등) — refactor가 수식을 재유도하다가 normalisation을 빠뜨리는 회귀를
  봉합한다.

  Headless embedder는 hash-based — 의미상 유사한 텍스트가 가까운 벡터가 된다는
  보장이 **없다**. 의미 유사성 신호가 필요한 테스트는 fake Embedder를 직접 손으로
  깔아 cosine 값을 통제한다 (HELL-SS-05가 정확히 그 패턴).
