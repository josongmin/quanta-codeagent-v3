purpose: |
  Cline / Cursor `CLIENT_SIDE_TOOL_V2_SEMANTIC_SEARCH_FULL` 패턴 흡수의 slice
  primitive — 워크스페이스 코퍼스를 in-memory index로 묶고 쿼리 임베딩 대비
  cosine similarity로 top-k 검색. quanta는 `grep`/`glob`/`lsp_nav` 같은
  lexical retrieval과 ADR-0159 hybrid-query 펀넬은 이미 갖췄지만,
  embedding-based 본체 (consumer)는 비어 있었다. 이번 라운드는 closed
  `SemanticIndex` port + 별도 `Embedder` 주입 심 + in-memory cosine adapter +
  결정론적 headless embedder + 15-case hellgate 까지만. 실 embedding model
  (OpenAI / Voyage / Cohere) integration, persistence, hybrid (lexical +
  semantic blend)는 deliberate hold.

  핵심 모양:
    - `SemanticIndex { index(docs), query(text, k), clear(), size() }` — 모든
      I/O 경로 메서드 `Result<…, SearchError>` (no-throw across port)
    - `Embedder { embed(text): Promise<Result<EmbeddingVector, EmbedError>>;
      dim(): number }` — SemanticIndex와 **분리된** 주입 심 (HTTP/I/O 경계 ≠
      pure math)
    - `SearchError = empty-text | invalid-k | embed-failed | dim-mismatch`
      (closed discriminated union)
    - in-memory adapter: Map + cosine + deterministic tie-break (score desc,
      id asc)
    - headless-embedder: Bernstein hash → Mulberry32 PRNG → L2-normalized
      fixed-dim vector (same text ⇒ byte-identical vector)
    - default-OFF byte-identical: 어떤 src/ consumer도 자동 wire 하지 않음
      (RFC §1.2)
