id: today-date-line-clock-port
title: todayDateLine — injected clock port for byte-identical replay (ADR-0078)
section: 4
subsystem: Per-turn dynamic 결정성 — date leak 봉합
order: 13
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: n-a
owners: ["@songmin"]
labels: [surface:core]
purpose: |
  Per-turn dynamic block 의 `Today's date is YYYY-MM-DD.` 라인이 매 턴 wall-clock
  을 빨아들이면 prompt 가 매일 drift 해 byte-identical replay invariant 가 깨진다.
  `TurnContextInput.now?: () => number` 를 주입 가능한 clock port 로 노출 — 프로덕션
  은 `Date.now` 기본, 테스트/replay 는 고정 epoch 를 pin. 패턴은 admissibility-gate /
  memory writer 와 동일한 `opts.now ?? Date.now`. 추출된 헬퍼 `todayDateLine(now?)`
  로 cognitive complexity 절감.
