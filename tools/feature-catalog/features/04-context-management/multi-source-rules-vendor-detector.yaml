id: multi-source-rules-vendor-detector
title: Multi-source rules vendor-detector (5-vendor convergence, ADR-0205)
section: 4
subsystem: Multi-source rule ingestion
order: 20
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: static
owners: ["@songmin"]
labels: [absorbed:cursor, absorbed:cline, absorbed:roo, absorbed:aider, absorbed:windsurf, surface:core, default-off]
depends_on: [loadreporules-cwd]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 6/6 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure rule-ingestion port feeding prompt assembly, default-OFF, no UI affordance"
purpose: |
  6-vendor 자동 감지: .cursor/rules/*.mdc + .clinerules(file|dir) +
  .roo/rules-{mode}/*.md + .aider.conf.yml + CONVENTIONS.md + .windsurfrules +
  .quanta/rules/*. port-shaped (VendorDetectorPort.detectAll → DetectionResult),
  no-throw across boundary, declarative VENDOR_TABLE 6-entry SSOT, priority-
  encoded collision resolution (quanta > foreign vendors). symlink (file+dir)
  reject + 2x body-cap size-skip + maxFiles=256. slice fence: @/rules→@/shared만,
  frontmatter parser 인라인 (gray-matter 미도입 — install blocked + slice fence).
  Default-OFF: detectAll 미호출 시 byte-identical.
evidence:
  code:
    - src/rules/vendor-detector/port.ts
    - src/rules/vendor-detector/vendor-table.ts
    - src/rules/vendor-detector/normalizer.ts
    - src/rules/vendor-detector/default-detector.ts
    - src/rules/vendor-detector/index.ts
    - src/rules/index.ts
  adrs: [205]
  tests:
    unit:
      - tests/unit/vendor-rules-detector-hellgate.test.ts
      - tests/unit/vendor-glob-unconsumed-failclosed-hellgate.test.ts
      - tests/unit/stage1-phase2-consume-and-vendor-glob-e2e-hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold:
  reason: |
    Wiring으로 @/agent/glob-rules.ts 합류는 별 슬라이스 — detector만 신설하고
    loadGlobRules 합성은 후속. Default-OFF로 byte-identical 유지.
    DOF-40 재확인 @b92b3798f: composer(loadGlobRulesWithVendors)는 존재하나
    production call-site 0 — live 경로 rule-indicator.ts:260은 legacy
    loadGlobRules(cwd) 호출. 즉 detectAll은 여전히 seam-only.
  promotion_path: |
    @/agent/glob-rules.ts:loadGlobRulesWithVendors 가 이미 detectAll 을
    호출·GlobRule[] 로 어댑팅. 승격 = src/apps/cli/rule-indicator.ts (미소유,
    별 leaf) 의 loadGlobRules(cwd) → loadGlobRulesWithVendors(cwd, {
    vendorDetectorEnabled:true, onUnconsumed:<진단싱크> }) 교체.
    promotion owner: @songmin.
notes: |
  fast-glob 미사용 — PathKind 3종(file/dir/mode-dir) 닫힌 enum이면 충분.
  새 vendor 추가는 vendor-table.ts 한 줄 + (필요 시) ParserKind 확장.

  DOF-40 fail-closed: detectAll 의 DetectionResult.errors (파싱 실패한
  vendor 파일) 는 loadGlobRulesWithVendors 가 이전엔 silent drop 했으나,
  이제 onUnconsumed sink 로 parse_error 로 표면화 (silent partial 제거).
  detector 자체는 이미 no-throw + errors 누적 (port.ts DetectorError SSOT);
  이 하드닝은 consumer 측 swallow 를 닫음. 커버: vendor-glob-unconsumed-
  failclosed-hellgate.test.ts (red-on-injection 검증됨).

  DOF-40 END-TO-END usability proof (여전히 seam-only — production caller
  = rule-indicator.ts:260 미소유): REAL createDefaultVendorDetector 가 real
  .windsurfrules fixture 를 walk → loadGlobRulesWithVendors → selectGlobRules
  → renderGlobRulesBlock 가 방출한 PROMPT STRING 안에 vendor body 도달을
  실증 (detector 가 실제로 rule 을 prompt 까지 밀어넣음). chmod-000
  .clinerules 파일로 real parse_error → onUnconsumed 실증. 커버:
  stage1-phase2-consume-and-vendor-glob-e2e-hellgate.test.ts.
