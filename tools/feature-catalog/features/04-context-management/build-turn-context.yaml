id: build-turn-context
title: buildTurnContext — system + per-turn dynamic assembly
section: 4
subsystem: 시스템 prompt + per-turn reminder 합성 (ADR-0003 cache prefix)
order: 10
maturity: L5
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: [surface:core]
depends_on: [glob-rules]
configurable: static
purpose: |
  `buildTurnContext(input)` → `{system: SystemBlock[], messages: Message[]}` 한 호출로
  static system prefix(`buildSystemPrompt` 또는 caller 주입)와 per-turn dynamic 블록을
  합성하는 SSOT. Dynamic 데이터(today date / cwd / mode notice / repo-rules / glob-rules /
  active-skills / working-state / memory hints)는 NEVER folded into system — 단일
  trailing `<system-reminder>` user-message로 라이드하므로 caching prefix가 매 턴
  byte-identical. 4-section preset(`projectMd` / `sessionCtx` / `userAppend` 중 하나라도
  non-empty)은 자동 활성, 그 외에는 byte-identical legacy 단일 SystemBlock.
