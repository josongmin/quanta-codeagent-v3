notes: |
  Dynamic 블록은 `embedUntrusted("system-reminder", …)` 단일 path를 통과 — repoRules /
  memory / skill description 안의 forged closer/opener는 defang됨(`prompt-escape.test.ts`).
  순서 invariant(mode → repo-rules → glob-rules → active-skills → working-state →
  memory-hints)는 `01-mode-repo-rules-…` yaml + e2e snapshot이 pin.
