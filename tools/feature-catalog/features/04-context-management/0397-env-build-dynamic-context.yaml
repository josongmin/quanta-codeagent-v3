purpose: |
  buildDynamicContext에 platform(os/arch/version) + shell(SHELL env) +
  git-status(parsePorcelainV2 결과 압축 한 줄) + pkg-mgr(lock 파일 감지
  fixed order: bun.lockb→pnpm-lock.yaml→yarn.lock→package-lock.json)
  4가지 추가. TurnContextInput에 optional `env: TurnEnvContext` 필드 —
  clock-injection 패턴 미러. 주입시 그걸 쓰고(replay 결정성), 없으면 실측.
  byte-identical 보장: env 미입력 ⇒ 동적 블록 기존과 한 줄도 다르지 않음.
  probe는 pre-captured gitPorcelainStdout 받음(GitRunner port 중복 회피,
  assembly 동기 유지).
