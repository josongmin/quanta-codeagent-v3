id: multimodal-embedding-mvp
title: Multi-modal embedding MVP — image + audio embedding port (ADR-0276)
section: 4
subsystem: Retrieval engines — multi-modal embedding seam
order: 45
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: [absorbed:voyage, absorbed:clip, surface:core]
depends_on: []
surface_integration:
  cli: na
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "Pure retrieval MultiModalEmbedder port + adapters, default-OFF, no composition root imports the registry."
    web: "Pure internal embedding port/adapters, no UI affordance on any surface."
purpose: |
  Direct path from a binary blob (image / audio) to a retrieval embedding
  vector. Sibling-extension of ADR-0261 (text-only Embedder + 8 vendor
  factories — unchanged). The new MultiModalEmbedder port accepts a 3-arm
  discriminated input ({kind:"text"|"image"|"audio"}) and returns
  Result<EmbedResult, MMEmbedError> with a closed 6-arm input/config error
  union (missing-api-key / endpoint-missing / unsupported-mime /
  image-too-large / audio-too-large / empty-input). Transport failures
  (429 / 5xx / network) THROW; only user-actionable input/config errors
  appear on the Result arm.
  Three adapters land:
    - voyage-multimodal (POST api.voyageai.com/v1/multimodalembeddings,
      voyage-multimodal-3, dim=1024, text + image only — audio rejected
      with unsupported-mime at API level).
    - clip-rest (configurable endpoint; multipart/form-data for binary
      uploads; supports text + image + audio; endpoint absent →
      endpoint-missing arm before any I/O).
    - headless-stub (deterministic mime+bytes hash → Mulberry32 → fixed-dim
      vector; same input → byte-identical output; no API key needed for
      hellgate / replay paths).
  Registry env-swap (QUANTA_MM_EMBED ∈ {voyage, clip, headless}); unset /
  unknown → null. Default-OFF: no consumer auto-imports this slice in the
  MVP — opt-in is a future ADR.
  ImageBlob / AudioBlob are duck-typed for compatibility with ADR-0126
  read_image (mime + bytes) and ADR-0202 voice capture (mime + bytes)
  without cross-slice import (keeps @/retrieval a leaf).
evidence:
  code:
    - src/retrieval/multimodal/port.ts
    - src/retrieval/multimodal/types.ts
    - src/retrieval/multimodal/voyage-multimodal.ts
    - src/retrieval/multimodal/clip-rest.ts
    - src/retrieval/multimodal/headless-stub.ts
    - src/retrieval/multimodal/registry.ts
    - src/retrieval/multimodal/index.ts
  adrs: [276, 261, 202, 126]
  tests:
    unit:
      - tests/unit/retrieval/multimodal-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_MM_EMBED
    type: enum
    values: [voyage, clip, headless]
    default: '<unset>'
    purpose: 'select MultiModalEmbedder factory via env; unset → registry returns null (caller-owned construction; default-OFF)'
  - name: VOYAGE_API_KEY
    type: string
    default: '<unset>'
    purpose: 'consumed by voyage-multimodal adapter; missing → missing-api-key arm at embed() time'
  - name: QUANTA_CLIP_ENDPOINT
    type: string
    default: '<unset>'
    purpose: 'consumed by clip-rest adapter; missing → endpoint-missing arm at embed() time'
deliberate_hold:
  reason: |
    MVP intentionally LIMITED: locks the port shape + three adapters + 18-case
    hellgate, but does NOT integrate with the retrieval pipeline. No vector
    store consumes MM vectors. No semantic / hybrid-query / commit-embedder
    edits. Default-OFF: no composition root imports the registry. Existing
    ADR-0261 byte-identical.
  promotion_path: |
    Separate ADRs to follow:
      - real vector store columns for image/audio vectors (in-memory cosine
        works as-is; lance / qdrant need image/audio collection schemas);
      - retrieval pipeline integration (hybrid-query with modality filter);
      - dedicated audio embedding model (Whisper-hidden-state / CLAP) —
        the port shape is locked here, so a new adapter is the only delta.
notes: |
  - exactOptionalPropertyTypes-safe: optional fields are absent or defined,
    never explicitly `undefined`.
  - No external lib install: voyage uses fetch + JSON; clip uses fetch +
    hand-rolled multipart/form-data writer (Uint8Array concat). Both
    transports are injected (`fetchImpl`), so tests stay network-free.
  - Headless stub: deterministic djb2(mime+":"+hex(first-1KiB)) → Mulberry32 →
    dim floats in [-1,1]. Default dim=1024 (configurable per factory call).
  - Transport classes:
      4xx → folds into missing-api-key arm (user-actionable: fix key/model)
      429 → throws Error("rate-limited") (transport, not domain)
      5xx / network / abort → throws raw (caller wraps if desired)
    The 6-arm closed union stays input/config-only, so consumer switches
    don't see transient transport noise.
  - sibling to ADR-0261 (NOT a replacement). Old Embedder + 8 vendor
    factories remain in place and in use; MultiModalEmbedder is the
    richer contract for new binary-modality call sites.
