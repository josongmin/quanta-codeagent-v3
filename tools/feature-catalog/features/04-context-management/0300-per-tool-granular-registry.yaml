purpose: |
  ADR-0124 `ConversationCheckpointStore` 의 files+task sibling — pure
  in-memory `GranularRegistryPort` (`record/restore/list/clear`) storing
  `ToolSnapshot { toolCallId, turn, takenAt, filesBefore: ReadonlyMap<string,string>,
  taskMessagesBefore: ReadonlyArray<Message> }`. T1 ADR-0291 per-tool-checkpoint
  adapter 의 "shadow-odb-not-configured" stub 을 메우는 진짜 upstream
  source — `createPerToolCheckpointAdapter({ registry })` 가 3-way restore
  arms 로 stored payloads 반환. ADR-0203 의 SHA-tag GranularRegistry (shadow-
  ODB anchor index) 와 별개의 orthogonal 슬라이스 — 두 registry 는 함께 또는
  독립적으로 wire 가능. Default-OFF: `AgentConfig.granularRegistry` slot
  미주입 ⇒ loop / dispatch / surface byte-identical. T1 `buildPerToolCheckpointAdapter`
  는 UNTOUCHED — slash-surface 는 SHA-tag 경로 그대로. 새 factory 는 sibling.
  Per-snap caps: 50 entries (LRU) / 20 files / 5MB bytes. NO-THROW
  on every public surface (over-cap returns typed `ok:false`; missing
  toolCallId returns null; throwing registry wraps in `registry-failure`).
