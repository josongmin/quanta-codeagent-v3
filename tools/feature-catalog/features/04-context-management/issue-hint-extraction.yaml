notes: 'Empty-hint sentinel: when every extractor returns nothing, composer returns the empty string ("") and the caller (bench/driver) skips prepending — byte-identical to no-hint path. ANSI strip is shared `normalize.ts` (issue bodies often carry pasted terminal output whose ESC byte trips lookbehind / word-boundary patterns).'
