purpose: |
  Pure deterministic extractors that scan an issue/problem-statement string
  and surface a structured `IssueHint` (files, errors, code fences,
  traceback paths, symbols) for downstream localization. Conservative
  posture — NO heuristics: paths require a slash + recognized extension;
  errors must trail-suffix `Error`/`Exception`/`Warning` with leading
  uppercase; symbols only match backtick-fenced identifiers + Python /
  TS-JS def keywords (language keywords like `def`/`if`/`return`
  themselves never count). Each extractor is its own pure module; the
  composer renders an LLM-friendly markdown block ending with a
  calibration line that warns the model NOT to blindly trust hints.
  Companion `agentless-localize` runs the paper's Stage-1 LLM file-level
  localization (prompt verbatim from Xia 2024) with a hallucination guard
  that rejects any path not in the supplied file tree.
