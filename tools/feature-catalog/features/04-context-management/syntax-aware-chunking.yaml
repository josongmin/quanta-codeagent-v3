knobs:
  - name: QUANTA_SYNTAX_CHUNK
    default: 'off'
    purpose: 'strict `=== "1"` — indexer emits AST-aligned chunks (else byte-identical line-window)'
  - name: QUANTA_READ_OUTLINE
    default: 'off'
    purpose: 'strict `=== "1"` — `read outline:true` returns the collapsed view (else line-range fallback)'
  - name: QUANTA_TREE_SITTER_DIR
    default: 'undefined'
    purpose: 'grammar `.wasm` dir override; absent ⇒ resolve `tree-sitter-wasms/out`'
notes: |
  Placed under `src/retrieval/code-parser/` (a sub-slice of @/retrieval, which
  already loads vendor SDKs as direct node modules) so it inherits the
  `@/shared`-only fence with no new tsconfig alias / biome fence churn. The
  read tool imports the `CodeParserPort` TYPE from @/retrieval (permitted —
  not in the @/tool import block-list). `DeclNode.kind` reuses the LSP
  `SymbolKind` vocabulary so a future outline-backed-by-LSP swap is clean.
  Complementary to `lsp_document_symbol` (that spawns an external server;
  this is self-contained + offline + deterministic).
