purpose: |
  Codex 0.135 prepends a bounded directory tree at session start so the model is
  oriented without spending the first 1-2 tool calls on file_tree_summary / ls.
  quanta already injects a `## Environment` block (env-context.ts, ADR-0397) and
  already has a bounded, ignore-respecting tree renderer (file_tree_summary). This
  feature renders a bounded tree into the env block ON TURN 1 ONLY, behind
  QUANTA_REPO_MAP, reusing env-context's exact replay-determinism discipline:
  the live scan lives in a NEW `probeRepoMap` (injected `scan` adapter — the
  shell call stays in the runner adapter `makeRepoMapScan` over file_tree_summary's
  exported PURE aggregate/render helpers), while `renderEnvBlock` stays pure (no
  Date.now / Math.random / FS). The map is STRUCTURE ONLY (paths + counts via
  `rg --files`) and EXCLUDES memory / CLAUDE.md contents (those ride their own
  blocks) — no duplication. Stale-tolerant framing is a fixed literal mirroring
  Codex ("may be incomplete or out of date — do not repeat back unless relevant").
  THREE independent token-budget caps, all deliberately TIGHTER than the tool
  defaults: maxDepth 2 (vs 3), maxFiles 200 (vs 400), and a SHAPE-INDEPENDENT
  maxChars 6000 hard backstop applied after render (line-boundary truncation +
  marker) — the last guarantees turn-0 can never blow up regardless of repo shape.
evidence:
