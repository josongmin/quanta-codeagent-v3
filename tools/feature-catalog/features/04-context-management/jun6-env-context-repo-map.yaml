deliberate_hold: null
notes: |
  WIRING NOTE (loop-decomposition avoidance): the TURN-1 LOOP CALL is a documented
  seam. The probe (probeRepoMap) + scan adapter (makeRepoMapScan) + renderer field
  (TurnEnvContext.repoMap) + knob slot (config.repoMap caps) all land and are fully
  tested, but the actual `if (turnIndex === 0) env.repoMap = await probeRepoMap(...)`
  call site lives in the loop's per-turn env assembly
  (src/agent/loop/context-assembler.ts), which is user/earlier-wave in-flight this
  session and OFF-LIMITS. Same posture as probeTurnEnv itself, which is also an
  opt-in seam with no current loop caller. Wiring is a one-line additive edit once
  that file is free. Default-OFF byte-identity holds regardless (no map ⇒ env block
  byte-identical).

  Default-OFF byte-identity: QUANTA_REPO_MAP unset ⇒ config.repoMap absent ⇒ the
  probe never runs ⇒ env.repoMap absent ⇒ renderEnvBlock byte-identical to today
  (the ADR-0397 byte-identical hellgate is extended with a repoMap:undefined case).

  Reuse note (honest): file_tree_summary's tool `execute` is an
  AsyncIterable<ToolEvent> bundling the rg call + recency + purpose passes. We do
  NOT call execute. makeRepoMapScan captures ONE `rg --files` stdout and calls the
  exported PURE helpers (aggregateFileTree / renderFileTree, rank:"alpha" so no
  recency git-log call is needed) then applies the maxChars backstop — the same
  "reuse the pure core, re-do the I/O at the seam" pattern env-context uses with
  parsePorcelainV2. The helpers were made `export` additively (no behavior change;
  the file-tree-summary suites still pass).

  Per-cap env overrides (QUANTA_REPO_MAP_MAX_DEPTH / _MAX_FILES / _MAX_CHARS) are a
  documented follow-up: ApplyContext does not carry the env snapshot today, so the
  knob uses the fixed RFC defaults (REPO_MAP_DEFAULT_* shared from @/agent).
