id: session-sanitize-id
title: Session id sanitizer — filesystem-safe path component validator
section: 4
subsystem: Session paths — id validation (hard-fail on escape attempts)
order: 51
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: integrated
config_refs:
  env: [QUANTA_SESSIONS_DIR]
owners: ["@songmin"]
labels: [surface:core]
depends_on: [session-index-store, session-jsonl-envelope, session-root-provider-port, session-envelope-encoder, assert-never-exhaustiveness]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 4/4 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure internal filesystem-safety guard, no UI affordance"
purpose: |
  Hardened id validator enforcing that a session id is safe to use as a single
  filesystem path component under `sessionsRoot()`. Rejects (with typed
  `SessionIdError`): empties, length > 128, `.` / `..` segments, leading `-`
  (CLI-flag confusion), path separators (`/`, `\`), NUL, ASCII control bytes
  (0x00..0x1f, 0x7f). `crypto.randomUUID()` output passes unchanged so the
  legitimate `--new-session` / fork mint paths work. All session path
  constructors (`sessionFilePath`, `archivedFilePath`, `indexFilePath`, and
  the `*Async` provider-aware twins) route through this validator — a raw
  unvetted id can never reach the filesystem layer. Provider-aware async
  twins additionally compose with `SessionRootProvider` for multi-tenant
  surfaces (Web / Tauri) while staying byte-identical to the sync resolver
  when no provider is injected.
evidence:
  code:
    - src/session/paths.ts
    - src/session/root-port.ts
    - src/session/store.ts
    - src/session/index.ts
  adrs: []
  tests:
    unit:
      - tests/unit/session-paths.test.ts
      - tests/unit/cross-workspace-isolation-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_SESSIONS_DIR
    default: 'undefined'
    purpose: '(no description)'
deliberate_hold: null
notes: |
  Sibling to `slice-session-root-port` (multi-tenant root provider) — the
  validator runs inside both the sync and async path builders so EVERY id
  flowing to disk is checked exactly once at the boundary.
