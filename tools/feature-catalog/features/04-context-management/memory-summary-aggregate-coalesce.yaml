notes: |
  `memorySummaryMd` 와 `sessionCtx` 둘 다 absent ⇒ section collapse(byte-identical
  legacy). 둘 다 present ⇒ aggregate 가 FIRST, caller sessionCtx 가 SECOND — 순서는
  trust-ladder 의 "distilled hint < per-session static" 정렬을 따른다.
