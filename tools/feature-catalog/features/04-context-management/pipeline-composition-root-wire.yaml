id: pipeline-composition-root-wire
title: Pipeline composition-root wire — assemblePipeline(env) + search_codebase tool (ADR-0272)
section: 4
subsystem: Retrieval — composition-root wire turning Phase-7 leaf slices into a usable pipeline
order: 51
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: [surface:core, default-off, slice:retrieval, slice:apps-agent, slice:tool]
depends_on: [search-pipeline-composer]
surface_integration:
  cli: full
  web: full
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 2/4 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "user-visible value is the model-facing search_codebase tool; its invocation surfaces via tool_call/tool_result mapped to tool.invoked/tool.completed (session-hooks.ts), fully rendered in the web stream"
purpose: |
  `assemblePipeline(env)` reads `QUANTA_PIPELINE` (closed 6-arm enum:
  `none` | `lexical-only` | `semantic-only` | `parallel-rrf` |
  `semantic-then-rerank` | `budget-aware`) and returns the default lexical
  `SearchPipeline` unless the explicit `none` kill-switch is selected. For
  each non-`none` preset
  the helper wires the sibling slices it needs (`@/retrieval/lexical`,
  `@/retrieval/semantic`, `@/retrieval/reranker`, `@/retrieval/cache`,
  `@/retrieval/batching`) and adapts their slice ports to the pipeline's
  INLINE DUCK-TYPED ports. Adapter-build failure collapses to `null` +
  a `logger.warn` line (no startup crash on optional knob misconfig).
  The assembled handle rides into `AgentConfig.searchPipeline` (helper-
  only slot — loop never reads it). The companion `searchCodebaseTool`
  factory ships a defineTool-shaped tool that delegates to the pipeline
  when wired and yields a typed `ok:false` "no pipeline wired" only when the
  operator selects `QUANTA_PIPELINE=none` (mirrors `web_search`). The default
  CLI surface receives lexical `search_codebase`; `QUANTA_INDEX=on` upgrades
  that same facade to semantic/hybrid behavior rather than registering it.
evidence:
  code:
    - src/runner/assemble/search-pipeline.ts
    - src/apps/agent/index.ts
    - src/agent/types.ts
    - src/tool/search_codebase.ts
  adrs: [272, 265, 260, 261, 262, 263, 264, 266]
  tests:
    unit:
      - tests/unit/apps/agent/pipeline-wire-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_PIPELINE
    default: 'lexical-only when unset; none is the explicit kill-switch'
    purpose: 'preset selector (none|lexical-only|semantic-only|parallel-rrf|semantic-then-rerank|budget-aware)'
  - name: QUANTA_INDEX
    default: 'off'
    purpose: 'promotes the default lexical facade to the hybrid/semantic index path; it does not control tool registration'
  - name: QUANTA_EMBED_CACHE
    default: 'none'
    purpose: 'forwarded to resolveEmbedCacheFromEnv (in-memory|sqlite|none)'
  - name: QUANTA_RERANKER
    default: 'identity'
    purpose: 'forwarded to createRerankerFromEnv (identity|headless|cohere|voyage)'
deliberate_hold:
  reason: |
    Production-grade semantic / embedder / reranker adapters remain
    env-gated and host-sensitive. The shipped default path is lexical
    search, with hybrid / semantic behavior only when the index + adapter
    knobs are explicitly armed. Retrieval-output-into-working-memory
    (auto-recall) is a separate ADR.
  promotion_path: |
    Promote when semantic/hybrid mode becomes default-safe for the main
    CLI surface and the retrieval results feed a working-memory recall
    path, not only a model-facing tool call.
notes: |
  The helper's adapter glue maps slice ports (Result-shaped, multi-method)
  to the pipeline's INLINE DUCK-TYPED ports (Promise-shaped, single
  method). Adapter pure: no env reads beyond the single `QUANTA_PIPELINE`
  knob the helper itself owns + the sibling factories' canonical knobs.
  Failure paths use logger.warn + null collapse so an operator typo never
  blocks startup. `search_codebase` is now registered into the base
  registry when the wire is non-null; the remaining hold is about
  semantic/hybrid promotion, not tool visibility.
