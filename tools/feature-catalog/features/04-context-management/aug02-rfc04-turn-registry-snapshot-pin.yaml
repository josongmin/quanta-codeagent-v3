id: aug02-rfc04-turn-registry-snapshot-pin
title: RFC04-0 — turn-registry snapshot pin (one generation per turn)
section: 4
subsystem: MCP hot-reload — turn snapshot pin (aug-02 RFC04-0)
order: 560
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: static
owners: ["@songmin"]
labels: ["rfc:aug02-04", "surface:cli"]
purpose: |
  RFC-04-0 turn-registry snapshot pin: the tool/binding-spec registry is pinned
  to ONE generation for the duration of a turn, so a mid-turn MCP reload cannot
  change the tool surface the model is mid-way through using. This is the
  invariant the hot-reload controller (RFC04-2/3) relies on to publish a new
  generation only at a safe turn boundary. Additive: the pin is transparent when
  nothing reloads.
evidence:
