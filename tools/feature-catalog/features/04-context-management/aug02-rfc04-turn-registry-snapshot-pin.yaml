    - src/agent/turn-registry-snapshot.ts
    - src/agent/turn-context.ts
    - src/agent/loop/session-bootstrap.ts
  adrs: ["docs/plans/aug-02-absorption/rfc-04-approval-policy.md"]
  tests:
    unit:
      - tests/unit/agent/turn-registry-snapshot.test.ts
      - tests/unit/session-bootstrap-registry-snapshot-ref-hellgate.test.ts
