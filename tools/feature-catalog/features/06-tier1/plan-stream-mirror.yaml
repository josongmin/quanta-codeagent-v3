id: plan-stream-mirror
title: planToStreamMirror — single slice-boundary by-value projector
section: 6
subsystem: Plan-mode 구조화 (ADR-0095 P7)
order: 97
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: integrated
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 3/4 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "every plan_* event (plan_created/updated/snapshot/user_input_requested/resolved) + mode_changed is dropped at the only AgentEvent→web bridge context-binding.ts:1061 default arm; SlashPalette.tsx:405 /plan is a prefill() stub sent to the LLM as plain text, not executed; zero plan_* consumer anywhere in apps/web-frontend"
config_refs:
  env: ["QUANTA_PLAN"]
  cli: ["--plan"]
owners: ["@songmin"]
labels: ["surface:core", "tier:1"]
depends_on: [plan-mode]
purpose: |
  Single coercion site from canonical `Plan` to the minimalist
  `PlanReadonlyMirror` / `TodoReadonlyMirror` shapes the `@/stream` slice
  declares. Cross-slice flow stays by-value (RFC §3.1 — `@/stream` MUST
  NOT import `@/agent/plan`); biome `noRestrictedImports` enforces the
  fence. `todoStatusMirror` is a closed switch over canonical `TodoStatus`
  with `never` default arm — adding a status to canonical forces a compile
  error here. `id` is a deterministic function of `createdAt` so the
  mirror has a stable identifier across emits without requiring `Plan` to
  carry one. Adding a field to the mirror MUST also extend this projector
  (closed-shape drift gate).
evidence:
  code:
    - src/agent/plan/stream-mirror.ts
    - src/agent/plan/types.ts
    - src/agent/plan/state.ts
    - src/agent/plan/index.ts
  adrs: [95]
  tests:
    unit:
      - tests/unit/agent/plan/mutations-hell.test.ts
      - tests/unit/plan-queue-hellgate.test.ts
    integration:
      - tests/integration/plan-mode-x-tool-registry-cross.test.ts
    contract: []
knobs: []
deliberate_hold: null
notes: |
  No heuristics — every mapping is explicit. The mirror happens to use the
  SAME literals as canonical TodoStatus today; if they ever diverge, the
  explicit switch is the single edit site. By-value flow keeps the stream
  slice trivially serializable for JSONL recording.
