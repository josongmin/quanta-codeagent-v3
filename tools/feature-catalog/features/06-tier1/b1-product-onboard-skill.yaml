purpose: |
  A prompt-only system skill for FIRST-USER onboarding (the get-started flow),
  DISTINCT from the existing repo-recon `onboard` skill. The two have INVERTED
  semantics:

    - `onboard`          → a developer meets an unfamiliar REPO (read-only recon)
    - `product-onboard`  → a new USER meets the PRODUCT (guided first task)

  THE risk this carries is name/trigger COLLISION — the model must pick the right
  skill. So `product-onboard` uses a DISTINCT kebab name (≠ `onboard`) and sharp,
  non-overlapping triggers ("onboard me" / "get started" / "first task" /
  "new user" / "how do I use this"), and its body is a 5-step `update_plan`
  contract (pick a role → connect context → scope a first task → ship a first
  artifact → recap) reusing the EXISTING plan seam — NO onboarding-specific plan
  tool. allowedTools: [update_plan, Read, Glob, Edit, Bash]. userInvocable,
  category=skill, stability=experimental.

  Default-OFF per the system-skill slice policy: activated only by description
  match or explicit invoke; system-wins-on-collision protects it from a
  user-supplied "product-onboard" shadow.
