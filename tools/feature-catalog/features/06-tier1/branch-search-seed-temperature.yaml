purpose: |
  `buildSeeds(N, base, modelCandidates?)` — builds N `BranchSeed` records
  for parallel candidate proposal. Implements TWO Agentless techniques:
  §3.1 temperature diversification (spread across [0.2 .. 1.0] for N
  candidates; deterministic so replay is reproducible — N=1 ⇒ [0.2], N=3
  ⇒ [0.2, 0.6, 1.0]) and §4.2 mixed-model voting (round-robin over
  `modelCandidates: ModelCandidate[]` when provided). Per-candidate
  prompt hints cycled from a frozen 4-tuple: undefined (faithful
  baseline) / minimal patch / more thorough refactor / conservative —
  so the LLM sees diverse instruction phrasing per seed. When no model
  candidates are supplied, every seed uses the base model with
  temperature-only diversity.
