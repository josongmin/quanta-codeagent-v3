notes: |
  Deterministic given (N, base, modelCandidates) — replay-reproducible by
  design. The first candidate intentionally gets no prompt hint to keep
  the faithful baseline; remaining candidates rotate through diversifier
  nudges. Two-decimal rounding on temperatures so OTel attribute values
  are stable across runs.

