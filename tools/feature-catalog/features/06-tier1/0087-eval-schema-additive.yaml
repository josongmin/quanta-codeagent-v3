id: eval-schema-additive
title: Eval 스키마 additive 필드 (keyed metrics / token·cost / run status·params)
section: 6
subsystem: 로컬 eval 저장 (Cursor EvalTrackingService 흡수, ADR-0087)
order: 87
maturity: L5
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [headless, batch]
configurable: n-a
owners: ["@songmin"]
labels: ["surface:core", "tier:1", "absorbed:cursor"]
depends_on: [eval-synthetic-generator, eval-synthetic-judge, eval-synthetic-scenario-schema, eval-tier1-synthetic, assert-never-exhaustiveness]
surface_integration:
  cli: na
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "Additive eval JSONL schema fields (metrics/tokens/cost/status), ui_surfaces n-a, internal eval storage only."
    web: "Pure internal schema/storage shape, no UI affordance on any surface."
purpose: |
  Cursor aiserver.v1.EvalTrackingService에서 typed shape 3개만 흡수 — JSONL
  append-only eval 저장(schema.ts, zod 없음 plain TS)에 OPTIONAL·additive 필드 추가.
  Metric{key,value,unit?,step?}(단일 score보다 우월: named axis + step), TokenUsage
  {prompt,completion,cacheRead?,cacheWrite?}, SyntheticPayload/PublicPayload에
  metrics?/tokens?/costUsd?, RunSummaryRecord에 status?(running|finished|failed|killed)
  + params?(재현용). 원격 sink·Ray·cron·RPC는 흡수 안 함(negative invariant).
evidence:
  code:
    - src/apps/eval/storage/schema.ts
    - src/apps/eval/synthetic/runner.ts
    - src/apps/eval/synthetic/index.ts
    - src/apps/eval/report/coverage-matrix.ts
    - src/apps/eval/report/markdown.ts
  adrs: [87]
  tests:
    unit:
      - tests/unit/eval-schema-additive.test.ts
      - tests/unit/eval-runner-token-cost.test.ts
    integration:
      - tests/integration/eval-additive-hellgate.test.ts
    contract: []
knobs: []
deliberate_hold: null
notes: |
  L3 — runner FILLS / report RENDERS. CapturingStream.sumUsage()가 loop가 emit한
  {type:"usage"} AgentEvent를 합산 → RunResult.tokens?/costUsd?(costUsd는
  @/observability/pricing.costUsd(model,…) 호출, unknown model → null). index.ts가
  SyntheticPayload.tokens?/costUsd?로 conditional-spread하고 store.finish에
  status:"finished"+params:{model} 추가. report TokenCostRollup가 synthetic+public
  payload의 tokens/costUsd를 합산 → CoverageMatrix.tokenCost?, markdown
  "Token & Cost Summary" 섹션 + headline Tokens=/Cost=$. 전부 데이터 없으면 absent =
  byte-identical. score?를 교체가 아니라 보강(병존). PAYLOAD_KINDS 디스크리미네이터 불변 →
  result-store.readAll/coverage-matrix narrowing 무회귀. metrics[]는 아직 per-scenario
  manual emit이 없어 runner가 채우지 않음(named-axis 메트릭은 호출자가 향후 채울 seam).
  L4→L5 (2026-05-23): 실 LLM `bun run eval synthetic` 1회 실행으로 disk artifact
  evals/runs/20260523-112433-synthetic-065dda76e815.jsonl 생성 — RunSummaryRecord에
  `status:"finished" + params:{model:"claude-sonnet-4-6"}` 정확히 persist 확인됨.
  스키마 additive 필드가 mock 게이트뿐 아니라 실 모델 경로에서도 byte-stable로 흐름.
