    cli: "parseEnvFlag default-ON for subagent + skills in apps/cli/internal.ts; reachable from CLI."
    web: "web-daemon runtime-factory.ts:184-217 builds subagent + skills config (default-ON) for web/tauri; subagent runs render in web-only RunColumn (ObservabilityPane), skills inject into prompt."
purpose: |
  RFC §1.2 default-OFF byte-identical 원칙의 **의도적 예외**. Codex/Claude
  Code/Cursor 모두 subagent + skills를 default로 켠다 — quanta가 default
  -OFF면 모델이 자연어로 "병렬로 해줘"/"스킬 알아서 써줘"라 해도 안 먹힌다
  (도구 미등록 + 스킬 카탈로그 미주입 ⇒ 모델 눈에 안 보임). 이 ADR에서 둘
  다 default-ON으로 뒤집되 env off-switch 유지: `QUANTA_SUBAGENT=0`/`QUANTA
  _SKILLS=0`(또는 false/off/no) ⇒ OFF, CI/벤치의 byte-identical 재현성용
  탈출구. 신규 surface-agnostic pure helper `parseEnvFlag(raw, defaultOn)`
  를 `@/runner/assemble`에 두고 CLI/web-daemon 양쪽이 동일 시맨틱 공유
  (tauri는 web-daemon sidecar라 자동 커버).
evidence:
