notes: |
  스킬 켜지면 `renderActiveSkillsBlock`이 시스템 프롬프트에 "## Active
  skills" + Trigger rules(룰2 mandatory) 자동 주입 ⇒ Claude Code 자동 트리거
  동급. subagent 켜지면 agent/task_output/task_stop 도구 노출 ⇒ 자연어
  "병렬로" 호출 가능. byte-identical 원칙은 env=0으로 복원 가능.
