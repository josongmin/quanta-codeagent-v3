notes: |
  Two-helper module because the breaker config (pure spread/cap composition)
  and the dedicated summarizer model (LLM factory + retry wrap) are two
  distinct concerns that happen to share the `compactionBreaker` /
  `compaction.summarizerLlm` config surface. Surface decides whether to
  enable one, the other, both, or neither.
