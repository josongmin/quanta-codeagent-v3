purpose: |
  Two surface-agnostic compaction assemblers (ADR-0011 Tier-0 safety
  hardening + dedicated summarizer model):
  (1) `buildCompactionBreakerConfigCore` — composes the circuit-breaker
      block from 3 pre-parsed knobs: `disabled === true`, `reactiveMax`
      (finite int → `caps.maxConsecutiveReactive`), `proactiveMax` (finite
      int → `caps.maxNoProgressProactive`). Caps are nested under `caps:`
      only when ≥1 finite. The breaker is ON by default with safe caps and
      only trips on pathological compaction thrash, so omitting EVERY field
      is the behavior-preserving default ⇒ `undefined` ⇒ key omitted.
  (2) `buildSummarizerLlmCore` — builds a SEPARATE cheaper/faster `LLMPort`
      used ONLY for the compaction summary turn. When `model` is empty/
      undefined ⇒ `undefined` ⇒ `config.llm` is reused (byte-identical).
      When set: `provider` override (else `mainProvider`) is forwarded into
      `buildLLMCore` and wrapped in `RetryingLLM` with the caller's signal
      (same contract as the main stack).
