id: skill-creator-tool
title: Skill-creator tool — agent-callable scaffold + validate + install a skill (Codex parity)
section: 6
subsystem: 스킬 — authoring
order: 20
maturity: L3
status: new
ui_surfaces: [none]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "tier:1"]
depends_on: [skill-audit-log]
surface_integration:
  cli: full
  web: partial
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "agent-callable skill_create tool registered in tier1 buildSkillBlock; reachable from CLI entry"
    web: "backend tool runs identically on web and its call/result render as a generic tool.invoked/tool.completed card (session-hooks.ts), but there is no dedicated skill-creation UI and it is default-OFF behind QUANTA_SKILL_CREATOR"
purpose: |
  jun-6 Codex skill-creator parity. The `skill_create` tool lets the MODEL author
  a new skill (previously the ecosystem could only DISCOVER + INVOKE + read bundled
  resources). Pipeline: (1) SCAFFOLD a canonical SKILL.md from typed input
  (`renderSkillMarkdown`, deterministic frontmatter + body); (2) VALIDATE the
  rendered frontmatter back through the SAME `SkillFrontmatterSchema` discovery
  uses (no drifting second validator) + enforce the byte-size cap BEFORE writing;
  (3) INSTALL `<name>/SKILL.md` through an injected `SkillWriterPort`. SECURITY:
  the kebab-case `name` is re-validated before it is ever a path segment, and the
  host writer resolves through `resolveJailed(dir)` so a `../escape` can never
  write outside the skills dir (defence-in-depth). Pure functions never throw;
  every failure surfaces as a typed `{ok:false}`. Registered in tier1
  `buildSkillBlock` ONLY when `QUANTA_SKILL_CREATOR` is on AND a writable user
  skills `dir` exists. Default-OFF ⇒ tool not on the menu (byte-identical surface).
evidence:
  code:
    - src/skill/skill-creator.ts
    - src/skill/index.ts
    - src/agent/tier1/skill.ts
    - src/shared/runtime-config.ts
  adrs: []
  tests:
    unit:
      - src/skill/__tests__/skill-creator.hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_SKILL_CREATOR
    default: 'unset (off)'
    purpose: 'register the agent-callable skill_create tool (requires a user skills dir)'
  - name: writer
    default: 'jailed Bun.write rooted at the skills dir'
    purpose: 'closed-port DI — unit tests inject a recording fake (no fs)'
notes: 'Skill becomes discoverable next session (discovery is start-of-session). isReadOnly:false / isConcurrencySafe:false (writes a file, name-races).'
