      - tests/integration/plugin-discovery-hell-e2e.test.ts
      - tests/integration/plugin-x-skill-cross-hell-e2e.test.ts
    contract: []
knobs: []
deliberate_hold:
  reason: 'plugin runtime loader 호스트 통합 미완. discovery/manifest 파서는 production-ready지만 buildSessionFeatures가 plugin tree를 자동 enroll하는 경로는 follow-up. integration 테스트로 calling contract 검증됨.'
  promotion_path: 'runner/assemble/plugin.ts builder 도입 → buildSessionFeatures 안에서 discoverPlugins(repoRoot) → 각 plugin의 skills/ 트리를 skill registry에 inject. CLI는 default-ON으로 활성 (RFC §1.2).'
notes: 'Capability closed enum (Interactive/Read/Write). plugin runtime loader 호스트 통합은 follow-up.'
