purpose: |
  `.quanta-plugin/plugin.json` (strict Zod) + 옵셔널 `.mcp.json` + `skills/<name>/SKILL.md`
  3-surface 레이아웃. Codex `.codex-plugin/` 패턴을 v3 path 명으로 흡수 (RFC §1.6). loader는
  cause-typed PluginManifestError 분기 — silent fallback 0. discovery는 depth 4 cap +
  node_modules/.git/dot-dir skip + lex sort.
evidence:
  code:
