notes: |
  Slice-isolation: the inventory shape is plain `{name, description}` so the
  prompt slice never imports `@/skill`. Built ONCE at session start (via
  `buildSessionFeatures`), passed through every turn without re-discovery.
  Sub-feature of `agent-features-tier1` umbrella, individuated because the
  builder is 136 LOC of distinct logic (merge precedence + dual-map build +
  paths-conditional inventory narrowing) versus the umbrella's other plumbing
  builders (most <30 LOC).
