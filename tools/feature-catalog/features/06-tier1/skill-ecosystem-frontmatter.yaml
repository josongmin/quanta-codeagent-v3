purpose: |
  Absorbs codex's skill ECOSYSTEM frontmatter+resources (quanta's skill CORE —
  7-scope/playbook/ReDoS-glob/admin — was already ahead). All ADDITIVE/optional:
  (A) `argument-hint` → Skill.argumentHint, shown in the listing (`rr [scope]`);
  (B) `metadata.short-description` → Skill.shortDescription (guaranteed-short
  listing row); (C) bundled-resource walker recording agents/scripts/references/
  assets presence + a minimal agents/openai.yaml `interface:` parser (no yaml dep).
  Added to BOTH parser paths (strict zod + lenient discovery), regex-aligned so
  lenient never accepts a key strict rejects. agents/openai.yaml read is size-
  capped (checkSkillSize) — malformed/oversized resources skip, never crash
  discovery. Plain SKILL.md is byte-identical.
