notes: |
  Voice-match with ADR-0124 (conversation-checkpoint store) and ADR-0128
  (plan-queue helper) — same plane-clean / DI clock / helper-only deferred-
  wire family. `/cost` slash UI is the read-only sibling on the human
  surface; this ledger is the programmatic counterpart with a circuit-
  breaker event. ADR-0006 `LocalSandbox.timeoutMs` analogue: the breaker
  signal is callable, not enforced — the caller decides abort vs continue.
