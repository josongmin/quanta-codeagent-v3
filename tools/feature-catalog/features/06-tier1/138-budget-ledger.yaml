purpose: |
  Closed-port primitive that hardens the failure mode Cline's `$50 in one
  afternoon` retry-loop incident exposed: no programmatic cross-run budget
  with a typed circuit-breaker event. `BudgetMeter` (ADR-existing) gates a
  single RUN; this ledger is orthogonal — ACROSS-runs cumulative tracking,
  soft/hard × session/daily 4-arm `BudgetLimitKind`, per-session and per-
  day rollups, and disk persistence via `serialize()` / `hydrate()` (pure
  store, 0 I/O, 0 SQLite — caller pipes to disk). Contracts: NO-THROW
  surface, exactOptional `OMITTED-not-undefined`, pricing fallback to
  sonnet for unknown models (event STILL records its own model name so
  operators see the breakdown), per-(scope,kind) breach debounce, LRU
  `maxEvents` cap (default 10 000) with aggregate recomputation over the
  retained slice, hydrate-as-known-empty on corrupt JSONL. Read-only
  `budget_status` tool surfaces the snapshot to the model. `defaultTier1`
  yields the tool ONLY when `cfg.budgetLedger?` is wired (default-OFF,
  byte-identical to today's posture when absent).
