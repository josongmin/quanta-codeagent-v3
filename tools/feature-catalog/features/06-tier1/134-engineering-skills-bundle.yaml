id: engineering-skills-bundle
title: Engineering-task skill bundle — debug-error / add-tests / explain-code / extract-function (ADR-0134)
section: 6
subsystem: 스킬 — 번들 시스템 스킬 (engineering-task slice, CTK 흡수 R2)
order: 134
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: static
owners: ["@songmin"]
labels: ["surface:core", "tier:1", "absorbed:cursor"]
depends_on: [ctk-git-skills-bundle, git-log-search-skill, localize-signal-hardening, progress-audit-skill, rewind-skill]
config_refs:
  env: ["QUANTA_SKILLS_DIR"]
purpose: |
  ADR-0111 absorbed 8 CTK git skills; this ADR closes the engineering-task slice
  with 4 highest-ROI prompts (Cursor CTK engineering-task subset). Prompt-only
  (zero code dependencies) — each skill is SKILL.md + trivial index.ts router
  entry (NAME constant + Trigger interface + trigger fn + finder). Frontmatter
  standardized identical to ADR-0111 (name matches dir for router-drift
  prevention, userInvocable:true, strict 6-field allowedTools, lenient `tools`
  mirror for discoverSkills runtime enforcement, category:skill / stability:
  stable). Body invariants (hellgate-enforced): 'When this skill activates'
  trigger phrases + exactly 5 P0 rules + 5-6 step Procedure + Outcome enum
  with banned 'complete' word (CTK pattern). Skills: `debug-error` (evidence-
  first: cite verbatim → read frames → git log → reproduce → patch+reverify;
  slogan 'A fix unverified is a hypothesis'); `add-tests` (read target →
  enumerate edges → match framework → real fixtures preferred → run before
  done; slogan 'A test that doesn't run is not a test'); `explain-code` (READ
  FIRST not memory/filename → lsp callers → git history → tiered explanation
  → file:line citations); `extract-function` (caller-survey first via
  lsp_references/grep → intent-name → subject-first params → boolean flag =
  smell → typecheck+test for regression).
evidence:
  code:
    - src/skill/system-skills/debug-error/SKILL.md
    - src/skill/system-skills/debug-error/index.ts
    - src/skill/system-skills/add-tests/SKILL.md
    - src/skill/system-skills/add-tests/index.ts
    - src/skill/system-skills/explain-code/SKILL.md
    - src/skill/system-skills/explain-code/index.ts
    - src/skill/system-skills/extract-function/SKILL.md
    - src/skill/system-skills/extract-function/index.ts
    - src/skill/system-skills/index.ts
    - src/apps/cli/internal.ts
  adrs: [149]
  tests:
    unit:
      - tests/unit/system-skills-new-bundle-hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  Default-OFF — system-skill slice general policy: description-match or
  explicit invoke required; `kind:"system"` filter is router's job. Name in
  SKILL.md frontmatter and dir name MUST match (router-drift hellgate). System-
  wins-on-collision invariant continues (ADR-0045 pattern) so user-supplied
  skill cannot silently shadow audit/engineering discipline.
