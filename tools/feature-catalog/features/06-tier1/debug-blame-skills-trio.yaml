notes: |
  Default-OFF — system-skill slice 일반 정책: description 매칭 또는 명시
  invoke만 활성. System-wins-on-collision 보호 (user-supplied "debug-trace"
  스킬이 shadow 못 함). HELL-3에서 body가 P0 rules에 cite한 specific tool
  name (parse_test_failure / git_blame_heatmap / start_line / end_line / Read)을
  verbatim 검사 — drift 차단.

  Tool 형태로 만들지 않은 이유: (1) crash 조사는 사용자가 어떤 frame을 먼저
  열지 / sibling을 grep할지 / STOP 시점을 골라야 함 (atomic tool 계약 바깥),
  (2) blame-section의 original vs recent author는 사용자 의도에 따라 pickaxe
  돌릴지 결정 — atomic tool은 always-run 강제, (3) explain-stack-trace의
  "fix 제안 안 함" 계약은 모드 flag로는 silently bypass 가능 → 별도 스킬
  형태가 contract enforceable. CTK git bundle (ADR-0111) 과 engineering-task
  bundle (ADR-0134)와는 audience 다름 (workflow=PR/CI vs engineering=새 코드
  vs 본 트리오=조사/탐색).

  Composability: debug-trace는 narrative-only 요청을 explain-stack-trace로
  defer, reproduce+patch 요청을 debug-error (ADR-0134)로 defer. explain-stack
  -trace는 사용자가 fix를 원할 가능성 있을 때 "for an actionable hypothesis,
  invoke `debug-trace`" 문장으로 마무리. Cross-skill handoff는 각 스킬 계약의
  first-class — implicit이 아님.
