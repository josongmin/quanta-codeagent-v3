notes: |
  Pure relocation of the prior `internal.ts#buildStreaming` block — same
  effects, same logging keys. `TeeStream` is the fan-out primitive — caller
  cannot inject additional sinks here, but a Web/Tauri surface can compose
  its own tee on top of the returned `stream`.
