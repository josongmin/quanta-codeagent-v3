id: queued-followup-per-msg-mutators
title: Queued follow-up per-msg mutators (retry / edit / delete / sendNow)
section: 6
subsystem: Plan-queue mutators (ADR-0228)
order: 228
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: n-a
owners: ["@songmin"]
labels: ["surface:cli", "tier:1", "absorbed:codex"]
depends_on: [queued-follow-ups, "voice-input-stt-slice"]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "/queue {list|retry|edit|delete|send-now} CLI subcommands via queue-cmd.ts"
    web: "SlashPalette server-routed stub does not execute (B2) and SessionCommand has no queue verb (B3)"
purpose: |
  Codex Desktop composer absorption: each paused/active follow-up gets 4
  mutators — `retry` (re-queue same body), `edit` (in-place body update),
  `delete` (remove entry), `sendNow` (non-interrupting injection: bypass
  paused state, append to next LLM turn user message WITHOUT aborting
  current turn). Exposed via `/queue {list|retry|edit|delete|send-now}`
  CLI subcommands. Mutators are typed Result<…> with closed error union
  (`not-found` / `already-active` / `invalid-text` / `send-not-possible`).
  Default-OFF: store unmodified if mutators never called (byte-identical
  to ADR-0128 baseline).
evidence:
  code:
    - src/agent/plan-queue.ts
    - src/apps/cli/queue-cmd.ts
    - src/observability/metrics/instrument-plan-queue.ts
  tests:
    unit:
      - tests/unit/queue-per-msg-mutators-hellgate.test.ts
      - tests/unit/cli/queue-cmd-hellgate.test.ts
    integration: []
    contract: []
  adrs:
    - docs/decisions/0228-queued-followup-per-msg-mutators.md
