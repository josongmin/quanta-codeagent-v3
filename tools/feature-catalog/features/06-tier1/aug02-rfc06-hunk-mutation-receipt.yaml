id: aug02-rfc06-hunk-mutation-receipt
title: RFC06-4 B5 — durable hunk-mutation receipt + CAS undo journal
section: 6
subsystem: Review UX — durable per-hunk apply receipt (aug-02 RFC06-4)
order: 564
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: partial
modes: [interactive]
configurable: integrated
owners: ["@songmin"]
labels: ["rfc:aug02-06", "surface:cli", "gate:default-off"]
config_refs:
  env: ["QUANTA_HUNK_MUTATION_RECEIPT"]
  runtime: ["hunkMutationReceipt"]
purpose: |
  RFC-06-4 B5 durable hunk-mutation receipt: when
  QUANTA_HUNK_MUTATION_RECEIPT is on, each per-hunk apply persists an
  intent/effect/terminal receipt into a CAS undo journal so the apply is
  undoable via a content-VERIFIED (drift-refusing) revert — the revert refuses
  if the on-disk content has since changed. Default OFF ⇒ per-hunk apply is
  byte-identical (no receipt, no journal). Read via
  runtimeConfig().hunkMutationReceipt (discoverable in /config).
evidence:
  code:
    - src/runner/hunk-mutation-journal.ts
    - src/tool/git/review-anchor.ts
    - src/apps/cli/repl/cli-hunk-select-flow.ts
    - src/shared/runtime-config.ts
  adrs: ["docs/plans/aug-02-absorption/rfc-06-worktree-review-ux.md"]
  tests:
    unit:
      - tests/unit/runner/hunk-mutation-journal.test.ts
      - tests/unit/cli/hunk-receipt-frontdoor.test.ts
      - tests/unit/tool/git/review-anchor.test.ts
knobs:
  - name: QUANTA_HUNK_MUTATION_RECEIPT
    where: runtime-config
    default: false
    purpose: persist per-hunk apply receipt + CAS undo journal (OFF ⇒ apply byte-identical)
