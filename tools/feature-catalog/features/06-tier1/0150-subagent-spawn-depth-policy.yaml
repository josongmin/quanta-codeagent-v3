id: subagent-spawn-depth-policy
title: Sub-agent spawn-depth policy (lineage-derived depth + capability-absence)
section: 6
subsystem: 서브에이전트
order: 150
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: integrated
config_refs:
  env: [QUANTA_MAX_DESCENDANT_DEPTH]
owners: ['@songmin']
labels: [surface:core, tier:1]
depends_on: [quantasubagent-maxdepth, tier1-subagent-block]
surface_integration:
  cli: unknown
  web: unknown
  method: unverified
purpose: |
  RFC jul-13 §4.1/§4.2/§6.5 (rev.4) — lineage-derived depth + depth-parameterized
  capability-absence for sub-agent nesting. SSOT policy module
  `src/agent/spawn-depth.ts` exposes `childDepthOf(parent)` (the ONLY authority
  for a child's depth = `parent.depth + 1`; the runner's `buildChildConfig` calls
  it against the REAL parent, ignoring caller-asserted `req.depth`, so forged
  `depth:0` hardcodes are inert), `SpawnLineageError` (malformed parent depth ⇒
  fail-closed deny, no `depth:0` fallback), the two derived predicates
  `canExposeSpawnTools(parentDepth, cap)` / `canAdmitChildDepth(childDepth, cap)`,
  the rev.4 MIN-CAP resolver `effectiveCap(requested) = min(policy, requested ?? +∞)`,
  and `spawnToolsAvailable(config)`. The authoritative operator policy is
  runtime-config `maxDescendantDepth` = the max descendant depth a spawn may
  create; default 1 = root-only (rev.4 canonical, the user's leaf intent),
  overridable via `QUANTA_MAX_DESCENDANT_DEPTH` (`1` = root-only, `0` = no
  spawning). Per-config `subagent.maxDepth` (legacy `QUANTA_SUBAGENT_MAX_DEPTH`)
  can only TIGHTEN below policy, never raise it above the ceiling (min-cap — this
  resolves the two-knob split-brain). Not a heuristic: a numeric threshold on the
  existing `AgentConfig.depth` (0 = root), not a "usually leaf" estimate.
evidence:
  code:
    - src/agent/spawn-depth.ts
    - src/agent/subagent-runner.ts
    - src/shared/runtime-config.ts
    - src/shared/runtime-config/types.ts
    - src/shared/runtime-config-knobs/knobs-a.ts
  adrs: ["docs/plans/jul-13-subagent-nesting-control.md"]
  tests:
    unit:
      - tests/unit/spawn-depth-hellgate.test.ts
      - tests/unit/max-descendant-depth-config-pin.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_MAX_DESCENDANT_DEPTH
    default: 1
    purpose: 'Max descendant agent depth (children a spawn may create). 1 = root-only, 0 = no spawning. default 1. Authoritative operator ceiling — per-config subagent.maxDepth can only tighten below this, never raise it (min-cap).'
deliberate_hold: null
notes: ''
