notes: |
  Distinct from `assemble-store-core` (which builds the store + embedder
  collaborators). This builder assembles the TUNING config that the loop
  passes to memory recall / distill / consolidate behaviors. Every
  conditional spread is contract — surfaces that drop `=== false` for
  truthiness checks WILL break exactOptional byte-identity.
