depends_on: [assemble-store-core]
purpose: |
  Surface-agnostic memory-config assembly. Two distinct helpers:
  (1) `parseRecallTiers` — pure parser for raw
      `QUANTA_MEMORY_RECALL_TIERS`-style strings ("episodic,semantic"). Lower-
      cases + trims tokens, accepts only the two valid tiers, dedups via Set.
      Empty result ⇒ `undefined` so the caller can omit the key entirely.
  (2) `buildMemoryConfigCore` — composes the `memory` tuning block from 5
      pre-parsed knobs (each mirrors a prior env flag exactly):
      `recallLimit` (finite int gate), `distill === false`, `consolidate ===
      false`, `selfEditTools === false`, `recallTiers`. EVERY conditional
      spread preserved byte-for-byte from the prior `internal.ts` inline
      block (the `=== false` triple-equals is deliberate — `undefined` /
      truthy paths MUST omit the key entirely to keep the assembled `memory`
      shape byte-identical under `exactOptionalPropertyTypes`).
  Empty-block contract: when `!store && Object.keys(block).length === 0` ⇒
  `undefined` (key omitted). Otherwise returns the block (even if empty)
  because a store is configured.
