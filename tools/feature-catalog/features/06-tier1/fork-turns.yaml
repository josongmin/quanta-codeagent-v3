purpose: |
  The `agent` spawn gains a `fork_turns` input (none[default] | all | N): a child
  inherits the parent's recent conversation instead of starting cold (Codex
  fork_turns parity; the other peer verbs already existed). A "turn" is a
  user-message boundary; N keeps the last N user exchanges. The selected
  transcript is REDACTED (secret + PII scrubbed via the advisor's redactTranscript)
  and prepended to the child prompt framed as DATA (not instructions). Pure core
  (selectForkTurns/buildForkTurnsPreamble/composeForkedPrompt) + a plane-clean
  forkPrompt callback injected by the tier-1 builder (the @/subagent leaf never
  imports @/agent). Default `none` ⇒ prompt unchanged (byte-identical cold start).
  No env gate — it's a per-spawn tool input. The 3-tool-plane consolidation
  (GAP8b) is a cosmetic refactor, deliberately skipped.
