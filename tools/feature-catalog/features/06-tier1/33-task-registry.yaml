notes: |
  `TaskOwnerToken` is a branded string type — cannot be forged at compile
  time without the brand constructor. Companion of `subagent-6-tools` (which
  describes the 6 standard contract tools); this entry is the registry the
  task-tool subset reads/writes. `task_output` blocking timeout default 30s,
  caller-overridable via `timeout_ms`.
