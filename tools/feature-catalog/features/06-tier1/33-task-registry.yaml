purpose: |
  In-memory registry of background subagent tasks (v2's `taskRegistry` shape).
  Agent tool registers a task here when launched in background mode and
  resolves it when the forked runner settles; `task_output` / `task_stop`
  observe and cancel by id. Three seams: (1) `register()` returns the
  per-task `AbortController` — callers MUST plumb its `.signal` into the
  runner's request via `SubagentRequest.signal` so `stop(id)` actually
  unwinds the child (historical bug class fixed). (2) S17 capability
  token — `register()` returns an unforgeable `TaskOwnerToken` (128-bit
  `crypto.randomUUID()`) alongside the task id; the spawner stashes the
  token and surrenders it back to `stop(id, ownerToken)`. Without matching
  token, `stop()` REFUSES — a sibling subagent that learns another's `id`
  cannot DoS-cancel it. (3) LRU eviction — `maxRetained` cap (default 256)
  applies to SETTLED records only; running tasks never evict, never count
  toward the cap. Oldest-by-`endedAt` settled records evict first. Lives
  for the process — not persisted.
