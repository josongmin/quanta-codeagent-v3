notes: '슬라이스는 leaf-only — @/agent, @/tool, @/permission, @/storage import 0. host가 명시적으로 parsePlaybookFrontmatter + evaluatePlaybookAction + createInlineTriggerWatcher를 wire하기 전까지 dormant. chokidar는 install 차단(verify-workflow memory)으로 node:fs.watch fallback 채택; port shape 동일하므로 chokidar swap은 adapter body 1-line 변경. 후속: discoverSkills 합성 / permission seam wire / CLI session-bind wire / slash command 표면(Windsurf parity).'
