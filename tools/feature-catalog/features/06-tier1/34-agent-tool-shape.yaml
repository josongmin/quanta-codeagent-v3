owners: ["@songmin"]
labels: ["surface:core", "tier:1", "absorbed:codex"]
depends_on: [subagent-6-tools, task-registry]
configurable: static
purpose: |
  Closed input schema for the parent's `agent` tool — six Codex Round-3
  absorption fields beyond `prompt`/`agent_type`/`tools`/`background`/
  `isolation`/`max_turns`/`max_tokens`. (1) `task_kind: "read"|"edit"|
  "review"` — coarse role used to derive a default tool allowlist when
  `tools` is omitted (read = pure inspection; edit = inspection + writers +
  bash; review = strictest read-only critique). Explicit `tools` ALWAYS
  wins. (2) `result_shape` — one-line format spec for the child's final
  answer (e.g. `"JSON: {ok, files[], summary}"`), injected into the child's
  seed prompt. (3) `owned_surfaces` / (4) `forbidden_surfaces` — files/
  paths the child is permitted to read/modify vs MUST NOT touch (paired).
  (5) `continue_from: <prior_task_id>` — settled background task's
  `finalText` prepended to the new child's seed as a "Previous attempt"
  block; unknown/evicted id returns a recoverable error. (6) `checkpoint:
  true` — runner injects guidance for the child to write interim progress
  to `<cwd>/.subagent-state/<task_id>.md`; parent reads via normal `read`
  tool. Incompatible with `isolation:"worktree"` (parent can't reach
  inside a throwaway worktree).
