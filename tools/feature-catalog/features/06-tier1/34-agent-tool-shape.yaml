notes: |
  Read-only tool allowlist source: `read`, `grep`, `glob`, `lsp_references`,
  `lsp_document_symbol`, `lsp_workspace_symbol`, `diagnostics`, `localize`.
  Edit adds `write`, `edit`, `bash`. Review drops `localize` from read-only.
  `DEFAULT_MAX_DEPTH = 3`. Companion of `subagent-6-tools` (the contract-level
  tool surface) + `task-registry` (the lifecycle store).
