id: aug02-rfc06-workspace-ownership
title: RFC06 — WorkspaceOwnership contract + worktree inspect/hardened-remove + operator GC
section: 6
subsystem: Worktree lifecycle — ownership + inspect + GC (aug-02 RFC06-0/1/3)
order: 563
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: partial
modes: [interactive]
configurable: static
owners: ["@songmin"]
labels: ["rfc:aug02-06", "surface:cli", "safety"]
purpose: |
  RFC-06 worktree lifecycle substrate: (0) a persisted WorkspaceOwnership
  contract on SessionMeta records which session owns a worktree; (1) a porcelain
  worktree INSPECTOR + a HARDENED non-force remove (refuses to delete a worktree
  with un-owned/dirty state — legacy ownership-less forks get a report-only
  salvage notice, not a silent delete); (3) an explicit OPERATOR worktree GC
  (dry-run → apply with TOCTOU re-check). Additive: removal/GC only act on
  worktrees the ownership contract clears.
evidence:
  code:
    - src/session/workspace-ownership.ts
    - src/runtime/worktree-inspect.ts
    - src/runtime/worktree-fork.ts
    - src/runner/session-ops/worktree-gc.ts
    - src/runner/session-ops/index.ts
  adrs: ["docs/plans/aug-02-absorption/rfc-06-worktree-review-ux.md"]
  tests:
    unit:
      - tests/unit/workspace-ownership.test.ts
      - tests/unit/worktree-fork.test.ts
      - tests/unit/session-ops/worktree-gc.test.ts
      - tests/unit/session-security-regression.test.ts
