id: progress-audit-skill
title: progress-audit 시스템 스킬 (ADR-0045)
section: 6
subsystem: 스킬 — 번들 시스템 스킬 (코드 증거 기반 audit discipline)
order: 14
maturity: L3
status: new
purpose: 'Codex Desktop의 code-only-progress-audit/SKILL.md를 흡수한 번들 시스템 스킬. "진행률"/"코드 레벨로만"/"P0/P1/P2"/"문서는 보지 말고" 트리거 시 6 P0 규칙 + 7-step 절차 + outcome enum(success/partial/uncertain, "complete" 금지)을 강제. systemSkillsDir() 기반으로 user QUANTA_SKILLS_DIR과 무관하게 발견되며 name collision에서 system이 user를 이김(보안 invariant). Read/Grep/Bash로 lenient `tools:` 게이팅.'
evidence:
  code:
    - src/skill/system-skills/progress-audit/SKILL.md
    - src/skill/system-skills/index.ts
    - src/skill/index.ts
    - src/agent/features.ts
  adrs: [45]
  tests:
    unit:
      - tests/unit/skill-progress-audit.test.ts
      - tests/unit/features.test.ts
    integration:
      - tests/integration/skill-progress-audit-discovery.test.ts
    contract: []
knobs: []
deliberate_hold:
  reason: 'frontmatter dual-shape (lenient `tools:` + strict 6-field) 비용으로 strict `parseSkillMarkdown` round-trip은 의도적으로 실패. 단일화는 ADR-0045 §한계 (a) follow-up. compile-time SKILL.md 번들링도 별도 작업(§한계 (b)). slash-command 라우터 미존재(§한계 (c)).'
  promotion_path: 'lenient/strict parser 단일화(+ allowedTools alias) → compile bundle SKILL.md packaging → `/progress-audit` 슬래시 라우터 → L4'
notes: 'system-wins-on-collision은 user-supplied skill이 audit discipline을 silent shadow하지 못하게 막는 보안 invariant. RFC §1.2 default-OFF 유지(`config.skills` unset이면 system skill도 미발견). 한국어 트리거 "진행률"/"코드 레벨로만"/"P0/P1/P2"/"문서는 보지 말고"는 description에 raw로 노출.'
