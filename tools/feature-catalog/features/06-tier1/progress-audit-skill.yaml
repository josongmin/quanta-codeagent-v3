notes: 'system-wins-on-collision은 user-supplied skill이 audit discipline을 silent shadow하지 못하게 막는 보안 invariant. RFC §1.2 default-OFF 유지(`config.skills` unset이면 system skill도 미발견). 한국어 트리거 "진행률"/"코드 레벨로만"/"P0/P1/P2"/"문서는 보지 말고"는 description에 raw로 노출. HITL 4-tier(ADR-0047)와의 관계: skill allowlist(Read/Grep/Bash)가 mutator dispatch를 차단하므로 audit run 중 hand-off-required/always-confirm 액션 발생 불가능 — "report-only" 의도가 skill + HITL 두 레이어에서 독립적으로 보장.'
