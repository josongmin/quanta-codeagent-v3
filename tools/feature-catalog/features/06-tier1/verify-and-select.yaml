knobs:
  - name: verify-select
    where: QUANTA_BENCH_VERIFY_SELECT
    purpose: "N candidate count; unset ⇒ single-pass (byte-identical). Cost ≈ ×N."
  - name: verify-select-concurrency
    where: QUANTA_BENCH_VERIFY_SELECT_CONCURRENCY
    purpose: "Max candidates generated concurrently; unset ⇒ sequential. >1 needs isolated generate. Throttle: instance-conc × this."
  - name: verify-select-early-accept
    where: QUANTA_BENCH_VERIFY_SELECT_EARLY_ACCEPT
    purpose: "Progressive cost guard: stop after the first clean owner-scoped candidate with explicit hard-positive regression/resolved authority; fail-open nulls and soft-only repro quorum remain keep-search signals."
  - name: verify-select-regression
    where: QUANTA_BENCH_VERIFY_SELECT_REGRESSION
    purpose: "Regression source for verify-select: unset/gold keeps eval-only PASS_TO_PASS; discovered runs no-oracle impacted native repo tests; off ablates."
  - name: verify-select-repro
    where: QUANTA_BENCH_VERIFY_SELECT_REPRO
    purpose: "Generated repro consensus mode for verify-select: unset/hard preserves legacy reject; positive uses votes/k as soft-only; off ablates."
deliberate_hold: null
notes: |
  FAIL-OPEN is the encoding of the north-star: every nullable signal
  (regressionGreen / patchedResolvedKofN) NEVER rejects a candidate; only an
  explicit false / insufficient hard signal makes one inadmissible. Soft signals
  wired today: minimality (relative, parameter-free) + ownerCoverage (candidate
  files ∩ closure-ranked owners — this is what lets a root-cause sibling beat a
  symptom fixation). Both hard-gate signal ports are driver-ready: regression
  (TB, +3.42 lever in Trae's ablation; PASS_TO_PASS threading is the eval-only
  follow-up; no-oracle `discovered` mode finds impacted native repo tests from
  candidate source files, base-preflights them, and only rejects on candidate
  regressions) and patchedResolvedKofN (TC, makePatchedResolvedConsensus re-runs
  the reproducing set on the patched tree; `verify-select-repro=positive` demotes
  that self-generated signal to soft-only AND skips eval-only gold calibration,
  while unset preserves the legacy gold-calibrated hard gate). Current explicit
  presets: `agentless-v3-thin-strict-closure-select` (noexec candidate-gen +
  ClosureBundle owner authority + late selector), `agentless-v3-select-regression`
  (no-oracle selection arm), and `agentless-v3-select-regression-doubt` (same
  arm plus `repro-doubt:5` for verify-loop stalls). L3, not L4: wired +
  hellgate-tested, present in explicit experimental presets, but still not
  promoted as a base-profile winner.
