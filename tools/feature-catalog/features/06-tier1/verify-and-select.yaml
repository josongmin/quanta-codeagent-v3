deliberate_hold: null
notes: |
  FAIL-OPEN is the encoding of the north-star: every nullable signal
  (regressionGreen / patchedResolvedKofN) NEVER rejects a candidate; only an
  explicit false / insufficient hard signal makes one inadmissible. Soft signals
  wired today: minimality (relative, parameter-free) + ownerCoverage (candidate
  files ∩ closure-ranked owners — this is what lets a root-cause sibling beat a
  symptom fixation). Both hard-gate signal ports are driver-ready: regression
  (TB, +3.42 lever in Trae's ablation; PASS_TO_PASS threading is the eval-only
  follow-up) and patchedResolvedKofN (TC, makePatchedResolvedConsensus re-runs
  the reproducing set on the patched tree — the strongest "actually fixed it"
  signal, with all-crashed ⇒ null fail-open). L3, not L4: wired + hellgate-tested
  but default-OFF and not yet A/B-measured.
