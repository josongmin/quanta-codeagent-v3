purpose: |
  The OUTER control plane for SWE-bench: the corrected north-star is "no single
  noisy oracle holds global verdict authority". The bench generates N candidate
  patches (closure-localization-seeded for DIVERSITY — candidate i is nudged
  toward the i-th ranked owner so the set spans different FIX SITES, attacking
  the measured cause-vs-symptom failure where a run fixates on the symptom),
  scores each through the VerificationBundle (HARD gates AND'd, null=FAIL-OPEN;
  SOFT weighted rank), and submits selectBest (else selectBestEffort — the gates
  inform but never submit nothing). Bounded repair is demoted to an INNER
  candidate-gen tactic. Pieces: VerificationBundle contract+scorer (T0/TA), the
  regression oracle engine port + bench adapter (TB, plug-ready hard signal,
  no-leak fenced), the pure selection-executor orchestrator (TD), and the
  `verify-select` knob (8-step plumbing). Default-OFF / byte-identical when
  unset. Explicit experimental presets now exist (`agentless-v3-thin-strict-select`,
  `agentless-v3-thin-strict-closure-select`, `agentless-v3-select-regression`,
  and `agentless-v3-select-regression-doubt`), but the feature is still NOT in
  the default base profile and is not yet promoted as an A/B-proven winner.
