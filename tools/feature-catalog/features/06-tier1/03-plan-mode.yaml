id: plan-mode
title: Plan-mode 구조화 메타도구 + state-machine (SOTA++ ADR-0095 draft)
section: 6
subsystem: Plan-mode 구조화 (Cursor todoModel + Codex plan_delta + Claude ExitPlanMode 합성, ADR-0095 draft)
order: 3
maturity: L4
status: new
owners: ["@songmin"]
labels: ["surface:core", "tier:1", "absorbed:codex", "absorbed:cursor"]
depends_on: [plan-exit-three-way]
purpose: |
  ROI-무관 SOTA++ 흡수 — Cursor maximalist 도구셋(create_plan/update_todos) + Codex 이벤트
  관측(plan_delta/plan_snapshot) + Claude 승인 ergonomics(plan-exit-three-way, 별개 L4)를
  합쳐 세 모델 모두 능가하는 구조화 plan-state-machine. 5-state TodoStatus 닫힌 enum +
  25-cell transition matrix(Cursor의 UNSPECIFIED 거부). CAS-versioned Plan envelope
  (낙관 동시성, 세 모델 다 부재). DAG dependency validator(자기참조·dangling·사이클 거부 +
  100노드 perf <50ms gate, 세 모델 다 부재). PlanStore port + ToolContext duck-typed
  PlanMutator seam(@/tool↛@/agent/plan 슬라이스 격리, biome enforce). 4 model-callable
  도구(create_plan / update_todos / update_plan / remove_todos) + 운영자 port
  request_user_input(ADR-0097 자매). 6 AgentEvent 변형(plan_created/_updated/_snapshot/
  _user_input_*/mode_changed) + Submission set_mode op + isSetModeOp 가드. 부재 시
  default-OFF byte-identical.
