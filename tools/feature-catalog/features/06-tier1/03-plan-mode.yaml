notes: |
  L4 (2026-05-23 SOTA++ 흡수, P1-P7 전부 통합): closed-shape exhaustive switch 전수
  (transitions 5×5 + 6 PlanDelta + 10 PlanMutationError + 6 ResponseQueuedReason +
  5 TodoStatus 전부 never default arm). 휴리스틱 0 — string sniffing, fuzzy match,
  infer 없음. 슬라이스 격리: @/tool은 @/agent/plan을 import 안 함(biome fence +
  ToolContext duck-typed seam). TodoItem.assignee → ADR-0042 subagent nickname,
  .verifyHint → ADR-0013 verify-guard 연결. plan-exit-three-way(ADR-0086) +
  dispatch-block(ADR-0036)과 상호운용 — plan-exit-lifecycle router(P6: approved=
  freeze / rejected=clear / changes_requested=preserve+feedback). P7 snapshot
  영속화: AgentConfig.planSnapshotStore + loop session-start hydrate(restorePlanSnapshot,
  errors→error AgentEvent) + session-end save(savePlanSnapshot, follow-up-queue 패턴
  미러). P7 loop set_mode op 소비 (mode_changed 발행, noop 전환은 redundant heartbeat
  억제). planToStreamMirror 단일 슬라이스 경계 projector. 299 hellgate tests /
  719 expects / 0 fail / tsc 0 / biome 0 errors.
