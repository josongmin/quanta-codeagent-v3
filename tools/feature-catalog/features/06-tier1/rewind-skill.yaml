notes: |
  Default-OFF — `ctx.shadowOdb` 부재 시 도구가 "shadow store not configured"
  로 노옵하므로 skill 자체도 효과적으로 disabled (byte-identical to NOT
  registering). System-wins-on-collision 보호: user-supplied "rewind" skill이
  shadow-restore discipline을 silent shadow하지 못함. `/snapshot` 슬래시
  커맨드(`snapshot-slash-cmd.yaml`, section 10)는 동일 ShadowOdb 포트를
  agent loop 밖에서 surface한 sibling이며, 두 entry point는 독립적으로
  유지된다.
