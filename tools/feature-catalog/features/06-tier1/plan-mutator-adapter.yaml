notes: |
  ADR-0096 introduces this adapter so the `@/tool` slice can call
  PlanMutator without importing the canonical plan types. Adding a new
  PlanDeltaKind / PlanMutationErrorCode in either slice forces a compile
  error at this site until the mapping is extended.
