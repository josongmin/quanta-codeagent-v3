id: background-subagent
title: Background subagent scheduler
section: 6
subsystem: Subagent background execution (ADR-0130)
order: 130
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: n-a
owners: ["@songmin"]
labels: ["surface:core", "tier:1", "absorbed:cursor"]
depends_on: [subagent-bg-tools-trio, agent, agent-loop-branch-hardening, agent-tool-shape, agent-types-split]
purpose: |
  Scheduler that runs a subagent fork in the background so the parent loop
  continues turn-taking while the subagent works. Pairs with a wait/await
  tool the parent uses to collect the background result when it's ready.
  Bridges the Tier-1 subagent surface with the background execution semantics
  industry leaders ship as force_background_subagent + subagent_await.
