id: branch-search-verifier-suite
title: Branch-search verifier suite — tsc / test / lint / lsp_diag + combineVerifiers
section: 6
subsystem: Speculative branch search verification (ADR-0084)
order: 87
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: partial
modes: [interactive, headless]
configurable: integrated
owners: ["@songmin"]
