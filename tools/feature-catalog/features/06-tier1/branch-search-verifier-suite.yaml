depends_on: [speculative-branch-search, branch-search-isolate-symlink-safe, branch-search-pure-scorer, branch-search-progress, branch-search-minimal-change]
purpose: |
  Concrete `Verifier` implementations bound to `@/runtime/shell#runShell`
  (env-scrubbed, timeout-bounded). Each verifier is READ-ONLY w.r.t. the
  candidate workspace (negative invariant) — analysis only. Five
  signal-emitting verifiers: `tscVerifier` (TS compile errors),
  `testVerifier` (test runner result), `lintVerifier` (biome/eslint),
  `lspDiagVerifier` (DiagnosePort-injected, no shell) and
  `patchSizeVerifier` (patch byte/file count — minimal-change penalty).
  `combineVerifiers(...vs)` runs a tier in PARALLEL and concatenates the
  emitted `VerifierSignal`s. Per-verifier timing recorded via `timed`
  with a caller-injected `clock` for test determinism. Cap on first-line
  extraction (200 chars) and error counting are pure helpers.
