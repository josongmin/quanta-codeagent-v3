knobs: []
deliberate_hold: null
notes: |
  All verifiers return ONE `VerifierSignal` (or zero on no-op). Parallel
  composition via `combineVerifiers` keeps the orchestrator simple — the
  scorer folds whatever signals arrived. Patch-size verifier is the
  ADR-0117 minimal-change bias seam, attaching `patch_size` penalty
  signals consumed by `minimalChangeSelector`.
