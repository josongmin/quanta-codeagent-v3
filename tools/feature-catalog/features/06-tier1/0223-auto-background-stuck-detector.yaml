id: auto-background-stuck-detector
title: Auto-background after 2 s — stuck-detector + propose-handler observer
section: 6
subsystem: Tier-1 background subagent — automatic UX observer (ADR-0223)
order: 223
maturity: L3
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "tier:1", "absorbed:claude-code"]
depends_on: [subagent-background-wire]
config_refs:
  env: []
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "REPL execution-plane wires accept to BackgroundSubagentScheduler.fork; >2s nudge + Esc/Enter prompt is a CLI affordance"
    web: "the stuck-proposal nudge is a progress_update/propose event dropped at context-binding.ts:1104 default arm; no web nudge"
purpose: |
  Claude Code SOTA absorption: when a long-running tool exec sits >2 s with
  no progress, the UX automatically surfaces "move this to background?" and
  one keystroke (Esc/Enter) flips the call into the detached path
  (ADR-0140's BackgroundSubagentScheduler). Today quanta has the
  underlying scheduler but requires an EXPLICIT user `/bg` invocation —
  this slice is the automatic OBSERVER that DECIDES *when* the proposal
  should surface, idempotently and per-call. Two ports
  (StuckDetectorPort / ProposeHandlerPort) + two default impls + one
  pure-functional kernel (computeStuckProbe / normalizeThreshold /
  stuckProbeAbsent). Plane-clean: the slice imports ZERO `@/*` modules;
  the dispatch wrapper imports the slice via a two-line tick wire
  bracketing `execute()` from inside a finally so a throwing tool still
  drops the tracker entry. Default-OFF byte-identical: when
  `config.autoBackground?.detector` is absent both `tick*` calls
  short-circuit at the optional chain (zero allocation, zero behaviour
  delta — RFC §1.2).
evidence:
  code:
    - src/agent/auto-background/port.ts
    - src/agent/auto-background/stuck-detector.ts
    - src/agent/auto-background/default-tracker.ts
    - src/agent/auto-background/propose-handler.ts
    - src/agent/auto-background/index.ts
    - src/agent/dispatch.ts
    - src/agent/types.ts
  adrs: [223, 140, 130]
  tests:
    unit:
      - tests/unit/auto-background-stuck-detector-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: autoBackground.thresholdMs
    default: 2000
    purpose: |
      Trigger threshold in ms (INCLUSIVE — probe at exactly threshold ⇒ stuck:true).
      Default mirrors Claude Code's 2 s UX timing. Non-finite / non-positive
      values coerce to default via normalizeThreshold (no-throw contract).
  - name: autoBackground.detector
    default: 'undefined'
    purpose: 'Injected StuckDetectorPort. Absent ⇒ dispatch tick wire is optional-chain no-op (default-OFF byte-identical).'
  - name: autoBackground.proposer
    default: 'undefined'
    purpose: 'Optional ProposeHandlerPort wrapping the detector with once-per-id rule. Independent of detector — a host may wire only the detector and render its own status-bar nudge from isStuck.'
deliberate_hold: null
notes: |
  17-case hellgate seals (HELL-AB-01..17):
    01 <2s ⇒ NOT stuck; 02 =2s ⇒ stuck (boundary inclusive);
    03 >2s ⇒ stuck; 04 dismiss blocks future shouldPropose;
    05 at-most-once per id; 06 distinct ids independent;
    07 OFF parity (optional chain no-op); 08 injected clock SSOT
    (Date.now not consulted); 09 tickToolEnd drops entry;
    10 thresholdMs knob honored; 11 N parallel tools tracked;
    12 1000 start/end cycles leave list empty (no leak);
    13 double-start preserves original startTimeMs (idempotent);
    14 unknown-id ⇒ shape-stable zero, no throw;
    15 pure helpers — NaN propagates, normalize coerces, absent zero;
    16 accept → terminal posture; 17 throwing detector survived
    (defense-in-depth).
  Sibling to ADR-0140 (background subagent caller wire) — that slice is the
  EXECUTOR; this slice is the OBSERVER. The shared REPL execution-plane wire
  now binds `accept` ⇒ `BackgroundSubagentScheduler.fork`; other surfaces may
  still choose their own prompt/rendering policy on top of the same observer
  ports.
