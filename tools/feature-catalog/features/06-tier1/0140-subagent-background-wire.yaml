purpose: |
  Caller-wire closure for ADR-0130 — adds AgentConfig.subagentBackground
  typed slot + FeaturesConfig Pick + buildSessionFeatures composer step
  so the BackgroundSubagentScheduler helper actually reaches the loop's
  extraTools. Without this wire, the 3 LLM-facing tools (subagent_fork
  / subagent_poll / subagent_await) are unreachable even though the
  helper exists. Follows the deferred-wire pattern voice-matched to
  ADR-0124 / ADR-0128 / ADR-0125 / ADR-0119 — helper lands plane-clean
  first, caller wire closes in a follow-up ADR. 4 surgical edits,
  zero mutation to existing wiring.
