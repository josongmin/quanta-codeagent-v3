notes: |
  5-mode closed enum: architect (40 turns / 128K) — heavy reasoning,
  read-only; editor (12/32K) — narrow mutator, apply diffs; debug (24/64K)
  — read + shell repro, no edit; tdd (48/128K) — red-green-refactor full
  surface no subagent; explore (20/64K) — pure read, wide scope. Per-call
  budget may TIGHTEN but never LOOSEN. mode.ts is NOT modified — slice
  imports AgentMode type only via local mirror. Cross-track conflict-free
  with W1-7 in-flight per-mode persona variants.
