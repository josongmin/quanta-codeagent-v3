id: subagent-mode-typed
title: Mode-typed delegation (parent → child mode-typed handoff)
section: 6
subsystem: Subagent typed delegation (ADR-0218)
order: 218
maturity: L3
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: n-a
owners: ["@songmin"]
labels: ["surface:core", "tier:1", "absorbed:roo", "absorbed:devin", "absorbed:codex", "absorbed:cursor"]
depends_on: [background-subagent, agent-tool-shape]
purpose: |
  Parent → child mode-typed handoff with isolated context. 4-vendor convergence
  (Roo Boomerang/Orchestrator, Devin sub-task delegation, Codex
  `spawn_agent({ role })`, Cursor `subagent_await`): every delegation declares
  its mode up front, which selects (a) the child's prompt voice (variant name
  the host maps via mode.ts), (b) the child's tool subset (allowedToolKinds),
  (c) the child's budget cap (maxTurns + maxTokens). Result-only boomerang
  (`BoomerangResult`) crosses the parent/child boundary — typed errorKind
  union covers cancelled/budget-overflow/mode-missing/runner-error/timeout.
  Composes additively with ADR-0130 (BG scheduler) via `wrapSubagentRunner`.
  Default-OFF: loop never constructs a DelegationPort; host opt-in via
  AgentConfig slot.
