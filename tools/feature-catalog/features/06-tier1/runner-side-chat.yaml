    integration: []
    contract: []
knobs: []
deliberate_hold:
  reason: "CLI-only surface; no web side-conversation renderer exists."
  promotion_path: "Add a web command handler and render the separately accounted result."
notes: "Isolation is structural: only llm, registry, stream, permission, system, cwd, messages, signal, and maxTurns enter the child AgentConfig."
