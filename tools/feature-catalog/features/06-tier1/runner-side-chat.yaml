  evidence:
    cli: "The CLI /side slash injects the host session starter; the host builds a fresh read-only registry and isolated AgentConfig before runAgent."
    web: "No web slash or result renderer exists."
purpose: |
  A user-initiated side conversation runs with a fresh message list, a physically
  filtered read-only registry, capped turns, and a separate usage tally. The
  host owner deliberately does not spread the parent AgentConfig, so parent
  hooks, memory, approval state, Radar, and mutable stores cannot leak into
  the auxiliary run. The former runner duplicate and non-LLM side-chat stub
  were removed; this host implementation is the sole authority.
