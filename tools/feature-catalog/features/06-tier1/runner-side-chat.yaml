    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  Negative invariant — side-chat은 메인 SessionWriter에 절대 write하지 않는다(envelope
  append-only는 메인 한정). 17-tool forbidden 목록은 deny-default(allowlist에 없으면 거부)
  로 도구 추가 시 자동 차단. usage tally는 입출력 토큰만 누적, 메인 turn end에 합산해서
  비용 underreport 방지.
