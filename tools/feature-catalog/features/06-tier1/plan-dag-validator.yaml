notes: |
  Slice rule: pure module. No clock, no I/O, no logger, no allocation
  beyond the result. Safe for hot-path mutation pre-flight. Hellgate
  battery in tests/unit/agent/plan/dag-hell.test.ts covers cycle path
  return shape, the 100-node 50ms gate, and deterministic toposort
  tie-break.
