id: playbook-trigger-cli-bind
title: Playbook inline-trigger CLI auto-bind opt-in
section: 6
subsystem: Playbook + CLI surface (ADR-0293)
order: 293
maturity: L2
status: stable
ui_surfaces: [cli]
monitoring: partial
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:cli", "tier:1", "default-off", "closes:adr-0203-gap"]
depends_on: ["user-authored-playbook-frontmatter", "playbook-auto-dispatch-git-directive-completion"]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 2/3 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "CLI-flag/env-only watcher; no POST /config key (not in CONFIG_ALLOWED_KEYS) and no web handler (B2) reach the browser."
purpose: |
  Closes ADR-0203/0240's last unwired hop: the `AgentConfig.playbookTrigger`
  slot is now reachable via `--playbook-trigger` flag OR
  `QUANTA_PLAYBOOK_TRIGGER=on` env (env wins). `maybeStartPlaybookTriggerWire`
  in `apps/cli/repl/playbook-trigger-wire.ts` constructs an FS watcher
  rooted at `<cwd>/.quanta/playbooks` and returns a typed
  `PlaybookTriggerWireHandle` (stop + isActive). Sibling surface seam
  `createPlaybookTriggerSurfaceSeam()` owns at-most-one live handle for
  session lifecycle attach/detach. Default-OFF byte-identical: absent
  env + flag ⇒ shared frozen NOOP singleton (zero allocation). No-throw
  on every public surface. A confined top-level `.md` disk registry is loaded
  from `<cwd>/.quanta/playbooks`; invalid/duplicate/escaping entries fail the
  scan atomically, retain the last good reload snapshot, and surface typed
  diagnostics. A missing root fails loud without starting a watcher; an empty
  valid root starts no dispatchable registrations and emits an operator notice.
evidence:
  code:
    - src/apps/cli/repl/playbook-trigger-wire.ts
    - src/apps/cli/repl/playbook-trigger-surface-seam.ts
    - src/skill/playbook/disk-registry.ts
    - src/apps/agent/cli-args.ts
  tests:
    unit:
      - tests/unit/playbook-trigger-cli-bind-hellgate.test.ts
      - tests/unit/skill/playbook/disk-registry-hellgate.test.ts
      - tests/unit/apps/cli/playbook-trigger-empty-registry-hellgate.test.ts
    integration: []
    contract: []
  adrs:
    - docs/decisions/0293-playbook-trigger-cli-bind.md
