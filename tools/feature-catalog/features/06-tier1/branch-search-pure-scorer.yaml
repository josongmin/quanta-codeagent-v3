notes: |
  No IO, no clock — pure functions all the way down. Magnitude signals
  clamp to [0, 1]; boolean pass folds to {0, 1}. PENALTY_KINDS is a frozen
  ReadonlySet so future penalty additions are explicit. Weights override
  via `makeScorer({ tsc: 0.5 })` partial — missing keys default.
