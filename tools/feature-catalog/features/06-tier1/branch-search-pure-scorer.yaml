purpose: |
  Pure scorer + selector. Given verifier signals, fold to a 0..1 total and
  pick winner. Deterministic for a fixed signal set (non-determinism lives
  in propose). Frozen `DEFAULT_WEIGHTS`: tsc 0.4 / test 0.4 / lint 0.1 /
  lsp_diag 0.2 / llm_judge 0.2 / patch_size 0.1. Weights need NOT sum to 1
  — `scoreWith` normalizes by the weight mass of NON-penalty kinds
  present, so a candidate with only tsc+test signals scores fairly against
  one with full signals. `patch_size` is a PENALTY KIND (subtracted,
  scaled by magnitude) — ADR-0117 minimal-change bias. `makeScorer(over
  rides?)` factory for per-mode weight tuning. Two selectors: `argmax
  Selector` picks max total; `minimalChangeSelector` uses patch_size as
  the tie-breaker (then primary ordering when totals tie).
