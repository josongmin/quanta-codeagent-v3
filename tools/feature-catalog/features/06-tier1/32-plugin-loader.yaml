depends_on: [plugin-manifest]
configurable: static
purpose: |
  Two contracts behind the plugin manifest. (1) `loadPluginManifest(pluginDir)`
  reads + validates a single plugin root: FAILS LOUDLY when the manifest
  is missing, JSON-malformed, or Zod-invalid — no auto-fix, no defaulting,
  no swallowed errors (Cluster E hard rule). Returns the manifest + optional
  first-listed MCP server (when `.mcp.json` is present + has ≥1 server)
  + `PluginSkillEntry[]` (each entry's `<dir>/skills/<name>/SKILL.md` path —
  manifest loader does NOT parse the frontmatter; that's `skill-frontmatter`).
  (2) `discoverPlugins(rootDir)` walks the tree returning every directory
  containing `<dir>/.quanta-plugin/plugin.json`. Depth CAPPED at 4 to
  prevent runaway scans on large monorepos / node_modules. Slice contract:
  loader may touch the filesystem + import `./plugin-manifest`; MUST NOT
  import other slices (Biome enforces).
