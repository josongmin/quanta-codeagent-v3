  promotion_path: 'runner/assemble/plugin.ts builder 도입 → buildSessionFeatures fold; discoverPlugins(repoRoot) 결과의 SKILL.md 트리를 skill registry에 inject + .mcp.json 의 MCP server를 ToolRegistry에 register.'
notes: |
  Cluster E / F13, ADR-0039. Companion of `plugin-manifest` catalog entry
  (which describes the manifest schema). This entry is the LOADER + tree
  WALKER. `PluginSkillEntry` is intentionally inert (path only) — couples
  plugin-time and skill-time concerns minimally.
