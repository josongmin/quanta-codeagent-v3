id: plugin-loader
title: loadPluginManifest + discoverPlugins — `.quanta-plugin/plugin.json` loader
section: 6
subsystem: 플러그인 — 매니페스트 로더 + 트리 디스커버리
order: 32
maturity: L4
status: stable
ui_surfaces: [none]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: static
owners: ["@songmin"]
labels: ["surface:core", "tier:1"]
