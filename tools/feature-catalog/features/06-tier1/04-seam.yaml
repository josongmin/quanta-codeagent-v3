knobs: []
deliberate_hold: null
notes: '단위 테스트: inherit literal 보존, effort: 0 보존, 빈 문자열 model → undefined sentinel, ?? fallback 호스트 합성 패턴 검증. 통합 테스트(loop-skill-override): model+effort skill → 다음 turn이 candidate 포트+thinking budget 사용, override 없는 sibling skill이 클리어, override 없는 skill set은 매 turn byte-identical. 잔여 scope: model swap은 config.modelCandidates에 등록된 포트가 있어야 실효 — 후보 레지스트리 미주입 surface에서는 model override가 advisory로 degrade(effort는 항상 실효).'
