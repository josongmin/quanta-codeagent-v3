id: skill-discover
title: discoverSkills — frontmatter + size-cap-guarded skill enumeration
section: 6
subsystem: 스킬 — discovery + size guard
order: 31
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
config_refs:
  env: [QUANTA_SKILLS_DIR]
owners: ["@songmin"]
labels: ["surface:core", "tier:1"]
depends_on: [anthropic-beta-and-skill-size-cap]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 4/4 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure discovery loader + size-cap guard, ui_surfaces n-a, no browser affordance"
purpose: |
  Walk `QUANTA_SKILLS_DIR` (or per-project skills/) and emit `Skill[]` —
  reads each candidate's frontmatter via the lenient `parseFrontmatter`,
  coerces `allowedTools` / `effort` / scalar fields, falls back to first
  non-blank body line for description if not in frontmatter. Size guard
  precedes parse: `checkSkillSize` returns a discriminated `{ok:true,size}`
  vs `{ok:false, reason:"too-large"|"stat-failed", path, size}` — too-large
  is fail-closed (skip + user-actionable log) NOT truncate-and-load (a
  SKILL.md whose frontmatter parses but whose body is cut mid-instruction
  yields a skill the agent BELIEVES is enabled with broken instructions).
  stat-failed is bucketed separately so a host can log filesystem noise
  differently from user-actionable too-large. Discovery proceeds with the
  rest of the directory on any single-file failure.
evidence:
  code:
    - src/skill/discover.ts
    - src/skill/skill-size.ts
    - src/skill/frontmatter.ts
    - src/apps/cli/internal.ts
  adrs: []
  tests:
    unit:
      - tests/unit/skill-discover-errors.test.ts
      - tests/unit/skill-discover-size-cap.test.ts
      - tests/unit/skill-size.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_SKILLS_DIR
    default: 'undefined'
    purpose: '(no description)'
deliberate_hold: null
notes: |
  Size cap 30 MB (`MAX_SKILL_SIZE_BYTES`) absorbed from Claude Desktop 1.7196.3
  ("Skill file is too large. Maximum size is 30 MB."). Companion of
  `anthropic-beta-and-skill-size-cap` (which is the consolidated user-facing
  knob) — this entry documents the discovery-time enforcement seam. Lenient
  parser intentional here (vs strict `skill-frontmatter` for tool whitelist
  schema): discovery tolerates non-standard skill markdown.
