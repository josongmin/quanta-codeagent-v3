deliberate_hold:
  reason: 'Caller-wire is deferred — no surface today calls `defaultBackgroundSubagentScheduler`. Helper-only posture (voice-match ADR-0124 / ADR-0128 / ADR-0125).'
  promotion_path: 'Wire scheduler at apps/agent bootstrap + add a CLI command to fork a side-task; the three tools surface automatically via the tier-1 builder once the scheduler is supplied.'
notes: 'DUCK-TYPED config access in the tier-1 builder: `subagentBackground` is read through a narrow structural assertion so this module stays standalone and can land before the caller-wire PR. Multiple awaits on the same id resolve with the same shared in-flight promise — no double work.'
