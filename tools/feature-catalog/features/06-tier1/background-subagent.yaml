id: background-subagent
title: Background subagent — fork/poll/await detached scheduler (ADR-0130)
section: 6
subsystem: Tier-1 background subagent (Cursor 흡수, ADR-0130)
order: 112
maturity: L4
status: new
purpose: |
  Cursor's `force_background_subagent` + `subagent_await` absorption —
  the SOLE industry pattern for true detached subagent execution.
  Claude Code 2.1 / Codex / v0.dev all run subagents sequentially (parent
  BLOCKS until child returns). quanta's closed-port equivalent: `fork()`
  returns an opaque handle id immediately and the run proceeds in the
  background; `await()` (or `poll()`) harvests the result later. Cancel
  is first-class via per-handle AbortController. Three first-class tools
  (`subagent_fork` / `subagent_poll` / `subagent_await`) registered by
  the `tier1/subagent-bg` builder ONLY when `config.subagentBackground` is
  wired — empty array otherwise so the loop's ToolRegistry stays byte-
  identical (mirrors `buildShadowBlock` posture). `fork` is HITL tier
  `pre-approval-ok` (reversible — caller can cancel or ignore the handle).
  Plane-clean scheduler: imports only `@/subagent` types + `node:crypto`.
