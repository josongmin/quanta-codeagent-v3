notes: |
  Default-OFF — system-skill slice general policy: description-match or
  explicit invoke required; `kind:"system"` filter is router's job. Frontmatter
  `name` in SKILL.md and directory name MUST match (router-drift hellgate).
  Bundle parallels `engineering-skills-bundle` (ADR-0134, engineering-task
  slice) — both are prompt-only with trivial code seams, both honor system-
  wins-on-collision. Slash-command surface for individual skills is a follow-
  up (router-agnostic helpers already exported from each index.ts).
