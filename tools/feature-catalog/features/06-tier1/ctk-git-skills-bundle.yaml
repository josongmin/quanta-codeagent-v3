id: ctk-git-skills-bundle
title: CTK git-task skill bundle — babysit / fix-merge-conflicts / get-pr-comments / loop-on-ci / make-pr-easy-to-review / new-branch-and-pr / pr-review-canvas / review-and-ship (ADR-0102)
section: 6
subsystem: 스킬 — 번들 시스템 스킬 (git-task slice, Cursor CTK Phase AS 흡수 batch)
order: 102
maturity: L4
status: stable
purpose: |
  ADR-0102 Phase AS absorption batch — 8 highest-ROI Cursor CTK git-task
  prompts shipped as bundled system skills. Each skill is SKILL.md (frontmatter
  + body) + a trivial index.ts router seam that mirrors
  `progress-audit/index.ts` (NAME constant + Trigger interface + trigger fn +
  finder over `discoverSystemSkills`), so a future `/babysit`, `/fix-conflicts`,
  `/ship`, etc. slash command can wire through the existing `Skill` tool
  without reaching into the SKILL.md directory layout. Skills covered:

  - `babysit` — shepherd ONE PR from open→merged by reacting to CI failures
    and review comments in a loop (slogan: "merge when green").
  - `fix-merge-conflicts` — resolve conflicts with BUILD-VALIDATED output;
    "resolved" only after the merged tree compiles AND tests pass.
  - `get-pr-comments` — turn a noisy review thread into a ranked, file:line-
    anchored action list without hallucinating reviewer priorities.
  - `loop-on-ci` — fetch failing-check logs, propose a MINIMAL fix per
    iteration, push, wait for re-run; smallest-diff discipline.
  - `make-pr-easy-to-review` — pre-review PR cleanup: detect the four
    canonical review-friction signals (noisy commits, stale description,
    unrelated files, mechanical+logic mix) and propose fixes.
  - `new-branch-and-pr` — end-to-end ship for a NEW change without
    bypassing Git posture rules (branch → stage → commit → push → PR URL).
  - `pr-review-canvas` — review with moved-code DETECTION so a function
    relocation is not misread as "delete + add" (the killer differentiator).
  - `review-and-ship` — composed ship loop: self-review (pr-review-canvas)
    + verify + commit + PR (new-branch-and-pr) in one orchestrated flow.

  Frontmatter standardized across the bundle (router-drift hellgate-enforced):
  `name` matches directory name, `userInvocable: true`, strict `allowedTools`
  (Bash/Read/Grep/Edit subset per skill), lenient `tools` mirror for
  `discoverSkills` runtime enforcement, `category: skill`, `stability: stable`.
  System-wins-on-collision invariant (ADR-0045 pattern) continues so a user-
  supplied skill cannot silently shadow git posture discipline.
