purpose: |
  순수 in-memory capture-and-list primitive. `debug-trace` skill (ADR-0181)이
  생성하는 `{file:line, hypothesis, proposed-fix}` ranked envelope를 typed
  큐에 담아 caller(slash router / planner UI / test rig)가 HUMAN 검토용으로
  drain 할 수 있게 한다.

  **CRITICAL invariant**: 이 큐는 소스 코드를 절대 수정하지 않는다 —
  capture-and-list primitive ONLY. Auto-apply는 별도 슬라이스 (Phase 2)로
  deferred — 세 가지 안전 설계 (verify-guard wire / shadow rewind anchor
  ADR-0118 / retry budget cap)가 묶여야 안전한데, 그 셋을 묶는 건 이 primitive
  의 계약을 흐린다.

  Research grounding: `docs/analysis/경쟁사리뷰/code-agent-loop/cursor.md` —
  Cursor의 "autonomous-feeling" fix 경로는 (a) LSP code action lightbulb
  (USER가 클릭), (b) PR Bugbot 코멘트 (USER가 어떤 걸 action 할지 결정).
  `babysit` skill prose도 *"Carefully validate issues reported by Bugbot
  and only take action on those that are valid"* 명시. Devin류 autonomous
  fix loop도 PR 제안에서 끝나지 직접 push 안 함. 보수적 자세 = 업계 표준.

  ## 표면 (BugFixProposalQueue interface)

  - `capture(p)` — `Omit<BugFixProposal, "id" | "capturedAt">` → id 반환.
    필수 필드 누락 시 `BugFixProposalError` throw (programmer-bug only).
  - `list()` — `ReadonlyArray<BugFixProposal>` newest first. 반환 array는
    `Object.freeze`로 봉인 (callers가 borrowed reference로 corrupt 못 함).
  - `resolve(id)` — boolean (idempotent — 두 번째 호출은 false). 절대 throw 안 함.
  - `clear()` — 전부 drop.

  Opts: `maxEntries` (default 50, min 1), `now` (default `Date.now`),
  `idGen` (default `bf-<8hex>` from `node:crypto.randomBytes(4)`).

  ## Plane-clean imports

  `src/agent/debug-trace-autofix.ts`는 `node:crypto` 하나만 import.
  `@/observability` / `@/tool` / `@/llm` / `@/agent/loop` 전부 차단 — 진짜
  leaf primitive. 소스 수정 경로 없음이 import boundary로 강제됨.
