knobs:
  - name: maxEntries
    default: 50
    note: LRU cap; capture가 초과 시 oldest 자동 drop. min 1 clamp.
  - name: now
    default: Date.now
    note: Inject 시 deterministic capturedAt. Tests에서 핀.
  - name: idGen
    default: "bf-<8hex>"
    note: Inject 시 deterministic id sequence (테스트 byte-identity 보장).
deliberate_hold: null
notes: |
  Default-OFF — 아무도 wire 안 함. `debug-trace` skill은 hypothesis를 model
  output text로 계속 render (기존 동작 무변). future caller (slash router
  `/bug-fix-proposals`, planner UI panel, test rig)가 큐를 construct + skill
  invocation context에 inject로 opt-in.

  ## Phase 2 분리 이유 (세 가지 안전 piece)

  1. **verify-guard wire** — failing scenario를 patch 전후로 실제 run +
     nearest existing test (regression detect). 단순 "다음 turn에 test 도구
     호출"이 아니라 patch boundary에 묶인 verify event.
  2. **shadow rewind anchor** (ADR-0118) — 각 시도 직전 `ShadowOdb` snapshot,
     regression 발견 시 byte-precise rollback.
  3. **retry budget cap** — 동일 에러에 대해 N개 (default 3) hypothesis까지만
     시도; budget 소진 시 큐로 fallback (= 이 슬라이스로 회귀).

  세 piece 모두 이 코드베이스에 미해결 문제 아니지만, 묶으면 1 primitive가
  audit 너무 큼. 따로 ADR (Phase 2 slice) + 따로 hellgate.

  ## Hellgate 13 cases summary

  A. capture (4) — id 포맷, 주입 clock, hypothesis 순서 보존, 필수필드 validation
  B. list (3) — newest first, empty array, FROZEN array (pop/push throw)
  C. resolve (3) — known true, unknown false, idempotent
  D. LRU (2) — cap=3+4captures eviction (evicted id resolve=false),
               injected idGen verbatim
  E. determinism (1) — same captures + same clock + same idGen → byte-identical list()
  + clear() smoke

  Verification: `bun test tests/unit/agent-debug-trace-autofix-hellgate.test.ts`
  → 14 pass / 0 fail / 41 expect() calls.
