purpose: |
  Verifier and selector that bias the speculative branch search toward
  smaller patches. patchSizeVerifier attaches a patch_size signal to each
  candidate using the per-candidate delta from ADR-0116; minimalChangeSelector
  uses that signal as a tie-breaker (then primary ordering when verifier
  scores tie). A plane-clean progress formatter feeds an opt-in onProgress
  adapter so CLIs can stream branch-search traces without coupling the
  orchestrator to a renderer.
