id: skill-audit-log
title: Skill install audit log — append-only JSONL (ADR-0134 §3)
section: 6
subsystem: 스킬 — audit trail
order: 15
maturity: L4
status: new
purpose: 'Append-only JSONL at `<repo>/.quanta/audit/skill-install.log`. 6 event type (admin_install / admin_remove / admin_attempt_disable / banned_install_blocked / policy_load / policy_violation). 각 line은 {ts (ISO 8601), seq (process-monotonic), event, skillName, admin?, user?, scope?, note?}. closed-port: `AuditClock`.now() + `AuditWriter`.append() 모두 injectable. `memoryAuditWriter()` 는 unit test 전용 — `lines: string[]` public buffer. immutability invariant: 절대 delete/rewrite 안 함 (compliance surface). 추가 migration helper `migrateClaudeSkillsToQuanta({homeDir, apply})` 는 dry-run default + conflict skip-not-overwrite.'
