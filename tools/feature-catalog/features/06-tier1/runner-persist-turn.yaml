purpose: |
  CLI REPL `turn` 클로저의 inline save 블록을 surface 무관 슬라이스로 verbatim
  추출. 두 개의 독립 default-OFF 저장 경로를 하나의 진입점으로 묶는다:

    1. `state: string | undefined` (path-mode)
       — `--state <p>` / `QUANTA_STATE_PATH` 세트 시 `saveSession(state, ...)`
       으로 legacy transcript JSON 작성. 미세트 ⇒ no-op.

    2. `idMeta: SessionMeta | undefined` (id-mode)
       — resume FSM 이 id-mode 로 진입 했을 때만 세트. 세트 시 매 turn 후
       `saveSessionById(idMeta, payload)` 로 자동 저장 — `quanta --resume <id>`
       가 별도 `--state` 없이 자체 영구화 되도록.

  두 게이트 모두 OFF ⇒ 함수 전체가 no-op (zero I/O). 새 branch ZERO —
  legacy CLI 블록과 정확히 동일한 두-개-if 모양 보존. `apps/cli/session-io.ts`
  는 본 함수를 re-export 해서 기존 callsite (`repl.ts`, 유닛 테스트) 가 변경
  없이 동일 진입점 도달.

  id-mode 자동저장 의식적으로 silent (slog 미발화) — REPL 안에서 매 turn 마다
  로그가 발생하면 너무 chatty.
