purpose: |
  Closes 3 of 11 ADR-0236 mega-wire deliberate_holds. (A) auto-background
  propose `onAccept` callback wires to `BackgroundSubagentScheduler.fork`
  (user-supplied callback precedence; scheduler absent = graceful noop).
  (B) `AutomationEnginePort.tickScheduler` runs on loop-scoped setInterval
  (default 60s, `tickIntervalMs` knob), invoked on loop start, stopped on
  loop end. (C) `ARCHITECT_NOTICE` / `EDITOR_NOTICE` per-turn splice into
  prompt assembly when mode is architect|editor (Codex parity). All 3
  default-safe — slot absent = byte-identical loop body.
