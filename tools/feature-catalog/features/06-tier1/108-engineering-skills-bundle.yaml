notes: |
  Bundle complement of ADR-0111 (CTK git-skill bundle). Allowed-tool
  whitelist gate (`skill-vs-extension`) means audit-discipline-style
  blocking is per-skill — `add-tests` can mutate (Edit allowed) while
  `explain-code` cannot (Read/Grep/lsp only). Triggers include Korean
  phrases via SKILL.md description.
