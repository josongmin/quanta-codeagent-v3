purpose: |
  ADR-0141 `RenameApplyPort` + `lsp_rename_apply` 도구는 만들어져 있었으나
  RPC/어댑터/등록 3 legs 누락. 이 ADR에서 채움. (1) base.ts에 textDocument/
  rename RPC + toRenameWorkspaceEdit 정규화 — nav RPC + prepareRename
  패턴 미러. applyWorkspaceEdit(2-phase temp+rename atomic, ADR-0152) 재사용.
  (2) default-rename-apply.ts — computeRename → RPC, applyEdit → applyWorkspace
  Edit. (3) lsp-bridge.ts 배선 + `lspNavToolList()` 9 tools 반환 — 이미 있는
  `QUANTA_LSP_TOOLS=full` 게이트 재사용. 미등록 = absent = default-OFF.
