notes: 'isolator는 node_modules 심볼릭 해저드 명시 가드(unlink 링크 먼저, 그 다음 rm). N 하드캡 8(Agentless §6 plateau). winner diff 적용은 호출자 책임 — 오케스트레이터는 부모 워크스페이스 무접촉(negative invariant).'
