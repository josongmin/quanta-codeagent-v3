owners: ["@songmin"]
labels: ["surface:core", "tier:1", "absorbed:codex", "absorbed:cursor", "absorbed:agentless"]
purpose: |
  하드 edit를 N개 후보로 격리 워크스페이스에서 병렬 시도 → 닫힌 Verifier 포트(tsc/test/
  lint/lsp_diag)로 채점 → 순수 Scorer 가중합 + Selector argmax로 winner 선택. 메인 루프는
  winner만 봄(loser는 OTel span + smoke sidecar). 상용 코딩에이전트(cursor/codex/claude)
  메인 루프엔 없는 학계 SOTA(Agentless §3 patch sampling/§4 repro-test). 닫힌 포트
  아키텍처(verifier/scorer/selector/isolator/runCandidate 전부 주입) → 완전 유닛테스트.
  Agentless 4기법 흡수: 온도 다양화·구문 pre-filter·repro-test 선택·혼합모델 voting.
