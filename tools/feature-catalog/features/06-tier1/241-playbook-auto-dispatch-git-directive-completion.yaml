configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "tier:1", "absorbed:aider", "absorbed:codex", "closes:deliberate-hold"]
depends_on: ["user-authored-playbook-frontmatter", "queued-followup-per-msg-mutators", "git-directive-emit-protocol", "git-directive-turn-collector-wire"]
purpose: |
  Closes ADR-0203 inline-trigger dispatch gap + ADR-0221's remaining
  3-of-5 directive kinds. (A) `dispatchPlaybook` canonical sink resolves
  watcher fire → `/play <name>` follow-up enqueue via planQueueSink
  (source="inline_trigger"). Sink-optional: counts observable even
  without queue (graceful). NO-THROW (typed DispatchResult).
  `startPlaybookAutoDispatch` orchestrator default-OFF (enabled !== true
  = immediate return). (B) 3 new git directive hook sites — stage/push/
  create-pr — each 1-line `publishGitDirective` call on success path.
  Closes ADR-0221's 5-kind closed enum end-to-end (collector → emitter
  → host parser). Collector absent = byte-identical pre-wire behavior.
