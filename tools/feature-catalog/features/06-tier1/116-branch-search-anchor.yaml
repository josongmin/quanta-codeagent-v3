id: branch-search-anchor
title: Branch-search × Shadow ODB anchor seam
section: 6
subsystem: Speculative branch search wiring (ADR-0116)
order: 116
maturity: L4
status: stable
purpose: |
  Closed-port BranchSearchAnchor plus a Shadow ODB-backed default
  implementation that lets the branch-search orchestrator snapshot the
  pre-candidate workspace point and compute per-candidate delta diffs without
  touching the user's git history. Shadow ODB gains diffWorkspaceSinceLast for
  this consumer. Assembly-time wiring lives in branch-search-runner so the
  orchestrator stays storage-agnostic.
