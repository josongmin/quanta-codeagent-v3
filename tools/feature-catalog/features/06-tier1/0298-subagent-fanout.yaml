id: subagent-fanout-parallel
title: Subagent fanout parallelization — `agent.isConcurrencySafe = true` + `parallel_worker` flag (ADR-0298)
section: 6
subsystem: Tier-1 subagent fanout via streaming-dispatch barrier
order: 296
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: integrated
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: static
owners: ["@songmin"]
labels: [absorbed:cursor, tier:1, surface:core]
depends_on: [subagent-6-tools, subagent-background-wire, streaming-dispatch]
purpose: |
  Cursor 3.2 `is_parallel_worker:true` 패턴을 흡수하여 단일 assistant 메시지에
  `agent` 도구 호출 N개를 emit 했을 때 streaming-dispatch barrier 가 자동으로
  병렬 dispatch (Phase 1 in-flight overlap) 하도록 `agent.isConcurrencySafe` 를
  `() => false` 에서 `() => true` 로 flip. 자식 subagent 는 별도 conversation
  envelope (own registry record + AbortController + working memory + checkpoint
  path) 이라서 sibling spawn 사이에 공유 mutable state 가 없음 — barrier 가
  보호하는 것은 parent loop 의 race condition 인데, child 의 effect 는 child 의
  own dispatch 안에서 직렬화되므로 parent dispatch 와 직교함. 추가로 Cursor
  의 declarative pattern 을 모방하여 `parallel_worker?: boolean` schema 필드를
  추가 (functional 의미 ZERO — telemetry/HITL 그룹핑 용도). 휴리스틱 아닌 LLM
  의 명시적 선언. 기존 barrier (write/bash 같은 unsafe sibling 에서 engage) 는
  완전히 보존됨 — agent fanout 은 HOL barrier 의미를 약화시키지 않음.
