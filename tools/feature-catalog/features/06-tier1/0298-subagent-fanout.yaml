notes: |
  15-case hellgate seals 5 invariants: (1) declarative surface
  (isConcurrencySafe===true, flag-independent, accepts parallel_worker
  without error, isReadOnly unchanged); (2) streaming-dispatch fanout (3
  spawns start before stream end, wall-clock < serial floor, result ordering
  preserved under reverse completion, onToolStart fires per call); (3)
  barrier interaction (agent × 2 + write → write deferred; write +
  agent × 2 → agents deferred serial); (4) per-call depth + maxDepth +
  unique task_id under concurrent registration; (5) child isolation —
  independent abort signals, flag does not leak into SubagentRequest.
  Mechanism re-uses existing streaming-dispatch.ts (ADR-0072 family) —
  zero mutation to that file, loop.ts, registry.ts, or any permission /
  plan-mode guard. Pre-existing 87-case regression suite (checkpoint,
  cancellation, task-kind, continue-from, 6-tools, streaming-dispatch) all
  pass unchanged. Negative invariant: `agent.isReadOnly()` stays false —
  spawning IS a side effect even when child reads only; plan-mode dispatch
  guards (which read isReadOnly) are NOT bypassed.
