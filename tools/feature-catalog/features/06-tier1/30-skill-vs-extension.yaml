purpose: |
  `SkillFrontmatter.category` is the SSOT for whether an entry is auto-
  triggerable by the model (`skill`) or system-level only (`extension`).
  `classify(fm)` is pure dispatch on `category` and returns `{kind:"skill",
  userInvocable}` or `{kind:"extension", userInvocable:false}` — extensions
  are ALWAYS non-user-invocable; an `extension` declaring `userInvocable:
  true` throws `ToolNotAllowedBySkillError` (Zod accepts the combo but it
  would silently lie about routability — caught loudly at runtime). The
  allowed-tool gate `assertAllowedTool(fm, toolName)` is an EXPLICIT
  whitelist: empty `allowedTools: []` means NO tools permitted — does NOT
  mean "all tools" (Cluster E hard rule "ZERO heuristics"). Host MUST call
  this before dispatching any tool invocation while a skill/extension is
  active. Non-throwing companion `isToolAllowed(fm, toolName)` returns
  boolean for filtering candidate sets without try/catch.
