    contract: []
knobs: [QUANTA_PLAN]
deliberate_hold: null
notes: read-only-set 인버스였다면 신규 read-only mode가 silent write access를 받을 위험 있음. admissibility-gate에서 mutating tool dispatch 차단. . 는 deprecated alias로 backward-compat /--plan
