notes: |
  Two-stage cleanup invariant: unlink-symlink-first then rm-rf-workspace.
  worktreeIsolator requires a git repo; tmpdirIsolator works anywhere.
  Both implement the same `Isolator` port so the orchestrator stays
  storage-agnostic. Symbolic node_modules existence check guards against
  duplicate-link errors when caller re-uses paths.
