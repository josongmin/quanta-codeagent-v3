purpose: |
  Two `Isolator` port implementations for the speculative branch search.
  `tmpdirIsolator` uses `mkdtemp` + `cp -r` excluding `.git` and
  `node_modules`, optionally symlinking the parent `node_modules` so
  `tsc`/`test` resolve deps. `worktreeIsolator` uses `git worktree add`
  per candidate (fast on big repos, shares object store); same
  symlink-safety contract. The HAZARD GUARD is the whole point of this
  file: a naive `rm -rf` over a directory that symlinks `node_modules`
  deletes the real dependency tree (worktree-node-modules-hazard
  incident). BOTH cleanups `unlink` the symlink FIRST (link only, never
  target), THEN remove the workspace — so `rm -rf` cannot follow the
  link into the real node_modules.
