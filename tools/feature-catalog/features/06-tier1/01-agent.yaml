id: agent
title: agent
section: 6
subsystem: 서브에이전트
order: 1
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: partial
modes: [interactive, headless]
configurable: integrated
config_refs:
  env: [QUANTA_SUBAGENT, QUANTA_SUBAGENT_MAX_DEPTH]
owners: ['@songmin']
labels: [surface:core, tier:1]
purpose: |
  `agent` 도구(=Task) — 부모 loop가 자식 runAgent를 fork해 sub-thread로
  실행. 부모는 자식의 `task_output` 채널을 통해 progress를 받고,
  `task_stop`으로 force-cancel을 보낼 수 있다. 활성 자식은 `TaskRegistry`
  에 등록되어 lifecycle / cancellation routing이 한 곳에 모인다. 부모
  safety-posture (mode / verifyGuard / closeoutGuard / hitl)는
  `buildChildConfig`가 자식 config에 옵셔널 spread로 전파한다.
  CLI surface는 `QUANTA_SUBAGENT` 세트 시 `buildSubagentConfigCore` →
  `buildSubagentBlock` 경유로 6 tools(agent/task_output/task_stop +
  subagent_fork/poll/await)를 ToolRegistry에 등록.
