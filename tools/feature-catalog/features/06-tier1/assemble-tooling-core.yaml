notes: |
  Distinct from `assemble-config` (which only composes already-built pieces
  into the immutable `AgentConfig` shape). This builder instantiates the
  registry and aggregates the per-run config dependencies. Slice invariant:
  no `process.env` reads — the CLI shim parses env into the typed
  `ToolingAssembleInput` and calls this.
