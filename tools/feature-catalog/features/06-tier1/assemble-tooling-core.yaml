purpose: |
  Surface-agnostic assembly of the per-run `ToolRegistry` + the aggregated
  `Tooling` record. Substantial logic beyond plumbing:
  (1) Tool-merge order (last-write-wins via `ToolRegistry`'s Map):
      `buildDefaultTools()` → `mcpTools` → memory tools → `lspTools` →
      `lspNavTools` → `gitToolList`. Order is contract — surfaces that splat
      tools in a different order WILL observe different precedence.
  (2) Memory-self-edit gate: memory tools are appended ONLY when both
      `input.store` exists AND `input.memoryConfig?.selfEditTools !== false`.
      Embedder is forwarded only when present (`exactOptionalPropertyTypes`).
  (3) Per-config structured-log gates (1:1 with the prior inline
      `internal.ts#buildTooling` `slog.info(...)` calls): `subagent.on`,
      `skills.on`, `compaction.breaker.config`, `verify.guard.on`. Each fires
      ONLY when its config block is set.
  (4) Optional `onMemoryReady(line)` emission of the legacy human-readable
      `memory on (kind=…, embed=…, session=…)` line — fires only when ALL
      three are present (`store` + `memoryKindLabel` + `onMemoryReady`).
      Decoupled from `@/shared#logger` so non-CLI surfaces can route it.
  When every opt-in array is empty and no config block set, the registry is
  byte-identical to `new ToolRegistry(buildDefaultTools())`.
