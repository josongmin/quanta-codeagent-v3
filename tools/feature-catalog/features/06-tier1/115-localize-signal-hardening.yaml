purpose: |
  Stage-1 candidate generator in the file→function→edit funnel. Replaces flat
  term-count scoring with BM25-lite IDF weighting (rare term outranks common
  one), shared camelCase / snake / kebab / mcp__ subtoken split mirrored from
  the tool-search side, and FrameTier penalty so vendored / generator-dir
  frames cannot outrank user source for the same hit count. R-Phase10 closes
  the recall@1 gap by penalizing stale .js sibling artifacts that mirror .ts
  source and by extending VENDORED_RE to common generator-output directories
  (runs, outputs, coverage, .nyc_output, logs).
