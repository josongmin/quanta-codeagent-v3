id: subagent-persistence
title: Background subagent persistence (cross-restart)
section: 6
subsystem: 서브에이전트 (ADR-0130)
order: 236
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: partial
owners: ["@songmin"]
labels: ["surface:agent", "tier:1"]
purpose: |
  BackgroundSubagentScheduler serialize / hydrate / hydrateWithPrune primitives
  + auto-restore-on-construction (`hydrateFrom` opt). Running entries whose
  Promise can't be reconstructed across restart surface as `status:"failed",
  errorMessage:"lost across restart"` (honest, not silent). Disk-backed helpers
  (`snapshotToFile` / `restoreFromFile`) in sibling `subagent-persistence.ts` +
  `subagent-persistence-store/` (jsonl + hydrating-scheduler).
