owners: ["@songmin"]
labels: ["surface:core", "tier:1"]
depends_on: [skill-registry-precedence, quantaskillsdir, skill-admin-enforcement, skill-audit-log, skill-discover]
purpose: |
  Codex의 7-scope skill registry 패턴 흡수 (R4 발견). 닫힌 union `SkillScope` (7 value) +
  `SkillInstallState` (required/recommended/optional) + 고정 precedence `admin > repo > team >
  user > personal > system > builtIn`. `Skill.scope` 는 frontmatter explicit > path-inferred
  fallback. backward compat 100%: 기존 `~/.claude/skills/` ⇒ user, `<repo>/.quanta/skills/` ⇒ repo
  자동 매핑. Strict frontmatter는 admin scope ⇒ installState=required 자동 backfill +
  모순 (admin+optional) 거부.
