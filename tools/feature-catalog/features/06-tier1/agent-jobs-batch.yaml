id: agent-jobs-batch
title: CSV batch-job runner (`agent_jobs`) — row-indexed fan-out over subagents (ADR-0463)
section: 6
subsystem: Tier-1 batch fan-out — one CSV row = one subagent task
order: 463
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless, batch, daemon, ci-bot]
configurable: static
owners: ["@songmin"]
labels: [absorbed:codex, absorbed:cursor, tier:1, surface:core, default-off]
depends_on: [subagent-6-tools, subagent-fanout-parallel]
purpose: |
  Codex `agent_jobs` + Cursor batch fan-out 2-vendor convergence 흡수. CSV (또는
  row list) 를 subagent 에 fan-out — 한 행 = 한 subagent task. 구조적 결과 수집,
  실패 재시도(job 별 attempt cap), 행별 output-schema 검증(zod), 결과 CSV export.
  Port-free 도메인 로직: `JobStorePort` (jobs/items 영속, no-throw Result, sqlite
  index `(job_id,status,row_index)` 순서 mirror) 와 `RowDispatchPort` (row_json +
  instruction → Result<structured>) 를 INVERT. 실제 subagent runner + sqlite 는
  composition root 에서 주입 — 도메인은 `@/subagent`/`@/storage` 를 import 하지
  않음 (Phase2Summarizer/ClassifierPort 포트-역전 패턴). zod 는 `schema.ts` 단
  하나의 파일만 import (runner 는 컴파일된 validator 만 받음). Codex sqlite 스키마
  (agent_jobs / agent_job_items) 를 도메인 타입에 verbatim mirror. 행이 schema 를
  실패하면 그 행만 `failed` (schema-rejected) — job 전체를 abort 하지 않음. retry
  는 dispatch-failed 만, schema-reject 는 재시도 안 함. bounded pool (poolSize 는
  REQUIRED spec 필드, 매직 상수 아님; DEFAULT_POOL_SIZE=4 는 문서화된 named 상수,
  silent fallback 아님). DEFAULT-OFF: BatchJob 을 명시적으로 submit 할 때만 동작,
  auto-trigger/env-flag/background scheduler 없음.
evidence:
  code:
    - src/agent/batch-jobs/types.ts
    - src/agent/batch-jobs/port.ts
    - src/agent/batch-jobs/csv.ts
    - src/agent/batch-jobs/schema.ts
    - src/agent/batch-jobs/runner.ts
    - src/agent/batch-jobs/index.ts
  adrs: [463]
  tests:
    unit:
      - tests/unit/agent-batch-jobs-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: poolSize
    where: BatchJobSpec.poolSize (src/agent/batch-jobs/types.ts)
    default: "DEFAULT_POOL_SIZE (4) — documented named constant, REQUIRED field (no silent fallback)"
    purpose: max concurrent in-flight subagent dispatches (bounded pool cap)
  - name: maxAttempts
    where: BatchJobSpec.maxAttempts (src/agent/batch-jobs/types.ts)
    default: "REQUIRED field (>=1); attempt 1 + (cap-1) retries before sticky failed"
    purpose: per-item dispatch-failure retry cap
  - name: outputSchemaJson
    where: BatchJobSpec.outputSchemaJson (src/agent/batch-jobs/types.ts)
    default: "OMITTED => no per-row validation"
    purpose: zod-compiled per-row result validator (fail-closed on malformed descriptor)
deliberate_hold:
  reason: |
    Default-OFF seam. NOT wired into apps/agent or apps/cli. InMemoryJobStore
    ships as test fake + ephemeral-job production store; sqlite adapter and the
    real SubagentRunner-backed RowDispatchPort are composition-root follow-ups.
  promotion_path: |
    Composition-root integration TODOs (ADR-0463): (1) sqlite JobStorePort
    adapter mirroring agent_jobs/agent_job_items tables + (job_id,status,
    row_index) index; (2) RowDispatchPort adapter wrapping SubagentRunner
    (parses child final text -> structured value); (3) /agent-jobs CLI surface
    (submit/status/export).
notes: |
  26-case hellgate seals: CSV parse (headers/rows/empty/header-only/
  malformed-ragged Err/non-string Err), happy path (all done + completed/empty
  row list/rowIndex order), schema (reject row failed while siblings done/
  validated value stored/malformed descriptor fail-closed/strict unknown-key
  reject), retry (flaky recovered/exhaustion sticky-failed at cap/partial mix),
  abort (pre-aborted → cancelled/mid-job → cancelled), bounded pool (peak
  in-flight ≤ poolSize over 10 rows), default-OFF (empty store/unknown-job
  no-op), spec validation (poolSize<1/maxAttempts<1/empty name → invalid-spec),
  export CSV (deterministic columns/rows/RFC-4180 escaping/unknown-job Err).
  Negative invariants: runner imports neither @/subagent nor @/storage (both
  inverted); only schema.ts imports zod runtime; schema-reject never aborts job;
  poolSize/maxAttempts required (no magic constant); malformed schema fails
  closed; every port method no-throw Result.
