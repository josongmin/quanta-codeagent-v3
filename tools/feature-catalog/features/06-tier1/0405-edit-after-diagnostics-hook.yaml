id: edit-after-diagnostics-hook
title: Edit-후 LSP diagnostics 자동 주입 hook (ADR-0405)
section: 6
subsystem: Tier-1 — post-edit feedback loop
order: 405
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "tier:1"]
depends_on: [lsp-rename-rpc-and-apply, diagnostics-tool-l5]
config_refs:
  env: ["QUANTA_LSP_DIAGNOSTICS_HOOK"]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 3/3 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "internal prompt-augmentation hook, no UI; only the model context changes, nothing distinct reaches the browser"
purpose: |
  edit/write/apply_patch 같은 mutating 도구 실행 후 LSP diagnostics를
  자동으로 가져와 다음 턴 프롬프트에 inject — 모델이 명시적으로 diagnostics
  도구 호출 안 해도 type/lint 에러 즉시 가시화. dispatch.ts/loop.ts 0줄 변경
  (ADR-0133 promptHook fold + post_tool_use hook + subagentPendingPrompt drain
  메커니즘에 얹기만). per-session LSP client 캐시(ext별 1 session) — N edits
  to same-language files share ONE server. Degrade-gracefully: open() null/
  throw 시 silent skip(LSP failure가 edit turn 망치지 않음).
  Default-OFF: `QUANTA_LSP_DIAGNOSTICS_HOOK=1` + `cfg.hooks` + `cfg.subagent
  PendingPrompt` 셋 다 있어야 켜짐. 셋 중 하나라도 없으면 attach undefined ⇒
  byte-identical 루프.
evidence:
  code:
    - src/agent/lsp-diagnostics-hook.ts
    - src/agent/lsp-bridge.ts
    - src/agent/loop.ts
  adrs: [405]
  tests:
    unit:
