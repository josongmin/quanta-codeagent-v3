    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  TKT-006 follow-up — `apply_patch` matcher 추가됨(`lspDefaultEditTools`에서
  V4A 첫 `*** Update File:` / `*** Add File:` op 헤더 path 추출). Delete/Move
  는 deferred(Delete는 파일 없어진 거라 diagnostics 무의미, Move는 `*** Move
  to:` 줄 처리 필요).
