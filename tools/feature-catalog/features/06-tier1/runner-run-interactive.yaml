notes: |
  surface-가용성 ROI 게이팅 금지(memory surface-model). PromptSource는 닫힌 포트 — CLI
  어댑터(raw-line-reader)는 별 entry로 카탈로그됨. wrapTurn 훅은 default no-op이며,
  surface별 횡단관심사(Esc-Esc cancel, dashboard, REPL-survive)를 부착하는 seam.
