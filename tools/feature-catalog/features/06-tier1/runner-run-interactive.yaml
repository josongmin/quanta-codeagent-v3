purpose: |
  옛 `runInteractive` 단일 helper는 제거됐지만, surface-agnostic REPL driver
  계약 자체는 유지된다. 현재 live path는
  `apps/agent/mode-presets/interactive.ts`의 runtime-SDK preset +
  `apps/cli/repl/prompt-pipeline.ts`의 prompt acquisition/slash routing +
  `apps/cli/repl/turn-runner.ts`의 per-turn abort wrapper +
  `apps/cli/repl/session-loop.ts`의 session loop composition으로 분리돼 있다.
  PromptPayload widening(text+images)은 `runOnce` path와 그대로 호환된다.
