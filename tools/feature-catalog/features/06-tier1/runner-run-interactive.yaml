notes: |
  `runInteractive` symbol은 더 이상 public seam이 아니다. surface-가용성은
  prompt acquisition / turn wrapper / runtime host로 쪼개져 유지된다.
  CLI raw-line-reader는 `prompt-pipeline`, Esc-Esc/Ctrl+C wrapper는 `turn-runner`,
  live preset boundary는 `interactive.runMode`가 owner다.
