id: subagent-6-tools
title: Subagent 6-tool 표준 (exec_command / write_stdin / spawn_agent / wait_agent / close_agent / send_input)
section: 6
subsystem: 서브에이전트 — 표준 도구 계약
order: 12
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "tier:1", "absorbed:codex"]
depends_on: [agent, agent-tool-shape, task-registry, quantasubagent-maxdepth, tier1-subagent-block]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "6-tool frozen dispatch table (dispatch-6.ts) services subagent tool calls in the CLI loop"
    web: "pure tool contract / dispatch table, no browser affordance"
purpose: |
  Codex 통계 흡수: exec_command 75% + write_stdin 24% 지배. 6 tool
  contract-only (input/output Zod strict + success/error discriminator).
  SUBAGENT_6_TOOL_CONTRACTS frozen dispatch table. 신규 tool 추가는 ADR
  개정 필수. Handler는 `handlers-6.ts`, 라우터는 `dispatch-6.ts`. 6 tool 전부
  discriminated union 반환 — 핸들러는 throw 금지 (router도 throw 금지).
  exec_command는 Bun.spawn 직접 사용 (timeout/abort/env-overlay/pty 보관),
  spawn_agent는 SubagentRunner(ADR-0011) + TaskRegistry로 fork +
  capability ownerToken 반환, close_agent는 token-gated stop OR host-authority
  forceStop, send_input은 InputChannelRegistry one-shot 채널로 paused child
  에게 conversational input 전달. PTY 보관은 MAX_PTY=32 cap.
evidence:
  code:
    - src/subagent/tools-6.ts
    - src/subagent/handlers-6.ts
    - src/subagent/dispatch-6.ts
    - src/subagent/registry.ts
    - src/subagent/index.ts
  adrs: [41, 426]
  tests:
    unit:
      - tests/unit/subagent-tools-6-contracts.test.ts
      - tests/unit/subagent-6-tools-hellgate.test.ts
      - tests/unit/subagent.test.ts
    integration: []
    contract: []
knobs:
  - name: MAX_PTY
    default: 'undefined'
    purpose: 'handlers-6: PTY 동시 보관 상한 (default 32, OOM/leak guard)'
deliberate_hold: null
notes: |
  L4 완료 (2026-05-23): 6 handler + router 구현. closed 6-set. error.cause는
  free-form hint string (timeout/signal:.../abort/spawn_error/pty_cap/
  id_unknown/not_running/not_paused/denied/depth_exceeded/unknown_tool/
  input_invalid/deps_missing 등). 핸들러는 throw 금지. SOTA(Codex
  terminalManager): PtyTable.snapshot()이 getSnapshot 대응 (turn checkpoint),
  pid keyed createOrAttach idempotent (재spawn 없이 PTY 재사용). spawn_agent는
  capability ownerToken 반환 — close_agent에서 검증. send_input은
  one-shot InputChannelRegistry — 호스트가 child의 pause 시점에 등록 →
  send_input 호출 시 deliver + clear. 44 hellgate + 144 expects 커버:
  bad cwd / write_stdin pid_unknown / wait_agent timeout / close idempotent /
  spawn-then-immediate-close / concurrent write_stdin / settle-vs-close
  race / PTY signal forwarding (abort) / PTY cap / send_input to unknown /
  router unknown_tool + input_invalid + deps_missing / E2E mosaic 모두 통과.
