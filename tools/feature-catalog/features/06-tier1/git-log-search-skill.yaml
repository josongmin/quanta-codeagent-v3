purpose: |
  사용자가 "when did X get added"/"who wrote this"/"find commits matching Y"/
  "code archaeology"/"git history search"라고 물을 때 git 히스토리를 4개 검색
  모드(pickaxe `-S` / regex `-G` / author / since+path) + ADR-0105 env-hygiene
  quartet (GIT_OPTIONAL_LOCKS=0 / GIT_PAGER=cat / GIT_TERMINAL_PROMPT=0 /
  LC_ALL=C) + US-separator pretty-format (`%H\x1f%an\x1f%ai\x1f%s`)으로 안전하게
  탐사하는 시스템 스킬.

  Research grounding: Cursor는 `blame_by_file_path`는 atomic tool로 노출하지만
  pickaxe/regex/author/since 같은 git **검색** 워크플로는 CTK 스킬에 두고 `gh`/
  `git` shell로 실행한다 (`docs/analysis/경쟁사리뷰/code-agent-loop/cursor-git.md`
  §⑤ + §⑧). Tool = 원자적 single-shot, Skill = 사용자가 query를 좁히며 반복
  iterate 하는 narrative 워크플로 — exploratory git search는 후자가 옳다.

  본 스킬은 src/tool/git/*에 어떤 도구도 추가하지 않는다. `Bash` + `Read`만
  allowedTools로 선언해 progressive disclosure (SKILL.md 본문이 정확한 명령
  shape를 가르치되, 실행은 모델이 매 turn에 사용자 의도에 맞춰 합성)를
  강제. `GIT_LOG_SEARCH_SKILL_NAME` + `triggerGitLogSearch()` 헬퍼를 노출하므로
  slash router(`/git-log-search`)가 router-agnostic하게 wire 가능 — ADR-0045
  progress-audit seam pattern과 동일.
