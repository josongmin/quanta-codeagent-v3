notes: |
  Default-OFF — system-skill slice 일반 정책: description 매칭 또는 명시
  invoke만 활성. System-wins-on-collision 보호 (user-supplied "git-log-search"
  스킬이 shadow 못 함). ADR-0105 env-hygiene quartet과 US-separator format은
  hellgate (HELL-5)에서 verbatim 검사 — drift 차단. Tool 형태로 만들 수 없는
  이유: (1) "smart router"가 pickaxe vs regex 자동 선택 시 정규식 collision
  (e.g. `-S".+"`는 거의 모든 commit 매치 → flood), (2) `-n 50` cap을 모델이
  user query에 맞춰 조정해야 함, (3) `git show <sha>` follow-up은 결과
  컨텍스트(top 5 vs top 10 vs none)에 따라 모델 판단 — 모두 atomic tool 계약
  바깥. CTK git-skill bundle (ADR-0111) sibling — 같은 layout/seam 패턴.
