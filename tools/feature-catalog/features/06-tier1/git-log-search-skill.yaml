id: git-log-search-skill
title: git-log-search 시스템 스킬 — pickaxe/regex/author/since 검색 (ADR-0172)
section: 6
subsystem: 스킬 — 번들 시스템 스킬 (git 히스토리 탐사, Cursor CTK §⑧ 패턴 흡수)
order: 172
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
