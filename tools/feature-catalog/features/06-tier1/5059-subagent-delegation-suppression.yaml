purpose: |
  Single-agent-first delegation default (Codex multi_agent_v2 absorption +
  Google 180-config evidence: multi-agent regresses sequential reasoning
  39–70%). One SSOT policy atom (@/shared/delegation-policy) is projected onto
  EVERY spawn/delegation surface — the trio `agent`, the 6-tool `spawn_agent`,
  `spawn_batch`, and `spawn_agents_on_csv` — so the model is told to complete
  the task itself unless delegation is EXPLICITLY authorized (depth/thoroughness/
  research do NOT count) and the work is structurally parallel (disjoint write
  sets, explicit parent synthesis, wall-time benefit > coordination cost).
  Knob-gated opt-in measurement arm (QUANTA_SUBAGENT_DELEGATE_SUPPRESS,
  default-OFF ⇒ byte-identical fan-out-biased prompt); flip to default-ON only
  after the eval-corpus A/B holds.
