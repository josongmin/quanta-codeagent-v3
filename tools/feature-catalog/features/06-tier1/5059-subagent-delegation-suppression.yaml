knobs: ["QUANTA_SUBAGENT_DELEGATE_SUPPRESS"]
deliberate_hold: null
notes: |
  SSOT lives in @/shared (neutral leaf) so @/subagent, @/tool, and @/agent can
  all project the SAME atom without a slice-boundary violation. Enablement is
  resolved from runtimeConfig().subagentDelegateSuppress (knob registered in
  runtime-config-knobs/knobs-a.ts + the default-off completeness guard). COMPLETE:
  all FOUR spawn tool descriptions AND the system-prompt tool-routing fan-out line
  are gated under the one knob. The prompt line uses a `hasDelegationSuppress`
  facet (two mutually-exclusive variants of the same atomId); bodyRenderCtx reads
  the session-constant knob so the static-per-session prefix stays byte-stable
  (ADR-0003). Default-OFF byte-identical; ON swaps the unconditional fan-out
  guidance for an authorization-conditioned one — proven against the real
  buildSystemPrompt (not just synthetic render). No A/B confound.
