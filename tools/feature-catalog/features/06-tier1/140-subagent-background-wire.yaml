notes: |
  6-case hellgate seals: barrel re-export + slot type + Pick type +
  default-off + on + same-instance identity. Duck-typed cast in
  subagent-bg.ts left for byte-identical guarantee (the cast is now
  redundant but removing it would re-arrange the diff). Sibling closure
  to ADR-0119 (shadow_rewind wire) and ADR-0118 (shadow rewind port).
