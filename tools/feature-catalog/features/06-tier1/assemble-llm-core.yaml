notes: |
  ID disambiguates from the existing `llm-assemble` (which is the STREAM
  assembler `assembleFromEvents` for fold-rules / phase tagging). This one is
  the COLLABORATOR assembly. Sub-feature of `runner-assemble-builders`
  umbrella, individuated because 122 LOC carries 3 distinct factory cores +
  the auto-mode classifier port wiring + the fallback-stack composition rule.
