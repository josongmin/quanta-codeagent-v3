owners: ["@songmin"]
labels: ["surface:core", "tier:1"]
depends_on: [subagent-background-wire, background-subagent]
purpose: |
  Per-subsystem Tier-1 builder that materializes the SUBAGENT block — the
  `agent` / `task_output` / `task_stop` tool trio plus the cleanup hook —
  off a single `config.subagent` field. Returns `undefined` when absent for
  byte-identical default-OFF (RFC §1.2). Distinct from plumbing:
  (1) Mints a `SubagentRunner` via `createSubagentRunner(config, {maxDepth})`
      with optional `maxDepth` from `config.subagent.maxDepth`.
  (2) Wires all THREE tools against the SAME `TaskRegistry` instance —
      `createAgentTool` mints (or accepts via `config.subagent.taskRegistry`)
      a registry and re-exposes it as `.registry`, which is then threaded
      into `createTaskOutputTool` and `createTaskStopTool` so all three tools
      observe / mutate the same background-task store.
  (3) Returns a `cleanup` hook that, on session shutdown, queries
      `reg.pendingIds()` and force-stops every in-flight task. Uses
      `forceStop` (not the token-gated `stop`) because the session owner has
      authority over all pending tasks regardless of who minted them — S17
      invariant. Awaits all `waitForSettle()` in parallel; idempotent for the
      empty-pending case.
