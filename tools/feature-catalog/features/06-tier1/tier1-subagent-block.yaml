id: tier1-subagent-block
title: buildSubagentBlock — shared TaskRegistry trio + force-stop cleanup
section: 6
subsystem: Tier-1 builder (subagent block)
order: 221
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: integrated
config_refs:
