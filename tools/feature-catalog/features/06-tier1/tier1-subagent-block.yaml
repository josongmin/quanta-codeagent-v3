notes: |
  Sibling of `background-subagent` (130) and `subagent-background-wire` (140):
  this one is the FOREGROUND trio; those land the BACKGROUND tools. Surface
  (CLI lifecycle pills) can pass its own `TaskRegistry` so it keeps a live
  reference for pendingIds() rendering; default mints a fresh one with
  byte-identical behaviour. Cleanup-via-forceStop is the host-side authority
  contract — distinct from the LLM-facing token-gated `stop` tool.
