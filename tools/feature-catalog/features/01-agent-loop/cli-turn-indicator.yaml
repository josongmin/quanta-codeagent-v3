notes: |
  StreamPort tee — 기존 어댑터(stdout/jsonl-recorder)와 fan-out으로 병렬 동작, 본체 코드
  무수정(negative invariant). TTY 자동 OFF는 hard rule — 비대화형 환경에서 ANSI escape
  오염 방지. token counter는 stream event accumulator만 사용 — 모델 호출 추가 없음.
