purpose: |
  LLM 대기 중 spinner + elapsed seconds + live token counter(input/output 누적) 표시.
  StreamPort tee 패턴으로 구현 — streaming-dispatch 본체 무수정, 새 StreamPort 어댑터가
  기존 어댑터와 fan-out으로 병렬 소비한다. TTY 미감지 시 자동 OFF(파이프/redirect 시
  spinner 출력 방지). default-OFF env knob 뒤.
