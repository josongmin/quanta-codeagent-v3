notes: 'L4: loop→stream wire landed (in_progress AgentEvent round-trips end-to-end). Remaining scope is the OpenAI-Responses-direct wire parser (decodeSseEvent/decodeWsEvent) staying off the hot path until that adapter lands — the Anthropic SDK keeps its own SSE parser; until then the heartbeat is sourced from the existing StreamEvent path. That parser work does not block the loop seam, which is fully exercised here.'
