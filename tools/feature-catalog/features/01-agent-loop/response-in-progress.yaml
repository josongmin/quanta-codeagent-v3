id: response-in-progress
title: response.in_progress streaming event
section: 1
subsystem: Streaming envelope (ADR-0048)
order: 48
maturity: L3
status: new
purpose: Ingest OpenAI Responses API v2 `response.in_progress` event so UI can show 'thinking' indicator without dropping events. Closes Codex Desktop build 2867 forward-compat gap (Codex silent-drops this event). Provides SSE/WS wire-level parser (parseSseFrame / splitSseFrames / decodeSseEvent / decodeWsEvent) with fragmented-frame, CRLF, multi-line data, BOM, rate-limited unknown-event handling. Adds StreamEvent variant `response_in_progress` (assembler skips it — non-cumulative heartbeat) and an additive `onInProgress` seam on streaming-dispatch (`InProgressIndicator { kind, message?, progress?, timestamp }`).
evidence:
  code:
    - src/llm/streaming-events.ts
    - src/llm/types.ts
    - src/llm/index.ts
    - src/llm/assemble.ts
    - src/agent/streaming-dispatch.ts
  adrs: [48]
  tests:
    unit:
      - tests/unit/streaming-events-in-progress.test.ts
    integration:
      - tests/integration/streaming-dispatch-in-progress-e2e.test.ts
    contract: []
knobs: []
deliberate_hold:
  reason: Wire-level parser is not yet on the hot path — Anthropic SDK keeps its own SSE parser, and the OpenAI Responses API wire integration is a follow-up phase. The module is callable standalone today and is fully exercised by unit/integration tests.
  promotion_path: When an OpenAI-Responses-direct adapter lands, route its SSE/WS frames through decodeSseEvent/decodeWsEvent and emit `response_in_progress` StreamEvents into the existing streaming-dispatch path.
notes: ''
