id: ide-context-provider-seam
title: IDE context provider seam (ADR-0080)
section: 1
subsystem: 턴 라이프사이클 — host→agent IDE 신호 (Tier-1 IDE host enablement)
order: 80
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: integrated
telemetry_keys: ["gen_ai.response.time_to_first_token_ms", "quanta.conversation.id"]
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: [surface:core, tier:1]
depends_on: [agent-types-split, plan-mode, mode-repo-rules-active-skills-working-state-memory-hints, build-turn-context, secret-redaction-content-plane]
config_refs:
  env: ["QUANTA_BENCH_LOCALIZE_PHASE", "QUANTA_CAP_ENFORCE"]
purpose: |
  IDE host (VS Code extension, MCP IDE bridge 등) 가 turn-by-turn 에디터 상태를
  모델에 보낼 수 있는 단일 진입점. 신규 `src/agent/ide-context.ts` 의 닫힌 shape
  `IdeSnapshot` (activeFile/openTabs/selection/diagnostics, 모든 필드 optional)
  + `IdeContextProvider.snapshot(signal)` 포트. `AgentConfig.ideContextProvider`
  미설정 ⇒ 루프는 provider를 호출하지 않고 buildTurnContext spread에서 키 자체가
  생략되어 렌더링 경로 미도달 ⇒ byte-identical 레거시 (RFC §1.2 default-OFF).
  설정 ⇒ runAgentInner 턴 진입부에서 ONCE 캡처 (same-turn retry는 동일 스냅샷
  재사용) → `renderIdeContext` 가 deterministic `<ide-context>` 블록 생성
  (sections 는 해당 필드 present일 때만) → buildTurnContext가 마지막 user 메시지의
  첫 text block 앞에 prepend (호출자 baseMessages는 mutate 안 함, 얕은 복사 슬롯
  교체). 트레일링 `<system-reminder>` 보다 앞 (user-side trust attribution).
  모든 사용자-공급 fragment (paths, selection text, diagnostic messages, tab paths)
  는 기존 `escapeReminderBoundary` 통과 — `</system-reminder>` 위조 차단.
  Provider 가 throw/reject ⇒ `stream.emit({type:"error", message:"ide-context
  provider failed: …"})` + ideSnapshot=null 로 graceful degrade (boundary, NOT
  fallback). Provider 가 `null` 반환 ⇒ "IDE 미연결" 닫힌 신호 ⇒ 블록 미렌더.
  L4 promotion 2026-05-23 — Cursor SOTA(`injectedContext` vs `predictedContext`
  dual-tier + metadata-only persistence + relative-path scrubbing) 흡수:
   - `FileSystemIdeContextProvider`: `.quanta/ide-context.json` 을 매 턴 fresh
     read 하는 in-repo concrete wire 경로 (cwd 기준 절대→상대 path 정규화 +
     malformed JSON ⇒ typed throw + pre-aborted signal ⇒ no read).
   - `IdeContextMetadata` + `toMetadataSnapshot` + `IdeContextMetadataSink`:
     content-free projection (selection.text → textLength, diagnostics.message
     → messageLength, 절대 경로 → 상대 경로). 호스트가 sink 를 trajectory
     recorder 에 연결하면 jsonl envelope 에 metadata-only 로 영속 (file 내용
     절대 미저장 — Cursor `usedCurrentFile{relativeFilePath}` 패턴).
   - `IdeContextTier = "injected" | "predicted"` provenance — 현재 concrete
     provider 는 `injected` 만 사용, predicted 슬롯은 향후 heuristic 랭킹용
     예약 (Cursor `predictedContext` 와 매핑).
   - Sink 가 throw 해도 provider 가 boundary 에서 흡수 (loop catch 와 동일
     세만틱) — sink 버그가 턴을 죽이지 않음.
