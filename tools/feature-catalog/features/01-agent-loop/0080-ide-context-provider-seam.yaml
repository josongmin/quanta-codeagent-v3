knobs:
  - "AgentConfig.ideContextProvider: IdeContextProvider | undefined (default undefined) — undefined ⇒ provider 미호출, `<ide-context>` 미렌더, byte-identical 레거시. 설정 ⇒ 매 턴 진입 시 `snapshot(cfg.signal)` 1회 호출하여 렌더링."
  - "FileSystemIdeContextProvider.contextFile: string (default `<cwd>/.quanta/ide-context.json`) — JSON 파일 경로 오버라이드 (rename-after-write 안전)."
  - "FileSystemIdeContextProvider.metadataSink: (md: IdeContextMetadata) => void (default undefined) — content-free metadata 영속 sink. undefined ⇒ render-only (no persistence)."
deliberate_hold: null
notes: |
  In-repo L4 (concrete provider + metadata-only persistence + relative-path
  scrub) 완료 2026-05-23. 실제 VS Code extension / MCP IDE bridge / Tauri
  sidecar 구현체는 surface 별로 별도 PR (외부 host 어댑터가
  FileSystemIdeContextProvider 를 모델로 wire 하거나 직접 IdeContextProvider
  를 implement 한다). subagent runner 는 IDE provider 를 자동 상속시키지 않음
  (의도적 — subagent 는 격리된 sub-conversation).

  Negative invariants (실효 강제):
   - IDE 상태를 `<system-reminder>` 안에 넣지 말 것 (trust boundary).
   - Provider 부재 시 IDE 블록 추정 금지 (no heuristic).
   - `IdeSnapshot` shape 에 임의 키 추가 금지 (closed shape).
   - Same-turn retry 마다 `snapshot()` 재호출 금지 (한 턴 = 한 스냅샷).
   - Metadata 에 selection.text / diagnostic.message / open-tab 본문 절대 포함 금지
     (content-free persistence — 영속 trajectory 의 privacy 계약).
   - 절대 경로를 모델 컨텍스트에 노출하지 말 것 (host-absolute path 누출 방지).
