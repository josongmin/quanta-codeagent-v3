knobs: []
deliberate_hold: null
notes: |
  Modernizes the mid-turn UX gap left by sibling agents that either freeze the
  UI or simply prepend follow-ups to the next prompt without context. The
  12-field FollowUp envelope is the portable piece — actual UX is host-side.
