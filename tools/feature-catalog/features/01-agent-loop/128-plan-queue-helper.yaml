id: plan-queue-helper
title: Plan-queue — typed mid-turn follow-up primitive
section: 1
subsystem: Mid-turn follow-up queue (ADR-0128)
order: 128
maturity: L3
status: new
purpose: |
  Typed primitive that lets a host accept user input while a turn is in flight
  and dispatch the queued items on the next turn boundary. Captures FollowUp
  context (pausedReason / arrivedDuringTurn / source / …) so a replayer can
  judge staleness. Pure helper — wiring into loop dispatch is left to the host
  per the helper-only deferred-wire idiom.
