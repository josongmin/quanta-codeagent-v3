purpose: |
  Codex base prompt (L26/L213-214/L217/L471) + Claude Code 1.7196.3 systemPromptSectionCache
  side-by-side 감사로 식별한 4개 갭을 닫음. (1) Internal-vocabulary 차폐 — turn_id / runtime /
  HARD_DENY / ADR-XXXX 등 호스트 내부 토큰을 사용자에게 노출 금지(라이브 REPL 누출 인시던트).
  (2) User-intent discipline — 명세 부족이라도 먼저 충족 시도 후에만 질문 (Codex L213-214 verbatim).
  (3) Verification-claim ladder — "fixed"/"works"/"완료"/"green" 같은 success word 사용 시 명령
  + exit code + 인용 라인 의무화, 아니면 "I did not run X"로 평서. (4) Production code conduct —
  no silent fallback / no test skipping / no shortcut hacks. 4 섹션은 buildSystemPrompt() 출력의
  고정 위치에 삽입되어 모든 persona/effort tier에서 합성 보장.
