id: conversation-action-steering
title: ConversationAction — typed mid-turn user action oneof (5-arm)
section: 1
subsystem: 미드턴 스티어링 — 타입드 액션 대수 (Cursor 흡수, ADR-0071)
order: 71
maturity: L4
status: stable
purpose: |
  Cursor ConversationAction oneof 흡수 — 기존 단일 free-text SteerRequest 위에 5-arm 타입드
  액션 레이어를 PURE + ADDITIVE + DEFAULT-OFF로 적층. ConversationAction = user_message{prepend[]}
  / cancel{reason} / cancel_subagent{subagent_id} / summarize / resume. 핵심 신규 능력은
  **cancel_subagent** — 부모 턴을 unwind하지 않고 자식 subagent 하나만 취소 (기존 cancel은 항상
  턴 전체 unwind). ActionOutcome = accepted_injection{injection} | accepted_control{action} |
  rejected{reason, rejectedAt}. ActionRejectionReason은 SteerRejectionReason 재사용 +
  control_turn_mismatch + not_interrupted + unknown_subagent. ControlExpectation.expectedTurnId
  opt-in optimistic-concurrency. decideAction은 caller-supplied clock으로 Date.now() 미호출
  (ADR-0030 미러). steer()는 user_message 경로의 정식 구현으로 byte-identical 유지.
