id: prompt-history-multiline
title: prompt history + reverse-i-search + heredoc multiline
section: 1
subsystem: REPL 입력 UX (history/multiline)
order: 114
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
config_refs:
  env: [QUANTA_HISTORY, QUANTA_HISTORY_FILE, QUANTA_HISTORY_MAX, QUANTA_MULTILINE]
owners: ["@songmin"]
labels: [surface:core, tier:core]
ui_surfaces: [cli]
configurable: partial
config_refs:
  env: ["QUANTA_HISTORY"]
purpose: |
  REPL 입력 UX 강화 — bash 스타일 ↑/↓ history navigation + Ctrl+R reverse-i-search +
  heredoc 멀티라인 입력. history는 disk-persistent(파일 경로 env override). multiline은
  heredoc 종료 토큰까지 누적 후 한 번에 PromptPayload로 제출. raw-line-reader 통합 —
  CLI 어댑터에서만 활성, headless/Web surface는 영향 없음. 모든 동작은 default-OFF env
  knob 뒤.
evidence:
  code:
    - src/apps/cli/prompt-history.ts
    - src/apps/cli/raw-line-reader.ts
  adrs: []
  tests:
    unit:
      - tests/unit/apps/cli/prompt-history.test.ts
      - tests/unit/apps/cli/raw-line-reader-history.test.ts
      - tests/unit/apps/cli/raw-line-reader-multiline.test.ts
    integration: []
    contract: []
knobs:
  - QUANTA_HISTORY
  - QUANTA_HISTORY_FILE
  - QUANTA_HISTORY_MAX
  - QUANTA_MULTILINE
deliberate_hold: null
notes: |
  QUANTA_HISTORY_MAX로 파일 size cap(무한 증식 방지). reverse-i-search는 in-memory
  index 위에서만 동작 — 별도 영속 자료구조 없음. heredoc 종료 토큰 매칭은 line-exact
  (mid-line match는 무시) — Shell convention과 동일.
