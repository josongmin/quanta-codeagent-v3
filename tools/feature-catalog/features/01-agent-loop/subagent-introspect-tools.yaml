notes: |
  Reuses TaskRegistry list()/get() (registry mutate 0) + MailboxPort send
  (followup does NOT replace the mailbox — N1). TurnWakeRegistry is a sibling of
  InputChannelRegistry; the one-shot/paused vs persistent/busy distinction is
  intentional. Frozen contracts (registry.ts, tools-6.ts schemas, handlers-6
  schemas) untouched; new state isolated in side-ports (AgentMetaRegistry,
  TurnWakeRegistry). agentMeta is an additive optional dep on
  SpawnAgentDeps/Subagent6Deps — no-op when unwired (byte-identical spawn path).
  2026-06-02 follow-up — dead-seam CLOSED: QUANTA_SUBAGENT_INTROSPECT=on and
  QUANTA_SUBAGENT_FOLLOWUP=on now set the gates AND wire the dependency ports
  (AgentMetaRegistry / shared TurnWakeRegistry / mailbox) at the composition
  root (wireOptionalAgentPorts). The shared TurnWakeRegistry is what the runner
  registers per-child wakers into, so followup_task against a running child
  reports triggered (not no_waker). Default-OFF unchanged.
