deliberate_hold: null
notes: |
  Pure-text slice — no `@/llm`, no `@/tool`, no `@/apps`. R-ENV / R-STOP-ENV
  ordering is load-bearing (model reads top-down). The 7-rule CORE list is
  the rename-resistant safety contract; mode packs APPEND additional rules
  (R-SINGLE-COHERENT / R-NO-EXPLORE-OVER-EDIT / R-SMALL-DIFF / R-EXPLAIN-IN-
  PR / R-NO-PUSH-MAIN). Re-export of `AgentMode` from the run-mode slice is
  the SSOT migration site — the pack registry and the matrix can never drift.
