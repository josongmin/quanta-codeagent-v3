purpose: |
  6 verbatim CORE_RULES (R-ENV / R-STOP-ENV / R-SEARCH-FIRST / R-READ-FAILURE
  / R-NO-THRASH / R-NO-SHIM / R-FAILURE-MODE) + 4 mode-specific packs
  (assistant / task-runner / benchmark / pr-agent). Stable `[R-…]` IDs are
  inline in the rendered text so anti-regression tests pin them across
  text-content drift. `renderPackByMode(mode)` exhaustive switch over
  `AgentMode` — the 6-mode SSOT `@/agent/run-mode/types` provides the union,
  so adding a mode is a compile error here until a pack is chosen.
  Operator-mutable rules are intentionally NOT supported (a host silently
  dropping R-ENV would be a regression). `renderToolUseRules()` legacy entry
  returns the assistant pack byte-identical so the cached system-prompt
  prefix for interactive sessions never shifts. ide/daemon (ADR-0092 C1)
  reuse assistant/task-runner packs via the promptPack lever.
