id: tool-failure-exploration-ladder
title: Tool-failure ladder + multi-step exploration prompt rules
section: 1
subsystem: 시스템 프롬프트 — 도구 실패 회복 + 분석 multi-step (Codex SKILL.md 흡수, ADR-0062)
order: 68
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: [absorbed:codex, surface:core, tier:1]
depends_on: [mode-repo-rules-active-skills-working-state-memory-hints, build-turn-context, fallback-kinds-policy, llm-factory, loadreporules-cwd]
purpose: |
  라이브 REPL replay에서 발견한 두 결함을 시스템 프롬프트 규칙으로 봉합 — (1) 단일 도구 cap
  메시지("+292 deeper, increase max_depth", "raise max_files", "result truncated")를 능력
  경계로 오해해 "I can't"로 surrender, (2) "분석해줘"/"요약" 같은 분석 프롬프트에 1-tool로 응답
  + 사용자에게 narrow-down 요청. prompt.ts에 "Tool failures & exploration" 섹션 추가:
  cap-hint는 instruction이지 boundary 아님 / 2회 NON-CAP 실패 시 도구 자체를 스왑
  (file_tree_summary→glob→ls→read ladder) / 분석 태스크는 ORIENT→NARROW→CONFIRM 3-step
  multi-tool BY DEFAULT / narrow를 사용자에게 위임 금지 / FS-jail은 absolute path 단일 해법.
