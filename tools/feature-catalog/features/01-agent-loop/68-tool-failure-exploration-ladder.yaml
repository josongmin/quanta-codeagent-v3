notes: 'prompt-only intervention (코드 경로 변경 없음). loop/도구 실행 의미는 무변경 — 모델 행동만 가이드. 후속: cap-hint 자동 재시도 또는 ladder 자동 진행은 별도 흡수에서 다룸.'
