id: harness-provenance-on-message
title: "Harness provenance lives on the message (`Message.origin`), not inside its id"
section: 1
subsystem: Agent loop — harness speech attribution
order: 701
maturity: L4
status: new
ui_surfaces: [cli, web]
monitoring: n-a
modes: [interactive, headless]
configurable: n-a
owners: ["@songmin"]
labels: [correctness, surface:core, tier:core, absorbed:grok-build]
depends_on: []
surface_integration:
  cli: full
  web: full
  method: audited
  verified: "2026-08-24"
  evidence:
    cli: "compaction summaries, /rewind targets and memory recall all read `isSyntheticUserMessage`"
    web: "same persisted transcript; the field is local-only and never reaches a provider"
purpose: |
  `makeSyntheticUserMessage` marked harness-authored `role:"user"` messages by encoding
  the kind INTO the id (`quanta:synthetic-user:<kind>:<uuid>`). That works only for
  messages the harness both authors AND gives an id to.

  The compaction summaries are neither. All three summary sites built the message
  inline — the local variable was literally named `synthetic` — with no id and no
  marker. So the harness's own output re-entered the transcript indistinguishable from
  human speech, and the consequence was self-inflicted: THE NEXT COMPACTION SUMMARIZED
  THE PREVIOUS SUMMARY AS IF THE USER HAD WRITTEN IT. `SUMMARY_SYSTEM` tells the
  summarizer to preserve "constraints the user stated… verbatim", so a synthesized
  summary could be canonized as a user constraint. `/rewind` offered it as a turn to
  undo; memory recall anchored on it.

  `id` is now IDENTITY and `origin` is PROVENANCE. `makeSyntheticUserMessage` sets both;
  `isSyntheticUserMessage` reads `origin` first with the id prefix as the LEGACY
  fallback, so sessions written before this change keep working. The three inline
  constructions collapse into one builder — three constructions were three chances to
  forget the marker.

  WIRE PURITY is structural, not conventional: the codecs map `role` + `content` only,
  so `origin` is unreachable from a provider payload. Pinned by a test on the built
  Anthropic request.
