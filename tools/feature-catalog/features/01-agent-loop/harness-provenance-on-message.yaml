notes: |
  ZERO FALSE POSITIVES is the load-bearing control. Mislabelling human speech as harness
  output would silently drop the user's own words from recall and from the summary's
  "preserve verbatim" instruction — a WORSE failure than the one being fixed. The paired
  controls assert a genuine user message carries no provenance, including one whose text
  merely MENTIONS a summary header.

  `origin` is deliberately a single literal (`"harness"`), not the full
  `SyntheticUserMessageKind`. The kind still lives in the id for producers that mint one;
  nothing downstream branches on kind today, and a wider local field would be
  shipped-but-unread.

  The builder lives in `compaction/harness-speech.ts`, not `compaction.ts`: that file
  sits just under the 1000-line god-module ceiling and adding the builder there pushed
  it to 1004.
