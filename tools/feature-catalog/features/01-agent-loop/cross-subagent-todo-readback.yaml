purpose: |
  Roo absorption — bidirectional extension of ADR-0219 focus chain. Where
  ADR-0219 only re-injects parent todos every N turns (one-way, single
  session), this slice lets any session snapshot another session's todos
  and lets a child session write updates that the host explicitly
  propagates back to the parent. MVP scope: readback port + parent-child
  propagation. Surface: snapshotFor(sessionId) → frozen TodoSnapshot,
  updateFrom(sessionId, partial) → Result, subscribe(sessionId, cb,
  opts?) → Subscription, propagate(child, parent), link(parent, child).
  TodoItem.status uses underscore arm (pending|in_progress|completed)
  matching Roo wire format — intentionally distinct from ADR-0219's
  FocusTodo (hyphen arm). Parent isolation invariant: child updates
  NEVER auto-mirror; host calls propagate at safe seams (turn boundary
  / subagent close-out). Default-OFF: loop never constructs a store;
  byte-identical when absent. Map-backed in-memory; monotonic updatedAt;
  last-write-wins by clock under concurrent writes; frozen snapshots.
