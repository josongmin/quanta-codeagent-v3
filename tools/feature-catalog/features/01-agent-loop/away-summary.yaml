id: away-summary
title: AFK away-summary — <40-word recap on user return
section: 1
subsystem: 에이전트 코어 — AFK 복귀 시 초소형 recap (Claude Code 2.1.150 away-summary 흡수)
order: 465
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: partial
owners: ["@songmin"]
labels: ["absorbed:claude", "surface:cli", "tier:core", "default-off"]
depends_on: [agent]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 5/5 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "recap is a CLI repl render (deliberate_hold lists CLI render of kind ok text); not an event in the 6-event web bridge, never reaches the browser"
purpose: |
  When the user steps away from an in-progress session and returns, generate a
  tiny recap so they re-orient without re-reading the transcript (Claude Code
  2.1.150 away-summary, faithfully absorbed). The slice (src/agent/away-summary,
  imports @/shared ONLY) owns: (1) the VERBATIM system prompt constant
  (AWAY_SUMMARY_SYSTEM_PROMPT — "recap in under 40 words, 1-2 plain sentences, no
  markdown; lead with the overall goal and current task, then the one next
  action; skip root-cause narrative, fix internals, secondary to-dos, em-dash
  tangents"); (2) the strict gate awaySummaryEnabled (env QUANTA_ENABLE_AWAY_SUMMARY
  === "1", mirrors Claude CLAUDE_CODE_ENABLE_AWAY_SUMMARY; reads INJECTED env,
  never process.env); (3) the pure activity guard shouldEmit (emit only when ≥1
  prior assistant turn carries non-blank content — closed-form "real activity
  exists", never on fresh/empty conversation); (4) the orchestrator runAwaySummary
  returning Result-shaped {kind:"ok",text} | {kind:"skip",reason} over a closed
  AwaySkipReason union (gate-off / no-activity / summarizer-error / aborted /
  empty-recap). The LLM is the INJECTED SummarizeFn port (port inversion, mirrors
  @/permission ClassifierPort) — the composition root wires the real adapter with
  ALL tools denied + maxTurns 1 + skipTranscript + skipCacheWrite. The slice owns
  NO tool surface: it hands the summarizer only {system,transcript,signal}, so a
  tool cannot leak from here. NO-THROW throughout. DEFAULT-OFF: flag unset ⇒
  gate-off skip BEFORE the summarizer is referenced ⇒ zero LLM calls, nothing
  rendered, byte-identical to today.
evidence:
  code:
    - src/agent/away-summary/types.ts
    - src/agent/away-summary/port.ts
    - src/agent/away-summary/runner.ts
    - src/agent/away-summary/index.ts
    - src/apps/cli/repl/away-summary-wire.ts
  adrs: [465]
  tests:
    unit:
      - tests/unit/away-summary-hellgate.test.ts
      - tests/unit/cli/away-summary-wire-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_ENABLE_AWAY_SUMMARY
    default: 'unset (OFF)'
    purpose: 'exactly "1" opts a deployment in; any other value (incl "0"/"on"/"true") keeps it OFF. Unset ⇒ runAwaySummary returns gate-off skip without consulting the summarizer (zero LLM calls). Mirrors Claude CLAUDE_CODE_ENABLE_AWAY_SUMMARY.'
deliberate_hold:
  reason: |
    Activation is held for the human at integration (shared files this slice is
    fenced from): (1) the SummarizeFn adapter over LLMPort (tools denied, maxTurns 1,
    skipTranscript, skipCacheWrite) in a composition surface; (2) the on-return / AFK
    idle trigger in src/apps/cli/repl/**; (3) the CLI render of {kind:"ok",text}.
    Listed verbatim in ADR-0465 integration TODOs.
notes: |
  Port inversion is the design crux: @/agent could legally import @/llm, but the
  away-summary is a leaf, so the LLM is injected as SummarizeFn (mirrors
  @/permission ClassifierPort) keeping the slice @/shared-only and unit-testable
  with a spy double. The activity guard uses a closed-form signal (∃ a non-blank
  assistant turn), NOT a magic threshold. The system prompt is verbatim — pinned
  by the hellgate.
