id: spawn-batch-tool
title: spawn_batch — structured subagent fan-out (one templated child per item)
section: 1
subsystem: tier-1 subagent tools (ADR-0436)
order: 436
maturity: L3
status: stable
ui_surfaces: [cli, api]
modes: [interactive, batch, headless]
configurable: integrated
owners: ["@songmin"]
labels: ["absorbed:codex", "surface:tool", "tier:tier1"]
depends_on: []
purpose: |
  Single structured fan-out tool: items[] (inline) XOR items_path
  (.csv/.jsonl/.json, parsed inline — no CSV dep) + a prompt_template with
  {{key}} placeholders ({{item}} for string items, {{{{ }}}} for literal braces)
  → N templated child runs over a bounded worker pool. Codex
  spawn_agents_on_csv absorption, generalized away from CSV-only and the
  worker-side report_agent_job_result tool (workers just return finalText;
  output_schema is validated parent-side). Self-contained one-shot pool: an
  inline FIFO admission semaphore bounded by min(max_concurrency ?? schedulerCap,
  schedulerCap) over the INJECTED runner, per-item timeout race, and
  partial-failure isolation — one item failing never stops the rest. Returns a
  deterministic index-ordered BatchItemResult[] + BatchSummary on
  result.structured plus per-item progress events; all items failing ⇒ ok:false.
  Pure deterministic templating (no eval/Function/nested access). No Date.now /
  Math.random / real timers in the slice — clock, file reader, runner all
  injected; the only setTimeout is the per-item timeout race, unconditionally
  cleared. Explicit injected caps (maxItems default 256, per-item timeout
  default 1800s clamped to band) — no inlined heuristics. Triple default-OFF:
  buildSubagentBatchBlock returns [] unless config.subagent.enableBatchSpawn ===
  true; the tool returns ok:false (never throws) on cap/XOR violations; absent
  from ToolRegistry until wired ⇒ byte-identical.
evidence:
