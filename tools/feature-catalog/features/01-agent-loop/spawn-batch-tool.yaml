      - tests/unit/subagent-batch-template.test.ts
    integration: []
    contract: []
knobs: ["enableBatchSpawn", "maxBatchItems"]
deliberate_hold: null
notes: |
  Reuses the TaskRegistry cap philosophy + NO-THROW + injected-clock patterns
  rather than the background scheduler's LRU/serialize machinery (a batch is a
  one-shot blocking job). Does NOT introduce a CSV library, a worker-side
  reporting tool, or implicit output_csv_path disk export. Concurrency ceiling
  reuses config.subagent.maxConcurrent; per-item timeout band reuses
  config.subagent.waitTimeoutPolicy.
