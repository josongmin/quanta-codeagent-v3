deliberate_hold: null
notes: |
  T3 라운드 (SOTA++ 구조적 fix 패치 시리즈). Breaker(ADR-0011)와 layered: dedup은
  *식별*과 단락, breaker는 *멈춤*. 한 턴 안에서 같은 호출이 다른 cause로 반복되는
  경우는 dedup이 정답 (verify가 같은 npm test를 3번 부르는 등); 다른 호출이지만
  토큰만 burn하는 경우는 breaker가 정답.
  L4→L5 (2026-05-23): smoke battery 13 시나리오의 매 dispatch가 dedup gate를
  pre-flight로 통과 — default-OFF 경로(seam absent)에서 byte-identical을 transitive
  검증. medium/tikitaka 시나리오의 repeated tool call도 정상 흐름 유지.
