id: dispatch-dedup
title: Pre-flight dispatch dedup gate (T3 SOTA++ verify-loop stuck fix)
section: 1
subsystem: Loop 안정성 — duplicate tool-call 단락
order: 51
maturity: L5
status: stable
ui_surfaces: [n-a]
monitoring: integrated
telemetry_keys: [quanta.tool.call.status]
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: [surface:core, tier:core]
depends_on: [agent-dispatch-core, agent-loop-branch-hardening, mode-posture-hitl-4-tier-permission-policy-harddeny-redundan, secret-redaction-content-plane, 183-safety-net-green]
config_refs:
  env: ["QUANTA_DEDUP_ENV_PREFIXES_EXTRA"]
purpose: |
  Bench Type F("Verify-Loop Stuck on Env") 구조적 fix — 동일 (tool name + canonical
  args) 호출이 sliding window 안에서 중복으로 들어오면 dispatch 전에 차단하고 synthetic
  observation block으로 단락. Pure deterministic state machine, no I/O. Rapid-refill
  breaker (ADR-0011)와 분리: breaker는 *발생 후* 루프를 멈추는 안전망, dispatch-dedup
  은 *발생 전* 중복을 합쳐 verify-loop가 같은 환경 호출을 반복하다 토큰 예산을 태우는
  pathology를 차단. 표준화된 args canonical form(key 정렬 + 안정 직렬화)으로 의미상
  동일 호출이 매칭. 부재 시 byte-identical (default-OFF seam).
