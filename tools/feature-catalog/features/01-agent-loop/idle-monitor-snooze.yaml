purpose: |
  Cursor 3.2 §4.1/§4.2/§5 패턴 흡수: idle-monitor + snooze + reject-counter. 60초 무입력
  시 자동 suppress(추가 LLM 호출 정지), /snooze 슬래시로 5분 동안 알림/턴 진행 일시정지
  (disk-persistent — 재시작 후에도 유지), 사용자 거부 20회 누적 시 자동 graceful exit
  (loop-stuck 방지). /resume 슬래시로 즉시 복귀. 모든 동작은 default-OFF env knob 뒤에
  존재.
