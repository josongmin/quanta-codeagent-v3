notes: |
  Cursor 3.2 흡수 — agent-analysis-corpus의 raw beautify 코드 검증 후 채택. snooze는
  disk-persistent(재시작 survival), reject-counter는 in-memory(세션 단위 reset). 20-deny
  graceful exit는 hard cap이지만 모든 임계값(60s/5min/20)은 env knob으로 override 가능.
  no-heuristics-only-validated 정책 준수 — Cursor 패턴을 그대로 흡수, 임의 임계값 도입 없음.
