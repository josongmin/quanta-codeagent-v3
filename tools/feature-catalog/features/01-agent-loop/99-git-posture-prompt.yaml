id: git-posture-prompt
title: System-prompt git posture (default fail-closed)
section: 1
subsystem: System prompt git policy (ADR-0099)
order: 99
maturity: L4
status: stable
owners: ["@songmin"]
labels: [absorbed:codex, surface:core, tier:core]
purpose: |
  System-prompt section that establishes default-NO mutation posture for git in
  the model's instructions. Free read-only inspection (status/log/diff/blame/
  show/grep/ls-files) is allowed; commit/push/branch/merge/rebase/cherry-pick/
  reset/restore/mutating-checkout/stash/tag require explicit user request.
  Pairs with runtime HARD_DENY rules so prompt + runtime form complementary
  layers (prompt steers the model; rules backstop deviation).
