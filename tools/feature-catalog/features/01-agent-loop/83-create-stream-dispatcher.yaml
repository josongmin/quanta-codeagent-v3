purpose: |
  `streamingTurn`이 loop의 stream seam에서 소비하는 `StreamCallbacks` 레코드 생성
  로직을 loop.ts inline 본문에서 `stream-callbacks.ts#createStreamDispatcher` 로
  추출 (commit 047238f, P3). Pure factory: 반환 클로저가 `TurnSession` /
  `TurnState` / `TurnTimingAnchors`를 capture, 글로벌 의존 없음. 본문은 prior inline
  구현과 1:1 byte-identical — destructure가 동일 local name (`config`/`recorder`/
  `classifier`/`skillGate`/`toolHistory`/`workingState`/`collector`/`onRedaction`/
  `turnTimingCapture`)을 그대로 사용해 클로저 body diff가 한 줄도 변하지 않게 설계.
  skill-scope deny, BudgetMeter tick, dispatchTool 호출, redaction rollup, work-
  metrics collection 모두 추출된 클로저 안에 보존.
