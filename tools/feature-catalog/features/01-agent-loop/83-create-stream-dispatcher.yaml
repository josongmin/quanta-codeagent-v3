notes: |
  R6 extract-factory track (P3). loop ↔ stream-callbacks 모듈 분리 — loop.ts가
  stream-callbacks를 import (one-way edge), reverse import 없음. `TurnSession` /
  `TurnState` 번들과 짝 — extraction 이 가능했던 전제는 dispatch closure가 의존하는
  모든 자원이 이미 번들로 묶여 있었기 때문. 81-turn-session-state-bundles + 본
  factory가 P1 → P3 진행의 두 단계.
