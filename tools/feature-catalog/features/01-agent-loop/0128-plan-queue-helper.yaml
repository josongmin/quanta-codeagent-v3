purpose: |
  Typed primitive that lets a host accept user input while a turn is in flight
  and dispatch the queued items on the next turn boundary. Captures FollowUp
  context (pausedReason / arrivedDuringTurn / source / …) so a replayer can
  judge staleness. The interactive CLI constructs one store per REPL, exposes
  `/queue`, and late-binds `sendNow` to the loop-owned external prompt queue.
