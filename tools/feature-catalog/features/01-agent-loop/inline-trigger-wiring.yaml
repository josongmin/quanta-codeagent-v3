id: inline-trigger-wiring
title: Inline-trigger watcher — Aider-style source-comment dispatch primitive
section: 1
subsystem: Playbook trigger primitive (ADR-0250)
order: 250
maturity: L3
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: [absorbed:aider, surface:core, tier:core]
purpose: |
  The smallest reusable primitive for Aider-style `// fix this AI!` source-comment
  dispatch. Closed `InlineTriggerWatcher` port + Subscription handle, production
  `node:fs.watch` adapter, deterministic headless stub, pure helpers (debouncer +
  comment-scanner). Distinct from the sibling per-playbook ADR-0203 watcher: this
  primitive takes a LIST of roots + a LIST of markers + ONE callback, and emits
  a typed TriggerEvent per (file, marker) hit. Default-OFF — no host wires it
  yet; available for status-flash / REPL / side-conv hosts to adopt without
  re-implementing fs.watch + debounce + UTF-8 binary skip + typed-failure
  handling.
evidence:
  code:
    - src/skill/playbook/trigger/port.ts
    - src/skill/playbook/trigger/types.ts
    - src/skill/playbook/trigger/comment-scanner.ts
    - src/skill/playbook/trigger/debouncer.ts
    - src/skill/playbook/trigger/fs-watch-adapter.ts
    - src/skill/playbook/trigger/headless-stub.ts
    - src/skill/playbook/trigger/index.ts
  adrs: [250, 203]
  tests:
    unit:
      - tests/unit/skill/playbook/inline-trigger-hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold: |
  Wiring into a host (status-flash / REPL / side-conv) is deferred per the
  helper-only deferred-wire idiom. The primitive ships first; a follow-up ADR
  adds the consumer once the ROI story is concrete (the two highest-ROI hosts
  identified during the .extracted_source audit are status flash and the REPL).
  The sibling ADR-0203 `inline-trigger-watcher.ts` is NOT migrated to consume
  this primitive — see ADR-0250 Consequences for the rationale.
notes: |
  Why fs.watch and not chokidar: install is blocked in this environment
  (verify-workflow memory). The port surface is unchanged so the swap to
  chokidar is a one-file body change if installs unblock.
