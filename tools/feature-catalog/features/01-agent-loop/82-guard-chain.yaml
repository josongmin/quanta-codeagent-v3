id: guard-chain
title: GuardChain — verify + closeout turn-exit guards unified pipeline
section: 1
subsystem: Turn-exit guard composition (verify-guard + closeout-guard 책임 분할)
order: 82
maturity: L5
status: stable
purpose: |
  verify-guard와 closeout-guard가 SAME 컨트롤 포인트(`applyAction` → "모델이 finish
  하려 한다")에서 SAME 액션 (block finish, append `metaUser(...)` nudge, return
  CONTINUE)을 emit하는 중복 형태를 단일 chain framework로 collapsing. 각 guard는
  pure `decide(ctx) -> TurnGuardResult | undefined` 어댑터로 노출; `buildGuardChain`
  composer가 verify-before-closeout 순서로 등록 (co-firing turn에서 verify 먼저
  trip). `runGuardChain([], ctx) === undefined` 가 default-OFF byte-identical
  sentinel — 빈 chain은 zero iteration + zero allocation, pre-refactor loop와
  완전 동일 동작. 새 guard 추가는 1 file (`MyGuard.decide`) + 1 line
  (`buildGuardChain`) — `applyAction`에 새 hot-path 분기 추가 없음.
