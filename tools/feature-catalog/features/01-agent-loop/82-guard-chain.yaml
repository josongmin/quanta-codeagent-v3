deliberate_hold: null
notes: |
  R6 unification track. Invariants: empty chain → `runGuardChain` returns
  `undefined` 후 caller의 `if (step)` 분기가 legacy completed / nudge / proceed
  path로 fall-through byte-identical; verify가 closeout보다 항상 먼저 등록
  (ADR-0011 + ADR-0017 + ADR-0079 토큰초이스 arming 의미 보존); guard body
  (`decideVerifyGuard` / `decideCloseoutGuard`) verbatim 어댑터 래핑.
  Side-effects on `ctx.wm` / `ctx.toolChoiceState` 는 guard body 내부에서 발생,
  chain 자체는 predicate-free + side-effect-free.
