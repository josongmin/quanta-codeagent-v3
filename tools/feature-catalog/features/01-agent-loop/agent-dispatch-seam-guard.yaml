notes: |
  `plan-mode-dispatch-block` 카탈로그 항목은 plan-mode 의 inline dispatch-block
  거동을 다루고, 본 항목은 그 거동을 backed 하는 pure helper 본체. wiring 은
  `dispatch.ts` 가 `checkDispatchAllowed(...)` 1 회 호출 + deny short-circuit
  으로 ADR-0036 한계 (deferred wiring) 가 후속 패치에서 정확히 본 함수 import +
  call 한 줄로 완료 — 새 로직 ZERO.
