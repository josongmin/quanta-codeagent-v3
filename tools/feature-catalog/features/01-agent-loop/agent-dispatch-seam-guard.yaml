purpose: |
  ADR-0036 (Cluster D Feature 1) — `ToolRegistry.run()` 직전에 호출되는
  pure 함수로, 활성 collaboration mode (default / plan) 하에서 해당 tool 호출이
  허용되는지 결정. throws 가 아닌 tagged `DispatchAllowedResult` 반환 —
  caller (`dispatch.ts`) 는 unhandled exception 없이 rejection 을 `tool_result`
  text body 로 LLM 에 반사 가능.

  Decision matrix:
    - `default` mode  → 항상 `{ ok: true }` (no work)
    - `plan` mode     → 명시적 mutating-tool 테이블 (`assertNotMutatingInPlanMode`)
                        조회:
        - 테이블 부재 ⇒ `{ ok: false, reason: UnknownToolError }`
        - 존재 + mutating ⇒ `{ ok: false, reason: PlanModeMutatingBlockedError }`
        - 존재 + read-only ⇒ `{ ok: true }`

  Minimal surface area: `DispatchTurnState` 는 `collaborationMode` 한 field
  만, `DispatchToolCall` 은 `name` 한 field 만 — loop.ts 의 full turn-state
  에 결합 ZERO 으로 standalone-callable. happy path 에 throw 0, unhappy
  path 에 silent allow 0 (default-deny + typed-error 동시 강제).
