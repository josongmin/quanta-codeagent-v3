notes: 'ADR-0003(단일 cached prefix) 위에 얹는 add-only 확장 — 4-section 미활성 path는 byte-identical. dynamic reminder의 repoRules trailing <system-reminder> 블록은 의도적 중복(static section과 동적 reminder는 다른 cache 정책).'
