notes: 'ADR-0203 `!macro`와 sibling — 같은 SKILL.md에 둘 다 사용 가능. 합성 순서는 host 자유 (slice가 강제 안 함). HELL-TL-14는 default-OFF (template expander 미주입 시 `!macro` surface byte-identical) 봉인. exactOptionalPropertyTypes: OMIT은 slice 내부 코딩 스타일 — 프로젝트 wide tsconfig는 그대로. nunjucks/handlebars swap은 TemplateExpander port body 한 줄 교체로 가능.'
