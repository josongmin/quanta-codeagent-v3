notes: |
  hellgate 14 케이스: 6-mode 분기 / unknown mode typed fallback / 라인 validation (LF/CR/empty
  reject) / defensive copy on get / OFF parity (byte-identical legacy prompt) / variant 라인
  실제 prompt 등장 / mode 간 unique 본문 / override threading / architect+editor posture wording.
  AgentMode 확장은 backward-compatible — 기존 4-mode caller가 typecheck 통과 (union widening).
  MUTATING_TOOL_TABLE은 변경 없음 — admissibility는 mode-level MUTATING_MODES set이 결정.
