purpose: |
  3-vendor (Cursor / Claude Code / Codex) 시스템 프롬프트의 mode-별 identity line 흡수.
  ADR-0198 identity 슬라이스 위에 SystemPromptVariantRegistry 포트를 신설 — 6 mode (default/
  plan/review/audit/architect/editor) variant 테이블을 closed-port로 제공. AgentMode union을
  architect+editor로 확장 (`src/agent/prompt.ts:88`), MUTATING_MODES에 editor 명시 추가
  (`src/agent/mode.ts:34` — architect는 fail-closed read-only 유지). 새 슬라이스
  `src/agent/system-prompt/`: port(SystemPromptVariantRegistry + ModeVariantKey + assertValid
  VariantLines + ModeVariantLineError) / mode-variants(DEFAULT_MODE_VARIANTS 6 entries +
  UNKNOWN_MODE_VARIANT typed fallback) / default-builder(defaultModeVariantRegistry +
  buildSystemPromptForMode) / index. buildSystemPromptForMode는 registry.variantFor(mode).
  identity를 buildSystemPrompt({identity}) seam (ADR-0198) 으로 통과 — slice는 ADDITIVE,
  caller가 호출하지 않으면 byte-identical. ADR-0198 identity 테이블도 architect/editor 2 entry
  추가 (IDENTITY_MODES 7개로 확장 — IdentityMode = AgentMode | "onboarding" 자동 확장).
