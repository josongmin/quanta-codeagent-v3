id: subagent-multi-agent-bounds
title: Subagent bounds — tool namespace / wait-timeout clamp / concurrency cap
section: 1
subsystem: 에이전트 코어 — subagent 안전장치 (Codex multi_agent_v2 흡수)
order: 77
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: partial
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: [agent, guarded-spawn]
purpose: |
  Three opt-in subagent hardenings from Codex's multi_agent_v2, all default-OFF =
  byte-identical. (B1 tool_namespace) a closed ToolNamespaceStrategy injected into
  SubagentRunnerOptions: when set, a spawned child's filtered ToolRegistry is rewritten
  so each tool name is scoped (default prefixToolNamespace keyed by the child's
  deterministic mailbox label root/0,root/1…), giving concurrent siblings disjoint tool
  surfaces; dispatch resolves the scoped name straight back to the real tool. Absent ⇒
  raw names exactly as today. (B2 wait-timeout) a WaitTimeoutPolicy{minMs,maxMs,defaultMs}
  that CLAMPS (never rejects) the caller-supplied timeout for both wait_agent and
  task_output(block:true); default {1, 3_600_000, 30_000} preserves the prior 30s default
  + a generous 1h ceiling so no existing override is affected. Closes the previously
  unbounded per-call timeout hole. (B3 concurrency cap) an optional maxConcurrent dep on
  handleSpawnAgent counting running tasks via the registry's pendingIds(); over-cap spawns
  return a structured {kind:"error", cause:"concurrency_cap"} mirroring the pty_cap pattern.
  Default = unlimited (opt-in) so every existing spawn path is byte-identical.
  2026-06-02 PROMOTION: the three seams are now top-level config.subagent knobs
  (SubagentBlock.{toolNamespace, waitTimeoutPolicy, maxConcurrent}) threaded by
  buildSubagentBlock. B1 (toolNamespace) + B2/task_output are fully WIRED end-to-end.
  B2/wait_agent + B3 are EXPOSED on the materialized block (subagent6Deps) but not yet
  behavior-live because nothing assembles Subagent6Deps in the loop (see deliberate_hold).
evidence:
  code:
    - src/agent/subagent-runner.ts
    - src/subagent/handlers-6.ts
    - src/subagent/task-tools.ts
    - src/subagent/dispatch-6.ts
    - src/agent/types/agent-capabilities.ts
    - src/agent/tier1/subagent.ts
    - src/subagent/index.ts
  adrs: []
  tests:
    unit:
      - tests/unit/subagent-tool-namespace-hellgate.test.ts
      - tests/unit/subagent-bounds-hellgate.test.ts
      - tests/unit/subagent-config-knobs-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: config.subagent.toolNamespace
    default: 'undefined'
    purpose: 'WIRED: absent ⇒ raw tool names (byte-identical); set ⇒ per-child scoped names'
  - name: config.subagent.waitTimeoutPolicy {minMs,maxMs,defaultMs}
    default: '{1, 3_600_000, 30_000}'
    purpose: 'WIRED for task_output (clamp); exposed for wait_agent; default preserves 30s'
  - name: config.subagent.maxConcurrent
    default: 'undefined (unlimited)'
    purpose: 'EXPOSED on subagent6Deps; over-cap ⇒ concurrency_cap (live once a Subagent6Deps assembler exists)'
deliberate_hold:
  reason: |
    Pre-existing structural gap surfaced during the 2026-06-02 promotion: the 6-tool
    router (Subagent6Deps in src/subagent/dispatch-6.ts) has NO live assembly site in the
    agent loop — buildSubagentBlock only builds the trio (agent/task_output/task_stop) via
    createAgentTool/createTaskOutputTool/createTaskStopTool. So B1 + B2/task_output are
    behavior-live, but B2/wait_agent + B3/maxConcurrent are surfaced on
    SubagentBlock.subagent6Deps and wait for a consumer rather than being silently dropped.
  promotion_path: |
    Add a Subagent6Deps assembly site (wire dispatchSubagent6 into a runtime tool path) so
    the exposed waitTimeoutPolicy/maxConcurrent become behavior-live. Independent of the
    knob plumbing, which is complete.
notes: |
  B3 default is unlimited (not a number) on purpose — the foreground spawn path had no
  cap before, so any finite default would be a behavior change. Namespacing round-trips
  for free because the registry is keyed by the scoped name. The trio `agent` tool has no
  concurrency gauge, so maxConcurrent is inherently a 6-tool-router-only knob.
