id: compaction-breaker
title: Compaction circuit breaker — rapid-refill + consecutive-failure guard
section: 1
subsystem: 컨텍스트 압축 anti-thrash (RFC §8 Phase 2)
order: 91
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: partial
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: [absorbed:claude-code, surface:core, tier:core]
purpose: |
  Pure deterministic state machine that mirrors Claude Code v2's two
  compaction guards: (1) rapid-refill breaker — when the context refills to
  the limit and re-compacts with no real headroom gained, abort the turn with
  reason `rapid_refill_breaker` rather than spin forever on an un-shrinkable
  prompt; (2) consecutive-failure breaker — proactive compaction that keeps
  running without freeing tokens is disabled for the rest of the session
  (Claude Code's `consecutiveFailures >= 3`). Never touches transcript / LLM /
  clock — the loop feeds before/after token counts + a `noteProgress()` signal
  on real headway, asks `check()` before next compaction-driven retry. Default
  caps (3 / 3 / ~15%) track Claude Code constants.
