id: refusal-stop-reason-branching
title: ADR-0242 stop_reason 8-arm typed router (Cursor 3.2.16) — surface/abort/hitl/continue
section: 1
subsystem: Recovery FSM / Stop-reason classification
order: 242
maturity: L2
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
