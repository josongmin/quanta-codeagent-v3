depends_on: [branch-search-isolate-symlink-safe, branch-search-pure-scorer, branch-search-verifier-suite, shadow-odb-port, shadow-odb-rewind]
purpose: |
  Two leaf modules that complete the speculative branch-search slice.
  (1) `BranchSearchAnchor` — closed port wiring the Shadow git ODB
  (ADR-0108) into branch search as an opt-in, NO-THROW anchor + per-
  candidate delta measurement port. Without it, branch search runs N
  isolated candidates with no common starting point and no quantified
  "how much did each candidate diverge" signal. Default impl
  `shadowOdbAnchor` is backed by `ShadowOdb.registerHead` +
  `ShadowOdb.diffWorkspaceSinceLast`. (2) `progress.ts` — pure formatter
  turning a `BranchTraceEvent` into one human-readable line + severity
  classification. Plane-clean (imports only `./types`). ANSI coloring +
  unicode glyphs are opt-in, default-on for human display, default-off
  for tests that diff exact strings.
