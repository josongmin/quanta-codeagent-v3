id: submission-op-envelope
title: Submission op envelope (6-variant) + legacy messages→Submission adapter
section: 1
subsystem: 턴 라이프사이클 — host→agent 타입드 입력 (Codex 흡수, ADR-0072)
order: 66
maturity: L3
status: new
purpose: |
  Codex `Submission { id; op }` / `Op` discriminated union 흡수. host→agent 입력을
  6-variant 닫힌 union으로 모델링: user_input / user_input_with_turn_context /
  interrupt / cancel_subagent / shutdown / reload_user_config. 순수 adapter
  submissionFromMessages(레거시 messages→user_input Submission, legacy- prefix id) +
  extractSeedMessages 사영으로 round-trip(extract(from(m))≡m). loop은 cfg.submission이
  user-input일 때 seed를 [...messages, ...projected]로 derive, cfg.messages는 mutate 안 함.
  control-op은 accepted-and-ignored 모양(행동 미배선). 부재 시 byte-identical 레거시.
evidence:
  code: [src/agent/submission.ts]
  adrs: [72]
  tests:
    unit:
      - tests/unit/agent/submission.test.ts
      - tests/unit/agent-submission-and-stop-category.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold:
  reason: |
    SubmissionOp 6-variant + adapter는 순수 모듈로 완성+테스트, loop이 user_input 2종을
    소비하도록 배선됨(L3). control-op(interrupt/cancel_subagent/shutdown/reload_user_config)은
    모양만 박힌 accepted-and-ignored — 행동 미배선.
  promotion_path: |
    interrupt를 ADR-0030 steering의 AbortSignal에, cancel_subagent를 ADR-0011 subagent
    취소에 배선하면 L4.
notes: 'default-OFF: cfg.submission 부재 시 createWorkingMemory(cfg.messages) 경로 byte-identical(RFC §1.2).'
