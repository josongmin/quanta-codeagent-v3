id: submission-op-envelope
title: Submission op envelope (6-variant) + legacy messages→Submission adapter
section: 1
subsystem: 턴 라이프사이클 — host→agent 타입드 입력 (Codex 흡수, ADR-0072)
order: 66
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: integrated
telemetry_keys: ["gen_ai.response.time_to_first_token_ms", "quanta.conversation.id"]
modes: [n-a]
configurable: n-a
owners: ["@songmin"]
labels: [absorbed:codex, surface:core, tier:core]
configurable: integrated
config_refs:
  env: ["QUANTA_ATTRS", "QUANTA_CAP_ENFORCE"]
purpose: |
  Codex `Submission { id; op }` / `Op` discriminated union 흡수. host→agent 입력을
  6-variant 닫힌 union으로 모델링: user_input / user_input_with_turn_context /
  interrupt / cancel_subagent / shutdown / reload_user_config. 순수 adapter
  submissionFromMessages(레거시 messages→user_input Submission, legacy- prefix id) +
  extractSeedMessages 사영으로 round-trip(extract(from(m))≡m). loop은 cfg.submission이
  user-input일 때 seed를 [...messages, ...projected]로 derive, cfg.messages는 mutate 안 함.
  control-op은 accepted-and-ignored 모양(행동 미배선). 부재 시 byte-identical 레거시.
evidence:
  code:
    - src/agent/submission.ts
    - src/agent/control-op-handler.ts
    - src/agent/loop.ts
  adrs: [72]
  tests:
    unit:
      - tests/unit/agent/submission.test.ts
      - tests/unit/agent-submission-and-stop-category.test.ts
      - tests/unit/agent/control-op-handler-hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  L4 (2026-05-23): control-op behavioral 배선 완료. interrupt → emitInterrupted +
  signal.abort + "aborted" stop; cancel_subagent → cancelSubagent helper(3-way outcome
  stopped/not_found/registry_absent) + subagent_cancel AgentEvent. shutdown/reload는
  surface-decision lifecycle event라 의도적 미배선. default-OFF: cfg.submission 부재 시
  byte-identical 레거시(RFC §1.2). host stub의 throw도 not_found로 collapse해 부모
  loop에 propagate 안 함(defensive).
