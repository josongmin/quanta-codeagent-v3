deliberate_hold: null
notes: |
  ADR-0218 (mode-typed delegation, `src/agent/subagent-typed/`) 과는 별개 — 그 슬라이스는
  child 의 TOOL SURFACE + BUDGET 를 5-arm AgentMode enum 으로 게이팅. 본 항목은 더 좁게
  `agent_type` 필드만 기존 agent-tool spawn 경계에서 정규화·분류 (도구 상속·예산 미접촉).
  새 kind 추가 = SSOT 배열 1줄 편집 (union + 런타임 Set 모두 재유도).
