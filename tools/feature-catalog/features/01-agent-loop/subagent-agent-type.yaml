order: 210
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch]
configurable: integrated
owners: ['@songmin']
labels: [surface:core, tier:core]
depends_on: [agent-nickname-pool-role-enum, subagent-role-identity]
config_refs:
  env: [QUANTA_SUBAGENT_TYPED_KIND]
  runtime: [subagentTypedKind]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "gate QUANTA_SUBAGENT_TYPED_KIND → src/shared/runtime-config.ts:1534 (subagentTypedKind gateOn) → src/agent/tier1/subagent.ts:140 (enforceTypedAgentKind:true) → src/subagent/agent-tool.ts:560 validateAgentType; buildSubagentBlock reachable from src/apps/cli/internal.ts via buildSubagentConfigCore"
    web: "internal subagent spawn-boundary classifier — no user-visible web affordance"
purpose: |
  서브에이전트 `agentType` 을 FREE STRING 에서 닫힌집합 SSOT + 정규화 경계검증으로
  승격 (§4.4). PURE LEAF (`src/subagent/agent-type.ts`): import/IO/clock 없음 —
  경계(agent-tool)가 소비하는 결정론적 classifier.

  SSOT: `SUBAGENT_KINDS = [general, explore, plan, review, edit]` 가 유일 정본;
  `SubagentType` union + `WELL_KNOWN_SET` 은 이 배열에서 DERIVED (둘째 손사본 0).
  `SubagentAgentType = SubagentType | (string & {})` — typed-or-string union:
  well-known 에 대해 에디터 autocomplete 유지하면서 임의 custom(named-agent) 문자열도
  back-compat 수용.

  `classifyAgentType(raw)` — NO-THROW, 전 입력에 total:
    - undefined/whitespace ⇒ `{kind:"empty"}` (개념상 general fork)
    - trim+lowercase 후 well-known ⇒ `{kind:"well-known", canonical, requested}`
      (CC `tengu_subagent_type_normalized` 미러: "Plan" → 정본 "plan")
    - 그 외 ⇒ `{kind:"custom", requested, normalized}` (등록가능 named-agent — 아직 miss 아님)

  `validateAgentType(raw, {enforce?, knownCustom?})` — spawn 경계 검증:
    - enforce FALSY (게이트 부재 / DEFAULT-OFF) ⇒ 항상 `{ok:true, value:raw}` —
      legacy free-string 와 byte-identical (정규화·거부 0)
    - enforce:true ⇒ well-known 는 정본 spelling 으로 canonicalise; empty 는 수용
      (value undefined ⇒ general fork); custom 은 `knownCustom` 와 대소문자 무시 매칭시
      수용, 아니면 `subagent_type_not_found`-스타일 사유로 REJECT (CC `…_miss`)

  배선: tier1/subagent.ts 가 `subagentTypedKind` (gate QUANTA_SUBAGENT_TYPED_KIND)
  읽어 ON 일 때 `enforceTypedAgentKind:true` + named-agent registry 키를 `knownCustom`
  으로 전달; agent-tool.ts 가 경계에서 호출, ok:false 는 복구가능 tool deny 로 변환
  (NO-THROW — miss 시 runner 미호출). Slice isolation 보존: `@/subagent` 는
  `@/tool`/`@/shared` 만, 이 leaf 는 둘 다 미접근.
