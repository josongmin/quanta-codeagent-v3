notes: |
  L4 wire-up (2026-05-23):
  - Plane-B: `streamConsume` builds wall-clock anchors (requestSentAt before
    `llm.stream(...)`, firstTokenAt on engine's `onFirstChunk` fire — OVERWRITES
    on every fire so REPLACEMENT stream wins after tombstone, streamEndAt in
    the `finally`). `outcome.turnTiming` is the LAST sampling-request's
    snapshot; OMITTED when no stream ever opened.
  - Plane-C: `denyFromConfirm` (admissibility-gate.ts) extracts
    `isReadonly = config.registry.get(call.name)?.isReadOnly()` and threads
    it into `buildDenySteerMessage`. Already wired pre-L4; pinned by hellgate
    against false-positive on null registry entry.
  - SOTA (Cursor `setTtftMs`): `safeTtftMs` rejects non-finite / negative
    and exposes `ttftMs` / `totalTtftMs` scalar slots on TurnTiming. OTel
    attr `gen_ai.response.time_to_first_token_ms` emitted on
    `run_sampling_request` span-close ONLY when guard passes.
  Deferred (별도 ADR 예정):
  (a) per-tool TTFT histogram by model;
  (b) phase marker를 streaming 중 점진적으로 tag (현재는 post-pass);
  (c) READONLY_DENY_STEER_NOTE의 i18n / templating.

  Original notes:
  ADR-0076 Gap-4의 deny_and_steer verb 위에 readonly note를 atomic append하는 형태.
  TTFT capture는 stream_reset과 동작 상호작용 — replacement stream의 first chunk가
  진짜 TTFT 신호이므로 resetForTombstone이 firstChunkSeen latch도 리셋. 3 plane은
  런타임 경로가 직교 — 한 plane 실패가 다른 plane에 전파하지 않음.
