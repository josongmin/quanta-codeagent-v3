purpose: |
  하나의 PR로 3개의 직교 신호를 흡수 — 각각 다른 plane(data / observability /
  control)에서 누락된 declared 답을 구조적으로 확보. 모든 의사결정이 producer가
  이미 선언한 shape에 대한 closed discriminated-union match (Tool.isReadOnly(),
  ContentBlock.type, StreamEvent.type) — heuristic / regex / fallback 경로 없음.

  Plane-A — Phase marker (data, 구조적 post-pass): TextBlock에 phase?:
  "commentary" | "final_answer" 추가. assembleFromEvents가 단일 backward scan
  determinePhases(content)로 태그 — content[i].type === "text"의 phase는 ∃ j > i :
  content[j].type === "tool_use" 일 때 "commentary", 아니면 "final_answer".
  Idempotent · non-text block pass-through. 소비자가 읽지 않으면 byte-identical.

  Plane-B — TTFT (observability, idempotent first-chunk latch):
  src/observability/turn-timing.ts의 createTurnTimingCapture(clock?). markRequestSent /
  markStreamEnd는 1회씩 호출, markFirstToken은 IDEMPOTENT — 첫 호출만 기록.
  streaming-dispatch에 onFirstChunk?: () => void seam 추가 — text_delta /
  thinking_delta / tool_use_start 중 첫번째에 발화. stream_reset tombstone은 latch
  리셋 (REPLACEMENT stream의 first chunk 측정). AgentOutcome.turnTiming?로 마지막
  productive turn의 snapshot surface. 새 OTel attr: gen_ai.response.time_to_first_token_ms.

  Plane-C — readonly deny-steer (control, declared flag): buildDenySteerMessage
  시그니처를 (decision, isReadonly?)로 widen. isReadonly === true이면
  READONLY_DENY_STEER_NOTE를 steer에 append, 그 외(mutating / unknown / undefined)는
  verbatim (byte-identical). denyFromConfirm(admissibility-gate)이 이미 보유한
  config.registry.get(call.name)?.isReadOnly() 경로로 flag 도출 — 병렬 lookup 없음.
  DispatchResult.failure = {mode: "permission_denied", isReadonly}로 typed envelope
  surface하여 trajectory/permission consumer가 typed branch.
