purpose: 'ADR-0183 streaming-cancellation primitive: a typed CancelController carrying a closed cancel-cause union (budget-breach | verify-guard | user-abort) that round-trips to a standard AbortSignal + orchestrates cleanup. The real sampling loop consumes optional `AgentConfig.streamCancellation`: it projects typed/session abort into the provider signal, wraps the provider stream through `cancellableStream`, and awaits cleanup with salvaged partial output before the next loop action. Absent slot is byte-identical; standard CLI/web still do not mint a controller, so typed causes remain an explicit host opt-in.'
