deliberate_hold:
  reason: 'The loop consumer is live, but ordinary CLI/web sessions do not construct a controller or attach typed-cause producers. Enabling it broadly without a cause-owner would be a no-op wrapper; retain host injection until cancellation metrics/recorder ownership and producer migration are designed.'
  promotion_path: 'Add one host-owned controller factory and migrate a concrete budget/verify/user-abort producer to cancel(cause), with a cause receipt and no duplicate local interruption path.'
notes: 'The dir/test "ADR-0177" labels are stale (0177 was renumbered); the real ADR is 0183.'
