id: agent-types-split
title: types.ts cohesion split (4 sub-modules, byte-identical)
section: 1
subsystem: 코어 루프 SOLID 회복
order: 205
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: partial
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: [surface:core, tier:core]
purpose: |
  `src/agent/types.ts` (875 LOC) 의 cohesion split — 응집도 높은 4 묶음을
  `src/agent/types/` 하위 모듈로 분리하고 root `types.ts` 는 re-export 보존
  해서 132 consumer 영향 ZERO.

  4 sub-modules:
    - `agent-outcome.ts`      — `AgentOutcome`/`RedactionRollup` 등 session-end
                               surface (LLM/Permission/Stream 전체 의존 그래프
                               없이 import 가능)
    - `memory-config.ts`      — long-term memory config 어휘
    - `compaction-config.ts`  — compaction breaker + config 어휘
    - `agent-capabilities.ts` — tier-1 capability tier slices

  types.ts 875 → ~700 LOC: root 는 4 sub-module 의 verbatim re-export +
  capability composite 만 보유. 외부 consumer 는 `import {...} from "./types"`
  (or `"@/agent/types"`) 가 그대로 동작 — 132 file × N import 모두 unchanged.

  Byte-identical: 모든 export 이름 + 시그니처 보존. 단순 cohesion redistribution
  — 새 추상화 0, 새 default 0, 의미 변경 0. 향후 consumer 가 좁은 sub-module 만
  import 해서 의존 그래프 깎을 수 있는 seam 제공.
