id: agent-types-split
title: types.ts cohesion split (4 sub-modules, byte-identical)
section: 1
subsystem: 코어 루프 SOLID 회복
order: 205
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: partial
modes: [n-a]
configurable: static
owners: ['@songmin']
labels: [surface:core, tier:core]
