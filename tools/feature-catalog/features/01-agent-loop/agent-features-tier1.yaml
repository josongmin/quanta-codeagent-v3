id: agent-features-tier1
title: Tier-1 builders → per-subsystem composer (9 builders SRP split)
section: 1
subsystem: 코어 루프 SOLID 회복
order: 204
maturity: L4
status: new
purpose: |
  `src/agent/features.ts` (393 LOC of SessionFeatures 합성 GodFn) 을 9 개
  per-subsystem builder + composer 로 분해. 각 builder 는 ONE optional config
  block → ONE concrete 런타임 object (or `undefined` 으로 byte-identical
  default-OFF 보존).

  9 builders (`src/agent/tier1/`):
    - `auto-classifier`   — buildClassifierBlock
    - `branch-search`     — buildBranchSearchBlock
    - `plan-exit`         — buildPlanExitBlock
    - `plan-mutation`     — buildPlanMutationBlock
    - `shadow`            — buildShadowBlock
    - `skill`             — buildSkillBlock (+ SkillBlock type)
    - `subagent`          — buildSubagentBlock (+ SubagentBlock type)
    - `user-input`        — buildUserInputBlock
    - `web-search`        — buildWebSearchBlock
    - `working-state`     — buildWorkingStateBlock (+ WorkingStateBlock type)

  `features.ts` 393 → ~200 LOC composer: builder 호출 시퀀스 + 결과를
  `SessionFeatures` shape 으로 fold. composer 는 builder 추가에 대해 closed —
  새 tier-1 추가는 `tier1/` 신규 모듈 + `index.ts` re-export + features.ts 한 줄
  composer fold push.

  Edge direction 엄격: `features.ts` 가 `tier1/*` 를 IMPORT;
  `tier1/*` 는 절대 `features.ts` 를 import 금지. import-cycle guard
  (`tests/unit/agent-import-cycle.test.ts`) 가 단순한 이유 — `tier1/*` 는
  하위 디렉토리에 있어 top-level SCC 분석에서 invisible, 그리고 one-way edge
  이므로 새 cycle 0.
