deliberate_hold:
  reason: |
    AgentConfig 와이어는 의도적 보류 — 첫 호스트(CLI repl 또는 IDE)가 driver를
    소비할 때 별도 ADR로 와이어. default-OFF 보존.
  promotion_path: |
    Documented in ADR; wire when ROI concrete.
notes: |
  exactOptionalPropertyTypes: OMIT 준수 (선택 필드는 부재; undefined로 명시
  set 안 함). 15 HELL-NP-01..15 hellgate가 모든 closed-error code 도달성 +
  files_to_modify[] context 보존 + 1000-phase 결정성 + module side-effect 0를
  잠금. depth=1 nested MVP는 inner driver 호스팅을 잠그지만 N-level recursive
  composition은 후속 작업.
