id: n-phase-hitl
title: N-phase HITL state machine (plan-exit-flow 일반화)
section: 1
subsystem: N-phase HITL workflow (ADR-0243; Cursor 흡수)
order: 243
maturity: L3
status: new
ui_surfaces: [cli, ide]
monitoring: n-a
modes: [interactive, headless, ide]
configurable: static
owners: ["@songmin"]
labels: [absorbed:cursor, surface:core, tier:core]
depends_on: [plan-exit-three-way, plan-exit-flow]
purpose: |
  Cursor AiProjectService(8)의 N-phase 상태머신(init→clarify→plan→feedback
  →breakdown→...) 패턴 흡수. ADR-0063 plan-exit 3-way를 N-phase 시퀀스 + per-phase
  feedback gate로 일반화. closed-port (NPhaseDriver { current, transition,
  feedback }) + default-OFF sibling. plan-exit{,-flow}는 byte-identical 보존.
  TransitionError 5-arm closed enum (unknown-phase / feedback-required /
  skip-not-allowed / no-next-phase / backward-not-permitted) + FeedbackError
  2-arm (unknown-phase / phase-mismatch). negative feedback은 직전 phase로
  자동 rollback + ledger entry clear.
