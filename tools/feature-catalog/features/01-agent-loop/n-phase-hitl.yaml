id: n-phase-hitl
title: N-phase HITL state machine (plan-exit-flow 일반화)
section: 1
subsystem: N-phase HITL workflow (ADR-0243; Cursor 흡수)
order: 243
maturity: L2
status: new
ui_surfaces: [cli, ide]
monitoring: n-a
modes: [interactive, headless, ide]
configurable: static
owners: ["@songmin"]
labels: [absorbed:cursor, surface:core, tier:core]
depends_on: [plan-exit-three-way, plan-exit-flow]
surface_integration:
  cli: missing
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "src evidence not reachable from the interactive CLI entry (src/apps/cli/index.ts) — wired only into other apps (eval/bench/probe/headless) or unwired"
    web: "approvals web surface is the 2-verb EscalationCard/PlainApproval; this N-phase per-phase feedback gate is unwired and rides no web command verb, does not reach the browser"
purpose: |
  Cursor AiProjectService(8)의 N-phase 상태머신(init→clarify→plan→feedback
  →breakdown→...) 패턴 흡수. ADR-0063 plan-exit 3-way를 N-phase 시퀀스 + per-phase
  feedback gate로 일반화. closed-port (NPhaseDriver { current, transition,
  feedback }) + default-OFF sibling. plan-exit{,-flow}는 byte-identical 보존.
  TransitionError 5-arm closed enum (unknown-phase / feedback-required /
  skip-not-allowed / no-next-phase / backward-not-permitted) + FeedbackError
  2-arm (unknown-phase / phase-mismatch). negative feedback은 직전 phase로
  자동 rollback + ledger entry clear.
evidence:
  code:
    - src/agent/n-phase/types.ts
    - src/agent/n-phase/port.ts
    - src/agent/n-phase/default-driver.ts
    - src/agent/n-phase/index.ts
  adrs: [243, 63]
  tests:
    unit:
      - tests/unit/agent/n-phase-hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold:
  reason: |
    AgentConfig wire deliberately held: the first host (CLI repl or IDE) wires the
    driver under its own ADR, and `plan-exit{,-flow}` stays byte-identical meanwhile.
    Verified 2026-08-22: `grep -rn "agent/n-phase" src/` outside the slice returns
    ZERO hits, so all four evidence files are unreachable from every
    `src/apps/<surface>/index.ts`. The hold is real — an N-phase gate that blocks on
    per-phase human feedback needs a host that owns an approval surface, and picking
    that surface (CLI prompt vs IDE panel) is the deferred decision.
  promotion_path: |
    L3 = a host constructs `NPhaseDriver` at a composition root and routes its
    per-phase feedback gate through an existing approval surface, making
    `src/agent/n-phase/*` reachable from an app entrypoint. Until then the wired
    3-way `plan-exit` remains the shipped path.
    `bun fc reachability --strict --symbols` is the objective judge: this id must
    drop off the offender list on its own, with NO baseline edit.
notes: |
  exactOptionalPropertyTypes: OMIT 준수 (선택 필드는 부재; undefined로 명시
  set 안 함). 15 HELL-NP-01..15 hellgate가 모든 closed-error code 도달성 +
  files_to_modify[] context 보존 + 1000-phase 결정성 + module side-effect 0를
  잠금. depth=1 nested MVP는 inner driver 호스팅을 잠그지만 N-level recursive
  composition은 후속 작업.

  Maturity was L3 until 2026-08-22. The hold ("AgentConfig 와이어는 의도적 보류")
  already described an unwired slice while the maturity tag claimed L3 = wired;
  the L3 reachability floor forced the two into agreement. No code changed.
