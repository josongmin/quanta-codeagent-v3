id: aug02-rfc07-task-projection
title: "RFC07 — task compatibility projection + named to: mailbox resolver"
section: 1
subsystem: Orchestration — task projection + named delivery (aug-02 RFC07-1/3)
order: 565
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: static
owners: ["@songmin"]
labels: ["rfc:aug02-07", "surface:cli"]
purpose: |
  RFC-07 Claude-orchestration deltas: (3) a task compatibility PROJECTION
  exposes owner/blockedBy/blocks as a read alias over the existing plan/task
  model, so orchestration consumers see Claude-shaped task fields without a
  schema fork; (1) a NAMED `to:` mailbox resolver resolves a human name to a
  live subagent mailbox over the TaskRegistry lineage, so a message can target
  "the reviewer" instead of an opaque id. Both are additive read/resolve layers
  — no plan mutation, no new task store.
