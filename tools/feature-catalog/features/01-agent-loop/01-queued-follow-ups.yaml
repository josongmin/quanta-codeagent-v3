config_refs:
  env: ["QUANTA_ATTRS", "QUANTA_CAP_ENFORCE"]
purpose: |
  Per-thread FIFO follow-up queue with multi-thread isolation and serializable
  snapshot/restore. 10 explicit PausedReason values — popReady delivers iff
  pausedReason === null; documented condition per reason; drain at thread close.
  L4 (2026-05-23): loop가 매 턴 시작 시 pollFollowUpQueue로 popReady를 시도하고
  paused면 response_queued AgentEvent 발행, ready면 head를 synthesized user Message로
  wm.append. AgentConfig.followUpQueueSnapshotStore가 wired면 session-start 하이드레이트 +
  session-end save로 재시작 간 영속.
evidence:
