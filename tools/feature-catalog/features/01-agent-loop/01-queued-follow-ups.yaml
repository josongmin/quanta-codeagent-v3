id: queued-follow-ups
title: Per-thread queued follow-ups with PausedReason
section: 1
subsystem: Follow-up queue (ADR-0037)
order: 12
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: integrated
telemetry_keys: ["gen_ai.response.time_to_first_token_ms", "quanta.conversation.id"]
modes: [n-a]
