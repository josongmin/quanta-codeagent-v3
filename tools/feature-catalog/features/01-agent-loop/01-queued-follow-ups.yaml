    contract: []
knobs: []
deliberate_hold: null
notes: |
  L4: queue undefined ⇒ pollFollowUpQueue 즉시 null(byte-identical), paused ⇒
  response_queued 발행 + null, ready ⇒ head를 synthesized user Message로 반환.
  response_queued.reason은 ResponseQueuedReason closed union (PausedReason 10개 +
  2 control-op-pending reasons in control-op-handler). session-resume snapshot
  hydrate + save도 wired(followUpQueueSnapshotStore optional). UI surface
  (queued count painter)는 surface-specific이라 호스트 책임.
