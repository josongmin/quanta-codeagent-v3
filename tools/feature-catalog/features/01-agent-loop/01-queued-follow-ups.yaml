id: queued-follow-ups
title: Per-thread queued follow-ups with PausedReason
section: 1
subsystem: Follow-up queue (ADR-0037)
order: 12
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: integrated
telemetry_keys: ["gen_ai.response.time_to_first_token_ms", "quanta.conversation.id"]
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: n-a
owners: ["@songmin"]
labels: [absorbed:codex, surface:core, tier:core]
depends_on: [plan-mode, secret-redaction-content-plane, durable-state-belongs-in-workspace-files, src-agent-working-state-ts, turncontextinput-mode-reporules-workingstate-activeskills]
config_refs:
  env: ["QUANTA_CAP_ENFORCE"]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "follow-up queue reachable from CLI entry; loop polls pollFollowUpQueue each turn"
    web: "queue emits response_queued AgentEvent which drops at context-binding.ts:1104 default arm; enqueue needs a B3-absent SessionCommand verb; UI queued-count painter is explicitly host-side"
purpose: |
  Per-thread FIFO follow-up queue with multi-thread isolation and serializable
  snapshot/restore. 10 explicit PausedReason values — popReady delivers iff
  pausedReason === null; documented condition per reason; drain at thread close.
  L4 (2026-05-23): loop가 매 턴 시작 시 pollFollowUpQueue로 popReady를 시도하고
  paused면 response_queued AgentEvent 발행, ready면 head를 synthesized user Message로
  wm.append. AgentConfig.followUpQueueSnapshotStore가 wired면 session-start 하이드레이트 +
  session-end save로 재시작 간 영속.
evidence:
  code:
    - src/agent/follow-up-queue.ts
    - src/agent/control-op-handler.ts
    - src/agent/loop.ts
    - src/stream/types.ts
    - src/observability/vocabulary.ts
    - src/shared/runtime-config.ts
  adrs: [37]
  tests:
    unit:
      - tests/unit/follow-up-queue.test.ts
      - tests/unit/paused-reason-enum.test.ts
      - tests/unit/agent/control-op-handler-hellgate.test.ts
    integration:
      - tests/integration/queued-follow-ups-hell-e2e.test.ts
    contract: []
knobs: []
deliberate_hold: null
notes: |
  L4: queue undefined ⇒ pollFollowUpQueue 즉시 null(byte-identical), paused ⇒
  response_queued 발행 + null, ready ⇒ head를 synthesized user Message로 반환.
  response_queued.reason은 ResponseQueuedReason closed union (PausedReason 10개 +
  2 control-op-pending reasons in control-op-handler). session-resume snapshot
  hydrate + save도 wired(followUpQueueSnapshotStore optional). UI surface
  (queued count painter)는 surface-specific이라 호스트 책임.
