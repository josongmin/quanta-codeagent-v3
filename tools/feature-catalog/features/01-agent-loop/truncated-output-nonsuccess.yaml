notes: |
  Four existing tests PINNED `proceed` as the intended seal for a spent-budget
  truncation — they encoded the defect. Updated with the reason rather than worked
  around.

  Both runtime drift guards fired immediately and correctly:
  `assertStopPresentationInSync` refused the new code until it had presentation, and
  the web-mirror drift hellgate refused it until the web table gained both new codes.

  The load-bearing test is T-7, which drives the REAL `runAgent` and asserts on
  `AgentOutcome.reason`. Everything else drives `decideOnAssembled`, a pure decision —
  a fix that got the decision right but never reached the outcome would look identical
  in those tests. Reverting the seal restores `completed` end-to-end.
