  describe에 when-not-to-use("부분 mutation은 edit, 같은 파일 여러 번 write는
  거의 잘못된 패턴"). prompt-body BODY_AFTER_PERSONA에 `<example>` 2개 —
  positive(grep+read for behavior question) + avoidance(bash+sed 대신 read+edit).
  모든 prompt baseline test pass: 의도된 부분만 변경, 나머지 byte-identical.
