notes: |
  Dispatch seam 의 모든 deny/permit 결정이 throws 가 아닌 typed `DispatchResult`
  로 surface 하는 게 핵심 invariant — `loop.ts` 의 try/catch unwinding 없이
  LLM 에 `tool_result.is_error=true` 로 자연 반사. evidenceOf 헬퍼는
  `exactOptionalPropertyTypes` 호환 위해 모든 optional field 를 conditional
  spread 로만 set.
