purpose: |
  A single closed ControlRequest union (set_model / set_permission_mode /
  set_thinking / get_context_usage) + an exhaustive ALL_CONTROL_REQUEST_KINDS + a
  PURE planControlRequest(req, ctx) mapping each request to a typed ControlEffect.
  The planner invents NO vocabulary: model ids / permission modes / thinking levels
  are validated against caller-supplied allowlists, so the slice carries zero
  coupling. Fail-closed: off-allowlist/malformed ⇒ typed rejected effect; null/garbage
  never throws. Mirrors Claude Code's live control-request protocol. Folding the
  existing interrupt/cancel/set_mode/set_brief (SubmissionOp) under this umbrella is
  the documented consolidation follow-up.
