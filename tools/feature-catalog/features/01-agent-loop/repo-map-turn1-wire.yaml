notes: |
  THIS DISPROVES A PREMISE IN THE EXECUTION PLAN, which listed "env probe 신규 wiring"
  under work-not-to-do on the grounds that it "already exists in the shipping CLI". It
  does not — measured, not assumed.

  SCOPE IS THE REPO MAP ONLY. `probeTurnEnv` (platform / shell / git status / package
  manager) stays UNWIRED: it costs a `git status` per session and no knob asks for it.
  Recorded rather than smuggled in under a packet that excluded it.

  The scan adapter is built ONCE at module scope. It is stateless, and a fresh closure
  per `apply` made two applies structurally unequal — which the knob-SSOT hellgate
  correctly caught.

  A first cut of the hellgate asserted on `input.system` and reported the WORKING fix as
  broken: the env block rides the per-turn `<system-reminder>`, which is a MESSAGE. The
  suite now captures the whole wire.
