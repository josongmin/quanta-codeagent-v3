purpose: |
  `QUANTA_REPO_MAP` shipped as a registered runner knob with a schema, preset
  references, a documented purpose ("turn-0 orientation reduces wasted nav turns on
  SWE-bench"), a bounded probe, a scan adapter, a renderer and unit tests.

  EVERYTHING EXCEPT THE CALL. `probeRepoMap` and `probeTurnEnv` had ZERO production
  call sites — only tests. `TurnContextInput.env` had NO producer, so
  `renderEnvBlock(input.env)` always saw `undefined` and the `## Environment` block
  never rendered. Measured through the real loop: with `QUANTA_REPO_MAP=1` the
  per-turn wire was BYTE-IDENTICAL to the knob being unset. An operator who set it got
  nothing and believed they had enabled turn-0 orientation.

  The wire-or-delete question resolves to WIRE: the plumbing is complete and the gap is
  one missing call. Deleting would remove a documented, measurable bench lever because
  someone forgot a line.

  `prepareTurnContext` builds `env: { repoMap }` on TURN 1 ONLY, when both the caps and
  the injected scan port are present. The port is a new slot because the probe is
  deliberately IO-free — the `rg --files` call lives in the runner's `makeRepoMapScan`,
  mirroring how `probeTurnEnv` takes a pre-captured `git status`.

  The knob now sets BOTH halves. Either alone is a no-op, and only one of them looks
  like a bug — which is exactly the state it shipped in.
