id: agent-stream-callbacks
title: createStreamDispatcher factory (R2-B P3 byte-identical extract)
section: 1
subsystem: 코어 루프 SOLID 회복
order: 203
maturity: L4
status: new
purpose: |
  `streamConsume` (loop.ts) 의 인라인 dispatch 클로저 + 4 콜백을 단일 factory 로
  추출. 이전엔 ~200 LOC 의 collaborator wiring 이 host 함수를 압도해 stream
  lifecycle 의 본질이 가려졌다.

  5 콜백 묶음 (`StreamCallbacks`):
    - `dispatch`     — provider stream → tool dispatch path
    - `onTextDelta`  — assistant_text 누적
    - `onToolStart`  — tool_call 첫 emit (TTFT anchor)
    - `onInProgress` — provider in-progress 이벤트 fan-out
    - `onFirstChunk` — TTFT cell 마킹 (mutable one-slot)
  + private helper 2 개 (`tickToolDispatch` BudgetMeter fold,
   `skillScopeDeny` skill-allowlist deny block) 동반 추출.

  `TurnTimingAnchors` 캡슐: `firstTokenAtCell` 은 mutable one-slot cell. 첫 emit
  당 한 번 SET, 이후 read-only. ADR-0077 TTFT semantics 와 일치.

  Pure constructor: `createStreamDispatcher(session, state, anchors)` →
  `StreamCallbacks` 레코드. 호출 측은 `streamingTurn({...callbacks, ...})` 로
  spread 만 한다. 콜백 본문은 prior inline 클로저에서 VERBATIM 복사 — 동일
  optional-chain reads / 동일 emit 순서 / 동일 per-tool 분기 / 동일 `EXACTOPTIONAL`
  spread. 구조적 lift, behavioural redesign 아님.

  Cycle safety: `@/llm`/`@/security`/`@/observability` + 세 sibling
  (`./dispatch` / `./streaming-dispatch` / `./turn-context`) 만 import. loop ↔
  stream-callbacks 는 one-way edge (loop 가 US 를 import) — SCC guard whitelist
  업데이트 불필요.
