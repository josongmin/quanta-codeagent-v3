id: spec-to-test-gen-devin
title: Devin playbook spec → bun:test fixture auto-generation
section: 1
subsystem: User-authored playbook — spec→test gen (ADR-0253)
order: 253
maturity: L2
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: [absorbed:devin, surface:core, tier:core]
depends_on: [user-authored-playbook-frontmatter]
purpose: |
  Devin Playbook의 `spec` 필드 흡수 — spec → bun:test fixture text 1개를
  생성하는 작고 닫힌 포트. quanta 는 ADR-0203 에서 `successCriteria[]` 와
  `procedure[]` 를 선언적으로만 받았고, 이를 실행 가능한 test code 로
  자동 변환하는 슬라이스가 미흡수였다.

  슬라이스: 4 파일 (types / port / default-generator / index), 모두 leaf.
  @/agent, @/tool, @/permission, @/runtime, @/shared 어느 것도 import 안 함.

  핵심 invariant 7개:
   1. default-OFF — 호출 없으면 byte-identical
   2. 순수성 — no I/O, no global state (HELL-ST-14)
   3. closed-port — `SpecToTestGen` interface 통해서만 접근
   4. no-throw — `Result<TestFixture, GenError>` 로 surface
   5. escape-safe — `JSON.stringify` slice 로 모든 자연어 escape
   6. parses-clean — `Bun.Transpiler.scan` 으로 syntax 검증 (HELL-ST-08)
   7. fails-by-default — placeholder `expect(undefined).toBe("TODO: ...")` —
      caller 가 채우기 전까지 통과 안 함 (HELL-ST-09)

  생성 형식: `describe(name)` + `test(scenario.name)` + Given/When `// ` 주석 +
  then[] 각 항목당 `expect(undefined).toBe("TODO: <then>")` 라인. 빈 then[] 은
  smoke test 1 줄 주석만.

  filename sanitize: `[^A-Za-z0-9_]/g → "-"` collapse + trim, 빈 결과는
  `"spec"` 폴백. 한글 등 비-ASCII identifier → `spec.spec.ts` 폴백 (describe
  label 은 원문 유지).

  의도적 비포함: filesystem write (caller owns), 자동 dispatch (ADR-0241),
  assertion 자동 추론 (TODO placeholder), procedure→test 변환 (success-criteria만).
