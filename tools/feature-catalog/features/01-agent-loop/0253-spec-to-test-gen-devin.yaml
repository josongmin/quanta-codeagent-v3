    default: undefined
    purpose: 생성 파일 최상단 주석 (예: ADR 출처). 없으면 헤더 라인 생략.
deliberate_hold: null
notes: |
  MVP scope 1-method port. 후속 슬라이스가 `playbook.successCriteria` →
  `spec.scenarios` adapter 를 더해 자동 fixture 생성 워크플로우를 완성
  가능하지만 이 ADR scope 외. 슬라이스가 leaf 라 후속 흡수 (mutation
  testing hint / prosperity criterion 등) 가 사이드킥으로 추가 가능.

  Devin Playbook 의 `spec` 필드는 LLM 이 implementation 만 채우면 되는
  TDD-first 워크플로우의 핵심으로, quanta 의 ADR + hellgate-RED-먼저
  패턴과 정합. HELL-ST-09 의 default-fail invariant 는 placeholder 가
  실수로 통과되는 것을 막아 RED-GREEN cycle 을 강제한다.
