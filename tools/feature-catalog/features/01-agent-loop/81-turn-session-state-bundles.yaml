notes: |
  R6 type-widening track. Cycle safety: type-only imports from agent siblings
  (`./guards`, `./working-state`, …) — agent-import-cycle test가 `import type`을
  erased로 취급, 새 value edge 없음. `SkillGate` + `SkillTurnOverride` 도 이 모듈로
  이동 (loop.ts ↔ turn-context.ts 가치 사이클 회피); `loop.ts` re-export 로 기존
  consumer 임포트 경로 byte-identical.
