id: turn-session-state-bundles
title: TurnSession / TurnState parameter bundles (R2-B P1, 20→3 args)
section: 1
subsystem: Loop helper signatures (parameter bundling refactor)
order: 81
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: integrated
telemetry_keys: [gen_ai.response.time_to_first_token_ms, quanta.conversation.id]
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: static
owners: ['@songmin']
labels: [surface:core, tier:core]
depends_on: [secret-redaction-content-plane, plan-mode, turncontextinput-mode-reporules-workingstate-activeskills, codex-2-phase-consolidator, durable-state-belongs-in-workspace-files]
config_refs:
  env: [QUANTA_CAP_ENFORCE]
purpose: |
  `runTurn`/`streamConsume`/`applyAction`이 17-20 positional parameter로 자란 부채를
  두 readonly 번들로 정리 (R2-B P1). `TurnSession` — session-lifetime resources
  (config/specs/recorder/classifier/skillGate/activeSkills/archive/guards), `runAgent`
  invocation당 ONCE 구성, readonly 로 type boundary에서 재바인딩 차단. `TurnState`
  — turn-lifetime MUTABLE (wm/rec/breaker/toolHistory/workingState/collector/
  toolChoiceState/citations/onRedaction/onTurnTiming), 헬퍼가 in-place 변이.
  Default-OFF byte-identical (RFC §1.2): 모든 optional 필드가 `T | undefined`이라
  unconfigured session은 prior positional-arg와 동일한 `undefined` carry — type-only
  refactor, runtime erased, recorder/dispatch contract 무변경.
