purpose: |
  Cursor의 cursor-agent-exec 분리 구조적 교훈 흡수 — 오케스트레이션 평면(permission/HITL/
  plan-exit/hook)과 효과 평면(`registry.run`)을 typed `ToolRequest`/`ToolResultEnvelope`
  oneof로 격리. 같은 콜 사이트에 LocalEffectChannel(in-proc, M1 default) / Sandbox
  EffectChannel(Phase 2) / RemoteEffectChannel(future) 모두 plug → 로프는 substrate를
  알 필요 없음(relocatable). 계약 5개: (1) no-throw — executor 예외도 `{ok:false}`로
  정규화, (2) duration 측정은 채널 내부, (3) signal 전파, (4) byte-identical to current
  dispatch try/catch contract, (5) 정규화는 채널이 / 리덕션·typed-failure·evidence
  flatten은 dispatch 평면 유지(`dispatchToolInner`가 envelope을 `DispatchResult`로 래핑).
