notes: |
  2026-05-22 round shipped (module). 2026-05-23 L3→L4 — dispatch.ts execute()를
  LocalEffectChannel 경유로 wire(byte-identical: QuantaError/toError(e).message
  동일 어구, durationMs 채널 내부). 2026-05-23 L4→L5 — 실 LLM smoke battery
  13 시나리오(single/medium/tikitaka)가 모두 dispatch.ts execute()를 거치므로
  채널을 transitive로 exercise. tier-0 replay + tier-1 live(녹화된 실 모델 응답
  replay)가 채널의 no-throw/durationMs/normalize 계약을 매 dispatch 콜마다 검증.
  Phase 2 SandboxEffectChannel 추가 시 같은 콜 사이트 채널 생성자만 교체.
