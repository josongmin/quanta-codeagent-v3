id: playbook-nesting
title: Playbook nesting — bounded recursive call chain with cycle detection — ADR-0258
section: 1
subsystem: 스킬 — playbook-to-playbook nested invocation (Devin Playbooks nested-call absorption, ADR-0203 macro 1-pass와 직교)
order: 258
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env: []
owners: ["@songmin"]
labels: ["surface:core", "tier:1", "absorbed:devin", "slice:playbook"]
depends_on: [user-authored-playbook-frontmatter]
purpose: |
  ADR-0203의 macro 1-pass invariant 위에 직교적으로 추가되는 슬라이스 —
  procedure-level "playbook A가 playbook B를 호출 + 결과 변환" 패턴을
  bounded recursion + 명시적 cycle detection으로 봉합한다. Devin Playbook
  의 두 번째 recursion 형태 (구조적 call vs textual substitution)를 흡수
  하면서 macro 슬라이스는 손대지 않는다.
  주요 구성:
    - NestedPlaybookExecutor port — invoke(parentId, childId, args, depth)
      → Result<NestedResult, NestError>. 동기 + Result-typed.
    - NestError 4-arm closed union — depth-exceeded / cycle-detected /
      child-not-found / child-error. 모든 operational failure가 컴파일
      타임에 가시. throw 절대 없음.
    - cycle-detector — pure DFS visit-set helper. 의존 zero, I/O zero.
    - default-executor — childLookup 주입식, maxDepth default 3 (configurable).
      try/finally로 stack 누수 방지. 동기 JS semantics + per-top-level 리셋
      으로 "concurrent" serial invoke isolation 보장.
  Default-OFF: 어떤 host도 NestedPlaybookExecutor를 construct 안 함.
  procedure가 child playbook을 참조 안 하는 SKILL.md는 pre-0258 byte-identical
  (HELL-PN-10 봉인).
