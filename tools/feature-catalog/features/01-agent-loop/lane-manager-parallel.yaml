purpose: 'Promise.allSettled-shaped 병렬 집계 슬라이스 (ADR-0285). LaneManager port 2개 표면: spawnLane(spec)가 child agent 레인 하나를 띄워 opaque handle 반환, awaitAll(handles, timeoutMs?)가 모든 handle이 settle될 때까지 block 후 handle 입력 순서(완료 순서 아님)대로 LaneResult[] 반환. 5 contract: (1) NO-THROW public surface (레인 실패는 LaneResult{ok:false,error}); (2) ORDER PRESERVATION; (3) CASCADE (부모 abort 시 in-flight 전부 force-cancel, error.kind="aborted"); (4) CONCURRENCY CAP (maxConcurrency default 5 초과는 queue, queueMode:"reject"시 error.kind="concurrency-exceeded"); (5) ISOLATION. Plane-clean: @/agent/loop·dispatch·@/llm·@/tool import 0. Default-OFF: 미배선이면 import side-effect free라 byte-identical.'
evidence:
  code:
    - src/agent/lane-manager/default-manager.ts
    - src/agent/lane-manager/port.ts
    - src/agent/lane-manager/types.ts
    - src/agent/lane-manager/index.ts
  adrs: []
  tests:
    unit:
      - tests/unit/agent/lane-manager-hellgate.test.ts
    integration: []
    contract: []
knobs: ["QUANTA_LANE_MAX_CONCURRENCY"]
deliberate_hold:
  reason: 'Built-not-wired by design (Default-OFF). The agent loop never constructs a manager; the opt-in seam is a LaneManager injected through AgentConfig by a surface. QUANTA_LANE_MAX_CONCURRENCY is documented in types.ts as the cap override but has NO reader in src/ yet — it activates only once a surface wires the factory.'
  promotion_path: 'Land a host call site (apps / future /lanes slash) that injects defaultLaneManager into AgentConfig + a reader for QUANTA_LANE_MAX_CONCURRENCY; then promote to L4.'
notes: 'ADR-0285. Hellgate seals 15 invariants (HELL-LM-01..15): parallel success, partial-fail isolation, all-fail typed Err, awaitAll timeout straggler, parent-abort cascade, 100-lane cap (peak ≤ cap), spawn-fail sibling survival, input-order ordering, 4-arm error exhaustiveness, import side-effect freedom, deterministic awaitAll, zombie-lane no-mutation, 1000-lane no-leak. LaneError = CLOSED 4-arm union (spawn-failed|timeout|aborted|concurrency-exceeded) with a two-way drift guard.'
