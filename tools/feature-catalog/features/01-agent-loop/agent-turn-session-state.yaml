id: agent-turn-session-state
title: TurnSession + TurnState readonly param bundles (R2-B P1)
section: 1
subsystem: 코어 루프 SOLID 회복
order: 201
maturity: L4
status: new
purpose: |
  `runAgent` 루프 핵심 helper 들의 positional-param explosion 해소: `runTurn`
  (20-param), `streamConsume` (13-param), `applyAction` (11-param) 을 두 개의
  readonly struct 으로 그룹화해 3/4/6 param 으로 축소.

  두 번들 (cohesion-based grouping):
    - `TurnSession` — session-lifetime resources. `runAgent` 진입 시 ONCE 구성,
      모든 turn 을 통과해 mutate 없이 전달. `readonly` 으로 "configured once"
      불변식을 타입 경계에서 강제 — turn helper 가 recorder/skill-gate 등을
      재할당할 수 없음.
    - `TurnState` — turn-lifetime MUTABLE 상태. working memory, recovery counter,
      breaker strike, tool-history log, ToolChoice TTL 플래그. 루프 helper 가
      in-place mutate; 외부는 canonical pointer (예: `state.wm`) 로 임의 시점
      관찰 가능.

  Default-OFF byte-identical (RFC §1.2): 모든 optional 필드가 `T | undefined`
  이므로 unconfigured session 은 이전 positional 시그니처와 동일한 `undefined`
  배치를 carry. 번들은 pure types → 런타임 erase → recorder/dispatch 계약에
  구조적 invisible.
