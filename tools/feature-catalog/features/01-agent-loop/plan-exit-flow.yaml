      - tests/unit/plan-exit-flow.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  ADR-0062 absorb #3 wire-up — three-way decision (62-plan-exit-three-way) 의 짝.
  Plan-mode 구조화 feature (06-tier1/03-plan-mode)의 P6 outcome router가 본 모듈
  로 분리됨 — orchestration plane이 PlanStore mutation을 직접 호출하지 않고 본
  flow에 위임.
