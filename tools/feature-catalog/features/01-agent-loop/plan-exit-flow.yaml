id: plan-exit-flow
title: Plan-exit flow orchestrator (ADR-0062 wire-up)
section: 1
subsystem: Plan-exit lifecycle 흐름 (ADR-0062 absorb #3)
order: 62
maturity: L4
status: stable
owners: ["@songmin"]
labels: [surface:core, tier:core]
purpose: |
  Plan-exit three-way (approved/rejected/changes_requested)의 셋 평면을 잇는 pure async
  orchestrator. 이미 shipped된 3개 조각 — plan-exit decision (62-plan-exit-three-way),
  plan store mutation (PlanStore.clear/freeze/preserve), follow-up router — 을 하나의
  router로 묶음. approved → freeze (plan을 mutable에서 immutable로) / rejected →
  clear (PlanStore 리셋) / changes_requested → preserve + feedback inject. Dispatch
  평면이 set_mode op을 소비할 때 본 orchestrator가 PlanStore 측 effect를 결정.
  ADR-0086 plan-exit decision과 ADR-0036 dispatch-block과 직교 — 본 모듈은 *어떻게*
  세 outcome이 PlanStore에 반영되는지의 flow.
