notes: |
  L4 wire-up (2026-05-23):
  - `AgentConfig.collaborationMode?: "default" | "plan"` (default-OFF; absent ⇒
    "default" via `resolveCollaborationMode` projection). Explicit field wins;
    falls back to 4-mode `mode === "plan"` ⇒ "plan", else `planMode === true`
    ⇒ "plan", else "default". `mode === "review"` / `"audit"` project to
    "default" — those are PROMPT postures, not DISPATCH postures (host opts
    into dispatch posture explicitly).
  - `dispatchToolInner` calls `checkDispatchAllowed` AFTER `registry.has` and
    BEFORE dedup/admissibility/execute. Read-only fast path: when
    `registry.isReadOnly(name) === true` the seam is skipped (the table is
    fail-closed for MUTATING tools, not for safe ones — custom read-only
    test tools still work in plan posture).
  - Deny carries the typed `PlanModeMutatingBlockedError` or
    `UnknownToolError` message via `deny(call.id, reason.message,
    "mode-blocked")`. The legacy admissibility-gate's `plan-blocked` arm
    is now DOMINATED by the seam guard for dispatchTool callers (the gate
    arm remains reachable for any external host that invokes
    `runAdmissibilityGate` directly).
  - SOTA (Codex): dispatch-time + stateless (no per-turn unwinding);
    transitions only affect calls AFTER the flip. Cluster D Feature 1.
