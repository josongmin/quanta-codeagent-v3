purpose: Plan collaboration mode blocks every mutating tool at the dispatch seam via an explicit per-tool table (write/edit/scripted_replace/apply_patch/bash/update_working_state/git_commit/git_branch_switch). Unknown tools throw UnknownToolError rather than silently passing. Mode transitions are sticky and only flip on a developer-channel mode=plan / mode=default directive. L4 (2026-05-23) wires `checkDispatchAllowed` at `dispatch.ts` after `registry.has`, with a read-only fast path that defers to `registry.isReadOnly()` so custom read-only tools pass through without table membership.
