id: plugin-app-resolver-folder-git
title: "@folder + @git mention resolvers (§10.3 Cursor parity)"
section: 1
subsystem: Mention-driven explicit context injection (folder + git resolver impls)
order: 103
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: integrated
config_refs:
  env:
    - QUANTA_MENTION_FOLDER
    - QUANTA_MENTION_FOLDER_MAX_ENTRIES
    - QUANTA_MENTION_GIT
    - QUANTA_MENTION_GIT_MAX_BYTES
    - QUANTA_PLUGIN_POINTERS
owners: ["@songmin"]
labels: ["surface:core", "absorbed:cursor", "default-on"]
depends_on: [async-mention-resolver-and-file-symbol]
surface_integration:
  cli: partial
  web: partial
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "@folder is LIVE on the CLI/host session path: session-host.ts → context-binding.ts wires installCliMentionInjector into every built AgentConfig (lines 358/381), which calls buildDefaultMentionResolver({cwd, env}); folderDeps activates the createFolderResolver (default-ON knob, root=cwd, no extra provider) so @dir/ mentions list + inject. @git is PARSED + composite-dispatch-ready but null at runtime: the live call sites (mention-wire.ts, agent-config-assembler.ts) thread cwd + buildMentionSymbolDeps (lsp/semantic only) and never supply a GitContextProvider, so gitDep returns undefined ⇒ resolveGit absent ⇒ @git resolves null. See deliberate_hold."
    web: "Same mention-wire composition path as the CLI (host-runtime AgentConfig); @folder lists from cwd, @git resolves null for the identical provider-unwired reason. No separate web backend."
purpose: |
  §10.3 — the `@folder` and `@git` mention-resolver IMPLs (Cursor `@Folders`
  / `@git` parity). Two `MentionResolverPort` method factories that the
  composite resolver attaches when their dep is supplied; the seven-kind
  parser (ADR-0418) emits `folder` (a path ENDING in `/`) and `git` (the
  reserved `@git` literal / `@git:(status|diff|log)`) tokens that dispatch
  here.

  `createFolderResolver` (folder-resolver.ts) — async directory listing.
  Captures a workspace `root`, resolves a `@dir/` target relative to it, and
  renders a BOUNDED, DETERMINISTIC listing as the mention bodyText: dirents
  byte-sorted, dirs suffixed `/`, capped at `maxEntries` (default 200) with a
  trailing `… (+N more)` marker over-cap. fs-jail: `fs.realpath` canonicalises
  both sides and `is-path-inside` rejects any target outside the captured root
  (symlink escapes followed + rejected). NO-THROW — missing dir / non-dir
  target / EACCES / outside-jail / empty-or-non-string target / absent root all
  degrade to `null` (skip), never a throw.

  `createGitResolver` (git-resolver.ts) — git-context body. The slice NEVER
  spawns git itself; the caller INJECTS a `GitContextProvider` (an async port
  the runner backs with `@/runtime`'s `runShell`; tests inject a canned
  provider for deterministic replay). The subcommand is a CLOSED enum
  (`status|diff|log`) the parser guarantees — the resolver re-validates against
  a `VALID_SUBS` Set and rejects any unknown subcommand with no fallback
  (a hostile direct caller can't smuggle an arbitrary arg). The provider's text
  is trimmed (blank ⇒ `null`, i.e. clean tree / non-repo) and truncated to
  `maxBytes` (default 32 KiB) on a LINE boundary; truncation is BYTE-based
  (Buffer slice + decode replaces a split multibyte sequence with U+FFFD) so
  the cap can't be over-run and a surrogate pair can't be split. NO-THROW — a
  throwing / rejecting provider logs a warn and yields `null`.

  Both resolvers are second-line-guarded by ADR-0325's `safeCall` wrapper
  (belt-and-suspenders) and gated default-ON per kind: `QUANTA_MENTION_FOLDER`
  / `QUANTA_MENTION_GIT` (=off opts that kind out). The composite attaches a
  method ONLY when its dep is supplied, so omitting both keeps the pre-§10.3
  port shape byte-identical (no `resolveFolder` / `resolveGit` key) — proven by
  the byte-identity D1/D2 cases.
evidence:
  code:
    - src/agent/plugin-app-resolver/folder-resolver.ts
    - src/agent/plugin-app-resolver/git-resolver.ts
    - src/agent/plugin-app-resolver/composite-resolver.ts
    - src/agent/mention-runner/default-resolver.ts
    - src/host/runtime/internal/mention-wire.ts
  adrs:
    - docs/decisions/0418-async-mention-resolver-and-file-symbol.md
    - docs/decisions/0336-plugin-app-resolver.md
    - docs/decisions/0325-mention-based-explicit-injection.md
  tests:
    unit:
      - src/agent/plugin-app-resolver/__tests__/folder-git-resolver.hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_MENTION_FOLDER
    where: agent/mention-runner/default-resolver.ts
    default: 'on'
    purpose: '@folder directory-listing resolver (default ON; =off ⇒ folder mentions skipped). Uses cwd as the jail root — no extra provider needed, so it resolves LIVE at the CLI.'
  - name: QUANTA_MENTION_FOLDER_MAX_ENTRIES
    where: agent/mention-runner/default-resolver.ts
    purpose: '@folder listing entry cap before the … (+N more) marker. Unset ⇒ lib default DEFAULT_FOLDER_MAX_ENTRIES (200).'
  - name: QUANTA_MENTION_GIT
    where: agent/mention-runner/default-resolver.ts
    default: 'on'
    purpose: '@git git-context resolver (default ON; =off ⇒ git mentions skipped). NO-OP at the live CLI/host layer until a caller threads a GitContextProvider — gitDep returns undefined without one, so @git resolves null. See deliberate_hold.'
  - name: QUANTA_MENTION_GIT_MAX_BYTES
    where: agent/mention-runner/default-resolver.ts
    purpose: '@git body byte cap before line-boundary truncation. Unset ⇒ lib default DEFAULT_GIT_MAX_BYTES (32 KiB).'
  - name: QUANTA_PLUGIN_POINTERS
    where: skill/plugin-loader.ts
    purpose: 'Gates §2.4 plugin hooks/apps pointer RESOLUTION the broader plugin-app-resolver barrel serves; default-OFF (no resolution unless gate-on).'
deliberate_hold:
  reason: |
    @git is parsed and the composite resolveGit dispatch is wired, but the
    LIVE composition sites (mention-wire.ts installCliMentionInjector and
    agent-config-assembler.ts) thread only cwd + buildMentionSymbolDeps
    (lsp/semantic ports). Neither supplies a `GitContextProvider`, so
    gitDep() returns undefined ⇒ the composite has no resolveGit key ⇒ every
    @git mention resolves null at runtime. The resolver IMPL + knob + tests
    are complete (and exercised via injected providers in the hellgate);
    only the runner-backed `runShell` provider is not threaded at the
    assemble/host layer yet — an honest unwired-provider seam, NOT broken code.
  promotion_path: |
    Thread a runShell-backed GitContextProvider through buildMentionSymbolDeps
    (or a sibling deps builder) at both buildDefaultMentionResolver call sites
    (mention-wire.ts + agent-config-assembler.ts), then flip
    surface_integration.cli/web to full and drop this hold — mirroring how
    ADR-0423 closed @symbol by threading the semantic backend at both sites.
notes: |
  Cursor @-mention parity, §10.3 extension of the ADR-0418 seven-kind enum
  (folder + git added to skill|plugin|app|file|symbol). @folder is the only new
  §10.3 kind that needs no extra provider (cwd is the jail root) so it is LIVE
  by default; @git is impl-complete but provider-unwired at the host layer
  (see deliberate_hold). Both resolvers live in the
  src/agent/plugin-app-resolver/ barrel (re-exported from index.ts) and are
  composed via createCompositeMentionResolver, which only attaches a method
  when its dep is supplied — preserving the legacy 3-kind port shape when
  omitted (byte-identity D1/D2). NO-THROW + bounded-output is the shared
  defensive contract across both impls.
