purpose: |
  `src/apps/cli/repl.ts` (1.3K LOC GodClass — runRepl 의 cognitive complexity 33+)
  를 21 개의 single-responsibility 모듈로 분해해 SRP/OCP/cognitive-budget 회복.
  Barrel-as-host 패턴: 기존 `repl.ts` 는 export 시그니처를 그대로 보존하면서 추출된
  helper 들을 in-line 소비 (외부 consumer 0 변화).

  추출 카테고리 (21):
    Driver/Loop (5): run-repl / readline-loop / interactive-driver / oneshot-driver / session-router
    Lifecycle/Wire (6): lifecycle-wire / status-pills-wire / idle-wire / turn-indicator-wire
                       / turn-summary-wire / mcp-surface-wire
    Per-turn (4): turn-cancel / turn-render / metrics-sink / image-queue-wire
    Adapter (3): prompt-source / skills-callback / resume-fsm
    Bootstrap (3): assemble-context / seed-images / usage

  cognitive-complexity 회복: runRepl 33 → 3 (helper 마다 1 책임). 21 모듈 평균 ~70
  LOC, 최대 332 (assemble-context, agent assembly 만 담당). Tests + consumer
  signature 완전 보존 — `import { runRepl, runReplLoop, runReplLoopRaw, runSessionMain,
  runSlashMain } from "@/apps/cli/repl"` 가 byte-identical 그대로 작동.

  Slice discipline: 모든 추출 모듈은 `@/apps/cli/repl/` 내부에서만 sibling import +
  apps/cli 형제 + `@/agent`|`@/llm`|`@/observability`|`@/permission`|`@/runner`|
  `@/shared`|`@/stream` 로 한정. 다른 apps (`apps/bench`/`apps/agent`) 와의 cross-app
  의존 0.
