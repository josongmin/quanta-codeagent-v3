purpose: |
  Roo Boomerang/Orchestrator의 streaming 분기 흡수 (ADR-0218 result-only sibling).
  부모가 child subagent의 progress chunk를 점진적으로 consume하는 AsyncIterable
  surface. closed 3-arm BoomerangChunk (progress / result / error 6-arm) + closed
  port + default-OFF. AsyncIterable cleanup으로 mid-stream abort backpressure-safe,
  consumer break/return 시 producer abort() hook 1회 + no zombie promise. 기존
  ADR-0218 path는 byte-identical로 보존 (loop 0 touch).
