notes: |
  e2e 회귀 가드: tikitaka smoke fixture 2종 — 14-refusal-handled (Gap-1 happy
  path: refusal → terminal error, no retry consumption) + 15-refusal-mid-tool
  (refusal과 tool_use가 같은 stream에 공존하는 critical invariant — Gap-5에
  의해 bash 실제 실행 안 됨; expect.json이 `toolCalls.forbidden:["bash"]` +
  `counts.bash.max:0`로 PIN). 181 hell-case 분포:
  recovery-hell(30) · assemble-thinking-hell(27) · anthropic-thinking-hell(21) ·
  openai-thinking-hell(21) · confirm-decision-hell(55) · admissibility-deny-steer-hell(27).
  ThinkingBlock의 wire 재직렬화는 Anthropic signature / OpenAI re-encode 양쪽
  어댑터 contract test로 보장. 추가 PIN 3종 — orphan signature_delta silent
  drop, prototype-pollution narrow-to-deny, OpenAI content_filter last-wins.
