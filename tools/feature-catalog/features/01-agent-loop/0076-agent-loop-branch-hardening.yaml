surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 13/14 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "user value (refusal terminal, deny_and_steer, thinking carry-over) rides recovery/decision/error-internal paths; deny-steer and refusal signals are not among the 6 bridged events at context-binding.ts:1052-1106, no distinct browser affordance"
purpose: |
  docs/analysis/code-agent-loop/{claude,codex,cursor}.md 3-doc gap analysis로 식별한 runAgent
  loop의 4개 결함 중 3개 shipped + 1개 deferred. Gap-1 — Provider refusal/abnormal stop:
  decideOnAssembled에 stopReason==="refusal" 신규 브랜치(max_tokens / tool_use / empty 앞)
  → terminal {do:"error", reason:"Model refused to continue …"}, outputContinues /
  malformedRetries / consecutiveEmpties 미소비. pre-ADR fall-through는 refusal 텍스트를 정상
  completion으로 위장(가장 ROI 높은 fix). pause_turn / content_filtered / guardrail_intervened는
  dead code 회피 — 서버 도구 / Bedrock guardrail 흡수 시 재평가. Gap-2 — Reasoning/thinking
  carry-over: StreamEvent에 thinking_delta + signature_delta 추가, assembleFromEvents가
  연속 delta를 1 ThinkingBlock으로 fold + signature를 last ThinkingBlock에 부착, 어시스턴트
  메시지 prepend로 provider order(thinking before text/tool_use) 보존. Anthropic SSE / OpenAI
  reasoning summary 어댑터 emit. multi-turn carry-over는 자동 — ThinkingBlock이 메시지에 타고,
  wm.append → 다음 턴 StreamInput.messages → 어댑터가 wire 형식으로 재직렬화. Gap-4 —
  deny_and_steer verb: ConfirmDecision discriminated union {allow|deny|deny_and_steer{steer}}
  + AgentConfig.onConfirm 시그니처 확장 + normalizeConfirm bridge(boolean ↔ ConfirmDecision,
  레거시 caller byte-identical). admissibility-gate의 always-confirm 브랜치가 deny_and_steer
  시 deny DispatchResult를 emit하면서 steer를 result envelope steerInjection?: string에 attach.
  Gap-3 — Submission op dispatcher: 6-variant union shape는 존재하나 entry-point 분기는 deferred
  (loop.ts 동시 co-development 회피).

  Gap-5 — Refusal in-stream tool short-circuit (self-audit follow-up, 2026-05-22):
  streamingTurn의 Phase 3 (drainDeferredSlots — barrier-blocked unsafe tool
  dispatch)가 `stopReason === "refusal"`이면 SKIP. 자체 audit 발견 — 기존
  Gap-1은 `decideOnAssembled`(post-stream)에서만 단락하므로 mid-stream tool_use
  가 deferred slot으로 들어간 후 message_stop=refusal이 와도 bash가 실제로
  실행되었음(smoke 15-refusal-mid-tool가 매 CI run마다 `echo malicious` 실행).
  Phase 4는 dispatched slot(promise!==undefined)만 collect — orphan tool_use
  블록은 message.content에 남지만 runStep의 error 분기가 wm.append 없이 즉시
  종료하므로 carry-over 오염 없음. byte-identical: non-refusal 경로 변화 0.

  Hell-gate hardening (181 hell case + 2 e2e smoke): 6 신규 hell-test file이
  3개 추가 invariant를 PIN — (i) signature_delta가 thinking_delta 없이 도착하면
  ThinkingBlock 합성하지 않고 silently drop (orphan은 후속 thinking에 back-attach
  안 함), (ii) ConfirmDecision normalize는 `{__proto__:{decision:"allow"}}`형
  prototype-pollution 입력에 대해 보호적으로 deny로 narrow, (iii) OpenAI
  content_filter finish_reason은 last-wins. 부분 와이어링(steerInjection emit OK /
  loop consumer 미연결)은 G-1~G-1d 4-test partial-wiring guard로 파일 grep 기반
  regression pin — 향후 wiring PR이 guard를 의식적으로 갱신하지 않으면 자동 실패.
