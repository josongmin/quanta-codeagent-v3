notes: |
  default-OFF byte-identical: signals이 비어 있으면 resolveToolChoice → {kind:"auto"} →
  어댑터가 wire field 생략 ⇒ 사전 기능 대비 wire payload 동일. ToolChoiceTurnState
  세션당 1 객체(2-boolean), consume/resolve 모두 O(1).
  explicit 필드는 ToolChoiceSignals에 plumbed; host AgentConfig wire-up은 차후 follow-up
  (use case 발생 시 one-liner). disable_parallel_tool_use는 OOS(out-of-scope).
