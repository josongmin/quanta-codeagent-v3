id: tool-choice-orthogonal-gate
title: tool_choice forcing as an orthogonal control gate (pre-call plane)
section: 1
subsystem: 에이전트 루프 — 사전 호출 tool_choice 게이트 (ADR-0079)
order: 79
maturity: L4
status: new
owners: ["@songmin"]
labels: [surface:core, tier:core]
purpose: |
  사전 호출 평면(pre-call plane)으로 모델의 tool_use 선택 자유도를 게이트.
  admissibility-gate(사후/post-call)와 직교(orthogonal): 두 평면이 같은 tool_use 경계의
  반대쪽에서 동작.

  resolveToolChoice(signals)는 순수 함수 (IO 0, no clock, no env, no registry). 닫힌
  ToolChoiceSignals 구조체 위의 4-way 우선순위:
    1. explicit !== undefined        → explicit
    2. verifyGuardViolated === true  → {kind:"any"}   (force re-verify)
    3. closeoutAttempted === true    → {kind:"none"}  (force termination)
    4. otherwise                     → {kind:"auto"}  (default)

  닫힌 discriminated ToolChoice 유니온 (auto|any|none|tool) + switch never default.

  Signal 생명주기 (1-turn TTL): verify-guard / closeout-guard가 finish-intent에서
  ToolChoiceTurnState 플래그를 ARM. runTurn 의 for(;;) 매 LLM-call 진입에서
  consumeTurnSignals이 단일 canonical clear point로 읽고 비움. 같은 플래그가
  두 번 consume될 수 없음.

  어댑터 매핑 (auto ⇒ wire field 생략으로 default-OFF byte-identical 유지):
    Anthropic: auto⇒omit, any⇒{type:"any"}, none⇒{type:"none"},
               tool⇒{type:"tool",name} (미등록 name ⇒ throw)
    OpenAI:    auto⇒omit, any⇒"required", none⇒"none",
               tool⇒{type:"function",function:{name}} (미등록 name ⇒ throw)

  no silent fallback — tool name이 request.tools에 없으면 어댑터에서 throw.
