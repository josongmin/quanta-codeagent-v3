  Hellgate 15 case: mint shape (HELL-IP-01) / 2회 mint distinct (-02) / release →
  remint (-03) / 40 mint exhausted (-04) / unknown release Err (-05) / inUse accurate
  + defensive copy (-06) / AgentRole 4-arm 컴파일타임 exhaustive (-07) / 풀 정확히
  39 entry (-08) / 모든 entry가 literal union (-09) / round-robin 결정성 (-10) /
  39 distinct sequential mint (-11) / barrel import no side effect (-12) / mint("none")
  pool slot 미소비 (-13) / 1000 cycle no leak (-14) / release("__none__") no-op (-15).
  Codex의 `nickname_candidates` 문자열은 upstream 바이너리에 인라인 미반영 —
  memory note `codex-subagent-tools` 의 "거장 39명" 대체 풀 채택 (수학자/CS 개척자).
  순서는 결정적 round-robin 순서로 픽스 (HELL-IP-10이 잠금).
