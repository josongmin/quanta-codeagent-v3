id: conversation-checkpoint
title: Conversation checkpoint store — messages[] snapshot/restore primitive
section: 1
subsystem: 대화 롤백 (ADR-0124)
order: 93
maturity: L3
status: refined
purpose: |
  Pure in-memory snapshot/restore primitive for the agent's `messages[]`
  history — the conversation-side counterpart to `ShadowOdb` (which snapshots
  files). SOTA absorption: Hermes Agent's `/rollback` + Cline's "Restore
  Files & Task" restore BOTH file state and conversation context. quanta had
  file rollback (ADR-0118) but no conversation primitive — this is the
  missing half. Plane-clean (imports only `@/llm` for the message shape).
  No-throw on the public surface. Default-OFF — nothing in the loop
  instantiates this today; callers (apps/agent bootstrap, future `/rewind`,
  future auto-recovery hook) opt in by constructing
  `defaultConversationCheckpointStore()` and recording at turn boundaries.
evidence:
  code:
    - src/agent/conversation-checkpoint.ts
  adrs: [124]
  tests:
    unit:
      - tests/unit/conversation-checkpoint-hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold:
  reason: 'Persistence (SQLite/disk) is a follow-up. Today this is in-memory only — restore survives only the current process.'
  promotion_path: 'Wire a `ConversationCheckpointPort` with a SQLite-backed impl when the consumer (`/rewind` slash + auto-recovery) lands.'
notes: 'Voice-match ADR-0123 / ADR-0128 / ADR-0125 — helper-only, deferred-wire posture. SHALLOW-frozen snapshots: caller can keep mutating their array without corrupting the stored snapshot; deep freeze intentionally NOT done (inner Message objects are caller-owned).'
