id: plan-exit-three-way
title: Plan 모드 3-way exit (approve / reject / request-changes)
section: 1
subsystem: 협업 모드 (v0.dev 흡수, ADR-0063)
order: 62
maturity: L4
status: refined
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: static
owners: ["@songmin"]
labels: [absorbed:v0, surface:core, tier:core]
depends_on: [agent-dispatch-core, agent-loop-branch-hardening, mode-posture-hitl-4-tier-permission-policy-harddeny-redundan, plan-mode-dispatch-block, secret-redaction-content-plane]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 3/3 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "plan exit rides plan_* events dropped at context-binding.ts default arm; web approval card collapses to approve|deny only, so request-changes never reaches the browser"
purpose: |
  v0.dev PlanModeExit{Approve,Reject,RequestChanges} 흡수 — plan 모드 종료를 기존
  2-way(approve/reject)에서 3-way로 확장. changes_requested는 feedback 필수(빌더가
  강제, 위반 시 throw)이며 agent가 plan을 수정하고 plan posture 유지(planExitStaysInPlan).
  approve만 mutation 허용(planExitAllowsMutation), reject는 plan 폐기 후 종료.
evidence:
  code:
    - src/agent/plan-exit.ts
    - src/agent/plan-exit-flow.ts
    - src/agent/dispatch.ts
  adrs: [63, 86]
  tests:
    unit: [tests/unit/plan-exit.test.ts, tests/unit/plan-exit-flow.test.ts, tests/unit/request-plan-exit-tool.test.ts, tests/unit/agent/plan-exit-lifecycle-hell.test.ts]
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: 'mode.ts의 CollaborationMode(default|plan)와 직교 — plan-exit는 plan posture를 어떻게 떠나는지를 결정.'
