id: cap-enforcer
title: Cap-as-instruction enforcer — 3rd-channel NextAction adherence
section: 1
subsystem: 도구 hint 강제 (ADR-0062 rule #3)
order: 90
maturity: L4
status: refined
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env: [QUANTA_CAP_ENFORCE]
owners: ["@songmin"]
labels: [surface:core, tier:core]
depends_on: [agent-types-split, secret-redaction-content-plane, plan-mode, agent-loop-branch-hardening, ide-context-provider-seam]
purpose: |
  Session-scoped state machine that detects when the model IGNORES a tool's
  `NextAction` hint by re-calling the same `toolName:targetPath` without
  applying the suggested parameter change. Closed-union over `NextAction.kind`
  (`increase_max_depth` / `raise_max_files` / `narrow_path`) so a new variant
  is a tsc-enforced extension. Default-OFF — gated on `QUANTA_CAP_ENFORCE`
  env (or `AgentConfig.capEnforce`); off ⇒ never instantiated and dispatch is
  byte-identical. O(1) check + record helpers, no allocation off the happy
  path.
