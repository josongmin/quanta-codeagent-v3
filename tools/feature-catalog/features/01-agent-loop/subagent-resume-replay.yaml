  promotion_path: 'Wire the resumer into the subagent run-ledger / restart bootstrap (detect interrupted child handles → resumeInterruptedHandles with the recorded tool-history); then promote to L3/L4.'
notes: 'Sibling of session crash-resume (session-resilience §13.2) but for CHILD-AGENT handles: the durability axis is the recorded tool-history, and the crux is idempotency (no double side-effect on replay).'
