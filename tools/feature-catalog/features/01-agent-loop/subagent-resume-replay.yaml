purpose: 'Subagent crash-resume + tool-replay primitive. resumeInterruptedHandles re-drives child-agent handles that were interrupted (hard crash / restart) using a recorded tool-history: idempotency (a tool call already recorded as completed is NOT re-executed — replay returns the stored result), policy (which handles are resumable), and tool-replay (feed the stored tool outcomes back so the child continues from where it died rather than re-running side-effecting tools). Built + hellgate-tested (resume + replay) but DELIBERATELY UNWIRED — no host constructs the resumer yet; absent wiring is byte-identical. Catalogued (not hidden) so the orphan is visible with its reason.'
