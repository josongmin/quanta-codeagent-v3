id: subagent-resume-replay
title: Subagent restart recovery — persisted-handle sweep (replay held)
section: 1
subsystem: Subagent crash recovery
order: 456
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless, batch, daemon, ide]
configurable: integrated
owners: ["@songmin"]
labels: [surface:core, default-off]
depends_on: [subagent-persistence-store]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-07-19"
  evidence:
    cli: "The shared execution plane calls resumeInterruptedHandles under QUANTA_SUBAGENT_RESUME. The default policy fail-closes: public tool metadata cannot authorize a re-fork."
    web: "no web recovery surface."
purpose: |
  On restart, the host can load persisted interrupted subagent handles through
  the shared execution plane under QUANTA_SUBAGENT_RESUME. The live default
  policy marks stale/looped handles failed and leaves fresh handles inspectable;
  it does not trust LLM-controlled metadata.idempotent to re-fork work. The
  helper-only conversation and tool-history replay modules remain unwired, so
  no transcript/tool replay claim is made for the product path.
evidence:
  code:
    - src/runner/session-execution-plane.ts
    - src/host/runtime/internal/context-binding/base.ts
    - src/agent/subagent-resume/resumer.ts
    - src/agent/subagent-resume/policy.ts
    - src/tool/subagent-bg/fork.ts
  adrs: []
  tests:
    unit:
      - tests/unit/runner/subagent-resume-wire.test.ts
      - tests/unit/subagent-resume-hellgate.test.ts
      - tests/unit/subagent-background-hellgate.test.ts
    integration: []
    contract: []
knobs: []
config_refs:
  env: [QUANTA_SUBAGENT_RESUME]
deliberate_hold:
  reason: "Conversation replay and tool-history replay have no production writer/consumer. A trusted durable replay authorization plus an explicit confirmation surface is required before automatic re-fork can be enabled."
  promotion_path: "Add a host-issued durable replay-eligibility record, replay/history producer and consumer, then prove a restart cannot repeat a side effect before permitting automatic re-fork."
notes: "Legacy persisted metadata.idempotent is deliberately ignored by the default policy, and new public subagent_fork input rejects that reserved key."
