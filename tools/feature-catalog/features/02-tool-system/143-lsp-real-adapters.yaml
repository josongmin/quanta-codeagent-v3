id: lsp-real-adapters
title: LSP default-adapter real wire — code-action / format / signature-help / applyWorkspaceEdit (ADR-0143)
section: 2
subsystem: LSP wire layer (ADR-0143)
order: 143
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: partial
modes: [n-a]
configurable: n-a
owners: ["@songmin"]
labels: [surface:cli]
configurable: static
purpose: |
  Promotion-path closer for ADR-0141: replaces the three `not-implemented`
  default adapters (code-action / format / signature-help) with real
  `LspClient` delegations. Adds 4 wire methods to `LspClient`
  (`requestCodeActions` / `requestFormatting` / `requestSignatureHelp` /
  `applyWorkspaceEdit`) mirroring the existing nav-RPC pattern (lazy
  `ensureOpen` → `callOrNullOnUnsupported` → null on -32601/-32602/"not
  supported"). `applyWorkspaceEdit` is client-side write only — no wire —
  via new `writeFileText` protected seam (Bun.write delegation) +
  `applyEditsToText` helper that sorts edits descending by start offset to
  avoid offset shift. Code-action wire result is narrowed to exact
  port-level 9-value `kind` (LSP server returns prefix-match — e.g.
  `refactor.extract` shouldn't surface on `refactor.inline` query).
  Adapters take duck-typed `*LspClient` interfaces so a `FakeLspClient`
  satisfies via structural matching — no subclass needed.
