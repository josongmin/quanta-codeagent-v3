knobs: []
notes: |
  Lifts ADR-0141 L3 stub posture → L4 wire. Adapter files still import
  only `../ports/*-port` (+ duck-typed interface) — they do NOT
  type-import the `LspClient` class so the closed-port boundary stays
  intact; callers wire via `new DefaultCodeActionAdapter(lspClient)` and
  structural matching takes care of it.
