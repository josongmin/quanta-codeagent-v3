depends_on: [assert-never-exhaustiveness, byte-stable-string-comparator, errors-helper-fix, git-runner-cancellation-signal, runtime-config-ssot]
purpose: |
  Surfaces the pure conflict parser (`./conflict-parser`) as a typed first-class
  git tool so the `fix-merge-conflicts` skill (and any future loop consumer)
  can list structured merge conflicts in working-tree files without each caller
  hand-rolling a marker scan. Two input modes — explicit `paths` (REPO-RELATIVE;
  rejects absolute and `..`-bearing paths at parse time before the runner is
  ever invoked) or auto-discover via `git status --porcelain=v1` filtering rows
  whose X or Y char is `U` (the unmerged states UU/AA/DD/AU/UA/DU/UD).
  READ-ONLY + CONCURRENCY-SAFE — the only spawn is `git status --porcelain=v1`
  (no mutation, no `git merge`); per-file `Bun.file(...).text()` reads are the
  only filesystem touches and are confined to `ctx.cwd` via `path.join`.
