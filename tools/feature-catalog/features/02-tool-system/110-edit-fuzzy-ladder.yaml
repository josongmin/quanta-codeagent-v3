id: edit-fuzzy-ladder
title: applyFuzzyEdit — 3-rung exact→whitespace-flexible→anchored-trim ladder
section: 2
subsystem: 코어 mutating 도구 — edit string-replacement matching
order: 110
maturity: L4
status: stable
purpose: |
  `edit` tool's fuzzy matcher: 3-rung conservative strategy ladder. (1) exact
  delegates to `applyExactEdit` (no duplication). (2) whitespace-flexible:
  per-line trim + internal-run collapse (`\s+` → single space). (3) anchored-
  trim: per-line end-trim only (preserves internal whitespace). First confident
  match (unique, or all-match when `replaceAll`) wins. Critical invariant:
  ambiguous (>1) at any rung STOPS the ladder — a more permissive rung can
  only be more ambiguous, so trying it would mislead. No-confident-match
  outcome carries `kind: "fuzzy-no-confident"` for the strategy-hint
  formatter (see 01-edit / order 1 for the next-step routing). Pure: no I/O,
  no schema — operates on `(source, oldString, newString, replaceAll)`.
