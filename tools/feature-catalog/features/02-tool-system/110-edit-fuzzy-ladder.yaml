knobs: []
deliberate_hold: null
notes: |
  `EditOutcome.kind` is the stable failure-class tag (CR2 follow-up) the
  `strategy-hint.ts` formatter consumes to suggest `nextStrategy:
  scripted_replace | read_then_patch | ambiguous` (see 01-edit). exact's
  identical-string + empty-string rejects are NOT carrying `kind` — they are
  input-validation errors with no routing implication. Splice from bottom
  preserves earlier indices when applying multiple windows under `replaceAll`.
  A wrong edit is worse than no edit — the ladder fails clean rather than
  guess.
