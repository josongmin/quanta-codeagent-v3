notes: 'HELL-10 hellgate test: "leading-dash PR ref rejected (no flag injection)". Parallels `git_diff` base-leading-dash rejection (`git-read-trio`) and `git_moved_code` base-leading-dash rejection. SECURITY-critical: `gh pr view --web` opens a browser at attacker-controlled URL; `gh pr view -R/path/evil` exfiltrates to attacker repo.'
