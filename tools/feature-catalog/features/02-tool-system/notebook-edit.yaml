id: notebook-edit-cell-tool
title: notebook_edit — cell-level .ipynb editor (W6, NotebookEdit P17 해소)
section: 2
subsystem: 파일 편집 도구 (FS-jail mutating)
order: 70
maturity: L2
status: stable
ui_surfaces: [cli, web]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "absorbed:claude-code", "default-off", "mutating"]
depends_on: []
surface_integration:
  cli: full
  web: full
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "agent tool registered in @/tool getDefaultTools when ports.notebookEdit is set (host gate); dispatched in the CLI loop reachable from src/apps/cli/index.ts"
    web: "agent tool_call/tool_result events map to tool.invoked/tool.completed which the web bridge renders"
purpose: |
  Closes the long-standing NotebookEdit defer (P17 / §16.5): quanta READ .ipynb
  (ADR-0481 cell-aware render) but could not EDIT. `notebook_edit` does
  cell-level str_replace / insert / delete on the nbformat JSON, preserving
  every other cell + notebook metadata. PURE NEVER-throws core
  (`src/tool/notebook-edit/index.ts#editNotebook`): a malformed notebook /
  missing-or-ambiguous match / out-of-range index ⇒ ok:false tool_result, never
  a crash. The wrapper reads/writes through the SAME @/storage FS jail
  `edit`/`write` use, with atomic write-back (writeFileAtomic temp+rename) and
  the same git-write-guard + glob-in-write static denies `edit` runs. Default-OFF:
  registered ONLY when QUANTA_NOTEBOOK_EDIT is on (tool menu byte-identical
  otherwise). Live-kernel cell EXECUTION is a separate, deferred capability —
  this is edit-only.
tests:
  - tests/unit/tool/notebook-edit.test.ts
  - tests/unit/tool/notebook-edit-tool-hellgate.test.ts
