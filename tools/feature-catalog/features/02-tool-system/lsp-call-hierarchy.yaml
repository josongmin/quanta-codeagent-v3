id: lsp-call-hierarchy
title: LSP call hierarchy — lsp_incoming_calls / lsp_outgoing_calls (RFC jun-6)
section: 2
subsystem: 코어 read-only 도구 — language-server call hierarchy
order: 487
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: [surface:cli]
depends_on: [lsp-nav-tool-slice, lsp-bridge, lspport]
purpose: |
  Two new read-only nav tools answering the refactorer's core question — "if I
  change this function's signature, what calls it (and breaks), and what does it
  call?" — which `lsp_references` cannot (it conflates reads / writes / imports /
  type annotations and gives no call-site grouping).

  `lsp_incoming_calls` (callers) / `lsp_outgoing_calls` (callees) front the LSP
  3-step call-hierarchy protocol (LSP 3.16): the adapter hides a TWO-HOP request
  behind one port method each — `textDocument/prepareCallHierarchy` resolves the
  position to callable item(s), then `callHierarchy/incomingCalls|outgoingCalls`
  per item, flattened. The normalized `CallHierarchyEntry` carries the callee/
  caller name+kind+uri+ranges PLUS `fromRanges` — the exact call-site ranges
  (the "what breaks where" payload). incoming reads `from`; outgoing reads `to`.

  Mirrors the existing `lsp_implementation` slice end-to-end: `LspPort` /
  `LspNavSession` methods, the `positionTool` factory (bare PATH:LINE:CHARACTER,
  1-based), `isReadOnly:true` / `isConcurrencySafe:false`, never-fail-the-turn
  degradation. The unsupported→null / resolved-empty→[] split falls out of the
  shared `callOrNullOnUnsupported` helper (server lacking `callHierarchyProvider`
  ⇒ clean message, never a throw). The `callHierarchy` client capability is now
  advertised in `initialize` so spec-strict servers offer the provider.

  Strictly additive + default-OFF: both tools ride the EXISTING
  `QUANTA_LSP_TOOLS` opt-in gate (siblings in the `lspNavToolList()` set) — no
  new knob, no new manifest top-level row, byte-identical default surface.
