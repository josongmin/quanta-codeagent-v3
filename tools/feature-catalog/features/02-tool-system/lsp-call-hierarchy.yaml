notes: |
  Slice fence: `src/tool/lsp_nav/` MUST NOT import `@/lsp`, so `CallHierarchyEntry`
  is declared twice (normalized `@/lsp/types` + slice `NavCallHierarchyEntry`
  mirror), structurally compatible — exactly how `Location`/`NavLocation`
  coexist. `lsp-bridge.ts` is the only cross-slice assembler (two one-line
  forwarders). The two tools use the `positionTool` factory (positional name,
  not a `name: "x"` literal) so — like the other 5 factory-built nav tools
  (definition/hover/type-def/impl/rename-preview) — they are NOT scanned by the
  tool-surface manifest drift guard and need NO manifest group row (they ride
  the same gate transparently). Phase 2 (deferred): a `depth` knob to expand the
  hierarchy recursively (direct edges already answer the change-impact ask).
