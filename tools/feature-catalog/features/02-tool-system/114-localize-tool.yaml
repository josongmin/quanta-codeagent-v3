notes: |
  Companion of `20-file-tree-summary` (Stage-1 topology) and `21-parse-test-
  failure` (Stage-3 stack-trace extraction — the FrameTier classifier this
  tool reuses lives there). Separate from `localize-calibration-corpus`
  (section 8, order 85) which is the empirical measurement instrument for
  the ranking algorithm (recall@K / MRR), NOT a regression gate. R-Phase9
  introduced FrameTier penalties; R-Phase10 added the JS-sibling penalty
  (10 sits between `test:−2` non-bury and `vendored:−50` hard-bury). `verbose`
  flag includes per-candidate score + tier in the output for debugging.
