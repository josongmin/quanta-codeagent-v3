id: localize-tool
title: localize — Stage-2 ranked fault-localization with FrameTier + JS-sibling penalty
section: 2
subsystem: Fault-localization aids — Stage-2 ranked symbol search
order: 114
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: partial
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: [surface:cli]
depends_on: [localize-calibration-corpus]
purpose: |
  Stage-2 of the 3-stage fault-localization triangle: ranked search for
  symbol/definition lines that match the model's natural-language query,
  bounded to the workspace via `resolveJailed`. Drives ripgrep with a
  definition-pattern grammar (line-leading shapes of declarations across
  JS/TS/Python/Rust/Go/etc.) and scores hits with BM25-style ranking. Two
  additive penalties: (1) `TIER_PENALTY` mirrors `parse_test_failure`'s
  `FrameTier` classifier (user=0, test=−2, vendored=−50) so `node_modules/`
  / `.venv/` hits are returned (visible to the model) but cannot push
  user-code matches out of `max_results`. (2) `JS_SIBLING_PENALTY=−10`
  buries compiled `.js` artifacts when their `.ts/.tsx/.mts/.cts` twin
  exists in the SAME path (detection by full-path stem, NOT bare basename,
  so unrelated co-named files don't trigger). Tier-1 and Tier-2 are pure
  additive penalties — they re-rank, never filter; the model still sees the
  hit and chooses.
