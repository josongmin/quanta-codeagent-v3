notes: |
  Companion of `diagnostics-tool` (order 112) — same provider-injection
  pattern, same slice fence, same jail seam. `lsp-bridge.ts` in the agent
  slice is the only cross-slice assembler allowed (mirror of `mcp-bridge.ts`).
  Position schemas use `z.number().int().min(1)` so a `line: 0` request fails
  validation before reaching the server. Workspace-symbol takes any `path`
  in the workspace — the language server it picks dictates the search scope.
