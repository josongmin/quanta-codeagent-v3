configurable: n-a
purpose: |
  Eight navigation tools fronted by an injected `LspNavProvider` (same
  slice-isolation pattern as `diagnostics` — `@/tool` MUST NOT import
  `@/lsp`, biome-enforced): definition, references, hover, type-definition,
  implementation, document-symbol, workspace-symbol, rename-preview. All
  take 1-based human coords (line + character) and convert to 0-based LSP
  `NavPos` internally; `path` is FsJail-validated via `resolveJailed`
  BEFORE handing to the provider (only a branded `JailedPath`-equivalent
  ever reaches the language server). `references` has optional
  `includeDeclaration` (default true). `rename-preview` returns the
  `NavRenamePreview` shape (per-file edit ranges) WITHOUT applying — apply
  is a separate mutating step. Formatters (`formatHover` / `formatLocations`
  / `formatSymbols` / `formatRenamePreview`) are pure + exported for unit
  test isolation. Not registered in `buildDefaultTools` — the CLI wires
  `lspNavTools(provider)` separately so embedding hosts can opt in.
