purpose: |
  Production wire for ADR-0204's shell-snapshot primitive + ADR-0235's
  `runShell` prefix integration. Adds `bun-spawner.ts` (production
  adapter swapping in the Bun child-process API for the headless stub)
  + `pruneToSizeBudget` method on the `ShellSnapshotPort` (closes the
  unbounded-disk-growth hazard — total snapshot bytes capped per
  session). Two-phase session-start prune
  (`src/agent/shell-snapshot-session.ts`). Composition-root opt-in via
  `SessionDeps.shellSnapshot` conditional spread (default-OFF byte
  identity preserved). CLI surface `buildShellSnapshotConfig` in
  `internal.ts`.
