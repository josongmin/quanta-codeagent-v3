      - tests/unit/pptx-authoring-hellgate.test.ts
      - tests/unit/pptx-roundtrip-e2e-hellgate.test.ts
      - tests/unit/artifact-auto-register-c1-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_OFFICE_AUTHORING
    where: src/shared/runtime-config.ts
    default: false
    purpose: |
      Shared with xlsx_write / docx_write. Strict opt-in: default-OFF ⇒ no
      DefaultToolPorts.officeAuthoring ⇒ pptx_write NOT registered ⇒ byte-identical
      default tool menu. (pptx_read is BASE — unaffected by the knob.)
deliberate_hold: null
notes: |
  AUTO-REGISTER (jun-06, C1 loop): `makePptxWriteTool({ artifactRegistry })`
  best-effort registers the written deck (kind:presentation, media type
  presentationml.presentation) after a successful write; the const `pptxWriteTool`
  === the no-arg factory (byte-identical). port absent ⇒ no register; throw ⇒
  write unaffected. See office-authoring (H14b) + artifact-canvas-store (C1).

  pptx_write is default-OFF / opt-in on EVERY surface in the tool-surface SSOT
  (grouped under the xlsx_write officeAuthoring entry); pptx_read is BASE
  (BASE_TOOL_NAMES). Title-vs-body split on read: the title placeholder
  (<p:ph type="title|ctrTitle"/>) text is the slide title, every other shape's
  paragraphs are body lines; a foreign deck with no title placeholder reads all
  text into body. Slides read back in NUMERIC part order (slide1..slide10), not
  lexicographic. Deferred (same as H14b): per-run formatting (bold/italic/size),
  speaker notes, images/charts, custom layouts/themes — the deck is
  content-complete (opens + round-trips title/body DATA) but visually plain.
  The mode.ts MUTATING_TOOL_TABLE classification (pptx_read=null, pptx_write=
  mutating) is owned by the agent slice and tracked separately (docx_read/
  docx_write share the same pending classification).
