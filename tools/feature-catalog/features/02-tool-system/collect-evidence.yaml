purpose: |
  The KEYSTONE of multi-language agentic debugging. One call assembles the
  unified EvidencePacket for the current failure instead of the LLM hand-
  orchestrating run_tests + lsp_nav + debug_inspect: detect toolchain → run the
  suite → pick the top failing test → fuse it with static context (LSP
  definitions/refs/types/diagnostics at the failure site), runtime state (DAP
  stack/locals), and repo changed-files into one JSON matching the agreed schema
  {language, repo_context, failure, runtime, static, patch_constraints}.

  Pure orchestrator (src/tool/evidence/builder.ts) over injected sources, each
  independently optional AND fault-isolated (a missing/throwing source degrades
  its section to null, never the packet) → NEVER-throws. The failure file is
  normalized to an absolute path before LSP/DAP handoff (runners report it
  relative). ok mirrors run_tests (green ⇒ ok:true; failure ⇒ ok:false).

  STATUS: failure + repo + STATIC + Python(debugpy)+Rust(lldb-dap) RUNTIME are LIVE in production.
  static = evidenceLspStatic (@/agent/lsp-bridge) wired in agent-arg-builder;
  runtime = defaultRuntimePort (in-slice @/tool/debug, default-wired in the tool,
  abort-threaded, degrades to null without debugpy/python). Proven by real
  rust-analyzer static e2e + real debugpy + real lldb-dap runtime e2e (both capture the failing locals).
  Go/TS runtime (dlv/js-debug, needs DAP TCP transport) remain follow-up. HIGH
  RISK: runs the suite ⇒ always-confirm + default-OFF (QUANTA_EVIDENCE).
  Per-section toggles: includeRuntime / includeStatic (both default ON) let the
  caller skip the expensive DAP runtime re-run or the LSP static query for a
  faster partial packet.
