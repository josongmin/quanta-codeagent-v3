deliberate_hold: null
notes: |
  TWO-WAY drift guard(tests/unit/tool-surface-manifest-hellgate.test.ts): 등록된 모든
  도구 이름은 manifest에 나타나야 하고(orphan 도구 금지 — 이 테스트가
  apply_patch_structured가 fc에서 빠진 것을 잡았다), 모든 manifest 엔트리는 실제 도구
  이름이어야 한다(stale row 금지). 이 completeness 축은 SOURCE 센서스이며 registry
  조립이 아니다 — 이전 note의 "실 registry 조립에 핀"은 틀렸다. 같은 파일의 다른
  테스트들이 buildDefaultTools/buildTerminalTools를 실제로 조립하지만, 두 방향
  completeness는 소스를 읽는다.

  sep-13 — 그 센서스가 grep에서 TypeScript AST(tools/dev/tool-name-literals.ts)로
  교체되었다. 이전 grep은 `name: "[a-z_]+"`였고 네 구멍이 측정되었다: 숫자/대문자
  제외(isReadOnly:false + hitlTier:"none" 도구가 38 pass/0 fail로 통과, precommit
  9 of 9), 주석을 읽어 stale row를 마스킹, `--exclude`가 basename 매칭,
  hand-curated root 6개. 실제로 세 도구가 그 구멍에 살아 있었다 —
  Skill/ToolSearch(CLI·web default-ON)와 branch_search(write-capable). AST는 주석과
  포맷을 구조적으로 배제하고 exclusion은 path 기준이며 파일 목록은 git ls-files
  `*.ts`다. 남은 한계는 명시: 계산된 name과 MCP 런타임 핸드셰이크 도구는 어떤 소스
  계측으로도 보이지 않는다. manifest row 없이 도구 추가, 또는
  row 제거 없이 도구 삭제 시 CI 실패. ToolGate는 always/env-flag/config-slot/resource/
  unwired 닫힌 union이며 unwired는 orphan을 숨기지 않고 VISIBLE하게 카탈로그한다. 모든
  default 상태는 row의 note에 비-휴리스틱 근거가 명시된 문서화된 결정(CLI default-ON은
  cheap/in-memory capability에만; Chrome/API key 필요는 resource; bench/eval 재현성
  민감 표면은 opt-in).
