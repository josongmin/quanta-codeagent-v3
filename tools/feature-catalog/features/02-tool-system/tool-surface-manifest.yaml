id: tool-surface-manifest
title: Tool-surface manifest — SSOT for the LLM tool-access axis (gate + per-surface default)
section: 2
subsystem: 도구 — tool-surface SSOT (어떤 도구가 존재/게이트/표면별 default-ON 인지 단일 관리 카탈로그)
order: 489
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env: []
owners: ["@songmin"]
labels: [surface:cli, tier:core]
depends_on: [tool-registry]
purpose: |
  jun-03 — 단일 관리 카탈로그로 LLM-accessible 도구 집합의 접근 축(어떤 도구가
  존재하는가 / 무엇이 게이트하는가 / 표면별 default-ON 여부)을 SSOT로 모은다.
  이전에는 이 데이터가 buildDefaultTools + tier-1 블록(@/agent/features) + 호스트
  maybeWireX 슬롯(@/host/runtime/agent-config-assembler) + CLI env seed(@/apps/cli)에
  흩어져 있었다. 두 축으로 나뉜다: (1) BASE — buildDefaultTools()가 포트 없이 항상
  등록하는 unconditional read/edit/shell/search primitive 이름 목록(BASE_TOOL_NAMES);
  (2) GATED — env flag / AgentConfig 슬롯 / 외부 resource로만 등록되는 도구의 gate +
  per-surface default(on/opt-in/resource)를 담은 GATED_TOOLS 엔트리. 순수 resolver
  (surfaceDefaultFor / shouldSeedOn / seedEnvVarsForSurface / entryToolNames)가 표면별
  default 정책과 CLI seed-env 집합을 도출하며 병렬 목록을 없앤다. @/shared만 import하는
  plane-clean 모듈(ToolSurface 축은 로컬 string union — @/runner/knobs의 Surface를
  @/tool이 import할 수 없어 별도 정의). I/O 없음, 순수 데이터 + 순수 함수.
