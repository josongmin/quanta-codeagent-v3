depends_on: [bash-timeout-cap, bash-tool-hitl-tier, typed-tool-failure-modes]
purpose: |
  Cursor 3.2 `TimeoutBehavior.BACKGROUND` 패턴 흡수. `bash` schema에
  `timeout_behavior: z.enum(["kill","background"]).optional()` 추가
  (absent ⇒ `"kill"` 레거시 path BYTE-IDENTICAL). `"background"` 모드일
  때 deadline 도달 시 process를 detach하고 `{shellId, status:"running",
  outputSoFar}` placeholder를 반환 — model이 추후 `bash_await` (regex/exit
  대기) / `bash_kill` (SIGTERM→SIGKILL + 최종 snapshot)로 제어. 백그라운드
  레지스트리는 `src/runtime/bash-bg-registry.ts`의 LRU-cap=16, insertion-
  ordered Map, `crypto.randomUUID()` id (no nanoid dep). `BashProcessHandlePort`
  closed-port DI seam이라 테스트는 deterministic chunks를 가진 fake child를
  주입. `runtime/shell.ts` (다른 트랙 owner)는 mutate 없음 — bg path가 자체
  `Bun.spawn`을 sandboxed argv + scrubEnv로 사용해 foreground와 같은 posture.
