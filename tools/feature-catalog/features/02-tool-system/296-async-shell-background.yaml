notes: |
  `bash_await`는 read-only + isConcurrencySafe=true (순수 폴링); `bash_kill`은
  isConcurrencySafe=false (OS signal). MUTATING_TOOL_TABLE: bash_await=null,
  bash_kill="bash_mutating" (plan-mode cross-check 통과). SIDE_CONVERSATION_TOOL_NAMES
  에 bash_await 등록 (registry는 pure in-memory). 50ms 폴링 cadence는
  node-repl/default-kernel에서 검증된 값을 재사용 (heuristic 아님). 29 hellgate
  case가 fast-path/슬로우-path/regex mid-stream/timeout/registry overflow/
  killAll cleanup/concurrent-await/abort-during-await/status-monotonic 등을 봉인.
