purpose: |
  Deferred-tool catalog search exposed as a Tool. Two modes: (1) `select:<name>
  [,<name>...]` direct lookup by name — restores schema for explicit deferred
  tools; (2) keyword search ranked by token overlap against tool name + first-
  line description ("tagline") + body. Tokenizer honours camelCase / snake_case
  / kebab-case / dot / `mcp__` separators on BOTH catalog identifiers AND user
  queries, restoring lexical symmetry the original whitespace-only split
  lacked (so `"lspDocumentSymbol"` matches `lsp_document_symbol` and vice
  versa). First-line matches score higher than matches deep in the body.
  `max_results` defaults to 5. Returns the schema definitions (kebab JSON
  shape) so caller can immediately invoke the matched tools.
