notes: |
  Lives in `@/skill` because it's the lookup half of the same catalog the
  skill activation system uses. Tagline boundary = first newline OR first
  sentence-terminating punctuation followed by whitespace/end (`. ` / `? ` /
  `! ` / trailing `.`); description with no break treats the whole text as
  the tagline + empty body.
