order: 137
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: partial
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: [surface:cli]
purpose: |
  First-class YAML reader closing the de-facto config-file gap left by
  ADR-0133's csv/ndjson slice. Single pure-TS dep (`yaml@2.x`, ~50 KB),
  no native binding, no spawn. Path safety mirrors ADR-0126's `read_image`
  posture: lstat symlink-leaf reject, `..` segment block, absolute paths
  require explicit consent. Output is the parsed document re-serialized
  through 2-space `JSON.stringify` so downstream tools see a single
  canonical agent surface regardless of the source's flow/block style or
  anchor/merge graph. `maxKeys` knob (default 200, max 5000) caps
  anchor/merge expansion so a malicious YAML cannot detonate the heap by
  key-fan-out. READ-ONLY + concurrency-safe.
