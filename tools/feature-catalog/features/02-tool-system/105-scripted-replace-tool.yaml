purpose: |
  Codex `tool-routing-and-triggering.md` absorption — "patch is for local +
  stable context; scripted replace is for duplicated blocks, bulk substitution,
  or patch context mismatch". Sibling of `edit` — same FS-jail discipline
  (`@/storage` `enforceJail` chokepoint, single `FsJailError` shape) + same
  atomic write — but optimized for the duplicated / bulk case where `edit`
  would either refuse as ambiguous or be too noisy to use
  one-occurrence-at-a-time. Inputs: `file` (path), `pattern` (literal substring
  by default, JS regex source when `isRegex=true`), `replacement` (with `$1`
  / `$&` capture refs honoured in regex mode), optional `count` cap on number
  of replacements (omit ⇒ replace ALL). Default-OFF posture: the tool is
  registered in `defaultTools` so the dispatch seam is unchanged, but the LLM
  only routes to it when prompt / strategy-hint surface explicitly calls for
  it — no behavior change for sessions that never invoke it.
