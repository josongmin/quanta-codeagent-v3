id: advisor-consult-tool
title: Advisor consult tool (second opinion from a stronger model)
section: 2
subsystem: tier-1 LLM tools (ADR-0429)
order: 429
maturity: L3
status: stable
ui_surfaces: [cli, api]
monitoring: n-a
modes: [interactive, batch]
configurable: integrated
owners: ["@songmin"]
labels: ["absorbed:claude-cc-cli", "surface:tool", "tier:tier1"]
depends_on: [role-model-override, model-swap-retry]
purpose: |
  Agent-callable PURE consult: the model deliberately asks a STRONGER /
  DIFFERENT model for a SECOND OPINION mid-loop and gets the analysis back
  in-band. Orthogonal to model-swap-on-retry (ADR-0066, failure-driven,
  invisible to the model), role-model-override (ADR-0256, a resolver not a
  tool), and delegate (ADR-0393, picks a MODE + spawns a mutating child). The
  advisor offers ZERO tools to the consulted model — it cannot edit files, run
  shells, or call tools (isReadOnly, hitlTier none, no extractShellCommand). An
  explicit `model` outside the closed allowlist is rejected BEFORE the port is
  reached; every operational failure (provider error / timeout / cancel / empty)
  surfaces as a typed ok:false ToolFailure so the loop never throws. The
  `advisor` knob (env QUANTA_ADVISOR_MODEL) env-flips the tool from absent to
  live by populating AgentConfig.advisor via advisorConsultFromLLM; absent env ⇒
  tool NOT registered (byte-identical, RFC §1.2).
