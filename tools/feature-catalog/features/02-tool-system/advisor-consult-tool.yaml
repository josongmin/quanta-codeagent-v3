knobs: ["advisor"]
deliberate_hold: null
notes: |
  Default-OFF triple seam: (1) AgentConfig.advisor slot absent ⇒
  buildAdvisorBlock returns [] ⇒ ToolRegistry byte-identical; (2) the `advisor`
  knob parse returns undefined for any env value outside the closed
  ADVISOR_MODEL_ALLOWLIST (no trimming / case-folding / prefixing — no
  heuristics); (3) the knob's surfaces EXCLUDE bench so SWE-bench measurement
  stays on the no-advisor trajectory + prefix-cache key.

  The consult mechanism (advisorConsultFromLLM) streams ONE assistant turn with
  tools:[] so the consulted model is structurally incapable of calling tools —
  the advisor-knob hellgate asserts the advisor LLMPort was handed zero tools.
  resolveModel honors an explicit (already allowlist-validated) model and falls
  back to the env-chosen advisor model.

  configurable: integrated — QUANTA_ADVISOR_MODEL reaches the tool via the knob
  framework (resolveKnobs → applyKnobs → config.advisor → buildAdvisorBlock).
