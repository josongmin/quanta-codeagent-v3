  Codex Desktop 8 realtime WS methods 흡수 (connect/send/onMessage/negotiate/
  audioStart/audioStop/close/status). Bun native `globalThis.WebSocket`
  (zero npm dependency, install gate honor). WebSocketCtor injectable
  for deterministic tests. SDP negotiator (PCM/Opus marker preserve, text-level
  exchange only). audio-codec marker-only (encode/decode 후속). AbortSignal
  abort 시 in-flight WS 정리 (no zombie). headless-stub fully deterministic.
