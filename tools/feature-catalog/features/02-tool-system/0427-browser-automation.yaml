purpose: |
  Agent-callable browser automation over the Chrome DevTools Protocol (CDP).
  A pure `@/browser` slice (port + CDP adapter + headless stub + console/DOM
  collectors) drives a system Chrome over a launched dev-tools endpoint; the
  `@/tool/browser` layer exposes the navigate/collect tools to the loop with a
  net-guard (SSRF/loopback denial) + result mapping + a per-session holder.
  Env-gated: registered ONLY when `QUANTA_BROWSER_TOOL=on` AND a system Chrome
  is on PATH; absent ⇒ the tools are not registered (byte-identical, RFC §1.2)
  and the adapter degrades to the headless stub. fs-jailed temp profile; the
  real-chrome e2e is environment-dependent (needs a Chrome binary) so it is not
  part of the deterministic gate.

  The production `nodeDnsResolver.lookup` imports `node:dns/promises` only
  when a lookup is requested; importing the browser net-guard does not load
  native DNS. The injected resolver contract, all-address SSRF classification,
  timeout, and fail-closed error behavior are unchanged. A fresh-process test
  checks native DNS module loading before/after an IP-literal lookup; this is
  import-boundary evidence, not a startup-latency or complete DNS-rebinding
  defense claim.

  S1 strengthen (jul-03) — `browser_network`: a bounded METADATA-ONLY network
  ring buffer (method / url / status / mime / size; NO bodies or headers, so no
  cookies/tokens/PII — the leak guard is enforced at the producer, not by
  redaction). Read-only. Triple-gated: `QUANTA_BROWSER_TOOL=on` + chrome present
  + an INDEPENDENT `QUANTA_BROWSER_NETWORK=on` (default-OFF) — off ⇒ the tool is
  absent and the buffer never captures (byte-identical menu). Lets the agent
  verify a front end (did a fetch 404/500, what did the API return, payload size).
