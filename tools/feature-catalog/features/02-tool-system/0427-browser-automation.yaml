id: browser-automation
title: Browser automation tools (headless CDP, ADR-0427)
section: 2
subsystem: tool-system browser slice (ADR-0427)
order: 427
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, batch]
configurable: integrated
owners: ["@songmin"]
labels: ["absorbed:codex", "surface:tool", "tier:tool-system"]
config_refs:
  env: [QUANTA_BROWSER_TOOL]
purpose: |
  Agent-callable browser automation over the Chrome DevTools Protocol (CDP).
  A pure `@/browser` slice (port + CDP adapter + headless stub + console/DOM
  collectors) drives a system Chrome over a launched dev-tools endpoint; the
  `@/tool/browser` layer exposes the navigate/collect tools to the loop with a
  net-guard (SSRF/loopback denial) + result mapping + a per-session holder.
  Env-gated: registered ONLY when `QUANTA_BROWSER_TOOL=on` AND a system Chrome
  is on PATH; absent ⇒ the tools are not registered (byte-identical, RFC §1.2)
  and the adapter degrades to the headless stub. fs-jailed temp profile; the
  real-chrome e2e is environment-dependent (needs a Chrome binary) so it is not
  part of the deterministic gate.
