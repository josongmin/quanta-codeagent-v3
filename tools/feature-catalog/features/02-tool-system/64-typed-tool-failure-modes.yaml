id: typed-tool-failure-modes
title: ToolFailure discriminated union — 6-mode typed per-failure-mode results
section: 2
subsystem: 도구 결과 — 타입드 실패 사유 (Cursor EditResult/ShellResult 흡수, ADR-0069)
order: 64
maturity: L5
status: stable
ui_surfaces: [cli]
monitoring: partial
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: [absorbed:cursor, surface:cli]
config_refs:
  env: ["QUANTA_CAP_ENFORCE"]
purpose: |
  Cursor EditResult/ShellResult의 discriminated failure union 흡수 — 기존 ok:false 도구 결과의
  output 문자열을 모델이 정규식으로 재파싱하던 부담을 닫힌 enum으로 대체. ToolResult.failure?:
  ToolFailure 옵셔널 필드 추가(없으면 byte-identical). mode가 discriminant:
  not_found{path?} / permission_denied{path?, isReadonly?} / rejected{reason} /
  timeout{timeoutMs?} / spawn_error{error} / error{modelVisibleError?, clientVisibleError?}.
  spawn_error는 Cursor ShellSpawnError 흡수 — "프로세스 자체가 안 뜸"(command not found/ENOENT)을
  일반 error와 구분(재시도 전략이 다름: 다른 명령으로 전환). isReadonly 분리로
  "모드만 바꾸면 되는 거부"와 "진짜 권한 거부"를 모델이 분기 가능 (Cursor is_readonly). error
  변종은 model-visible vs client-visible을 분리해 컨텍스트 오염 없이 운영 디버깅 정보 보존.
  DispatchResult.failure는 ToolResult.failure가 있을 때만 통과(없으면 omit), ok/block/preview
  파생 무변경.
