notes: |
  ToolEvent 변종이 아닌 ToolResult.failure 필드로만 구현 — 새 이벤트 추가 시 event.type switch 하는
  기존 호출부의 narrowing이 깨지는 회귀(deferred 흡수와 동일 회피). 없으면 byte-identical (RFC §1.2).
  L4 마이그레이션 완료: read(FsJail→permission_denied, dir→not_found) / edit(old_string-not-found→
  not_found, FsJail→permission_denied) / write(FsJail→permission_denied) / scripted_replace(file/pattern
  →not_found, bad-pattern→rejected, FsJail→permission_denied) / bash(timedOut→timeout, exit127+
  "command not found"→spawn_error). 모델 가이드는 prompt-rules/core.ts의 [R-FAILURE-MODE] 규칙(7번째
  core rule, 전 모드 적용)이 mode별 분기를 인용. spawn_error는 runtime/shell.ts(다른 트랙 소유)를
  건드리지 않고 기존 ShellResult{exitCode,stderr}에서 127+stderr 휴리스틱으로 유도 — 진짜 spawn
  ENOENT를 surface하는 ShellResult 확장은 follow-up(현재는 휴리스틱이 유일 신호, 127 정상 종료
  스크립트는 오분류 안 됨).
  L4→L5 (2026-05-23): smoke battery 13 시나리오의 모든 tool dispatch가 ToolResult/ToolFailure
  shape를 통과 — read/edit/write/scripted_replace/bash 5종 도구가 single/medium/tikitaka 픽스처
  전반에서 실행되며 dispatch.ts의 failure-propagation 경로(ToolResult.failure?→DispatchResult.failure)
  를 transitive 검증. byte-identical: failure 부재 fixture는 omit 경로, 부재 caller는 unchanged.
  e2e 폐쇄: tier-0 replay가 매 픽스처마다 6-mode discriminant narrowing을 통과(없으면 omit, 있으면
  pass-through), prompt-rules/core.ts의 [R-FAILURE-MODE] 인용도 buildSystemPrompt 경로로 전 픽스처
  transitive.
