purpose: |
  v0.dev chat=branch upstreamChanges 흡수 — fetch 없이(네트워크·index 무변경) 이미
  가져온 remote-tracking ref 대비 ahead/behind를 보고. rev-parse @{upstream}로 upstream
  ref 확인(미설정 graceful), rev-list --left-right --count HEAD...@{upstream}로 분기
  카운트, behind>0이면 "upstream has N new commit(s); consider pulling" 액션 노트.
  read-only·concurrency-safe — gitTools() 7번째 read-only 도구.
