knobs:
  - name: QUANTA_APPSHOT
    where: src/shared/runtime-config.ts
    default: false
    purpose: |
      Strict `=== "1"` opt-in. Default-OFF ⇒ the composition root wires NO
      `DefaultToolPorts.appshot` slot ⇒ `appshot_verify` NOT registered ⇒
      byte-identical default tool menu. Opt-in EVERYWHERE: the loop composes
      browser_* (which need Chrome) + spends LLM-judge tokens + writes files, so
      it never auto-seeds on any surface (mirrors image_gen's posture).
deliberate_hold: null
notes: |
  DEFERRED to Phase 2/3 (RFC §7, §8 — the high-cost, desktop-gated parts):
    - richer scaffold targets (a static SPA / bundler behind a local static
      server for same-origin apps) — Phase 1 is single-file index.html only.
    - the SHARE surface (a Tauri/desktop webview live-preview pane + a real
      shareable link / bundle export). Until a Web-Tauri host ships a webview,
      a scaffolded app is reachable only via quanta-artifact://<id> + a manual
      file:// open — acceptable for the loop, insufficient for "share". Per
      [[surface-model]] the verify loop's ROI is NOT gated on the desktop
      surface; only the share pane is Tauri-bound.

  COMPOSITION-ROOT WIRING — NOW CONFIG-REACHABLE (the appshot port is assembled
  WHERE THE BROWSER LIVES). The real AppshotPort cannot be minted at the
  pre-assembler agent-arg-builder layer (no BrowserPort there). It is assembled in
  `agent-config-assembler.ts#maybeWireAppshot`, which runs right after
  `maybeWireBrowser`, gated on ALL of: QUANTA_APPSHOT=1 AND a live BrowserPort
  wired into cfg.browser (QUANTA_BROWSER_TOOL=on + a system Chrome) AND a judge
  LLMPort in scope (cfg.llm). It binds render/screenshot → that live BrowserPort
  (lazy-spawned session, idempotent dispose), verify → a cheap one-shot LLM-judge
  over cfg.llm (the screenshot as an image block → PASS/FAIL + critique), scaffold
  → makeJailedScaffold(cfg.cwd), an injected clock (() => Date.now()), and — when
  the Canvas store is ALSO on (QUANTA_ARTIFACT_STORE=1) — the SAME per-session
  artifact registry (minted once at the composition root and threaded onto
  cfg.artifactRegistry) as the artifact sink, so the final scaffold registers into
  the very registry the artifact_* tools read. The minted `cfg.appshot` slot is
  then consumed per-session by the tier-1 `buildAppshotBlock` (mirrors
  buildBrowserBlock), which appends `appshot_verify` to the live registry. Missing
  knob / browser / judge ⇒ slot unset ⇒ tool absent ⇒ byte-identical menu.

  The legacy `seams.appshotPort` injection point on agent-arg-builder remains for
  the hellgate that drives `buildGatedToolPorts` registration directly with a
  scripted port (no Chrome); production now uses the assembler+tier1 path above.

  SCAFFOLD is Phase-1 deterministic (renderScaffoldHtml: spec prompt + feedback
  escaped into a single-file page through the FS-jail). A model-authored codegen
  body that still writes through makeJailedScaffold is a Phase-2 follow-up.
