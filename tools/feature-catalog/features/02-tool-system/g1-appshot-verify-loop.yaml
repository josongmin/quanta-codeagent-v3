id: appshot-verify-loop
title: appshot_verify — closed spec→scaffold→render→screenshot→judge verify loop (G1, Phase 1)
section: 2
subsystem: Binary-artifact generation / verify-loop (G1, RFC jun-6-appgen-appshot)
order: 610
maturity: L3
status: refined
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: integrated
owners: ["@songmin"]
