purpose: |
  G1 Phase 1 — the CLOSED generation→verification cycle quanta never had. quanta
  already owned both ends in SEPARATE slices that were never joined: a binary-
  artifact GENERATION axis (image_gen / Office authoring / the artifact store)
  and a render+observe half (browser_navigate + browser_screenshot over CDP,
  PNG→vision). appshot binds them into a closed feedback loop:

    spec → scaffold(jailed index.html) → render(browser) → screenshot(PNG)
         → LLM-judge(does the render satisfy the spec?) → iterate (bounded N)
         → stop early on pass | fail-closed at the cap.

  The "render-and-look-back" step is the load-bearing novelty (v0.dev / Claude
  Artifacts / Cursor preview-pane pattern): code that "looks right" as TEXT
  frequently renders broken; the loop verifies on PIXELS, threading each failing
  verdict's notes back as the next iteration's scaffold feedback (the edit arrow).

  CLOSED-port DI (RFC §4.2): one injected `AppshotPort`
  (scaffold/render/screenshot/verify) keeps the loop core fence-clean — it imports
  ONLY its own ./port (no @/browser, @/agent, @/llm). The composition root wires
  render/screenshot → the real BrowserPort, verify → an LLM-judge, scaffold → the
  FS-jail chokepoint (makeJailedScaffold, mirrors authoring/jailed-write.ts);
  hellgate injects a FakeAppshotPort (scripted renders + deterministic verdicts)
  so the loop runs with NO Chrome, NO network, CI-safe.

  BOUNDED + NO-THROW (RFC §6, §8): the iteration count is hard-clamped to
  [APPSHOT_MIN_ITER=1, APPSHOT_MAX_ITER=8] (a huge / zero / non-finite request can
  never produce an unbounded or empty loop); every injected effect is caught at
  the loop boundary, so a Chrome-launch failure / transport drop / LLM throw / jail
  escape maps to a typed `failed` outcome rather than a crash ("a render that can't
  bring up Chrome degrades to verify-skipped, not a crash"). An oversize screenshot
  (> 4 MB, the browser_screenshot MAX_SCREENSHOT_BYTES invariant) is REFUSED before
  the judge. The injected clock is the ONLY time source (no Date.now in-slice).

  Output = an artifact: the final scaffolded index.html is best-effort registered
  into the session artifact store (kind `other`) → a stable quanta-artifact://<id>
  URL, when the store is ALSO wired (a throwing sink never breaks the loop).
  Mutating (isReadOnly()=false — scaffolds files + drives a browser session +
  spends judge tokens); pre-approval HITL tier (mirrors write / image_gen).
