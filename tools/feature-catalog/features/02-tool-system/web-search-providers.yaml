    integration: []
    contract: []
knobs: []
deliberate_hold:
  reason: 'No native ranking endpoint for DuckDuckGo means the fallback is genuinely thin — for serious search workloads a Brave key is required.'
  promotion_path: 'Add a third provider (e.g. SerpAPI, Bing) when a host needs strong ranking AND cannot use Brave.'
notes: 'Slice posture (RFC §3.1): the closed `WebSearchProvider` port belongs to `tool/web/search.ts` (covered by `web-fetch-search`); these are the concrete impls behind it. Host (apps/agent bootstrap) wires `AgentConfig.webSearch.provider` to pick which one ships.'
