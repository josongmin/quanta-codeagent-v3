id: web-search-providers
title: web_search providers — brave + duckduckgo concrete impls
section: 2
subsystem: 도구 — web_search providers (ADR-0127)
order: 104
maturity: L4
status: stable
purpose: |
  Two concrete implementations of the `WebSearchProvider` closed-port
  introduced in ADR-0127. (1) `braveSearchProvider` — backed by the Brave
  Search REST API (`api.search.brave.com/res/v1/web/search`); primary
  full-web provider with key injected at construction (provider NEVER
  reads `process.env` itself — keys come from host wire-up, vault, OS
  keychain). (2) `duckduckgoSearchProvider` — fallback for hosts without
  a Brave key. Limited: DuckDuckGo's Instant Answer API returns curated
  topics + a single Abstract, NOT a ranked web list (most queries return
  a handful of `RelatedTopics` entries, often 0). Both providers are
  slice-clean: imports ONLY `../search` (the port); no `@/agent`,
  `@/llm`, `@/permission`, `@/storage`, `@/memory`, `@/stream`. DI seam:
  `provider({ apiKey?, fetcher })` lets tests inject a fake `fetch`.
evidence:
  code:
    - src/tool/web/providers/brave.ts
    - src/tool/web/providers/duckduckgo.ts
  adrs: [127]
  tests:
    unit:
