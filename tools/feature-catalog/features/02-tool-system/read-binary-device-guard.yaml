purpose: |
  The `read` tool rejects targets that would hang the loop or dump unbounded
  output BEFORE opening them (B5 guard). A named pipe (FIFO) BLOCKS forever when
  no writer is attached; a character device (`/dev/random`, `/dev/zero`,
  `/dev/tty`) streams infinitely; a block device (`/dev/disk0`) dumps gigabytes
  of raw storage — each is the canonical "tool hangs / floods the loop" DoS. The
  guard classifies the already-`stat()`ed target via the additive `FileInfo`
  flags `isFIFO` / `isCharacterDevice` / `isBlockDevice` (src/storage/types.ts,
  populated from `stat().isFIFO()` / `.isCharacterDevice()` / `.isBlockDevice()`)
  and returns a typed `ok:false` (`failure.mode:"rejected", reason:"device_file"`)
  WITHOUT reading. ORDER MATTERS: the device check runs BEFORE any byte read so a
  blocking device never opens. A second pass sniffs a bounded leading byte window
  (8 KiB) for a NUL (`0x00`) and rejects binary files the same way. Unconditional
  / secure-by-default — no knob; a device or binary target is never a legitimate
  text read.
