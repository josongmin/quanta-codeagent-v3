notes: |
  B5 (jun-04 bug-fix sprint). The device check is a pure classifier over the
  FileInfo flags fetched by the existing stat, so it adds no extra syscall on the
  happy path. `storage/types.ts` is the data layer: the same `FileInfo` also
  carries `mtimeMs` for the stale-read-guard (ADR-0474) — these are additive
  sibling fields. The dedicated hellgate pins FIFO / char-device / block-device
  rejection + the NUL-byte binary sniff + device-check-before-read ordering.
