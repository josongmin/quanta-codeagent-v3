  promotion_path: "thread AgentConfig directive emitter into buildPrShipBlock; optional verify-evidence appended to the PR body."
notes: |
  Two default-OFF registration seams (byte-identical when off): ghTools opts
  {authorLLM, gitRunner} (both required), and buildPrShipBlock — a SEPARATE
  builder from the sealed read-only buildComposeAuthoringBlock (gh_pr_open is a
  WRITE tool; write safety = permission layer + plan-mode dispatch gate, not the
  builder).
