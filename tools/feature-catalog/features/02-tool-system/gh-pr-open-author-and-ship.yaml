id: gh-pr-open-author-and-ship
title: "gh_pr_open — author + open a PR in one step"
section: 2
subsystem: 도구 — gh PR orchestration (Claude/Cursor PR-flow 흡수, ADR-0460)
order: 2
maturity: L3
status: stable
ui_surfaces: [cli]
modes: [interactive, headless, batch, daemon, ide, ci-bot]
monitoring: n-a
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: []
purpose: |
  The seam joining git_compose_pr (authors prose, opens nothing) and gh_pr_create
  (opens from an existing title/body). One atomic tool: resolve branch NAMES
  (default head = current branch via rev-parse, base = main, 'origin/' stripped)
  → guards before any LLM/gh spend (detached HEAD / protected head main·master·
  develop / head==base) → author via the shared composePrText core (range
  origin/<base>...<head>) → dryRun:true previews the prose without opening →
  best-effort push precondition (origin/<head> must exist locally, else an
  actionable "git push -u origin <head>" message) → gh pr create --title --body
  --base --head [--draft], argv as DISTINCT items (no shell, injection-safe) →
  success-only create-pr directive publish. composePrText was extracted from
  git_compose_pr (byte-identical delegation), so PR-authoring logic exists once.
