depends_on: [git-runner-cancellation-signal, cross-slice-mirror, deferred-tool-registry, evidence-toolresultevidence, git-branch-name-schema-guard]
purpose: |
  Surfaces the pure moved-code classifier (ADR-0109 — normalize + similarity
  + parse-unified-diff) as a typed first-class git tool so the
  `pr-review-canvas` system skill can call it the same way it calls `git_diff`.
  Pipeline: shell `git diff [--staged] [base] [-- paths]` (same argv discipline
  as `gitDiffTool` — leading-dash rejection on `base` to defeat
  `--output=/etc/x` / `--ext-diff` argv injection), parse the unified diff
  with the existing pure parser, hand the resulting `DiffHunk[]` to
  `classifyDiff`. READ-ONLY + CONCURRENCY-SAFE. The tool owns only the shell
  + I/O + formatting shell; the 19-case hellgate-covered classifier is the
  pure core.
