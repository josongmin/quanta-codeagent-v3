notes: 'HITL 4-tier(ADR-0020) 정착으로 도구별 hitlTier() 분기가 안전해진 후 진행. ADR-0044(negative invariants)와 정합 — bash GIT_PREFIX 매칭은 mutating 1급 도구 등록 후 우회 가능성 검토 필요(별도 마이그레이션).'
