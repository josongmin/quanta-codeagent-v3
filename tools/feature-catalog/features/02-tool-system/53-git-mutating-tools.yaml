id: git-mutating-tools
title: git_commit + git_branch_switch — 1급 mutating git tools with WIP checkpoint
section: 2
subsystem: 도구 — git mutating 1급화 (Claude Desktop commitWipForBranchSwitch 흡수, ADR-0053)
order: 53
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: partial
modes: [n-a]
configurable: static
owners: ["@songmin", "team-tools"]
labels: [surface:cli]
depends_on: [isconcurrencysafe]
ui_surfaces: [cli]
configurable: static
purpose: |
  Claude Desktop 1.7196.3의 commitWipForBranchSwitch 패턴 흡수 — git push/commit/checkout을
  bash 통과 + always-confirm 일괄 게이팅하던 구조에서 도구 단위로 1급화. (1) git_commit({
  message?, mode?, paths? }) — mode="regular"(default)는 message 필수 + add + commit -m,
  hitlTier="always-confirm"(push 가능한 영구 commit). mode="wip"은 message 생략 시 `wip: <ISO>`
  자동 생성 + all-files staged + hooks 통과(--no-verify 안 함), hitlTier="pre-approval-ok"
  (세션 경계 reversible 체크포인트, trust-scope eligible). isReadOnly()=false /
  isConcurrencySafe()=false. (2) git_branch_switch({ target, autoWip? }) — autoWip true 시
  dirty tree를 wip commit으로 체크포인트한 후 switch(stash 잊기 방지), false면 일반 checkout.
  ADR-0025(read-only git 1급)는 무변경 — mutating만 분리해 1급화.
