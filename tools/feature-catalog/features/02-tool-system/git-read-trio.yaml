notes: 'Closed-port `GitRunner` is the single seam — every `safeRun` call is mockable in tests. Companion `git_upstream_check` is its own feature (`git-upstream-check`). 50 KB output cap is the same SSOT as `web_fetch` / `read_image` slices.'
