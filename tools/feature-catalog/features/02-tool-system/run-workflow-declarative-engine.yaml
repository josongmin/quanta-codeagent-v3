id: run-workflow
title: run_workflow — declarative multi-agent workflow engine (§25.1)
capability: workflow
section: 2
subsystem: 도구 — declarative workflow (LLM-authored multi-agent orchestration)
order: 650
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:cli", "category:orchestration", "default-off"]
depends_on: []
config_refs:
  env: ["QUANTA_WORKFLOW"]
purpose: |
  §25.1 LLM-authored DECLARATIVE multi-agent workflow (the `run_workflow` tool).
  The model emits a JSON `WorkflowSpec` (phases · steps seq/parallel · forEach
  fan-out · `{{ref}}` templates · typed outputSchema); the engine compiles it and
  drives it to completion, each step = one subagent spawn. Rides the tier-1
  subagent block (reuses its runner via the workflow adapter), so it needs the
  subagent capability enabled AND QUANTA_WORKFLOW. LLM-tool surface only (not a
  slash / skill / hook surface) — this is the FEATURE-axis record cross-linked to
  the `workflow` CAPABILITY (src/capability/registry.ts) via `capability:` so the
  feature ↔ capability ↔ manifest gate (QUANTA_WORKFLOW) coherence is asserted by
  the 3-axis consistency ratchet.

  Default-OFF on every surface (opt-in) — it fans out a tree of children, so it
  never auto-seeds; absent gate ⇒ tool not registered ⇒ byte-identical default
  tool menu.
evidence:
  code:
    - src/workflow/spec.ts
    - src/workflow/compile.ts
    - src/workflow/executor.ts
    - src/tool/workflow/run-workflow-tool.ts
    - src/workflow/index.ts
    - src/tool/surface/manifest.ts
  adrs: []
  tests:
    unit:
      - tests/unit/workflow/run-workflow-tool-hellgate.test.ts
      - tests/unit/workflow/run-workflow-wiring-hellgate.test.ts
      - tests/unit/workflow/workflow-engine-hellgate.test.ts
      - tests/unit/workflow/workflow-e2e-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_WORKFLOW
    where: src/apps/cli/cli-knobs.ts
    default: false
    purpose: |
      Opt-in gate for the declarative workflow tool. Default-OFF ⇒ run_workflow
      NOT registered ⇒ byte-identical default tool menu. Manifest gate
      (config-slot subagent.enableWorkflow, env QUANTA_WORKFLOW) and the
      `workflow` capability gate.envKey resolve to the SAME knob.
deliberate_hold: null
notes: |
  Feature-axis record for the `workflow` capability. The manifest GATED_TOOLS
  entry for `run_workflow` carries gate.env=QUANTA_WORKFLOW; the capability
  registry's `workflow` entry carries gate.envKey=QUANTA_WORKFLOW; this fc entry
  carries config_refs.env=[QUANTA_WORKFLOW] + capability=workflow — the three
  axes agree, enforced by capability-axis-consistency-hellgate.
