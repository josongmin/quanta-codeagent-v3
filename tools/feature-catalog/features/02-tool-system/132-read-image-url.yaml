id: read-image-url
title: read_image_url — URL → vision pipeline
section: 2
subsystem: Vision input tool (ADR-0132)
order: 132
maturity: L4
status: stable
purpose: |
  Composition of read_image (ADR-0126) and web_fetch (ADR-0127). Fetches a
  remote image over https, runs the magic-byte SSOT against the body before
  inflating it into a ToolResult.images entry, enforces the same 5 MB cap, and
  inherits web_fetch's SSRF denylist + https-only posture so remote-origin
  traversal cannot reach internal hosts.
evidence:
