    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  First-of-class among modern coding agents (the comparable reference agents
  all stop at local-only image input). Reuses the magic-byte SSOT so a server
  cannot bypass format detection via Content-Type spoofing.
