notes: 'Read tools (`gh_pr_view` / `gh_issue_view` / `gh_check_status` / `gh_pr_list`) and write tools (`gh_pr_comment` / `gh_pr_create`) declare distinct hitlTier so the policy stack can gate writes without blanket-restricting reads. Protected-branch guard on `gh_pr_create` (branch MUST NOT be protected).'
