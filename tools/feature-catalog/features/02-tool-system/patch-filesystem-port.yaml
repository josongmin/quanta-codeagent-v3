purpose: |
  Patch-specific FS port (read / write / delete / rename / exists) injected
  into the V4A `applyPatch` so the applier stays pure-functional w.r.t. the
  host filesystem and can be unit-tested in-memory. DIFFERENT shape and
  different name than the general `@/storage` `FileSystemPort` — on purpose,
  so the patch slice doesn't drag the broader storage interface. The
  `FsJailFileSystemPort` adapter in `src/tool/apply-patch.ts` satisfies the
  port by routing every path through the jail-aware resolver so writes can't
  escape the workspace. Bridge from the pure `@/patch` slice (parser +
  applier + port) to the `tool/` adapter layer.
evidence:
  code:
    - src/patch/types.ts
    - src/patch/applier.ts
    - src/patch/index.ts
