    contract: []
knobs: []
deliberate_hold: null
notes: |
  Companion of `apply-patch-v4a` (grammar + 2-tier fuzzy applier). Distinct
  port (not the general FileSystemPort) — keeps the patch slice's IO
  surface area minimal (5 methods) and decoupled from storage's broader
  contract. In-memory test harness drives the applier through a fake
  port without touching disk.
