depends_on: [shadow-tools-trio, task-registry]
purpose: |
  Three first-class tools wrapping a `BackgroundSubagentSchedulerPort` so the
  parent loop can fork a non-blocking subagent, poll its status without
  blocking, then optionally `await` it with timeout. `subagent_fork` is the
  primary mutator (returns an opaque handle id); `subagent_poll` is a strict
  read-only status read; `subagent_await` blocks (with optional timeout) for
  completion. The scheduler is a DUCK-TYPED mirror of
  `BackgroundSubagentScheduler` from `@/agent/subagent-background` — the tool
  slice does NOT import `@/agent` (RFC §3.1 slice fence, biome-enforced). The
  composition root in `@/agent/tier1/subagent-bg` adapts the concrete scheduler
  into this narrower port at wire time. Default-OFF: tools are not in
  `defaultTools`; the assembly seam registers them only when a scheduler is
  wired (mirrors `shadow-tools-trio` and `branch_search` posture).
