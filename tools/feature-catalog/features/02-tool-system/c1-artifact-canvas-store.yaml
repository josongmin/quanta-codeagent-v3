id: artifact-canvas-store
title: Canvas / artifact persistence store (C1 — non-code generation outputs)
section: 2
subsystem: 도구 — artifact store (생성축 lifecycle, Cursor Canvas 흡수)
order: 170
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:cli", "absorbed:cursor"]
depends_on: [document-image-fsjail-unify]
purpose: |
  Cursor `agent.v1.Canvas{Register, GetUrl, Destroy}` 흡수 — 생성축(H14 image_gen /
  xlsx_write / docx_write / pptx_write)이 만든 NON-code 바이너리를 transcript와 분리해
  등록·조회·파기 + 안정 미리보기 URL. "만든 파일을 어디 두고 어떻게 참조하나"의 답.

  코어 (`src/artifact/registry.ts`, PURE leaf, @/shared만, 주입 clock+idFactory —
  Date.now/Math.random 없음):
    - `Artifact{id,kind,path,mediaType,label?,createdAt}`, closed `ArtifactKind`
      (image|spreadsheet|document|presentation|other).
    - `createArtifactRegistry({now,idFactory})` → register/get/list/destroy
      (in-memory, list는 createdAt→id byteCompare 정렬 immutable 스냅샷).
    - `previewUrl(a)` = `quanta-artifact://<id>` (안정 opaque 참조 — 파일 이동해도
      유효, fs 절대경로 transcript 누출 방지).

  도구 (`src/tool/artifact/`, duck-typed port로 @/tool fence clean):
  `artifact_register`(생성물 등록→id+url) / `artifact_list` / `artifact_get` /
  `artifact_destroy`. `DefaultToolPorts.artifactRegistry`로 caller-wired,
  `QUANTA_ARTIFACT_STORE` default-OFF(없으면 미등록=byte-identical). 호스트가 세션당
  registry 1개 mint(`agent-arg-builder buildBaseRegistry`).
