purpose: |
  The stale-read guard recorded the mtime a file carried when the agent read it and
  blocked a later write only on a STRICT FORWARD move — its own comment says "only a
  FORWARD move is evidence of an external write after the read".

  That makes it bypassable by anything that changes CONTENT without advancing the
  timestamp, and none of it is exotic: `cp -p`, `rsync --times`, `tar -x`,
  `git checkout` on some filesystems, a build step that restores mtimes, or two writes
  landing in the same tick on a second-granularity filesystem. Measured on the shipping
  guard: a same-mtime swap and a backward-mtime swap were BOTH allowed.

  Separately, `subagent-runner-child-config.ts` never mentioned `readFileState`, so a
  SUBAGENT ran with no stale-read guard at all. And the obvious fix — hand down the
  parent's instance — is wrong in a second way: a read is an OBSERVATION BY ONE AGENT.
  An inheriting child would believe it had read files it never saw, and one sibling
  re-reading a file would launder another sibling's stale baseline back to fresh.

  CONTENT WINS when both sides have a digest: equal ⇒ fresh even if the mtime moved
  forward (a `touch`, a mode change, or a rewrite to identical bytes must not veto the
  next edit); different ⇒ stale even if the mtime did not move. With no digest on
  either side the forward-mtime rule runs unchanged, so a caller that cannot cheaply
  hash keeps today's behavior byte-for-byte.

  ONLY A FULL READ issues an observation — a ranged read describes a window, not the
  file, and its hash would baseline the guard against content that was never the file's.

  NO EXTRA IO on the read/edit paths: the read tool already holds the whole file in
  `outcome.text`, and the edit tool already read the source in `planEdit` to match
  `old_string` (`planned.before`). Both hash something already in memory. The
  `apply_patch` multi-target preflight is the one path that pays a real read per target
  — measured at 27 us warm and wired anyway (see notes).
