purpose: |
  Three modules that compose the vision-input slice. (1) `read_image`
  (ADR-0126) reads an image file from disk, magic-byte-sniffs the media
  type (rejecting any byte sequence that doesn't match a supported PNG /
  JPEG / GIF / WEBP signature), enforces a 5 MB cap (Anthropic Messages
  vision raw-byte ceiling), and surfaces it via `ToolResult.images`.
  Security: leaf-symlink reject via `lstat().isSymbolicLink()`. (2)
  `read_image_url` (ADR-0146) — URL → vision pipeline composing the
  read_image sniffer + cap with an SSRF denylist mirroring `web_fetch`;
  https-only, DI fetcher seam for tests. (3) `compose.ts` returns ONE of
  two shapes: when `result.images` is absent/empty, the LEGACY string
  (byte-identical to current dispatch path); otherwise a ContentBlock-
  shaped array `[{type:"text",text:output}, ...images]` that the
  dispatch seam wires at the model-message boundary.
