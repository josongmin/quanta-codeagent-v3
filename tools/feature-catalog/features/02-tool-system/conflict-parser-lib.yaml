purpose: |
  Pure typed-and-tested git merge-conflict parser shared by skills and tools
  that need to programmatically inspect merge conflicts. Input is the entire
  file contents (the agent has already `Read` them); output is the typed
  `ConflictParseResult` with `ConflictBlock[]` + `ConflictParseDiagnostic[]`.
  No second I/O, no git binary, no marker-shape ambiguity. Contract:
  (1) PURE — no I/O, no `Buffer`, no `child_process`, input `string` →
  output typed result; the parser does NOT consult the filesystem to verify
  the conflict is real (caller's concern). (2) NO-THROW — malformed conflicts
  produce a typed `ConflictParseDiagnostic`, NEVER a throw; the ONLY thrown
  exception is `ConflictParserInputError` (programmer bug — non-string input).
  (3) `exactOptionalPropertyTypes` — optional fields (`base`, `baseLabel`) are
  OMITTED, never set to `undefined`. (4) PLANE-CLEAN — imports nothing from
  `@/agent`, `@/tool`, `@/permission`; only `@/shared` (for `QuantaError`).
  (5) Segment-anchored markers — a marker is recognised ONLY at column 0.
  DEFAULT-OFF: nobody in the loop imports this file today; a future
  `fix-merge-conflicts` skill / git tool opts in by importing `parseConflicts`.
