purpose: |
  Typed seam for tools that need to return a provisional placeholder plus a
  `DeferredHandle`, with the final `ToolResult` produced out-of-band and parked
  here until a poller resolves it. Pure in-memory registry: `register(hint?)`
  issues a fresh handle (`deferred-<n>` ids), `resolve(handle, result)` moves
  it from pending→resolved, `poll(handle)` returns a discriminated
  `DeferredToolResult` (`state: "pending" | "resolved"`). Unknown ids surface
  as `UnknownDeferredHandleError` (typed `QuantaError` code
  `deferred_unknown_handle`). This is the TYPE SURFACE ONLY — there is
  deliberately no async scheduler wired into the agent loop, so the contract
  can be exercised in isolation and a real scheduler can adopt it later without
  changing the surface. Underpins `defineTool`'s `supportsDeferredResults` flag
  (see `tool-output-schema-factory`).
