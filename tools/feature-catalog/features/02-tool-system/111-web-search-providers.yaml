deliberate_hold: null
notes: |
  Companion of `web-fetch-search` (the tool slice + port). Why Brave (vs
  Google / Bing / SerpAPI / scraping): free tier + typed JSON +
  commercial-friendly TOS + Anthropic-parity. DuckDuckGo is the
  zero-config fallback.
