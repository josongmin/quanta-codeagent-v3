notes: |
  Naming: the legacy class keeps its historic name `DeferredResultRegistry`
  (still re-exported from `@/tool` via `src/tool/deferred/index.ts`). The
  NEW port is also named `DeferredResultRegistry` but is reachable ONLY
  via `@/tool/deferred/port` — the barrel re-exports only the legacy
  class to avoid collision. New concrete impl is
  `DefaultDeferredResultRegistry` from `@/tool/deferred/default-registry`.
  No existing caller is touched; legacy hellgate (`tool-factory.test.ts`)
  stays byte-identical.
