knobs:
  - name: QUANTA_EDIT_FRESH_HASH
    default: 'DEFAULT-ON (opt-out)'
    purpose: 'DEFAULT-ON via `!gateDisabledStrict` (off ONLY for the literal `off`, like the fs-jail / stale-read-guard kill-switches — a stray falsy token must not silently disable it). ON ⇒ a successful edit/write/scripted_replace appends `fresh sha256: <hex>` (the model reuses it as the next same-file edit''s expected_hash, eliminating the re-read the 0398 precondition otherwise forces) AND every mutating tool (incl. apply_patch, per touched file) refreshes the stale-read guard baseline so the chained edit is not vetoed stale_read. `=off` ⇒ ctx.editFreshHash absent ⇒ BYTE-IDENTICAL legacy output + no baseline refresh. Ships ON — removes a forced re-read (near-certain token win) and the baseline refresh is a correctness fix, not a speculative lever.'
deliberate_hold: null
notes: |
  jul-13. Complements 0398 (atomic-write-and-hash-precondition): 0398 added the
  optimistic-lock (`expected_hash` ⇒ stale_precondition on mismatch), but without
  a fresh hash on success the lock is self-defeating on sequential same-file edits
  (measured ~41%). This closes that loop.

  Hellgate (tests/unit/edit-fresh-hash-hellgate.test.ts, 6 tests, red-on-injection
  proven by 3 injections): (1) OFF byte-identical; (2/3) ON advertises sha256 of
  POST-edit bytes == actual on-disk bytes (hashing `before` → RED); (4) E2E
  chained same-file edit with the advertised hash SUCCEEDS (no stale); (5) paired
  control — reusing the pre-edit read-time hash DOES go stale (proves the bug the
  fix cures); (6) REAL-fs round-trip fidelity (CRLF + no-trailing + multibyte,
  advertised == sha256(readFileSync) — EOL-normalizing the hash → RED). The mock
  ports are READ==WRITE identity, so the real-fs describe is what actually guards
  the disk round-trip.

  CROSS-TOOL PARITY (jul-13): the feature is not edit-only. `edit`, `write`, and
  `scripted_replace` share ONE implementation (`_shared/fresh-hash.ts`: freshHashNote
  + refreshStaleReadBaseline) — every single-flat-file mutation advertises the
  post-write sha256 AND refreshes the stale-read baseline, so the model chains a
  next edit to that file without a re-read regardless of which tool wrote it
  (write→edit and scripted_replace→edit cross-tool chains pinned). `apply_patch`
  (multi-file) shares the baseline-refresh HALF via the same `recordFreshBaseline`
  chokepoint — `refreshApplyBaselines` re-stats each ADDED/UPDATED/MOVED-to file
  post-commit and records the new mtime, so an edit chained onto a patched file
  survives the guard (pinned per-file + multi-file). It intentionally OMITS the
  hash EMISSION: the single-flat-file tools have their post-write bytes in memory
  (free digest) but apply_patch's atomic temp+rename discards per-file content, so
  emitting would need N re-reads — defeating the zero-standing-cost invariant. A
  stat (refresh) has no such cost, so the correctness half ships; emission does
  not. `notebook_edit` gets the SAME refresh-only treatment: it mutates the .ipynb
  and uses the same DEFAULT-ON mtime guard, so an adversarial completeness audit
  found it would false-`stale_read` a chained notebook_edit/edit. It now calls
  refreshStaleReadBaseline post-write (pinned) but OMITS emission — it is cell-op
  based and does not consume `expected_hash`, so the single-flat-file chain
  contract does not apply. `file_history_rewind` (op:"restore") is the SIXTH
  mutating tool — it overwrites a file with a prior version (mtime advances) and
  was found by the completeness ratchet (below) to have the SAME missing-refresh
  gap; it now refreshes post-restore (refresh-only). ALL six file-mutating tools
  (edit/write/scripted_replace/apply_patch/notebook_edit/file_history_rewind) are
  covered.

  COMPLETENESS RATCHET (SOTA++, prevents recurrence):
  edit-fresh-hash-mutating-tool-completeness-ratchet.test.ts statically scans
  src/tool/** for every tool that writes a file and asserts each CALLS a refresh
  primitive (or is in an explicit REFRESH_EXEMPT allowlist with a reason). A NEW
  mutating tool that forgets the refresh — the exact notebook_edit / file_history
  class of gap — turns it RED at construction time (OmO single-writer static-audit
  pattern). It requires a CALL not a bare import, so an import-but-inert refresh is
  also caught; an anti-vacuum floor test pins the known 6 writers so a regex drift
  cannot make it vacuously green.

  DEFEAT-AND-CURE (found by adversarial hardening): the DEFAULT-ON mtime stale-read
  guard (ADR-0474) would veto a fresh-hash CHAINED edit with `stale_read` because a
  successful mutation advances the file's mtime while the guard baseline stayed at
  the read-time value — silently defeating the "no re-read" promise in the default
  config. Cured by refreshStaleReadBaseline (a successful mutation IS a fresh read
  of its own output). An EXTERNAL modification still trips stale_read (TOCTOU
  preserved — pinned). Suite: 13 files, 92 tests, red-on-injection proven per tool
  (disabling refreshStaleReadBaseline/refreshApplyBaselines flips the
  mtime/cross-tool/apply/notebook/file-history chains RED; freshHashNote flips the
  emit RED) + the static completeness ratchet flips RED on any missing-refresh.

  Ships DEFAULT-ON (jul-13): this is not a speculative lever — the emission removes
  a forced re-read (small fixed add vs a file-size-proportional re-read saved) and
  the mtime-baseline refresh is a correctness fix. The only residual is model
  ADOPTION (does the model reuse the advertised hash), which is observability, not
  an on/off efficacy gate; monitor re-read-count on a bench box and set `=off` if
  ever regressive. A full agent-loop e2e (read→edit→edit through the real runAgent
  turn loop) pins that the chain works end-to-end via the real dispatch + prompt.
