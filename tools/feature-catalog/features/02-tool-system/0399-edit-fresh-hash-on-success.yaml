id: edit-fresh-hash-on-success
title: fresh-hash on success — self-inflicted-staleness root fix, edit/write/scripted_replace (jul-13)
section: 2
subsystem: 도구 시스템 — mutating-tool optimistic-lock chaining (0398 precondition 보완재)
order: 399
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "default-on"]
depends_on: [edit-tool, atomic-write-and-hash-precondition]
surface_integration:
  cli: full
  web: full
  method: audited
  verified: "2026-07-13"
  evidence:
    cli: "runs in the interactive CLI — the fresh-hash line rides the edit tool_result output; dispatch seam wires ctx.editFreshHash from runtimeConfig().editFreshHash (src/agent/dispatch/tool-context.ts). DEFAULT-ON (active by default); set QUANTA_EDIT_FRESH_HASH=off ⇒ byte-identical legacy output."
    web: "Enhancement to the edit tool output; the edit tool_call/tool_result render as the generic tool card, so the appended `fresh sha256: <hex>` line surfaces in the result preview on the same surface as the 0398 stale_precondition failure it complements."
purpose: |
  MEASURED root fix (bench trajectory dedup, django__django-14315 ×2 runs): ~41%
  of edits (7 distinct events / 17 edits, not_found=0) hit stale_precondition —
  ALL from the model's OWN prior edit to the same file (e.g. postgresql/client.py
  failed 4× with 4 different current-hashes). Cassette double-count trap: raw echo
  171 → 7 real events after deduping on the unique (actual,expected) hash pair.
  Root cause: the 0398 precondition (`expected_hash`) has no counterpart — a
  SUCCESSFUL edit changes the file, so the model's read-time hash is instantly
  stale for the next same-file edit, forcing a full re-read purely to re-hash.
  Fix: when gated ON, a successful edit appends `fresh sha256: <hex>` = sha256 of
  the POST-edit bytes (`planned.next`, already in memory ⇒ no extra read) so the
  model chains the next edit's `expected_hash` WITHOUT a re-read. Round-trip
  fidelity is load-bearing (the model re-hashes off DISK): commitEdit writes
  `planned.next` verbatim (no EOL/encoding normalization) and the edit strategies
  preserve per-line EOL, so sha256(planned.next) == sha256(readFile after commit)
  — pinned on a REAL fs with CRLF + no-trailing-newline + multibyte content.
  DEFAULT-ON opt-out QUANTA_EDIT_FRESH_HASH (off only for the literal `off`, like
  the fs-jail / stale-read-guard kill-switches); `=off` ⇒ ctx.editFreshHash absent
  ⇒ success output BYTE-IDENTICAL to legacy. Ships ON — it removes a forced re-read
  (near-certain net-negative tokens) and the mtime-baseline refresh is a
  correctness fix, so it is not a speculative measure-first lever.
