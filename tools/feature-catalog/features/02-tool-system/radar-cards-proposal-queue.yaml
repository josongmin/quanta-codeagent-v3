id: radar-cards-proposal-queue
title: ADR-0231 Radar Cards — background proposal queue MVP (Claude CoworkRadar)
section: 2
subsystem: Background task proposal engine
order: 231
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive]
configurable: integrated
owners: ["@songmin"]
labels: [absorbed:claude, surface:cli, default-off]
depends_on: []
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-15"
  evidence:
    cli: "LIVE end-to-end behind QUANTA_RADAR: producer hook (src/agent/radar-producer-hook.ts) fires at the turn boundary (src/agent/loop/turn-loop.ts finally, completed-turn only) depositing idle/long-task cards into the store; surface-compose builds the gated store once and threads the SAME instance into both AgentConfig.radar.store (via RuntimeFacadeComposeOptions pass-through, sdk/runtime/context.ts) and the /radar slash command (registry-surface.ts radarCmd: list/adopt/dismiss/engage/prune). Default-OFF: gate unset ⇒ no producer sampling + /radar 'not wired' (byte-identical)."
    web: "background proposal queue desktop panel still unbuilt; no web component renders RadarCards yet (CLI /radar is the live surface)"
purpose: |
  Claude Desktop CoworkRadar 흡수 (MVP scope) — background에서 task
  suggestion을 active proposal로 큐잉. 8-field RadarCard (id/kind/title/
  description/sessionId?/createdAtMs/status/engagementCount) + 4-arm status
  (active/adopted/dismissed/expired) + 3-arm kind (suggestion/warning/next-step).
  RadarStore 5-method port (proposeCard/listActive/setStatus/recordEngagement/
  prune) + 2 adapter (in-memory LRU / jsonl-file append-only). jsonl 0600
  권한, replay double-write 방지 (replaying flag). idle-long-task sample heuristic
  (pure, store push는 caller).

  Bug-fix suggestions use the same RadarCard owner, not a second in-memory
  proposal queue. Their typed immutable metadata records source, hypothesis,
  and verify intent; both stores deep-clone and freeze it at the boundary.
evidence:
  code:
    - src/radar/port.ts
    - src/radar/types.ts
    - src/radar/in-memory-store.ts
    - src/radar/jsonl-file-store.ts
    - src/radar/headless-stub.ts
    - src/radar/heuristics/idle-long-task.ts
    - src/radar/index.ts
    - src/agent/radar-producer-hook.ts
    - src/agent/loop/turn-loop.ts
    - src/apps/cli/slash/registry-surface.ts
    - src/apps/cli/repl/surface-compose.ts
  adrs: [231, "docs/decisions/0188-bug-fix-proposal-queue.md"]
  tests:
    unit:
      - tests/unit/radar/radar-hellgate.test.ts
      - tests/unit/radar/radar-e2e-hellgate.test.ts
      - tests/unit/radar/bug-fix-card-hellgate.test.ts
knobs: [QUANTA_RADAR, QUANTA_RADAR_FILE, QUANTA_RADAR_TASK_MS, QUANTA_RADAR_PRUNE_MS]
deliberate_hold:
  reason: |
    LIVE end-to-end (jun-15): producer hook + /radar surface + gated store wired
    via RuntimeFacadeComposeOptions pass-through. RESIDUAL = depth only: more
    heuristics (idle-stuck / branch-stale) + a web/desktop panel + an engagement
    OTel emit (`quanta.radar.engagement`).
  promotion_path: |
    Add further heuristics, a web RadarCard panel, and the engagement metric emit.
notes: '20 store hellgate + 14 e2e hellgate (producer hook fresh-readback, /radar list/adopt/dismiss/engage/prune, jsonl 0600 + replay no-double-write, default-OFF byte-identity). red-on-injection: neuter proposeCard ⇒ producer case RED. Default-OFF: QUANTA_RADAR unset ⇒ no sampling + /radar not-wired (byte-identical).'
