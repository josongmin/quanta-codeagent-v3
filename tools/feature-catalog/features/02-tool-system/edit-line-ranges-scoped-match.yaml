notes: |
  No knob: the optional field is ALWAYS accepted and omitting it is
  byte-identical to legacy, so gating exposure behind an env var would only
  trim the tool description for lean surfaces — not worth the branch. The
  prefilter hooks in two places, both BEFORE the ladder's scoring: exact path
  via `inRangeMatchOffsets` (byte-offset → line membership) in
  `applyExactEditInRange`; fuzzy rungs via `filterSpansByRange`
  (window-start line membership) feeding `applyWindows` / the scored-candidate
  pool. The bias is preserved end-to-end: a non-unique in-range match without
  `replace_all` still fails `ambiguous` rather than guessing.
