purpose: |
  Optional `line_ranges: [{start, end}]` field on the `edit` tool input —
  1-indexed, inclusive on BOTH ends (Cursor `LineRange{start_line_number,
  end_line_number_inclusive}` semantic). When present it PREFILTERS the
  candidate match windows to only those whose match lands inside ANY supplied
  range, applied BEFORE the existing exact→whitespace→anchored→scored ladder
  runs (a deterministic structural narrowing of the candidate set — it does NOT
  alter the exact/fuzzy scoring). A repeated anchor that today fails `ambiguous`
  outright (`exact.ts` returns `kind: "ambiguous"` on count > 1) becomes
  deterministically addressable — "the occurrence on lines 40-60" — with no
  extra LLM round-trip. A multi-line `old_string` is scoped by the line its
  FIRST character lands on. Decisions: zero in-range matches → clean typed
  failure distinguishing "absent from file" vs "present but outside your range"
  (never a wrong-location edit); >1 in-range match (without replace_all) → still
  `ambiguous` (fail clean — a wrong edit is worse than no edit), but now the
  range can be narrowed; malformed range (non-integer / start < 1 / end < start)
  → `rejected` failure with a fix-it message, no-throw. ABSENT line_ranges ⇒
  whole-file search, byte-identical to the pre-H12 path (always-accept-optional
  posture, so no knob is needed — the field defaults to omitted).
  Paired improvement: an `ambiguous` failure (scoped or unscoped) now appends
  the file's total line count to the model-facing message so the model can pick
  a valid `line_ranges` span on retry instead of re-guessing.
