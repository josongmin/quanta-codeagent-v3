purpose: |
  Distinct axis from the runner's wall-clock timeout (ADR-0105) and from
  `GitBudget`'s deadline (ADR-0107): an optional caller-supplied `AbortSignal`
  is forwarded through `GitRunner.run(args, cwd, signal?)` and into
  `defaultGitRunner` so a cancelled tool call (loop abort, subagent cancel,
  side-conversation budget exhaustion) IMMEDIATELY kills the spawned `git`
  child instead of orphaning it for the full 30 s wall-clock. The abort
  listener is unhooked in `finally` so an already-completed run never leaks a
  reference into the parent AbortSignal's listener set — pre-aborted signals
  short-circuit to a sync `proc.kill()` and never register a listener at all.
  The `?` on the `signal` parameter preserves the fake-runner test surface
  (callers without a signal still type-check). `safeRun` in `_shared.ts`
  threads the signal through the boundary discriminated outcome, so every
  read-only and mutating tool inherits cancellation for free.
