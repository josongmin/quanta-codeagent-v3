notes: 'Companion to `git-budget` (ADR-0107 deadline) and `git-runner-env-determinism` (ADR-0105 30 s wall-clock). Three independent kill paths layered: parent abort → budget deadline → runner timeout; whichever fires first wins. Listener-leak avoidance: `removeEventListener` in `finally` + `{ once: true }` on registration.'
