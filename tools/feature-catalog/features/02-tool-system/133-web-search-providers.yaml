owners: ["@songmin"]
labels: [surface:cli]
purpose: |
  ADR-0127 landed the `web_search` tool + `WebSearchProvider` closed port but
  shipped zero concrete impls — production behavior was `ok:false "no
  web_search provider wired"` graceful degrade. This ADR closes that gap with
  2 factories, both OPT-IN (host injects into AgentConfig.webSearch.provider —
  no auto-registration on the tool barrel). `braveSearchProvider` — Brave Search
  REST API primary; `X-Subscription-Token` header (NEVER URL — keys must not
  leak to proxy/referrer logs), Accept:json + Accept-Encoding:gzip, count
  clamped both sides of documented [1,20], signal forwarded verbatim (spread
  only when defined for exactOptional clean), typed `BraveSearchError` for
  non-2xx / parse / network. 200 with no `web.results` → `[]` (zero-match info
  query is graceful empty, NOT an error). No env reads — host sources the key.
  `duckduckgoSearchProvider` — Instant Answer endpoint fallback, no API key;
  limited (IA only, not full search — `prefer brave when you have an API key`).
  Maps RelatedTopics[*] → {title, url, snippet}, flattens disambiguation Topics
  one level deep.
