id: web-search-providers
title: Web search provider impls — Brave primary + DuckDuckGo fallback (ADR-0133)
section: 2
subsystem: 도구 — web search (concrete WebSearchProvider impls)
order: 134
maturity: L4
status: new
ui_surfaces: [cli]
