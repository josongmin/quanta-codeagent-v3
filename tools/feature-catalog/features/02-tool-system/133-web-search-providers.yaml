notes: |
  Providers stay off `src/tool/web/index.ts` and `src/tool/index.ts` main
  barrels so hosts that don't want web search pull in zero provider code (tree-
  shake friendly + concurrent sibling work safe). Both error shapes route
  through the `webSearchTool` boundary (ADR-0127) which converts to `ok:false`.
