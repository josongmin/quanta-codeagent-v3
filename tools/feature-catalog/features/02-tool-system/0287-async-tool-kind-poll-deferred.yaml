depends_on: [deferred-result-registry-production, tool-output-schema-factory]
purpose: |
  Three-piece async-tool seam built on ADR-0286 registry:

  (1) `defineToolAsync(spec)` wrapper — factory accepts a closed-port
  `DeferredResultRegistry` at construction (NOT via ToolContext, because
  src/tool/types.ts is slice-fence-locked AND because lifecycle ownership
  is structural). Registry undefined ⇒ wrapper degrades to synchronous
  execution (byte-identical default-OFF). Registry wired ⇒ wrapper
  registers `(signal) => work(input, ctx, signal)`, yields a placeholder
  result with `deferred: {id, hint: pendingMessage}` on
  `ToolResult.deferred` (legacy shape).

  (2) `poll_deferred` tool (`pollDeferredTool(registry)`) — caller-wire
  LLM probe. Input `{handle, awaitMs?}`. awaitMs=0/absent ⇒ poll only;
  awaitMs>0 ⇒ await with timeout. Renders closed 5-arm `Status` literally
  (`[pending] / [running] / [completed] / [failed] <reason> / [cancelled]
  <reason>`). On completed: unwraps inner ToolResult with
  `<completed via=deferred handle=X>` prefix.

  (3) Dispatch wire (1-3 line edit in src/agent/dispatch.ts) —
  prepends `<deferred handle="..."/>` envelope to `output` when
  `result.deferred !== undefined`. Absent ⇒ output unchanged
  (byte-identical default-OFF). LLM branches on the stable tag.
