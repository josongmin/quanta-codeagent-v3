id: async-tool-kind-poll-deferred
title: Async tool kind + poll_deferred — defineToolAsync + LLM probe (ADR-0287)
section: 2
subsystem: 도구 — async tool wrapper + dispatch envelope (ADR-0287)
order: 287
maturity: L4
