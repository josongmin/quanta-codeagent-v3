  promotion_path: "Stage1 sqlite store와 동형 pattern (registry behind same port)"
notes: |
  Factory-time DI (not ToolContext) is intentional: (a) ToolContext mirror
  in src/tool/types.ts is constraint-protected; (b) async tool lifecycle
  is owned by ONE registry, structural ownership prevents mid-session
  swap. `poll_deferred` is caller-wire (mirrors mcp_tasks_* / shadow_* /
  subagent_*_bg) — composition root passes the same registry to every
  defineToolAsync instance + pollDeferredTool. Dispatch wire is the
  smallest possible surface: detect `result.deferred`, prepend envelope.
