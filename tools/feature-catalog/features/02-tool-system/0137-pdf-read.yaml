notes: |
  `DocumentBlock` is added to the `ContentBlock` union and `ToolResult.documents`
  is an optional field — absent on every legacy tool, byte-identical when no
  caller emits it (same additive posture as ADR-0126's `images`). Caller-
  deferred registration; host wires per slice.
