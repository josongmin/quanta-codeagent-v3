purpose: |
  PDF reader that ships ZERO client-side text-extraction dependency. Every
  other modern agent (Cursor / Codex / Cline) pulls `pdf-parse` / `pdfjs`
  and stitches OCR; we instead emit a typed `DocumentBlock` (base64 +
  `application/pdf` mediaType) on a new `ToolResult.documents` field that
  the dispatch wire (ADR-0121 + ADR-0126) automatically composes into the
  next user message via `composeToolResultContent`. Claude then handles
  vision + text + form natively (including scanned PDFs, no OCR). Magic-
  byte SSOT (`%PDF-` / 0x25 0x50 0x44 0x46 0x2D) prevents PNG-with-.pdf-
  extension spoofing. 32 MB cap matches the Anthropic Messages API
  document-block ceiling. Path safety, READ-ONLY + concurrency-safe.
