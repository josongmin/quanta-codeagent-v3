    description: realtime model id (not hardcoded; from config)
  - name: voice
    description: output voice (default alloy; ListVoices follow-up)
  - name: vad.threshold / vad.prefixPaddingMs / vad.silenceDurationMs
    description: server-VAD knobs — passed through; omitted ⇒ API default (no invented tuning)
