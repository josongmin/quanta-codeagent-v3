id: document-tools
title: csv_read + ndjson_read — structured document tools + pure parsers (ADR-0133)
section: 2
subsystem: 도구 — structured document (ADR-0133)
order: 110
maturity: L4
status: new
purpose: |
  Two structured-document tools delivered as a single slice, each backed
  by a pure parser. (1) `csv_read` — read a CSV file, parse with the pure
  `csv-parse` parser (RFC 4180 quoting + CRLF/LF normalization + escape
  doubling), optional column-name typed schema; typed `ok:false` for
  schema / IO / oversize / parse failure. (2) `ndjson_read` — read a
  newline-delimited JSON file; per-line JSON.parse; line-numbered typed
  failure (`parse:` carries line index for diagnosability). Both tools
  honor caller-passed file-system port (test-injectable; production binds
  node:fs/promises). Pure parsers (`csv-parse.ts` / `ndjson-parse.ts`)
  are export-only — usable from non-tool contexts (e.g. memory store
  ingest) without paying for the tool wrapper. Slice posture: imports
  ONLY `zod`, `../types`, the local parser sibling, and the injected fs
  port — NO `@/agent`, `@/permission`, `@/storage`, `@/memory`. Not in
  `defaultTools`; caller-deferred registration mirrors `read_image` /
  `shadow_*`.
