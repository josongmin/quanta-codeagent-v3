knobs: []
deliberate_hold:
  reason: |
    팩토리·검증·deferred registry·streaming-input 드라이버는 순수 함수로 완성+테스트되었으나
    live streaming-dispatch 배선은 follow-up(// TODO(absorb #1)). 현재는 opt-in seam.
  promotion_path: |
    driveStreamingInput을 streaming-dispatch의 tool_use_start/delta/end에 매핑하고
    outputSchema 검증을 dispatch seam에 배선하면 L3.
notes: 'ToolEvent union은 progress|result 2-variant 유지(deferred는 ToolResult.deferred 필드) — 기존 내로잉 byte-identical 보존.'
