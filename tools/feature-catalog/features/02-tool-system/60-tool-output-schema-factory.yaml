purpose: |
  v0.dev createProviderToolFactoryWithOutputSchema 흡수 — Tool에 4개 OPTIONAL 능력
  추가: outputSchema(결과 Zod 검증, 불일치 시 ok:false retry-지시), toModelOutput(모델용
  compact 표현 분리로 토큰 절약), supportsDeferredResults(장기 도구 deferred handle +
  registry), onInputStart/Delta/Available(tool input 스트리밍 콜백). 전부 default-OFF —
  미사용 도구는 byte-identical.
