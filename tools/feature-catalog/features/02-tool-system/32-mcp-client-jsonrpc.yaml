purpose: |
  Wire-level details behind `mcp-tool-bridge`. (1) Newline-delimited
  JSON-RPC 2.0 codec — MCP framing is NOT LSP `Content-Length`; every
  message is a single line of UTF-8 JSON terminated by `\n`, no embedded
  raw newlines. `LineReader` owns a byte buffer + only emits a message
  once a full `\n`-terminated line arrives (server may flush several
  messages in one chunk OR split one message across chunks). Closed
  `JsonRpcMessage` discriminated union — response (by `id`) vs
  notification/request (by `method`). (2) `McpClient` — protocol version
  `"2025-06-18"`, `CLIENT_INFO` { name:"quanta", version:"0.1.0" },
  default request timeout 30s. Lifecycle: `start` / `initialize` /
  `tools/list` / `tools/call` / `listResources` / `readResource` /
  `listPrompts` / `shutdown`. HTTP OAuth 재인증은 `client/reauthorize.ts`:
  create→start→initialize(raw, 401 재귀 없음)→initialized notification→
  negotiated state publish. Replay allow-list는 idempotent initialize/list
  계열뿐. `tools/call`은 완료 불명이면 auto-replay 금지. handshake 실패는
  candidate만 close하고 old transport를 restore(old 세션을 먼저 파괴하지 않음).
  stop은 candidate+old 둘 다 close. (3) `McpError` typed
  failure (extends `QuantaError`, code: "mcp") — stable code lets callers
  branch without string matching. (4) `MAX_RESULT_CHARS = 200_000` —
  max chars of joined tool-result text we hand back from `callTool` to
  prevent a malicious/buggy MCP server returning a huge text blob from
  flowing unbounded into memory + model prompt (DoS guard). Mirrors the
  repo-wide tool-output cap (`@/tool` `DEFAULT_TOOL_OUTPUT_MAX`) but
  duplicated as a local constant because `@/mcp` may not import `@/tool`
  (slice isolation, RFC §3.1). Sub-cap results returned byte-identical.
