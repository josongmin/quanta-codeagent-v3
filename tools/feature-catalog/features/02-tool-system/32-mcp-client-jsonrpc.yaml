id: mcp-client-jsonrpc
title: McpClient — line-framed JSON-RPC 2.0 + typed McpError + output cap
section: 2
subsystem: MCP — stdio JSON-RPC 2.0 codec + client
order: 32
maturity: L4
status: stable
