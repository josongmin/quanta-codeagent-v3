deliberate_hold: |
  - 실제 search adapter (BigCode / Sourcegraph / GitHub Code Search 등) —
    이번 라운드는 headless stub 만; production adapter는 후속 ADR
  - license enforcement gating (e.g. "GPL-3.0 match를 MIT 프로젝트에
    쓰려 하면 거부", license-conflict UI surface) — retrieval 슬라이스만
    먼저 안전하게 착륙시키고 후속에서 gate
  - `buildDefaultTools()` 등록 + `MUTATING_TOOL_TABLE` entry — host
    composition root가 실제 adapter를 wire하는 ADR에서 함께 추가
    (shadow / subagent-bg / mcp_tasks의 같은 caller-wire 패턴)
  - similarity 캘리브레이션 / 임베딩 모델 선택 (semantic vs token vs hybrid)
    — adapter 별 trade-off은 production adapter ADR에서 결정
notes: |
  Sibling import 방향: src/tool/ai-attribution/ → @/shared 만. 다른 슬라이스
  역참조 없음. tsconfig `@/tool/*` alias 이미 존재.

  `headless-stub.ts`의 FNV-1a-32 해시는 결정론적 시드용일 뿐 — 암호학적
  목적이 아님. 5-row base table에 license arm별 1행씩 매핑돼 있어서
  HELL-AA-08 (5-arm 도달) 이 stub만으로도 깨끗하게 충족된다.

  `MUTATING_TOOL_TABLE` 미수정은 의식적 결정 — 이 라운드는 default-OFF
  caller-wire 슬라이스만 착륙시키고, 실제 host가 adapter를 wire하는
  후속 ADR에서 같은 PR로 `ai_attribution: null` (read-only) 추가한다.
  shadow_* / subagent_* 가 wire 시점에 같이 추가된 선례와 동일.

  HELL-AA-15는 anchor tuple sort 한 결과를 `["aborted","empty-snippet",
  "search-failed","snippet-too-large"]`와 정확히 비교 — 5번째 arm 추가 시
  컴파일 + 런타임 양쪽 모두 깨지도록 closed-union을 봉인.
