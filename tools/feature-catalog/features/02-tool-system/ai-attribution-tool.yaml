purpose: |
  Cursor `CLIENT_SIDE_TOOL_V2_AI_ATTRIBUTION` 흡수의 slice primitive —
  생성/검토하는 코드 스니펫의 training-data 출처를 외부 코퍼스에서
  검색해서 (source, license, similarity, optional URL) ranked matches를
  반환한다. 이번 라운드는 closed `AIAttributionSearch` port + 결정론적
  headless stub (FNV-1a 해시 시드, 5-row base table) + `defineTool`-기반
  `ai_attribution` 툴 등록 (caller-wire) + 15-case hellgate 까지.

  핵심 모양:
    - `SearchError` 4-arm 닫힌 union — `empty-snippet` / `snippet-too-large` /
      `search-failed` / `aborted` (anchor tuple `SEARCH_ERROR_KINDS`)
    - `License` 5-arm 닫힌 union — `MIT` / `Apache-2.0` / `GPL-3.0` /
      `proprietary` / `unknown` (anchor tuple `LICENSES`)
    - `AttributionMatch.url` 은 OPTIONAL — 어떤 source는 URL이 없다
    - `SNIPPET_MAX_BYTES = 10_000` — 툴 입력 검증 + 포트 wrapper 양쪽에서
      defense-in-depth로 enforce
    - similarity `[0, 1]` 강제 — adapter가 1.7 / -0.4 같은 거짓 값 보내도
      툴 layer가 드롭
    - **default-OFF byte-identical**: `src/tool/index.ts` unchanged,
      `buildDefaultTools()`에 안 들어감, `MUTATING_TOOL_TABLE`도 안 건드림
      (host가 wire할 때 같이 추가)
