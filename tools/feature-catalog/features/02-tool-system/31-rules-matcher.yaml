notes: |
  Layer precedence NOT applied here — `RulesStore` (`src/rules/store.ts`)
  composes 3 layers (project > user > system). Higher-precedence layer
  ALWAYS wins even with shorter prefix — intentional so a project override
  of `git push` beats a system rule for `git push --force`. Companion of
  `prefix-rule-dsl` (the grammar + DSL absorption) which the parser produces
  the `Rule[]` the matcher consumes.
