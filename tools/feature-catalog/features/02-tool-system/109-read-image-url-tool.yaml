id: read-image-url-tool
title: read_image_url — HTTPS URL → vision pipeline (ADR-0132)
section: 2
subsystem: 도구 — multimodal image (ADR-0132)
order: 109
maturity: L4
status: new
purpose: |
  Thin composer tool that fetches an HTTPS image URL and surfaces it via
  `ToolResult.images` for the dispatch seam to wire into a vision-capable
  `tool_result`. Reuses ADR-0126 (`read_image` magic-byte sniffer + 5 MB
  cap) and ADR-0127 (`web_fetch` SSRF denylist + https-only) instead of
  reinventing them. Slice posture: imports ONLY `zod`, `./read` (sniffer
  + cap SSOT), `../types` — does NOT import `../web/fetch` (sibling slice
  concurrently touched + SSRF predicate not exported). The 9-range SSRF
  denylist is DRY-violation-by-design (intentional duplication
  documented in the ADR; future helper consolidation deferred). No-throw:
  every failure mode (schema / abort / non-https / SSRF deny / fetch
  error / non-2xx / oversize / bad magic) collapses to typed `ok:false`.
  DI seam: `readImageUrlTool({ fetcher })` lets tests inject fake
  `fetch`; production callers `readImageUrlTool()` bind global `fetch`.
  Not in `defaultTools`; caller-wired (mirrors `read_image` posture).
