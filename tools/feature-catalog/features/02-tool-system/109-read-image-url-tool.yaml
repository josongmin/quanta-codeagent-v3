knobs: []
deliberate_hold:
  reason: 'DNS-resolution-aware SSRF (post-resolve range check) deferred — today literal-host denylist only, matching ADR-0127 web_fetch parity.'
  promotion_path: 'Follow-up ADR adds DNS resolve + post-resolve range check when latency budget admits.'
notes: |
  Composer-only: NO new sniffer logic, NO new fetch primitive. 17
  hellgate cases cover every typed failure mode + happy path.
