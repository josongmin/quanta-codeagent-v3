  promotion_path: "extract the add/remove argv builder + isUnsafeLabel and add a `gh issue edit` factory."
notes: |
  14 hellgate cases (argv exactness incl. comma/space-stays-literal, per-label
  `--`/`-`/empty/whitespace rejection with runner-not-called, one-bad-rejects-all
  fail-closed, ref rejection, schema empty-input reject, sliced-stderr failure
  envelope, mutating classification, env fence). Registered unconditionally in
  ghTools (no extra dependency — gh does all the work).
