id: gh-pr-edit-labels
title: "gh_pr_edit_labels — add / remove PR labels"
section: 2
subsystem: 도구 — gh PR orchestration (CI label triage, RFC jun-6 C4)
order: 5
maturity: L4
status: stable
ui_surfaces: [cli]
modes: [interactive, headless, batch, daemon, ide, ci-bot]
monitoring: n-a
configurable: integrated
owners: ["@songmin"]
labels: ["surface:cli", "security-touched"]
depends_on: [gh-arg-injection-guard]
purpose: |
  A thin MUTATING wrapper over `gh pr edit <pr> --add-label <l> --remove-label
  <l>`. quanta's gh tools READ labels (gh issue view --json …,labels) but had no
  way to MUTATE them; needs-review / ready-to-merge / do-not-merge label triage
  is a staple of CI-automation merge-gating. The schema takes `add`/`remove`
  string arrays (at least one non-empty, enforced by `.refine`). SECURITY: a
  per-label arg-injection guard (`isUnsafeLabel`) rejects empty / whitespace-only
  / `-`-leading label names BEFORE argv (a label named `--repo` or `-R/owner/evil`
  would otherwise be parsed by gh as a FLAG — the same class normalizeRef defends
  for the positional ref), and every label is pushed as a SEPARATE argv element
  after its `--add-label`/`--remove-label` flag (never shell-joined / comma-split),
  so commas/spaces inside a label name stay literal. normalizeRef guards the PR
  ref. isReadOnly:false — the mode's gitWrite lever is the structural gate (mirror
  gh_pr_auto_merge). Default-OFF under the shared QUANTA_GIT_TOOLS gate; closed-port
  DI (injected GhRunner + scrubEnv fence is the only boundary — no shell, no env
  leak, no network in tests).
