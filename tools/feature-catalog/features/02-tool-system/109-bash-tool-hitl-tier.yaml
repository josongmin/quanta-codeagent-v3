purpose: |
  `bash` is built by `makeBashTool({ sandboxProfile })` so its `hitlTier`
  closes over the operator-chosen `OsSandboxProfile` — a CLOSED-ENUM switch
  with ZERO command inspection. Matrix: `read-only`/`workspace-write`/
  `danger-full-access` ⇒ `pre-approval-ok`; `workspace-write-net` ⇒
  `always-confirm` (audit every egress); `off`/undefined ⇒ `always-confirm`
  (conservative: no sandbox = unknown risk). The CLI assembly path projects
  `QUANTA_SANDBOX` → profile via `resolveSandboxProfileFromEnv` and threads
  it through `buildDefaultTools({ sandboxProfile })`. HARD_DENY (RCE /
  root-rm / fork bomb) is enforced UPSTREAM by `@/permission` via the
  dispatch seam — `bash` itself only distinguishes the two pre-deny tiers.
  Optional `timeout_ms` flows into `runShell`; `extractShellCommand` +
  `classifySource` declare the source class for Layer-1 secret redaction
  (ADR-0078 PR-2). MAX_OUTPUT=30000 with truncation tail. `evidence.exitCode`
  + 4KB stderr tail attached on every result (typed, not duck-smuggled).
