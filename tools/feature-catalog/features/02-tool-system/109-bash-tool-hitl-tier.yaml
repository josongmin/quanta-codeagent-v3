notes: |
  ADR-0297 (2026-05-25) — DELETED `ALWAYS_CONFIRM_PATTERNS` regex (9 entries:
  curl/wget/gh api/git push/send-pack/fetch/commit --amend/reset --hard) +
  `GIT_PREFIX` (legal git global-option matcher hardened over 4 rounds).
  Heuristic both produces false positives (`echo "git push --help"`) and
  misses new exfiltration vectors (`scp`, `nc`, `aws s3 cp`, …). The sandbox
  profile is now the single source of truth. BREAKING: sessions with no
  `QUANTA_SANDBOX` set now see `always-confirm` for EVERY bash call (was
  pre-approval-ok for unmatched commands). Operators who want the legacy
  frictionless UX opt into `QUANTA_SANDBOX=workspace-write`. Permission-
  layer HARD_DENY is unchanged. `isConcurrencySafe: false` — arbitrary
  shell side effects are unknowable, so every bash call serializes.
  `deriveBashFailure` derives typed `ToolFailure` from `ShellResult` shape:
  timeout via `timedOut`, spawn_error via `exit 127 + "command not found"`
  stderr, permission_denied via `exit 126 + "Permission denied"` — see
  `typed-tool-failure-modes` (order 64) for the union. Companion: 81
  `shell-output-delta-streaming` covers the streaming observer wired in via
  `ctx.onShellEvent`.
