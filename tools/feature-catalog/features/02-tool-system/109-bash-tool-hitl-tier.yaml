id: bash-tool-hitl-tier
title: bash — HITL always-confirm patterns + GIT_PREFIX bypass-proof matcher
section: 2
subsystem: 코어 mutating 도구 — shell exec (bash front) HITL routing
order: 109
maturity: L4
status: stable
purpose: |
  `bash` tool's `hitlTier(input)` returns `"always-confirm"` for network
  egress (curl/wget/`gh api`) and mutating git ops (push/send-pack/fetch/
  commit --amend/reset --hard); everything else falls to `"pre-approval-ok"`.
  HARD_DENY (RCE / root-rm / fork bomb) is enforced UPSTREAM by `@/permission`
  via the dispatch seam — `bash` itself only distinguishes the two pre-deny
  tiers. The bypass-proof part: `GIT_PREFIX` regex accepts ALL legal git
  global-option forms (`--no-pager push`, `-C dir push`, `-c k=v push`,
  `--git-dir=. push`) BEFORE the dangerous subcommand boundary — naive
  `git push` matchers are trivially bypassed by `git --no-pager push`. `send-
  pack` (plumbing behind `push`) is escalated identically. `fetch` with no
  remote arg fetches `origin` by default, so the `\borigin\b` narrow was
  deliberately dropped — any fetch is network egress. Optional `timeout_ms`
  flows into `runShell`; `extractShellCommand` + `classifySource` declare the
  source class for Layer-1 secret redaction (ADR-0078 PR-2). MAX_OUTPUT=30000
  with truncation tail. `evidence.exitCode` + 4KB stderr tail attached on
  every result (typed, not duck-smuggled).
