notes: |
  `isConcurrencySafe: false` — arbitrary shell side effects are unknowable, so
  every bash call serializes. `deriveBashFailure` derives typed `ToolFailure`
  from `ShellResult` shape WITHOUT touching `runtime/shell.ts` (owned by
  another track): timeout via `timedOut`, spawn_error via `exit 127 + "command
  not found"` stderr, permission_denied via `exit 126 + "Permission denied"`
  — see `typed-tool-failure-modes` (order 64) for the union. Companion: 81
  `shell-output-delta-streaming` covers the streaming observer wired in via
  `ctx.onShellEvent`.
