id: git-shared-discriminated-outcome
title: git `_shared.ts` — safeRun / mutate discriminated outcome boundary
section: 2
subsystem: 도구 — git slice internal boundary helpers
order: 112
maturity: L4
status: stable
owners: ["@songmin"]
labels: [surface:cli]
purpose: |
  Slice-internal helpers (`safeRun` + `mutate`) that normalize the spawn
  boundary into a tagged discriminated union — every git tool's `execute()`
  becomes a flat happy-path + branch-on-outcome, never a `try/catch` per call
  site. (1) `RunOutcome = { kind: "ok"; result } | { kind: "spawn-error";
  message }` — the ONLY place catch-and-coerce of thrown spawn errors lives;
  callers branch on `kind` instead of try-wrapping. (2) `MutateOutcome` adds
  exit-code branching so mutating tools can sequence multiple invocations
  (e.g. `git add` then `git commit`) and bail at the first failure without
  nested try/catch. (3) `stderrReason` maps non-zero git exits to a single
  best-effort error string with `isNotARepo` recognition. (4) The optional
  `signal` parameter threads cancellation through `safeRun`, so kill-on-cancel
  inherits to every read-only and mutating tool automatically. Result:
  boundary discipline is centralized — adding a new git tool means writing a
  flat execute() that calls `safeRun(...)` and branches, not re-implementing
  the catch-and-normalize pattern.
