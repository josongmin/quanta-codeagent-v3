purpose: |
  Model-driven exit from plan mode mirroring Claude Code's `ExitPlanMode`.
  When the agent has assembled a plan and is ready to act, it calls this
  with the plan text; the dispatch seam routes via
  `ToolContext.requestPlanExit` (built from `AgentConfig.planExitPort`),
  which surfaces the plan to whoever decides and returns the 3-way outcome:
  (1) `approved` — operator accepted; the surface (CLI/IDE) is responsible
  for continuing in default mode so subsequent turns may mutate (the tool
  tells the model it may proceed); (2) `rejected` — plan discarded, the
  model should stop / re-plan; (3) `changes_requested` — carries non-empty
  `feedback` so the model can revise the plan and call again. Registered
  ONLY when `AgentConfig.planExitPort` is wired (see `buildSessionFeatures`)
  — absent ⇒ tool is not in the registry and the loop is byte-identical.
  Read-only + concurrency-UNSAFE. Within-run mode flip is a NON-GOAL —
  an `approved` outcome does not unblock mutating tools inside the SAME
  `runAgent` call (plan mode is fixed per run); the operator's port owns
  the cross-turn mode transition.
