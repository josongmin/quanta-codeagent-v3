id: gh-pr-typed-ops
title: gh_pr_review_diff / gh_pr_auto_merge / gh_pr_create.draft
section: 2
subsystem: GitHub PR tools (ADR-0104)
order: 104
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: [absorbed:codex, surface:cli]
purpose: |
  Three typed PR operations on top of gh CLI — review diff fetch with byte cap
  (default 64 KiB, schema cap 1 MiB, truncation marker on overflow), auto-merge
  toggle, and a draft option on gh_pr_create. Closes typed gaps relative to
  external reference desktop agents' PR IPC surfaces. review-diff is read-only;
  auto-merge / draft are mutating and route through standard HITL.
