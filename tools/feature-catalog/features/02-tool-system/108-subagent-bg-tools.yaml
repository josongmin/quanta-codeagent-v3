id: subagent-bg-tools
title: subagent_{fork,poll,await} — LLM-facing background subagent trio (ADR-0130)
section: 2
subsystem: 도구 — background subagent (ADR-0130)
order: 108
maturity: L4
status: new
purpose: |
  Three LLM-facing tools wrapping a `BackgroundSubagentSchedulerPort`
  (duck-typed mirror of `BackgroundSubagentScheduler` so the `@/tool`
  slice does NOT import `@/agent`). (1) `subagent_fork({task, modelOverride?,
  maxTurns?, metadata?})` — forks a background subagent; returns `ok:true`
  with `"forked id=bg-xxx"`; `cap-exceeded` collapses to `ok:false`.
  (2) `subagent_poll({id})` — non-blocking status read; returns multi-line
  status; `unknown-handle` ⇒ `ok:false`. (3) `subagent_await({id, timeoutMs?})`
  — blocking harvest with optional timeout; typed `ok:false` on unknown handle
  or timeout. None registered in `defaultTools`; assembly seam
  `src/agent/tier1/subagent-bg.ts` registers them only when host wires
  `AgentConfig.subagent.backgroundScheduler` (mirrors `shadow_*` /
  `branch_search` caller-deferred posture).
