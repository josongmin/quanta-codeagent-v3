id: shell-output-delta-streaming
title: shell_output_delta — typed event stream for long-running shell exec
section: 2
subsystem: 도구 시스템 — shell exec 이벤트 스트림 (PR-5, ADR-0081)
order: 81
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: integrated
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: [surface:cli]
ui_surfaces: [cli]
configurable: integrated
config_refs:
  env: ["QUANTA_DIFF_PREVIEW", "QUANTA_EFFORT", "QUANTA_HISTORY", "QUANTA_HISTORY_FILE", "QUANTA_HISTORY_MAX", "QUANTA_IDLE_MS", "QUANTA_IDLE_SUPPRESS", "QUANTA_IMAGE_MAX_QUEUE", "QUANTA_IMAGE_QUEUE", "QUANTA_LIFECYCLE_PILLS", "QUANTA_MAX_TURNS", "QUANTA_METRICS", "QUANTA_MODEL", "QUANTA_MULTILINE", "QUANTA_PERMISSION", "QUANTA_PILLS", "QUANTA_PILL_", "QUANTA_PILL_TASKS", "QUANTA_REJECT_LIMIT", "QUANTA_REWIND_GIT", "QUANTA_SANDBOX", "QUANTA_SNOOZE_DEFAULT_MS", "QUANTA_SPINNER", "QUANTA_SPINNER_INTERVAL_MS", "QUANTA_SUBAGENT", "QUANTA_TURN_SUMMARY"]
purpose: |
  src/runtime/shell.ts의 runShell이 child process stdout/stderr를 buffered
  string으로만 반환하던 것을, 옵션 `onShellEvent` observer 시 closed
  discriminated `ShellExecEvent` union (start|stdout|stderr|exit|aborted)을
  실시간 emit. observer 부재 ⇒ legacy buffered path와 byte-identical.
  ToolContext에도 `onShellEvent?`을 노출해 bash tool이 forward — 미래의
  sibling shell/exec/MCP run 도구도 동일 seam으로 stream 가능. 청크는
  Uint8Array(미디코드)로 caller-encoding 선택. 누적 stdout/stderr는 여전히
  ShellResult로 반환되어 legacy 소비자는 자동으로 byte-identical.
evidence:
  code:
    - src/runtime/shell.ts
    - src/tool/bash/index.ts
    - src/tool/shell-exec-observers.ts
    - src/apps/cli/shell-stream-painter.ts
    - src/observability/shell-exec-otel.ts
    - src/apps/cli/repl.ts
  adrs: [81]
  tests:
    unit:
      - tests/unit/tool/shell-exec-events.test.ts
      - tests/unit/tool/shell-exec-events-stderr.test.ts
      - tests/unit/tool/shell-exec-events-abort.test.ts
      - tests/unit/tool/shell-exec-events-byte-identical.test.ts
      - tests/unit/dispatch-shell-observer-forward.test.ts
      - tests/unit/shell-exec-observers-surface.test.ts
      - tests/unit/bash.test.ts
    integration: []
    contract: []
knobs:
  - "ToolContext.onShellEvent: ShellExecObserver | undefined (default undefined) — absent ⇒ no event emission, legacy buffered path verbatim. present ⇒ closed union event stream PLUS unchanged ShellResult."
deliberate_hold: null
notes: |
  - 청크는 Uint8Array, decode는 final ShellResult 빌드 시 한 번
    (TextDecoder utf-8) — 기존 new Response(stream).text()와 동일 디코더.
  - aborted는 user_abort/timeout 두 reason, exit과 mutually exclusive.
  - per-stream offset은 byte 단위 (pre-chunk position).
  - `@/runtime` 슬라이스가 `@/tool` import 안 함 — `RunShellEvent`는
    구조적 미러, observer는 structurally assignable.
