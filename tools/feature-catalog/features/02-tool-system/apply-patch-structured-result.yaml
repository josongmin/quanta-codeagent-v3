    cli: "explicitly promoted default-ON: tool-surface SSOT seeds QUANTA_ENABLE_STRUCTURED_PATCH=1, buildDefaultTools registers apply_patch_structured, and the real-FS promotion rail proves partial success + jail isolation; =0 restores the legacy menu"
    web: "wired sibling tool remains opt-in; the web host does not seed QUANTA_ENABLE_STRUCTURED_PATCH"
purpose: |
  Cursor ApplyAgentDiff 흡수 — 기존 applyPatch는 첫 bad hunk에서 patch 전체를
  wholesale throw + rollback(전부-or-전무). 이 ADDITIVE/gated sibling은 새
  applyPatchStructured(patch, fs)를 추가: op 단위 PER-FILE ISOLATION으로 한 파일이
  실패해도 나머지는 적용되고, Result<StructuredApplyOutcome>를 RETURN한다.
  AppliedChange[] = { path, changeType(created|modified|deleted), movedTo?,
  beforeContent?, afterContent?, error?, messageForModel? } + allOk 플래그
  (Cursor proto 필드 verbatim). messageForModel은 각 typed error를 compact한
  model-facing 힌트로 매핑(anchor drift→"re-read & regenerate hunk", parse→"fix
  V4A syntax at line N", jail→"outside workspace")해서 모델이 실패한 파일만
  self-correct 재emit하게 한다. 기존 throwing applyPatch는 byte-identical로 불변 —
  새 entrypoint를 호출할 때만 동작. @/patch는 pure 유지(@/tool FsJailViolationError는
  structural duck-type으로 인식, upward import 없음).

  CLI PROMOTION (2026-07-19): apply_patch_structured는 tool-surface SSOT에서
  명시적으로 default-ON이다. 제품 계약은 per-op atomic + cross-op partial
  success다. 실패 op의 target bytes는 보존되고 성공 sibling은 유지되며,
  tool-level ok:false + per-file messageForModel로 실패가 숨지 않는다. 기존
  apply_patch의 whole-patch atomic contract는 그대로 병존한다. rollback은
  QUANTA_ENABLE_STRUCTURED_PATCH=0이며 이때 legacy tool menu가 복원된다.
