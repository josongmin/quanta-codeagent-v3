notes: |
  최초 seam (2026-06-03): per-op 적용은 canonical applyPatch({ops:[op]})에 위임 —
  locator/fuzzy-tier/pre-flight/rollback 로직 중복 0. 각 op는 자기 원자성 유지(실패
  op의 파일은 prior on-disk content로 intact). 외부 루프만 한 op 실패를 tolerate.
  cross-op 원자성은 이 path에서 의도적으로 포기(필요한 caller는 applyPatch 계속 사용).
  CLI promotion receipt @25d19d89b: real registry + real temporary filesystem에서
  partial sibling persistence, failed-target byte preservation, symlink escape 격리 검증.
  hellgate: happy 3-change-type + before/after, move→modified+movedTo,
  isolation(앞뒤 sibling 둘 다 적용 + prior intact), jail isolated(structural),
  delete-missing isolated, non-Patch입력 no-throw, throwing port no-throw,
  messageForModel 전 error-kind + unknown fallback, legacy applyPatch byte-identity 앵커.
