id: shadow-tools-trio
title: shadow_{snapshots,rewind,restore_partial} — first-class shadow-ODB tools
section: 2
subsystem: 도구 — shadow store (ADR-0119 + ADR-0122)
order: 95
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: partial
modes: [n-a]
configurable: n-a
owners: ["@songmin"]
labels: [absorbed:claude-code, surface:cli, security-touched]
configurable: static
purpose: |
  Three first-class agent tools wrapping the shadow ObjectDB safety-net store
  so the model (or operator via CLI) can inspect and undo a recent worktree
  state from within the loop. (1) `shadow_snapshots` — read-only enumerator
  over `ShadowOdb.listSnapshots`; deterministic newest-first via
  for-each-ref, output capped at 50 KB. (2) `shadow_rewind` — mutating wrapper
  over `ShadowOdb.rewindToLast`; always-confirm HITL tier so the gate cannot
  be skipped by acceptEdits / pre-approval; typed `ShadowOdbError` codes
  (`uninitialized:`, `merge-in-progress:`, `rewind-failed:`) collapse to
  `ok:false` instead of throwing past the loop. (3) `shadow_restore_partial`
  — path-scoped counterpart restoring only named files from `last` or
  `verified` snapshots. All three are NOT in `defaultTools`; the assembly
  seam (`@/agent/tier1/shadow`) registers them only when
  `AgentConfig.shadowOdb` is wired (mirrors `branch_search` posture).
