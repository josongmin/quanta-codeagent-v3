    contract: []
knobs: []
deliberate_hold: null
notes: |
  US-sep는 commit message에 의도적으로 0x1f를 박는 공격자에게는 100% 보장 안 됨
  (practically nil). `buildGitEnv` + `DETERMINISTIC_ENV`와 같은 ADR-0105 묶음 —
  env determinism은 별도 axis. checkpoint-policy.ts의 dedup key 합성도 같은
  US-sep 관용을 따른다 (다른 슬라이스, 같은 원리).
