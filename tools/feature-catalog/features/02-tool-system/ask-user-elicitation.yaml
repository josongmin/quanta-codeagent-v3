id: ask-user-elicitation
title: ask_user — generalized structured elicitation tool (ADR-0494)
section: 2
subsystem: 도구 — interactive elicitation (string/bool/number/enum/multiselect)
order: 208
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, ide]
configurable: integrated
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "src/apps/cli/ask-user-wire.ts binds AskUserPort via the readline/TTY prompter; tool present interactively"
    web: "no web AskUserPort binding — askUserPortFromPrompter is wired only under src/apps/cli/ and tool/index.ts; web-daemon runtime-factory.ts base has no askUser port, so the ask_user tool is absent on web (no-prompter ⇒ no-tool); approval.respond wire carries no elicitation kind"
owners: ["@songmin"]
labels: ["surface:cli", "absorbed:claude"]
depends_on: [mcp-elicitation, def-tool-registry]
config_refs:
  env: ["QUANTA_ASK_USER"]
purpose: |
  A generalized ask_user tool letting the agent ask the human a structured question
  (string / boolean / number / integer / select / multiselect) mid-turn. Reuses the
  SAME interactive prompter the MCP elicitation surface uses (readline-on-stdin,
  prompt-to-stderr, TTY-gated) via a PURE adapter (askUserPortFromPrompter) so one
  prompter serves both paths. NO-THROW: every outcome is a closed result arm; a
  headless/no-TTY host yields no prompter ⇒ no tool (byte-identical menu — the agent
  never blocks on an absent human). Default-OFF: requires QUANTA_ASK_USER + a TTY.
