owners: ["@songmin"]
labels: [surface:cli, security-touched]
depends_on: [isconcurrencysafe]
configurable: n-a
purpose: |
  Read-only file enumeration via `Bun.Glob.scan`. Optional `path` (base
  directory) is jail-validated via `@/storage.resolveJailed` BEFORE the scan —
  otherwise `path: "/Users/other"` would return every file the process can
  read. Results are sorted lexicographically, capped at MAX=300 (with overflow
  indicator), `onlyFiles: true`, `dot: false`. Description self-documents
  ADR-0062 "NARROW or BROADEN before switching" so the loop self-corrects when
  result is empty / over-capped. `isReadOnly: true` + `isConcurrencySafe:
  true` — directory scan with no side effects.
