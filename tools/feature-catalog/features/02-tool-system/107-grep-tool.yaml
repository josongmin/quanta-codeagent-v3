notes: |
  Sibling of `glob` (file enumeration) and `localize` (ranked Stage-2 BM25
  search). Jail-validation seam is shared with read/write/edit/glob/diagnostics
  — see ADR-0078 PR-2 path-classifier self-declaration pattern. Argv is built
  with `sq()` single-quote escaping; no shell expansion on the pattern.
