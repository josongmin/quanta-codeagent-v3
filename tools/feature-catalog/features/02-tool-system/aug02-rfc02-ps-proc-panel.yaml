id: aug02-rfc02-ps-proc-panel
title: RFC02 B1 — /ps list-only redacted background-shell panel
section: 2
subsystem: Background bash observability — /ps surface (aug-02 RFC02 B1)
order: 554
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: partial
modes: [interactive]
configurable: integrated
owners: ["@songmin"]
labels: ["rfc:aug02-02", "surface:cli", "gate:default-off"]
config_refs:
  env: ["QUANTA_PROC_PANEL"]
  cli: ["/ps"]
purpose: |
  RFC-02 B1 process panel: QUANTA_PROC_PANEL gates REGISTRATION of the `/ps`
  slash command (list-only, redacted view of owned background shells). Gating
  the registration — not just the render — keeps the /help catalog byte-identical
  when OFF (the jul-15 foreground-spawn parity shape). `list()` is a pure read
  never called unless the surface is wired. No unscoped kill is exposed here.
evidence:
  code:
    - src/apps/cli/proc-panel.ts
    - src/apps/cli/slash/registry-surface.ts
    - src/config/knob-inventory/host.ts
  adrs: ["docs/plans/aug-02-absorption/rfc-02-observability.md"]
  tests:
    unit:
      - tests/unit/cli/ps-surface-hellgate.test.ts
knobs:
  - name: QUANTA_PROC_PANEL
    where: runtime-config
    default: false
    purpose: gate /ps slash-command registration (OFF ⇒ /help catalog byte-identical)
