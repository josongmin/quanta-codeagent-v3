id: document-image-fsjail-unify
title: document/image readers — unified FsJail chokepoint via resolveJailedDoc
section: 2
subsystem: 도구 — FS-jail unification (Slice S7)
order: 111
maturity: L4
status: new
purpose: |
  Pre-S7, every file-reading tool rolled its own `resolveXxxPath` —
  `resolveImagePath` (`src/tool/image/read.ts`), `resolveCsvPath`
  (`src/tool/document/csv-read.ts`), `resolveNdjsonPath`, `resolvePdfPath`,
  `resolveYamlPath`. Five copies of the same `path.isAbsolute` +
  `path.resolve` + `startsWith(cwd + path.sep)` containment check, and a
  shared bug: an absolute path was treated as "explicit user consent" and
  bypassed the cwd containment entirely (model could request
  `/etc/passwd` and the only guard was the downstream `lstat`).
  Additionally, none of them realpath-resolved the existing parent chain,
  so a symlinked ancestor could smuggle a final path outside the jail.

  Slice S7 routes every reader through ONE chokepoint:
  `src/tool/_shared/resolve-jailed-doc.ts`, which delegates to the
  canonical `@/storage/service` `resolveJailed` (lexical normalize +
  realpath of the existing parent + segment-boundary `isInside` check)
  and adds two pre-conditions storage does not need (empty path / NUL
  byte). Each reader catches `FsJailError` in its preflight and
  translates to the historical `ok:false` `permission_denied` shape —
  back-compat preserved for callers, defense-in-depth gained.

  After S7: absolute `/etc/hosts` is rejected just like relative
  `../../../etc/hosts`. Sibling-prefix traps (`/jailX` for `/jail` cwd)
  are caught by segment-boundary containment. Symlinked parents are
  caught by realpath-of-existing-parent.

