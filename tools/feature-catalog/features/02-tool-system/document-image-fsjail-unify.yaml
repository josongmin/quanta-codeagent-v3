notes: |
  xlsx_read is currently a stub (ADR-0137 / -0138 deferred) and has no
  filesystem access path — when its impl lands it MUST thread through
  `resolveJailedDoc(cwd, raw, "xlsx")` per the in-file authoring guide.
  The anti-regression assertion in
  `image-read-fsjail-unify-hellgate.test.ts` case 16 grep-pins the
  `resolveJailedDoc` import so a future revert to per-tool resolvers is
  caught loudly at the test boundary.
