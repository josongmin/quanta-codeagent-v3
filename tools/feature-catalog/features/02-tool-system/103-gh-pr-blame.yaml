id: gh-pr-blame
title: gh_pr_blame — PR review-thread blame
section: 2
subsystem: GitHub PR tools (ADR-0103)
order: 103
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
