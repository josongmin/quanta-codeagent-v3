surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-15"
  evidence:
    cli: "registered unconditionally in buildDefaultTools (src/tool/index.ts); dispatch maps AgentConfig.sessionConfigPort -> ToolContext.sessionConfig at src/agent/dispatch.ts; the CLI composition root builds the port from effortStore/identityModeState/toolProfileState at src/host/bootstrap/bootstrap-session.ts"
    web: "duck-typed seam — a web host that wires sessionConfigPort gets it for free, but no web mint site exists today (port-absent => typed not_wired, byte-identical)"
purpose: 'Closes the agent self-visibility gap ("지금 thinking 모드 몇이고?") — nothing previously exposed the session own SDK posture. Two ops over a discriminated union: op:get returns a plain-text snapshot of effort tier (+ token budget), identity mode, tool profile, model id, provider (read-only); op:set_effort mutates the session effort tier, mirroring /effort and persisting across turns via the EffortStore seam (the port carries writeEffort, not the store, keeping @/tool slice-fenced — imports only zod + ./types, NO @/agent). Applies from the NEXT turn. No-throw: every failure (unwired seam/aborted/read/write error) yields a typed ok:false; absent port => not_wired byte-identical. Declared MUTATING (set_effort); plan-mode dispatch blocks it (use /effort in plan posture).'
