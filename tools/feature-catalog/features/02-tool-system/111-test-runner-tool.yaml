    contract: []
knobs: []
deliberate_hold: null
notes: |
  `isReadOnly: false` + `isConcurrencySafe: false` — arbitrary project tests
  have side effects and may contend for resources, so test_runner always
  serializes. Companion of `02-testrunner` (section 1, ADR-0013 verify-guard
  wiring) — that entry covers "test_runner counts as verification";
  THIS entry covers the tool surface itself (detection + verdict + HITL).
  `evidence.exitCode` + 4KB stderr tail attached per result (typed via
  `ToolResultEvidence`, not duck-smuggled).
