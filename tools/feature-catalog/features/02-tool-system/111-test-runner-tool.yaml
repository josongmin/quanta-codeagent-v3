id: test-runner-tool
title: test_runner — bun→npm→pytest auto-detect + heuristic verdict
section: 2
subsystem: 코어 mutating 도구 — test suite execution
order: 111
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: [surface:cli]
depends_on: [isconcurrencysafe]
purpose: |
  Runs the project's test suite. Explicit `command` arg skips auto-detection;
  otherwise `detectCommand` probes in order: (1) bun if `bun.lockb` OR
  `bunfig.toml` OR `package.json.scripts.test` exists → `bun test`; (2)
  `package.json` only → `npm test`; (3) pytest markers (`pytest.ini` /
  `pyproject.toml` / `setup.py`) → `pytest`. `path` optional arg appends as
  filter. Timeout: default 120s, max 600s. Tail-capped at TAIL_CAP=12000
  chars with truncation header. `verdict()` derives one-line `passed | failed
  | timed out | unknown` from exit code + output regex (`\d+ fail|failed|
  ✗|✖` for fail, `pass|ok|✓|✔|\d+ passed` for pass). `hitlTier:
  "pre-approval-ok"` opt-in — running the project's own tests is the
  canonical inner-loop action; without this opt-in the `inferToolTier`
  fallback would force confirmation on every `bun test` in `bypass` mode.
evidence:
  code:
    - src/tool/test-runner/index.ts
  adrs: []
  tests:
