id: git-diff-scope-inference
title: "Diff-derived Conventional Commits scope inference"
section: 2
subsystem: 도구 — git commit author (cursor-commits scope 흡수, ADR-0458)
order: 1
maturity: L3
status: stable
ui_surfaces: [n-a]
modes: [interactive, headless, batch, daemon, ide, ci-bot]
monitoring: n-a
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: []
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 1/1 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure internal prompt-hint projector, no UI affordance on any surface"
purpose: |
  diffToScopes(diff) — a pure, deterministic scope inferer: the scope is the first
  directory segment under a recognized source root (src/|packages/|apps/, requiring
  root/scope/leaf), candidates ordered files-DESC → lines-DESC → name-ASC. The top
  candidates are injected into COMMIT_AUTHOR_SYSTEM as a HINT (the LLM keeps freedom
  to pick its own or omit); parseConventionalCommit annotates scopeOffSuggestion as
  a soft signal (never blocks the commit). No-candidates (root-only diff) ⇒ no hint
  line + no signal field (byte-identical). git-quoted paths are unquoted; renames
  counted once (post-image authoritative); pure deletions attribute via the pre-image.
evidence:
  code:
    - src/tool/git/compose.ts
  adrs: [458]
  tests:
    unit:
      - tests/unit/tool/git-compose.hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold:
  reason: "SCOPE_ROOTS fixed (lib/, cmd/, internal/ → no candidates, degrades to today); config-driven roots deferred."
  promotion_path: "config-driven source roots; git_compose_pr intentionally excluded (no conventional scope)."
notes: "a noisy top candidate is recoverable — all candidates surfaced + LLM may pick its own/omit."
