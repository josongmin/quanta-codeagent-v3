notes: |
  Supersedes the Bun.Glob enumeration described in `glob-tool` (order 108).
  Behavior delta vs the old `Bun.Glob.scan` path: gitignored entries are now
  excluded and results are mtime-DESC (the differential test
  `glob-gitignore-mtime.test.ts` pins this). Matching uses STANDARD `Bun.Glob`
  semantics — a bare `*.ts` matches ONLY top-level files (one path segment); use
  `**/*.ts` for any depth. Hidden files stay excluded (rg `--hidden` omitted =
  prior `dot:false`). The F1 hellgate (`glob-gitignore-mtime-hellgate.test.ts`)
  locks that a file-name `.gitignore` entry can never leak via any pattern.
