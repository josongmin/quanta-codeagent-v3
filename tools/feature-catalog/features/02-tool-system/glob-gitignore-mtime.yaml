id: glob-gitignore-mtime
title: glob — ripgrep enumeration (.gitignore-aware + mtime-DESC ordering)
section: 2
subsystem: 코어 read-only 도구 — file enumeration (ripgrep front)
order: 109
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: [surface:cli, security-touched]
depends_on: [glob-tool]
purpose: |
  P25 engine swap for the `glob` tool: enumeration moved from `Bun.Glob.scan`
  to `rg --files -g <pattern>` (run with `cwd: base`, no path arg → paths are
  emitted RELATIVE to the jailed base). This makes glob honor `.gitignore` /
  `.ignore` NATIVELY (node_modules/, dist/ junk excluded) — consistent with the
  `grep` tool which already shells to rg — and matches Claude/Cursor glob
  semantics. This is a deliberate, documented DEFAULT behavior change, NOT a
  gated toggle. Surviving hits are stat'd and sorted by mtime DESCENDING
  (most-recently-modified first, ties broken by path), THEN the MAX=300 cap is
  applied so the newest files survive truncation.

  Jail invariant preserved EXACTLY across the swap: (1) the `path` base is
  jail-validated via `@/storage.resolveJailed` BEFORE the rg argv is built;
  (2) an absolute (`/etc/*`) or `..`-segment pattern is REJECTED up front,
  loud, before it reaches the argv; (3) every emitted hit is re-jailed against
  ctx.cwd and DROPPED if it escapes (defense-in-depth — rg also does not follow
  symlinks by default). The pattern is single-quoted via `sq()` (mirrors grep)
  so shell metacharacters reach rg verbatim and cannot break out of the argv.
  `--null` separates paths so a newline in a name cannot forge an entry.
  Fail-closed: rg exit >1 / timeout surfaces a clear error (the repo already
  depends on rg).
