notes: |
  Supersedes the Bun.Glob enumeration described in `glob-tool` (order 108).
  Behavior delta vs the old path is INTENTIONALLY just two things: gitignored
  entries are now excluded, and results are mtime-DESC (the differential test
  `glob-gitignore-mtime.test.ts` pins exactly this). Side effect of rg `-g`
  semantics: a bare `*.ts` matches a basename at ANY depth (gitignore-style
  glob), unlike Bun.Glob's top-level-only `*.ts` — also the Claude/Cursor norm.
  Hidden files stay excluded (`--hidden` deliberately omitted = prior
  `dot:false`).
