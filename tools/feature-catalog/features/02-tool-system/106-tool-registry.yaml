id: tool-registry
title: ToolRegistry — schema + isReadOnly + output-schema + spill capping
section: 2
subsystem: 도구 — registry (factory / output cap / spill / output-schema)
order: 106
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env: [QUANTA_TOOL_OUTPUT_MAX]
owners: ["@songmin"]
labels: [surface:cli, security-touched]
depends_on: [persisted-output]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "core per-loop registry composing every tool; runs in CLI dispatch seam"
    web: "pure internal infrastructure (schema projection, isReadOnly, output-schema enforcement, capToolOutput/spill); no UI affordance of its own on any surface"
purpose: |
  Central per-loop registry composing every built-in and ported tool into the
  surface the dispatch seam consumes. Owns: `has` / `get` lookups, `specs()`
  enumeration (schemas advertised to the model with zod-to-JSON-schema
  projection), `isReadOnly` per-tool read of the contract, post-execute
  `enforceOutputSchema` (when a tool declared `outputSchema` via `defineTool`;
  mismatch ⇒ ok:false with retry-directive instead of throwing), and final
  `capToolOutput` (oversized output spilled to disk via `output-spill.ts` and
  replaced with a `<persisted-output>` placeholder mirroring CC's
  `replaceOversizedResults`). Single chokepoint for tool input/output
  normalization: zod input errors collapse to `ToolInputError`, execution
  errors collapse to `ToolExecutionError`, both surfaced as typed
  `ToolFailure` discriminants so the loop branches on KIND not regex.
evidence:
  code:
    - src/tool/registry.ts
    - src/tool/factory.ts
    - src/tool/output-spill.ts
    - src/tool/deferred/index.ts
    - src/tool/schema.ts
  adrs: []
  tests:
    unit:
      - tests/unit/output-spill.test.ts
      - tests/unit/tool-factory.test.ts
      - tests/unit/tool-output-schema-hellgate.test.ts
      - tests/unit/schema.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_TOOL_OUTPUT_MAX
    default: '200 000'
    purpose: 'per-tool output char cap before spill'
deliberate_hold: null
notes: '`output-spill.ts` writes to `.quanta/tool-output/<uuid>.txt` and prunes to `DEFAULT_SPILL_KEEP` recent files. `deferred.ts` is the in-memory typed seam — there is deliberately no async scheduler today; the contract can be exercised in isolation and a real scheduler can adopt it later without changing the type surface.'
