notes: |
  SHIPPED (2026-07-18, Wave N): the gated `node_repl` tool is the production
  consumer. Registration is data-driven (`src/tool/index.ts`
  CONDITIONAL_REGISTRATIONS, `DefaultToolPorts.nodeRepl`); the composition root
  mints ONE stateful `createDefaultNodeReplKernel()` per session ONLY when
  `QUANTA_NODE_REPL` is on (`gated-tool-ports.ts` `nodeReplPortSlot`).
  always-confirm (arbitrary Node code, full host access), default-OFF
  byte-identical when unset. DISTINCT from `code_cell` (one-shot QuickJS-WASM
  sandbox, NO persistent state) — variable-persistent Node kernel, unique
  primitive. measure-first before any surface auto-seeds it (opt-in everywhere).

  Future scope (NOT built — the tool ships with a simple stdin/stdout
  line-protocol): full Jupyter protocol envelope (msg_id/parent_header),
  multi-output frames (stream/display_data/execute_result), restart policy
  (Codex doesn't do this either — likely dropped), checkpoint/fork kernel-handle
  preservation (pending checkpoint-slice agreement).


  Sibling 시 import 방향: src/runtime/node-repl/ → @/shared 만. 다른
  슬라이스 역참조 없음. tsconfig `@/runtime/*` alias 이미 존재해서 추가
  alias 등록 불필요.

  Production adapter의 line-protocol sentinel은 `__quanta_repl_done_<16
  hex>__` 형태. 사용자 코드가 정확히 같은 문자열을 stdout으로 찍으면
  framing이 깨질 수 있다 — 충돌 확률은 ~2^-64. adapter header에 명시.

  State-store는 핸들 metadata만 0600으로 저장. 변수 상태(closure /
  socket / native module)는 디스크로 직렬화 불가능 — Codex도 하지
  않으며, restart 시 재실행은 안전상 사용자 confirm 필요한 follow-up
  영역으로 미룬다.
