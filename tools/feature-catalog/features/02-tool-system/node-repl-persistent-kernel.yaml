deliberate_hold:
  reason: |
    - full Jupyter protocol envelope (msg_id / parent_header / metadata) —
      이번 라운드는 단순 stdin/stdout line-protocol 만
    - multi-output frame (stream / display_data / execute_result 분리) —
      현재는 stdout 한 덩어리 + stderr 한 덩어리
    - restart policy (process crash 시 자동 재기동 + 변수 replay) —
      Codex 도 안 함; 폐기 가능성 높음
    - tool wiring (`node_repl_exec` 같은 새 도구) — 슬라이스 primitive만
      먼저 안전하게 착륙시키고 후속에서 와이어
    - conversation-checkpoint / fork 연동 (스냅샷 시 살아 있는 커널 핸들
      같이 보존) — checkpoint 슬라이스 쪽에서 합의된 후
notes: |
  Sibling 시 import 방향: src/runtime/node-repl/ → @/shared 만. 다른
  슬라이스 역참조 없음. tsconfig `@/runtime/*` alias 이미 존재해서 추가
  alias 등록 불필요.

  Production adapter의 line-protocol sentinel은 `__quanta_repl_done_<16
  hex>__` 형태. 사용자 코드가 정확히 같은 문자열을 stdout으로 찍으면
  framing이 깨질 수 있다 — 충돌 확률은 ~2^-64. adapter header에 명시.

  State-store는 핸들 metadata만 0600으로 저장. 변수 상태(closure /
  socket / native module)는 디스크로 직렬화 불가능 — Codex도 하지
  않으며, restart 시 재실행은 안전상 사용자 confirm 필요한 follow-up
  영역으로 미룬다.
