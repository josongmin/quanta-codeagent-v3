purpose: |
  Codex `~/.codex/node_repl/active_execs/{execId}.json` 패턴 흡수의 slice
  primitive — 한 세션 동안 살아 있는 `node -i` 서브프로세스를 유지해서
  턴 사이 변수 바인딩이 보존되게 한다 (`let x = 42` 후 다음 턴에 `x` →
  `42`). 이번 라운드는 closed port + production `Bun.spawn` adapter +
  state-store (`~/.quanta/node_repl/active_execs/{id}.json`, 0600 / dir
  0700) + 결정론적 headless stub + 16-case hellgate 까지만. 툴 wiring,
  full Jupyter protocol (`msg_id` / `parent_header`), multi-output frame,
  restart policy, conversation-checkpoint 연동은 deliberate hold.

  핵심 모양:
    - `NodeReplKernel { spawn, exec, status, kill, list }` — 모든 메서드
      `Result<…, KernelError>` (no-throw)
    - `KernelState = "starting"|"ready"|"running"|"idle"|"dead"` (closed)
    - production adapter: line-protocol around node REPL — per-exec
      nonce-sentinel framing, stderr drain in parallel, AbortSignal로
      `.exit` 후 `exec-aborted` 분기
    - state-store: 핸들만 디스크에 (`pid` / `lastUseMs` / `sessionId`);
      변수 상태 자체는 살아 있는 node 프로세스 안에만 있다
    - default-OFF byte-identical: 어떤 tool / composition root도 이 슬라이스를
      자동 wire 하지 않는다 (RFC §1.2 준수)
