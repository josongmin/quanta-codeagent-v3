notes: 'jun-7 Wave R (R1). Gap doc §21.5 — engine (`src/retrieval/`) already supports filtering; this is the tool-surface passthrough + post-filter + jail. `scope` never touches the filesystem (compared as a literal string prefix against hit paths) so it cannot escape the workspace.'
