id: jun7-search-codebase-scope
title: search_codebase `scope` directory filter (§21.5)
section: 2
subsystem: 검색 도구 표면 (Cursor target_directories 흡수)
order: 70
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: static
owners: ["@songmin"]
labels: ["surface:core", "absorbed:cursor"]
depends_on: []
purpose: |
  Adds an optional `scope` input to the `search_codebase` tool so the model
  can restrict ranked hits to a workspace-relative directory prefix
  (e.g. `src/auth`) — Cursor `codebase_search target_directories` parity.
  Pure POST-filter over the ranked hit set (the lexical default pipeline
  does not honor an engine-level path filter), so it is engine-agnostic.
  When scoping, the candidate pool widens to the already-enforced `MAX_K`
  (50) cap — NOT an invented multiplier — then slices back to `k`.
  Byte-identical opt-out: an absent/blank `scope` fetches exactly `k` and
  skips the filter, identical to the pre-feature path. A traversal/absolute
  scope is rejected with a typed `invalid-config` failure (the pipeline is
  never called), mirroring the grep/glob traversal posture.
