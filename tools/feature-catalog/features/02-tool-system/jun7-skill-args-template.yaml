purpose: |
  Adds an optional `args` input to the `Skill` tool and interpolates
  `$ARGUMENTS` (whole string) / `$1`/`$2`… (whitespace-split positionals)
  into the skill body before injection — Claude Code `.claude/commands/*.md`
  parity. Substitution is a SINGLE pass over the body (one regex alternation
  `\$ARGUMENTS\b|\$(\d+)`), so text inserted by `$ARGUMENTS` is never
  re-scanned for `$N` (a chained two-pass replace would double-substitute —
  that was caught + fixed as F1). The result is inert prompt text, never
  executed, so shell metacharacters in `args` are harmless. Byte-identical
  opt-out: `interpolateSkillArgs` runs ONLY when the caller passed `args`;
  an absent `args` returns the body verbatim, including bodies that contain
  a literal `$ARGUMENTS`.
