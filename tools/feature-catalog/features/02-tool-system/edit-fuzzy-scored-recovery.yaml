id: edit-fuzzy-scored-recovery
title: "Edit fuzzy matcher: scored-candidate recovery on ambiguity"
section: 2
subsystem: 도구 — edit fuzzy ladder (codex nucleo scoring 흡수, ADR-0456)
order: 0
maturity: L3
status: stable
ui_surfaces: [n-a]
modes: [interactive, headless, batch, daemon, ide, ci-bot]
monitoring: n-a
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: []
purpose: |
  A final safety-net rung on the fuzzy ladder's AMBIGUOUS path (which fails today):
  score each candidate window by exactAnchorScore = count of lines matching the
  needle VERBATIM at the same position, and recover ONLY when exactly ONE window is
  a unique strict maximum (top score strictly beats every other). A tie → still
  fails. A measurement (verbatim-line count), not a tunable threshold. Safety:
  only converts a current FAIL into a recovery or the same fail — can never apply
  an edit to a window the current code wouldn't, and prefers false-negative over
  wrong-location. Additive: matched/single-fail paths byte-identical.
