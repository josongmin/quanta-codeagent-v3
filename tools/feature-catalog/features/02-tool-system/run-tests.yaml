purpose: |
  The failure-evidence half of the Evidence Packet Builder. Detects the
  project toolchain from marker files (Cargo.toml→`cargo test`, go.mod→
  `go test -json ./...`, pyproject/setup.py/setup.cfg→`python3 -m unittest
  discover -v`, package.json→`npm test`) and runs the suite, returning a
  NORMALIZED {passed, failed:[{name,file,line,message}]}.

  Layers (src/tool/testrun/): detect (pure, injected exists-port) · parse (pure
  per-language parsers pinned to VERBATIM real output — go JSON event stream /
  cargo libtest text / python unittest text; NEVER-throws) · tool (FS-jail
  detection + injected spawn port).

  HIGH RISK: running a suite EXECUTES the project's test code, so the tool is
  always-confirm (like bash) AND default-OFF. NEVER throws — detect/spawn/parse
  faults collapse to ok:false. Real-verified 2026-06-10 against cargo 1.95 /
  go 1.25.4 / python3 unittest with known-failing suites (failing test name +
  file:line + message extracted).
