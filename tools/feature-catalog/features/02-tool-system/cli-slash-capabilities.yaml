notes: |
  Read-only by construction — there is no write path. The 3-axis
  consistency ratchet (`tests/unit/capability/capability-axis-consistency-hellgate.test.ts`)
  guards that the underlying capability gates match the manifest GATED_TOOLS
  gates; this command surfaces that same resolution to the operator. The web
  surface mirror lands via the SlashPalette `capabilities` entry.
