purpose: |
  `/capabilities` (alias `/caps`) — operator-facing READ-ONLY surface over
  the cross-surface capability layer (`@/capability`). The capability layer
  is the single SSOT mapping each gated feature to (a) the env gate that
  arms it and (b) the invocation surfaces it exposes on (llmTool / slash /
  skill / hook / thinClient). `resolveExposure(cap, surface, env)` is the
  one place a capability's per-surface exposure is decided; this command
  renders that resolution so the otherwise-invisible split-brain surface
  matrix is discoverable.

  Subcommands:
    - `/capabilities` | `/capabilities list` (default) — full table: id,
      describe, gate (envKey + current on/off), and a per-surface exposure
      grid (✓ exposed / ✗ declared-but-off / – not-declared).
    - `/capabilities find <q>` — filter by id / describe / gate envKey.
    - `/capabilities help` — family summary.

  Mirrors the `/knobs` slash contract (`SlashCommand`, `ctx.out`/`ctx.err`,
  completion adapter). DISPLAYS only — never mutates env, gates, or the
  registry. The master gate (`QUANTA_CAPABILITY_LAYER`) state is shown at
  the top; when OFF the resolver is probe-only and the grid reflects what
  the unified resolver WOULD decide.
