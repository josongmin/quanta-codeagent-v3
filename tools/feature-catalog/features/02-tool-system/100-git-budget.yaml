purpose: |
  Closed-port typed budget interface + pure `applyBudget` helper that derives
  an AbortSignal carrying a deadline for long-running git invocations. Five
  knobs mirror the upstream `CaptureBudget` struct verbatim so a future port
  of the gix-snapshot RefStore→Commit→PackTree→PackBlob→Pack stage machine
  has a 1:1 contract surface: (1) `maxCommits` — INTENDED to be enforced via
  `-n` at call sites (`git_log`, `git_churn`); (2) `maxWallTimeMs` — INTENDED
  to fuse an AbortSignal that kills the spawned git process when deadline
  fires; (3) `maxOutputBytes` — INTENDED post-spawn output cap; (4)
  `targetDurationMs` — telemetry-only forward slot; (5)
  `consecutiveOverBudget` — multi-run counter slot. NB (2026-06-03 reachability
  audit): the helper + type exist but NO git tool currently imports/calls them
  (re-exported from the barrel only) — enforcement is UNWIRED scaffolding,
  hence L2/hold, not L4. The
  last two are forward-compat type slots that MUST stay in the interface so
  future wiring does not require a type bump. Tools accept an OPTIONAL
  `budget` arg — absent ⇒ no signal derivation, byte-identical contract
  with pre-budget callers.
evidence:
