deliberate_hold:
  reason: 'targetDurationMs / consecutiveOverBudget enforcement is forward-compat — caller-tracked today, no loop-level breaker.'
  promotion_path: 'Future: wire consecutiveOverBudget into a typed breaker once a multi-run aggregator slice exists.'
notes: 'Helper (applyBudget / resolveMaxCommits / crossedTarget) + GitBudget type are defined and barrel-re-exported, but NOT called by any git tool yet (git_log / git_churn / git_blame_heatmap / git_upstream_check have zero budget refs — verified 2026-06-03). Promotion to L4 requires wiring the helper into those tools'' call sites.'
