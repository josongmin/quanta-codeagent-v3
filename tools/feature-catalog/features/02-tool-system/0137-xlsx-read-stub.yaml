id: xlsx-read-stub
title: xlsx_read + docx_read — real pure-TS OOXML readers (ADR-0137 / ADR-0138)
section: 2
subsystem: 도구 — document (XLSX + DOCX read; pure-TS, no deps)
order: 137
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: [surface:cli]
depends_on: [document-image-fsjail-unify, document-tools-csv-ndjson, pdf-read-tool, cross-slice-mirror, deferred-tool-registry]
purpose: |
  REAL `xlsx_read` + `docx_read` document readers. jun-04 resolved the ADR-0138
  deps blocker WITHOUT a dependency: `node:zlib.inflateRawSync` (via the H14b
  authoring slice's `unzip`) handles DEFLATE entries, and a focused OOXML parser
  resolves cells / paragraph text. Reads BOTH STORED (quanta's own xlsx_write /
  docx_write output) AND DEFLATE (real-world Excel/Word) containers — closing the
  H14b round-trip: `xlsx_write` → disk → `xlsx_read` returns the cells (and the
  DOCX equivalent). Pure `parseXlsx`/`parseDocx` cores (no FS) + FS-jailed tool
  wrappers (resolveJailedDoc chokepoint + symlink reject + size cap, no-throw).
  Both are BASE read-only tools (always registered, like csv/yaml/pdf/ndjson);
  only the mutating xlsx_write/docx_write are gated by QUANTA_OFFICE_AUTHORING.
evidence:
