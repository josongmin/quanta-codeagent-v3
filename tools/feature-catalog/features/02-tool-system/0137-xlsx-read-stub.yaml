    contract: []
knobs: []
notes: |
  L4: real execution path, STORED + DEFLATE, true byte-level round-trip proven
  through quanta's own tools (xlsx_write → xlsx_read). The earlier ADR-0138
  "SheetJS vs deps" blocker is moot — the pure-TS reader needs no dependency.
  Deferred polish: cell styles / number-format rendering, pptx_read, docx tables.
