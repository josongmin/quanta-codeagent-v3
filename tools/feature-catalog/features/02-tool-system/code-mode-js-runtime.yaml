purpose: |
  code-mode (Phase 1-3, LIVE jun-07) — invert the one-tool-per-LLM-turn dispatch model. The model
  authors a small JS PROGRAM (a "code cell") that calls tools as ordinary async
  functions — `const a = await tools.read({path}); for (...) await tools.grep(...)`
  — and the program runs in a SANDBOXED QuickJS-WASM isolate. Each in-cell
  `await tools.X(args)` round-trips to the REAL `dispatchTool`, so permission /
  HARD_DENY / plan-mode gate EVERY call; loops/conditionals/fan-out happen in ONE
  cell = ONE model turn (the token + latency win on multi-step sequences).

  THE SECURITY MODEL (make-or-break, proven): there is exactly ONE dispatch path.
  `src/codemode/` is a DUMB sandbox that reaches the host ONLY via an injected
  `CodeCellDispatchPort`. The ONLY implementation of that port
  (`src/agent/codemode-wire.ts#buildCodeCellDispatchPort`) closes over the loop's
  LIVE `config`/`permission` (and optionally `autoClassifier`) and routes EACH
  in-cell call through the SAME `dispatchTool` the loop uses with a synthesized
  `cell_<cellId>_<seq>` ToolUseBlock. A code cell IS, to the permission system, N
  ordinary gated tool calls. (The composition-root wire leaves `autoClassifier`
  absent ⇒ in-cell read-only ops do NOT auto-pass — STRICTLY more restrictive than
  the direct path, never a bypass.) `@/codemode` CANNOT reach `dispatchTool` (biome fence) — inversion-of-
  control is the boundary. The cell has NO require/fetch/process/Bun/FS/network
  surface (QuickJS gives none; we add none). Cell output is redacted through the
  SAME `redactSecrets` chokepoint a normal tool result passes.

  PHASE 2 — FULL TOOL SURFACE (jun-07, LIVE): the cell binds `tools.<name>` for
  the agent's ACTUAL registered set (`registry.toolNames()`), surfaced through
  `AgentConfig.codeCellSurfaceTools` → `ToolContext.codeCellSurface` →
  `RunCodeCellOptions.surfaceTools`. A cell can call ANY tool the agent has —
  EACH still routes through the SAME injected port → the real `dispatchTool` (the
  security invariant is UNCHANGED; only which NAMES are bound widened). A tool the
  agent lacks is absent from the surface ⇒ unbound (the cell can never widen
  itself). Snake_case names (`gh_pr_view`) are dot-reachable (`tools.gh_pr_view`,
  RFC §4.2). A MUTATING in-cell call (`tools.bash`/`tools.write`) hits the SAME
  admissibility gate / HARD_DENY / plan-mode as a direct call; a malformed arg is
  a typed tool failure (the tool safeParses inside dispatchTool), not a host
  crash; the per-cell call cap + output cap apply ACROSS the full surface.
  ABSENT surfaceTools ⇒ the sandbox falls back to the Phase-1 3-tool surface
  (`read`/`grep`/`write`) — byte-identical for a host that wired the port but not
  the surface.

  PHASE 3 — code_mode_only (jun-07, LIVE, default-OFF): `QUANTA_CODE_MODE_ONLY=1`
  splices a gated prompt directive (`CODE_MODE_ONLY_DIRECTIVE`, the §5 directive
  bundle) into the per-turn DYNAMIC `<system-reminder>` steering the model to drive
  multi-step work through `code_cell` programs as the PRIMARY tool-calling surface.
  PER THE RFC §5.3 decision: the directive STEERS via prompt; it does NOT hide
  individual tools from the menu (the tool catalog is byte-identical whether or not
  the steering is on — mutating tools stay directly reachable AND re-gated inside
  cells). Default-OFF ⇒ zero bytes (byte-identical dynamic tail). Independent of
  `codeMode` (the security gate); a host that wants the model to actually USE cells
  sets BOTH. Phase-2 cell-lifecycle stream events remain a follow-up (the per-cell
  ledger on the single tool result is the current observability surface).

  CAPS (RFC §4.4): WASM memory limit (setMemoryLimit), deadline interrupt
  (an infinite loop → typed timeout), per-cell tool-call cap (a runaway fan-out is
  refused at the binding BEFORE the host port), output cap (truncated), abort
  (the loop's AbortSignal interrupts + the runtime is disposed). Every
  QuickJSHandle is disposed (no heap leak). NO-THROW: every failure (parse /
  uncaught throw / deny / timeout / memory / cap / abort) is a typed result.
