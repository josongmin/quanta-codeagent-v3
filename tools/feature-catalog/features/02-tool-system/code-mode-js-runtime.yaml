knobs:
  - name: QUANTA_CODE_MODE
    where: src/shared/runtime-config.ts
    default: false
    purpose: |
      Strict `=== "1"` opt-in. Default-OFF ⇒ the composition root wires NO
      `DefaultToolPorts.codeMode` flag / `AgentConfig.codeCellDispatchFactory` ⇒
      `code_cell` NOT registered ⇒ byte-identical default tool menu, AND the
      QuickJS-WASM module is NEVER instantiated (lazily imported only when a cell
      runs). Opt-in EVERYWHERE: runs model-authored code (exec-class) and can
      invoke mutating tools, so it never auto-seeds (mirrors image_gen / appshot).
      Phase 2 (full surface) rides this SAME knob — the wire sets BOTH the dispatch
      factory AND the surface thunk (`registry.toolNames()`) when it is on.
  - name: QUANTA_CODE_MODE_ONLY
    where: src/shared/runtime-config.ts
    default: false
    purpose: |
      Phase 3 — strict `=== "1"` opt-in. Default-OFF ⇒ the per-turn dynamic
      `<system-reminder>` carries NO code-mode steering directive (byte-identical
      dynamic tail). When ON, `buildDynamicContext` splices the
      `CODE_MODE_ONLY_DIRECTIVE` steering the model to drive multi-step work through
      `code_cell` programs as the PRIMARY tool-calling surface. Per RFC §5.3 it
      STEERS via prompt only — it does NOT hide individual tools (the menu is
      byte-identical; mutating tools stay reachable AND re-gated inside cells) and
      NEVER relaxes any gate. Independent of `codeMode` (the security gate that
      registers the tool + wires the port); a host wanting the model to USE cells
      sets BOTH.
  - name: QUANTA_CODE_MODE_MEM_BYTES
    where: src/shared/runtime-config.ts
    default: false
    purpose: WASM heap cap (bytes). Unset ⇒ 64 MiB default.
  - name: QUANTA_CODE_MODE_TIMEOUT_MS
    where: src/shared/runtime-config.ts
    default: false
    purpose: Wall-clock deadline (ms). Unset ⇒ 30 s default. An infinite loop is interrupted.
  - name: QUANTA_CODE_MODE_MAX_CALLS
    where: src/shared/runtime-config.ts
    default: false
    purpose: Per-cell tool-call cap. Unset ⇒ 64 default. A runaway fan-out is refused at the cap.
  - name: QUANTA_CODE_MODE_OUTPUT_CAP
    where: src/shared/runtime-config.ts
    default: false
    purpose: Model-facing output cap (bytes). Unset ⇒ 16 KiB default; over-cap is truncated.
notes: |
  RUNTIME (RESOLVED jun-07): the sandbox uses the SYNC (non-asyncify)
  quickjs-emscripten variant via the shared `getQuickJS()` module +
  `module.newContext()` per cell, driven by a native-promise + `executePendingJobs`
  event loop. Each in-cell `await tools.X(args)` is a PLAIN `ctx.newFunction` that
  returns a QuickJS NATIVE promise (`ctx.newPromise()`); the host resolves/rejects
  the deferred OUT-OF-BAND after the REAL `dispatch(...)` settles, then pumps the
  job queue. The host drives the top-level cell promise to settlement by draining
  pending jobs + awaiting real macrotasks until `getPromiseState` settles or the
  deadline fires. NO asyncify stack suspension ⇒ ARBITRARY in-cell nesting depth
  (proven to 8) with clean handle disposal; arguments pass NORMALLY (the prior
  `__cmReq` global-stash workaround is removed). The old asyncify build
  (`newQuickJSAsyncWASMModule` + `newAsyncifiedFunction`) faulted past ~3 nested
  host-promise suspensions ("out of bounds memory access") and on arg-marshalling
  — both gone with the sync variant.

  HANDLE DISCIPLINE (two WASM-abort guards): (1) every minted deferred is tracked
  and disposed in `finally` if still alive at an early-terminated cell (timeout /
  abort / cap / dangling promise), with a `disposed` fence stopping any late
  out-of-band resolve from touching a freed VM; (2) `getPromiseState` allocates a
  FRESH heap handle for a settled promise's value/error EACH call, so the poll loop
  disposes it. Without these the runtime aborts at `JS_FreeRuntime`
  (`list_empty(&rt->gc_obj_list)`).

  WIRING (LIVE): `DefaultToolPorts.codeMode` is set by `buildGatedToolPorts`
  (`src/host/runtime/agent-arg-builder.ts`, `codeModePortSlot`, behind
  `cfg.codeMode`), and `AgentConfig.codeCellDispatchFactory` is wired by
  `wireCodeCellDispatch` (`src/agent/optional-ports.ts`, behind
  `QUANTA_CODE_MODE=1`) building `buildCodeCellDispatchPort` over the LIVE assembled
  AgentConfig + its `permission`. With the knob ON the tool runs gated cells (no
  longer `not_wired`); with it unset the config + tool menu are byte-identical AND
  the QuickJS-WASM module is never instantiated (lazy import).

  PHASE 2 WIRING (LIVE jun-07): the full surface flows
  registry.toolNames() → AgentConfig.codeCellSurfaceTools (a THUNK read lazily at
  cell-dispatch time, set alongside codeCellDispatchFactory by `wireCodeCellDispatch`
  behind QUANTA_CODE_MODE=1) → ToolContext.codeCellSurface (surfaced in the dispatch
  seam's buildToolContext, parallel to codeCellDispatch) → RunCodeCellOptions.
  surfaceTools → installToolsBinding (binds `tools[name]` for every surface name,
  deduped). The thunk reads the LIVE registry so a tool registered after assembly
  appears automatically. ABSENT ⇒ the Phase-1 3-tool default (byte-identical).

  PHASE 3 WIRING (LIVE jun-07): codeModeOnly (runtime-config, QUANTA_CODE_MODE_ONLY)
  → DirectiveConfig.codeModeOnly (projected in prompt.ts resolveDirectiveConfig) →
  DIRECTIVE_ORDER selector → CODE_MODE_ONLY_DIRECTIVE spliced into the dynamic tail.
  Default-OFF ⇒ zero bytes (the all-OFF golden in prompt-directives-hellgate holds).

  As-built deviations from the RFC §10 code-location plan:
    - The cell-lifecycle stream events (code_cell.started / .tool_call / .result)
      remain a follow-up — the per-cell ledger on the single tool result is the
      current observability surface.
  Slice fence: `@/codemode` imports ONLY node:* / quickjs-emscripten / @/shared /
  @/security (biome override on src/codemode/** blocks @/agent / @/tool /
  @/permission). The dispatch port arrives via ToolContext.codeCellDispatch,
  surfaced by the dispatch seam from AgentConfig.codeCellDispatchFactory.
