id: diagnostics-tool
title: diagnostics — provider-injected LSP front + graceful null degrade
section: 2
subsystem: 코어 read-only 도구 — language-server diagnostics
order: 112
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: partial
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: [surface:cli]
depends_on: [isconcurrencysafe, lsp-bridge]
purpose: |
  Surfaces language-server errors/warnings for one file. Slice isolation
  (RFC §3.1, biome-enforced): `@/tool` MUST NOT import `@/lsp` — so this file
  owns ZERO LSP knowledge and talks only to an injected `DiagnosticsProvider`.
  Real provider (pyright / typescript-language-server) is assembled in
  `src/agent/lsp-bridge.ts` (the agent slice is the only assembler allowed to
  cross slices — mirror of `mcp-bridge.ts` pattern for MCP). Default port is
  `nullDiagnosticsProvider` — every file degrades to a clean
  `"diagnostics unavailable: no language server configured"` no-op,
  so `defaultTools` stays static AND `buildDefaultTools()` is byte-identical
  by default. `formatDiagnostics` is pure (exported for unit tests): sorts by
  severity rank (error→warning→info→hint) then line, prefixes a one-line
  error/warning count header, converts 0-based LSP coords to 1-based display
  coords. Tool result `ok` is `true` iff no severity=error present (warnings
  alone don't fail the turn).
evidence:
  code:
    - src/tool/diagnostics/index.ts
  adrs: []
  tests:
    unit:
      - tests/unit/diagnostics.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  `isReadOnly: true` (opens document, never mutates) + `isConcurrencySafe:
  false` (each call drives a subprocess language server, so serialize).
  `path` is FsJail-validated via `resolveJailed` BEFORE handing to the LSP
  provider — only a branded `JailedPath`-equivalent ever reaches the server.
  Spawn/handshake failures and per-call diagnostics failures degrade to
  `ok:false` with a clear message; `session.stop()` is always finally'd. The
  `nullDiagnosticsProvider` export is the load-bearing default — without it
  the tool would have to be conditionally registered.
