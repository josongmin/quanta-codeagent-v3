    where: src/apps/cli/cli-knobs.ts:585 (read at ci-bot.ts buildCiBotWiring via gateOn)
    default: false
    purpose: "Opt-in §7.3 ci_finding structured CI-investigation record tool; ON ⇒ ci-bot wiring mints createCiFindingStore() and registers ci_finding through ghTools opts.ciFindingStore."
deliberate_hold: null
notes: |
  L3 (not L4): real slice + tests + full ci-bot wiring, but operationally thin — single
  surface (headless ci-bot only), ephemeral session store, no monitoring/web affordance.
  Promotion path: surface a /ci-findings render in the interactive loop and/or swap the
  in-memory ring for a SqliteJobStore-style backing once ci-bot gains resume.
