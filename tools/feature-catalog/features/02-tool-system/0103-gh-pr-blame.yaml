purpose: |
  gh CLI tool that maps PR review-thread comments onto file:line anchors —
  one step beyond commit blame ("who last touched this line" → "what did
  reviewers say about this line"). Filters by optional file path and/or line
  number with ±5 line proximity. Parses gh pr view --json reviewThreads to
  extract path / line / originalLine / isResolved / isOutdated / comment
  body+author per thread.
