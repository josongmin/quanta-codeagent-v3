purpose: |
  Surgical 2-part wire-up closing seams deliberately left open by ADR-0127
  / 0133 / 0137.
  (A) `providerFromEnv(env)` — env-driven `WebSearchProvider` factory with
  precedence `BRAVE_SEARCH_API_KEY` > `QUANTA_WEB_SEARCH_DUCKDUCKGO=1` >
  undefined. Composition root keeps explicit `AgentConfig.webSearch.provider`
  override; the helper is only the "just works" default. DI seam takes
  `env` arg so tests inject hermetic snapshots without polluting
  `process.env`.
  (B) Five document/structured-data tools (`csv_read` / `ndjson_read` /
  `yaml_read` / `pdf_read` / `xlsx_read`) — previously barrel-exported but
  outside `buildDefaultTools()` so models couldn't see them. Atomic
  single-commit closer: `MUTATING_TOOL_TABLE` gets the 5 `null` entries
  (read-only, mirror `read_image` / `web_fetch`) AND `buildDefaultTools()`
  adds the 5 imports + entries in the same commit so
  `mode-mutating-table.test.ts` never sees an `UnknownToolError`.
