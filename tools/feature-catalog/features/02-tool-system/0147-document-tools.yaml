purpose: |
  First modern coding agent to ship built-in structured-data tools (Cursor /
  Claude Code / Codex all shell out to cat/awk/jq). Closes 3 silent-corruption
  hazards in the bash baseline: (1) malformed CSV (unterminated quote, embedded
  newline) yields wrong column count; (2) one bad NDJSON line tanks `jq -s` for
  the whole file; (3) 100MB dumps blow context. 2 pure parsers + 2 tool wrappers.
  `parseCsv` is RFC-4180 aware state-machine splitter — Field / Quoted states
  handle `""` escape, CRLF/LF mix, embedded `\n` in quoted cells; emits typed
  diagnostics (unterminated-quote / ragged-row / empty-input) without throwing,
  ragged rows STILL emitted so caller decides drop. `parseNdjson` parses per-line
  JSON; bad lines surface as `{value: null, error}` while good lines flow
  through. Tool wrappers cap output and surface diagnostics. Pure parsers throw
  only `*ParserInputError` (programmer bug — never domain failure). Caller-
  deferred registration mirroring `read_image` / `web_fetch` posture.
