deliberate_hold: null
notes: |
  Default-OFF triple seam: (1) gitTools(runner) without opts.authorLLM omits
  both tools entirely (the CLI QUANTA_GIT_TOOLS path); (2) AgentConfig.composeAuthoring
  absent ⇒ buildComposeAuthoringBlock returns [] ⇒ ToolRegistry byte-identical
  (the knob-driven agent path); (3) the `compose-authoring` knob parse returns
  undefined for any env value other than the exact literal "1" (no trimming /
  case-folding / truthiness coercion — no heuristics), and its surfaces EXCLUDE
  bench so SWE-bench measurement stays on the no-compose trajectory +
  prefix-cache key.

  The author LLM is INJECTED via the tool factory (gitComposeCommitTool(runner,
  authorLLM)), type-only importing @/llm — no agent/subagent coupling. The knob
  uses the baseline cfg.llm as authorLLM (a cheap model is the usual operator
  pick, but the already-wired baseline is the safe default).

  configurable: integrated — QUANTA_COMPOSE_AUTHORING reaches the tools via the
  knob framework (resolveKnobs → applyKnobs → config.composeAuthoring →
  buildComposeAuthoringBlock).
