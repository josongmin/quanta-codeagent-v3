id: commit-pr-authoring
title: Commit + PR authoring tools (diff→prose, git_compose_commit / git_compose_pr)
section: 2
subsystem: tier-1 LLM tools (ADR-0016 compose seam)
order: 430
maturity: L3
status: stable
ui_surfaces: [cli, api]
modes: [interactive, batch]
monitoring: n-a
configurable: integrated
owners: ["@songmin"]
labels: ["absorbed:codex-yeet", "absorbed:cursor-compose", "surface:tool", "tier:tier1"]
depends_on: [git-read-trio, advisor-consult-tool]
purpose: |
  Two READ-ONLY authoring tools that close the diff→prose gap (the Codex `yeet`
  / Cursor compose pattern). `git_compose_commit` reads the STAGED diff and
  authors ONE Conventional Commits message; `git_compose_pr` reads the
  branch-vs-base diff + commit log and authors a PR title + body. Both hand the
  (bounded / truncated) diff to a ONE-SHOT LLMPort completion and RETURN the
  authored text — they do NOT commit and do NOT open a PR. The model feeds the
  result into the existing mutating git_commit (regular mode) / gh_pr_create, so
  the existing HITL gate still governs the actual mutation. isReadOnly,
  isConcurrencySafe, hitlTier "none". NO-THROW: empty / no-staged diff →
  typed ok:false; provider error / empty message → typed ok:false; a
  non-conventional / free-text reply → typed ok:true with conventional:false
  (best-effort, raw text surfaced). The diff injected into the author prompt is
  capped (MAX_DIFF_BYTES 50KB / MAX_LOG_BYTES 10KB) with a visible truncation
  marker, and the prompt frames the diff as DATA (prompt-injection defence).

  The `compose-authoring` knob (env QUANTA_COMPOSE_AUTHORING=1) env-flips the
  two tools from absent to live by folding the session's baseline AgentConfig.llm
  into AgentConfig.composeAuthoring.authorLLM; the tier-1 buildComposeAuthoringBlock
  reads that slot and registers the tools. Absent / any-other env ⇒ slot unset ⇒
  builder returns [] ⇒ ToolRegistry byte-identical (RFC §1.2).
