id: negative-invariants-doc-ssot
title: ADR-0044 negative invariants — single doc SSOT for 12 deliberately-not-absorbed patterns
section: 3
subsystem: Negative-space ADR — "we do not do X" trust-model declarations
order: 96
maturity: L3
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: [absorbed:codex, surface:cli, held-promotion]
depends_on: [migration-importer-credential-read-ban, runtime-config-ssot, web-fetch-search, persona-slot]
purpose: |
  Single ADR documenting 12 patterns from Codex/Claude Desktop audit that v3
  deliberately does NOT adopt — paired SSOT for the "흡수 안 함" half of every
  audit cycle. Each N-item names a pattern, the v3 trust-model conflict, and
  the cost of reversal (a new ADR + explicit invariant lift). The 12 items:
  N1 (no always-on screen-capture daemon), N2 (no global modifier-key hook),
  N3 (no unsandboxed Electron + JIT entitlements), N4 (no personality-driven
  system-prompt branching that breaks prefix-cache), N5 (no Chrome native-
  messaging plugin that exfiltrates user browser sessions), N6 (no 14GB+
  cumulative trace DB by default), N7 (no `runWidgetCode` arbitrary-JS port),
  N8 (no `setAdditionalGlobals` unbounded widget global injection), N9 (no
  `dangerously-bypass-approvals-and-sandbox` global escape hatch), N10
  (importer never auto-reads other agents' auth tokens), N11 (no cleartext
  HTTP by default), N12 (no dormant SDK vendoring without active use).
evidence:
  code: []
  adrs: [44]
  tests:
    unit: []
    integration: []
    contract: []
knobs: []
deliberate_hold:
  reason: 'Doc-only by design — the ADR is the convention SSOT. Per-N runtime enforcement, where it exists, is registered separately (e.g. migration-importer-credential-read-ban for N10, web-fetch-search HTTPS-only for N11, persona-slot byte-identical default for N4).'
  promotion_path: 'L3 → L4 when ≥80% of N-items have a registered runtime-enforcement companion entry pointing to the actual gate.'
notes: |
  Negative invariants are not "we haven't built X yet" — they are "X is
  incompatible with our trust model / surface constraints, and reversal
  requires a new ADR explicitly lifting the invariant + a 2-reviewer PR
  (surface owner + security owner)." Companion entries with runtime
  enforcement: persona-slot (N4 default body == "" preserves prefix cache),
  web-fetch-search (N11 HTTPS-only at URL-parse boundary), jsonl-cumulative-
  retention (N6 conservative disk cap), migration-importer-credential-read-ban
  (N10 auth.json never opened), runtime-config-ssot (related env-read SSOT).
