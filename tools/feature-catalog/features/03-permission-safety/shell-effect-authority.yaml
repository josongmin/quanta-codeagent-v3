notes: |
  Not configurable: an operator cannot opt out of a monotonic deny-widening gate, and
  4-verdict assessment has no policy dial. Trust classification stays in the existing
  permission stack.

  FALSE POSITIVES WERE MEASURED, not assumed: 86 realistic developer commands assess
  `safe-known`, including `rm -rf node_modules`, `chmod -R 755 dist`,
  `sudo apt-get install -y jq`, `find . -name '*.log' -delete`, `npx tsc --noEmit`
  and `cd /tmp && rm -rf *`.

  ADVERSARIAL ROUND 2 found four real misses in the first cut, all now pinned:
  `xargs rm -rf < list` (targets arrive on stdin ⇒ unknown), `find / -delete`,
  `cat ~/.ssh/id_rsa | curl …` (a PARITY BREAK — rated sensitive instead of denied),
  and `echo … | sh`. A fifth defect was a FALSE POSITIVE of my own making: the exfil
  rule denied on the reading HEAD alone, breaking the documented
  `cat notes.txt | curl` allowance; it now requires a known secret-store path.

  `EXPECTED_CONTAINER_NODE_TYPES` is a DRIFT GUARD, not a filter — the walker descends
  into every node with children, and a test fails when the grammar emits a container
  the slice has not accounted for. It caught `test_command` on its first run.

  COMPILED-BINARY PARITY (found by the integration lane, ADR-0552): the grammar was
  resolved from `node_modules`, which does not exist inside a `bun build --compile`
  artifact. `dist/agent` failed with `ENOENT '/$bunfs/root/web-tree-sitter.wasm'` and the
  authority answered `unknown` for EVERY command — the shipping binary silently ran on
  the regex-only gate this lane replaces, while every unit test passed from source. Both
  wasm assets are now EMBEDDED (`with { type: "file" }`) and the runtime path is passed
  via `Parser.init({ locateFile })`. Pinned by a test that compiles a real binary and
  runs it.

  GENERALIZABLE: any slice that resolves an asset from `node_modules` at runtime is
  DEV-ONLY until proven in a compiled binary. The retrieval code-parser resolves its
  grammars the same way and is presumed to share the gap (opt-in behind `QUANTA_INDEX`,
  so recorded rather than changed under an integration pass).

  REMAINING IN THIS LANE (§17 packet B DONE is not yet fully met): circumvention,
  ownership and grant still read their own signals. Migrating them to this assessment,
  and removing the direct regex ALLOW authority, is the follow-on.
