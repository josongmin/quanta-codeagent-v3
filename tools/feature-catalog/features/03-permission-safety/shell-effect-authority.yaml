    web: "same gate — the permission layer is surface-agnostic"
purpose: |
  The hard-deny gate matched REGEXES against a lightly-normalized command string. A
  regex cannot see shell structure, so a command whose dangerous EFFECT is assembled
  out of structure reads as harmless text and was ALLOWED. Measured against the
  shipping gate, all of these passed:

    cd / && rm -rf *
    cd /; rm -rf .
    rm${IFS}-rf${IFS}/
    git push origin +main
    npx rimraf /
    python3 -c "import shutil; shutil.rmtree('/')"
    eval "$(echo <base64> | base64 -d)"

  Widening the regexes cannot fix the class: `cd / && rm -rf *` and
  `cd build && rm -rf *` differ only in a command that ran EARLIER in the same list.

  This slice parses each command ONCE with the vendored tree-sitter bash grammar,
  lowers it to a typed IR (execution order, resolved argv, pipeline membership,
  unresolved expansions, self-recursive functions), and returns ONE assessment:
  `safe-known` | `sensitive-known` | `hard-deny` | `unknown`.

  `unknown` IS THE LOAD-BEARING DECISION. `${IFS}`, command substitution, `eval`, an
  interpreter's inline payload, a parse error, a MISSING node, and a parser that has
  not initialized all produce `unknown` — never `safe-known`. An AST is not a sandbox;
  the only safe answer to "I could not read this" is the existing ask/deny boundary.

  The effective cwd is THREE-state (`caller` / `abs` / `unknown`), because two would
  force a wrong answer: collapsing `caller` into `unknown` pushes every routine
  `rm -rf ./build` to a prompt, and collapsing it into a concrete path is how
  `cd $X && rm -rf *` slips.

  DENY-WIDENING ONLY at the hard-deny seam: `hardDenyReason` consults the authority
  after the regex list and acts only on `hard-deny`. `unknown` changes nothing there.
  The gate stays monotonic — it can refuse more, never permit more — so a grammar that
  fails to load degrades to today's regex-only behavior.
