id: shell-effect-authority
title: "One shell syntax/effect authority — parse once, judge the effect, never let `unknown` mean safe"
section: 3
subsystem: Permission — shell command effect assessment
order: 210
maturity: L4
status: new
ui_surfaces: [cli, web]
