purpose: 'The PDP first pure decider — the SECURITY FLOOR. Separates the permission DECISION (pure, surface-agnostic SSOT) from ENFORCEMENT (the dispatch chokepoint). Answers ONE question: does an always-confirm tier apply UNIVERSALLY (every surface, regardless of hitl.enabled opt-in)? Un-blocks always-confirm secure-by-default: inferToolTier collapses TWO reasons a tool is always-confirm — INHERENTLY SENSITIVE (git push/deploy => confirm everywhere) vs NEEDS-SANDBOX (a profile-less bash self-reports always-confirm for ALL commands => must defer to the sandbox/mode layer, not a blanket confirm). The capability spec splits them as DATA: a tool opts INTO the floor by declaring capability.confirm:"sensitive". decideFloor reads that data — "sensitive" + always-confirm => universal-floor; else => defer (byte-identical to today mode-policy/opt-in). NO IO, NO surface knowledge.'
evidence:
  code:
    - src/permission/pdp.ts
    - src/agent/admissibility-gate.ts
    - src/tool/types.ts
  adrs: []
  tests:
    unit:
      - tests/unit/permission/pdp-decide-floor.test.ts
