id: bridge-attestation
title: Bridge Attestation — remote permission preflight + STS token (ADR-0246)
section: 3
subsystem: Remote attestation seam (preflight + HMAC-SHA256 STS) — Claude Desktop onBridgePermissionPreflight + 9-event stream absorption
order: 246
maturity: L2
status: hold
ui_surfaces: [n-a]
monitoring: n-a
telemetry_keys: ["quanta.bridge_attest"]
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: [absorbed:claude-desktop, security-touched, default-off]
depends_on: []
config_refs:
  env: []
surface_integration:
  cli: missing
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "src evidence not reachable from the interactive CLI entry (src/apps/cli/index.ts); no production constructor/import consumer exists."
    web: "pure internal security primitive (HMAC-SHA256 STS token mint plus preflight); no web consumer or affordance."
purpose: |
  Closed-port leaf slice for remote permission preflight + short-lived STS
  token issuance. Absorbs Claude Desktop's `onBridgePermissionPreflight` round
  + 9 lifecycle events into a typed `BridgeAttestor` port with 3 methods
  (preflight / verify / revoke). Token issuance is reachable only through an
  allow preflight; callers cannot mint arbitrary scope/TTL tokens.

  3-arm `AttestResult` discriminated union (`allow` / `deny` / `prompt-user`)
  is the secure-by-default surface — adding a 4th arm without exhaustive-switch
  wiring is a TS error at compile time.

  Token format: `base64url(HMAC-SHA256(secret, "${scope}|${expiresAt}|${nonce}"))`
  with 16-byte random nonce for collision-free minting at identical
  (scope, expiresAt). Scope is canonical `JSON.stringify([agentId, action,
  resource])`, preventing cross-agent token reuse and delimiter collisions.
  `requestedAt` is enforced before policy lookup (default 5 minute age / 30s
  future-skew bounds); stale, future, malformed, or empty requests deny before
  token mint.

  Default-OFF: nothing in dispatch/loop/agent wires this today. The caller
  (a future MCP `bridge_attest_preflight` tool, a Tauri sidecar bridge wrapper,
  an org-policy proxy) opts in via constructor.

  Construction is fail-closed: caller-owned HMAC material is mandatory and must
  be at least 32 UTF-8 bytes. There is no test-secret fallback.

  Plane discipline: imports `node:crypto` and `@/shared` (error helper) only.
  No `@/agent`, `@/permission`, or `@/observability`. Re-usable in a Tauri
  sidecar, worker thread, or standalone attestation binary.
evidence:
  code:
    - src/security/bridge-attest/types.ts
    - src/security/bridge-attest/port.ts
    - src/security/bridge-attest/default-attestor.ts
    - src/security/bridge-attest/headless-stub.ts
    - src/security/bridge-attest/index.ts
  adrs: ["docs/decisions/0246-bridge-attestation.md", "docs/decisions/0184-conversation-checkpoint-lru-swap.md", "docs/decisions/0166-subagent-conversation-replay.md"]
  tests:
    unit:
      - tests/unit/security/bridge-attest-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: secret
    where: defaultAttestor constructor opt
    default: "required; no default"
    purpose: HMAC-SHA256 signing secret; absent, blank, or under 32 UTF-8 bytes → fail-closed constructor error
  - name: policyTable
    where: defaultAttestor constructor opt
    default: "{} (every action → prompt-user)"
    purpose: Maps action → allow|deny|prompt-user verdict
  - name: clock
    where: defaultAttestor constructor opt
    default: "Date.now"
    purpose: Injectable for test-time TTL determinism
  - name: onEvent
    where: defaultAttestor constructor opt
    default: "no-op (default-OFF)"
    purpose: 9-event stream subscriber (preflight-requested/-granted/-denied/token-minted/-used/-expired/-revoked/preflight-error/attest-audit)
  - name: maxRequestAgeMs
    where: defaultAttestor constructor opt
    default: "300_000"
    purpose: Maximum accepted preflight request age; stale/non-finite timestamps deny before policy lookup or token mint
  - name: maxFutureSkewMs
    where: defaultAttestor constructor opt
    default: "30_000"
    purpose: Maximum accepted future timestamp skew; excessive future requests deny before policy lookup or token mint
  - name: DEFAULT_STS_TOKEN_TTL_MS
    where: module-scope constant in src/security/bridge-attest/default-attestor.ts
    default: "300_000 (5 minutes)"
    purpose: |
      TTL for the auto-minted STS token on an `allow` verdict. Matches AWS STS
      short-lived credential convention — long enough for typical
      preflight→action latency, short enough to bound exposure on accidental
      leak. NOT an opt-in knob (intentionally compile-time, not runtime-tunable)
      because each `allow` arm mints with a single canonical TTL. Arbitrary
      caller-selected TTLs would bypass the preflight authority boundary.
deliberate_hold:
  reason: |
    Deliberate sequencing, and the purpose text already says it: "Default-OFF:
    nothing in dispatch/loop/agent wires this today." Verified 2026-08-22 —
    `grep -rn "security/bridge-attest" src/` outside the slice returns ZERO hits, so
    all five evidence files are unreachable from every `src/apps/<surface>/index.ts`.
    The slice mints STS credentials, so the intended callers are transport-bearing
    (Tauri sidecar bridge, org-policy proxy, an MCP `bridge_attest_preflight` tool)
    and every one of them is a separate ADR; wiring a credential minter ahead of the
    transport decision is what the hold prevents. Mechanism (3-arm AttestResult,
    fail-closed >=32-byte secret, freshness bounds, 9-event stream) is finished and
    hellgate-covered.
  promotion_path: |
    L3 = the first production caller constructs the port from a composition root, so
    `src/security/bridge-attest/*` becomes reachable from an app entrypoint; L4 adds
    a downstream subscriber for the 9-event stream (jsonl recorder or OTel sink).
    `bun fc reachability --strict --symbols` is the objective judge: this id must
    drop off the offender list on its own, with NO baseline edit.
notes: |
  Sibling to ADR-0050 trust-scope (local grant memory) and ADR-0158/0166
  checkpoints (local rollback). Closes the "remote-side preflight + token"
  gap that those local-scope slices left open.

  Test pattern: hellgate alone (no integration test) until a real caller wires
  this slice — by design, since wiring is a future-ADR concern.

  Maturity was L3 until 2026-08-22, when the L3 reachability floor
  (`bun fc reachability --strict --symbols`) was audited item-by-item instead of
  grandfathered. L3 asserts "wired, with tests"; this slice has tests but zero
  production importers, so L2 (mechanism built + tested, host edge deferred) is
  the honest tier. No code changed — only the claim.
