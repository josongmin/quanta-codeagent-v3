purpose: |
  File-backed JSON store for per-thread permissions, per-host agent modes,
  and post-denial precedence records. Single file at
  `~/.quanta/permission-state.json` (overridable via
  `QUANTA_PERMISSION_STATE`, both env vars read via `runtimeConfig()` — the
  one legitimate `process.env` owner). Composition root
  (`createPermissionStore`) owns ONE live `MutableState` + ONE
  `JsonStateFile` persistence engine and layers three thin domain modules
  over them: `createThreadStore` / `createHostStore` / denied-actions ledger.
  The persistence helper owns the file-side machinery independent of WHAT
  is stored: atomic write (`.tmp.<pid>.<rand>` + `rename`), debounced flush
  (one rename per debounce window), write serialization
  (`enqueueWrite` burst-collapse — no torn rename), quarantine sidecars
  (`.corrupt` / `.unsupported-vN`), load→parse→validate with soft-fail to
  empty state, and a `reset()` test seam. Failure model (preserved
  verbatim): missing file ⇒ cold-start empty (no warning); corrupt JSON ⇒
  start empty + `.corrupt` sidecar (never crash). Slice rule: pure
  `node:` stdlib only — NO `@/storage`, NO `@/memory` (kept at minimum
  dependency surface per biome `noRestrictedImports`).
