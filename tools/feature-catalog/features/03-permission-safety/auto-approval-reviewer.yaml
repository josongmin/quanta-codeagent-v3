id: auto-approval-reviewer
title: AutoApprovalReview (periodic "are these auto-grants still OK?" prompt)
section: 3
subsystem: 권한 스택 (ADR-0135)
order: 24
maturity: L4
status: new
owners: ["@songmin"]
labels: [absorbed:codex, surface:cli]
purpose: |
  **Codex `automaticApprovalReview.actionSummary` 흡수.** 매 N (default 10) 연속
  auto-approval 마다 사용자에게 review prompt — "이 정책 OK?" 확인. 사용자가
  loop에 들어왔거나 deny 이벤트가 발생하면 streak 리셋.

  pure ledger pattern — record(tool, granted, method)로 누적, threshold cross 시
  true 반환 (caller가 prompt 띄움). generateReviewSummary()는 최근 boundary 까지의
  auto-grant list + hint를 plain text로 반환.

  default threshold 10 ADR-0135 §4. capacity 200 (bounded — long session no
  unbounded growth). prompt frequency 0이면 무의미, 너무 잦으면 fatigue — 사용자
  설정 가능 (threshold).
