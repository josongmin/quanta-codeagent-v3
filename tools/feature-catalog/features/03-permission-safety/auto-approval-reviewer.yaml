notes: |
  - method `auto` + granted true만 streak count.  `user`/`system` 또는 denial은
    streak 리셋 (operator was in the loop already).
  - history()는 frozen snapshot — caller 안전하게 직렬화/렌더 가능.
  - reset semantics: 한 번 threshold 발화 후 자동 0 → 다음 N auto-approval 마다
    재발화 (스트림 처리 OK).
