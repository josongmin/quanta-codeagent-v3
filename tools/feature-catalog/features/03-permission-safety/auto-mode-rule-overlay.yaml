id: auto-mode-rule-overlay
title: jun-7 auto-mode user-rule overlay (4-category $defaults splice + untrusted-source fence)
section: 3
subsystem: Permission auto-mode — operator-tunable AFK classifier boundary
order: 81
maturity: L3
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
config_refs:
  env: [QUANTA_AUTO_MODE_RULES]
owners: ["@songmin"]
labels: [surface:cli, category:permission, security, security-touched, default-off, absorbed:claude]
depends_on: [auto-mode-classifier, deny-reason-surfacing]
purpose: |
  AFK auto-mode 분류기(`CLASSIFIER_SYSTEM_PROMPT`, frozen 상수)에 operator 가 자신의
  `allow`/`soft_deny`/`hard_deny`/`environment` 룰을 레이어링하는 pure overlay
  composer. Claude Code CLI 2.1.150 의 `YG_`/`uB7` + 4-slot(`<user_*_to_replace>`)
  + `$defaults` 센티넬을 verbatim 포팅. `withUserRuleOverlay(base, overlay)` 는
  `withExfilScoutingTaxonomy` 의 default-OFF shape 미러 — `overlay===undefined`
  (knob OFF or no rules) ⇒ base BYTE-IDENTICAL 반환. `$defaults` ⇒ 해당 카테고리
  baseline 을 그 위치에 1회 splice; 없으면 full-replace; 빈 리스트 ⇒ baseline verbatim.
  룰 출처는 기존 `@/rules` 3-layer DSL(user/project) — parallel 스토어 신설 금지.
  SECURITY CRUX(untrusted-source fence, Claude `tengu_settings_auto_mode_untrusted_
  source_ignored` 패리티): repo-controllable `project` 레이어는 TIGHTEN(`soft_deny`)/
  context(`environment`) 방향만 적용 — `allow`/`hard_deny`(LOOSEN/security-boundary)
  는 DROP. `buildAutoModeOverlay` 어댑터(`@/permission` 거주, `@/rules→@/permission`
  커플링 회피)가 이 fence 를 강제하고 hellgate red-on-injection 으로 봉인.
  DEFAULT-OFF(`QUANTA_AUTO_MODE_RULES` strict `=== "1"`): 부재 ⇒ overlay slot 미치환,
  baseline 리스트 미materialize, 분류기는 canonical prompt 그대로 — byte-identical.
