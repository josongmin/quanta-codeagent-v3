knobs:
  - name: QUANTA_AUTO_MODE_RULES
    default: 'undefined'
    purpose: Strict opt-in (`=== "1"`). OFF ⇒ `withUserRuleOverlay` 은 overlay 미생성, 분류기는 canonical `CLASSIFIER_SYSTEM_PROMPT`(or scout-overlaid) 그대로 — byte-identical classification. ON ⇒ gate 가 rules-store snapshot 을 fenced 어댑터로 overlay 화하여 prompt 에 splice.
deliberate_hold: null
notes: |
  설계 provenance: 티켓 `docs/tickets/misc-jun-7/04-auto-mode-rule-overlay-circumvention.md`
  §4.a. ADR-0502 발행됨(reconcile pass) — 티켓은 상세 design 정본. DSL `deny`→`soft_deny`/`hard_deny`
  매핑(티켓 Open Question §6.2): 현 `@/rules` DSL 은 single `deny`(hard 태그 없음)라 모든
  `deny`→`soft_deny`(보수적 default); `LayeredRule.hard` 태그는 deferred DSL 확장으로
  어댑터 시그니처에 예약됨. `environment` 슬롯도 현 DSL 미저작(deferred) — `(none)` 렌더.
