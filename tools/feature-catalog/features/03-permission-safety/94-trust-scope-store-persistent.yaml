    contract: []
knobs: []
deliberate_hold:
  reason: 'OS-keyring encryption-at-rest is a follow-up — the on-disk file is plaintext today (acceptable for the local-dev posture; remote / multi-tenant introduces a different trust model).'
  promotion_path: 'Wire keyring port when a hosted-agent or multi-tenant scenario lands.'
notes: 'Wire-up only treats `hasGrant(...) === true` as ask-skip; deny routes through the legacy / explicit deny path.'
