    integration: []
    contract: []
knobs: []
deliberate_hold: null
notes: |
  Linux per-call wrap은 의식적 보류 (`linux-not-implemented-per-call`) —
  세션 slot 경로(ADR-0136/0150/0175) 가 linux를 커버하므로 호출 빈도가
  확인되면 별도 ADR로 async bwrap probe 도입. parallel 실행은 측정 후
  결정 (no-heuristics 원칙).
