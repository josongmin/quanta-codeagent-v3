id: bash-mode-per-call-sandbox
title: bash `mode` + per-call OS sandbox wrap (ADR-0295)
section: 3
subsystem: Per-call OS sandbox seam for shell-class tools
order: 293
maturity: L3
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:cli", "absorbed:cursor", "security-touched", "default-off"]
depends_on: [os-sandbox-helper]
purpose: |
  Cursor 3.2 패턴 흡수 — bash tool 입력에 closed-enum `mode: "read"|"write"`
  (OPTIONAL, default "write"). `mode="read"` 일 때 호출당 OS sandbox
  (Seatbelt read-only) 로 argv 를 래핑하여 write/exec/network 시도를 OS가
  EACCES 로 거부. typed `ToolFailure { mode: "sandbox_violation"|
  "sandbox_unavailable" }` 으로 모델에 분기 신호. 호스트가 강제 불가하면
  fail-closed (legacy 비-sandboxed 경로로 fallback 금지). closed-port
  `PerCallSandboxPort` 어댑터 + `ShellOptions.perCallWrap` runShell 옵션
  주입. 동시성은 직렬 유지 (SOTA 합의). 미지정/`mode="write"` →
  byte-identical legacy.
evidence:
