purpose: |
  The RESOLVER ENGINE half of the permission policy (SRP split with the data
  half in `policy-rules.ts`). Owns `evaluate` / `evaluateAuto` /
  `evaluateStack` / `inferToolTier` / `hardDenyReason` — the four call surfaces
  the admissibility gate composes per-action. Pipeline: (1) HARD_DENY
  deny-by-default baseline runs first (description-only surfacing of
  matched rules — verbatim patterns are NEVER exposed past the slice to
  defeat jailbreak-crafter enumeration); (2) inferred HITL tier overlays
  (`inferToolTier` secure-by-default fallback per ADR-0070); (3)
  per-thread + per-host store consultation (`threadAllowsMutation` /
  `hostAllowsMutation`); (4) auto-mode classifier port consulted when
  applicable. The legacy `bash`-only shellCommand back-compat probe is gated
  to `bash` so it cannot widen the gate; modern callers populate
  `action.shellCommand` via `ToolRegistry.extractShellCommand`. Slice rule:
  pure module — no `@/agent`, no `@/llm`; the LLM-backed classifier impl is
  injected via `PermissionContext.classify`.
