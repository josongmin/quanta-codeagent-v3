id: recorder-fail-open-permission-verdict
title: Permission recorder — observability fail-open invariant (verdict cannot be flipped by emitter throw)
section: 3
subsystem: Permission slice telemetry — "observability bugs MUST NOT abort a permission decision"
order: 98
maturity: L2
status: stable
ui_surfaces: [n-a]
monitoring: integrated
modes: [n-a]
configurable: static
owners: ["@songmin", "team-safety"]
labels: [absorbed:codex, surface:cli, security-touched, held-promotion]
purpose: |
  Negative invariant: a thrown PermissionRecorder cannot deny an otherwise-
  allowable action nor allow an otherwise-denied one. Every emit helper
  wraps the registered recorder in try/catch and swallows the throw — the
  gate's verdict is computed BEFORE the emit and the emit is fire-and-forget.
  Default-OFF guarantee: with no registered recorder, every helper is a
  zero-allocation no-op (the hot path stays byte-identical to its pre-emit
  form). Security companion invariant: the slice-local `PermissionDecisionRecord`
  carries ONLY categorical / pre-hashed primitives (outcome / reviewerTier /
  riskLevel / pre-categorized stackSource label / 32-hex actionSignature /
  opaque threadId+hostId) — never raw command text, action.input, rationale,
  or matched HARD_DENY rule source. A field-by-field audit at every emit
  site is the structural enforcement.
