notes: |
  Mirrors the same fail-open posture documented for `@/observability/spans.ts`.
  Slice rule: this module imports NOTHING beyond TypeScript built-ins (RFC 3.1
  isolation; cross-slice OTel routing happens in an adapter in `@/agent` or
