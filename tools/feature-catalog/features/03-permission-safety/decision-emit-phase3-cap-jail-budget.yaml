purpose: |
  ADR-0267 Phase 2는 `runAdmissibilityGate` *내부* 3개 게이트 (permission /
  rule / hook)만 wire함. cap / jail / budget 게이트는 admissibility call graph
  바깥의 다른 chokepoint에 있어서 silent 상태였음 — `DecisionEvent.kind`
  closed union에는 6 kind 다 들어있는데 정작 절반은 production에서 emit이
  안 됐었음. 이 슬라이스가 사이클을 닫음.

  세 새 emit site: (1) **cap** — `dispatch.ts`의 `tool_progress` reminder
  fire 직후 (CapEnforcer.check가 non-undefined reminder return = 게이트
  intervention). 새 helper `handleCapReminder(config, call, reminder)`로
  extract해서 `dispatchToolInner` cognitive complexity 22 유지. (2) **jail**
  — `@/storage/service.ts#enforceJail`가 free function이라 per-call emitter
  threading은 tool slice 전체에 ripple. 대신 module-level optional sink
  (`setFsJailDecisionSink` / `clearFsJailDecisionSink`) 도입. `FsJailError`
  throw *전에* try/catch 안에서 sink invoke. Last-writer-wins (concurrent
  in-process session) 명시적 accept. (3) **budget** — `loop.ts` per-turn
  epilogue, `finish("budget_exhausted")` 직전. BudgetMeter는 pure state
  machine 유지 (emit은 호출자 책임).

  기존 `DecisionEmitter` port + `AgentConfig.decisionEmitter?` slot 재사용 —
  새 port 추가 절대 안 함. Helper 모듈만 새로: `src/agent/decision-emit-phase3.ts`
  leaf (Phase 2 helper와 분리 — Phase 2는 admissibility config 받지만 Phase
  3은 dispatch/storage/loop 각자 다른 site, locality 보존). `admissibility-gate.ts`
  는 NOT mutated → Phase 2 byte-identical 회귀 locking.

  Allow paths stay SILENT — Phase 2 hook과 달리 Phase 3 chokepoint는 매우
  자주 fire (every fs op이 enforceJail, every turn이 checkExhausted). emit-on-
  allow는 debug-tracer flood. cap reminder 없음 = allow = skip, inside-jail
  path = silent, exhausted=false = silent.

  Slice fence: `@/storage`는 `@/stream`에 의존 ❌ — `FsJailDecisionEvent`는
  inline structural mirror (same closed kind/outcome unions, same field
  names). 와이어링 layer (`@/agent`)가 진짜 `DecisionEmitter`를 넘기고 TS
  structural typing이 양 끝을 정렬.
