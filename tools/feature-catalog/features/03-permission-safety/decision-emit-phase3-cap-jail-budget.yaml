notes: |
  14-case hellgate 39 expects, cap / jail / budget 3 describe별: shape (kind /
  outcome / reason / toolCallId / metadata exactly as declared) / allow silence
  / default-OFF (undefined emitter → no throw, no allocation) / throw isolation
  (poison emitter는 게이트 결과 poison 못 함) / metadata sanitisation
  (declared keys만: cap={tool}, jail={path,root}, budget={kind,used,limit})
  / jail sink lifecycle (idempotent clear, last-writer-wins).

  Throw isolation: 모든 emit path가 try/catch wrap. 잘못 동작한 emitter가
  cap-reminder를 missing reminder로, jail throw를 swallow로, budget
  exhaustion을 continued run으로 바꿀 수 없음. 3 hellgate case (per site)가
  seal.

  Sanitisation: jail의 `path` 노출은 의도적 안전 (사용자가 직접 supply한
  path이고 REJECTED됐으므로 file contents 노출 아님). budget의 `used`/`limit`
  은 numerical observations. cap의 `tool` 이름은 already public registry
  surface. action.input / call.input / env values 스프레드 절대 안 함.
