notes: |
  user_approved_for_session(ADR-0029)이 actionKey 단위 기억의 씨앗 — rememberPatterns는 그 위에
  패턴-단위 cascade를 얹음. L4 promotion에서 출처를 명확히 한 LearningSource enum까지 추가해
  trajectory 소비자가 "왜 자동허용됐는가"를 exhaustive switch로 분기 가능.

  Out-of-scope follow-ups: ML 분류기 v2(현재는 deterministic prefix-token sniffer;
  알려진 위험 플래그 over-fit 우려), 모델 surface(rememberPatterns/isMaybeDangerous를 모델
  계약에 노출하는 schema 필드 — 현재는 dispatch seam이 action에 plumb만 함).
