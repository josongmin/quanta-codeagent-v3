notes: |
  구조적 안전 invariant — 새 untrusted 블록을 추가할 때마다 escaping을 *까먹을 수
  없게* 하는 single chokepoint. 두 legacy helper (escapeReminderBoundary /
  escapeContextBoundary) 의 superset이자 byte-identical 대체. 명시적 ADR 미부여 —
  prompt-injection 차단은 cross-cutting safety invariant 다수에 깔려있음.
