notes: |
  **LLM-callable tool 표면 배선 완료 (CLUSTER D #5, 2026-06-06)** — residual였던
  모델-facing RECORDING 표면 배선. `permission_propose_pattern` 도구
  (`src/tool/permission-propose/`): in-schema `{proposed: string[] (1..32),
  is_maybe_dangerous?}` → 주입된 duck-typed `PermissionPatternProposePort`
  (=`recordProposedPattern` 어댑터)로만 라우팅 → typed `recorded{patterns}` |
  `rejected{reason}`(would_widen/dangerous_blocked/no_store/empty). NO-THROW
  (throwing port→typed error). `isReadOnly:()=>false`. `@/tool` fence-clean
  (duck-typed port, `@/permission` 미import).

  3-SSOT 등록: manifest(risk=mutating, GATED, QUANTA_REMEMBER_PATTERNS) +
  MUTATING_TOOL_TABLE(`working_state_write`) + plan-mode e2e/mode-mutating-table
  CALLER_WIRE 등록. default-OFF: `DefaultToolPorts.permissionPatternPropose`
  미배선 ⇒ 도구 부재 byte-identical(QUANTA_REMEMBER_PATTERNS=1일 때만 host 배선).

  host store 합성: 노브 ON 시 host가 per-session `PatternGrantStore` + no-widen
  port construct. **BASELINE-SEED RESIDUAL — CLOSED (2026-06-06)**: 이전엔 합성
  레이어에서 신뢰 user/policy allow-list 도달 불가라 EMPTY baseline로
  safe-but-rejects-all(모든 제안 would_widen)였다. 이제 host가 ONE per-session
  store를 construct해 BOTH 소비자에 thread: (1) `AgentConfig.permissionPatternStore`
  (admissibility-gate의 user-approve `cascadeOnApprove`→`grantAndCascade`→
  `store.grant` baseline write + `autoPassByPatterns` read), (2)
  `permission_propose_pattern` 도구 port (동일 store의 `recordProposed`).
  baseline은 위조 대신 RUNTIME에 user-approval이 LIVE로 시드 — 모델은 user가 이미
  승인한 패턴만 refine 가능. SECURITY: propose port는 `recordProposed`(allowed-only,
  no-widen-gated)로만 write → `store.grant` 절대 미호출 ⇒ 모델 제안이 baseline을
  seed 불가(no self-grant, no chain-widen: recorded allowed 패턴은 baseline 아니라
  그걸 refine해도 would_widen). dangerous gating CLOSED(allowDangerous:false). 합성
  wiring(file:line): `src/host/runtime/agent-arg-builder.ts`
  `resolvePermissionPatternSlice`(store+port 1회 construct) +
  `permissionPatternStoreSlot`/`permissionProposePortSlot`(spread-ready, default-OFF
  `{}`) — gate consumption은 기존 LIVE(admissibility-gate.ts `runPatternAutoPassGate`/
  `cascadeOnApprove`)라 별도 배선 불요.

  user_approved_for_session(ADR-0029)이 actionKey 단위 기억의 씨앗 — rememberPatterns는 그 위에
  패턴-단위 cascade를 얹음. LearningSource enum까지 추가해 trajectory 소비자가
  "왜 자동허용됐는가"를 exhaustive switch로 분기 가능.

  history: 2026-05-25 audit는 모델 surface 미배선으로 L3 honest-demote. 2026-06-06
  `permission_propose_pattern` tool 배선으로 모델-facing RECORDING 사이클이 닫혀
  L4 재승격. 같은 날 host SHARED-store wiring으로 BASELINE-SEED RESIDUAL도 CLOSED
  (gate user-approval이 baseline을 LIVE 시드 → 기능이 실제 USEFUL+SECURE; 위
  BASELINE-SEED RESIDUAL — CLOSED 참조).

  Out-of-scope follow-ups: ML 분류기 v2(현재는 deterministic prefix-token sniffer;
  알려진 위험 플래그 over-fit 우려).
