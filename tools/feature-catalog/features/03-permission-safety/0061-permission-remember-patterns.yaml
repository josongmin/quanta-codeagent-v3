purpose: |
  v0.dev 권한 학습 흡수 — 모델이 필요 권한을 직접 제안(suggestedPermissions)하고 위험을
  자가표시(isMaybeDangerous). "패턴 허용" 1회 → 대기 중인 모든 다른 tool 요청을 재평가해
  rememberPatterns가 전부 allowed 집합에 포함되면 자동 통과(CASCADE). v0 원본 대비
  하드닝: rememberPatterns=0인 요청은 절대 자동통과 안 함, isMaybeDangerous 요청은
  allowDangerous 명시 없이는 cascade 제외.

  **L4 promotion (2026-05-23)** — Cursor `ClassifiedCommand` (cursor/agent-exec.js:99207-99213)
  흡수 + admissibility-gate 배선. 신규 surface:

  - `classifyCommand({toolName, actionKey})` → `{name, arguments[], subcommandTokens[],
    suggestedAllowlistEntry}` — leading-token sequence 형태 ("npm,install")로 패턴 제안.
    `sudo` 접두사 제거 + flag(`-x`, `--save-dev`) 토큰에서 종료 + 최소 2 / 최대 4 토큰
    상한. 결정적, 순수, 어휘 변동성 ML 의존 없음.
  - `LearningSource` enum (`user_accept` | `classifier`) — 추후 trajectory 소비자가
    grant 출처를 exhaustive switch 가능.
  - `AdmissibilityWaveAOptions.pendingPermissions` + `onPatternCascade` — gate가
    `runAlwaysConfirmBranch`/`resolveAskBranch`의 user-approved 경로에서 grantAndCascade를
    호출하고 결과(grantedPatterns, cascadedToolCallIds, learningSource,
    suggestedAllowlistEntry)를 호출자에 통지. dangerous 게이트 유지 (allowDangerous=false면
    cascade skip). pattern store 미설정 ⇒ byte-identical 레거시 경로.
  - 두 user-approved 경로(always-confirm tier + 모드정책 ask) 모두 cascadeOnApprove 통과 →
    동일 패턴이 두 번째 호출에서 `autoPassByPatterns`로 단락.

  **Self-propose recording seam (CLUSTER D #5, 2026-06-06)** — 모델-facing 자가제안의
  SAFE 기록 시드. `recordProposedPattern(store, {proposed, isMaybeDangerous}, {allowDangerous})`
  + `PatternGrantStore`의 baseline/proposed provenance 분리:

  - `PatternGrantStore.grant()`(user/policy 권위)는 BASELINE에 기록, 신규
    `recordProposed()`(모델 제안)는 allowed에만 기록·baseline 미오염.
  - NO-WIDEN / NO-SELF-GRANT 불변식: 제안 패턴이 baseline에 COVERED일 때만 기록,
    하나라도 미커버면 전체 batch REJECT(`would_widen`) — 모델이 새 권한을 자가부여 불가
    (coordination broker의 worker-can't-self-grant와 동일 불변식). All-or-nothing(부분기록
    laundering 차단). recorded 패턴은 baseline에 안 들어가므로 chain-widen 불가.
  - 하드닝 패리티: `no_store`(default-OFF) / `empty_patterns` / `dangerous_blocked`
    (allowDangerous 없이 위험제안 거부). 순수·no-throw.
