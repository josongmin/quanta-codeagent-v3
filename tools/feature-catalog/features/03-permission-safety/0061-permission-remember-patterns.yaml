deliberate_hold:
  reason: |
    SAFE 기록 seam(`recordProposedPattern`, no-widen)은 2026-06-06 배선 완료 —
    coverage-gated 자가제안 기록이 pure layer(`@/permission`)에서 동작.
    남은 hold: LLM-CALLABLE tool/control-op 표면 — 모델이 실제로
    `recordProposedPattern`을 호출할 tool 계약(manifest+dispatch)은 hot
    permission/dispatch 경로 수술이라 미배선. seam은 host/test/future-tool이
    즉시 호출 가능.
  promotion_path: |
    1) 모델-facing tool/control-op(예: `permission_propose_pattern`) 추가 —
       in-schema {proposed[], isMaybeDangerous} → `recordProposedPattern` 호출,
       결과(recorded|rejected+reason)를 tool result로 반환. manifest(BASE/GATED)
       + dispatch 등록 필요(hot path).
    2) store를 host 합성 루트에서 실제 construct (현재 permissionPatternStore는
       seam-only, production 미설정). user/policy allow-list → baseline grant.
    3) end-to-end test (모델 propose → recorded → 두 번째 호출 auto-pass /
       widen propose → rejected) 추가 후 L4 재승격.
notes: |
  user_approved_for_session(ADR-0029)이 actionKey 단위 기억의 씨앗 — rememberPatterns는 그 위에
  패턴-단위 cascade를 얹음. LearningSource enum까지 추가해 trajectory 소비자가
  "왜 자동허용됐는가"를 exhaustive switch로 분기 가능.

  deferred-wire: source has TODO acknowledging gap — 모델 surface가 미배선이라
  자가 제안 cascade 사이클이 닫히지 않음. L3로 honest-demote (2026-05-25 audit).

  Out-of-scope follow-ups: ML 분류기 v2(현재는 deterministic prefix-token sniffer;
  알려진 위험 플래그 over-fit 우려).
