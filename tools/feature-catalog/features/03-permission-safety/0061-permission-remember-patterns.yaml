id: permission-remember-patterns
title: rememberPatterns — 권한 패턴 학습 + cascade 자동해소
section: 3
subsystem: 권한 학습 (v0.dev 흡수, ADR-0061)
order: 61
maturity: L4
status: refined
ui_surfaces: [n-a]
