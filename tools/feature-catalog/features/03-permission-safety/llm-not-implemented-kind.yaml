notes: |
  대 3 권한 영역 (auth/permission boundary) — chatgpt-oauth 는 권한/인증 표면.
  Phase-2 (실제 model 호출 wiring) 가 도착하면 stub adapter throw 가 사라지고
  본 kind 는 다른 stub adapter (또는 dry-run mode) 의 generic fallback hook 으로
  재사용. costUsd NaN 실버그 정정 (`may-22-quanta-wins-hellgate-verification`)
  과 동일 회복 패턴: FATAL → fallback eligible → tombstone 1.
