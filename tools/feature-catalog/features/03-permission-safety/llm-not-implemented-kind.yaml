id: llm-not-implemented-kind
title: LLMErrorKind.not_implemented (chatgpt-oauth Phase-1 fallback-eligible)
section: 3
subsystem: LLM 에러 분류 + retry/fallback 정책
order: 79
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: static
owners: ["@songmin"]
labels: [surface:cli]
depends_on: [assert-never-exhaustiveness, byte-stable-string-comparator, errors-helper-fix, fallback-kinds-policy, llm-factory]
purpose: |
  ADR-0094 Phase-1 chatgpt-oauth stub adapter 가 호출 시 매번 throw 하는 deliberate
  stub state 를 위해 새 LLMErrorKind 추가: `not_implemented`. Retry 정책에서
  FATAL 로 분류 (재시도 0), fallback 정책에서 ELIGIBLE 로 분류 (다른 provider 로
  swap).

  3-point wiring:
    - `src/shared/errors.ts`  — `LLMErrorKind` 어휘에 `"not_implemented"` 추가
                               + 의미 (deliberate stub adapter) 주석.
    - `src/agent/retry.ts`    — `FATAL_KINDS` set 에 `"not_implemented"` 등록.
                               동일 throw 가 반복되므로 retry 무의미 → 즉시 surface.
    - `src/llm/fallback.ts`   — `FALLBACK_KINDS` set 에 `"not_implemented"` 등록.
                               stub adapter 라면 다음 provider 로 swap 가능
                               (사용자가 OPENAI_API_KEY 도 함께 갖춘 경우 자동 회복).

  유즈케이스: 사용자가 `/login` 으로 chatgpt-oauth 만 설정한 상태에서 Phase-1
  stub adapter 가 throw → retry 우회 (FATAL) → fallback chain 으로 OPENAI 로
  swap → 회복. tombstone "swap당 1개" 정책은 fallback chain 자체가 보장.

  Boundary: `not_implemented` 는 deliberate stub state 만 표시 — 실제 미구현
  endpoint (404) 와 다르다. 후자는 기존 `protocol`/`auth` kind 으로 흐른다.
