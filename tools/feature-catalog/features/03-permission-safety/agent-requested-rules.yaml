id: agent-requested-rules
title: agent-requested rules — description-only rule fetch-on-demand matcher (ADR-0509)
section: 3
subsystem: rules — agent-requested (description-only) rule selection
order: 213
maturity: L4
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, ide]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "absorbed:cursor"]
depends_on: [glob-rules-auto-inject]
config_refs:
  env: ["QUANTA_FETCH_RULES"]
purpose: |
  Cursor's "agent-requested" rules: a description-only rule (no globs, not
  always-apply) the model pulls in on demand by matching its task against the rule's
  description. quanta's glob-rule loader DROPPED such rules. This lands the ESSENTIAL
  matcher: a pure matchRulesByDescription(query, rules, limit) over RequestableRule
  {name,description,body} — deterministic token-overlap (lowercase, split non-alnum,
  drop short + stopwords, Set-dedup), score>0, sorted score desc then name, capped.
  NO tuned threshold (standard IR). FULLY WIRED: the glob-rules loader collects
  description-only rules (loadRequestableRules) that loadGlobRules drops, the
  `fetch_rules` tool ranks them over a FetchRulesPort, and the CLI lazily loads +
  injects the index behind QUANTA_FETCH_RULES (default-OFF). Fuzz-proven matcher
  against a brute-force oracle.
