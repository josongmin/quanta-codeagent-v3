  env: ["QUANTA_ATTRS"]
purpose: |
  TrustScope enum(always_allow | project | workspace | session | once_only | deny)을 위한
  registry + admissibility-gate 단일 wire-up. ask-branch는 onConfirm 직전에
  registry.hasGrant(projectKey, { tool, actionKey? }) 조회로 단락. once_only는 hasGrant 내부에서
  positive-and-consume(게이트는 if 1중첩 유지). deny-scoped grant는 ask-skip으로 취급하지 않음 —
  registry POSITIVE_SCOPES set이 deny 제외. AgentConfig.trustScope?: { registry, projectKey }
  미설정 시 byte-identical(레거시 onConfirm 경로 그대로). always-confirm tier는 의도적으로
  short-circuit 안 함(이 tier의 핵심이 batch-approval 우회).

  **L4 promotion (2026-05-23)** — persistent file-backed registry
  (`createPersistentTrustScopeRegistry`) wired into `@/permission`. SOTA reference:
  Claude Desktop `safeStorage.encryptString` allowlist cache w/ 2h TTL + scope cascade.
  We ship: (a) `~/.quanta/grants.json` global state file with the project's
  existing JsonStateFile engine (atomic rename + read-reconcile-MERGE for concurrent
  writers); (b) per-project overlay `.quanta/project-grants.json` consulted FIRST so
  a project can tighten user-global grants; (c) per-grant `ttlMs` honored at read
  time (stale records skip the cascade); (d) command-pattern surface
  (`leading-token sequence`, e.g. `"npm,install"`) absorbed from Cursor
  ClassifiedCommand; (e) cascade `exact-actionKey → command-pattern → tool-only`
  with most-specific wins + explicit `deny` short-circuit at every layer; (f)
  `hydrate()` reads both files at session start; (g) gate's `trustScopeGrants` now
  passes the same `extractShellCommand`-derived actionKey the reviewer uses, so a
  per-command persisted grant matches the live call shape.
