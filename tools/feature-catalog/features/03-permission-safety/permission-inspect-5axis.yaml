notes: |
  대 3 권한 inspector 의 second-pump — 기존 `inspector.ts`(store-based, ADR-0046)와
  orthogonal. 표면 wiring(`/permission explain` slash + Tauri dashboard)은 별도 트랙.
  보안: `MatchedHardDenyRule` 은 `name` + `description` 만 반환; raw RegExp 패턴은
  ABSOLUTELY 노출 안 함 (jailbreak-crafter enumeration 차단).
