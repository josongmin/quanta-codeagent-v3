id: proxy-header-rewrite
title: ticket-13 (§12.2) outbound header-rewrite — operator transform + forbidden-inject/forbidden-framing guards
section: 3
subsystem: Egress-proxy outbound header mutation — guarded operator transform riding the gated egress/MITM config
order: 484
maturity: L2
status: new
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: partial
config_refs:
  env: [QUANTA_NETWORK_PROXY, QUANTA_TLS_MITM]
owners: ["@songmin"]
labels: [surface:core, security, security-touched, security-sensitive, absorbed:claude-code, absorbed:cursor]
depends_on: [secret-aware-egress, tls-mitm-egress, network-egress-proxy]
surface_integration:
  cli: partial
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "applyHeaderRules is wired into the live proxy at BOTH callsites (loopback-proxy.ts:468 plaintext via config.secretEgress?.headerRules, :688 MITM via config.mitm?.headerRules), reachable from src/apps/cli/index.ts → @/agent/loop → agent/loop/entry.ts withEgressProxy. PARTIAL: no env knob populates a rule LIST yet, so only the default-OFF byte-identical arm is reachable in prod; rule-firing paths are exercised by the e2e driving the config directly."
    web: "purely an internal outbound-header transform in the proxy; no browser-visible affordance (a refused rule manifests only as the audit entry in the in-memory log, not surfaced to the web bridge)"
purpose: |
  egress-프록시가 buffered 요청을 OWN upstream 으로 재발신할 때, OUTBOUND 헤더맵에
  적용하는 PURE / NO-THROW / NO-I/O 순서있는 변환(`applyHeaderRules`). 오퍼레이터가
  `strip`/`set`/`append`/`rewrite` `HeaderRule` 리스트를 선언하면, plaintext-HTTP
  (`pipeBufferedHttp`, loopback-proxy.ts:468) 와 TLS-MITM (`mitmForwardUpstream`, :688)
  BOTH 경로에서 동일 코어로 적용. Claude-Code IDE cross-origin token-strip + Cursor
  value-redacted decision-log 흡수.

  ⚠️ REDACTION-WINS / DEFAULT-OFF (핵심): 변환은 secret-egress redaction PASS 뒤에
  실행(`applyOutboundHeaderRules` 가 `dropHeaderValues` 필터 AFTER) — 규칙이 제거된
  헤더를 절대 부활 못 시킴. `rules` 부재/빈배열 ⇒ SAME 객체 by-reference(byte-identical)
  + 빈 audit ⇒ 오늘 동작 byte-for-byte. 규칙은 이미-게이트된 `MitmConfig`/
  `SecretEgressConfig` 에 올라타며 NO new env knob.

  다층 방어계약(각각 redaction 과 독립):
  - NO-THROW NAME/VALUE 검증(DoS guard): EVERY op(strip 포함)이 node 자신의
    `validateHeaderName`, value-op 는 `validateHeaderValue`(CR/LF/NUL 거부)로 검증.
    node 검증기 재사용 ⇒ 다운스트림 `http.request` 가 거부할 것을 EXACTLY 거부(over/under
    -reject 없음) + 절대 throw 안 함. 위반 ⇒ `malformed` 거부, 맵 무변경, 값 미기록.
  - FORBIDDEN-INJECT GUARD: `set`/`append` 가 credential 헤더(`authorization`/
    `proxy-authorization`/`cookie`/`set-cookie`/`www-authenticate`/`proxy-authenticate`)
    를 FORGE 못 함 — 조용히 무시(+ audit `fired:false` `forbidden-inject`). 이미 있는
    credential 헤더의 `strip`/`rewrite` 는 정당한 하드닝이라 허용.
  - FORBIDDEN-FRAMING GUARD(request-smuggling + domain-fronting 방어): `set`/`append`
    가 framing/routing 헤더(`transfer-encoding`/`content-length`/`host`/`connection`/
    `proxy-connection`/`keep-alive`/`te`/`upgrade`)를 RE-INJECT 못 함 — 프록시 framing-fix
    AFTER 에 올라타면 CL.TE/TE.TE smuggling 또는 host forge → domain-fronting 가능하므로.
    `strip`/`rewrite` 는 inject op-policy 미러로 허용.
  - VALUE-FREE AUDIT: 각 entry 는 index/소문자 name/op/fired(+refusal reason) 만 —
    값은 절대 미기록(secret 일 수 있음). 프록시 in-memory 로그로 RETURN(여기서 emit 안 함).

  ✅ WIRED-BUT-KNOBLESS / built-not-wired honesty: `applyHeaderRules` 는 두 callsite 에
  LIVE 배선됨(CLI import-graph 도달). 그러나 어떤 env knob 도 rule LIST 를 POPULATE 하지
  않음 — `headerRules` 는 게이트된 config 의 optional 필드일 뿐 오퍼레이터 surface 미존재.
  ⇒ prod 에선 default-OFF byte-identical arm 만 도달, rule-firing 은 e2e 가 config 직접
  주입으로 검증. 그리고 `shouldStripOnRedirect`(cross-origin redirect token-strip 헬퍼)는
  export+unit-tested 이나 CALLER 없음(프록시가 아직 redirect 미추종); `secret-egress.ts`/
  `mitm.ts` 는 doc-comment 에서 future hook 으로만 참조 — deliberate_hold 로 기록.
evidence:
  code:
    - src/runtime/network-proxy/header-rules.ts
  adrs: [521]
  tests:
    unit:
      - tests/unit/header-rules-hellgate.test.ts
    integration:
      - tests/integration/header-rewrite-proxy-e2e.test.ts
    contract: []
knobs:
  - name: QUANTA_NETWORK_PROXY
    where: src/runner/knobs/knobs/network-proxy.ts
    purpose: egress 프록시(LoopbackEgressProxy) 마스터 게이트. 헤더-rewrite 변환은 이 프록시가 켜져 있을 때만 plaintext callsite(`pipeBufferedHttp`)에서 도달. 헤더-rewrite 전용 knob 은 없음(rule list 를 채우는 surface 미존재).
  - name: QUANTA_TLS_MITM
    purpose: TLS-MITM 경로(ADR-0491) 게이트. ON 일 때만 MITM callsite(`mitmForwardUpstream`)에서 동일 변환이 `config.mitm?.headerRules` 로 적용. 헤더-rewrite 자체는 별도 knob 없이 이 게이트된 config 에 올라탐.
deliberate_hold:
  reason: |
    두 가지 미배선 seam. (1) `applyHeaderRules` 는 두 프록시 callsite 에 LIVE 배선되어
    있으나 어떤 env knob 도 `headerRules` rule LIST 를 POPULATE 하지 않음 — config 필드는
    있지만 오퍼레이터-facing surface 가 없어 prod 에선 default-OFF(byte-identical) arm
    만 도달(rule-firing 은 e2e 가 config 직접 주입으로만 운동). (2) `shouldStripOnRedirect`
    (cross-origin redirect token-strip 헬퍼)는 export+unit-tested 이나 NON-TEST CALLER
    가 없음(프록시가 아직 자체 redirect 미추종) — built-not-wired.
  promotion_path: |
    (1) `QUANTA_NETWORK_PROXY_HEADER_RULES`(또는 runtime-config) JSON rule-list 파서를
    추가해 `SecretEgressConfig.headerRules`/`MitmConfig.headerRules` 에 plumb → cli:full
    승격. (2) 프록시에 redirect-following 을 추가하고 cross-origin hop 에서
    `shouldStripOnRedirect` 를 호출해 `CROSS_ORIGIN_STRIP_HEADERS` drop → uncalled 해소.
notes: |
  배선 정확좌표: `applyHeaderRules`(header-rules.ts:268) ← `applyOutboundHeaderRules`
  (loopback-proxy.ts:255, value-free audit 를 `hdrLog` 로 thread) ← `pipeBufferedHttp`
  (:468, `config.secretEgress?.headerRules`) + `mitmForwardUpstream`(:688,
  `config.mitm?.headerRules`). secret-egress `dropHeaderValues` 가 먼저 → redaction-wins.

  hellgate(unit): strip-remove / set-overwrite-or-create / append-multivalue(set 과 구별)
  / rewrite-only-if-present / ORDER(나중 규칙이 앞 규칙 undo) / malformed(value-less op)→
  silent-ignore / FORBIDDEN-INJECT(credential set/append 거부, strip/rewrite OK) /
  FORBIDDEN-FRAMING / case-insensitive / NO-RULES byte-identical(same-ref, zero audit) +
  rules-present 시 input 무변형 / audit value-free / shouldStripOnRedirect(cross-origin→true,
  same-origin default-port 정규화→false, unparseable→fail-closed true).
  e2e(real socket, hermetic offline): plaintext strip/set/append/rewrite 가 origin 도달 /
  FORBIDDEN-INJECT 가 `set authorization` 거부(origin 이 forged credential 미수신) +
  value-free audit / REDACTION-BEATS-rewrite(secret 헤더 부활 불가) / DEFAULT-OFF
  byte-identical / MITM(TLS) 경로에서 동일 strip/set 가 real HTTPS 로 origin 도달.

  설계/증명: ADR-0521(Proposed). 흡수: Claude-Code IDE cross-origin token-strip,
  Cursor `logging.decision_log_path`(value-redacted).
