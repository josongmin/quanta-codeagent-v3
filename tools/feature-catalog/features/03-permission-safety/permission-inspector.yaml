purpose: |
  Read-only programmatic surface — given an action, *어떤* permission layer가 *왜*
  허락/거부했는지 결정 trace 를 반환. `quanta permission inspect <action>` CLI /
  Tauri dashboard 의 backbone. 8-stage admissibility-gate(ADR-0026 SSOT) 결정을
  reverse-engineer 하지 않고 *기록된* 결정을 표시 — 평가 자체는 admissibility-gate
  가 단독, 본 모듈은 그 결과의 시각화. ADR-0029(reviewer 3-tier) post-denial,
  ADR-0030(mid-turn steering) UI 와 합쳐 사용자가 "왜 이게 막혔는가" 를 한 화면에
  본다. ADR-0047(HITL 4-tier)와 orthogonal — gate가 어디서 멈췄는지 layer 라벨로
  반환.
