    integration: []
    contract: []
knobs:
  - name: onManagedWiden
    where: ResolveInheritanceOpts (resolveProfileInheritance 3번째 인자)
    default: "clamp"
    purpose: |
      Managed ceiling을 derived가 넘을 때: "clamp"(기본, fail-safe하게 ceiling으로 좁힘)
      vs "throw"(strict org — ProfileInheritanceError kind=managed-widen).
  - name: builtins
    where: ResolveInheritanceOpts
    default: "NAMED_PROFILES"
    purpose: |
      registry에 없는 이름의 built-in fallback. 둘 다 없으면 fail-closed THROW.
  - name: QUANTA_PERMISSION_PROFILES_JSON
    where: composition root (apps/agent/index.ts buildProfileDefinitionRegistry)
    default: "(unset)"
    purpose: |
      user-authored ProfileDefinition 맵(JSON object <name>→def, 각 pillar partial +
      extends/tag). 설정 시 선택 profile이 inheritance 그래프로 해소됨. unset/빈문자열 ⇒
      empty registry ⇒ default-OFF(legacy A2 byte-identical). fail-closed: bad JSON /
      non-object / built-in 이름 충돌 / nested unknown-key 전부 startup THROW.
notes: |
  슬라이스 fence: resolver leaf — permission-profile.ts(순수 타입) + named-profiles.ts +
  profile-list-select.ts(NETWORK_RANK const export)만 의존. store/gate/IO 무의존.
  partial parser는 profile-list-select.ts에 추가(type-only back-ref로 cycle 없음).
  wire는 apps/agent/index.ts composition root에만 IO(env READ) — resolver 순수 유지.
  entries intersection은 special-path resolver(IO) 미주입 — resolver-free 보수 비교
  (special kind 동일 OR literal absolute 조상; mixed special/path는 drop = 좁히는 방향이라 안전).
  2026-06-02 wire close-out: deliberate_hold CLOSED — inheritance가 session start에 LIVE 실행.
