id: permission-profile-inheritance
title: Permission-profile inheritance — extends + cycle detection + monotone-narrowing merge + Managed ceiling
section: 3
subsystem: 권한 프로파일 합성 — extends 그래프 해소 (ADR-0438)
order: 438
maturity: L3
status: refined
ui_surfaces: [cli]
monitoring: n-a
telemetry_keys: []
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: [absorbed:codex, surface:cli, security-touched]
depends_on: [named-permission-profiles, permission-4-pillar]
config_refs:
  env: [QUANTA_PERMISSION_PROFILES_JSON]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 4/5 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure internal env-configured profile-inheritance resolver (QUANTA_PERMISSION_PROFILES_JSON, startup-only); no UI affordance on any surface"
purpose: |
  ADR-0438 — 3개 고정 named profile(restricted/default/trusted)을 합성 가능한
  extends 그래프로 확장. 새 leaf `profile-inheritance.ts`의 순수·전역(total)·무 I/O
  resolver `resolveProfileInheritance(name, registry, opts?)`가 ProfileDefinition
  (모든 pillar partial + extends + tag)을 base→derived로 **monotone-narrowing**
  merge한다: derived는 base를 좁히기만(narrow) 가능, 넓히기(widen)는 불가
  ("trusted인데 network만 deny-all"은 OK, "restricted인데 network allow-all"은 무시).

  Per-axis merge (13축): network.mode=MRW(NETWORK_RANK 재사용)/allowHosts=intersection/
  perRequestApproval=OR · approval.mode=MRW(auto<once<session<always)/promptUser=OR ·
  fileSystem.type=MRW(restricted<managed)/entries=intersection(base가 cover한 path만,
  access 좁히기 포함) · sandbox: osSandbox none<active MRW / readOnly·networkIsolated OR /
  workspaceWrite AND · control.managedBy=MRW(user<team<admin)/auditRequired=OR.
  불변식: resolve(child) ⊆ resolve(base) — 13축 전부 (HELL-PI-11 봉인).

  Fail-closed: cycle(A→B→A)/self-extend(A extends A)/unknown-base(extends "ghost") 전부
  typed ProfileInheritanceError THROW (kind: cycle|self-extend|unknown-base|managed-widen),
  silent permissive fallback 없음. cache로 diamond/deep-chain O(N).

  Managed ceiling (Codex TaggedPermissionProfile::Managed/::External 흡수): tag=managed
  base는 derived가 못 넘는 ceiling. fold 비참여(ceiling 전용)라 widen이 감지 가능 —
  onManagedWiden:"clamp"(기본, fail-safe 좁힘) / "throw"(strict org 거부).

  Default-OFF / byte-identical: built-in 3개는 동일 frozen NAMED_PROFILES 구조체 반환
  (참조 동일성까지, HELL-PI-14). resolveProfileByName 불변 — 별 진입점·composable layer.
  profile-layer-merge.ts(소스-precedence 슬롯 합치기)와 직교: 공유 mutable 없음,
  NETWORK_RANK ordering만 재사용, fold는 독립 구현.

  Config/knob (2026-06-02 LIVE WIRE): composition root(apps/agent/index.ts)가
  QUANTA_PERMISSION_PROFILES_JSON(JSON object <name>→ProfileDefinition)을 읽어
  parseUserProfileDefinition/buildDefinition(partial 파서, fail-closed: unknown-key/
  bad-enum/non-string-extends 전부 THROW)로 검증→ProfileDefinitionRegistry 조립
  (built-in 이름 충돌 reject). 선택된 profile(--permission-profile flag > QUANTA_PERMISSION_PROFILE)이
  user-def 존재 시 resolveProfileInheritance(name, registry)로 해소 → merged struct가
  TwoLayerManager.setPermissionProfileFromRegistry(새 sugar)로 per-thread slot에 LIVE 등록
  + 동일 profile에서 PermissionContext.mode 파생. user-def 없으면 legacy A2 by-name 경로
  유지 → built-in 3개 byte-identical(참조 동일성). env READ만 IO, resolver는 순수 유지.
  envelope permission_profile은 의도적으로 미수정(보안 민감 wire 마이그레이션 회피;
  startup-only env가 더 깔끔). disk(QUANTA_PROFILES_DIR)는 selectPermissionProfile의
  COMPLETE struct 전용 — definition은 distinct partial shape라 별도 env knob.
  configurable=integrated, maturity L2→L3: end-to-end 소비됨(default-OFF until env set).
