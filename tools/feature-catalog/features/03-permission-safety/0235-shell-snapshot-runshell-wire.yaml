configurable: integrated
owners: ["@songmin"]
labels: ["surface:cli", "absorbed:codex", "security-touched", "default-off"]
depends_on: [shell-snapshot]
purpose: |
  Wave 3 wire — ADR-0204 의 ShellSnapshotPort (capture/restore/prune
  leaf 슬라이스) 를 `runShell` 의 옵션 fold 로 연결. host 가
  `runShellWithSnapshot({port, threadId})` 를 명시 호출하면 매 turn 진입
  시 capture → `bash -lc "source <snapshot.sh>; <cmd>"` 패턴으로 실행;
  미주입 호출은 argv `["bash","-lc",cmd]` byte-identical. fork/resume 후
  alias/function 손실 asymmetry (quanta vs Codex) 폐쇄. Default-OFF 3중
  레이어: port 미구축 / wire 호출자 미주입 / threadId 미지정.
