notes: |
  ADR-0204 leaf entry 는 closed-port + adapters; 본 entry 는 runShell
  옵션 fold 만 추가 (assembly layer가 wire). file-store 모드 0600 /
  디렉토리 0700 / id sanitisation 등 보안 디테일은 leaf 슬라이스가 소유 —
  본 wire 는 시그니처 + null-safe fallback 만 담당.
