id: shell-snapshot-runshell-wire
title: Shell-snapshot runShell wire — opt-in source-fold (ADR-0235)
section: 3
subsystem: Per-turn shell environment activation wire
order: 235
maturity: L3
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:cli", "absorbed:codex", "security-touched", "default-off"]
depends_on: [shell-snapshot]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 3/3 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure internal runShell option fold (env source-snapshot wire); no user-visible affordance on any surface"
purpose: |
  Wave 3 wire — ADR-0204 의 ShellSnapshotPort (capture/restore/prune
  leaf 슬라이스) 를 `runShell` 의 옵션 fold 로 연결. host 가
  `runShellWithSnapshot({port, threadId})` 를 명시 호출하면 매 turn 진입
  시 capture → `bash -lc "source <snapshot.sh>; <cmd>"` 패턴으로 실행;
  미주입 호출은 argv `["bash","-lc",cmd]` byte-identical. fork/resume 후
  alias/function 손실 asymmetry (quanta vs Codex) 폐쇄. Default-OFF 3중
  레이어: port 미구축 / wire 호출자 미주입 / threadId 미지정.
evidence:
  code:
    - src/runtime/shell-snapshot/index.ts
    - src/runtime/shell-snapshot/port.ts
    - src/runtime/shell.ts
  adrs:
    - docs/decisions/0235-shell-snapshot-runshell-wire.md
    - docs/decisions/0204-shell-snapshot.md
  tests:
    unit:
      - tests/unit/runtime/shell-snapshot-hellgate.test.ts
    integration: []
    contract: []
knobs: []
deliberate_hold:
  reason: |
    Seam-only (DOF-30 verified @c2f0dd1c2): `runShellWithSnapshot` has ZERO
    production call sites — `src/runner/assemble/config.ts:153` declares the
    per-turn shell-snapshot config block + the CLI `--shell-snapshot` flag, but
    no bash/exec dispatch path threads a `ShellSnapshotPort` into a real
    `runShellWithSnapshot(...)` invocation. Absent port ⇒ the legacy direct
    spawner runs ⇒ byte-identical default-OFF. Unique primitive preserved: the
    security invariant that a snapshot is captured BEFORE (and restored AFTER)
    an operator-approved shell command runs, so a mutating command is bounded by
    a restorable filesystem checkpoint — no other slice owns this shell-scoped
    snapshot/restore contract.
  promotion_path: |
    Promotion owner = the bash/exec tool dispatch (src/tool + the runner
    `assemble/config.ts` shell-snapshot block): inject a Bun-spawner-backed
    `ShellSnapshotPort` under the `--shell-snapshot` gate and route the
    operator-approved command through `runShellWithSnapshot(...)` instead of the
    direct spawner. Security-risk row ⇒ opt-in explicit, first-class, never a
    silent default flip.
notes: |
  ADR-0204 leaf entry 는 closed-port + adapters; 본 entry 는 runShell
  옵션 fold 만 추가 (assembly layer가 wire). file-store 모드 0600 /
  디렉토리 0700 / id sanitisation 등 보안 디테일은 leaf 슬라이스가 소유 —
  본 wire 는 시그니처 + null-safe fallback 만 담당.
