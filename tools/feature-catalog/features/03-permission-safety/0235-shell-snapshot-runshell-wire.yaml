id: shell-snapshot-runshell-wire
title: Shell-snapshot runShell wire — opt-in source-fold (ADR-0235)
section: 3
subsystem: Per-turn shell environment activation wire
order: 235
maturity: L3
status: new
ui_surfaces: [n-a]
