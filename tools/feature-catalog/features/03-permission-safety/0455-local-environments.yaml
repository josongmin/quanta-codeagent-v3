id: local-environments
title: local-environment selection — DECLARED per-project dev env composed over the allowlist
section: 3
subsystem: 권한·안전 — 선언적 로컬 환경 선택 (Codex .codex/environments 흡수, ADR-0455)
order: 455
maturity: L3
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: static
owners: ["@songmin"]
labels: [surface:cli]
depends_on: [network-egress-proxy, localsandbox]
purpose: |
  프로젝트가 `.quanta/environment.toml` (또는 Codex-compat
  `.codex/environments/environment.toml`)에 named dev environment를 DECLARE하면,
  에이전트가 하나를 SELECT하고 spawn된 shell 도구(bash)가 그 env의 vars / PATH-prepend를
  scrubbed base env 위에 합성받는다. 오늘까지 quanta는 ambient shell env만 상속했고
  (scrubEnv + DEFAULT_ENV_ALLOWLIST), batch-eval의 setupCmd는 eval 전용이라 live-agent
  환경 전환은 부재였다.

  (1) parseLocalEnvConfig(body, toml) — pure/total/fail-closed 파서. TOML parse는
  DI 포트(Bun.TOML.parse). 파서 throw는 catch되어 toml_syntax로 매핑; 모든 malformed
  shape는 CLOSED reason(no_environments/bad_env_table/bad_var_name/bad_var_value/
  bad_path_entry/default_unknown/bad_default). silent default/partial config 절대 없음.
  (2) applyLocalEnv(base, selection, allowlist) — 선언 env를 scrubbed base 위에 OVERLAY,
  단 ALLOWLIST가 여전히 governs: allowlist에 없는 선언 var는 DROP(비-allowlist 이름
  smuggle 불가), PATH-prepend는 살아남은 PATH 앞에 declaration order로 prepend. base
  미변경, no-op selection ⇒ SAME reference(byte-identical default-OFF).
  (3) selectEnvironment(config, name?) — 명시 name 선택(미존재 ⇒ undefined, silent
  default fallback 없음) / name 없으면 declared default / 둘 다 없으면 undefined. 환경
  SWITCH는 다른 declared name 재선택.
  (4) loadLocalEnvConfig(cwd, toml) — CWD→repo-root walk(loadRepoRules와 동일 .git/root/
  depth 경계), 선언 config 파일의 PRESENCE만 감지 — venv 디렉토리 sniff 같은 HEURISTIC
  탐지 전무.

  "activate"는 선언적 env mutation(pathPrepend [".venv/bin"] + VIRTUAL_ENV)으로만 표현,
  arbitrary exec hook 아님(T4 hook 트랙 소관). config 없음 ⇒ ambient env byte-identical.
evidence:
  code:
    - src/runtime/local-env/types.ts
    - src/runtime/local-env/parse.ts
    - src/runtime/local-env/apply.ts
    - src/runtime/local-env/load.ts
    - src/runtime/local-env/index.ts
    - src/runtime/shell.ts
    - src/runtime/types.ts
    - src/tool/bash/index.ts
    - src/tool/types.ts
    - src/agent/types.ts
    - src/agent/dispatch.ts
  adrs: [455]
  tests:
    unit:
      - tests/unit/local-environments-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: AgentConfig.localEnv
    default: 'undefined'
    purpose: 'LocalEnvSelection | undefined — 선언 env의 { vars, pathPrepend } 선택 결과. absent ⇒ applyLocalEnv가 same base reference 반환(default-OFF byte-identical). dispatch seam이 ToolContext.localEnv로 surface → bash가 ShellOptions.localEnv로 forward.'
  - name: '.quanta/environment.toml'
    default: '(absent)'
    purpose: '선언 config 파일. absent ⇒ loadLocalEnvConfig undefined ⇒ ambient env 그대로. Codex-compat fallback: .codex/environments/environment.toml.'
deliberate_hold:
  reason: |
    composition-root binding (loadLocalEnvConfig → AgentConfig.localEnv) is a
    small follow-up: the CLI / runAgent is the place that reads the on-disk
    config and sets the per-session selection. The parser / apply / select /
    load core PLUS the full shell→tool→dispatch wire are landed and proven by
    the 37-case hellgate; only the operator-facing on-disk read remains.
notes: |
  - 보안: 선언 var는 allowlist를 BYPASS 안 함 — 비-allowlist 이름 DROP. PATH-prepend는
    parse-time 검증(단일 fragment, no ":"/"="/NUL → multi-element/assignment 주입 불가).
  - NO HEURISTICS: filesystem sniff 전무, 모든 값은 parsed config에서. config 파일 PRESENCE만 감지.
  - default-OFF: config 없음 / undefined selection / empty selection ⇒ same base env reference.
  - runShell이 단일 적용점(applyLocalEnv를 scrubEnv 후, withProxyEnv 전에) — 미래 shell-class
    도구가 자동 상속. `@/runtime`은 `@/tool`/`@/agent` import 안 함(구조적 미러 LocalEnvSelection).
  - 37 hellgate cases / 0 fail (parser fail-closed 13 / select 5 / apply allowlist+byte-identical 8 /
    loader declared-only 4 / runShell integration 4 + happy 3).
