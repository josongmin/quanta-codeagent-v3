notes: |
  Two-layer composition with ADR-0099 (prompt) and ADR-0091 (`.git/{hooks,config}`
  write deny). The push mass-delete trio absorbs Claude Desktop's
  `push_refused_mass_delete` semantics without needing a memory sync channel —
  static argv matchers at the dispatch seam suffice.
