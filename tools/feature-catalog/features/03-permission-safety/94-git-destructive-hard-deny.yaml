    contract: []
knobs: []
deliberate_hold: null
notes: |
  Two-layer composition with ADR-0099 (prompt) and ADR-0091 (`.git/{hooks,config}`
  write deny). Push mass-delete coverage absorbs Claude Desktop's
  `push_refused_mass_delete` semantics without a memory sync channel — static
  argv matchers at the dispatch seam suffice.
