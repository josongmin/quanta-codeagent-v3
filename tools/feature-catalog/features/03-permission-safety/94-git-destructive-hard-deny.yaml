id: git-destructive-hard-deny
title: Destructive git HARD_DENY rules (workflow + push mass-delete)
section: 3
subsystem: Runtime backstop for git posture (ADR-0100/0101)
order: 94
maturity: L4
status: stable
purpose: |
  HARD_DENY_RULES extension adding workflow-destructive git patterns that
  prompt-level posture (ADR-0099) cannot guarantee. Covers reset --hard,
  push --force / --force-with-lease / -f, mutating checkout discard
  (`checkout -- <path>` / `checkout .` / `checkout <ref> -- <path>`), plus
  push mass-delete variants (`push --mirror`, `push --force --delete`,
  multi-refspec colon-delete `:a :b :c …`). Static argv pattern matchers run
  before tool dispatch; deny is fail-closed regardless of HITL tier.
