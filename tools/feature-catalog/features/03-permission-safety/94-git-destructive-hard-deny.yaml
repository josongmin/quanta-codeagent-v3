id: git-destructive-hard-deny
title: Destructive git HARD_DENY rules (workflow + push mass-delete)
section: 3
subsystem: Runtime backstop for git posture (ADR-0100/0101)
order: 94
maturity: L4
status: stable
ui_surfaces: [cli]
monitoring: n-a
modes: [n-a]
configurable: static
owners: ["@songmin", "team-safety"]
labels: [absorbed:codex, surface:cli, security-touched]
depends_on: [permission-policy-engine, permission-store-json, harddeny-readonly-short-circuit, per-host-agent-mode, per-thread-permissions]
purpose: |
  HARD_DENY_RULES extension covering workflow-destructive git argv shapes
  that prompt-level posture (ADR-0099) cannot guarantee — forced-history
  rewrites, mutating discard variants, and push mass-delete shapes. Static
  argv pattern matchers run before tool dispatch; deny is fail-closed
  regardless of HITL tier. Verbatim patterns live in `policy-rules.ts` and
  are surfaced description-only past the slice (rule-name + human description,
  never the regex source).
