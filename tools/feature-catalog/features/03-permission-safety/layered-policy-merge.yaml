notes: |
  Slice fence: `policy-layers/index.ts` is a PURE, domain-agnostic engine
  (depends on nothing, not even `@/shared`). `profile-layer-merge.ts` supplies
  the permission-domain safety polarity + the DEFAULT baseline, keeping the
  engine a leaf. The composition-root wire reuses the EXISTING single permission
  context (it does NOT publish a second profile manager): the network axis stays
  enforced by the A1 dispatch-guard and the file-system axis is not
  dispatch-time enforceable, so the approval→context-mode derive is the only
  non-duplicating wire.

  `fileSystem` is DELIBERATELY excluded from the most-restrictive safety spec
  (an allow-list table has no scalar safety ordering) ⇒ it falls back to
  source-precedence; encoding a "fewer entries = safer" rule would be an
  arbitrary heuristic.
