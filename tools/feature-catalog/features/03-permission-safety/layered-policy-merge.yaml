purpose: |
  Pure layered struct-merge engine + the permission-domain wiring that consumes
  it. Absorbs Codex `ConfigLayer / ConfigLayerSource / MergeStrategy /
  OverriddenMetadata` + Cursor `SandboxPolicyMergeSources { per_user, per_repo,
  team_admin }`: a `LayerSource` precedence (default < per-user < per-repo <
  team-admin) folded into ONE merged struct with per-field
  `OverriddenMetadata` (winner + every superseded source, count + identity).

  Two strategies: `source-precedence` (the most-authoritative present source
  wins each field — the PRE-EXISTING precedence) and `most-restrictive` (the
  SAFER value wins each field regardless of authority, per an explicitly-declared
  per-field safety polarity — NO global "false is safer" heuristic).

  WIRING. The `policy-merge` knob (`QUANTA_POLICY_MERGE_STRATEGY`) selects the
  strategy and folds it onto `AgentConfig.policyMergeStrategy`. At the
  composition root (`buildBaseFromArgs`), when ≥1 layered profile env var
  (`QUANTA_PERMISSION_PROFILE_{PER_USER,PER_REPO,TEAM_ADMIN}`) is set, the named
  profiles are merged via `mergeProfileLayers` and the loop's LIVE
  `PermissionContext.mode` is derived from the merged profile's approval pillar
  (extending the GAP2 single-profile derive, commit 10b0928f). The merged
  profile is also the struct a `TwoLayerManager` resolves access against, so the
  strategy deterministically changes a real permission decision.

  Default-OFF / byte-identical: absent knob ⇒ composition root treats the
  strategy as `source-precedence` (the pre-existing precedence); absent layered
  vars ⇒ the legacy single-profile GAP2 path is unchanged. Fail-closed: a typo'd
  layered profile name THROWS at startup (no permissive fallback).
