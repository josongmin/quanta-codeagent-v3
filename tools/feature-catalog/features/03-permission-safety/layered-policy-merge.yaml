section: 3
subsystem: permission profile merge — source layers + override metadata
order: 295
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch]
configurable: integrated
telemetry_keys: []
config_refs:
  env:
    - QUANTA_POLICY_MERGE_STRATEGY
    - QUANTA_PERMISSION_PROFILE_PER_USER
    - QUANTA_PERMISSION_PROFILE_PER_REPO
