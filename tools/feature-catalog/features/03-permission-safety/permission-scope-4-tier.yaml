labels: [absorbed:codex, surface:cli]
purpose: |
  **Codex `Scope.{user, project, managed, open}` 4-tier RBAC 흡수.** Skill scope
  ([[0134-skill-scope-tiering]])의 7-tier보다 단순 — permission은 admin enforce
  channel + project repo-level만 있으면 충분 (admin/team 통합 = managed).

  Precedence (높을수록 강함):
    1. **managed** — admin/team enforced. user/project override 불가.
    2. **project** — 현 repo/project 한정.
    3. **user** — 사용자 개인 권한 (default).
    4. **open** — 공개 (anyone — drift surface — opt-in 필요).

  `strongerScope(a, b)` helper로 두 scope 충돌 시 강한 쪽 선택.
  `PERMISSION_SCOPE_PRECEDENCE_DESC` 배열은 strongest→weakest 순서.
