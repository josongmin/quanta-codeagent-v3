id: aug02-rfc03-skill-proposal-cas-promote
title: RFC03-2/3 — immutable skill-proposal compiler + approval-bound CAS promote
section: 3
subsystem: Skill pipeline — proposal compiler + gated promote (aug-02 RFC03-2/3)
order: 558
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: partial
modes: [interactive, headless]
configurable: static
owners: ["@songmin"]
labels: ["rfc:aug02-03", "surface:cli", "safety"]
purpose: |
  RFC-03-2/3 self-improvement skill pipeline: a proposed skill is COMPILED into
  an immutable proposal artifact (content-addressed), and promotion into the
  live skill store is APPROVAL-BOUND — the CAS promote only runs after an
  approval-state-machine decision, so a self-authored skill cannot silently
  become executable. Additive on the approval state machine; no promote path
  exists without the gate.
evidence:
  code:
    - src/skill/proposal/compiler.ts
    - src/skill/proposal/port.ts
    - src/agent/approval-state-machine/store.ts
    - src/skill/index.ts
  adrs: ["docs/plans/aug-02-absorption/rfc-03-self-improve-onboarding.md"]
  tests:
    unit:
      - tests/unit/skill-proposal-hellgate.test.ts
