notes: |
  Codex의 repo-local-rule-ingestion-audit 흡수 + tree scoping은 quanta
  고유 확장 (Codex는 단일 레이어). 3-tier rule layering (AGENTS.md →
  glob rules → .quanta/.cursor rules)의 가장 안쪽 contract 레이어 역할.
  `loadRepoRules(cwd)`는 첫 non-empty 파일 단위로 동작하며 dual-truth
  머지는 의식적으로 회피 (deeper-wins via render order만). Symlink/통신
  cycle 방어로 lstat + resolved-path set.
