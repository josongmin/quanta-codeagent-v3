id: repo-rules-tree
title: AGENTS.md / repo-rules tree — deeper-wins layered rule ingestion (ADR-0098)
section: 3
subsystem: Repo-local 운영 contract injection (Codex repo-local-rule-ingestion 미러 + tree scoping)
order: 98
maturity: L4
status: stable
owners: ["@songmin"]
labels: [absorbed:codex, surface:cli]
purpose: |
  Repo가 ship하는 운영 contract (canonical 커맨드 경로, fail-closed posture,
  patch discipline, "no heuristics" 등)를 top-level 마크다운(`AGENTS.md`,
  `CLAUDE.md`, `.codex/CODEX-RULES.md`)에서 자동 흡수하여 per-turn system
  reminder에 주입. ADR-0098 확장: CWD → repo-root까지 walk하면서 디렉토리
  레벨마다 AGENTS.md/CLAUDE.md/.codex 1개를 모으고, root → cwd 순서로
  렌더링하여 LLM positional bias로 "deeper wins" (monorepo에서 패키지별
  AGENTS.md가 루트 contract 위에 layer). Stop 조건: `.git` 디렉토리(포함 후
  중단) / FS 루트 / MAX_DEPTH 16홉. 단일 레이어면 `### From <path>` 헤더
  없이 raw body (byte-identical backward compat); 다중 레이어는 헤더로
  attribution + 감사 가능. 같은 dir 우선순위: AGENTS.md > CLAUDE.md >
  .codex/CODEX-RULES.md (Codex SSOT first; first non-empty wins per dir).
  Opt-in: `runAgent`는 `config.repoRules`가 attached됐을 때만 소비 —
  bench 하니스 등은 skip해서 워크스페이스 룰 미흡수 (byte-identical).
