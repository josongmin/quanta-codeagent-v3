purpose: |
  Linux OS-level sandbox via `bwrap` (bubblewrap) shell-out. Phase 1 stub
  (ADR-0136) replaced with real Linux backend matching the macOS Seatbelt
  posture. `compileBubblewrapArgs` translates SandboxPolicy 4-arm enum to
  argv (`--ro-bind` / `--bind` / `--unshare-net` / `--die-with-parent`).
  When `bwrap` is missing, degrades to passthrough with typed warning
  ("install bubblewrap"). Backend reported as "bubblewrap" (legacy
  "landlock+seccomp" name reserved for Phase 3 native FFI follow-up).
