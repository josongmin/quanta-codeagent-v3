purpose: |
  Hexagonal `src/security/pii-redaction/` slice covering the OTHER half
  of agent-content safety — human identifiers (email, phone, SSN, credit
  card, IP, IBAN, passport, driver's license). Closed `PiiScanner` port +
  pattern-scanner (10 regex kinds + composite) + Luhn-validator (credit
  card mod-10 checksum so 16-digit non-card numbers don't false-positive)
  + composite-scanner (dedup across detectors). Sibling shape to
  ADR-0164 secret-detection. Closes transcript / jsonl / OTel-attribute
  / prompt-logger leak paths that ADR-0078 inline redaction doesn't see.
  No modern agent ships a typed default-OFF PII scanner.
