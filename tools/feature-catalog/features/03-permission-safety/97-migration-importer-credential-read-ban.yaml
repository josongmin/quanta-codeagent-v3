id: migration-importer-credential-read-ban
title: External-agent importer — N10 credential-read ban (auth.json never opened)
section: 3
subsystem: External-agent migration — Codex N10 negative invariant enforcement
order: 97
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [interactive]
configurable: static
owners: ["@songmin"]
labels: [absorbed:codex, surface:cli, held-promotion]
depends_on: [external-agent-import, assert-never-exhaustiveness, byte-stable-string-comparator, claude-code-session-translator, errors-helper-fix]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 3/3 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "importer is a CLI-only flow; protocol.ts SessionCommand has no import verb (B3), no web component triggers or renders migration, does not reach the browser"
purpose: |
  Concrete enforcement point for ADR-0044 N10 (`claude-code-import` MUST NOT
  auto-read other agents' auth tokens). The detector treats `.claude/auth.json`
  as a marker for PRESENCE detection only — its content is never opened or
  parsed. The importer's 4-stage pipeline (detect → provider stage → session
  completion → import-finished) walks `projects/**/*.jsonl` transcripts +
  `skills/` only; no codepath reads or copies the auth bundle. The closed
  `ExternalAgentProvider` union refuses `provider:"unknown"` at runtime
  (`UnknownProviderRejectedError`) to make a silent-fallback bug impossible —
  detection must produce a concrete provider before the importer touches disk.
evidence:
  code:
    - src/migration/detector.ts
    - src/migration/importer.ts
    - src/migration/translators/claude-code.ts
  adrs: [44, 38]
  tests:
    unit:
      - tests/unit/migration-detector.test.ts
      - tests/unit/migration-stages.test.ts
    integration:
      - tests/integration/migration-claude-code-translator.test.ts
    contract: []
knobs: []
deliberate_hold:
  reason: 'Credential migration is permanently out of scope — a separate ADR (with explicit user-consent UX) would be required to reverse N10.'
  promotion_path: 'No promotion path by design. Reversing the invariant requires superseding ADR-0044 N10 with a new ADR + dedicated security review.'
notes: |
  Negative invariant: file-presence detection is permitted (`.claude/auth.json`
  in `markers[]` is checked via `fs.access`-style probes, not read), but the
  byte contents of the auth bundle never enter the importer. Translators only
  parse jsonl transcripts under `projects/` (claude_code) or `sessions/` (other
  providers).
