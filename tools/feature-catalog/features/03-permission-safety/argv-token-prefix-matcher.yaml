notes: |
  argv token-prefix 는 `prefix-rule-dsl` 의 byte-prefix matcher 와 공존하는
  STRICTER 변형 — rule 이 `argv: string[]` 를 들고 있을 때만 token-vector 로,
  아니면 matcher 가 byte-prefix 로 fallback. byte-identity hellgate 은 argv 미사용
  rule 이 legacy byte-prefix 결과와 byte-for-byte 동일함을 봉인.
