purpose: |
  §10.2 — Codex `prefix_rule(pattern=["git","push"])` 흡수: byte-prefix 보다
  엄격한 argv TOKEN-VECTOR 매칭의 3개 PURE/NO-THROW 결정점.
  (1) `tokenizeArgv` — command STRING 을 argv 토큰으로 분할 (POSIX-ish 서브셋:
  공백 분리, single/double-quote 그룹, double-quote 안/밖 backslash escape,
  인접 quoted+unquoted fuse). full 셸 파서 아님 — expansion/operator 없음;
  비-string 입력 → `[]`, unterminated quote 는 end-of-string 까지 best-effort
  로 소비(throw 안 함) — security boundary 가 아니라 MATCHING aid 라서
  byte-prefix matcher 가 보수적 fallback 으로 남음.
  (2) `parseArgvArrayLiteral` — rule-side `["git","push"]` / `[git, push]` 를
  `string[]` 로; bracket 비-구획 / unterminated / 빈 배열 / trailing-comma 의
  빈 토큰 → `null`. caller(`parseRules`)가 `null` 을 `RuleParseError` 로 올려
  malformed 배열이 byte-prefix rule 로 silent downgrade 되지 않는 불변식 유지.
  (3) `matchArgvRule` — pattern 이 commandArgv 의 token PREFIX 인지: 0..n-2 토큰
  리터럴 일치, 마지막 토큰만 `*` glob-suffix(Codex parity) 허용. pattern 이
  command 보다 길면 즉시 false; 빈 pattern 은 never-match(방어).
  결정성: clock/I·O/전역상태 없음 — 입력의 total function.
