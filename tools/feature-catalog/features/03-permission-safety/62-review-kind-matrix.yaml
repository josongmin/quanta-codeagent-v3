notes: |
  PLAN non-blocking 의미는 plan posture(ADR-0063)와 직교 — plan-exit는 plan posture 종료
  방식, ReviewKind.plan은 plan 자체에 대한 리뷰 신호. allow/ask/deny 3-state
  PermissionDecision은 무변경 — 본 매트릭스는 그 위에 얹는 add-on seam.

  L4 promotion에서 `denyFromConfirm` 경로를 재사용함으로써 reject_and_tell이 deny_and_steer와
  의미적으로 동일한 wire-shape(steerInjection + preview='deny_steer')를 가져감 — 단일
  consumer가 두 path 모두 처리.
