notes: |
  Default-OFF guarantee: `AgentConfig.decisionEmitter` 미지정 시
  `emitGateDecision`이 event object 만들기 전에 short-circuit (zero alloc,
  zero stream write). 16-case hellgate 51 expects — rule 4분기 / hook 3분기
  / permission 3분기 + 6 invariants (default-OFF byte-identity, throwing
  emitter isolation, no-double-emit, metadata-sanitise, turn=0 default,
  turn from `config.run.turn`).

  Slice fence: `decision-emitter.ts`는 `@/stream` leaf (local `AgentEvent`
  + `StreamPort` types만 import). `admissibility-gate.ts`는 `@/stream`에
  `safeEmitDecision`만으로 reach (adapter class 없음, I/O 없음). `AdmissibilityGateConfig`
  는 정확히 1개 `Pick` 필드 (`decisionEmitter`)만 추가 — `dispatch.ts`
  등 기존 caller는 structural subtyping으로 unchanged 컴파일.

  Hook gate는 admit + deny 양쪽 emit (어떤 call이 통과했는지도 trace
  목적상 중요). cap/jail/budget Phase 3은 deny-only (allow가 hot path라
  emit-on-allow는 trace DoS).
