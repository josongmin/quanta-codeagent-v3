purpose: |
  ADR-0239 Phase 1은 `decision` AgentEvent variant + debug-tracer consumer만
  깔았고 *production code는 아직 emit하지 않는 상태*였음. 이 슬라이스는
  사이클을 닫음 — `runAdmissibilityGate` 안의 3개 게이트 결정 지점에서 실제
  emit해서 `QUANTA_DEBUG=1 quanta`가 비로소 내용 있는 trace를 보게 함.

  새 narrow port `DecisionEmitter`를 `@/stream`에 추가하고 `safeEmitDecision`
  helper로 throw isolation. `AgentConfig.decisionEmitter?` slot이 optional —
  composition root이 `QUANTA_DEBUG` 켤 때만 wire하고 그 외엔 zero-allocation
  byte-identical short-circuit. 세 emit site: (a) prefix-rule DSL의
  allow/deny/ask + no_match-policy-deny 4분기, (b) pre_tool_use hook의 deny
  + admit 양쪽 (어떤 호출이 hook을 통과했는지도 trace), (c) mode policy +
  permission stack의 evaluate/evaluateAuto/evaluateStack 결과 매핑.

  왜 `StreamPort`로 안 라우팅하는가: stdout adapter + JSONL recorder가 모두
  Phase 1 wiring과 함께 이미 `decision` variant를 렌더 가능. `StreamPort`로
  바로 보내면 ADR-0239 Phase 2 contract clause 1 ("default-OFF byte-identical
  surface invariant")이 깨짐. 좁은 별도 port는 composition root가 `QUANTA_DEBUG`
  ON일 때만 debug-tracer 쪽으로 wire하도록 — user-facing surface는 opt-in 전엔
  동일.

  Sanitisation contract: `reason`은 짧은 one-liner (도구 input 금지, 파일
  내용 금지). `metadata`는 `{ tool: action.tool }`만 (input spread 절대 안
  함). `ruleId`는 `${layer}:${sourceFile}:${sourceLine}` categorical
  (matched command 절대 미포함). `toolCallId` mirrors `call.id`.

  Out-of-scope: cap / jail / budget 게이트는 `runAdmissibilityGate` call graph
  바깥에 있어 별도 wire-up 필요 → ADR-0269 (Phase 3)가 처리.
