notes: |
  closed port — runtime-config / command-hooks가 @/config 인터페이스에 의존하고
  concrete file IO + trust persistence는 composition root에서 주입(@/config → @/agent
  import 없음). managed OS discovery path enumeration + 실 trust prompt 배선은
  composition-root follow-up(슬라이스는 managedPath/trusted/read를 주입받기만 함).
