deliberate_hold:
  reason: |
    Verify-only foundation. Signing (private-key custody — file/HSM/keychain
    결정 필요), Cloud Tasks callback 통합, realtime/SSE auth wire 는 후속
    슬라이스. 본 ADR 은 consumer 반쪽 (외부 발급 token 검증) 만 ship.
  promotion_path: |
    1) agent-task registrar 가 `JwksClient` 주입받아 외부 dispatcher 응답
       토큰 검증 후 follow-up enqueue (composition-root opt-in).
    2) Realtime/SSE 경로가 connection-auth 단계에서 verify 호출.
    3) Signing 슬라이스 추가 시 동일 `JsonWebKey` 타입 재사용.
notes: |
  Algorithm whitelist 는 RS256 + ES256 두 개 (real-world ~전수 커버).
  EdDSA/HS256/RS384/RS512 는 typed `unsupported-alg` — 향후 추가는 default-OFF
  확장으로. Cache TTL 기본 1h (Google/Cloudflare published mirror); injectable
  `clock()` 으로 expiry 테스트 결정성 확보.
