id: jwks-agent-identity
title: JWKS agent identity — remote JWK fetch + cache + verify (ADR-0248)
section: 3
subsystem: Security — hexagonal JWKS verifier slice (verify-only foundation)
order: 248
maturity: L4
status: new
ui_surfaces: []
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "default-off", "absorbed:codex", "tier:security"]
depends_on: []
purpose: |
  Codex agent-task 등록 패턴 흡수의 verify-only foundation. 외부 dispatcher가
  발급한 JWT를 remote JWKS endpoint로 검증한다. `src/security/jwks-identity/`
  새 슬라이스: port(`JsonWebKey`/`JwksSet`/`VerifyResult` discriminated/
  `JwksError` 계열/`JwksClient { fetchJwks, cacheGet, verify, refresh }`) +
  default-client(built-in `fetch` + TTL 1h cache + Web Crypto `crypto.subtle`
  로 RSA RS256 + ECDSA ES256 검증) + headless-stub(typed no-op) + index.
  Algorithm whitelist 외엔 typed `unsupported-alg` 반환; verify는 NEVER throw
  (모든 rejection은 `{ ok: false, reason }` 닫힌 enum). Cache는 strictly
  TTL-bounded — stale serve 금지. Plane discipline: Web Crypto + `fetch`만
  의존, 다른 quanta slice import 0. Default-OFF — dispatch/loop/agent/runner/
  scheduler/realtime 전부 미주입.
