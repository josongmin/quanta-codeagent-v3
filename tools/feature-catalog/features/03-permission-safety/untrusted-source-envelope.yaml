    integration: []
    contract: []
knobs:
  - name: QUANTA_UNTRUSTED_ENVELOPE
    default: 'unset (OFF)'
    purpose: '정확히 "1"이어야 활성화; 그 외 값(unset/"0"/"on"/"true"/임의)은 OFF 유지. OFF ⇒ wrapToolResult가 모든 source에 identity + RULE 미주입 ⇒ byte-identical. 주입 env bag에서 읽음(process.env 직접 안 읽음).'
deliberate_hold:
  reason: |
    활성화는 슬라이스가 fence된 공유 파일이라 human integration으로 보류:
    (1) src/agent/dispatch.ts — applyRedaction 직후(post-redaction redacted),
    deferred-envelope prepend 전에 deriveProvenance(call,config)로 도구→
    provenance enum 매핑 후 wrapToolResult(redacted, provenance,
    {enabled: untrustedEnvelopeEnabled(config.env)}) 호출; (2) system-prompt
    section 조립부 — gate ON일 때만 UNTRUSTED_ENVELOPE_RULE 섹션 1회 추가.
    둘 다 ADR-0471 integration TODO에 정확한 코드로 명시.
notes: |
  핵심은 (a) provenance≠sensitivity 직교성(web_fetch는 public이지만 untrusted),
  (b) defang으로 trust-boundary 위조 차단(canonical escapeBoundary에 위임 —
  genuine token 뒤 backslash <\/... 삽입, BENIGN INVARIANT로 정상 코드/로그
  본문은 byte-identical), (c) internal trusted는 절대 미포장. 닫힌 enum + 닫힌
  TRUSTED_SOURCES set으로 미래 trusted source 추가도 1줄. RULE wording은
  hellgate가 pin(tag명/DATA-not-instructions/flag-before-continue).
