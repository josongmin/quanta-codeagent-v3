purpose: |
  Codex의 `~/.codex/shell_snapshots/{thread}.{ns}.sh` (~90KB) 패턴
  흡수 — 매 턴 진입 시 사용자 shell 환경(typeset/declare params,
  alias, function)을 단일 `.sh` 파일로 직렬화하고, 이후 shell tool 호출
  시 그 파일을 `source` 한 뒤 사용자 명령을 실행한다. fork/resume 후
  fresh shell 이 interactive rc 를 로드하지 않아 alias/function 이 사라지는
  asymmetry(quanta 대 Codex)를 폐쇄. 슬라이스만 — 닫힌 port
  `ShellSnapshotPort`(capture/restore/prune) + 어댑터 2 종(zsh: `typeset -p;
  alias; declare -f`, bash: `declare -p; declare -f; alias` — ordering 차이
  ADR 명시) + file-store(`~/.quanta/shell_snapshots/{id}.sh`, mode 0600,
  디렉토리 0700, id sanitisation `[^A-Za-z0-9._-]` → `-` + leading `-./.`
  strip + 48-char cap + 8-hex nonce suffix concurrent-collision-safe) +
  headless-stub spawner(테스트 결정성). default-OFF: 합성 사이트 0 —
  `runShell` 미수정, 미주입 세션은 argv `["bash","-lc",cmd]` byte-identical.
  Wire-up(`runShell` 옵션 fold)은 후속 슬라이스.
