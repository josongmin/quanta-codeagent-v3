purpose: |
  `errMessage(e)` 의 self-recursion 회귀 fix — 2026-05-23 mass migration 이
  over-eager find/replace 로 본문을 `errMessage(e)` 로 바꿔 무한 재귀 → 모든
  consumer hang. 정정 후 body 는 verbatim:
  `e instanceof Error ? e.message : String(e)` 로 고정.

  Hardening 3-단:
    1. Body restore to literal `e instanceof Error ? e.message : String(e)` —
       30+ catch block 사이트 안전 보장 (loop/dispatch/permission/tool/runner/
       observability/...).
    2. Guard comment: "do NOT change the body to `errMessage(e)` (e.g. by an
       over-eager find/replace pass)" — 다음 마이그레이션에서 동일 함정 방지.
    3. Regression test pin: `tests/unit/errors.test.ts` "regression: does NOT
       recurse on itself" — 무한 재귀가 다시 들어오면 테스트 hang (CI 가
       SIGKILL → fail) 으로 즉시 검출.

  Why critical: errMessage 는 catch-block 가장 안쪽 helper. 자기 자신을 호출하면
  consumer 가 SIGKILL 전까지 무응답 — observability/recovery 가 무력화. 30+
  사이트가 의존하므로 한 줄 회귀가 시스템 전체 multiplier.
