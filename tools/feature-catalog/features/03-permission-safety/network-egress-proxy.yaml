purpose: |
  Closes the SUBPROCESS egress bypass the dispatch-layer gate (network-egress-enforcement)
  leaves open. The tool-arg guard extracts a host from a tool CALL; a subprocess that opens
  its OWN socket (curl / gh / npm / git) never passes through it. This slice ships a REAL
  loopback HTTP proxy (Node http/net, plain-HTTP forward + CONNECT tunnel) and WIRES it into
  the child-spawn path: the composition roots (`apps/agent/index.ts`, `apps/cli` via the host
  overlay) read `QUANTA_NETWORK_PROXY` DIRECTLY (mirroring `resolveMemoryConfigFromEnv`) and set
  `AgentConfig.networkProxy`. `runAgent` then constructs a `LoopbackEgressProxy` via
  `withEgressProxy`, `listen()`s on an ephemeral loopback port for the whole session, and injects
  the bound `proxyEnv` onto the per-session config — which the dispatch seam surfaces on
  `ToolContext.proxyEnv`, so the bash tool forwards it to `runShell` (and `LocalSandbox.run`),
  which injects `HTTP_PROXY`/`HTTPS_PROXY`/`NO_PROXY` (via `withProxyEnv`) into the child env — so
  the child's OWN sockets are funneled through the SAME
  `isHostAllowed` decision the dispatch guard uses. Allowed ⇒ dial origin + pipe; off-list ⇒
  403 at the socket; SSRF literals (169.254.169.254 / loopback / private / link-local) are
  categorically blocked BEFORE the allowlist (and re-checked post-connect on the resolved peer,
  DNS-rebinding defense); a runtime `NetworkPolicyAmendment` permits a host post-approval
  (amended-allow) and is revocable fail-closed. Default-OFF / byte-identical: knob absent or
  `enabled:false` ⇒ NO proxy is constructed and `withProxyEnv` returns the SAME base env
  reference (no proxy vars in the child) — every interactive turn is unchanged.
