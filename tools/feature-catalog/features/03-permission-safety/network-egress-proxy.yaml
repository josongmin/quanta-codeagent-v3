notes: |
  Default-OFF is structural in THREE layers: (1) the `network-proxy` knob is absent unless
  `QUANTA_NETWORK_PROXY` is set (`1` ⇒ ci-bot default allowlist; `host,host,...` ⇒ explicit
  allow-set; `0`/empty ⇒ inactive, fall through); (2) `withEgressProxy` constructs no socket
  when `config.enabled !== true`; (3) `withProxyEnv(base, {})` returns the SAME base reference
  so the child env is byte-identical when no address is bound.

  The knob imports its existing composite secret scanner directly, avoiding
  initialization of the optional Secretlint adapter through a shared barrel.
  Secret-egress detection policy, proxy activation, and allowlist decisions
  are unchanged. The production-runtime import guard in
  `check-secrets-tool-hellgate.test.ts` covers both composite-scanner callers.

  The allow DECISION is delegated entirely to `isHostAllowed` (the exact predicate the
  dispatch guard uses, so socket- and arg-level agree) + `classifyHost` (canonical structural
  SSRF classifier) — NO heuristics, NO thresholds in this slice. The `DialTarget` DI seam lets
  hermetic e2e map routable NAMES to a loopback origin; a SEPARATE `resolvePeerHost` DI selects
  which address the post-connect SSRF re-check classifies, so the rebinding defense is now
  ALWAYS active (jun-02 re-audit — previously an injected dial silently disabled it).

  jun-02 LIVE-WIRE + SSRF-CONNECT fix (was: false security — `withEgressProxy` had ZERO
  production callers, bash never forwarded any proxy env):
   - BUG1 (dead wire): composition roots now read `QUANTA_NETWORK_PROXY` directly → set
     `AgentConfig.networkProxy`; `runAgent` constructs+listens the proxy and threads `proxyEnv`
     through `ToolContext.proxyEnv` → bash tool → `runShell` (+ `LocalSandbox.run`). Proven by
     `network-proxy-bash-tool-e2e.test.ts` driving the REAL bash tool dispatch path.
   - BUG2 (SSRF CONNECT asymmetry): the CONNECT authority is now normalized through the URL
     parser BEFORE classification (mirroring the HTTP path), so obfuscated IPv4
     (`2130706433`/`0x7f000001`/`127.1`/decimal-metadata `2852039166`) is classified+blocked;
     the metadata check is structural (canonicalize → compare) not exact-string. Proven by
     `network-proxy-ssrf-connect-hellgate.test.ts`.

  WIRED spawn sites: `runShell` (bash tool — PRIMARY LLM egress path) + `LocalSandbox.run`.
  TRACKED GAP (NOT yet wired): `bash-bg-registry.ts` (background detached shells) and the git
  tool's direct argv spawns do NOT yet thread `proxyEnv` — a background `bash &` or a git
  subprocess can still open an ungated socket. `DockerSandbox` forwards proxy vars through its
  `envAllowlist` (HTTP_PROXY/etc. already allowlisted) but is not actively proxy-aware. Follow-up:
  thread `proxyEnv` into the bg-registry + git spawns; surface the active egress posture +
  amendment prompts in the status line.
