id: network-egress-proxy
title: Socket-level egress proxy — close the subprocess egress bypass
section: 3
subsystem: 보안 — 소켓 레이어 아웃바운드 게이트 (ADR-0428, Codex 0.135 [network_proxy] 흡수)
order: 92
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless, batch, ci-bot, ide]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "security-touched", "absorbed:codex-network-proxy"]
depends_on:
  - network-allowlist-host-check
  - network-egress-enforcement
