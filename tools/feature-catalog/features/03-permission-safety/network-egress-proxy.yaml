notes: |
  Default-OFF is structural in THREE layers: (1) the `network-proxy` knob is absent unless
  `QUANTA_NETWORK_PROXY` is set (`1` ⇒ ci-bot default allowlist; `host,host,...` ⇒ explicit
  allow-set; `0`/empty ⇒ inactive, fall through); (2) `withEgressProxy` constructs no socket
  when `config.enabled !== true`; (3) `withProxyEnv(base, {})` returns the SAME base reference
  so the child env is byte-identical when no address is bound.

  The allow DECISION is delegated entirely to `isHostAllowed` (the exact predicate the
  dispatch guard uses, so socket- and arg-level agree) + `classifyHost` (canonical structural
  SSRF classifier) — NO heuristics, NO thresholds in this slice. The `DialTarget` DI seam lets
  hermetic e2e map routable NAMES to a loopback origin without weakening the production peer
  SSRF re-check (active only under the identity dial). The subprocess e2e spawns a REAL bun
  child whose injected `HTTP_PROXY` forces its own socket through the proxy, proving the
  bypass is closed at the SOCKET (allow connects / off-list refused / SSRF blocked / knob
  absent ⇒ no proxy vars).

  Follow-up: thread `proxyEnv` through the sandbox (`LocalSandbox.run`) + bash-bg-registry
  spawn sites and the git tool's child spawns (currently only `runShell` is wired); surface the
  active egress posture + amendment prompts in the status line.
