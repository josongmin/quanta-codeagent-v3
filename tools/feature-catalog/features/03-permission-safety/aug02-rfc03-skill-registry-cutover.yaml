id: aug02-rfc03-skill-registry-cutover
title: RFC03-0/1 — canonical SkillRegistry snapshot + ToolSearch skills mode
section: 3
subsystem: Skill pipeline — canonical registry + discovery (aug-02 RFC03-0/1)
order: 557
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: partial
modes: [interactive, headless]
configurable: static
owners: ["@songmin"]
labels: ["rfc:aug02-03", "surface:cli"]
purpose: |
  RFC-03-0 canonical SkillRegistry snapshot cutover: skills resolve from ONE
  immutable registry snapshot per turn (no mid-turn drift). RFC-03-1 ToolSearch
  gains a `catalog: "skills"` mode so the deferred-tool search surface can
  discover installed skills by keyword, not just tools. Additive: the registry
  snapshot is pinned on the existing bootstrap; the skills mode is a new query
  arm that is inert unless requested.
evidence:
  code:
    - src/skill/registry.ts
    - src/skill/tool-search.ts
    - src/agent/tier1/skill.ts
  adrs: ["docs/plans/aug-02-absorption/rfc-03-self-improve-onboarding.md"]
  tests:
    unit:
      - tests/unit/skill-registry-cutover.test.ts
      - tests/unit/tool-search-skill-mode.test.ts
