id: circumvention-detector
title: jun-7 tool-switch circumvention detector (denied-effect memory, advisory-first)
section: 3
subsystem: Permission auto-mode — same-effect-via-different-tool bypass defense
order: 82
maturity: L3
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
config_refs:
  env: [QUANTA_CIRCUMVENT_DETECT]
owners: ["@songmin"]
labels: [surface:cli, category:permission, security, security-touched, default-off, absorbed:claude]
depends_on: [auto-mode-classifier, deny-reason-surfacing]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 5/5 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure denied-effect memory primitive feeding the classifier prompt (advisory-first), internal gate primitive with no UI affordance on any surface"
purpose: |
  실제 AFK 바이패스를 닫음: write-to-X 가 tool A(`Edit`/`Write`/`MultiEdit`)로
  SOFT-deny 됐을 때, 조작된 에이전트가 동일 EFFECT 를 다른 tool B(`bash` `echo > X`/
  `sed -i X`/`cat > X`/heredoc/`python -c`)로 달성해 통과하는 redirect-around-deny.
  quanta 는 각 action 을 독립 평가(`EVALUATE ON OWN MERITS`)하고 denied-effect 기억이
  없어 이 우회가 invisible 했음. `CircumventionTracker`(`AutoModeClassifier` denial
  state 의 sibling)가 soft-denied WRITE effect signature(`{kind:"write", path:
  canonical-abs}`)를 세션-스코프로 기억. 후속 action 이 SAME canonical path 를 DIFFERENT
  tool 로 쓰면 circumvention signal. 설계 posture(티켓 §5, 핵심제약): 의도적으로
  CONSERVATIVE+ADVISORY-FIRST — FALSE-NEGATIVE 를 FALSE-POSITIVE 보다 선호. (1)write-only
  (2)same-canonical-path (3)different-tool 셋 다 만족시만 발화; computed/`$VAR`/base64
  경로는 accepted false-negative. 해소: ADVISORY(default) = verbatim circumvention
  taxonomy line(Claude CLI 2.1.150)+advisory 를 다음 분류기 prompt 에 thread → LLM 이
  결정; ESCALATE(strict posture) = forced HITL `ask`. NEVER auto-allow, NEVER
  auto-hard-block — human 이 FP-tolerant resolver. TTL(=DENIAL_LIMITS.maxTotal, 기존
  validated 상수 — 신규 magic-number 아님)+clear-on-allow 로 stale deny 세션 오염 방지.
  HARD_DENY 는 terminal — tracker 미경유. write-effect 추출은 `extractShellCommand`
  재사용 위 closed v1 패턴셋(`>`/`>>`/`tee`/`sed -i`/`cp`/`mv`/`cat >`/heredoc/`python -c`).
  DEFAULT-OFF(`QUANTA_CIRCUMVENT_DETECT` strict `=== "1"`): 부재 ⇒ tracker 미생성,
  signature 0건, auto-mode gate byte-identical.
