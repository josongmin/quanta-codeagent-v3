knobs:
  - name: QUANTA_CIRCUMVENT_DETECT
    default: 'undefined'
    purpose: Strict opt-in (`=== "1"`). OFF ⇒ `CircumventionTracker` 미생성, effect signature 미기록, gate 가 tracker 미consult — auto-mode byte-identical. ON(+gate 에 tracker 배선) ⇒ soft-denied write effect 기억 → same-path-different-tool 후속 write 가 advisory(default) 또는 forced-`ask`(escalate posture) — 절대 auto-deny 아님.
deliberate_hold: null
notes: |
  설계 provenance: 티켓 `docs/tickets/misc-jun-7/04-auto-mode-rule-overlay-circumvention.md`
  §3.2/§4.b/§5. ADR-0502 발행됨(reconcile pass) — 티켓은 상세 design 정본. v1 granularity =
  path-equality only(티켓 Open Question §6.1, prefix/content-class 매칭은 데이터측정
  전까지 보류 — no-heuristics rule). Posture default = advisory(§6.3); forced-`ask` 는
  stricter opt-in. Network-exfil circumvention 은 out-of-scope(§6.5, 기존 exfil-scouting
  rail 이 network 방향 담당). 정직한 갭: 충분히 영리한 우회(computed path/encoding)는
  v1 통과 — aggressive equivalence 가 legit agent work 을 깨는 게 더 나쁜 실패라는 trade.
