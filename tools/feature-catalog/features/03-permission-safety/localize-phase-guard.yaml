id: localize-phase-guard
title: Localize-phase guard — Agentless "localize-first" dispatch gate
section: 3
subsystem: SWE-bench localization 강화 (Agentless 흡수)
order: 97
maturity: L4
status: stable
owners: ["@songmin"]
labels: [absorbed:agentless, surface:cli]
purpose: |
  Pure deterministic policy at the dispatch seam: during the first N turns of
  a run, mutating tools (`edit`, `write`, `scripted_replace`) are blocked with
  a reminder steering the model to `read`/`grep`/`glob`/`localize` first.
  Addresses the observed SWE-bench Verified failure pattern — the model edits
  `adapters.py` on the first turn when the gold patch lives in `models.py`.
  Mirrors Agentless's 3-phase pipeline boundary (file/function localized
  before any edit). No LLM, no I/O; cycle-safe (no imports from sibling agent
  modules). Absent config OR absent state ⇒ `{block: false}` (byte-identical
  to pre-feature loop).
