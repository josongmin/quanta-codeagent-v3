notes: |
  - PermissionProfile.fileSystem.entries + FileSystemSandboxPolicy.entries 둘 다
    allow-list. 매치 entry 없으면 deny.
  - write access entry는 read access도 cover (POSIX-style superset).
  - 두 layer 다 absent (TwoLayerManager.getEffectiveAccess decidedBy=no-policy)
    이면 manager는 abstain → 호출자는 legacy PermissionStack fallthrough.
  - 한 layer만 set이면 다른 layer는 DEFAULT (deny-by-default) → 부분 config는
    strictest 동작.
