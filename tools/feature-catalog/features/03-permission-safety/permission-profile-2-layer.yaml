id: permission-profile-2-layer
title: PermissionProfile + file_system_sandbox_policy 2-layer (AND condition)
section: 3
subsystem: 권한 스택 (ADR-0135)
order: 20
maturity: L4
status: new
owners: ["@songmin"]
labels: [absorbed:codex, surface:cli]
configurable: static
purpose: |
  **Codex `turn_context.permission_profile.file_system` + `file_system_sandbox_policy`
  의 2-layer 모델 흡수.** 동일 schema (`path.type: special/path`, `access: read/write`)
  의 두 인스턴스를 AND-condition으로 결합 — 두 layer 모두 allow여야 access OK.
  한쪽이 deny면 deny. permission_profile은 "사용자가 이 path를 read/write 허용했나",
  file_system_sandbox_policy는 "sandbox가 이 path를 expose하나" — 서로 다른 결정
  주체이므로 두 layer가 모두 동의해야 함.

  AND 조건 채택 이유 (ADR-0135 §Alternatives): OR는 security 약함. 두 layer 다
  통과해야 안전. 단일 layer는 검사 비용 절반이지만 한쪽이 misconfig되면 sandbox
  escape 가능. AND는 검사 비용 2배지만 LRU cache로 95%+ hit rate 보장.
