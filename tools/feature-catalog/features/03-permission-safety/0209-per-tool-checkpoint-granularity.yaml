purpose: |
  ADR-0121의 4-arm trigger mode와 직교하는 GRANULARITY 축 추가
  (`"turn" | "tool" | "skill"`). 기존 per-turn dedup는 Cline의 매-tool-call
  anchor + tag 패턴 (`/rewind-tool tool:edit_file:turn-1:7`) 을 막아왔음.
  `GranularCheckpointPolicy` 가 base `CheckpointPolicy` 를 extends 하고
  `computeTag(ctx)` + `recordAnchorSha(tag, sha, ctx)` 를 추가; tool-grain
  은 base의 turn-dedup 을 우회해 매 destructive call마다 anchor + LRU tag
  registry 에 `tool:<name>:<turnId>:<callIndex>` 삽입. Default-OFF:
  `defaultCheckpointPolicy` 그대로면 byte-identical (registry empty, no
  bypass). assembly layer가 명시적으로 `defaultGranularCheckpointPolicy(
  {base, granularity:"tool"})` 를 wire할 때만 활성.
