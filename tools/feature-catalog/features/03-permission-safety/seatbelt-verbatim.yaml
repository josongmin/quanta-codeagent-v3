id: seatbelt-verbatim
title: ADR-0199 macOS Seatbelt verbatim profile + 4 strict knobs
section: 3
subsystem: OS sandbox darwin
order: 199
maturity: L2
status: stable
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
