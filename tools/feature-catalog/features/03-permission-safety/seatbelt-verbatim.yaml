purpose: |
  Codex 강신호 — macOS Seatbelt SBPL profile을 verbatim parity로 잠금
  (3 profile: read-only / workspace-write / workspace-write-net). parity
  fixture 3개로 byte-equal lock. 4 strict knob 추가 (denyForkAdditional /
  denyNetworkAlways / allowTmpWrite / denyMetadataReadAbsolute). workspace
  path 정확히 1회 escape (injection 방어). darwin-only — CI Linux는 폴라이트
  skip (describeOnDarwin helper). danger-full-access는 passthrough (compile 안 함).
  OC-4 (2026-09-13): strict knob은 이전엔 두 call site(wrap-argv/default)가
  `compileSeatbeltProfile(policy, cwd)`로 opts를 안 넘겨 **도달 불가**였음(과대주장).
  이제 `SandboxPolicy.strict`로 배선되어 두 call site가 policy를 통해 그대로 전달.
  신규 `readWorkspaceOnly` (S7): 전역 `(allow file-read*)`를 metadata-global +
  workspace/system-subpath content-read로 교체($HOME 밖 secret 콘텐츠 read 차단,
  dyld는 metadata로 유지). 기본 off=byte-identical(HELL-SB-05). ⚠️ readWorkspaceOnly의
  SBPL은 runtime-UNVERIFIED(이 환경에 sandbox-exec 없음) — 구조 테스트만; opt-in 운영자가
  자기 toolchain으로 system allowlist 검증 필요.
