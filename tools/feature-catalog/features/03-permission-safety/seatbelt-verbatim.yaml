purpose: |
  Codex 강신호 — macOS Seatbelt SBPL profile을 verbatim parity로 잠금
  (3 profile: read-only / workspace-write / workspace-write-net). parity
  fixture 3개로 byte-equal lock. 4 strict knob 추가 (denyForkAdditional /
  denyNetworkAlways / allowTmpWrite / denyMetadataReadAbsolute). workspace
  path 정확히 1회 escape (injection 방어). darwin-only — CI Linux는 폴라이트
  skip (describeOnDarwin helper). danger-full-access는 passthrough (compile 안 함).
