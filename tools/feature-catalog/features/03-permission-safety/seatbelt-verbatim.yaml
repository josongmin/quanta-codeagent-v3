# resolver at the composition root is the follow-up that would surface them to
# the operator (until then the capability is reachable programmatically only).
knobs: []
notes: 'Phase 1 integration test 2개만 (negative-side) — Phase 2에서 framework allowlist 확장 후 positive cases. /tmp symlink → /private/tmp realpath 필수.'
