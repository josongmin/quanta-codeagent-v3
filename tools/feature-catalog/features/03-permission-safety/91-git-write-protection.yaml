config_refs:
  env: []
purpose: |
  Cursor cursorsandbox의 Seatbelt write-deny-regex를 surface-agnostic 정적 detector로
  흡수 — .git/hooks·.git/config·.vscode write는 곧 임의 코드 실행(git/에디터가 auto-run)
  이므로 정통 샌드박스 탈옥 벡터. gitWriteProtectReason(path)는 순수 경로-패턴 매처
  (I/O 0, 상태 0): 세그먼트 앵커 매칭(substring 아님)으로 .gitignore/git/config/notes/.git-stuff
  false-deny 원천 차단, 중첩 .git(submodule/worktree) 전 세그먼트 스캔. .cursorignore·
  *.code-workspace는 고의 제외(Cursor 고유, quanta 벡터 아님). L3 wiring(ADR-0091): write/edit
  툴이 fs write 직전 ctx.gitWriteGuard(duck-typed seam — @/tool은 @/permission 미import)를
  통해 호출, non-null이면 ok:false + typed permission_denied failure로 정적 deny(부분 쓰기 0,
  FsJailError와 동일 hard-stop). dispatch.ts가 gitWriteProtectReason을 무조건 주입(매처가
  pure라 일반 경로는 byte-identical). SOTA++ delta(Cursor cursorsandbox 흡수): .git/config.worktree
  (per-worktree config overlay, config와 동일 권한)·.git/info/attributes(filter-exec gitattributes)
  추가 deny — git_attributes reason 신설, git_config는 config.worktree 포함.
