notes: |
  THE PAIRED CONTROL IS LOAD-BEARING. A "fix" that hid mutating tools in every mode
  would satisfy the parity invariant and destroy the product, so `default`/`editor` are
  asserted to keep the FULL surface, and read-only tools are asserted visible in plan.

  Fail-closed is asserted, not assumed: an unrecognized mode hides mutating tools,
  because `MUTATING_MODES` membership is the test.

  `PASS_THROUGH_COMPOSE_KEYS` is exported so the wiring proof asserts the contract at
  RUNTIME rather than by grepping the source — a key silently dropped from that list is
  exactly how a wired-looking feature ends up reaching nothing.

  Three injections each produce a distinct RED: removing the spec filter (5 fail),
  making the live resolution ignore `agentModeState` (3 fail), and dropping the compose
  key (1 fail).

  Two functions crossed the 150-line god-function cap from the additions and were SPLIT
  (`withLiveAgentMode`, `resolveVisibleSpecs`) rather than allowlisted.
