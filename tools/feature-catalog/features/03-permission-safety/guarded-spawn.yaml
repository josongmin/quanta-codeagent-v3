purpose: |
  Spawn site (runShell의 observer/buffered path, LocalSandbox.run, DockerSandbox.run)
  마다 자식 프로세스의 생애를 관리하는 RAII-style guard. WHY: 각 site가 같은 cleanup
  코드(timeout / abort signal 전파 / stdio drain / kill+await exit / orphan 방지)를
  ad-hoc 으로 자라게 두면 drift가 생기고 leak 가능성. 본 모듈로 모든 spawn이 단일
  lifecycle을 거치도록 강제 — try/finally 보다 더 좁은 RAII 패턴(생성 시점에 guard
  acquire, scope exit 시 guard 자동 release).
