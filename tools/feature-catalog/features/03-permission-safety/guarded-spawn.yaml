knobs: []
deliberate_hold: null
notes: |
  구조적 cleanup invariant — 새 spawn site가 추가되어도 guard를 거치지 않으면 *lint
  + 리뷰* 에서 잡힌다는 의도. AbortSignal 전파, orphan 방지, exit code 표준화 모두
  guard 내부.
