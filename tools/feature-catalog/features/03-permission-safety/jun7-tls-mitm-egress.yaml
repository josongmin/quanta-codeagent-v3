id: tls-mitm-egress
title: jun-7 TLS-MITM egress — HTTPS body/header secret scanning (Phase-2 of exfil-rail (B))
section: 3
subsystem: Exfil-prevention enforcement — mechanical teeth behind the Data-Exfil taxonomy
order: 483
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env: [QUANTA_TLS_MITM, QUANTA_TLS_MITM_ACK, QUANTA_TLS_MITM_ON_FAILURE]
owners: ["@songmin"]
labels: [surface:core, security, security-touched, security-sensitive, absorbed:codex]
depends_on: [secret-aware-egress, network-egress-proxy, secret-detection-scanner]
purpose: |
  secret-egress (B) 의 HTTPS-opaque 갭을 닫음. 기존엔 `CONNECT host:443` 이 raw TLS
  터널이라 프록시가 HTTPS body/header 를 못 봄(`connect-tunnel-unscanned` 마커만).
  본 슬라이스는 ALLOWED CONNECT 에서 TLS 를 로컬 종단(EPHEMERAL per-session MITM CA 가
  서명한 host LEAF 제시) → 복호화 → 기존 `decideEgressScan`(plaintext 경로와 동일 코어,
  재사용) 으로 body+header 스캔 → deny/redact/clean → 진짜 host 로 OWN upstream TLS
  재발신(real cert 정상검증) → 재암호화. Codex network.mitm 흡수.

  ⚠️ CA 폭발반경 봉쇄(핵심): CA 는 EPHEMERAL(세션당 in-memory, OS trust store 미주입,
  미영속). quanta 자신의 MITM'd outbound client 단일 소켓만 신뢰(NODE_EXTRA_CA_CERTS/
  시스템스토어/타프로세스 아님). UPSTREAM 검증은 약화 안 됨(rejectUnauthorized:true,
  default store + SNI; forged upstream cert ⇒ 502, 절대 blind-accept 아님).

  DEFAULT-OFF + OPERATOR-EXPLICIT-OPT-IN(타 knob 보다 강함): `QUANTA_TLS_MITM=1` AND
  verbatim ack `QUANTA_TLS_MITM_ACK=i-understand-mitm-mints-a-trust-anchor` 둘 다 필요 —
  stray `=1` 으로 trust anchor 못 켬. 부재 ⇒ CONNECT 가 raw 터널 + `connect-tunnel-unscanned`
  (byte-identical).

  닫힌 포트/결정성: cert-gen 은 keyPairSource/serialSource/now/validity 주입(`MitmCertAuthority`).
  NO new dep — 순수 node:crypto hand-rolled X.509 v3 DER + crypto.sign(ECDSA-SHA256)
  (node:crypto 은 cert PARSE 만, GENERATE 불가라 직접 인코딩). NO-THROW fail-closed:
  handshake/mint/scan 에러 ⇒ deny(권장) 또는 opaque-tunnel(가시 마커). watchdog
  (handshakeTimeoutMs) 가 stuck handshake 를 hard deny 로 전환 — 절대 unscanned 통과 안 함.

  ✅ RUNTIME (RESOLVED jun-07): TLS 종단 메커니즘은 `MitmTlsChannel` seam 으로
  capability-detect — Node 는 node:tls server-wrap, Bun 은 one-shot `Bun.listen({tls})`
  terminator + raw CONNECT 소켓 byte-pipe 브리지(Bun 은 server-wrap 한 raw 소켓에
  ClientHello 미전달이라 node:tls 경로 stall → 브리지로 우회). 복호 plaintext 는 수동
  HTTP 파서(`parseHttpRequestBuffer`)로 파싱(Bun 의 http.Server.emit("connection") 은
  파싱 미구동, 스파이크로 확인). secret-egress 스캔/upstream-forward/fail-closed/ephemeral-CA
  /watchdog 는 두 transport 가 공유 — 보안모델 불변. HTTPS-MITM 이 이제 **Bun(prod 런타임)**
  포함 BOTH 에서 기능. 스파이크(Bun 1.3.14): Bun.listen TLS 가 minted leaf 로 종단 +
  CA-only-trust 클라가 handshake 완료(authorized:true), 브리지가 복호 바이트 surface,
  응답 재암호 라운드트립 — 전부 실증.
