knobs:
  - name: QUANTA_TLS_MITM
    default: 'undefined'
    purpose: MITM 마스터 스위치. 정확히 `1` 이어야 하고 QUANTA_TLS_MITM_ACK verbatim 도 동반해야 ON. 그 외(unset/`true`/`2`) ⇒ OFF ⇒ CONNECT 가 raw 터널 + `connect-tunnel-unscanned`(byte-identical). MITM 은 trust anchor 를 mint 하므로 타 knob 보다 강한 이중 게이트.
  - name: QUANTA_TLS_MITM_ACK
    default: 'undefined'
    purpose: 명시적 ack 구문 `i-understand-mitm-mints-a-trust-anchor` verbatim. self-documenting — 오퍼레이터가 무엇을 켜는지 읽지 않고는 못 켬. 불일치/공백 동반 ⇒ OFF.
  - name: QUANTA_TLS_MITM_ON_FAILURE
    default: 'deny'
    purpose: termination/scan 에러 시 fail-closed 정책. `deny`(권장) = hard 403/close; `opaque-tunnel` = raw 터널 fallback + 가시 `connect-tunnel-unscanned` 마커(cert-pinned host 가용성). 그 외 값 ⇒ deny(기본 fail-closed).
notes: |
  UPSTREAM cert 검증 실패는 onFailure 와 무관하게 항상 hard fail(502) — 인증 못한
  서버로는 절대 forward 안 함.


  설계/증명: RFC `docs/plans/jun-6-tls-mitm-egress.md` (✅ IMPLEMENTED jun-07). 갭 cross-link:
  `docs/plans/jun-6-exfil-egress-rails.md` (B) HTTPS-opaque 갭이 본 RFC 로 CLOSED.
  배선: `onConnect` 가 ALLOWED 이고 `config.mitm` 존재 시 `mitmTerminate` 분기 —
  leaf mint → `openMitmChannel`(capability-detect: Bun bridge / node:tls wrap) → channel
  종단 → `channel.parse`(1 req 복호 파싱; Node 는 one-shot http 파서, Bun 은 수동 파서) →
  `decideEgressScan`(plaintext 와 SAME 코어) → deny(TLS 위 403)/redact(마스킹 후 upstream)/
  clean → `mitmForwardUpstream`(node:https, rejectUnauthorized:true, SNI; upstreamTlsExtra 는
  test-only 추가 trust root, security 필드 뒤에 spread 라 절대 약화 불가). watchdog 은
  `Promise.race(channel.parse, timeout)` 로 stuck handshake 를 hard deny 전환.
  marker: scanned-clean|denied|redacted(MITM 경로) / connect-tunnel-unscanned(OFF
  또는 opaque-tunnel fallback). cert-gen: 순수 node:crypto DER 인코더 + ECDSA-P256 sign,
  X509Certificate 가 parse/verify/chain 확인(unit). hellgate: cert-gen(self-sign/chain/SAN/
  host-mismatch/cache/determinism/clock), gate(이중게이트 ON, switch-alone/ack-alone/typo/
  truthy-not-1/empty OFF), scan-integration(clean/deny-body/deny-header/redact/scanner-only→deny),
  bun-bridge-parse(framing+fail-closed: over-cap/chunked/malformed/header-DoS),
  bun-bridge-hellgate(GAP-CLOSED ON BUN: real-content-scan deny vs watchdog 구별; DI hostile
  channel parse-never-resolves→watchdog-deny, parse→null→deny, opaque-tunnel→visible-marker),
  REAL-TLS e2e(ALL RUNTIMES incl Bun: secret HTTPS body→403 never-reaches-origin, legit→200 no-FP,
  redact origin-sees-mask, bad-upstream-cert→502, stuck-handshake→deny watchdog, MITM-OFF→raw-tunnel
  byte-identity).
