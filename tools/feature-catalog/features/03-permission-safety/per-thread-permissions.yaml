id: per-thread-permissions
title: 스레드별 권한 (heartbeat-thread-permissions-by-id 동등물)
section: 3
subsystem: 권한 스택 (ADR-0046)
order: 10
maturity: L4
status: stable
ui_surfaces: [n-a]
monitoring: n-a
telemetry_keys: ["quanta.hitl"]
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env: [QUANTA_PERMISSION_STATE, QUANTA_HOME]
owners: ["@songmin"]
labels: [absorbed:codex, surface:cli, security-touched]
depends_on: [agent-types-split, permission-store-json, agent-loop-branch-hardening, per-host-agent-mode, plan-mode]
surface_integration:
  cli: full
  web: na
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "runs in the interactive CLI — 6/6 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "pure internal permission precedence primitive (ui_surfaces n-a), resolved silently; no UI affordance on any surface"
purpose: |
  **Thread-level override** — 특정 sessionId(스레드)에 대해 sandboxPolicy +
  approvalPolicy + approvalsReviewer를 명시 지정한다. 한 스레드는 read-only,
  형제 스레드는 danger-full-access로 병행 운영 가능. ADR-0046 우선순위
  3위(post-denial 다음, per-host 위).

  Codex `heartbeat-thread-permissions-by-id` 매핑의 v3 대응. admissibility-
  gate가 HARD_DENY/HITL 다음, mode-policy 앞에서 consult — opt-in flag
  (config.permissionStack.enabled)로 활성화.
evidence:
  code:
    - src/permission/permission-store.ts
    - src/permission/thread-permission-decode.ts
    - src/permission/per-thread-store.ts
    - src/permission/policy.ts
    - src/agent/admissibility-gate.ts
    - src/agent/types.ts
    - src/shared/runtime-config.ts
  adrs: [29, 46]
  tests:
    unit:
      - tests/unit/permission-per-thread.test.ts
      - tests/unit/admissibility-gate.test.ts
    integration:
      - tests/integration/permission-stack-gate-e2e.test.ts
    contract: []
knobs:
  - name: QUANTA_PERMISSION_STATE
    default: 'undefined'
    purpose: '(no description)'
  - name: QUANTA_HOME
    default: 'undefined'
    purpose: '(no description)'
deliberate_hold: null
notes: |
  영속 파일은 ~/.quanta/permission-state.json. JSON atomic write
  (tmp + rename) + 200ms debounce. 단일 프로세스 가정 — 다중 프로세스
  surface가 생기면 lock-file ADR.
