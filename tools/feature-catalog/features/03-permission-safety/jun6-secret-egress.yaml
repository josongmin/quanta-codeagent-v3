    contract: []
knobs:
  - name: QUANTA_SECRET_EGRESS
    default: 'undefined'
    purpose: egress 모드 토큰(`deny`|`redact`). 다른 값(unset/`1`/`true`) ⇒ undefined(OFF) ⇒ host-only egress 결정(byte-identical). `redact`(마스킹 후 forward)가 legit-but-leaky payload 에 권장. PLAINTEXT-HTTP 한정 — HTTPS CONNECT 는 opaque(MITM deferred).
  - name: QUANTA_SECRET_EGRESS_MAX_BODY
    default: 'undefined'
    purpose: 버퍼링 body 바이트 캡(양의 정수, DoS 가드). 하드코딩 default 없음(no-heuristics). 캡 초과 body 는 `body-cap-unscanned` 마커와 함께 UNSCANNED forward(truncation-block 아님). 부재 ⇒ 와이어가 secret-egress 를 inert 취급.
deliberate_hold:
  reason: |
    HTTPS body/header 스캔(TLS MITM, Codex network.mitm)은 본 슬라이스 범위 밖.
    로컬 신뢰 CA 를 모든 child trust store 에 주입해야 하고 cert-pinned client 를
    깨며 latency + 자체 공격표면이 큼. 본 슬라이스는 PLAINTEXT-HTTP + declared-secret
    커버리지만(실재하는 shippable 클래스). CONNECT 터널은 `connect-tunnel-unscanned`
    decision-log 마커로 갭을 silent 가 아닌 VISIBLE 하게 만듦.
  promotion_path: |
    별도 Phase-2 RFC `docs/plans/jun-6-tls-mitm-egress.md` 가 network.mitm CA
    lifecycle(mint/trust-inject/rotate/revoke) + decrypt→scan→re-originate 전송을
    설계. 기존 `scanEgressText`/`redactDeclared` 코어는 그대로 재사용 —
    transport 만 신규. MITM 경로에선 `connect-tunnel-unscanned` 가 실제 스캔
    disposition 으로 대체됨.
notes: |
  설계/증명: RFC `docs/plans/jun-6-exfil-egress-rails.md` §4.4 (✅ IMPLEMENTED jun-06,
  plaintext-HTTP; HTTPS-MITM 별도 Phase-2 RFC `docs/plans/jun-6-tls-mitm-egress.md`).
  배선: `onRequest` 가 host-allow 후 `config.secretEgress` 존재 시 `scanAndPipeHttp` 로
  분기 — body 버퍼(캡까지) + header 값 스캔 → deny(403)/redact(마스킹+forward)/clean-forward.
  declared 만 in-place redactable(정확 스팬); scanner-only finding 은 안전하게 redact 불가라
  fail-closed(deny). decision-log `secretScan`: scanned-clean|denied|redacted|
  connect-tunnel-unscanned|body-cap-unscanned(advisory 텔레메트리, host verdict 불변).
  reason 문자열은 finding KIND + declared count 만 — 비밀 바이트 절대 미노출.
  hellgate: e2e(declared/AWS-key body deny, header deny, redact origin-sees-mask,
  legit no-FP, CONNECT unscanned VISIBLE, body-cap unscanned, default-OFF byte-identity).
