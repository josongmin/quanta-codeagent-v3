id: secret-aware-egress
title: jun-6 exfil-rail (B) — secret-aware egress (plaintext-HTTP body/header scan; HTTPS opaque)
section: 3
subsystem: Exfil-prevention enforcement — mechanical teeth behind the Data-Exfil taxonomy
order: 482
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env: [QUANTA_SECRET_EGRESS, QUANTA_SECRET_EGRESS_MAX_BODY]
owners: ["@songmin"]
labels: [surface:core, security, security-touched, absorbed:codex]
depends_on: [network-egress-proxy, secret-detection-scanner]
surface_integration:
  cli: full
  web: partial
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "egress proxy scans plaintext-HTTP body/header and denies/redacts on CLI"
    web: "a proxy deny manifests only as the blocked network tool failing, surfaced as a generic tool.completed error; the secretScan decision-log markers are not surfaced to the browser"
purpose: |
  egress 프록시가 HOST 만 보던(`decideEgress`) 것을 OUTBOUND CONTENT 레벨로 확장:
  나가는 BODY + HEADER 값을 기존 `compositeSecretScanner` 로 스캔해 declared/detected
  비밀이 와이어로 나가면 deny/redact(RFC jun-6-exfil-egress-rails (B), Codex
  secret_env_var/network.mitm 흡수). 닫힌 포트 `NetworkProxyConfig.secretEgress`
  ({scanner, mode, declared?, maxBodyBytes})를 `pipeHttp` PLAINTEXT-HTTP 경로에 주입.
  FALSE-POSITIVE 규율(RFC §7 (B)): `declared`(Codex secret_env_var parity) 정확매치 =
  ZERO-FP 1차 신호; 스캐너 pattern/entropy 는 2차 + 기존 `allowlist` 옵트가 known-public
  토큰 드랍; `redact`(스팬 마스킹 후 forward)가 `deny` 보다 권장 default. body cap
  (maxBodyBytes) DoS 가드 — 캡 초과 body 는 UNSCANNED forward(절대 truncation-block 아님)
  + 가시 로그 마커.
  ⚠️ HTTPS 한계(정직): `CONNECT host:443` 은 raw TLS 터널 → 프록시가 암호바이트를
  읽을 수 없음. 따라서 content 스캔은 PLAINTEXT-HTTP egress 에만 적용. HTTPS body/header
  전수 커버리지는 TLS MITM(network.mitm) 필요 = CA-trust 폭발반경 때문에 별도 Phase-2 RFC
  로 DEFERRED. CONNECT 터널은 `connect-tunnel-unscanned` decision-log 마커를 남겨 갭이
  silent 가 아닌 VISIBLE. DEFAULT-OFF byte-identical(secretEgress 부재 ⇒ host-only).
evidence:
  code:
    - src/runtime/network-proxy/secret-egress.ts
    - src/runtime/network-proxy/secret-egress-gate.ts
    - src/runtime/network-proxy/loopback-proxy.ts
    - src/runtime/network-proxy/types.ts
    - src/runtime/network-proxy/index.ts
    - src/shared/runtime-config.ts
  adrs: [490]
  tests:
    unit:
