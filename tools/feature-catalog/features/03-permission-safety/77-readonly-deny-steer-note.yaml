id: readonly-deny-steer-note
title: Readonly deny-steer note — admissibility isReadonly flag appended to steer message
section: 3
subsystem: 권한 게이트 — readonly-aware deny-steer (Plane-C of ADR-0077 trio)
order: 78
maturity: L4
status: stable
owners: ["@songmin"]
labels: [surface:cli]
depends_on: [turn-timing-anchors, llm-assemble, phase-ttft-readonly-trio]
purpose: |
  Plane-C of the `phase-ttft-readonly-trio` umbrella (ADR-0077) — the
  control-plane sibling of Plane-A (phase marker, surfaced via
  `llm-assemble`) and Plane-B (TTFT, surfaced via `turn-timing-anchors`).
  Read-only tool denials get a structured steer note appended so the model
  knows the deny is "policy says don't touch even for read" rather than
  "this would mutate state". `buildDenySteerMessage(decision, isReadonly?)`
  appends `READONLY_DENY_STEER_NOTE` only when `isReadonly === true`;
  unknown / undefined / false fall through verbatim (byte-identical).
  Flag source is the `config.registry.get(call.name)?.isReadOnly()` lookup
  already owned by `denyFromConfirm` in `admissibility-gate.ts` — no
  parallel lookup. `DispatchResult.failure = {mode:"permission_denied",
  isReadonly}` exposes the same flag on the typed failure envelope so
  trajectory / permission consumers can branch on it.
