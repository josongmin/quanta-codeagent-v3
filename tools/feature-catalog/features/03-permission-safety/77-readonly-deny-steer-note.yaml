knobs: []
deliberate_hold: null
notes: |
  Sub-feature of `phase-ttft-readonly-trio` umbrella — separately catalogued
  because the three planes are explicitly orthogonal in the umbrella's own
  purpose statement (data / observability / control), and Planes A+B already
  have dedicated entries (`llm-assemble`, `turn-timing-anchors`). Plane-C is
  the only one that touches the permission/admissibility surface (section 3),
  has its own hellgate test pin (false-positive on null registry entry), and
  its own user-visible artefact (the appended note text).
