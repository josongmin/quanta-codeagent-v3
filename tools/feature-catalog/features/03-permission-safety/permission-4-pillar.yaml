knobs: []
deliberate_hold: null
notes: |
  - 4 pillar은 PermissionProfile struct의 별도 field — discriminated union
    아닌 record 구성. 각 helper는 pure projection이라 합성 cost 0.
  - network.mode=allow-list with empty allowHosts ≡ deny-all (validation
    layer 권장 — 후속 ADR에서 결정).
  - control.managedBy=admin 시 setter API에서 reject (후속 wire-up).
