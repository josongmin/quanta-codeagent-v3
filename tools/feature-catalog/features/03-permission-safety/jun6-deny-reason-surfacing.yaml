id: deny-reason-surfacing
title: C6 — structured deny-reason surfacing (layer/pillar, sanitized-by-construction)
section: 3
subsystem: Permission — typed deny classification for the model
order: 472
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: integrated
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env: [QUANTA_DENY_REASON]
owners: ["@songmin"]
labels: [surface:core, security]
depends_on: [fsjailerror]
purpose: |
  권한 거부가 모델에 free-form prose(`"Permission denied: <prose>"`)로만 도달해 모델이
  영어 string-match 로 분류해야 했던 retry-thrash 실패모드를 제거(RFC jun-6-deny-reason-surfacing C6).
  타입드 `StructuredDenyReason` 을 surface 해 모델/디버거가 결정 `layer`(어느 정책 레이어)·
  `pillar`(어느 보안 기둥)로 분기 가능.

  NO-LEAK 경계(핵심 설계제약, by construction): 구조화 reason 은 OTel/recorder 경로가
  이미 노출하는 것 외 아무것도 안 실음. `safeReason` 은 raw input 으로 새로 만든 문자열이 아니라
  caller 가 이미 `emitGateDecision({reason})`(recorder)에 넘기는 동일 sanitized 한 줄 —
  regex 소스·`action.input`·파일/env 값·매치된 HARD_DENY 룰명이 scrub 된 것(recorder/policy/
  admissibility-gate 계약 보장)을 재사용. 새 누수 채널 0.
evidence:
  code:
    - src/permission/deny-reason.ts
    - src/permission/index.ts
    - src/agent/admissibility-gate.ts
    - src/agent/dispatch.ts
    - src/agent/dispatch-helpers.ts
    - src/tool/types.ts
    - src/shared/runtime-config.ts
  adrs: []
  tests:
    unit:
      - tests/unit/deny-reason-structure-hellgate.test.ts
      - tests/unit/deny-reason-noleak-hellgate.test.ts
      - tests/unit/deny-reason-reachability-hellgate.test.ts
      - tests/unit/deny-reason-wire-e2e-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_DENY_REASON
    default: 'undefined'
    purpose: Strict opt-in (`=== "1"`). OFF 면 `denyReason` 를 omit → 모델-facing deny content 는 기존과 byte-identical(새 필드 없음). ON 이면 타입드 layer/pillar/safeReason 첨부.
deliberate_hold: null
notes: |
  설계/증명: RFC `docs/plans/jun-6-deny-reason-surfacing.md`. ADR 미발행이나 LIVE-wired +
  notes 완비라 L4(adrs>=1 OR notes 게이트 충족).
  배선(LIVE): (1) `admissibility-gate.ts` 의 모든 deny SITE 가 `deny(..., denyReason({layer,
  pillar,safeReason}))` 로 구조화 reason 전달; (2) `dispatch.ts` 의 dispatch-SEAM plan-mode
  block(`runAdmissibilityGate` 보다 먼저 fire 하는 collaboration-mode `mode-blocked` deny)도
  동일 knob-gated `denyReason({layer:mode,pillar:approval})` 첨부 — admissibility-gate
  `denyIfModeBlocked`(`plan-blocked`)와 cross-path layer 일관성 확보; (2b) `dispatch.ts#
  consultDispatchGuard`(ADR-0229, 역시 gate 보다 먼저 fire 하는 두 번째 seam-level permission
  deny: git-write-protect / branch-only / network-egress 검출기 합성)의 `guard-deny`/`guard-ask`
  도 knob-gated `denyReason({layer:stack})` 첨부 — `hardDeny` 부울로 categorical safeReason
  (security boundary vs recoverable posture) 선택, pillar 는 OMIT(GuardDecision 이 어느 검출기가
  fire 했는지 노출 안 해 추측 금지). NO-LEAK: `decision.reason`(path/command/host echo)는
  model-facing content 전용, structured safeReason 은 categorical only; (3) `dispatch-helpers.ts#
  deny()` 가 knob-ON 시 `denyContentPrefix` content 접두 + `ToolFailure.permission_denied.
  denyReason`(@/tool 의 `DenyReasonValue` duck-mirror) 첨부.
  의도적 비배선(permission deny 아님): `localize-phase-blocked`(Phase-1 localization nudge,
  recoverable workflow hint)·`unknown tool`(registry miss)·`dispatch-error`(normalized port throw)
  는 구조화 reason 미첨부 — 보안/권한 거부가 아니라 layer/pillar 분류 대상이 아님.
  NO-LEAK: HARD_DENY(early/handoff/policy-evaluate/stack)는 categorical `hardDenySafeReason()`
  사용(command echo 금지), stack/mode/rule 은 categorical prefix/recorder-reason 만, reviewer/
  hook 은 categorical only. DecisionEvent/OTel(recorder)은 구조화 객체가 아닌 sanitized prose
  `reason`(=safeReason 와 동일 한 줄)만 운반 — 타입드 layer/pillar 는 모델-facing 엔벨로프
  전용(설계상 recorder 표면 확대 0).
  `deny-reason-structure-hellgate` 가 layer/pillar 분류를, `deny-reason-noleak-hellgate` 가
  sanitized-by-construction 을, `deny-reason-reachability-hellgate` 가 REAL admissibility-gate
  통과 knob-ON 도달성(layer→stackSource) + knob-OFF byte-identity + HARD_DENY no-leak 을,
  `deny-reason-wire-e2e-hellgate` 가 PUBLIC `dispatchTool` 엔트리 e2e(seam mode-block 포함)
  knob-ON/OFF + no-leak 을 봉인. default-OFF byte-identical.
