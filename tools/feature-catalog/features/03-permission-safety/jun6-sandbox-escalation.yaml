id: sandbox-escalation
title: jun-6 sandbox-block → escalation-retry loop (denialReason:sandbox-blocked + HITL escape hatch)
section: 3
subsystem: OS-sandbox usability — the user-gated escape hatch that unlocks a future default-ON sandbox
order: 483
maturity: L3
status: refined
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env: [QUANTA_SANDBOX_ESCALATION, QUANTA_SANDBOX_ESCALATION_MAX]
owners: ["@songmin"]
labels: [surface:cli, category:sandbox, security, security-touched, default-off, absorbed:codex]
depends_on: [os-sandbox, post-denial-precedence, hitl-tier-registry, typed-tool-failure-modes]
surface_integration:
  cli: full
  web: partial
  method: audited
  verified: "2026-08-23"
  evidence:
    cli: "runs in the interactive CLI — 19/19 evidence file(s) reachable from src/apps/cli/index.ts import graph"
    web: "the onConfirm escape-hatch can route to the EscalationCard approve|deny path but the sandbox-blocked classification, re-run argv and escalation context ride dropped events; only the collapsed confirm reaches the browser"
purpose: |
  OS sandbox 가 syscall 을 BLOCK 했을 때(=sandbox 가 제대로 작동) 와 일반 명령
  실패를 구분하지 못하던 갭(`SandboxedSpawnResult` 에 denialReason 없음 → block 이
  plain nonzero exit 과 byte-구분불가)을 닫는 RFC jun-6-sandbox-escalation 흡수
  (Codex 0.135 `unix_escalation.rs` + `with_escalated_permissions` + `justification`
  + `ExecPolicyAmendmentExhausted`). 두 절반: (1) `denialReason:"sandbox-blocked"`
  discriminant + 순수 per-platform `classifySandboxDenial` (`src/runtime/os-sandbox/
  denial-classify.ts`), (2) block → 기존 post-denial 3-step 머신(ADR-0046) 경유 →
  유저-게이팅 unsandboxed re-run 의 escalation 루프(`src/agent/sandbox-escalation/`).
  핵심-난이도(정직하게): detection FALSE-POSITIVE 리스크. `classifySandboxDenial` 은
  ALWAYS `sandboxApplied===true` 일 때만 분류; HIGH-confidence = UNAMBIGUOUS 시그널만
  (우리 seccomp 필터 하 SIGSYS / exit-126 denied-exec / EXACT line-anchored Seatbelt-deny
  stderr PREFIX — substring 절대 아님), LOW-confidence = bare EPERM (실제 non-sandbox
  permission 에러와 구분불가) ⇒ DECLINE-able 제안. 미인식 nonzero ⇒ plain failure
  (UNDER-detect over over-escalate). escalation NEVER auto-grants: recordRiskSeen-BEFORE-
  recordUserOverride ordering(타임스탬프, ADR-0046)이 조작된 override 차단; 승인 시
  byte-same argv 를 NORMAL permission gate 통과 후 sandbox wrapper 없이 re-run(한 콜만,
  세션 flip 아님). per-turn cap(`QUANTA_SANDBOX_ESCALATION_MAX`, ExecPolicyAmendmentExhausted
  analog)이 escalate→deny→escalate 스팸 차단. DEFAULT-OFF byte-identical
  (`QUANTA_SANDBOX_ESCALATION` 부재 ⇒ classifier 미호출, denialReason 미설정, prompt
  없음 — sandboxed nonzero exit 이 plain failure 와 byte-동일). NOTE: 이 escape hatch 가
  미래 SAFE default-ON sandbox 를 unlock 하나, `QUANTA_SANDBOX` default-ON flip 은
  별도 결정(OUT OF SCOPE).
