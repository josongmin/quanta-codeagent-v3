labels: [absorbed:codex, surface:cli]
purpose: |
  **8 special path kinds OS-aware resolver.** Codex permission_profile entries는
  `path.type: special` 형태로 root/project/tmpdir/git/agents/quanta/slash_tmp/tmp
  을 named로 표현 — OS별 절대 경로는 resolver가 expand. profile JSON에 호스트
  관례를 박지 않게 함 (cross-OS portable).

  OS별 차이 (단위 테스트로 lock):
  - macOS: `tmpdir` = `/var/folders/abc/T` (sandboxed user-private), `slash_tmp`
    = `/tmp` (shared), `tmp` = tmpdir (sandbox preferred).
  - Linux: `tmpdir` = `/tmp`, `slash_tmp` = `/tmp`, `tmp` = `/tmp`.
  - Win32: `root` = `C:\`, tmpdir/slash_tmp/tmp 모두 `os.tmpdir()` fallback.

  Closed-port: OsPort / CwdPort / GitPort 모두 inject. process.cwd() / os.tmpdir()
  direct 호출 NONE (slice discipline). LRU cache로 95%+ hit rate (per-turn
  resolver는 8 kind만 회전).
