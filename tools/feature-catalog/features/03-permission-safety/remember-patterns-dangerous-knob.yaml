id: remember-patterns-dangerous-knob
title: Remember-patterns dangerous opt-in knob — operator lifts the dangerous-gate ONLY (no-widen holds)
section: 3
subsystem: permission — remember-patterns
order: 30
maturity: L3
status: new
ui_surfaces: [none]
monitoring: n-a
modes: [n-a]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core"]
depends_on: [remember-patterns-propose]
purpose: |
  CLUSTER D #5 residual — closes the hardcoded `allowDangerous:false` at the
  composition root. `resolvePermissionPatternSlice` (host/runtime/agent-arg-builder)
  now reads `QUANTA_REMEMBER_PATTERNS_DANGEROUS` and threads `allowDangerous:<knob>`
  into the propose port's `recordProposedPattern` call. SECURITY (load-bearing):
  the knob lifts ONLY the extra dangerous-gate — the NO-WIDEN gate inside
  `recordProposedPattern` is INDEPENDENT of `allowDangerous`, so a
  dangerous-AND-uncovered proposal is STILL `would_widen` rejected (atomic, no
  laundering). The knob can never let a model self-grant a NEW capability; it only
  records dangerous-flagged proposals that are ALREADY baseline-covered. Inert
  unless `QUANTA_REMEMBER_PATTERNS` is also on (no slice ⇒ no port). Default-OFF ⇒
  dangerous proposals always rejected (reviewer-routed), byte-identical.
evidence:
  code:
    - src/host/runtime/agent-arg-builder.ts
    - src/permission/gate-pattern-wire.ts
    - src/shared/runtime-config.ts
  adrs: [61]
  tests:
    unit:
      - tests/unit/remember-patterns-dangerous-knob-hellgate.test.ts
      - tests/unit/permission-propose-pattern-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_REMEMBER_PATTERNS_DANGEROUS
    default: 'unset (off)'
    purpose: 'operator opt-in to RECORD dangerous-flagged but baseline-covered proposals; no-widen still enforced'
notes: 'Coordinate-safe: only the composition-root knob read + threading changed, NOT the propose tool internals.'
