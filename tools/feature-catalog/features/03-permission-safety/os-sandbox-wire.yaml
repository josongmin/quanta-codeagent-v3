id: os-sandbox-wire
title: OS Sandbox wire-up — bash spawn wrapped by Seatbelt/Landlock policy
section: 3
subsystem: OS-level process confinement
maturity: L4
status: new
ui_surfaces: [n-a]
monitoring: n-a
modes: [n-a]
configurable: integrated
config_refs:
  env: [QUANTA_SANDBOX]
owners: ["@songmin", "team-safety"]
labels: [absorbed:codex, surface:cli, security-touched]
depends_on: [sandbox-policy, seatbelt-profile-compiler, landlock-degraded-passthrough, os-sandbox-port-router, landlock-phase2]
purpose: |
  `defaultOsSandbox()` (macOS Seatbelt + Linux Landlock stub + Windows
  passthrough) is wired into the bash spawn path via a module-level
  `ShellSandboxSlot` seam in `@/runtime` (`installShellSandbox` /
  `getShellSandbox`). `QUANTA_SANDBOX` env is now a real policy switch
  (previously UI-pill only): the CLI surface (`apps/cli/sandbox-wire.ts`)
  resolves the env at boot in `apps/cli/index.ts` and installs the slot.
  Default-OFF: byte-identical to pre-S1 when `QUANTA_SANDBOX` unset /
  `"default"` / `"off"` / empty (slot stays uninstalled; `runShell` argv is
  the legacy `["bash","-lc",cmd]` verbatim). HARD_DENY still runs in the
  permission layer BEFORE bash spawn (defense-in-depth, not substitute).
  Linux Landlock surfaces a one-line `logger.warn` at startup so the
  operator knows their requested sandbox degraded to passthrough.
  Anti-leak: the SBPL profile text only flows INTO the spawn argv; it never
  appears in the tool result or operator-facing error messages — degrade
  reasons are opaque stable tags ("sandbox-exec-missing",
  "landlock-not-implemented", "unsupported-platform:<plat>").
evidence:
  code:
    - src/runtime/os-sandbox/index.ts
    - src/runtime/os-sandbox/seatbelt.ts
    - src/runtime/os-sandbox/wrap-argv.ts
    - src/runtime/os-sandbox/default.ts
    - src/runtime/shell-sandbox-holder.ts
    - src/runtime/shell.ts
    - src/apps/cli/sandbox-wire.ts
    - src/apps/cli/index.ts
    - src/tool/bash/index.ts
  adrs: []
  tests:
    unit:
      - tests/unit/cli/os-sandbox-wire-hellgate.test.ts
      - tests/unit/cli/os-sandbox-default-byte-identical-hellgate.test.ts
      - tests/unit/bash.test.ts
      - tests/unit/os-sandbox-bubblewrap-hellgate.test.ts
      - tests/unit/os-sandbox-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - QUANTA_SANDBOX
deliberate_hold: null
notes: |
  Wire seam intentionally NOT routed through `ToolContext`: the central
  build site lives in `src/agent/dispatch.ts` (WIP hot-zone during S1). A
  module-level slot in `@/runtime` keeps the wire surface to non-WIP files.
  When the dispatch slice stabilises, the slot can be migrated to a typed
  `ToolContext.osSandbox` port without breaking the existing callers (the
  slot reader stays as a fallback).
