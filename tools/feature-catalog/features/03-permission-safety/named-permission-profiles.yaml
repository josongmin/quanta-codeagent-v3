id: named-permission-profiles
title: Named permission-profile registry + by-name resolution
section: 3
subsystem: 권한 — named profile registry (Codex 0.135 [permissions].default_permissions 흡수)
order: 7
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: n-a
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
owners: ["@songmin"]
labels: ["surface:core", "security-touched"]
depends_on: [sandbox-policy]
surface_integration:
  cli: full
  web: missing
  method: audited
  verified: "2026-06-09"
  evidence:
    cli: "--permission-profile flag / QUANTA_PERMISSION_PROFILE env resolved at CLI boot (src/apps/agent/cli-args.ts)"
    web: "profile selection mechanism is a CLI flag/env; no web verb; QUANTA_PERMISSION_PROFILE only appears as a redacted read-only KnobsPanel row, enforcement silent"
purpose: |
  The 2026-06-01 gap audit found we had DEFAULT_PERMISSION_PROFILE (a single struct)
  and a session-envelope enum ["default","trusted","restricted","custom"], but NO
  registry mapping a name → concrete PermissionProfile, so TwoLayerManager only took
  a struct directly. This adds the closed NAMED_PROFILES registry (escalating
  restricted ⊂ default ⊂ trusted) + resolveProfileByName(name) + a by-name setter on
  TwoLayerManager (struct API kept for backward-compat). The envelope's enum∪struct
  field resolves to a concrete struct on decode via resolvePermissionProfileField
  (struct → passthrough, "custom" → locked-down default, unknown name → fail-closed throw).
  Matches Codex's [permissions] default_permissions = "profile_name" concept.
evidence:
  code:
    - src/permission/named-profiles.ts
    - src/permission/two-layer-manager.ts
    - src/permission/profile-to-context.ts
    - src/permission/index.ts
    - src/apps/agent/cli-args.ts
    - src/apps/agent/index.ts
    - src/sdk/runtime/base.ts
  adrs: []
  tests:
    unit:
      - tests/unit/permission/named-profiles-hellgate.test.ts
      - tests/unit/permission/named-profile-session-wire-hellgate.test.ts
      - tests/unit/permission-profile-to-context-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_PERMISSION_PROFILE env / --permission-profile flag
    default: 'undefined'
    purpose: 'session-start profile selection (default|restricted|trusted); flag wins over env; unknown ⇒ fail-closed exit'
  - name: profile.approval.mode → PermissionContext.mode (derive)
    default: 'acceptEdits (absent profile)'
    purpose: 'GAP-CLOSED: trusted(auto)→auto, default/restricted→default; behavior-LIVE via the loop''s existing permission gate'
  - name: TwoLayerManager.setPermissionProfileByName
    default: 'n-a'
    purpose: 'resolve a registered name → struct; forward-compat per-thread slot (fileSystem axis)'
deliberate_hold:
  reason: |
    GAP CLOSED 2026-06-02: the named profile is now behavior-LIVE, not orphaned. The deep
    map showed PermissionProfile is largely redundant with existing enforcement (network =
    A1 dispatch-guard, approval = evaluateStack), so the non-duplicating wire is to DERIVE
    the loop's existing PermissionContext.mode from profile.approval.mode at session start
    (src/permission/profile-to-context.ts permissionModeFromProfile). The TwoLayerManager
    is still PUBLISHED as a forward-compat per-thread slot for the ONE unenforced axis
    (fileSystem — not dispatch-time-enforceable since tool input carries no path). HOLD
    remaining: fileSystem-axis enforcement + a settings-file [permissions.profiles] loader.
  promotion_path: |
    A runtime-execute-time fileSystem gate (canAccess at tool execution, not dispatch) to
    light up profile.fileSystem; then a settings-file profile loader + scope-precedence
    resolver (managed > project > user > open). The approval axis is already live.
notes: |
  fail-closed: unknown profile name throws rather than silently falling back, so a
  typo can never widen permissions. "custom" maps to the locked-down default until a
  struct is supplied.
