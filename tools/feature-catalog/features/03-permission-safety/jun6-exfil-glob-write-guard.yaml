id: exfil-glob-write-guard
title: jun-6 exfil-rail (b) — glob-in-write guard (write/edit reject glob path)
section: 3
subsystem: Exfil-prevention enforcement — mechanical teeth behind the Data-Exfil taxonomy
order: 480
maturity: L3
status: new
ui_surfaces: [cli]
monitoring: integrated
modes: [interactive, headless, batch, daemon, ide, ci-bot]
configurable: integrated
config_refs:
  env: [QUANTA_GLOB_WRITE_GUARD]
owners: ["@songmin"]
labels: [surface:core, security, security-touched, absorbed:claude]
depends_on: [git-write-protection, typed-tool-failure-modes, agent-dispatch-core]
purpose: |
  write/edit 가 glob/wildcard path(`src/**/*.ts`, `a/*.js`, `{a,b}.txt`)를
  리터럴 파일명으로 받아 이상한 단일파일을 만들거나 jail 에러로 떨어지던 fan-out 벡터를
  타입드 거부로 닫음(RFC jun-6-exfil-egress-rails (b), Claude CLI exfil-rail 흡수).
  순수 leaf `pathLooksLikeGlob(path)`(`src/tool/_shared/glob-in-path.ts`)는
  UNAMBIGUOUS glob 토큰만 발화: `*`·`?`·`{a,b}` brace EXPANSION(여는 `{` 의 매칭 `}`
  사이에 콤마가 있는 것만 — depth-tracked 선형 스캔). `[…]` bracket class 는
  의도적 미발화(`file[1].txt`/`arr[0].json` 는 실제 파일명이고 class 는 단일문자만
  매칭 → fan-out 불가) = 문서화된 no-false-positive 결정. `ctx.globWriteGuard === true`
  (dispatch 가 `QUANTA_GLOB_WRITE_GUARD=1` 에서 thread)이면 fs 호출 전에 정적 거부 —
  타입드 `{mode:"rejected", reason:"glob_in_write_path"}` + verbatim cc-cli 메시지
  ("Glob patterns are not allowed in write operations. Please specify an exact file path.").
  부분쓰기 0(git-write-guard 와 동일 posture). DEFAULT-OFF byte-identical(플래그 부재 ⇒
  glob path 가 기존처럼 리터럴 파일명으로 처리됨).
evidence:
  code:
    - src/tool/_shared/glob-in-path.ts
    - src/tool/_shared/glob-write-gate.ts
    - src/tool/_shared/exfil-rail-guards.ts
    - src/tool/write/index.ts
    - src/tool/edit/index.ts
    - src/tool/types.ts
    - src/agent/dispatch.ts
    - src/shared/runtime-config.ts
  adrs: []
  tests:
    unit:
      - tests/unit/exfil-rails-glob.test.ts
      - tests/unit/exfil-rails-gates.test.ts
      - tests/unit/exfil-rails-dispatch-wire-hellgate.test.ts
    integration: []
    contract: []
knobs:
  - name: QUANTA_GLOB_WRITE_GUARD
    default: 'undefined'
    purpose: Strict opt-in (`=== "1"`). OFF 면 write/edit 가 glob path 를 리터럴 파일명으로 수용(byte-identical). ON 이면 glob path 를 verbatim 메시지로 타입드 거부. RFC 상 soak 후 default-ON 강력 후보지만 byte-identity 위해 default-OFF 출시.
deliberate_hold: null
notes: |
  설계/증명: RFC `docs/plans/jun-6-exfil-egress-rails.md` §4.2 (✅ IMPLEMENTED jun-06).
  ADR 미발행이나 LIVE-wired + hellgate 완비라 L3(tested + wired).
  배선: write `writeStaticDeny`(git-write-guard ?? glob-guard, fs 호출 전), edit
  `editStaticDeny` 동일; dispatch `buildToolContext` 가 `runtimeConfig().globWriteGuard`
  를 `ToolContext.globWriteGuard` 플래그로 thread(default-OFF ⇒ 필드 omit ⇒ byte-identical).
  no-false-positive: `pathLooksLikeGlob` 가 `[…]` 클래스/콤마없는 `{}` 미발화 —
  `exfil-rails-glob.test.ts` 가 `file[1].txt`/`arr[0].json`/`weird{}name.txt` allow 봉인.
  `exfil-rails-dispatch-wire-hellgate.test.ts` 가 PUBLIC dispatchTool e2e(OFF ⇒ glob
  리터럴 write / ON ⇒ rejected) 봉인.
