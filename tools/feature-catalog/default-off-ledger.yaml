    # jul-18 wire-attempt AUDIT (agent-loop investigation): held DELIBERATELY, not
    # by neglect. The live abort path is a plain AbortSignal — composition root
    # `new AbortController()` (bootstrap-session.ts:432) → `abort.signal` →
    # `config.signal` (types.ts:170) → `llm.stream({signal})` (stream-consume.ts:371)
    # + `streamingTurn({signal})` (stream-consume.ts:389). 33 bare `.abort()`
    # producers across CLI/host/bench/headless/web feed it; NO downstream consumer
    # reads a typed cancel cause off the loop's abort — cause is re-derived post-hoc
    # from WHICH signal fired (`classifyTurnAbort` turn-gate.ts:34, `interruptedCategory`
    # stop-category.ts:309). The primitive's 3 unique offerings are all currently
    # unconsumed: (a) typed cause — no `cancel_rate{cause}` metric / recorder envelope
    # wants it; (b) cleanup orchestration — teardown is owned by `ctx.disposeResources`
    # (entry.ts:121, finally-guarded both paths); (c) partial salvage — the loop's
    # own drop-oldest/conversation-cancel capture already handles partial turns.
    # Wiring `toAbortSignal(controller.signal)` into `config.signal` today would
    # DUPLICATE the abort-propagation mechanism while every producer still calls the
    # bare `.abort()` (the cause channel would latch nothing) → VACUOUS wire. The
    # live user-abort cause already flows through the sibling mid-turn-interruption
    # slice (`MidTurnCancelCause`, default.ts:96-134), which IS wired
    # (mid-turn-capture-wire.ts, QUANTA_MIDTURN_CAPTURE). Promotion is GATED on a
    # real cause CONSUMER landing first (metrics counter or recorder outcome envelope)
    # + retrofitting the 33 producers to `cancel(cause)`; until then a wire is
    # dead-wire-risk, so this stays catalogued-not-hidden with its reason.
