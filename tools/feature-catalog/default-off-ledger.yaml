  QUANTA_SUBAGENT_INTROSPECT: subagent-introspect-tools
  QUANTA_COVERAGE_TOOL: code-coverage
  QUANTA_PROMPT_CACHE_STATUS: prompt-cache-observability
  QUANTA_SIDE_AGENT: background-side-agent

row_defaults:
  unknown: &unknown_row
    gate_owner: [unknown]
    activation: unknown
    effective_default: { cli: unknown, web: unknown, bench: unknown, headless: unknown, daemon: unknown }
    reachability: unknown
    proof: { on: unknown, off_identity: unknown, receipt: null }
    risk: unknown
    decision: unknown
    owner_seam: unknown
    rollback: unknown
    duplicate_of: null
    lifecycle_evidence: null
  cli_on: &cli_on_row
    gate_owner: [unknown]
    activation: host-seeded
    effective_default: { cli: on, web: unknown, bench: unknown, headless: unknown, daemon: unknown }
    reachability: unknown
    proof: { on: unknown, off_identity: unknown, receipt: null }
    risk: unknown
    decision: unknown
    owner_seam: unknown
    rollback: explicit gate value other than 1
    duplicate_of: null
    lifecycle_evidence: null

