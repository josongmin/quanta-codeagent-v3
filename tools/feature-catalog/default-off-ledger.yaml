  QUANTA_TEAM_IDLE: team-idle-barrier-coordination
  QUANTA_SUBAGENT_FOLLOWUP: subagent-introspect-tools
  QUANTA_AT_AUTOCOMPLETE: at-mention-autocomplete
  QUANTA_EXTERNAL_EDITOR: external-editor-compose
  QUANTA_KEYBINDINGS: keybindings-config
  QUANTA_RATELIMIT_NOTICE: ratelimit-snapshot-render
  QUANTA_MODE_CYCLE: mode-cycle-pill
  QUANTA_MIDTURN_CAPTURE: mid-turn-interruption
  QUANTA_MIDTURN_VISIBLE: mid-turn-interruption
  QUANTA_PREFLIGHT_CHECK: cli-jun11-repl-input-ux
  QUANTA_BRACKETED_PASTE: cli-jun11-repl-input-ux
  QUANTA_CONVERSATION_ACTIONS: conversation-action-steering
