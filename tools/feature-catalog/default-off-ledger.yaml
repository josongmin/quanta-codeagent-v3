version: 1
scope:
  catalog_label: default-off
  include_runtime_cli_seed_features: true
  limitations:
    - The bounded denominator is the union of catalog rows labelled default-off and mapped live CLI seed owners.
    - Campaign-wide exclusions are not yet structured in the catalog, so this ledger does not claim all 1027 rows are classified.
    - Unknown is retained where no current runtime or receipt authority was established; null receipts do not inherit prose counts.

runtime_cli_seed_mappings:
  QUANTA_ENABLE_ENV_PROBE: env-probe
  QUANTA_STALE_READ_GUARD: stale-read-guard
  QUANTA_UNTRUSTED_ENVELOPE: untrusted-source-envelope
  QUANTA_READ_DEDUP: read-file-unchanged-dedup
  QUANTA_TEAM_DAG: team-dag-coordination
