<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trajectory Viewer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f7;
  --sidebar-bg:#fafafa;
  --chat-bg:#f5f5f7;
  --border:#e0e0e8;
  --border-soft:#eaeaf0;
  --text:#1a1a2e;
  --text-dim:#6b6b80;
  --text-faint:#aaaabc;
  --mono:"Menlo","Monaco","Cascadia Code",ui-monospace,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-family:var(--sans);font-size:13px;color:var(--text);
}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--bg)}
/* ─────────────────── TOPBAR ─────────────────── */
#topbar{
  display:flex;align-items:center;gap:10px;padding:0 16px;height:42px;
  background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
#topbar h1{font-size:12px;font-weight:700;color:#5555aa;letter-spacing:.06em;text-transform:uppercase}
#load-status{font-size:11px;color:#9090b0;margin-left:4px}
#drop-label{
  padding:4px 12px;border:1px solid #d0d0e0;border-radius:6px;
  cursor:pointer;color:#7070a0;font-size:11px;font-weight:500;transition:all .15s;background:#fff;
}
#drop-label:hover{border-color:#5555aa;color:#5555aa;background:#f0f0fa}
#file-input{display:none}
#lang-switch{display:flex;gap:2px;border:1px solid #d8d8e8;border-radius:6px;overflow:hidden;margin-left:auto}
#lang-switch span{padding:3px 8px;font-size:10px;font-weight:400;cursor:pointer;color:#b0b0c8;transition:all .12s}
#lang-switch span:hover{background:#f0f0fa;color:#5555aa}
/* ─────────────────── LAYOUT ─────────────────── */
#layout{display:flex;flex:1;overflow:hidden}
/* ─────────────────── SIDEBAR ─────────────────── */
#sidebar{
  width:220px;background:var(--sidebar-bg);display:flex;flex-direction:column;
  overflow:hidden;flex-shrink:0;border-right:1px solid var(--border);
}
#sidebar-head{
  padding:10px 12px 8px;font-size:9px;font-weight:700;color:#a0a0b8;
  text-transform:uppercase;letter-spacing:.12em;border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;gap:6px;
}
#instance-list{flex:1;overflow-y:auto;padding:4px 0}
.inst-item{
  padding:9px 10px 9px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;
  border-left:2px solid transparent;transition:background .1s;position:relative;
}
.inst-item:hover{background:#f0f0f8}
.inst-item.active{background:#eeeef8;border-color:#5566cc}
.inst-seq{
  width:18px;height:18px;border-radius:4px;background:#f0f0f8;border:1px solid #d8d8e8;
  font-size:9px;font-weight:700;color:#a0a0c0;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;margin-top:2px;font-family:var(--mono);
}
.inst-item.active .inst-seq{background:#e0e0f8;border-color:#8899dd;color:#4455aa}
.inst-info{min-width:0;flex:1}
.inst-name-row{display:flex;align-items:center;gap:4px;min-width:0}
.inst-name{font-size:12px;font-weight:600;color:#7070a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.inst-item.active .inst-name{color:#2233aa}
.inst-gh-link{font-size:10px;color:#b0b0c8;text-decoration:none;flex-shrink:0;opacity:0;transition:opacity .12s}
.inst-item:hover .inst-gh-link,.inst-item.active .inst-gh-link{opacity:1}
.inst-item.active .inst-gh-link{color:#8899dd}
.sb-filter-bar{display:flex;gap:4px;padding:6px 8px 4px;border-bottom:1px solid #e8e8f0}
.sb-flt{font-size:10px;padding:2px 7px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer;color:#888;font-weight:600}
.sb-flt.active{background:#eeeef8;border-color:#8899dd;color:#4455aa}
.sb-flt-pass{color:#2e7d32}.sb-flt-pass.active{background:#e8f5e9;border-color:#81c784;color:#2e7d32}
.sb-flt-fail{color:#c62828}.sb-flt-fail.active{background:#fdecea;border-color:#ef9a9a;color:#c62828}
.inst-verdict-dot{font-size:10px;flex-shrink:0}
.vd-pass{color:#4caf50}.vd-fail{color:#f44336}.vd-none{color:#ccc}
.inst-repo{font-size:10px;color:#c0c0d0;margin-top:1px;font-family:var(--mono)}
.inst-item.active .inst-repo{color:#8888b0}
.inst-stat{font-size:10px;color:#c0c0d0;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.inst-item.active .inst-stat{color:#9090b8}
.inst-phase-bar{display:flex;gap:1px;margin-top:5px}
.phase-dot{width:6px;height:3px;border-radius:1px;background:#e0e0ea}
.phase-dot.loc{background:#88aadd}
.phase-dot.exp{background:#aa88dd}
.phase-dot.rep{background:#ddaa44}
.phase-dot.ver{background:#44bb66}
.phase-dot.sub{background:#22cc55}
/* ─────────────────── CENTER PANEL ─────────────────── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
/* ─────────────────── DROP ZONE ─────────────────── */
#dropzone{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;cursor:pointer;background:#f5f5f7;
}
#dropzone.drag-over{background:#eeeef8}
#dropzone-icon{font-size:40px;opacity:.25}
#dropzone p{font-size:15px;color:#9090b0}
#dropzone small{font-size:11px;font-family:var(--mono);color:#c0c0d0}
/* ─────────────────── CHAT+PROMPT SPLIT ─────────────────── */
#workspace{flex:1;display:flex;overflow:hidden}
/* center chat */
#chat-col{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
  border-right:1px solid var(--border);min-width:0;background:#f9f9fb;
}
/* right prompt panel */
#prompt-panel{
  width:360px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;
  background:#fff;
}
#prompt-panel.hidden{display:none}
/* ─────────────────── INSTANCE HEADER ─────────────────── */
#inst-header{
  flex-shrink:0;padding:12px 20px 10px;
  background:#fff;border-bottom:1px solid var(--border);
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
#inst-title{font-size:14px;font-weight:700;color:#2233aa;margin-bottom:8px;font-family:var(--mono);display:flex;align-items:center;gap:6px}
#inst-title span.repo{color:#9090b8;font-weight:400;margin-right:0}
.issue-link{font-size:12px;color:#9090c0;text-decoration:none;padding:1px 5px;border:1px solid #d0d0e8;border-radius:4px;background:#f4f4fc;transition:all .12s;flex-shrink:0}
.issue-link:hover{color:#3355cc;border-color:#8899dd;background:#eeeeff}
.meta-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}
.stat-chip{
  display:inline-flex;align-items:center;gap:3px;padding:2px 8px;
  border-radius:20px;font-size:10px;background:#f0f0f8;border:1px solid #ddddef;color:#8888a8;
}
.stat-chip b{color:#5555a0;font-weight:600}
.file-row{display:flex;flex-wrap:wrap;gap:3px}
.fc{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:3px;font-family:var(--mono);font-size:10px}
.fc.ed{background:#fff8ee;color:#aa6600;border:1px solid #eecc88}
.fc.rd{background:#eef2ff;color:#4466bb;border:1px solid #c8d4f8}
/* ─────────────────── CHAT SCROLL ─────────────────── */
#chat-scroll{flex:1;overflow-y:auto;padding:0 20px 60px}
/* system prompt inline banner */
.sys-block{
  margin:16px 0 4px;border:1px solid #e4e4ee;border-radius:8px;
  overflow:hidden;background:#fafafa;
}
.sys-block-hd{
  display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;
  font-size:10px;color:#b0b0c8;user-select:none;
}
.sys-block-hd:hover{background:#f4f4fc}
.sys-block.open .sys-block-hd{border-bottom:1px solid #e4e4ee;color:#7070a0}
.sys-block-label{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:9px;color:#b0b0c8;flex-shrink:0}
.sys-block.open .sys-block-label{color:#7070a0}
.sys-preview{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:10px;color:#c8c8d8}
.sys-chev{font-size:8px;transition:transform .12s;flex-shrink:0;color:#c0c0d0}
.sys-block.open .sys-chev{transform:rotate(90deg)}
.sys-block-body{display:none;padding:10px 14px;font-family:var(--mono);font-size:10.5px;color:#7080a0;white-space:pre-wrap;line-height:1.6;background:#f8f8fd}
.sys-block.open .sys-block-body{display:block}
/* ─────────────────── TURN GROUP ─────────────────── */
.turn-group{margin-top:8px}
/* ── group-chat timeline: 🧑 나(right) · 🛰 Quanta(left) · 🤖 LLM(left) ── */
.chat-row{display:flex;gap:9px;margin:12px 0;align-items:flex-start}
.chat-row.me{flex-direction:row-reverse}
.chat-av{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.chat-av.me{background:linear-gradient(135deg,#5566cc,#6a5acd)}
.chat-av.quanta{background:linear-gradient(135deg,#4d879c,#37627a);font-size:13px}
.chat-av.llm{background:linear-gradient(135deg,#20a39a,#177a86);font-size:10px;font-weight:700;letter-spacing:-.02em}
.chat-col{min-width:0;max-width:82%;display:flex;flex-direction:column}
.chat-row.me .chat-col{align-items:flex-end}
.chat-hd{display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap}
.chat-row.me .chat-hd{flex-direction:row-reverse}
.chat-name{font-size:11px;font-weight:700}
.chat-name.me{color:#5566cc}
.chat-name.quanta{color:#37627a}
.chat-name.llm{color:#1f8a86}
.chat-tag{font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:8px;padding:1px 7px}
.chat-tag.quanta{background:#e9f2f5;color:#4d879c;border:1px solid #cfe1e7}
.chat-tag.llm{background:#e6f6f4;color:#1f8a86;border:1px solid #c5e6e2}
.chat-tag.me{background:#eceefb;color:#5566cc;border:1px solid #d5d9f5}
.chat-time{font-size:9px;color:#c0c0d0;font-family:var(--mono)}
.chat-tok,.chat-dur{font-size:9px;color:#b8b8cc;font-family:var(--mono)}
.chat-bubble{
  border-radius:14px;padding:9px 13px;font-size:12.5px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;
}
.chat-bubble.me{background:#5566cc;color:#fff;border-radius:14px 14px 3px 14px;box-shadow:0 1px 3px rgba(85,102,204,.25)}
.chat-bubble.quanta{background:#eef4f6;border:1px solid #d5e4e8;color:#33586a;border-radius:3px 14px 14px 14px}
.chat-bubble.llm{background:#fff;border:1px solid #e2e2ee;color:#2a2a3a;border-radius:3px 14px 14px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
/* clamp long prompts: show the top, fade, expand inline via 더보기 */
.chat-bubble.clamp{max-height:210px;overflow:hidden;position:relative}
.chat-bubble.clamp.expanded{max-height:none}
.clamp-fade{position:absolute;left:0;right:0;bottom:0;height:44px;pointer-events:none}
.chat-bubble.me .clamp-fade{background:linear-gradient(rgba(85,102,204,0),#5566cc)}
.chat-bubble.quanta .clamp-fade{background:linear-gradient(rgba(238,244,246,0),#eef4f6)}
.chat-bubble.llm .clamp-fade{background:linear-gradient(rgba(255,255,255,0),#fff)}
.chat-bubble.clamp.expanded .clamp-fade{display:none}
.payload-hd{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5a8092;margin-bottom:4px;align-self:flex-end;font-family:var(--mono)}
.msg-send-tag{font-size:9px;font-weight:700;letter-spacing:.05em;color:#8a93a8;margin-bottom:5px;align-self:flex-end}
.chat-bubble.quanta.clamp{font-family:var(--mono);font-size:11px;line-height:1.55}
.more-btn{font-size:10px;font-weight:600;color:#7788bb;cursor:pointer;padding:3px 4px;margin-top:2px;user-select:none;align-self:flex-start}
.chat-row.me .more-btn{align-self:flex-end}
.more-btn:hover{color:#5566cc;text-decoration:underline}
/* Quanta's process view — its work, framed as reasoning not a chat bubble */
/* pinned run summary — scaffold verdict hoisted to the top */
.run-summary{margin:6px 0 10px;border:1px solid #dbe2ea;border-radius:11px;background:linear-gradient(180deg,#fbfcfe,#f4f7fb);padding:11px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.rs-hd{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7a8aa0;margin-bottom:8px}
.rs-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.rs-chip{font-size:11px;font-weight:600;color:#4a5a70;background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:3px 9px}
.rs-chip.rs-ok{background:#eefaf1;border-color:#bfe3c9;color:#2f8f5b}
.rs-chip.rs-fail{background:#fdf1f1;border-color:#f0cccc;color:#c0504a}
.rs-note{font-size:9.5px;color:#a8b0c0;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* scaffold action strip (Quanta's mechanical, non-LLM actions: verify/patch/…) */
.scaffold-act{margin:10px 0 10px auto;max-width:88%;border:1px solid #dde3ea;border-radius:9px;background:#fbfcfe;overflow:hidden}
.scaffold-act.act-ok{border-color:#bfe3c9;background:#f5fbf6}
.scaffold-act.act-fail{border-color:#f0cccc;background:#fdf6f6}
.act-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:11px;font-weight:600;color:#4a5a70;cursor:default}
.scaffold-act .act-hd[onclick]{cursor:pointer}
.act-icon{font-size:13px}
.act-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-ok .act-name{color:#2f8f5b}
.act-fail .act-name{color:#c0504a}
.act-time{font-size:9px;color:#b8b8cc;font-family:var(--mono)}
.act-chev{font-size:8px;color:#b0b8c8;transition:transform .12s}
.scaffold-act.open .act-chev{transform:rotate(90deg)}
.act-body{display:none;padding:0 12px 10px}
.scaffold-act.open .act-body{display:block}
.act-sub{font-size:10.5px;color:#6a7688;font-family:var(--mono);white-space:pre-wrap;margin-bottom:6px}
.act-log{font-size:10px;color:#5a6678;background:#f3f5f8;border:1px solid #e2e6ee;border-radius:6px;padding:8px 10px;white-space:pre-wrap;overflow-x:auto;margin:0}
.agent-proc{border-left:2px solid #b8d4dc;background:#f6fafb;border-radius:0 8px 8px 0;padding:8px 10px 4px;margin-bottom:6px}
.agent-proc-label{font-size:9px;font-weight:700;color:#5a8092;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
/* per-turn system prompt (agent → LLM role framing), collapsed */
.sys-inline{border:1px dashed #d2dde2;border-radius:8px;background:#f8fbfc;margin-bottom:6px;overflow:hidden}
.sys-inline-hd{display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:pointer;font-size:10px;color:#6a8a98;font-family:var(--mono)}
.sys-inline-hd:hover{background:#eef5f7}
.sys-inline-chev{font-size:8px;color:#a8c0ca;transition:transform .12s}
.sys-inline.open .sys-inline-chev{transform:rotate(90deg)}
.sys-inline-body{display:none;padding:8px 12px;margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:10.5px;line-height:1.6;color:#5a7280;border-top:1px dashed #d2dde2;background:#fbfdfe}
.sys-inline.open .sys-inline-body{display:block}
/* ── phase band (localize / repro / repair group header) ── */
.phase-band{
  position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;
  margin:26px 0 4px;padding:6px 12px;border-radius:7px;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;
  background:#eef0fb;border:1px solid #dfe2f4;color:#5560a8;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.phase-band:first-child{margin-top:4px}
.phase-band .pb-icon{font-size:12px}
.phase-band .pb-count{margin-left:auto;font-weight:400;opacity:.6;text-transform:none;letter-spacing:0}
.phase-band.ph-localize{background:#eaf3ff;border-color:#cfe2fb;color:#3f74b8}
.phase-band.ph-repro{background:#eafaf1;border-color:#c9ecd6;color:#2f8f5b}
.phase-band.ph-repair{background:#fff3e8;border-color:#f4ddc4;color:#b0743a}
.phase-band.ph-verify{background:#f3eefb;border-color:#e2d3f4;color:#8552b0}
/* ── user bubble ── */
.user-bubble-wrap{display:flex;justify-content:flex-end;margin-bottom:6px}
.user-bubble{
  max-width:88%;background:#5566cc;border-radius:16px 16px 3px 16px;
  padding:10px 14px;font-size:12.5px;color:#fff;line-height:1.65;white-space:pre-wrap;
  word-break:break-word;position:relative;box-shadow:0 1px 3px rgba(85,102,204,.25);
}
/* 나(User) = indigo (the charter). 에이전트(Agent) = slate-teal (prompt delivery). */
.user-bubble.role-user{background:#5566cc;box-shadow:0 1px 3px rgba(85,102,204,.25)}
.user-bubble.role-agent{background:#4d879c;box-shadow:0 1px 3px rgba(77,135,156,.22)}
.bubble-role{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:700;color:rgba(255,255,255,.72);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.bubble-role .br-ava{font-size:12px}
.bubble-meta{
  font-size:9px;color:rgba(255,255,255,.4);text-align:right;margin-top:6px;font-family:var(--mono);
  display:flex;justify-content:flex-end;gap:8px;
}
/* ── tool results bubble ── */
.tool-results-bubble{
  background:#edfaee;border:1px solid #b8e8bb;border-radius:16px 16px 3px 16px;
  padding:8px 12px;font-size:11px;color:#2a7a2a;max-width:88%;margin-left:auto;
  margin-bottom:6px;font-family:var(--mono);
}
.tr-item{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer;border-radius:3px}
.tr-item:hover{background:#ddf4de}
.tr-chev{font-size:8px;color:#88aa88;transition:transform .12s;flex-shrink:0}
.tr-item.open .tr-chev{transform:rotate(90deg)}
.tr-preview{font-size:10px;color:#4a8a4a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tr-body{display:none;padding:6px 4px 2px;white-space:pre-wrap;color:#3a6a3a;font-size:10.5px;border-top:1px solid #b8e8bb;margin-top:4px}
.tr-item.open+.tr-body{display:block}
/* ── assistant bubble ── */
.asst-bubble-wrap{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.asst-avatar{
  width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px;
  box-shadow:0 2px 6px rgba(102,126,234,.3);
}
/* LLM avatar = model thumbnail (the model's initial, e.g. gpt-5.5 → "5.5") */
.asst-avatar.llm{
  background:linear-gradient(135deg,#20a39a,#177a86);font-size:10px;font-weight:700;
  color:#fff;letter-spacing:-.02em;box-shadow:0 2px 6px rgba(23,122,134,.32);
}
.asst-col{flex:1;min-width:0}
.asst-name-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.asst-name{font-size:11px;font-weight:700;color:#1f8a86}
.asst-llm-tag{font-size:8px;font-weight:700;color:#9ab;letter-spacing:.09em;text-transform:uppercase;border:1px solid #cfe4e2;border-radius:8px;padding:1px 6px}
.turn-ts{font-size:10px;color:#c0c0d0;font-family:var(--mono)}
.turn-dur{font-size:10px;color:#c8c8d8;font-family:var(--mono)}
.phase-badge{
  padding:2px 8px;border-radius:12px;font-size:9px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;
}
.phase-badge.localize{background:#e8f0ff;color:#3366cc;border:1px solid #b8ccff}
.phase-badge.explore {background:#f2eeff;color:#7744cc;border:1px solid #d4b8ff}
.phase-badge.repair  {background:#fff8e0;color:#aa6600;border:1px solid #f0d080}
.phase-badge.verify  {background:#e8f8ec;color:#228844;border:1px solid #a8ddb8}
.phase-badge.submit  {background:#e0f8e8;color:#118833;border:1px solid #88cc99}
.tok-row{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.tok-chip{font-size:10px;color:#c0c0d0;font-family:var(--mono)}
/* full-prompt button */
.full-prompt-btn{
  font-size:10px;color:#9090b8;background:#f4f4fc;border:1px solid #d8d8f0;
  border-radius:4px;padding:2px 8px;cursor:pointer;transition:all .12s;margin-left:auto;
  white-space:nowrap;flex-shrink:0;
}
.full-prompt-btn:hover{color:#4455cc;border-color:#8899dd;background:#eeeeff}
.full-prompt-btn.active{color:#4455cc;border-color:#6677dd;background:#eaeaff}
/* ── thinking block ── */
.think-block{
  border-left:2px solid #9980dd;background:#f8f4ff;border-radius:0 6px 6px 0;
  padding:10px 14px;margin-bottom:8px;
}
.think-label{font-size:9px;font-weight:700;color:#7755bb;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.think-text{font-size:11.5px;color:#7766aa;font-style:italic;white-space:pre-wrap;line-height:1.65;word-break:break-word}
/* ── tool call block ── */
.tool-call{
  border:1px solid #e0e0ec;border-radius:7px;overflow:hidden;
  background:#fff;margin-bottom:5px;box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.tc-hd{
  display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;
  background:#fafafa;transition:background .1s;
}
.tc-hd:hover{background:#f4f4fc}
.tc-icon{font-size:13px;width:18px;text-align:center;flex-shrink:0}
.tc-name-txt{font-family:var(--mono);font-size:11.5px;font-weight:700}
.tc-arg-preview{font-family:var(--mono);font-size:10px;color:#b0b0c8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-chev{font-size:8px;color:#c0c0d0;margin-left:auto;flex-shrink:0;transition:transform .12s}
.tool-call.open .tc-chev{transform:rotate(90deg)}
.tool-call-body{display:none;border-top:1px solid #e8e8f0}
.tool-call.open .tool-call-body{display:block}
/* diff */
.diff-blk{font-family:var(--mono);font-size:11px;background:#fafafa}
.diff-fhdr{padding:5px 14px;background:#f4f4fc;color:#7070a0;font-size:10px;border-bottom:1px solid #e8e8f0}
.dl{padding:1px 14px;display:flex;gap:8px;white-space:pre;overflow-x:hidden;line-height:1.5}
.dl.dd{background:#fff0f0;color:#cc4444}
.dl.da{background:#f0fff0;color:#228833}
.dl.dc{background:#fafafa;color:#c0c0c8}
.dl.do{color:#d0d0d8;font-style:italic;padding:1px 14px}
.ds{width:12px;flex-shrink:0;opacity:.5;user-select:none}
/* raw args */
.tc-raw{background:#f8f8fd;padding:10px 14px;font-family:var(--mono);font-size:11px;color:#6070a0;white-space:pre-wrap;overflow-x:auto}
/* result */
.tc-result{border-top:1px solid #e8e8f0}
.tcr-hd{
  display:flex;align-items:center;gap:6px;padding:5px 12px;
  font-size:10px;font-family:var(--mono);cursor:pointer;background:#f8fdf8;
}
.tcr-hd:hover{background:#f0fbf0}
.tcr-status{flex-shrink:0}
.tcr-preview{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#70a070}
.tcr-chev{font-size:8px;color:#b0d0b0;transition:transform .12s;margin-left:auto;flex-shrink:0}
.tc-result.open .tcr-chev{transform:rotate(90deg)}
.tcr-body{display:none;padding:8px 14px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;overflow-x:auto;background:#f6fbf6;border-top:1px solid #d8ecd8;color:#3a7a3a}
.tc-result.open .tcr-body,.tc-result.always .tcr-body{display:block}
.tc-result.ok .tcr-status{color:#228844}
.tc-result.ok .tcr-body{color:#3a7a3a}
.tc-result.err .tcr-hd{background:#fff5f5}
.tc-result.err .tcr-status{color:#cc4444}
.tc-result.err .tcr-body{color:#aa3333;background:#fff8f8}
/* ── response text ── */
.resp-block{border-left:2px solid #c8b8e8;padding-left:10px;margin-top:2px}
.resp-label{font-size:9px;font-weight:700;color:#7755bb;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.resp-text{
  font-size:13px;color:#2a2a3a;white-space:pre-wrap;line-height:1.7;word-break:break-word;
}
/* ── bubble role labels ── */
.user-bubble-label{font-size:9px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.tr-hdr-label{font-size:9px;font-weight:700;color:#3a8a3a;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;opacity:.85}
/* ── debug index ── */
.dbg-index{margin:14px 0 6px;border:1px solid #e6d0d0;border-radius:10px;background:#fdf7f7;overflow:hidden}
.dbg-hd{display:flex;align-items:center;gap:8px;padding:9px 13px;cursor:pointer;user-select:none}
.dbg-hd:hover{background:#faeded}
.dbg-chev{font-size:9px;color:#c08080;transition:transform .12s}
.dbg-index.open .dbg-chev{transform:rotate(90deg)}
.dbg-title{font-size:12px;font-weight:700;color:#a04545}
.dbg-badge{font-size:10px;font-weight:600;padding:1px 7px;border-radius:9px}
.dbg-badge.anom{background:#f6dede;color:#b03535}
.dbg-badge.file{background:#e2e8f5;color:#4560a0}
.dbg-body{display:none;padding:4px 10px 10px}
.dbg-index.open .dbg-body{display:block}
.dbg-sec{font-size:9px;font-weight:700;color:#9088a0;text-transform:uppercase;letter-spacing:.06em;margin:9px 3px 4px}
.dbg-row{display:flex;align-items:center;gap:8px;padding:4px 7px;border-radius:6px;cursor:pointer;font-size:11px}
.dbg-row:hover{background:#f2e4e4}
.dbg-jump{font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:#c07070;border-radius:5px;padding:1px 6px;flex-shrink:0}
.dbg-kind{font-weight:600;flex-shrink:0}
.dbg-count{font-family:var(--mono);font-size:10px;font-weight:700;color:#b04545;background:#f4dede;border-radius:5px;padding:0 5px;flex-shrink:0}
.dbg-tool{font-family:var(--mono);font-size:10px;color:#7788aa;flex-shrink:0}
.dbg-prev{color:#998;font-family:var(--mono);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-row{display:flex;align-items:center;gap:8px;padding:3px 7px;font-size:11px}
.tl-file{font-family:var(--mono);font-size:10.5px;color:#c06;min-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-count{font-size:10px;color:#889;flex-shrink:0}
.tl-dots{display:flex;gap:3px;flex-wrap:wrap}
.tld{width:16px;height:16px;border-radius:4px;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--mono)}
.tld-read{background:#e2ecf7;color:#5580c0}
.tld-ok{background:#dcf2dc;color:#2a8a2a}
.tld-stale{background:#fbe2c8;color:#c07000}
.tld-fail{background:#f6d8d8;color:#c03030}
.anom-badge{font-size:12px;margin-left:2px;cursor:default}
.lane-badge{font-size:9px;font-weight:700;color:#fff;padding:1px 7px;border-radius:9px;letter-spacing:.02em;font-family:var(--mono)}
/* ── per-turn debug enrichment ── */
.turn-dbg{margin-top:6px;border:1px solid #e0d4ea;border-radius:8px;background:#faf6fd;overflow:hidden}
.turn-dbg-hd{display:flex;align-items:center;gap:7px;padding:6px 10px;cursor:pointer;user-select:none;font-size:11px}
.turn-dbg-hd:hover{background:#f3ebf9}
.turn-dbg-chev{font-size:8px;color:#a888c8;transition:transform .12s}
.turn-dbg.open .turn-dbg-chev{transform:rotate(90deg)}
.turn-dbg-label{font-weight:700;color:#8055aa}
.turn-dbg-keys{font-family:var(--mono);font-size:10px;color:#a090b0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.turn-dbg-body{display:none;padding:8px 12px;font-size:11px;color:#4a4055;white-space:pre-wrap;font-family:var(--mono);border-top:1px solid #ece0f4}
.turn-dbg.open .turn-dbg-body{display:block}
.dbg-tool-tbl{width:100%;border-collapse:collapse;font-size:10px;font-family:var(--mono)}
.dbg-tool-tbl th{background:#f0eafc;color:#6044aa;padding:2px 6px;text-align:left;font-weight:700;border-bottom:1px solid #ddd0f0}
.dbg-tool-tbl td{padding:2px 6px;border-bottom:1px solid #ede8f5;color:#3a3050}
.dbg-tool-ok{color:#2e7d32;font-weight:700}.dbg-tool-fail{color:#c62828;font-weight:700}
.tv-chip{display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:700;border-radius:3px;padding:1px 5px;margin-left:3px;font-family:var(--mono)}
.tv-edit{background:#e3f0ff;color:#1565c0}.tv-edit.tv-fail{background:#fdecea;color:#b71c1c}
.tv-vok{background:#e8f5e9;color:#2e7d32}.tv-vfail{background:#fdecea;color:#b71c1c}
.tv-chip sup{font-size:8px;margin-left:2px}
.dbg-tool-file{color:#555;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.at-item{display:flex;gap:8px;padding:2px 4px;font-size:11px;font-family:var(--mono);border-bottom:1px solid #ede8f5;color:#3a3050}
.at-item:last-child{border-bottom:none}
.at-idx{color:#aaa;min-width:22px;text-align:right;flex-shrink:0}
.at-action{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg-flash{animation:tgflash 1.2s ease}
@keyframes tgflash{0%,100%{background:transparent}30%{background:#fff2cc}}
/* ── loc cards ── */
.loc-cards{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.loc-hdr{font-size:10px;font-weight:700;color:#4466cc;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.loc-card{background:#f4f6ff;border:1px solid #d0d8f8;border-radius:6px;padding:8px 12px}
.loc-file{font-family:var(--mono);font-size:11px;color:#3355cc;margin-bottom:3px}
.loc-why{font-size:11px;color:#6070a0;line-height:1.5}
/* ── obs ── */
.obs-block{border:1px solid #b8e0cc;border-radius:6px;background:#edfaf2;overflow:hidden;margin-bottom:5px}
.obs-hd{display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:pointer;font-size:11px;color:#228844;font-weight:600}
.obs-hd:hover{background:#e0f5e8}
.obs-chev{font-size:8px;transition:transform .12s}
.obs-block.open .obs-chev{transform:rotate(90deg)}
.obs-body{display:none;padding:6px 10px;font-family:var(--mono);font-size:10.5px;color:#2a6038;white-space:pre-wrap;overflow-x:auto}
.obs-block.open .obs-body{display:block}
/* ─────────────────── PROMPT RIGHT PANEL ─────────────────── */
#prompt-panel{background:#fff}
#pp-header{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
#pp-title{font-size:11px;font-weight:700;color:#7070a0;letter-spacing:.07em;text-transform:uppercase;flex:1}
#pp-turn-label{font-size:10px;color:#b0b0c8;font-family:var(--mono)}
#pp-close{
  width:20px;height:20px;border-radius:4px;border:1px solid #d8d8e8;background:#f4f4fc;
  color:#a0a0c0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:12px;transition:all .12s;flex-shrink:0;
}
#pp-close:hover{color:#5566cc;border-color:#8899dd;background:#eeeeff}
#pp-scroll{flex:1;overflow-y:auto;background:#fafafe;position:relative}
/* sticky section overlay — the ONE breadcrumb that tracks where you are */
#pp-overlay{
  position:sticky;top:0;z-index:5;padding:5px 12px;
  font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:#5560a8;background:rgba(240,240,252,.94);backdrop-filter:blur(3px);
  border-bottom:1px solid #e0e0f0;box-shadow:0 1px 3px rgba(0,0,0,.06);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
}
#pp-overlay .pp-ov-sub{color:#9090b8;font-weight:400}
#pp-overlay .pp-ov-sub::before{content:'  ›  ';opacity:.6}
/* the raw prompt — one continuous, verbatim block, no card chrome */
.pm-raw{
  padding:8px 12px 40px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;
  overflow-x:auto;line-height:1.6;color:#5a6aa0;word-break:break-word;
}
.pm-anchor{display:inline;width:0;height:0;font-size:0}
/* our own `##`-style delimiter headings, kept verbatim but highlighted */
.pm-h{color:#4455aa;font-weight:700}
/* ─────────────────── RUN META ─────────────────── */
#run-meta-section{border-top:1px solid var(--border);padding:8px 20px 10px;background:#fafafe}
.run-meta-block{}
.rm-summary{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.rm-badge{
  display:inline-flex;align-items:center;gap:4px;padding:2px 9px;
  border-radius:12px;font-size:10px;background:#eeeef8;border:1px solid #d8d8ee;color:#5555a0;
}
.rm-badge.run-id{font-family:var(--mono);color:#888}
.rm-badge.rm-pass{background:#e8f5e9;border-color:#a5d6a7;color:#2e7d32;font-weight:600}
.rm-badge.rm-fail{background:#fce8e8;border-color:#ef9a9a;color:#c62828;font-weight:600}
.rm-badge.rm-debug{background:#fff3e0;border-color:#ffb74d;color:#e65100}
.rm-argv{margin-bottom:6px}
.rm-argv .rm-row{background:#f4f4fc;border-radius:4px;padding:4px 8px}
.rm-group{border:1px solid #e8e8f2;border-radius:6px;overflow:hidden;margin-bottom:5px}
.rm-group-hd{
  display:flex;align-items:center;gap:6px;padding:5px 10px;cursor:pointer;
  font-size:10px;font-weight:700;color:#8888b0;background:#f8f8fd;
  user-select:none;letter-spacing:.04em;
}
.rm-group-hd:hover{background:#f0f0f8}
.rm-group-chev{font-size:8px;transition:transform .12s;flex-shrink:0}
.rm-cnt{margin-left:auto;font-weight:400;color:#b0b0c8;font-family:var(--mono)}
.rm-group-body{display:none;padding:4px 0}
.rm-group-body.open{display:block!important}
.rm-row{
  display:flex;align-items:baseline;gap:8px;padding:2px 10px;font-size:11px;
  border-bottom:1px solid #f0f0f8;
}
.rm-row:last-child{border-bottom:none}
.rm-key{font-family:var(--mono);color:#8888b0;flex-shrink:0;min-width:260px;font-size:10px}
.rm-val{font-family:var(--mono);color:#4a5070;word-break:break-all}
.rm-mono{font-family:var(--mono)}
/* ─────────────────── UTIL ─────────────────── */
#workspace-placeholder{display:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d0d0e0;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#b0b0c8}
.empty-msg{color:#c0c0d0;font-size:12px;text-align:center;padding:40px}
/* ─────────────────── SPAN TREE (C6 · unified OTel projection) ─────────────────── */
/* view toggle in the topbar (group-chat ⇄ span-tree) */
#view-switch{display:flex;gap:2px;border:1px solid #d8d8e8;border-radius:6px;overflow:hidden;margin-left:6px}
#view-switch span{padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;color:#b0b0c8;transition:all .12s}
#view-switch span:hover{background:#f0f0fa;color:#5555aa}
#view-switch span.active{background:#eeeef8;color:#4455aa}
#view-switch.hidden{display:none}
/* the tree lives in a left rail inside the chat column when tree view is on */
#tree-layout{display:flex;flex:1;overflow:hidden}
#span-tree{width:320px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--border);background:#fbfbfe;padding:6px 0}
#tree-evidence{flex:1;overflow-y:auto;padding:0 20px 60px}
.tree-hd{padding:8px 12px 6px;font-size:9px;font-weight:700;color:#a0a0b8;text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;gap:6px}
.tree-corr{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 6px}
.badge{font-size:8.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:8px;padding:1px 7px;font-family:var(--mono)}
.badge.b-legacy{background:#eef0f5;color:#8088a0;border:1px solid #d8dce8}
.badge.b-redacted{background:#f3eefb;color:#8552b0;border:1px solid #e2d3f4}
.badge.b-truncated{background:#fff3e8;color:#b0743a;border:1px solid #f4ddc4}
.badge.b-degraded{background:#fdf1f1;color:#c0504a;border:1px solid #f0cccc}
.badge.b-unified{background:#eafaf1;color:#2f8f5b;border:1px solid #c9ecd6}
.tnode{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 0;cursor:pointer;border-left:2px solid transparent;font-size:11.5px;white-space:nowrap;overflow:hidden}
.tnode:hover{background:#f0f0f8}
.tnode.sel{background:#eeeef8;border-left-color:#5566cc}
.tnode .t-caret{width:12px;flex-shrink:0;text-align:center;color:#b0b0c8;font-size:8px;transition:transform .12s;cursor:pointer}
.tnode.collapsed .t-caret{transform:rotate(-90deg)}
.tnode .t-kind{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:4px;padding:1px 5px;flex-shrink:0}
.tk-instance{background:#e2ecf7;color:#3f74b8}
.tk-invoke{background:#f2eeff;color:#7744cc}
.tk-turn{background:#eafaf1;color:#2f8f5b}
.tk-chat{background:#e6f6f4;color:#1f8a86}
.tk-tool{background:#fff8ee;color:#aa6600}
.tk-span{background:#f0f0f5;color:#8088a0}
.tnode .t-name{font-family:var(--mono);color:#3a3a55;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tnode.sel .t-name{color:#2233aa;font-weight:600}
.tnode .t-meta{font-family:var(--mono);font-size:9px;color:#b0b0c8;flex-shrink:0}
.tnode .t-ev{font-family:var(--mono);font-size:9px;color:#8899bb;background:#eef0f8;border-radius:7px;padding:0 5px;flex-shrink:0}
.tnode.hidden-node{display:none}
.tree-empty{color:#c0c0d0;font-size:11px;padding:20px 14px;line-height:1.6}
.tev-hd{font-size:9px;font-weight:700;color:#7a8aa0;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tev-span-id{font-family:var(--mono);font-size:9px;color:#a0a8bc}
.tev-card{border:1px solid #e2e6ee;border-radius:8px;background:#fff;margin-bottom:6px;overflow:hidden}
.tev-card-hd{display:flex;align-items:center;gap:7px;padding:7px 11px;font-size:11px;font-weight:600;color:#4a5a70;background:#fafbfd;cursor:pointer}
.tev-card-hd:hover{background:#f3f5f9}
.tev-kind-tag{font-family:var(--mono);font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:1px 6px;flex-shrink:0;background:#eef0f8;color:#6070a0}
.tev-time{font-family:var(--mono);font-size:9px;color:#b0b8c8;margin-left:auto;flex-shrink:0}
.tev-body{display:none;padding:8px 12px;font-family:var(--mono);font-size:10.5px;color:#4a5568;white-space:pre-wrap;overflow-x:auto;border-top:1px solid #eceef4;background:#fbfcfe}
.tev-card.open .tev-body{display:block}
.tev-cassette{border-color:#c5e6e2}
.tev-cassette .tev-card-hd{background:#f4fbfa;color:#1f7a76}
</style>
</head>
<body>
<div id="topbar">
  <h1 id="ui-title"></h1>
  <span id="load-status"></span>
  <div id="view-switch" class="hidden">
    <span onclick="setView('chat')" id="vs-chat"></span>
    <span onclick="setView('tree')" id="vs-tree"></span>
  </div>
  <div id="lang-switch">
    <span onclick="setLang('ko')" id="ls-ko">한</span>
    <span onclick="setLang('en')" id="ls-en">EN</span>
  </div>
  <label id="drop-label" for="file-input"></label>
  <input type="file" id="file-input" accept=".jsonl,.json" multiple>
</div>

<div id="layout">
  <aside id="sidebar">
    <div id="sidebar-head"></div>
    <div id="instance-list"><div class="empty-msg" id="ui-nodata"></div></div>
  </aside>
  <main id="main">
    <div id="dropzone">
      <div id="dropzone-icon">🗂</div>
      <p id="ui-drop-hint"></p>
      <small id="ui-drop-sub"></small>
    </div>
    <div id="workspace" style="display:none;flex:1;overflow:hidden">
      <div id="chat-col">

function parseJSONL(txt){

// ──────────── EXTRACT INST ID ────────────
// Pattern: owner__repo-NNNN (optionally followed by -randomSuffix we strip)
const INST_PAT=/([a-z0-9_]+__[a-z0-9_]+-\d+)(?:-[A-Za-z0-9]+)?/
function extractInstId(records){
  for(const r of records){
    if(r.metadata?.instanceId)return r.metadata.instanceId
    // search messages text
    for(const m of r.request?.messages??[]){
      const x=flatText(m).match(INST_PAT)
      if(x)return x[1]
    }
    // search event path fields only (avoid stringify of entire tool output which
    // can be megabytes; instance id appears in tool_use name/input.path fields)
    for(const e of r.events??[]){
      const candidates=[e.name,e.input?.path,e.input?.file_path,e.input?.command]
      for(const s of candidates){
        if(typeof s==='string'){const x=s.match(INST_PAT);if(x)return x[1]}
      }
    }
  }
  return null
}
function flatText(msg){
  const c=msg.content
  if(typeof c==='string')return c
  if(Array.isArray(c))return c.map(b=>typeof b==='string'?b:(b.text??'')).join('\n')
  return''
}


// ──────────── RECONSTRUCT TURNS ────────────
function reconstructTurns(records){
  const turns=[];let prev=0,prevFirst=null
  for(const rec of records){
    const msgs=rec.request?.messages??[]
    // newMsgs = what's NEW vs the previous turn. Within one growing conversation
    // that's msgs.slice(prev). But each pipeline phase (localize/repro/repair) is
    // a FRESH thread whose request resets to a short message list — there
    // `slice(prev)` would be empty and the prompt bubble would vanish. Detect a
    // new thread by a change in the FIRST message and take the whole request.
    const first=msgs.length?flatText(msgs[0]):''
    const continues=prevFirst!==null&&first===prevFirst&&msgs.length>prev
    turns.push({
      newMsgs:continues?msgs.slice(prev):msgs,
      allMsgs:msgs,
      system:rec.request?.system??null,
      tools:rec.request?.tools??null,
      output:buildOutput(rec.events??[]),
      usage:extractUsage(rec.events??[]),
      meta:rec.metadata??{},
      ts:rec.metadata?.recordedAt??null,
    })
    prev=msgs.length;prevFirst=first
  }
  pairResults(turns)
  return turns
}
function pairResults(turns){
  for(let i=1;i<turns.length;i++){
    const byId=Object.fromEntries(turns[i-1].output.tools.map(t=>[t.id,t]))
    for(const msg of turns[i].newMsgs){
      if(!Array.isArray(msg.content))continue
      for(const blk of msg.content){
        if(blk.type!=='tool_result'||!blk.tool_use_id)continue
        const tool=byId[blk.tool_use_id];if(!tool)continue
        tool.result=typeof blk.content==='string'?blk.content
          :Array.isArray(blk.content)?blk.content.map(b=>b.text??'').join(''):''
        blk._paired=true
      }
    }
  }
}
function buildOutput(events){
  let text='',thinking=''
  const tools=[];let cur=null,delta=''
  for(const e of events){
    switch(e.type){
      case'text_delta':text+=e.content??e.delta??'';break
      case'thinking_delta':thinking+=e.content??e.delta??'';break
      case'tool_use_start':if(cur)tools.push({...cur,input:tryJ(delta)});cur={id:e.id,name:e.name};delta='';break
      case'tool_use_delta':delta+=e.delta??'';break
      case'tool_use_end':if(cur){tools.push({...cur,input:e.input??tryJ(delta)});cur=null;delta=''}break
    }
  }
  if(cur)tools.push({...cur,input:tryJ(delta)})
  let display=text
  if(!thinking&&text.startsWith('REASON:')){const nl=text.indexOf('\n\n');if(nl>0){thinking=text.slice(7,nl).trim();display=text.slice(nl+2)}}
  return{text:display,thinking,tools}
}
function extractUsage(ev){for(const e of ev)if(e.type==='usage')return e;return null}
function tryJ(s){try{return JSON.parse(s)}catch{return s}}

// ──────────── TOOL META ────────────
const TI={bash:'⬛',run_bash:'⬛',shell:'⬛',read:'📄',read_file:'📄',view:'📄',write:'💾',write_file:'💾',create_file:'💾',edit:'✏️',str_replace:'✏️',str_replace_editor:'✏️',apply_patch:'✏️',glob:'🗂',grep:'🔍',search:'🔍',lsp_definition:'↗',lsp_hover:'◈',lsp_references:'🔗',lsp_diagnostics:'⚠'}
const TC={bash:'#e0843a',run_bash:'#e0843a',shell:'#e0843a',read:'#5588ee',read_file:'#5588ee',view:'#5588ee',write:'#ee6644',write_file:'#ee6644',edit:'#ddaa33',str_replace:'#ddaa33',str_replace_editor:'#ddaa33',apply_patch:'#ddaa33',glob:'#9977cc',grep:'#33cc99',search:'#33cc99'}

// ──────────── LANE COLOR ────────────
// Stable hue per lane label so the same parallel candidate is one color across
// its (interleaved) turns. Deterministic hash → HSL.
const LANE_HUES={}
function laneColor(lane){
  if(LANE_HUES[lane])return LANE_HUES[lane]
  let h=0;for(let i=0;i<lane.length;i++)h=(h*31+lane.charCodeAt(i))>>>0
  const c=`hsl(${h%360},58%,58%)`;LANE_HUES[lane]=c;return c
}

// ──────────── PHASE ────────────
function detectPhase(turn,i){
  const ns=turn.output.tools.map(t=>(t.name??'').toLowerCase())
  if(ns.some(n=>n.includes('submit')))return'submit'
  if(ns.some(n=>['edit','str_replace','str_replace_editor','apply_patch','write','write_file'].includes(n)))return'repair'
  if(ns.some(n=>['bash','shell','run_bash','execute_command'].includes(n)))return'verify'
  if(ns.some(n=>['read','glob','grep','search','view','read_file'].includes(n)||n.startsWith('lsp_')))return'explore'
  if(i===0&&!ns.length)return'localize'
  return'explore'
}

// ──────────── LOC PARSE ────────────
function parseLocOutput(text){
  const chunks=text.split(/\n(?=FILE:)/),out=[]
  for(const c of chunks){
    const fm=c.match(/^FILE:\s*(.+?)(?:\n|$)/),rm=c.match(/REASON:\s*([\s\S]+?)(?:\n\n|$)/)
    if(fm)out.push({file:fm[1].trim(),reason:rm?rm[1].trim():''})
  }
  return out.length>=2?out:null
}

// ──────────── FILE MAP ────────────
function buildFileMap(turns){
  const m=new Map()
  for(const t of turns){
    for(const tool of t.output.tools){
      const p=tool.input?.path??tool.input?.file_path??tool.input?.filename
      if(!p||typeof p!=='string'||p.length>300)continue
      if(!m.has(p))m.set(p,{r:0,e:0})
      const f=m.get(p),n=(tool.name??'').toLowerCase()
      if(['read','view','read_file'].includes(n))f.r++
      else if(['edit','str_replace','str_replace_editor','write','write_file'].includes(n))f.e++
    }
  }
  return m
}

// ──────────── ANOMALY DETECTION ────────────
// Scan each turn's tool results for known "went wrong here" signals so the
// debugger can jump straight to the friction points instead of scrolling.
const ANOM={
  stale:{icon:'🔄',color:'#d67a00',label:'stale edit'},
  empty:{icon:'∅',color:'#8888aa',label:'빈 결과'},
  gate:{icon:'🚧',color:'#b05bcc',label:'phase-gate 차단'},
  error:{icon:'⚠',color:'#cc3333',label:'도구 에러'},
}
function detectAnomalies(turns){
  const out=[]
  turns.forEach((t,i)=>{
    for(const tool of t.output.tools){
      const r=String(tool.result??'')
      if(!r)continue
      const name=tool.name??'?'
      let kind=null
      if(/stale_precondition/i.test(r))kind='stale'
      else if(/^\s*\(no candidates\)|\bno candidates\b|\(empty\)/i.test(r))kind='empty'
      else if(/edits are blocked|Phase\s*\d.*localization/i.test(r))kind='gate'
      // error = a real CRASH signal (python traceback / missing command / shell
      // syntax error) — NOT a bare `[exit 1]` from pytest, which is a normal
      // failing-test result in the repair/repro loop, and NOT the words
      // "failed/not found" appearing inside a file read.
      else if(/Traceback \(most recent call last\)|: command not found|^[^\n]{0,60}: line \d+: /.test(r))kind='error'
      if(kind){
        out.push({turn:i,kind,tool:name,preview:r.slice(0,100).replace(/\n/g,' ')})
        ;(t._anom??(t._anom=new Set())).add(kind)
      }
    }
  })
  return out
}

// ──────────── FILE EDIT TIMELINE ────────────
// Per-file sequence of read/edit events across turns, with pass/fail on edits,
// so you can see why the same file was touched N times (e.g. stale retries).
function buildFileTimeline(turns){
  const m=new Map()
  turns.forEach((t,i)=>{
    for(const tool of t.output.tools){
      const p=tool.input?.path??tool.input?.file_path??tool.input?.filename
      if(!p||typeof p!=='string'||p.length>300)continue
      const n=(tool.name??'').toLowerCase()
      const isEdit=['edit','str_replace','str_replace_editor','write','write_file','apply_patch'].includes(n)
      const isRead=['read','view','read_file'].includes(n)
      if(!isEdit&&!isRead)continue
      if(!m.has(p))m.set(p,[])
      const r=String(tool.result??'')
      const ok=isEdit?!/stale_precondition|error|fail|blocked/i.test(r):true
      m.get(p).push({turn:i,kind:isEdit?'edit':'read',ok,stale:/stale_precondition/i.test(r)})
    }
  })
  // only files with at least one edit are interesting for the timeline
  return[...m.entries()].filter(([,ev])=>ev.some(e=>e.kind==='edit'))
}

// ──────────── STATS ────────────
function computeStats(turns){
  let totalIn=0,totalOut=0,totalMs=0;const models=new Set()
  for(const t of turns){totalIn+=t.usage?.inputTokens??0;totalOut+=t.usage?.outputTokens??0;totalMs+=t.meta?.durationMs??0;if(t.meta?.model)models.add(t.meta.model)}
  const phases=turns.map((t,i)=>detectPhase(t,i))
  return{turns:turns.length,totalIn,totalOut,totalMs,models:[...models],phases}
}
function fN(n){return n>=1000?(n/1000).toFixed(1)+'k':String(n)}
function fMs(ms){if(!ms)return null;if(ms<1000)return ms+'ms';if(ms<60000)return(ms/1000).toFixed(1)+'s';return(ms/60000).toFixed(1)+'m'}
function fTs(ts){if(!ts)return null;const d=new Date(ts),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}
function fTime(ts){if(!ts)return null;const d=new Date(ts),p=n=>String(n).padStart(2,'0');return`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}
function dispName(id){const s=id.startsWith('bench-')?id.slice(6):id;const m=s.match(/^[^_]+__(.+)$/);return m?m[1]:s}
function repoName(id){const s=id.startsWith('bench-')?id.slice(6):id;const m=s.match(/^([^_]+)__/);return m?m[1]:null}
function shortPath(p){if(!p)return'';const pts=p.replace(/\\/g,'/').split('/');return pts.length>2?'…/'+pts.slice(-2).join('/'):p}
/** psf__requests-5414 → https://github.com/psf/requests/issues/5414 */
function issueUrl(id){
  const s=id.startsWith('bench-')?id.slice(6):id
  const m=s.match(/^([^_]+)__([^-]+(?:-[^-]+)*?)-(\d+)$/)
  if(!m)return null

  return`https://github.com/${owner}/${repo}/issues/${num}`
}

// ──────────── PHASE (thread-level) ────────────
// A bench INSTANCE run = ONE session (= ONE file). Inside it the pipeline runs
// distinct conversation threads — localize / repro / repair — which we surface
// as TURN GROUPS, not separate sessions. Label each turn's phase from the
// authoritative record metadata (`lane`/`phase`, future files) or fall back to a
// fingerprint of the conversation's first message (existing files, pre-wiring).
const PHASE_META={
  localize:{label:'LOCALIZE',icon:'🎯'},
  repro:{label:'REPRO',icon:'🧪'},
  repair:{label:'REPAIR',icon:'🔧'},
  verify:{label:'VERIFY',icon:'✔'},
  agent:{label:'AGENT',icon:'🤖'},
}
function msgText0(msgs){
  const m=msgs&&msgs[0]
  if(!m)return''
  const c=m.content
  if(typeof c==='string')return c
  if(Array.isArray(c))return c.map(b=>typeof b==='string'?b:(b.text??'')).join(' ')
  return''
}
// Phase from the AUTHORITATIVE record metadata (`lane`/`phase`, future files) or
// a fingerprint of the conversation's first message (legacy files, pre-wiring).
function phaseFromText(t){
  t=(t||'').replace(/^\s+/,'').slice(0,400)
  if(/self-contained pytest test that reproduces|Write a[^.]*pytest test/i.test(t))return'repro'
  // localize = the raw issue description, a SINGLE-hash "# Issue <title>" call.
  // Must precede the repair check: repair prompts are DOUBLE-hash ("## Issue
  // Hints", "## Issue evidence"), which would otherwise steal the localize turn
  // and fake an instance boundary mid-run.
  if(/^#\s+Issue\b/i.test(t))return'localize'
  if(/Issue Hints|Agentless localization|Top-\d+ files most likely|^#{2,}\s/i.test(t))return'repair'
  return'agent'
}
// Normalize an authoritative record lane (`metadata.lane`, e.g. "repair#0",
// "verify-select#2", "repro") down to its BASE pipeline phase, so parallel
// candidate lanes collapse into one phase group instead of N.
function normalizeLane(lane){
  const b=String(lane).toLowerCase().split('#')[0].trim()
  if(b.startsWith('localize')||b.startsWith('loc'))return'localize'
  if(b.startsWith('repro'))return'repro'
  if(b.startsWith('repair')||b.startsWith('edit')||b.startsWith('agent'))return'repair'
  if(b.startsWith('verify')||b.startsWith('select')||b.startsWith('regress'))return'verify'
  return b.split('-')[0]
}
function recordPhase(r){const lane=r.metadata?.lane??r.metadata?.phase;return lane?normalizeLane(lane):phaseFromText(msgText0(r.request?.messages))}
function turnPhase(turn){const lane=turn.meta?.lane??turn.meta?.phase;return lane?normalizeLane(lane):phaseFromText(msgText0(turn.allMsgs))}
function annotatePhases(turns){for(const t of turns)t.phase=turnPhase(t);return turns}

// Split a file's records at TRUE instance boundaries. A bench instance run is a
// `localize → repro → repair` cycle; a new instance begins at each fresh
// `localize` turn (i.e. a localize NOT preceded by a localize). Future
// per-instance files have ONE cycle ⇒ ONE segment; legacy box-blobs that packed
// N instances split into N. This is SEMANTIC (pipeline restart), NOT the fragile
// message-length heuristic that used to fake-split repro candidates into sessions.
function splitByInstance(records){
  if(!records.length)return[]
  const ph=records.map(recordPhase)
  const segs=[];let cur=null
  records.forEach((r,i)=>{
    const boundary=cur===null||(ph[i]==='localize'&&ph[i-1]!=='localize')
    if(boundary){cur=[];segs.push(cur)}
    cur.push(r)
  })
  return segs
}

// ──────────── LOAD ────────────
function buildInstance(id,records,meta){
  const turns=annotatePhases(reconstructTurns(records))
  // scaffold ACTION stream (observe) for this instance — the non-LLM actions
  // (sandbox / repro-select / verify / patch / recovery) the cassette never sees.
  const observe=(typeof window!=='undefined'&&window.__OBSERVE__&&window.__OBSERVE__[id])||[]
  const inst={id,records,turns,observe,stats:computeStats(turns),fileMap:buildFileMap(turns),
    anomalies:detectAnomalies(turns),fileTimeline:buildFileTimeline(turns),
    runMeta:meta??metaByInstance.get(id)??null}
  inst.spanTree=buildSpanTree(inst) // C6: unified OTel {traceId,spanId} join
  return inst
}
// ──────────── SPAN TREE (C6 · unified OTel projection) ────────────
// Join OBSERVE evidence + cassette turns on {traceId,spanId} into the span tree
//   quanta.bench.instance → invoke_agent → session_task.turn → chat / execute_tool
// built from parentSpanId links. Parallel spans render as SIBLINGS-by-parent
// (not arrival order). Legacy files (deterministic `t<turn>` ids / no traceId)
// have no join key ⇒ the tree is empty and we fall back to the group-chat view.

// A real W3C span id is 16 lowercase-hex chars; a trace id is 32. The legacy
// scheme emits `t0`,`llm:t0`,`tool:tu1` etc. — never pure hex — so we detect the
// unified mode by the presence of ANY 32-hex traceId on the evidence.
const HEX_TRACE=/^[0-9a-f]{32}$/i
const HEX_SPAN=/^[0-9a-f]{16}$/i
function isUnifiedId(x){return typeof x==='string'&&(HEX_TRACE.test(x)||HEX_SPAN.test(x))}

// Classify a span node into the target-tree kind from its OTel span name (when an
// OTLP-shaped node carries one) or from the trajectory event kind that anchored
// it. Drives the color tag + ordering; unknown → generic 'span'.
function spanKindLabel(name,evKind){
  const n=String(name||'').toLowerCase()
  if(n.includes('bench.instance')||n.includes('quanta.bench')||evKind==='session_start'||evKind==='sandbox')return'instance'
  if(n.includes('invoke_agent')||n.includes('invoke agent')||evKind==='session_end')return'invoke'
  if(n.includes('turn')||evKind==='turn_start')return'turn'
  if(n.startsWith('chat')||n.includes('chat ')||n==='chat'||evKind==='llm_request'||evKind==='llm_usage'||evKind==='assistant_text')return'chat'
  if(n.startsWith('execute_tool')||n.includes('tool')||evKind==='tool_call'||evKind==='tool_result'||evKind==='tool_progress')return'tool'
  return'span'
}
const SPAN_KIND_TAG={instance:'tk-instance',invoke:'tk-invoke',turn:'tk-turn',chat:'tk-chat',tool:'tk-tool',span:'tk-span'}
const SPAN_KIND_ORDER={instance:0,invoke:1,turn:2,chat:3,tool:4,span:5}

// Build the join. Returns {nodes:Map<spanId,node>, roots:[node], unified:bool,
//   corr:Set<badge>} where each node = {spanId,parentSpanId,traceId,kind,name,
//   evidence:[{kind,ts,data,redaction,degraded}], cassette:turn|null, children:[]}.
function buildSpanTree(inst){
  const nodes=new Map()
  const corr=new Set()
  let sawTrace=false
  const ensure=(spanId,parentSpanId,traceId,name,evKind)=>{
    let node=nodes.get(spanId)
    if(!node){node={spanId,parentSpanId:parentSpanId||null,traceId:traceId||null,name:name||'',kind:spanKindLabel(name,evKind),evidence:[],cassette:null,children:[]};nodes.set(spanId,node)}
    else{
      // enrich a synthesized node once its structural name/parent shows up
      if(parentSpanId&&!node.parentSpanId)node.parentSpanId=parentSpanId
      if(traceId&&!node.traceId)node.traceId=traceId
      if(name&&(!node.name||node.kind==='span')){node.name=name;node.kind=spanKindLabel(name,evKind)}
      else if(evKind&&node.kind==='span'){node.kind=spanKindLabel(node.name,evKind)}
    }
    return node
  }
  // (1) OBSERVE evidence — each event may define/attach to a span by its spanId
  for(const ev of (inst.observe||[])){
    if(!ev.spanId)continue
    if(ev.traceId)sawTrace=true
    // structural span-name lives in data.spanName / data.name when present
    const name=ev.data?.spanName??ev.data?.name??ev.spanName??''
    const node=ensure(ev.spanId,ev.parentSpanId,ev.traceId,name,ev.kind)
    // a "required event missing its trace ref" ⇒ degraded correlation. OBSERVE
    // events that carry a spanId but no traceId scope can't be globally joined.
    const degraded=ev.kind==='observability_degraded'||(!ev.traceId)
    if(ev.kind==='observability_degraded')corr.add('degraded')
    if(!ev.traceId&&ev.spanId&&isUnifiedId(ev.spanId))corr.add('degraded')
    if(ev.redaction&&ev.redaction.applied)corr.add('redacted')
    if(ev.data&&(ev.data.truncated===true||ev.data.truncatedChars!=null))corr.add('truncated')
    node.evidence.push({kind:ev.kind,ts:ev.ts,data:ev.data||{},redaction:ev.redaction,degraded})
  }
  // (2) cassette turns — each carries the chat span identity in metadata
  for(const turn of inst.turns){
    const sid=turn.meta?.spanId
    if(!sid)continue
    if(turn.meta?.traceId)sawTrace=true
    const node=ensure(sid,turn.meta?.parentSpanId,turn.meta?.traceId,'chat','llm_request')
    node.cassette=turn
    if(!turn.meta?.traceId)corr.add('degraded')
  }
  const unified=sawTrace&&[...nodes.values()].some(n=>isUnifiedId(n.spanId))
  if(!unified){
    // legacy: no hex trace/span ids ⇒ no join key. Mark the badge; the tree UI
    // shows the fall-back message and the user stays on group-chat.
    if(nodes.size)corr.add('legacy')
    return{nodes,roots:[],unified:false,corr}
  }
  // link children to parents; a node whose parent isn't in the map is a ROOT
  // (the instance root, or an orphan when the parent span wasn't captured).
  const roots=[]
  for(const node of nodes.values()){
    const p=node.parentSpanId&&nodes.get(node.parentSpanId)
    if(p)p.children.push(node);else roots.push(node)
  }
  // SIBLINGS render by (kind order, then span id) — deterministic, parent-scoped,
  // NOT arrival order, so parallel chat/tool spans sit side-by-side stably.
  const sortSibs=arr=>{arr.sort((a,b)=>(SPAN_KIND_ORDER[a.kind]-SPAN_KIND_ORDER[b.kind])||String(a.spanId).localeCompare(String(b.spanId)));for(const n of arr)sortSibs(n.children)}
  sortSibs(roots)
  return{nodes,roots,unified:true,corr}
}

function fileNameToId(name){
  return String(name||'session').replace(/\.jsonl$/i,'').replace(/^\d{8}-\d{6}-/,'').replace(/^trajectory-/,'')
}
// sessions: [{name, text, meta?}] — one entry per FILE. Each file is split into
// its constituent instance runs (usually 1; legacy blobs → N), then segments are
// grouped by instanceId ACROSS files so one instance = one session even when its
// run spans several files (primary + repair-breadth candidate cassettes
// `<ts>-<instanceId>-a<n>.jsonl`). Records concat in file (≈chronological) order;
// phase bands keep each thread legible inside the merged session.
function loadSessions(sessions,label){
  const byId=new Map() // id → {records:[], meta}
  for(const s of sessions){
    const records=parseJSONL(s.text)
    const segs=splitByInstance(records)
    segs.forEach((seg,k)=>{
      const id=s.meta?.instanceId||extractInstId(seg)||
        (segs.length>1?`${fileNameToId(s.name)}#${k+1}`:fileNameToId(s.name))
      if(!byId.has(id))byId.set(id,{records:[],meta:s.meta})
      const e=byId.get(id)
      e.records.push(...seg)
      if(!e.meta&&s.meta)e.meta=s.meta
    })
  }
  instances=[...byId.entries()].map(([id,e])=>buildInstance(id,e.records,e.meta))
  document.getElementById('load-status').textContent=`${label??T('multiSession')??''} · ${T('sessionCount',instances.length)}`
  renderSidebar()
  // Honor a deep-link (#<instanceId>) when present; else default to the first.
  if(instances.length>0&&!selectFromHash())selectInstance(0)
}
function loadTrajectory(text,label){loadSessions([{name:label,text}],label)}

function loadMeta(text,label){
  let meta
  try{meta=JSON.parse(text)}catch{console.warn('meta parse error');return}
  const id=meta.instanceId
  if(id){
    metaByInstance.set(id,meta)
    // patch into existing loaded instance if present
    const inst=instances.find(i=>i.id===id)
    if(inst){inst.runMeta=meta;if(selInst>=0&&instances[selInst]?.id===id)renderChat()}
  }
  document.getElementById('load-status').textContent+=` · ${T('metaLoaded')}`
}

// ──────────── SIDEBAR ────────────
let sidebarFilter='all' // 'all' | 'pass' | 'fail'
function setSidebarFilter(f){sidebarFilter=f;renderSidebar()}

function renderSidebar(){
  const list=document.getElementById('instance-list')
  if(!instances.length){list.innerHTML=`<div class="empty-msg">${T('noData')}</div>`;return}
  // filter
  const filtered=instances.map((inst,i)=>({inst,i})).filter(({inst})=>{
    const v=inst.runMeta?.verdict
    if(sidebarFilter==='pass')return v!=null&&v.passed===true
    if(sidebarFilter==='fail')return v!=null&&v.passed===false
    return true
  })
  // filter bar (only shown when any verdict data exists)
  const hasVerdicts=instances.some(inst=>inst.runMeta?.verdict!=null)
  const passCount=instances.filter(inst=>inst.runMeta?.verdict?.passed===true).length
  const failCount=instances.filter(inst=>inst.runMeta?.verdict?.passed===false).length
  const filterBar=hasVerdicts?`<div class="sb-filter-bar">
    <button class="sb-flt${sidebarFilter==='all'?' active':''}" onclick="setSidebarFilter('all')">all ${instances.length}</button>
    <button class="sb-flt sb-flt-pass${sidebarFilter==='pass'?' active':''}" onclick="setSidebarFilter('pass')">✅ ${passCount}</button>
    <button class="sb-flt sb-flt-fail${sidebarFilter==='fail'?' active':''}" onclick="setSidebarFilter('fail')">❌ ${failCount}</button>
  </div>`:''
  list.innerHTML=filterBar+filtered.map(({inst,i})=>{
    const s=inst.stats,name=dispName(inst.id),repo=repoName(inst.id)
    const phases=s.phases??[]
    const dots=phases.map(ph=>`<div class="phase-dot ${ph.slice(0,3)}"></div>`).join('')
    const iurl=issueUrl(inst.id)
    const v=inst.runMeta?.verdict
    const vDot=v!=null?(v.passed?`<span class="inst-verdict-dot vd-pass" title="passed">●</span>`:`<span class="inst-verdict-dot vd-fail" title="failed">●</span>`):`<span class="inst-verdict-dot vd-none" title="no verdict">○</span>`
    return`<div class="inst-item${i===selInst?' active':''}" onclick="selectInstance(${i})">
      <div class="inst-seq">${i+1}</div>
      <div class="inst-info">
        <div class="inst-name-row">
          ${vDot}
          <span class="inst-name" title="${esc(inst.id)}">${esc(name)}</span>
          ${iurl?`<a class="inst-gh-link" href="${iurl}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="${T('issueTitle')}">↗</a>`:''}
        </div>
        ${repo?`<div class="inst-repo">${esc(repo)}</div>`:''}
        <div class="inst-stat">
          <span>${s.turns}t</span>
          <span>${fN(s.totalOut)} tok</span>
          ${s.totalMs?`<span>${fMs(s.totalMs)}</span>`:''}
        </div>
        ${dots?`<div class="inst-phase-bar">${dots}</div>`:''}
      </div>
    </div>`
  }).join('')
}

function selectInstance(i){
  selInst=i;openTurnForPrompt=-1;selSpanId=null
  // Reflect the selection in the URL so the session is directly linkable by id.
  const id=instances[i]?.id
  if(id){const h='#'+encodeURIComponent(id);if(location.hash!==h){_suppressHash=true;location.hash=h}}
  renderSidebar();renderChat()
}

// ──────────── DEEP-LINK BY ID (#<instanceId>) ────────────
let _suppressHash=false
function instIndexById(raw){
  if(!raw)return -1
  const dec=(()=>{try{return decodeURIComponent(raw)}catch{return raw}})()
  let idx=instances.findIndex(x=>x.id===dec)
  if(idx<0)idx=instances.findIndex(x=>dispName(x.id)===dec) // tolerate the short display name
  return idx
}
function selectFromHash(){
  const raw=location.hash.replace(/^#/,'')
  if(!raw)return false
  const idx=instIndexById(raw)
  if(idx>=0){selectInstance(idx);return true}
  return false
}
window.addEventListener('hashchange',()=>{
  if(_suppressHash){_suppressHash=false;return} // our own selectInstance write — ignore
  selectFromHash()
})

// ──────────── CHAT ────────────
function renderChat(){
  document.getElementById('dropzone').style.display='none'
  document.getElementById('workspace').style.display='flex'
  closePromptPanel()
  const inst=instances[selInst];if(!inst)return
  // agent preset for Quanta rows — from the run meta sidecar when present
  const rm=inst.runMeta
  curPreset=rm?.env?.QUANTA_BENCH_PRESET??rm?.preset??((Array.isArray(rm?.argv)?rm.argv.join(' '):'').match(/--preset\s+(\S+)/)?.[1])??''

  // header
  const repo=repoName(inst.id),name=dispName(inst.id),iurl=issueUrl(inst.id)
  document.getElementById('inst-title').innerHTML=
    (repo?`<span class="repo">${esc(repo)}/</span>`:'')+`<span>${esc(name)}</span>`+
    (iurl?` <a class="issue-link" href="${iurl}" target="_blank" rel="noopener" title="${T('issueTitle')}">↗</a>`:'')

  const s=inst.stats,firstTs=inst.turns.find(t=>t.ts)?.ts??null
  document.getElementById('inst-meta-row').innerHTML=[
    firstTs?`<span class="stat-chip">📅 <b>${fTs(firstTs)}</b></span>`:null,
    `<span class="stat-chip"><b>${s.turns}</b> ${T('turns')}</span>`,
    s.totalIn?`<span class="stat-chip">↑ <b>${fN(s.totalIn)}</b></span>`:null,
    s.totalOut?`<span class="stat-chip">↓ <b>${fN(s.totalOut)}</b></span>`:null,
    s.totalMs?`<span class="stat-chip">⏱ <b>${fMs(s.totalMs)}</b></span>`:null,
    ...s.models.map(m=>`<span class="stat-chip">🤖 <b>${esc(m)}</b></span>`),
  ].filter(Boolean).join('')

  const fm=inst.fileMap,MAX=10
  const edited=[...fm.entries()].filter(([,v])=>v.e>0)
  const readOnly=[...fm.entries()].filter(([,v])=>v.e===0)
  const chips=[
    ...edited.slice(0,MAX).map(([p,v])=>`<span class="fc ed" title="${esc(p)}">✏ ${esc(shortPath(p))}</span>`),
    ...readOnly.slice(0,Math.max(0,MAX-edited.length)).map(([p,v])=>`<span class="fc rd" title="${esc(p)}">📄 ${esc(shortPath(p))}</span>`),
    fm.size>MAX?`<span class="fc rd">+${fm.size-MAX} ${T('more')}</span>`:null,
  ].filter(Boolean)
  document.getElementById('file-chip-row').innerHTML=chips.join('')

  // run meta section (below file chips)
  const metaEl=document.getElementById('run-meta-section')
  if(inst.runMeta){
    metaEl.innerHTML=renderRunMeta(inst.runMeta)
    metaEl.style.display='block'
  }else{
    metaEl.innerHTML='';metaEl.style.display='none'
  }

  // C6: expose the view switch only when a unified span tree is joinable; a
  // legacy session (no traceId) has no tree so we keep it on group-chat and hide
  // the toggle. The group-chat projection is NEVER deleted.
  const tree=inst.spanTree
  const vsw=document.getElementById('view-switch')
  vsw.classList.toggle('hidden',!(tree&&tree.unified))
  if(!(tree&&tree.unified)&&viewMode==='tree')viewMode='chat'
  document.getElementById('vs-chat')?.classList.toggle('active',viewMode==='chat')
  document.getElementById('vs-tree')?.classList.toggle('active',viewMode==='tree')

  const scroll=document.getElementById('chat-scroll')
  const treeLayout=document.getElementById('tree-layout')
  if(viewMode==='tree'&&tree&&tree.unified){
    scroll.style.display='none'
    treeLayout.style.display='flex'
    renderSpanTreeView(inst)
    return
  }
  scroll.style.display='block'
  treeLayout.style.display='none'

  // render turns
  scroll.innerHTML=''

  // NOTE: the system prompt is now shown PER-TURN inside each Quanta row (the
  // agent swaps a phase-specific system prompt — localize vs repro vs repair —
  // for every LLM call), not once at the top where the per-phase variation hid.

  // RUN SUMMARY (audit finding G): pin the scaffold's key mechanical outcomes —
  // the verify verdict, patch, sandbox, errors — at the TOP, so the run's result
  // isn't buried at the bottom of a long ts-sorted timeline.
  const sum=renderRunSummary(inst)
  if(sum){const el=document.createElement('div');el.innerHTML=sum;if(el.firstElementChild)scroll.appendChild(el.firstElementChild)}

  // debug index: anomaly jump-list + file edit timeline
  const dbg=renderDebugIndex(inst)
  if(dbg){
    const el=document.createElement('div')
    el.innerHTML=dbg
    scroll.appendChild(el.firstElementChild)
  }

  // UNIFIED TIMELINE: interleave LLM turns (cassette) with the scaffold's own
  // ACTION events (observe) by timestamp — sandbox / verify / patch / error are
  // things Quanta did mechanically WITHOUT the LLM, so they belong in the flow.
  // The `localize` event records the tree-build that happens BEFORE the localize
  // LLM call and feeds its payload. It's emitted post-call (candidate count is
  // known only after), so instead of placing it by ts we inject it INSIDE the
  // localize turn — between 나(task) and the Quanta payload (task → 🌳 build tree
  // → send payload). Other scaffold events stay in the ts-sorted flow.
  const localizeEv=(inst.observe||[]).find(e=>e.kind==='localize')
  const firstLocalizeIdx=inst.turns.findIndex(t=>t.phase==='localize')
  const items=[
    ...inst.turns.map((turn,i)=>({ts:turn.ts||0,kind:'turn',turn,i})),
    ...(inst.observe||[]).filter(e=>SCAFFOLD_SHOW[e.kind]&&e.kind!=='localize').map(e=>({ts:e.ts||0,kind:'action',ev:e})),
  ].sort((a,b)=>(a.ts-b.ts)||(a.kind==='turn'?-1:1))

  let curPhase=null
  for(const it of items){
    if(it.kind==='action'){
      const el=document.createElement('div')
      el.innerHTML=renderScaffoldAction(it.ev)
      if(el.firstElementChild)scroll.appendChild(el.firstElementChild)
      continue
    }
    const {turn,i}=it
    // phase band on phase change (localize / repro / repair …)
    if(turn.phase!==curPhase){
      curPhase=turn.phase
      const pm=PHASE_META[curPhase]??{label:String(curPhase).toUpperCase(),icon:'•'}
      let n=0;for(let j=i;j<inst.turns.length&&inst.turns[j].phase===curPhase;j++)n++
      const band=document.createElement('div')
      band.className=`phase-band ph-${esc(curPhase)}`
      band.innerHTML=`<span class="pb-icon">${pm.icon}</span><span class="pb-label">${esc(pm.label)}</span><span class="pb-count">${n} ${T('turns')}</span>`
      scroll.appendChild(band)
    }
    const el=document.createElement('div')
    el.className='turn-group'
    el.id=`tg-${i}`
    // inject the 🌳 tree-build action between 나 and the Quanta payload
    const preQuanta=(i===firstLocalizeIdx&&localizeEv)?renderScaffoldAction(localizeEv):''
    el.innerHTML=renderTurnGroup(turn,i,preQuanta)
    scroll.appendChild(el)
  }
}

// ──────────── SPAN TREE VIEW (C6) ────────────
// Left rail = the joined span tree; right pane = the evidence UNDER the selected
// span (that span's OBSERVE events + the chat cassette payload). Nothing here
// requires raw cassette content to render — a node with no cassette still shows
// its OBSERVE evidence and its place in the tree.
const SPAN_KIND_ICON={instance:'🏁',invoke:'🤖',turn:'🔁',chat:'💬',tool:'🔧',span:'•'}
function renderSpanTreeView(inst){
  const tree=inst.spanTree
  // default selection = the first chat/tool leaf so the evidence pane isn't empty
  if(!selSpanId||!tree.nodes.has(selSpanId)){
    const leaf=[...tree.nodes.values()].find(n=>n.kind==='chat'||n.kind==='tool')
    selSpanId=leaf?leaf.spanId:(tree.roots[0]?.spanId??null)
  }
  const railHtml=[]
  railHtml.push(`<div class="tree-hd">🌲 ${T('spanTree')}</div>`)
  // correlation-state badges for the WHOLE session
  const badges=[]
  const bmap={unified:['b-unified','corrUnified'],legacy:['b-legacy','corrLegacy'],redacted:['b-redacted','corrRedacted'],truncated:['b-truncated','corrTruncated'],degraded:['b-degraded','corrDegraded']}
  if(tree.unified)tree.corr.add('unified')
  for(const k of ['unified','legacy','redacted','truncated','degraded'])
    if(tree.corr.has(k)){const[cls,tk]=bmap[k];badges.push(`<span class="badge ${cls}">${T(tk)}</span>`)}
  if(badges.length)railHtml.push(`<div class="tree-corr">${badges.join('')}</div>`)
  for(const root of tree.roots)railHtml.push(renderSpanNode(root,0))
  document.getElementById('span-tree').innerHTML=railHtml.join('')
  document.getElementById('tree-evidence').innerHTML=renderSpanEvidence(inst,selSpanId)
}
// One tree row + its subtree. Depth drives the indent; a node with children gets
// a caret (collapse toggles the whole subtree via a data-parent chain).
function renderSpanNode(node,depth){
  const tag=SPAN_KIND_TAG[node.kind]||'tk-span'
  const icon=SPAN_KIND_ICON[node.kind]||'•'
  const label=node.name||(node.kind==='chat'?'chat':node.kind==='tool'?'execute_tool':node.spanId.slice(0,10))
  const evCount=node.evidence.length+(node.cassette?1:0)
  const degraded=node.evidence.some(e=>e.degraded)||!node.traceId
  const sel=node.spanId===selSpanId?' sel':''
  const hasKids=node.children.length>0
  const row=`<div class="tnode${sel}" style="padding-left:${8+depth*14}px" data-span="${esc(node.spanId)}" onclick="selectSpan('${esc(node.spanId)}')">
    ${hasKids?`<span class="t-caret" onclick="event.stopPropagation();toggleTreeNode('${esc(node.spanId)}')">▼</span>`:`<span class="t-caret"></span>`}
    <span class="t-kind ${tag}">${icon} ${esc(node.kind)}</span>
    <span class="t-name" title="${esc(node.spanId)}">${esc(label)}</span>
    ${degraded?`<span class="badge b-degraded" title="missing trace ref">deg</span>`:''}
    ${evCount?`<span class="t-ev" title="evidence under this span">${evCount}</span>`:''}
  </div>`
  const kids=node.children.map(c=>renderSpanNode(c,depth+1)).join('')
  return row+(hasKids?`<div class="t-kids" data-parent="${esc(node.spanId)}">${kids}</div>`:'')
}
function selectSpan(spanId){selSpanId=spanId;if(selInst>=0)renderSpanTreeView(instances[selInst])}
function toggleTreeNode(spanId){
  const kids=document.querySelector(`.t-kids[data-parent="${cssEsc(spanId)}"]`)
  const row=document.querySelector(`.tnode[data-span="${cssEsc(spanId)}"]`)
  if(!kids)return
  const hidden=kids.style.display==='none'
  kids.style.display=hidden?'block':'none'
  row?.classList.toggle('collapsed',!hidden)
}
function cssEsc(s){return String(s).replace(/["\\]/g,'\\$&')}

// The evidence UNDER one span: its OBSERVE events + (for a chat span) the
// cassette request/response payload. This is the {traceId,spanId} JOIN made
// visible — selecting a chat/tool span shows ONLY that span's evidence.
function renderSpanEvidence(inst,spanId){
  const tree=inst.spanTree
  const node=spanId&&tree.nodes.get(spanId)
  if(!node)return`<div class="tree-empty">${T('selectSpan')}</div>`
  const parts=[]
  const traceShort=node.traceId?`<span class="tev-span-id">trace ${esc(String(node.traceId).slice(0,12))}…</span>`:`<span class="badge b-degraded">no traceId</span>`
  parts.push(`<div class="tev-hd">${SPAN_KIND_ICON[node.kind]||'•'} ${esc(node.name||node.kind)} <span class="tev-span-id">span ${esc(String(node.spanId).slice(0,12))}…</span>${traceShort}</div>`)
  // OBSERVE evidence rows (verify / patch / sandbox / tool_result / …)
  const evs=[...node.evidence].sort((a,b)=>(a.ts||0)-(b.ts||0))
  for(const ev of evs){
    const id=uid()
    const body=esc(JSON.stringify(ev.data,null,2))
    const time=fTime(ev.ts)
    const red=ev.redaction&&ev.redaction.applied?`<span class="badge b-redacted">redacted</span>`:''
    const deg=ev.degraded?`<span class="badge b-degraded">degraded</span>`:''
    parts.push(`<div class="tev-card" id="${id}">
      <div class="tev-card-hd" onclick="toggle('${id}')">
        <span class="tev-kind-tag">${esc(ev.kind)}</span>${red}${deg}
        <span>${esc(evSummary(ev))}</span>
        ${time?`<span class="tev-time">${time}</span>`:''}
      </div>
      <div class="tev-body">${body}</div>
    </div>`)
  }
  // the cassette payload for a chat span (the LLM request+response) — but the
  // tree NEVER requires it: absence just means no cassette row.
  if(node.cassette){
    const id=uid()
    const t=node.cassette
    const req=renderRawPayloadText(t)
    const resp=(t.output?.text||'').trim()
    const body=esc(req+(resp?`\n\n━━ response ━━\n${resp}`:''))
    parts.push(`<div class="tev-card tev-cassette" id="${id}">
      <div class="tev-card-hd" onclick="toggle('${id}')">
        <span class="tev-kind-tag">chat</span>
        <span>💬 ${T('cassettePayload')}${t.meta?.model?` · ${esc(t.meta.model)}`:''}</span>
        ${t.ts?`<span class="tev-time">${fTime(t.ts)}</span>`:''}
      </div>
      <div class="tev-body">${body}</div>
    </div>`)
  }
  if(evs.length===0&&!node.cassette)parts.push(`<div class="tree-empty">— (structural span · no leaf evidence)</div>`)
  return parts.join('')
}
// short one-line summary of a leaf-evidence event for the collapsed card header
function evSummary(ev){
  const d=ev.data||{}
  if(ev.kind==='verify')return`exit ${d.exitCode??'?'} · ${d.passed?'passed':'FAILED'}`
  if(ev.kind==='patch_generated'||ev.kind==='patch_applied')return`${d.filesChanged??'?'}f/${d.hunks??'?'}h · ${d.applyStatus??''}`
  if(ev.kind==='sandbox')return`base ${String(d.baseCommit||'').slice(0,8)}`
  if(ev.kind==='localize')return`${d.treeFileCount??'?'} files → ${d.rankedCandidateCount??'?'} candidates${d.truncated?' · truncated':''}`
  if(ev.kind==='tool_result')return`${d.name??'?'} · ${d.ok?'ok':'fail'}${d.exitCode!=null?` (exit ${d.exitCode})`:''}`
  if(ev.kind==='tool_call')return`${d.name??d.tool??'?'}`
  if(ev.kind==='llm_usage')return`↑${d.inputTokens??'?'} ↓${d.outputTokens??'?'}`
  if(ev.kind==='error')return String(d.message||'').slice(0,80)
  return String(JSON.stringify(d)).slice(0,80)
}
// verbatim request payload as plain text (reuses the group-chat payload logic
// but returns a string for the evidence pane)
function renderRawPayloadText(turn){
  const seg=[]
  const s=typeof turn.system==='string'?turn.system:Array.isArray(turn.system)?turn.system.map(b=>b.text??b.content??'').join('\n\n'):''
  if(s.trim())seg.push('━━ system ━━\n'+s)
  for(const m of (turn.allMsgs||[])){
    const c=m.content
    const txt=typeof c==='string'?c:Array.isArray(c)?c.map(b=>{
      if(typeof b==='string')return b
      if(b.type==='text')return b.text??''
      if(b.type==='tool_use')return`⟦tool_use ${b.name??'?'} ${JSON.stringify(b.input??{})}⟧`
      if(b.type==='tool_result'){const rc=b.content;const rt=typeof rc==='string'?rc:Array.isArray(rc)?rc.map(x=>x.text??'').join(''):'';return`⟦tool_result ${rt}⟧`}
      return JSON.stringify(b)
    }).join('\n'):''
    seg.push(`━━ ${m.role??'user'} ━━\n${txt}`)
  }
  return seg.join('\n\n')
}

// Pinned run summary — the scaffold's key mechanical outcomes, hoisted out of
// the ts-sorted timeline so the run verdict is the FIRST thing you see.
function renderRunSummary(inst){
  const obs=inst.observe||[]
  if(!obs.length)return''
  const last=k=>{for(let i=obs.length-1;i>=0;i--)if(obs[i].kind===k)return obs[i].data||{};return null}
  const verify=last('verify'),patch=last('patch_generated'),sandbox=last('sandbox')
  const errs=obs.filter(e=>e.kind==='error').length
  const verdictMeta=inst.runMeta?.verdict
  const chips=[]
  if(verify){
    const ok=verify.passed===true
    chips.push(`<span class="rs-chip ${ok?'rs-ok':'rs-fail'}">${ok?'✅ RESOLVED':'❌ FAILED'} · verify exit ${verify.exitCode}</span>`)
  }else if(verdictMeta){
    chips.push(`<span class="rs-chip ${verdictMeta.passed?'rs-ok':'rs-fail'}">${verdictMeta.passed?'✅ RESOLVED':'❌ FAILED'}</span>`)
  }
  if(patch)chips.push(`<span class="rs-chip">📦 patch ${patch.filesChanged??'?'}f/${patch.hunks??'?'}h</span>`)
  if(sandbox)chips.push(`<span class="rs-chip">🧰 sandbox ${String(sandbox.baseCommit||'').slice(0,7)}</span>`)
  if(errs)chips.push(`<span class="rs-chip rs-fail">⚠ ${errs} error${errs>1?'s':''}</span>`)
  const kinds={};obs.forEach(e=>kinds[e.kind]=(kinds[e.kind]||0)+1)
  if(!chips.length)return''
  return`<div class="run-summary">
    <div class="rs-hd">🛰 ${T('runOutcome')}</div>
    <div class="rs-chips">${chips.join('')}</div>
    <div class="rs-note">${obs.length} ${T('scaffoldEvents')} · ${esc(Object.entries(kinds).map(([k,n])=>`${k}×${n}`).join(' '))}</div>
  </div>`
}

// Scaffold ACTION kinds surfaced in the timeline (the mechanical, non-LLM ones
// the cassette can't show). LLM turns + tool_call/result already render as turns.
const SCAFFOLD_SHOW={sandbox:1,localize:1,repro_select:1,patch_generated:1,verify:1,error:1}
