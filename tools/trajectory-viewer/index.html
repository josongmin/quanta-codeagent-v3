// ──────────── DEBUG INDEX ────────────
function jumpToTurn(i){
  const el=document.getElementById(`tg-${i}`)
  if(!el)return
  el.scrollIntoView({behavior:'smooth',block:'center'})
  el.classList.add('tg-flash')
  setTimeout(()=>el.classList.remove('tg-flash'),1200)
}
function renderDebugIndex(inst){
  const an=inst.anomalies??[],tl=inst.fileTimeline??[]
  if(!an.length&&!tl.length)return''
  // dedupe identical anomalies (e.g. `rg: command not found` ×486) → one row
  // with an occurrence count + list of turns, so a repeated failure reads as a
  // single insight instead of flooding the index.
  const groups=new Map()
  for(const a of an){
    const key=a.kind+'|'+a.preview.replace(/\d+/g,'#')
    if(!groups.has(key))groups.set(key,{...a,turns:[]})
    groups.get(key).turns.push(a.turn)
  }
  const anRows=[...groups.values()].map(a=>{
    const d=ANOM[a.kind]
    const n=a.turns.length
    return`<div class="dbg-row" onclick="jumpToTurn(${a.turns[0]})">
      <span class="dbg-jump">T${a.turns[0]}</span>
      <span class="dbg-kind" style="color:${d.color}">${d.icon} ${d.label}</span>
      ${n>1?`<span class="dbg-count">×${n}</span>`:''}
      <span class="dbg-tool">${esc(a.tool)}</span>
      <span class="dbg-prev">${esc(a.preview)}</span>
    </div>`
  }).join('')
  const tlRows=tl.map(([path,ev])=>{
    const dots=ev.map(e=>{
      const cls=e.kind==='read'?'tld-read':e.stale?'tld-stale':e.ok?'tld-ok':'tld-fail'
      const sym=e.kind==='read'?'r':e.stale?'✕':e.ok?'✓':'!'
      return`<span class="tld ${cls}" title="T${e.turn} ${e.kind}${e.stale?' (stale)':''}" onclick="jumpToTurn(${e.turn})">${sym}</span>`
    }).join('')
    const edits=ev.filter(e=>e.kind==='edit').length
    return`<div class="tl-row">
      <span class="tl-file" title="${esc(path)}">✏ ${esc(shortPath(path))}</span>
      <span class="tl-count">${edits}×</span>
      <span class="tl-dots">${dots}</span>
    </div>`
  }).join('')
  const id=uid()
  return`<div class="dbg-index" id="${id}">
    <div class="dbg-hd" onclick="toggle('${id}')">
      <span class="dbg-chev">▶</span>
      <span class="dbg-title">${T('debugIndex')}</span>
      ${an.length?`<span class="dbg-badge anom">${an.length} ${T('anomalies')}</span>`:''}
      ${tl.length?`<span class="dbg-badge file">${tl.length} ${T('editedFiles')}</span>`:''}
    </div>
    <div class="dbg-body">
      ${an.length?`<div class="dbg-sec">${T('anomalies')}</div>${anRows}`:''}
      ${tl.length?`<div class="dbg-sec">${T('fileTimeline')}</div>${tlRows}`:''}
    </div>
  </div>`
}

// ──────────── TURN GROUP ────────────
function turnEditVerifyChips(turn){
  // Prefer debug toolExec (accurate ok flags) over tool-scan heuristics.
  const dbgExec=turn.meta?.debug?.toolExec
  let editOk=0,editFail=0,verifyOk=0,verifyFail=0
  if(Array.isArray(dbgExec)&&dbgExec.length){
    for(const t of dbgExec){
      const ok=t.ok!==false
      if(t.file!=null){ok?editOk++:editFail++}
      else if(t.name==='test_runner'||t.name==='bash'){ok?verifyOk++:verifyFail++}
    }
  }else{
    // fallback: scan tool call/result pairs
    for(const t of (turn.output?.tools??[])){
      const n=(t.name??'').toLowerCase()
      const r=String(t.result??'')
      const isEdit=['edit','str_replace','str_replace_editor','write','write_file','apply_patch'].includes(n)
      const isVerify=n==='test_runner'||(n==='bash'&&/pytest|unittest|jest|npm test|make test/.test(t.input?.command??''))
      if(!isEdit&&!isVerify)continue
      const ok=!/stale_precondition|^error\b|FAILED|FAIL\b/i.test(r)
      if(isEdit){ok?editOk++:editFail++}
      else{ok?verifyOk++:verifyFail++}
    }
  }
  const chips=[]
  if(editOk+editFail>0)chips.push(`<span class="tv-chip tv-edit${editFail>0?' tv-fail':''}" title="${editOk} ok / ${editFail} fail edit(s)">✏${editOk+editFail}${editFail>0?`<sup>✗${editFail}</sup>`:''}</span>`)
  if(verifyOk+verifyFail>0)chips.push(`<span class="tv-chip ${verifyOk>0?'tv-vok':'tv-vfail'}" title="verify: ${verifyOk} pass / ${verifyFail} fail">${verifyOk>0?'✓':'✗'}</span>`)
  return chips.join('')
}

// GROUP-CHAT TIMELINE: each turn emits up to 3 actor rows in flow order —
//   🧑 나(User, right)  →  🛰 Quanta(agent, left)  →  🤖 LLM(model, left)
// The scaffold and the model are SEPARATE actors: Quanta shows its work
// (thinking / tools / code locations) as a process view + the prompt it sends;
// the LLM shows only its response.
function renderTurnGroup(turn,idx,preQuantaHtml){
  const phase=detectPhase(turn,idx)
  const ts=fTime(turn.ts),dur=fMs(turn.meta?.durationMs),model=turn.meta?.model??''
  const tokIn=fN(turn.usage?.inputTokens??0),tokOut=fN(turn.usage?.outputTokens??0)
  const cacheRead=turn.usage?.cacheReadInputTokens??turn.usage?.cache_read_input_tokens
  const modelInitial=esc((model||'?').replace(/^gpt-?/i,'').slice(0,3)||'AI')
  const lane=turn.meta?.lane
  const laneBadge=lane?`<span class="lane-badge" style="background:${laneColor(lane)}" title="parallel lane">⑂ ${esc(lane)}</span>`:''
  const anomBadges=turn._anom?[...turn._anom].map(k=>`<span class="anom-badge" style="color:${ANOM[k].color}" title="${ANOM[k].label}">${ANOM[k].icon}</span>`).join(''):''
  const evChips=turnEditVerifyChips(turn)
  const phaseBadge=phase?`<span class="phase-badge ${phase}">${ph(phase)}</span>`:''

  const parts=buildUserParts(turn,idx===0)
  const rows=[]

  // 1) 나(User) — the human's task, right side
  for(const p of parts){
    if(p.role!=='user')continue
    rows.push(chatRow({side:'me',cls:'me',avatar:'🧑',name:T('you'),time:ts,body:renderPartBody(p,'me')}))
  }

  // 1.5) scaffold prep that runs BETWEEN the task and the LLM call (🌳 tree build)
  if(preQuantaHtml)rows.push(preQuantaHtml)

  // 2) Quanta SENDS an LLM message — the raw request payload. Just a message
  //    send: NO phase/intent tags (the phase lives on the band, not every
  //    message; sending to the LLM is sending to the LLM regardless of intent).
  const payloadHtml=renderRawPayload(turn)
  if(payloadHtml){
    rows.push(chatRow({
      side:'me',cls:'quanta',avatar:'🛰',name:'Quanta',time:ts,
      body:`<div class="msg-send-tag">📤 ${T('sentToLlm')}</div>`+payloadHtml,
    }))
  }

  // 3) LLM(model) — its reasoning: thinking + any text. The tool it DECIDES to
  //    use is EXECUTED by Quanta (below) as a distinct tool row.
  const thinkHtml=turn.output.thinking?renderThinking(turn.output.thinking):''
  const respHtml=turn.output.text.trim()?renderResponse(turn.output.text,idx):''
  const llmBody=thinkHtml+respHtml
  if(llmBody){
    const meta=`${tokIn||tokOut?`<span class="chat-tok">↑${tokIn} ↓${tokOut}${cacheRead?` ⚡${fN(cacheRead)}`:''}</span>`:''}${dur?`<span class="chat-dur">⏱ ${dur}</span>`:''}`
    rows.push(chatRow({
      side:'them',cls:'llm',avatar:modelInitial,name:model||T('llm'),tag:'LLM',time:ts,meta,
      body:llmBody,
    }))
  }

  // 4) Quanta TOOLS — the actual tool(s) it ran this turn (read/bash/edit/…),
  //    each a row labeled by the tool, with args + result. "실제 툴 사용" is
  //    Quanta's, on the right.
  for(const tool of turn.output.tools){
    rows.push(chatRow({
      side:'me',cls:'quanta',avatar:'🔧',name:'Quanta',tag:tool.name||'tool',time:ts,
      body:renderToolCall(tool),
    }))
  }

  return rows.join('')+renderTurnDebug(turn)
}

// The agent's phase-specific SYSTEM prompt for this LLM call (localize/repro/
// repair each get a distinct "You are a senior …" framing). Collapsed by default.
function renderSysPrompt(turn){
  const s=turn.system
  const t=typeof s==='string'?s:Array.isArray(s)?s.map(b=>b.text??b.content??'').join('\n\n'):''
  if(!t.trim())return''
  const id=uid()
  const preview=t.slice(0,64).replace(/\n/g,' ')
  return`<div class="sys-inline open" id="${id}">
    <div class="sys-inline-hd" onclick="toggle('${id}')"><span class="sys-inline-chev">▶</span>⚙ ${T('sysRole')} · ${esc(preview)}…</div>
    <pre class="sys-inline-body">${esc(t)}</pre>
  </div>`
}

// The RAW LLM request payload for this turn — system + full message array +
// tools — exactly what gets POSTed to the model, verbatim. Clamped with 더보기
// because the message history grows across a repair thread.
function renderRawPayload(turn){
  const seg=[]
  const s=typeof turn.system==='string'?turn.system:Array.isArray(turn.system)?turn.system.map(b=>b.text??b.content??'').join('\n\n'):''
  if(s.trim())seg.push('━━ system ━━\n'+s)
  for(const m of (turn.allMsgs||[])){
    const c=m.content
    const txt=typeof c==='string'?c:Array.isArray(c)?c.map(b=>{
      if(typeof b==='string')return b
      if(b.type==='text')return b.text??''
      if(b.type==='tool_use')return `⟦tool_use ${b.name??'?'} ${JSON.stringify(b.input??{})}⟧`
      if(b.type==='tool_result'){const rc=b.content;const rt=typeof rc==='string'?rc:Array.isArray(rc)?rc.map(x=>x.text??'').join(''):'';return `⟦tool_result ${rt}⟧`}
      return JSON.stringify(b)
    }).join('\n'):''
    seg.push(`━━ ${m.role??'user'} ━━\n${txt}`)
  }
  if(Array.isArray(turn.tools)&&turn.tools.length){
    seg.push(`━━ tools (${turn.tools.length}) ━━\n`+turn.tools.map(t=>t.name??'?').join(', '))
  }
  const raw=seg.join('\n\n')
  if(!raw.trim())return''
  const id=uid()
  return`<div class="payload-hd">📤 ${T('rawPayload')}</div>
    <div class="chat-bubble quanta clamp" id="${id}">${esc(raw)}<span class="clamp-fade"></span></div>
    <div class="more-btn" onclick="toggleClamp('${id}',this)">${T('showMore')} ▾</div>`
}

// One group-chat row: avatar + name/time header + body. `me` rows mirror right.
function chatRow(o){
  const cls=o.cls||'them'
  return`<div class="chat-row ${o.side}">
    <div class="chat-av ${cls}">${o.avatar}</div>
    <div class="chat-col">
      <div class="chat-hd">
        <span class="chat-name ${cls}">${esc(o.name)}</span>
        ${o.tag?`<span class="chat-tag ${cls}">${esc(o.tag)}</span>`:''}
        ${o.time?`<span class="chat-time">${o.time}</span>`:''}
        ${o.meta||''}
        ${o.badges||''}
        ${o.promptBtnIdx!=null?`<span class="full-prompt-btn${openTurnForPrompt===o.promptBtnIdx?' active':''}" data-turn="${o.promptBtnIdx}" onclick="openPromptPanel(${o.promptBtnIdx})" title="${T('fullPrompt')}">${T('promptBtn')}</span>`:''}
      </div>
      ${o.body}
    </div>
  </div>`
}

// Quanta's work for this step, shown as a PROCESS view (not chat bubbles):
// its reasoning, the tools it ran with results, and the code locations touched.
function renderAgentProcess(turn,toolResults){
  const bits=[]
  if(turn.output.thinking)bits.push(renderThinking(turn.output.thinking))
  for(const tr of toolResults)bits.push(renderPartBody(tr,'quanta'))
  if(turn.output.tools.length)bits.push(...turn.output.tools.map(t=>renderToolCall(t)))
  if(!bits.length)return''
  return`<div class="agent-proc"><div class="agent-proc-label">🛠 ${T('agentProc')}</div>${bits.join('')}</div>`
}

// per-turn debug enrichment (only present on QUANTA_BENCH_RECORD_TRAJECTORY=debug runs)
function renderTurnDebug(turn){
  const dbg=turn.meta?.debug
  if(!dbg||typeof dbg!=='object'||!Object.keys(dbg).length)return''
  const id=uid()
  const keys=Object.keys(dbg).join(', ')
  // build body: toolExec → compact table; other keys → JSON
  const bodyParts=[]
  for(const [k,v] of Object.entries(dbg)){
    if(k==='toolExec'&&Array.isArray(v)&&v.length){
      const hasFile=v.some(t=>t.file!=null)
      const rows=v.map(t=>{
        const ok=t.ok!==false
        const ms=t.durationMs!=null?`${t.durationMs}ms`:''
        const ex=t.exitCode!=null?`exit ${t.exitCode}`:''
        const fileCell=hasFile?`<td class="dbg-tool-file">${esc(t.file??'')}</td>`:''
        return`<tr><td>${esc(t.name??'?')}</td><td class="${ok?'dbg-tool-ok':'dbg-tool-fail'}">${ok?'✓':'✗'}</td><td>${esc(ms)}</td><td>${esc(ex)}</td>${fileCell}</tr>`
      }).join('')
      const fileHdr=hasFile?'<th>file</th>':''
      bodyParts.push(`<table class="dbg-tool-tbl"><tr><th>tool</th><th>ok</th><th>dur</th><th>exit</th>${fileHdr}</tr>${rows}</table>`)
    }else{
      bodyParts.push(`<div style="margin-bottom:4px"><span style="font-weight:700;color:#8055aa">${esc(k)}</span>: <span>${esc(JSON.stringify(v))}</span></div>`)
    }
  }
  return`<div class="turn-dbg" id="${id}">
    <div class="turn-dbg-hd" onclick="toggle('${id}')">
      <span class="turn-dbg-chev">▶</span>
      <span class="turn-dbg-label">🐞 debug</span>
      <span class="turn-dbg-keys">${esc(keys)}</span>
    </div>
    <div class="turn-dbg-body">${bodyParts.join('')}</div>
  </div>`
}

// ──────────── INPUT PARTS (나 · 에이전트) ────────────
// Everything the harness feeds the LLM is the AGENT's prompt-delivery, EXCEPT
// the very first task message of the whole run — that's the human (나) handing
// the agent the charter. isFirstTurn tags that one part as role:'user'.
function buildUserParts(turn,isFirstTurn){
  const parts=[]
  const toolResults=[]
  for(const msg of turn.newMsgs){
    if(msg.role==='assistant')continue
    const c=msg.content
    if(typeof c==='string'){
      if(c.includes('<system-reminder>')||c.includes('<system_reminder>'))continue
      if(c.trim())parts.push({type:'text',text:c})
    }else if(Array.isArray(c)){
      for(const b of c){
        if(b.type==='tool_result'){
          if(b._paired){
            toolResults.push({id:b.tool_use_id,content:typeof b.content==='string'?b.content:Array.isArray(b.content)?b.content.map(x=>x.text??'').join(''):''})
          }else{
            const content=typeof b.content==='string'?b.content:Array.isArray(b.content)?b.content.map(x=>x.text??'').join(''):''
            toolResults.push({id:b.tool_use_id,content,unpaired:true})
          }
        }
        if(b.type==='text'){
          const t=b.text??''
          if(t.includes('<system-reminder>')||t.includes('<system_reminder>'))continue
          if(t.includes('<quanta_observations>')){parts.push({type:'obs',text:t});continue}
          if(t.trim())parts.push({type:'text',text:t})
        }
      }
    }
  }
  if(toolResults.length)parts.unshift({type:'tool_results',items:toolResults})
  // The opening prompt is the AGENT's constructed localize instruction that
  // EMBEDS the human's bug report (`# Issue …`). Split that one message so the
  // issue reads as 나(User) and the surrounding tree/task as the 에이전트 that
  // wrapped and delivered it. Everything else stays 에이전트 by default.
  if(isFirstTurn){
    const fi=parts.findIndex(p=>p.type==='text')
    if(fi>=0){
      const sp=splitCharter(parts[fi].text)
      if(sp){
        const repl=[]
        if(sp.issue)repl.push({type:'text',role:'user',text:sp.issue})
        if(sp.rest)repl.push({type:'text',role:'agent',text:sp.rest})
        if(repl.length)parts.splice(fi,1,...repl)
      }
    }
  }
  return parts
}
// Extract the human ISSUE block (`# Issue …` up to the next top-level `#` heading)
// out of the agent's opening prompt. Returns {issue, rest} or null if absent.
function splitCharter(text){
  const m=String(text??'').match(/#\s+Issue\b[\s\S]*?(?=\n#\s+\S|$)/)
  if(!m)return null
  const issue=m[0].trim()
  const rest=(text.slice(0,m.index)+text.slice(m.index+m[0].length)).trim()
  return{issue,rest}
}

// Body content of an input part (no actor wrapper — chatRow provides that).
// text → a chat bubble tinted for the actor; obs/tool_results → process items.
function renderPartBody(p,bubbleCls){
  if(p.type==='text'){
    const cls=bubbleCls||'quanta'
    // Long prompts: show the TOP (clamped, faded) with a 더보기 below to expand
    // inline — no jump to the side panel.
    const long=p.text.length>360||(p.text.match(/\n/g)||[]).length>7
    if(long){
      const id=uid()
      return`<div class="chat-bubble ${cls} clamp" id="${id}">${esc(p.text)}<span class="clamp-fade"></span></div>
        <div class="more-btn" onclick="toggleClamp('${id}',this)">${T('showMore')} ▾</div>`
    }
    return`<div class="chat-bubble ${cls}">${esc(p.text)}</div>`
  }
  if(p.type==='obs'){
    const id=uid()
    const preview=p.text.replace(/<[^>]+>/g,'').slice(0,80).replace(/\n/g,' ')
    return`<div class="obs-block open" id="${id}">
      <div class="obs-hd" onclick="toggle('${id}')"><span class="obs-chev">▶</span>${T('obsLabel')} · ${esc(preview)}…</div>
      <pre class="obs-body">${esc(p.text)}</pre>
    </div>`
  }
  if(p.type==='tool_results'){
    const rows=p.items.map((it)=>{
      const preview=(it.content||'(empty)').replace(/\n/g,' ').slice(0,80)
      const rid=uid()
      return`<div class="tr-item open" id="${rid}" onclick="toggleTr('${rid}')">
        <span class="tr-chev">▶</span>
        <span style="color:#2a5a2a;font-size:10px">↩</span>
        <span class="tr-preview">${esc(preview)}</span>
      </div>
      <div class="tr-body" style="display:block">${esc(it.content||'(empty)')}</div>`
    }).join('')
    return`<div class="tool-results-bubble" style="margin-left:0">
      <div class="tr-hdr-label">${T('toolResultsHdr')}</div>
      ${rows}
    </div>`
  }
  return''
}

// ──────────── TOOL CALL ────────────
function renderToolCall(tool){
  const id=uid(),name=tool.name??'?',icon=tIcon(name),color=tColor(name)
  const inp=typeof tool.input==='object'&&tool.input!==null?tool.input:null
  const path=inp?.path??inp?.file_path??inp?.filename??''
  const cmd=inp?.command??''
  const preview=path?shortPath(path):cmd?cmd.slice(0,60):''

  const diffHtml=inp?renderDiff(inp,name):null
  const raw=JSON.stringify(typeof tool.input==='string'?tryJ(tool.input):tool.input,null,2)

  let resultHtml=''
  if(tool.result!==undefined){
    const r=tool.result??''
    const isErr=/\b(error|traceback|exception|fatal)\b/i.test(r.slice(0,300))
    const cls=isErr?'err':'ok'
    const short=r.length<300
    if(short){
      resultHtml=`<div class="tc-result always ${cls}">
        <div class="tcr-hd"><span class="tcr-status">${isErr?'⚠':'↩'}</span><span class="tcr-preview">${esc(r||'(empty)')}</span></div>
        <pre class="tcr-body">${esc(r||'(empty)')}</pre>
      </div>`
    }else{
      const rid=uid()
      resultHtml=`<div class="tc-result open ${cls}" id="${rid}">
        <div class="tcr-hd" onclick="toggle('${rid}')">
          <span class="tcr-status">${isErr?'⚠':'↩'}</span>
          <span class="tcr-preview">${esc(r.slice(0,120).replace(/\n/g,' '))}…</span>
          <span class="tcr-chev">▶</span>
        </div>
        <pre class="tcr-body">${esc(r)}</pre>
      </div>`
    }
  }

  return`<div class="tool-call open" id="${id}">
    <div class="tc-hd" onclick="toggle('${id}')">
      <span class="tc-icon">${icon}</span>
      <span class="tc-name-txt" style="color:${color}">${esc(name)}</span>
      ${preview?`<span class="tc-arg-preview">${esc(preview)}</span>`:''}
      <span class="tc-chev">▶</span>
    </div>
    <div class="tool-call-body">
      ${diffHtml||`<pre class="tc-raw">${esc(raw)}</pre>`}
      ${resultHtml}
    </div>
  </div>`
}

// ──────────── RESPONSE ────────────
// The LLM area shows gpt's RAW response verbatim — no agent-side parsing or
// beautifying (the localize file-card view is the AGENT's interpretation of this

function renderResponse(text,idx){
  if(!text.trim())return''
  return`<div class="chat-bubble llm resp-raw">${esc(text)}</div>`
}

// ──────────── DIFF ────────────
function renderDiff(inp,toolName){
  const n=(toolName??'').toLowerCase()
  if(!['edit','str_replace','str_replace_editor','apply_patch'].includes(n))return null
  const oldStr=inp?.old_str??inp?.old_string??''
  const newStr=inp?.new_str??inp?.new_string??inp?.content??''
  if(!oldStr&&!newStr)return null
  const path=inp?.path??inp?.file_path??inp?.filename??''
  const diff=diffLines(oldStr.split('\n'),newStr.split('\n'))
  const changed=new Set()
  diff.forEach((d,i)=>{if(d.t!=='c'){for(let j=i-2;j<=i+2;j++)changed.add(j)}})
  let h=`<div class="diff-blk">`
  if(path)h+=`<div class="diff-fhdr">📄 ${esc(shortPath(path))}</div>`
  let skipped=false
  for(let i=0;i<diff.length;i++){
    const d=diff[i]
    if(d.t==='c'&&!changed.has(i)){if(!skipped){h+=`<div class="dl do">···</div>`;skipped=true}}
    else{skipped=false;const cls=d.t==='d'?'dd':d.t==='a'?'da':'dc';const s=d.t==='d'?'-':d.t==='a'?'+':' ';h+=`<div class="dl ${cls}"><span class="ds">${s}</span>${esc(d.text)}</div>`}
  }
  return h+'</div>'
}
function diffLines(a,b){
  if(a.length+b.length>600)return[...a.map(t=>({t:'d',text:t})),...b.map(t=>({t:'a',text:t}))]
  const[m,n]=[a.length,b.length]
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0))
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1])
  const res=[];let i=0,j=0
  while(i<m||j<n){
    if(i<m&&j<n&&a[i]===b[j]){res.push({t:'c',text:a[i++]});j++}
    else if(j>=n||(i<m&&dp[i+1][j]>=dp[i][j+1]))res.push({t:'d',text:a[i++]})
    else res.push({t:'a',text:b[j++]})
  }
  return res
}

// ──────────── RUN META ────────────
function renderRunMeta(meta){
  const id=uid()
  const env=meta.env??{}
  const argv=(meta.argv??[]).join(' ')
  const preset=env.QUANTA_BENCH_PRESET??T('unset')
  const model=meta.model??env.QUANTA_MODEL??'—'
  const provider=meta.provider??'—'
  const runId=meta.runId??'—'
  const ts=meta.recordedAt?new Date(meta.recordedAt).toLocaleString():'—'

  // split env into knob vs other QUANTA
  const knobEnv={},otherEnv={}
  for(const [k,v] of Object.entries(env)){
    if(k.startsWith('QUANTA_BENCH_')||k.startsWith('QUANTA_OBSERVE')||k.startsWith('QUANTA_LSP')||k.startsWith('QUANTA_DIFF'))knobEnv[k]=v
    else otherEnv[k]=v
  }

  const kvRow=(k,v)=>`<div class="rm-row"><span class="rm-key">${esc(k)}</span><span class="rm-val">${esc(String(v))}</span></div>`

  const knobRows=Object.entries(knobEnv).sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>kvRow(k,v)).join('')
  const otherRows=Object.entries(otherEnv).sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>kvRow(k,v)).join('')
  const argvRow=argv?`<div class="rm-row"><span class="rm-key">${T('argv')}</span><span class="rm-val rm-mono">${esc(argv)}</span></div>`:''

  const knobId=uid(),envId=uid()
  const verdict=meta.verdict
  const verdictBadge=verdict!=null
    ? verdict.passed
      ? `<span class="rm-badge rm-pass">✅ passed · ${verdict.patchBytes??0}B</span>`
      : `<span class="rm-badge rm-fail">❌ failed · ${verdict.patchBytes??0}B</span>`
    : ''
  const debugBadge=meta.debug?`<span class="rm-badge rm-debug" title="QUANTA_BENCH_RECORD_TRAJECTORY=debug">🐞 debug</span>`:''
  return`<div class="run-meta-block">
    <div class="rm-summary">
      ${verdictBadge}
      ${debugBadge}
      <span class="rm-badge">🕐 ${esc(ts)}</span>
      <span class="rm-badge">🤖 ${esc(provider)}/${esc(model)}</span>
      <span class="rm-badge">📋 ${esc(preset)}</span>
      ${runId!=='—'?`<span class="rm-badge run-id" title="${esc(runId)}">🔑 ${esc(runId.slice(0,20))}…</span>`:''}
    </div>
    ${argvRow?`<div class="rm-argv">${argvRow}</div>`:''}
    ${knobRows?`<div class="rm-group">
      <div class="rm-group-hd" onclick="toggle('${knobId}')"><span class="rm-group-chev">▶</span>${T('knobs')} <span class="rm-cnt">${Object.keys(knobEnv).length}</span></div>
      <div class="rm-group-body" id="${knobId}">${knobRows}</div>
    </div>`:''}
    ${otherRows?`<div class="rm-group">
      <div class="rm-group-hd" onclick="toggle('${envId}')"><span class="rm-group-chev">▶</span>${T('otherEnv')} <span class="rm-cnt">${Object.keys(otherEnv).length}</span></div>
      <div class="rm-group-body" id="${envId}">${otherRows}</div>
    </div>`:''}
    ${renderActionTrace(meta.actionTrace,uid())}
  </div>`
}

function renderActionTrace(trace,id){
  if(!Array.isArray(trace)||!trace.length)return''
  const items=trace.map((a,i)=>`<div class="at-item"><span class="at-idx">${i+1}</span><span class="at-action">${esc(a)}</span></div>`).join('')
  return`<div class="rm-group">
    <div class="rm-group-hd" onclick="toggle('${id}')"><span class="rm-group-chev">▶</span>actionTrace <span class="rm-cnt">${trace.length}</span></div>
    <div class="rm-group-body" id="${id}">${items}</div>
  </div>`
}

// ──────────── PROMPT PANEL ────────────
function openPromptPanel(turnIdx){
  openTurnForPrompt=turnIdx
  // update active button highlight — match by data-turn-idx, not DOM order
  document.querySelectorAll('.full-prompt-btn').forEach(btn=>btn.classList.toggle('active',+btn.dataset.turn===turnIdx))
  const inst=instances[selInst];if(!inst)return
  const turn=inst.turns[turnIdx];if(!turn)return
  const panel=document.getElementById('prompt-panel')
  panel.classList.remove('hidden')
  document.getElementById('pp-turn-label').textContent=`${T('turn')} ${turnIdx+1}`
  // Build ONE continuous, verbatim prompt stream. Structure is not chopped into
  // cards — it's marked by inline anchors and surfaced via the sticky overlay.
  const chunks=[]
  const pushSeg=(label,idx,raw)=>{
    // ONLY a zero-size anchor drives the sticky overlay — no visible split in
    // the body. The raw prompt reads as one continuous stream.
    if(chunks.length)chunks.push('\n\n')
    chunks.push(`<span class="pm-anchor" data-label="${esc(label)}" data-idx="${esc(String(idx))}"></span>`)
    chunks.push(renderRawBody(raw))
  }
  if(turn.system){
    const t=typeof turn.system==='string'?turn.system:Array.isArray(turn.system)?turn.system.map(b=>b.text??b.content??'').join('\n\n'):''
    pushSeg('SYSTEM','sys',t)
  }
  for(let i=0;i<(turn.allMsgs?.length??0);i++){
    const msg=turn.allMsgs[i]
    const role=msg.role??'user'
    // label by actual content, not just role: user-role text msgs are harness
    // prompts (task hints / system-reminders), not tool results.
    const kinds=Array.isArray(msg.content)?new Set(msg.content.map(p=>p&&p.type)):new Set(['text'])
    let label
    if(role==='assistant')label='Agent action'
    else if(kinds.has('tool_result'))label='Tool result'
    else label='Harness prompt'
    const raw=msgToRaw(msg)
    if(!raw)continue
    pushSeg(label,i,raw)
  }
  const scroll=document.getElementById('pp-scroll')
  // keep the overlay node, replace only the raw body
  scroll.querySelector('.pm-raw')?.remove()
  const rawEl=document.createElement('div')
  rawEl.className='pm-raw'
  rawEl.innerHTML=chunks.join('')
  scroll.appendChild(rawEl)
  scroll.scrollTop=0
  updatePromptOverlay()
}

// message → verbatim text, nothing hidden or truncated (this IS the raw prompt)
function msgToRaw(msg){
  const c=msg.content
  if(typeof c==='string')return c
  if(Array.isArray(c)){
    return c.map(b=>{
      if(b.type==='text')return b.text??''
      if(b.type==='tool_result'){
        const content=typeof b.content==='string'?b.content:Array.isArray(b.content)?b.content.map(x=>x.text??'').join(''):''
        return`↩ tool_result [${b.tool_use_id?.slice(-6)??'?'}]\n${content}`
      }
      if(b.type==='tool_use')return`⚙ ${b.name??'?'} ${JSON.stringify(b.input??{})}`
      return JSON.stringify(b)
    }).join('\n\n')
  }
  return String(c??'')
}

// escape + inject anchors on our own `##`-style delimiter headings so the
// overlay can nest a sub-section under the current message segment
function renderRawBody(text){
  return String(text??'').split('\n').map(line=>{
    const m=line.match(/^(#{1,6})\s+(.+?)\s*$/)
    if(m){
      const title=m[2].trim()
      return`<span class="pm-anchor pm-anchor-h" data-label="${esc(title)}"></span><span class="pm-h">${esc(line)}</span>`
    }
    return esc(line)
  }).join('\n')
}

// track scroll → update the single sticky breadcrumb (segment › ##-heading)
function updatePromptOverlay(){
  const scroll=document.getElementById('pp-scroll')
  const overlay=document.getElementById('pp-overlay')
  if(!scroll||!overlay)return
  const anchors=scroll.querySelectorAll('.pm-anchor')
  if(!anchors.length){overlay.textContent='';return}
  const line=scroll.getBoundingClientRect().top+(overlay.offsetHeight||0)+2
  let seg=null,sub=null
  anchors.forEach(a=>{
    if(a.getBoundingClientRect().top>line)return
    if(a.classList.contains('pm-anchor-h')){sub=a.dataset.label}
    else{seg={label:a.dataset.label,idx:a.dataset.idx};sub=null}
  })
  if(!seg){overlay.textContent='';return}
  let html=`${esc(seg.label)} [${esc(seg.idx)}]`
  if(sub)html+=`<span class="pp-ov-sub">${esc(sub)}</span>`
  overlay.innerHTML=html
}

function closePromptPanel(){
  openTurnForPrompt=-1
  document.getElementById('prompt-panel').classList.add('hidden')
  document.querySelectorAll('.full-prompt-btn').forEach(b=>b.classList.remove('active'))
}

// ──────────── HELPERS ────────────
let _uid=0
function uid(){return'e'+(++_uid)}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toggle(id){document.getElementById(id)?.classList.toggle('open')}
function toggleClamp(id,btn){
  const el=document.getElementById(id);if(!el)return
  const ex=el.classList.toggle('expanded')
  btn.textContent=(ex?T('showLess'):T('showMore'))+(ex?' ▴':' ▾')
}
function toggleTr(id){
  const el=document.getElementById(id);if(!el)return
  el.classList.toggle('open')
  const body=el.nextElementSibling
  if(body&&body.classList.contains('tr-body'))body.style.display=el.classList.contains('open')?'block':'none'
}

// ──────────── FILE I/O ────────────
function handleFile(f){
  if(!f)return
  const r=new FileReader()
  if(f.name.endsWith('.meta.json')){
    r.onload=ev=>loadMeta(ev.target.result,f.name)
  }else{
    r.onload=ev=>loadTrajectory(ev.target.result,f.name)
  }
  r.readAsText(f)
}
function handleFiles(files){Array.from(files).forEach(handleFile)}
document.getElementById('file-input').addEventListener('change',e=>handleFiles(e.target.files))
document.body.addEventListener('dragover',e=>{e.preventDefault();document.getElementById('dropzone').classList.add('drag-over')})
document.body.addEventListener('dragleave',()=>document.getElementById('dropzone').classList.remove('drag-over'))
document.body.addEventListener('drop',e=>{
  e.preventDefault();document.getElementById('dropzone').classList.remove('drag-over')
  handleFiles(e.dataTransfer.files)
})
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return
  if(e.key==='Escape')closePromptPanel()
  if(e.key==='ArrowUp'||e.key==='k'){selInst=Math.max(0,selInst-1);selectInstance(selInst)}
  if(e.key==='ArrowDown'||e.key==='j'){selInst=Math.min(instances.length-1,selInst+1);selectInstance(selInst)}
})

;(function(){
  const s=document.createElement('script');s.src='data.js'
  s.onload=()=>{
    if(window.__META__){
      // load all metas first so they're ready when trajectory attaches
      const metas=Array.isArray(window.__META__)?window.__META__:[window.__META__]
      metas.forEach(m=>{if(m?.instanceId)metaByInstance.set(m.instanceId,m)})
    }
    // Preferred shape: one session PER FILE (launch.ts bakes __SESSIONS__).
    if(Array.isArray(window.__SESSIONS__)&&window.__SESSIONS__.length){
      loadSessions(window.__SESSIONS__)
    }else if(window.__TRAJ__){
      // legacy single-blob fallback = one session
      loadTrajectory(window.__TRAJ__,'bench-trajectory.jsonl')
    }
  }
  document.head.appendChild(s)
})()
</script>
</body>
</html>
