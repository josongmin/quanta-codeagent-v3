# Grafana provisioning manifest (ADR-0160) — drops in `/etc/grafana/provisioning/dashboards/`.
# Pairs with grafana-quanta.json + future folder-resident dashboards.

apiVersion: 1

providers:
  - name: "quanta"
    orgId: 1
    folder: "quanta"
    folderUid: "quanta-dashboards"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/quanta
      foldersFromFilesStructure: true
