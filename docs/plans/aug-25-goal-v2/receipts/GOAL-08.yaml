round4 (2026-08-27, INDEPENDENT adversarial review — three parallel reviewers with distinct lenses, every claim re-verified by probe) — 3 real defects + test-quality findings, all fixed:
  kernel lens (CONFIRMED by the reviewer's repro, re-run by me): the round-3 kernel claim leaked when `turn.cancel` landed in the commit window (after the claim, before host start). The pre-aborted arm of runTurn RETURNS, it does not throw, so the catch-only release never ran: slot stayed "claimed", every later goal turn got `goal_attempt_claim_refused`, and the next PLAIN user turn took the orphan claim (autonomousTurnsStarted 1). Fix: release in the dispatch `finally`, keyed by attemptId (`SessionHost.releaseGoalAttempt(attemptId)`; the adapter releases only while the slot still holds THAT claim) — every path where the runner never took the claim releases; a take leaves an empty slot (no-op); a foreign claim / fail-stop is never touched. Hellgate tests/unit/host/goal-claim-cancel-leak-hellgate.test.ts (cancel on turn.started ⇒ slot empty, next goal turn RUNS, user turn unattributed; paired control; foreign claim untouched by a refused claim).
  CLI/fail-stop lens: (1) `recover()` had ZERO callers — a fail-stop was process-lifetime terminal and masked every later goal (the docstring promised "until a new objective generation"; nothing implemented it). Fix: `failStop(reason, objectiveId)` records the generation; the wake host lifts the fail-stop on the next edge when the live objectiveId is a DIFFERENT generation (same generation or unknown generation keeps it). (2) `/goal work` under a fail-stop printed "queued" then a drop notice calling the user's command a "continuation". Fix: `enqueueWork` returns a typed `{ ok:false, reason }` at command time (slot pre-check), notices name the prompt kind; a user work turn lost to the epoch race is announced. (3) the fail-stop check was arm-time only; a timer armed BEFORE the fail-stop fired into a claim refusal, and `/goal` said "armed" meanwhile. Fix: fire-time gate (typed rejection ⇒ reservation released) + status() reports the fail-stop before a pending timer. Refuted angles recorded by the reviewer: false drop with an active goal + empty slot (impossible: isStaleGoalContinuation already required active + revision match), busy loop after a drop (15 s clamp), CLI/kernel double-claim (CLI never dispatches turn.submit), `objectivePorts` spread vs facade getters (undefined-skip identical).
  test-quality lens: interleave hellgate was one-sided (B always refused; the "ran" branch was dead) → now asserts the typed refusal, nothing attributed, AND a fresh goal turn IS attributed (two-sided), deterministic via an LLM `entered` promise instead of sleeps; structural anti-vacuum control was a tautology about its own replacement → the SAME predicate is applied to two mutants; wiring pins tightened to the real slot instance (`const attemptSlot = args.objectiveAttemptSlot` / `args.runtime.objectiveAttemptSlot`) + runtime `objectivePorts` unit (same instance); compose structural predicate now also rejects raw `session.dispatch` / wire-literal splits; weak `.rejects.toBeDefined()` / bare `toBeInstanceOf(SessionProtocolValidationError)` replaced with `SessionRevisionConflictError` / `/invalid_turn_submit_provenance/`; the dead `throwOnRun` option removed; the daemon compose fail-stop test now arms first and fires into the gate. Kernel stub emulates the slot (one claim, taken by runTurn, release only while held + same id).
