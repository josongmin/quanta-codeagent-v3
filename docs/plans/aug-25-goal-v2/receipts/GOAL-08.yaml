    security/abuse lens — 4 real defects, all fixed:
      D1 (HIGH) a synchronous throw out of `handler.request` escaped Bun's `message()` and would take the WHOLE daemon down (every peer with it): `refuse()` reads live domain state, and no other pre-bridge consumer reaches into domain logic bare. Fix: `consumeGoalWorkFrame` is NO-THROW at the boundary (a failure is answered as a typed refusal), and `ws.send` is guarded too (a dead socket cannot crash the handler).
      D2 (MEDIUM-HIGH) an over-BUDGET goal turn was accepted and then silently dropped: the authority refuses the attempt INSIDE the turn, which becomes a `turn.failed` event while the dispatch still RESOLVES, so the late-refusal `.catch` never fired — the exact anti-pattern this module claims to fix. Fix: the budget is checked at request time (`turnsUsed >= maxTurns` ⇒ typed refusal).
      D3 (MEDIUM) `{ok:true,status:"accepted"}` was emitted before any real gate ran, so under any concurrency the ack lied (probe: 2000 frames ⇒ 2000 accepts + 1999 revision conflicts). Fix: the ack now comes AFTER a live-session pre-check (idle status, no unsent draft, no pending approval) taken from the SAME snapshot the turn is dispatched at; a change after that is still caught by the late refusal, which now distinguishes "could not start" from "turn refused".
      D4 (MEDIUM) a socket that never handshaked — or one whose `open()` had not finished registering — could START A BILLED TURN (the session bridge refuses `turn.*` from such a peer). Fix: `WSData.registered` is set after `buildRegisteredSession`; the verb refuses with "not ready — retry after the connect handshake" until then.
