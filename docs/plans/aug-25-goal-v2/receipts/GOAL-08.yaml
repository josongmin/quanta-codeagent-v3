  lens 1 (queue interleave, RED→GREEN hellgate tests/unit/host/goal-claim-queue-interleave-hellgate.test.ts): the round-2 claim was made at the SDK verb BEFORE `dispatch`. With a user turn already queued behind a running turn, that user turn started first and the turn-runner's `take()` handed it the goal claim: the USER'S OWN TURN was charged as an autonomous attempt (autonomousTurnsStarted 1, receipt with autonomous provenance) and the real goal turn died on a revision conflict. Reproduced with ground truth (probe RED: expected 0 got 1). Fix: the claim moved INTO the kernel scheduler's serialized dispatch (`claimGoalAttemptForTurn`, after the reducer guards + capability consumption, immediately before that same turn runs; a post-claim commit/host failure releases). The SDK verb only mints the capability and dispatches. Kernel round-3 cases (order / stale-revision-never-claims / absent seam refuses / refused claim / persistence failure releases / turn.run never claims) in kernel-turn-submit.test.ts.
