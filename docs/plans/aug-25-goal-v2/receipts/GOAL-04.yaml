  - After the fix, the real CLI continuation was ATTRIBUTED: attributed=true meter=true prov=autonomous-continuation; objective budget tokensUsed 2 / turnsUsed 1 (replay cassette 1+1), one settlement.
  - Usage definition mirrors the loop's meter ticks (input + output; reasoning inside output per src/llm/openai-responses-wire-reasoning-usage.test.ts; cache tokens excluded on both sides).
