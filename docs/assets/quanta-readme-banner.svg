    <text x="72" y="58" fill="#aebbd8" font-size="12" font-weight="600" letter-spacing="3">CODING AGENT RUNTIME</text>
    <text x="48" y="145" fill="#f1f5ff" font-size="76" font-weight="700" letter-spacing="-3">Quanta</text>
    <rect x="333" y="109" width="46" height="29" rx="7" fill="#1d2844" stroke="#3b4a70"/>
    <text x="344" y="129" fill="#aebfff" font-size="17" font-weight="600">v3</text>
    <text x="53" y="188" fill="#b4c0dc" font-size="21">Run. Inspect. Extend.</text>
    <text x="53" y="222" fill="#7e90b5" font-size="15">Code, tools, context, and execution policy.</text>
    <path d="M53 259H461" stroke="#28334e"/>
    <text x="53" y="289" fill="#9daecc" font-size="12" letter-spacing="1.5">TYPESCRIPT</text>
    <circle cx="168" cy="285" r="2" fill="#566483"/>
    <text x="186" y="289" fill="#9daecc" font-size="12" letter-spacing="1.5">BUN</text>
    <circle cx="234" cy="285" r="2" fill="#566483"/>
    <text x="252" y="289" fill="#9daecc" font-size="12" letter-spacing="1.5">PORTS &amp; ADAPTERS</text>
  </g>
  <g fill="none" stroke="#435779" stroke-width="1.5">
    <path d="M724 101H765Q785 101 785 121V150H826"/>
    <path d="M724 229H765Q785 229 785 209V180H826"/>
    <path d="M1068 101H1027Q1007 101 1007 121V150H966"/>
    <path d="M1068 229H1027Q1007 229 1007 209V180H966"/>
    <path d="M856 208V263H815M887 208V289M918 208V289M948 208V263H989" stroke="#4b6389"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
    <g fill="#111b30" stroke="#334563">
      <rect x="612" y="79" width="112" height="44" rx="10"/>
      <rect x="612" y="207" width="112" height="44" rx="10"/>
      <rect x="1068" y="79" width="148" height="44" rx="10"/>
      <rect x="1068" y="207" width="148" height="44" rx="10"/>
    </g>
    <g fill="#bbcae5">
