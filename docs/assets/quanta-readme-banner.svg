      <text x="1142" y="106">DESKTOP</text><text x="1142" y="234">SDK</text>
    </g>
    <rect x="826" y="120" width="140" height="88" rx="16" fill="#172540" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="896" y="162" fill="#e8f3ff" font-size="30" font-weight="700">Q</text>
    <text x="896" y="187" fill="#91b7d3" font-size="11" letter-spacing="2">RUNTIME</text>
    <g fill="#8fa3c7" font-size="10">
