<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Quanta CodeAgent v3</title>
  <desc id="desc">Terminal, web, desktop, and SDK surfaces connect to a shared coding agent runtime with tools, context, policy, and events.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#12172c"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#68e0cf"/><stop offset="1" stop-color="#91a0ff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#617de3" stop-opacity=".18"/><stop offset="1" stop-color="#617de3" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#93a4d1" stroke-opacity=".05"/></pattern>
  </defs>
  <rect x="1" y="1" width="1278" height="338" rx="20" fill="url(#background)" stroke="#2b3450"/>
  <rect x="2" y="2" width="1276" height="336" rx="19" fill="url(#grid)"/>
  <ellipse cx="940" cy="170" rx="320" ry="240" fill="url(#glow)"/>
