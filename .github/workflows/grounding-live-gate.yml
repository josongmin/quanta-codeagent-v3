            ${{ runner.temp }}/grounding/raw-adversarial-canary-baseline.txt
            ${{ runner.temp }}/grounding/raw-adversarial-canary-baseline.json
            ${{ runner.temp }}/grounding/engine-adversarial-canary-baseline.txt
            ${{ runner.temp }}/grounding/engine-adversarial-canary-baseline.json
            ${{ runner.temp }}/grounding/raw-adversarial-nightly-baseline.txt
            ${{ runner.temp }}/grounding/raw-adversarial-nightly-baseline.json
            ${{ runner.temp }}/grounding/engine-adversarial-nightly-baseline.txt
            ${{ runner.temp }}/grounding/engine-adversarial-nightly-baseline.json
            ${{ runner.temp }}/grounding/assisted-nightly-report.md
            ${{ runner.temp }}/grounding/assisted-nightly-report.json
            ${{ runner.temp }}/grounding/raw-replay-critical-report.md
            ${{ runner.temp }}/grounding/raw-replay-critical-report.json
