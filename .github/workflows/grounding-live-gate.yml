            ${{ runner.temp }}/grounding/engine-replay-critical-report.json
            ${{ runner.temp }}/grounding/raw-replay-nightly-report.md
            ${{ runner.temp }}/grounding/raw-replay-nightly-report.json
            ${{ runner.temp }}/grounding/engine-replay-nightly-report.md
            ${{ runner.temp }}/grounding/engine-replay-nightly-report.json
            ${{ runner.temp }}/grounding/raw-adversarial-canary-report.md
            ${{ runner.temp }}/grounding/raw-adversarial-canary-report.json
            ${{ runner.temp }}/grounding/engine-adversarial-canary-report.md
