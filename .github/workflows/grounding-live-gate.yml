            ${{ runner.temp }}/grounding/assisted-nightly-compare.md
            ${{ runner.temp }}/grounding/assisted-nightly-compare.json
            ${{ runner.temp }}/grounding/assisted-nightly-regress.md
            ${{ runner.temp }}/grounding/assisted-nightly-regress.json
            ${{ runner.temp }}/grounding/raw-replay-critical-compare.md
            ${{ runner.temp }}/grounding/raw-replay-critical-compare.json
            ${{ runner.temp }}/grounding/raw-replay-critical-regress.md
