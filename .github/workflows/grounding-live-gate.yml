# Context-grounding live gate.
#
# Canary is opt-in blocking: manual dispatch or PR label `grounding-gate`.
# Nightly is trend-oriented: cron only, same command surface, same artifacts.
# Read-only token posture; no PR comments, no writes, no pull_request_target.
name: grounding-live-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      baseline_raw_run_id:
        description: Optional prior raw-canary grounding run id for compare/regress
        required: false
        type: string
      baseline_engine_run_id:
        description: Optional prior engine-canary grounding run id for compare/regress
        required: false
        type: string

permissions:
  contents: read

jobs:
  canary:
    name: grounding canary
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && contains(github.event.pull_request.labels.*.name, 'grounding-gate'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QUANTA_PROVIDER: ${{ vars.QUANTA_PROVIDER }}
      QUANTA_MODEL: ${{ vars.QUANTA_MODEL }}
      QUANTA_OPENAI_SURFACE: responses
      GROUNDING_RAW_BASELINE_RUN_ID: ${{ github.event.inputs.baseline_raw_run_id || '' }}
      GROUNDING_ENGINE_BASELINE_RUN_ID: ${{ github.event.inputs.baseline_engine_run_id || '' }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install deps
        run: bun install --frozen-lockfile
      - name: assert live key present
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is required for grounding live gate"
            exit 1
          fi
      - name: preflight route + parser health
        run: |
          export QUANTA_PROVIDER="${QUANTA_PROVIDER:-openai}"
          export QUANTA_MODEL="${QUANTA_MODEL:-gpt-4.1}"
          mkdir -p "$RUNNER_TEMP/grounding"
          bun run eval grounding preflight --json-out "$RUNNER_TEMP/grounding/canary-preflight.json" | tee "$RUNNER_TEMP/grounding/canary-preflight.txt"
      - name: run raw canary suite
        run: |
          export QUANTA_PROVIDER="${QUANTA_PROVIDER:-openai}"
          export QUANTA_MODEL="${QUANTA_MODEL:-gpt-4.1}"
          mkdir -p "$RUNNER_TEMP/grounding"
          bun run eval grounding run --mode raw --suite canary --concurrency 4 --json-out "$RUNNER_TEMP/grounding/raw-canary-run.json" | tee "$RUNNER_TEMP/grounding/raw-canary-run.txt"
          run_id=$(node -e 'const fs=require("node:fs"); const path=process.argv[1]; const json=JSON.parse(fs.readFileSync(path,"utf8")); process.stdout.write(typeof json.runId === "string" ? json.runId : "")' "$RUNNER_TEMP/grounding/raw-canary-run.json")
          if [ -z "$run_id" ]; then
            echo "::error::failed to extract raw run id from grounding output"
            exit 1
          fi
          echo "RAW_RUN_ID=$run_id" >> "$GITHUB_ENV"
      - name: run engine canary suite
        run: |
          export QUANTA_PROVIDER="${QUANTA_PROVIDER:-openai}"
          export QUANTA_MODEL="${QUANTA_MODEL:-gpt-4.1}"
          mkdir -p "$RUNNER_TEMP/grounding"
          bun run eval grounding run --mode engine --suite canary --concurrency 4 --json-out "$RUNNER_TEMP/grounding/engine-canary-run.json" | tee "$RUNNER_TEMP/grounding/engine-canary-run.txt"
          run_id=$(node -e 'const fs=require("node:fs"); const path=process.argv[1]; const json=JSON.parse(fs.readFileSync(path,"utf8")); process.stdout.write(typeof json.runId === "string" ? json.runId : "")' "$RUNNER_TEMP/grounding/engine-canary-run.json")
          if [ -z "$run_id" ]; then
            echo "::error::failed to extract engine run id from grounding output"
            exit 1
          fi
          echo "ENGINE_RUN_ID=$run_id" >> "$GITHUB_ENV"
      - name: render canary reports + enforce route matrix
        run: |
          export QUANTA_PROVIDER="${QUANTA_PROVIDER:-openai}"
          export QUANTA_MODEL="${QUANTA_MODEL:-gpt-4.1}"
          bun run eval grounding report --run-id "$RAW_RUN_ID" --markdown-out "$RUNNER_TEMP/grounding/raw-canary-report.md" --json-out "$RUNNER_TEMP/grounding/raw-canary-report.json"
          bun run eval grounding report --run-id "$ENGINE_RUN_ID" --markdown-out "$RUNNER_TEMP/grounding/engine-canary-report.md" --json-out "$RUNNER_TEMP/grounding/engine-canary-report.json"
          bun run eval grounding gate --route-matrix primary-openai --run-ids "$RAW_RUN_ID,$ENGINE_RUN_ID" --profile canary --markdown-out "$RUNNER_TEMP/grounding/canary-matrix-gate.md" --json-out "$RUNNER_TEMP/grounding/canary-matrix-gate.json"
          cp "evals/runs/$RAW_RUN_ID.jsonl" "$RUNNER_TEMP/grounding/$RAW_RUN_ID.jsonl"
          cp "evals/runs/$ENGINE_RUN_ID.jsonl" "$RUNNER_TEMP/grounding/$ENGINE_RUN_ID.jsonl"
      - name: resolve raw baseline
        run: |
          mkdir -p "$RUNNER_TEMP/grounding"
          if [ -n "${GROUNDING_RAW_BASELINE_RUN_ID:-}" ]; then
            printf 'grounding baseline candidate=%s status=resolved baseline=%s reason=manual override\n' "$RAW_RUN_ID" "$GROUNDING_RAW_BASELINE_RUN_ID" | tee "$RUNNER_TEMP/grounding/raw-canary-baseline.txt"
            printf '{\n  "status": "resolved",\n  "candidateRunId": "%s",\n  "baselineRunId": "%s",\n  "reason": "manual override"\n}\n' "$RAW_RUN_ID" "$GROUNDING_RAW_BASELINE_RUN_ID" > "$RUNNER_TEMP/grounding/raw-canary-baseline.json"
          else
            bun run eval grounding baseline --candidate "$RAW_RUN_ID" --json-out "$RUNNER_TEMP/grounding/raw-canary-baseline.json" | tee "$RUNNER_TEMP/grounding/raw-canary-baseline.txt"
          fi
          baseline_run_id=$(node -e 'const fs=require("node:fs"); const path=process.argv[1]; const json=JSON.parse(fs.readFileSync(path,"utf8")); process.stdout.write(typeof json.baselineRunId === "string" ? json.baselineRunId : "")' "$RUNNER_TEMP/grounding/raw-canary-baseline.json")
          if [ -n "$baseline_run_id" ]; then
            echo "GROUNDING_RAW_BASELINE_RUN_ID=$baseline_run_id" >> "$GITHUB_ENV"
          fi
      - name: compare raw against baseline when resolved
        if: env.GROUNDING_RAW_BASELINE_RUN_ID != ''
        run: |
          export QUANTA_PROVIDER="${QUANTA_PROVIDER:-openai}"
          export QUANTA_MODEL="${QUANTA_MODEL:-gpt-4.1}"
          bun run eval grounding compare --baseline "$GROUNDING_RAW_BASELINE_RUN_ID" --candidate "$RAW_RUN_ID" --markdown-out "$RUNNER_TEMP/grounding/raw-canary-compare.md" --json-out "$RUNNER_TEMP/grounding/raw-canary-compare.json"
          bun run eval grounding regress --baseline "$GROUNDING_RAW_BASELINE_RUN_ID" --candidate "$RAW_RUN_ID" --profile strict --markdown-out "$RUNNER_TEMP/grounding/raw-canary-regress.md" --json-out "$RUNNER_TEMP/grounding/raw-canary-regress.json"
      - name: resolve engine baseline
        run: |
          mkdir -p "$RUNNER_TEMP/grounding"
          if [ -n "${GROUNDING_ENGINE_BASELINE_RUN_ID:-}" ]; then
            printf 'grounding baseline candidate=%s status=resolved baseline=%s reason=manual override\n' "$ENGINE_RUN_ID" "$GROUNDING_ENGINE_BASELINE_RUN_ID" | tee "$RUNNER_TEMP/grounding/engine-canary-baseline.txt"
            printf '{\n  "status": "resolved",\n  "candidateRunId": "%s",\n  "baselineRunId": "%s",\n  "reason": "manual override"\n}\n' "$ENGINE_RUN_ID" "$GROUNDING_ENGINE_BASELINE_RUN_ID" > "$RUNNER_TEMP/grounding/engine-canary-baseline.json"
          else
            bun run eval grounding baseline --candidate "$ENGINE_RUN_ID" --json-out "$RUNNER_TEMP/grounding/engine-canary-baseline.json" | tee "$RUNNER_TEMP/grounding/engine-canary-baseline.txt"
          fi
          baseline_run_id=$(node -e 'const fs=require("node:fs"); const path=process.argv[1]; const json=JSON.parse(fs.readFileSync(path,"utf8")); process.stdout.write(typeof json.baselineRunId === "string" ? json.baselineRunId : "")' "$RUNNER_TEMP/grounding/engine-canary-baseline.json")
          if [ -n "$baseline_run_id" ]; then
            echo "GROUNDING_ENGINE_BASELINE_RUN_ID=$baseline_run_id" >> "$GITHUB_ENV"
          fi
      - name: compare engine against baseline when resolved
        if: env.GROUNDING_ENGINE_BASELINE_RUN_ID != ''
        run: |
          export QUANTA_PROVIDER="${QUANTA_PROVIDER:-openai}"
          export QUANTA_MODEL="${QUANTA_MODEL:-gpt-4.1}"
          bun run eval grounding compare --baseline "$GROUNDING_ENGINE_BASELINE_RUN_ID" --candidate "$ENGINE_RUN_ID" --markdown-out "$RUNNER_TEMP/grounding/engine-canary-compare.md" --json-out "$RUNNER_TEMP/grounding/engine-canary-compare.json"
          bun run eval grounding regress --baseline "$GROUNDING_ENGINE_BASELINE_RUN_ID" --candidate "$ENGINE_RUN_ID" --profile strict --markdown-out "$RUNNER_TEMP/grounding/engine-canary-regress.md" --json-out "$RUNNER_TEMP/grounding/engine-canary-regress.json"
      - name: upload canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grounding-canary-${{ env.ENGINE_RUN_ID || github.run_id }}
          path: |
            ${{ runner.temp }}/grounding/raw-canary-run.txt
            ${{ runner.temp }}/grounding/engine-canary-run.txt
            ${{ runner.temp }}/grounding/canary-preflight.txt
            ${{ runner.temp }}/grounding/canary-preflight.json
            ${{ runner.temp }}/grounding/raw-canary-run.json
            ${{ runner.temp }}/grounding/engine-canary-run.json
            ${{ runner.temp }}/grounding/raw-canary-baseline.txt
            ${{ runner.temp }}/grounding/raw-canary-baseline.json
            ${{ runner.temp }}/grounding/engine-canary-baseline.txt
            ${{ runner.temp }}/grounding/engine-canary-baseline.json
            ${{ runner.temp }}/grounding/raw-canary-report.md
            ${{ runner.temp }}/grounding/raw-canary-report.json
            ${{ runner.temp }}/grounding/engine-canary-report.md
            ${{ runner.temp }}/grounding/engine-canary-report.json
            ${{ runner.temp }}/grounding/canary-matrix-gate.md
            ${{ runner.temp }}/grounding/canary-matrix-gate.json
            ${{ runner.temp }}/grounding/raw-canary-compare.md
            ${{ runner.temp }}/grounding/raw-canary-compare.json
            ${{ runner.temp }}/grounding/raw-canary-regress.md
            ${{ runner.temp }}/grounding/raw-canary-regress.json
            ${{ runner.temp }}/grounding/engine-canary-compare.md
            ${{ runner.temp }}/grounding/engine-canary-compare.json
            ${{ runner.temp }}/grounding/engine-canary-regress.md
            ${{ runner.temp }}/grounding/engine-canary-regress.json
            ${{ runner.temp }}/grounding/*.jsonl

  nightly:
    name: grounding nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QUANTA_PROVIDER: ${{ vars.QUANTA_PROVIDER }}
      QUANTA_MODEL: ${{ vars.QUANTA_MODEL }}
      QUANTA_OPENAI_SURFACE: responses
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install deps
        run: bun install --frozen-lockfile
      - name: assert live key present
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is required for grounding nightly"
            exit 1
          fi
      - name: preflight route + parser health
        run: |
          export QUANTA_PROVIDER="${QUANTA_PROVIDER:-openai}"
          export QUANTA_MODEL="${QUANTA_MODEL:-gpt-4.1}"
          mkdir -p "$RUNNER_TEMP/grounding"
          bun run eval grounding preflight --json-out "$RUNNER_TEMP/grounding/nightly-preflight.json" | tee "$RUNNER_TEMP/grounding/nightly-preflight.txt"
      - name: run nightly diagnostic matrix
        run: |
          export QUANTA_PROVIDER="${QUANTA_PROVIDER:-openai}"
          export QUANTA_MODEL="${QUANTA_MODEL:-gpt-4.1}"
          mkdir -p "$RUNNER_TEMP/grounding"
          : > "$RUNNER_TEMP/grounding/nightly-runs.tsv"
          run_lane() {
            local label="$1"
            local mode="$2"
            local selector_flag="$3"
            local selector_value="$4"
            local concurrency="$5"
            local json_path="$RUNNER_TEMP/grounding/${label}-run.json"
            local txt_path="$RUNNER_TEMP/grounding/${label}-run.txt"
            bun run eval grounding run --mode "$mode" "$selector_flag" "$selector_value" --concurrency "$concurrency" --json-out "$json_path" | tee "$txt_path"
            local run_id
            run_id=$(node -e 'const fs=require("node:fs"); const path=process.argv[1]; const json=JSON.parse(fs.readFileSync(path,"utf8")); process.stdout.write(typeof json.runId === "string" ? json.runId : "")' "$json_path")
            if [ -z "$run_id" ]; then
              echo "::error::failed to extract run id for ${label}"
              exit 1
            fi
            printf '%s\t%s\n' "$label" "$run_id" >> "$RUNNER_TEMP/grounding/nightly-runs.tsv"
            cp "evals/runs/$run_id.jsonl" "$RUNNER_TEMP/grounding/$run_id.jsonl"
            if [ "$label" = "assisted-nightly" ]; then
              echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
            fi
          }
          run_lane assisted-nightly assisted --suite nightly 4
          run_lane raw-replay-critical raw --corpus replay_critical 2
          run_lane engine-replay-critical engine --corpus replay_critical 2
          run_lane raw-replay-nightly raw --corpus replay_nightly 2
          run_lane engine-replay-nightly engine --corpus replay_nightly 2
          run_lane raw-adversarial-canary raw --corpus adversarial_canary 2
          run_lane engine-adversarial-canary engine --corpus adversarial_canary 2
          run_lane raw-adversarial-nightly raw --corpus adversarial_nightly 2
          run_lane engine-adversarial-nightly engine --corpus adversarial_nightly 2
      - name: render nightly reports
        run: |
          export QUANTA_PROVIDER="${QUANTA_PROVIDER:-openai}"
          export QUANTA_MODEL="${QUANTA_MODEL:-gpt-4.1}"
          while IFS=$'\t' read -r label run_id; do
            bun run eval grounding report --run-id "$run_id" --markdown-out "$RUNNER_TEMP/grounding/${label}-report.md" --json-out "$RUNNER_TEMP/grounding/${label}-report.json"
          done < "$RUNNER_TEMP/grounding/nightly-runs.tsv"
      - name: compare nightly lanes against resolved baselines
        run: |
          mkdir -p "$RUNNER_TEMP/grounding"
          export QUANTA_PROVIDER="${QUANTA_PROVIDER:-openai}"
          export QUANTA_MODEL="${QUANTA_MODEL:-gpt-4.1}"
          while IFS=$'\t' read -r label run_id; do
            bun run eval grounding baseline --candidate "$run_id" --json-out "$RUNNER_TEMP/grounding/${label}-baseline.json" | tee "$RUNNER_TEMP/grounding/${label}-baseline.txt"
            baseline_run_id=$(node -e 'const fs=require("node:fs"); const path=process.argv[1]; const json=JSON.parse(fs.readFileSync(path,"utf8")); process.stdout.write(typeof json.baselineRunId === "string" ? json.baselineRunId : "")' "$RUNNER_TEMP/grounding/${label}-baseline.json")
            if [ -n "$baseline_run_id" ]; then
              bun run eval grounding compare --baseline "$baseline_run_id" --candidate "$run_id" --markdown-out "$RUNNER_TEMP/grounding/${label}-compare.md" --json-out "$RUNNER_TEMP/grounding/${label}-compare.json"
              bun run eval grounding regress --baseline "$baseline_run_id" --candidate "$run_id" --profile strict --markdown-out "$RUNNER_TEMP/grounding/${label}-regress.md" --json-out "$RUNNER_TEMP/grounding/${label}-regress.json"
            fi
          done < "$RUNNER_TEMP/grounding/nightly-runs.tsv"
      - name: upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grounding-nightly-${{ env.RUN_ID || github.run_id }}
          path: |
            ${{ runner.temp }}/grounding/assisted-nightly-run.txt
            ${{ runner.temp }}/grounding/nightly-preflight.txt
            ${{ runner.temp }}/grounding/nightly-preflight.json
            ${{ runner.temp }}/grounding/assisted-nightly-run.json
            ${{ runner.temp }}/grounding/raw-replay-critical-run.json
            ${{ runner.temp }}/grounding/engine-replay-critical-run.json
            ${{ runner.temp }}/grounding/raw-replay-nightly-run.json
            ${{ runner.temp }}/grounding/engine-replay-nightly-run.json
            ${{ runner.temp }}/grounding/raw-adversarial-canary-run.json
            ${{ runner.temp }}/grounding/engine-adversarial-canary-run.json
            ${{ runner.temp }}/grounding/raw-adversarial-nightly-run.json
            ${{ runner.temp }}/grounding/engine-adversarial-nightly-run.json
            ${{ runner.temp }}/grounding/assisted-nightly-baseline.txt
            ${{ runner.temp }}/grounding/assisted-nightly-baseline.json
            ${{ runner.temp }}/grounding/raw-replay-critical-baseline.txt
            ${{ runner.temp }}/grounding/raw-replay-critical-baseline.json
            ${{ runner.temp }}/grounding/engine-replay-critical-baseline.txt
            ${{ runner.temp }}/grounding/engine-replay-critical-baseline.json
            ${{ runner.temp }}/grounding/raw-replay-nightly-baseline.txt
            ${{ runner.temp }}/grounding/raw-replay-nightly-baseline.json
            ${{ runner.temp }}/grounding/engine-replay-nightly-baseline.txt
