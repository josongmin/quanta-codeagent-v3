# feature-catalog PR-time gate.
#
# Complements the always-on fc steps in `ci.yml` (validate + diff + lint in the
# pyramid job, check-changed in the PR job). This workflow owns reachability,
# the Definition-of-Done ratchet, and the maturity-promotion-gate audit, scoped
# to paths that can change those signals.
#
#   reachability    — no L4+ feature is unreachable OR dead-API (real graph) FAIL
#   dod-ratchet     — new/touched feature meets the Definition of Done      FAIL
#                     (catalog + TDD + e2e hellgate). Baseline-aware: only
#                     NET-NEW holes block; grandfathered debt shrinks
#                     monotonically. See tools/pm/README.md.
#   gates           — maturity-promotion-gate audit                         WARN
#
# Why gates is warn-only: 2 doc-only violations (deliberate_hold) currently
# stand. We surface them in the GITHUB_STEP_SUMMARY so reviewers can see the
# count, but we don't block the merge on advisory drift.
name: feature-catalog gate

on:
  pull_request:
    paths:
      - "tools/feature-catalog/**"
      - "tools/pm/**"
      - "src/**"
      - "tests/**"
      - "docs/decisions/**"
  push:
    branches: [main]

# Same key shape as ci.yml: this workflow is a REQUIRED context on the same PRs,
# and it had no concurrency at all — a superseded commit's catalog run kept going
# while the new one started, so two full catalog loads raced for the same lane.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fc-gate:
    # Keep this historical context name: branch protection may require it
    # verbatim even though validate/check-changed are owned by ci.yml.
    name: fc-gate (validate + check-changed + dod-ratchet + gates audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: restore Bun package download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      - name: fc reachability (no L4+ feature unreachable or dead-API — real import graph)
        run: bun fc reachability --strict --symbols

      - name: fc gates (advisory — warn-only, surfaced in step summary)
        run: |
          {
            echo "### feature-catalog maturity-promotion gates"
            echo ""
            echo '```'
            bun fc gates || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Definition-of-Done ratchet (new/touched feature ⇒ catalog + TDD + e2e hellgate)
        # tools/pm — baseline-aware: a feature failing the DoD that is NOT
        # grandfathered in tools/pm/baseline.json fails the gate, and a
        # baselined feature that now passes must be removed (monotonic shrink).
        # Run `bun run pm <id>` locally for the per-axis breakdown.
        run: bun run pm:gate
