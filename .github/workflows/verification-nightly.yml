# Scheduled verification lane (TV-13). Not a merge gate.
#
# First real nightly run is opt-in via workflow_dispatch. cache=off so a
# receipt cannot bless a cold lane. Paid eval stays in ci.yml 06:00.
name: verification-nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# NOT cancel-in-progress: a nightly is a 180-minute cache-off campaign, and
# cancelling one that is 170 minutes in to start a fresh one throws away the only
# deterministic evidence of the day. Queueing is the right behaviour — GitHub
# keeps at most one pending run per group, so cron, a manual dispatch and a retry
# can no longer run three campaigns over each other.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    name: verification-nightly (cache-off)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: verify nightly
        run: bun run verify:nightly
