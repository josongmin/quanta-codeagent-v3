# Agent PR Review — auto-comment on PR open/synchronize
#
# Scope: read repo, comment on the PR. Cannot push commits (no contents:write).
# Untrusted-by-default: uses `pull_request` (not `pull_request_target`) so the
# fork's code is checked out under the fork's privileges, never the base repo's.
# `concurrency` cancels superseded runs when a PR force-pushes.
#
# Timeout is GH-side belt+braces over the ci-bot mode's BudgetCaps.
name: agent-pr-review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: agent review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: checkout (depth 2 for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install deps
        run: bun install --frozen-lockfile
      - name: agent review
        # ci-bot's only behavior today IS review (read PR + post a summary
        # comment). The review/auto-fix action split is future work; passing an
        # unrecognized flag would exit 64 (EX_USAGE), so only valid flags here.
        run: bun run agent:ci-bot --pr ${{ github.event.pull_request.number }}
