# Test-pyramid CI (ADR-0003, RFC §10), decomposed (TV-11/12).
#
#   static-code / catalog / full-suite / pty / web / toolchain
#     — former pyramid steps, now parallel jobs. The `pyramid` check NAME is
#     preserved as an aggregator so existing required-context rules keep matching.
#   required   — concurrent aggregator including contract
#   contract   — real Docker + language servers + python+lancedb; blocking on PR/main
#   eval       — real LLM; NON-BLOCKING, trend only
#
# Shadow matrix (full-plan/full-shard/full-aggregate) is off unless
# vars.QUANTA_SHADOW_MATRIX == '1'. Required still consumes full-suite.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # nightly eval (06:00 UTC)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  full-plan:
    name: full-plan (shadow)
    if: ${{ github.event_name != 'schedule' && vars.QUANTA_SHADOW_MATRIX == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: restore Bun package download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: restore measured test timings
        uses: actions/cache/restore@v4
        with:
          path: .git/quanta-verification-cache/test-timings-v2.json
          key: test-timings-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-plan
          restore-keys: |
            test-timings-${{ runner.os }}-${{ runner.arch }}-
      - id: plan
        name: freeze exact-HEAD matrix plan
        run: >-
          bun run tools/dev/verification-matrix-cli.ts plan
          --out=.cache/verification-matrix/plan.json
          --github-output="$GITHUB_OUTPUT"
      - name: upload exact plan
        uses: actions/upload-artifact@v4
        with:
          name: verification-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .cache/verification-matrix/plan.json
          if-no-files-found: error
          include-hidden-files: true

  full-shard:
    name: full-shard (shadow)
    if: ${{ vars.QUANTA_SHADOW_MATRIX == '1' }}
    needs: [full-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk: ${{ fromJSON(needs.full-plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: restore Bun package download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: download exact plan
        uses: actions/download-artifact@v4
        with:
          name: verification-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .cache/verification-matrix/plan
      - name: execute frozen chunk
        run: >-
          bun run tools/dev/verification-matrix-cli.ts worker
          --plan=.cache/verification-matrix/plan/plan.json
          --chunk=${{ matrix.chunk }}
          --out-dir=.cache/verification-matrix/worker
      - name: upload worker receipt and JUnit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-worker-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ matrix.chunk }}
          path: .cache/verification-matrix/worker/
          if-no-files-found: error
          include-hidden-files: true

  full-aggregate:
    name: full-aggregate (shadow)
    if: ${{ always() && github.event_name != 'schedule' && vars.QUANTA_SHADOW_MATRIX == '1' }}
    needs: [full-plan, full-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: restore Bun package download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: download exact plan
        uses: actions/download-artifact@v4
        with:
          name: verification-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .cache/verification-matrix/plan
      - name: download exact worker artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: verification-worker-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-*
          path: .cache/verification-matrix/receipts
          merge-multiple: true
      - name: aggregate exact membership and JUnit receipts
        run: >-
          bun run tools/dev/verification-matrix-cli.ts aggregate
          --plan=.cache/verification-matrix/plan/plan.json
          --receipts=.cache/verification-matrix/receipts
          --out=.cache/verification-matrix/aggregate.json
      - name: upload aggregate verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-aggregate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .cache/verification-matrix/aggregate.json
          if-no-files-found: error
          include-hidden-files: true

  static-code:
    name: static-code
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: restore Bun package download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: restore typecheck incremental cache
        # Cache ONLY .tsbuildinfo. The local skip stamps are content-hash
        # snapshots of the local tree and are not cached, so CI always re-runs
        # tsc; tsc incremental state still helps repeated PR/main runs re-check
        # less work. This job runs only `typecheck:all`, so caching the split
        # src/tests buildinfo files creates dead cache entries. The SHA suffix is
        # required because Actions caches are immutable: each run restores the
        # newest branch/cross-branch predecessor, then publishes an updated
        # buildinfo snapshot under its own key.
        uses: actions/cache@v4
        with:
          path: .cache/typescript/typecheck-all.tsbuildinfo
          key: ${{ runner.os }}-typecheck-${{ hashFiles('package.json', 'bun.lock', 'tsconfig.json', 'tsconfig.base.json', 'tsconfig.typecheck.src.json', 'tsconfig.typecheck.tests.json', 'tools/dev/typecheck.ts') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-typecheck-${{ hashFiles('package.json', 'bun.lock', 'tsconfig.json', 'tsconfig.base.json', 'tsconfig.typecheck.src.json', 'tsconfig.typecheck.tests.json', 'tools/dev/typecheck.ts') }}-${{ github.ref_name }}-
            ${{ runner.os }}-typecheck-${{ hashFiles('package.json', 'bun.lock', 'tsconfig.json', 'tsconfig.base.json', 'tsconfig.typecheck.src.json', 'tsconfig.typecheck.tests.json', 'tools/dev/typecheck.ts') }}-
      - name: typecheck
        run: bun run typecheck:all
      - name: lint + slice isolation (biome overrides enforce boundaries)
        # MUST stay `bun run lint` — the same entrypoint developers run. The
        # wrapper (tools/dev/run-biome.ts) is the SSOT for WHICH files are
        # linted; invoking biome directly here let CI and local drift apart
        # (CI linted the gitignored `.js` mirror artifacts the wrapper skips,
        # so `bun run lint` was green on files CI failed on, and vice versa).
        run: bun run lint
      - name: lint-debt ceiling (per-rule, one-directional, closed universe)
        # `biome check` exits 0 on WARN-level diagnostics, so every warn rule
        # (noNonNullAssertion, noExcessiveCognitiveComplexity, noConsole, …)
        # gates nothing on its own — ~1200 had piled up unnoticed. This step is
        # the gate: per-rule counts + the worst cognitive-complexity score are
        # pinned in tools/dev/lint-debt-ceiling.json and may only go DOWN, and a
        # rule that fires while ABSENT from that file fails as "unpinned" so a
        # biome upgrade / newly-enabled rule cannot add debt silently.
        run: bun run lint:debt

  catalog:
    name: catalog
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: restore Bun package download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: feature-catalog — validate + diff + ratchet
        # Hard-gates on:
        #   validate     — every evidence file/ADR/test exists
        #   diff         — docs/10.feature-catalog.md is in sync with YAMLs
        #   lint         — empty-stub count + orphan Accepted ADRs do not grow
        # PR-only check-changed runs below; the historical context job consumes
        # this producer's result without a second checkout/toolchain/install.
        run: bun fc ci
      - name: silent-catch baseline gate (R10 — read-only --check mode)
        # Read-only counterpart of `bun run baseline:silent-catch`. CI cannot
        # commit a tightened BASELINES table, so this step BLOCKS when:
        #   exit 4 — a tighten is available (operator must run the script
        #            locally + commit the diff)
        #   exit 5 — a silent-catch regression was detected (a bare `} catch {`
        #            crept back in past the pinned baseline; fix or ADR-justify)
        # Exit 0 covers both "ratchet steady" and "BASELINES table not yet
        # wired" so landing the script before the ratchet contract migrates
        # does not block unrelated PRs (idempotent no-op shape).
        run: bun run baseline:silent-catch --check
      - name: check-changed (added src files must be in fc evidence.code)
        if: github.event_name == 'pull_request'
        run: bun fc check-changed origin/${{ github.event.pull_request.base.ref }}

  full-suite:
    name: full-suite
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: restore Bun package download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: restore and publish measured test timings
        uses: actions/cache@v4
        with:
          path: .git/quanta-verification-cache/test-timings-v2.json
          key: test-timings-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-timings-${{ runner.os }}-${{ runner.arch }}-
      - name: full suite (guarded — exact PR tier)
        # ONE authoritative execution: unit + integration + meta/adversarial/
        # measurement + colocated src/tools tests through the chunked runner.
        # This replaced separate unit/integration steps (and folded in the
        # 321-file "rest" tier that no merge gate ran) so every receipt-consuming
        # step below derives its verdict from THIS run instead of re-executing.
        # Wrapping costs nothing: the guard snapshots `git status` either side of
        # the SAME run. aug-23: five fixtures written to the repo root by tests
        # using bare relative paths (`rel.txt`, `src/x.ts`, ...) broke typecheck,
        # lint, lint:debt and storage.test.ts at once, from files no commit
        # contains -- so neither review nor `git log` could ever have caught it.
        # `.cache/` is gitignored, so the junit outfile below is not a leak.
        env:
          QUANTA_VERIFICATION_TIER: pr
        run: >-
          bun run tools/dev/worktree-pollution-guard.ts -- bun run test:full:ci
      - name: cwd parity (a guard must give the same verdict from any directory)
        # Runs each arch/meta guard from the repo root AND from a throwaway working
        # directory, and fails only on the DIFFERENCE -- a single-arm run cannot
        # tell cwd dependence from load. Scoped to the guard population because
        # that is where the defect is lethal: a guard whose scan silently reads
        # nothing reports "no violations" and the gate goes green over an empty
        # scan. Five such guards were found this way on 2026-08-27, three of them
        # ratchets. ~30s for 17 files.
        run: bun run test:cwd-parity:arch

      - name: non-vacuity oracle (a guard must notice its corpus vanishing)
        # Runs each scan guard against a mirror with the corpus its assertions
        # consume emptied, and fails unless the guard goes RED. This is ground
        # truth: three static detectors were built before it and all three
        # under-reported while reporting green. A guard that imports the tree it
        # enumerates is reported UNSUPPORTED with the overlap count, never as a
        # pass. ~36s.
        run: bun run test:non-vacuity

      - name: scanning guards still reach their committed corpus
        # Every scanning guard's reach is a MEASURED number committed in
        # tools/dev/scan-reach-baseline.json, and a scan that reached less than
        # its floor fails here. Reach is the intersection of the scan with
        # `git ls-files`, because a walk accepts untracked files as proof it read
        # the corpus — measured: the walk-backed form of this floor passed with
        # every real source file deleted and a gitignored twin left standing.
        # An unpinned scan fails too: the closed universe is what stops a new
        # guard shipping with no reach at all.
        run: bun run scan-reach

      - name: preload runtime closure (no production slices in every test)
        # The bunfig preload loaded 1,259 files of src/ — 284 under src/tool —
        # before every test file, which made a mirror with src/tool emptied
        # impossible to start and blocked the oracle above. Inspects a real bun
        # child's module set, not the source text. ~1s.
        # child's module set, not the source text — and it already ran inside the
        # full suite above; this consumes that run's junit receipt instead of
        # executing the file a second time.
        run: bun run tools/dev/junit-file-green.ts .cache/full-junit.xml tests/meta/preload-runtime-closure-hellgate.test.ts

      - name: unit speed budget (slowest single test, one-directional)
        # The old gate asserted the WHOLE suite finished in <8000ms. That number
        # predates a ~36k-test suite and could not pass on any machine, so it only
        # ever said "no" and was ignored. Total time tracks test COUNT (which
        # growing coverage should increase); the invariant actually worth gating
        # is the one the old error message named -- "move slow cases to
        # integration" -- i.e. no SINGLE unit test may be slow. Pinned in
        # tools/dev/unit-speed-budget.json; may only go DOWN.
        run: bun run tools/dev/unit-speed-budget.ts .cache/full-junit.xml --scope=tests/unit/
      - name: pm DoD ratchet (receipt-derived — the test ran in the full suite)
        run: bun run tools/dev/junit-file-green.ts .cache/full-junit.xml tests/unit/pm-dod-ratchet.test.ts

  pty:
    name: pty
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: restore Bun package download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: interactive CLI e2e (PTY)
        # aug-23 audit — this suite was the ONLY coverage of the raw-mode
        # interactive input layer and ran in NO workflow, so it rotted unseen.
        # Ground truth for adding it: commit 8a0dadfd5 gated `/goal` behind
        # QUANTA_OBJECTIVE_TOOLS and left the shipped L3 command printing
        # "not wired" in the real CLI — the unit hellgates stayed 14/14 green
        # and only this suite caught it.
        #
        # The harness needs a real PTY (FFI openpty); every describe is
        # `skipIf(!PTY_AVAILABLE)`, so on a runner without one this degrades to
        # a visible skip rather than a false green.
        #
        # Guarded like the suites above: this one spawns REAL CLI processes, so
        # it is the likeliest place for a stray file to be written next to the
        # repo rather than into the harness's temp HOME.
        run: bun run tools/dev/worktree-pollution-guard.ts -- bun run e2e:pty

  web:
    name: web
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: restore web-frontend Bun package download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-web-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('apps/web-frontend/bun.lock') }}
      - name: web-frontend suite (vitest/jsdom — bun test cannot give it a verdict)
        # 744 tests across 79 files that ran in NO gate until this step existed.
        # `bun test` DOES load them — 732 tests, 18 failures — but supplies no DOM,
        # so every failure is environment-shaped and none is a verdict. `vitest run`
        # provides jsdom and finishes in 4.3s.
        #
        # The SPA has its own package.json and bun.lock and is NOT a root
        # workspace, so nothing here installs it. The script installs from the
        # lockfile when the binary is absent, which is what a fresh checkout is —
        # without that the gate fails as "no such file" and reads as broken rather
        # than as un-installed.
        run: bun run test:web-frontend

  toolchain:
    name: toolchain
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: restore Bun package download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: real-toolchain e2e (opt-in lane — visible skips without the toolchain)
        # The `*-real-e2e.test.ts` lane is gated on QUANTA_REAL_TOOLCHAIN_E2E so it
        # cannot blow the per-test unit speed budget on a developer machine that
        # happens to have clang/lldb-dap/cargo/debugpy installed. That gating
        # REMOVED coverage from this job until this step existed: an audit measured
        # 8 cases that ubuntu-latest actually runs (node, go, cargo, python3 and npm
        # are all preinstalled — only clangd, lldb-dap, dlv and debugpy are not), so
        # "the runner has none of these toolchains" was true of 24 arms and false of
        # 8. With the env set, the arms whose toolchain is absent degrade to VISIBLE
        # skips, which is the posture every other gate in this file already has.
        run: QUANTA_REAL_TOOLCHAIN_E2E=1 bun run test:real-toolchain

  pyramid:
    name: pyramid (unit + integration)
    needs: [static-code, catalog, full-suite, pty, web, toolchain]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: preserve the legacy context from producer verdicts
        run: >-
          test "${{ needs.static-code.result }}" = success &&
          test "${{ needs.catalog.result }}" = success &&
          test "${{ needs.full-suite.result }}" = success &&
          test "${{ needs.pty.result }}" = success &&
          test "${{ needs.web.result }}" = success &&
          test "${{ needs.toolchain.result }}" = success

  required:
    name: required
    needs: [static-code, catalog, full-suite, pty, web, toolchain, contract]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun run tools/dev/verification-required-results.ts
        env:
          QUANTA_REQUIRED_NEEDS: ${{ toJSON(needs) }}

  feature-catalog-pr:
    name: feature-catalog (PR — added src must be in fc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [catalog]
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      # Preserve the historical context without provisioning a second runner
      # checkout/toolchain/install for work now owned by the catalog producer.
      - run: test "${{ needs.catalog.result }}" = "success"

  contract:
    name: contract (docker + language servers + python+lancedb)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Blocking on PRs and main; skipped on the nightly schedule trigger.
    if: github.event_name != 'schedule'
    env:
      REQUIRE_CONTRACT: "1" # absent dependency = hard fail, never a silent skip
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: restore contract Bun package download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-contract-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}-pyright-1.1.414-tsls-6.0.0
      - run: bun install --frozen-lockfile
      - name: restore LanceDB wheel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-python-3.11-lancedb-0.25.3
      - name: provision LanceDB contract runtime
        run: python -m pip install "lancedb==0.25.3"
      - name: provision language servers
        run: bun add -g pyright@1.1.414 typescript@5.9.3 typescript-language-server@6.0.0
      - name: docker sanity (ubuntu runners ship the daemon)
        run: docker version
      - name: contract suite
        run: bun test tests/contract

  eval:
    name: eval (real LLM — non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Nightly, or on a PR labelled "eval". Never blocks a merge.
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'eval')
    continue-on-error: true
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QUANTA_PROVIDER: openai
      QUANTA_MODEL: gpt-4o
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: restore Bun package download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: write synthetic SWE-bench corpus
        run: |
          mkdir -p .eval-corpus
          bun -e 'import { writeSyntheticCorpus } from "./src/apps/bench/swebench"; await writeSyntheticCorpus(".eval-corpus")'
      - name: run eval (bench exits 0 even with no key — keeps job green)
        run: bun run src/apps/bench/index.ts --corpus .eval-corpus --n 1 | tee eval-report.txt
      - name: publish eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.txt
