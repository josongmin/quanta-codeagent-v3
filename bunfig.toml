[install]
exact = true
production = false

[install.cache]
disable = false

[test]
preload = ["./tests/setup.ts"]
coverage = false
# Hellgate-enforced: only TypeScript test sources. Any .test.js found under tests/
# is a stale emit artifact (likely from an old build step / worktree pollution).
# tests/meta/no-test-js-artifacts-hellgate.test.ts asserts this at CI time, and
# `bun run test:clean-js` (auto-run before every test script) purges them.

[run]
hot = true
